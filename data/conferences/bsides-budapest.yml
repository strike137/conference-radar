notes:
- Community-run Security BSides event in Budapest, Hungary, held every year since 2017; 2026 was the 10th edition
- One-day event at the Lurdy Conference and Event Center with two talk rooms, a workshop room, a HACK Center with CTFs and a Hackademy programme
- Speakers from more than 10 countries each year; capacity is limited and the event usually sells out
- No proceedings
