notes:
- Annual conference sponsored by the IEEE Industrial Electronics Society; 2026 was the 31st edition
- Industrial automation scope with 11 technical tracks (IT in automation, industrial communication, real-time systems,
  manufacturing, industrial control, vision and HMI, robots, IIoT sensing, systems engineering, AI for CPS, vehicular embedded systems)
- Regular papers 6 to 8 pages (max 8), work-in-progress papers up to 4 pages; special sessions and co-located workshops have their own calls
- Accepted and presented papers, including WiP papers, go to IEEE Xplore
- Usually held in Europe (Porto 2025, Vasteras 2026, Pisa 2027); deadlines are usually extended by about 10 days
- CORE C in ICORE2026; not in the CCF 2026 list
