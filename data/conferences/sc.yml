notes:
- Formerly the Supercomputing Conference; the main HPC conference, sponsored by ACM SIGHPC and IEEE CS TCHPC
- Held every November in a US convention center (St. Louis 2025, Chicago 2026) with a large industry exhibition
- Double-anonymous review; papers up to 10 pages plus a mandatory Artifact Description appendix; no deadline extensions
- Papers archived in the ACM Digital Library and IEEE Xplore; at least one author must register and present in person
- All deadlines are 11:59 PM AoE; also has workshops, posters, tutorials and a Doctoral Showcase
- ICORE2026 rank A; CCF A
