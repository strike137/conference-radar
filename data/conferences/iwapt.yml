links:
  website: https://iwapt.org/
notes:
- Workshop on autotuning for high-performance computing held since 2006, started in Tokyo and co-located with IEEE
  IPDPS in recent years (21st edition in 2026)
- Steering committee mostly from Japanese universities and RIKEN, plus LBNL, ORNL, ETH Zurich, Georgia Tech and
  National Taiwan University
- Accepted papers go into the IPDPS workshop proceedings (IPDPSW) in IEEE Xplore
- Up to 10 pages IEEE conference style including references; single-blind review; submission through the IPDPS
  Linklings site
- 'Topics: autotuning with AI and LLMs, performance modelling, adaptive numerical libraries, compilers, runtime
  systems, energy-aware computing, quantum and neuromorphic architectures'
- Half-day workshop; registration through IPDPS
- The 2026 submission deadline was extended twice
