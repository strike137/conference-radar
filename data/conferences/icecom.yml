notes:
- Long-running Croatian conference on electromagnetics and communications, held in Dubrovnik every time
- Held roughly every three years (2013, 2016, 2019, 2023, 2026); the 2026 edition was the 25th
- Organized by the IEEE Croatia Section and chapters with KoREMA and the University of Zagreb FER
- Topics span antennas, propagation, microwaves, metasurfaces, radar, wireless, optical and 5G/6G communications
- 3 to 6 page A4 papers via CMT; accepted and presented papers go to IEEE Xplore
- Rolling review with notification about 10 working days after submission; post-deadline submissions accepted
- Not listed in ICORE2026 or the CCF 2026 list
