notes:
- Biennial (even years) conference continuing the THETA/AQTR series held in Romania since 1981; 2026 was THETA 25
- Organized by the IEEE Computer Society Test Technology Technical Community and TU Cluj-Napoca
- Held in Romania; 2026 edition in Baile Felix near Oradea
- Accepted papers are submitted to IEEE Xplore; all editions since 2006 are indexed in IEEE Xplore and Clarivate Web of Science
- Student Forum papers are published in a separate AQTR volume, not in IEEE Xplore
- Each paper needs one full registration (IEEE member, non-member or student rates), at most one paper per registered author
- Not listed in ICORE2026
