notes:
- Annual since 2020; named International Conference on Signal Processing and Computer Science until 2025, renamed with Pattern Recognition added from 2026
- Held in China in late August (Guilin 2023, Kaifeng 2024, Xi'an 2025, Chengdu 2026 and 2027)
- Run by a commercial conference service (AEIC/AiScholar, submission via ais.cn); a different Chinese host university each year
- 2023 to 2025 proceedings published by SPIE (SPIE Digital Library); 2026 proceedings published by IEEE and submitted to IEEE Xplore, EI Compendex and Scopus
- Papers reviewed by two or three committee members; abstract-only presenter option without publication
- Not listed in CORE ICORE2026 or the CCF list
