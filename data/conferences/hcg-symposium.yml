notes:
- Annual symposium of the IEICE Human Communication Group (HCI, human communication, accessibility, affective
  computing); the site lists editions back to 2005
- Co-sponsored by several Japanese societies including IPSJ, SICE, ITE, VRSJ, HIS and ASJ
- On-site only; every oral presenter must also give an interactive (poster) presentation, and interactive-only
  presentations are accepted
- Oral papers 4 to 8 pages, interactive-only papers 2 to 8 pages, submitted through the IEICE submission system
- 'Non-archival: the proceedings are published on the web for participants only (password protected), and authors
  keep the copyright'
- Held at the Kitakyushu International Conference Center in both 2025 and 2026, in mid December
