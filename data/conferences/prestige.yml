notes:
- Half-day workshop co-located with ICPR 2026 (Lyon), first edition
- Merges two IAPR TC19 series, FAPER (Fine Art Pattern Extraction and Recognition) and PatReCH (Pattern Recognition
  for Cultural Heritage), both earlier held with ICPR and ICIAP
- Topics include computer vision and generative AI for art, historical manuscripts, 3D reconstruction of artifacts
  and cultural heritage AR/VR
- Papers in the ICPR 2026 workshop proceedings, Springer LNCS; up to 15 pages, only full papers (more than 6 pages)
  go into the proceedings
- Double-blind review with at least 2 reviewers, submitted via EasyChair
- Organizers based in Italy (Catania, Bari, Cassino)
- Not listed in ICORE2026
