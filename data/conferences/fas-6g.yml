notes:
- Workshop co-located with IEEE GLOBECOM; 4th edition in Taipei (2025), 8th edition in Macau (2026)
- Covers fluid and reconfigurable antenna systems for 6G and their links to holographic MIMO, RIS and ISAC
- Co-chairs include Kai-Kit Wong, Shi Jin, Wee Kiat New, Ross Murch and Chan-Byoung Chae
- Accepted and presented papers go into the IEEE GLOBECOM workshop proceedings in IEEE Xplore; in-person
  presentation required (no-show papers removed)
- Submissions via EDAS through the GLOBECOM workshop call
- Not listed in ICORE2026
