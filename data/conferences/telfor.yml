archival: true
fee: 310 EUR regular, 240 EUR IEEE member, 180 EUR PhD student (2026, in advance; 360 / 280 / 210 EUR at the conference)
typical:
  deadline_months: [9, 10]
  conference_months: [11]
links:
  website: https://www.telfor.rs/en/
notes:
- Annual telecommunications and IT forum in Belgrade, Serbia; 2026 is the 34th edition (Crowne Plaza and Palace of Science)
- Co-organized by IEEE Region 8, the IEEE Serbia & Montenegro Section and its ComSoc and CIS chapters
- Papers presented at the forum are submitted to IEEE Xplore (no-shows excluded); attendees also get CD proceedings
- Regular and student papers up to 4 A4 pages in the IEEE template; invited papers up to 8 pages
- Online (distance) presentation possible for a 100 EUR extra fee
- Papers in the CD proceedings are in English or Serbian
- Extended versions of top papers can go to the open-access Telfor Journal
- 'CORE: not listed in ICORE2026'
