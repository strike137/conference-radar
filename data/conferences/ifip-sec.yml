notes:
- Flagship conference of IFIP TC11, running since 1983 (41st edition in 2026)
- Submissions are not anonymized; at most 14 pages in LNCS format including references; in-person presentation required
- Proceedings in Springer IFIP AICT; selected papers invited to Computers and Security
- Mostly held in Europe; 2026 edition was in Perth, Australia, and 2027 is planned for Linköping, Sweden
- Acceptance rate around 24 to 26% (28/109 in 2025, 39/164 in 2026)
