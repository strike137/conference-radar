notes:
- Leading European venue for the theory of distributed computing, the European counterpart of PODC
- Organized in cooperation with EATCS; founded in 1985 as WDAG, renamed DISC in 1998; 40th edition in 2026
- Proceedings in LIPIcs (open access)
- Regular papers (15 pages guaranteed reading) and brief announcements (5 pages); relaxed double-blind review with a
  rebuttal phase
- Selected papers go to a special issue of Distributed Computing; hosts the Dijkstra Prize
- CORE A (ICORE2026)
- Almost always held in Europe (Augusta, USA in 2022 was the exception); workshops on the days around the main conference
