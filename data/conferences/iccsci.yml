notes:
- Run by the School of Computer Science of BINUS University; rotates among BINUS campuses in Indonesia (Semarang 2025, Medan 2026, Bandung 2027)
- Papers published open access in Elsevier Procedia Computer Science and indexed in Scopus
- First held in 2015 and yearly since 2017 (11th edition in 2026); hybrid format, presentation required for publication
- Double-blind review via Microsoft CMT with a desk check for similarity (over 20% rejected) and AI-generated text
- Broad computer science scope (AI and ML, vision, data science, HCI and educational technology, software engineering, networking, security and IoT)
- Not listed in ICORE2026 and not in the CCF list; a small regional venue
