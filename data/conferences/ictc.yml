organizer_country: [korea]
proceedings: IEEE Xplore
indexing: [IEEE Xplore, DBLP]
rank:
  core: Unranked
fee: Regular author 650 USD (member) or 720 USD (non-member), early (2026); student rate not valid for authors
typical:
  deadline_months: [8]
  conference_months: [10]
links:
  website: https://ictc.org/
notes:
- Organized by KICS (Korean Institute of Communications and Information Sciences), with technical co-sponsorship
  of IEEE ComSoc and IEICE Communications Society; branded 'KICS ICTC' since 2026
- 'Held on Jeju Island in October nearly every year (exceptions: 2010 Jeju in November, 2011 Seoul in September,
  2014 Busan)'
- Proceedings in IEEE Xplore; 2 to 4 page papers via EDAS; a paper appears only if an author registers at the regular
  rate and presents it
- 'Very large: 734 papers in the 2025 program; travel grant program (300 to 500 USD) for overseas student and young
  researcher presenters'
- 'Lab view: international conference mostly in name, acceptance rate believed to be 60% or higher (no official
  figure)'
