- Held at the Mesa Convention Center, Mesa, AZ (CactusCon 14 in February 2026, CactusCon 15 in February 2027)
- Talks of 20 or 50 minutes plus Q&A, 2 to 4 hour hands-on workshops and villages; CFP run on Sessionize
- Over 2000 attendees at the last event; talks are posted on YouTube, no formal proceedings
- Not listed in the CORE ICORE2026 portal
