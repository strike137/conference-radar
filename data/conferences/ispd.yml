notes:
- Sponsored by ACM SIGDA with technical co-sponsorship from IEEE CEDA; papers in the ACM Digital Library since 1997
- Small, focused forum on physical design of ICs (floorplanning, placement, routing, clock and power networks, DFM,
  3D ICs, ML for physical design)
- Blind review; up to 8 pages plus 1 page of references in the ACM template; abstract one week before the full paper
- Runs a well-known annual physical design contest; each year also has a commemorative session for a senior researcher
- A speaker per paper must register and present live; slides and talk videos are posted on the ISPD site and YouTube
- Recent editions in Taipei (2024), Austin (2025) and Bonn (2026), Taipei again in 2027
- ACM is fully open access from 2026, so authors outside ACM Open institutions may pay an APC
- Not listed in ICORE2026; CCF C
