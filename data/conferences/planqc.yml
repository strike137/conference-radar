notes:
- One-day workshop bringing together programming languages and quantum information researchers
- Held with POPL in 2020, 2024, 2025, 2026 and 2027, with PLDI in 2021 and with ICFP in 2022; 2027 is the 7th edition
- Submissions are 2 to 5 page abstracts (single-column acmsmall, references excluded); work in progress welcome
- Accepted authors give talks or posters; no formal proceedings, abstracts and links to full papers are posted on the website
- Not listed in CORE ICORE2026; not in the CCF 2026 list
