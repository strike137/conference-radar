  website: https://popl27.sigplan.org/home/planqc-2027
notes:
- Brings together programming languages and quantum information researchers; topics include quantum programming languages, verification, circuit optimization and compilation
- Co-located with POPL in 2020, 2024, 2025, 2026 and 2027, with PLDI in 2021 and ICFP in 2022; no 2023 edition
- Submissions are 2 to 5 page extended abstracts (single-column acmsmall, references excluded); accepted authors give talks or posters
- No formal proceedings; abstracts and links to full papers are posted on the workshop website, so work can be published elsewhere
- Not listed in ICORE2026 or the CCF 2026 list
