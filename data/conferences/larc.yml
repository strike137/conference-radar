notes:
- One-day ICSE workshop on low-code and no-code development and its relation to software architecture
- 1st edition at ICSA 2025 (Odense, Denmark, IEEE Xplore companion proceedings), 2nd at ICSE 2026 (Rio de Janeiro)
- 2026 organizers from University of Southern Denmark, University of Limerick / Lero (Ireland) and Eindhoven University of Technology
- Full papers up to 8 pages, short papers up to 4 pages, extended abstracts up to 2 pages; ACM Primary Article Template (sigconf), double-blind review, at least one author must attend in person
- Proceedings published by ACM in the ICSE 2026 Companion Proceedings; extended abstracts are APC free, other papers need an ACM Open agreement or APC (250 USD members, 350 USD non-members)
- Not on the ICSE 2027 workshop list, so the next edition is not announced yet
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
