notes:
- Workshop co-located with the <Programming> conference every year since 2017 (PX/16 was at ECOOP 2016, PX/17.2 at SPLASH 2017)
- Focus on the experience of programming (what makes it fun or annoying) rather than productivity
- Accepts academic papers, essays and demos; no page limit, ACM sigconf format, submission via EasyChair
- Papers and essays marked for publication are peer reviewed and appear in the ACM DL as part of the <Programming> Conference Companion
- Run in a Writers' Workshop format with structured feedback; hybrid, online participation possible
- Mostly held in Europe (Munich 2026, Prague 2025, Lund 2024), Tokyo 2023 and Kyoto 2027
- Organizers are Luke Church, Robert Hirschfeld, Hidehiko Masuhara and Marcel Taeumel
- Not listed in ICORE2026 or the CCF 2026 list
