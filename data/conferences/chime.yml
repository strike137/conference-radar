id: chime
name: CHiME
full_name: CHiME Workshop on Speech Processing in Everyday Environments
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: irregular
organizer: CHiME steering group (CHiME challenge organisers; Univ. of Sheffield, Inria, CMU, NTT, JHU and others)
organizer_country: [international]
proceedings: ISCA Archive
archival: true
links:
  website: https://www.chimechallenge.org/
notes:
- One-day workshop that accompanies the CHiME speech separation and recognition challenges (CHiME = Computational Hearing in Multisource Environments), running since 2011
- Satellite of Interspeech or ICASSP; CHiME 2024 was an Interspeech satellite on Kos, Greece; CHiME 2026 was held jointly with HSCMA as an ICASSP 2026 satellite in Barcelona
- Accepts both challenge system papers and regular papers on robust speech processing (enhancement, separation, ASR, diarization)
- Proceedings in the ISCA Archive with DOIs (10.21437/CHiME.2024); in 2026 HSCMA archival track papers went to IEEE Xplore and CHiME challenge papers to the ISCA Archive, plus a non-archival track
- 2024 used single-blind review with 4 pages of content plus 1 page of references
- Recent editions (last six) in San Francisco 2016, Hyderabad 2018, online 2020, Dublin 2023, Kos 2024, Barcelona 2026
- The CHiME-10 workshop is planned for December 2027 as a satellite or co-located event of ASLI 2027 (TBC)
- Not listed in CORE ICORE2026 and not on the CCF list
