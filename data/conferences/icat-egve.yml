notes:
- Joint event of ICAT (oldest international VR and telexistence conference, since 1991, run from Japan via VRSJ) and
  the Eurographics Symposium on Virtual Environments; merged as ICAT-EGVE since 2014
- CORE C (ICORE2026, listed as EGVE); not on the CCF list
- Accepted papers, posters and demos go to the Eurographics Digital Library as gold open access; best papers are
  invited to a Computers & Graphics special section
- Double-blind review; full papers up to 8 pages and short papers up to 4 pages, Eurographics format
- "Recent hosts: Yokohama 2022, Dublin 2023, Tsukuba 2024, Karlskrona 2025, Goiania (Brazil) 2026, co-located with
  SVR, SIBGRAPI and SBGames"
- Deadlines are often extended (about two and a half weeks in 2025, one month in 2026)
