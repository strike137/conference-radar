notes:
- Symposium on reconfigurable computing (FPGAs, CGRAs, EDA tools, accelerators) with an emphasis on practical applications; 22nd edition in 2026
- Proceedings in Springer LNCS; ARC 2027 selected papers are also invited to a special issue of ACM TRETS
- Long papers up to 15 pages and short papers up to 10 pages in LNCS format (2026; the 2027 CFP sets 14 and 8 pages); fully anonymous submission via EasyChair
- "ARC 2026: 19 full papers and 1 short paper selected from 33 submissions"
- Held in Europe (Cottbus 2023, Aveiro 2024, Seville 2025, Cagliari 2026); 2021 and 2022 were virtual
- Not found on the CORE portal (ICORE2026); not in the CCF list mirror
