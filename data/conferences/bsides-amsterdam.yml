notes:
- Independent Security BSides event in Amsterdam, first held in 2017 and 2018 and revived in 2025, inspired by BSides Groningen
- One-day conference with talks, a Capture the Flag and a pre-party the evening before
- 2025 edition at PONG House of Ping with 27 speakers; 2026 edition at KIT Amsterdam with 33 speakers and about 450 attendees expected
- Open CFP with anonymous speaker selection; 2026 CFP was open 11 May to 11 August, speakers invited on 8 September
- Paid tickets; no proceedings, talks posted on YouTube
- Not listed in CORE ICORE2026
