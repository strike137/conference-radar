links:
  website: https://complenet.weeblysite.com/
notes:
- Network science conference held since 2009 (17th edition in 2026); single plenary track, no parallel sessions
- Accepts full papers (up to 12 pages, short papers up to 8, Springer format) and 1 to 2 page extended abstracts
- Accepted papers go to the proceedings in Springer's Complexity series (Springer Proceedings in Complexity)
- Each paper needs its own paid registration; student attendee rate (200 EUR) is for non-authors only
- Host city changes every year (Aveiro 2023, Exeter 2024, Fortaleza 2025, Zaragoza 2026; online 2020 to 2022)
- Not the same venue as Complex Networks (CNA, International Conference on Complex Networks and their Applications)
- Not listed in ICORE2026
