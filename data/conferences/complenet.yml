links:
  website: https://complenet.weeblysite.com/
notes:
- Interdisciplinary network science conference running since 2009; single plenary track with no parallel sessions
- Accepts long papers (12 pages), short papers (8 pages) in Springer format and 2-page extended abstracts
- Accepted papers appear in Springer's Complexity series; extended abstracts are presented but not published
- Each paper needs its own registration
- "Recent hosts: Aveiro 2023, Exeter 2024, Fortaleza 2025, Zaragoza 2026; online 2020 to 2022"
- Not found in the ICORE2026 or CCF 2026 lists
