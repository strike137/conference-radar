notes:
- Main venue for software architecture research and practice; successor of WICSA; IEEE TCSE is the lead sponsor
- CORE A (ICORE2026)
- Research papers track (double-anonymous review) and Software Architecture in Practice track
- 10 pages of main text plus 2 pages of references; main proceedings in IEEE Xplore, short papers and posters in
  companion proceedings
- Usually held in spring; recent hosts L'Aquila 2023, Hyderabad 2024, Odense 2025, Amsterdam 2026 (June) and Sydney 2027
