notes:
- Held since 1997 (no edition in 2008 and 2020); talk-based conference on discrete and computational geometry, graph theory and the complexity of puzzles and games
- Submissions are presentation abstracts; revised selected papers go to Springer LNCS afterwards (LNCS 13034 for 2018, LNCS 14364 for 2022)
- Some editions publish selected papers only in a journal special issue (IPSJ Journal of Information Processing for 2016, 2019 and 2024)
- Usually at Tokyo University of Science (Kagurazaka); alternate years are joint editions abroad (Thailand 2021, Indonesia 2023, China 2025)
- "Registration fee 2026: 50,000 JPY regular, 45,000 JPY student (late, with banquet)"
- On-site only in 2026 (no online participation)
- The series page says the next conference is JCDCG^3 2028
