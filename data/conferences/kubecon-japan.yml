notes:
- CNCF flagship practitioner conference on Kubernetes and cloud native computing, Japan edition run by The Linux Foundation
- First held in Tokyo in June 2025; 2026 and 2027 editions in Yokohama
- Two main conference days of keynotes and breakouts, with CNCF-hosted co-located events (ArgoCon, KeycloakCon in 2026) the day before
- Talk proposals through Sessionize, reviewed by a program committee; no papers, only talk recordings posted afterwards
- The Emerging + Advanced track explicitly welcomes cloud native research and academic papers presented as talks
- Proposals must describe open source platforms or tools; no vendor sales pitches
