notes:
- EAI conference on modeling, simulation and emulation tools and methods, including network simulation
- Proceedings in Springer LNICST; selected papers invited to extended versions in MONET and other journals
- Main track and late track with separate deadlines
- Recent editions in Chengdu 2019, online 2020 and 2021, Seville 2023 and Bratislava 2024; no edition in 2022
- Not listed in the CORE portal (ICORE2026) and not on the CCF list
