notes:
- EURAMAS designated event, aiming to be the main European forum for agents and multi-agent systems research
- Proceedings in Springer LNCS (2025 as two volumes; 2026 as LNCS volume 16829)
- Single-blind review via OpenReview; main track 15 pages plus references, demos 5 pages
- Welcomes improved versions of papers rejected from AAMAS, AAAI and IJCAI-ECAI
- Held in Europe every year (2023 Naples, 2024 Dublin, 2025 Bucharest, 2026 Malmo, 2027 Toulouse); 2026 included the EASSS summer
  school before the main conference
- Best paper invited for fast-track extension in the JAAMAS journal
- Sponsored by IFAAMAS in 2026
