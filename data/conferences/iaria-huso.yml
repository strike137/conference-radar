notes:
- Organized by IARIA as part of the InfoWare congress, co-located with ICCGI, ICWMC, VEHICULAR, INTERNET, COLLA, INTELLI and VISUAL (13th edition in 2027)
- Covers analytics of human and social behavior data (social media, social networks, behavioral and sentiment data)
- Published open access in the IARIA ThinkMind library (ISSN 2519-8351); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in southern Europe (Venice, Barcelona, Athens, Lisbon, Valencia in recent years); onsite and online participation options
- Moves from March to May in 2027
