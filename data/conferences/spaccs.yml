notes:
- Co-located with IEEE ISPA, BDCloud, SocialCom and SustainCom as a federated congress (IEEE AI for Science Congress);
  19th edition in 2026
- Proceedings by IEEE CPS (IEEE Xplore, EI) in recent years; 2016 to 2020 editions were in Springer LNCS
- Single-blind review via EDAS (2024); deadlines are usually extended by several weeks
- Mostly held in China (Kaifeng 2024, Shenyang 2025); 2026 edition in Kuala Lumpur, Malaysia
- Not ranked by CORE or CCF
