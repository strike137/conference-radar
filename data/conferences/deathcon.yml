notes:
- Practitioner conference on detection engineering and threat hunting founded in 2022; no vendors or corporate sponsors
- 100% hands-on format with pre-recorded workshops, a shared hacking lab and a CTF instead of talks
- Globally distributed; participants join online or at one of about 16 volunteer-run local sites (Seattle, Montreal, Edinburgh, Prague, Melbourne, Kuala Lumpur, ...)
- The CFP is a call for workshops; workshop leaders attend free and some travel costs can be covered
- About 170 USD online with pay-what-you-can option; 350 to 425 USD on site (2026)
- No proceedings; some workshop materials and videos are released publicly by their authors
