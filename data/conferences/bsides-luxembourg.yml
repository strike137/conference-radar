notes:
- Community-driven, non-profit Security BSides conference in Luxembourg
- Held at the Digital Learning Hub (Terres Rouges building) in Belval, Esch-sur-Alzette, in 2025 and 2026
- Three days in 2026 -> one day of trainings, workshops and villages, then two days of talks and villages
- Talks of 30 minutes plus questions, 5 minute lightning talks, 2 or 4 hour workshops and full-day trainings; CTF on site
- Speakers get free entry, accommodation for those from outside Luxembourg and up to 300 EUR travel reimbursement
- Talks are video recorded; slides and videos go to the archives site, no proceedings
