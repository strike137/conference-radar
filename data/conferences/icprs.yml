id: icprs
name: ICPRS
full_name: IEEE International Conference on Pattern Recognition Systems
type: conference
tier: minor
areas: [ai, vision]
region: worldwide
language: english
frequency: annual
organizer: Chilean Association for Pattern Recognition (ACHiRP) with a local host university; IAPR endorsed, IEEE sponsored
organizer_country: [other]
proceedings: IEEE Xplore
archival: true
fee: "EUR 450 early author fee for non-members, EUR 400 for IEEE/IAPR members (2027)"
typical:
  deadline_months: [3, 8, 10]
  conference_months: [3, 7, 12]
links:
  website: https://www.icprs.org
notes:
- Continuation of the Chilean Conference on Pattern Recognition (CCPR); run with ACHiRP, a member society of the IAPR
- Papers of the required standard that are presented are expected to be published in IEEE Xplore; regular papers up to 6 pages plus 1 page of references, short papers 4 pages
- Double-blind review via ConfTool; dataset papers and a student paper category with prizes
- Location alternates between Latin America and Europe (Ecuador 2023, London 2024, Vina del Mar 2025, Bordeaux 2027)
- Each paper needs one author full fee registration; one full registration covers up to three papers
- First day is dedicated to workshops, free for registered attendees
