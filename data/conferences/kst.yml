links:
  website: https://kst.buu.ac.th/
notes:
- Organized by IEEE Thailand Section (Computer Chapter) and Burapha University's Faculty of Informatics; IEEE technical
  co-sponsorship, proceedings in IEEE Xplore
- Held between January and March, usually in a different Thai city each year (Phuket 2023, Krabi 2024, Bangkok 2025,
  Pattaya 2026); the 19th edition (2027) is at Tokyo Metropolitan University, Japan
- Two or three paper submission periods (three for 2026 and 2027) plus an extended-abstract poster track
- In-person presentation required for IEEE Xplore; selected papers can be extended for ECTI-CIT (Scopus)
