notes:
- Held since 2000 (first edition as a workshop co-located with ITI in Pula, Croatia); every two years since 2003
- Usually held in Croatia or nearby European cities (2015 Zagreb, 2017 Ljubljana, 2019 Dubrovnik, 2021 online/Zagreb,
  2023 Rome, 2025 Coimbra)
- All editions have proceedings in IEEE Xplore
- IEEE Signal Processing Society liaisons from the IVMSP Technical Committee sit on the committee
- Best Student Paper award
- Not listed in CORE ICORE2026 or the CCF 2026 list
