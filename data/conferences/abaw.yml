id: abaw
name: ABAW
full_name: Workshop and Competition on Affective & Behavior Analysis in-the-wild
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: multiple-per-year
organizer: Organizing team led by Queen Mary University of London (Dimitrios Kollias) with Imperial College London and ETS Montreal;
  co-located with CVPR and with ICCV or ECCV
organizer_country: [europe, canada]
proceedings: IEEE Xplore and CVF Open Access (CVPR/ICCV Workshops); ECCV Workshops proceedings for ECCV editions
archival: true
typical:
  deadline_months: [3, 7]
  conference_months: [6, 9, 10]
links:
  website: https://affective-behavior-analysis-in-the-wild.github.io/11th/
notes:
- Workshop plus competition on affect and behavior analysis (expression, action units, valence-arousal) from in-the-wild video
- Usually two editions a year, one with CVPR and one with ICCV or ECCV; 10th at CVPR 2026, 11th at ECCV 2026
- Earlier editions at CVPR 2017 and 2022 to 2025, ICCV 2021 and 2025, ECCV 2022 and 2024, FG 2020
- Accepted papers go into the host conference workshop proceedings; challenge teams also submit papers
- 30 papers on CVF Open Access for CVPR 2026, 13 for ICCV 2025
- Double-blind review in the host conference format (CVPR 5 to 8 pages, ECCV 8 to 14 pages)
- Not listed in ICORE2026 or the CCF list
