id: abaw
name: ABAW
full_name: Workshop and Competition on Affective and Behavior Analysis in-the-wild
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: multiple-per-year
organizer: Workshop organizing committee led by Dimitrios Kollias (Queen Mary University of London), with organizers
  from Imperial College London, ETS Montreal, Concordia University, Hume AI and others; co-located with CVPR, ICCV or
  ECCV
organizer_country: [europe, canada]
proceedings: Host conference workshop proceedings (CVPR, ICCV or ECCV)
archival: true
typical:
  deadline_months: [3, 7]
  conference_months: [6, 9, 10]
links:
  website: https://affective-behavior-analysis-in-the-wild.github.io/11th/
notes:
- Workshop plus competition on affect recognition in the wild (valence-arousal, expression, action units,
  ambivalence/hesitancy)
- Often held twice a year, with CVPR and with ICCV or ECCV (CVPR 2025 and ICCV 2025, CVPR 2026 and ECCV 2026)
- Accepted workshop and challenge papers appear in the host conference workshop proceedings
- Double-blind review in the host conference format; top-3 teams of each challenge must submit a paper
- Deadlines are AoE
- Not listed in ICORE2026 or the CCF list
