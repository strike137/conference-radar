id: ai2ase
name: AI2ASE
full_name: AAAI Workshop on AI to Accelerate Science and Engineering
type: workshop
tier: minor
areas: [ai]
region: worldwide
language: english
frequency: annual
organizer: AAAI workshop program; organized by Aryan Deshwal (University of Minnesota), Jana Doppa (Washington State University), Vipin Kumar, Carla Gomes and Azza Fadhel
organizer_country: [usa]
proceedings: None (non-archival; accepted papers are listed on the workshop website)
archival: false
typical:
  deadline_months: [10, 11]
  conference_months: [1, 2]
links:
  website: https://ai-2-ase.github.io/
notes:
- Workshop held with AAAI every year since 2022; location follows AAAI (2025 Philadelphia, 2026 Singapore, 2027 Montreal)
- 2027 is the 6th edition
- Long (up to 8 pages), short (up to 4 pages) and position (up to 4 pages) papers in AAAI format, submitted via CMT
- Non-archival, the CFP states accepted papers are considered non-archival
- Covers AI for chemistry, physics, materials, power systems, agriculture, earth sciences and other science or engineering domains
- 2026 edition had a theme on AI for agricultural and forestry sciences
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
