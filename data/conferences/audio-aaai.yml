notes:
- AAAI workshop on audio-centric AI (audio-language models, auditory reasoning, sound event detection, speech and audio generation, audio deepfake detection)
- First edition at AAAI-26 in Singapore (26 January 2026); second edition at AAAI-27 in Montreal
- '2027 edition is titled "Second Workshop on Audio-Centric AI: Auditory Reasoning, Multimodal Understanding, Audio Generation, and Trustworthy Deployment"'
- Archival track papers of the 2026 edition appear in PMLR volume 312; a non-archival track accepts work under review or already published
- Full papers up to 8 pages and short papers up to 4 pages excluding references, AAAI template, double-blind review on Microsoft CMT
- One-day in-person workshop; organizers expect 40 to 60 attendees
- Not listed in ICORE2026 and not on the CCF list
