notes:
- Conference on systematic engineering of digital twins (modeling, DevOps, co-simulation, quality assurance, case studies), co-located with MODELS
- Grew out of the Model-Driven Engineering of Digital Twins (ModDiT) workshop series at MODELS
- Editions so far are Linz 2024, Grand Rapids 2025 (hybrid) and Malaga 2026; 2027 edition announced for Budapest with MODELS 2027
- 2025 had a technical track with regular (10+2 pages), vision (6+1), exemplar (6+1) and tool demo (4+1) papers in IEEE format
- 2026 had an extended abstracts track (4+1 pages, ACM format, single-anonymous) plus a SoSyM journal-first track and industrial talks
- Selected best regular papers (2025) invited to a SoSyM special section
- Steering committee mostly from European universities
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
