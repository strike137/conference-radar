notes:
- Two-day conference on systematic engineering of digital twins (modelling, DevOps, co-simulation, quality assurance), co-located with MODELS
- Grew out of the Model-Driven Engineering of Digital Twins (ModDiT) workshop series at MODELS; first edition 2024
- Editions in Linz 2024, Grand Rapids 2025 (hybrid), Malaga 2026, Budapest 2027
- 2026 has an Extended Abstracts track (vision, exemplar and demo papers, 4+1 pages, ACM format, single-anonymous) published in the MODELS 2026 companion proceedings by ACM
- Full papers go through a SoSyM journal theme section whose accepted papers are presented at the conference
- 2025 papers were published in the MODELS companion proceedings with IEEE
- Also has an industrial talks track
- Not listed in ICORE2026 or on the CCF 2026 list
