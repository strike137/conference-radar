notes:
- Satellite workshop of MICCAI since 2019 on uncertainty quantification, out-of-distribution detection, calibration and safety of ML in medical imaging
- Moves with MICCAI (Daejeon 2025, Strasbourg 2026); held jointly with the iMIMIC workshop and an uncertainty tutorial in 2026
- Proceedings in Springer LNCS (own volume for UNSURE 2025); extended versions invited to a MELBA journal special issue
- Double-blind review; 8 pages plus references in LNCS format, optional 2-page supplementary PDF
- Submission via OpenReview in 2026 (CMT in 2025); a short presentation video is compulsory for accepted papers
- Organizers from UCL, Imperial College London, Oxford, Tubingen, DTU, MIT and Harvard Medical School
- Satellite day registration about 130 EUR early for students with main conference registration (2026)
- Not listed in CORE ICORE2026 or the CCF 2026 list
