notes:
- Series since 2005 (27th edition in 2025); sponsored by IEEE, IEEE CS and IEEE TCSC
- 'Runs as a joint congress: 2025 with DSS/SmartCity/DependSys/ICESS in Exeter, 2026 inside the IEEE Hyper Intelligence
  Congress (HPCC/DSS/SmartCity/DependSys/Embodied AI/ICESS) in Luoyang'
- Rotates between China and elsewhere (2023 Melbourne, 2024 Wuhan, 2025 Exeter, 2026 Luoyang)
- CCF C and CORE C; single-blind, 8 pages (10 with overlength charge), submission via EDAS
- Has a communications and networking track including trust, security and privacy topics
