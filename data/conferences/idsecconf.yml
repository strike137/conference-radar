notes:
- Indonesia's long-running community hacker and security conference, held every year since 2008
- Run by an independent volunteer committee from communities such as ECHO, Kecoak Elektronik and Jasakom; past
  partners include KEMKOMINFO, APJII and BSSN
- Travels between Indonesian cities, usually hosted by a university campus (Bali 2023, ITS Surabaya 2024, UNM
  Makassar 2025, Binus Bandung 2026)
- Two days of workshops followed by a two-day conference with selected paper talks, panel discussions and a CTF
- Call for papers by email; papers in Indonesian or English, about 7 or 8 selected for on-stage talks each year
- No formal proceedings; slides are shared on SlideShare
