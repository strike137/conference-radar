notes:
- Independent practitioner conference on applied AI held in San Francisco every autumn since 2023
- Founded by Shon Burton (also founder of MLconf); program chair Ben Lorica, formerly program chair of Strata Data and
  the O'Reilly AI Conference
- Tracks cover frontier research, builders and infrastructure, applied AI, strategy and industry verticals, plus
  workshops, a Hack Day and a Startup Showdown
- 2026 edition at Pier 48, Mission Rock, with 7 tracks and 120+ speakers; Day ZERO on Sept 29 and the main
  conference on Sept 30 and Oct 1
- Talks chosen through a call for presenters; no papers or proceedings
- Not listed in CORE ICORE2026
