notes:
- Workshop on graph transformations, graph query languages and evolving graph data, held with EDBT/ICDT since 2025
- Research, application and vision papers of six pages in CEUR double column format; single-blind review via CMT
- Papers appear in the joint EDBT/ICDT Workshops volume of CEUR-WS (2026 Vol-4192, 2025 Vol-3946)
- Previously published results may be presented; only a short abstract then goes into the proceedings
- 3rd edition announced with EDBT/ICDT 2027 in Lille
- Not ranked in ICORE2026 and not on the CCF 2026 list
