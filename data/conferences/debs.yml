notes:
- ACM conference on stream processing, complex event processing, event-driven middleware and distributed data systems
- Proceedings in ACM DL
- Not listed in CORE ICORE2026 or the CCF list
- Research track is double-blind with rebuttal; research and benchmarking papers up to 12 pages, short, vision and position papers up to 6 pages
- Also has industry and application papers, posters and demos, doctoral symposium and the yearly DEBS Grand Challenge
- In-person event; authors of accepted papers are expected to present on site
- Held in Europe in recent years (Milan 2021 online, Copenhagen 2022, Neuchatel 2023, Lyon 2024, Gothenburg 2025, Lisbon 2026, Galway 2027)
