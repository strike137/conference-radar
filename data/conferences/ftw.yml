notes:
- ICSE workshop on flaky tests and non-determinism in testing, aimed at both academia and industry
- Held with ICSE since 2024; Lisbon 2024, Ottawa 2025, Rio de Janeiro 2026 (3rd edition)
- Short papers up to 6 pages plus 2 pages of references (double-blind) or extended abstracts up to 2 pages (single-blind, APC free)
- Program includes a keynote and a panel discussion with experts from academia and industry
- 2026 proceedings in the ACM Digital Library as "Proceedings of the 2026 IEEE/ACM 3rd International Flaky Tests Workshop"
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
