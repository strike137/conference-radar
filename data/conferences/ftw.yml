notes:
- One-day ICSE workshop on flaky tests and non-determinism in software testing, aimed at both academic researchers and industry practitioners
- Held with ICSE since 2024; Lisbon 2024 (1st), Ottawa 2025 (2nd), Rio de Janeiro 2026 (3rd)
- 2026 organizers from the University of Antwerp, George Mason University, TU Munich and UT Austin
- Short papers up to 6 pages plus 2 pages of references (double-blind) and extended abstracts up to 2 pages (single-blind, APC free)
- Program includes a keynote and an industry panel on flaky tests
- 2026 papers published by ACM in the ICSE workshop proceedings; 2025 used the IEEE template and 2024 the ACM template
- Not on the ICSE 2027 workshop list, so the next edition is not announced yet
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
