notes:
- Annual symposium on HCI education research, pedagogy and teaching practice, run by the EduCHI Steering Committee in cooperation with ACM SIGCHI
- Community founded in 2018; the 2023 symposium was a one-day event held as part of CHI 2023, and it has been standalone at a host university since 2024
- Papers archived in the ACM DL via the ACM International Conference Proceedings Series; APC may apply for authors outside ACM Open
- Double-blind review with at least three reviewers and a PC meeting; no page limit, 5,000 to 8,000 words expected for research papers
- Also has lightning talks and a pedagogy workshop
- Hybrid, with in-person and online-only registration (New York 2024, Bloomington 2025, Toronto 2026)
- 21 paper presentations in 2026
- Not listed in ICORE2026 or the CCF list
