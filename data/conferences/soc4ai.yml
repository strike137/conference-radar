id: soc4ai
name: SOC4AI
full_name: Workshop on Service-Oriented Computing for AI Applications
type: workshop
tier: minor
areas: [software, ai, systems]
region: worldwide
language: english
frequency: annual
organizer: SOC4AI chairs (SCORE Lab, Universidad de Sevilla, with Universitat Pompeu Fabra and TU Wien), ICSOC workshop
organizer_country: [europe]
proceedings: Springer LNCS (ICSOC Workshops post-proceedings)
archival: true
typical:
  deadline_months: [10]
  conference_months: [12]
links:
  website: https://soc4ai-at-icsoc-github-io.onrender.com/
notes:
- Workshop co-located with ICSOC every year since 2024 (Tunis 2024, Shenzhen 2025, Lodz 2026); the 2026 edition is the 3rd
- Run by members of the Spanish AI4Software research network, led by the SCORE Lab at Universidad de Sevilla
- Covers both SOC for AI applications (AI services, orchestration, deployment) and AI for SOC (LLM agents, service discovery, autonomous management)
- Accepted papers go into the ICSOC workshop post-proceedings in Springer LNCS
- Small workshop; 4 of 8 papers accepted in 2024 and 5 of 10 in 2025
- Papers 8 to 12 pages in LNCS format, at least three reviews each; in-person presentation required
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
acceptance_rate: 50% (2025, 5/10)
