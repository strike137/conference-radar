notes:
- Premier forum on power semiconductor devices and power ICs; tracks on high voltage devices, low voltage devices and power IC technology, power IC design, GaN, SiC and other materials, and packaging
- Rotates every year among Japan, North America, Europe and other areas in a four-year cycle; 2025 Kumamoto, 2026 Las Vegas, 2027 Taipei (first time in Taiwan)
- Sponsored by IEEE EDS (outside Japan) or IEEJ (in Japan), with technical co-sponsorship from IEEE PELS, IEEE IAS and others
- 4-page full paper submission required; no late news session in 2027; IEEE conference template, US Letter
- All accepted papers (invited, oral and poster) appear in the conference proceedings
- "Strong industry participation: 2027 general chair from TSMC, TPC chair from DB HiTek; 665 participants in 2025"
- Not ranked by CORE or CCF, whose lists cover computing venues
