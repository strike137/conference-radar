notes:
- Workshop on integrated sensing and communication (ISAC) for 6G and IoT, co-located with ACM MobiCom
- Held with MobiCom 2022 (Sydney), MobiCom 2023 (Madrid) and MobiCom 2024 (Washington D.C.); the same organizers run ISAC workshops at IEEE ICC, Globecom, WCNC and ICASSP
- Papers up to 6 pages in ACM format, single-blind review; accepted papers published in the ACM ISACom proceedings in the ACM Digital Library
- Organizers in 2024 were Yuanhao Cui (BUPT), Weijie Yuan (SUSTech), Christos Masouros (UCL), Difan Zou (HKU), Jiali Nie (BUPT) and Le Zheng (BIT)
- Edition numbering on the official pages is inconsistent (2023 and 2024 are both called the 3rd)
- Not in the MobiCom 2025 workshop program; no later edition announced
- Not listed in ICORE2026
