notes:
- Biennial conference (even years) at IISc Bangalore, first held in 1990 and every other year since 2010
- Technically co-sponsored by IEEE ComSoc, IEEE Signal Processing Society and IEEE Bangalore Section; proceedings
  in IEEE Xplore
- Double-blind review via CMT; papers up to 5 pages including references; all accepted papers must be presented
  in person (2026); 27% acceptance in 2022 (99/366)
- Known for many invited sessions; a Graduation Day Forum for senior PhD students was started in the 2018 edition
- Topics include ML for signal processing and communications, next-generation networks, and information forensics
  and security
