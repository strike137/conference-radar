notes:
- Annual computer science congress run by the Computing Research Center (CIC) of the Instituto Politecnico Nacional, Mexico City; the 2026 site calls it a 26 year tradition
- Held at CIC-IPN in Mexico City; a week of workshops (talleres) precedes the conference week
- Broad scope (AI, NLP, cybersecurity and networks, data science, quantum, embedded systems, robotics); 2026 theme was AI and supercomputing
- Papers in English in Springer format, double-blind review via Springer Meteor; around 21 accepted papers expected in 2026
- The 2026 program page says accepted papers appear in the CORE 2026 proceedings published by the IPN journal Research in Computing Science
- Mainly a student and young researcher event with invited talks, panels, posters and industry talks; much of the program is in Spanish
- Not listed in the CORE portal (ICORE2026)
