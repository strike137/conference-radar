notes:
- National Norwegian IT security convention held every February in Oslo since 2006 (HackCon#1); 2027 is HackCon#22
- Run by an idealistic network of Norwegian security professionals, earlier together with KINS and HoneyNor
- Two conference days with a single track of invited and CFP talks, preceded by two days of paid preHackCon training courses
- Talks in English or Norwegian; site mostly in Norwegian
- CFP by email to the organizers; proposals must arrive by 15 December for the following year's event
- "Fee for HackCon#22: 4572 NOK early registration; 5 student places at 500 NOK plus VAT"
- 2026 edition sold out on 8 January 2026
- Also runs a free online webinar series (HackCon Online) in October
- No proceedings
