notes:
- Flagship conference of the IEEE Uruguay Section, sponsored with the IEEE Cono Sur Council; held in Montevideo
- Irregular schedule so far (2017, 2021, 2024, 2026); 2026 is the 4th edition
- Covers electrical, electronic and computer engineering
- 2026 call uses single-blind review by 3 reviewers, papers up to 5 pages in IEEE format, submitted via EDAS; accepted papers go to IEEE Xplore
- 2026 has a separate call for abstracts besides the paper track
- 2024 accepted Spanish papers but only English papers were sent to IEEE Xplore; 2026 paper track is English only
- Not ranked in CORE ICORE2026
