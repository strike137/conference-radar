id: taros
name: TAROS
full_name: Towards Autonomous Robotic Systems Conference
type: conference
tier: minor
areas: [ai, systems]
region: europe
language: english
frequency: annual
organizer: TAROS steering committee with a rotating UK host university (University of Manchester in 2026)
organizer_country: [europe]
proceedings: IEEE (2026); Springer LNAI until 2025
archival: true
typical:
  deadline_months: [3, 4]
  conference_months: [8, 9]
links:
  website: https://taros-conference.org/
notes:
- Longest-running UK-hosted international conference on robotics and autonomous systems; started in 1997 as TIMR
  (Towards Intelligent Mobile Robots)
- Held at a different UK university each year (Cambridge 2023, Brunel 2024, York 2025, Manchester 2026)
- Proceedings were in Springer LNAI up to 2025; for 2026 the CFP says the proceedings are published by IEEE
- 2026 full papers are 6 pages plus 2 optional pages in IEEE format (12 Springer pages until 2025); single-blind review
- Technical sponsorship from IEEE RAS in 2026; extra PhD / early career researcher day run with UK-RAS
- "TAROS 2025: 32 full and 4 short papers selected from 74 submissions"
- Not listed in CORE ICORE2026; friendly venue aimed at research students and young researchers
