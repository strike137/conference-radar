notes:
- Small conference on computer supported cooperative work in design, cooperative visualization and cooperative engineering, held since 2004
- Proceedings in Springer LNCS; full papers 12 pages, short papers 6 pages; double-blind review
- Two submission rounds (first and second call); poster abstracts are not in the proceedings
- Technical sponsor is the IEEE SMC Visual Analytics and Communication Technical Committee
- Often held in Mallorca, Spain; recently Valencia 2024, Bangkok 2025, Lueneburg 2026
- Extended papers can go to MDPI journal special issues
- "CORE rank: C (ICORE2026)"
