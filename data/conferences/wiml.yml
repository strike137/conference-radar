notes:
- Affinity workshop for women and non-binary researchers in machine learning; started at the 2006 Grace Hopper Celebration
  and co-located with NeurIPS since 2008; 2026 is the 21st edition
- One-page abstracts via OpenReview with double-blind review; previously published (within one year) or under-review work
  is welcome
- "No formal proceedings: abstracts are non-archival"
- Accepted abstracts are presented as posters, with a few oral presentations; mentoring sessions and invited talks
- Presenting author must be a woman or non-binary; all genders may attend
- Requires NeurIPS registration; WiML offers travel funding for students and postdocs, tied to volunteering
- 2026 runs at three NeurIPS sites (Sydney Dec 8, Atlanta Dec 9, Paris Dec 10); 227 papers accepted for Sydney
- Not listed in CORE ICORE2026 and not on the CCF list
