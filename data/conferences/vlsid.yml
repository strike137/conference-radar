notes:
- Main VLSI design conference in India, run by the VLSI Society of India since 1985; held jointly with the
  International Conference on Embedded Systems
- Described by the organizers as a sister conference of DAC; large event with 3000+ attendees, strong industry presence
- Held in Indian cities every January (Hyderabad 2023, Pune 2026, Bengaluru 2027); two days of workshops and tutorials
  before three main conference days
- Full papers up to 6 pages in IEEE two-column format; double-blind review
- "Proceedings: accepted papers go to IEEE Xplore (the 2027 call says pending approval of sponsorship)"
- Also has a user design track, design and tapeout contests, a student research forum and fellowships for students
- CORE National India (ICORE2026); not in the CCF list
