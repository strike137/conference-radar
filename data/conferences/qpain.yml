notes:
- Organized by the IEEE Photonics Society Bangladesh Chapter and sponsored by the IEEE Photonics Society; started in 2025
- Held in Bangladesh (2025 at BAUST, Saidpur; 2026 and 2027 in Chattogram, 2026 at CUET)
- Accepted and presented papers are submitted to IEEE Xplore (the 2025 site links its IEEE Xplore proceedings); organizers
  state Scopus indexing
- Four tracks covering quantum photonics and optical communications, networking and security, AI and machine learning,
  and optoelectronics, signal processing and energy systems
- Double-blind review; 4 to 6 pages in IEEE conference format, submitted via the PROCONF portal
- A paper appears in the proceedings only if an author registers and presents it
- Not ranked in ICORE2026
