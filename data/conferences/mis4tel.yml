notes:
- Technology enhanced learning with a focus on AI in education; 2026 is the 16th edition
- Main track and workshops published in separate Springer Lecture Notes in Networks and Systems volumes
- Main track is double-blind; each paper reviewed by at least three experts; up to 12 pages (8 for short papers)
- Co-located with DCAI, PAAMS and other events every year; hybrid participation allowed
- Held in Europe (Guimaraes 2023, Salamanca 2024, Lille 2025, Naples 2026)
- Selected papers invited to journal special issues (IJIMAI, CMC, ADCAIJ and others)
- 2026 deadlines were extended twice (17 Apr -> 8 May -> final 22 May)
- "CORE rank: National: Spain (ICORE2026); not in the CCF list"
