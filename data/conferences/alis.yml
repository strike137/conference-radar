notes:
- AI conference (the AI track) of the Australasian Computer Science Week (ACSW); first edition in 2026
- Covers all areas of AI with a focus on deep learning, reinforcement learning, generative AI, LLMs and agentic systems
- Double-blind review; full papers up to 8 pages and short papers 2 to 4 pages; papers already on arXiv are accepted
- Accepted papers published in the ACM Digital Library (ICPS) as part of the ACSW proceedings; authors outside ACM Open may have to pay an APC
- ALIS 2026 was a one-day program at Deakin City Campus, Melbourne; organisers mainly from Deakin University
- Not found in ICORE2026; not on the CCF list
