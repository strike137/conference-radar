id: icacs-th
name: ICACS
full_name: International Conference on Algorithms, Computing and Systems
type: conference
tier: minor
areas: [general, software]
region: worldwide
language: english
frequency: annual
organizer: Commercial conference secretariat (iconf.org submission system) with co-sponsoring universities (Rajamangala University of Technology Srivijaya and University of Thessaly in 2026)
proceedings: ACM DL (ACM ICPS)
archival: true
indexing: [EI, Scopus]
fee: 650 USD per full paper (2026, regular; 620 USD early bird); abstract only 350 USD
typical:
  conference_months: [10, 12]
links:
  website: https://www.icacs.org/
notes:
- Annual since 2017; 2026 is the 10th edition
- Recent locations are Rabat 2019, virtual 2020 to 2023 (2022 and 2023 hosted by the University of Thessaly, Greece), Hong Kong 2024, Bangkok 2025 and Phuket 2026
- Proceedings in the ACM International Conference Proceedings Series (ACM DL), stated as EI Compendex and Scopus indexed
- Double blind review per the site; full papers 8 to 10 pages
- Abstract only presentation without publication is also offered
- Not related to ICACS in Pakistan (icacs-pk)
- Not listed in the CORE ICORE2026 portal
