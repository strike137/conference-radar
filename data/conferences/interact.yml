notes:
- Flagship conference of IFIP Technical Committee 13 on Human-Computer Interaction, held every two years
- Proceedings in Springer LNCS (several volumes per edition; four parts in 2025)
- Full papers up to 18 pages plus 4 pages of references in LNCS format, anonymous review with three reviews and a
  meta-review, rebuttal only for borderline papers
- Authors of full paper submissions must agree to review when invited by an Associate Chair
- Accepted full papers must be presented at the conference and at least one author must register
- Also has short papers, posters, panels, courses, interactive demonstrations, workshops and a doctoral consortium
- Held in Belo Horizonte 2025 and Tallinn 2027 (Tallinn University)
- CORE B (ICORE2026), CCF C
