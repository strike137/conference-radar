notes:
- Workshop and challenge on data-centric computer vision (dataset analysis, bias, synthetic data, data for vision-language models)
- Started as the VDU (Vision Datasets Understanding) workshop at CVPR 2022; later editions at CVPR 2023, CVPR 2024, ICCV 2025 and CVPR 2026 (5th edition)
- Papers of 4 to 8 pages excluding references in CVPR format, double-blind review on OpenReview
- Unpublished accepted papers may go into the CVPR Workshops proceedings on CVF Open Access (22 papers in 2026) or be presented as non-archival
- Already published or under-review work is accepted as non-archival
- 2026 challenge on vision-language models under visual illusions, with a code check for top teams
- Not listed in ICORE2026 or the CCF list
