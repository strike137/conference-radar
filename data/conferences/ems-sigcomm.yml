id: ems-sigcomm
name: EMS
full_name: ACM SIGCOMM Workshop on Emerging Multimedia Systems
type: workshop
tier: minor
areas: [networking, systems]
region: worldwide
language: english
frequency: irregular
organizer: ACM SIGCOMM workshop; 2025 general co-chairs Bo Wang (Tsinghua University) and Farzad Tashtarian (Universitat
  Klagenfurt); steering committee Junchen Jiang (University of Chicago), Mallesham Dasari (Northeastern University) and
  Zili Meng (HKUST)
organizer_country: [international]
proceedings: ACM DL
archival: true
typical:
  deadline_months: [5]
  conference_months: [8, 9]
links:
  website: https://conferences.sigcomm.org/sigcomm/2025/workshop/ems/
notes:
- Co-located with ACM SIGCOMM; started at SIGCOMM 2023, the 2024 edition was in Sydney and the 2025 edition in Coimbra was the 3rd
- Topics are video streaming, AR/VR/XR and volumetric video, real-time conferencing, AI-generated content and QoE
- Double-blind; research papers up to 6 pages including references, lightning papers 2 pages plus one page of references
- SIGCOMM workshop papers go into the conference proceedings in the ACM Digital Library unless authors opt out
- In 2024 lightning papers were presented demo style and not published in the proceedings
- Full-day workshop with a keynote and a best paper award
- Not among the ACM SIGCOMM 2026 workshops; no 2026 edition found
