notes:
- Estonian infosec community BSides event, organized by the non-profit MTÜ BSides Tallinn since 2021
- Talks proposed through an open CFP on pretalx and selected by a program committee from industry, academia and the state
- One conference day with two parallel stages and a hands-on village, plus a workshop day before it; held at T1 Mall, Tallinn in 2025 and 2026
- 2026 drew about 600 participants, 21 speakers and workshop organizers; talks are recorded and posted on YouTube
- Tickets in 2027 early bird are 85 EUR (community) and 250 EUR (business); student tickets are offered
- For 2027 the CFP opens on 2027-05-01
- No proceedings
