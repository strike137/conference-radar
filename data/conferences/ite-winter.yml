notes:
- Second national convention of ITE, held every late December at a university in the Tokyo area, hybrid with Zoom
- No peer review mentioned in the call; papers are 1 or 2 A4 pages with a 15 min slot (10 min talk, 4 min Q&A)
- Covers image sensing, displays, storage, broadcasting technology, human information, media engineering (vision,
  coding, multimedia AI), CG, 3D media and sports information processing
- Japanese or English talks; students can give a cheaper freshperson talk (for example on their graduation research)
- Awards for young presenters (Suzuki Memorial Encouragement Award) and students (Student Excellent Presentation
  Award)
- Includes a KIBME/ITE joint session; the larger ITE Annual Convention is held in late August
- Application deadline in late September, usually extended by about one week to early October
