notes:
- Called International Conference on Machine Vision and Applications up to 2025; the 2027 edition is called International Congress
- Started in Singapore in 2018; held as a workshop of ICFCC in Yangon in 2019 and 2020, online in 2021 and 2022, Singapore 2023 and 2024, Melbourne 2025
- Proceedings in ACM ICPS (ACM DL) until 2024; SPIE Proceedings since 2025 (ICMVA 2026 in SPIE Vol. 14270)
- General chair Wolfgang Osten (University of Stuttgart)
- Run by the commercial organizer SCIEI (SCIence and Engineering Institute, USA, per the 2020 history page)
- Papers reviewed by at least two reviewers; one registration covers 10 pages, abstract only presentation also offered
- Not listed in the CORE ICORE2026 portal
