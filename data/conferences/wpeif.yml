notes:
- One-day workshop co-located with SBRC, the Brazilian Symposium on Computer Networks and Distributed Systems
  run by the Brazilian Computer Society (SBC); 17th edition in 2026
- 2026 was a special edition linked to the OPENRIT6G project, with coordinators from Brazil, Europe, Japan and the USA
- Topics include experimental networking testbeds, federated and cloud-edge testbeds, Open RAN and private 5G/6G,
  digital twins and AI-driven network automation
- Papers in English only, up to 8 pages including references, SBC template, submitted via JEMS3
- Proceedings (Anais do WPEIF) published open access in SBC OpenLib (SOL), one volume per year since 2017 on SOL
- Not listed in CORE ICORE2026
