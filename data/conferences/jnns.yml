notes:
- Annual meeting of the Japanese Neural Network Society (neural networks, computational neuroscience, machine
  learning); 2026 was the 36th meeting
- The format changes by year; standalone JNNS meetings in 2023 and 2024, held as ICONIP in 2016 and 2025, and joint
  with the Japan Neuroscience Society and the Japanese Society for Neurochemistry as NEURO in 2022 and 2026
- 'Standalone meetings (JNNS2024): 150 word English abstract plus an optional 2 page paper in English or Japanese; the
  2 page papers are reviewed to choose oral talks, the rest become posters'
- NEURO2026 took English abstracts of 1,500 to 2,500 characters; the first author had to be a member of one of the
  three societies
- Non-archival; abstracts appear only in the online program (NEURO2026 Meeting Planner)
- Presenters must be JNNS members or members of a cosponsoring society; Young Investigator Awards for members aged 35
  or under
