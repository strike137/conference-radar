links:
  website: https://adt2026.sciencesconf.org/
notes:
- Algorithmic decision theory across computer science, economics and operations research (computational social choice, preferences, game theory, MCDA)
- Established in 2009 and usually held every two years, alternating between Europe and the USA (Venice, Rutgers, Brussels, Lexington, Luxembourg, Durham, Toulouse, Rutgers 2024, Paris 2026)
- Proceedings in Springer Lecture Notes in Artificial Intelligence (LNAI)
- Double-blind review, at most 15 pages in LNCS format; a non-proceedings option publishes only a two-page abstract so the full paper can go to another archival venue
- Not listed in ICORE2026 (the ADT search only returns JADT); CCF list not checked (site behind a captcha)
