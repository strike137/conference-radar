notes:
- Australasia's main HCI conference, run by CHISIG of the HFESA; 2025 was the 37th edition
- Long papers and late-breaking work appear in the ACM Digital Library; ACM Open means an APC (2026 subsidised rate
  350 USD per paper, 250 USD with an ACM/SIG member author) unless covered by an institution
- Double-anonymous review; long papers around 7,000 to 8,000 words in single-column ACM format, LBW up to 5,000
  words
- Rotates between Australian cities (Brisbane 2024, Sydney 2025, Adelaide 2026)
- CORE Australasian B (ICORE2026)
