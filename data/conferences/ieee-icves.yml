notes:
- Financially sponsored by the IEEE Intelligent Transportation Systems Society (ITSS); vehicle electronics, driver assistance, V2X, ECUs, automotive cybersecurity and road safety
- Accepted papers are submitted to IEEE Xplore
- Held since 2005; no edition in 2020, 2021 or 2023
- Location rotates worldwide (Madrid 2018, Cairo 2019, Bogota 2022, Ahmedabad 2024, Coventry 2025, Cochabamba 2026)
- Double-blind review via PaperCept; 6 pages expected, up to 8 with extra page charges (2026)
- Not listed in ICORE2026 or the CCF 2026 list
