notes:
- Taiwanese national IT conference held every year since 2001, started by National Penghu University to bring IT to the outlying islands
- Hosted mostly by universities on Penghu and Kinmen (Penghu 2022 and 2025, Kinmen 2021 and 2024, Yilan 2023); the 24th edition moved to National Changhua University of Education with a Guguan trip
- Broad topics, including AI, security, IoT, cloud, embedded systems, smart agriculture and telemedicine
- Papers in Chinese or English; at least one author must register and present; special sessions on request
- Authors sign a copyright form for the ISBN abstract proceedings and an NSTC Engineering Technology Promotion Center archive form
- Best paper awards given; no 2020 edition
- 2026 submission deadline extended from Apr 6 to Apr 13
