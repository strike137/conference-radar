notes:
- Half-day workshop on search personalization and recommendations within search, run by Netflix Research
- Host conference changes each year (WSDM 2022, The Web Conference 2023, SIGIR 2024, KDD 2025)
- Two-page extended abstracts plus references in the ACM sigconf template, submitted via EasyChair
- Accepted submissions are presented but not archived; previously published work is welcome
- At least one author of each accepted paper must attend and present
- Not listed in the CORE ICORE2026 portal
