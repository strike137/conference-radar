organizer: Ecole Hassania des Travaux Publics (EHTP, Casablanca, Morocco) with LAAS-CNRS (Toulouse); co-located with ICSOC
organizer_country: [other, europe]
proceedings: Springer LNCS (ICSOC Workshops volume)
archival: true
typical:
