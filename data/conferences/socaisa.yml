links:
  website: https://socaisa.org/
notes:
- Workshop on combining service-oriented computing, AI and IoT (service orchestration, edge AI, LLMs for IoT, interoperability)
- Held with ICSOC; 1st edition at ICSOC 2024 (Tunisia), 2nd at ICSOC 2025 (China), 3rd at ICSOC 2026 (Lodz, Poland)
- Organized by researchers from EHTP Casablanca and LAAS-CNRS Toulouse
- Full papers up to 12 pages in LNCS format including references, at least three reviewers per paper
- Accepted papers go into the ICSOC workshop proceedings in Springer LNCS
- At least one author must register and present; registration follows the ICSOC terms
- Not listed in ICORE2026 or the CCF list
