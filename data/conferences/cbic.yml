notes:
- Biennial congress of the Brazilian Computational Intelligence Society (SBIC); started in the 1990s as the Brazilian
  Congress on Neural Networks and renamed CBIC in 2011
- Covers neural networks and machine learning, evolutionary and swarm computation, fuzzy systems and metaheuristics
- Papers of 6 to 8 pages in IEEE style, in English (preferred) or Portuguese, submitted through Even3
- Only papers presented at the congress go into the online proceedings (Anais do CBIC) on sbia.org.br (the old
  sbic.org.br address redirects there); 2025 volume has ISBN 978-65-978625-0-4 and more than 200 papers
- Held in a different Brazilian city each edition (Salvador 2023, Belo Horizonte 2025); co-located with the EBIC
  tutorials and a thesis contest (CTD)
- Each accepted paper needs a professional registration
- Not ranked in CORE ICORE2026
