id: musiml
name: MusIML
full_name: Muslims in ML Workshop
type: workshop
tier: minor
areas: [ai]
region: worldwide
language: english
frequency: annual
organizer: Muslims in ML (MusIML) community; co-located with NeurIPS
organizer_country: [international]
proceedings: None (accepted papers posted on the workshop website)
archival: false
typical:
  deadline_months: [8, 9]
  conference_months: [12]
links:
  website: https://www.musiml.org/
notes:
- Affinity workshop for Muslim researchers in machine learning and for ML research relevant to Muslim communities; first held at NeurIPS 2020
- This entry tracks the NeurIPS editions; MusIML also runs workshops at ICML (4th at ICML 2025, 6th at ICML 2026 in Seoul on 2026-07-09)
- Short (4 page) or long (8 page) papers, system demos and competition proposals; 2025 used double-blind review on OpenReview
- "Non-archival: accepted papers are not in formal proceedings and can be submitted elsewhere"
- Visa-friendly early deadline plus a regular deadline
- NeurIPS 2025 edition accepted 60 papers with 300+ attendees
- Requires NeurIPS workshop registration; fee coverage may be offered for one author of an accepted paper
- Not listed in CORE ICORE2026 and not on the CCF list
