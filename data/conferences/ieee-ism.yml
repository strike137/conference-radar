notes:
- Grew out of multimedia software engineering workshops from the 1990s; 28th edition in 2026
- CORE C (ICORE2026)
- Technically co-sponsored by the IEEE Signal Processing Society; papers in IEEE Computer Society proceedings format
- Proceedings in IEEE Xplore (ISM 2025 volume, DOI 10.1109/ISM66958.2025)
- Regular papers 8 pages, short papers 4, position papers 2; extra pages cost 150 USD each
- Hybrid; co-located with AIxSoftware in 2026
- Held in December, often in Southern California, Taichung or Naples (Naples 2025, Tokyo 2024, Laguna Hills 2023)
- Deadlines are usually extended by a few weeks
