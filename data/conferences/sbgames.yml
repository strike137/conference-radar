notes:
- Main Brazilian games research symposium of the Brazilian Computer Society (SBC); 25th edition in 2026
- Six research tracks (Arts & Design, Computing, Culture, Education, Industry, Health); the Computing track is in
  English, the other tracks call for papers in Portuguese
- Proceedings (Anais) published open access in the SBC OpenLib (SOL) with DOIs; separate extended proceedings (Anais
  Estendidos) for other activities
- Single-blind review per the 2026 proceedings preface (the Computing track CFP states double-anonymous review); 259 of 424 full papers accepted in 2026 (about 61%), 205 of 404 in 2025
- Best papers invited to an extended version in the Journal on Interactive Systems (JIS)
- Held jointly with SVR and SIBGRAPI in a different Brazilian city each year (Manaus 2024, Salvador 2025, Goiânia
  2026); at least one author must present in person
- Not ranked in CORE ICORE2026
