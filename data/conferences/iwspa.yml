notes:
- One-day workshop co-located with ACM CODASPY, held since 2015; 2026 was the twelfth edition
- Machine learning, data mining, NLP and statistics applied to security and privacy, including security of AI systems
  and LLMs; tutorial proposals also welcome
- Accepted papers appear in the ACM Digital Library; selected papers may go to a journal special issue
- Full papers up to 10 pages (12 in total) and short papers up to 6 pages (8 in total) in ACM sigconf format;
  anonymous submission
- Follows the CODASPY location (Pittsburgh 2025, Frankfurt 2026)
- Submission deadline was extended in both 2025 (three weeks) and 2026 (nine days)
- Not listed in ICORE2026 or the CCF list
