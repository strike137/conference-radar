organizer_country: [other]
proceedings: None
archival: false
fee: 2000 USD ticket (2026; 1400 USD alumni price until Sep 15); accepted speakers get flight and accommodation covered
typical:
  deadline_months: [8]
  conference_months: [10]
links:
  website: https://thesascon.com/
notes:
- Industry threat-research conference run by Kaspersky; invitation-only, for anti-malware researchers, law
  enforcement, CERTs and industry
- Talks only, no published proceedings; recordings shared afterwards when speakers agree
- Classic 20-minute talks or Pecha-kucha (20 slides x 20 seconds); politically motivated or marketing talks are declined
- Speakers chosen by the program committee get economy flights and accommodation covered
- Hosts the on-site attack/defense finals of the SAS CTF (online Jeopardy qualifier in June; 18,000 USD prize pool in 2026)
- 2026 is the 18th edition (more than 1150 participants over 17 previous events); recent editions in Southeast Asia
- Not the same venue as JSAC (JPCERT/CC Japan Security Analyst Conference)
