notes:
- Biennial electrical engineering symposium (odd years) run by the Faculty of Electrical Engineering of POLITEHNICA
  Bucharest; always held in Bucharest, Romania
- Topics are classic EE (electromagnetic fields, machines and drives, power electronics, EMC, renewable energy,
  measurements, biomedical engineering) rather than computing or networking
- Proceedings in IEEE Xplore (every edition since 2011); most editions also listed in Web of Science CPCI
- Technical co-sponsors include the IEEE Romania Section; hybrid format
- Selected papers invited to Revue Roumaine des Sciences Techniques and UPB Scientific Bulletin
- Short review cycle (about two weeks from submission to notification)
- 2025 edition moved to October; earlier editions were held in late March
- Not listed in ICORE2026
