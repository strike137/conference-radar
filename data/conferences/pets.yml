notes:
- Main venue for privacy technology research; papers appear in the open-access journal PoPETs with no APC
- Four submission deadlines per year (end of February, May, August, November) with journal-style accept/revise/reject
  decisions and a rebuttal period
- Rejected papers must skip one full issue before resubmission; revise decisions allow up to four months of revision
  with a revision editor
- 'Held every July, mostly in Europe or North America: Calgary (2026), Delft (2027); HotPETs and workshops co-located'
