notes:
- French national conference on pattern recognition, image analysis, perception and related machine learning, run by AFRIF
- Co-located with CAp (French machine learning conference, run by SSFAM) with separate submissions and joint sessions
  (Vannes 2022, Lille 2024, Montpellier 2026)
- Held every two years in France (2018, 2020, 2022, 2024 and 2026 editions have papers on HAL)
- Long papers 6 to 8 pages and 2-page short papers (poster), in French or English; submission via OpenReview in 2026
- Papers already accepted at international conferences or journals may be presented but are not included in the proceedings
- Proceedings published online on HAL; informal French proceedings, so marked non-archival here
- Not listed in ICORE2026 and not on the CCF list
