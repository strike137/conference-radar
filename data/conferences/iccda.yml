id: iccda
name: ICCDA
full_name: International Conference on Computing and Data Analysis
type: conference
tier: minor
areas: [data, ai]
region: asia-pacific
language: english
frequency: annual
organizer: Commercial conference secretariat (contact iccda_Conf@yeah.net, iconf.org submission system) with host universities that change each year
organizer_country: [china]
proceedings: Springer LNDECT (2026); ACM DL (ACM ICPS) 2017 to 2024
archival: true
indexing: [EI, Scopus]
fee: 580 USD per full paper (2026, regular; 550 USD student); 380 USD abstract presentation only; 60 USD per extra page over 12
typical:
  deadline_months: [11]
  conference_months: [11, 12]
links:
  website: https://www.iccda.org/
notes:
- Annual since 2017; held in the USA 2017 to 2020, virtual 2021 and 2022, in China 2023 to 2025 (Guiyang, Wenzhou, Chengdu), Phuket 2026
- Proceedings in ACM ICPS (ACM DL) up to 2024; 2026 papers go to Springer Lecture Notes on Data Engineering and Communications Technologies (LNDECT)
- Selected papers can be recommended to the Journal of Advances in Information Technology (JAIT) and IJCTE
- Run by a commercial conference secretariat; 2026 co-sponsored by Rajamangala University of Technology Srivijaya and University of Thessaly
- Full papers 10 to 12 pages with peer review; abstract only presentation without publication is also offered
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
