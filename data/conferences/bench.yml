notes:
- Organized by the International Open Benchmark Council (BenchCouncil); grew out of the BPOE and SDBA workshops held with ASPLOS, VLDB and ICS
- Renamed from Symposium on Benchmarking, Measuring and Optimizing to Symposium on Evaluation Science and Engineering in 2025
- Topics include benchmarks, datasets, metrics, measurement, workload characterization and evaluation methodology
- Full papers up to 15 pages and short papers up to 12 pages in LNCS format (excluding references), double-blind review
- Revised selected papers in Springer LNCS (Bench 2024 and Bench 2025 volumes confirmed); extended versions invited to BenchCouncil Transactions on Benchmarks, Standards and Evaluations
- Held with the Federated Intelligent Computing and Chip Conference; in China since 2023 (Sanya, Guangzhou, Guanghan, Guilin); 2021 moved online (planned for Atlanta)
- Not listed in ICORE2026; not on the CCF 2026 list
