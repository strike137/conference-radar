notes:
- National academic conference of the China Simulation Federation committee on intelligent IoT systems modeling and
  simulation; scope covers intelligent sensing, digital twins, multi-agent systems, industrial IoT and embodied
  intelligence
- Papers accepted in English and Chinese; accepted English papers published in Springer CCIS (Intelligent Networked
  Things), indexed by EI
- Double-blind review with at least three reviewers; full papers at least 12 pages, short papers at least 6 pages in
  LNCS format
- CINT 2025 (Zhuhai) proceedings published in two Springer CCIS volumes
- Annual since 2024 after irregular editions (2011 to 2022); held in a different Chinese city each year (Xi'an 2024,
  Zhuhai 2025, Hangzhou 2026, Beijing 2027)
- Not listed in the CORE ICORE2026 portal
