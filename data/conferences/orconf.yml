notes:
- The FOSSi Foundation's annual European community conference on free and open source silicon, held since 2012 (12th edition in 2026)
- Covers open source digital design, EDA tools, HDLs, verification, FPGAs, RISC-V and other open IP, open PDKs and embedded systems
- Single track of talks on Friday and Saturday (full talks about 10 minutes, lightning talks 3 minutes), then an unconference day with workshops on Sunday
- Talk proposals are submitted as part of registration; no papers or proceedings
- Free to attend with registration; optional pay-what-you-want and professional tickets; registration filled to capacity in 2026
- Moves around Europe -> Munich 2023, Gothenburg 2024, Valencia 2025, Ghent 2026 (co-located with FPL 2026)
