id: icitee
name: ICITEE
full_name: International Conference on Information Technology and Electrical Engineering
type: conference
tier: minor
areas: [general, communications, ai, networking]
region: southeast-asia
language: english
frequency: annual
organizer: Universitas Gadjah Mada (UGM, Indonesia) and King Mongkut's Institute of Technology Ladkrabang (KMITL,
  Thailand), with IEEE Indonesia Section or IEEE CIS Thailand Chapter
organizer_country: [indonesia, thailand]
proceedings: IEEE Xplore
indexing: [Scopus, EI Compendex, CPCI]
rank:
  core: Unranked
fee: 450 USD IEEE member, 500 USD non-member (2026, early, non-student); students 350/400 USD
typical:
  deadline_months: [5, 6, 7, 8]
  conference_months: [10]
links:
  website: https://icitee.ugm.ac.id/
notes:
- Annual since 2009; in recent years UGM hosts even years in Indonesia (2024 Bali, 2026 Lombok) and KMITL hosts
  odd years in Thailand (2025 Bangkok)
- Accepted and presented papers go to IEEE Xplore; 4 to 6 page papers via EDAS
- 'Very broad EE/IT scope: IT, AI and signal processing, communications and networks, electronics, power and control'
- Deadlines are usually extended twice; ICITEE 2025 used rolling review with decisions within three weeks
- UGM-hosted editions run as a joint conference with iBioMed (2024, 2026); the 2025 Bangkok edition was co-located
  with CDVE2025
