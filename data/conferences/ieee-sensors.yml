notes:
- Flagship annual conference of the IEEE Sensors Council; 2026 is the 25th edition (first held in 2002)
- Rotates worldwide (Dallas 2022, Vienna 2023, Kobe 2024, Vancouver 2025, Rotterdam 2026, Sydney 2027)
- "Option A: regular conference paper (max 3 pages, a 4th page allowed for references only) that goes to IEEE Xplore"
- "Option B: 4-page paper submitted earlier to a special issue of IEEE Sensors Letters, presented in a special session"
- Papers not presented onsite may be removed from IEEE Xplore
- Top papers are invited to a special issue of the IEEE Sensors Journal
- Has a live demo track, focused sessions, tutorials, workshops and student competitions
- Sensors venue outside the usual CS rankings, not listed in ICORE2026
