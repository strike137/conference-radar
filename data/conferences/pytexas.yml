notes:
- Annual regional conference of the Python community in Texas, held nearly every year since 2007; 2026 was the 20th edition
- Run by community volunteers under the PyTexas Foundation, which was formed out of the conference in 2014
- Single track, about 250 attendees; 289 tickets sold in 2026 (sold out), 59% first time attendees
- Held at the Austin Central Library in downtown Austin every year since at least 2023, in April before PyCon US
- One CFP on Pretalx covers 25 minute talks, 3 hour tutorials (500 USD honorarium) and the Python Community Leadership Summit co-hosted with Black Python Devs (new for 2027)
- In-person talks only; no papers or proceedings
