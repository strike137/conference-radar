notes:
- Smaller commercially run symposium on electrical, electronics and information engineering; many power systems topics and IEEE PES technical co-sponsorship
- Proceedings publisher changes by year (ACM ICPS 2021, IEEE 2022, IET 2023, IEEE 2024, Springer 2025, IEEE 2026)
- 2026 proceedings published by IEEE (ISBN 979-8-3195-2350-1) and submitted to IEEE Xplore, Ei Compendex and Scopus
- Online in 2021 and 2022; Hangzhou 2023, Leicester UK 2024, Taizhou 2025, Shenyang 2026
- Full papers reviewed on a rolling basis; abstract-only submissions possible
- Not listed in the CORE portal (ICORE2026)
