notes:
- Biennial (even years) conference on language resources, corpora, datasets and evaluation, organized by ELRA
- High acceptance (about 53% in 2026); good venue for dataset and resource papers
- 2024 edition was held jointly with COLING (LREC-COLING 2024, Turin)
- Direct submission via START (not ARR); oral and poster papers appear in the same proceedings
- LREC 2028 host not chosen yet; ELRA called for expressions of interest (2028 or 2030) in 2026
