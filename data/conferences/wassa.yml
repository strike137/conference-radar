notes:
- Workshop on sentiment, emotion, subjectivity, irony, personality and social media analysis, including affective
  uses of LLMs
- Held since 2010, mostly annual (no edition in 2020 or 2025); follows its host conference (EACL 2021 online, ACL 2022
  Dublin, ACL 2023 Toronto, ACL 2024 Bangkok, EACL 2026 Rabat, COLING 2027 Macau)
- Proceedings in the ACL Anthology (23 papers in 2026, 53 in 2024, 61 in 2023)
- Long and short research and demo papers, double-blind via OpenReview; also accepts ARR-reviewed papers and allows
  parallel submission to another venue
- 2026 edition was a half-day workshop; shared tasks run in some years (none in 2026)
- Not ranked in ICORE2026 and not on the CCF list
