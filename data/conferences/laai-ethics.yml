notes:
- Latin American conference on ethical, responsible and inclusive AI, organized at the Computing Institute of
  Universidade Federal Fluminense (UFF) in Niterói, Brazil; 2nd edition in 2026
- First edition held 27 to 29 November 2024 at UFF (hybrid); no edition in 2025
- Short papers of up to 4 pages of main text plus 1 page of mandatory ethical considerations, references extra, in the
  SBC template; Portuguese, Spanish or English
- Anonymized submissions through Microsoft CMT; generative AI use statement mandatory and LLM-generated text banned
- Accepted papers published with DOI in the proceedings in SBC OpenLib (SOL); at least one author must register and
  present
- Interdisciplinary audience (computing, law, health, philosophy, communication)
- Not listed in CORE ICORE2026
