notes:
- Annual radio science conference of the German URSI committee, covering all URSI Commissions (metrology, fields and waves, radio communication and signal processing, propagation, remote sensing, radio astronomy and others)
- Held every September at the Old Townhall in Miltenberg, Germany
- English and German, English preferred
- Talks are selected from abstracts of up to 500 words; authors may then submit an optional 4-page IEEE-style paper after the conference, which is peer reviewed and sent to IEEE Xplore
- Young Scientist Awards for researchers born in 1990 or later; a free pre-conference radar training workshop for early-stage researchers
- Radio science venue outside the usual CS rankings, not listed in ICORE2026
