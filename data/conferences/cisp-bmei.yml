notes:
- Combined image and signal processing (CISP) and biomedical engineering and informatics (BMEI) congress held in China
- CISP and BMEI ran as two separate co-located conferences from 2008 to 2015 and merged into one congress in 2016
- Proceedings in IEEE Xplore; the site says all papers from 2008 to 2025 are indexed (EI Compendex, Scopus, CPCI)
- Technically co-sponsored by IEEE EMBS; extended best papers considered for SCI journal special issues
- Several submission rounds with rolling extensions; the 2026 call stayed open until about ten days before the event
- No page limit for the initial submission; registration covers 6 pages
- "Fee: US$500 for the first paper, US$460 for each further paper by the same first author, US$80 per extra page (2026)"
- Not listed in CORE ICORE2026 or the CCF 2026 list
