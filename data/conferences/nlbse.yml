notes:
- One-day ICSE workshop on NLP and LLM techniques for software engineering artifacts (requirements, issues, code comments, documentation)
- Held with ICSE every year since 2022; Melbourne 2023, Lisbon 2024, Ottawa 2025, Rio de Janeiro 2026 (5th edition), Dublin 2027
- Full, education and replication papers up to 8 pages, short and demo papers up to 4, position papers up to 2 (all including references); anonymized submissions via HotCRP
- Hosts tool competitions (code comment classification, skill classification) with 4-page competition papers
- 2026 proceedings published in the ACM Digital Library as "Proceedings of the 5th International Workshop on Natural Language-based Software Engineering"
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
