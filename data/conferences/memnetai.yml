notes:
- New workshop on memory-semantic fabrics (CXL, NVLink-class scale-up fabrics, rack-scale memory pooling) for AI systems,
  co-located with ACM SIGCOMM; 1st edition at SIGCOMM 2026 in Denver
- Workshop papers are published in the SIGCOMM proceedings in the ACM Digital Library unless opted out
- Regular papers up to 6 pages excluding references and appendices; 2-page extended abstracts presented as lightning
  talks or posters, which can opt out of the proceedings; double-blind
- Half-day workshop with a keynote and a panel; four papers in the 2026 program
- Not listed in the CORE portal (ICORE2026)
