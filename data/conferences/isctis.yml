notes:
- Held in China every year since 2021 (Guilin 2021 and 2022, Chengdu 2023, Xi'an since 2024 at Xi'an Eurasia University)
- Proceedings in IEEE Xplore for 2021 and 2023 to 2026; the 2022 volume was published by SPIE; all indexed in EI Compendex and Scopus per the site
- Smaller commercially supported Chinese conference; submission and registration through the AiScholar (ais.cn) system
- Papers reviewed by two or three reviewers; presenter and listener options without publication
- About 200 participants in 2026 and about 300 in 2025 (hybrid), per the site
- Not listed in CORE ICORE2026 or the CCF 2026 list
