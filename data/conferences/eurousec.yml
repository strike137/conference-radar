  conference_months: [9, 10]
links:
  website: https://eurousec2025.cis.strath.ac.uk/
notes:
- European sister event of USEC (NDSS) in the USEC family; forum on human factors in security and privacy
- Research track for full papers (up to 16 pages) and short papers (up to 8 pages); SoK and replication studies welcome
- Double-blind review by at least two reviewers; decisions are accept, shepherding or reject
- 2025 papers handled by IEEE CPS and submitted for inclusion in IEEE Xplore; 2024 proceedings were in the ACM ICPS
- In-person presentation required; two-day event held in Europe (Manchester, UK in 2025)
- Not listed in the CORE portal (ICORE2026); much smaller than SOUPS (CORE A)
