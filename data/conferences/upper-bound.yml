notes:
- Four-day AI conference run by Amii at the Edmonton Convention Centre, Edmonton, Alberta, Canada, every May
- Grew out of AI Week 2022; renamed Upper Bound in 2023, with about 7,200 participants in 2025 and over 11,000 in 2026
- Mixes AI research talks with business adoption, startups and a career fair; more than 200 sessions on several stages
- Speakers are hand-picked and invited; there is no open call for papers and no proceedings
- Main-stage sessions are posted on YouTube
- Amii talent bursaries cover passes and travel stipends for graduate students, postdocs and early-career researchers
- "2027 pre-sale pass: 375 CAD (four days)"
