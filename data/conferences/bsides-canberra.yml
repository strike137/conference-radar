notes:
- Volunteer-run technical hacker conference held each September at the National Convention Centre, Canberra (9th
  edition in 2026; no event in 2020 or 2022)
- Organizers cite 3,500+ delegates and the largest on-prem CTF in Australia
- Main Track, Off-Main Track and Careers Village talks (25 or 55 min) plus villages and workshops; first-time speakers
  explicitly encouraged; no pay-to-speak
- Assistance Program covers entry, and for some applicants flights and 3 nights of lodging, for people based in
  Australia or New Zealand
- No proceedings; talks are recorded and posted on YouTube
