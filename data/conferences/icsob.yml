notes:
- Multidisciplinary conference on software-intensive business (software product management, ecosystems and platforms, entrepreneurship, cloud, AI-native software business)
- Draws on software engineering, information systems, business and economics
- Proceedings in Springer LNBIP, indexed in Scopus and DBLP
- Full research papers 15 pages, short position and research-in-progress papers 6 pages; double-blind review with at least three reviewers
- Also has a poster and demo track, a PhD retreat and a workshop
- Held in Europe (Utrecht 2024, Stuttgart 2025, Gothenburg 2026)
- 2026 research paper deadline was extended twice (July 20 -> August 7)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
