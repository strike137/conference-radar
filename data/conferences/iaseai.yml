notes:
- Annual interdisciplinary conference on AI safety and ethics, covering technical, policy and ethics research
- First edition at OECD Headquarters in Paris in February 2025; 2026 and 2027 editions at UNESCO House, Paris
- Proceedings of IASEAI Conference published by AAAI Press on AAAI OJS; IASEAI'26 is Vol. 2 with 57 papers
- Double-blind review with author response; papers can be archival (in the proceedings) or non-archival (presentation only)
- Besides papers, there are talk proposals, workshops and (from 2027) a model policy track
- Attendance is by invitation; the submitting author of an accepted paper is invited to attend and present in person
- "IASEAI'26 fees: 750 USD for-profit, 525 USD nonprofit, 325 USD student"
