notes:
- Annual smart city workshop held with The Web Conference (WWW) every year since 2015 (Florence), named AW4City until 2019
- Chaired by Leonidas Anthopoulos (University of Thessaly), Marijn Janssen (TU Delft) and Vishanth Weerakkody (University of Bradford)
- Follows WWW around the world (Lyon 2022, Austin 2023, Singapore 2024, Sydney 2025, Dubai 2026, Dublin 2027)
- Theme changes each year; 2026 was data-driven smart cities, 2027 is the Web for AI-driven citiverse
- "Papers up to 12 pages in ACM format (8 main + 2 appendix + 2 references), not anonymized, submitted via the WWW OpenReview"
- Accepted papers appear in The Web Conference Companion Proceedings in the ACM Digital Library
- Selected papers are extended in journal special issues
- Not listed in the CORE ICORE2026 portal
