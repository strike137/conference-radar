notes:
- Main conference on web engineering; 2026 was the 26th edition
- Proceedings in Springer LNCS; best papers invited to a special issue of the Journal of Web Engineering
- Research track with full papers (15 pages) and new ideas papers (8 pages) in LNCS format; single-blind review
- Also has industrial, poster and demo, workshop, tutorial and PhD symposium tracks
- Held in Europe in recent years (Tampere 2024, Delft 2025, Lyon 2026); Daejeon, Korea in 2019
- CORE B (ICORE2026), CCF C
