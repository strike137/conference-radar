notes:
- Workshop on energy-efficient and sustainable software design, maintenance and evolution, green performance testing, green DevOps and green AI
- 1st edition held with SANER 2026 in Limassol, Cyprus; 9 accepted papers
- Papers appear in the SANER 2026 companion proceedings (SANER-C) in IEEE Xplore
- Full papers up to 8 pages, short papers up to 4, position papers up to 2, double-anonymous review, submitted via the SANER EasyChair
- Linked special issue on Green Software Evolution in Information and Software Technology (open until 2026-08-28)
- Sponsored by the Italian PRIN project RECHARGE
- Not listed in the CORE portal (ICORE2026)
