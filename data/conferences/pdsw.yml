links:
  website: https://www.pdsw.org/index.shtml
notes:
- One-day workshop on parallel storage, file systems, I/O and data management for HPC and AI, held with SC; 2026 is the 11th edition under the PDSW name
- Successor of the Petascale Data Storage Workshop (2006 to 2015) and the DISCS workshop (2012 to 2015), which ran together as PDSW-DISCS from 2016 to 2018
- In cooperation with IEEE Computer Society and ACM
- Regular papers of up to 6 pages, double-anonymous review; an Artifact Description appendix is mandatory
- Accepted papers appear in the SC workshop proceedings; IEEE template in 2026, ACM template in 2025
- Work-in-progress session with one-page abstracts and 5-minute talks; WIP papers are not in the proceedings
- Held at SC every year in the USA (St. Louis 2025, Chicago 2026)
- Not listed in CORE ICORE2026
