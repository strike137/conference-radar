notes:
- Main venue for functional programming, sponsored by ACM SIGPLAN
- Papers are published in the PACMPL issue ICFP (Proceedings of the ACM on Programming Languages) in the ACM DL
- Double-blind review in two stages; accepted papers are conditionally accepted and must be revised with a cover letter
- Up to 25 pages for full papers and functional pearls, 12 pages for experience reports, excluding bibliography
- Co-located with the Haskell Symposium and many workshops (OCaml, ML Family, Erlang, Scheme, FARM, miniKanren, ...)
- Held in Ljubljana 2022, Seattle 2023, Singapore 2025 (with SPLASH), Indianapolis 2026 and Nijmegen 2027
- CORE A (ICORE2026), CCF B
