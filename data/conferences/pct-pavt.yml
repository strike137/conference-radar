notes:
- Russian national conference with international participation on parallel, supercomputing and neural network technologies, held yearly since 2007
- Founded by the Russian Ministry of Science and Higher Education and the Supercomputing Consortium of Russian Universities; run with South Ural State University
- Held at a different Russian university each year (2025 HSE Moscow, 2026 Ufa, 2027 Bauman MSTU Moscow)
- Full papers (12 to 15 pages, English) are reviewed by three experts and published in Springer Communications in Computer and Information Science
- Short papers and poster descriptions in Russian or English go to a separate collection indexed in RINC
- Languages are Russian and English; a supercomputing exhibition runs alongside
- Not listed in the CORE ICORE2026 portal
