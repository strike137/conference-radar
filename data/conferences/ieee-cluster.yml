notes:
- IEEE Computer Society conference series on cluster computing and HPC systems, sponsored by TCHPC; 28th edition in
  2026
- Proceedings in IEEE Xplore; accepted papers must be presented in person to be included
- CCF B but only CORE C in ICORE2026; well known mid-level HPC systems venue
- Four topic areas (applications and algorithms; architecture, networks and management; programming and system
  software; data, storage and visualization); dual-anonymous review, 10 pages excluding references
- Abstract and full paper deadlines, author rebuttal period, plus a separate poster track and co-located workshops
- Location rotates worldwide (2021 Portland, 2022 Heidelberg, 2023 Santa Fe, 2024 Kobe, 2025 Edinburgh, 2026
  Alexandria, Virginia)
