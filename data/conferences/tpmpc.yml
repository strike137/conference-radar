notes:
- Standalone multi-day workshop on secure multi-party computation, bringing together theorists and practitioners; series started in Aarhus in 2012
- Usually every second year in Aarhus and somewhere else in the other years (Darmstadt 2024, Bangalore 2025, Aarhus 2026)
- Program of invited talks, 20 to 30 minute contributed talks and a rump session; 161 participants, 12 invited and 25 contributed talks in 2024
- Contributed talks submitted by email with a 2 page summary in LNCS format, not anonymized; recently published papers and work in progress are both welcome
- No proceedings, so talks do not count as a publication
- Limited student stipends for travel
- Not listed in ICORE2026 or the CCF 2026 list
