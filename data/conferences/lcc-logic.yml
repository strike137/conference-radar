notes:
- Workshop on the interplay of logic and computational complexity (implicit computational complexity, bounded arithmetic, finite model theory, proof complexity)
- Series since 1994 (as ICC from 1998 to 2003); usually affiliated with LICS, ICALP, CSL or FLoC
- Recent editions in Reykjavik 2017, Oxford 2018, Patras 2019, Saarbruecken 2020, online 2022 and Lisbon 2026 (FLoC); no edition between 2023 and 2025
- Submissions are 2 to 4 page abstracts; no formal peer review, the program committee only checks relevance
- No published proceedings; program and extended abstracts appear in a booklet on the workshop website, so work can also be submitted elsewhere
- Not listed in ICORE2026 or the CCF 2026 list
