notes:
- Annual practitioner symposium in Matsuyama (Dogo), Ehime, held since at least 2012 (named Information Security
  Symposium Dogo until 2015); aligned with Japan's Cybersecurity Month (Feb to Mar), except June in 2021 to 2023
  and online in 2020 and 2021
- 'No paper submissions: keynote by the MIC Director-General for Cybersecurity, talks by National Police Agency
  officials, panels, sponsor exhibits and evening ''night sessions'' for discussion'
- 'Venue: Ehime University (2024, 2025) and Matsuyama University (2026, 2027); earlier editions used the Shiki Memorial
  Museum; partly hybrid with online streaming'
- Executive committee includes MIC Shikoku Bureau, Ehime Prefectural Police, Ehime Prefecture, Matsuyama City and
  local telecom and CATV companies; continuing education (CPE) points available
