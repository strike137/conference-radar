notes:
- First edition in 2026, a one-day workshop at AACL-IJCNLP 2026 in Hengqin (Zhuhai), China
- Topics are security, safety and privacy of speech and audio models (adversarial audio, deepfakes, backdoors, privacy leakage, jailbreaks of audio-language models)
- Archival track with long (8 pages) and short (4 pages) papers, double-blind review on OpenReview, ARR commitment accepted
- Non-archival track for papers already accepted elsewhere
- Proceedings in the ACL Anthology (2026.trustaudio-1)
- Invited speakers in 2026 were Hung-yi Lee, Shinji Watanabe and Junichi Yamagishi
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
