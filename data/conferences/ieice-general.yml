notes:
- Organized by IEICE; the larger of its two yearly conferences, held every March at a university that rotates around
  Japan
- No peer review; general session paper is 1 page with a 10 min talk + 5 min Q&A; symposium and poster sessions
  allow 2 pages
- 'Covers all IEICE societies: communications, electronics, information and systems, fundamentals (security and
  cryptography included)'
- Japanese or English; presenters must present on site; in 2026 the GlobalNet Workshop and an International Reception
  were held on the first day, which had no regular sessions
- Application and manuscript share one strict deadline in early January (17:00)
