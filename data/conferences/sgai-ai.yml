notes:
- Run by the BCS (British Computer Society) Specialist Group on AI; 46th edition in 2026
- Held every December at Peterhouse College, Cambridge, UK
- Proceedings in Springer LNAI; full papers up to 14 pages (oral), short papers up to 6 pages (poster)
- Technical stream and application stream; best paper awards in each, best papers invited to a journal special issue
- "CORE ICORE2026: National: UK"
- Preceded by FAIRS, a one-day research student forum (35 GBP + VAT in 2026); at least one author must present in person
