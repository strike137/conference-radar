notes:
- Developer-first practitioner conference run by Infobip, a Croatian communications platform company
- Held every September in Zadar, Croatia, by the Adriatic Sea; three days of talks, workshops and side events
- Topics include AI, developer tools, infrastructure, distributed systems, cloud and DevOps, APIs, data systems and security
- Organizers report 4,000+ developers and 100+ speakers
- Speakers apply through a call for proposals on Sessionize; no papers or proceedings
