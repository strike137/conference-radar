notes:
- Held as a workshop of ARES (International Conference on Availability, Reliability and Security) in Europe every August
- Formed for ARES 2026 by merging the ARES workshops EDId (digital identities) and RDGPT (responsible data governance
  and privacy)
- ARES papers including workshop papers are published in Springer LNCS since 2025; workshop papers up to 18 pages
  including references, double-blind review
- Digital identity protocols (OAuth, OpenID Connect, W3C VC/DID, eIDAS wallets, FIDO2 passkeys), privacy-enhancing
  technologies, data governance and GDPR / EU AI Act compliance
- 2026 chairs from FBK (Italy), Universität der Bundeswehr München (Germany), University of Oslo and University of
  Agder (Norway) and Maynooth University (Ireland)
- Not listed in CORE ICORE2026
