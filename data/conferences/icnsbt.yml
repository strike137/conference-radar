id: icnsbt
name: ICNSBT
full_name: International Conference on Network Security and Blockchain Technology (ICNSBT)
type: conference
tier: minor
areas: [security, networking]
region: south-asia
language: english
frequency: annual
organizer: Computer Society of India (CSI) Kolkata Chapter with a co-organizer that changes each edition (IETE Kolkata
  Centre in 2026; Haldia Institute of Technology in 2025; Jalpaiguri Government Engineering College in 2024; Vidyasagar
  University in 2023)
organizer_country: [india]
proceedings: Springer LNNS
archival: true
indexing: [Springer LNNS]
rank:
  core: Unranked
fee: 100 USD foreign author, 75 USD foreign attendee (2026, incl. GST); INR 6000 Indian non-member author, INR 5500
  CSI/IETE member author
typical:
  deadline_months: [2, 7, 11]
  conference_months: [1, 6, 9]
links:
  website: https://csikolkata.org/ICNSBT2026/
notes:
- Organized by the CSI Kolkata Chapter and always held in West Bengal, India (Kolkata, Haldia, Jalpaiguri, Midnapore);
  1st edition at ISI Kolkata in Dec 2021, no 2022 edition
- Proceedings in Springer Lecture Notes in Networks and Systems (LNNS) for every edition; desk review by the editorial
  board and iThenticate plagiarism screening
- Anonymous submission, max 12 pages (extra charge beyond 10 pages), similarity index below 15% (2026)
- Month varies a lot between editions (Dec 2021, Mar 2023, Jun 2024, Jan 2025, Sep 2026); the 2026 edition was held
  as the 69th Annual IETE Convention
- Mainly offline; online presentation allowed only for some participants with valid reasons
