notes:
- CVPR workshop on multi-view learning for 3D and 4D understanding and generation, world models, NeRFs and Gaussian splatting
- 1st edition at CVPR 2023, 2nd at CVPR 2024, 3rd at CVPR 2026 in Denver (no 2025 edition)
- Archival and non-archival tracks; papers up to 8 pages excluding references in CVPR format, double-blind review via CMT
- Archival papers go into the CVPR 2026 Workshops proceedings; non-archival track accepts previously published work
- Best poster award with prize money
- Not listed in ICORE2026 or the CCF list
