notes:
- Broad IEEE forum bringing academia and industry together; tracks change every year (AI applications in 2025,
  clean energy and Industry 4.0 in 2026)
- Flagship conference of the IEEE Italy Section from 2015, made an IEEE Region 8 portfolio conference in 2021
- Held mostly in Italy (Torino, Bologna, Modena, Palermo, Firenze, Lecco); 2022 Paris, 2025 Gammarth (Tunisia),
  2026 Espoo (Finland), 2027 Catania; no edition in 2020 or 2023
- Papers of 4 to 6 pages in IEEE two-column format; accepted and presented papers are submitted to IEEE Xplore
- Separate later deadline for special session papers
- Not listed in ICORE2026 or the CCF 2026 list
