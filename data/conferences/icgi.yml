notes:
- Main venue of the grammatical inference community (machine learning meets formal language theory); held since 1993
- Roughly every two to three years (2014, 2016, 2018, 2020/21, 2023, 2026)
- Regular papers published in PMLR (2023 -> Volume 217); extended abstracts of published work and work in progress papers are not published
- Double-blind review; up to 12 pages in the JMLR style
- Rotates worldwide (Kyoto 2014, Delft 2016, Wroclaw 2018, New York hybrid 2020/21, Rabat 2023, Delft 2026)
- 2026 edition was postponed from April to October 2026 with a new call for papers
- 2026 registration 450 EUR regular, 350 EUR student, including the conference dinner
- Not found in the CORE ICORE2026 portal or the CCF 2026 list
