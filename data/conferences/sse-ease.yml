notes:
- One-day workshop on empirical software security engineering (secure requirements, design, coding, testing, deployment, metrics, SLRs), co-located with EASE
- Held with EASE in Glasgow 2026, Istanbul 2025, Salerno 2024, Oulu 2023, Gothenburg 2022, online 2020 and 2021
- Papers in ACM format; workshop papers go into the EASE conference companion proceedings
- Chairs from King Fahd University of Petroleum and Minerals, Saudi Arabia
- Not to be confused with IEEE SSE (Software Services Engineering)
- Not listed under this name in the CORE portal (ICORE2026)
