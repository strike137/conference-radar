notes:
- CVPR workshop on fairness, bias, privacy, copyright, hallucination and other responsible AI issues of visually grounded generative models
- 1st edition at CVPR 2024 in Seattle, 2nd at CVPR 2025 in Nashville; not in the CVPR 2026 workshop list
- Short papers of 4 pages excluding references in CVPR format, double-blind review via Microsoft CMT
- Authors can opt into the CVPR Workshops proceedings (new research only); other papers are linked on the workshop page
- 3 papers on CVF Open Access for 2025, 8 for 2024
- Not listed in ICORE2026 or the CCF list
