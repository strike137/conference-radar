notes:
- Workshop on graph processing systems, with a 2026 focus on causal and temporal graphs for system design
- Started in 2023; 2023 and 2024 editions were co-located with ACM/SPEC ICPE with papers in the ICPE proceedings
- Co-located with Euro-Par since 2025 (Dresden 2025, Pisa 2026); papers go to the Euro-Par workshops volume of Springer LNCS
- Full papers (10 to 12 pages, LNCS), short papers (6 pages), 2-page extended abstracts on the workshop challenges, and datasets
- Submission through the shared Euro-Par workshops EasyChair
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
