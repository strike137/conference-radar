notes:
- Workshop on high-performance eScience tools, scientific workflows, FAIR data and provenance across HPC, cloud and edge
- Co-located with Euro-Par (Madrid 2024, Dresden 2025, Pisa 2026)
- Revised papers appear in the Euro-Par workshops volume of Springer LNCS; up to 12 pages in LNCS format
- Authors of accepted 2026 papers were invited to extend them for a journal special issue on scientific workflows in the compute continuum
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
