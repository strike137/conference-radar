notes:
- Full-day workshop at ESWEEK on integrating AI into embedded and cyber-physical systems (efficient inference, real-time execution, safety, certification, security)
- IFIP-sponsored; proceedings in the Springer IFIP Advances in Information and Communication Technology (AICT) series, organized independently from ESWEEK
- Full papers up to 12 pages, short papers up to 10 pages in the Springer IFIP layout; blind review; submission via EasyChair
- Site hosted on iess.org, the site of the IFIP International Embedded Systems Symposium (IESS)
- 2026 edition in Barcelona with ESWEEK is the only edition found; follows ESWEEK, which rotates worldwide
- Not listed in the CORE portal (ICORE2026) or the CCF list
