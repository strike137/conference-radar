notes:
- Symposium on computational linguistics and digital humanities for Sanskrit (Classical and Vedic), Prakrit, Pali and Buddhist Hybrid Sanskrit
- Started in 2007 at INRIA Paris; editions in 2007, 2008, 2009, 2010, 2013, 2019, 2024, 2026 and 2027, all in India since 2009
- Proceedings in the ACL Anthology since 2019 (17 papers in 2026, 10 in 2024); the first four editions appeared in Springer LNCS/LNAI
- Full papers up to 20 pages with the ISCLS template, plus 2-page demos; submissions via Microsoft CMT
- 9th edition on January 20-22, 2027 at Deccan College, Pune; 8th edition on March 9-11, 2026 at IIT Roorkee
- Steering committee members from India, Canada, France, Switzerland and the USA
- Not ranked in ICORE2026 and not on the CCF list
