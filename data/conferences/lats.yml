notes:
- IEEE test symposium for Latin America; the official site links IEEE CEDA and IEEE TTTC as sponsors
- Covers electronic circuit and system test, reliability, fault tolerance, radiation effects and hardware security
- Accepted papers are submitted to IEEE Xplore; best papers of the 2027 edition invited to IEEE Design&Test
- Extended abstracts (1 to 3 pages), full papers (6 pages) or late contributions (2 pages) in IEEE format
- Hosts a semi-final of the TTTC E. J. McCluskey Best Doctoral Thesis Award contest
- Held in a different Latin American city each year (Florianopolis, Brazil 2026; Lima, Peru 2027)
- Not listed in the CORE ICORE2026 portal
