notes:
- WACV workshop on image and video analysis for winter and mountain sports (athlete pose, performance analysis, broadcast video, snow and ice scenes)
- Held with WACV in 2022, 2023, 2025 and 2026 (no 2024 edition); 2026 was the 4th edition
- Accepted full papers (up to 8 pages plus references) go into the WACV workshop proceedings in IEEE Xplore (4 papers on CVF Open Access in 2026)
- Separate non-archival extended abstract track (up to 4 pages) for companies and practitioners
- Double-blind review through OpenReview
- Hosts the SkiTB tracking challenge in 2026
- Not listed in ICORE2026 or the CCF list
