  conference_months: [5, 9, 10]
links:
  website: https://gosim.org/
notes:
- Open-source developer conference with a focus on open AI models, agentic AI, robotics and edge systems
- Held twice a year, one edition in China and one in Europe (Paris since 2025), plus workshops, hackathons and Spotlight project events
- Past editions Shanghai 2023, Delft 2024, Beijing 2024, Paris 2025, Hangzhou 2025, Paris 2026 (STATION F), Shenzhen 2026
- Shenzhen 2026 reported over 2,500 attendees
- Talks chosen through a call for proposals; no papers and no proceedings
- Community based in Singapore according to the founders page; different from GOTC (OSCHINA)
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
