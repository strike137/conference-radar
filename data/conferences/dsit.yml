notes:
- Annual since 2018 (Singapore 2018, Seoul 2019, online 2020 and 2022); in China otherwise (Shanghai 2021 and 2023, Nanjing 2024, Beijing 2025, Taicang 2026)
- 2026 edition organized by the School of AI and Advanced Computing at XJTLU, technically sponsored by IEEE and the IEEE Nanjing Section
- Proceedings in IEEE Xplore since 2022 (ACM 2018 to 2021), indexed by EI Compendex and Scopus
- Double-blind review by at least three reviewers via Microsoft CMT, per the site
- Moved from a July slot (2018 to 2023) to November or December since 2024
- Presenter-only and listener registration offered
- Conference secretary contact uses a Hong Kong phone number; member pricing offered via ISAC
- Not listed in CORE ICORE2026 or the CCF list
