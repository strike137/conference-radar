notes:
- One-day workshop at the HiPEAC conference on hardware and software security (hardware Trojans, IP piracy, side
  channels, secure architectures and operating systems)
- Journal-first; papers are submitted to IEEE Embedded Systems Letters (ESL) with a box ticked to present at SeHAS,
  and the program is built from papers accepted in ESL
- Also features a keynote, invited talks and a panel discussion
- Moves with HiPEAC (Glasgow 2027); 9th edition in 2027, earlier editions ran as Secure Hardware, Architectures,
  and Operating Systems
- Not listed in CORE ICORE2026 or the CCF list
