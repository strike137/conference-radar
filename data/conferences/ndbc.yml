notes:
- China's main national database conference, started in 1977 and run by the CCF Technical Committee on Databases since 1999; 2026 is the 43rd edition
- No conference proceedings; accepted papers are recommended to Chinese journals and to the English journals Data Science and Engineering and International Journal of Software and Informatics
- Accepts Chinese and English papers (up to 8 pages in Chinese); anonymous review
- Includes a system demo track, a graduate student mentoring workshop and many industry forums; 2026 added a poster session
- Hosted by a different Chinese university each year (Weihai 2022, Guiyang 2023, Urumqi 2024, Changchun 2025, Shanghai 2026)
- About 680 registered attendees in 2025
- Not ranked in CORE ICORE2026; not on the CCF 2026 recommended list
