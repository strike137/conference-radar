notes:
- Practitioner IT security conference run by the German security consultancy ERNW, held every June in Heidelberg, Germany
- Two days of on-site trainings followed by the main conference; talks in three tracks (Attack & Research, Defense &
  Management, Active Directory & Entra ID Security)
- Talks are 35 minutes plus 5 to 10 minutes of Q&A; Attack & Research talks are expected to include live demos
- First speaker gets travel up to 750 EUR within Europe or 1800 USD internationally plus up to four hotel nights;
  second speaker gets hotel only
- Conference venue is halle02 (Zollhofgarten 2, Heidelberg)
- Long running series; the archive lists editions back to TROOPERS08
