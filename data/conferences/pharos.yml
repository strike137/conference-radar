notes:
- Workshop and competition on trustworthy AI for medical imaging and healthcare (CT, MRI, X-ray, EHR), with Multi-Source COVID-19 Detection and Fair Disease Diagnosis challenges
- Sixth edition of the AI-MIA series, held with ICCV 2021, ECCV 2022, ICASSP 2023, CVPR 2024, ICCV 2025 (PHAROS-AFE-AIMI) and CVPR 2026 (PHAROS-AIF-MIH)
- Organized in connection with the PHAROS AI Factory, one of the first seven AI Factories selected and funded by the European Union
- Full papers of 5 to 8 pages in the host conference style, double-blind review through Microsoft CMT
- 43 papers in the CVPR 2026 workshop proceedings, 13 in ICCV 2025
- Not listed in ICORE2026 or the CCF list
