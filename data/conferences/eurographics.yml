id: eurographics
name: Eurographics
full_name: Annual Conference of the European Association for Computer Graphics (EUROGRAPHICS)
type: conference
tier: major
areas: [vision, general]
region: europe
language: english
frequency: annual
organizer: Eurographics Association, with a rotating local host institution
organizer_country: [europe]
proceedings: Computer Graphics Forum (full papers, special issue) and Eurographics Digital Library (short papers, STARs, tutorials, education papers)
archival: true
rank:
  ccf: B
typical:
  deadline_months: [9, 10]
  conference_months: [4, 5]
links:
  website: https://eg2027.isti.cnr.it/
  dblp: https://dblp.org/db/conf/eurographics/
notes:
- Flagship annual conference of the Eurographics Association, the main European general computer graphics venue
- Full papers go through a double-blind two-step review with rebuttal and a revision round and are published in a special issue of Computer Graphics Forum
- Short papers (up to 4 pages) have a separate later deadline and appear in the Eurographics Digital Library
- Also has STARs (state-of-the-art reports), tutorials, education papers, posters and a doctoral consortium
- At least one author must present each paper in person
- Held in Europe (Saarbruecken 2023, Limassol 2024, London 2025, Aachen 2026, Lucca 2027; Zaragoza 2028 and Erlangen 2029 announced)
- Best papers are invited to a Best of Eurographics session at SIGGRAPH (since 2025)
- Not listed in ICORE2026; CCF B (computer graphics and multimedia)
