id: buildsec
name: BuildSEC
full_name: International Conference on Cybersecurity, Privacy, and Digital Trust
type: conference
tier: minor
areas: [security]
region: south-asia
language: english
frequency: annual
organizer: BuildSEC steering committee (chair at UNSW Sydney) with a host university each year (IIIT Delhi 2024, IIT Patna
  2025, University of Peradeniya 2026)
organizer_country: [australia, india]
proceedings: IEEE Xplore
fee: 400 USD non-member, 300 USD IEEE member, 225 USD IEEE student member (2026, international author registration)
typical:
  deadline_months: [7, 8, 9]
  conference_months: [12]
links:
  website: https://buildsec.org/
notes:
- Started in 2024 as the Conference on Building a Secure and Empowered Cyberspace (BuildSEC); renamed International
  Conference on Cybersecurity, Privacy, and Digital Trust for the 3rd edition in 2026
- Australia and India led; steering committee chaired from UNSW Sydney, with members from IIIT Delhi, IIT Patna and
  the University of New Brunswick
- Held in South Asia every December so far (New Delhi 2024, Patna 2025, Peradeniya, Sri Lanka 2026)
- Proceedings of 2024 and 2025 are in IEEE Xplore; 2026 is technically sponsored by the IEEE Sri Lanka Section
  (2024 and 2025 by IEEE SSIT)
- Double-blind review; regular papers 4 to 8 pages, short papers up to 6 pages, work-in-progress and demo papers up
  to 4 pages, IEEE two-column format
- At least one author per accepted paper must register and attend in person
- Young venue; not listed in ICORE2026 or the CCF list
