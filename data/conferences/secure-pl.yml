notes:
- Oldest cybersecurity conference in Poland, run by CERT Polska at NASK; the 2026 meeting was the 29th edition
- Practitioner and policy event in Polish with talks, panels, lightning talks and the launch of the CERT Polska annual threat report
- Speakers are mostly invited from CERT Polska, NASK, government and industry; no open call for papers is shown on the site
- 2026 held at the Museum of Polish History in Warsaw; main day on 8 April, closed workshops for entities in the national cybersecurity system on 9 April
- Attendance was free in 2026; no proceedings, talks recorded for YouTube
