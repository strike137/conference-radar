notes:
- Workshop bringing together university researchers who teach performance engineering and industry performance engineers
- Co-located with ACM/SPEC ICPE; 6th edition in Florence 2026, 7th in Gothenburg 2027
- Two-page abstracts, presentations, research, industrial and experience papers, position papers up to 6 pages and experience reports up to 10 pages
- Papers published in the ICPE proceedings by ACM in the ACM Digital Library; a journal special issue call follows
- At least one author must register at the full rate and present
- 2026 keynote by Bjarne Stroustrup
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
