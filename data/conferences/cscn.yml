notes:
- IEEE ComSoc conference bringing together academia, industry and standards bodies on communications and networking
  standards (5G, 6G, IoT, network softwarization, AI/ML for network standards)
- Accepted and presented papers are published in the conference proceedings and submitted to IEEE Xplore; best papers are invited to a
  special issue of IEEE Communications Standards Magazine
- Submission via EDAS; up to 7 pages for review, final 6 pages for long papers, 4 for short papers and 3 for
  Emerging Communication Standards Update papers; also demo, poster, workshop and special session tracks
- Held since 2015 (Tokyo); since 2016 held in Europe (2023 Munich, 2024 Belgrade, 2025 Bologna, 2026 London);
  no 2020 edition and 2021 was virtual
- 2026 edition was co-located with the one6G Summit at the King's College London Strand campus
- Not listed in ICORE2026
