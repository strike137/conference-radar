notes:
- Organized in 2027 by G.T.N. College of Technology, Dindigul, Tamil Nadu (IEEE conference record 71926)
- Proceedings in IEEE Xplore since 2024 (2024 and 2026 linked from the official site); 2027 has an IEEE Xplore compliant ISBN
- 2020 to 2023 proceedings were Springer books (AISC for 2020, LNNS for 2021 to 2023)
- 2023 edition was held in Bangkok, Thailand; IEEE Xplore records 2024 and 2026 in Dhulikhel, Nepal; 2027 is in Dindigul, India
- Host institution changes between editions
- Scope covers image processing, medical imaging, pattern recognition, deep learning and capsule networks
- "Registration 2027: 11700 to 12700 INR for Indian authors, 135 to 175 USD for foreign authors"
- 7th edition in 2027
- Not found in ICORE2026; not on the CCF list
