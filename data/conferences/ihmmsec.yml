notes:
- Formed in 2013 by merging the Information Hiding Workshop (since 1996) and the ACM Multimedia and Security Workshop
  (since 1998)
- Standalone ACM workshop held every June; alternates mostly between Europe and the USA (2023 Chicago, 2024 Baiona,
  2025 San Jose, 2026 Florence)
- 'Topics: steganography and steganalysis, watermarking, multimedia forensics, covert channels, biometrics, deepfake
  analysis'
- Proceedings in the ACM Digital Library; double-blind review, full papers 10 to 12 pages and short papers 4 to 6 pages
  (ACM sigconf)
- Small, focused community; 40 submissions and 20 accepted papers in 2025
- ACM open access from 2026, so authors from institutions outside ACM Open pay an APC (subsidized 250 or 350 USD in
  2026)
- Not the same as IIH-MSP (Intelligent Information Hiding and Multimedia Signal Processing), a separate Asian conference
