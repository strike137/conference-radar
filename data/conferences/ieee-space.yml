notes:
- Interdisciplinary conference on space, aerospace and defence technologies; work should be usable in at least two of the three domains
- Run by the IEEE AESS Bangalore Chapter with IEEE AESS, with IEEE APS and IEEE MTT-S involved; a commercial conference manager (CIM Global) handles logistics
- Held in Bengaluru, India in 2024, 2025 and 2026; the 2027 edition moves to Marina Bay Sands, Singapore
- Papers of 3 to 6 pages in IEEE two-column format, submitted via EDAS; review starts as soon as a paper is submitted
- Accepted papers that are registered and presented are considered for IEEE Xplore; all accepted papers are considered for a special section of IEEE Transactions on Aerospace and Electronic Systems
- Large industry presence with many sponsors and a startup pavilion
- Aerospace and defence electronics venue outside the usual CS rankings, not listed in ICORE2026 or the CCF 2026 list
