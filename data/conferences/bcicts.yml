notes:
- Sponsored by the IEEE Electron Devices Society in cooperation with the IEEE Solid-State Circuits Society and the IEEE Microwave Theory and Technology Society
- Formed in 2018 by merging BCTM (Bipolar/BiCMOS Circuits and Technology Meeting) and CSICS (Compound Semiconductor IC Symposium); pronounced "Be-Six"; 2026 was the ninth edition
- Covers bipolar, SiGe BiCMOS and compound semiconductor (GaN, InP, GaAs) devices and circuits, analog, RF, mm-wave and THz ICs, modeling and device physics
- Up to 4-page paper reviewed by the Technical Program Committee; accepted papers go into the symposium proceedings (digest); a Late Breaking News call follows in August
- Extended versions of selected papers are invited to a special issue of the IEEE Journal of Solid-State Circuits
- Held in the USA every October (Phoenix 2022, Scottsdale 2025, Boston 2026, San Diego 2027) with a short course and primer course on the first day
- Small, industry-heavy device and circuit venue; not listed in ICORE2026 or CCF
