notes:
- Symposium on bipolar, SiGe BiCMOS and compound semiconductor (GaN, InP, GaAs) circuits, devices and technology
- Formed from the merger of IEEE BCTM and IEEE CSICS; 2026 was the ninth edition
- Covers analog, RF, mm-wave and THz ICs, high-speed mixed-signal and optoelectronic ICs, device physics, modeling and
  process technology
- Submissions are 4-page papers; accepted papers go into the Symposium Digest (IEEE copyright) in IEEE Xplore
- Extended versions of selected papers are invited to a special issue of the IEEE Journal of Solid-State Circuits
- Small industry-heavy event with short courses, a primer course and an exhibition; held in the USA (Scottsdale
  2025, Boston 2026, San Diego 2027)
- Late breaking news papers are accepted after the main deadline
- Devices and circuits venue outside the usual CS rankings, not listed in ICORE2026
