id: imav
name: IMAV
full_name: International Micro Air Vehicle Conference and Competition
type: conference
tier: minor
areas: [ai]
region: worldwide
language: english
frequency: annual
organizer: IMAV community (imavs.org) with a rotating host (INSA Strasbourg and ICube 2026, UDLAP and INAOE Puebla 2025, Mobile Robotics Group Sao Carlos 2027)
organizer_country: [international]
proceedings: Open-access proceedings on imavs.org
archival: true
fee: 600 EUR regular early, 300 EUR student early, 1000 EUR regular late (2026)
typical:
  deadline_months: [5, 6]
  conference_months: [9, 11]
links:
  website: https://www.imavs.org/
notes:
- Annual research event on micro air vehicles and small autonomous drones that combines a peer-reviewed conference with indoor and outdoor drone competitions
- Proceedings published as open-access papers on imavs.org with a full proceedings PDF per edition
- Best conference papers invited to journals indexed in the Journal Citation Reports (2025)
- Best paper awards in two categories (methods and algorithms, systems and applications) in 2026
- Recent hosts are Puebla 2021, Delft 2022, Aachen 2023, Bristol 2024, Puebla 2025, Strasbourg 2026 and Sao Carlos 2027
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
