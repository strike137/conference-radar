notes:
- Long-running venue on software engineering education and training (38th edition in 2026)
- Proceedings moved from IEEE to Springer LNCS in 2026; 2025 papers carry IEEE DOIs (10.1109/CSEET66350.2025)
- 2025 edition co-located with ICSE 2025 in Ottawa and replaced the ICSE education track (SEET) that year
- 2026 edition held in Florence alongside QRS 2026, with Huawei as platinum sponsor
- Recent editions in Maui (2022), Tokyo (2023), Wurzburg (2024), Ottawa (2025) and Florence (2026)
- Research papers up to 10 pages plus 2 of references, short papers up to 7 plus 2, industry and experience reports,
  posters and tools, journal-first summaries; at least three reviews per paper
- CORE C (ICORE2026); not on the CCF list
