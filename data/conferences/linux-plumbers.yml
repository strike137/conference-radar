id: linux-plumbers
name: LPC
full_name: Linux Plumbers Conference
type: industry
tier: minor
areas: [systems, networking]
region: worldwide
language: english
frequency: annual
organizer: Linux Plumbers Conference program committee, with the Linux Foundation (registration and sponsorship)
organizer_country: [usa]
proceedings: None (non-archival; slides and videos posted on lpc.events and YouTube)
archival: false
fee: 641.30 EUR in person, 54.45 EUR virtual (2026); 50% hobbyist discount on request
typical:
  deadline_months: [4, 6, 9]
  conference_months: [9, 10, 11, 12]
links:
  website: https://lpc.events/
notes:
- Developer conference for the Linux "plumbing" layer (kernel subsystems, core libraries, toolchains, init systems)
- Tracks include a refereed track (45 minute talks), Kernel Summit, eBPF, networking and toolchains tracks, plus
  3.5 hour microconferences and BoFs
- Program committee selects talks; no papers, slides and video recordings are posted after the event
- Hybrid in 2025 and 2026; in-person registration usually sells out weeks before the event (sold out in August 2026)
- 'Recent venues: Richmond VA 2023, Vienna 2024, Tokyo 2025, Prague 2026'
- Accepted refereed track and Kernel Summit talks get one free pass each
