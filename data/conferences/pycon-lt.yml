notes:
- Lithuanian Python conference of the PyCon family, organized entirely by volunteers
- Billed as the biggest Python and PyData event in the Baltic and Nordic regions, with over 600 attendees and 50+ sessions
- Held in Vilnius since 2019 (SMK venue 2024 to 2026, Hotel Panorama Vilnius in 2027); 17 editions since 2009
- Talks can be in English or Lithuanian
- Talks (30 min), workshops (90 min) and lightning talks (5 min); all Python-related topics welcome
- No papers or proceedings
- Not listed in the CORE ICORE2026 portal
