notes:
- Flagship neural network conference of IEEE CIS and INNS; broad scope and a relatively high acceptance rate compared
  with top ML venues
- In even years it runs inside IEEE WCCI together with FUZZ-IEEE and IEEE CEC (WCCI 2026 in Maastricht)
- 6-page IEEE two-column papers; one regular deadline at the end of January, with a later late-breaking paper call
- Asian editions include WCCI 2024 in Yokohama; IJCNN 2027 is in Cape Town
