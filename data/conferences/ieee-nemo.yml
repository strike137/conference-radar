notes:
- IEEE MTT-S conference on computational electromagnetics, multiphysics modeling, CAD and optimization for RF,
  microwave and terahertz design
- Rotates between Europe, North America and Asia (2023 Winnipeg, 2024 Montreal, 2025 Tianjin, 2026 Valencia)
- Three-page papers, peer reviewed; presented full papers go into IEEE Xplore
- One-page abstracts are also accepted for presentation but are not included in IEEE Xplore
- Authors of presented papers are invited to submit extended versions to special sections of IEEE T-MTT and IEEE J-MMCT
- Submission deadline was extended twice in 2026 (15 February -> 1 March -> 15 March)
- Microwave engineering venue outside the usual CS rankings, not listed in ICORE2026
