notes:
- Annual since 2017 (Cambridge, UK); later editions in Amman, Paris, St. Petersburg, online (2021), Tashkent, Dubai, Marrakesh, Dubai and Izmir
- Proceedings in the ACM International Conference Proceedings Series (ACM Digital Library); ACM ICPS open access model may require an APC
- Each paper reviewed by at least three experts; submissions via Sparcly.ai
- Topics cover future networks, cloud, distributed and parallel systems, IoT and network security
- Hybrid conference
- Not listed in the CORE ICORE2026 portal
