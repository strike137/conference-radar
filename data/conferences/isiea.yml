notes:
- Run by the IEEE Malaysia Industrial Applications / Industrial Electronics Joint Chapter; sister symposium of
  ISCAIE, ISWTA and ISCI on the same conference management system
- 2026 was the 13th edition and 2027 is the 14th, both at Concorde Hotel Kuala Lumpur, Malaysia
- Accepted papers are submitted to IEEE Xplore; the site links the IEEE Xplore record of past proceedings and
  announces that ISIEA 2025 is indexed in Scopus
- Double-blind review by at least 3 reviewers; papers with similarity above 30% are not considered
- Hybrid format; virtual presenters upload a pre-recorded YouTube video, and no-show papers are removed from
  post-conference distribution
- Broad scope (industrial electronics, AI, control and robotics, IoT and cyber-physical systems, power
  electronics, signal and image processing)
- Not listed in ICORE2026 and not in the CCF list; a small regional venue
