notes:
- Half-day workshop on coupling large experimental and observational facilities with HPC, held with SC since 2019; 2026 is the 8th edition
- Papers of 8 pages including references, reviewed by at least three program committee members
- SC reproducibility initiative applies; an Artifact Description appendix is mandatory, badges optional
- 2025 papers appeared in the SC25 workshop proceedings in the ACM DL; for 2026 XLOOP works with IEEE on the proceedings
- Held at SC every year in the USA (Denver 2023, Atlanta 2024, St. Louis 2025, Chicago 2026)
- Not listed in CORE ICORE2026
