id: ntire
name: NTIRE
full_name: New Trends in Image Restoration and Enhancement Workshop and Challenges
type: workshop
tier: minor
areas: [vision, ai]
region: north-america
language: english
frequency: annual
organizer: Computer Vision Lab, University of Wurzburg (Radu Timofte) with co-organizers from academia and industry
organizer_country: [europe]
proceedings: IEEE Xplore and CVF Open Access (CVPR Workshops proceedings)
archival: true
typical:
  deadline_months: [3]
  conference_months: [6]
links:
  website: https://cvlai.net/ntire/2026/
notes:
- Workshop co-located with CVPR every year since 2017 (first edition at ACCV 2016); 2026 was the 11th edition
- Runs dozens of image and video restoration challenges (super-resolution, denoising, deblurring, HDR, low light,
  quality assessment and more) alongside the paper track
- Accepted papers appear in the CVPR Workshops proceedings in IEEE Xplore and CVF Open Access
- Double-blind review; up to 8 pages excluding references in CVPR format; no dual submission with CVPR main
- Separate later deadline for challenge method papers and papers already reviewed elsewhere
- All deadlines are 23:59 Pacific Time; the regular paper deadline was extended in both 2025 and 2026
- Organized by the same University of Wurzburg team as the AIM workshop (ICCV/ECCV) and the Mobile AI workshop (CVPR)
- Not listed in ICORE2026 or the CCF list
