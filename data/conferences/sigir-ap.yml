links:
  website: https://www.sigir-ap.org/
notes:
- Asia-Pacific regional conference of ACM SIGIR, annual since 2023 (Beijing 2023, Tokyo 2024, Xi'an 2025, Singapore
  2026)
- Same scope as SIGIR; single track with 2 to 9 pages plus references, length judged against contribution; double-blind
  review via EasyChair
- SIGIR Revise-and-Resubmit track for papers not accepted at SIGIR of the same year (ICTIR rejects also encouraged);
  the original reviews are passed to the reviewers
- Held in November/December, inside mainland China in odd years and elsewhere in Asia-Pacific in even years; hybrid,
  remote presentation allowed
- Student travel awards offered; each presented paper pays a separate presentation fee on top of registration (2025)
