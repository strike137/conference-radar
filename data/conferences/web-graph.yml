notes:
- Workshop on graph algorithms, graph learning, misinformation detection and responsible AI for web and social networks
- First edition held at WSDM 2026 in Boise, Idaho on February 26, 2026
- Organized by the AIIM Lab at the University of L'Aquila, the same group behind WIPE-OUT and QCDS
- Papers published in the WSDM 2026 Companion Proceedings in the ACM Digital Library
- Full papers up to 9 pages plus references, short and position papers up to 4 pages, ACM format, double-blind, at least three reviewers, via EasyChair
- 11 accepted papers in 2026; best paper award
- No 2027 edition announced as of November 2026
- Not listed in CORE ICORE2026 and not on the CCF list
