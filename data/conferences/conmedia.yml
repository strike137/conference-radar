notes:
- Run by Universitas Multimedia Nusantara (UMN), Indonesia; the 2025 edition was co-organized with Multimedia University (MMU), Malaysia
- Held every two years since 2013 (2013, 2015, 2017, 2019, 2021, 2023, 2025)
- Presented papers are submitted to IEEE Xplore (2025 IEEE conference ID 67140)
- Broad scope around new media technology, AI and human-machine communication, with tracks on AI, data, computing,
  embedded systems and networks, mobile and web, and information systems
- 2023 edition in Bali was held jointly with ICON-SONICS; 2025 edition in Melaka, Malaysia, with online participation
- Not listed in the ICORE2026 CORE portal
