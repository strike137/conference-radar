notes:
- MICCAI workshop on multimodal and multiscale learning (imaging, text, omics) for clinical decision support; 14th ML-CDS in 2026
- Grew out of the MCBR-CDS workshops (2009 to 2012); held with MICCAI most years, no edition in 2023
- Proceedings in Springer LNCS (own volume in 2025; MICCAI 2026 merged satellite events volume in 2026)
- Papers up to 12 pages in LNCS format including references; reviewed by at least 2 program committee members and one organizer; submission via OpenReview
- Organizers from Stanford University, Emory University, Tel Aviv University and UPMC
- Not listed in CORE ICORE2026 or the CCF 2026 list
