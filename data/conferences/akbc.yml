notes:
- Started in 2010 (Grenoble); workshop at NAACL, CIKM and NIPS 2012 to 2017, independent conference 2019 to 2022, then a hiatus until the 2026 revival at EMNLP
- 2026 workshop numbered 11th on its own site and 10th on the EMNLP 2026 workshop page
- Research papers (8 pages), vision papers (4 pages) and shared task papers (4 pages); double-blind; papers go into the workshop proceedings, so dual submission to other venues with proceedings is not allowed
- Hosts the LM-KBC shared task (5th edition in 2026) on predicting knowledge base entries from language models
- "2026 acceptance: 27 of 58 submissions (about 47%)"
- Not ranked in ICORE2026 and not on the CCF list
