notes:
- Founded in 1998 (first meeting in Kyoto); covers real-time, distributed, embedded and cyber-physical systems
- Sponsored by the IEEE Computer Society TC on Distributed Processing; each edition is run by a host university
- Single-track, single-blind review; regular and industrial papers up to 10 pages, short papers up to 6 pages (IEEE format)
- Papers go to the IEEE proceedings and IEEE Xplore; at least one full registration per paper, in-person presentation required
- Rotates worldwide, held in late May (Nashville 2023, Carthage 2024, Toulouse 2025, Hamilton 2026)
- Selected 2025 papers were invited to a special issue of the Elsevier Journal of Systems Architecture
- CORE C (ICORE2026); not on the CCF list
- Also has a poster track, doctoral symposium and dissertation digest track
