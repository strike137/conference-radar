notes:
- Long-running conference of the Faculty of Computer Science and IT, Riga Technical University (67th edition in 2026)
- Co-organized with the IEEE Latvia Section and the IEEE Computer Society chapter; IEEE Conference Record 71583 (2026)
- Accepted and presented papers go to IEEE Xplore; papers not presented are excluded
- Double-blind review via Microsoft CMT; IEEE double-column format
- Broad topics including data science, cybersecurity, cloud computing, AI, HCI, modelling and simulation, and management
- Hybrid format in 2026 (one online day, one day on site in Riga)
- "Fees (2026): 400 EUR regular, 350 EUR IEEE members, 160 EUR students, 80 EUR IEEE student members"
- Not listed in CORE ICORE2026
