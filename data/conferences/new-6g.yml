notes:
- Workshop on new waveforms for 6G (OTFS, OCDM, AFDM, THz and optical waveforms, ISAC waveforms, AI-based waveform design)
- Moves between IEEE ComSoc flagships; WCNC 2026 (Kuala Lumpur), third edition at GLOBECOM 2026 (Macau), fourth edition at WCNC 2027 (Panama City)
- Name varies by edition ("for 6G Communication Networks" at WCNC 2026, "for Future Communication Networks" at WCNC 2027)
- Core organizers from Beijing Institute of Technology, SUSTech, TU Berlin, Universidad Carlos III de Madrid and Queen's University Belfast
- Workshop papers go into the host conference workshop proceedings and IEEE Xplore; no-show papers are removed
- Not listed in ICORE2026
