notes:
- One-day workshop on automated program repair, automated debugging, fault localization, LLM-based repair and repair of vulnerabilities
- Held with ICSE from 2020 to 2025 (Seoul 2020, virtual 2021, Pittsburgh 2022, Melbourne 2023, Lisbon 2024, Ottawa 2025); moved to ASE in 2026 (Munich)
- 2026 papers in ACM format with DOIs in the ACM DL; 2025 papers went to the ICSE workshop proceedings (IEEE)
- "2026 formats: research papers and experience reports 4-8 pages, position papers 2-4 pages, talk proposals 1 page (all including references); double-anonymous review"
- In 2025 selected research papers could be extended for a special issue of the Automated Software Engineering journal
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
