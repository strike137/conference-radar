notes:
- Annual conference financially and technically sponsored by the IEEE Industrial Electronics Society; 2027 is the 25th edition
- Industrial information technology scope (industrial AI and agents, safety and security, robotics, factory communication
  and automation, digital twins, real-time and embedded systems, IoT, smart grids)
- Regular papers 6 pages with up to 2 extra pages for a fee; work-in-progress papers up to 4 pages, also in IEEE Xplore
- Single-blind review by three reviewers
- Rotates worldwide (Palma de Mallorca 2021, Perth 2022, Lemgo 2023, Beijing 2024, Kunming 2025, Melbourne 2026, Lisbon 2027)
- 2027 edition moves to May, so its deadlines are in December and January instead of spring
- CORE C in ICORE2026; not in the CCF 2026 list
