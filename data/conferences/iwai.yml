notes:
- Interdisciplinary venue on active inference, predictive coding, the free energy principle and related machine learning, neuroscience and robotics work
- Started in 2020 as a workshop co-located with ECML/PKDD (2020 to 2022); a standalone event since 2023
- Accepted full papers (up to 12 pages, LNCS format) are published in Springer CCIS; extended abstracts are presented as posters and not published in the proceedings
- Double-blind, community-based review on OpenReview; abstract registration two weeks before the paper deadline
- Not listed in ICORE2026 or the CCF 2026 list
- Past locations include Ghent 2023, Oxford 2024, Montreal 2025 and Madrid 2026; Kyoto University hosts 2027
- "Registration fee 2024: 150 GBP student, 500 GBP regular"
