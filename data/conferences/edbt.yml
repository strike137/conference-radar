notes:
- Run by the EDBT Association (a non-profit association under Italian law); held jointly with the database theory
  conference ICDT every year since 2009
- Proceedings published open access on OpenProceedings.org since 2014 (ISSN 2367-2005); workshop papers go to CEUR-WS
- Three research submission rounds a year, each with a possible revise decision and a revised submission
- Research papers up to 12 pages (short and vision papers 6 pages) plus references; also experiments, analysis and
  benchmarks papers
- Single-anonymous review; at most three submissions per author per round; artifacts are expected with submissions
- A paper rejected in one round cannot be resubmitted in the next two rounds
- Held in Europe every year (Ioannina 2023, Paestum 2024, Barcelona 2025, Tampere 2026, Lille 2027)
- Separate industrial and application, demo and tutorial tracks
- Onsite only in 2026; at least one author per accepted paper must register and present
