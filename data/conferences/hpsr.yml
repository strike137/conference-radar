notes:
- Started as a workshop (CORE still lists it as IEEE Workshop on HPSR); small ComSoc conference on switching, routing,
  optical and data center networks
- Rotates globally; 2025 edition was in Suita (Osaka), Japan, with Eiji Oki (Kyoto University) among the general
  co-chairs
- 6-page papers, up to 2 extra pages at 100 USD each; posters and demos have a later deadline
- 2026 CFP explicitly welcomed intent-based and zero-touch networking; 2027 CFP adds tracks on autonomous networks
  and network security
