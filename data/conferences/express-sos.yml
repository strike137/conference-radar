id: express-sos
name: EXPRESS/SOS
full_name: Combined International Workshop on Expressiveness in Concurrency and Workshop on Structural Operational Semantics
type: workshop
tier: minor
areas: [software, general]
region: europe
language: english
frequency: annual
organizer: EXPRESS/SOS workshop chairs (affiliated with CONCUR)
organizer_country: [europe]
proceedings: EPTCS (post-proceedings)
archival: true
typical:
  deadline_months: [6]
  conference_months: [8, 9]
links:
  website: https://expresssos.github.io/
notes:
- Long-running theory workshop on concurrency semantics; EXPRESS dates back to 1994, SOS to 2004, combined since 2012
- Affiliated workshop of CONCUR, held at CONFEST (Aarhus 2025, Liverpool 2026)
- Full papers (15 to 18 pages, EPTCS style) appear in EPTCS post-proceedings; short papers (up to 5 pages) are presented only
- Final versions are due about a month after the workshop (post-proceedings)
- Selected papers have gone to journal special issues (Information and Computation, Acta Informatica)
- Not listed in ICORE2026 or the CCF list
- The old site express-sos.github.io still shows the 2024 edition; the current site is expresssos.github.io
