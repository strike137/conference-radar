notes:
- Organized by Curtin University Malaysia in collaboration with the IEEE PES Malaysia Chapter (technical sponsor)
- Editions in 2021, 2022, 2024 and 2025; the 2021, 2022 and 2024 proceedings are in IEEE Xplore
- 2024 and 2025 editions were virtual (about 150 attendees in 2024); program times in Malaysia Time (GMT+8)
- Broad green technology scope; tracks include green computing and security, and green communications, networking
  and signal processing, next to energy and power systems
- 4 to 5 page IEEE papers via EDAS (up to 7 pages at 25 USD per extra page); peer reviewed; selected papers invited
  to Scopus-indexed journals
- Registration 200 to 330 USD (2025, early bird IEEE member to normal non-member)
- Not listed in ICORE2026
