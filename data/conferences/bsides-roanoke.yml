notes:
- Security BSides conference in Roanoke, Virginia, USA, run by the Roanoke Infosec Exchange (RISE), a 501(c)(3) nonprofit
- First held in 2019; recent editions in 2023, 2024 and 2026 at Virginia Western Community College
- One day with a main talk track, a defensive security (DefSec) room, workshops and a CTF; the Virginia Cyber Range is a partner
- The 2026 edition had 112 attendees
- RISE also runs free monthly meetups on the second Thursday of each month
- Talks only, no proceedings
