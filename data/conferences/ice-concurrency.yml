notes:
- Workshop on models, verification, tools and programming primitives for concurrent systems and complex interactions (process calculi, session types, protocols)
- Held since 2008 and a satellite workshop of DisCoTec since 2010; ICE 2026 was the 19th edition
- Held in June with DisCoTec in Europe (Lucca 2022, Lisbon 2023, Groningen 2024, Lille 2025, Urbino 2026; online 2020 and 2021)
- Distinctive review process with an online forum where authors and PC members discuss each submission; light double-anonymous reviewing
- Research papers (4 to 17 pages) appear in the open-access EPTCS post-proceedings (ICE 2025 -> EPTCS 425, ICE 2026 -> EPTCS 453); oral communications up to 2 pages are presented only
- Selected papers usually invited to a special issue of JLAMP (Elsevier)
- Not listed in ICORE2026 or the CCF 2026 list
