notes:
- 'Held in China every year (Beijing 2022, Hangzhou 2023, Kunming 2024, Xi''an 2025, Hong Kong 2026); listed by
  CORE as the SKLOIS Conference on Information Security and Cryptology (National: China)'
- Proceedings in Springer LNCS, published as revised selected papers after the conference; 2026 edition in cooperation
  with IACR
- Two submission rounds; in 2026 round 2 only considers papers invited by the PC to revise and resubmit
- Separate crypto track and security track; anonymous submissions, 16 pages LNCS
- CCF C
