notes:
- Workshop series run by Climate Change AI on ML for climate change mitigation, adaptation and climate science
- "Held since 2019 at ICML, NeurIPS, ICLR and AAAI FSS; recent editions: ICLR 2024, NeurIPS 2024, ICLR 2025, NeurIPS 2025 (San Diego), NeurIPS 2026 (Sydney)"
- Papers track (up to 4 pages), Proposals track (up to 3 pages) and Tutorials track (executable notebooks); every submission must state a climate impact pathway
- Submitted through OpenReview; reciprocal reviewing introduced in 2026 for experienced authors
- Mentorship program pairs early-career authors with mentors before the deadline
- Work already published at non-ML venues may be eligible; accepted works are listed on climatechange.ai/papers
- Not the Chinese Congress on Artificial Intelligence (ccai)
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
