notes:
- South African edition of the Deep Learning IndabaX, a locally organised off-shoot of the Deep Learning Indaba; held every year since 2018
- Rotates between South African universities (Cape Town 2023, Wits Johannesburg 2024, Stellenbosch 2025, UKZN Westville Durban 2026)
- About 400 attendees, 50+ speakers and posters, tutorials, hackathons and an AI Fest evening
- Talks and posters selected from a 300-word abstract or an already published paper; flash, short and long talk slots
- Abstracts may appear in the programme, but there are no proceedings
- Free for accepted students, with travel grants for South African students; 2026 tickets R2000 (academia) and R3700 (industry)
- Not listed in CORE ICORE2026
