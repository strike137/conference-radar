id: ecmr
name: ECMR
full_name: European Conference on Mobile Robots
type: conference
tier: minor
areas: [ai, systems]
region: europe
language: english
frequency: biennial
organizer: ECMR Conference Board (with IEEE RAS patronage)
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
fee: 650 EUR full, 400 EUR student without paper (2025, early, incl. VAT)
typical:
  deadline_months: [4, 5]
  conference_months: [9]
links:
  website: https://ecmr2025.dei.unipd.it/
notes:
- Biennial European conference on mobile robotics and mobile human-robot systems, held since the first edition in Radziejowice, Poland
- Always held in Europe (Ancona, Freiburg, Dubrovnik, Orebro, Barcelona, Lincoln, Paris, Prague, Bonn, Coimbra, Padua)
- Single track with keynotes, oral and poster papers; peer reviewed, 6 pages in IEEE two-column format plus up to 2 paid extra pages
- 2025 CFP says accepted papers are planned to be included in IEEE Xplore; selected papers invited to a Robotics and Autonomous Systems special issue
- Workshop and tutorial day before the three-day main conference; late-breaking results track (2-page reports, oral only, not in the proceedings)
- Under IEEE Robotics and Automation Society patronage; steering by a permanent ECMR Conference Board
- Not listed in the CORE ICORE2026 portal
