notes:
- Sponsored by USENIX; proceedings are open access
- Two deadlines per year (spring in April, fall in September) with one-shot revision to the next deadline
- Always held in the USA; acceptance 22.8% in 2026 (spring 24.2%, fall 22.1%)
- 'ICORE2026 lists it as ''National: USA'', but it is widely regarded as a top networked systems venue (CCF A)'
- Student and professional grants offered by USENIX
