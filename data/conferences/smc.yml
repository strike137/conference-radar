  conference_months: [6, 7, 11]
links:
  website: https://smcnetwork.org/
notes:
- Not to be confused with IEEE SMC (Systems, Man, and Cybernetics)
- Peer-reviewed conference on sound and music computing (music information retrieval, audio processing, sonic
  interaction, computational musicology)
- Papers up to 8 pages (6 encouraged); single-blind review; publication requires the presenting author to attend
- Proceedings open access on Zenodo and the SMC website
- Held in Europe (Saint-Etienne 2022, Stockholm 2023, Porto 2024, Graz 2025, Zagreb 2026); usually June or July
- Not listed in CORE ICORE2026
