notes:
- Regional Security BSides for the Baltimore, Maryland area, held under the Security BSides umbrella principles
- Run by BSidesCharm, a certified 501(c)(3) non-profit with a volunteer board of directors
- Held since 2016 (editions 2016 to 2019, then yearly since 2022)
- Two-day weekend event at the Sheraton Baltimore North in Towson, MD (2025 to 2027), with talks, training classes, workshops, villages, CTFs and a hiring village
- Call for papers for 2027 opens 31 October 2026 (no deadline posted yet); no honorariums or travel support for speakers
- Presentations are recorded and linked from the yearly archive sites
- No proceedings
