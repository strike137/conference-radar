id: in2writing
name: In2Writing
full_name: Workshop on Intelligent and Interactive Writing Assistants
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: Organizing committee of HCI and NLP researchers; alternates between HCI (ACM) and NLP (ACL) host conferences
organizer_country: [international]
proceedings: ACL Anthology (only in years held with an ACL conference, e.g. 2022 and 2025)
archival: true
typical:
  conference_months: [5, 11]
links:
  website: https://in2writing.github.io/
notes:
- Interdisciplinary workshop on writing assistants that brings together the HCI and NLP communities
- Alternates its host venue between HCI and NLP conferences every year
- 2025 (4th edition) was held with NAACL 2025 in Albuquerque; 10 papers in the ACL Anthology
- 2026 (5th edition) is a hands-on UIST 2026 workshop with a tool-swapping writing activity; no paper submission
  is required and nothing is published
- Workshop-only registration is possible without registering for the full UIST conference
- Not listed in ICORE2026 and not on the CCF list
