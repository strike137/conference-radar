notes:
- Half-day workshop co-located with ICPR 2026 (Lyon), first edition
- Covers machine unlearning, adversarial robustness, privacy and explainability for document image understanding
  (OCR, handwritten text recognition, DocVQA)
- Papers in the ICPR 2026 workshop proceedings, Springer LNCS; up to 15 pages, only full papers (more than 6 pages)
  go into the proceedings
- Double-blind review via Microsoft CMT; all accepted papers must be presented at the workshop
- 7 oral papers in the 2026 program
- Not listed in ICORE2026
