notes:
- Long-running series formerly called EANN (Engineering Applications of Neural Networks); renamed EAAAI, the 2026
  edition was the 27th
- Organized by Democritus University of Thrace and University of Piraeus with a local university, in cooperation with
  INNS and Springer
- Proceedings published by Springer; the official page names both LNCS and CCIS, indexed in Web of Science CPCI, EI,
  Scopus and DBLP
- CORE C (ICORE2026, listed under the EANN name)
- Hybrid format; held in Greece most years (Crete 2022, Corfu 2024, Chania 2026), also Leon 2023, Limassol 2025 and
  Rome 2027
- Paper deadlines are usually extended by about two weeks ("hard deadline")
