notes:
- Community-driven, non-profit Security BSides conference in the historic center of Zadar, Croatia
- One day of talks, a panel and lightning talks; 3rd edition in 2026 at Kazaliste lutaka Zadar (puppet theatre)
- Call for papers on Sessionize; standard talks 40 minutes, short talks 25 minutes; speakers pay their own travel
- Some talks run under the Chatham House Rule
- Tickets are free but limited by venue capacity (2025)
- No proceedings
- Not listed in CORE ICORE2026 and not on the CCF list
