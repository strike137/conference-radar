links:
  website: https://nccit.net/
notes:
- Thai-language sister conference of IC2IT, held jointly on the same dates in May; the pair has run every year since 2005
- Run by the Council of IT Deans of Thailand with KMUTNB and partner universities (2025 co-host Kanchanaburi Rajabhat
  University)
- Accepts research papers in Thai only, up to 6 pages A4, blind submission via EasyChair, 3 reviewers per paper
- Proceedings are compiled as a PDF volume and posted on the conference website (no ISBN found); 81 papers in 2026
- Broad computing topics with emphasis on data science and machine learning, network and security, image processing
  and information systems
- The 2026 deadline moved from 2026-01-31 in the call for papers to 2026-03-23 on the website
- Low registration fee (4,500 THB per paper in 2026)
