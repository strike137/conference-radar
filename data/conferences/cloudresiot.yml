notes:
- Workshop held with ICCCN (International Conference on Computer Communications and Networks); first edition in 2025 in Tokyo
- Workshop papers are limited to 6 pages in IEEE format and are submitted through the ICCCN EasyChair site
- Accepted papers go into the ICCCN proceedings and IEEE Xplore; papers not presented onsite are left out of IEEE Xplore
- In-person presentation by a registered author is required; no remote presentations
- 'Topics: resilient cloud and edge architectures for IoT and IIoT, fault tolerance, secure cloud IoT communication'
- Not in the ICCCN 2026 workshop list
