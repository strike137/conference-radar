notes:
- Run by an international steering committee chaired by Mohammad S. Obaidat; site hosted by the University of Girona
- Accepted papers are submitted to IEEE Xplore; extended versions of selected papers go to special issues of the
  International Journal of Communication Systems and the Security and Privacy journal (Wiley)
- Held in many countries (Genoa 2023, Girona 2024, Colmar 2025, Piraeus-Athens 2026, Istanbul 2027); virtual 2020 to 2022
- Hybrid in 2026, remote presentation allowed for authors who cannot travel
- Papers up to 8 pages in IEEE format via EDAS; deadlines are usually extended
- Not ranked in CORE ICORE2026
