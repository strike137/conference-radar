id: ica3pp
name: ICA3PP
full_name: International Conference on Algorithms and Architectures for Parallel Processing
type: conference
tier: minor
areas: [systems, networking, security]
region: worldwide
language: english
frequency: annual
organizer: 'Steering committee with rotating host university (2025: Zhengzhou University; 2026: University of Exeter)'
organizer_country: [china, australia]
proceedings: Springer LNCS
archival: true
indexing: [EI, Scopus, DBLP]
rank:
  core: C
  ccf: C
acceptance_rate: 29% for full papers (2025, 158/543); 310 of 543 counting research and session papers
fee: GBP 670 per paper author registration (about USD 900), GBP 400 participant registration (2026)
typical:
  deadline_months: [7, 8]
  conference_months: [10, 11]
links:
  website: https://hpcn.exeter.ac.uk/ica3pp2026/
notes:
- Series running since 1995 (26th edition in 2026); most editions in China and the Asia-Pacific, but 2022 was Copenhagen
  and 2026 is Exeter, UK
- Proceedings in Springer LNCS (EI indexed); single-blind review; regular papers up to 20 LNCS pages, short/workshop
  papers 12
- CCF C and CORE C; very large program (310 papers in the 2025 proceedings), regarded as a lower-tier parallel/distributed
  systems venue
- 'Usually co-located with a congress: 2025 inside the IEEE Cybermatics Congress in Zhengzhou, 2026 with IUCC, CIT,
  DSCI and IOI in Exeter'
- Has a security track (service dependability and security in distributed systems); deadlines are usually extended
  by a few weeks, and 2025 also had a late-breaking (LBI) round
