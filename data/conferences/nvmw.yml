notes:
- Standalone workshop on solid-state non-volatile memories, from devices and error coding to architectures, systems and applications
- Hosted by UCSD CMRR and NVSL; usually held in San Diego, 2026 edition at UCSC Silicon Valley Extension in Santa Clara
- Non-archival; in lieu of printed proceedings, slides and extended abstracts are posted online, and work already published in the last 18 months may be presented
- Submissions are 2-page extended abstracts (not blind) via HotCRP; research, industry and work-in-progress tracks
- Around 50 speakers and nearly 200 attendees per year
- Gives the NVMW Persistent Impact Prize and the NVMW Memorable Paper Award (1000 USD each)
- Not listed in the CORE portal (ICORE2026) or on the CCF list
