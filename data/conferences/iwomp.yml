notes:
- Annual workshop on OpenMP research and practice since 2005; proceedings in Springer LNCS
- Not ranked in CORE (ICORE2026); run by an international steering committee chaired by the OpenMP ARB's Michael Klemm
- Submissions up to 12 pages plus references, final papers up to 15 pages including references
- Deadlines are usually extended a few weeks (2026 moved from May 29 to June 12)
- Rotates between the USA, Europe and Asia-Pacific (Bristol 2023, Perth 2024, Charlotte 2025, Vienna 2026 co-located with EuroMPI)
