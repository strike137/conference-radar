notes:
- Workshop of the JSAI International Symposia on AI (JSAI-isAI), held alongside the JSAI annual conference in Japan
  each May or June
- Led by JSAI SIG-Sec (chair Kouichi Sakurai, Kyushu University); aims to be the Japanese/Asian counterpart of AAAI
  SafeAI and IJCAI AISafety
- Springer LNCS format, max 14 pages, anonymous (blind) review; accepted papers appear in the JSAI-isAI LNAI proceedings,
  which are published before the symposium since 2024
- 'Small venue: the 1st edition (Osaka, 2025) had 4 regular papers plus keynote and invited talks; hybrid, online
  presentation allowed'
- The 2026 edition issued a CFP but is not among the accepted JSAI-isAI 2026 workshops and has no papers in the
  2026 LNAI volume, so check whether the series continues
