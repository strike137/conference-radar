notes:
- Successor of the Asia-Pacific World Congress on Computer Science and Engineering (APWC on CSE, Fiji, 2014 to 2018);
  CSDE name since 2019, 2026 is the 11th edition
- 'Recent editions: 2019 Melbourne, 2020 and 2022 Gold Coast, 2021 Brisbane, 2023 Nadi (Fiji), 2026 Bangladesh; no
  edition in 2024 or 2025'
- Run by NPS Australia (submission system nps-ss.com.au); 2026 edition co-hosted with the IEEE Bangladesh Section and
  BUBT
- Accepted papers (max 6 pages, IEEE double-column) go to IEEE Xplore; top papers invited to SCIE/Scopus journals
- Not listed in ICORE2026 or the CCF list; broad scope (AI, data science, security, IoT, cloud, quantum computing)
- Hybrid; 2026 has a fully virtual first day and two onsite days
