notes:
- Workshop co-located with IEEE NetSoft every year since 2022 (Milan 2022 hybrid, Madrid 2023, St. Louis 2024, Budapest 2025, Berlin 2026)
- Not to be confused with the ARES workshop on Emerging Network Security, also called ENS
- Topics are softwarization and virtualization at the network edge, orchestration, P4/eBPF/XDP data planes, low latency edge use cases and 6G
- Papers up to 7 pages in IEEE two-column format including references; submission via EDAS
- Accepted and presented papers go into the IEEE NetSoft proceedings on IEEE Xplore
- Half-day workshop with two technical sessions and two keynotes in 2026
