notes:
- Originated and run by Marian Marciniak at the National Institute of Telecommunications (IL-PIB), Warsaw, Poland, with a different European host each year
- Technical co-sponsorship by the IEEE Photonics Society; proceedings in IEEE Xplore
- Covers optical networking, photonics, optical and wireless convergence, quantum communications and sensing; dozens of co-located workshops and special sessions (ESPC, WAOR, MALOC, 6GNeO, ...)
- Papers of about four A4 pages submitted by email for regular and poster sessions; post-deadline papers with hot results accepted until June 1
- In-person only; students and young scientists explicitly encouraged
- Recent hosts are Barcelona 2025 (25th), Prague 2026 (26th) and Ischia, Italy 2027 (27th)
- Not listed in CORE ICORE2026 under its acronym or full name
