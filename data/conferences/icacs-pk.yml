notes:
- Run by The University of Lahore, Pakistan, and held on its campus in Lahore every February
- Editions in 2018, 2019, 2020 and every year since 2023 (8th edition in 2027), all with proceedings in IEEE Xplore
- IEEE Lahore Section, IEEE ComSoc Lahore Chapter, IEEE Computer Society Lahore, HEC and PHEC listed as sponsors (2027)
- Nine tracks across computer science (AI, NLP, vision, data, security, software, IoT and networks, robotics, remote sensing)
- 6 pages max in IEEE two-column format, submission via EasyChair; the 2027 call says papers will be indexed in DBLP
- Not listed in ICORE2026 or the CCF 2026 list; a small regional venue
- Not the same as ICACSIS (Indonesia) or ICTACS (Tashkent)
