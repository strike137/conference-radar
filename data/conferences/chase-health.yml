links:
  website: https://conferences.computer.org/chase2026/
notes:
- Conference on smart and connected health (wearables, biomedical sensing, body area networks, health data
  analytics, telemedicine, security and privacy for health); first held in 2016
- Regular papers up to 12 pages and short papers up to 5 pages, IEEE double-column format, double-blind review on HotCRP
- Accepted regular and short papers go to the IEEE proceedings; authors of regular papers may instead publish in an
  Elsevier Smart Health journal special issue
- Also has workshops, posters and demos; NSF student travel awards for US-based students and an NSF-NIH aspiring PI workshop
- Always held in the USA (Washington DC 2022, Orlando 2023 with FCRC, Wilmington 2024, New York 2025, Pittsburgh 2026,
  Chapel Hill 2027)
- Not to be confused with CHASE, the software engineering conference co-located with ICSE
- Not listed in ICORE2026; not on the CCF 2026 list
