notes:
- Workshop on machine learning methods for remote sensing (Earth observation, satellite) data, co-located with ICLR every year since 2023
- 'Past venues follow ICLR: Kigali 2023, Vienna 2024, Singapore 2025, Rio de Janeiro 2026'
- Non-archival, so dual submission is allowed; submissions and reviews on OpenReview
- 'Tracks in 2026: 4-page workshop papers (double blind), 2-page tiny papers and a new tutorials track (single blind)'
- Authors can opt for a fast extra review for a special stream in IEEE Geoscience and Remote Sensing Letters (extra fees)
- Travel support for students offered in past editions through sponsors
- Not listed in CORE ICORE2026
