notes:
- One-day workshop co-located with IEEE INFOCOM; second edition held with INFOCOM 2025 in London
- Accepted and presented papers appear in the IEEE INFOCOM workshop proceedings and IEEE Xplore
- Papers up to 6 pages in IEEE two-column format including references, submitted via EDAS
- Topics are massive and immersive 6G communications for the Metaverse, mmWave/THz, extremely large MIMO, RIS, ISAC and semantic communication
- General co-chairs from Birmingham City University, Beijing Institute of Technology, UNSW, Khalifa University and Imperial College London
- Not on the IEEE INFOCOM 2026 workshop list
- Not listed in ICORE2026
