links:
  website: https://icaiame.com/
notes:
- Turkish conference on AI and applied mathematics in engineering held since 2019; supported by TUBITAK
- Usually held at the Innvista Hotel Belek, Antalya, Turkey (Baku, Azerbaijan in 2022 and Warsaw, Poland in 2024)
- Selected English full papers go to Springer volumes whose series changes by year (Lecture Notes on Data
  Engineering and Communications Technologies for 2019 to 2021, Engineering Cyber-Physical Systems and Critical
  Infrastructures for 2022)
- Other papers can go to partner Turkish journals; accepted abstracts appear in an abstract booklet
- Single-blind review with at least two reviewers; many rolling abstract deadline extensions
- Designed to meet the requirements of the Turkish academic promotion system
- Not listed in the CORE ICORE2026 portal
