notes:
- Conference of the Global WordNet Association on wordnets and lexical semantic resources, held since 2002, usually
  every two years in January
- Proceedings published by the Global WordNet Association in the ACL Anthology with DOIs (34 papers in 2025)
- Long papers up to 8 pages, short papers and project reports up to 5 pages, demos up to 5 pages, references
  excluded; anonymized submissions (2025)
- Venue moves around the world (Bucharest 2016, Singapore 2018, Wroclaw 2019, Pretoria 2021 virtual, Donostia 2023,
  Pavia 2025, Amsterdam 2027)
- CORE C (ICORE2026, listed as International Wordnet Conference)
