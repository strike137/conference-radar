notes:
- Organized by KIISC (Korea Institute of Information Security and Cryptology) with NIS and ETRI; held every August
  on Jeju Island
- Springer LNCS post-proceedings (revised selected papers); anonymous submission, 12 pages max in LNCS format; also
  has a poster track
- 'Regarded as mid-tier, somewhat below ICISC; ICORE2026 lists it as National: Korea (formerly International Workshop
  on Information Security Applications, CORE C in 2018)'
- Not the CCF-C 'WISA' (Web Information Systems and Applications), which is a different Chinese venue; the WikiCFP
  series page mixes the two
- Online attendance option exists, but at least one author per paper must attend and present in person
