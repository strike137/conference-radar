notes:
- Organized by ICRP with Shinhan University; IEEE Busan Section is technical co-sponsor; submissions via EDAS
- Held in Korea, almost always on Jeju (Busan in 2017 and 2023); January/February until 2019, every August since
  2021 (2020 cancelled); 2026 was the 12th edition
- 'Track 1: 4-6 page full papers published in IEEE Xplore; Track 2: 2-page extended abstracts only in the program
  book, extended versions go to Platform Technology Letters'
- Broad ICT scope (computing, networking, media, convergence, security); regarded as a minor venue; deadlines are
  extended repeatedly (June -> late July in 2026, mid July -> mid August in 2025)
- Accepted papers must be presented on site (one or two online sessions as fallback); selected papers invited to
  journal special issues (MDPI Electronics, Applied Sciences, CMC); co-located workshops CIA, FSP, SCA and AISALM
