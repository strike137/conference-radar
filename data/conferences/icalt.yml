notes:
- Flagship conference of the IEEE Computer Society Technical Community on Learning Technology (TCLT)
- CORE B (ICORE2026); not on the CCF 2026 list
- Proceedings published by IEEE Computer Society Conference Publishing Services and IEEE Xplore; the CFP says Xplore papers are passed to EI, Scopus and CPCI
- Full papers 5 pages, short papers 3 pages, discussion papers 2 pages, doctoral consortium papers 3 pages
- Many topical tracks, plus a doctoral consortium, best paper awards and a student award
- Single deadline for all paper types in January, usually extended by a few weeks; deadlines are 23:59 Pacific Time
- Rotates worldwide with in-person and online registration (Bucharest 2022, Orem 2023, Nicosia 2024, Changhua 2025, Hung Yen 2026, Dortmund 2027)
