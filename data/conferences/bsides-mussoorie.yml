notes:
- Community Security BSides conference in Mussoorie, Uttarakhand, India
- First edition in April 2026 at Royal Orchid Fort Resort, Mussoorie, with about 200 attendees and 30+ speakers
- Two days of trainings followed by a two-day conference with talks, workshops and a CTF
- 2027 edition puts a focus on AI security, LLM exploitation and ML-driven defense
- Talks chosen by a review board through a CFP; no proceedings
- Not listed in the CORE ICORE2026 portal or on the CCF list
