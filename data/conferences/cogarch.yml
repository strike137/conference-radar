id: cogarch
name: CogArch
full_name: Workshop on Cognitive Architectures
type: workshop
tier: minor
areas: [systems, ai]
region: worldwide
language: english
frequency: annual
organizer: IBM T. J. Watson Research Center researchers; co-located with ISCA (HPCA in 2021 and 2022)
organizer_country: [usa]
proceedings: None (short papers linked from the workshop program only)
archival: false
typical:
  deadline_months: [4, 5]
  conference_months: [6]
links:
  website: https://cogarch-workshop.org/
notes:
- Workshop on architectures for AI and cognitive systems, organized by IBM Research (Pradip Bose, Alper Buyuktosunoglu, Karthik Swaminathan, Augusto Vega)
- 2026 was the 10th edition, focused on chiplets, interconnects and clusters for collective AI workloads
- Submissions are 2-page manuscripts for a regular presentation or a prototype demonstration, via EasyChair
- No formal proceedings; authors of selected 2026 submissions were invited to an IEEE Micro special issue
- Held with ISCA since 2023 (Orlando 2023, Buenos Aires 2024, Tokyo 2025, Raleigh 2026); with HPCA 2021 and 2022 (virtual)
- Not listed in CORE ICORE2026 and not on the CCF list
