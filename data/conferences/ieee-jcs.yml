notes:
- Small specialist symposium on joint communications and sensing (ISAC) for 6G and Wi-Fi, bringing together
  radar and communications researchers from academia and industry
- Started in 2021 as an online event from 5G Lab Germany in Dresden; steering chair Gerhard Fettweis (TU Dresden / Barkhausen Institut)
- Rotates within Europe (Seefeld 2022 and 2023, Leuven 2024, Oulu 2025, Ponte di Legno 2026, Munich 2027),
  hybrid with online streaming
- Accepted and presented papers are submitted to IEEE Xplore; submission via EDAS
- Technical papers and demo papers; an accepted demo must be shown physically at the venue
- 2026 edition had a winter school alongside the symposium
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
