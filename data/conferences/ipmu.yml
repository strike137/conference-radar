notes:
- Biennial conference on uncertainty management, fuzzy sets, imprecise probabilities, aggregation and decision making
- First edition in Paris in 1986; 2026 was the 21st edition and the 40th anniversary
- Regular papers (12 to 14 pages) in Springer CCIS; short papers (2 to 6 pages) go to a separate open access volume
  with its own DOI
- Many special sessions; submissions via EasyChair to a special session or the general track
- The Kampe de Feriet award is presented at the conference
- Submission deadline was extended twice in 2026 (12 January -> 30 January -> 15 February)
- Not in the CCF list
