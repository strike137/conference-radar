notes:
- Workshop of the IEEE International Conference on Cyber Security and Resilience (IEEE CSR); first held in 2026
  (not in the 2025 CSR workshop list)
- Topics include secure IoT architectures, hardware-based trust, PUFs, post-quantum crypto for constrained devices,
  AI-based intrusion detection and zero-trust
- Chaired by researchers from the University of Genova (Italy) and the University of Wolverhampton (UK)
- Workshop papers go into the IEEE CSR proceedings in IEEE Xplore; 6 pages plus up to 2 extra pages with overlength
  charges
- In person only; 12 accepted papers in 2026, presented on Aug 5
- Deadline was extended by one month in 2026 (Apr 13 -> May 13)
- Not listed in CORE ICORE2026 or the CCF list
