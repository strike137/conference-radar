id: algotel-cores
name: AlgoTel/CoRes
full_name: Rencontres Francophones sur les Aspects Algorithmiques des Télécommunications / Rencontres Francophones sur
  la Conception de Protocoles, l'Évaluation de Performance et l'Expérimentation des Réseaux de Communication
type: conference
tier: domestic
areas: [networking]
region: europe
language: mixed
frequency: annual
organizer: AlgoTel and CoRes community with a rotating French host lab (LAAS-CNRS in 2026)
organizer_country: [europe]
proceedings: HAL (open archive collections ALGOTEL and CORES per year)
archival: false
typical:
  deadline_months: [1, 2]
  conference_months: [6]
links:
  website: https://algotel-cores26.sciencesconf.org/
notes:
- Two French-speaking networking meetings held jointly each June; AlgoTel covers algorithms for networks and distributed
  systems (28th edition in 2026), CoRes covers protocols, performance evaluation and experimentation (11th in 2026)
- Papers of at most 4 pages; at least the title and abstract must be in French, the rest may be in English; submission
  via HotCRP with a track choice of AlgoTel or CoRes
- Results already published at an international conference or journal may be presented; the venue calls itself a
  community conference without copyright, so it is marked non-archival here
- Peer-reviewed papers are deposited in the HAL open archive (collections such as ALGOTEL2025, ALGOTEL2026, CORES2026)
- Held in a different French town each year, the 2026 edition at a holiday village club (Cargese 2023, Saint-Briac-sur-Mer 2024,
  Saint-Valery-sur-Somme 2025, Mandelieu-la-Napoule 2026, Chambon-sur-Lac 2027)
- Optional shadow program committee lets students review submitted papers; aimed at PhD students and young researchers
- Not listed in ICORE2026 and not on the CCF list
