notes:
- Formed by combining the ACM Digital Libraries conferences and the IEEE-CS Advances in Digital Libraries conferences
- Proceedings alternate between the ACM DL (2018, 2020, 2022, 2024) and IEEE Xplore (2019, 2021, 2023, 2025)
- Mostly held in the USA (Santa Fe 2023, DeKalb 2025 virtual, Dallas 2026), with editions in Cologne 2022 and Hong
  Kong 2024
- Full papers up to 10 pages and short papers up to 4 pages excluding references, ACM format; double-blind review
- 2026 is hybrid; sponsors include IEEE Computer Society, ACM SIGIR and ACM SIGWEB
- Listed as CORE A* in CORE2018 but not listed in ICORE2026
