notes:
- Technically sponsored by the Soft Computing Research Society (SCRS, New Delhi), which runs many hybrid conferences each year with Indian host institutions
- After-conference proceedings in Springer Lecture Notes in Networks and Systems (LNNS); one volume per year for 2020 to 2024
- Hybrid (in-person and online); hosted by SVNIT Surat since 2023, jointly with ABV-IIITM Gwalior in 2026; ICCI 2021 was organized by IIIT Pune
- 7th edition in 2026; submission via Microsoft CMT
- High-volume event; not listed in CORE ICORE2026 (the CORE "ICCI" is the unrelated IEEE Cognitive Informatics) and not on the CCF list
