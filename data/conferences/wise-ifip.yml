links:
  website: https://www.ifiptc11.org/wg118-wise
notes:
- Organized by IFIP WG 11.8 (Information Security Education); co-located with IFIP SEC, and one registration covers
  both events
- Proceedings in the Springer IFIP AICT series, indexed in Scopus
- Double-blind review, reviewed separately from SEC; full papers up to 14 pages in LNCS format including references,
  plus working group discussion topics
- Biennial from 1999 to 2017; since 2018 held almost every year (2018 at the IFIP World Computer Congress in Poznan,
  2019 onward alongside IFIP SEC), with no edition in 2023; 2026 edition was in Perth, Australia
- Small education-focused venue; first deadline usually late Jan or mid Feb, and it was extended by 2 to 3 weeks
  in each of 2024, 2025 and 2026
