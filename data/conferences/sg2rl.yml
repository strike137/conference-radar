notes:
- Workshop on scene graph generation, graph representation learning and their use in vision, robotics, medical imaging and AR/VR
- Editions with ICCV 2023, CVPR 2024 and ICCV 2025; 2025 was the 3rd edition
- Full papers up to 8 pages in the host conference style go into the workshop proceedings; 2 to 4 page extended abstracts are presented but not published
- Submissions through Microsoft CMT
- 3 papers in the ICCV 2025 workshop proceedings, 6 in CVPR 2024, 10 in ICCV 2023
- Not the same as the SG4SI scene graph workshop at WACV 2026, which has different organizers
- Not listed in ICORE2026 or the CCF list
