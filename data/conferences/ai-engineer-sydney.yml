notes:
- Australian edition of the AI Engineer conference series, produced by Web Directions (John Allsopp) in partnership with AI Engineer
- First Sydney edition in December 2026 at the Hilton Sydney, as the centerpiece of AI Week Sydney (6-13 December 2026)
- Two conference days on production LLM systems, tooling, evaluation and safety, plus a workshop day on 9 December 2026
- About 800 attendees and 80+ talks expected; a free hackathon runs on 4-5 December with finalists pitching on stage
- Sister event AI Engineer Melbourne is held in June
- No papers or proceedings
- Not listed in CORE ICORE2026
