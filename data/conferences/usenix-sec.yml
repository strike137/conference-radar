notes:
- Organized by the USENIX Association; one of the 'Big 4' security conferences, held in the USA every August
- Two submission cycles (late August and late January/early February) with mandatory registration one week before;
  double-blind; early-reject round and rebuttal; Open Science appendix required
- All papers are open access on usenix.org; at most 7 papers per author per cycle; papers rejected in Cycle 1 cannot
  go to Cycle 2 of the same year
- Largest of the Big 4 by paper count; about 13% acceptance in 2026 (362/2750)
