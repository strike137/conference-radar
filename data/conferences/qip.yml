id: qip
name: QIP
full_name: Annual Conference on Quantum Information Processing
type: conference
tier: top
areas: [general, crypto]
region: worldwide
language: english
frequency: annual
organizer: QIP Steering Committee with a local host each year (2027 Centre for Quantum Technologies, Singapore)
organizer_country: [international]
proceedings: None
archival: false
typical:
  deadline_months: [9, 10]
  conference_months: [1, 2]
links:
  website: https://qipconference.org/2027/
notes:
- Largest and leading conference on the theory of quantum information and computation (algorithms, complexity, error correction, cryptography, information theory); held since 1998
- "No published proceedings by charter: work already published elsewhere can be presented"
- Talk submission is an extended abstract of at most 3 pages plus the full paper, which must be public on arXiv by the deadline; separate later poster deadline
- Contributed talks are highly selective (charter mentions around 32 accepted talks); posters are generally accepted unless off-topic
- Single-track week with tutorials on the weekend before; recent editions draw nearly 1,000 participants
- Location rotates worldwide (Ghent 2023, Taipei 2024, Raleigh 2025, Riga 2026, Singapore 2027)
- Not listed in CORE ICORE2026
