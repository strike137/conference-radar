notes:
- Workshop on security for rapidly deployable, edge-enabled and mission-critical mobile networks (AI security, IoT,
  intrusion detection, authentication, software-defined security)
- 2026 is the 3rd edition, with ACM MobiHoc 2026 in Tokyo; earlier editions were held with IEEE MILCOM 2022 and
  IEEE PIMRC 2025, so the host conference changes
- Papers up to 6 pages including references in ACM double-column format; submission via HotCRP
- Accepted papers go into the ACM MobiHoc 2026 proceedings; one full registration per paper; ACM open access APC
  (250 USD members, 350 USD non-members in 2026) applies outside ACM Open institutions
- Not listed in the CORE portal (ICORE2026) or the CCF list
