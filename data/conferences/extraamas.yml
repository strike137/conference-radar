id: extraamas
name: EXTRAAMAS
full_name: International Workshop on EXplainable, Trustworthy, and Responsible AI and Multi-Agent Systems
type: workshop
tier: minor
areas: [ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop chairs from HES-SO (Switzerland), Luxembourg Institute of Science and Technology, Umea University
  and University of Bologna; co-located with AAMAS
organizer_country: [europe]
proceedings: Springer LNAI (LNCS) post-proceedings
archival: true
typical:
  deadline_months: [3]
  conference_months: [5]
links:
  website: https://extraamas.histlab.hevs.ch/
notes:
- Workshop on explainable AI, agentic AI and multi-agent systems, held with AAMAS every year since 2019
- Follows AAMAS around the world (London 2023, Auckland 2024, Detroit 2025, Cyprus 2026)
- Single-blind review by at least three PC members via EasyChair; full papers up to 16 pages excluding references
- Accepted papers go into Springer LNAI post-proceedings after revision ("Revised Selected Papers"; 2025 -> LNCS volume
  15936)
- Several tracks (XAI and agents, explainable negotiation, law and ethics); deadlines are AoE
- Not listed in ICORE2026 or the CCF list
