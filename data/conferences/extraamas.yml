notes:
- Workshop on explainable AI with a focus on agents and multi-agent systems, held with AAMAS since 2019
- Revised papers published in Springer LNAI post-proceedings
- Papers up to 16 pages excluding references, demo papers 5 pages; single-blind review by at least three PC members on EasyChair
- Four tracks in 2026, including XAI in negotiation, interactive explainability with LLMs, and XAI in law and ethics
- Location follows AAMAS (London 2023, Auckland 2024, Detroit 2025, Cyprus 2026)
- Not listed in CORE ICORE2026 or in the CCF 2026 list
