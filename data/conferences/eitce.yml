  conference_months: [6]
links:
  website: http://www.eitce.org/
notes:
- Annual since 2017 and always held in China (Xiamen 2019 to 2023, Haikou area 2024, Chongqing 2025, Guangzhou 2026)
- Run by a commercial conference service (AEIC/AiScholar) with a different host university each year
- Proceedings in the ACM Digital Library since 2020 (IEEE Xplore in 2019), submitted to EI Compendex and Scopus
- The site does not name the publisher for the 2026 and 2027 proceedings
- Each paper is reviewed by two or three committee members, per the site
- Moved from an autumn slot (September to November, 2017 to 2024) to June (2025 onward)
- Presenter (abstract only) and listener registration are also offered
- Not listed in CORE ICORE2026 or the CCF list
