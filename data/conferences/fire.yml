region: south-asia
language: english
frequency: annual
organizer: IRSI (Information Retrieval Society of India)
proceedings: ACM ICPS (ACM DL) for the conference track; shared-task working notes in CEUR-WS
archival: true
indexing: [DBLP, ACM DL]
rank:
