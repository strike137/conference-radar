notes:
- Organized by IRSI; started in 2008 as a South Asian counterpart to TREC, CLEF and NTCIR
- Peer-reviewed conference track (regular and perspective papers double-blind, up to 9 pages) plus about 15 shared-task
  evaluation tracks and an industry track
- Conference papers published in ACM ICPS (2023 to 2025); shared-task working notes go to CEUR-WS
- Held every December in India with a rotating host (Goa 2023, Gandhinagar 2024, Varanasi 2025, Kolkata 2026); in
  person only, non-Indian nationals need a visa
- ACM SIGIR student travel grants (up to 6000 INR, travel within India)
