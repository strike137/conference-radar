notes:
- Non-profit two-day hacking and security camp for Korean middle school, high school and university students, run
  by POC (organizer of the POC conference) since 2009 together with Hacker School
- Held twice a year, a winter edition in February and a summer edition in August; 33rd edition in August 2026
- Usually at Hi Seoul Youth Hostel, Yeongdeungpo, Seoul (online 2020 to early 2022)
- About 60 participants plus speakers and staff (about 100 in total), selected by application; overnight camp, so
  no primary school students; non-students may apply but have lower priority
- Program of talks from a speaker application plus an overnight team CTF; POC covers speaker lodging and meals
- No papers or proceedings
