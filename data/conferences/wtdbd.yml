notes:
- Thesis and dissertation workshop of SBBD, the Brazilian Symposium on Databases (SBC); 25th edition in 2026
- For master's and PhD students presenting ongoing research; an advisor consent letter is required
- Up to 7 pages (a cover page plus 6 pages of content) in SBC format, Portuguese or English with abstracts in both, via JEMS
- Accepted papers appear in the Anais Estendidos do SBBD (ISSN 2966-3946) in SBC OpenLib (SOL), each with a DOI
- Publication requires SBBD registration and an oral presentation by the student
- Not listed in CORE ICORE2026
