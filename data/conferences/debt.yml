notes:
- One-day workshop on debugging techniques and debuggers (static and dynamic debugging, visualization, concurrent and distributed programs), held with ECOOP
- Held with ECOOP in Europe (Vienna 2024, Bergen 2025, Brussels 2026, Turin 2027); 2023 was in Seattle with ECOOP and ISSTA
- Technical papers up to 8 pages, work-in-progress papers of 2 to 4 pages, and talk or tool demo abstracts of 1 to 2 pages, via EasyChair
- Accepted papers are published in the ACM Digital Library; authors may opt out
- Not related to TechDebt (International Conference on Technical Debt)
- Not listed in CORE ICORE2026
