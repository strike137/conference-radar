notes:
- Workshop co-located with IEEE WCNC; half-day workshop (WS-15) at WCNC 2026 in Kuala Lumpur, listed again as WS02 at WCNC 2027 in Panama City
- Topics include federated and adaptive learning for IoT and IoV, generative AI at the edge, hybrid quantum-classical
  machine learning, quantum-enhanced wireless networks and AI/ML resource optimization
- Organizers from National Sun Yat-sen University (Taiwan), Lenovo (Germany), IISc (India), Memorial University (Canada),
  NTU (Singapore) and IIIT Guwahati (India)
- Accepted and presented papers go into the WCNC workshops proceedings in IEEE Xplore; no-show papers are removed
- Submissions via EDAS
- Not listed in ICORE2026
