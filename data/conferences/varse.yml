links:
  website: https://varse-events.github.io/varse2025/
notes:
- ASE workshop on software engineering for VR/AR apps (testing, analysis, performance, privacy) and VR/AR-based software engineering tools
- Held with ASE 2022 (Ann Arbor), ASE 2024 (Sacramento) and ASE 2025 (Seoul); no edition in 2023
- Papers up to 5 pages plus 1 page of references, IEEE format, double-blind review, submission via EasyChair
- Accepted papers go into the ASE workshop proceedings; selected papers invited to an ASE Journal special issue
- Not among the accepted ASE 2026 workshops
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
