notes:
- Workshop on using large language models across the software engineering lifecycle, with a strong model-driven engineering flavour
- Held at STAF; successor of LLM4MDE 2024 (Enschede), then LLM4SE 2025 (Koblenz, 1st edition) and LLM4SE 2026 (Rennes, 2nd edition)
- Papers appear in the joint STAF workshops proceedings in CEUR-WS (Vol-4122 for 2025, with 8 long LLM4SE papers)
- Regular papers 10 pages and short papers 4 pages plus references, CEUR single-column template; extended abstracts are presented but not published
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
