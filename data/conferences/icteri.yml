notes:
- Ukrainian computer science conference series held since 2011, with roots in the EU TEMPUS project UnIT-Net
- Covers information systems and ICT infrastructures in industry and education, with emphasis on practical use
  and proof of concept
- Proceedings in Springer CCIS since 2023 (CCIS 1980 for 2023, 2359 for 2024, 2763 for 2025); earlier volumes
  in CEUR-WS, with selected extended papers in Springer CCIS post-proceedings
- Usually held at a Ukrainian university (Ivano-Frankivsk 2023, Lviv 2024, Chernivtsi 2026); 2025 was held in
  Nice, France
- No conference fee; speakers must present in person
- Main track plus PhD symposium, posters and satellite workshops; small program (21 to 26 main papers per year)
