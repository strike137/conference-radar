notes:
- Annual workshop of IFIP WG 8.11/11.13, a joint working group of TC8 (information systems) and TC11 (security)
- Behavioral and organizational IS security research (policy compliance, security behavior, privacy, computer
  crime, NeuroIS); purely technical, design-science or econometric papers are out of scope
- Papers are formative working papers meant to be developed into journal articles; the workshop notebook is
  distributed to attendees and posted on the WG website, so non-archival
- Double-blind review of 15 to 25 page double-spaced manuscripts; early-stage or completed papers accepted
- Only authors of accepted papers and active WG members attend; high-quality 2025 papers fast-tracked to the
  Journal of Intellectual Capital
- Held since 2009, mostly at US universities (Kennesaw State 2024), also Cape Town, Newcastle, Strathclyde 2023
  and Nairobi 2025
- 'CORE: not listed in ICORE2026'
