notes:
- Free community security conference in the Rio Grande Valley of South Texas, USA; part of the Security BSides framework
- 2026 was the 7th annual edition, held at the Mission Event Center in Mission, Texas, with three parallel rooms and an evening reception
- Talks of 30 to 60 minutes including Q&A, plus 15-minute lightning talks to encourage new presenters; sales pitches are rejected
- Topics span offensive security, defense, incident response, AppSec, cloud, hardware hacking, AI/ML security, careers and privacy
- Talks only, no proceedings; not listed in the CORE ICORE2026 search
