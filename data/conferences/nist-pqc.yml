id: nist-pqc
name: NIST PQC Conference
full_name: NIST PQC Standardization Conference
type: conference
tier: minor
areas: [crypto, security]
region: north-america
language: english
frequency: irregular
organizer: NIST (Computer Security Resource Center)
organizer_country: [usa]
proceedings: None (accepted papers and slides posted online)
archival: false
typical:
  deadline_months: [1, 6]
  conference_months: [4, 9]
links:
  website: https://csrc.nist.gov/events/2025/6th-pqc-standardization-conference
notes:
- Run by NIST as part of its post-quantum cryptography standardization project; 6th edition in 2025
- Submission teams of selected and candidate algorithms give updates; open call for research papers, surveys, presentations and panel proposals
- Papers up to 20 pages, submitted by email to NIST
- 'Conference without proceedings: accepted papers and presentations are posted on the NIST website afterwards'
- NIST encourages preliminary work that authors plan to publish elsewhere
- Held near NIST in Maryland (Rockville 2024, Gaithersburg 2025), with hybrid attendance in 2025
- Not in the ICORE2026 portal and not on the CCF list
