notes:
- Half-day workshop co-located with ACM SIGSPATIAL (Beijing 2021, Hamburg 2023, Atlanta 2024, Minneapolis 2025, Riverside 2026)
- Topics are search and retrieval over large geospatial data, LLM and VLM based geospatial retrieval, spatial indexing and keyword search
- Proceedings of each edition in the ACM Digital Library (GeoSearch 2025 -> DOI 10.1145/3764920)
- Full papers 6-8 pages, short or demo papers 4 pages; single-blind review; extended versions of SIGSPATIAL 4-page papers allowed
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
