notes:
- Half-day workshop on edge AI systems at ACM MobiSys 2026, University of Cambridge
- Organized and supported by the EU-funded dAIEdge network of excellence (grant 101120726)
- Papers up to 6 pages in ACM double-column format excluding references; single-blind review
- Accepted papers and 1 to 2 page demo summaries are published in the ACM Digital Library
- Demo session (on-site, remote or video); best paper award with 300 EUR for authors outside the dAIEdge consortium
- No acronym on the site; ExcelAI comes from the site URL, and the accepted papers page is headed ExcelAIEdge26
- Not listed in the CORE portal (ICORE2026)
