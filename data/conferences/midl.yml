notes:
- Run by the MIDL Foundation, a non-profit registered in the Netherlands
- Full papers published in PMLR (vol. 315 for 2026, vol. 301 for 2025)
- Main track and a clinical translation and validation track for full papers; a later short paper track for early
  work
- Full paper deadline in early December (AoE), rebuttal in January, decisions in February
- 'Held worldwide: Zurich 2022, Nashville 2023, Paris 2024, Salt Lake City 2025, Taipei 2026, Porto 2027'
- Not listed in CORE ICORE2026; regarded as a well-known venue for deep learning in medical imaging
