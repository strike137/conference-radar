notes:
- IFIP WG 1.3 workshop on the theory of coalgebras, coinduction, their logics and applications (automata, semantics, verification, modal logic)
- Held every two years (even years) as a satellite event of ETAPS; established in 1998, CMCS 2026 was the 18th edition
- Proceedings in Springer LNCS since 2012 (earlier volumes in ENTCS); CMCS 2026 regular papers go to a post-conference Springer volume in the IFIP-LNCS series
- Regular papers up to 18 pages in LNCS style; short contributions of up to 2 pages are bundled in a technical report
- Sister conference CALCO (Algebra and Coalgebra in Computer Science) runs in odd years
- Not listed in ICORE2026
