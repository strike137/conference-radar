notes:
- Bulgarian automation and computer science conference with over 55 years of history, held under the patronage of the President of Bulgaria during the John Atanasoff days in October
- Organized since 2020 by the John Atanasoff Society of Automatics and Informatics, Technical University of Varna, IEEE Bulgaria Section and the Federation of the Scientific Engineering Unions
- Held every year at the Technical University of Varna, Bulgaria; hybrid (in-person and virtual) format
- Proceedings in IEEE Xplore since 2020, indexed in Scopus; earlier editions (AI'12 to AI'19) had their own proceedings
- 4 to 6 page papers (8 for invited papers), at least two reviews each, submitted through EasyChair
- Submission deadline usually extended by about three weeks
- "Fee: 330 EUR regular virtual, 280 EUR IEEE/SAI members, 150 EUR students, plus 80 EUR per in-person attendee (2026)"
- Not to be confused with other venues called ICAI; not listed in CORE ICORE2026
