notes:
- Large multi-track congress run by the American Council on Science and Education; steering committee co-chaired by Hamid R. Arabnia
- Held every December in Las Vegas (Luxor Hotel); sister event of the CSCE congress
- Proceedings by Springer Nature since 2024 (Springer CCIS, 8 volumes, in 2025), published after the event; IEEE Xplore proceedings from 2014 to 2023
- Rolling review with a decision about seven days after submission; deadlines are extended repeatedly
- Very large event with rolling decisions, widely regarded as low tier
- Not listed in ICORE2026 or the CCF 2026 list
