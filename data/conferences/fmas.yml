notes:
- Peer-reviewed academic workshop (at least three reviews per paper) on formal specification and verification of autonomous and robotic systems
- Organised by researchers from UK, German and Irish universities; steering committee at the Universities of Nottingham and Manchester
- Proceedings in EPTCS (FMAS 2025 -> EPTCS volume 436); a journal special issue collects extended papers
- 'Satellite of SEFM 2022 (Berlin), iFM 2023 to 2025 (Leiden, Manchester, Paris) and ICFEM 2026 (Southampton)'
- Short papers (vision, research preview) up to 6 pages and long papers (regular, experience report) up to 15 pages, EPTCS style
- Remote participation is free, but one author per paper must pay for on-site registration; FME-sponsored student registration waivers
- Not listed in ICORE2026 or the CCF list
