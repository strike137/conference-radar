notes:
- Run by the Hellenic Artificial Intelligence Society (EETN); established in 1996 and held every two years at different places in Greece since 2002
- Proceedings in the ACM International Conference Proceedings Series (ACM DL), open access at no cost to authors in 2026
- SETN 2026 (14th edition) was co-organized with the Technical University of Crete at the Cultural Centre of Chania
- Full papers 6 to 10 pages, short papers 2 to 4 pages, plus nectar abstracts of already published work; double-blind review
- Not listed in CORE ICORE2026
