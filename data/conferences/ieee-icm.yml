id: ieee-icm
name: ICM
full_name: International Conference on Microelectronics
type: conference
tier: minor
areas: [general, communications, systems]
region: worldwide
language: english
frequency: annual
organizer: ICM organizing committee with a local host institution each year; IEEE Circuits and Systems Society (CASS)
  regional chapters as technical co-sponsors
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
indexing: [Scopus]
fee: 'Author registration 400 to 600 USD early, 450 to 650 USD regular by IEEE/CASS membership; online author 200 USD
  early (2026)'
typical:
  deadline_months: [9, 10]
  conference_months: [12]
links:
  website: https://www.ieee-icm.org/
notes:
- Long-running series (38th edition in 2026) held mostly in the Middle East and North Africa (Abu Dhabi 2023, Doha 2024,
  Cairo 2025) and in Kuching, Malaysia in 2026
- Covers circuits and systems, analog and RF design, VLSI, EDA, semiconductor devices, AI hardware and embedded
  hardware security
- Papers up to 4 pages of content plus an optional 5th page of references, IEEE format, submitted via EDAS
- Accepted and presented papers go to IEEE Xplore; the 2025 proceedings are indexed in Scopus
- Top 10 to 15% of papers invited to extended versions in IEEE Transactions on VLSI Systems (2026)
- Each accepted paper needs a full non-student author registration; online presentation possible with approval
- Deadlines are usually extended several times
- Not listed in CORE ICORE2026 or the CCF list
