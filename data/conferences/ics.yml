notes:
- Sponsored by ACM SIGARCH and ACM SIGHPC; held annually since 1987; covers HPC, parallel systems and computer architecture
- ICORE2026 A, CCF B
- Papers published in the ACM proceedings; ACM publications are open access from 2026, so authors outside ACM Open institutions may pay an APC (subsidized to 250 / 350 USD for 2026 conferences)
- Rotates worldwide (Orlando at FCRC 2023, Kyoto 2024, Salt Lake City 2025, Belfast 2026, Atlanta at FCRC 2027)
- Two submission cycles with a rebuttal phase in 2026; ICS 2027 uses early reject decisions followed by an author revision window
