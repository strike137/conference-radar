notes:
- Japan's largest conference for game and computer entertainment developers, run by CESA with Nikkei BP and backed by
  METI and the City of Yokohama
- About 200 sessions over three days in seven fields; engineering, production, visual arts, business and produce,
  sound, game design and academic research
- Hybrid; on site at Pacifico Yokohama North plus live and time-shifted online streaming
- Talks chosen by the CEDEC steering committee from a public call for speakers (regular, short, panel, roundtable,
  interactive, workshop, tutorial and lightning talk formats); accepted speakers get a free regular pass
- No papers; speakers are encouraged to publish slides on CEDiL, a free archive of talk materials
- Past-edition list on the site goes back to CEDEC2000
