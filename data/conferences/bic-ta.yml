id: bic-ta
name: BIC-TA
full_name: 'International Conference on Bio-Inspired Computing: Theories and Applications'
type: conference
tier: minor
areas: [ai]
region: china
language: english
frequency: annual
organizer: BIC-TA Steering Committee (chair Linqiang Pan, Huazhong University of Science and Technology) with a rotating Chinese host university
organizer_country: [china]
proceedings: Springer CCIS
archival: true
typical:
  deadline_months: [9, 10, 11]
  conference_months: [11, 12]
links:
  website: http://2026.bicta.org/
notes:
- Bio-inspired computing -> neural networks, evolutionary computing, swarm intelligence, DNA and membrane computing, AI applications
- Papers appear in Springer CCIS after the conference (final versions due about three weeks after the event)
- Full papers 8 to 15 pages in Springer format; submission through Microsoft CMT
- Held in China every year (2023 Changsha, 2024 Suzhou, 2025 Wuhan, 2026 Xiamen)
- "Registration fee: 3500 RMB (about 480 USD) with a paper, before 6 December (2026)"
- Not listed in the CORE portal (ICORE2026)
