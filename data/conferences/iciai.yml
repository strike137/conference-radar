id: iciai
name: ICIAI
full_name: International Conference on Innovation in Artificial Intelligence
type: conference
tier: minor
areas: [ai]
region: asia-pacific
language: english
frequency: annual
organizer: Conference secretariat (iciai2018@vip.163.com), chaired by Sheng-Uei Guan, with host universities
proceedings: Springer LNEE
archival: true
indexing: [EI, Scopus]
fee: 580 USD regular author, 500 USD student author (2027, early bird)
typical:
  deadline_months: [12]
  conference_months: [3, 4]
links:
  website: https://www.iciai.org/
notes:
- Held every year since 2017; 2027 is the 11th edition
- Recent editions in Harbin 2023 (hybrid), Waseda University Tokyo 2024 and 2026, NTU Singapore 2025, NIDA Bangkok 2027; online in 2021 and 2022
- Proceedings in Springer Lecture Notes in Electrical Engineering since 2025 (LNEE vol. 1458 for 2025, vol. 1690 for 2026); ACM ICPS (ACM DL) from 2018 to 2024
- Stated as indexed in EI Compendex and Scopus
- Abstract only presentation also offered; only full papers are published
- Smaller commercially run conference; organizer_country left out because the secretariat's country is not stated
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
