notes:
- Practitioner and CISO-oriented cybersecurity conference for Central and Eastern Europe, founded in 2014 by Ondrej Krehel and Maria Krahulecova
- Two editions a year, Qubit Conference Prague in May (14th edition in 2027) and Qubit Conference Slovakia in November in the Low Tatras (6th edition in 2026)
- Programme curated by an independent Speaking Bureau of industry professionals
- "Session formats: keynotes, executive and technical talks, workshops, panels and pre-conference trainings"
- Speakers attend free and get CPE credits; talks must be original
- Paid tickets, with vendor partners; also runs CISO, DPO and Audit clubs
- No proceedings
