id: icsse
name: ICSSE
full_name: International Conference on System Science and Engineering
type: conference
tier: minor
areas: [general, ai]
region: asia-pacific
language: english
frequency: annual
organizer: Taiwan Association for System Science and Engineering (TASSE) and the host university
organizer_country: [taiwan]
proceedings: IEEE Xplore
archival: true
fee: 400 USD regular, 200 USD student (2025, early bird)
typical:
  deadline_months: [4, 5]
  conference_months: [5, 6, 7, 8]
links:
  website: https://ele.mcu.edu.tw/icsse2026/
notes:
- Run by the Taiwan Association for System Science and Engineering with a local host university (National Ilan University in 2026)
- Rotates within Asia (Ho Chi Minh City 2021 and 2023, Taichung 2022, Hsinchu 2024, Chiang Mai 2025, Aomori 2026)
- Very broad EE and CS scope (AI, control, robotics, communications, power, security, software)
- Regular papers of 6 pages (up to 8 with extra page fees) go to IEEE Xplore; one-page presentation-only position
  papers appear only in the conference proceedings
- Double-anonymous review via EasyChair; selected papers recommended to journals
- Hybrid participation offered for overseas authors (2025)
- Not listed in ICORE2026; not on the CCF list
