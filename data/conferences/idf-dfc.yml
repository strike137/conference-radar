notes:
- Annual two-day event of the NPO Institute of Digital Forensics (IDF), held every December in Tokyo (23rd edition
  in 2026, Shinagawa The Grand Hall)
- Invited keynotes and panel sessions by government, police, legal and industry speakers; no open call for papers
- Hosts the IDF Excellent Young Researcher Award ceremony for published digital forensics papers (2025 winners came
  from CSS 2025, IJCNN 2025 and IPSJ Journal)
- On-site capacity 250; student registration is free in 2026; a CTF run by the IDF young members WG (35 seats, pre-registration)
  runs on day 2
- Event reports are sold afterwards as a report book
