notes:
- Non-profit, community-driven cybersecurity conference in Bengaluru, India, approved by Security BSides
- Main event is the one-day Annual Cyber Security Conference (ACSC) in July at the Sheraton Grand, Whitefield, preceded by paid hands-on trainings (ATP) and accompanied by CTFs
- Also runs smaller themed Quarterly Summits (Q3 2025 summit held with W3-CS)
- "CFP categories: new research (unpublished work, vulnerabilities, zero days), current research and tools"
- Speakers get a complimentary conference pass; speakers from outside Bangalore can claim travel tickets
- Site states past conferences drew more than 1200 attendees
- No proceedings; slides and talk recordings may be published by the organizers
