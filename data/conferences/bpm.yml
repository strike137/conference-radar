notes:
- Premier venue of the business process management and process mining community, held since 2003
- Series run by an international steering committee; each edition is hosted by a local university (York University in 2026, KU Leuven in 2027)
- Main research papers in Springer LNCS; the BPM Forum proceedings appear in Springer LNBIP
- Three research tracks (Foundations, Engineering, Management), plus workshops, demos, doctoral consortium and industry forum
- Mostly held in Europe; recent editions were Rome (2021), Muenster (2022), Utrecht (2023), Krakow (2024), Seville (2025) and Toronto (2026)
- CORE A in ICORE2026; not on the CCF list
