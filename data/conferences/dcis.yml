notes:
- Forum on micro- and nano-electronic circuits and integrated systems (analog and mixed-signal, RF ICs, EDA, test, hardware security)
- Run by a steering committee of mostly Spanish and Portuguese universities and research centres; the 2026 edition is organized by IST / INESC-ID (Universidade de Lisboa)
- 41st edition in 2026, held in Ericeira, Portugal
- Accepted papers up to 6 pages in IEEE format are published in IEEE Xplore; at least one author registration is required for inclusion
- Includes a PhD Forum and Poster Competition with one-page abstracts and a best poster award
- Not ranked in CORE ICORE2026 and not on the CCF list
