full_name: International Conference on Applied Cryptography and Network Security
type: conference
tier: major
areas: [security, crypto, networking]
region: worldwide
language: english
frequency: annual
organizer: ACNS Steering Committee (hosted by a local university each year)
proceedings: Springer LNCS
indexing: [DBLP, Scopus, EI]
rank:
  core: B
  ccf: C
acceptance_rate: 20.9% (2026, 59/282)
