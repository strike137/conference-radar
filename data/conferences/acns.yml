links:
  website: https://acns2027.isg.rhul.ac.uk/
  dblp: https://dblp.org/db/conf/acns/index.html
notes:
- Two submission cycles per year (September and January) with anonymous submissions; papers rejected in the September
  cycle cannot be resubmitted in the January cycle
- Proceedings in Springer LNCS; co-located satellite workshops (AIBlock, AIHWS, SCI, etc.) get their own LNCS post-proceedings
- Location rotates worldwide; held in Kyoto, Japan in 2023 and Abu Dhabi in 2024
- Regarded as a solid mid-tier applied crypto and security venue; acceptance rate around 20 to 23%
- In-person presentation required; best student paper award (1,500 EUR in 2027)
