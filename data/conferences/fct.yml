notes:
- Biennial theoretical computer science symposium established in 1977, held in odd years
- Covers all of theoretical computer science (algorithms, complexity, formal languages, logic, formal methods)
- Proceedings in Springer LNCS
- Held in Europe; recent editions in Wroclaw (2025), Trier (2023), Athens (2021), Copenhagen (2019), Bordeaux (2017) and Gdansk (2015)
- FCT 2025 presented 32 accepted papers
- Ranked B in ICORE2026; not on the CCF 2026 list
