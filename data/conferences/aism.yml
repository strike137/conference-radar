notes:
- One-day workshop co-located with ASE (IEEE/ACM Automated Software Engineering); 1st edition at ASE 2025 in Seoul, 2nd at ASE 2026 in Munich
- Topics include legacy transformation (COBOL to Java, C++ to Rust), framework and dependency upgrades, cloud migration, data migration and testing of modernized code with AI
- Research and vision papers, plus invited talks and discussions
- Accepted papers go into the ASE conference proceedings, available in the ACM/IEEE Digital Library
- Organizers 2026 are Shivali Agarwal (IBM India), Sridhar Chimalakonda (IIT Tirupati), Rahul Krishna (IBM Research), Raveendra Kumar Medicherla (TCS Research) and Srikanth G. Tamilselvam (IBM)
- Not listed in ICORE2026 or the CCF 2026 list
