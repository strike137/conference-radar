notes:
- INSTICC conference on intelligent control, robotics and automation, signal processing and industrial informatics
- Papers in the SCITEPRESS Digital Library; revised and extended versions of selected papers appear in a
  Springer LNEE book
- Best papers invited to a special issue of the Springer Nature Computer Science journal
- CORE C (ICORE2026)
- Co-located with CoopIS, icSPORTS, CHIRA, WEBIST, IJCCI and IC3K, with free access to the co-located events
- Two submission stages plus a late-breaking track; all deadlines AoE
- Held in Europe (Lisbon 2022, Rome 2023, Porto 2024, Marbella 2025, Angers 2026)
