notes:
- Workshop on temporal graph learning, dynamic graphs and spatio-temporal time series
- Earlier editions were held at NeurIPS 2022 and NeurIPS 2023; the 2025 edition moved to KDD 2025 in Toronto
- Non-archival; welcomes standard papers, position papers and extended abstracts
- All accepted papers are presented at a poster session; selected ones get spotlight talks
- Organizers include Reihaneh Rabbany (McGill/Mila) and Michael Bronstein (Oxford)
- Not listed in ICORE2026 and not on the CCF list
