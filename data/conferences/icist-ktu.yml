notes:
- Hosted by Kaunas University of Technology (KTU), Lithuania; held in Kaunas every October with remote participation possible
- Not the same venue as ICIST, the International Conference on Information Science and Technology
- Covers information systems, business intelligence, software engineering and IT applications, with topics from AI and IoT to cybersecurity and HCI
- Proceedings published by Springer as a volume of Communications in Computer and Information Science (CCIS); Springer volumes since 2012
- Submission via EasyChair; full paper deadline in April, notification in May, print-ready papers in June, four months before the conference
- Registration fee must be paid before papers are passed to Springer, and applies even when no author presents in person
- Not listed in the CORE ICORE2026 portal
