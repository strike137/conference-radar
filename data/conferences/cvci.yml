id: cvci
name: CVCI
full_name: International Conference on Computer Vision and Computational Intelligence
type: conference
tier: minor
areas: [vision, ai]
region: asia-pacific
language: english
frequency: annual
organizer: CVCI conference secretariat (contact cvci.conference@gmail.com) with a host university each year (Ritsumeikan University in 2027)
proceedings: SPIE Digital Library
archival: true
indexing: [EI, Scopus]
fee: 580 USD regular author, 530 USD student author (2027); 30 USD per page beyond 14 pages
typical:
  deadline_months: [11]
  conference_months: [1, 2]
links:
  website: http://www.cvci.net/
notes:
- Held every year since 2020; 2027 is the 8th edition
- Host city changes each year (Ho Chi Minh City 2023, Bangkok 2024, Hong Kong 2025, Hokkaido University in Sapporo 2026, Ritsumeikan University Osaka Ibaraki Campus 2027); 2021 and 2022 were online, later editions hybrid
- Proceedings alternate between publishers -> SPIE Digital Library (2024, 2026, 2027) and ACM DL (2025), stated as EI Compendex and Scopus indexed
- 2027 edition puts special emphasis on optics and photonics combined with computer vision
- Full papers of 8 to 14 pages; abstract-only presentation without publication is also offered
- Smaller commercially organized conference run by a conference secretariat; the organizing company is not named on the site, so organizer_country is left out
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
