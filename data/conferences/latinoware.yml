notes:
- Latin American free software and open technologies congress, held every year since 2004 and run by Itaipu Parquetec with Itaipu Binacional
- Held in Foz do Iguacu, Parana, Brazil (Curitiba only in 2005); 2026 was the 23rd edition
- Large community event with talks, a hackathon, a CTF and an expo; the peer reviewed academic track is called Latin.Science (since 2019)
- Latin.Science takes full papers (6 to 10 pages) and short papers (3 to 4 pages) in Portuguese, Spanish or English, IEEE based template, blind peer review, submission via JEMS
- Accepted papers are published open access in the Anais do Latinoware on SBC OpenLib (SOL) of the Brazilian Computer Society, with DOIs
- 2025 Latin.Science had 265 submissions and 144 published papers (91 full, 53 short)
- Free to submit; topics include free software, open hardware, security, AI and machine learning, IT governance and digital inclusion
