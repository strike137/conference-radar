notes:
- The only Australasian conference devoted entirely to computing education; 29th edition in 2027
- Held as part of the Australasian Computer Science Week (ACSW) in late January or February; host city rotates within
  Australia
- Run in cooperation with ACM SIGCSE; proceedings in the ACM Digital Library every year since 2021
- Research papers and practitioner papers of 5 to 10 pages including references, plus posters and a phased paper
  submission for newcomers; submission via the ACSW EasyChair
- Welcoming to researchers new to computing education research and to teaching practitioners
- Ranked Australasian B in ICORE2026; not on the CCF list
