notes:
- Smaller software engineering symposium started in 2019; topics range from requirements, testing and reliability to AI and HCI
- Run by the organizer SCIEI (contact wsse@sciei.org, submission via EasyChair) with Hiroshima University as sponsor
- Started in Wuhan, China in 2019; online 2020 to 2022 (organized by Huaqiao University, China in 2021 and 2022); held in Japan since 2023 (Tokyo, Kyoto, Okayama, Nara)
- Proceedings 2019 to 2025 in the ACM Digital Library, indexed by EI Compendex and Scopus per the site
- Several submission rounds; a final deadline about six weeks before the event
- About 45 of nearly 100 submissions accepted in 2024 and about 60 of over 120 in 2023 per the history pages
- Abstract-only presentation is possible without publication
- Selected papers invited to a special issue of the MDPI journal Software
- Not listed in ICORE2026 or the CCF 2026 list
