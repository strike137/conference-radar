id: latincrypt
name: LATINCRYPT
full_name: International Conference on Cryptology and Information Security in Latin America
type: conference
tier: minor
areas: [crypto, security]
region: latin-america
language: english
frequency: biennial
organizer: 'Local Latin American host universities, in cooperation with IACR (2025: Universidad Nacional de Colombia
  Sede Medellín and Universidad EAFIT)'
organizer_country: [other]
proceedings: Springer LNCS
indexing: [Scopus, DBLP]
rank:
  core: Unranked
acceptance_rate: About 41% (2025, 17/41)
fee: About 480 USD (2025, regular early; about 240 USD for students; charged in COP)
typical:
  deadline_months: [5, 6]
  conference_months: [10]
links:
  website: https://ciencias.medellin.unal.edu.co/eventos/latincrypt/
  dblp: https://dblp.org/db/conf/latincrypt/index.html
notes:
- Held in cooperation with IACR; proceedings in Springer LNCS (Progress in Cryptology series)
- Biennial in odd years since 2015, rotating among Latin American countries, usually early October
- Preceded by the ASCrypto school for PhD students (2025 also had CatíoCrypto, an introductory school taught in
  Spanish); sponsors offered financial support to students in 2025
- Small cryptology venue (about 17 to 22 papers per edition); not ranked by CORE
