notes:
- Biennial meeting of ACL SIGMOL on mathematical structures and methods in linguistics (formal language theory, grammar formalisms, learnability, logic, neural network foundations)
- Held since 1984 and every two years since 1991, sometimes jointly with Formal Grammar; no meeting between MoL 17 (2021) and MoL 18 (2025)
- Recent meetings in Stony Brook (2025), online with MALIN in Montpellier (2021), Toronto (2019), London (2017), Chicago (2015)
- Peer-reviewed papers (up to 12 pages, at least three reviewers) published in the open-access MOL proceedings in the ACL Anthology
- Small meeting, 13 papers in the 2025 proceedings
- Not ranked in ICORE2026 and not on the CCF 2026 list
