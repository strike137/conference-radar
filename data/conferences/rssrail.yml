organizer: RSSRail Steering Committee (2025 hosted by CNR-ISTI, Pisa)
organizer_country: [europe]
proceedings: Springer LNCS
archival: true
indexing: [Springer LNCS]
fee: 750 EUR regular, 600 EUR student (2025, early)
links:
  website: https://rssrail2025.isti.cnr.it/
notes:
- Working conference on formal methods for reliability, safety and security of railway systems, mixing academia
  and rail industry (SNCF, RATP, Siemens, Hitachi, CLEARSY)
- Proceedings in Springer LNCS; special issues planned for extended versions of selected papers
- Held in Europe at irregular intervals (Paris 2016, Pistoia 2017, Lille 2019, Paris 2022, Berlin 2023, Pisa 2025)
- Regular papers up to 16 pages and short papers up to 8 pages in LNCS format, plus journal-first, tutorial and
  poster tracks; submission via EasyChair
- EURNEX sponsors a 500 EUR best student paper award
- Not listed in ICORE2026 or the CCF recommended list
