notes:
- Working conference on formal methods and engineering for railway reliability, safety and security, with academic and industry participants
- Proceedings in Springer LNCS; special issues planned for extended versions of selected papers
- Held in Europe (2016 Paris, 2017 Pistoia, 2019 Lille, 2022 Paris, 2023 Berlin, 2025 Pisa); roughly every one to three years
- Regular papers up to 16 pages, short papers up to 8 pages, journal-first papers, tutorials and posters
- EURNEX sponsors a 500 euro best student paper award
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
