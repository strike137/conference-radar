notes:
- Non-commercial, community-organized hacker congress in Novi Sad, Serbia, run by LUGoNS
- Held every September in Novi Sad since 2013 (2025 and 2026 at the Congress Center); the archive lists no 2021 edition and titles 2020 "Never Happened"
- CFP for talks and workshops opens in spring (5 April 2025, 29 March 2026) and closes on 1 July (23:59 UTC); notification on 15 July
- Each edition has its own site (2k25.balccon.org, 2k26.balccon.org); balccon.org redirects to the current one
