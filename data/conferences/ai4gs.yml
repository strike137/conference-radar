notes:
- Run by IFIP TC12 Working Group 12.13 (AI for Global Security), chaired by Dominique Verdejo (University of Reims)
- 1st edition AI4GS-24 on 19 November 2024 at Campus Cyber, Paris La Defense, co-organized by the French COMCYBER-MI, AFIA and INRIA
- 2nd edition AI4GS-25 on 17 August 2025 in Montreal as IJCAI 2025 workshop W16, held alongside the AI4S workshop
- Proceedings published by Springer in the IFIP AICT series
- Topics include AI in cybersecurity, military applications, counterterrorism, homeland security, AI ethics and governance
- Only two editions so far; not on the CORE portal (ICORE2026) or the CCF 2026 list
