id: nlp4call
name: NLP4CALL
full_name: Workshop on Natural Language Processing for Computer-Assisted Language Learning
type: workshop
tier: minor
areas: [nlp, ai]
region: europe
language: english
frequency: annual
organizer: Språkbanken Text, University of Gothenburg (Elena Volodina and colleagues)
organizer_country: [europe]
proceedings: NEALT Proceedings Series (ACL Anthology)
archival: true
typical:
  deadline_months: [9, 12]
  conference_months: [3, 5, 10, 11]
fee: Free (2026, onsite and online)
links:
  website: https://spraakbanken.gu.se/en/research/themes/icall/nlp4call-workshop-series/nlp4call2026
notes:
- Workshop series on NLP and speech technology for intelligent computer-assisted language learning (ICALL), running
  since 2012 (15th edition in 2026)
- Often co-located with NoDaLiDa (2023 Tórshavn, 2025 Tallinn), otherwise standalone (2022 Louvain-la-Neuve, 2024
  Rennes, 2026 Gothenburg)
- Short, long and demo papers, double-blind review by at least two PC members
- Proceedings in the NEALT Proceedings Series and the ACL Anthology
- Hosts multilingual grammatical error detection and correction shared tasks (MultiGED-2023, MultiGEC-2025)
- 2026 edition is a free two-day hybrid event in Gothenburg
- Not listed in ICORE2026 and not on the CCF list
