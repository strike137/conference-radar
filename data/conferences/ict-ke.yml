notes:
- Long-running Thai IT conference (24th edition in 2026) hosted every year by Siam University in Bangkok
- Co-organized by the IEEE Thailand Section and the IEEE Thailand Section Computer Chapter (2026); the 2027 page lists APDMEN and the Computer Association of Thailand as joint organizers
- Accepted papers are submitted to IEEE Xplore; earlier volumes (2014 to 2025) are in IEEE Xplore
- Held in Bangkok every November (2020 to 2025 per the IEEE proceedings records)
- Topics in knowledge and data engineering, data mining, machine learning, information retrieval and web technologies
- Single paper deadline about seven weeks before the conference (2026); the 2027 call moves it to June
