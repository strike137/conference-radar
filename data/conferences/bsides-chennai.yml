notes:
- Community-driven Security BSides cybersecurity conference in Chennai, India
- One-day conference with a CXO and strategy track, tech talks and three hands-on villages (DFIR, LLM security, network security), preceded by a CTF a week earlier (2026-05-23 for the 2026 edition)
- 2026 edition expected 500+ attendees and listed 14+ speakers, mostly from industry
- Call for papers ran through a Google Form; it was closed when checked
- Student tickets require a valid college or university ID; tickets are non-refundable
- No proceedings; talks only
