links:
  website: https://retailvisionworkshop.github.io/
notes:
- Workshop on computer vision for retail (product recognition, shopper action detection, virtual try-on, product image generation)
- Theme title "Revolutionizing the World of Retail"
- Held with CVPR 2020 to CVPR 2024, ICCV 2025 (Honolulu) and ECCV 2026 (Malmo)
- Accepted papers go into the official host conference workshop proceedings; submissions via OpenReview
- Often runs a challenge with industry data (GroceryVision challenge based on Amazon data)
- Not listed in ICORE2026 or the CCF list
