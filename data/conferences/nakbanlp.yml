notes:
- Workshop on NLP for documenting and analysing the Nakba, covering oral histories, archives, social media and Arabic resources
- First edition held online with COLING 2025 (Abu Dhabi, January 2025), second with LREC 2026 in Palma de Mallorca
- 2025 received 18 submissions and accepted 13 (72%)
- Proceedings in the ACL Anthology (2026 volume published by ELRA)
- Long papers up to 8 pages, short papers up to 4 pages; submission via Softconf START
- Runs several shared tasks (five in 2026, including NakbaVirality, StanceNakba and Arabic manuscript understanding)
- Hybrid workshop in 2026
- Not ranked in ICORE2026 and not on the CCF list
