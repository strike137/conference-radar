notes:
- Workshop on language resources and NLP for Nakba narratives (oral testimonies, archives, manuscripts)
- First edition with COLING 2025, held virtually on January 20, 2025; second with LREC 2026 in Palma, hybrid
- Proceedings in the ACL Anthology (ACL in 2025, ELRA in 2026); 47 papers in 2026 (6 regular, 4 shared task overviews, 37 shared task system papers)
- 2026 included a shared task on Arabic handwritten manuscript understanding
- Not listed in ICORE2026 and not on the CCF list
