notes:
- Practitioner conference on open source software for embedded and IoT systems (Linux kernel, Zephyr, bootloaders, Yocto, RISC-V, security)
- Organized by BayLibre in the tradition of Kernel Recipes; two days, single track, 40 minute talks and 15 minute lightning talks
- Held in Paris in 2019, 2022 and 2023 and in Nice since 2025; capacity about 200 people
- "Registration fee: 100 EUR (2026), plus 50 EUR for the evening social event"
- Talk proposals via pretalx CFP; no papers, slides and recordings are posted online
