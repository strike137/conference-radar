notes:
- Community-run Security BSides conference for Galway, Ireland; 2026 (21 February) is the only past edition listed on the site
- One day on a Saturday in February at the University of Galway (Human Biology Building in 2027)
- Talks in English with a genuine security angle; formats are 10 minute rookie talks, 25 and 40 minute talks and 40 minute panels; sales pitches rejected
- Call for papers on Sessionize, open October to mid or late November; free for speakers
- Multiple tracks, a CTF and a sponsor hall; talks only, no proceedings
- Not listed in the CORE ICORE2026 portal
