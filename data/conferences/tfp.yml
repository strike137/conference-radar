notes:
- International forum on all aspects of functional programming, with research, position, project, evaluation and overview papers and functional pearls
- Two review routes; full papers reviewed before the symposium, or draft papers presented first and then submitted to a post-symposium review
- Draft papers get light review for presentation only; formal publication is decided in the post-symposium refereeing
- Extended abstracts of 4 to 10 pages or full papers up to 20 pages, LNCS style; single-blind review in 2026 (HotCRP), 2027 submissions via EasyChair
- Formal proceedings published by Springer in the Trends in Functional Programming volumes of LNCS
- Known for a friendly review process aimed at less experienced authors; John McCarthy best paper and David Turner best student paper awards
- Co-located with the TFPiE workshop (Trends in Functional Programming in Education) on the day before
- Recent venues are Odense 2026, Oxford 2025, Seton Hall 2024, UMass Boston 2023, online 2021 and 2022; 2027 in Kyoto, Japan
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
