notes:
- Smaller commercially run conference; contact via a 163.com address and submission via zmeeting.org
- Annual since 2016; 2027 is the 12th edition
- "Hosts so far: Tokyo 2016, Wuhan 2017, Singapore 2018, Nagoya 2019, online 2020 to 2023, Dalian 2024, Haikou 2025, Hong Kong 2026 and 2027"
- Proceedings in IEEE Xplore every year since 2016, stated as indexed by EI Compendex and Scopus
- Full papers 4 to 10 pages in IEEE double-column format; abstract-only presentation also offered (not published)
- Eight tracks covering robot design, perception, robot learning, planning and control, multi-robot systems, HRI, systems engineering and applications
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
