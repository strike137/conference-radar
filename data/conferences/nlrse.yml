links:
  website: https://nl-reasoning-workshop.github.io/
notes:
- Workshop on reasoning with language models, chain of thought, structured explanations and neuro-symbolic reasoning
- Held with ACL 2023 (Toronto) and ACL 2024 (Bangkok)
- Archival papers up to 8 pages plus references, double-blind review via OpenReview; non-archival and cross-submissions also
  accepted
- Archival papers go to the ACL Anthology (13 papers in 2023, 8 in 2024)
- Not listed in ICORE2026 and not on the CCF list
- No edition after 2024 has been announced
