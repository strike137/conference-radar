notes:
- Started in 2024 (UC Berkeley), then 2025 University of Pennsylvania and 2026 University of Southern California
- Covers neuro-symbolic AI at the meeting point of machine learning, control and cyber-physical systems, and formal methods
- All accepted papers appear in PMLR (volume 288 for 2025)
- "Paper types: research papers (up to 10 pages), tutorial papers (20 to 30 pages), challenge problem and case study papers"
- Single-blind review on OpenReview; 2026 edition co-located with L4DC at USC
