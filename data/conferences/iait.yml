id: iait
name: IAIT
full_name: International Conference on Advances in Information Technology
type: conference
tier: minor
areas: [general, ai, security, data]
region: southeast-asia
language: english
frequency: irregular
organizer: School of Information Technology (SIT), King Mongkut's University of Technology Thonburi (KMUTT), with IEEE CIS
organizer_country: [thailand]
proceedings: ACM ICPS (ACM DL)
archival: true
typical:
  deadline_months: [5, 10]
  conference_months: [6, 12]
links:
  website: https://www.iait-conf.org/
notes:
- Organized by the IEEE Computational Intelligence Society Thailand Chapter and the School of Information Technology
  at KMUTT, Bangkok
- Proceedings in the ACM ICPS series (ACM Digital Library); IAIT2026 covered the open access APCs for authors
- Always held in Bangkok, Thailand; 14 editions since 2005 at irregular intervals (recent ones 2017, 2018, 2020, 2021,
  2023, 2026)
- Double-blind review; IAIT2026 took submissions on a rolling basis with a hard deadline
- 'Fee: 18,500 THB international, 15,000 THB for Thailand affiliations (2026, full registration)'
- Includes a JSCI special session; IAIT2023 authors were invited to a journal special issue
- Not listed in the ICORE2026 portal or the CCF 2026 list
