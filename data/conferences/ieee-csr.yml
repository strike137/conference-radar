notes:
- Held in Europe every summer (Venice 2023, London 2024, Chania 2025, Lisbon 2026)
- Proceedings, including workshops, published by IEEE in IEEE Xplore; 6 pages plus up to 2 extra pages with overlength
  charges
- Large set of co-located workshops with their own CFPs (13 in 2026)
- 'Main deadline is usually extended by about a month (2025: Feb 10 -> Mar 10; 2026: Feb 2 -> Mar 9)'
- Not ranked in CORE or CCF; in-person only in 2025 and 2026 (hybrid in 2023 and 2024)
