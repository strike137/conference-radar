notes:
- Formerly the Pacific Rim Knowledge Acquisition Workshop; established in the 1980s as part of PRICAI and held with it
- Topics include knowledge acquisition, knowledge graphs, data mining, machine learning and human-centric knowledge
  engineering
- Proceedings in Springer LNAI in 2026 (Springer CCIS in 2025); papers up to 16 pages in LNCS format, single-blind review
- Papers rejected from PRICAI can be transferred to PKAW with a later deadline
- Recent editions Shanghai 2022, Jakarta 2023, Kyoto 2024, Wellington 2025, Guangzhou 2026
- Submission deadline was extended from 15 July to 1 August in both 2025 and 2026
- Not in the CCF list
