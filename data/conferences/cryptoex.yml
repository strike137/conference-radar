notes:
- Workshop of the IEEE International Conference on Blockchain and Cryptocurrency (ICBC); 4th edition in 2026
- Co-sponsored by IEEE ComSoc and the POSTECH Center for Crypto Blockchain Research (CCBR), Korea
- Accepted papers appear in the ICBC proceedings, IEEE Xplore and EI
- Regular papers up to 6 pages and short work-in-progress papers up to 4 pages (excluding references), IEEE two-column, via EDAS
- Combines paper talks, hot-topic posters and a panel
- Best papers invited to a special issue of Wiley International Journal of Network Management
- Topics include CEX and DEX, DeFi, stablecoins, wallets and custody, attacks on crypto systems, and KYC/AML
- Not listed in CORE ICORE2026 or the CCF list
