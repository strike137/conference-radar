notes:
- Run by SIAM and held together with SODA every January, so it follows SODA's location
- Main North American venue for algorithm engineering and experimental evaluation of algorithms and data structures
- ALENEX 2027 is the 29th edition; 24 of 72 submissions accepted
- Proceedings published by SIAM (ALENEX 2025 and ALENEX 2026 volumes on SIAM epubs)
- Submissions through HotCRP; ALENEX also runs a separate artifact evaluation track
- CORE A (ICORE2026, listed as Workshop on Algorithm Engineering and Experiments); not on the CCF list
