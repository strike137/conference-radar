notes:
- IEEE/IFIP conference on optical network engineering (design, modelling, control and management of optical networks)
- Accepted oral papers go to IEEE Xplore and the IFIP Open Digital Library (posters to IFIP only); selected papers are invited to a journal special issue
- Short papers of exactly 3 pages or full papers up to 6 pages in IEEE conference style; submission via EDAS
- The 2025 paper deadline was extended twice (January 17 -> February 9)
- Not listed in CORE ICORE2026 under its acronym or full name
- 2025 was the 29th edition (Pisa, Italy), 2026 the 30th (University of the Bundeswehr Munich), 2027 the 31st (CTTC, Castelldefels)
