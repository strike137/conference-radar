id: epew
name: EPEW
full_name: European Performance Engineering Workshop
type: workshop
tier: minor
areas: [systems, networking, software]
region: europe
language: english
frequency: annual
organizer: EPEW organizing committee (co-located with the ECMS conference of SCS Europe since 2025)
organizer_country: [europe]
proceedings: Springer LNCS
archival: true
typical:
  deadline_months: [3, 4]
  conference_months: [6]
links:
  website: https://epew-workshop.github.io/
notes:
- Annual European workshop on performance modelling and evaluation (queueing networks, Petri nets, stochastic
  models, simulation, benchmarking, QoS and dependability); first edition 2004
- Proceedings in Springer LNCS under the title "Computer Performance Engineering"
- 2024 and 2025 used a two-phase process with short papers presented at the workshop and full papers published
  later as LNCS post-proceedings (revised selected papers); 2026 went back to full papers of up to 15 pages in
  the LNCS proceedings
- Co-located with ACM SIGMETRICS / IFIP Performance in 2024 (Venice) and with ECMS since 2025 (Catania 2025,
  Grimstad 2026, Budapest 2027)
- One-day event; submission via EasyChair; deadlines are AoE
- Not listed in CORE ICORE2026 or in the CCF 2026 list
