id: alta
name: ALTA
full_name: Annual Workshop of the Australasian Language Technology Association
type: conference
tier: minor
areas: [nlp, ai]
region: oceania
language: english
frequency: annual
organizer: Australasian Language Technology Association (ALTA)
organizer_country: [australia]
proceedings: ACL Anthology
archival: true
indexing: [DBLP, ACL Anthology]
rank:
  core: Australasian C
fee: A$180 non-student early (A$200 late) plus A$5 booking fee; free for students (2026)
typical:
  deadline_months: [9, 10]
  conference_months: [11, 12]
links:
  website: https://www.alta.asn.au/
  dblp: https://dblp.org/db/conf/alta/index.html
notes:
- Organized by ALTA; the main local NLP and computational linguistics forum for Australia and New Zealand
- ICORE2026 rank is Australasian C (a regional category, not international C)
- Archival long (8 pages) and short (4 pages) papers, double-blind via OpenReview, published in the ACL Anthology;
  separate non-archival track for abstracts, industry papers and work published elsewhere
- Student registration free in 2026 (sponsor funded); program includes a shared task, a tutorial day and industry
  demos
- Held late November or early December, usually in an Australian city (Canberra 2024, Sydney 2025, Melbourne 2026),
  occasionally in New Zealand (Dunedin 2018)
