notes:
- Workshop held within the International Conference on Cyber Hygiene & Conflict Management in Global Information Networks (CH&CMiGIN), alongside workshops on cyber resilience, conflict management and young scientists
- Run by the National University "Kyiv Aviation Institute", Ukraine
- Topics include cyber incident management, information warfare, critical infrastructure, AI for cybersecurity, secure networks, quantum algorithms and zero trust
- Held in Kyiv in 2024 and 2025 and in Krakow, Poland (hybrid) in 2026
- Proceedings in CEUR-WS (Vol-4278 for WCH 2026; Vol-4024 joint CH&CMiGIN 2025 workshops; Vol-3925 CH&CMiGIN 2024)
- "Acceptance: 20 of 26 submissions (WCH 2026)"
- Very short cycle, about two and a half weeks from submission deadline to the workshop; papers in the CEURART template, 10 to 20 pages for full papers
- Not listed in CORE ICORE2026 or the CCF list
