notes:
- Not-for-profit, 100% volunteer-run Security BSides conference in Chicago
- Separate from BSides312, which is also held in Chicago
- 2025 edition was two days at the Hilton Chicago (720 S. Michigan Ave), workshops on day 1 and talks on day 2
- Anonymous CFP review; no honorarium or travel support for speakers
- Villages include a Career Village and a Lockpick Village, plus CTFs
- No event in 2026; organizers say it will return in 2027
- No proceedings
