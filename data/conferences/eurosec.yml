notes:
- One-day systems security workshop held the day before EuroSys every year; 2026 was the 19th edition
- Proceedings of EuroSec in the ACM Digital Library; one author must attend and present for the paper to be included
- Short papers of up to 6 pages in double-column ACM sigconf format, excluding the bibliography; anonymized submission
  via HotCRP
- Welcomes early ideas, negative results, and reproduction or refutation of previous results; many papers later grow
  into full papers at top security venues
- Location follows EuroSys (2024 Athens, 2025 Rotterdam, 2026 Edinburgh); registration goes through EuroSys
- Not listed in ICORE2026 or the CCF 2026 list
