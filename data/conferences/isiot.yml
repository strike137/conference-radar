organizer: Chairs from Neapolis University Pafos, Philips University Cyprus, Cyprus University of Technology, University of Cyprus and CYENS, at DCOSS-IoT
organizer_country: [europe]
proceedings: IEEE Xplore (DCOSS-IoT proceedings)
archival: true
typical:
