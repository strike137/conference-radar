links:
  website: https://sites.google.com/view/isiot-2026/home-
notes:
- Workshop co-located with IEEE DCOSS-IoT; the 2026 edition in Reykjavik was the 8th, and the 9th is listed for DCOSS-IoT 2027 in Montreal
- Run by Cypriot researchers (Michael Georgiades, Iacovos Ioannou, Andreas Gregoriades, Vasos Vassiliou)
- Topics are machine learning, computational intelligence and optimization applied to IoT systems
- Papers up to 8 pages IEEE two-column plus up to 2 appendix pages at 100 USD per page; submitted via EasyChair
- Not double-blind; at least three reviews per paper
- Accepted papers go into the DCOSS-IoT proceedings and are submitted to IEEE Xplore
- Follows the DCOSS-IoT host city (Pafos 2023, Abu Dhabi 2024, Lucca 2025, Reykjavik 2026)
- Deadline was extended twice in 2026 (January 27 -> March 31 -> April 21)
