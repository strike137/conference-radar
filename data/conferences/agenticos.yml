id: agenticos
name: AgenticOS
full_name: Workshop on Operating Systems Design for AI Agents
type: workshop
tier: minor
areas: [systems, ai]
region: worldwide
language: english
frequency: multiple-per-year
organizer: Workshop organizers from academia and industry (Shanghai Jiao Tong University, UC Merced, UC Santa Cruz, Roblox, ByteDance and others)
organizer_country: [international]
proceedings: Workshop website (PDFs of accepted papers, non-archival)
archival: false
typical:
  deadline_months: [2, 7]
  conference_months: [3, 9]
links:
  website: https://os-for-agent.github.io/
notes:
- Workshop on OS abstractions, isolation, scheduling, state and observability for AI agent workloads
- 1st edition at ASPLOS 2026 (Pittsburgh, March 2026), 2nd at SOSP 2026 (Prague, September 2026); two editions in 2026
- No formal proceedings; accepted papers appear only on the workshop website, so later publication elsewhere is allowed
- Two tracks, vision papers (1 to 2 pages) and research papers (up to 6 pages), excluding references, ACM double-column format
- At least two reviews per paper (single-blind at ASPLOS 2026, double-blind at SOSP 2026); submissions under review elsewhere are accepted
- Strong industry participation (Huawei sponsor talk, Alibaba, Roblox, ByteDance authors and organizers)
- Not listed in CORE ICORE2026
