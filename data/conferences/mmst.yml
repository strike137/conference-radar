notes:
- Russian conference on mathematical modeling, numerical methods and supercomputing (HPC), held every November at Lobachevsky University in Nizhny Novgorod, Russia
- Held as part of the international congress Supercomputing Days in Russia
- Two conference days plus a one-day youth school with master classes; hybrid format, working languages Russian and English
- 2025 had peer-reviewed English papers in Springer CCIS (vol. 2815) and a UNN Press volume of short papers and abstracts indexed in RSCI
- For 2026 Springer did not confirm the CCIS volume, so only abstracts (2 to 6 pages) are accepted
- "Fee: 3000 RUB per paper (2026)"
- Not listed in ICORE2026 or the CCF 2026 list
