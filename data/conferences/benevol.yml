notes:
- Stand-alone regional workshop on software evolution and maintenance, held since 2003 (25th edition in 2026)
- Informal and welcoming forum, aimed at early-stage researchers who want feedback
- Usually hosted in Belgium or the Netherlands (Mons 2022, Nijmegen 2023, Namur 2024, Enschede 2025); Madrid in 2026
- Post-proceedings in CEUR-WS after the workshop (Vol-3567 for 2023, Vol-3941 for 2024)
- Full papers (up to 12 pages) and short papers (up to 6 pages) in CEUR-ART single-column style; presentation abstracts (2 pages) of published work are not in the proceedings
- Single-blind review by at least three PC members
- Not listed in ICORE2026 and not on the CCF list
