full_name: Belgium-Netherlands Software Evolution Workshop
type: conference
tier: minor
areas: [software]
region: europe
language: english
frequency: annual
organizer: BENEVOL community, hosted by a Belgian or Dutch university each year (2025 -> University of Twente)
organizer_country: [europe]
proceedings: CEUR-WS (post-proceedings)
archival: true
typical:
  deadline_months: [10]
  conference_months: [11]
links:
  website: https://benevol2025.github.io/
notes:
- Regional workshop on software evolution and maintenance, held since 2003; informal forum aimed at researchers and students in Belgium and the Netherlands
- Alternates between Belgium and the Netherlands (2020 Luxembourg, 2021 's-Hertogenbosch, 2022 Mons, 2023 Nijmegen, 2024 Namur, 2025 Enschede); 2026 listed as Madrid
- Categories CORE (full research), DIVE (position papers), REAP (replications and negative results) and SHOW (2-page abstracts of work published elsewhere, not in the proceedings)
- At least three PC reviews for CORE, DIVE and REAP papers; single-blind
- Pre-proceedings on the website; revised papers go to open-access CEUR-WS post-proceedings (2023 -> Vol-3567, 2024 -> Vol-3941)
- Not listed in ICORE2026 or the CCF list
