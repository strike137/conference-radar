notes:
- Organized by the IT department of SSN College of Engineering, Kalavakkam, Chennai, India; recent editions (2023 to 2027) are held on the SSN campus
- Registered as an IFIP event (IFIP TC 12, Artificial Intelligence); papers use the Springer template
- "Proceedings: IFIP AICT 670 for 2023; the 2024 papers appeared as revised selected papers in IFIP AICT"
- The official site states Scopus indexing for the IFIP AICT proceedings
- Broad scope on AI, data science, signal processing, networks, IoT and security; each edition has a special focus theme
- Papers up to 15 pages, reviewed by at least three reviewers; a pre-conference workshop is held on the first day
- 11th edition in 2027
- Not found in ICORE2026; not on the CCF list
