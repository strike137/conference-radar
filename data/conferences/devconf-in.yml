notes:
- Annual, free developer conference organized by Red Hat for the FOSS community in India
- Held at MIT World Peace University (MIT WPU), Pune
- Primarily in person; all presentations must be delivered in person, select sessions are streamed
- Formats are 45 minute talks, 15 minute lightning talks, 75 minute workshops and technology booths, all chosen through the CfP
- Topics include enterprise AI and MLOps, software supply chain security, sovereign AI, IT automation and hybrid cloud infrastructure
- Speaker travel and accommodation are not covered; visa invitation letters available
- No papers or proceedings; practitioner talks only
