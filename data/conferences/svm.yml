notes:
- Co-located with ICSE; held in Melbourne 2023, Lisbon 2024 (2nd edition, joint EnCyCriS/SVM workshop), Ottawa 2025 and Rio de Janeiro 2026
- Covers detection, assessment, prioritization, patching and disclosure of software vulnerabilities, including AI/LLM for SVM and supply chain security
- Research or industry papers up to 8 pages including references, short tool, model or dataset papers up to 5 pages, extended abstracts up to 5 pages as lightning talks
- Proceedings were in IEEE Xplore for 2023 and 2025 and in the ACM Digital Library for 2026 (ACM Open; short papers pay an APC, extended abstracts do not)
- Not listed in the CORE portal (ICORE2026)
