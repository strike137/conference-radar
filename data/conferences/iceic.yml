notes:
- Organized by IEIE, the Korean counterpart of IEICE; proceedings in IEEE Xplore
- 'Held in East and Southeast Asia each January: 2025 Osaka, 2026 Macau, 2027 Fukuoka'
- 'Broad EECS with an EE focus: semiconductors and devices, circuits, signal processing, communications, computers
  and AI; 2 to 6 page papers via EDAS, plus an undergraduate poster track'
- Every accepted paper needs one full registration even if the presenter is a student (extra papers by the same
  author can use the student rate)
- 'Lab view: international conference mostly in name, acceptance rate believed to be 70% or higher (no official
  figure); 400+ presentations announced for 2026 and 2027'
