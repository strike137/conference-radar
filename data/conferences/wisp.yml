notes:
- Annual pre-ICIS workshop of the AIS SIG SEC, held just before the International Conference on Information Systems (ICIS) in the same city
- Information systems view of security and privacy (behavioral security, policy compliance, risk, governance, privacy, cybercrime)
- Double-blind review; completed research up to 15 pages, research in progress up to 8 pages, panel proposals up to 3 pages
- Proceedings in the AIS eLibrary (AISeL), WISP 2012 onwards
- Supportive workshop for doctoral students, with paper and reviewer awards; authors are expected to review 1 to 2 papers
- Follows ICIS around the world (2023 Hyderabad, 2024 Bangkok, 2025 Nashville, 2026 Lisbon)
- Not listed in ICORE2026; not to be confused with WiSPNET
