notes:
- Small, invite-only offensive security conference (about 50 attendees); talks are mostly on iOS, browser and kernel exploitation
- Free to attend; an invite is obtained by contacting the organisers, most easily by submitting a talk
- Strict no-recording and no-photos policy; no proceedings
- Moves between European cities; Thessaloniki 2022, Barcelona 2023, Nice 2024, Belgrade 2025, Napoli 2026
- 2026 organised by xerub and qwertyoruiopz; 2025 by xerub and AJ
- Not listed in the CORE portal (ICORE2026)
