notes:
- Annual conference since 2018; held at Shaheed Sukhdev College of Business Studies, University of Delhi, in most editions since 2020 (2018 at another New Delhi institute, 2019 in Ostrava, Czech Republic); hybrid format
- Accepted papers (double-blind review) published in Springer Lecture Notes in Networks and Systems (LNNS); papers must be presented to appear
- Very large volume; the site reports more than 2,500 submissions and 475 accepted papers (about 18%) in 2026
- Run with Universal Innovators, a private body that also hands out leadership awards at the event
- The 2027 call calls it the eighth edition while the 2026 report calls 2026 the ninth
- Not to be confused with the Chinese ICICC (Intelligent Communications and Computing)
- Not found in ICORE2026; not on the CCF list
