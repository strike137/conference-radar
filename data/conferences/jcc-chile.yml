links:
  website: https://jcc2026.utalca.cl/
notes:
- National computer science conference of the Chilean Computer Science Society (SCCC), held every year since 1993 with a Chilean host university; the main track is the SCCC International Conference (45th in 2026)
- Papers of 4 to 8 pages in IEEE format, in Spanish, English or Portuguese, with English title, abstract and keywords
- Papers presented at the conference are published in IEEE Xplore (indexed in Scopus); presentation by an author is required
- Several co-located workshops (pattern recognition, quantum software engineering, human-centered cybersecurity and AI, algorithms) and the TICXED education congress
- Always held in Chile (Valparaíso 2025 jointly with CLEI 2025 and IEEE CHILECON 2025, Talca 2026)
- Not listed in CORE ICORE2026
