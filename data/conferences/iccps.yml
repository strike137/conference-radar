notes:
- Main venue for cyber-physical systems research; held each spring as part of CPS-IoT Week (with SenSys and RTAS)
- Proceedings alternate between ACM and IEEE (2026 in IEEE proceedings, 2027 in ACM proceedings)
- 2026 run jointly with HSCC (shared program committee, separate proceedings); from 2027 merged with HSCC into one
  conference, HSCC+ICCPS (ACM/IEEE International Conference on Cyber-Physical and Autonomous Systems)
- "2027 paper types: regular (10 pages plus references), short (6 pages) and tool papers; light double-anonymous review"
- Abstract registration one week before the paper deadline (optional in 2026, mandatory from 2027); optional repeatability evaluation
- Location rotates worldwide (Hong Kong 2024, Irvine 2025, Saint-Malo 2026, Boulder 2027)
- Not listed by CORE (ICORE2026) or CCF, but regarded as a competitive venue in the CPS community
