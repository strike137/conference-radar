full_name: Workshop on NLP and LLMs for the Iranian Language Family
type: workshop
tier: minor
areas: [nlp, ai]
region: europe
language: english
frequency: annual
organizer: SilkRoadNLP organizing committee (Zoorna Institute, University of Washington, QCRI); co-located with EACL
organizer_country: [usa, other]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [12, 1]
