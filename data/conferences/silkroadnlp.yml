links:
  website: https://www.silkroadnlp.org/
notes:
- Workshop on NLP for Persian, Dari, Tajik, Kurdish, Pashto, Balochi and other Iranian languages
- First edition with EACL 2026 in Rabat; second edition with EACL 2027 in Athens
- 2026 edition accepted 14 of 18 submissions; proceedings in the ACL Anthology
- Long (8 pages), short and demo (4 pages) papers, double-blind review; 2027 accepts direct OpenReview and ARR
  submissions
- Hybrid format with online participation
- 2027 adds a shared task on Tajik Cyrillic and Perso-Arabic transliteration
- Not listed in ICORE2026 or the CCF list
