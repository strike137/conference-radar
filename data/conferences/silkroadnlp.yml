id: silkroadnlp
name: SilkRoadNLP
full_name: Workshop on NLP and LLMs for the Iranian Language Family
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: Organizing committee from the Zoorna Institute for Language, AI and Society (USA), University of Washington and QCRI (Qatar); co-located with EACL
organizer_country: [usa, other]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [12, 1]
  conference_months: [3]
links:
  website: https://www.silkroadnlp.org/
notes:
- Workshop on NLP for Persian, Dari, Tajik, Kurdish, Pashto, Balochi and other Iranian languages, including historical ones
- Held with EACL 2026 (Rabat) and EACL 2027 (Athens); hybrid format with remote participation
- Long (8 pages) and short or demo (4 pages) papers, double-blind review via OpenReview; accepts ARR-reviewed papers
- Proceedings in the ACL Anthology (15 entries in 2026)
- 2026 edition received 18 submissions and accepted 14 papers
- 2027 adds a shared task on Tajik Cyrillic to Perso-Arabic transliteration
- Not listed in ICORE2026 and not on the CCF list
