notes:
- Flagship conference of EurAAP, a not-for-profit association registered in Brussels; 21st edition in 2027
- Large antennas and propagation conference with convened sessions, short courses, scientific and industrial workshops,
  a Student Design Contest and paper awards
- Papers 2 to 5 A4 pages via EDAS; presented papers go to IEEE Xplore only if authors opt in, papers not presented
  are not submitted
- Firm October paper deadline with no extension; held in a European city in March or April (Madrid 2022, Florence
  2023, Glasgow 2024, Stockholm 2025, Dublin 2026, Düsseldorf 2027)
- Not ranked by CORE or CCF; antennas and propagation venue outside the usual CS rankings
