id: h2rc
name: H2RC
full_name: International Workshop on Heterogeneous High-performance Reconfigurable Computing
type: workshop
tier: minor
areas: [systems]
region: north-america
language: english
frequency: annual
organizer: H2RC organizers (University of South Carolina, AMD, KAUST), held with SC
organizer_country: [international]
proceedings: SC Workshops Proceedings (IEEE Xplore 2026, ACM DL 2025)
archival: true
typical:
  deadline_months: [8]
  conference_months: [11]
links:
  website: https://h2rc.cse.sc.edu/
notes:
- Half-day workshop on FPGAs and other spatial or reconfigurable architectures (CGRAs, AI engines, dataflow processors) in HPC, held with SC every year since 2015; 2026 is the 12th edition
- Track 1 full papers (up to 8 pages excluding references, IEEE format) published in the SC Workshop Proceedings; Track 2 two-page extended abstracts for talks only, not published
- Single-blind review by at least three program committee members
- Not listed in CORE ICORE2026
