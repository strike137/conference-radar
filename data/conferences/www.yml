notes:
- The ACM Web Conference (formerly International World Wide Web Conference, WWW); web mining, search, social computing,
  web security and privacy
- WWW 2026 in Dubai was postponed from April 13 to 17 to June 29 to July 3, 2026
- 'WWW 2027: Dublin, May 10 to 14, 2027; full paper deadline Oct 25, 2026 and short paper deadline Nov 16, 2026
  (AoE)'
- Double-blind review (OpenReview from 2027, EasyChair in 2026); research track acceptance around 20%
- CCF A in the interdisciplinary category; CORE A*
