notes:
- Asia-Pacific sister conference of ACM Multimedia under ACM SIGMM, annual since 2019 and usually held in December
  (the 2020 edition took place in March 2021); rotates around the region (Tokyo 2022, Tainan 2023, Kuala Lumpur
  2025, Hanoi 2026 at VinUniversity)
- Regular papers 6 pages plus up to 2 pages of references; double-blind review via Microsoft CMT
- Ranked CORE C and CCF C; proceedings in ACM DL, best papers invited to an ACM TOMM special issue
- Paper deadlines were extended in both 2025 (by 5 days) and 2026 (by 11 days); SIGMM student travel grants offered,
  applications in October
