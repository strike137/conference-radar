notes:
- Machine learning for speech, music and environmental sound (generation, TTS, separation, audio language models)
- Held at NeurIPS 2023, ICML 2025 (AI Heard That!) and ICML 2026 (Learning to Listen, Seoul)
- Extended abstracts up to 4 pages in the ICML format; double-blind review; poster and live demo session
- Non-archival; accepted submissions are posted on the website but not published
- Modulate and Hume AI release large speech datasets for use in submissions
- Not listed in ICORE2026 and not on the CCF list
