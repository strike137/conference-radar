notes:
- Main conference of the Mathematical Optimization Society on integer programming and combinatorial optimization, held since 1990
- Single track, about 33 accepted papers of 30 minutes each, presented in person
- Lightweight double-blind review of extended abstracts up to 12 pages in LNCS style plus an appendix
- Proceedings in Springer LNCS (2026 -> volume 16588); special issue of Mathematical Programming B for revised versions
- Preceded by a two-day summer school; a poster session is also held
- Alternates between North America and Europe (Eindhoven 2022, Madison 2023, Wroclaw 2024, Baltimore 2025, Padua 2026)
- CORE B (ICORE2026), CCF C
