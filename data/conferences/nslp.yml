id: nslp
name: NSLP
full_name: International Workshop on Natural Scientific Language Processing
type: workshop
tier: minor
areas: [nlp, data]
region: europe
language: english
frequency: annual
organizer: NFDI4DS consortium (DFKI, GESIS and partners); co-located with ESWC or LREC
organizer_country: [europe]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [2, 3]
  conference_months: [5, 6]
links:
  website: https://nfdi4ds.github.io/nslp2026/
notes:
- Workshop on processing, analysing and using scientific language (scholarly documents, research knowledge graphs, scientific fact checking)
- First two editions ran as "Natural Scientific Language Processing and Research Knowledge Graphs" with ESWC (2024 Hersonissos, Crete; 2025 Portorož, Slovenia); 2026 edition moved to LREC 2026 in Palma de Mallorca
- Proceedings differ by host -> 2024 open access Springer LNAI volume, 2025 ESWC 2025 Joint Workshop Proceedings in CEUR-WS (Vol-3977), 2026 ACL Anthology as part of the LREC 2026 proceedings
- Runs shared tasks each year (2026 ClimateCheck, SOMD and SciVQA, evaluated on Codabench)
- Organized by the German NFDI4DS research data infrastructure consortium, led by DFKI and GESIS
- Not ranked in ICORE2026 and not on the CCF list
