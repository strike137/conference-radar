notes:
- Main gathering of the European reinforcement learning community, held since 1994 and annual since 2022 (Milan 2022,
  Brussels 2023, Toulouse 2024, Tuebingen 2025)
- Non-archival in recent editions; EWRL 2025 had no proceedings (older editions appeared in Springer LNAI 2011 and
  JMLR proceedings 2012)
- Regular track for unpublished work (9 pages plus references and appendix, double blind, via OpenReview) and a fast
  track for papers already accepted at major venues such as NeurIPS, ICML, ICLR and RLC
- All accepted papers are presented as posters; a separate call for contributed talks targets early-career researchers
- In 2027 EWRL is planned as one joint event with the Reinforcement Learning Conference (RLC) in Odense, Denmark, in late
  August
- Not listed in ICORE2026
