id: nlperspectives
name: NLPerspectives
full_name: Workshop on Perspectivist Approaches to NLP
type: workshop
tier: minor
areas: [nlp, ai]
region: europe
language: english
frequency: annual
organizer: Workshop organizing committee (organizers from University of Turin, Heriot-Watt University, Northeastern University, Fondazione Bruno Kessler and Amazon); co-located with LREC, ECAI or EMNLP
organizer_country: [europe, usa]
proceedings: ACL Anthology
archival: true
indexing: [ACL Anthology]
typical:
  deadline_months: [3, 7]
  conference_months: [5, 11]
links:
  website: https://nlperspectives.di.unito.it/
notes:
- Workshop on data perspectivism and human label variation in NLP (non-aggregated datasets, modelling disagreement, evaluation of multi-perspective models)
- Held every year since 2022, co-located with LREC 2022, ECAI 2023, LREC-COLING 2024, EMNLP 2025 (Suzhou) and LREC 2026 (Palma de Mallorca)
- Host conference changes each year, so deadlines move between spring and summer
- Archival papers appear in the ACL Anthology (2026 volume published by ELRA); non-archival papers and 1-page research communications are also accepted
- Accepts papers rejected from ACL Rolling Review if submitted with their reviews
- 2025 edition hosted the LeWiDi (Learning with Disagreements) shared task
- Not ranked in ICORE2026 and not on the CCF list
