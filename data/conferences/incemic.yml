id: incemic
name: INCEMIC
full_name: International Conference on Electromagnetic Interference and Compatibility
type: conference
tier: minor
areas: [communications]
region: south-asia
language: english
frequency: biennial
organizer: Society of EMC Engineers (India) (SEMCE(I))
organizer_country: [india]
proceedings: IEEE Xplore
archival: true
fee: 18,000 INR + GST general, 17,000 INR + GST SEMCEI/IEEE member, 10,000 INR + GST student (2025, conference only)
typical:
  deadline_months: [8]
  conference_months: [11]
links:
  website: https://incemic.org/
notes:
- Flagship biennial conference of the Society of EMC Engineers (India), held in Bengaluru
- Covers electromagnetic compatibility (EMC) in design, PCB, chips, SI/PI, measurement, shielding, lightning, HPEM,
  automotive, wireless and satellite systems
- Proceedings in IEEE Xplore (15th INCEMIC 2018, joint APEMC/INCEMIC 2023, 17th INCEMIC 2025)
- 2023 edition was held jointly with APEMC in Bengaluru (May 2023)
- Two-day workshop cum tutorials precedes the three-day conference; papers up to 4 pages
- Not the IEEE EMC+SIPI symposium; not listed in the ICORE2026 CORE portal
