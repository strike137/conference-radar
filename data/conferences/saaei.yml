notes:
- Annual Spanish conference on power electronics, industrial electronics, automatic control and instrumentation, running since 1994
- Papers of 4 to 6 pages in Spanish or English, double-blind review by three reviewers, submitted via EasyChair
- Book of abstracts and papers is password protected for registered participants, so marked non-archival here
- Most attendees come from Spain, with some Latin American participation; IEEE Spain PELS-IES and IMS chapter meetings are held during the event
- Host university changes every year (editions XXXI to XXXIII at UGR, URJC and University of Oviedo); edition XIX was at UMinho, Portugal
- Not listed in CORE ICORE2026 or in the CCF 2026 list
