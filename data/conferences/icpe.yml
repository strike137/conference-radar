notes:
- Joint ACM/SPEC conference sponsored by ACM SIGMETRICS, ACM SIGSOFT and the SPEC Research Group; 18th edition in 2027
- Proceedings published by ACM (open access; full papers outside ACM Open institutions may pay a subsidized APC)
- Research and industry tracks share one deadline in November (abstract one week before the paper); double-blind
  review, up to 10 pages excluding references
- Many co-located workshops plus emerging research, artifact, poster/demo, tutorial and data challenge tracks
- Mostly held in Europe, also North America (Toronto 2025); Florence 2026, Gothenburg 2027
- CORE B (ICORE2026)
