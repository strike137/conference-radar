notes:
- Smaller commercially organized conference, co-sponsored by IEEE and a different Chinese university each year
- Proceedings in IEEE Xplore for every edition since 2016, listed as indexed in Ei Compendex and Scopus
- Held in China in July (Qingdao 2021, Xi'an 2022, Dalian 2023, Suzhou 2024, Chengdu 2025, Kunming 2026); 2020 was
  online
- Final call for submissions about three weeks after the main deadline (2026)
- Not listed in the CORE portal (ICORE2026)
