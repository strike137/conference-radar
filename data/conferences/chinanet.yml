notes:
- National networking conference of the China Computer Federation (CCF), started in 2023 by its technical committees on network and data communication and on Internet
- English papers are published in Springer CCIS as "Frontiers of Networking Technologies"; selected Chinese papers are recommended to Chinese journals such as the Chinese Journal of Computers
- "Acceptance (English proceedings): 13 of 61 (2023), 13 of 102 (2025)"
- Accepts Chinese and English papers; English long papers 12 pages or more, short papers 6 to 11 pages; double-blind review in 2026
- Large event with keynotes, many industry forums and exhibitions; the English proceedings are small (13 papers in 2023 and in 2025)
- Held in a different Chinese city each year (Wenzhou 2023, Zhangjiagang 2024, Shenyang 2025, Xiamen 2026)
- Not ranked in CORE ICORE2026; not on the CCF 2026 recommended list
