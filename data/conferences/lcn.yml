links:
  website: https://www.ieeelcn.org/
notes:
- One of the oldest networking conferences (51st edition in 2026); general computer networking scope
- Full regular papers 8 pages plus references go to the LCN Proceedings; short papers 6 pages plus references go
  to the Companion Proceedings (both IEEE Xplore)
- AoE deadlines, paper registration and submission usually extended from April to early May
- Traditionally in North America; now rotates worldwide (Singapore 2017, Caen 2024, Sydney 2025, Coimbra 2026);
  TCCC student participation grants
