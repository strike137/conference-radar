notes:
- Main annual event of the description logic research community, running since the 1980s; 2026 was the 39th edition
- Organizers describe it as an informal get-together with a very high acceptance rate; publication there is not meant
  to preclude later publication at conferences
- Papers appear in CEUR Workshop Proceedings as informal proceedings; authors keep the copyright and only regular
  papers are indexed by DBLP
- Regular papers up to 11 pages and extended abstracts 2 to 4 pages (excluding references), CEURART format, via HotCRP
- Single-blind review by default, with an optional double-blind choice
- At least one author per accepted paper must attend in person; student grants are offered
- Recent editions Haifa 2022, Rhodes 2023, Bergen 2024, Opole 2025, Lisbon 2026 (at FLoC with KR and NMR),
  Amsterdam 2027
- Not listed in ICORE2026; not on the CCF list
