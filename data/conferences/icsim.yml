notes:
- Smaller software engineering and information management conference held every January since 2018
- Started in Casablanca (2018), then Bali, Sydney, Yokohama (virtual 2021 and 2022), Palmerston North, Fiji (online 2024), Singapore and Yokohama (2026); Tokyo in 2027
- Proceedings 2018 to 2026 in the ACM Digital Library, indexed by EI Compendex and Scopus per the site
- From 2027 papers go to IET conference proceedings; double-blind review stated for 2027
- Abstract-only presentation is possible without publication
- Run by a conference secretariat (contact via a 163.com address) with Japanese host universities
- Not listed in ICORE2026 or the CCF 2026 list
