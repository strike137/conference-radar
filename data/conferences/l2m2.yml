notes:
- Workshop on memorization of training data in LLMs (measurement, interpretability, unlearning and editing, privacy, copyright, benchmark contamination)
- First edition co-located with ACL 2025 in Vienna on 2025-08-01
- Archival papers in the ACL Anthology (volume 2025.l2m2-1)
- Papers of 4 to 8 pages, single track, double-blind; direct submission on OpenReview or commitment of ACL Rolling Review papers
- Non-archival track for work published elsewhere and for work in progress
- Not listed in ICORE2026 and not on the CCF list
