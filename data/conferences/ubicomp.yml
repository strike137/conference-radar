notes:
- Joint venue of UbiComp (merger of Pervasive and UbiComp) and ISWC, co-located since 2013
- Main track presents papers already published in the journal IMWUT (Proceedings of the ACM on Interactive, Mobile, Wearable and Ubiquitous Technologies), which has three submission deadlines a year (1 February, 1 May, 1 November)
- ISWC Notes (up to 6 pages) and Briefs are reviewed by the conference and published in the ACM Digital Library
- Posters, demos and workshop papers go into the adjunct proceedings in the ACM DL, described by the organizers as non-archival
- Held every October, rotating worldwide (Cancun 2023, Melbourne 2024, Espoo 2025, Shanghai 2026)
- "CORE ICORE2026: journal published (UbiComp and ISWC); CCF A (human-computer interaction and pervasive computing)"
- Each IMWUT paper needs its own author registration at the non-student rate
