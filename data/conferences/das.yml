notes:
- IAPR-sponsored workshop on system-level document analysis and recognition (OCR, layout, tables, forms, historical
  documents, document AI with foundation models)
- Biennial since 1994; the 2026 edition is the 17th; held as a separate event until 2022, a satellite workshop of
  ICDAR since 2024 (Athens 2024, Vienna 2026)
- Full papers (up to 17 pages, LNCS format) appear in Springer LNCS; short and demo papers go into a separate
  non-archival booklet
- Double-blind review via Microsoft CMT
- Registration runs through ICDAR; each accepted paper needs one regular (non-student) registration, and a full ICDAR
  registration can cover up to three papers including DAS papers
- CORE B (ICORE2026)
