notes:
- Workshop on automatic summarization and grounded generation (long-context and multi-document summarization, hallucination, evaluation, LLM-based summarization)
- Held every two years at EMNLP since 2017 (2017, 2019, 2021, 2023, 2025)
- Papers appear in the ACL Anthology (14 papers in 2025); a non-archival track publishes only the abstract
- Long (8 pages) and short (4 pages) papers, double-blind review via OpenReview; also takes ARR commitments
- Not ranked in ICORE2026 and not on the CCF list
