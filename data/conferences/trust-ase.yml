notes:
- ASE workshop on engineering trustworthy and responsible autonomous systems and AI agents (fairness, accountability, transparency, robustness, human oversight)
- Official name spelled "Trustworthy and Responsible aUtonomous SysTems"; first edition at ASE 2026 in Munich on 2026-10-12
- Organized by Gianmario Voria and Fabio Palomba (University of Salerno), Yutaro Kashiwa (NAIST) and Patrizio Pelliccione (GSSI)
- Full papers 5 to 8 pages and short papers 4 pages, references included; ACM sigconf format; double-anonymous review with at least three reviewers
- 2026 proceedings published open access in the ACM Digital Library (Proceedings of the 1st International Workshop on Trustworthy and Responsible aUtonomous SysTems)
- Different from ACM TRUST (ACM Conference on Trustworthy and Responsible AI and Computing Systems)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
