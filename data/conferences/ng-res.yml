frequency: annual
organizer: Organizing committee from Politecnico di Milano, CISTER (ISEP) and Halmstad University; co-located with HiPEAC
organizer_country: [europe]
proceedings: OASIcs (Schloss Dagstuhl)
archival: true
typical:
  deadline_months: [11, 12]
  conference_months: [1]
links:
  website: https://ng-res.deib.polimi.it/
notes:
- One-day workshop co-located with the HiPEAC conference every January since 2020
- Real-time embedded systems with focus on distributed and parallel aspects, bridging the networking and multicore real-time communities
- Accepted papers are published open access in the OpenAccess Series in Informatics (OASIcs, Schloss Dagstuhl)
- Papers up to 10 pages in the single-column Dagstuhl format plus an optional appendix of up to 5 pages; single-blind review
- Welcomes industry contributions and position papers for European research projects
- Follows HiPEAC around Europe (2023 Toulouse, 2024 Munich, 2025 Barcelona, 2026 Krakow, 2027 Glasgow)
- Not listed in ICORE2026
