organizer: NG-RES organizers (co-located with HiPEAC); chairs from Politecnico di Milano, CISTER (ISEP) and Halmstad University
organizer_country: [europe]
proceedings: Dagstuhl OASIcs
archival: true
typical:
  deadline_months: [11, 12]
