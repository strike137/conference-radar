links:
  website: https://ng-res.deib.polimi.it/
notes:
- One-day workshop co-located with the HiPEAC conference every year since 2020 (Bologna 2020, Toulouse 2023, Munich 2024,
  Barcelona 2025, Krakow 2026, Glasgow 2027)
- Real-time embedded systems with a focus on distributed and parallel aspects, bringing together the networking and
  multicore real-time communities
- Accepted papers are published open access in the Dagstuhl OpenAccess Series in Informatics (OASIcs), for example
  OASIcs volume 140 for NG-RES 2026
- 'Papers: up to 10 pages in single-column Dagstuhl format (plus bibliography and an optional 5-page appendix),
  single-blind review via EasyChair'
- Deadlines are often extended by one or two weeks
- Not listed in CORE ICORE2026
