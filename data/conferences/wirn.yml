notes:
- Annual meeting of SIREN, the Italian Society of Neural Networks, running since 1989
- Held every year at the SIREN headquarters in Vietri sul Mare on the Amalfi Coast (online only in 2021)
- Despite the name it is a standalone international conference with keynotes, workshops and the Caianiello Best PhD Thesis Award
- Accepted papers go to the Springer book series Smart Innovation, Systems and Technologies (Scopus and Web of Science)
- Selection is based on an extended abstract; the full paper (15 to 20 pages, Springer format) is due later
- Selected papers are invited to a special issue of the Springer journal Evolutionary Intelligence
- Not listed in CORE ICORE2026; not in the CCF list
