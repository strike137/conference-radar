notes:
- Annual standalone meeting of SIREN, the Italian Society of Neural Networks, held since 1989 despite the "workshop" name
- Held every year at the SIREN headquarters in Vietri sul Mare on the Amalfi Coast (online only in 2021)
- Accepted papers appear in the Springer book series Smart Innovation, Systems and Technologies, indexed by Scopus
- Submission is an extended abstract; the full paper (15 to 20 pages, Springer format) is due by the conference
- Acceptance based on abstract quality and first come first served; 2026 capped submissions at 100
- Selected papers invited to a special issue of the Springer journal Evolutionary Intelligence (2027)
- Hosts themed workshops and the Caianiello Best PhD Thesis Award
- Not listed in ICORE2026; not on the CCF list
