notes:
- Symposium co-located with MSWiM, held in the same city and week (first held 2005 in Montreal; 20th edition in 2025)
- QoS, QoE and security in wireless and mobile networks, IoT, vehicular and sensor networks
- Known as ACM Q2SWinet through 2023 with proceedings in the ACM DL; no 2024 edition; 2025 papers submitted to IEEE Xplore
- Papers via EDAS; 8 pages IEEE double-column, up to 10 with paid extra pages
- Recent editions in Alicante (2020, 2021, virtual), Montreal (2022 virtual, 2023) and Barcelona (2025)
- Listed on the MSWiM 2026 workshops page, but no 2026 site or sessions in the MSWiM 2026 program as of 2026-10-17
- Not listed in ICORE2026 or the CCF 2026 list
