full_name: IEEE EUROCON International Conference on Smart Technologies
type: conference
tier: minor
areas: [general, communications, ai]
region: europe
language: english
frequency: biennial
organizer: IEEE Region 8 with the host European IEEE section (Poland Section 2025, Bosnia and Herzegovina Section 2027)
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
indexing: [Scopus, DBLP, EI]
fee: 490 USD IEEE member, 540 USD non-member (2025, early, by Apr 30)
typical:
  deadline_months: [1, 2, 3]
  conference_months: [6]
links:
  website: https://attend.ieee.org/eurocon-2027/
notes:
- Flagship conference of IEEE Region 8, held in odd years in a European section since 2001 (Ohrid 2017, Novi Sad
  2019, Lviv 2021, Torino 2023, Gdynia 2025, Sarajevo 2027)
- Broad EECS scope covering AI, communications, computing, power and energy, control and biomedical engineering
- Papers limited to 5 pages in IEEE format (2027), extra pages charged 50 EUR each; proceedings in IEEE Xplore
- In-person presentation required; in 2025 abstracts could also be submitted for a poster presentation without a paper
- Best paper and poster awards (2025); the 2027 call welcomes a Student Forum and Women in Engineering
- Not listed in CORE ICORE2026
