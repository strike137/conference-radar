id: icdlt
name: ICDLT
full_name: International Conference on Deep Learning Technologies
type: conference
tier: minor
areas: [ai]
region: china
language: english
frequency: annual
organizer: Commercial conference secretariat (icdlt@young.ac.cn, Chengdu) with Chinese host universities that change
  by edition (Kunming University of Science and Technology in 2026)
organizer_country: [china]
proceedings: ACM DL (2017 to 2025)
archival: true
indexing: [EI Compendex, Scopus]
fee: 575 USD regular author, 550 USD student author (2026); 5 double-column pages included, 30 USD per extra page
typical:
  deadline_months: [5, 6]
  conference_months: [7]
links:
  website: http://www.icdlt.org/
notes:
- Smaller commercially organized conference on deep learning models, theory, applications and responsible AI
- Held every July in a different Chinese city (Qingdao 2021, Xi'an 2022, Dalian 2023, Suzhou 2024, Chengdu 2025, Kunming 2026); virtual in 2020
- Proceedings 2017 to 2025 in the ACM Digital Library, listed as indexed in Ei Compendex and Scopus
- Submission via zmeeting; ACM template, at least 4 pages in the LaTeX double-column format
- Abstract-only presentation without publication is also offered
- Submission deadline is usually extended by a few weeks ("Final Call")
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
