notes:
- Held as a workshop of ARES (International Conference on Availability, Reliability and Security) in Europe every August;
  9th edition in 2026
- ARES papers including workshop papers are published in Springer LNCS since 2025; workshop papers up to 18 pages
  including references
- Part of the ARES EU Projects Symposium; continues the 5G-NS workshop series held with ARES since 2018
- 2026 co-organized with the EU PERUN project; chairs from Warsaw University of Technology, Thales, Montimage and Kookmin University
- Extended versions of accepted papers considered for the Journal of Cyber Security and Mobility (Scopus)
- Not listed in CORE ICORE2026
