notes:
- Flagship conference of the IEEE Electronics Packaging Society (formerly CPMT) on semiconductor packaging, components and microelectronic systems; 77th edition in 2027
- Held every late May or early June in the USA, with a large exhibition (136 exhibitors in 2026) and Professional Development Courses
- Two-step submission; a 700-word abstract is selected first, then accepted authors submit a 4 to 8 page manuscript for review in February
- Accepted manuscripts must be presented in person by a co-author to appear in the proceedings; interactive (poster) papers are published on equal footing
- "2026 (76th): 918 abstract submissions, 420 technical papers, 2,730 attendees from 29 countries"
- Strong industry participation (TSMC, Intel, Samsung and others); co-located with IEEE ITherm in 2026
- Not ranked by CORE or CCF, whose lists cover computing venues; regarded as the premier electronics packaging conference
