notes:
- Premier conference on electronic packaging, components and microelectronic systems; sponsored by the IEEE Electronics Packaging Society; 77th edition in 2027
- Held every late May or early June in the United States (2022 San Diego, 2023 Orlando, 2024 Denver, 2025 Dallas, 2026 Orlando, 2027 Denver)
- Selection is based on an abstract; accepted authors then submit a 4 to 8 page manuscript that is reviewed before inclusion in the proceedings
- Papers must be presented by a co-author to appear in the proceedings
- Large and industry-heavy (2026 had 918 abstract submissions, 420 technical papers and 2,730 attendees from 29 countries) with an exhibition and professional development courses
- Not ranked by CORE or CCF, whose lists cover computing venues
