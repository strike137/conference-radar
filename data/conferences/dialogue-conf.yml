notes:
- Long-running Russian computational linguistics conference, focused on computational analysis of Russian in a typological perspective
- 2026 was the 31st edition, held at Lomonosov Moscow State University in a mixed (in-person and remote) format
- Supported by MSU, MIPT, RSUH, HSE, St. Petersburg State University, EUSP and research institutes (ILZ, IPPI, MSU Research Computing Center)
- Accepted papers appear in the conference proceedings (RSCI); about 70 reviewer-selected papers go into the annual Computational Linguistics and Intellectual Technologies, indexed in Scopus
- Papers are submitted through Microsoft CMT; working languages are Russian and English, computational linguistics papers must be in English and papers on the linguistic analysis of Russian may be in Russian with an extended English summary
- A registration fee is required to publish and to attend (amount not stated)
- Runs the Dialogue Evaluation shared tasks, but there were no shared tasks in 2026
- Program committee decisions were announced after 2026-04-20
