notes:
- Czech national Python conference, one of the PyCon family, organized by volunteers from the Czech Python community (Pyvec)
- Editions in 2015 to 2020 and 2023; no editions in 2021, 2022, 2024, 2025 or 2026
- Two days of talks followed by a day of workshops and sprints
- 2023 was held in Prague; 2027 moves to Pilsen
- No papers or proceedings; talk recordings are published on YouTube
- Talks mostly in English; 14 talks in 2023 were marked 'in Czech only'
