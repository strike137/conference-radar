notes:
- Half-day workshop series on information retrieval for climate change impacts, linked to the needs of IPCC Working Group II
- Agenda-setting format with short talks, panels and a collaborative writing session, explicitly not a mini-conference
- MANILA24 took extended abstracts (2 to 4 pages, ACM sigconf, single-blind, EasyChair); no official proceedings
- Outputs are a workshop description, a report and a research agenda position paper (SIGIR Forum)
- Held at SIGIR 2024 (Washington D.C.) and SIGIR 2025 (Padua)
- At SIGIR 2026 MANILA26 ran as a tutorial, not a workshop
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
