links:
  website: https://casworkshop.github.io/
notes:
- Workshop series at the intersection of NLP and affective science (emotion modeling, affective data, emotion recognition)
- 1st edition at LREC 2026 (Palma de Mallorca), afternoon session; 21 papers in the ACL Anthology
- 2026 had archival long (8 pages) and short (4 pages) papers plus non-archival 2-page extended abstracts
- "2027 edition is a preconference on Computational Affective Linguistics (CAL) at the Society for Affective Science (SAS) 2027 conference, San Diego"
- 2027 takes 300-word abstracts and 2-page extended abstracts, presented in person as posters; extended abstracts may be published in the ACL Anthology
- Not listed in ICORE2026 and not on the CCF list
