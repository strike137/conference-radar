notes:
- Annual conference of the European Association for Computer Science Logic, running since 1987
- Covers logic in computer science broadly, from proof theory and type theory to automata, verification and finite model theory
- Proceedings in the open-access LIPIcs series (Schloss Dagstuhl); 2026 was LIPIcs volume 363
- Selected papers invited to Logical Methods in Computer Science
- Double-blind review, papers up to 15 pages in LIPIcs style excluding appendices and references
- Student papers eligible for the Helena Rasiowa award; the Ackermann Award is presented at the conference
- Held in Europe every year (Warsaw 2023, Naples 2024, Amsterdam 2025, Paris 2026, Brighton 2027), now in late January or February
- Co-located with the Logic Mentoring Workshop and FICS
- Ranked B in ICORE2026 and C in the CCF list
