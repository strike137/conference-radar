notes:
- Workshop of the P4 Language Consortium on research enabled by P4 and programmable data planes (switch ASICs,
  SmartNICs, DPUs, in-network computing)
- Co-located with a networking conference, mostly ACM CoNEXT (2022 Rome, 2023 Paris, 2026 Utrecht); 2024 was with
  IEEE ICNP in Charleroi, Belgium; 2020 and 2021 were virtual; no edition in 2025
- Short papers of up to 6 pages in ACM format, double-blind review, plus a separate posters and demos track
- Papers appear in the ACM Digital Library (2023 and 2026 with CoNEXT); the 2024 papers went to IEEE Xplore with ICNP
- At least one author must register at the full rate and present in person for the paper to appear in the proceedings
- Workshop-only registration is sold through the host conference
