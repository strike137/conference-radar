notes:
- IEEE-branded US conference on AI and IoT run by the Smart Society team that also runs IEEE CCWC, UEMCON and IEMCON
- Only papers presented at the conference are submitted to IEEE Xplore (conference policy)
- Virtual from 2021 to 2023; held at the Seattle Convention Center, USA since 2024 and physical only
- Double-blind review via EDAS; regular papers up to 7 pages, short (work-in-progress) papers up to 6 pages, extra
  pages at a charge
- Short cycle of about two months from submission deadline to conference
- The 2027 site calls the event World AI IoT Congress 2027 without the IEEE prefix
- Not listed in CORE ICORE2026; generally regarded as a low-selectivity venue
