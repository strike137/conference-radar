links:
  website: https://www.apmc2026.org/
notes:
- Held since 1986 and described by its organizers as the premier microwave event in the Asia-Pacific region; rotates
  among more than 10 countries
- Each edition is run by a society of the host country (IEICE in 2026, KIEES in 2025) with technical sponsorship from
  IEEE MTT-S, EuMA and URSI
- Covers microwave, millimeter-wave and terahertz devices, circuits, antennas, propagation, systems and applications
- Short papers (3 to 4 pages in 2026, up to 3 pages in 2025) via EDAS; peer reviewed; accepted and presented papers
  go to IEEE Xplore
- 2026 papers also appear in the IEICE Proceedings Series; selected papers can go to IEEE MWTL or an IEICE
  Transactions on Electronics special issue
- Late Breaking News track with a short deadline in August (camera-ready on submission, no revision)
- At least one author must register and present the paper at the conference, or it is dropped from the proceedings
- Not listed in ICORE2026 or the CCF list; microwave engineering venue outside the usual CS rankings
