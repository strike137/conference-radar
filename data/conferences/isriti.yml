notes:
- Annual since 2018, organized by UTDI in Yogyakarta; proceedings of all editions 2018 to 2025 are in IEEE Xplore and
  the site states they are Scopus indexed
- Only accepted and presented papers (on-site or online via Zoom) go to IEEE Xplore
- Full papers in IEEE format via EDAS; broad IT and intelligent systems scope
- Held in Indonesia every December, usually hybrid from the Sahid Raya Hotel and Convention Yogyakarta (2024 to 2026);
  2023 was in Batam
- Not listed in ICORE2026 or the CCF list
