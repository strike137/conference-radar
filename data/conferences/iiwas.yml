notes:
- Sister conference of DEXA run by @WAS; co-located with MoMM every December
- 'Often held in Asia: Matsue, Japan (2025), Bangkok (2026); Bratislava in 2024'
- Proceedings in Springer LNCS (full papers 15 pages, short 6 pages, including references)
- In-person only, no hybrid option; regarded as a minor venue (CORE C)
- Formerly titled Information Integration and Web-based Applications and Services
