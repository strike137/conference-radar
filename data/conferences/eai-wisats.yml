notes:
- EAI conference series on wireless and satellite communications, formerly called PSATS; 2026 is the 16th edition
- Proceedings in Springer LNICST; selected papers invited to extend for Springer Wireless Networks (WINET)
- Recent editions hosted in China (Harbin 2019, 2024 and 2025, Weihai 2026); 2020 to 2022 editions were virtual or hybrid (listed as Nanjing 2020 and Singapore 2022)
- Main track and late track with separate deadlines; full papers 12 to 20 pages, short papers 6 to 11 pages in Springer format
- Not listed in ICORE2026 or the CCF 2026 list
