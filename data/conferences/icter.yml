id: icter
name: ICTer
full_name: International Conference on Advances in ICT for Emerging Regions
type: conference
tier: minor
areas: [general, ai, security, data, software, systems]
region: south-asia
language: english
frequency: annual
organizer: University of Colombo School of Computing (UCSC)
organizer_country: [other]
proceedings: Springer CCIS
fee: 250 USD author, 225 USD author early bird or student (2026, international); 60,000 LKR author (2026, local)
typical:
  deadline_months: [5, 6]
  conference_months: [11]
links:
  website: https://icter.lk/
notes:
- Run by the University of Colombo School of Computing (UCSC), Sri Lanka; held every year in Colombo
- Successor of the International Information Technology Conference (IITC), held in Sri Lanka since 1998; 2026 is the
  26th edition
- Since 2025 full papers appear in Springer CCIS (ICTer 2025 -> CCIS volume 2844); earlier editions were submitted to IEEE
  Xplore (2022) or the open-access ICTer Journal (2024)
- Main research track takes 12 to 15 page LNCS-format papers, double-blind; survey-only and literature review papers
  are not accepted
- Industry R&D track takes 6 page short papers and 2 page extended abstracts; at least one author must have an industry
  affiliation
- Not listed in ICORE2026 or the CCF list
- Deadlines are 11.59 PM IST as stated on the CFP page; 2026 deadlines were extended by two weeks
