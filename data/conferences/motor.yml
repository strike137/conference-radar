notes:
- Formed in 2019 by merging four Russian optimization conference series (Baikal school seminar, MPA Ekaterinburg, DOOR Novosibirsk, OPTA Omsk)
- Held in Russia every year, rotating between Irkutsk, Ekaterinburg, Novosibirsk, Omsk and Petrozavodsk
- Main proceedings in Springer LNCS (MOTOR 2026 is LNCS 16687); 2019 to 2024 also had a Springer CCIS "Recent Trends" volume
- Other papers can go to Russian journals (Siberian Electronic Mathematical Reports, Proceedings of Krasovskii IMM UB RAS)
- Abstract-only submissions (1 page) are accepted for oral presentation without a paper
- Full papers 12 to 15 pages in LNCS format, submitted via Springer Meteor; at most two papers per author
- Operations research and optimization venue, so only partly in the EECS scope of this list; topics include optimization in machine learning
- In-person and online participation offered
- Not listed in ICORE2026 or the CCF 2026 list
