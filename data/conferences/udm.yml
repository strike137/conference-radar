notes:
- Half-day workshop on uncertainty quantification, out-of-distribution detection and decision making under uncertainty,
  including foundation models
- First held at AAAI 2023, then at KDD every year since 2023 (Long Beach 2023, Barcelona 2024, Toronto 2025, Jeju 2026)
- Papers up to 5 pages in the ACM two-column template, double-blind review via CMT
- Accepted papers are posted on the workshop website but are not included in the KDD proceedings, so they can be published
  elsewhere
- Run by the same group as the EAI workshop at KDD
- Not listed in the CORE ICORE2026 portal or the CCF list
