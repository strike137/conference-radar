notes:
- Practitioner conference on software quality and delivery in Tallinn, Estonia; Nordic Testing Days ran from 2012 to 2026
- From 2027 merged with Nordic DevOps Days into Nordic Tech Days, with four tracks (testing, DevOps, development, leadership) and a shared main stage
- About 400 attendees; held at Kultuurikatel (Tallinn Creative Hub)
- Call for speakers on Sessionize for 30-minute talks and 2 or 4 hour workshops; speakers get a free ticket, travel support and two hotel nights
- "Fee: 425 EUR incl. VAT until 2026-12-31 (2027)"
- No papers or proceedings; talks are recorded on YouTube
- Not listed in CORE ICORE2026
