notes:
- Sponsored by IEEE ComSoc; despite the "workshop" name it is a stand-alone three-day event with its own workshops,
  special sessions, keynotes and demos
- Long-running series (2026 is the 31st edition); proceedings in IEEE Xplore
- Mostly held in Europe (Porto 2021, Paris 2022, Edinburgh 2023, Athens 2024, Nicosia 2026); 2025 was in Tempe, AZ, USA
- Topics cover modeling, simulation and design of B5G/6G networks, IoT, SDN/NFV, AI-native networking and network
  security
- Six page papers via EDAS, up to two extra pages at 100 USD each; one author registration covers up to two papers
- Hybrid attendance offered in 2026
- Not listed in the ICORE2026 portal (0 results)
- Deadlines were extended in both 2025 (three submission dates) and 2026 (May 22 moved to Jun 6)
