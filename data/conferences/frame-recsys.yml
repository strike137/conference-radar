notes:
- New workshop in 2026 on experimental rigor and research assessment in recommender systems
- Two tracks, Research Papers (two-stage methodology-first, results-blind double-blind review) and Experimental Methodologies (single-blind)
- Research papers are first submitted as a result-blind methodology version; the complete version follows after the first review stage
- Proceedings planned in CEUR-WS, single-column CEUR format, up to 8 pages plus references
- Also includes an invitation-only moderated discussion session
- Not listed in the CORE ICORE2026 portal and not on the CCF list
