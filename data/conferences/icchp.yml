notes:
- Biennial conference on assistive technology, digital accessibility and eInclusion, held for more than 35 years
- 2026 edition billed as the 20th International Conference on Digital Inclusion, Assistive Technology (AT), Accessible ICT
- Run by the JKU Linz Institut Integriert Studieren with the Austrian Computer Society; often held in Linz
- Two step submission; a 3 to 5 page extended abstract gets double-blind review by three experts, then a 6 to 8 page
  LNCS paper
- Papers in Springer LNCS (two volumes, 16866 and 16867 in 2026); short contributions go to an Open Access Compendium
- Also has an Innovation Area for workshops and demos and a Young Researchers Consortium before the conference
- CORE C (ICORE2026); not on the CCF 2026 list
