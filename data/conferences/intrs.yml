notes:
- Half-day workshop at ACM RecSys on user interfaces, explanations, human decision making and user-centric evaluation of recommender systems
- Held with RecSys every year; 2026 in Minneapolis was the 13th edition
- Proceedings in CEUR-WS (Vol-4261 for 2026, Vol-4027 for 2025)
- Long papers (10 or more pages) and short papers (5 to 9 pages) including references, plus reproducibility/resource and position papers, CEUR-WS single-column format
- Double-blind review
- Not listed in the CORE ICORE2026 portal
