notes:
- Workshop on responsibility, ethics and sustainability across the software development lifecycle
- First edition 2025; 2026 at FSE in Montreal (listed there as RSE 2026); 2027 moves to ICSE in Dublin
- Research papers and experience reports 6 to 8 pages, short papers 4 to 6 pages, plus interactive exercises; double-blind review
- 2026 papers appeared in the FSE Companion proceedings (ACM DL); 2027 papers will be published by IEEE
- Interactive format with working sessions and co-created artifacts
- Not listed in ICORE2026 or on the CCF 2026 list
