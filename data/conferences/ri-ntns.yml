notes:
- Half-day workshop co-located with IEEE INFOCOM; first held with INFOCOM 2026 in Tokyo
- Accepted and presented papers and extended abstracts appear in the IEEE INFOCOM 2026 proceedings and are submitted to IEEE Xplore
- Papers up to 6 pages in double-column format including references, submitted via EDAS
- Topics are resilience and AI for satellite, HAPS and UAV networks, jamming resistance, O-RAN and cell-free MIMO for NTNs
- Chairs from Hiroshima University, Rutgers University, NEC, NII and the U.S. Army Research Laboratory
- Not listed in ICORE2026
