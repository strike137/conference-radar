notes:
- Vendor-neutral practitioner conference on Wi-Fi and WLAN engineering, run by Wireless LAN Professionals (WLAN Pros)
- Several editions a year; a US edition in Phoenix each February plus European editions (Prague 2024 and 2026, Valencia 2025) and a Mexico City edition in November 2026
- Program of community talks chosen by a call for presentations followed by public CFP voting; no formal proceedings, talks go to the WLAN Pros YouTube channel
- Each event has three days of paid boot camps (certification and hands-on training) before a two or three day main conference with Deep Dive sessions
- "Expensive: 3,200 USD main conference only for Phoenix 2026 (hotel and meals included), 2,600 EUR for Prague 2026"
