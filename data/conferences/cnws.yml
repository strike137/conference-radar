notes:
- Annual workshop of IPSJ SIG CN, started in 2004 as the Groupware and Network Services Workshop (GNWS); renamed
  CNWS in 2023 together with the SIG
- The IPSJ symposium schedule lists it as the Collaboration and Network Services Symposium
- Topics are CSCW and collaboration support, communication and group interaction, social media and network
  services
- Four categories; peer-reviewed papers (6 to 8 pages), general papers without review, 2-page position papers and
  student reports on international conferences
- All papers are registered in the IPSJ Digital Library in tech report format; authors can ask for a recommendation
  to the IPSJ Journal
- Held in November as an overnight retreat at a hot spring hotel with shared rooms (Atami 2025, Gero 2026), with a
  night session; fees include lodging
- Not in the CORE ICORE2026 portal or the CCF 2026 list
