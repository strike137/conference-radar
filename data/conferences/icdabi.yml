links:
  website: https://icdabi.uob.edu.bh/
notes:
- Run by the University of Bahrain, with INFORMS and IEEE Bahrain logos shown on the site
- Annual since 2020; proceedings of the 2020 to 2025 editions are in IEEE Xplore
- Held online over Microsoft Teams since at least 2024 (2021 was virtual too); 2026 is an online conference
- Papers up to 5 pages in IEEE format, peer reviewed
- Short cycle, about two months from submission deadline to conference
- Not listed in CORE ICORE2026 or the CCF list
