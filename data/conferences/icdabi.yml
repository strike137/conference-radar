links:
  website: https://icdabi.uob.edu.bh/
notes:
- Organized by the University of Bahrain in collaboration with the INFORMS Bahrain International Group; the
  IEEE Bahrain logo is shown and the programs carry a "technically sponsored by" heading
- Accepted papers within the scope of IEEE are submitted to IEEE Xplore; all editions 2020 to 2025 are linked
  from the site to their IEEE Xplore proceedings
- Hosted from Bahrain in late October (2024 on 23-24 Oct, 2025 on 29-30 Oct); the 2025 program lists Microsoft
  Teams links and the 2026 edition was an online conference
- Broad data analytics scope (big data, data mining, business intelligence, AI for business and industry,
  optimization, statistics); short papers of at most 5 pages in IEEE format, submission via EDAS
- "Low fees: free for University of Bahrain students and staff, BD 15 to 100 for others (2026)"
- Not listed in the CORE ICORE2026 portal
