notes:
- Community-run Security BSides conference for Oklahoma, held since 2015 and drawing attendees from neighboring states
- One conference day in early April at the Glenpool Conference Center near Tulsa (every in-person edition since 2017)
- In 2026 the week also had a high school student day (6 April), two training days (7 and 8 April) and an AI Security Summit (9 April)
- Open call for papers; mostly defensive (blue team) audience, so practical defensive talks are favored
- Over 800 attendees in 2024; no proceedings
