notes:
- IEEE SMC Society conference on human-machine systems (human-AI collaboration, human factors, HRI, autonomous systems); 2026 is the 6th edition
- Accepted and presented papers go to IEEE Xplore; no-show papers are removed
- Regular papers up to 6 pages plus up to 2 extra pages for a fee; submission through PaperCept
- Hybrid participation allowed, but online authors pay the full registration fee
- 2026 edition held at Nanyang Technological University, Singapore, with co-located summer schools (ISACT, CHAIS)
- Not listed in CORE ICORE2026 or the CCF list
