notes:
- Annual celebration of the ACM Turing Award in China with keynotes by Turing laureates; the paper track runs as
  SIG China symposia (SIGAI, SIGCOMM, SIGMOBILE, SIGSAC, SIGMOD, SIGWEB, SIGCSE, SIGSPATIAL in 2026)
- 'Paper format changes by year: full papers up to 6 pages (2026) or 5 pages (2024) in ACM double-column format
  plus references, and 2-page poster papers; the 2025 call asked only for 2-page poster papers'
- Single-blind review; accepted papers go to the ACM Digital Library
- 'Held in a different Chinese city each year: Changsha 2024, Shenzhen 2025 (postponed to October), Hangzhou 2026'
- Program pages are mainly in Chinese; mostly attended by the Chinese research community; not in the CCF list or
  CORE
