notes:
- One of six conferences in the IEEE World Congress on SERVICES (with CLOUD, ICWS, ICDH, QSW and SSE), sponsored by IEEE and the IEEE Computer Society
- Registration and venue are shared with the congress, which moves around the world (Helsinki 2025, Sydney 2026)
- Papers go to IEEE Xplore; optional hybrid open access with an APC of 640 USD (members) or 800 USD (non-members) in 2026
- Double-blind review; regular papers 7 to 10 pages plus references, short papers 4 to 6 pages plus references
- Not in ICORE2026 and not on the CCF list
