links:
  website: https://sites.google.com/view/crossfyre25/home
notes:
- Workshop for women and gender minorities in cryptography and security, aimed at early career researchers from BSc
  students to postdocs; all genders welcome to attend
- Participants submit abstracts for 15-minute talks or posters; program also has invited talks and a panel discussion
- Nothing is published; the 2025 talks are not part of the ACNS 2025 workshop proceedings in LNCS
- 14th edition in 2025 (ACNS 2025, Munich); 2023 at Eurocrypt Lyon, 2024 at Eurocrypt Zurich, 2022 Passau, 2020/21 virtual,
  2019 Darmstadt
- Official registration goes through the host conference (ACNS 2025 rates 650 EUR early bird, 450 EUR student)
