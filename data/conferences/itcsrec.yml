frequency: annual
organizer: Part of the Australasian Computer Science Week (ACSW), jointly sponsored by CORE and ACDICT
organizer_country: [australia, new-zealand]
proceedings: ACM DL (ACM ICPS, ACSW proceedings)
archival: true
indexing: [ACM DL]
typical:
