links:
  website: https://itcsrec.github.io/
notes:
- New conference within ACSW; first edition in 2026 (Melbourne), second in 2027 (ANU Canberra)
- Topic is international and transnational CS/IT education and research collaboration (offshore campuses, joint programs, curricula, cross-cultural teaching)
- Double-blind review; full papers up to 8 pages and short papers 2 to 4 pages, ACM template, EasyChair
- Accepted papers published in the ACM Digital Library as part of the ACSW proceedings; authors outside ACM Open may have to pay an APC
- Track chairs from Deakin University and the University of Auckland
- Not found in ICORE2026; not on the CCF list
