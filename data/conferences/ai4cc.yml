notes:
- Workshop on generative AI for images, video, 3D and other content, held with CVPR every year since 2020
- Non-archival; accepted papers are not in the CVPR proceedings and authors are asked to post them on arXiv
- 8-page papers and 4-page extended abstracts, double blind review in the CVPR template via CMT
- Also accepts a selection of recently published papers (including CVPR main papers) for posters without new review
- Best paper awards and travel awards
- The official site is ai-for-content-creation.github.io; the domain ai4cc.net is not the workshop
- Not listed in ICORE2026
