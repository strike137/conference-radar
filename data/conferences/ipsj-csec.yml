notes:
- Main IPSJ security SIG; about four numbered research meetings a year (113th in May 2026, 114th in July 2026)
- 'Fixed yearly pattern: May joint with IPSJ IOT and IEICE ICM, July Security Summer Summit in Sapporo, December
  joint with SPT and EIP, March joint with IPSJ DPS'
- Talks go into non-refereed IPSJ SIG Technical Reports; IPSJ student members can register for one SIG free of charge
- 'Also runs the Computer Security Symposium (CSS 2026: Oct 19 to 23, Act City Hamamatsu, paper application deadline
  Aug 3) and co-organizes IWSEC'
