organizer: SEFM Steering Committee (2026 organised by the University of Malta)
organizer_country: [europe]
proceedings: Springer LNCS
archival: true
rank:
  core: B
fee: About 550 EUR (2026, early, includes workshops); workshop-only 150 EUR (1 day) or 250 EUR (2 days)
typical:
  deadline_months: [6]
  conference_months: [11]
links:
  website: https://sefm-conference.github.io/
notes:
- Annual conference on bringing formal methods into practical software engineering; 2026 is the 24th edition
- "Recent hosts: Berlin (2022), Eindhoven (2023), Aveiro (2024), Toledo (2025), Malta (2026)"
- Proceedings in Springer LNCS (SEFM 2025 -> LNCS 16192)
- Regular papers up to 16 pages plus 2 pages of references; short and tool papers up to 8 pages
- Single-blind review; tool papers need an accepted artefact (EAPLS badges)
- Satellite workshops on the first two days
- Deadlines were extended by about one week in both 2025 and 2026
- CORE B (ICORE2026); not on the CCF list
