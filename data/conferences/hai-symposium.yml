notes:
- Domestic Japanese symposium on human-agent interaction (agents, robots, communication, cognitive science), held
  almost every year since 2006 (no 2019 edition in the past proceedings list); 2026 was the 20th edition
- Separate from the international ACM HAI conference (hai), which shares the hai-conference.net portal
- No peer review; submissions far outside the scope may be rejected
- Oral (single track, 4+ pages) and poster (1+ pages) presentations; selected oral papers get a longer discussion
  session
- Papers use the JSAI SIG style file; authors keep copyright; past programs and papers are open on the website
- Recent venues - Shizuoka University Hamamatsu (2023, 2024), Kindai University Higashi-Osaka (2025, 2026), Gifu
  (2027)
- Not listed in CORE ICORE2026 (the CORE "HAI" entry is the international conference)
