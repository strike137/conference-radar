notes:
- Annual conference of the American Automatic Control Council (AACC), the organizer of ACC; co-sponsored by IFAC
- Covers modeling, estimation and control of dynamic systems; also hosts the ASME Dynamic Systems and Control Division meetings
- Proceedings in the open-access IFAC-PapersOnLine series, indexed in EI, Scopus, Web of Science and INSPEC
- Contributed papers up to 6 pages, peer reviewed through PaperCept in the IFAC format
- Joint submission option with ASME journals (ALDSC, JDSMC, JAVS) with an earlier deadline; journal-accepted papers get only a 1-page abstract in the program
- Held in the USA (Pittsburgh 2025, Phoenix 2026, Salt Lake City 2027)
- Not listed in ICORE2026 (control venue outside the CORE computing list) or the CCF list
