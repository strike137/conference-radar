notes:
- First edition in 2026, a full-day workshop at EMNLP 2026 in Budapest
- Topic is multilingual and culturally aware reasoning in generative AI, with a focus on open data, reproducible evaluation and tools
- Long (8 pages) and short (4 pages) papers; double-blind via OpenReview
- Archival and non-archival submissions; only archival papers go into the proceedings (ACL Anthology 2026.oracle-main)
- Hosts the ORACLE-CR shared task on open cultural reasoning across languages
- Not ranked in ICORE2026 and not on the CCF list
