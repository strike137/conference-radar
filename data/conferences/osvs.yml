notes:
- Post-conference workshop of IEEE EuroS&P, held in Vienna (2024-07-12) and Venice (2025-07-04)
- OS and virtualization security, secure-by-design cloud, edge and 5G/6G systems, threat modeling, cyber ranges
- 'Regular papers up to 13 pages and short (Work-in-Progress) papers up to 6 pages, both in the proceedings;
  double-blind, IEEE EuroS&P A4 template, EasyChair'
- Accepted papers published in IEEE Xplore in the volume accompanying the IEEE EuroS&P proceedings
- Submission deadlines were extended in both 2024 (2024-03-15 -> 2024-04-01) and 2025 (2025-03-16 -> 2025-03-23)
- Not on the list of IEEE EuroS&P 2026 workshops (Lisbon), so there was no 2026 edition
- Not listed in ICORE2026 (portal search returns no results)
