notes:
- Half-day workshop at ECML PKDD on machine learning for energy systems (forecasting, grid control, asset management, energy markets, EV integration)
- Held at ECML PKDD 2024 in Vilnius and ECML PKDD 2025 in Porto; not in the ECML PKDD 2026 workshop list
- Technical papers up to 16 pages and short position papers up to 8 pages, LNCS format, submitted via the ECML PKDD CMT
- Papers go into the joint ECML PKDD post-workshop proceedings in Springer CCIS (authors can opt out)
- Not listed in CORE ICORE2026
