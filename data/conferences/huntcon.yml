notes:
- Billed as the first in-person European conference dedicated exclusively to threat hunting; 2027 is the first edition
- Organized by Sebastien Damaye and sponsored by Schneider Electric, held at Schneider Electric headquarters (SENSE) in La Defense, Nanterre near Paris
- Day 1 talks (30 or 60 minute slots) and an exhibitor booth session; day 2 round tables under the Chatham House Rule
- Free attendance with mandatory registration, capped at 110 attendees and 3 per organization
- All talks in English; slides published on the website after the event; no proceedings
- Organizers intend to hold it every year
