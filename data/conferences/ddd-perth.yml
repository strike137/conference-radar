notes:
- Perth's largest community run conference for the software industry, held on a Saturday
- Founded in 2015 as part of the Developer! Developer! Developer! series; run by the non-profit DDD WA Inc. since 2018
- Open call for proposals on any software industry topic; anonymised proposals are voted on by the public, then curated
- Low ticket price, sponsored tickets for people who cannot afford one, childcare available
- Aims to give underrepresented groups, juniors and first time speakers a chance to present; no papers
- 'Past dates: 10 Sep 2022, 10 Oct 2023, 16 Nov 2024, 20 Sep 2025, 3 Oct 2026 (Optus Stadium since 2023)'
- Sister events DDD Melbourne, DDD Sydney, DDD Brisbane and DDD Adelaide
