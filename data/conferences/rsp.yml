notes:
- Long-running workshop on rapid prototyping of embedded hardware and software systems (37th edition in 2026)
- Held as part of Embedded Systems Week (ESWEEK), so the location follows ESWEEK (Hamburg 2023, Raleigh 2024, Taipei
  2025, Barcelona 2026)
- Papers up to 7 pages in IEEE double-column format; single-blind review via EasyChair
- 2026 papers go to IEEE Xplore and the ACM Digital Library
- RSP 2026 had a special session on RISC-V and open hardware for rapid prototyping
- Listed in CORE (ICORE2026) as IEEE International Symposium on Rapid System Prototyping, rank C
