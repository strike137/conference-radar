notes:
- Long-running KDD workshop on data mining for bioinformatics and biomedical informatics; 2026 was the 25th edition
- Co-located with ACM SIGKDD, so it moves with KDD (Toronto in 2025, Jeju, Korea in 2026)
- Three tracks -> regular papers (up to 10 pages), abstracts, and late-breaking research on already published work
- Single-blind review via Microsoft CMT; all accepted submissions get an oral slot
- No workshop proceedings; full papers are invited to a BIOKDD special issue of IEEE/ACM TCBB, which since 2025 needs at least 30% new material
- 2026 theme was digital twins for disease modeling
- Not listed in ICORE2026 and not on the CCF list
