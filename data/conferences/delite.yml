notes:
- Workshop on NLP and AI support for deliberation (argument mining, online deliberation at scale, collective intelligence)
- Held with LREC so far (LREC-COLING 2024 Turin, LREC 2026 Palma de Mallorca)
- Website hosted by the Knowledge Media Institute (KMi) of The Open University
- Archival long (8 pages) and short (4 pages) papers with double-blind review via START, plus non-archival extended abstracts, PhD proposals and reports
- Small workshop; 4 archival papers in the 2026 proceedings
- Not ranked in CORE ICORE2026
