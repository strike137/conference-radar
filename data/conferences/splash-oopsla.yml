notes:
- SPLASH is the umbrella conference; its main research track OOPSLA publishes in the OOPSLA issues of PACMPL (ACM DL)
- Ranks are for OOPSLA (CORE A in ICORE2026, CCF A); SPLASH itself is not listed in CORE
- Two review rounds per year (October and March/April); a paper rejected in round 1 cannot be resubmitted in round 2
- Up to 23 pages for initial submissions (acmsmall), double-blind review, in-person presentation required
- At least one author must register as a reserve reviewer
- Co-located with ISSTA and SAS in Oakland 2026; held in Pasadena 2024, Singapore 2025 and Prague 2027
