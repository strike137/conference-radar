notes:
- Workshop on type theories, logical frameworks and meta-languages for representing and reasoning about deductive systems (binders, mechanized metatheory, proof assistants)
- Formed in 2006 by merging the LFM and MERLIN workshops (series since 1999); LFMTP 2026 was the 21st edition
- Affiliated with FSCD most years, sometimes with FLoC, CADE, IJCAR or LICS
- Recent locations are Pittsburgh 2021, Haifa 2022, Rome 2023, Tallinn 2024, Birmingham 2025 and Lisbon 2026 (FLoC); mostly held in Europe
- Accepts regular papers (15 pages), system descriptions (10 pages) and work in progress reports (8 pages) in EPTCS style
- A selection of the presented papers appears in the open-access EPTCS series (LFMTP 2024 -> EPTCS 404, LFMTP 2025 -> EPTCS 431, LFMTP 2026 -> EPTCS 448)
- Not listed in ICORE2026 or the CCF 2026 list
