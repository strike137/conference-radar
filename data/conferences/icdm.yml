notes:
- IEEE's flagship data mining conference; ranked CORE A* although CCF lists it as B
- Very selective for regular papers (about 9 to 14% over 2021 to 2025); roughly 20% overall once short papers are
  counted
- Research track uses triple-blind review; 10-page IEEE two-column limit including references; single full-paper
  deadline in early June with no separate abstract deadline; regular or short status decided after acceptance
- 2026 edition in Shenyang, China (Northeastern University); Shanghai hosted in 2023
- 2026 adds a single-blind Applied Track with the same deadline; best papers invited to the KAIS journal
