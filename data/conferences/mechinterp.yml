notes:
- Workshop on mechanistic interpretability, i.e. understanding neural network internals (weights and activations); relevant to AI safety
- Held with ICML 2024 (Vienna), NeurIPS 2025 (San Diego) and ICML 2026 (Seoul)
- Non-archival; papers already accepted at ICML 2026 were welcome, but work accepted at other archival venues was not
- Short (4 pages) and long (8 pages) papers in ICML format (NeurIPS format also accepted for submission in 2026), double-blind on OpenReview, reciprocal reviewing required
- Submissions in 2026 were 2.6 times those of 2025
- Not listed in ICORE2026 and not on the CCF list
