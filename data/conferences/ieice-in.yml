id: ieice-in
name: IEICE IN
full_name: IEICE Technical Committee on Information Networks (IN)
name_local: 電子情報通信学会 情報ネットワーク研究会
type: meeting
tier: domestic
areas: [networking]
region: japan
language: japanese
frequency: multiple-per-year
organizer: IEICE Communications Society, Technical Committee on Information Networks
proceedings: IEICE Technical Report (non-refereed)
archival: false
rank:
  core: Unranked
fee: Presentation fee 3,300 JPY per talk for IEICE members (2026); audience fee from 3,300 JPY for members (1-day
  meeting, advance; 5,500 JPY for 2-day meetings); student members attend free via annual registration (up to 3
  committees)
typical:
  deadline_months: [1, 3, 5, 6, 7, 10]
  conference_months: [3, 5, 7, 8, 9, 12]
links:
  website: https://www.ieice.org/cs/in/jpn/
notes:
- Five regular meetings a year plus one workshop held with NS; 105 talks in FY2025
- Each meeting usually has one to five invited talks; an IN research presentation award is given per meeting; slide-format
  manuscripts are accepted for general talks
- Topics span network architecture, services, QoS and traffic control, SDN/NFV, IoT and network security
- Talks are published as non-refereed IEICE Technical Reports
