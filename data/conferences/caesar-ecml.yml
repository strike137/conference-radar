notes:
- Half-day workshop on causal inference and anomaly detection (root cause analysis, anomaly attribution, causal regime change detection)
- First edition at ECML PKDD 2026 in Naples (11 Sep 2026)
- Extended abstracts (2 to 4 pages) and full papers (6 to 16 pages) in LNCS format, double-blind, at least 2 reviewers
- Papers can go into the joint ECML PKDD post-workshop proceedings in Springer CCIS; authors can opt in or out
- Also accepts oral-only presentations of already published work as extended abstracts
- Not listed in CORE ICORE2026
