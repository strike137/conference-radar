id: icceic
name: ICCEIC
full_name: International Conference on Computer Engineering and Intelligent Control
type: conference
tier: minor
areas: [general, networking, security]
region: china
language: english
frequency: annual
organizer: ICCEIC conference secretariat with technical service by AiScholar (ais.cn) and a host university (Guangdong University of Technology in 2025)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus, Inspec]
fee: 630 USD or 4200 CNY per 4-page paper (2026, regular); 570 USD early bird before September 1; 600 USD student; 60 USD per extra page; attendee without paper 225 USD
typical:
  deadline_months: [8]
  conference_months: [10]
links:
  website: http://www.icceic.org/
notes:
- Annual since 2020; held online in 2021 and 2022 and in Guangzhou, China every October since 2023
- Accepted full papers go to an IEEE conference proceedings volume submitted to IEEE Xplore, EI Compendex, Scopus and Inspec; earlier volumes were published by IEEE CPS
- Two or three reviewers per paper according to the site
- Topics include computer and software engineering, networks, network security and intelligent control
- 2023 edition was held together with the 21st Huacheng Academician Science and Technology Summit
- Abstract-only presenter and listener registration offered
- Not listed in CORE ICORE2026 or the CCF list
