notes:
- One-day workshop co-located with ACM CCS; location follows CCS (2025 Taipei, 2026 The Hague)
- 'Topics: decompilation, binary analysis, deobfuscation, clone detection, agentic reverse engineering, benchmarks and
  human studies'
- Proceedings in the ACM Digital Library (2025 volume doi 10.1145/3733822)
- Full papers up to 12 pages and short papers up to 6 pages excluding references, double-column ACM format, double-blind;
  2-page non-anonymous poster abstracts
- 12 accepted in 2025 (5 full papers, 4 short papers, 3 posters)
