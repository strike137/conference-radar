notes:
- Annual regional event on information systems run by UFV at its Rio Paranaíba campus (Minas Gerais, Brazil); 17th edition in 2026
- Main track plus talks, short courses, a programming contest and game championships
- Full papers 8 to 12 pages, short papers 4 to 5 pages, SBC template, in Portuguese or English, submitted via JEMS
- Double-blind review; online presentation allowed for authors from outside UFV-CRP
- Accepted papers published in SBC OpenLib (SOL) as Anais do Workshop de Sistemas de Informação, with a DOI per paper
- "Registration 2026: 50 BRL (undergraduate students) to 300 BRL (professionals), lower for SBC members"
- Not listed in CORE ICORE2026
