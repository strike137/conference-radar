links:
  website: https://naacl2025-srw.github.io/
notes:
- Student workshop held as part of NAACL; topics are the same as the main NAACL conference
- Only held in years with a NAACL conference (2024 Mexico City, 2025 Albuquerque; no NAACL in 2026; NAACL 2027 in San Francisco)
- Research papers (first author must be a student) and thesis proposals, up to 5 pages plus references, submitted on OpenReview
- Authors choose archival or non-archival; archival papers appear as the Student Research Workshop volume of the NAACL proceedings in the ACL Anthology
- Optional pre-submission mentorship about two months before the deadline; travel grants for students
- Accepted papers are presented in the main conference poster session
- NAACL 2025 SRW volume has 53 papers (2025.naacl-srw in the ACL Anthology)
- Not listed separately in ICORE2026 or the CCF 2026 list
