notes:
- Cloud and edge computing conference held since 2017, technically sponsored by the IEEE Computer Society Technical Committee on Cloud Computing (TCCLD)
- Mixes academic papers with an industry track of invited talks from cloud providers
- Accepted papers and poster abstracts are published by IEEE CPS and included in IEEE Xplore
- Full papers up to 6 pages (2 extra pages for a fee), poster extended abstracts up to 4 pages, IEEE double-column format
- Held in the Washington DC area (Washington DC 2019, 2024, 2025, 2026; Fairfax 2022; Baltimore 2023)
- Not listed in ICORE2026 or the CCF 2026 list
