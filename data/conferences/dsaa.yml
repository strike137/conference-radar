notes:
- Data science conference run by the DSAA steering committee and the IEEE Task Force on DSAA, held every October
- Rotates worldwide (2020 Sydney, 2021 Porto, 2022 Shenzhen, 2023 Thessaloniki, 2024 San Diego, 2025 Birmingham,
  2026 New Delhi)
- Research, Application, Industry, LLM and Survey and Vision tracks in 2026, plus special sessions and a journal track
  with the Machine Learning journal and JDSA
- Double-blind review via OpenReview; IEEE two-column format, 7 pages plus references in 2026 (10 pages in 2025)
- Proceedings in IEEE Xplore, submitted for EI indexing; ICORE2026 lists it as B and CCF lists it as C
- In-person presentation required; unpresented papers may be removed from IEEE Xplore
