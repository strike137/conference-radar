id: icbip
name: ICBIP
full_name: International Conference on Biomedical Signal and Image Processing
type: conference
tier: minor
areas: [vision]
region: asia-pacific
language: english
frequency: annual
organizer: Conference secretariat (contact icbip@cbees.net) with host universities (Yonsei University and Kyung Hee University in 2027)
organizer_country: [china]
proceedings: Conference proceedings (IEEE for 2025; 2027 publisher not named) or Journal of Image and Graphics (JOIG)
archival: true
indexing: [EI Compendex, Scopus]
typical:
  deadline_months: [1]
  conference_months: [7, 8]
links:
  website: https://www.icbip.org/
notes:
- Annual since 2016 (Budapest); 12th edition in 2027
- Covers biomedical signal processing (EEG, ECG, EMG), medical image analysis, reconstruction and segmentation
- Held in China in 2019 and 2023 to 2026 (Chengdu, Suzhou, Shanghai), online 2020 to 2022; Jeju, South Korea in 2027
- "Site states ICBIP 2025 papers were published in IEEE Conference Proceedings (ISBN: 979-8-3503-5722-6)"
- Papers go either to the conference proceedings (submitted to EI Compendex and Scopus) or to the journal JOIG
- Blind review by two reviewers; abstract-only presentation option without publication
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
