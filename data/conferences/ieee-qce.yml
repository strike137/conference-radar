notes:
- Branded IEEE Quantum Week; the largest IEEE venue on quantum computing, networking and engineering
- Financial co-sponsors are IEEE QTC, IEEE Computer Society, IEEE TCSE, IEEE ComSoc, IEEE Photonics Society and IEEE Council on Superconductivity
- "Proceedings: IEEE Xplore and IEEE Computer Society Digital Library"
- Nine technical paper tracks (algorithms, applications, software, networks and communications, machine learning, photonics, ...)
- Full papers 8 to 10 pages plus references; short papers 4 to 6 pages; optional early abstract one week before the paper deadline
- Also has workshops with their own paper deadline, tutorials, panels and posters
- QCE25 had over 560 technical paper submissions; QCE26 program lists 372 technical papers
- Held in North America every year (Broomfield 2022, Bellevue 2023, Montreal 2024, Albuquerque 2025, Toronto 2026)
- Best papers recommended to IEEE TQE and ACM TQC
- In-person presentation by at least one author is required
- ICORE2026 label is National/Regional; not on the CCF list
