id: mopcon
name: MOPCON
full_name: Mobile / Open / Platform Conference
type: industry
tier: minor
areas: [software, ai]
region: taiwan
frequency: annual
organizer: MOPCON community (legal host Taiwan Industry-Academia Promotion Association, KSDA)
organizer_country: [taiwan]
proceedings: None (non-archival)
archival: false
fee: NT$899 general, NT$299 student, limited to 100 (2025)
typical:
  conference_months: [10, 11]
links:
  website: https://mopcon.org/
notes:
- Community-run mobile and applied technology practitioner conference in Kaohsiung, held every year since 2012 and
  billed as the largest tech conference south of the Zhuoshui River
- Talks only (keynotes, sessions, lightning talks); no papers or proceedings
- Topics have shifted from mobile apps to AI, edge AI hardware and cloud; 2026 theme is From AI to Reality
- 2026 edition is a one-day event co-held with JSDC as MOPCONxJSDC, with three parallel tracks
- Held at NKUST Nanzih Campus in 2025 and 2026, Kaohsiung Exhibition Center in 2024; over 1,000 attendees
