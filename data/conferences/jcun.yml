notes:
- Cybersecurity and ethical hacking event run by students and staff of the Universidad Nacional de Colombia (UNAL) in Bogota
- Bills itself as the largest academic cybersecurity event in Colombia, bringing together industry, academia, government and civil society
- Five days with talks, hands-on workshops, a CTF, wardriving by bus through Bogota, a live vishing contest, a poster session and lockpicking and IoT villages
- Program is in Spanish; 7th edition in 2026
- Registration through Eventbrite; no published proceedings
