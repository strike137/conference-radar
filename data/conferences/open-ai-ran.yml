notes:
- Workshop on Open RAN and AI-RAN (RAN disaggregation, RIC/xApps, open-source RAN, AI/ML and LLMs for the RAN,
  5G to 6G), held in conjunction with ACM MobiCom since 2024 (Washington D.C. 2024, Hong Kong 2025, Austin 2026)
- Papers up to 6 pages plus 1 page of references in ACM format; double-blind review; 3-page posters and demos
- Proceedings in the ACM Digital Library (Proceedings of the 3rd ACM Workshop on Open and AI RAN, 2026); ACM open
  access APC applies to authors from institutions outside ACM Open
- Full-day workshop with keynotes and an industry panel; deadlines are usually extended
- Not listed in the CORE portal (ICORE2026)
