notes:
- Main Brazilian database and data science symposium (41st edition in 2026), run annually by SBC CEBD
- Papers in Portuguese or English, published in SBC OpenLib (Anais do SBBD, ISSN 2763-8979) with DOIs
- Full papers up to 12 pages plus 2 pages of references, short papers 6 plus 1; double-blind review with rebuttal for
  borderline full papers
- Held in Brazil every year (online 2020 and 2021); many satellite workshops, demos, thesis contests and an SQL
  marathon
- Related journal JIDM (Journal of Information and Data Management) invites its articles to be presented at SBBD
