notes:
- Biennial conference with over 35 years of history, run from NTU Singapore; covers control, automation, robotics and computer vision
- Technically co-sponsored by the IEEE Control Systems Society; 2026 edition co-organized with VinUniversity (Vietnam)
- Full papers up to 8 pages (6 free), IEEE two-column format, submitted via PaperCept
- Extended abstracts (2 to 4 pages) appear in the conference proceedings but not in IEEE Xplore or EI
- Past proceedings indexed by ISI Proceedings, EI Compendex and IEEE Xplore
- CORE C (ICORE2026); not in the CCF list
- The old domain icarcv.org still shows the 2016 edition; the 2026 site is icarcv.pages.dev (linked from PaperCept)
