id: kiit
name: KIIT Conference
full_name: Korean Information Technology Society Summer and Fall Conferences
name_local: 한국정보기술학회 하계·추계종합학술대회
type: conference
tier: domestic
areas: [general, ai]
region: korea
language: korean
frequency: multiple-per-year
organizer: KIIT (Korean Institute of Information Technology, 한국정보기술학회)
organizer_country: [korea]
proceedings: KIIT conference proceedings (논문집, single PDF posted on the conference site; domestic)
archival: false
fee: 150,000 KRW offline presenter (general or graduate), 130,000 KRW undergraduate contest (Fall 2026)
typical:
  deadline_months: [5, 10]
  conference_months: [6, 11]
links:
  website: https://ki-it.or.kr/
notes:
  - Domestic conferences of KIIT, twice a year (summer in June, fall in November), each with an undergraduate paper contest
  - Covers all ICT fields plus capstone design projects
  - Both 2026 conferences held at Maison Glad Jeju
  - Oral, poster and online (video plus Zoom Q&A) presentations; standard or summary paper format
  - Outstanding papers are awarded and recommended to the KIIT journal (JKIIT) with the review fee waived
  - Proceedings posted as one combined PDF after the conference
  - KIIT also runs international conferences (SMART, ADINTECH)
  - Not listed in CORE ICORE2026
