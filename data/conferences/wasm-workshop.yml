notes:
- Workshop on WebAssembly research, its formal semantics and specification, tooling and industrial use
- Held at POPL 2024 (London), POPL 2025 (Denver), ICFP/SPLASH 2025 (Singapore) and POPL 2027 (Mexico City)
- No formal proceedings; submissions are abstracts of up to 500 words or PDFs of up to 2 pages, prior work welcome
- Lightweight review with a single feedback comment; in-person talks favoured, limited remote speakers
- Invited keynotes from WebAssembly designers and industry
- Not to be confused with WAW (Workshop on Algorithms and Models for the Web Graph), which is CORE C
- This WAW is not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
