notes:
- Free community conference organized by the Python Chile community; 2026 is the sixth edition
- Mainly in Spanish
- One in-person day of talks and workshops followed by one online day
- Talks and workshops are selected from a call for speakers on Sessionize; online talks are 25 minutes plus 5 minutes of questions
- Viña del Mar (DuocUC) in 2025, Santiago (Universidad Mayor) in 2026
- No papers or proceedings
