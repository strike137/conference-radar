notes:
- Workshop on answer set programming and its relation to SAT, SMT, CP, QBF, first-order logic and other paradigms, plus ASP applications and tools
- Held every year since 2008 as a workshop of ICLP; 2026 was the 19th edition
- Follows ICLP (Porto 2021, Haifa 2022 at FLoC, London 2023, Dallas 2024, Rende 2025, Lisbon 2026 at FLoC)
- Regular papers of 9 to 13 pages and short papers of 4 to 5 pages in 1-column CEURART style; short papers may be non-original
- Papers appear in the joint CEUR-WS proceedings of the ICLP workshops (Vol-4117 for 2025, Vol-4311 for 2026)
- Selected regular papers are invited to an extended version in Theory and Practice of Logic Programming (TPLP)
- Not listed in ICORE2026 or the CCF list
