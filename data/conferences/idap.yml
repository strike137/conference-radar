notes:
- Turkish AI and data processing symposium run from Inonu University since 2016; 10th edition in 2026
- 2026 edition held at Marmara University, Istanbul, in hybrid format
- Proceedings of the 2024 and 2025 editions are in IEEE Xplore; the 2021 papers appeared in a DergiPark journal issue
- Double review by two independent reviewers; target acceptance rate about 70%
- Papers in Turkish or English, at least 4 pages excluding references, no maximum; abstract-only submissions not accepted
- "Fee 2026: 175 USD regular, 140 USD student or IEEE member"
- Not listed in the CORE ICORE2026 portal
