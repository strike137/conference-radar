notes:
- Turkish AI and data processing symposium run by Inonu University (Malatya) since 2016; 10th edition in 2026
- 2026 edition co-organized with Marmara University and Caraga State University (Philippines), hybrid at Marmara University, Istanbul
- Proceedings in IEEE Xplore for 2017 to 2019 and 2024 to 2026; the 2021 to 2023 editions used a journal issue or PDF proceedings
- Papers in English or Turkish (Turkish papers need an English title, abstract and keywords), at least 4 pages, no upper limit
- Double-blind review by two reviewers; target acceptance rate about 70%
- "Fee: 175 USD regular, 140 USD student or IEEE member (2026)"
- Not listed in the CORE ICORE2026 portal
