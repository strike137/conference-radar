notes:
- Participation workshop with a live interactive lifelog retrieval competition; teams present papers in the morning and compete on about 24 search topics in the afternoon
- Held with ACM ICMR since 2018 (Yokohama 2018, Ottawa 2019, virtual 2020 and 2021, Newark 2022, Thessaloniki 2023, Phuket 2024, Chicago 2025, Amsterdam 2026)
- Accepted papers published in the ACM Digital Library in the LSC workshop series
- Papers up to 6 ACM pages plus one page of references; single-blind review via OpenReview
- Since 2026 three tracks, General Lifelog Research, Search System (participation) and Open Source
- Camera-ready is due after the workshop; a journal special issue invites extended versions
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
