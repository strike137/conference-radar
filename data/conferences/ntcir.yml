language: english
frequency: irregular
organizer: NII (National Institute of Informatics)
organizer_country: [japan]
proceedings: NTCIR online proceedings (NII, ISBN, papers with DOIs); EVIA satellite workshop papers in the same online
  proceedings
archival: false
