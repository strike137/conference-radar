links:
  website: https://research.nii.ac.jp/ntcir/
notes:
- Evaluation campaign run by NII (National Institute of Informatics), Japan; the conference was first held in 1999
- Runs on an 18-month cycle (task registration, dry run, formal run, then the conference); held in June or December
  at NII in Tokyo
- Most papers are task participant papers describing systems for the shared tasks (NTCIR-19 has 14 tasks such as
  AEOLLM-2, Lifelog-7, MedNLP-CALL and ToT)
- EVIA (International Workshop on Evaluating Information Access) is a one-day satellite workshop with double-blind
  review, 2 to 10 pages in ACM format
- Task participant papers are not peer-reviewed (stated on the NTCIR-19 paper instructions), so the venue is
  marked non-archival even though NII publishes the proceedings online with an ISBN and per-paper DOIs
- NTCIR-14 (2019) also had Springer LNCS post-proceedings of revised selected papers
- Not listed in ICORE2026
- About 196 attendees from 14 countries at NTCIR-18; remote presentation can be arranged
