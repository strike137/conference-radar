notes:
- Organized by KES International; 21st edition in 2027
- Held as part of the KES Smart Digital Futures multi-conference (with HCIS, IDT and InMed in 2027)
- Full papers published by Springer in the Smart Innovation Systems and Technologies series; short papers and
  abstracts are published online only, not in the Springer volume
- Many papers come through invited sessions, whose chairs set their own deadlines
- Held in Europe every June (Rhodes 2022, Rome 2023, Madeira 2024, Solin 2025, Barcelona 2026, Iasi 2027)
- ICORE2026 rank C
