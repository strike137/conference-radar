notes:
- Workshop on AI-native and resilient wireless emergency and disaster response communications for 6G
- Co-located with IEEE GLOBECOM; held at GLOBECOM 2024 (Cape Town) and GLOBECOM 2026 (Macau, 5th edition)
- Chaired by Jingqing Wang (Xidian University) with co-chairs from Northwestern Polytechnical University and Xi'an
  Jiaotong University; 2026 co-chairs also include Antonio Capone and Maged Elkashlan
- Accepted and presented papers go into the IEEE GLOBECOM workshop proceedings and IEEE Xplore; no-show papers are
  removed
- Submissions via EDAS through the GLOBECOM workshop call; 6 page IEEE format
- The acronym NGIWEC is not used on the official pages
- Not listed in ICORE2026
