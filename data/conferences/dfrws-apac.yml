links:
  website: https://dfrws.org/conferences/dfrws-apac-2026/
notes:
- Asia-Pacific edition of DFRWS, a well-known research community for digital forensics (sister events in the USA
  and Europe); first held 2021 (2026 is the sixth)
- 'Full research papers get double-blind review; accepted papers can appear in a special issue of Forensic Science
  International: Digital Investigation (Elsevier)'
- 'Two-step submission from 2026: abstract registration, then full paper one week later (AoE)'
- Also accepts practitioner talks, demos, posters and hands-on workshops with rolling notification
- Rotates within APAC (Seoul 2025, Singapore 2026); hybrid with satellite sites, presenters on-site
