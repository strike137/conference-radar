notes:
- Flagship conference of the Brazilian Robotics Society (SBRobotica), a scientific society founded in 2024; first
  edition in 2025
- Covers all areas of robotics, with workshops in robotics, AI and computer vision, plus industry and government panels
- Papers in English, up to 6 pages in IEEE conference format, double-blind review via Microsoft CMT
- Accepted and presented papers are submitted to IEEE Xplore; extended versions of outstanding papers are invited to
  the Journal of Intelligent and Robotic Systems (South America Topical Collection)
- Held in a different Brazilian city each year (Belo Horizonte 2025, João Pessoa 2026, São Paulo 2027)
- Separate from the older SBC robotics symposium SBR/LARS
- Not ranked in CORE ICORE2026
