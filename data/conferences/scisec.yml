notes:
- Started in 2018 in Beijing; topics include cybersecurity metrics, modeling, data analytics and AI for security
- Proceedings in Springer LNCS
- Mostly held in China, with editions abroad (Matsue 2022, Melbourne 2023, Copenhagen 2024, Gjovik 2027); no 2020
  edition
- Single submission deadline in spring, extended in 2025 and 2026; anonymous submissions, full papers up to 18 pages
  and short papers up to 12 pages
- Not ranked by CORE or CCF
