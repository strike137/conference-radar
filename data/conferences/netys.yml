notes:
- Annual conference on networked and distributed systems held in Morocco since 2013 (14th edition in 2026)
- Always held in Morocco (Marrakech 2020, 2021 (virtual) and 2023, Rabat 2024 and 2025, Agadir 2026)
- General co-chairs from France, Morocco and Switzerland (EPFL); organizing committee from Moroccan universities
- Proceedings in Springer LNCS; posters are presented but not published
- Full papers up to 15 pages and short papers up to 5 pages in LNCS format (excluding references)
- Best paper and best student paper awards; co-located with a METIS spring school and the VDS workshop in 2026
- Not listed in CORE ICORE2026 or in the CCF list
