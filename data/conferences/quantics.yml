language: english
frequency: annual
organizer: INSTICC (Institute for Systems and Technologies of Information, Control and Communication)
organizer_country: [europe]
proceedings: Springer CCIS
archival: true
typical:
  deadline_months: [2, 3]
  conference_months: [7]
links:
  website: https://quantics.scitevents.org/
notes:
- New INSTICC conference on quantum computing, quantum information, quantum communications and simulation; first
  edition in 2026, second in 2027
- Proceedings published by Springer in a CCIS series book (unlike most INSTICC events, which use SCITEPRESS)
- Two submission stages (regular papers in stage 1, regular or position papers in stage 2); earlier stage gives
  earlier notification
- Co-located with ICSOFT, DATA, SECRYPT, SIMULTECH and other INSTICC events; one registration covers them as a
  non-speaker; remote presentation allowed when travel is not possible
- Not listed in ICORE2026
