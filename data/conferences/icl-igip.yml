id: icl-igip
name: ICL
full_name: International Conference on Interactive Collaborative Learning (and IGIP International Conference on Engineering Pedagogy)
type: conference
tier: minor
areas: [general]
region: europe
language: english
frequency: annual
organizer: IAOE (International Association of Online Engineering) and IGIP (International Society for Engineering Pedagogy)
organizer_country: [europe]
proceedings: Springer LNNS
archival: true
indexing: [Scopus, INSPEC]
typical:
  deadline_months: [4, 5]
  conference_months: [9, 10]
links:
  website: https://www.icl-conference.org/
notes:
- Engineering education conference held jointly with the IGIP International Conference on Engineering Pedagogy; 29th ICL and 55th IGIP in 2026
- Topics include AI in education, remote and virtual labs, XR learning and engineering pedagogy
- Proceedings in Springer Lecture Notes in Networks and Systems (LNNS), indexed by Scopus and INSPEC
- Only accepted and presented papers are published; papers can be presented in person or online via Zoom
- Two-phase submission (structured abstract, then anonymous full paper); double-blind review by at least two reviewers
- Held in Europe every year (Dresden 2021, Vienna 2022, Madrid 2023, Tallinn 2024, Budapest 2025, Cologne 2026)
- Not listed in ICORE2026; not on the CCF list
