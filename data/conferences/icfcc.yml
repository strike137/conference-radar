notes:
- Run by the commercial organizer SCIEI (submission via zmeeting); held since 2009, 2027 is the 19th edition
- Held as a workshop of the SCIEI World Conference WCSE since 2024
- Online 2021 and 2022; Singapore 2023, Phuket 2024, Jeju 2025, Seoul planned for 2027
- Papers published in the SCIEI WCSE proceedings volume (with ISBN), stated as indexed by EI Compendex and Scopus
- Alternatively papers can go to the International Journal of Future Computer and Communication (IJFCC)
- Abstract-only presentation and listener registration are also offered
- Not listed in ICORE2026 or the CCF 2026 list
