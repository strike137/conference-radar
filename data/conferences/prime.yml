archival: true
typical:
  deadline_months: [4]
  conference_months: [9]
links:
  website: https://prime-conference.org/
notes:
- Conference for PhD students and post-docs with less than one year post-PhD experience to present their research in microelectronics and electronics
- Topics include analog, digital, mixed-signal and RF IC design, semiconductors, sensors and MEMS, biomedical electronics, VLSI and SoC, EDA
- Technically co-sponsored by IEEE and IEEE CAS; accepted papers are submitted to IEEE Xplore
- Held in Europe (Taormina 2025, TU Berlin 2026); includes a company fair for networking with industry
- Best paper certificates for the top 10%, 20% and 30% of papers (gold, silver, bronze leaf)
- Not listed in ICORE2026 or the CCF list
