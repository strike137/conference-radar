notes:
- Fully sponsored by the IEEE Robotics and Automation Society; the main venue for soft robotics
- Contributed papers are published in the proceedings and on IEEE Xplore; extended abstracts are presented but not published
- Double-anonymous review on OpenReview, no rebuttal, reviews made public after decisions; 6 pages plus up to 2 paid pages
- Papers already published in RAS journals (RA-L, T-RO and others) can be transferred for presentation
- At least one author must present on site or the paper is dropped from the proceedings
- Recent editions in Lausanne (2025) and Kanazawa (2026)
- Not listed in the CORE ICORE2026 portal
