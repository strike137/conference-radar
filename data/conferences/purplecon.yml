notes:
- Small one-day, single-track security conference aimed at developers, students and newcomers, with short talks
- Started as a side event of Kawaiicon in Wellington, New Zealand; now run independently
- 'Irregular schedule: two editions in Wellington (the second in 2019), then a five-year break before the 2024
  edition at the State Library of New South Wales, Sydney'
- Half of the tickets are reserved for people from marginalised groups in tech
- No papers; talk slides and handouts are posted on the site and talks were livestreamed and recorded
