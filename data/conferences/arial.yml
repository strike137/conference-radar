notes:
- Workshop on AI for older adults, rehabilitation and assisted living (monitoring, fall detection, clinical decision support)
- Mostly co-located with IJCAI (2018, 2019, 2021, 2024, 2025, 2026); with ICDM in 2017 and 2022 and ECML PKDD in 2023
- 2026 edition was the 9th, held with IJCAI-ECAI 2026 in Bremen on 17 August 2026
- Accepted papers published in a Springer CCIS volume (CCIS 2620 for 2025, CCIS 3127 for 2026)
- Long papers 12 to 15 pages, short papers at least 6 pages, LNCS/CCIS format, double-blind review via EasyChair
- At least one author must attend in person at the IJCAI venue
- 2026 edition ran a MAISON-LLF data challenge alongside the paper track
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
