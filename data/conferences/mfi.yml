notes:
- Long-running IEEE conference on multisensor fusion for robotics and intelligent systems, held since 1994
- Topics include Bayesian inference and nonlinear estimation, tracking and localization, SLAM, perception, AI in
  robotics, sensor networks and autonomous vehicles
- Full papers of 4 to 6 pages in the IEEE RAS template (up to 2 extra pages at 50 EUR each), single-blind review via
  Microsoft CMT
- Accepted and presented papers are submitted to IEEE Xplore; one author must register and present
- MFI 2026 was hosted by the University of West Bohemia in Pilsen, Czechia; 54 of 78 submissions accepted
- Recent hosts are Karlsruhe (2020, 2021), Bedford UK (2022), Bonn (2023, joint with IEEE SDF), Pilsen (2024),
  College Station, Texas (2025) and Pilsen (2026); earlier editions rotated between Germany, Asia and the USA
- Small venue, close to the ISIF information fusion community (FUSION)
- Not listed in the CORE ICORE2026 portal; not on the CCF 2026 list
