organizer: Telkom University (School of Industrial Engineering), Bandung
organizer_country: [indonesia]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [2, 4]
  conference_months: [6]
links:
  website: https://icadeis.org/
notes:
- Run by Telkom University (School of Industrial Engineering) in Bandung, Indonesia; first held in 2019
- Held in Indonesia every time (Yogyakarta 2019, Lombok 2020, Bali 2021 and 2023, Bandung 2022, 2025 and 2026); no
  2024 edition (2023 in August, then 2025 in February)
- Proceedings in IEEE Xplore since 2020 (2019 papers only in EasyChair archives); no-show papers are not sent to IEEE
  Xplore
- Two submission rounds via EDAS; double-blind review; papers at least 4 pages, extra fee per page above 6, at most
  10 pages
- Hybrid conference; topics are data science, e-learning and information systems (AI, LLMs, big data, enterprise
  systems)
- "Registration fee per paper (2026): 265 to 300 USD for international authors, IDR 2,850,000 to 3,500,000 for local
  authors"
- The site lists past editions under the spelling ICADIES
