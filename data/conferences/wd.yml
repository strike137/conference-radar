notes:
- Organized by DNAC (Paris, France; also behind NTMS); technically co-sponsored by IEEE and IEEE ComSoc; IFIP co-sponsored earlier
  editions (2018)
- Single-track program on ad hoc and sensor networks, vehicles, IoT, 5G/6G and Wi-Fi, wireless modelling and AI for
  wireless networks
- Full papers 8 pages, short papers and poster/demo papers 4 pages (IEEE two-column, via EDAS); accepted and presented
  papers are submitted to IEEE Xplore
- Not held every year; 13th edition in 2025 after 2019 (Manchester) and 2021 (Paris, virtual)
- Past hosts include Dubai, Paris, Venice, Rio de Janeiro, Toulouse, Porto and Manchester; acceptance ratio around
  32 to 35% in 2016 to 2018 (per the 2018 and 2019 sites)
- Not listed in the CORE ICORE2026 rankings
