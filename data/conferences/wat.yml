id: wat
name: WAT
full_name: Workshop on Asian Translation
type: workshop
tier: minor
areas: [nlp, ai]
region: asia-pacific
language: english
frequency: annual
organizer: WAT organizing committee led by Japanese researchers (University of Tokyo, Kyoto University, NICT, NAIST
  and others); co-located with a major NLP or MT conference
organizer_country: [japan]
proceedings: ACL Anthology
archival: true
rank:
  core: Unranked
typical:
  deadline_months: [8, 9]
  conference_months: [11, 12]
links:
  website: https://lotus.kuee.kyoto-u.ac.jp/WAT/
notes:
- Open machine translation evaluation campaign for Asian languages, run annually since 2014; 13th edition in 2026
- Co-located with a different host conference each year (COLING 2022, MT Summit 2023, EMNLP 2024, IJCNLP-AACL 2025,
  AACL-IJCNLP 2026)
- Held in Asia in most years (Gyeongju 2022, Macau 2023, Mumbai 2025, Hengqin 2026); 2024 was in Miami with EMNLP
- Proceedings in the ACL Anthology (published by ICCL in 2022, AAMT in 2023, ACL in 2024 and 2025)
- Research papers get double-blind review via OpenReview; ARR commitment is also accepted; no long/short distinction
- Shared task system description papers are single-blind and not reviewed, only given feedback; teams in the human
  evaluation must submit one and attend
- Shared tasks in recent years include English-Japanese patent claims translation and English-Indic multimodal
  translation
