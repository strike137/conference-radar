notes:
- Organized by KICS (Korean Institute of Communications and Information Sciences)
- Held every February at Mona Yongpyong (Yongpyong Resort), Pyeongchang (2025, 2026)
- 1-2 page papers submitted as PDF; English session for foreign students; submission window opens in early December
- 'Haedong Best Paper track: 4-page review version (ICT Express or JKICS format) with an earlier deadline; winners
  must submit to a KICS-related journal within 6 months'
- Undergraduate paper track and idea contest; free on-site registration (non-authors) for active military personnel
  and some other groups
