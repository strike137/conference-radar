notes:
- Half-day workshop on multimodal content analysis and moderation (memes, text-embedded images, misinformation, harmful content)
- Organized by Usman Naseem (Macquarie University), Surendrabikram Thapa (Virginia Tech) and Mehwish Nasim (UWA), with Roy Ka-Wei Lee (SUTD) in 2026 and Zeyu Fu (University of Exeter) in 2027
- Double-blind review (2026)
- Editions at WWW 2024 (Singapore), ICDM 2024, WWW 2025 (Sydney) and WWW 2026 (virtual); 5th edition accepted at WWW 2027 in Dublin
- 2026 papers published by ACM in The Web Conference Companion Proceedings (ACM Digital Library); each paper needs its own registration
- Long papers 8 pages, short papers 4 pages, plus unlimited references and appendix, ACM format, submission via OpenReview
- Fast track for papers rejected or withdrawn from the WWW main track, decided by meta-reviewers using the main track reviews
- Not listed in the CORE ICORE2026 portal
