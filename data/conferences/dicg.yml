notes:
- Workshop on decentralized and peer-to-peer infrastructure for the common good (trust and reputation, self-sovereign identity, decentralized markets and governance, decentralized ML)
- Co-located with ACM/IFIP Middleware 2020 to 2023 (2020 and 2021 online, Quebec 2022, Bologna 2023), with IEEE ICDCS 2025 in Glasgow, and back with Middleware in 2026 (Tarragona)
- 2025 papers (up to 7 pages, IEEE format) appeared in the ICDCS 2025 companion proceedings in the IEEE digital library
- 2026 papers up to 6 pages in ACM SIGPLAN format, single-blind review via HotCRP; published in the Middleware 2026 companion proceedings in the ACM DL
- One author must register and present the paper
- Not listed in the ICORE2026 portal or the CCF 2026 list
