notes:
- One of the theme conferences of the IEEE World Congress on SERVICES (with ICWS, EDGE, ICDH, QSW and SSE), sponsored
  by IEEE and the IEEE Computer Society and supported by the IEEE Technical Community on Services Computing
- Proceedings published by the IEEE Computer Society Press
- 'Rotates worldwide with the congress: Shenzhen (2024), Helsinki (2025), Sydney (2026)'
- Double-blind review by at least three PC members; regular papers 7 to 10 pages, short papers 4 to 6 pages, references extra
- Shares one submission deadline with the other SERVICES conferences; the 2026 deadline was extended by two weeks
