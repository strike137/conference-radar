notes:
- Annual national radio science conference of Egypt, run by the National Radio Science Committee created by ASRT (the Egyptian URSI committee)
- Papers must fall within one of the URSI Commissions A to K (metrology, fields and waves, radio communication and signal processing, electronics and photonics, propagation, radio astronomy, EM in biology and medicine)
- Accepted and presented papers are published in IEEE Xplore; papers limited to 8 pages
- Host institution changes each year; 2025 at AASTMT Heliopolis, Cairo and 2026 in New Damietta
- "Registration per paper (2025): 4000 EGP from Egypt, 400 EUR from outside Egypt"
- Includes a free undergraduate and postgraduate poster session and a Women in Radio Science (WIRS) session
- Different from the USNC-URSI National Radio Science Meeting (nrsm) in Boulder
- Not listed in ICORE2026
