notes:
- Workshop on resilience of 5G, 6G and beyond networks (ML-driven resilience, predictive network management, self-healing architectures, security)
- 1st edition held with IEEE INFOCOM 2025 in London (May 19, 2025); 2nd edition held with IEEE/IFIP NOMS 2026 in Rome
- The 2026 site titles it Workshop on Resilience in Next Generation Network Management
- Accepted papers published in the host conference proceedings on IEEE Xplore
- Papers up to six pages including references, IEEE two-column format; EDAS (2025) or JEMS (2026) submission
- Not listed in ICORE2026; not on the CCF 2026 list
