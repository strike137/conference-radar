notes:
- Japan's national robotics conference, run every September by the Robotics Society of Japan at a host university
- Anyone who registers can present (RSJ membership not required); papers are 1 to 4 pages in Japanese or English
- Proceedings are opened online on the first day to registered participants only (ID and password)
- International Sessions in English (short papers of 1 to 4 pages) alongside the Japanese general and organized sessions
- Papers can be submitted at the same time as a reviewed RSJ letter (up to 4 pages) to the society journal
- Large; RSJ2026 had 811 presentations and 1,913 participants
