notes:
- Domestic summer conference of KIBME, the Korean society for broadcast and media engineering
- Held in Jeju every June (Maison Glad Jeju 2022 to 2024, Lotte Hotel Jeju 2025 and 2026)
- Broadcast and media topics, including video and audio coding, image processing, AR/VR, holography, AI based
  signal processing and broadcast transmission
- Papers of 2 to 4 pages in Korean or English, submitted through the KIBME site; non-members may submit
- Selected papers are recommended for priority review in the KIBME journal (방송공학회논문지) and a best student paper
  award is given
- Includes an undergraduate paper contest and special sessions
- KIBME also holds a Fall conference (November, Seoul) and, since 2025, a Winter conference
- Not listed in ICORE2026 or the CCF list
