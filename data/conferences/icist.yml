id: icist
name: ICIST
full_name: International Conference on Information Science and Technology
type: conference
tier: minor
areas: [ai, general]
region: worldwide
language: english
frequency: annual
organizer: City University of Hong Kong with local host universities (2026 organizers University of Coimbra and City University of Hong Kong); IEEE SMC technical co-sponsor
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
fee: 500 USD or 3,500 CNY full registration per paper (2026)
typical:
  deadline_months: [5]
  conference_months: [10, 12]
links:
  website: https://conference.cs.cityu.edu.hk/icist/
notes:
- Annual series since 2011; website hosted by City University of Hong Kong, which also provides a general chair; sister conference of ICACI, ICICIP and ISNN
- IEEE Systems, Man and Cybernetics Society is technical co-sponsor; accepted papers are submitted to IEEE Xplore and selected papers go to journal special issues
- Broad scope covering intelligent control and automation plus intelligent information processing (machine learning, signal processing, vision, communications)
- Mostly held in mainland China with the host city changing each year; 2023 in Cairo, Egypt and 2026 in Coimbra, Portugal
- Full papers with a nominal length of 10 pages in IEEE double-column format, two extra pages with overlength charge; 2026 submissions went through OpenReview
- Abstract-only submissions for presentation are also accepted
- Not listed in ICORE2026 or the CCF 2026 list
