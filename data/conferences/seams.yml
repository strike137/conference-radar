notes:
- Main venue for self-adaptive and autonomic software systems; co-located with ICSE every year
- Papers published in the IEEE and ACM digital libraries; CORE A (listed as a symposium in ICORE2026)
- "Lightweight double-anonymous review with a revision round: accept, revise or reject, then a final decision in January"
- "Full papers 10 pages plus 2 of references; short and industry papers shorter"
- Also has artifact, journal-first and community debate tracks
- 2026 edition was the 21st (Rio de Janeiro, Apr 13 to 14); 2027 is the 22nd (Dublin, Apr 26 to 27)
