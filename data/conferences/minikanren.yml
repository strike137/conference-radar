notes:
- Workshop on relational programming and the miniKanren family of languages (miniKanren, microKanren, core.logic, OCanren, ...), co-located with ICFP
- Scope includes pure logic programming, constraint programming, program synthesis and running programs backwards
- Proceedings are published on arXiv; publication is not meant to replace a conference or journal paper
- Short papers about 2 to 7 pages and long papers 8 to 25 pages (acmart acmsmall); lightweight double-blind review
- 2026 special theme was Relating Relational Languages (proof assistants, solver-aided tools, datalog, equality saturation)
- Authors of accepted papers can apply for SIGPLAN PAC travel grants
- Follows ICFP (Singapore 2025 with ICFP/SPLASH, Indianapolis 2026, the day before ICFP)
- Not listed in the CORE portal (ICORE2026)
