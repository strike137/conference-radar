links:
  website: https://cwn2026.uvigo.es/
notes:
- One-day workshop co-located with the IEEE WiMob conference; 13th edition in 2026
- Run by researchers at Universidade de Vigo (Spain) since its start; site hosted at uvigo.es
- Topics are cooperative wireless networking (relaying, D2D, RIS, UAV, vehicular, cell-free, side-link, AI-driven resource allocation)
- Accepted papers go into the WiMob proceedings and are submitted to IEEE Xplore; papers not presented may be excluded
- Papers up to 6 IEEE pages (2 extra pages can be bought), submitted via EDAS; one regular registration per paper
- Recent hosts are Thessaloniki (2022), Montreal (2023), Paris (2024), Marrakech (2025) and Avignon (2026)
- Not listed in ICORE2026
