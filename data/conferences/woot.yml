notes:
- Held annually since 2007 (founded as the Workshop on Offensive Technologies); 20th edition in 2026
- Co-located with USENIX Security in August (2024 to 2026); earlier editions were workshops co-located with IEEE
  S&P (for example May 2023)
- From 2026 two submission cycles (December and March); an 'up-and-coming' track gives shepherding to new or non-academic
  researchers
- Double-blind review; full papers up to 13 pages; artifacts expected
- Regarded as the main academic venue for offensive security research, though unranked in CORE and CCF
