notes:
- Run by Astana IT University and held every May in Astana, Kazakhstan since 2021
- Proceedings in IEEE Xplore (2026 edition posted); online or in-person presentation in English is required for inclusion
- Tracks follow IEEE societies (computer science, engineering management, communications, computational intelligence, robotics, signal processing)
- Full papers only, 4 to 6 pages in IEEE format, submitted via Microsoft CMT; at most 3 papers per author
- Lower fees for developing countries, students and AITU alumni
- Future dates published through 2028 (May 17 to 19, 2028)
- Not listed in ICORE2026 or the CCF 2026 list; a regional venue
