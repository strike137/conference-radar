notes:
- Community conference for the Python programming language in Malaysia, first held as a mini PyCon in 2014 and as a full PyCon MY in 2015
- Run by PyCon MY PLT, a limited liability partnership set up in 2015 that also organizes PyCon APAC when it is hosted in Malaysia
- Two days of keynotes, talks and workshops; held at Sunway University near Kuala Lumpur in 2025
- No proceedings; practitioner talks only
