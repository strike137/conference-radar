  conference_months: [7]
links:
  website: http://www.icocn.org.cn/
notes:
- Annual since 2002 (no edition in 2020); 24th edition in 2026
- Held in a different Chinese city each year (2022 Shenzhen, 2023 Qufu, 2024 Harbin, 2025 Zhangjiajie, 2026 Xining; 2021 online); early editions also in Bangkok, Singapore, Taxila and Pattaya
- Accepted papers go to IEEE Xplore and EI Compendex; full papers are 3 pages
- Presenters may submit an abstract only; a full paper is needed for publication and for the awards
- Nine parallel tracks covering fiber optics, optical networks, fiber sensors and lasers, microwave photonics, space communication and quantum photonics
- Post-deadline paper (PDP) session with a late deadline
- Not listed in ICORE2026; optics venue outside the usual CS rankings
