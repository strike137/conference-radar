region: china
language: english
frequency: annual
organizer: Chinese host universities (2026 Qinghai University, China Jiliang University, SUSTech, Guangdong University
  of Technology and others); technically supported by IEEE, IEEE Photonics Society and the Chinese Optical Society
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [IEEE Xplore, EI]
fee: RMB 3,400 / USD 490 regular, RMB 2,500 / USD 360 student (2026, by June 15); RMB 1,000 / USD 150 per extra paper
typical:
