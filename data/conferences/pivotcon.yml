links:
  website: https://pivotcon.org/
notes:
- Non-profit threat research conference created by threat intelligence practitioners, with no corporate backing
- Invite-only with at most 160 vetted attendees; anyone can request an invitation through the official form
- Held every May in Malaga, Spain (2024, 2025, 2026 and the announced 2027 edition)
- Single track of 25 minute talks plus 5 minutes Q&A, with panels, debates and afternoon research workshops on the first day
- CfP via pretalx asks for original, unpublished research on threat intelligence, threat hunting, malware intelligence and vulnerability research linked to threat actors
- Talks are not streamed or recorded and there are no proceedings
- First speaker gets hotel, conference fee and travel up to 1500 USD (outside Europe) or 500 EUR (inside Europe)
