notes:
- Non-profit community conference for the Python community in Korea, run by a volunteer organizing committee of more than 20 people
- 2026 was the 12th edition, co-hosted with Dongguk University in Seoul
- Talks of 20 or 40 minutes chosen from a call for session speakers
- Two conference days followed by a day of tutorials, sprints and deep dive sessions
- No proceedings; practitioner talks only
