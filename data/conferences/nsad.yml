notes:
- Workshop on abstract domains for abstract interpretation, static analysis and verification (numerical, symbolic and shape domains)
- Usually held with SAS (Static Analysis Symposium); recent editions at SPLASH 2020 (online), SPLASH 2024 (Pasadena) and SPLASH/ISSTA 2026 (Oakland)
- Not held every year (2020, 2024 and 2026 on the researchr series page); 2026 was the 11th edition
- Full papers (6-8 pages, double-blind) go into the ACM Digital Library; short papers (2-4 pages, single-blind) appear only on the workshop website
- Two-phase submission in 2026 (June and July deadlines) for the same program
- Not listed in the CORE portal (ICORE2026)
