type: workshop
tier: minor
areas: [software]
region: worldwide
language: english
frequency: irregular
organizer: ACM SIGPLAN (with SIGAda); steering committee from Italy, France and China
organizer_country: [international]
proceedings: ACM DL
archival: true
typical:
  deadline_months: [6, 7]
  conference_months: [10]
links:
  website: https://conf.researchr.org/home/splash-issta-2026/nsad-2026
notes:
- Workshop on abstract domains for abstract interpretation, static analysis and verification; 2026 was the 11th edition
- Recent editions co-located with SPLASH (online 2020, Pasadena 2024, Oakland 2026 with SPLASH/ISSTA)
- Irregular schedule; no edition between 2020 and 2024
- Full papers 6 to 8 pages (double-blind) go to the ACM Digital Library; short papers 2 to 4 pages (single-blind) appear only on the website
- 2026 used two submission phases (June and July) for the same program
- Not listed in the CORE ICORE2026 portal
