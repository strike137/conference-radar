notes:
- Algorithms, combinatorial optimization and operations research venue running since 2005; broad topic list includes
  network optimization, security, social networks and data mining
- Proceedings in Springer LNCS; selected papers invited to Theoretical Computer Science and Journal of Combinatorial
  Optimization special issues
- Held mostly in China and the USA, often online; 2026 edition was online, based at UT Dallas, with no registration fee
- Double-blind review, LNCS format, up to 15 pages
- CORE C (ICORE2026); not on the CCF list
