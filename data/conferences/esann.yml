notes:
- Held in Bruges, Belgium every year since 1996 (Brussels 1993 to 1995); fully online in 2020 and 2021, hybrid since
  2022
- Single track with single-blind review; 6-page papers; around 150 in-person participants at most
- Focus on theory and methods; application papers only if of generic interest; out-of-scope papers are desk rejected
- Own proceedings (i6doc) freely available online and indexed in Scopus; CORE B, not in the CCF list
- Deadline in mid/late November for the April meeting (the meeting was held in October from 2020 to 2024)
