notes:
- New ACM SIGSAC conference; first edition in San Jose, CA in November 2026
- Covers post-quantum cryptography, quantum cryptography and communication (QKD, quantum networks), quantum-safe systems and migration policy
- Accepted papers appear in ACM conference proceedings
- Regular papers 12 pages, short papers 6 pages, posters 2 pages; double-blind, single round, no rebuttal
- Sponsored by NSF and Cisco in 2026
- Not listed in CORE ICORE2026
