id: datamod
name: DataMod
full_name: "International Symposium DataMod: From Data to Models and Back"
type: workshop
tier: minor
areas: [data, ai, software]
region: europe
language: english
frequency: annual
organizer: DataMod Steering Committee (largely University of Pisa), satellite event of SEFM
organizer_country: [europe]
proceedings: Springer LNCS (revised selected papers, post-proceedings)
archival: true
typical:
  deadline_months: [9]
  conference_months: [11]
links:
  website: https://datamod-symposium.github.io/
notes:
  - Satellite symposium of SEFM on combining computational modelling (automata, Petri nets, process calculi, agents) with data mining and machine learning
  - Held as MoKMaSD from 2012 to 2015, as DataMod since 2016; 2026 is the 14th edition
  - Revised papers appear after the symposium in Springer LNCS (DataMod 2025 -> LNCS 16421); informal pre-proceedings at the event
  - Regular papers up to 16 pages, short papers up to 8 pages, presentation reports up to 4 pages (not published unless later extended)
  - "Recent hosts: Eindhoven (2023), Aveiro (2024), Toledo (2025), Malta (2026); 2020 and 2021 online, no 2022 edition"
  - Not listed in CORE ICORE2026; not on the CCF list
