notes:
- Annual international cybersecurity conference in Riga, Latvia, run by CERT.LV (Latvian national CERT)
- Strategic and policy sessions under #CyberChess plus parallel tracks #CyberStory (industry experience), #CyberShock (deep technical talks and demos) and #BalticDomainDays (DNS security)
- Hosts a two-day CTF competition; in-person in Riga with live stream and video recordings online
- More than 800 in-person participants from over 28 countries in 2025
- The technical track grew out of the separate CyberShock conference (2020 to 2022 on cybershock.lv)
- No public call for papers found on the official site and no proceedings
