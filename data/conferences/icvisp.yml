notes:
- Smaller commercially run conference on computer vision, image processing, signal processing and multimodal AI; first held in 2017
- Proceedings publisher changes by year (IEEE CPS 2017 and 2021, ACM ICPS 2018 to 2020, IOP JPCS 2022, IET 2023, IEEE 2024 and 2025, SPIE 2026)
- 2025 edition technically sponsored by APSIPA and IEEE Xi'an Section
- Held in China since 2023 (Dali, Kunming, Xi'an, Haikou); online 2020 to 2022; Osaka 2017, Las Vegas 2018, Vancouver 2019
- Full papers reviewed on a rolling basis; no-show papers excluded from the proceedings
- Not listed in the CORE portal (ICORE2026)
