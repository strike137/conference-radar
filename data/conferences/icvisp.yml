id: icvisp
name: ICVISP
full_name: International Conference on Vision, Image and Signal Processing
type: conference
tier: minor
areas: [vision, communications, ai]
region: china
language: english
frequency: annual
organizer: Commercial conference secretariat in Chengdu (inquiry@icvisp.org) with a host university each year (Hainan University in 2026, Northwestern Polytechnical University and Xi'an University of Posts and Telecommunications in 2025)
organizer_country: [china]
proceedings: SPIE (2026); IEEE Xplore 2024 and 2025, IET Conference Proceedings 2023, ACM ICPS 2018 to 2020
archival: true
indexing: [EI, Scopus]
fee: 550 USD or 4000 CNY per full paper (2026, regular author); 500 USD early bird before 2026-09-11
typical:
  deadline_months: [10]
  conference_months: [11, 12]
links:
  website: http://www.icvisp.org/
notes:
- Annual since 2017; Osaka 2017, Las Vegas 2018, Vancouver 2019, virtual 2020 to 2022, then China (Dali 2023, Kunming 2024, Xi'an 2025, Haikou 2026)
- Held in late November or December since 2020
- Proceedings publisher changes by year (ACM ICPS 2018 to 2020, IEEE CPS 2021, IET 2023, IEEE 2024 and 2025, SPIE for 2026)
- 2025 edition had APSIPA and IEEE Xi'an Section as technical sponsors
- Rolling review with several abstract rounds; minimum 5 pages; abstract-only presentation without publication is offered
- Not listed in CORE ICORE2026 or the CCF list
