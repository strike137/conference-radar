notes:
- Half-day workshop on operating systems and runtime systems for extreme-scale HPC and cloud, held with SC
- 2026 is the 15th edition
- Listed by SC26 among the workshops with papers in the SC Workshop Proceedings
- Single-blind review; papers of 5 to 11 pages in IEEE two-column format for 2026
- Position papers and early, immature ideas are explicitly welcome
- Optional artifact description and evaluation with reproducibility badges
- 2026 submission deadline was extended from 31 July to 7 August 2026 (AoE)
- SC25 workshop papers were archived in the ACM Digital Library
- Not listed in CORE ICORE2026
