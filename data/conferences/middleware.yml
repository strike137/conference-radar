notes:
- Main venue for middleware and distributed systems software (cloud, edge, serverless, data processing platforms), usually held in December
- ACM event, run with IFIP; CORE lists it as ACM/IFIP/USENIX International Middleware Conference
- Location rotates worldwide (Bologna 2023, Hong Kong 2024, Nashville 2025, Tarragona 2026, Kyoto 2027)
- Proceedings in ACM DL (full open access from 2026)
- Two submission cycles (winter and summer) with abstract registration a week before the firm paper deadline
- Doubly anonymous review with early rejection, rebuttal, and minor or major revision outcomes; a major revision moves to the next cycle
- Research and experimentation/deployment papers up to 12 pages, Big Ideas papers up to 6 pages (ACM SIGCONF)
- Voluntary artifact evaluation with badges
- 'CORE rank A (ICORE2026); CCF B'
