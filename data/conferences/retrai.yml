links:
  website: https://retrai-workshop.github.io/retrai-26/
notes:
- Workshop on requirements engineering for trustworthy AI-based systems (elicitation, trade-offs, ethical, legal and social requirements, teaching trustworthy AI)
- Interdisciplinary; researchers from philosophy, law, psychology and sociology are invited as well as computer scientists
- Held with IEEE RE; 1st edition at RE 2025 in Valencia, 2nd at RE 2026 in Montreal
- Papers appear in the RE workshops proceedings (REW) in IEEE Xplore
- Short position papers 3-4 pages, full papers 6-10 pages, case-study papers and extended abstracts on teaching material, IEEEtran format, EasyChair submission
- Organized by Lina Marsso (Polytechnique Montreal), Isobel Standen (University of York) and Walid Maalej (HPI, University of Potsdam)
- Not listed in the CORE portal (ICORE2026)
