notes:
- One of the three flagship conferences of the IEEE Robotics and Automation Society (with ICRA and IROS); 22nd edition in 2026
- Cross-industry automation research (manufacturing, smart industry, healthcare, logistics, data analytics and optimization for automation)
- Regular papers 6 pages plus up to 2 extra pages for a fee; double-blind review in 2026; submission via RAS PaperCept
- Accepted regular and special session papers go to IEEE Xplore; presentation-only, work-in-progress and special session abstract submissions do not
- Papers from T-ASE, T-RO, RA-L, RAM and RAP can be presented as presentation-only papers
- Location rotates worldwide (2024 Bari, 2025 Los Angeles, 2026 Shenyang, 2027 Linz)
- Not listed in ICORE2026; not on the CCF list
