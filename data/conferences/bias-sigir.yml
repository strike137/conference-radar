notes:
- Workshop on defining, measuring and mitigating algorithmic bias and unfairness in search and recommender systems
- Co-located with ECIR from 2020 to 2023 and with SIGIR in 2024 (Washington D.C.) and 2025 (Padua)
- Revised post-proceedings in Springer Communications in Computer and Information Science (CCIS); 2025 volume is CCIS 2786, shared with IR4U2 2025
- "BIAS 2025: 3 full papers accepted out of 7 submissions"
- Full and reproducibility papers up to 12 pages, short papers 6 pages, position papers 4 pages, in Springer format; double-blind review
- At least one author per paper must register and attend
- No 2026 edition announced on the official site as of November 2026
- Not ranked in ICORE2026 and not on the CCF list
