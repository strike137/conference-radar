id: ieee-icebe
name: IEEE ICEBE
full_name: IEEE International Conference on E-Business Engineering
type: conference
tier: minor
areas: [data, ai]
region: worldwide
language: english
frequency: annual
organizer: IEEE Technical Committee on Business Informatics and Systems (TCBIS, IEEE Computer Society) with a host university each year
organizer_country: [international]
proceedings: IEEE Computer Society Conference Publishing Services (CPS); extended versions of selected papers invited to Springer SOCA and an MDPI Mathematics special issue
archival: true
typical:
  deadline_months: [8]
  conference_months: [10, 11]
links:
  website: https://conferences.computer.org/icebe/2026/index.html
notes:
- Held since 2003 (first edition 2004 in Macau); supported by the IEEE Technical Committee on Business Informatics and Systems (TCBIS)
- Topics are AI, data and blockchain applied to e-business, e-commerce, FinTech and business automation
- Double-blind review; full papers up to 8 pages, short and demo papers up to 4 pages (IEEE format)
- 'Recent hosts: Bournemouth (2022), Sydney (2023), Shanghai (2024), Buraydah, Saudi Arabia (2025), Wuhan (2026)'
- Camera-ready papers go through IEEE CPS; in-person attendance is mandatory
- "Registration in 2026: 700 USD early for IEEE members, 840 USD for non-members; extra pages 100 USD each"
- Not ranked by CORE (ICORE2026) and not on the CCF 2026 list
