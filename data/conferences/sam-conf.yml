notes:
- Run by the SDL Forum Society; successor of the SDL Forum and SAM workshop series
- Co-located with the ACM/IEEE MODELS conference every year since 2010 (annual since 2018)
- Covers modeling, specification and analysis of systems with ITU-T languages (SDL-2010, MSC, ASN.1, TTCN-3, URN)
  and related languages such as UML and SysML
- 2026 papers published in the MODELS 2026 Companion proceedings by ACM (open access, APC for full papers from
  institutions outside ACM Open; no APC for extended abstracts)
- Full papers up to 10 pages and extended abstracts up to 5 pages, including references; single-blind review
- Best papers invited to extend their work for the Springer journal Innovations in Systems and Software Engineering (ISSE)
- Small event, usually limited to about 100 people
- Not listed in the ICORE2026 CORE portal
