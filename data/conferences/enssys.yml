notes:
- Workshop on energy harvesting, battery-free and intermittent sensing systems for IoT and CPS
- Held annually since 2013 with ACM SenSys or CPS-IoT Week; 2026 was the 14th edition
- Recent hosts are Istanbul (2023), Hangzhou (2024), Irvine (2025) and Saint Malo (2026)
- 2026 papers appear in IEEE Xplore on the first day of the workshop; the 2025 papers went into the ACM Digital Library
- Double-blind; technical papers up to 6 pages, position papers 3 pages, demo and poster papers 2 pages
- Deadline has been extended by one to two weeks in recent years
- Not listed in ICORE2026
