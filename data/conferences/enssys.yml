notes:
- Workshop on energy harvesting, battery-free and intermittent sensing systems for IoT, including backscatter, wake-up radios and TinyML
- Long-running series (14th edition in 2026), held with ACM SenSys since 2013; with CPS-IoT Week since 2025, so the deadline moved from late summer to early spring
- 2025 papers in the ACM Digital Library; the 2026 call says accepted papers appear on IEEE Xplore
- Technical papers up to 6 pages, position papers up to 3 pages, demo or poster papers up to 2 pages; double-blind review
- Recent hosts are Istanbul (2023), Hangzhou (2024), Irvine (2025) and Saint-Malo (2026)
- Not listed in the CORE portal (ICORE2026)
