notes:
- European CSCW conference established in 1989, run by EUSSET; biennial until 2017, annual since 2018
- Called the European Conference on Computer-Supported Cooperative Work until 2025, then renamed the EUSSET Conference on Computer-Supported Cooperative Work
- Conference papers (up to about 6,000 words, double-blind) and exploratory papers (up to 5,000 words,
  single-blind) share one deadline; single-round review with accept or reject and no shepherding
- Accepted conference and exploratory papers are published with a DOI in the EUSSET Digital Library
- A journal track runs on a rolling basis through the Springer CSCW Journal; papers accepted by April 1 are
  presented at that year's conference
- Single-track; pre-conference days with workshops, masterclasses and a doctoral colloquium
- Held in Europe (Zurich 2021, Coimbra 2022, Trondheim 2023, Rimini 2024, Newcastle 2025, Munich 2026)
- CORE B (ICORE2026); CCF B (HCI and ubiquitous computing category)
