notes:
- Run by the Kulliyyah of ICT at IIUM; series dates back to ISI 2001, ICT4M since 2006
- Usually held in Malaysia (Kuching 2014, Kuala Lumpur 2018, Kuantan 2021, IIUM Gombak 2023 and 2025), with past
  editions in Jakarta and Rabat
- Roughly every two years; 2025 was the 10th edition
- Papers up to 6 pages via EasyChair; presented papers go to IEEE Xplore (IEEE PDF eXpress, no-show policy) and are
  submitted for possible Scopus inclusion
- Submission deadline is extended (2025 final extension to September 30)
- Not ranked by CORE (ICORE2026) or CCF
