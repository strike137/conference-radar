notes:
- Computer architecture workshop for junior graduate students (less than 3 years of graduate school) and research-active undergraduates
- Students present early-stage or ongoing work and get two or more expert reviews plus mentoring by established architects, keynotes and a career panel
- Not a venue for publication; the call states there are no formal proceedings
- Submissions up to 2 pages excluding references, double-blind, via HotCRP; an advisor email confirming eligibility is required
- Organizers aim to fund travel for the presenter of each accepted paper, depending on available funding
- Co-located with ASPLOS from 2020 to 2025 and with ISCA 2026 in Raleigh (8th edition)
- Not listed in CORE ICORE2026 and not on the CCF list
