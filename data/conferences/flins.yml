notes:
- Series on applied computational intelligence and fuzzy logic since 1994 (originally Fuzzy Logic and Intelligent Technologies in Nuclear Science); 17th edition in 2026
- Listed in ICORE2026 as International FLINS Conference on Robotics and Artificial Intelligence
- Held every two years, mostly in Europe (Roubaix 2016, Belfast 2018, Cologne 2020, Madrid 2024) with Tianjin 2022 and Sydney 2026
- Recent editions are held jointly with ISKE (FLINS-ISKE 2026 in Sydney, Madrid 2024)
- 2026 proceedings in Springer LNCS (five volumes); full papers at least 12 pages in LNCS format, single-blind review via OpenReview; 2-page abstract-only submissions also accepted
- Selected papers invited to a special issue of the International Journal of Computational Intelligence Systems
- CORE C (ICORE2026); not on the CCF 2026 list
