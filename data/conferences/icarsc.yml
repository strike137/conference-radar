notes:
- Held every year in Portugal together with ROBOTICA, the Portuguese Robotics Open (a RoboCup-sponsored local event)
- Recent venues -> Tomar 2023, Paredes de Coura 2024, Madeira 2025, Barcelos 2026
- Co-sponsored by the Portuguese Robotics Society, IEEE Portugal Section and IEEE Portugal RAS Chapter; IEEE RAS technical co-sponsor
- Proceedings in IEEE Xplore, indexed in Scopus; papers not presented in person are not submitted to IEEE Xplore
- Six-page IEEE A4 papers, anonymous review via EasyChair; selected papers invited to indexed journals
- Small two-day meeting focused on mobile and autonomous robotics and robot competitions
- Not listed in CORE ICORE2026; not in the CCF list
