notes:
- Started as the Pacific Rim International Workshop on Multi-Agents (conference name since 2009); recent editions
  were held in Japan or Europe (2022 Valencia, 2024 Kyoto, 2025 Modena, 2026 Kumamoto)
- Proceedings in Springer LNAI; full papers 16 pages, short papers 6, posters 3 (plus references)
- Double-blind review in 2025 and 2026; the July deadline was extended by one week in 2025 and by two weeks in 2026
  (to Aug 3)
- 2026 edition is co-located with IEEE ICA 2026 (shared registration) and explicitly invites LLM-based and agentic
  AI work; cybersecurity is listed among application topics
