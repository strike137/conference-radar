notes:
- One-day workshop on testing and securing ML systems (privacy, adversarial robustness, poisoning, fairness, unlearning, federated learning security, LLM security), co-located with IEEE ICST
- Started in 2025; held with ICST in Naples 2025 and Daejeon 2026, so it moves with ICST
- Full papers up to 8 pages, short papers up to 4 pages and position papers up to 2 pages (IEEE format, excluding references)
- Accepted papers published in the IEEE Digital Library
- Chairs from the University of Salerno and the University of Bologna, Italy
- Not listed in the CORE portal (ICORE2026)
