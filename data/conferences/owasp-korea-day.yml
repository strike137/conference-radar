notes:
- One-day application and AI security community conference run by the volunteer OWASP Seoul Chapter (active since 2011)
- Earlier Korea Days in 2013, 2014, 2015 and 2019, OWASP Seoul Conference in 2020 and 2021; revived in 2026 after a new chapter leadership started monthly seminars in 2025
- "2026 theme: security in the AI era; 8 talks selected through an open CFP, plus community sessions, hands-on labs and booths"
- Talks of 20 to 40 minutes, product pitches not allowed; slides and recordings published after the event, no proceedings
- Held in Seoul (Space Share Samsung Station Center in 2026); pre-registration only, about 300 to 500 attendees planned
- Not listed in ICORE2026
