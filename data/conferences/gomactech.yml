id: gomactech
name: GOMACTech
full_name: Government Microcircuit Applications & Critical Technology Conference
type: conference
tier: minor
areas: [communications]
region: north-america
language: english
frequency: annual
organizer: GOMACTech Steering Committee (US DoD and government laboratories such as AFRL, NRL, ARL and DARPA)
organizer_country: [usa]
proceedings: GOMACTech proceedings at DTIC (access for authorized US government users only)
archival: false
typical:
  deadline_months: [9]
  conference_months: [3]
links:
  website: https://www.gomactech.net/
notes:
- Established in 1968 to review microcircuit and microelectronics developments for US government systems
- "Restricted attendance: unclassified but export-controlled; only US citizens or permanent residents, with an NDA signed onsite"
- 2-page abstract first; accepted authors submit a 4 to 6 page full paper using mandatory CUI marking templates
- Proceedings papers are held at the Defense Technical Information Center (DTIC), accessible only to authorized
  DoD, government and contractor users
- Topics include RF, photonics, power electronics, rad-hard, packaging, AI/ML in microelectronics and trusted
  microelectronics
- Held in the US every March (San Diego 2023, Charleston 2024, Pasadena 2025, New Orleans 2026, Pasadena 2027)
- Student paper competition (lead author must be a student; 500 USD first prize)
- Not listed in ICORE2026 or the CCF 2026 list
