notes:
- Annual since 2021 (first edition online), co-located with NAACL or ACL; in-person editions all in North America
  so far (2022 Seattle, 2023 Toronto, 2024 Mexico City, 2025 Albuquerque, 2026 San Diego)
- Proceedings in the ACL Anthology; a non-archival track is also offered, including for ACL Findings papers
- Full papers 8 pages, short papers 4 pages; double-blind review via OpenReview; fast-track for papers already reviewed
  at ACL, EMNLP, EACL or ARR
- 'Topics: privacy, fairness, robustness, red teaming, jailbreaks, hallucination and explainability of LLMs'
- Industry-sponsored (Amazon, Meta, Capital One); funding used for diversity and mentoring
