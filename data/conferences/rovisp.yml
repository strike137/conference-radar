notes:
- Run by the USM School of Electrical and Electronic Engineering since 1994 (first called ROVPIA)
- Held in Penang, Malaysia; every two years (13th edition 2025, 14th edition 2027)
- Proceedings in Springer Lecture Notes in Electrical Engineering (LNEE)
- Five tracks covering robotics and control, vision and signal processing, telecommunications, electronic design and semiconductors, and electrical power
- 4 to 6 page papers in English
- "ICORE2026 rank: National: Malaysia; not in the CCF 2026 list"
