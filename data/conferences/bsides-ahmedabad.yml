notes:
- Independent Security BSides event in Ahmedabad, India, founded in 2019; described by the organizers as the longest running BSides in India
- 2026 was the 7th edition; editions in 2019 and 2021 to 2026
- Two conference days preceded by two days of paid hands-on trainings, plus an exhibition, hackathon and award night
- Call for papers takes 30 minute technical talks and 2 hour workshops; talks about specific companies or commercial products are not accepted
- Speaker perks include a speaker pass and two nights of accommodation for one speaker per talk
- Large industry-oriented event with many CISO and government speakers; organizers report 5,000+ participants across editions
- No proceedings; student discount available on delegate passes
