notes:
- Workshop on understanding and generating text in document images, scene images and videos (text detection and recognition, text editing, font synthesis, document forensics, multimodal document understanding)
- Chaired by Umapada Pal (ISI Kolkata), Venu Govindaraju (University at Buffalo), Lianwen Jin (SCUT) and Veronique Eglin (INSA Lyon)
- Held as a workshop of ICPR 2026 in Lyon
- Single-blind review via Microsoft CMT with a rebuttal phase; papers up to 15 pages in LNCS format
- Papers shorter than 6 pages are not included in the Springer LNCS proceedings
- Not listed in ICORE2026 or the CCF list
