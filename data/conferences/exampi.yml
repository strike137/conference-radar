notes:
- Workshop on MPI and message passing at extreme scale, held with SC every year since 2013
- Topics include collective operations, one-sided communication and RDMA, GPU-aware MPI, fault tolerance in MPI and MPI I/O
- Papers of 6 to 10 pages excluding references, IEEE conference template in 2026, submitted through the SC submissions site
- Listed by SC26 among the workshops with papers in the SC Workshop Proceedings; 2025 papers are in the ACM DL
- Half-day workshop in 2026 (full day in 2025)
- Not listed in CORE ICORE2026
