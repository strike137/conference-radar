notes:
- Run by the Emerging Technologies Network, the same group behind FMEC and SNAMS; not the same venue as sds (Swiss Conference on Data Science)
- Topics are software-defined networking, storage, data centers and clouds, softwarization, and their security and automation
- Proceedings published by IEEE and submitted to IEEE Xplore; full papers 6 to 8 pages, short papers 3 to 4 pages
- Mostly held in Europe (2019 Rome, 2020 Paris, 2021 Gandia, 2022 Paris, 2024 Gran Canaria, 2025 Lyon); 2023 was in San Antonio, Texas
- Latest edition is the 12th (SDS 2025, Lyon, proceedings in IEEE Xplore); no 2026 edition has been announced
- Not listed in ICORE2026 or the CCF 2026 list
