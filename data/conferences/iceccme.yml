notes:
- Run by ECER Events, a commercial conference organizer based in Doha, Qatar
- Proceedings of every edition since 2021 in IEEE Xplore and indexed by Scopus
- Held in holiday destinations, hybrid with online presentation allowed (Mauritius 2021, Maldives 2022 and 2024, Tenerife 2023, Zanzibar 2025, Bali 2026)
- Broad scope covering power and energy, computer science, AI, communications and mechatronics
- Papers up to 6 pages, then 50 USD per extra page
- 2026 was the 6th edition; the in-person part in Bali lasted only one day (2026-10-15)
- Not listed in CORE ICORE2026 or the CCF list
