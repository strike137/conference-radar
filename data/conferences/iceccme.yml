- 'Held at resort destinations: Mauritius 2021, Maldives 2022, Tenerife 2023, Maldives 2024, Zanzibar 2025, Bali
  2026'
- 2026 in-person sessions were on one day only (15 Oct, Grand Hyatt Bali); the rest online
