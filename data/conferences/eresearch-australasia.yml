notes:
- Annual AU/NZ conference on research computing, research data, HPC, cloud and research software, hosted by AeRO; held every year since 2007
- Held in Australian cities (Brisbane, Melbourne, Sydney); 2026 edition at the Melbourne Cricket Ground
- Abstract-based, with 250-word abstracts for oral presentations, lightning talks, posters and BoF sessions and single-blind review by two reviewers
- Accepted abstracts are stored on Zenodo with a DOI; no full papers, so non-archival
- Week format with pre- and post-conference workshops around a three-day main program
- Not listed in CORE ICORE2026
