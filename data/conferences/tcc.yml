notes:
- IACR area conference on the theoretical foundations of cryptography; proceedings in Springer LNCS
- ICORE2026 lowered it from A (CORE2023) to B; no ranking submission was made and CORE chose the lower rank where
  data were ambiguous. Still widely regarded as the main theory-of-crypto venue
- Single deadline in May, conference in November or December; location rotates (TCC 2023 was in Taipei)
- At least one author must present in person; Young Researcher Award for papers authored solely by early-career
  researchers
