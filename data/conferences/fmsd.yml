notes:
- ICML workshop on foundation models for tabular and time-series data (classification, regression, forecasting, structured generation)
- Held with ICML 2025 (Vancouver, first edition, 99 submissions) and ICML 2026 (Seoul, second edition)
- Non-archival, the CFP states there are no formally published proceedings; accepted papers appear on OpenReview and the workshop site
- Short papers up to 4 pages in the ICML template, double-blind review on OpenReview, no rebuttal
- Papers accepted at the ICML main conference may not be submitted
- 2026 edition added industry spotlight talks
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
