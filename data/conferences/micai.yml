notes:
- Organized by the Mexican Society for Artificial Intelligence (SMIA) with a local host institution each year
- 'Proceedings in Springer as "Advances in Soft Computing" (two parts in 2025) plus a posters volume and "Advances in Computational Intelligence" workshop volumes'
- Held in Mexico with a different host each year (INAOE and UDLAP in 2024, CIMAT and UG in Guanajuato in 2025, Tec de Monterrey Campus Chihuahua in 2026)
- 2025 was the 24th edition, on site only
- Not ranked in CORE ICORE2026
