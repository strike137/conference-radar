notes:
- Research, Innovation and Vision for the Future; started 2003 and held 19 times in Hanoi, Ho Chi Minh City, Da
  Nang and Can Tho; not held in 2011, 2014, 2017 or 2018, annual since 2019
- Proceedings in IEEE Xplore and indexed in DBLP; 6-page IEEE papers via EDAS
- Tracks include Cyber-Security, Cryptography and Blockchain, plus Communications, Networking, IoT and Cloud Computing
- Held in December in recent editions (2024 Da Nang, 2025 Ho Chi Minh City); RIVF 2026 at VinUniversity, Hanoi
