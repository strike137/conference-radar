id: indiahci
name: IndiaHCI
full_name: Indian Conference on Human-Computer Interaction
type: conference
tier: minor
areas: [general]
region: south-asia
language: english
frequency: annual
organizer: HCI Professionals Association of India (HCIPAI), in cooperation with ACM SIGCHI
organizer_country: [india]
proceedings: ACM DL
archival: true
rank:
  core: 'National: India'
fee: 'INR 14,000 professional, INR 6,600 student (2026, regular registration); HCIPAI members get INR 2,000 off'
typical:
  deadline_months: [6]
  conference_months: [10, 11]
links:
  website: https://www.indiahci.org/
notes:
- India's main HCI conference, run by HCIPAI in cooperation with ACM SIGCHI; 2026 is the 17th edition
- Hosted by a different Indian institute each year (UPES Dehradun 2023, IIT Bombay 2024, IIIT Delhi 2025, IIT
  Hyderabad 2026)
- Proceedings in the ACM DL (ICPS, ACM Open APC may apply) for 2025 and 2026; 2023 and 2024 were published by
  Springer (2024 in CCIS)
- Double-blind review (CHI-style) with rebuttal; ACM single-column format, typically 7,000 to 8,000 words
- Many side tracks (posters and demos, industry, student design and research consortia, courses and workshops,
  out of India track)
- 'CORE rank National: India (ICORE2026)'
