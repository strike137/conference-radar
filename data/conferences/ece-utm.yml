notes:
- Small conference run by UTM Faculty of Electrical Engineering, co-sponsored by the IEEE EDS Malaysia Chapter
- Two editions so far (2023 and 2025); the 3rd edition ECE2027 is announced for Johor Bahru
- ECE2025 proceedings in IEEE Xplore; ECE2023 papers were published in IOP Journal of Physics Conference Series
- ECE2025 held in Johor Bahru, hybrid (virtual presentation for overseas participants); ECE2023 was virtual
- Tracks on machine learning and pattern recognition, VLSI and computing architecture, biosignals and biomedical
  imaging, nanotechnology and materials
- Registration RM1000 to RM1400 (2025, IEEE member early bird to non-member normal); student RM900
- Not listed in ICORE2026
