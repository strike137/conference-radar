notes:
- ACM conference on multimodal AI and social interaction (formerly International Conference on Multimodal Interfaces); 28th edition in 2026
- Rated B in ICORE2026 and C in the CCF list (human-computer interaction)
- Main proceedings published by ACM in the ACM DL; workshop papers and late-breaking results go into separate adjunct proceedings
- Long papers up to 8 pages, short papers up to 4 pages, ACM double-column format, references not counted
- Double-blind review with a rebuttal period; abstract registration about ten days before the paper deadline
- ACM moved to full open access in 2026, so an article processing charge applies unless the institution is in ACM Open (250 USD members, 350 USD non-members subsidized rate for 2026)
- One full non-student registration covers up to two papers, a student registration covers one
- Rotates worldwide (Bengaluru 2022, Paris 2023, San Jose Costa Rica 2024, Canberra 2025, Naples 2026)
- Workshops, tutorials, grand challenges and the doctoral consortium are held on the days before and after the main conference
