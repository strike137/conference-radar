notes:
- Leading software engineering research forum in Ibero-America (30th edition in 2027)
- Papers accepted in English, Spanish or Portuguese
- Technical papers up to 15 pages and emerging ideas papers up to 8 pages, in the Brazilian Computer Society (SBC)
  format; each submission reviewed by at least three PC members
- Proceedings published in the SBC Open Digital Library (SOL) and by Curran Associates, submitted for DBLP and Scopus
  indexing
- Best papers invited to a JCR-indexed journal
- Satellite events include a doctoral symposium, the EIbAIS advanced school and industry talks
- Held in April or May in Latin America or Spain (Montevideo 2023, Curitiba 2024, Ciudad Real 2025, Santo Domingo 2026, Vina
  del Mar 2027)
- Not listed in ICORE2026 or the CCF list
