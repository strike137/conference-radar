notes:
- Annual display technology conference held since 2001, organized by KIDS and endorsed by SID; 26th edition in 2026
- Always in Korea, usually in late August (2023 Busan, 2024 Jeju, 2025 Busan, 2026 Busan at BEXCO)
- Submissions are a single 1-page paper, peer reviewed and assigned to oral or poster sessions
- Papers appear in the e-proceedings handed out in the conference kit; a presenter must register by the pre-registration deadline or the paper is dropped
- Topics span TFTs, OLED, micro-LED, quantum dots, AR/VR/XR optics, display electronics and systems, and AI for displays
- Large event with a Late-News paper track, tutorials, workshops and an exhibition; 909 papers from 16 countries and 2,589 participants in 2025
- "Fees 2026: 590 USD regular member, 690 USD non-member, 150 to 200 USD students (pre-registration)"
- Not listed in ICORE2026 (CORE portal, 0 results for IMID) and not on the CCF 2026 list
