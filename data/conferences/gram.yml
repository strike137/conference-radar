notes:
- Workshop on geometric deep learning, equivariance, non-Euclidean generative models and geometric analysis of
  representations
- First edition at ICML 2024 in Vienna (PMLR volume 251); second edition at ICLR 2026 in Rio de Janeiro
- Archival proceedings track (up to 8 pages, PMLR) plus non-archival extended abstracts, a blog post track and a
  competition track
- PMLR proceedings for 2026 are published after the workshop
- Proceedings papers must add at least 30% new material relative to work published or submitted elsewhere
- 84 accepted papers in 2026
- Not listed in CORE ICORE2026 or the CCF 2026 list
