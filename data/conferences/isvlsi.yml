notes:
- Annual symposium of the IEEE Computer Society TCVLSI, also supported by IEEE and the IEEE Circuits and Systems Society
- Covers VLSI circuits, design automation, architecture, emerging technologies and hardware security
- Full papers up to 6 pages in the IEEE conference template, with blind review via EasyChair
- Accepted papers are submitted to IEEE Xplore; selected papers are invited to a special issue of IEEE Transactions on VLSI Systems
- Held in early July, rotating worldwide (Cyprus 2020 and 2022, Tampa 2021, Iguazu Falls 2023, Knoxville 2024, Kalamata 2025, Kolkata 2026)
- Main paper deadlines are usually extended by a few weeks
