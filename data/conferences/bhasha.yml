notes:
- Workshop on datasets, benchmarks, annotation, harmonization and human-centric evaluation for Indian languages
- 1st edition on December 23, 2025 at IJCNLP-AACL 2025, IIT Bombay, Mumbai, with the IndicGEC and IndicWG shared tasks
- 2nd edition on December 20, 2026 at ICON 2026, Gauhati University, Assam
- All presented papers go into the ACL Anthology; long papers up to 8 pages and short papers up to 4 pages in ACL format
- 2026 uses direct submission via Microsoft CMT only; 2025 also accepted ARR commitments
- Not ranked in ICORE2026 and not on the CCF list
