notes:
- Annual conference of the European HiPEAC network on computer architecture, programming models, compilers and
  operating systems
- Journal-first model, papers are submitted to ACM TACO at any time; original papers accepted in TACO between
  November 15 two years before and November 15 one year before the conference are invited to the paper track
- No conference proceedings are published; the papers themselves appear in ACM TACO (ACM DL)
- Submit to TACO before June 1 of the previous year to be invited to the next HiPEAC if accepted
- Large program of co-located workshops, tutorials, poster sessions and an industrial exhibition
- Held in Toulouse 2023, Munich 2024, Barcelona 2025, Krakow 2026 and Glasgow 2027
- Not in the CORE portal (ICORE2026); CCF B in the CCF 2026 list
