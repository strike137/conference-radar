notes:
- Founded in 1996 with support from the Japanese Ministry of Education; held every January at B-Con Plaza, Beppu,
  Oita (only 2000 Oita, 2001 Tokyo, 2013 Daejeon and 2021 online elsewhere)
- Recent editions run jointly as AROB-ISBC (with the International Symposium on BioComplexity, plus SWARM in
  2022 to 2024)
- Separate event from ICAROB, which is run by ALife Robotics Co. and also meets in Oita in January
- Abstract (400 to 600 words) reviewed first, then a camera ready paper; online proceedings are password
  protected for that year's participants
- Optional Journal Track (full paper, max 12 pages, deadline end of August) for publication in the journal
  Artificial Life and Robotics
- Co-sponsored by SICE, ISCIE, JSST and IEEJ; presentations in person except approved overseas organized session
  speakers
