notes:
- Small conference bridging NLP and AI with cyber security (phishing, disinformation, machine-generated text, forensics, threat intelligence)
- Started in Lancaster in 2024 (July 29 to 30); second edition at the University of Alicante, June 11 to 12, 2026
- Proceedings in the ACL Anthology (2026 volume published by the University of Alicante, CC BY 4.0)
- Every submission reviewed by at least three programme committee members
- Special theme track on cyber security in the era of LLMs and generative AI; 2026 also had a student workshop and best paper awards
- 2026 submission deadline was extended several times (March 16, then April 12 and 13, then April 27)
- Not ranked in ICORE2026 and not on the CCF list
