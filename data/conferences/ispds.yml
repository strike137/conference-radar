id: ispds
name: ISPDS
full_name: International Conference on Information Science, Parallel and Distributed Systems
type: conference
tier: minor
areas: [systems, general, networking]
region: worldwide
language: english
frequency: annual
organizer: ISPDS conference secretariat (submission and registration via AiScholar, ais.cn) with host universities (Donghua University and Universiti Teknologi Malaysia in 2026)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 570 USD or 3800 CNY per 4-page paper, 510 USD early bird (2026); 60 USD per extra page
typical:
  deadline_months: [8]
  conference_months: [10, 11]
links:
  website: http://www.ispds.org/
notes:
- Smaller commercially organized conference series running since 2020, with a bilingual Chinese and English site run through AiScholar
- Held in China most years (Xi'an 2020, virtual 2021, Guangzhou 2022), with UK sub-venues in 2023 and 2024 and a London edition with the University of Greenwich in 2025
- 2026 edition has a main venue in Shanghai (Oct 23 to 25) and a branch venue in Kuala Lumpur, Malaysia (Sep 28 to 30)
- Accepted papers published by IEEE (2026 ISBN 979-8-3195-1078-5) and submitted to EI Compendex and Scopus; earlier volumes went through IEEE CPS
- Each paper reviewed by two or three reviewers, per the site; presenter-only (abstract) and listener registration are also offered
- Conference month varies from June to November between editions
- Not listed in ICORE2026 or the CCF list
