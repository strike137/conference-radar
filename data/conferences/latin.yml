notes:
- Theoretical computer science symposium founded in 1992 by Latin American researchers led by Imre Simon; biennial since 1998
- Held in a different Latin American country each time (Puerto Varas, Chile 2024; Florianopolis, Brazil 2026)
- Proceedings in Springer LNCS; selected papers invited to a Theoretical Computer Science special issue
- Lightweight double-blind review; papers up to 15 pages in LNCS format plus optional appendix
- Accepted papers must be presented in person and need a full registration
- Poster track with a later deadline to encourage student attendance; Imre Simon Test of Time Award
- "Registration 2026: about 400 USD early full, about 200 USD early for students and postdocs; financial aid for students"
- CORE B (ICORE2026); not on the CCF list
