organizer_country: [india]
proceedings: IEEE Xplore
archival: true
indexing: [IEEE Xplore]
fee: Authors 7,500 INR / 300 USD non-IEEE, 7,000 INR / 250 USD IEEE members (2025, early bird)
typical:
  deadline_months: [2, 8]
  conference_months: [5, 12]
links:
  website: https://www.icepe2026.org/
notes:
- Flagship conference of NIT Meghalaya, run by its Department of Electrical Engineering since 2015
- Editions in 2015, 2018, 2020, 2022, 2023, 2024 and 2025 held at NIT Meghalaya (Sohra (Cherrapunjee) in 2025)
- 8th edition in December 2026 is organized jointly with IIEST Shibpur and held on the IIEST campus in Howrah near Kolkata
- Power and energy systems, electrical engineering in general, and related environmental topics rather than computing
- All accepted and presented papers in IEEE Xplore; top 20% recommended for review by IEEE Transactions on Industry Applications (2025, 2026)
- Papers up to 6 pages submitted via Microsoft CMT; one full registration covers one paper
- Not listed in ICORE2026 or the CCF list
