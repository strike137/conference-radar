notes:
- Rust developer conference organized by Tim McNamara (author of Rust in Action) and hosted by Accelerant Limited, New Zealand
- Part of the RustFest family of events; first edition in 2025 at Shed 6, Queens Wharf, Wellington
- Two co-creation days (training, coding, unconference) followed by two single-track conference days
- Open call for participation on pretalx with a soft deadline of 1 May 2025 and no hard deadline
- Large discounts for students (85%) and members of marginalised groups (65%)
- Not listed in CORE ICORE2026
