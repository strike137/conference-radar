notes:
- Small symposium on string algorithms, text indexing and compression, computational biology and information retrieval
- Started in 1993 as the South American Workshop on String Processing; SPIRE since 1998
- Proceedings in Springer LNCS (LNCS 16073 in 2025)
- Long papers up to 12 pages and short papers up to 6 pages, excluding references
- Rotates between Europe and the Americas (Lille 2021 online, Concepcion 2022, Pisa 2023, Puerto Vallarta 2024, London 2025, Hamilton 2026)
- In-person; online presentations only in exceptional cases
- Co-located with the Workshop on Compression, Text, and Algorithms (WCTA) on the last day
