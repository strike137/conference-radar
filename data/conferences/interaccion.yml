notes:
- Spanish-speaking HCI community conference sponsored by AIPO, the Spanish HCI association, and organized each year by a host university research group; 2026 is the 26th edition
- Official language is Spanish; papers may be in Spanish or English, slides must be in English
- Long (10 pages) and short (5 pages) papers in English are published open access in the SciTePress Digital Library; Spanish long papers go to the AIPO journal Interacción and other contributions to the conference proceedings
- Double-blind review; best long papers invited to a special issue of Universal Access in the Information Society
- Held in Spain every year (Malaga 2021, Teruel 2022, Lleida 2023, A Coruna 2024, Valladolid 2025, Albacete 2026)
- Not ranked by CORE (ICORE2026) and not on the CCF 2026 list
