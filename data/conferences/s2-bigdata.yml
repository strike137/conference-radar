notes:
- Not to be confused with IEEE BigData (IEEE International Conference on Big Data); this one is run by the Services Society
- One of ten co-located conferences of SCF run by the Services Society, a US-registered nonprofit (siblings include ICWS, SCC, CLOUD, EDGE, ICIOT and ICBC)
- Proceedings in Springer LNCS; research and application tracks up to 15 pages, short papers up to 8 pages
- Each submission reviewed by at least three program committee members; submission via EDAS
- Several submission rounds (early bird, regular, special track) in one cycle
- 'Recent hosts: Seattle (2018), San Diego (2019), virtual (2020, 2021), Hawaii (2022, 2023), Bangkok (2024), Hong Kong (2025), Kuala Lumpur (2026)'
- 2026 theme was Agentic AI as a Service for Big Data
- Not listed in ICORE2026 (the CORE BigData entry is the IEEE conference); not on the CCF 2026 list
