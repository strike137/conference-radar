links:
  website: https://visarts.eu/
notes:
- Workshop on computer vision for art, art history and cultural heritage, bringing together computer vision and digital humanities researchers
- Biennial with ECCV since 2012 (2012, 2014, 2016, 2018, 2020, 2022, 2024); VISART VIII in 2026
- Two tracks; technical papers (14 pages, ECCV style) appear in the proceedings, extended abstracts (4 pages) on uses and reflection do not
- Double-blind review by at least three reviewers via OpenReview
- Not listed in ICORE2026 or the CCF list
