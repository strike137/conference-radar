notes:
- European conference on critical infrastructure protection, held every year since 2006
- Full papers (up to 20 pages) appear in Springer LNCS post-proceedings; short papers are presented as posters and not included
- Double-blind review by at least three reviewers
- Young CRITIS Award for the best paper by a researcher under 32
- Held in Europe every year (2021 Lausanne, 2022 Munich, 2023 Helsinki, 2024 Rome, 2025 Jonkoping, 2026 Cyprus)
- Hybrid attendance offered in 2026
- 2026 submission deadline was extended from 20 May to 24 July
