notes:
- Started in 2006 as Grid and Pervasive Computing; renamed Green, Pervasive, and Cloud Computing in 2017
- Covers green and energy-efficient computing, pervasive and mobile sensing, edge intelligence and cloud systems
- Papers up to 16 pages in Springer LNCS format; GPC 2024 proceedings appeared as LNCS 15225 about a year after the event
- 'Mostly held in China: Chengdu (2022), Harbin (2023), Macao (2024), Kuala Lumpur (2025), Nanjing (2026)'
- Deadlines are usually extended by two to six weeks
- "Registration in 2026: CNY 5,000 (about USD 750) early for non-CCF-member authors, CNY 4,000 for CCF members"
- CORE C (ICORE2026), CCF C
