notes:
- Half-day workshop co-located with ACM SIGKDD, so it moves with KDD (Toronto 2025, Jeju 2026)
- Data mining and AI for talent and management tasks such as recruitment, person-job fit, career paths, team formation
  and labour market intelligence
- Regular papers up to 8 pages, vision and short technical papers about 4 to 6 pages, ACM template, submitted via EasyChair
- Previously published papers are also welcome, and the KDD 2026 workshop call says workshop papers are not archived
  in the ACM DL
- 2026 edition added a demo track on LLMs in talent and management computing
- Not listed in the CORE ICORE2026 portal or the CCF list
