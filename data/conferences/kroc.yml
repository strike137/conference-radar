notes:
- National robotics conference of the Korea Robotics Society; 22nd edition in 2027, over 2,000 participants
- General papers are 2 pages (up to 2 extra pages allowed), with a separate undergraduate paper category
- Optional joint submission to the Journal of Korea Robotics Society (KCI listed, 4 pages or more) with a September
  deadline; accepted papers appear in the journal instead of the KRoC proceedings
- Held in a Gangwon resort in February (Alpensia 2026, Sono Belle Vivaldi Park 2027)
- Includes workshops, tutorials, the KROS RED Awards and a robot competition
- The international sister conference run by KROS is UR (International Conference on Ubiquitous Robots)
