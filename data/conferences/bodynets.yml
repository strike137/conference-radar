notes:
- EAI conference series on wireless body area networks, wearable and implantable sensing and pervasive healthcare
- Proceedings in Springer LNICST; selected papers invited to extended versions in Mobile Networks and Applications
  (MONET)
- Full papers 12 to 20 pages, short papers 6 to 11 pages; extra pages are charged
- 20th edition held in person in Okayama, Japan (2025), with IEICE among the listed sponsors; 21st edition in Florence,
  Italy (2026) as a hybrid conference
- Late track submissions accepted after the main track closes
