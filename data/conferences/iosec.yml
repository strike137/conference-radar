notes:
- Workshop of the IEEE International Conference on Cyber Security and Resilience (IEEE CSR); organized since 2018 according to the CFP
- Supported by EU-funded cybersecurity projects (CUSTODES, CONSOLE, NATWORK and others in 2026); many papers report project results
- Topics are IT and OT security for enterprises and critical infrastructures, threat intelligence, SOC tooling and intrusion detection
- Papers go into the IEEE CSR proceedings in IEEE Xplore; 6 pages plus up to 2 extra pages with overlength charges
- In person only; three sessions on Tuesday 4 Aug in 2026 (one joint training session with CRIRM)
- Deadlines were extended by about three to four weeks in 2025 and 2026
- Not listed in CORE ICORE2026 or the CCF list
