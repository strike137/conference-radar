notes:
- Workshop on term graph rewriting, graph transformation, interaction nets, string diagrams and their use in programming languages and automated reasoning
- Held since 2002 (as the Workshop on Term Graph Rewriting until 2006); biennial in recent years, TERMGRAPH 2026 was the 14th edition
- Satellite of ETAPS, FSCD or FLoC; held in Eindhoven 2016, Oxford 2018, online 2020, Haifa 2022, Luxembourg 2024 and Lisbon 2026, so mostly in Europe
- Extended abstracts up to 8 pages in EPTCS style for the pre-proceedings; after the workshop authors may submit a 15-page paper that is refereed again for the EPTCS post-proceedings
- Post-proceedings in EPTCS (TERMGRAPH 2020 -> EPTCS 334, TERMGRAPH 2022 -> EPTCS 377); EPTCS states it is not publishing proceedings for TERMGRAPH 2024; the TERMGRAPH 2026 volume is listed as to appear
- Not listed in ICORE2026 or the CCF 2026 list
