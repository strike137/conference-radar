id: imcec
name: IEEE IMCEC
full_name: IEEE Advanced Information Management, Communicates, Electronic and Automation Control Conference
type: conference
tier: minor
areas: [general, communications]
region: china
language: english
organizer: Chongqing Global Union Academy of Science and Technology (GUAST), technically sponsored by IEEE
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI]
fee: 600 USD or 3900 CNY per paper (regular author); 550 USD for students and IEEE members; listeners 300 USD
typical:
  deadline_months: [2]
  conference_months: [6, 12]
links:
  website: http://www.imcec.org/
notes:
- One of several IEEE-sponsored conferences run by GUAST in Chongqing (sister events include ITAIC)
- Broad scope covering information systems, big data, AI and control, networking and communications, and electronics
- Accepted papers are published by IEEE (IEEE IMCEC, ISSN 2693-2776) and submitted to EI; the site says all past papers were EI indexed
- Each paper is reviewed by at least two committee members, per the site; minimum length 4 pages
- 7th edition held 5 to 7 Dec 2025 at the Wanyou Conifer Hotel, Chongqing; the 8th is set for June 2027
- Registration fees are paid to a private education company (Chongqing Geek Education Technology)
- Not listed in CORE ICORE2026 or the CCF list
