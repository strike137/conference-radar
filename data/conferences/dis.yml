notes:
- A SIGCHI conference overseen by the DIS Steering Committee; focused on interaction design, design research and
  design theory in HCI
- Proceedings and companion proceedings in the ACM DL; ACM Open access from 2026 (APCs subsidized by 65% in 2026)
- Papers and pictorials share one deadline in January with an abstract one to two weeks earlier; no page limit,
  about 7,000 to 8,000 words expected; anonymized review
- In-person only in 2026; papers not presented in person may be withdrawn from the ACM DL
- Rotates worldwide (Pittsburgh 2023, Copenhagen 2024, Funchal 2025, Singapore 2026)
- CORE A (ICORE2026); CCF C (HCI and ubiquitous computing category)
