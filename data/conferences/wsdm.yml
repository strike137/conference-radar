notes:
- Selective ACM venue for web search, recommender systems and web/social data mining; full-paper acceptance usually
  below 20%
- Short paper track (4 pages) added in 2026 for the first time; WSDM 2027 also adds 'Findings of WSDM', decided
  within the main-track review and presented as posters
- Double-blind for PC and senior PC; associate chairs see author metadata
- WSDM 2027 is in Hong Kong in February; earlier Asian edition in Singapore (2023)
- In-person only; in 2026 every accepted paper also paid a presentation fee (150 USD full, 75 USD short/demo); in
  2027 an extra fee applies only when one registration covers several papers
