notes:
- Internet engineering conference for the Asia-Pacific region, run by intERLab at AIT (Thailand) and the WIDE
  Project (Japan); first held in 2005
- Rotates within Asia-Pacific (2022 Hiroshima, 2023 Hanoi, 2024 Sydney with SIGCOMM, 2025 Manila, 2026 Taipei at
  National Taiwan University)
- In cooperation with ACM SIGCOMM up to 2025, a SIGCOMM-sponsored ACM conference from 2026; proceedings in ACM DL
- Technical and position papers up to 8 pages in the 10pt ACM SIGCOMM format (references not counted), double-blind,
  submitted via the WIDE CFP system; separate poster track for students and young researchers
- Best paper student or early-career author gets an ACM SIGCOMM travel grant to attend SIGCOMM the following year;
  travel grants up to 800 USD for authors, aimed especially at Southeast and South Asia
- Small venue mixing academics and network operators; topics include measurement, developing regions, disaster
  networking, LEO satellites and network security
