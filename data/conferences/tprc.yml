notes:
- Long-running interdisciplinary conference (54th edition in 2026) on communications, information and Internet policy;
  welcomes legal, economic, social and technical research, including broadband, spectrum, privacy and cybersecurity
- Audience of academics, regulators (FCC), industry and civil society; paper, poster and panel sessions plus keynotes
- Papers are archived on SSRN under the TPRC series rather than in formal proceedings, so non-archival
- Pre-conference graduate student workshop (by invitation, free registration) and free tutorials
- Held every September in Washington, D.C. (American University Washington College of Law in 2025 and 2026)
- "Registration 2026: 175 USD student, 300 USD author/presenter, 475 USD academic (early rate)"
- Not listed in the CORE ICORE2026 portal
