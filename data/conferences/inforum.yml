notes:
- National Portuguese computer science symposium, aimed at bringing together the Portuguese community and giving young researchers a first venue
- Organized as independently run topic sessions selected each year, each with its own programme committee
- Full articles in Portuguese or English are reviewed by the topic committees; short communications, posters and demos are also accepted
- Accepted work appears in the proceedings in full or as a 2-page summary; papers use the Springer LNCS template but are not published by Springer
- Held at a different Portuguese university each year (Guarda 2022, Porto 2023, Lisboa 2024, Evora 2025, Caparica 2026)
- Not listed in the CORE portal (ICORE2026)
