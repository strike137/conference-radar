areas: [ai, nlp, vision]
region: south-asia
language: english
frequency: annual
organizer: Rotating Indian host institute (2026 IIT Kharagpur with APPCAIR and Dept of CSIS, BITS Pilani; 2025 BITS
  Pilani Hyderabad Campus)
organizer_country: [india]
proceedings: None
archival: false
