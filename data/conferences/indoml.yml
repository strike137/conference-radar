links:
  website: https://indoml.in/
notes:
- Indian national machine learning symposium built around 20+ invited talks from Indian and overseas researchers,
  plus student mentoring; started online in 2020, held every year since
- Hosts so far 2020 and 2021 virtual, 2022 IIT Gandhinagar, 2023 IIT Bombay, 2024 BITS Pilani Goa, 2025 BITS Pilani
  Hyderabad, 2026 IIT Kharagpur Kolkata Extension Centre
- No paper track; Graduate Forum (MTech/MS/PhD students in India) and Undergraduate Forum take 2-page extended
  abstracts with a signed faculty recommendation via Microsoft CMT, presented as posters and spotlight talks
- Graduate Forum accepts already published work as well as work in progress; top five presenters share INR 50,000
  in prizes and selected students get travel, meal and accommodation support
- Early Career Researcher Forum for postdocs, final-year PhD students abroad and early-career faculty (8-minute
  talks, Google Form application); also a datathon with an INR 200,000 prize pool, open to people based in India
- Not listed in the CORE ICORE2026 portal and not on the CCF list
- Graduate Forum is limited to students enrolled in India and the datathon to people based in India, so it is mainly
  useful for India-based labs
