notes:
- EAI conference on interdisciplinary ICT solutions for underserved areas; 2026 topics were AI, security and ICT
- Proceedings in Springer LNICST; accepted authors may submit extended versions to EAI Endorsed Transactions journals for a fee
- Meets annually in Africa (Abuja 2022, Flic en Flac 2023, Dakar 2024, Ouagadougou 2025, Abeokuta 2026); 2020 was virtual and the 2026 edition is hybrid
- Earlier editions as InterSol were held in Europe, Turkey, Mexico and the USA (2010 to 2016), then Kigali (2018) and Cairo (2019)
- Full papers 12 to 20 pages, short papers 6 to 11 pages, demo papers 1 to 5 pages in Springer format; anonymized submission via Confy+
- Not listed in ICORE2026
