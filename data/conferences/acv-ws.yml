notes:
- Workshop bridging abstract semantics (lattice and category theory, coalgebra, string diagrams) and concrete verification algorithms (model checking, theorem proving, probabilistic and quantum verification)
- First edition in 2026 at FLoC 2026 in Lisbon, affiliated with LICS 2026 and CAV 2026
- Organized by Ichiro Hasuo (NII Tokyo), Bart Jacobs (Radboud), Joost-Pieter Katoen (RWTH Aachen) and Sam Staton (Oxford)
- Calls for presentation proposals (typically 1-2 pages); already published work and work under review are welcome
- No formal proceedings; two-day program of invited and contributed talks
- Not listed in ICORE2026
