notes:
- Annual electronic packaging and electronics technology symposium held in Romania since the 1990s (32nd edition in 2026)
- Host city rotates within Romania (2021 Timisoara online, 2022 Bucharest, 2023 Craiova, 2024 Sibiu, 2025 Brasov, 2026 Targoviste)
- Two-page abstract submission first; authors of accepted abstracts then submit a full IEEE-format camera-ready paper
- Accepted papers are submitted to IEEE Xplore; papers must be presented (oral, poster or a limited number of online slots)
- Topics cover packaging, components, printed electronics, sensors, nanoelectronics, embedded systems, power electronics and reliability
- Includes an exhibition, workshops and a summit of IEEE EPS student branch chapters
- Not listed in ICORE2026
