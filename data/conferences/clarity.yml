notes:
- Workshop of the Clarity Project, which runs machine learning challenges for hearing aid speech-in-noise processing (enhancement and intelligibility prediction)
- Called Clarity Workshop on Machine Learning Challenges for Hearing Aids up to 2024; renamed for the 6th edition in 2025
- Accepts challenge papers and regular papers; 2025 hosted the 3rd Clarity Prediction Challenge (CPC3)
- Proceedings in the ISCA Archive with DOIs (10.21437/Clarity.2025); the 2024 virtual workshop has no ISCA Archive volume
- In-person editions are Interspeech satellites in Europe (Dublin 2023, Delft 2025 near Interspeech Rotterdam); the 2021, June 2022, December 2022 and 2024 editions were online
- Not listed in CORE ICORE2026 and not on the CCF list
