notes:
- Premier joint conference on automated reasoning, merging CADE, FroCoS and TABLEAUX (with ITP represented on the
  steering committee) in even years
- Biennial; CADE runs as a separate conference in the odd years
- Proceedings in Springer LNAI or LNCS (LNAI 14739 in 2024, LNCS 13385 in 2022)
- Often part of the Federated Logic Conference (FLoC 2018 Oxford, 2022 Haifa, 2026 Lisbon)
- Usually held in Europe (Coimbra 2016, Oxford 2018, Paris planned 2020 but online, Nancy 2024, Lisbon 2026)
- CORE A (ICORE2026)
