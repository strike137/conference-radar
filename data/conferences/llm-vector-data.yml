notes:
- Workshop on combining large language models with vector databases, RAG and AI agents, held with IEEE ICDE, so it moves with ICDE (2025 Hong Kong, 2026 Montreal)
- 2nd edition in 2026 as the "Agentic RAG Edition"; 1st edition at ICDE 2025
- Short papers up to 6 pages or long papers up to 12 pages in IEEE two-column format, references unlimited; single-blind review on CMT
- ICDE 2026 call for workshops says workshop proceedings are published jointly alongside the conference proceedings
- Co-chairs include Arijit Khan, Yuyu Luo, M. Tamer Ozsu and Danrui Qi
- Not listed in CORE ICORE2026 or in the CCF 2026 list
