id: iot-conf
name: IoT
full_name: International Conference on the Internet of Things
type: conference
tier: minor
areas: [networking, systems]
region: europe
language: english
frequency: annual
organizer: Host university each year (2026 National Edge AI Hub at Newcastle University; 2025 TU Wien), in cooperation with ACM
organizer_country: [europe]
proceedings: ACM DL (ACM ICPS)
indexing: [DBLP]
fee: 800 GBP non-member, 750 GBP ACM member, 700 GBP student for author registration (2026, early bird)
typical:
  deadline_months: [7, 8]
  conference_months: [11]
links:
  website: https://iot-conference.org/iot2026/
notes:
- Running since 2008 (biennial until 2014, annual since 2015); hosted by a different university each year, mostly in Europe (earlier editions also in the USA, Korea, China and Japan)
- Proceedings in the ACM International Conference Proceedings Series (ACM DL); workshop papers go into companion proceedings
- Double-blind review by at least three PC members; 8 pages in ACM sigconf format plus references
- Not listed in ICORE2026 or the CCF 2026 list
- Fully in-person; at least one author per paper needs a full (non-student) registration
- Not the IEEE iThings or IEEE WF-IoT, which are separate venues
