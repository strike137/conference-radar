notes:
- Community-run Japanese conference on functional programming across language communities (Haskell, OCaml, Scala, Elixir, F# and others)
- First held in June 2025; 494 attendees and 48 speakers at the 2025 edition according to the organizers
- Two days on a weekend at Nakano Central Park Conference, Tokyo
- Public call for session proposals via fortee with 10, 25 and 50 minute slots, in Japanese or English, up to three proposals per person
- Talks only; no papers or proceedings
- Not listed in the CORE ICORE2026 portal
