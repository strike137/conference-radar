notes:
- Workshop on synthetic data generation, privacy-preserving ML, drift and anomaly detection and responsible AI, co-located with ECML PKDD
- Held at ECML PKDD 2025 (Porto, 15 September 2025) and ECML PKDD 2026 (Naples, 11 September 2026)
- 2026 deadlines are 11:59 pm Pacific Time; 2025 deadlines were AoE
- Submissions via Microsoft CMT
- Authors can opt in or out of the joint ECML PKDD post-workshop proceedings (Springer CCIS in 2026)
- At least one author of each accepted paper must register for the full conference by the early registration deadline and present
- Not listed in CORE ICORE2026
