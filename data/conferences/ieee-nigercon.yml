language: english
organizer: IEEE Nigeria Section
organizer_country: [other]
proceedings: IEEE Xplore
archival: true
fee: 80,000 NGN early author registration for IEEE members, 120,000 NGN non-members (2026)
typical:
  deadline_months: [8]
  conference_months: [11]
links:
  website: https://attend.ieee.org/nigercon-2026/
notes:
- International conference of the IEEE Nigeria Section; the theme and full name change by edition (Disruptive
  Technologies for Sustainable Development 2022, Electro-Computing for Sustainable Development 2024, Digital
  Transformation 2026)
- Broad scope with over 20 tracks (AI, 5G/6G, wireless sensor networks, IoT, cybersecurity, data science, energy,
  fintech, policy)
- Papers up to 5 pages in IEEE double-column format via EasyChair, reviewed by at least two reviewers; papers
  passing CrossCheck (similarity up to 20%) go to IEEE Xplore
- Held in Nigeria (Ado-Ekiti 2024 at Afe Babalola University, Lagos 2026 at University of Lagos)
- Not listed in CORE ICORE2026 or the CCF list
