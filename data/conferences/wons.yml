links:
  website: https://wons-conference.org/
notes:
- IFIP conference on wireless networking, technically co-sponsored by IEEE and IEEE ComSoc; held since 2004
- Small winter conference in Alpine ski resorts (Madonna di Campiglio 2023, Chamonix 2024, Hintertux 2025, Crans-Montana
  2026, Cortina d'Ampezzo 2027); 2021 and 2022 were online
- Accepted papers submitted to IEEE Xplore; selected papers invited to a special issue of Elsevier Computer Communications
- Long papers up to 8 pages, short papers up to 4 pages, posters up to 2 pages; single-blind review via EDAS
- Not listed in CORE ICORE2026
