notes:
- Biennial symposium of the SBC computer music interest group (CECM); 19th edition in 2025
- Topics include machine learning and AI for music, music information retrieval, audio signal processing, sound synthesis, spatial audio and computational musicology
- Full papers 6 to 8 pages, written and presented in English, double-blind review
- All accepted works are published in the SBCM proceedings and in the SBC Open Library (SOL)
- Selected papers invited to submit extended versions to the Brazilian journal Musica Hodie
- Also has calls for performances, installations and posters (SBCM Festival), held together with ENCM
- 2025 edition hosted by NICS at UNICAMP, Campinas, Brazil
- "Registration 2025: 150 to 848 BRL depending on category and SBC membership"
- Not listed in CORE ICORE2026 or the CCF 2026 list
