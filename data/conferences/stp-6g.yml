notes:
- Workshop co-located with IEEE GLOBECOM; 5th edition in Taipei (2025), 7th edition in Macau (2026)
- Run by the EU COST Action CA22168 6G-PHYSEC (physical layer security for trustworthy and resilient 6G systems)
- Steering committee from TU Dresden, ENSEA, TU Braunschweig and Polytechnique Montreal
- Topics include physical layer security, PHY authentication and key agreement, covert communications, ISAC
  security, post-quantum security and AI-based security for wireless systems
- Accepted and presented papers go into the IEEE GLOBECOM workshop proceedings in IEEE Xplore; in-person
  presentation required (no-show papers removed)
- Submissions via EDAS through the GLOBECOM workshop call
- Not listed in ICORE2026
