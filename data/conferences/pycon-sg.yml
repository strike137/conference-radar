notes:
- Community conference for the Python programming language in Singapore, run by the Python User Group Singapore with PyLadies Singapore
- 2025 edition was co-organized with the Singapore Institute of Technology and held at its Punggol Campus
- 2026 edition ran three days at the Lifelong Learning Institute near Paya Lebar MRT, with talks, workshops and a hackathon
- PythonAsia 2027 will be held in Singapore with the Python User Group Singapore as co-organizer
- No proceedings; practitioner talks only
