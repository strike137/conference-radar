notes:
- Workshop on language processing for patients and the public, such as consumer health question answering, text simplification and patient-facing summaries of health records
- Started at LREC-COLING 2024 (Turin), then NAACL 2025 (Albuquerque) and LREC 2026 (Palma, Mallorca)
- Proceedings in the ACL Anthology (2026 volume published by ELRA)
- Full papers 8 pages, short papers 4 pages, anonymous submission via Softconf START
- Hosts several shared tasks (CT-DEB'26, CRF filling, ArchEHR-QA 2026 and FoodBench-QA 2026 in 2026)
- Remote participation possible at a remote registration rate
- Not ranked in ICORE2026 and not on the CCF list
