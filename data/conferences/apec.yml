id: apec
name: IEEE APEC
full_name: IEEE Applied Power Electronics Conference and Exposition
type: conference
tier: minor
areas: [communications]
region: north-america
language: english
frequency: annual
organizer: IEEE Power Electronics Society (PELS), IEEE Industry Applications Society (IAS) and the Power Sources Manufacturers Association (PSMA)
organizer_country: [international, usa]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [8]
  conference_months: [3]
links:
  website: https://apec-conf.org/
notes:
- Leading applied power electronics conference, held since 1986; sponsored by IEEE PELS, IEEE IAS and PSMA
- Always in the United States, usually in March (2022 Houston, 2023 Orlando, 2024 Long Beach in late February, 2025 Atlanta,
  2026 San Antonio, 2027 New Orleans, 2028 Phoenix)
- Peer-reviewed digests are submitted first; accepted papers go into lecture or dialogue (poster) technical sessions
  and are published in IEEE Xplore
- At least one author must register by the manuscript deadline or the paper is withdrawn
- Practitioner oriented, with industry sessions (presentation only, no paper), professional education seminars and a
  large exhibition
- More than 570 technical session papers in 2026
- Not listed in ICORE2026 (CORE portal) and not on the CCF list
