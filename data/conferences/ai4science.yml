notes:
- Workshop series on AI and ML for scientific discovery (physics, chemistry, biology, materials, climate, math), with a new theme each edition
- "Editions: NeurIPS 2021, ICML 2022, NeurIPS 2022, NeurIPS 2023, ICML 2024, NeurIPS 2025, ICML 2026 (Seoul), NeurIPS 2026 (8th); an ICLR 2027 edition is announced"
- Non-archival; accepted papers stay eligible for later archival venues
- Papers 4-8 pages plus unlimited appendices in the host conference template, double-blind review on OpenReview; research and position tracks
- Also runs dataset and AI scientist proposal competitions; ICML 2026 offered an optional journal route
- Not the IJCAI AI for sustainability workshop (ai4s-ijcai)
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
