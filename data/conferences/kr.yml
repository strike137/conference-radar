notes:
- Leading forum on knowledge representation and reasoning, run by KR Inc. (active since 1989)
- Open access proceedings at proceedings.kr.org with an ISSN and ISBN, published by the IJCAI Organization
- Annual; rotates worldwide and is often co-located (FLoC 2026 in Lisbon, with ICAPS and CPAIOR in Melbourne 2025)
- Main track plus special tracks (KR in the Wild, KR meets Machine Learning and Explanation in 2026), a Recently
  Published Research track, a Video track, workshops and a Doctoral Consortium
- Deadline month varies with the conference date (February for July 2026, May for November 2025)
- "Acceptance rate: 24.4% in 2026 (112 of 459 submissions)"
