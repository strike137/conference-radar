notes:
- RF, microwave and millimeter-wave components, circuits, antennas and wireless systems (physical layer)
- Technically sponsored by IEEE MTT-S and the CIE Microwave Society; organized by Chinese host universities as part of China Microwave Week
- Always held in China (2021 Nanjing, 2022 Harbin, 2023 Qingdao, 2024 Beijing, 2025 Xi'an, 2026 Shenzhen)
- 3-page anonymous paper submissions; presented papers go to IEEE Xplore
- Authors can submit extended versions to an IEEE T-MTT mini special issue on IWS
- Not listed in the CORE portal (ICORE2026); RF and microwave engineering venue outside the usual CS rankings
