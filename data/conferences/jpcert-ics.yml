notes:
- One-day practitioner conference on industrial control system (ICS/OT) security, run by JPCERT/CC since 2009 (2026 was
  the 18th)
- Co-hosted by the Ministry of Economy, Trade and Industry, with IPA, JIPDEC, SICE, JEITA, CSSC and others as supporters
- Talks and panels by invited speakers from industry, government and JPCERT/CC; no open call for papers or proposals
- Held in Tokyo every February (2024 online only, 2025 hybrid, 2026 venue only with a later archive stream)
- Slides and YouTube recordings of most talks published after the event; no papers or proceedings
- Not the same venue as JSAC (JPCERT/CC Japan Security Analyst Conference)
