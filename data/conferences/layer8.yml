notes:
- Describes itself as the first conference solely focused on social engineering and OSINT
- Run by Layer 8 Conference, a 501(c)(3) nonprofit incorporated in Rhode Island and created by Patrick Laverty
- Held in June at the George Sherman Union, Boston University, Boston, Massachusetts
- Two tracks of talks plus keynotes, pre-conference trainings and a CTF; grew from one day (2025) to two days (2026)
- Talk videos are posted on the conference YouTube channel; no proceedings
