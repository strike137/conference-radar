links:
  website: https://ifipaiai.org/2026/workshops/mhdw
notes:
- Co-located workshop of the IFIP WG 12.5 AIAI conference (see ifip-aiai); accepted papers appear in the AIAI workshops volumes in Springer IFIP AICT
- 14th edition with AIAI 2025 in Limassol, 15th edition with AIAI 2026 in Chania, Crete
- Topics are AI, data mining and knowledge discovery applied to humanistic data (linguistic, historical, behavioral, educational, social, music, bioinformatics)
- At least two reviewers per paper; organizers expect 15 to 20 submissions and accept about the top 50%
- Papers follow the AIAI format guidelines (IFIP AICT format) and are submitted through the AIAI CMT site
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
