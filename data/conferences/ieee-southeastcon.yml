notes:
- Annual technical, professional and student conference of IEEE Region 3 (southeastern United States)
- Rotates among cities in the southeastern USA (Orlando 2023, Concord NC 2025, Huntsville 2026, Daytona Beach 2027)
- Regular papers up to 6 pages (up to 8 with a fee of 100 USD per extra page) and 2-page extended abstracts for posters
- Double-blind, rolling review; early submissions can be reviewed up to two times before the final deadline
- Accepted papers go to IEEE Xplore only if at least one author is fully registered and presents
- Includes student competitions alongside the technical program; broad EE and CS scope
- Not listed in the CORE ICORE2026 portal
