notes:
- Official affinity workshop of LatinX in AI, co-located with CVPR
- LatinX in AI is volunteer-run and fiscally sponsored by the Accel AI Institute, a US 501(c)(3) nonprofit
- 2026 offered only non-archival extended abstracts (up to 4 pages, double-blind) plus an undergraduate consortium
- 2025 also had an 8-page full paper track published in the CVPR Workshops proceedings
- Accepts work in progress, previously published work and computer vision applications for Latin America
- Everyone may attend, with a focus on researchers who identify as Latinx
- Not listed in ICORE2026 or the CCF list
