notes:
- 'Biennial (odd years) IAPR pattern recognition conference rotating in Asia-Pacific: Auckland 2019, Jeju 2021,
  Kitakyushu 2023, Gold Coast 2025'
- Proceedings in Springer LNCS; single-blind review; up to 15 pages in LNCS format
- About half of submissions accepted in 2025 (60/118); workshops and tutorials on the first day
- Covers pattern recognition, computer vision, speech and signal processing, document and media processing
- Not ranked in CORE or CCF
