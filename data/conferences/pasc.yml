links:
  website: https://pasc-conference.org/
notes:
- Interdisciplinary conference on scientific computing and HPC, bringing together domain scientists, applied
  mathematicians and computer scientists; started in 2014
- Co-sponsored by ACM and the Swiss National Supercomputing Centre (CSCS), which manages it
- Held in Switzerland every year (Basel 2022, Davos 2023, Zurich 2024, Windisch 2025, Bern 2026, Lugano 2027)
- Papers program with revision and rebuttal stage (provisional acceptance); papers up to 10 pages plus references in
  ACM sigconf format, published in the Proceedings of the PASC Conference in the ACM DL
- Most of the program is minisymposia and posters (including an ACM Student Research Competition), each with its own
  deadlines
- Not listed in CORE (ICORE2026) or the CCF 2026 list
