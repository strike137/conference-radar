notes:
- Biennial conference of the German KuVS group (anchored in GI and VDE ITG), successor of KiVS (since 1979)
- Always held in Germany (Stuttgart 2013, Cottbus 2015, Goettingen 2017, Munich 2019, Luebeck 2021, Potsdam 2023,
  Ilmenau 2025)
- Since 2021 held in September with the ITG "Future of Networking" (ZdN) symposium and the KuVS general meeting
- Focus on community networking; calls for 4-page extended abstracts (ongoing work) and hot topic papers
  (summaries of work already published at top venues), plus demos, tutorials, PhD forum and co-located workshops
- Non-archival in 2025; the call says "no proceedings" and accepted abstracts appear only as informal
  proceedings; the KuVS site links earlier NetSys proceedings in IEEE Xplore
- Not listed in CORE ICORE2026 or in the CCF 2026 list
