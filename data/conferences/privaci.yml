notes:
- Interdisciplinary symposium on privacy as contextual integrity, run by the non-profit PrivaCI Institute; steering committee includes Helen Nissenbaum
- Earlier editions were called the Annual Symposium on Applications of Contextual Integrity; renamed PrivaCI Symposium from the 7th edition (2025)
- Accepts 4-page position papers on work in progress, extended abstracts, and 1-page use case or case study descriptions in the ACM template
- No formal proceedings; accepted submissions may be posted on the website but are not archival
- Single-blind peer review by the program committee
- Mostly held in the USA and Canada (Toronto 2023, New Jersey 2024, Brussels 2025, UIUC 2026, Quebec City 2027)
- Registration fee 150 USD (2026), including meals
