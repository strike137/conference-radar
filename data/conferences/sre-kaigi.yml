notes:
- Community-run Japanese practitioner conference on site reliability engineering; separate from SRE NEXT
- First held in January 2025; the 2027 edition is the third
- One day on a weekend at Nakano Central Park Conference, Tokyo, in person with some sessions streamed online
- Talk proposals (30 min sessions) via fortee, plus a later short session call; no papers or proceedings
- Talks in languages other than Japanese are allowed but there is no simultaneous interpretation
- Three tracks (hall of about 160 seats and two rooms of about 70); one accepted session per person
- Co-hosted Cloud Native Kaigi in Nagoya in May 2026 with CloudNative Days and Platform Engineering Kaigi
