links:
  website: https://www.htw-dresden.de/hochschule/aktuelles/veranstaltungen/open-identity-summit/call-for-papers
notes:
- Small European venue on digital identity, identity management, privacy and trust services; the 2026 edition is
  the 13th
- Mixed academic, industry and public administration audience; many program committee members from German
  institutes, companies and agencies
- Full papers up to 12 pages plus references, short papers up to 8 pages; double-blind review via EasyChair
- Proceedings in the GI-Edition Lecture Notes in Informatics (2026 is LNI P-381), open access in the GI Digital
  Library and indexed in Scopus
- Not listed in the CORE ICORE2026 portal
