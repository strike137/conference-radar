notes:
- Biennial ACM SIGEVO conference on the theory of evolutionary algorithms and other randomized search heuristics, running since 1990
- Small single-track meeting over three days; 2025 was the 18th edition (FOGA XVIII)
- Proceedings published by ACM Press; papers up to 12 pages including references in ACM sigconf format
- Double-blind review without rebuttal; submission via Linklings
- Mostly held in Europe (Aberystwyth 2015, Copenhagen 2017, Potsdam 2019, Dornbirn 2021, Potsdam 2023, Leiden 2025)
- CORE A (ICORE2026); not on the CCF list
