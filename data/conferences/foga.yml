notes:
- Premier venue for the theory of evolutionary computation and randomized search heuristics (runtime analysis, fitness landscapes, benchmarking, algorithm configuration)
- Started in 1990; biennial in odd years since 2005 (three-year gap between 2002 and 2005); recent editions all in Europe (Aberystwyth 2015, Copenhagen 2017, Potsdam 2019, Dornbirn 2021, Potsdam 2023, Leiden 2025)
- Single-track; proceedings published by ACM
- CORE A (ICORE2026); not checked on the CCF list
