notes:
- Organized by IARIA as part of the SoftNet congress, co-located with ICSEA, ICSNC, CENTRIC and other IARIA events (19th edition in 2027)
- Called International Conference on Advances in System Simulation up to 2023; renamed for the 16th edition in 2024
- Published open access in the IARIA ThinkMind library (ISSN 2308-4537); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in southern Europe (Barcelona, Lisbon, Valencia, Venice, Porto in recent years); onsite and online participation offered
- Not the same venue as SIMULTECH (INSTICC)
