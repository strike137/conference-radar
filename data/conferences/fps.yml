id: fps
name: FPS
full_name: International Symposium on Foundations and Practice of Security
type: conference
tier: minor
areas: [security]
region: worldwide
language: english
frequency: annual
organizer: 'Canadian and French institutions in alternation (2025: IMT Atlantique, Brest; 2026: Université du Québec
  en Outaouais)'
organizer_country: [canada, europe]
proceedings: Springer LNCS
indexing: [Scopus, DBLP]
rank:
  core: Unranked
acceptance_rate: About 51% (2025, 46/91 including 8 short papers; 38 full papers)
fee: 850 CAD (2026, early author regular; 200 CAD student non-author)
typical:
  deadline_months: [7, 9]
  conference_months: [10, 11, 12]
links:
  website: https://fps2026.uqo.ca/
  dblp: https://dblp.org/db/conf/fps/index.html
  wikicfp: http://www.wikicfp.com/cfp/program?id=1085
notes:
- Annual since 2008, alternating between Canada and France
- Proceedings in Springer LNCS; double-blind review; full papers up to 20 pages, short/position/demo papers up to
  12; papers not presented on site are excluded
- Has an industrial track and an industrial forum; 2026 special topic is security and privacy of AI systems
- Poster call aimed at students and early-stage researchers (500-word abstract, 1,000 CAD best poster award in 2026)
- Not ranked in ICORE2026 (some deadline trackers still list it as CORE B, which is outdated); the 2026 deadline
  was extended from July 20 to July 31
