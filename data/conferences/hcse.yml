notes:
- Biennial single-track working conference of IFIP WG 13.2 on the link between software engineering, HCI and AI
- Proceedings in Springer LNCS
- Held in Europe; 2024 Reykjavik (10th edition), 2026 Paderborn (11th edition, co-located with IEEE VL/HCC)
- Full papers up to 20 pages and late-breaking results papers up to 12 pages, reviewed double-blind; also demos, posters and a PhD discussion forum
- "HCSE 2026 proceedings: 11 full papers and 4 demo and poster papers selected from 29 submissions"
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
