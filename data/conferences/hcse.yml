notes:
- Small single-track working conference of IFIP Working Group 13.2 on human-centered design as part of software engineering
- Held every two years; 11th edition in 2026
- HCSE 2026 was co-located with IEEE VL/HCC 2026 at Paderborn University, Germany
- Proceedings in Springer LNCS (2026 is LNCS volume 16992)
- Full papers and late-breaking results reviewed double-blind; also demos, posters and a PhD discussion forum
- Not ranked by CORE (not found in ICORE2026) and not on the CCF list
