notes:
- Software development conference for developers, engineers and architects, held in Vilnius, Lithuania
- Run by the Lithuanian company UAB Sprigis; 2026 is the 15th Build Stuff in Lithuania
- 2026 theme is The Age of Agency (AI agents, architecture, safety and delivery); about 85 speakers across six stages
- Onsite in Vilnius with an online ticket option; no papers or proceedings
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
