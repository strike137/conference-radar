notes:
- Community-driven Security BSides cybersecurity conference in Jaipur, Rajasthan, India
- First edition (0x01) in 2024 was fully virtual; no edition in 2025; the third edition (0x03) in 2026 was the first in person
- 2026 edition was two days with two tracks of talks, panels, a CTF and villages (bug bounty, IoT, quiz), plus a free online pre-event workshop
- Talks are selected by a program review board of industry practitioners; no proceedings
- Ticket tiers for students, individuals and corporate attendees
