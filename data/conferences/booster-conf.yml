notes:
- Non-profit software conference "for the whole team" (developers, testers, UX, architects, project managers, security), run by the Norwegian association Foreningen Boosterkonferansen
- Held at Radisson Blu Bryggen in Bergen, Norway, over three days in March
- Hands-on workshops fill most of the program, plus lightning talks, experience reports, keynotes and open spaces
- Open call for presentations with three formats (workshops of 1.5 to 3 hours, 10 minute lightning talks, 30 minute experience reports)
- Accepted speakers get a free ticket and can apply for travel and accommodation reimbursement
- Talks in English and Norwegian; no papers or proceedings, accepted talks are recorded and published
