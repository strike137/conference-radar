links:
  website: https://ai4sys.github.io/
notes:
- Half-day workshop co-located with ACM HPDC, held on the HPDC workshop day since 2023
- Topics are AI for system management and monitoring of HPC and cloud systems (I/O prediction, log analysis, scheduling, storage)
- Papers up to 5 pages in ACM format (excluding references); single-blind review
- Accepted papers appear in the ACM proceedings (ACM DL); 2026 papers are in the HPDC 2026 proceedings volume
- Follows HPDC's location (Orlando 2023, Pisa 2024, Notre Dame 2025, Cleveland 2026)
- Not listed in the ICORE2026 portal
