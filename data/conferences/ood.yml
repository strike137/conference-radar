notes:
- Tech conference on networking, cloud and AI organized by an executive committee with the Okinawa Open Laboratory
  as secretariat; started in 2013, OOD2026 is the 14th edition
- Held in early December in Naha at the Okinawa municipal hall (Shichoson Jichi Kaikan); 813 onsite participants
  in 2025
- Keynotes, panels, sponsor booths and Okinawa Open Laboratory research presentations; also a venue network building
  program for young engineers, a young engineers LT challenge and co-located community events
- No paper submission; no live streaming in 2025 or 2026
