notes:
- Longest-running IEEE-sponsored peer-reviewed conference in Bangladesh, held every year since 1998 (grew out of
  NCCIS 1997 at the University of Dhaka); historically hosted by different Bangladeshi universities
- Organized by the IEEE Bangladesh Section since at least 2024; 2024 to 2026 editions held in December at Long Beach
  Hotel, Cox's Bazar, with virtual joining links for online presenters
- Broad computer and electrical engineering scope with ten tracks, including AI/ML, cyber security and blockchain,
  and communication and networking
- Max 6 pages including references (2025); one author registration covers one paper; foreign authors can get a travel
  grant of up to 75 USD
- Not to be confused with the CORE-ranked IEEE CIT (IEEE International Conference on Computer and Information Technology,
  CORE C)
