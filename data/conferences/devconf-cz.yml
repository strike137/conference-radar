notes:
- Annual, free, Red Hat-sponsored conference for users, operators and contributors to free and open source technologies
- Held every June in Brno, Czech Republic, at the Faculty of Information Technology of Brno University of Technology (FIT BUT)
- Hybrid event, but all presentations are delivered in person
- Formats are 35 minute talks, 15 minute lightning talks, 80 minute workshops and meetups, booths and activities
- Proposals go through blind review by per-track committees, then track captains and the CfP committee decide
- About 25% acceptance rate for talks (FAQ); speakers from Europe, the Middle East and Africa are prioritized
- Visa invitation letters available for accepted speakers and registered attendees
- No papers or proceedings; practitioner talks only
