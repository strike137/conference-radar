notes:
- Flagship annual conference of IEEE Canada covering all of electrical and computer engineering in twelve main tracks
  (communications and networking, ML and AI, signal processing, power, control, and more)
- Accepted and presented papers go into the CCECE proceedings and are submitted to IEEE Xplore
- Papers up to 6 pages, extendable to 8 pages with overlength charges; peer reviewed; poster abstract track
- Selected papers are invited to an extended version in the IEEE Canadian Journal of Electrical and Computer
  Engineering
- Held in Canada every year (39th edition in Montreal in 2026); best student paper award
- Not ranked in CORE (ICORE2026)
