id: ceqip
name: CEQIP
full_name: Central European Quantum Information Processing Workshop
type: conference
tier: minor
areas: [general]
region: europe
language: english
frequency: annual
organizer: QUTE.sk (Slovak National Center for Quantum Technologies), Research Center for Quantum Information (Bratislava) and Cyber Security Hub (Brno)
organizer_country: [europe]
proceedings: None (book of abstracts)
archival: false
fee: 650 EUR double room, 870 EUR single room, including accommodation, meals and social program (2026)
typical:
  deadline_months: [4, 6]
  conference_months: [6, 7, 9]
links:
  website: http://ceqip.eu/
notes:
- Small residential workshop on mathematical and computational aspects of quantum information and quantum technologies
- Held in small towns in Czechia and Slovakia (Smolenice, Skalica, Valtice, Mikulov); held since 2004 and CEQIP 2026 was the 21st (2020 cancelled)
- Contributed talks and posters selected by a selection committee from abstracts (2026 -> 43 talk and 10 poster submissions); invited speakers each year
- Only a book of abstracts; no paper proceedings
- Participation is limited; the fee covers all local expenses and a strong social program (wine tasting, cipher game)
- Not listed in ICORE2026 or the CCF list
