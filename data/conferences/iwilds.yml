notes:
- Search as Learning workshop on how people learn during web search, RAG and conversational AI, bridging IR, user modeling and learning sciences
- Host conference changes each year (CIKM 2020 and 2021, SIGIR 2022, CHIIR 2023, WSDM 2025 in Hannover, CIKM 2026 in Rome)
- Until 2025 named International Workshop on Investigating Learning During Web Search; "AI-Mediated Information Access" added in 2026
- 2026 proceedings to be submitted to CEUR Workshop Proceedings
- 2025 submission deadline was extended from 13 January to 20 January 2025
- Long papers 12 to 18 pages and short papers 5 to 9 pages plus references, CEUR-WS format, double-blind review via EasyChair
- Not listed in CORE ICORE2026 or the CCF 2026 list
