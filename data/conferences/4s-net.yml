notes:
- Half-day workshop co-located with CNSM; first edition in 2026 (Alcala de Henares (Madrid), Monday Oct 26 afternoon)
- Topics are trade-offs between sovereignty, security, resilience and sustainability in networks (resource optimization, protection, energy efficiency, traffic engineering)
- 2026 program had a keynote and ten papers in two sessions
- CNSM 2026 workshop papers are submitted to IEEE Xplore together with the conference proceedings
- Not listed in CORE ICORE2026 or the CCF list
