notes:
- Workshop of the IEEE International Conference on Blockchain and Cryptocurrency (ICBC) on blockchain interoperability; 5th edition in 2026
- Accepted papers appear in the ICBC proceedings, IEEE Xplore and EI
- Double-blind review with a rebuttal period, submission via EDAS
- Regular papers up to 6 pages, short papers 4, posters 2 and SoK papers 16 (excluding references), IEEE two-column
- Topics include cross-chain bridges and their security, ZK bridges, message passing, cross-chain MEV and measurement studies
- Not listed in CORE ICORE2026 or the CCF list
