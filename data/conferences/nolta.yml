id: nolta
name: NOLTA
full_name: International Symposium on Nonlinear Theory and Its Applications
type: conference
tier: minor
areas: [general, ai, communications]
region: worldwide
language: english
frequency: annual
organizer: IEICE NOLTA Society
organizer_country: [japan]
proceedings: NOLTA symposium proceedings
fee: 90,000 JPY regular non-member early, 75,000 JPY NLS/KMMS/KICS members early, 65,000 JPY student non-member early
  (2026)
typical:
  deadline_months: [4, 5]
  conference_months: [10, 11]
links:
  website: https://nolta2026.org/
notes:
- Run by the IEICE NOLTA Society (Japan); member rates also apply to KMMS and KICS (Korea) members
- Topics cover chaos and bifurcation, synchronization, neural networks and deep learning, evolutionary computation,
  nonlinear circuits, control, communication networks, signal processing and complex networks
- Papers up to 4 pages (A4, two columns); special session papers may be a 1-page summary, but a 4-page paper is
  needed for student paper awards
- ORCID iDs of all authors are required for publication in the symposium proceedings
- Held in Okinawa, Japan in 2025 and Grenoble, France in 2026; held in October or November
- The International Workshop on Complex Communication and Multimedia Sciences (CCMS) is held in conjunction, with
  the Korea Multimedia Society
- Not listed in ICORE2026 or the CCF list; nonlinear science venue outside the usual CS rankings
- NOLTA 2025 Best Student Paper Award winners were exempted from NOLTA 2026 participation fees
