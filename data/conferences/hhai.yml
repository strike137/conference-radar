notes:
- Conference series on AI systems that work with humans rather than replace them; started in 2022 in Amsterdam
- Proceedings in the IOS Press FAIA series, open access under CC BY-NC
- Held in Europe (Amsterdam 2022, Munich 2023, Malmo 2024, Pisa 2025, Brussels 2026, Oulu 2027)
- Single-track, in-person; double-blind review with at least three reviewers per paper
- Paper types are full papers (12 pages), blue sky and working papers (8 pages), and 3-page extended abstracts of published journal articles
- Interdisciplinary scope covering AI, HCI, cognitive and social sciences, ethics and law
- Not ranked in CORE ICORE2026
