notes:
- Run by Universidad UTE in Quito, Ecuador, co-organized with Universidad de Alicante (Spain)
- Editions 2016 to 2019, then a gap; revived as the 5th edition in 2026 ("Mechatronics edition")
- Proceedings by IEEE Conference Publishing Services (CPS), sent to IEEE Xplore; 2018 and 2019 proceedings in IEEE CSDL
- Papers in English, IEEE format, 4 to 8 pages; double-blind review with at least two reviewers
- Tracks on mechatronics, robotics, intelligent systems, software engineering, cybersecurity, HPC, embedded systems and HCI
- Best papers invited to extended versions in the Enfoque UTE journal
- Deadlines in Ecuador time (GMT-5); pre-congress sessions the day before the conference
- Not listed in the CORE ICORE2026 portal
