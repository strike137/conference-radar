notes:
- Working conference of IFIP WG 8.1 on enterprise modeling, linking academic researchers and practitioners from industry and the public sector
- Topics include enterprise modeling languages and ontologies, business process modeling, enterprise architecture, model-based software engineering and digital twins
- Main track proceedings in Springer LNBIP (2025 -> LNBIP 570); joint volume for the Forum, Doctoral Consortium, Business Case and Tool Forum and workshops in CEUR-WS (2025 -> Vol-4171)
- Full papers up to 15 pages in LNBIP format (excluding references), at least three reviewers, submitted via EasyChair
- Selected papers invited to an extended special section in the SoSym journal (Springer)
- Recent editions Vienna 2023, Stockholm 2024, Geneva 2025, Mytilene (Lesvos, Greece) 2026; held in early December
- "ICORE2026 label: unranked: not primarily CS"
