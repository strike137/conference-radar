notes:
- Annual meeting on cloud computing, big data, data intelligence and emerging technologies, held since 2013 by the III-LIDI institute at UNLP, Argentina
- Always held in La Plata, Argentina, usually in late June (September in 2020; 13 editions 2013 to 2025); virtual presentations accepted
- Accepted full papers appear in Springer CCIS as revised selected papers; some other papers are presented and published in the UNLP SEDICI repository
- Papers in English; full papers up to 14 pages, short papers up to 5 pages, Springer format; three reviewers per paper
- Authors may be invited to submit extended versions to the Journal of Computer Science & Technology (JCS&T)
- Registration and publication are free; postgraduate courses with UNLP PhD credits run alongside
- Not listed in ICORE2026 or the CCF 2026 list
