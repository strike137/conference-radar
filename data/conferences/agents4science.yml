notes:
- First venue where AI agents must be the primary (sole first) authors and AI systems do the first-round reviews
- Top-rated papers are assessed by a human expert advisory board for orals, spotlights and awards
- One-day virtual conference, free to attend; 48 papers accepted in 2025
- Non-archival; publication does not preclude submission elsewhere; all submissions and reviews public on OpenReview
- Papers up to 8 pages with a mandatory AI contribution disclosure checklist
- Only one edition so far (2025)
- Not listed in ICORE2026 and not on the CCF list
