id: slavic-nlp
name: Slavic NLP
full_name: Workshop on Slavic Natural Language Processing
type: workshop
tier: minor
areas: [nlp, ai]
region: europe
language: english
frequency: biennial
organizer: ACL SIGSLAV (Special Interest Group on Slavic NLP); co-located with ACL or EACL
organizer_country: [europe]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [1, 5]
  conference_months: [3, 5, 7]
links:
  website: https://bsnlp.cs.helsinki.fi/
notes:
- Workshop on NLP for Slavic languages, run by ACL SIGSLAV; formerly BSNLP (Balto-Slavic NLP), held since 2007
- Every two years, co-located with ACL or EACL (EACL 2021 Kyiv, EACL 2023 Dubrovnik, ACL 2025 Vienna, EACL 2027 Athens);
  hybrid participation possible
- Proceedings in the ACL Anthology (28 papers in 2025, 22 in 2023)
- Long papers up to 8 pages and short papers up to 4 pages; ARR-reviewed papers can be committed
- Hosts shared tasks (persuasion techniques and disinformation detection in 2027) and the PolEval campaign in 2027
- Not listed in ICORE2026 and not on the CCF list
