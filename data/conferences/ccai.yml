id: ccai
name: CCAI
full_name: Chinese Congress on Artificial Intelligence
name_local: 中国人工智能大会
type: conference
tier: domestic
areas: [ai]
region: china
language: chinese
frequency: annual
organizer: CAAI (Chinese Association for Artificial Intelligence)
organizer_country: [china]
proceedings: None (no call for papers, keynotes and topical forums only)
archival: false
fee: 2000 CNY CAAI member, 2500 CNY regular (2026, early bird); 2500 / 3000 CNY after Nov 20; 1500 CNY CAAI student member
typical:
  conference_months: [11, 12]
links:
  website: https://ccai.caai.cn/
notes:
- National AI congress of CAAI (Chinese Association for Artificial Intelligence), started in 2015
- 'Format: keynotes and half-day topical forums proposed by CAAI branches and member institutions; no paper submission'
- 2026 edition runs together with the national annual meeting of deans of AI schools and departments
- Held in a different Chinese city each year (Chengdu 2021, Changsha 2022, Fuzhou 2023, Beijing 2024 and 2025,
  Chengdu 2026)
- CAAI's international conference with archival papers is CICAI
- Not listed in the CORE ICORE2026 portal or the CCF list
