notes:
- Long-running European series (since 1987) on knowledge engineering, ontologies, knowledge graphs and semantic web
- Held every two years since 2000 (2000, 2002, ... 2022, 2024, 2026), alternating with K-CAP
- Accepted papers published by Springer in an LNAI volume
- Research and in-use papers up to 15 pages, vision papers up to 8 pages; single-blind review
- Almost always held in Europe (Bolzano 2022, Amsterdam 2024, Turin 2026)
- CORE B (ICORE2026)
