notes:
- CVPR workshop on computer vision and machine learning for Earth observation (satellite, aerial, UAV, SAR, LiDAR and hyperspectral
  data)
- Editions in 2015, 2017 and every year since 2019, all held with CVPR
- Accepted papers go into the CVPR workshop proceedings (CVF Open Access, and IEEE Xplore if they meet IEEE policies)
- 24 papers in the CVPR 2026 workshop proceedings, 22 in 2025
- Double-blind review, 8 pages excluding references in the EarthVision template, submitted through Microsoft CMT
- Deadlines are end of day AoE
- Not listed in ICORE2026 or the CCF list
