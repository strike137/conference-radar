notes:
- Workshop on computational modeling of language acquisition and change, comparing language models with human language
  learners
- First edition held with ACL 2026 in San Diego on 2026-07-04
- Short (4 pages) and full (8 pages) papers in ACL format via OpenReview; ARR commitments also accepted
- Optionally archival; archival papers in the ACL Anthology (10 papers in 2026), other accepted papers non-archival
- Interdisciplinary audience (machine learning, computational linguistics, cognitive science, developmental psychology)
- Not listed in ICORE2026 and not on the CCF list
