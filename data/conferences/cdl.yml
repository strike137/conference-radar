notes:
- Workshop on computational modeling of language acquisition and language change in humans and language models
  (learning dynamics, first and second language acquisition, idiolect change, developmental diagnostics)
- First edition on July 4, 2026, co-located with ACL 2026 in San Diego, USA
- Optionally archival; archival papers appear in the ACL Anthology (2026.cdl-1, 10 papers)
- Short papers up to 4 pages and full papers up to 8 pages; submission via OpenReview, ARR commitment also accepted
- Not listed in the CORE ICORE2026 portal or on the CCF list
