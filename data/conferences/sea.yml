notes:
- Main venue for algorithm engineering and experimental evaluation of algorithms and data structures
- SEA 2026 was the 24th edition and SEA 2027 is the 25th
- Held in Europe every recent year (Barcelona 2023, Vienna 2024, Venice 2025, Copenhagen 2026, Karlsruhe 2027)
- Proceedings in the open-access LIPIcs series (Schloss Dagstuhl)
- Double-blind review; 12 pages excluding bibliography and front page, plus up to 5 pages of appendix
- No paper is published unless an author registers and presents
- "ICORE2026 rank: B; not in the CCF list"
