notes:
- Japanese practitioner conference on site reliability engineering, run mainly by members of the SRE Lounge community
  meetup; the organizing body became a general incorporated association in January 2022
- Talk proposals only (30 min sessions, plus a later call for 5 min lightning talks); no papers or proceedings
- Proposal form accepts Japanese or English; most talks are in Japanese
- Held in Tokyo (2023 Kudan Kaikan Terrace, 2024 Abema Towers, 2025 to 2027 TOC Ariake); one day in 2023, two days since 2024, in July since 2025
- Acceptance is announced about two weeks after the CFP deadline; up to two proposals per person, at most one accepted
