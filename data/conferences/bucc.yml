id: bucc
name: BUCC
full_name: Workshop on Building and Using Comparable Corpora
type: workshop
tier: minor
areas: [nlp]
region: worldwide
language: english
frequency: annual
organizer: BUCC organizing committee; co-located with LREC, COLING or RANLP
organizer_country: [international]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [2, 3, 11]
  conference_months: [1, 5, 9]
links:
  website: https://comparable.limsi.fr/
notes:
- Long-running workshop on comparable and parallel corpora, held since 2008 (19th edition in 2026)
- Follows its host conference (RANLP 2021 online, LREC 2022, RANLP 2023 Varna, LREC-COLING 2024 Turin, COLING 2025
  Abu Dhabi, LREC 2026 Palma de Mallorca)
- Papers of 4 to 8 pages plus references; double-blind review via START; proceedings in the ACL Anthology
- Runs a shared task in most years (parallel sentence mining, term and word translation)
- Registration goes through the host conference; 2026 edition was hybrid
- Not ranked in CORE ICORE2026
