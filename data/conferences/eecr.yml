id: eecr
name: EECR
full_name: International Conference on Electrical Engineering, Control and Robotics
type: conference
tier: minor
areas: [general, systems]
region: china
language: english
frequency: annual
organizer: Smaller commercially run series, sponsored each year by a host university (Harbin Institute of Technology, Shenzhen in 2027)
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [12]
  conference_months: [3, 4]
links:
  website: https://www.eecr.org/
notes:
- Smaller commercially run conference (secretariat on a vip.163.com address, payment via zmeeting)
- Held in China every year (Wuhan 2023, Guangzhou 2024, Changzhou 2025, Suzhou 2026, Shenzhen 2027); online in 2021 and 2022
- Proceedings in IEEE Xplore since 2023; 2021 and 2022 proceedings appeared in IOP Journal of Physics Conference Series
- Covers electrical and power engineering, control and robotics; full papers 4 to 10 pages
- Abstract-only presentations accepted without publication
- Not listed in ICORE2026 or the CCF 2026 list
