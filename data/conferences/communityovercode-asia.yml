notes:
- Asian edition of Community Over Code (formerly ApacheCon), the official conference series of The Apache Software Foundation
- Organized by the Apache Local Community (ALC) Beijing; recent editions in Hangzhou (2024) and Beijing (2025, 2026)
- 'Practitioner talks on Apache projects: data lakes and warehouses, streaming, messaging, OLAP, AI infrastructure, observability, IoT, Rust, incubator and community'
- No papers or proceedings; talks only, chosen by track chairs
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
