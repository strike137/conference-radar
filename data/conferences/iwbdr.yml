language: english
frequency: annual
organizer: Steering committee from Argonne National Laboratory and Oregon State University, co-located with IEEE BigData
organizer_country: [usa]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [10, 11]
  conference_months: [12]
links:
  website: https://mercury-hpg.github.io/IWBDR-6/
notes:
- Workshop on data reduction for HPC, cloud, edge and IoT (lossy and lossless compression, error-bounded methods,
  progressive reduction, hardware co-design); 2026 is the 6th edition
- Held with IEEE BigData in 2020 to 2023 and 2025 (no 2024 edition)
- Camera-ready papers follow the IEEE Xplore format and go into the IEEE BigData workshop proceedings
- Full papers up to 10 pages, short papers up to 6 pages (including references), single-blind, at least three reviews
- Hybrid workshop with one invited keynote from national labs, universities or industry
- Not ranked by CORE (not in ICORE2026) or CCF
