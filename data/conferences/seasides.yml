notes:
- Community-run hacker conference in Goa, India, free to attend for students and professionals (registration used
  only to estimate interest; trainings are first come, first served)
- Three days of talks, free trainings and villages (hardware, AI security, blockchain, container, SAST/SCA,
  infrastructure, social engineering, threat hunting) plus a CTF and mentoring
- CFP for talks and workshops on offensive and defensive security topics; trainers may get remuneration depending
  on sponsorship
- 2026 edition was at the International Centre Goa with about 1000 expected attendees; a co-located Ardentia day on
  privacy and AI governance
