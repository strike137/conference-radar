notes:
- Main venue for compilers, code generation, program optimization and runtime systems
- Technical sponsors ACM SIGPLAN, ACM SIGMICRO and IEEE TCuARCH; proceedings in the ACM DL (ACM fully open access
  from 2026, an APC may apply for authors outside ACM Open)
- Co-located with HPCA, PPoPP and CC (2026 and 2027)
- Two submission rounds (June and September); a round 1 paper can be invited to submit a revision to round 2
- Double-blind review with a rebuttal; up to 11 pages plus references in ACM SIGPLAN format
- Artifact evaluation is optional for research papers and mandatory for tool papers
- Held in Las Vegas 2025, Sydney 2026 and Salt Lake City 2027
- CORE A (ICORE2026), CCF B
