notes:
- Annual national software conference of CCF, formed in 2020 by merging NASAC (National Software and Application Conference, since 2002) and FMAC (National Conference on Formal Methods and Applications, since 2016)
- No conference proceedings; each track is a journal special issue call, and authors who pass the first review round must present at ChinaSoft before the final decision
- Track deadlines are spread from July to October and differ per special issue
- Hosted by a different Chinese university each year (Fudan 2022 and 2023, Xidian 2024, Wuhan 2025, Tianjin and Nankai 2026)
- Large event with over 3,000 attendees and more than 70 forums in 2025, plus academician keynotes and programming competitions
- Talks mostly in Chinese
