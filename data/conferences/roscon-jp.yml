notes:
- Official Japanese local edition of ROSCon, the ROS (Robot Operating System) developer conference, held since 2018
- Talks on ROS, Gazebo and Open-RMF packages, tools and robot software practice; proposals and talks in Japanese
- Talk proposals reviewed by a program committee; lightning talks registered on the day; hands-on workshops on the
  morning of day 1
- Held mostly in Tokyo (Kyoto 2022, Nagoya 2025, Tsukuba 2026, Osaka 2027); over 200 participants at every edition
- Diversity scholarship for women and students; talk slides and videos archived on the site
- No papers or proceedings; talks only
