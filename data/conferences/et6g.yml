notes:
- Workshop co-located with IEEE GLOBECOM; 6th edition in Taipei (2025), 7th edition in Macau (2026)
- Broad 6G scope including AI for 6G, THz, full duplex, metasurfaces, multiple access, spectrum sharing and new
  network architectures
- 2026 co-chairs are Ruiqi Liu (ZTE), Nizar Zorba (Qatar University), Octavia A. Dobre and Wei Zhang (UNSW)
- Accepted and presented papers go into the IEEE GLOBECOM workshop proceedings in IEEE Xplore; in-person
  presentation required (no-show papers removed)
- Submissions via EDAS through the GLOBECOM workshop call
- Not listed in ICORE2026
