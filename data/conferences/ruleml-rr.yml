notes:
- Joint successor of the RuleML and RR (Web Reasoning and Rule Systems) events, first held in 2017
- Part of the Declarative AI event, co-located with DecisionCAMP and the Reasoning Web Summer School
- Proceedings in Springer LNCS, published after the conference
- Long papers 15 pages plus 2 for references, short papers 8 pages plus 1; not anonymous; submission via Microsoft CMT
- Also runs a Rule Challenge, Doctoral Consortium, Industry Track and Project Networking Session
- Best papers considered for special issues of TPLP or Transactions on Graph Data and Knowledge
- Always held in Europe (2023 Oslo, 2024 Bucharest, 2025 Istanbul, 2026 Vilnius); 2027 announced for Vienna
