notes:
- French hacker conference held every late August at the Palais des Congres Neptune on the seafront in Toulon
- One day of talks plus workshops, a wargame (CTF) and a rump session; Toxic BBQ social event the evening before (new in 2026)
- Run by a volunteer team with support from the HackerZVoice association; editions since 2020
- 2026 programme had 11 talks, all tagged FR on the site although some titles are in English
- Talks only, no formal proceedings
