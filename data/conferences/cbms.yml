notes:
- Long-running medical and biomedical informatics symposium; 39th edition in 2026, 40th in 2027
- Sponsored by the IEEE Computer Society TCCLS; run by an international steering committee
- All accepted papers (regular 6 pages, extendable to 8 for a fee; short 3 to 4 pages; 2-page posters) appear in IEEE Xplore
- Each paper reviewed by at least two program committee members; special tracks and a doctoral consortium run alongside
- Recent editions in Aveiro (online 2021), Shenzhen (online 2022), L'Aquila 2023, Guadalajara 2024, Madrid 2025, Limassol 2026 and Rome 2027
- 2026 and 2027 editions are in person only
- Selected papers invited to journal special issues
- CORE B in ICORE2026; not on the CCF 2026 list
