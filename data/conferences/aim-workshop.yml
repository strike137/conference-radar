id: aim-workshop
name: AIM
full_name: Advances in Image Manipulation Workshop and Challenges
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: irregular
organizer: Computer Vision Lab, University of Wurzburg (Radu Timofte) with co-organizers from academia and industry
organizer_country: [europe]
proceedings: IEEE Xplore and CVF Open Access (ICCV Workshops) or Springer LNCS (ECCV Workshops)
archival: true
typical:
  deadline_months: [6, 7]
  conference_months: [9, 10]
links:
  website: https://cvlai.net/aim/2025/
notes:
- Workshop co-located with ICCV or ECCV; editions in 2019 (ICCV Seoul), 2020 (ECCV, virtual), 2021 (ICCV, virtual),
  2022 (ECCV), 2024 (ECCV Milan) and 2025 (ICCV Honolulu); no edition in 2023
- Sister event of NTIRE at CVPR, run by the same University of Wurzburg team, with many image and video manipulation
  challenges alongside the paper track
- Papers go into the host conference workshop proceedings (ICCVW by IEEE and CVF for 2025, ECCVW by Springer for 2024)
- Double-blind review; paper length and format follow the host conference
- Separate later deadline for challenge method papers and papers already reviewed elsewhere; deadlines are 23:59 CET
- Not listed in ICORE2026 or the CCF list
