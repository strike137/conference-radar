notes:
- ACM conference on multimedia systems (streaming, networking, QoE, immersive and volumetric media, cloud gaming);
  17th edition in 2026
- Rated A in ICORE2026; not on the CCF list (the co-located NOSSDAV workshop is CCF B)
- Papers published in the ACM Digital Library; research papers up to 10 pages plus references, ACM sigconf template,
  double-blind review on HotCRP
- Two independent research track rounds (September and November); papers rejected in round one may be revised and
  resubmitted to round two
- Co-located workshops such as NOSSDAV and MMVE, plus open source software and dataset, demo and industry tracks,
  doctoral symposium and grand challenges
- In-person event; at least one author per paper must attend (2026)
- Rotates worldwide (Athlone 2022, Vancouver 2023, Bari 2024, Stellenbosch 2025, Hong Kong 2026, Ghent 2027)
