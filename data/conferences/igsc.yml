notes:
- Formerly the International Green Computing Conference (IGCC); first held in 2010
- Covers energy-efficient and sustainable computing, from low-power circuits and accelerators to data centers and green AI
- Regular papers up to 6 pages and concept, position or WiP papers up to 2 pages, ACM double-column format; double-blind review
- 2026 edition co-located with ACM GLSVLSI in Canandaigua (Finger Lakes), NY, USA; accepted papers go through ACM TAPS
- Held in the USA or Canada since 2017 (virtual 2020 to 2022); the archive lists no 2025 edition
- Not listed in the CORE portal (ICORE2026) or the CCF list
