id: ica-symp
name: ICA-SYMP
full_name: International Symposium on Instrumentation, Control, Artificial Intelligence, and Robotics
type: conference
tier: minor
areas: [ai, general]
region: southeast-asia
language: english
frequency: biennial
organizer: ECTI Association (Thailand)
organizer_country: [thailand]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [7, 8, 9, 10]
  conference_months: [1]
links:
  website: https://ica-symp.ecti-thailand.org/
notes:
- Run by the Thai ECTI Association; technical co-sponsors IEEE Thailand Section, AIAT and Thailand Robotics Society
- Held every two years in January in Bangkok, at a different university each time (Chulalongkorn 2019, KMUTT 2021,
  Kasetsart 2023, KMUTNB 2025, KMITL 2027)
- 2019 to 2025 proceedings in IEEE Xplore; position papers (2 to 4 pages) go in the proceedings but not IEEE Xplore
- Regular papers 4 to 6 pages in IEEE two-column format (4 pages in 2025), submitted via EDAS
- Includes organized sessions, e.g. ECTI-SICE on control engineering (2025) and ECTI-ICROS on estimation and
  control design (2027)
- Registration 6000 to 10000 THB (2027, early-bird student member to on-site non-member)
- Two submission batches for 2027; deadlines are usually extended
- Not listed in ICORE2026
