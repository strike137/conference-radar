notes:
- Run by the ICUAS Association, Inc., a non-profit registered in Colorado, USA; IEEE and IEEE CSS are technical sponsors
- Aerial robotics and unmanned aviation (perception, navigation, control, aerial manipulation, regulation and safety)
- All ICUAS proceedings are on IEEE Xplore according to the association
- Papers up to 8 pages in IEEE two-column format via PaperCept, at least three reviewers; double-blind review from ICUAS 2027 following IEEE RAS rules
- Physical presence only; first day for workshops and tutorials, then three technical days with a UAV competition
- Held in the USA until 2019, then mostly Greece and elsewhere in Europe (Athens, Dubrovnik, Warsaw, Chania, Corfu, Charlotte in 2025); 2027 in Fortaleza, Brazil
- Not listed in the CORE ICORE2026 portal
