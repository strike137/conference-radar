notes:
- Young venue dedicated to microarchitecture security (side channels, transient execution, hardware attacks and defenses); first edition 2025
- Run by a steering committee of mostly European academics (TU Graz, KU Leuven, ETH Zurich, RUB, VU Amsterdam, ...) plus Google
- Held in Europe so far (2025 Bochum, 2026 Leuven, 2027 Amsterdam)
- Proceedings published by Ruhr University Bochum as diamond open access, free at the start of the conference
- Two submission cycles per edition; cycle 2 also accepts posters with an optional two-page abstract
- Double-blind review, USENIX Security template, up to 13 pages excluding bibliography and appendices
- At least one author must present in person for the paper to be included in the proceedings
- uASC 2026 was fully booked with more than 150 participants
- Not listed in ICORE2026 or the CCF 2026 list, so no rank is given
