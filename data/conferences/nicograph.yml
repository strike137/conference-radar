notes:
- Domestic Japanese conference (paper contest) on computer graphics and multimedia, held since 1985; run by the Society for Art and Science since 2000
- Topics include CG, modeling, rendering, animation, games, visualization, image, audio and music processing, HCI, VR and media art
- Journal track (submitted to the society journal, deadline in May), Conference track (full 8 pages, short 4 pages, poster 2 pages, deadline in August) and Exhibition track (demos)
- Conference track is peer reviewed, but papers related to previously published work are allowed; proceedings PDFs on the society site are password protected for members
- Held in Japan every November at a different university (Hiroshima 2025, Nagano 2026)
- The English sister venue is NICOGRAPH International (June, IEEE Xplore)
- Not listed in the CORE portal (ICORE2026, 0 results)
