links:
  website: https://isemantic.dinus.ac.id/2026/
notes:
- Organized by Universitas Dian Nuswantoro in Semarang, Indonesia, with IEEE Indonesia Section technical co-sponsorship
- Held at the UDINUS campus in Semarang in hybrid format; 2026 was the 11th edition
- Papers from 2016 to 2025 published in IEEE Xplore, per the official site
- Broad IEEE scope covering communications and networks, computing, signal processing, power and energy, robotics and e-health
- 4 to 6 page papers submitted via EDAS; accepted papers must be presented (onsite or online) to reach IEEE Xplore
- Submission deadline is usually extended twice; early bird deadline in May
- Similarity rating must be below 20%
- Not listed in the ICORE2026 portal or the CCF 2026 list
