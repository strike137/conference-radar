notes:
- Annual conference hosted by the Department of Information Technology, Rajarambapu Institute of Technology, Sangli, Maharashtra, India; 5th edition in 2026
- Technically co-sponsored by IEEE Maharashtra Section in 2026; earlier editions were run as flagship conferences of the IEEE Bombay Section
- Held in Goa every year since 2022; at the International Centre Goa, Dona Paula in 2023, 2024 and 2026
- Proceedings of all editions since 2022 published in IEEE Xplore; 2026 papers are submitted to IEEE for possible inclusion
- More than 18 tracks across EECS; full papers of at least 6 pages, submission through Microsoft CMT
- "Large volume: 2178 submissions and 280 papers presented in 2024; 3022 submissions in 2025 (official reports)"
- Not listed in ICORE2026; a small regional venue
