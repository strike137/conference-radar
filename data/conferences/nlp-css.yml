notes:
- Interdisciplinary workshop bringing together NLP researchers and social scientists on language as a measure of social variables, bias, causal inference and LLMs for social science measurement
- Co-located with a *CL conference, every two years since 2020 (EMNLP 2016, ACL 2017, NAACL 2019, EMNLP 2020, EMNLP 2022, NAACL 2024, ACL 2026)
- Proceedings in the ACL Anthology; authors may choose a non-archival option because some social sciences do not accept work already in archived proceedings
- Direct submission on OpenReview plus commitment of ARR-reviewed papers; long and short papers in ARR format
- 2026 added a shared task on the OIDA database with travel prize money and mentorship for social science students
- 21 papers in the 2026 proceedings, 12 in 2024
- Not listed in ICORE2026 and not on the CCF list
