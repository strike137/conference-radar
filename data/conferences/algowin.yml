notes:
- Formerly ALGOSENSORS; renamed ALGOWIN, 2024 was the 20th edition
- Held every year as part of the ALGO meeting with ESA, IPEC, ATMOS, ALGOCLOUD, WABI and WAOA
  (Egham 2024, Warsaw 2025, L'Aquila 2026)
- Theory venue on algorithmic aspects of wireless and sensor networks, mobile robots, drones and temporal graphs
- Proceedings in Springer LNCS after the conference (2024 was LNCS 15026)
- Papers up to 12 pages in LNCS format plus optional appendix; at least one author must register for ALGO and present
- Selected papers invited to a special issue of Theoretical Computer Science
- Best paper and best student paper awards sponsored by Springer
- Ranked C in ICORE2026 under its old name ALGOSENSORS (Algorithms and Experiments for Wireless Networks)
- Small program, 13 accepted papers in 2025 and 2026
