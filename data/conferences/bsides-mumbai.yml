notes:
- Independent, community-driven, not for profit security conference in Mumbai, India, approved by Security BSides
- First in-person edition in 2024 (about 156 attendees); 2025 had about 313 attendees and 49 speakers; 2026 was Edition 03
- One-day event with technical talks, workshops, villages, Arsenal tool demos and a CXO panel, preceded by a 24-hour online jeopardy CTF
- "Call for papers tracks: Briefing (30 min talk), Workshop and Village (hands-on), Arsenal (15 min tool demo)"
- Submissions reviewed anonymously by reviewers and the core team; product or vendor pitches are not accepted
- Speakers travelling from outside Maharashtra get travel support of up to 10,000 INR, reimbursed against receipts (2026)
- No proceedings; talk recordings are published on YouTube
