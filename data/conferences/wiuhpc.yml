id: wiuhpc
name: WIUHPC
full_name: Combined Workshop on Interactive and Urgent High-Performance Computing
type: workshop
tier: minor
areas: [systems]
region: worldwide
language: english
frequency: multiple-per-year
organizer: Interactive and Urgent HPC community (organizers from CEA, NERSC, Indiana University and Allen Institute), held with SC and ISC
organizer_country: [usa, europe]
proceedings: SC Workshops Proceedings for SC editions; ISC workshop proceedings (Springer LNCS) for ISC editions
archival: true
typical:
  deadline_months: [3, 8]
  conference_months: [6, 11]
links:
  website: https://www.interactivehpc.com/
notes:
- Workshop on interactive HPC and urgent computing (disaster response, human-in-the-loop simulation, interactive supercomputing)
- Held twice a year, with ISC High Performance in Hamburg (June) and with IEEE/ACM SC in the USA (November); ISC26 was the 7th edition and SC26 the 8th
- SC editions take 6 to 10 page two-column papers and publish them in the SC Workshops Proceedings
- ISC editions take 6 to 12 page LNCS papers; papers of significant scientific value are considered for the ISC workshop proceedings (Springer LNCS)
- Accepts original work, work in progress and position papers
- Not listed in CORE ICORE2026
