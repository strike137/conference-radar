notes:
- Annual national symposium of SOFT (Japan Society for Fuzzy Theory and Intelligent Informatics), early September
- Covers fuzzy theory, soft computing, machine learning, evolutionary computation, robotics and AI applications
- Papers of 2 to 6 pages in Japanese; paper information is published on J-STAGE
- Presenters can submit a 3-page short note to a reviewed special issue of the SOFT journal after the symposium
- Held at a different Japanese city each year (Karuizawa 2023, Nagoya 2024, Kumamoto 2025, Osaka 2026, Naha 2027);
  online 2020 to 2022
- Separate from the international SCIS&ISIS (scis-isis), also run by SOFT
- Not listed in CORE ICORE2026
