links:
  website: http://meet.uec.ac.jp/meet-2026/
notes:
- Run by the Meta-Networking Research Center of the University of Electro-Communications, Chofu, Tokyo
- Started in 2025; both editions held at UEC in Chofu, Tokyo
- IEEE and IEEE ComSoc logos shown as technical co-sponsors
- Full papers of 5 to 6 pages in IEEE format via EDAS, each reviewed by at least three experts
- Accepted and presented papers are submitted to IEEE Xplore
- Topics include AI for wireless networks, optical communication, ground-air-space networks, quantum communication and edge computing
- Selected papers may be recommended to the journals CMC (Computers, Materials & Continua) and Intelligent Networking and Computing
- Deadline extended twice in both years (2025 -> Aug 20, 2026 -> Sep 6)
- Remote presentation by video or Zoom allowed when visa or other constraints prevent travel (2026)
- Not listed in ICORE2026 or the CCF 2026 list
