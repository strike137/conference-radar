notes:
- Describes itself as the premier conference in the Asia-Pacific region on field-programmable technologies, FPGAs and
  reconfigurable computing; also known as ICFPT
- Run by an international steering committee; held every December, mostly in Asia and Oceania (Auckland 2021 virtual,
  Hong Kong 2022, Yokohama 2023, Sydney 2024, Shanghai 2025, Honolulu 2026)
- Proceedings in IEEE Xplore
- Conference track takes long papers (8 pages plus references), short papers and posters, with double-blind review and a rebuttal period;
  an optional artifact evaluation form
- Also has a journal track with ACM TRETS (earlier deadline), special sessions, a design competition, a PhD forum
  and work-in-progress papers, workshops and tutorials
- Paper deadlines are usually extended by one to two weeks
- CCF C (architecture, parallel and storage category); not listed in the ICORE2026 portal
- Each author registration covers one paper; extra pages cost 150 USD each (2026)
