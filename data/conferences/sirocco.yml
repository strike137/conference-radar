notes:
- Theory venue on distributed computing and communication (distributed graph algorithms, mobile agents, fault tolerance, self-stabilization, network models)
- Held every year since 1994; run by a steering committee with an advisory board of distributed computing researchers
- Mostly held in Europe (Wroclaw 2021, Paderborn 2022, Alcala de Henares 2023, Salerno 2024, Delphi 2025, Durham 2026); Larnaca, Cyprus announced for 2027
- Proceedings in Springer LNCS
- Abstract registration one week before the full paper; papers up to 12 pages in single-column format plus cover page and references
- Papers not accepted as full papers may be invited as brief announcements
- 'CORE rank B (ICORE2026); not on the CCF 2026 list'
