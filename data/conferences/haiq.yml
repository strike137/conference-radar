notes:
- One-day in-person workshop on integrating HPC and AI systems with quantum computing and quantum networking
- 1st edition with IEEE HPCA 2025 (Las Vegas, March 1, 2025); 2nd with ACM ASPLOS 2026 (Pittsburgh)
- Contributed talks from 2-page extended abstracts or full papers (ACM, IEEE or APS format), double-blind review; poster-only proposals by abstract
- The workshop publishes no proceedings; distinguished papers are invited to a cooperating npj Quantum Information collection
- Student travel grants of 400 USD (2026); partly supported by NSF
- Not listed in CORE ICORE2026 or the CCF list
