notes:
- ACM conference on fairness, accountability and transparency in socio-technical systems; interdisciplinary (CS,
  law, social sciences, humanities)
- Started as FAT* (New York 2018, Atlanta 2019, Barcelona 2020); renamed ACM FAccT in 2021
- Proceedings in the ACM Digital Library; authors may choose a non-archival option where only the abstract appears in
  the proceedings
- Up to 14 pages excluding references in ACM format, anonymous review on OpenReview; since 2026 there is a revise and
  re-review round before the final decision
- All authors of every paper must sign up to review (2027 CFP)
- Location rotates globally (online 2021, Seoul 2022, Chicago 2023, Rio de Janeiro 2024, Athens 2025, Montreal 2026,
  Porto 2027)
- Deadlines moved from January (2025, 2026) to late October and early November for 2027
- Tiered registration fees with discounts for ACM economically developing countries
- Not listed in ICORE2026 and not in the CCF list, but regarded as the main venue for algorithmic fairness and
  responsible AI research
