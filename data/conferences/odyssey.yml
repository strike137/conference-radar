notes:
- Standalone ISCA workshop run with the Speaker and Language Characterization SIG, held in even years
- Covers speaker and language recognition, diarization, spoofing and deepfake detection, voice privacy and
  paralinguistics
- Papers up to 8 pages (last two pages for references and acknowledgements only); published with a DOI in the
  ISCA Archive
- Not listed in CORE ICORE2026, but a long-running specialist venue (since 1994) for speaker recognition
- Location rotates worldwide (Bilbao 2016, Les Sables d'Olonne 2018, Tokyo 2020, Beijing 2022, Quebec City 2024,
  Lisbon 2026)
