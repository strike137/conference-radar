notes:
- Data analytics and machine learning for network and service management (anomaly detection, LLMs for networks, autonomous networks)
- Co-located with IEEE/IFIP NOMS; 2025 was the 10th edition, in Honolulu
- Regular papers up to 6 pages and short work-in-progress papers up to 4 pages, IEEE two-column format, submission via JEMS
- Accepted papers go into the conference proceedings, IEEE Xplore and the IFIP database; papers not presented may be removed
- Best paper award
- Not listed in ICORE2026 or the CCF list
