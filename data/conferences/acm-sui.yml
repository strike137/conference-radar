notes:
- Small ACM SIGCHI symposium on spatial interaction for VR, AR, MR and ubiquitous environments
- Proceedings in the ACM Digital Library
- Papers of 4 to 10 pages (ACM double-column format) with no formal short/full split; double-blind review; one deadline in late May, 23:59 AoE with no extension
- Posters and demos have a separate deadline in August
- Often held next to IEEE ISMAR (Bari 2026, the week after ISMAR); 2020 to 2022 virtual, then Sydney 2023, Trier 2024, Montreal 2025
- Not listed in CORE (ICORE2026) or CCF
