notes:
- Annual since 2012, run by VKU (Vietnam-Korea University of ICT, University of Danang) with ACIR, FISU Vietnam,
  Wroclaw University of Science and Technology and IEEE SMCS as supporters
- Held in Da Nang in 2023, Da Nang and Hoi An in 2024, Phnom Penh (Cambodia) in 2025, Ha Long (Vietnam) in 2026 and Bangkok (Thailand)
  in 2027
- Proceedings in Springer LNNS (2023 to 2025, planned for 2027) and Springer CCIS (2026)
- Papers of 10 to 12 pages in Springer LNCS format via EasyChair; submissions with more than 20% similarity are desk
  rejected
- Broad ICT scope (AI, data science, NLP, vision, networking, security, digital economy); acceptance rate about 25%
