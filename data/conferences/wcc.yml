notes:
- Long running biennial workshop on coding theory, cryptology and related discrete mathematics, first held in 1999
- Earlier editions were hosted mostly by Inria (France) and the Selmer Center (Bergen, Norway); recent editions in Saint-Jacut (2019), Rostock (2022), Perugia (2024) and Paris (2026)
- Selection on 6 to 10 page extended abstracts, which are posted on the website
- Non-archival; authors of accepted abstracts are invited to submit full papers to a refereed special issue of Designs, Codes and Cryptography
- Week-long event; 2026 was the 14th edition at Inria Paris
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
