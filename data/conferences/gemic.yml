notes:
- National microwave conference of Germany, hosted by a different university each year in cooperation with IMA e.V.
  and VDE/ITG; 16th edition in Dresden 2025, 17th in Karlsruhe 2026, 18th in Hamburg 2027
- Covers RF, microwave, millimeter-wave and THz circuits, antennas, radar, sensing and communication systems
- Submission is a 2 to 4 page A4 abstract; final papers up to 4 A4 pages are considered for IEEE Xplore, and papers
  not presented may be excluded
- Strong industry exhibition and sponsor presence; best paper awards sponsored by IMA and EuMA
- The November submission deadline was extended in 2025 (Nov 14 to Nov 30)
- IEEE T-MTT special issue for expanded versions of GeMiC 2027 papers
- Not listed in ICORE2026 and not on the CCF list
