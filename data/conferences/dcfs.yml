notes:
- Annual theory conference on the descriptional complexity of automata, grammars, languages and related systems
- Proceedings in Springer LNCS; extended versions of selected papers invited to a journal special issue (IJFCS for 2026)
- Run as a workshop until 2014 (and in the LNCS titles up to 2025); started in 1999 as DCAGRS
- Small meeting with a single track
- Held mostly in Europe and Canada (Debrecen 2022, Potsdam 2023, Loughborough 2025, Kingston 2026); virtual in 2021, collected papers only in 2020, no edition in 2024
- DCFS 2026 was the 27th edition, co-located with CIAA 2026
- Not listed in ICORE2026 or on the CCF 2026 list
