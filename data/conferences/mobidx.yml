notes:
- Half-day workshop on mobile and wireless sensing for health (contactless vital signs, wearables, body area
  networks, closed-loop interventions), first held with ACM MobiCom 2026 in Austin
- Research papers up to 6 pages, challenge papers up to 4 pages, demos 2 pages, ACM double-column format
- Single-blind review; accepted papers appear in the ACM proceedings (Proceedings of the 1st Workshop on Hot
  Topics in Mobile and Wireless Systems for Health)
- Steering committee Swarun Kumar and Rajesh Balan
- Not listed in ICORE2026 or the CCF 2026 list
