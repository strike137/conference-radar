links:
  website: http://tcci.ccf.org.cn/conference/2026/
notes:
- Annual meeting of the CCF NLP technical committee; held in a different Chinese city each year (Hangzhou 2024,
  Urumqi 2025, Macau 2026)
- NLPCC 2026 is in Macau (Galaxy International Convention Center); English-only submissions this year, via OpenReview,
  double-blind
- Proceedings in Springer LNAI (EI indexed); CCF C
- Runs many shared tasks each year; papers under review elsewhere may be submitted but must be committed on acceptance
- 2026 offers funding for up to 30 NLPCC student authors enrolled in China to attend the sister conference NCMMSC
  2026
