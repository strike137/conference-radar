notes:
- Run by the Moroccan Mediterranean Association of Sciences and Sustainable Development with Abdelmalek Essaadi University
  (Tangier) faculty as general chairs; started in 2018
- Proceedings by Conference Publishing Services (2026), IEEE Xplore (2025, also 2022), ACM ICPS (2023, 2024); the
  2027 site lists Springer proceedings as pending
- Selected extended papers go to a Bentham Books volume
- Mostly held in Morocco (Larache 2023, Tangier and Chefchaouen 2025, Bouskoura 2027); 2022 and 2024 were
  virtual and 2026 was in Malaga, Spain, so Morocco hosted only 3 of the last six editions
- Papers of 6 to 8 pages, double-blind review by 2 to 3 reviewers via Microsoft CMT
- "Fees (2027): 300 EUR academic, 250 EUR student, 200 EUR online (early)"
- Not listed in CORE ICORE2026
