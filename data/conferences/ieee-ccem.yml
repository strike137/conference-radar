notes:
- Indian conference series on cloud computing and AI for emerging markets, running since 2012; 13th edition in December 2025
- Held at Amrita Vishwa Vidyapeetham, Mysuru in 2023 and 2025
- The 2023 site claims an acceptance rate below 10% for research papers
- Research papers up to 8 pages (short 5 pages), double-blind review; also a student project showcase and TechnoBiz plan track (3 pages)
- The 2023 call says accepted full and short research papers go into proceedings indexed through IEEE Xplore
- The 13th edition was first announced for February 2025 and then held in December 2025
- Not on the CCF list
