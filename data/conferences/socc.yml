notes:
- Annual ACM symposium on cloud computing since 2010, the only conference co-sponsored by ACM SIGMOD and ACM SIGOPS
- Covers cloud systems and data management; full research (12 pages), short research (6 pages), industry (12 pages)
  and vision (6 pages) papers, plus unlimited references
- Dual-anonymous review with an author response period; accepted papers are shepherded
- Proceedings in the ACM Digital Library, linked from the official site as free and open access
- Two submission rounds from 2026 (February and July); a paper rejected in the first round cannot be resubmitted in the
  second round
- Usually held in the USA (Seattle 2021, San Francisco 2022, Santa Cruz 2023, Redmond 2024); 2025 was fully virtual and
  2026 is in Singapore
- Not listed in ICORE2026; CCF B (computer architecture, parallel and distributed computing, storage systems)
- Requires a senior author of each paper to register as a reserve reviewer (2026)
