notes:
- Stand-alone workshop of the IEEE Signal Processing Society, run by its Image, Video, and Multidimensional Signal Processing Technical Committee
- Covers image, video and multidimensional signal processing and analysis (EDICS areas of IEEE TIP and IEEE TCI)
- Described as biennial by the 2026 site, but SPS solicited organizers for both 2027 and 2028, so editions now follow each other closely
- 15th edition in 2026 at Tsinghua Shenzhen International Graduate School, theme "Image and Video for Multimodality AI"; 2027 edition in Paris
- Double-blind review by at least two reviewers; papers presented in person go to IEEE Xplore, no-show papers are excluded
- Three-day workshop with tutorials on the first day, usually in June or July
- Not listed in ICORE2026
