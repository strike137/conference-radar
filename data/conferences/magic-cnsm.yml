notes:
- Half-day workshop co-located with CNSM; first edition in 2026 (Alcala de Henares (Madrid), Friday Oct 30 afternoon)
- Topics are agent-to-agent (A2A) communication protocols, multi-agent coordination, agent discovery, trust and identity, and management of agent ecosystems
- Regular papers up to 6 pages and position papers up to 4 pages including references (IEEE two-column); submission via EDAS
- Papers are made available via IEEE Xplore and IFIP
- 2026 program had an academic and an industrial keynote and five papers
- Not to be confused with MAgiCS (cryptographic agility workshop)
- Not listed in CORE ICORE2026 or the CCF list
