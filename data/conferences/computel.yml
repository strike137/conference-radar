notes:
- Workshop bringing together computational linguists, field linguists and endangered language communities, with a focus on documentation and revitalization
- Alternates co-location between ACL conferences and the International Conference on Language Documentation and Conservation (ICLDC) in Honolulu
- Recent editions at ICLDC 2023, EACL 2024 (St. Julians, Malta), ICLDC 2025 (Honolulu) and ACL 2026 (San Diego); ComputEL-10 returns to ICLDC in Honolulu in March 2027
- Selected accepted papers appear in the open-access ACL Anthology; abstracts (for community members and non-proceedings authors) are presented but not published
- Long papers 8 pages, short papers 4 pages, with required ethics and limitations sections; submission via Softconf
- Some travel funding for authors without institutional support, such as community members and students
- Not ranked in ICORE2026 and not on the CCF list
