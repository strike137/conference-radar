language: english
frequency: annual
organizer: IEEE Power Electronics Society (PELS) and IEEE Industry Applications Society (IAS)
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [2, 3]
  conference_months: [9, 10]
links:
  website: https://www.ieee-ecce.org/2027/
notes:
- Joint IEEE PELS and IAS congress on energy conversion, power electronics, electric machines and drives, first held
  in 2009 (merging PESC with part of the IAS Annual Meeting)
- The North American ECCE, held every autumn (2021 virtual, 2022 Detroit, 2023 Nashville, 2024 Phoenix, 2025
  Philadelphia, 2026 Vancouver, 2027 Providence); ECCE Asia and ECCE Europe are separate events
- Double-blind review of a single column digest of up to 5 pages; papers presented at the conference go to IEEE Xplore
- Describes itself as the second largest power electronics conference, with over 2,000 attendees
- Includes tutorials, special sessions, post-journal presentations, a career fair and student demonstrations
- Not the same venue as the Bangladesh ECCE (ecce-bd)
- Not listed in ICORE2026 (CORE portal) and not on the CCF list
