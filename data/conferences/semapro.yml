notes:
- Organized by IARIA as part of the NexTech congress, co-located with DATA ANALYTICS, UBICOMM, ADVCOMP and other IARIA events (21st edition in 2027)
- Published open access in the IARIA ThinkMind library (ISSN 2308-4510); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in southern Europe (Valencia, Porto, Venice, Lisbon, Barcelona in recent years)
- Covers semantic web, ontologies, knowledge graphs and semantic text processing
