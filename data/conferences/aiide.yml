notes:
- AAAI-sponsored annual conference on AI for games and interactive entertainment (game AI, procedural content
  generation, interactive narrative)
- Proceedings published by AAAI Press with an ISSN, open access on ojs.aaai.org (Vol. 21 in 2025)
- Held in North America (Pomona 2022, Salt Lake City 2023, Lexington 2024, Edmonton 2025; virtual in 2021); 2026 in
  Belo Horizonte, Brazil is the first edition outside the United States and Canada
- Main venue for game AI research; not listed in the CORE ICORE2026 search
