notes:
- Workshop on Technical Credit, the long-term engineering value of deliberate architectural decisions (the counterpart of technical debt)
- First edition in 2027 at ICSA 2027 in Sydney
- Takes position papers of up to 4 pages in IEEE conference format, single-anonymous, two reviews each, submitted through the ICSA EasyChair
- ICSA 2027 states that workshop proceedings are published in the ICSA 2027 Companion proceedings in IEEE Xplore
- Accepted authors give a two-minute lightning talk, followed by breakout groups and plenary discussion toward a community roadmap
- Plans for about 10 to 15 position papers
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
