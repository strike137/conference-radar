notes:
- Workshop on generative and agentic AI (LLMs, diffusion models, shopping agents) for e-commerce search, recommendation and content
- Held at CIKM 2024 (Boise, Idaho), RecSys 2025 (Prague) and RecSys 2026 (Minneapolis); named Workshop on Generative AI for E-Commerce until 2025
- Regular papers at least 10 pages and short papers at least 5 pages in the single-column CEURART template; double-blind review via EasyChair
- Accepted papers are posted as open-access proceedings on the workshop website, not via CEUR-WS and not in the main conference proceedings
- Accepts papers under review or recently accepted elsewhere
- Organizers mostly from industry (Walmart, Amazon, Meta, Upwork)
- Not ranked in ICORE2026 and not on the CCF list
