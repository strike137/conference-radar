notes:
- Interactive workshop on research software engineering careers, RSE groups and community building in HPC, held with SC since 2020
- Calls for one-page abstracts of lightning talks, no format prescribed; accepted abstracts are only posted on the workshop website
- Non-archival, no formal proceedings
- Held in person at SC with online participation; half-day in 2023 and 2026, full day in 2024 and 2025
- 2026 is the seventh edition
- Not listed in CORE ICORE2026; not on the CCF 2026 list
