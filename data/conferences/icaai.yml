id: icaai
name: ICAAI
full_name: International Conference on Advances in Artificial Intelligence
type: conference
tier: minor
areas: [ai]
region: europe
language: english
frequency: annual
organizer: Science and Engineering Institute (SCIEI) secretariat with UK universities (University of Staffordshire as 2026 sponsor; Birmingham City University in 2022 to 2025)
proceedings: ACM ICPS (ACM DL)
archival: true
indexing: [EI, Scopus]
fee: 650 USD regular, 600 USD student per full paper (2026)
typical:
  deadline_months: [8]
  conference_months: [9, 10, 11]
links:
  website: https://www.icaai.org/
notes:
- Annual since 2017 (Bangkok); 10th edition in 2026
- Mostly held in the UK recently (Birmingham 2022, Istanbul 2023, London 2024, Manchester 2025, London 2026); online in 2020 and 2021
- Accepted papers published in ACM conference proceedings (ACM DL) for 2018 to 2025 and announced for 2026; 2017 papers went to the journal IJMLC
- Held together with the International Conference on Education and Artificial Intelligence Technologies (EAIT)
- Run by the commercial organizer SCIEI (contact icaai@sciei.org, submission via zmeeting); past edition pages describe SCIEI as based in the USA
- Abstract-only presentation option without publication
- Not listed in CORE ICORE2026 or the CCF list; not the same venue as ICAAIC
