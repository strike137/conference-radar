language: english
frequency: irregular
organizer: CauSE organizers (University of Sheffield, Universita di Napoli Federico II, Chalmers University of Technology, University of Gothenburg), co-located with FSE or ICSE
organizer_country: [international]
proceedings: ACM DL (FSE 2025 companion proceedings); ICSE 2027 companion proceedings
archival: true
typical:
  deadline_months: [11]
  conference_months: [5]
links:
  website: https://causality-software-engineering.github.io/cause-workshop-2027/
notes:
- Workshop on causal inference, causal discovery and causal AI applied to software engineering
- 1st edition with FSE 2025 in Trondheim, 2nd edition with ICSE 2027 in Dublin; no 2026 edition
- Accepted papers appear in the host conference companion proceedings
- "Full papers up to 8 pages, position/short and tool/artifact papers up to 5 pages, including references"
- Double-anonymous review by at least three PC members
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
