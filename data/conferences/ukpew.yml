notes:
- Annual one-day UK workshop on performance modelling and analysis, running since 1985 (42nd edition in 2026)
- Standalone event, always held in the UK (Leeds, Newcastle, Warwick, Edinburgh, Bradford...); online 2020 to 2022
- Accepted full papers of UKPEW 2026 appear in ENTICS (episciences); 2024 papers appeared only in the workshop proceedings
- Regular papers 6 to 12 pages or short papers 1 to 4 pages (2026); submission via EasyChair; camera-ready after the workshop
- Small, friendly venue suited to PhD students; not listed in CORE ICORE2026
