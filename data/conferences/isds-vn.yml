id: isds-vn
name: ISDS
full_name: International Conference on Intelligent Systems and Data Science
type: conference
tier: minor
areas: [ai, data, vision, nlp]
region: southeast-asia
language: english
frequency: annual
organizer: College of ICT, Can Tho University (2026 co-hosted with Yuan Ze University)
organizer_country: [vietnam]
proceedings: Springer CCIS
archival: true
indexing: [Scopus]
typical:
  deadline_months: [7, 8]
  conference_months: [10, 11]
links:
  website: https://isds.ctu.edu.vn/
notes:
- Started in 2023 at Can Tho University; 2024 at Nha Trang University, 2025 at Can Tho University, 2026 at Yuan Ze
  University, Taiwan
- Tracks on intelligent and recommender systems, data science and machine learning, image processing and pattern
  recognition, and NLP
- Long papers 12 to 15 pages, short papers 6 to 8 pages in LNCS/CCIS format via EasyChair
- About 35% of papers go to Springer CCIS (2025 in volumes 2714 and 2716); others go to the CTU Journal of Innovation
  and Sustainable Development or other local journals
- Selected extended papers considered for SN Computer Science special issues
- "Fee for the CCIS track: 250 USD for Vietnam and Taiwan, 300 USD for others (2026)"
- Submission deadline was extended by about two weeks in 2025 and 2026; not listed in CORE ICORE2026
