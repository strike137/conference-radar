notes:
- Volunteer-run Security BSides conference for Northern Ireland, first held in 2016 and back every year since 2023
- One day in September at the Europa Hotel, Belfast; 2026 was the ten year anniversary edition
- Around 600 to 700 attendees expected; at least two tracks of talks plus technical workshops
- Sessions of 35 minutes and lightning talks of 15 minutes including Q&A, judged by an independent panel; over 100 submissions in 2026
- Speaker support sessions for first-time speakers during the call for proposals
- Talks are posted on YouTube, no proceedings
