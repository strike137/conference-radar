notes:
- Standalone two-day workshop sponsored by ACM SIGMOBILE; held every late February in the USA (2022 Tempe, 2023
  Newport Beach, 2024 San Diego, 2025 La Quinta, 2026 Atlanta, 2027 Tucson)
- Short position and early-stage idea papers (6 pages including references, ACM two-column format); submissions are
  not anonymous
- Papers appear in the ACM Digital Library; ACM Open Access applies and authors from institutions outside ACM Open pay
  an APC (subsidized to 500 USD for ACM/SIG members, 750 USD for non-members in 2027)
- Small, highly selective and interactive format; well regarded in the mobile systems community as a venue for ideas
  ahead of a full MobiSys or MobiCom paper (ICORE2026 National USA)
- Separate poster and demo call with a deadline in late January
