notes:
- Workshop on scheduling for HPC, clusters, clouds and data centers, held since 1995 (29th edition in 2026)
- Co-located with IEEE IPDPS every year, so it moves with IPDPS (online 2021 and 2022, St. Petersburg FL 2023, San
  Francisco 2024, Milan 2025, New Orleans 2026)
- Revised selected papers published as a Springer LNCS volume after the workshop (LNCS 16210 for 2025, LNCS 16980 for
  2026)
- Accepts regular papers, workload trace papers and open scheduling problem papers; LNCS format up to 20 pages,
  single-blind review by at least three PC members
- Small single-day workshop (13 papers in 2026, 10 in 2024)
- CORE C (ICORE2026); not on the CCF 2026 list
