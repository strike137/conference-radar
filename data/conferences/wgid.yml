notes:
- Co-located workshop of SBSeg, the Brazilian Symposium on Cybersecurity run by the Brazilian Computer Society
  (SBC); 16th edition in 2026
- Covers identity and access management (authentication, authorization, federations, decentralized identity,
  privacy, Zero Trust)
- Extended abstracts up to 4 pages in Portuguese or English in the SBC template; work in progress and practical
  experience reports welcome; submission through JEMS3
- Accepted abstracts published in the SBSeg extended proceedings (Anais Estendidos) in SBC OpenLib (SOL); presented
  in person by one author
- Held with SBSeg in a different Brazilian city each year (Armação dos Búzios 2026)
- Not listed in CORE ICORE2026
