notes:
- Largest Russian practitioner conference on engineering large, high-load systems, organized by Ontico in Moscow; first held in 2007
- Program covers architecture of large projects, databases and storage, DevOps and system administration, load testing and operations; a new agent platform section in 2026
- Russian-language site and program; offline plus online participation
- About 2,500+ participants and 100+ speakers expected in 2026; talk proposals reviewed by a program committee of practitioners, with curators helping accepted speakers
- No papers or proceedings; talk videos and slides published by the organizer
- A separate spring/summer edition, Saint HighLoad++, is held in Saint Petersburg (June 2026, June 2027)
- Not listed in CORE ICORE2026
