notes:
- Annual since 2002 (25th edition in 2026); covers shared virtual worlds, XR, computer graphics, visual computing, AI, human-machine interaction and cybersecurity for cyberworlds
- Proceedings with all accepted papers published by IEEE Computer Society Conference Publishing Services (CPS)
- Journal special issues planned in The Visual Computer (Springer) and Advanced Engineering Informatics (Elsevier)
- Full, short and poster papers through EasyChair; at least one author must register
- CW 2026 is hosted by the University of Bradford, UK, and run fully online, with optional in-person attendance in Bradford
- ICORE2026 rank C; not on the CCF 2026 list
