notes:
- Annual conference on intelligent environments, ambient intelligence, smart spaces, IoT and human-centred AI; the 2027 edition is the 23rd
- Supported by the IEEE SMC Society Technical Committee on Awareness Computing
- Accepted full papers (8 pages) and short papers (4 pages) published in IEEE proceedings, Scopus indexed
- Workshop papers go to the IOS Press Ambient Intelligence and Smart Environments (AISE) book series and the ACM Digital Library
- Hybrid format; in-person attendance preferred
- Recent editions in Europe (Ljubljana 2024, Darmstadt 2025, Lisbon 2026, Skopje 2027)
- Separate workshop paper deadline about three months after the main deadline
- "CORE ICORE2026: B"
