id: ieice-icm
name: IEICE ICM
full_name: IEICE Technical Committee on Information and Communication Management (ICM)
name_local: 電子情報通信学会 情報通信マネジメント研究会
type: meeting
tier: domestic
areas: [networking, communications]
region: japan
language: japanese
frequency: multiple-per-year
organizer: IEICE Communications Society, Technical Committee on Information and Communication Management
proceedings: IEICE Technical Report (non-refereed)
archival: false
rank:
  core: Unranked
fee: Presentation fee 3,300 JPY per talk for IEICE members (2026); audience fee from 3,300 JPY for members (1-day
  meeting, advance; 5,500 JPY for 2-day meetings); student members attend free via annual registration (up to 3
  committees)
typical:
  deadline_months: [3, 5, 9, 11]
  conference_months: [1, 3, 5, 7, 11]
links:
  website: https://www.ieice.org/~icm/jpn/
notes:
- Network and service operations and management, including security management; successor of the Telecommunication
  Management (TM) committee
- 'About five meetings a year: May joint with IPSJ IOT and CSEC, July with SC, November with NS, January with LOIS,
  and a standalone March meeting on an Okinawa island (Miyakojima in 2026, Kumejima planned for 2027)'
- Japanese host of APNOMS (APNOMS 2026 held Sep 9 to 11 in Kumamoto) and runs a yearly ICM Workshop
- Talks are published as non-refereed IEICE Technical Reports
