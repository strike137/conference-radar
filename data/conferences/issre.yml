notes:
- Long-running IEEE symposium on software reliability, dependability, testing and fault tolerance (37th edition in 2026)
- Proceedings published by IEEE CS Conference Publishing Services and included in IEEE Xplore
- Research track takes research papers, practical experience reports (up to 12 pages each) and tools and artefacts papers
  (6 to 10 pages); double-blind review with rebuttal and a major revision period
- Also has industry, fast abstracts, doctoral symposium, journal-first (J1/C2) and replication/negative results tracks plus
  co-located workshops
- Rotates worldwide (Tsukuba 2024, Sao Paulo 2025, Limassol 2026, Macao 2027)
- CORE A (ICORE2026) and CCF B
