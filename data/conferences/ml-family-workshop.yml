notes:
- Annual workshop on Standard ML, OCaml, F# and other ML-family languages, held with ICFP since 2005 and sponsored by ACM SIGPLAN
- Informal format since 2010; presentations are selected from short proposals and there are no published proceedings
- Only the abstract of accepted submissions is posted on the workshop website, so work can be published elsewhere
- Submission kinds are research presentations, experience reports, demos and informed positions
- Organized in close coordination with the OCaml Users and Developers Workshop
- In 2026 the workshop ran as two events with one program committee, at ICFP 2026 in Indianapolis and at FW'26
- Not listed in the CORE portal (ICORE2026)
