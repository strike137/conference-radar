notes:
- INSTICC conference on pattern recognition and machine learning (theory and applications); proceedings in SCITEPRESS
- Two submission stages plus late-breaking (2026) and abstracts tracks; all deadlines AoE
- 2027 edition co-located with ICORES, MODELSWARD, ICISSP (security) and BIOSTEC; registration gives free access
  to them
- Held in southern Europe (Marbella 2026, Valletta 2027); remote presentation allowed in exceptional cases
- CORE C; regarded as a smaller, fairly accessible venue
