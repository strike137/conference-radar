notes:
- Half-day workshop held with ACM SIGKDD every year since 2022 on ML and data science for customer journeys (acquisition, onboarding, retention, churn, pricing, LTV)
- Industry-focused; invited talks, contributed talks, posters and a panel
- 2026 was the 5th edition (Jeju, Korea); location follows KDD (2023 Long Beach, 2024 Barcelona, 2025 Toronto)
- Full papers up to 10 pages or extended abstracts of at least one page, ACM template, single-blind review, submission via EasyChair
- At least one author of each accepted paper must attend and present
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
