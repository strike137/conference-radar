notes:
- Long-running venue on FPGAs and reconfigurable custom computing; technical sponsors IEEE and IEEE Computer Society
- Proceedings in IEEE Xplore; a paper is left out of Xplore unless an author registers and attends
- Held every May in the USA (Orlando 2024, Fayetteville 2025, Atlanta 2026, Provo 2027)
- Abstract and paper deadlines in January are not extended; rebuttal period, artifact form and a Demo Night
- Workshops and tutorials on the days around the two-day main conference
- "CORE label: National/Regional (ICORE2026); CCF C"
