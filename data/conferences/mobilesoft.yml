notes:
- Sponsored by ACM, ACM SIGSOFT, IEEE Computer Society and IEEE-CS TCSE; always co-located with ICSE, so it moves with ICSE
- "Held in Ottawa (2025, with ICSE 2025), Rio de Janeiro (2026, 13th edition) and Dublin (2027, 14th edition, with ICSE 2027)"
- Full research papers up to 10 pages plus 2 pages of references; double-anonymous review with an open science policy
- Paper template alternates between ACM format (2026 and 2027) and IEEE format (2025)
- 2025 proceedings published by IEEE in IEEE Xplore (2025 IEEE/ACM 12th MOBILESoft, doi 10.1109/MOBILESoft66462.2025)
- 2025 selected papers were invited to an extended-version special issue of the ASE Journal
- Not listed in CORE ICORE2026
