notes:
- Non-profit, community-run C++ practitioner conference in Israel; 2026 was the 7th edition (earlier ones in 2019 and 2021 to 2025)
- Held at the Tel Aviv Cinematheque; two days with three parallel tracks in 2026, plus a tentative training day before
- Talks selected from community submissions, a few in Hebrew; all talks recorded and posted online
- Full two-day ticket 850 ILS, early bird 750 ILS (2026)
- No papers or proceedings
