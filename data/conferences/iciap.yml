notes:
- Organized every two years by CVPL, the Italian member society of the International Association for Pattern Recognition (IAPR)
- Proceedings in Springer LNCS (the 2025 proceedings page links one main conference volume and two workshop volumes)
- ICIAP 2025 (23rd edition) was hosted by Sapienza University of Rome
- Two submission rounds; double-blind review by two area chairs and at least three reviewers; 12 pages including references
- Workshops and tutorials on the first two days, main conference on the last three
- CORE ICORE2026 rank is National (Italy)
