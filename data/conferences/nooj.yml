notes:
- Annual meeting of the NooJ linguistic development environment community (corpus processing, dictionaries and grammars, NLP applications, digital humanities)
- Submission is a one-page abstract (300 to 600 words); after the conference, selected full papers go to a Springer CCIS volume
- Official CFP states a 30% to 35% acceptance rate for the CCIS volume
- Niche venue centred on one tool; includes basic and advanced NooJ tutorials for students
- Mostly held in Europe (Besancon 2021, Zadar 2023, Bergamo 2024, Paris 2025, Naples 2026), Rosario in 2022
- Not listed in ICORE2026 or the CCF 2026 list
