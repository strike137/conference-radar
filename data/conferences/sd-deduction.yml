notes:
- Workshop for the structural proof theory communities (deep inference, proof nets, cut-elimination, Curry-Howard, cyclic proofs, proof complexity)
- SD 2026 was the 6th edition, part of FLoC 2026 in Lisbon
- Earlier editions at ICALP 2005 (Lisbon), ESSLLI 2009 (Bordeaux), CSL-LICS 2014 (Vienna), FSCD 2017 (Oxford) and FSCD 2019 (Dortmund)
- Regular papers, work in progress, position papers or tutorials of 2 to 15 pages
- Program includes tutorials and invited talks; accepted papers are linked as PDFs from the workshop page
- Not listed in ICORE2026
