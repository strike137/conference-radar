notes:
- Produced and sponsored by the International Society for Quality Electronic Design; technical co-sponsors IEEE CASS and IEEE EDS, in cooperation with ACM SIGDA
- Covers electronic design automation, circuits, verification, reliability, hardware security and AI hardware
- Proceedings in IEEE Xplore and indexed in Scopus (per the CFP and the 2026 program booklet)
- Held in the San Francisco Bay Area; 2025 and 2026 at the Seven Hills Conference Center, San Francisco State University
- Hybrid format with limited virtual participation in 2026
- Not ranked in ICORE2026 and not in the CCF list
