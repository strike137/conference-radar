notes:
- Flagship image processing conference of the IEEE Signal Processing Society, held annually since 1994
- Rotates worldwide (2023 Kuala Lumpur, 2024 Abu Dhabi, 2025 Anchorage, 2026 Tampere, 2027 Singapore)
- Regular papers up to 5 pages plus 1 page of references, published in IEEE Xplore; author rebuttal phase
- Also has an ICIP review track of the IEEE Open Journal of Signal Processing (8+1 pages, APC applies), satellite
  workshops, grand challenges, and presentations of recent SPS journal papers
- One-page work-in-progress abstracts appear only in the proceedings distributed to participants
- Strict no-show policy; one full author registration covers up to four papers
- Main paper deadline was extended by two weeks in both 2025 and 2026
- ICIP 2027 in Singapore is co-located with IEEE CAI 2027 and IEEE ASLI 2027
