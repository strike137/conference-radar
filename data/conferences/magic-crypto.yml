notes:
- Residential workshop on cryptographic group actions (isogeny-based and code-based post-quantum cryptography)
- Program of invited and contributed talks plus working groups; no proceedings are mentioned
- Held at Borgo Lanciano, Castelraimondo, in the Marche region of Italy
- Registration includes room and board (400 EUR single, 320 EUR shared twin, early rate until 8 March 2026); over 60 participants in 2026
- 2026 edition ended at lunchtime on 8 May so participants could reach Rome for the Eurocrypt 2026 satellite events
- Co-funded by the Swiss National Science Foundation, under the patronage of De Cifris
- Not listed in ICORE2026 and not on the CCF list; unrelated to MAgiCS (migration and agility workshop)
