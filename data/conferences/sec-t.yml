notes:
- Security conference run by SEC-T, an independent Swedish non-profit
- Held every September at Munchenbryggeriet in central Stockholm, Sweden
- Two-day conference plus a free half-day community event the day before, a CTF and the Club SEC-T evening
- CFP in two rounds (May and July) on pretalx; about half of the talks are picked from each round
- Talks livestreamed and published as videos; no published proceedings (non-archival)
