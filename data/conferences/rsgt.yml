notes:
- Annual Scrum and agile practitioner conference in Tokyo, run by the non-profit Scrum Tokyo; 2027 is the 16th edition
- Sessions are solicited publicly on ConfEngine, refined by community voting and feedback, then selected by the committee
- Three days with keynotes, multi-track sessions and an Open Space day; coaches clinic for participants
- Keynotes on days 1 and 2 are in English and one track is in English; the rest is mostly Japanese
- Hybrid (in person plus online tickets) in 2024, 2026 and 2027; held at Bellesalle Haneda Airport in 2026 and 2027
- No papers or proceedings; talks only
- Not listed in CORE ICORE2026
