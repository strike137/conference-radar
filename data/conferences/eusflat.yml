notes:
- Biennial conference of the European Society for Fuzzy Logic and Technology on fuzzy logic, fuzzy sets, soft
  computing, aggregation, approximate reasoning and their applications
- Full papers are peer reviewed and published in Springer LNCS (2025 -> "Advances in Fuzzy Logic and Technology",
  two volumes)
- One-page abstracts can be submitted instead and go into a Book of Abstracts with ISBN; abstracts are
  screened by the programme committee for scope and novelty
- Held in Europe (Gijon 2015, Warsaw 2017, Prague 2019, Bratislava 2021, Palma de Mallorca 2023, Riga 2025)
- 2027 edition is joint with the IFSA World Congress as IFSA-EUSFLAT 2027 in Bari, Italy (2021 was also joint with IFSA)
- Fee 600 EUR early for members, 700 EUR for non-members, 500 to 550 EUR for students (2025, in-person); non-member
  fee includes two years of EUSFLAT membership
- Followed by the EUSFLAT Summer School on Fuzzy Logic and Applications (SFLA) in some years
