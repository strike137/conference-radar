links:
  website: https://rldm.org/
notes:
- Interdisciplinary meeting on learning and decision making over time, bringing together machine learning, neuroscience,
  psychology and economics researchers
- Abstract-based and non-archival; work under review or intended for other conferences or journals is welcome
- Submissions are a short summary plus a 1 to 4 page extended abstract, single blind, reviewed for relevance and quality;
  selected abstracts get oral or spotlight talks, the rest are posters
- Held roughly every two to three years (Princeton 2013, Edmonton 2015, Ann Arbor 2017, Montreal 2019, Providence 2022,
  Dublin 2025, Paris 2027)
- Not listed in ICORE2026
