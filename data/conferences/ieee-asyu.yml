notes:
- Turkish conference on intelligent systems held since 2004 (biennial until 2014, annual since 2016)
- Hosted by a different Turkish university each year (Bursa Technical University 2025, Ozyegin University 2026)
- Conference languages are Turkish and English
- Accepted and presented papers are published in IEEE Xplore; no-show papers are excluded
- Double-blind review by at least three reviewers; full papers up to 6 pages in IEEE format
- Not listed in the CORE ICORE2026 portal
