notes:
- Workshop co-located with ACM HPDC; quantum algorithms, quantum software and quantum information retrieval
- 1st edition in 2024 as the Workshop on Quantum Search and Information Retrieval (Pisa); renamed from 2025
- Papers of 5 to 8 pages in ACM sigconf format; single-blind review
- Accepted papers published by ACM in the workshop proceedings (2024 volume DOI 10.1145/3660318)
- Encourages papers written mainly by postgraduate students or postdocs; best paper and best student paper awards sponsored by Classiq in 2026
- Organized mainly by Italian universities (Palermo, Catania)
- Not listed in the ICORE2026 portal
