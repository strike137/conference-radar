notes:
- Annual meeting of the Cognitive Science Society; covers cognitive science, cognitive modeling and AI
- CORE B (ICORE2026), CCF B (2026 list, interdisciplinary category)
- Research papers up to six pages plus references, double-blind review; also symposia, member abstracts
  (posters) and workshops
- Online proceedings published by the society on eScholarship under CC-BY; the society states the proceedings are
  not archival, so papers can go on to journals
- At least one author must register and attend for a paper to appear in the program and proceedings
- Location rotates worldwide (Rio de Janeiro 2026 as a hybrid meeting, Bilbao 2027)
