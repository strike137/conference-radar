notes:
- One-day multidisciplinary workshop on security and privacy requirements engineering; 2026 theme was LLMs and generative AI
- Co-located with the IEEE RE conference every year since 2014 and follows it around the world (Valencia 2025, Montreal 2026); 2026 was the 13th edition
- Full papers of 8 pages plus 2 pages of references, short papers of 5 pages plus 1, IEEE template, submitted via EasyChair
- Accepted papers appear in the workshop proceedings via IEEE Xplore; one-page abstract submissions get a discussion slot but are not in the proceedings
- Best papers are invited to submit extended versions to a journal special section
- Website hosted by Bournemouth University; 2026 organizers from UT San Antonio, Bournemouth University, Ajou University and the University of Bergamo
- Not listed in ICORE2026 or the CCF 2026 list
