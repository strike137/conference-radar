id: cinti
name: IEEE CINTI
full_name: IEEE International Symposium on Computational Intelligence and Informatics
type: conference
tier: minor
areas: [ai]
region: europe
language: english
frequency: irregular
organizer: Obuda University (Budapest), IEEE Hungary Section, Hungarian Fuzzy Association and John von Neumann Computer
  Society; IEEE SMC Society technical co-sponsorship
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
fee: 350 EUR (2025, regular, before October 7), 300 EUR for students and IEEE members
typical:
  deadline_months: [8]
  conference_months: [11]
links:
  website: http://conf.uni-obuda.hu/cinti2025
notes:
- One of the Obuda University IEEE conference series (with SAMI, SACI, SISY, ICCC, INES)
- Held at Obuda University in Budapest every November (2020 virtual, 2022 joint with MACRo in Budapest and Tirgu Mures)
- Scope is soft computing and computational intelligence (fuzzy systems, neural networks, genetic algorithms) and informatics
- Proceedings go to IEEE Xplore; in person only, papers not presented are excluded
- 4 to 6 page IEEE double-column papers; one paper per registration fee
- Ran every year from 2020 to 2025 (25th edition in 2025); no 2026 edition, the 26th edition is listed for 2027
- Not listed in CORE ICORE2026 or the CCF list
