links:
  website: https://scf.acm.org/
notes:
- Annual ACM symposium on computational tools for making physical things, spanning graphics, HCI, mechanical engineering, materials, robotics, architecture and design
- Sponsored by ACM SIGGRAPH; ACM SIGCHI joined as co-sponsor in 2026
- Full papers are double-blind, reviewed by area chairs plus two external reviewers, and archived in the ACM DL under ACM Open (2026 subsidized APC 250 USD members, 350 USD non-members)
- No page limit; previous papers ran 5,000 to 10,000 words in the ACM sigconf format, video optional
- Separate later deadline for demos, posters and non-archival sketches
- In-person presentation required in 2026, no virtual registration
- Held in North America in most recent years (Seattle 2022, New York 2023, Aarhus 2024, MIT 2025, Tokyo 2026)
- Not listed in ICORE2026 or the CCF list
