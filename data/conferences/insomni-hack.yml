notes:
- Swiss security conference and CTF founded in 2008 as a small hacking contest; organized by Orange Cyberdefense
  Switzerland since 2023
- 2027 is the 18th edition, five days (workshops, 20+ talks, a party and the CTF) at the SwissTech Convention
  Center, Ecublens (Lausanne)
- The on-site CTF has about 700 participants in teams of up to eight
- No published proceedings
