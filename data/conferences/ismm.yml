notes:
- ACM SIGPLAN one-day symposium on memory management (garbage collection, allocation, memory systems), co-located with PLDI each June
- Double-blind review; papers up to 12 pages plus references in the ACM sigplan format
- Small program (9 accepted papers in 2026); proceedings in the ACM Digital Library
- Location follows PLDI (San Diego 2022, Orlando 2023, Copenhagen 2024, Seoul 2025, Boulder 2026)
- ICORE2026 rank C
