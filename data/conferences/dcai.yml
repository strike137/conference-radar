notes:
- Broad venue on distributed computing, multi-agent systems and applied AI; 2026 is the 23rd edition
- Main track, special sessions and doctoral consortium published in Springer Lecture Notes in Networks and Systems (several volumes per year)
- Papers up to 10 pages (6 for doctoral consortium), each reviewed by at least three experts; in-person presentation required
- Co-located with PAAMS and other events (PACBB, ISAMI, MIS4TEL and others) every year
- Held in Europe (Salamanca 2024, Lille 2025, Naples 2026)
- Selected papers invited to journal special issues (ADCAIJ, IJIMAI, CMC and others)
- 2026 deadlines were extended twice (17 Apr -> 8 May -> final 22 May)
- "CORE rank: National: Spain (ICORE2026)"
