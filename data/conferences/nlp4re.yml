notes:
- Full-day workshop co-located with REFSQ; 9th edition in 2026 (Poznan), 10th planned for REFSQ 2027 (Basel)
- Papers appear in the joint CEUR-WS volume of the REFSQ co-located events (2026 -> Vol-4208)
- Technical papers of 8 pages plus 2 pages of references, CEUR-ART single-column format
- Also accepts tool papers, report papers on a team's research, and summaries of papers already published at RE, ICSE or REFSQ (the latter not in the proceedings)
- Each submission gets three reviews
- Not listed in ICORE2026 and not on the CCF list (REFSQ itself is CORE B, CCF C)
