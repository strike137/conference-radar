notes:
- Japanese practitioner conference on platform engineering, run by the Cloud Native Innovators Association
- Held in Tokyo since 2024 (docomo R&D OPENLAB Odaiba 2024, Nakano Central Park Conference 2025 and 2026)
- One day with three rooms (Hall, Room A, Room B), onsite plus online streaming in 2025
- 2026 theme was AI Native Platform Engineering; keynote by Kaspar von Grunberg
- Talks chosen from a call for proposals (2024 CFP ran 2024-03-22 to 2024-04-27); no papers or proceedings
- Also co-hosted Cloud Native Kaigi in Nagoya in May 2026 with CloudNative Days and SRE Kaigi
