notes:
- Half-day workshop co-located with IEEE VTC-Spring; 3rd edition at VTC2026-Spring (Nice), 4th at VTC2027-Spring (Hamburg)
- General co-chairs from University of Calgary, UMH Spain, University of Windsor and Dalian Maritime University
- Topics are digital twins and distributed AI for IoT and vehicular networks (synchronization, edge-cloud collaboration, offloading, testbeds)
- Papers 5 pages (up to 2 extra pages at 100 USD each); accepted VTC papers go to IEEE Xplore and may be removed if not presented
- Different from the TwinNetApp and DTWIN workshops
- Not listed in ICORE2026
