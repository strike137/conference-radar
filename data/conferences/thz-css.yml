notes:
- One-day workshop co-located with IEEE MILCOM; first held with MILCOM 2024 in Washington DC, then Los Angeles 2025 and Rockville MD 2026
- Topics are sub-THz and THz transceivers, antennas and metasurfaces, channel modeling, beamforming, MAC and networking, THz sensing and radar, and physical layer security
- Papers up to 6 pages including references in the MILCOM IEEE two-column format, submitted via EDAS
- Accepted papers presented by an author appear in the IEEE MILCOM workshop proceedings and IEEE Xplore
- Steering committee from Northeastern University (Josep Miquel Jornet) and SUNY Polytechnic Institute
- Not listed in ICORE2026
