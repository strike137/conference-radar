notes:
- One-day workshop on post-quantum cryptography in real protocol implementations (formal verification, testing,
  side channels, migration)
- Co-located with ACNS 2025 in Munich and with IEEE EuroS&P 2026 in Lisbon (post-conference workshop)
- 2025 papers appeared in the Springer LNCS ACNS 2025 Satellite Workshops volume (LNCS 15654, Revised Selected Papers)
- 2026 submissions were non-anonymous extended abstracts of up to 3 pages that must link to a full version in an
  open access venue, arXiv or IACR ePrint; talk proposals also accepted; no proceedings named for 2026
- No SPIQE papers appear in the IEEE EuroS&PW 2026 proceedings volume
- '2026: 5 of 8 submissions accepted (3 papers, 2 talks) plus 3 invited talks'
- At least one author must present in person
