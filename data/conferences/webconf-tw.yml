notes:
- Annual two-day web technology conference in Taipei covering frontend, backend, DevOps, UI/UX, security, agile and AI agents
- First held in 2013 and restarted in 2023; annual since then
- Held at POPOP Taipei (Nanggang) in 2024, 2025 and 2026
- Invited speakers from industry; no public call for papers or proceedings
- Talks are not recorded; shared notes (HackMD) are provided; the official FAQ expects over 700 devices on site
