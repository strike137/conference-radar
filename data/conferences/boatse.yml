notes:
- One-day ICSE workshop on bots and LLM-based agents in software engineering; successor of BotSE (International Workshop on Bots in Software Engineering), renamed BoatSE in 2026
- Held with ICSE since 2019 (no 2024 edition); Melbourne 2023, Ottawa 2025, Rio de Janeiro 2026 (7th edition)
- Work-in-progress, position and experience papers up to 6 pages plus 1 page of references; extended abstracts up to 5 pages (APC free); ACM format
- At least three reviewers per submission; program includes keynotes and a panel
- 2026 proceedings published in the ACM Digital Library as "Proceedings of the 2026 7th International Workshop on Bots and Agents in Software Engineering"
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
