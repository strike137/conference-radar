id: icic
name: ICIC
full_name: International Conference on Intelligent Computing
type: conference
tier: minor
areas: [ai, data]
region: china
language: english
frequency: annual
organizer: 'Hosted by The Society of International Computing with a host university each year (2026: York University,
  Canada); financially supported by the National Natural Science Foundation of China'
organizer_country: [china]
proceedings: Springer LNCS/LNAI/LNBI (oral papers); poster papers on poster-openaccess.com
archival: true
indexing: [EI Compendex, Scopus, DBLP]
rank:
  core: Unranked
  ccf: C
typical:
  deadline_months: [3, 4]
  conference_months: [7, 8]
links:
  website: http://www.ic-icc.cn/2026/
notes:
- Annual since 2005, usually held in China (2025 Ningbo); the 2026 edition was hybrid at York University Markham
  Campus near Toronto
- Oral papers in Springer LNCS/LNAI/LNBI (40 volumes for 2026), which points to a very large acceptance volume;
  poster papers appear only on poster-openaccess.com
- CCF C since December 2022; not ranked by CORE
- Deadlines are routinely extended; camera-ready must be prepared in Word (the organizers discourage LaTeX)
