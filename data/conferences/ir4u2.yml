notes:
- Workshop on search and recommendation for understudied user groups (children, older adults, people with autism, intellectual disabilities or mental health conditions)
- 1st edition at ECIR 2024 (Glasgow, March 24, 2024); 2nd edition at SIGIR 2025 (Padua, July 17, 2025)
- 2024 papers in CEUR-WS Vol-3989, shared with the BIR workshop
- 2025 revised selected papers in Springer Communications in Computer and Information Science (CCIS 2786 shares the volume with BIAS 2025)
- Peer-reviewed papers of 4 to 12 pages in the CEURART single-column template, single-blind review; extended abstracts are editorially reviewed and not published
- Highly participatory full-day in-person workshop; at least one author per accepted paper must register and attend
- No 2026 edition announced on the official site, and it is not on the SIGIR 2026 accepted-workshops page
- Not ranked in ICORE2026 and not on the CCF list
