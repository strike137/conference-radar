notes:
- Workshop on long-form retrieval augmented report generation (deep research) and its evaluation, with a multilingual focus
- First edition co-located with ACL 2026 in San Diego
- Research papers up to 8 pages in ACL format via OpenReview (single-blind) or committed from ARR
- Direct submissions choose archival or non-archival after acceptance; archival papers go to the ACL Anthology (2026.rag4reports-1)
- Runs two shared tasks (automatic report evaluation and multilingual report generation) built on TREC RAGTIME data, with system papers
- Not listed in ICORE2026 and not on the CCF list
