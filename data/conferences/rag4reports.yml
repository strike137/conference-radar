notes:
- Workshop on long-form, citation-grounded report generation with RAG ("deep research"), multilingual RAG and
  report evaluation
- First edition on July 4, 2026, co-located with ACL 2026 in San Diego, USA
- Two shared tasks (automatic report evaluation, multilingual report generation) run on TIRA, using a corpus of
  English, Chinese, Russian and Arabic news
- Papers up to 8 pages in ACL format; direct submissions on OpenReview get single-blind review, ARR commitment
  also accepted
- Archival or non-archival at the authors' choice; archival papers in the ACL Anthology (2026.rag4reports-1, 14 papers)
- Not listed in the CORE ICORE2026 portal or on the CCF list
