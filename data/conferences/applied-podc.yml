  website: https://www.cse.chalmers.se/~elad/ApPLIED2026/
notes:
- One-day workshop co-located with ACM PODC that bridges distributed computing theory and the implementation and evaluation of distributed systems
- Topics include cloud and edge computing, consensus and distributed ledgers, security, machine learning and hybrid classic/quantum systems
- Accepted papers appear in the ACM Digital Library as ACM proceedings and on the workshop website
- Regular papers up to 8 pages plus 2 pages of references; short research statements up to 4 pages, ACM sigconf format, submission via HotCRP
- At least one author must register and present in person
- Held with PODC 2018, DISC 2019 and PODC 2021 to 2026 (online 2021, Salerno 2022, Orlando 2023, Nantes 2024, Huatulco 2025, Egham 2026)
- Usually two submission rounds (March and May); in 2026 only the May round was announced
- Not listed in CORE ICORE2026 or the CCF 2026 list
