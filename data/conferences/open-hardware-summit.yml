notes:
- Annual conference of the open source hardware community, hosted since 2010 by OSHWA, a US 501(c)(3) non-profit
- Talks on electronics, mechanics, digital fabrication, fashion technology and IP law, from industry, academia, arts and makers
- Around 300 attendees; talks livestreamed on YouTube, virtual tickets from 0 USD, no proceedings
- Location moves (New York 2023, Montreal 2024, Edinburgh 2025, Berlin 2026)
- 2026 edition hosted with NODE Forum for Digital Arts at TU Berlin
