notes:
- Hosted by KISA and organized by KIISC; described as KIISC's largest annual event
- Held every year since 1995 in Seoul, between April and July; 32nd edition Apr 16-17, 2026 at COEX, hybrid
- Program is built from session proposals (February) and invited talks, not peer-reviewed papers; 25 sessions and
  75 talks in 2026
- In Korean; audience is government, industry, military and academia; useful for networking rather than publication
