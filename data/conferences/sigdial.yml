notes:
- Main venue of SIGdial, the joint ACL and ISCA special interest group on discourse and dialogue
- Small venue; 116 submissions reviewed in 2025, 160 received in 2026 (134 after desk rejections and withdrawals)
- Proceedings in the ACL Anthology; the SIGdial site says they are indexed by Web of Science
- 'Two routes: direct submission via Softconf/START (long 8 pages, short 4 pages, demos) or commitment of ARR-reviewed
  papers; double-blind review'
- 'Rotates worldwide: Edinburgh 2022, Prague 2023, Kyoto 2024, Avignon 2025, Atlanta 2026'
- In-person presentation expected; remote only for exceptions such as visa denial
- Satellite workshops such as YRRSDS (young researchers in spoken dialogue systems) and DSTC are held alongside
- 2026 edition was moved to August 2 to 5 (workshops on Aug 2) to avoid the FIFA World Cup matches in Atlanta
- Not in the CCF 2026 list
