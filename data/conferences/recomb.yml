notes:
- Founded in 1997; run by the RECOMB Steering Committee; CORE B (ICORE2026), CCF B (2026 list)
- Up to 2025 proceedings were published by Springer (RECOMB 2025 in LNCS vol 15647)
- From 2026 no separate proceedings volume; accepted papers are listed on the conference website, indexed in DBLP and
  must be posted on bioRxiv or arXiv
- All accepted papers not published elsewhere are offered a Journal of Computational Biology special issue; partner
  journals (Cell Systems, Genome Research in the past) also take papers
- Main paper up to 10 pages; single-blind review
- Rotates worldwide (Istanbul 2023, Cambridge MA 2024, Seoul 2025, Thessaloniki 2026, Toronto 2027); satellite
  meetings (RECOMB-Seq, RECOMB-CG, RECOMB-CCB, ...) run just before the main conference
