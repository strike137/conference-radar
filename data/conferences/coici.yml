notes:
- Small regional computing conference run by UAEMex together with UACh and TecNM research groups in Mexico
- Papers in Spanish or English, at least 4 pages, at most 3 authors per paper; most talks are in Spanish
- The CFP states there are no conference proceedings; speakers receive a certificate
- The 3 best papers may be published in Revista Internacional de Investigacion e Innovacion Tecnologica (Latindex), which needs at least 10 pages
- No submission fee; submission via EasyChair
- 2026 edition held in person at Universidad Autonoma Chapingo (Texcoco) and online via Microsoft Teams
- Broad topics from signal processing, power electronics and robotics to AI, software engineering, security and ICT in education
- Not listed in ICORE2026 or the CCF list
