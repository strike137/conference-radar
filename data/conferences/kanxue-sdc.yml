notes:
- Practitioner security conference run by Kanxue, a long-running Chinese security community (reverse engineering,
  software security); first held in Beijing in 2017
- Held in Beijing 2017 to 2019 and in Shanghai since 2020; every edition since 2020 with a known date was on October 23
- One-day Chinese-language main conference of talks, plus paid training camps around it
- 2025 theme was trustworthy AI security; 2026 theme is human-machine co-intelligence reshaping attack and defense
- Talks only, no proceedings
- 2026 offers a combined SDC plus GEEKCON pass (both in Shanghai in late October)
