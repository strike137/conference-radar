links:
  website: https://smartgreens.scitevents.org/
notes:
- Organized by INSTICC; proceedings in the SCITEPRESS Digital Library, a short list of revised and extended papers
  is planned for a Springer CCIS book
- Topics are smart cities, green ICT, energy-aware systems, sustainable computing and energy engineering
- Co-located with CSEDU, VEHITS and CLOSER (2026 and 2027); registration gives free access to them
- Two submission stages (submit in the 1st stage for an earlier notification) plus an abstracts track; all deadlines
  AoE
- Held in Europe (Prague 2023, Angers 2024, Porto 2025, Benidorm 2026, Rome 2027; online in 2021 and 2022); remote
  presentation allowed only exceptionally
- Not listed in CORE ICORE2026 and not on the CCF list
