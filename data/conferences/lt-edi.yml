links:
  website: https://sites.google.com/view/lt-edi-2026
notes:
- Workshop on bias detection and mitigation, inclusive language generation, counter-narratives and fairness in NLP and LLMs, for English and under-resourced languages
- Held every year since 2021, each time with a different host conference (EACL 2021, ACL 2022, RANLP 2023, EACL 2024, LDK 2025, ACL 2026); mostly European hosts so far
- 2026 edition was a virtual workshop at ACL 2026 (San Diego) on July 4, 2026
- Proceedings in the ACL Anthology (30 papers in 2026, 37 in 2025, 40 in 2024, not counting front matter)
- Long papers up to 8 pages, short papers and posters or demos up to 4 pages, ACL format; each submission reviewed by three program committee members; ARR commitment also accepted
- Runs shared tasks (2026 homophobia and transphobia counter-narratives and meme classification, gender inclusive language generation) whose system papers appear in the proceedings
- Not ranked in ICORE2026 and not on the CCF list
