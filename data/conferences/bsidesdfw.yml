notes:
- Free one-day security conference and unconference for the Dallas/Fort Worth area, held every November since 2010
- Held at the University of Texas at Arlington (Nedderman Hall in 2026) in 2024 to 2026; earlier venues rotated around Dallas, Fort Worth, Plano, Richardson and Denton
- Call for proposals on Sessionize, open to all levels from first-time speakers; topics are security, privacy and hacking
- Several talk tracks, workshops, hardware hacking and lockpicking villages and a CTF
- Speakers pay their own travel and lodging; no proceedings
