notes:
- National conference of ICROS, the Korean Institute of Control, Robotics and Systems; 41st edition in 2026
- "Topics: control, robotics, automation and systems"
- Held each summer in Korea (Jeonbuk National University 2025, EXCO Daegu 2026, Sono Calm Delpino Goseong 2027)
- The 39th edition in 2024 marked the 30th anniversary of ICROS
- The domestic sibling of ICCAS, the international ICROS conference
- Regional ICROS chapter meetings (such as the ICROS-KROS Honam-Jeju joint meeting) are separate events
