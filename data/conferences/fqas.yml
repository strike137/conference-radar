notes:
- Biennial conference on flexible, intuitive access to information (flexible querying, information retrieval, databases, fuzzy logic, knowledge representation, LLM based question answering); first held in 1994
- Proceedings in Springer LNCS/LNAI (FQAS 2023 -> LNCS 14113, FQAS 2025 -> LNCS 16119); papers up to 12 pages in LNCS format
- Always held in Europe (Granada 2013, Cracow 2015, London 2017, Amantea 2019, Bratislava 2021, Palma de Mallorca 2023, Burgas 2025)
- FQAS 2027 is endorsed by EUSFLAT and is scheduled the week before IFSA-EUSFLAT 2027 in Bari
- CORE ICORE2026 rank C; not on the CCF list
