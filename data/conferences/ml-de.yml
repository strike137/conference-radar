notes:
- Workshop co-located with ECAI (1st at ECAI 2024 in Santiago de Compostela, 2nd at ECAI 2025 in Bologna)
- Full-length papers (up to 8 pages, PMLR template) published in PMLR (2025 -> vol. 277, 2024 -> vol. 255); authors can opt out
- Also takes 2-page extended abstracts, presentation-only abstracts of published work and a reproducibility track
- Double-blind review via EasyChair; review transfer option for papers rejected from the ECAI main track
- Topics include neural ODEs, PINNs, neural operators and hybrid ML-numerical solvers
- No edition held at IJCAI-ECAI 2026
- Not listed in ICORE2026 or the CCF list
