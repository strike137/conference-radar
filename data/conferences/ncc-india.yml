notes:
- India's main annual communications conference, organized since 1995 by the Joint Telematics Group of the IITs
  and IISc
- Host institution rotates every year (2025 IIT Delhi jointly with IIIT Delhi, IIT Jammu and IIT Jodhpur; 2026 IIT
  Hyderabad); recently late February or early March
- Despite the name it is an English-language, international-format conference; technically co-sponsored by IEEE
  ComSoc, proceedings in IEEE Xplore
- Double-blind review via EDAS; 4 to 6 page IEEE-format papers; symposia on communications, signal processing, networks,
  and RF/optical
- Paper deadline is typically late November, often extended by about a week
