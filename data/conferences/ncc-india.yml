notes:
- India's main annual communications conference, organized since 1995 by the Joint Telematics Group of the IITs
  and IISc
- Host institution rotates every year (2025 IIT Delhi jointly with IIIT Delhi, IIT Jammu and IIT Jodhpur; 2026 IIT
  Hyderabad; 2027 IISc Bengaluru jointly with IIT Goa, IIT Palakkad and IIIT Bangalore); recently late February or early March
- Despite the name it is an English-language, international-format conference; technically co-sponsored by IEEE
  ComSoc, proceedings in IEEE Xplore
- Double-blind review (EDAS up to 2026, Microsoft CMT for 2027); 6 page IEEE-format papers; symposia on communications,
  signal processing, networks, and RF/optical
- Paper deadline was late November for 2025 and 2026 but October for 2027; usually extended by one or two weeks
