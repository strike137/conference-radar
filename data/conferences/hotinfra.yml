links:
  website: https://hotinfra.org/2026/
notes:
- Workshop on system infrastructure and platforms such as AI infrastructure, sustainable data centers and edge computing, across the full stack from hardware to runtime systems
- Three paper types, regular, industry and retrospective study papers; retrospective papers may cover work published at top systems or architecture venues in the past year
- Papers up to 3 double-column pages excluding references, via HotCRP; double-blind for regular papers
- Accepted papers and slides are posted on the workshop website and authors may extend and publish the work elsewhere
- Co-located with ISCA 2023 (Orlando), SOSP 2024 (Austin) and ISCA 2026 (Raleigh)
- Not listed in CORE ICORE2026 and not on the CCF list
