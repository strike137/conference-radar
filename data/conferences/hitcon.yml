notes:
- Taiwan's main hacker conference, first held in 2005 by the CHROOT group; the community conference is in August
  at the Academia Sinica Humanities and Social Sciences building, Taipei
- CFP via Sessionize from late March to mid-May; 40-minute talks and 80-minute Hacking 101 tutorials; a Future Star
  program encourages student submissions
- Speakers get an honorarium (400 USD regular, 100 USD Hacking 101) and hotel nights
- Student ticket 2,500 TWD (valid student ID, age 24 or under); a separate student subsidy program gives free entry
  with a teacher's recommendation
- 'Yearly theme; 2026 was ''When AI Acts: Hacking the Age of Agentic Systems''. The separate HITCON Enterprise conference
  was last listed for 2024; HIT now runs a closed-door HITCON CISO Summit (Oct 21, 2026, Taipei)'
