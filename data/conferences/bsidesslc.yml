notes:
- Community-driven cybersecurity conference in the Salt Lake City area of Utah, run by the nonprofit Utah Cybersecurity Society
- Two days at the Conference Center at Miller Campus, Sandy, Utah; workshops and trainings plus talks, panels and community areas
- "Call for everything on Sessionize: talks, trainings, workshops and community arenas; in person only, no remote talks"
- New content not presented elsewhere gets priority; free admission for speakers
- CTF, raffle and a LilyGo CyberPassport hardware challenge; talks posted on YouTube; no proceedings
