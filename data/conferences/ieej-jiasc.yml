notes:
- Annual national conference of the IEEJ Industry Applications Society (D部門), held in Japan (usually at a university) in late August or early September
- Topics include power electronics, motor drives, motion control, mechatronics, rotating machines, electric vehicles, ITS and railways
- General sessions (oral, Japanese or English), organized sessions, symposia by the technical committees and a Young engineer Poster Competition (YPC)
- Papers are 2, 4 or 6 pages in Japanese or 4 or 6 pages in English; 6-page papers should be ready for IEEJ Transactions D or IEEJ JIA
- Submission limited to IEEJ members and members of co-sponsoring societies
- Proceedings distributed as a download to participants since 2021; past proceedings sold by IEEJ
- The 2026 edition was the 39th conference
- Not listed in CORE ICORE2026 or the CCF 2026 list
