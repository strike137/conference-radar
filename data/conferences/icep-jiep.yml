organizer: Japan Institute of Electronics Packaging (JIEP), technical co-sponsors IEEE EPS, IEEE EPS Japan Chapter, iMAPS and SMTA
organizer_country: [japan]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [10, 11]
