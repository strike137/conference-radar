links:
  website: https://www.jiep.or.jp/icep/
notes:
  - Largest international electronics packaging conference in Japan, held every spring since 2001
  - Sponsored by JIEP; technical co-sponsors IEEE EPS, IEEE EPS Japan Chapter, iMAPS and SMTA
  - Topics include advanced packaging, 2.xD/3D and heterogeneous integration, chiplets, hybrid bonding, high-speed and wireless components, power electronics, thermal management and optoelectronics
  - Peer-reviewed 2-page abstract, then a 2-page final paper; abstracts themselves are not published
  - Presented papers go to IEEE Xplore (EI Compendex and INSPEC indexing per the CFP); no-show papers are excluded
  - Sometimes joined with a partner event (ICEP-IAAC 2025 with the iMAPS All Asia Conference, ICEP-HBS 2026 with the Hybrid Bonding Symposium)
  - Moves between Japanese cities (Kumamoto 2023, Toyama 2024, Nagano 2025, Hiroshima 2026, Sapporo 2027)
  - About 1,200 attendees expected in 2027; strong industry participation and exhibition
  - Not listed in ICORE2026 or the CCF list
fee: JPY 80,000 non-member, JPY 65,000 member, JPY 20,000 student (2027)
