notes:
- Main venue for agents and multi-agent systems research, increasingly including LLM-based and agentic AI
- Double-blind with rebuttal; 8 pages plus references; reciprocal reviewer policy
- AAMAS 2027 is in Hanoi (May 2027); it drops the 2-page extended abstracts used up to 2026 and introduces 'Findings
  of AAMAS' for sound papers not selected for the main proceedings
- Rank moved from CORE A* (CORE2023) to A in ICORE2026
- AAMAS 2027 also has Blue Sky Ideas and AAAI fast tracks with later deadlines
