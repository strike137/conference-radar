notes:
- Organized by IARIA as part of the NexComm congress, co-located with ICDT, SPACOMM, CTRQ, ICONS and other IARIA events (25th edition in 2026)
- Published open access in the IARIA ThinkMind library (ISSN 2308-4413); prints via Curran Associates; selected papers invited to IARIA journals
- Onsite and online participation options
- Held in southern Europe (Porto 2021, Barcelona 2022 and 2024, Venice 2023 and 2026, Nice 2025, Lisbon 2027)
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Not to be confused with ACM ICN (Information-Centric Networking)
