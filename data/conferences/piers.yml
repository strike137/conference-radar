notes:
- Sponsored by The Electromagnetics Academy, a non-profit registered in the USA, founded in 1989 by the late Prof.
  Jin Au Kong of MIT
- Large symposium on electromagnetics, photonics, antennas and microwaves, organized as many focus sessions with
  keynote, invited and contributed talks
- Abstract submission first; full-length papers due a few months later and the paper deadline is not extended
- PIERS 2025 Chiba proceedings were posted to IEEE Xplore (February 2026)
- Held around the world and often in China (Hangzhou 2021, Prague 2023, Chengdu 2024, Abu Dhabi and Chiba 2025,
  Suzhou 2026, Daejeon 2027); some years have two editions
- Not listed in CORE (ICORE2026)
