id: r6d
name: R6D
full_name: International Workshop on Recovering 6D Object Pose
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: Organizing committee from CTU in Prague (BOP benchmark), Google, NVIDIA, MVTec and others
organizer_country: [europe, usa]
proceedings: ECCV Workshops proceedings or ICCV Workshops proceedings (IEEE Xplore, CVF Open Access)
archival: true
typical:
  deadline_months: [6, 7]
  conference_months: [9, 10]
links:
  website: https://cmp.felk.cvut.cz/sixd/workshop_2026/
notes:
- Workshop on 6D object pose estimation, held with ICCV or ECCV since 2015; 2026 was the 11th edition
- Run together with the BOP Challenge on the BOP object pose benchmark
- 2025 at ICCV in Honolulu, 2026 at ECCV in Malmo
- "Peer reviewed papers (7 to 14 pages in 2026, 4 to 8 pages in 2025) appear in the host conference workshop proceedings"
- In 2025 a second, later deadline accepted non-proceedings papers presented at the workshop only
- Not listed in ICORE2026 or the CCF list
