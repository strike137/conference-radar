id: r6d
name: R6D
full_name: International Workshop on Recovering 6D Object Pose
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizing committee (researchers from CTU in Prague, Google, Mistral, NVIDIA, MVTec, ENPC, Heidelberg University and others); co-located with ICCV or ECCV
organizer_country: [europe, usa]
proceedings: ICCV Workshops proceedings (CVF Open Access and IEEE Xplore) or ECCV Workshops proceedings (Springer)
archival: true
typical:
  deadline_months: [6, 7]
  conference_months: [9, 10]
links:
  website: https://cmp.felk.cvut.cz/sixd/workshop_2026/
notes:
- Workshop on 6D object pose estimation and related object-centric vision, held with ICCV or ECCV since 2015 (11th edition in 2026)
- Runs the BOP Challenge benchmark on object pose estimation alongside the workshop (2026 challenge on 3D/2D object grounding)
- 2026 papers of 7 to 14 pages were peer reviewed and appear in the ECCV 2026 workshop proceedings
- 2025 had two tracks, in-proceedings papers (4 to 8 pages, ICCV workshop proceedings) and later non-proceedings papers presented only at the workshop
- Submission through OpenReview
- Not listed in ICORE2026 or the CCF list
