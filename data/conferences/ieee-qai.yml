id: ieee-qai
name: IEEE QAI
full_name: IEEE International Conference on Quantum Artificial Intelligence
type: conference
tier: minor
areas: [ai]
region: europe
language: english
frequency: annual
organizer: IEEE CIS Task Force on Quantum Intelligence, with IEEE CIS, IEEE Computer Society and IEEE SMC as sponsors
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
indexing: [Scopus]
typical:
  deadline_months: [3, 7]
  conference_months: [9, 12]
links:
  website: https://attend.ieee.org/qai-2026/
notes:
- New series at the intersection of quantum computing and AI; 2nd edition in 2026
- Society cosponsored by IEEE CIS; held in association with the IEEE CIS Task Force on Quantum Intelligence
- Accepted and presented papers go to IEEE Xplore and are indexed by Scopus
- Double-blind review; papers up to 6 pages, plus up to 2 extra pages at 150 USD each
- Late-breaking papers, journal-to-conference (J2C) presentations and a doctoral colloquium are presented but not included in the proceedings
- 'Held in Europe so far: Nottingham, UK (2026), Oslo, Norway (2027)'
- Not listed in CORE ICORE2026 or the CCF 2026 list
