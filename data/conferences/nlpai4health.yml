notes:
- Workshop on NLP and AI for multilingual, patient-centric healthcare communication, with a focus on low-resource Indian languages
- Organized by Christian Medical College Vellore and IIIT Hyderabad
- 2nd edition held with IJCNLP-AACL 2025 in Mumbai on December 23, 2025
- 2025 shared task on multilingual health question answering (head and neck cancer, cystic fibrosis) in 8 languages
- Proceedings in the ACL Anthology (2025.nlpai4health-main)
- "Acceptance rate: about 36% (2025, 4 of 11 submissions)"
- Not listed in ICORE2026 and not on the CCF list
