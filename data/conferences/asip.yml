id: asip
name: ASIP
full_name: Asia Symposium on Image Processing
type: conference
tier: minor
areas: [vision]
region: asia-pacific
language: english
frequency: annual
organizer: Commercial conference secretariat (zmeeting.org submission system, acm-sg.org contact) with a host university each year (2026 Wuxi University, IEEE co-sponsor)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 550 USD author early, 500 USD student early, 250 USD presentation only (2026)
typical:
  deadline_months: [3, 10]
  conference_months: [6, 12]
links:
  website: https://asip.net/
notes:
- Annual since 2019; Tianjin 2023 and 2024 (hybrid), Tsukuba 2025 (hybrid), Wuxi 2026
- Held in June up to 2025; the 2026 edition moved to December
- Proceedings of 2024 and 2025 in IEEE Xplore (linked from the official site), stated as EI Compendex and Scopus indexed
- 2026 accepted papers are to be published in IEEE conference proceedings
- Selected papers can go to the Journal of Image and Graphics
- Run by a commercial conference secretariat with a host university each year; abstract only presentation without publication is also offered
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
