notes:
- Colloque Africain sur la Recherche en Informatique et en Mathematiques Appliquees; flagship conference of ASDS, held every two years since 1992 (Yaounde)
- Rotates across Africa (Senegal 2014 and 2020, Tunisia 2016, South Africa 2018, Cameroon and Tunisia 2022, Bejaia 2024, Cotonou 2026)
- Two tracks, computer science and applied mathematics; partners include Inria, IRD and CIRAD
- Proceedings in Springer CCIS (CARI 2024) or Trends in Mathematics; selected papers invited to the ARIMA journal
- Full papers up to 14 pages, work in progress and position papers up to 7 pages, LNCS format, single-blind review via EasyChair
- CARI 2024 received 210 submissions from 28 countries
- Not listed in CORE ICORE2026
