notes:
- Community-driven BSides conference focused on deep technical information security topics, held in Singapore since
  2019
- Single-track one-day format with talks and hands-on workshops; around 150 to 200 participants per edition
- 2020 to 2022 editions were virtual; in-person again from 2023
- After a hiatus following the 6th edition (September 2024), the 7th edition has been announced; call for speakers
  and workshops not yet open
- No proceedings; presentation slides are archived on the BSidesSG GitHub
