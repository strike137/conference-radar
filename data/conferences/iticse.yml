notes:
- ACM SIGCSE conference on computing education, held annually since 1996, the European sister of SIGCSE TS
- CORE B (ICORE2026)
- Proceedings in two volumes in the ACM DL (V. 1 papers, V. 2 posters, panels, tips and working group material)
- Full papers up to six pages plus one page of references; anonymous review; mandatory abstract one week before the
  paper deadline
- Known for its working groups, which meet for several days before the conference and publish reports
- Held in Europe (Turku 2023, Milan 2024, Nijmegen 2025, Madrid 2026, Glasgow 2027)
