notes:
- Satellite workshop of MICCAI since 2017 on graph-based, higher-order and topology-informed methods for biomedical image analysis
- 8th edition in 2026; moves with MICCAI (Marrakesh 2024, Daejeon 2025, Strasbourg 2026)
- Proceedings in Springer LNCS (GRAIL 2025 shared one LNCS volume with RIME 2025)
- Joint format with Topology-Guided Imaging (TGI) and Hypergraphs in MedIA (HGMIA) in 2025
- Double-blind review via OpenReview; up to 8 pages plus up to 2 pages of references in LNCS format
- Half-day in-person workshop in 2026 with keynotes and oral sessions; best paper awards from sponsors
- Not listed in CORE ICORE2026 or the CCF 2026 list
