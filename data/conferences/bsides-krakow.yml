notes:
- Community-run Security BSides conference in Kraków, Poland, first held in 2022
- One-day conference on a Saturday in late September, held at the AGH Faculty of Computer Science (Kawiory 21, building D-17)
- About 500 participants per edition; talks, workshops and villages, with exclusive trainings in the days before
- Call for papers runs on Sessionize; talks are posted on YouTube, no proceedings
