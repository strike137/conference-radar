notes:
- IEEE MTT-S symposium on RF, millimeter-wave, sub-THz and THz integrated circuits and systems
- Opens the IEEE IMS week and is held at the same venue; it has its own call for papers, TPC and deadline (January,
  later than the IMS RFSA and RFTT tracks)
- Traces its roots to the IEEE Microwave and Millimeter-Wave Monolithic Circuits Symposium (1982 to 1996)
- Work must be demonstrated through IC hardware results and measurements
- Double-blind review with a conditional acceptance process; dedicated industry and startup track
- Accepted papers go into the RFIC Symposium Digest in IEEE Xplore
- Held in the USA every year (San Diego 2023, Washington DC 2024, San Francisco 2025, Boston 2026, San Antonio 2027)
- Circuits venue outside the usual CS rankings, not listed in ICORE2026
