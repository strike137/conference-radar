notes:
- Workshop on event cameras and neuromorphic vision (sensors, algorithms, datasets, applications)
- Held every two years with CVPR (2019, 2021, 2023, 2025); the first edition was at ICRA 2017
- 2025 was the 5th edition, a full day workshop in Nashville with invited talks, papers, demos and four challenges
- Papers in CVPR format, published open access through CVF (36 papers in 2025)
- Also accepts non-archival courtesy presentations of papers accepted elsewhere
- Not listed in ICORE2026 or the CCF list
