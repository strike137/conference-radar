notes:
- Vietnamese chapter of the global Security BSides community; first edition held in Hanoi in October 2025
- Single-day practitioner event with technical talks, a panel discussion and paid add-on training courses
- Talks selected by a program committee of Vietnamese and international experts chaired by Nguyen Anh Quynh
- Call for papers asks for 30 to 45 minute original technical talks; English preferred, Vietnamese accepted
- 2026 edition (theme NoHuman) reported 160+ attendees; talk recordings published on YouTube, no proceedings
- Low ticket prices make it easy for students in Vietnam to attend
