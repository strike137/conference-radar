notes:
- NeurIPS workshop since 2022 bringing together machine learning researchers, neuroscientists and mathematicians
  on geometry, topology and symmetry in biological and artificial neural representations
- Held with NeurIPS (New Orleans 2022 and 2023, Vancouver 2024, San Diego 2025, Sydney 2026)
- "Three tracks in 2026: archival proceedings papers (9 pages, PMLR), non-archival extended abstracts (4 pages)
  and a new single-blind Findings track for collaborative experimental and theoretical neuroscience work"
- Proceedings in PMLR volumes 197 (2022), 228 (2023) and 282 (2024 and 2025 combined)
- Double-blind review on OpenReview for the proceedings and extended abstract tracks
- Proceedings papers must add at least 30% new material relative to work published or under review elsewhere
- 140 proceedings and 202 extended abstract submissions in 2026
- Not listed in CORE ICORE2026 or the CCF 2026 list
