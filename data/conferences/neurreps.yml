notes:
- NeurIPS workshop on geometry, topology and symmetry in deep learning and neuroscience (equivariance, representational geometry, topological data analysis)
- Moves with NeurIPS; 2024 in Vancouver, 2025 in San Diego, 2026 in Sydney, Australia
- "Three tracks: archival proceedings papers (9 pages, PMLR), non-archival extended abstracts (4 pages) and a single-blind Findings track for neuroscience work"
- The 2024 and 2025 proceedings are in PMLR volume 282
- 2026 received 140 proceedings and 202 extended abstract submissions
- Double-blind review on OpenReview for the proceedings and extended abstract tracks
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
