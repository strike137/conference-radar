notes:
- Workshop on temporal analysis of Web data, Web archives and Web dynamics, held with The Web Conference (WWW) every year since WWW 2011 in Hyderabad
- Organized by Marc Spaniol (Universite de Caen Normandie), Omar Alonso (Amazon) and Ricardo Baeza-Yates
- Papers appear in The Web Conference Companion Proceedings in the ACM Digital Library
- Research papers up to 6 pages, tool presentations and position papers up to 2 pages, ACM template
- Fast-track option in 2025 for selected main track papers, submitted together with their main track reviews
- Location follows The Web Conference (Sydney 2025, Dubai 2026, Dublin 2027)
- Not listed in the CORE ICORE2026 portal
