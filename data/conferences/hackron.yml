notes:
- Cybersecurity congress of the Canary Islands, Spain, run by HACKRON S.C. from Santa Cruz de Tenerife
- Started in Tenerife; the site reports 13 editions, 4800 attendees and 190 technical talks so far
- Tracks on reversing, malware, red team, forensics, offensive AI and IoT, plus a live CTF
- Plans editions on several islands (Gran Canaria 2026, others later, Tenerife in May 2027)
- Talks selected through an open CFP; site in Spanish and English
- Student, Professional and VIP tickets
- No proceedings
