notes:
- Brings together systems researchers and cryptographers on deploying secure multi-party computation (MPC) in practice
- Organized by Vasia Kalavri, John Liagouris and Mayank Varia (Boston University); supported by the MPC Alliance
- 1st edition was a standalone event at Boston University (July 10, 2025); 2nd edition co-located with SOSP 2026 in Prague
- Half-day workshop with a keynote, invited talk, contributed talks and posters
- Submissions for full talks (20 min), lightning talks (5 min) and posters via a Google Form; published work and work in progress both welcome
- No papers or proceedings; talks and posters only
- Not listed in CORE ICORE2026 or the CCF list
