notes:
- Romanian conference on e-health, medical informatics, biosignal and image processing, telemedicine and biomedical engineering
- Organized by the Faculty of Medical Bioengineering of Grigore T. Popa University of Medicine and Pharmacy Iasi, with SISDE and the Institute of Computer Science of the Romanian Academy (Iasi branch)
- Held in Iasi, Romania, in hybrid format (online or on-site presentation); 2023 edition was in Bucharest
- Proceedings alternate between Springer Nature (IFMBE Proceedings vols. 109 to 111 for 2023) and IEEE Xplore (2024); 2025 and 2026 go to Springer Nature
- Double-blind review of full papers; minimum 6 pages in Springer format for individual indexing
- Biennial until 2019, annual since then; 2026 is the 14th edition
- Best papers invited to MDPI Sensors, Biosensors or Applied Sciences
