notes:
- Grassroots free, libre and open source software, hardware and culture conference in Seattle, founded in 2013 and run entirely by volunteers
- Held at the University of Washington (HUB) and streamed online; free to attend and registration is optional
- Talks chosen from a call for presentations on pretalx; four keynotes per year, half reserved for first time keynoters
- Tracks include cloud and infrastructure, languages and tools, open source AI and data science, security and privacy, hardware and education
- 90 proposals were submitted in 2025
- Talks only, no papers or proceedings; sponsored talks are not accepted
