links:
  website: https://parma-ditam-workshop.github.io/
notes:
- Joint workshop of PARMA (since 2010) and DITAM (since 2012), merged as PARMA-DITAM in 2014
- One-day workshop co-located with the HiPEAC conference in January
- Topics include accelerators, in-memory computing, energy optimization, heterogeneous and edge systems, compilers
  and tools, RISC-V and open hardware
- Papers published open access with a DOI in Dagstuhl OASIcs (2026 edition is OASIcs volume 141)
- Double-blind review; full papers only, up to 10 pages single column in the OASIcs template; submission via EasyChair
- Best paper award sponsored by NVIDIA
- Not in the CORE portal (ICORE2026) and not in the CCF 2026 list
