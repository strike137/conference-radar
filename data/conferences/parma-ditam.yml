notes:
- Joint workshop of PARMA (since 2010) and DITAM (since 2012), merged as PARMA-DITAM since 2014
- One-day workshop co-located with the HiPEAC conference every January (Toulouse 2023, Munich 2024, Barcelona 2025, Krakow 2026, Glasgow 2027)
- Proceedings in the open-access Dagstuhl OASIcs series with DOIs (2026 -> OASIcs volume 141)
- Topics include accelerators, energy optimization, heterogeneous and edge computing, compilers and tools, RISC-V
- Full papers only, up to 10 pages single column (OASIcs template), double-blind review via EasyChair
- Deadlines usually get extended by one to two weeks
- Not listed in CORE ICORE2026
