notes:
- Run under IFIP TC12 Working Group 12.5; held annually since 2004 (no edition in 2008), 22nd edition in 2026
- Proceedings in Springer IFIP AICT (several volumes per year, plus separate volumes for co-located workshops)
- Usually held in Greece or Cyprus (Crete, Corfu, Limassol); 2023 in Leon, Spain and 2027 in Rome, Italy
- Hybrid format; papers may be presented onsite or remotely
- Papers 8 to 14 pages in LNCS format, at least two reviewers; under 12 pages counts as a short paper
- Selected papers invited to journal special issues
- Not CCF listed; ICORE2026 lists it as National/Regional
- Submission deadline is often extended (2026 hard deadline was 13 days after the original)
