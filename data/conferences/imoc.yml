notes:
- Biennial conference run by the Brazilian Microwave and Optoelectronics Society (SBMO) with the IEEE Microwave
  Theory and Techniques Society (MTT-S); IEEE AP-S gave technical support in 2025
- Covers microwaves, RF, antennas and propagation, photonics, optical communications and optoelectronic devices
- Papers in English, 3 to 5 pages; accepted and presented papers go to IEEE Xplore
- Usually held in Brazil (Campina Grande 2025, Belém 2027); held in Europe in 2019 (Aveiro, Portugal) and 2023
  (Barcelona, Spain), virtual in 2021
- The 2027 edition has a special call on communications and sensing challenges in the Amazon region
- Not ranked in CORE ICORE2026
