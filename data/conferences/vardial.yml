notes:
- Workshop on computational methods and language resources for closely related languages, language varieties and dialects
- Held every year since 2014, alternating between COLING and ACL-family conferences (EACL 2023, NAACL 2024, COLING 2025, EACL 2026)
- Thirteenth edition held at EACL 2026 in Rabat, Morocco, on March 29, 2026 (half day)
- Proceedings in the ACL Anthology
- Papers up to 8 pages plus references via Softconf; ARR-reviewed papers and rejected EACL main conference papers can be committed
- Runs shared tasks alongside the workshop
- Not ranked in ICORE2026 and not on the CCF list
