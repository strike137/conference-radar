notes:
- Held since 1993, rotating among Korea, Japan, China, Australia, Indonesia, Malaysia and others; usually November
- Steering committee drawn from IEICE-CS (Japan), KICS (Korea) and CIC (China); member rates for CIC, IEICE, KICS
  and IEEE ComSoc
- CORE C (was B up to CORE2020)
- Papers up to 6 pages via EDAS; APCC 2026 also takes abstract-only presentations that are not published
- 2025 edition in Osaka was co-located with ICETC 2025
