notes:
- Long-running workshop on efficient and real-time computer vision on embedded and edge devices, held since 2005 (formerly the
  IEEE Workshop on Embedded Computer Vision)
- Usually co-located with CVPR in June; the 2025 edition was with ICCV 2025 in Hawaii (October) and 2020 with ECCV
- Double-blind review through Microsoft CMT, papers in CVPR format; demo abstracts up to 4 pages are not included in the proceedings
- Accepted papers go into the main conference workshop proceedings, indexed in EI Compendex (7 papers on CVF Open Access in 2026
  and in 2025)
- Has a yearly main theme (Energy-Efficient Embedded Vision in 2026) and best paper awards
- Not listed in ICORE2026 or the CCF list
