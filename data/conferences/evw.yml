notes:
- Workshop on efficient computer vision for embedded and edge devices (lightweight models, hardware, neuromorphic computing, UAVs, robotics)
- Held with CVPR or ICCV since 2005; 2026 was the 22nd edition (CVPR 2026, Denver); 2025 was held with ICCV 2025 in Hawaii
- Accepted papers go into the main conference workshop proceedings (CVF Open Access), indexed in EI Compendex; demo abstracts are not included
- Double-blind review in CVPR/ICCV format; submissions on CMT (2026) or OpenReview (2025)
- Yearly theme (Energy-Efficient Embedded Vision in 2026)
- Not listed in ICORE2026 and not on the CCF list
