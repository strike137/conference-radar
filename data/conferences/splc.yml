notes:
- Main venue for software product lines and variability; 29 editions up to 2025, steering committee chaired from ETS Montreal
- 'SPLC 2025 research track: 10 pages plus 2 of references (short papers 5 plus 2), double-blind, ACM template, proceedings in the ACM DL; artifact evaluation track'
- In 2026 SPLC merged with VaMoS and ICSR (Software Reuse) into VARIABILITY 2026, held 29 Sep to 2 Oct 2026 in Limassol, Cyprus, with two submission cycles and Springer LNCS proceedings
- Whether SPLC returns as a separate conference after VARIABILITY 2026 is not stated
- Usually held in early September; recent hosts Graz (2022), Tokyo (2023), Luxembourg (2024), A Coruña (2025)
- CORE B (ICORE2026, listed as Software Product Lines Conference)
