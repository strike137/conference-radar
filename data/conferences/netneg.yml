notes:
- Half-day workshop co-located with ACM SIGCOMM; first held at SIGCOMM 2026 in Denver, USA
- Venue for measurement studies whose methods, datasets or experimental designs did not yield the expected results
- Research papers up to 6 pages including references and appendices, or extended abstracts up to 2 pages, two-column
  10pt ACM format
- Double-blind review via HotCRP; authors of accepted papers present at the workshop
- SIGCOMM 2026 workshop papers go into the SIGCOMM proceedings in the ACM Digital Library unless the workshop opts out
- Not listed in ICORE2026 or the CCF 2026 list
