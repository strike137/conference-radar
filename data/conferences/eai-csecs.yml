notes:
- EAI conference on computer science research and computer science education (curricula, e-learning, AI, distributed computing)
- Co-organized by Boston University Metropolitan College and New Bulgarian University
- Proceedings in Springer LNICST; extended papers can go to EAI Endorsed Transactions on e-Learning
- Regular papers 12 to 20 pages, short papers 6 to 11 pages in Springer format; submission via Confy+
- Held in Sofia (2023, 2024) and Bratislava (2025); the 2026 edition moved to Boston and to November
- Not listed in ICORE2026
