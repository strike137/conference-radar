notes:
- EAI-sponsored conference held yearly in a Chinese city (2023 Haikou, 2024 Chongqing, 2025 Xi'an, 2026 Chengdu);
  virtual in 2020 and 2021
- Proceedings in Springer LNICST; full papers 12 to 15 pages, short papers 6 to 11 pages (Springer format); anonymized
  submission
- Hybrid participation offered; main track plus a later 'late track' deadline
- Selected papers invited to the Wireless Networks (WINET) journal
- Minor venue, not ranked by CORE or CCF
