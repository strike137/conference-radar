id: forc
name: FORC
full_name: Symposium on Foundations of Responsible Computing
type: conference
tier: minor
areas: [ai, security]
region: north-america
language: english
frequency: annual
organizer: FORC steering committee (supported by the Simons Foundation Collaboration on the Theory of Algorithmic Fairness)
organizer_country: [usa]
proceedings: LIPIcs
archival: true
typical:
  deadline_months: [11, 2]
  conference_months: [6]
links:
  website: https://responsiblecomputing.org/
  dblp: https://dblp.org/db/conf/forc/
notes:
- Theory venue for mathematical research on computation and society (fairness in ML, differential privacy, social
  choice, fair division, mechanism design, robustness, law and ethics)
- Proceedings published by LIPIcs (10-page version of each accepted paper); authors may ask for a one-page abstract
  with a link to the full paper instead, to keep journal publication open
- Two submission cycles since 2025 (November and February); single-blind review
- The former non-archival track was replaced in 2025 by a highlights track for talks on work published elsewhere
- Held in person, alternating between Harvard University and Stanford University (Harvard 2022, Stanford 2023,
  Harvard 2024, Stanford 2025, Harvard 2026, Stanford 2027); online in 2020 and 2021
- Registration is free; travel funding available on request
- Not listed in CORE ICORE2026 or the CCF list
