notes:
- One-day workshop affiliated with CHES, held on the opening day of CHES in the same city; registration goes
  through the CHES website
- Founded in 2004 in Florence; described on its CFP as the reference event for fault injection, fault attacks
  and countermeasures
- Proceedings published by IEEE Conference Publishing Services and submitted to IEEE Xplore (2004 to 2006
  selected papers appeared in Springer LNCS)
- Anonymous submission via EasyChair; full papers up to 12 pages, short papers up to 6 pages with "Short Paper"
  in the title
- At least one author per accepted paper must register and present for the paper to be included in the proceedings
- Location follows CHES (2023 Prague, 2024 Halifax, 2025 Kuala Lumpur, 2026 Antalya)
- Selected papers are invited to a Journal of Systems Architecture special issue on fault-aware security design
