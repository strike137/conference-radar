notes:
- Flagship conference of the IEEE Signal Processing Society; very large, covering speech, audio, image and communications
  signal processing and ML
- ICORE2026 lists ICASSP as a 'Multiconference' without a letter rank (it was CORE B in CORE2023)
- 4-page papers plus an optional fifth page for references; acceptance historically in the 40 to 50% range; no single
  author on more than 9 submissions
- Joint OJSP track for 8+1 page papers, and published journal papers can be presented
- 'Often in Asia: Seoul 2024, Hyderabad 2025, and Tokyo 2028'
