notes:
- Largest optical communications conference in Europe and the second largest worldwide (after OFC); held since 1975
- Moves to a different European country every year (Glasgow 2023, Frankfurt 2024, Copenhagen 2025, Malaga 2026,
  Milan 2027); host countries announced up to 2032
- Each year has its own conference website; the ECOC Exhibition runs alongside the conference
- "2026 rules: up to 3 pages plus one page for acknowledgements and references, mandatory ECOC template, reviewed by
  the Technical Programme Committee"
- Proceedings in IEEE Xplore (2023 published by IET, 2024 by VDE, 2025 by IEEE); 2026 postdeadline papers are published
  by Optica Publishing Group; selected authors are invited to extend papers for
  special issues of the Journal of Lightwave Technology or the Journal of Optical Communications and Networking
- Not listed in CORE or CCF (an optics and telecom venue rather than a computer science one)
