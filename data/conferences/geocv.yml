notes:
- Workshop on computer vision for satellite, aerial, drone and ground geospatial imagery and Earth observation
- Held with WACV every year since 2025; 2027 is the 3rd edition
- Regular papers of 5 to 8 pages in WACV format, peer reviewed through OpenReview, go into the WACV workshop proceedings
- 20 archival papers in 2025 and 16 in 2026, plus extended abstracts that are not archived in the proceedings
- Not listed in ICORE2026 or the CCF list
