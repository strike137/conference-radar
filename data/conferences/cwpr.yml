notes:
- Workshop of the Chilean Association for Pattern Recognition (AChiRP), held within the Jornadas Chilenas de Computación (JCC); 6th edition in 2026
- Covers pattern recognition broadly (computer vision, image and signal processing, biometrics, deep learning, remote sensing, NLP)
- Papers of 4 to 8 pages in IEEE-CS proceedings format, in Spanish or English, submitted via Microsoft CMT
- Papers presented at the workshop are published in the JCC proceedings in IEEE Xplore (indexed in Scopus); presentation by a registered author is required
- Separate from the international ICPRS conference
- Not listed in CORE ICORE2026
