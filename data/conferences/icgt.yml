notes:
- Main venue for graph transformation, graph grammars and graph languages, covering both theory and applications
  such as model driven engineering and verification
- Held since 2002; biennial until 2012 and annual since 2014; the 2026 edition was the 19th
- CORE B (ICORE2026, listed as International Conference on Graph Transformations); not on the CCF list
- Co-located with STAF (Software Technologies, Applications and Foundations) in recent editions
- Proceedings published by Springer in LNCS
- Regular papers up to 16 pages LNCS style, tool and vision papers up to 8 pages, plus journal-first extended
  abstracts; single-blind review by at least three reviewers
- Held in Europe (Leicester 2023, Enschede 2024, Koblenz 2025, Rennes 2026)
