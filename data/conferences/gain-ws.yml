id: gain-ws
name: GAIN
full_name: IEEE/IFIP Workshop on Generative AI for Network Management
type: workshop
tier: minor
areas: [networking, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop chairs from University of Toronto, Budapest University of Technology and Economics and Blekinge Institute of Technology, at IEEE/IFIP NOMS
organizer_country: [canada, europe]
proceedings: IEEE Xplore (NOMS workshop proceedings)
archival: true
typical:
  deadline_months: [1, 2]
  conference_months: [5]
links:
  website: https://sites.google.com/view/3nd-ieee-ifip-noms-gain-ws/startseite
notes:
- Co-located with IEEE/IFIP NOMS since 2024 (Seoul 2024, Honolulu 2025, Rome 2026), so it moves with the host
- Topics are generative AI and LLMs for network management along FCAPS; 2026 added agentic AI
- Scientific and industrial use case papers, at most 6 pages in IEEE double-column format, submitted via JEMS3
- Accepted and presented papers appear in the NOMS proceedings and are submitted to IEEE Xplore; in-person presentation expected
- Half-day workshop with six papers in 2026; deadline was extended twice that year
