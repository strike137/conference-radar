notes:
- Workshop held with ACM SIGMOD/PODS since 2017, so it moves with SIGMOD (2026 in Bengaluru, India)
- 'Scope: data management problems in end-to-end ML pipelines (data preparation, model management, ML lifecycle, responsible ML, LLM data systems)'
- Research papers up to 8 pages and short papers up to 4 pages plus references, ACM sigconf format
- Single-anonymous review via Microsoft CMT
- Papers appear in the ACM Digital Library (DEEM 2025 and 2026 proceedings are linked from the site)
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
