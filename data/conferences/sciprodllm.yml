notes:
- Workshop on LLMs in the research workflow (ideation, experimentation, writing, peer review) with human oversight, and on evaluating LLM-assisted papers
- 1st edition held at IJCNLP-AACL 2025 in Mumbai (hybrid) on 23 December 2025
- Long (8 pages) and short (4 pages) papers, double-blind review via OpenReview; also takes ARR commitments and non-archival presentations of published papers
- Accepted papers appear in the ACL Anthology with DOIs (5 papers in 2025.sciprodllm-1)
- Only one edition so far; no 2026 edition announced as of 2026-11
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
