organizer: SciProdLLM organizing committee (2025 editors Wei Zhao, Jennifer D'Souza, Steffen Eger, Anne Lauscher, Yufang Hou, Nafise Sadat Moosavi, Tristan Miller, Chenghua Lin); co-located with IJCNLP-AACL 2025
