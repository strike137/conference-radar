notes:
- Full-day workshop on Age of Information, semantics of information and goal-oriented communication, first held
  with ACM MobiHoc 2026 in Tokyo
- Separate from the IEEE INFOCOM ASoI workshop (asoi), which has an overlapping topic and chair but publishes in
  IEEE Xplore
- Papers up to 6 pages in ACM double-column format including references; submission via HotCRP
- Accepted papers go into the ACM MobiHoc 2026 proceedings; one full registration per paper; ACM open access APC
  (250 USD members, 350 USD non-members in 2026) applies outside ACM Open institutions
- Not listed in the CORE portal (ICORE2026) or the CCF list
