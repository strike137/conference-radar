links:
  website: https://in.pycon.org/
notes:
- National conference of the Python community in India, run entirely by volunteers; first held in 2009
- 2025 was the 16th edition, in Bengaluru (workshop day, two conference days at NIMHANS Convention Centre, dev sprint day)
- Talks of 30 minutes and 3 hour workshops chosen from a call for proposals, plus panels, posters and lightning talks
- Proposals get an initial screening, an internal review and an external review; shortlisted speakers rehearse online
- No proceedings; practitioner talks only
- 'Recent venues: Chennai 2019, Hyderabad 2023, Bengaluru 2024 and 2025'
