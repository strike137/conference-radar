notes:
- Workshop of the IEEE ComSoc CQR Technical Committee on the reliability of communications networks
- In 2025 and 2026 collocated with the Real-Time Communications (RTC) Conference at Illinois Institute of
  Technology, Chicago; one registration covers both events
- Papers are submitted to the RTC research track with CQR selected as the category; accepted and presented papers
  are sent to IEEE Xplore
- Regular papers 4 to 8 pages, work-in-progress papers up to 4 pages (IEEE two-column)
- 2026 theme was trusted communications infrastructure (AI, quantum, cloud and 6G)
- Earlier editions were all in the USA (Austin 2018, Naples FL 2019, Washington DC 2022); the 2020 and 2021
  editions were virtual
- Not listed in the CORE portal (ICORE2026)
