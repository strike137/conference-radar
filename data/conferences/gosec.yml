notes:
- Annual practitioner cybersecurity conference in Montreal run by the security company GoSecure, held for over 20 years
- Held at the Palais des congres de Montreal; hybrid with virtual attendance through Swapcard
- Sessions in French and English; 45 minute talks, workshops, trainings and panels; no sales pitches accepted
- About 1500 attendees, 40+ sessions and 6 keynotes per year according to the organizer
- Call for speakers runs in two rounds (April and June); proposals go through a form on the website
- "Early bird fee for 2026: 515 CAD all-inclusive, 425 CAD hybrid, 255 CAD virtual"
- Eligible for ISC2 CPE credits
