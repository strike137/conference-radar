notes:
- Run by Baselios Mathews II College of Engineering, Sasthamcotta, Kollam, Kerala, India, and sponsored by the IEEE Kerala Section
- Registered and presented papers are submitted to IEEE Xplore
- Held at BMCE Kollam every August since 2023 (6th 2023, 7th 2024, 8th 2025, 9th 2026); earlier editions 2013 to 2017
- Covers electrical, electronic and computer engineering with a power and circuits focus
- Reviewing through Microsoft CMT
- Not listed in the CORE ICORE2026 portal
