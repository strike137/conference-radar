notes:
- Biennial electronics conference (even years) organized by TalTech, which has hosted it in Tallinn, Estonia since 1996
- 2026 was the 20th edition
- "Tracks: communication and cognitive systems, embedded and cyber-physical systems, power electronics, sensing and
  signal processing, bioinstrumentation, cybersecurity"
- Four to six page full papers in IEEE format via EasyChair; four pages included in the registration fee
- Papers go to IEEE Xplore only if the presenting author registers and attends (no-show papers are removed)
- Free registrations and mentoring for PhD students in 2026
- Not listed in ICORE2026 or the CCF 2026 list
