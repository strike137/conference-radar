notes:
- Technically sponsored by the Soft Computing Research Society (SCRS, New Delhi), which runs many hybrid conferences each year with Indian host institutions
- After-conference proceedings in Springer Lecture Notes in Networks and Systems (LNNS) since 2025; the 2024 edition went to the Springer series Algorithms for Intelligent Systems
- Hosted by a different Indian institution each year (SPSU Udaipur 2024, Sardar Patel University Mandi 2025, NFSU Goa Campus 2026)
- Dates move around the calendar (February 2024, May 2025, January 2026)
- 7th edition in 2026; submission via Microsoft CMT
- High-volume event; not listed in CORE ICORE2026 and not on the CCF list
