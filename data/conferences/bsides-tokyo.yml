notes:
- Community-driven, BSides-approved information security conference in Tokyo, running since 2018 (editions in 2018,
  2019, then 2023 to 2026)
- One-day Saturday event with 30 minute talk slots, workshops (added in 2026) and an evening after-party
- Talks are given in English or Japanese
- Call for presentations ran in three rounds in 2025 (deadlines from February to April); proposals not selected in
  one round were carried over to the next
- The 2023 edition was held as part of SECCON 2022 DENNO-KAIGI; recent venues were provided by GMO Internet Group
  (2024, 2025) and IIJ (2026)
- No proceedings; low ticket price makes it easy for students to attend
