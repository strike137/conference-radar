notes:
- Annual French-speaking database and data management conference, held since 1985 (originally Bases de Donnees Avancees); 2026 is the 42nd edition
- Held in a different French city each year (Orleans 2024, Toulouse 2025, Dijon 2026)
- Long papers (12 pages), short papers (6 pages), PhD student papers (2 pages, posters) and demos (5 pages), in French or English, ACM sigconf format
- Accepts unpublished (NP) papers, including ones under double submission, and already published (P) papers that appear only as a 2-page summary
- Actes are informal; the BDA community site says proceedings since 2015 are on HAL, and the 2025 actes PDF was password-protected for participants
- Best papers invited to a TLDKS journal special issue
- Includes a BDA PhD thesis prize
- "Registration fee: 270 EUR student, 370 EUR academic before the early deadline (2026)"
- Not listed in the CORE portal (ICORE2026)
