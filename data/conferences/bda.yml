notes:
- Annual French national conference of the BDA data management community
- 42nd edition in 2026 in Dijon, hosted by Université Bourgogne Europe (venue moved to ESEO Dijon)
- Long papers up to 12 pages, short papers up to 6, PhD student papers up to 2 (poster), demos up to 5; ACM sigconf format
- Papers in French or English; submission via Microsoft CMT
- "Two submission types: NP (original unpublished work, dual submission allowed) and P (already published at an international venue, only a 2-page abstract goes into the proceedings)"
- Best papers invited to extend their work for a special issue of the TLDKS journal
- BDA PhD thesis award presented at the conference
- Not listed in CORE ICORE2026 or in the CCF 2026 list
