notes:
- Organized by INSTICC; proceedings in the SCITEPRESS Digital Library, a short list of revised papers may go to a
  Springer CCIS book and best papers to a Springer Nature Computer Science special issue
- CORE C (ICORE2026); regarded as a minor venue
- Two submission stages (1st stage gives an earlier notification), plus late-breaking papers and an abstracts track
- Held in European cities (Prague 2023, Angers 2024, Porto 2025, Benidorm 2026, Rome 2027) and co-located with other
  INSTICC conferences (CSEDU, VEHITS, SMARTGREENS, ICT4AWE, IMPROVE and IoTBDS in 2027)
