notes:
- Long-running Asia-Pacific HPC conference series (7th edition in Tokyo in 2004); recent editions in Japan (2024 Nagoya, 2026 Osaka),
  Taiwan (2025 Hsinchu) and Singapore (2023)
- 2026 edition was a joint event with SupercomputingAsia (SCA) in Osaka, with an exhibition and many co-located
  workshops
- Proceedings and separate workshop proceedings in the ACM Digital Library (ICPS); ACM open access APC applies to
  authors from institutions outside ACM Open
- Double-blind, one-pass review with no rebuttal; papers up to 18 pages in ACM single-column format
- Tracks cover applications and algorithms, architectures and networks, ML/AI and emerging technologies,
  programming models and system software, and data, storage and visualization
- CORE C (ICORE2026); not in the CCF list
- SCA2027 (Singapore, 1 to 4 March 2027) is announced under the SCA name, but its CFP says accepted papers go into the
  SCA/HPCAsia 2027 proceedings (see the sca-asia entry)
