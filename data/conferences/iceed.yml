notes:
- Engineering education conference run by the IEEE Education Society Malaysia Chapter with UiTM's EnTER group
- Held together with ICEESE (same organizers, same dates and venue) in 2025 and 2026
- Mostly held in Malaysia (Langkawi 2016, Kuala Lumpur 2018, Kuching 2025); the 2026 edition is in Kanazawa, Japan
- 2026 edition co-organized with Kanazawa Institute of Technology and technically co-sponsored by the IEEE Nagoya Section
- Past proceedings (2009 to 2025) are in IEEE Xplore and Scopus
- Full papers of 4 to 6 pages, double-blind review via EDAS
- Hybrid in 2026; presenters residing outside Japan may present virtually by video
- No editions between 2019 and 2023
- Not ranked by CORE (ICORE2026); not in the CCF list
