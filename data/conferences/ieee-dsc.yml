notes:
- Founded in Taiwan (first edition Taipei 2017); steering committee chaired by Shiuhpyng Shieh (NYCU)
- 'Location rotates between East Asia, Europe and the US: Hangzhou 2019, Aizuwakamatsu 2021 (Jan), Edinburgh 2022,
  Tampa 2023, Tokyo 2024, Taipei 2025, New York 2026'
- Sponsored by the IEEE Reliability Society; 2026 edition co-sponsored by NICT (Japan), with many Japanese PC members
- Anonymous review; regular papers up to 8 pages, 2-page experience/practice papers, 6-page workshop papers (e.g.,
  Trustworthy and Secure AI for Cyber Defense)
- Not ranked by CORE or CCF; the 2026 paper deadline was extended by about 3 weeks (June -> July)
