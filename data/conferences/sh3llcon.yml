notes:
- Spanish community hacker conference in Cantabria, billed as the first security congress of the year in Spain
- Held at Hotel Santemar, Santander, in 2025
- Two days of talks, hands-on workshops, a CTF and networking, plus a session for primary school pupils
- Program mostly in Spanish
- Standard ticket 60 EUR
- No papers or proceedings
