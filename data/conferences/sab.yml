notes:
- Interdisciplinary conference on adaptive behavior in animals and artificial agents (animats); AI, robotics, artificial life, neuroscience, ethology
- Running since 1990 and held every two years; run by the International Society for Adaptive Behavior (ISAB)
- Peer-reviewed conference papers published in "From Animals to Animats" (Springer LNAI); a non-archival paper track, poster abstracts and position papers also exist
- Single-track, single-blind review via CMT, 12-page LNCS limit
- Selected papers invited to a special issue of the journal Adaptive Behavior
- Mostly held in Europe (Frankfurt 2018, Cergy-Pontoise 2022, Berlin 2026), with Irvine, USA in 2024
- Not listed in ICORE2026 or the CCF 2026 list
