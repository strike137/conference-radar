notes:
- Run by IASEI with Ying Tan (Peking University) as general chair; running since 2016
- Proceedings in Springer CCIS; selected papers recommended to journal special issues
- Held late in the year in Asia, mostly China (Guangzhou 2021, Beijing 2022 and 2025, Sanya 2023, Ho Chi Minh City 2024,
  Jeju 2026); December since 2023
- Papers of 10 to 20 pages; deadlines are often extended
- Not ranked by CORE or CCF; regarded as a smaller venue
