notes:
- Annual biometrics conference of the BIOSIG special interest group of the German Gesellschaft fuer Informatik (GI)
- Held at Fraunhofer IGD in Darmstadt, Germany every year; the 2026 edition is the 25th
- Accepted papers are submitted to IEEE Xplore; papers use the LNI format and authors transfer copyright to LNI
- Double-blind review via Microsoft CMT; up to 8 pages plus 2 pages of references, orals may extend to 10 pages
- Encourages reproducible research with public datasets and ISO/IEC 19795-1 style reporting
- EAB European Biometrics Research and Industry Awards are presented at the conference
- One author per paper must register at the full rate; no-show papers may be removed from IEEE Xplore
