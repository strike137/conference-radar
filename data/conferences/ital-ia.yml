id: ital-ia
name: Ital-IA
full_name: "Ital-IA: Convegno Nazionale CINI sull'Intelligenza Artificiale (CINI National Conference on Artificial Intelligence)"
type: conference
tier: domestic
areas: [ai]
region: europe
language: mixed
frequency: annual
organizer: CINI National Laboratory on Artificial Intelligence and Intelligent Systems (AIIS) with a host university
organizer_country: [europe]
proceedings: CEUR-WS (English papers of at least 5 pages, opt-in)
archival: true
indexing: [Scopus]
fee: 240 EUR early, 300 EUR late; 180 EUR Doctoral Consortium (2026)
typical:
