  conference_months: [6]
links:
  website: https://www.ital-ia2026.it/
notes:
- Italian national AI conference of the CINI consortium (AIIS lab), aimed at linking universities, industry and public administration
- One day of thematic workshops (trustworthy AI, sustainability, health, industry, cybersecurity, robotics, generative AI, ...) plus one plenary day
- Short contributions of 2 to 6 pages describing research activities and projects, in Italian or English; single-blind review checks fit to the chosen workshop
- English contributions of at least 5 pages appear in CEUR-WS thematic workshop proceedings (2023 -> Vol-3486, 2024 -> Vol-3762, 2025 -> Vol-4121) if the authors opt in; the rest only on the conference website
- Held in Italy every year (Pisa 2023, Naples 2024, Trieste 2025, Rome 2026); 2026 was the 6th edition
- Not listed in the CORE portal (ICORE2026) or the CCF list
