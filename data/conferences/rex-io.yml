notes:
- Workshop on HPC I/O and storage for hybrid workloads (simulation, AI, data analytics, workflows)
- Held with IEEE Cluster from 2021 to 2025 (proceedings in IEEE Xplore); co-located with ACM HPDC from 2026
- 2026 papers published in the HPDC 2026 workshop proceedings (ACM)
- Papers of 5 to 8 pages (excluding references) in ACM sigconf format; single-blind review by at least three PC members
- Not listed in the ICORE2026 portal
