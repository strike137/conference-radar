notes:
- French-speaking information security symposium run by Association STIC (Rennes), held every June at the Couvent
  des Jacobins in Rennes, France
- Talks must be given in French; papers may be written in English
- Long talks (30 min, 6 to 25 page paper), short talks (15 min, 3 to 8 pages) and tool talks (15 min, tool must be
  released publicly for free)
- Accepted long papers appear in the actes (proceedings), published as a free PDF on actes.sstic.org at the start
  of the event; not a formal publisher series
- Mixes practitioners, government and academia; a well-known venue in the French security community
