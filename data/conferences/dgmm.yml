id: dgmm
name: DGMM
full_name: International Conference on Discrete Geometry and Mathematical Morphology
type: conference
tier: minor
areas: [vision]
region: europe
language: english
frequency: irregular
organizer: IAPR TC18 (Discrete Geometry and Mathematical Morphology), hosted by a local university
organizer_country: [international]
proceedings: Springer LNCS
archival: true
fee: 480 EUR regular, 320 EUR student (2025, early); IAPR members get a small discount
typical:
  deadline_months: [4, 10]
  conference_months: [4, 11]
links:
  website: https://dgmm2027.sciencesconf.org/
notes:
- Joint event of the two IAPR TC18 conference series, DGCI (discrete geometry for computer imagery) and ISMM (mathematical morphology)
- Proceedings in Springer LNCS; regular papers up to 12 pages
- Single-blind review with a rebuttal phase (2025)
- Extended papers invited to a special issue of the Journal of Mathematical Imaging and Vision
- Also accepts state of the art reports (STARs) and work-in-progress posters
- Started in 2021 (Uppsala); then Strasbourg 2022, Florence 2024, Groningen 2025 and Grenoble 2027; planned every 18 months
- Before 2021 the community met at the separate DGCI and ISMM series
