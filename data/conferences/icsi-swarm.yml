notes:
- Annual conference on swarm intelligence and evolutionary computation since 2010, run by IASEI and Peking University
  (general chair Ying Tan)
- Proceedings in Springer LNCS as "Advances in Swarm Intelligence" (2025 -> LNCS 16011 and 16012; 2024 -> LNCS 14788
  and 14789); selected papers invited to journals
- Mostly held in China (2021 Qingdao, 2022 Xi'an online, 2023 Shenzhen, 2024 Qinghai, 2026 Beijing); 2025 was in
  Yokohama, Japan; held in July or August
- Double-blind review; LNCS format, 10 to 12 pages, extra pages above 12 cost 132 USD each (2026)
- 2026 edition ran in hybrid mode
- Not listed in ICORE2026 (searched by acronym and by name)
- Not to be confused with other venues using the ICSI acronym
