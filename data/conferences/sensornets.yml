notes:
- Organized by INSTICC; the 2026 proceedings are a Springer CCIS book (earlier editions were in the SCITEPRESS
  Digital Library)
- Not found in ICORE2026; regarded as a minor venue
- Covers wireless sensor networks, IoT and industrial IoT, edge intelligence, body networks and security of sensor
  systems
- Held every February until 2023 (online 2021 to 2023); no edition in 2024 or 2025, then revived in July 2026 in
  Porto
- Two submission stages plus late-breaking papers; remote presentation allowed in exceptional cases
