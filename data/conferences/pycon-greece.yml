notes:
- Greek national Python conference, one of the PyCon family, run by volunteers from PyGreece
- Held at Technopolis City of Athens in 2025 and 2026; 2026 was the 2nd edition
- Conference language is English and all proposals must be submitted in English
- 30 minute talks and 90 minute hands-on tutorials chosen from a spring call for proposals; up to 3 proposals per speaker
- No papers or proceedings; talk recordings are published on YouTube
- Both editions so far sold out
