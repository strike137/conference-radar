notes:
- Smart technologies conference organized by Universidad Politécnica Salesiana in Ecuador; 5th edition in 2026
- Editions in 2019, 2021, 2022, 2024 and 2026, held in Quito except 2022 (Cuenca), in November or December
- Proceedings in Springer CCIS (vol. 1154 for 2019, 1532 for 2021, 1705 for 2022, 2392 for 2024)
- Full papers of 12 to 15 pages in English, double-blind review by three PC members, Turnitin plagiarism check
- Virtual presentation option with the same publication as in person
- Broad topics from AI, data mining and NLP to IoT, cognitive radio, vehicular networking, smart grid and e-health
- Not listed in CORE ICORE2026
