notes:
- Co-located with ACM SIGCOMM 2024 in Sydney (one-day workshop on 2024-08-04); only edition so far
- Topics are zero trust architecture for IoT and next generation networks, trust management, lightweight crypto, blockchain
  and access control
- Single-blind review; research papers up to 6 pages and extended abstracts up to 2 pages plus one page of references
- Accepted and registered papers appear in the ACM Digital Library as part of the official proceedings; in-person presentation
  required
- Not among the ACM SIGCOMM 2025 workshops; no later edition found
