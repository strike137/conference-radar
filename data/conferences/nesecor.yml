notes:
- Workshop co-located with the International Conference on Network and Service Management (CNSM); 1st edition 2024 in Prague, 2nd edition 2025 in Bologna
- Topics are security automation and orchestration, SOAR, NOC/SOC operations, intrusion detection, incident triage, cyber situational awareness and resilience
- Papers up to 6 pages in IEEE 2-column format in 2025 (7 pages regular and 4 pages short in 2024), submitted via EDAS
- Accepted and presented papers appear in the CNSM proceedings and are submitted to IEEE Xplore; in-person presentation expected
- Led by Martin Husak (Masaryk University, Czech Republic)
- Not among the CNSM 2026 workshops
- Not listed in the CORE ICORE2026 portal or the CCF list
