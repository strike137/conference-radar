id: nesecor
name: NeSecOr
full_name: Workshop on Network Security Operations
type: workshop
tier: minor
areas: [security, networking]
region: europe
language: english
frequency: annual
organizer: Martin Husák (Masaryk University) and Brian Lee (Technological University of the Shannon), workshop chairs in 2024
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [8, 9]
  conference_months: [10]
links:
  website: https://sites.google.com/mail.muni.cz/nesecor-2025
notes:
- Workshop co-located with CNSM (Prague 2024, Bologna 2025)
- Topics are network monitoring and intrusion detection, NOC/SOC operations, SOAR and automation of security workflows, cyber situational awareness and resilience
- Regular papers up to 7 pages and short papers up to 4 pages in IEEE two-column format (2024); submission via EDAS
- Presented workshop papers appear in the CNSM proceedings on IEEE Xplore
- Not among the CNSM 2026 workshops
- Not listed in CORE ICORE2026 or the CCF list
