links:
  website: https://www.compas-conference.fr
notes:
- French-speaking conference on parallelism, computer architecture and operating systems, formed in 2013 from RenPar,
  SympA and CFSE
- Papers and abstracts may be in French or English; French-speaking authors are encouraged to present in French
- Two submission options, a 6-page paper (plus up to 6 pages of extra material) with detailed reviews, or a
  350-word abstract checked only for topic fit; already published work may be presented
- Accepted papers are given to participants only; authors may optionally deposit them in a HAL collection, so the
  venue does not prevent later publication at an international conference
- Aimed at PhD students and young researchers; includes tutorials and a poster session
- Held in a different French city each year (Annecy 2023, Nantes 2024, Bordeaux 2025, Anglet 2026)
- Not listed in ICORE2026 and not on the CCF list
