id: compas
name: Compas
full_name: "Compas: Conférence francophone en informatique (parallélisme, architecture, système)"
type: conference
tier: domestic
areas: [systems]
region: europe
language: mixed
frequency: annual
organizer: Compas steering committee, with GDR RSD, GDR SoC² and ASF (SIGOPS France); a French university hosts each
  edition (UPPA/LIUPPA in 2026)
organizer_country: [europe]
proceedings: None (participants only)
archival: false
typical:
  deadline_months: [2, 3]
