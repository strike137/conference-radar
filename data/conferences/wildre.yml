notes:
- Workshop on language resources, annotation, standards and evaluation for Indian languages, with a demo track for Indian language technology
- Held every two years as a satellite workshop of LREC, so it follows the LREC venue (mostly Europe; 2018 in Miyazaki, Japan; 2020 edition moved online)
- 8th edition on May 12, 2026 at LREC 2026 in Palma, Mallorca, Spain; 7th edition on May 25, 2024 at LREC-COLING 2024 in Torino, Italy
- Proceedings published by ELRA in the ACL Anthology (15 papers in 2026, 11 in 2024)
- Full papers up to 10 pages, short papers up to 5 pages, plus 1-page posters and demos; double-blind review by three PC members
- Submissions through the LREC Softconf START system using the LREC author kit
- Not ranked in ICORE2026 and not on the CCF list
