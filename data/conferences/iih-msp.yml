links:
  website: https://iihmsp2026.github.io/
notes:
- Founded in 2005 (Melbourne); since 2013 held mostly in Taiwan, Japan, China and Korea (2023 Daegu, 2024 Matsue,
  2025 Taichung, 2026 Fuzhou)
- Proceedings in the Springer SIST book series, normally indexed by EI and Scopus; IEEE proceedings from 2006 to
  2016
- 'Broad scope: watermarking, steganography, crypto, multimedia signal processing, AI and general ICT tracks'
- Regular papers 10 to 12 pages in Springer format; one-page presentation-only papers also accepted (not indexed)
- 'Deadlines are routinely extended by one to two months (2025: May 30 -> Jul 15; 2026: Aug 31 -> Oct 10)'
