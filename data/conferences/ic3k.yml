id: ic3k
name: IC3K
full_name: International Joint Conference on Knowledge Discovery, Knowledge Engineering and Knowledge Management
  (KDIR, KEOD, KMIS)
type: conference
tier: minor
areas: [ai, data]
region: europe
language: english
frequency: annual
organizer: INSTICC
proceedings: SCITEPRESS
indexing: [DBLP]
rank:
  core: C
fee: 535 EUR INSTICC member, 595 EUR non-member (2026, early speaker registration)
typical:
  deadline_months: [6, 7]
  conference_months: [10]
links:
  website: https://ic3k.scitevents.org/
notes:
- Joint INSTICC conference of KDIR (knowledge discovery and IR), KEOD (knowledge engineering and ontologies) and
  KMIS (knowledge management); 18th edition in 2026
- Proceedings in SCITEPRESS; IC3K and KEOD are CORE C
- 2026 edition co-located with ICINCO, CoopIS, WEBIST, IJCCI and IN4PL with free cross access
- Two submission stages plus a late-breaking track in July; all deadlines AoE
- Held in Europe (Marbella 2025, Angers 2026)
