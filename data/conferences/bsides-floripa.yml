notes:
- Security BSides community conference on information security in Florianopolis, Santa Catarina, Brazil
- One-day single-track event; the 2026 edition had seven talks plus a CTF
- Talks mainly in Portuguese; English and Spanish talks are welcome, per the official FAQ
- Call for papers through a Google Form linked from the official site; speakers of all experience levels welcome
- Paid tickets with student and social (food donation) prices; talks only, no proceedings
