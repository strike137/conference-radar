id: aiwolfdial
name: AIWolfDial
full_name: International Workshop on AI Werewolf and Dialog Systems
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: AIWolf Project (Yoshinobu Kano, Shizuoka University, with members from UEC, Keio, Tokyo and other Japanese
  universities); co-located with INLG
organizer_country: [japan]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [8]
  conference_months: [9, 10]
links:
  website: https://aiwolfdial.github.io/aiwolf-nlp/en/page/inlg_2026/
notes:
- Workshop on LLM dialogue agents and game AI using the Werewolf social deduction game, with an international AIWolf
  agent contest as its shared task
- Run by the Japanese AIWolf Project; contact is Yoshinobu Kano (Shizuoka University)
- Co-located with INLG; editions in 2019 (Tokyo), 2024 (Tokyo), 2025 (Hanoi) and 2026 (Utrecht); held every year since
  2024
- Proceedings of the 2019, 2024 and 2025 editions in the ACL Anthology
- Long (8 pages) and short (4 pages) peer-reviewed papers in ACL format; contest team descriptions are non-archival
- Half-day workshop, hybrid in 2026; papers rejected from the INLG main conference may be resubmitted
- Not listed in ICORE2026 and not on the CCF list
