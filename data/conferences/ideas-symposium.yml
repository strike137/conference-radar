notes:
- Annual since 1997, held in North America, Europe and Asia; renamed International Database Engineering and Artificial Intelligence Symposium for 2027
- Proceedings in Springer LNCS since 2024 (earlier editions in ACM ICPS)
- 'Recent hosts: Budapest (2022), Heraklion (2023), Bayonne (2024), Newcastle upon Tyne (2025), Montreal (2026), Fukuoka (2027)'
- 2027 edition co-located with IEEE BigComp 2027 in Fukuoka and moves from summer to January
- 'Paper length (2027): regular 14 LNCS pages, short 10 LNCS pages; single-blind review via CMT'
- Selected papers invited to journals such as Journal of Supercomputing and Data and Knowledge Engineering
- CORE C (ICORE2026); not on the CCF 2026 list
