notes:
- Hardware hacking conference run by Hackaday in Pasadena, California; billed as "The Ultimate Hardware Conference"
- Three days; Friday badge hacking day at Supplyframe HQ, then two days of talks and workshops
- Two talk tracks with 20 and 40 minute slots; speakers attend free
- Talks on hardware, software, electronics and making; main stage streamed live on YouTube, no proceedings
- 2026 was the tenth edition, moved to the ArtCenter South Campus for about 20% more attendees (around 700 hackers)
- Workshops are booked as paid add-ons and fill up fast
