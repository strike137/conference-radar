notes:
- Annual forum on unification theory and its applications (equational and higher-order unification, matching, anti-unification, narrowing, disunification)
- UNIF 2026 was the 40th edition; previous editions mostly in Europe, also in the USA and Japan
- Usually a satellite of FSCD or IJCAR/CADE (Nancy 2024 with IJCAR, Birmingham 2025 with FSCD, Lisbon 2026 at FLoC with FSCD and IJCAR)
- Accepts short papers or extended abstracts up to 5 pages in EasyChair style; recent or unfinished work welcome
- Accepted abstracts go into informal proceedings published as a technical report (RISC, Johannes Kepler University Linz, in 2026); a journal special issue is decided case by case
- Not listed in ICORE2026 or the CCF list
