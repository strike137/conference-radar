notes:
- Flagship conference of computational geometry and topology; CORE A*, CCF B
- Main event of CG Week, together with the media exposition (CG:ME), Young Researchers Forum (CG:YRF), CG:Challenge and workshops
- Was an ACM symposium until 2014; independent since 2015 and run as an event of the CG Society since 2025
- Proceedings in the open-access LIPIcs series (Schloss Dagstuhl) since 2015; earlier volumes in the ACM DL
- Two tracks since 2026, Track T (Theory) and Track P (Practice); abstract registration one week before the paper deadline
- At least one author of each accepted paper must join the CG Society (free) to present
- SoCG 2027 adds an AI policy (AI Statement section) and a limit of six submissions per co-author
- Location rotates worldwide (Athens 2024, Kanazawa 2025, New Brunswick 2026, Bengaluru 2027, Vienna 2028)
