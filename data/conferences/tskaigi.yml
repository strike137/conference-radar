notes:
- TypeScript community conference in Tokyo, billed by the organizers as one of the largest TypeScript-themed tech
  conferences in Japan
- Annual since 2024; Nakano Central Park Conference 2024 (1 day), Bellesalle Kanda 2025 and Bellesalle Haneda Airport
  2026 (2 days each); also streamed online
- Talks (30 or 10 minutes) chosen from an open call for proposals by the organizing team plus invited reviewers;
  about 300 proposals in 2025 and 2026
- Accepted 2026 talk titles are almost all in Japanese; the 2026 keynote was by a Microsoft TypeScript team engineer
- About 2,700 attendees (on site and online) over two days in 2025
- Regional spin-off events (TSKaigi Kansai, TSKaigi Hokuriku 2025, TSKaigi Sendai 2026) are run by the same
  association
- No papers or proceedings; talks only
