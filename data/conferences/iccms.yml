notes:
- Held every year since 2009 (Macau); 2027 is the 19th edition
- Held in Australia from 2016 to 2021 (2020 and 2021 virtual), in China since 2022 (Chongqing virtual 2022, Dalian 2023 and 2024, Zhuhai 2025, Hangzhou 2026, Beijing 2027)
- Proceedings in IEEE Xplore since 2026 (ICCMS 2026, ISBN 979-8-3315-6469-8); ACM ICPS (ACM DL) from 2017 to 2025
- Stated as indexed in EI Compendex and Scopus
- Papers of at least 5 pages; abstract only presentation also offered (abstract not published)
- Smaller commercially run conference with a Chinese conference secretariat
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
