frequency: annual
organizer: Conference secretariat (iccms_contact@163.com) with the Intelligent IoT System Modeling and Simulation Committee of the China Simulation Federation and host universities; IEEE co-sponsor since 2026
organizer_country: [china]
proceedings: IEEE Xplore
