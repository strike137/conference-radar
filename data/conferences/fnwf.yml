links:
  website: https://fnwf2026.ieee.org/
notes:
- Run by IEEE Future Networks; started in 2018 as the IEEE 5G World Forum and renamed Future Networks World Forum in 2022
- Proceedings in IEEE Xplore; accepted papers must be registered and presented to be published
- Rotates worldwide (2022 Montreal hybrid, 2023 Baltimore, 2024 Dubai, 2025 Bangalore, 2026 Lisbon)
- Technical tracks plus many symposiums and workshops with the same deadlines; submission via EDAS
- Suggested length 5 to 6 pages, up to 8 with overlength charges (100 EUR per extra page in 2026)
- Deadlines are extended several times each year; industry heavy forum with keynotes, panels and exhibits
- One author registration covers two papers
- Not listed in ICORE2026 (portal search returns no results)
- IEEE ComSoc is a financial co-sponsor and handles registration
