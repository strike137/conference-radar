notes:
- Running since 2007, formed by merging the Italian workshops WIVA and GSICE; Springer titles it the Italian Workshop on Artificial Life and Evolutionary Computation
- Proceedings in Springer Communications in Computer and Information Science (CCIS), indexed in DBLP, EI and Scopus
- Topics include evolutionary computation, artificial life, swarm intelligence, neuroevolution, complex systems and systems biology
- Mostly held in Italy (Rende 2019, Gaeta 2022, Venice 2023, Siena 2025), with editions in Winterthur, Switzerland (2021) and Namur, Belgium (2024)
- 2025 edition was a satellite event of the Conference of the Complex Systems Society (CCS 2025)
- Not listed in CORE ICORE2026
