organizer: Universitas Nusa Mandiri (LPPM UNM), sponsored by IEEE Indonesia Section
organizer_country: [indonesia]
proceedings: IEEE Xplore
archival: true
indexing: [IEEE Xplore, Scopus]
fee: USD 200 student or IEEE member, USD 225 professional (2026)
typical:
