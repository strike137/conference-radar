links:
  website: https://icitri.nusamandiri.ac.id/
notes:
- Hosted by Universitas Nusa Mandiri, Indonesia, with an IEEE section as sponsor and several Indonesian universities as joint organizers
- Held at Universitas Nusa Mandiri (Jakarta and Depok campuses) in hybrid format; editions every year since 2022
- Proceedings in IEEE Xplore for every edition 2022 to 2026
- 'Tracks: informatics (AI/ML, data mining), image processing and computer vision, software engineering, biomedical informatics'
- 4 to 6 page IEEE format papers, blind review by at least three reviewers; papers not presented are left out of IEEE Xplore
- Submission deadlines have been extended by about six to seven weeks in 2025 and 2026
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
