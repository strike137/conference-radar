notes:
- Workshop on continual and lifelong learning; contributions not tied to computer vision are also welcome
- 5th edition at CVPR 2024 in Seattle, 6th edition at ICCV 2025 in Honolulu
- Archival track (4 to 8 pages, published in the proceedings) and non-archival track (up to 8 pages, dual submission allowed)
- Double-blind review on OpenReview; also runs a continual learning challenge and a best paper award
- 10 papers in the ICCV 2025 workshop proceedings on CVF Open Access
- Not listed in ICORE2026 or the CCF list
