notes:
- Workshop on continual and lifelong learning, co-located with CVPR or ICCV; 2025 was the 6th edition (ICCV 2025, Honolulu)
- Accepts continual learning work of any kind, not necessarily related to computer vision
- Archival track (4 to 8 pages, published in the proceedings) and a non-archival track that allows dual submissions
- Double-blind review on OpenReview in the host conference template
- Also runs a continual learning benchmark challenge and gives a best paper award
- Not listed in ICORE2026 or the CCF list
