notes:
- Commercial AI and data science practitioner conference run by ODSC AI, which also runs ODSC AI East (Boston) and
  other events; running since 2015
- About 2,500 attendees, 250+ speakers and 9 tracks (agents, AI engineering, MLOps, data science and ML, physical AI)
  plus hands-on trainings and an expo
- Call for speakers for talks, workshops and trainings in two rounds (May and August deadlines); accepted speakers get a
  free conference pass
- 2026 edition held at the Hyatt Regency SFO in Burlingame, San Francisco Bay Area
- No papers or proceedings; a free virtual pass streams some sessions
- Not listed in the CORE ICORE2026 portal
