notes:
- Large commercial practitioner conference on AI, machine learning and data science, held since 2015 in the San Francisco Bay Area; rebranded ODSC AI West
- About 2,500+ attendees, 250+ speakers and 9 tracks (2026), with hands-on training, workshops, an expo and the co-located AI X Leadership Summit
- 2026 edition at Hyatt Regency SFO, Burlingame, October 27 to 29, plus a virtual-only day on October 26
- Call for speakers in two rounds (talks, workshops, trainings); round one is the main opportunity, round two is rolling
- Accepted speakers get a free conference pass; no papers or proceedings
- Sister events ODSC AI East (Boston), Europe and APAC run by the same company
- Not ranked in ICORE2026 and not on the CCF list
