notes:
- Workshop held with ACM SIGMOD/PODS since 2024, so it moves with SIGMOD (Berlin in 2025, Bengaluru, India in 2026)
- 'Scope: quantum computing and quantum-inspired accelerators (annealers, simulators) for data processing and data management'
- Full papers up to 12 pages, short papers up to 6 pages, single-author one-page abstracts; ACM sigconf format, submitted via EasyChair
- Triple-blind review
- Accepted papers and abstracts are included in the workshop proceedings, published by ACM for every edition (2026 proceedings DOI 10.1145/3811628)
- 3rd edition in 2026, chaired by Ibrahim Sabek (USC), Immanuel Trummer (Cornell) and Rihan Hai (TU Delft)
- Not listed in ICORE2026 and not on the CCF list
