notes:
- Main joint biennial event of IAPR TC1 and TC2 since 1996; the 2026 edition in Bern is the 21st
- Held shortly after and close to ICPR (2026 in Bern, right after ICPR 2026 in Lyon)
- Papers up to 10 pages in Springer LNCS; at least two anonymous reviews per paper; submission via EasyChair
- Each accepted paper needs one early bird registration; one registration covers up to three papers
- Pierre Devijver Award lecture is given at the workshop
- "CORE ICORE2026 lists the SSPR part as Structural and Syntactical Pattern Recognition: B"
