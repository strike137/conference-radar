notes:
- Biennial IEEE workshop on sensors, sensor interfaces and integrated circuits, running for about 20 years
- 2025 focus on embedded cyber-physical systems, healthcare sensing, low-power machine learning, biosensing and hardware security
- Accepted papers included in the workshop proceedings on IEEE Xplore; papers up to six A4 pages in IEEE format
- Selected papers invited to submit an extended version to an IEEE journal
- 10th edition held in Manfredonia, Italy in 2025
- Not listed in the CORE ICORE2026 portal
