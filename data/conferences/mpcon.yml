notes:
- Flagship conference of the IEEE Madhya Pradesh Section, India; host institution changes each year
- 2025 in Jabalpur, 2026 in Gwalior, 2027 at Acropolis Institute of Technology and Research (AITR), Indore
- Proceedings in IEEE Xplore (2025 and 2026 volumes)
- Scope covers computational intelligence, communication systems, computer networks, soft computing, security, VLSI and clean energy
- Max 6 pages and 6 authors via Microsoft CMT; extra page charge
- The 2027 site claims an acceptance rate under 25%
- Not listed in the CORE ICORE2026 portal
