notes:
- Asia-Pacific edition of the IEEE PES ISGT smart grid conference series, sibling of ISGT Europe
- Rotates around Asia and Oceania (2021 Brisbane, 2022 Singapore, 2023 Auckland, 2024 Bengaluru, 2026 Wuhan, 2027 Bangkok)
- Power and energy focus; topics include AI-driven grid operation, digital twins, energy trading and smart grid cybersecurity and privacy
- Papers are handled via EasyChair; proceedings published by IEEE (IEEE Xplore, print on demand via Curran)
- Not listed in the CORE ICORE2026 portal
