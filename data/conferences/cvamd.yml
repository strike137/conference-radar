notes:
- Workshop on computer vision for medical diagnosis (foundation models and LLMs in healthcare, segmentation, multimodal biomedical imaging, fairness and robustness)
- Held with ICCV 2023 (Paris) and ICCV 2025 (Honolulu); 2025 was the 3rd edition
- Long papers (4 to 8 pages, ICCV format) go into the ICCV Workshops proceedings; extended abstracts (2 to 4 pages) and 1-page highlights are non-archival
- Submission through OpenReview; anonymous review
- 49 papers on CVF Open Access for ICCV 2025, 50 for ICCV 2023
- Ran the CXR-LT chest X-ray long-tail competition alongside the 2023 edition
- Not listed in ICORE2026 or the CCF list
