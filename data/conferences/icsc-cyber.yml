notes:
- Conference on intelligent systems and data analytics for cybersecurity (intrusion and malware detection, adversarial ML, blockchain security, trustworthy AI)
- Grew out of the AISC symposium (2021 Valencia, 2022 San Antonio); named ICSC since 2023
- Technically co-sponsored by the IEEE Florida West Coast Section; previous editions are in IEEE Xplore
- Co-located symposia and workshops in 2026 include FCST, BCAT, AISC, RTCAC, CQCS and GenAISE
- Short, poster, position, PhD symposium and SoK tracks plus workshops; very fast review cycle (2026 main track notification 10 days after the submission deadline)
- Rotates between the USA, Europe and the Middle East (2023 San Antonio, 2024 Valencia, 2025 Tampa, 2026 Abu Dhabi, 2027 Bucharest)
- Not listed in ICORE2026; not on the CCF list
