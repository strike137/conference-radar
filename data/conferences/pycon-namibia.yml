notes:
- Annual Python conference in Windhoek run by volunteers of the Python Software Association of Namibia (PYNAM), a
  registered non-profit; first held in 2015
- A week of events with a Django Day, Education Days in schools and universities, and a two day main conference at
  NIPAM
- Talks and workshops chosen from an open call for proposals on Pretalx; first review round is blind
- Topics range from software and the web to data, AI, cybersecurity and education
- 190 attendees across the week and 23 speakers from 14 countries in 2026; registration fees kept low
- Talks only, no papers or proceedings; talk recordings on YouTube
