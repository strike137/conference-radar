notes:
- Workshop on holistic 6G radio design (AI-native air interface, radio resource management, ISAC, zero-energy
  devices, physical layer security, TN-NTN integration, semantic communication)
- First two editions at EuCNC and 6G Summit 2024 (Antwerp) and 2025 (Poznan), proposed by EU SNS projects
  Hexa-X-II and 6G-SHINE; 3rd edition at IEEE WCNC 2026 (Kuala Lumpur), run jointly with the PASS workshop
- WCNC workshop papers go into the WCNC proceedings and are planned for IEEE Xplore; no-show papers can be excluded
- Half-day workshop
- Not in the IEEE WCNC 2027 workshop list
- Not listed in ICORE2026
