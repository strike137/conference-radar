id: ieee-bhi
name: IEEE BHI
full_name: IEEE EMBS International Conference on Biomedical and Health Informatics
type: conference
tier: minor
areas: [ai, data]
region: worldwide
language: english
frequency: annual
organizer: IEEE EMBS
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [6, 7]
  conference_months: [10, 11, 12]
links:
  website: https://bhi.embs.org/2026/
  dblp: https://dblp.org/db/conf/bhi/index.html
notes:
- Primary conference of the IEEE Engineering in Medicine and Biology Society (EMBS) on informatics and computing in
  healthcare and life sciences
- Regular papers of 4 to 7 pages (references included) go to IEEE Xplore; two-round double-blind review on OpenReview
  with an author rebuttal step
- 1-page abstracts are poster only (single-blind); authors may opt into a Book of Abstracts on IEEE Xplore
- Selected papers invited to extend for IEEE JBHI or IEEE TBME; all regular paper authors may submit an extension to
  IEEE OJEMB
- Mostly held in the USA (Pittsburgh 2023, Houston 2024, Atlanta 2025); Hong Kong in 2026; joint BHI-BSN editions in
  Greece in 2021 and 2022
- Not listed in CORE ICORE2026 or the CCF 2026 list
