notes:
- Community-run, non-profit Security BSides event; the 2026 edition is described as the first BSides in Nepal
- One-day event with technical talks, hands-on villages, a Capture the Flag competition and a project showcase
- Two speaker tracks, a Main Stage and a Rookie Stage reserved for first-time speakers and emerging researchers
- Paid tickets in three price phases (Early, Regular, Late Bird) with Student, General and Corporate passes; a scholarship gives free General Admission to students in Nepal
- The timeline on the official site is marked indicative and may shift
- No proceedings
