notes:
- Standalone Swedish national forum on computer networks, cloud and edge computing, IoT and distributed systems, held since 2003 (yearly since 2011, no edition in 2021)
- Renamed from Swedish National Computer Networking Workshop in 2023 when the scope grew to cloud computing; the acronym SNCNW was kept
- Hosted by a different Swedish university each year (Linkoping 2024, Trollhattan 2025, Uppsala 2026)
- Short papers of up to 3000 words (3 to 4 pages) with a formal review via HotCRP; oral or poster/demo presentation
- Informal printed proceedings for delegates only; no copyright claimed, so papers can be published elsewhere; summaries of published work are welcome
- Aimed at PhD students and young researchers, who also serve on the program committee
- "Fee (2026): 2000 SEK excl. VAT early, 2150 SEK late; no student rate"
- Not listed in CORE ICORE2026
