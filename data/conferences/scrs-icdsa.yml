notes:
- Technically sponsored by the Soft Computing Research Society (SCRS, New Delhi), which runs many hybrid conferences each year
- After-conference proceedings in Springer Lecture Notes in Networks and Systems (LNNS); seven volumes for ICDSA 2025
- Hybrid (in-person and online); hosted by Jadavpur University Kolkata (2021, 2022), MNIT Jaipur (2023 to 2025) and VIT Mauritius (2026)
- 7th edition in 2026; submission via Microsoft CMT
- High-volume event; not listed in CORE ICORE2026 and not on the CCF list
