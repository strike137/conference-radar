id: ieee-uemcon
name: IEEE UEMCON
full_name: IEEE Annual Ubiquitous Computing, Electronics & Mobile Communication Conference
type: conference
tier: minor
areas: [communications, general, networking, ai]
region: north-america
language: english
frequency: annual
organizer: Smart Society (IEEE UEMCON; same team as IEEE CCWC, IEMCON and AIIoT)
proceedings: IEEE Xplore
archival: true
fee: 725 USD IEEE member, 825 USD non-member (2026, early author registration; regular 825 / 925 USD)
typical:
  deadline_months: [8, 9]
  conference_months: [10]
links:
  website: https://ieee-uemcon.org/
notes:
- IEEE-branded US conference run by the Smart Society team that also runs IEEE CCWC, IEMCON and AIIoT
- Accepted and presented papers are submitted to IEEE Xplore (2026 conference record 70256)
- Held in the New York area; Columbia University (2019, 2023), IBM T.J. Watson Research Center (2024, 2025), IBM
  Gerstner Center in Armonk (2026); virtual from 2020 to 2022
- Double-blind review; regular papers up to 7 pages, short work-in-progress papers up to 6 pages (extra pages
  cost extra)
- Short cycle of about six weeks from submission deadline to conference; physical presentation required
- Not listed in CORE ICORE2026; generally regarded as a low-selectivity venue
