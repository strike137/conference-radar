notes:
- Workshop on linear logic and its applications (proof theory, semantics, programming languages, implicit complexity, quantum and probabilistic computation, linguistics)
- Talk-based; contributors submit 2 to 5 page abstracts, work in progress and position papers welcome
- Abstracts of contributed and invited talks are published on the workshop website, no formal proceedings, so non-archival
- Satellite of FSCD, LICS or FLoC every year since 2017; held jointly with the Linearity workshop in 2018, 2020 and 2022
- Recent editions in Rome 2021, Haifa 2022, Rome 2023, Tallinn 2024, Birmingham 2025 and Lisbon 2026
- Not listed in ICORE2026 or the CCF 2026 list
