notes:
- Run by the IEEE Indonesia Joint Aerospace and Electronic Systems / Geoscience and Remote Sensing Society Chapter,
  co-sponsored by the IEEE Indonesia Section and the Indonesian Society for Remote Sensing (MAPIN)
- Sister conference of IEEE ICARES, run by the same chapter
- Proceedings in IEEE Xplore every year since 2018 (no 2020 edition found)
- Held in Indonesia (Jakarta 2018, 2019, 2021; Surabaya 2022, 2023; Manado 2024; Purwokerto 2025)
- Topics cover remote sensing, geoscience, radar and electromagnetic scattering, sensors and platforms,
  electronics and AI for geoscience
- 2026 edition is hybrid; not listed in the ICORE2026 CORE portal
