notes:
- Annual US radio science meeting of USNC-URSI, held every January in Boulder, Colorado; 2027 is the 53rd edition
- Technically co-sponsored by IEEE AP-S; covers all ten URSI Commissions (metrology, fields and waves, radio communication and signal processing, propagation, radio astronomy, EM in biology and others)
- Authors submit a one-page abstract (at least 250 words) or a two-page summary; either can be archived in IEEE Xplore if the authors opt in
- Inclusion in IEEE Xplore requires a registered author and an in-person presentation
- Ernest K. Smith Student Paper Competition (double-blind two-page summary, students enrolled at US universities only) plus student travel support, free registration and a mentoring luncheon for students
- "Early registration 650 USD for USNC-URSI members (2027); each registration covers up to two papers"
- Radio science venue outside the usual CS rankings, not listed in ICORE2026
