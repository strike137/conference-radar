notes:
- Formerly the IEEE International Conference on Robotic Computing (IRC), held since 2017; renamed RoboticCC from the 2025 edition
- Covers the overlap of computing, communication and robotics (robot software, AI enabled networking, perception, planning, HRI)
- 2027 is the 10th edition, co-located with IEEE ICSC and AIxDKE in Laguna Hills, California (hybrid)
- Recent locations Naples 2022, California 2023, Tokyo 2024, Naples 2025, Laguna Hills 2027
- Proceedings submitted to IEEE (IEEE Computer Society format); selected papers invited to journals
- Regular papers up to 8 pages, short 4, posters and demos 2 (IEEE double-column), at least three reviewers per paper
- Accepted papers need one full rate registration and must be presented, or they are removed from the proceedings
- Free poster presentation with every full paper for current PhD students (via the ICSC doctoral symposium)
- Not listed in ICORE2026; not on the CCF list
