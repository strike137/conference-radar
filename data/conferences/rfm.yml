notes:
- Run by the IEEE Malaysia AP/MTT/EMC Joint Chapter, which also runs IEEE APACE; held in Malaysia
- Held roughly every two to three years (RFM2018 and RFM2022 listed on the chapter site, then RFM 2025); 2025 was the
  10th edition
- Covers RF circuits and microwave devices, antennas and propagation, 5G/6G and THz, plus computing, IoT and
  industrial electronics tracks
- 2 to 4 page IEEE two-column papers via EDAS; presented papers are considered for IEEE Xplore and Scopus
- Extra pages cost USD 50 each (2025)
- Not ranked by CORE (ICORE2026) or CCF; RF/microwave venue outside the usual CS rankings
