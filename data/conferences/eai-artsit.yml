notes:
- EAI conference on arts and technology, interactivity and game creation (formerly International Conference on Arts and Technology)
- Steering committee chaired by Anthony L. Brooks (Aalborg University); 15th edition in 2026
- Proceedings in Springer LNICST; extended papers can go to EAI Endorsed Transactions on Creative Technologies
- Several tracks with their own deadlines (main, late, last, posters and demos, special tracks)
- Hybrid conference with online presentation for remote authors
- Location rotates (Faro 2022, Campinas 2023, Abu Dhabi 2024, Dubai 2025, Bratislava 2026)
- CORE C (ICORE2026); not on the CCF list
