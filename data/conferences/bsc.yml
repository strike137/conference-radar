notes:
- Biennial symposium on communications, information theory and signal processing with a history dating back to
  1962 (started by Queen's University, now presented by the Canadian Society of Information Theory)
- Host university rotates within Canada (Concordia, Montreal 2023; Universite de Sherbrooke 2025; Edmonton 2027)
- Since 2025 it is an open forum with extended abstracts (up to two pages, IEEE format, via EDAS) and no published
  proceedings, so previously published work may be presented
- Up to 2023 it took 6-page peer-reviewed full papers submitted to IEEE Xplore
- Best 2025 presentations were invited to a special issue of the MDPI journal Entropy
- "Registration (2025, CAD): full 530 early / 600 late, student 300 / 350; student travel support up to 100 CAD per day"
- Not listed in CORE ICORE2026 or in the CCF 2026 list
