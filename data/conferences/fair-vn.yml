notes:
- National Vietnamese IT conference founded in 2002 by the IT committee of the Natural Sciences Council; first edition
  2003, annual since 2013; 2026 is the 19th edition
- Run by VUSTA and VAST with the Information Technology Institute (VNU Hanoi); hosted by a different Vietnamese
  university each year (2023 Da Nang, 2024 PTIT Hanoi, 2025 Hanoi University of Industry, 2026 HUIT Ho Chi Minh City)
- Broad IT scope with a yearly main theme (2026 -> Artificial Intelligence and Its Future Trends)
- Papers in Vietnamese or English, up to 8 pages, submitted via EDAS; presented papers get a second review round
  before inclusion in the proceedings
- Proceedings with DOIs from the VAST Publishing House for Natural Science and Technology up to 2024; FAIR 2026 announces IEEE proceedings (English papers
  only, IEEE PDF eXpress for camera-ready)
- Includes a PhD student forum; aimed at researchers from Vietnamese universities and research institutes nationwide
