links:
  website: https://scpconf.eu/
notes:
- New conference formed by merging EuroUSEC (European Symposium on Usable Security) and STAST (International Workshop
  on Socio-Technical Aspects in Security)
- Usable security and privacy, human factors, socio-technical analysis of incidents, policies and regulations
- Full papers 8 to 12 pages including references and appendices, IEEE conference template (A4), double-anonymous
  review by at least two PC members via EasyChair
- Abstract registration is mandatory about one week before the paper deadline
- Accepted papers are published by IEEE through Conference Publishing Services (CPS)
- First edition held in Belval, Luxembourg, 2 to 3 September 2026; general chairs Gabriele Lenzini (University of
  Luxembourg) and Karen Renaud (University of Strathclyde)
- Not listed in CORE ICORE2026
