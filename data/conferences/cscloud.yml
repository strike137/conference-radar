notes:
- Security and cloud focused; co-located with IEEE EdgeCom (Edge Computing and Scalable Cloud), with joint proceedings
  in 2021 to 2023
- Alternates mainly between the US and China (2023 Xiangtan, 2024 Shanghai, 2025 New York, 2026 Shanghai); 13th
  edition in 2026
- CCF C, not ranked by CORE
- Single-blind; 6 free pages, up to 12 with USD 150 per extra page
- Schedule moved from June/July (deadline around May) up to 2024 to November/December with September deadlines in
  2025 and 2026; notification within 2 to 4 weeks
