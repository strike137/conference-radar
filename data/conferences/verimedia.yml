notes:
- Workshop on multimedia forensics, deepfake detection, adversarial ML and AI-generated media attribution across images, video, text and audio
- 1st edition at IJCNN 2025 in Rome (July 2025); 2nd edition at ACM CIKM 2026 in Rome; host conference is not fixed
- 2026 accepted papers published as post-proceedings in Springer CCIS
- Full papers 12-15 pages, short papers 6-11 pages (Springer format), double-blind review via Microsoft CMT
- Fully in-person; at least one author must register for CIKM 2026 and present in Rome
- The 2025 edition was supported by the Italian SERICS project (FF4ALL)
- Not listed in CORE ICORE2026 or the CCF 2026 list
