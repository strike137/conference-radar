notes:
- Organized by IEIE (Institute of Electronics and Information Engineers)
- Held at Lotte Hotel Jeju (Jungmun) in late June (2025, 2026)
- Papers of 1-5 pages in double-column format; tracks follow IEIE's six societies (communications, semiconductors,
  computers, AI signal processing, systems and control, industrial electronics) plus a New Emerging Area
- Separate Best Paper Award track with an earlier deadline; AI undergraduate paper contest
- IEIE also runs a Fall conference (November) and the international ICEIC (January)
