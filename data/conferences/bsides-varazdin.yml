notes:
- Vendor-neutral technical information security symposium in Varaždin, Croatia
- Continuation of the older FSec Symposium as a less formal, community focused event
- One day, single track of technical talks with no sales talks; most talks in Croatian
- Free to attend with registration (limited seats); run under the Chatham House Rule
- No proceedings; talks only
