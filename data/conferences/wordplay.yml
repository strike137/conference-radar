notes:
- Workshop on interactive narrative, text games, game-playing language agents and storytelling with LLMs
- Held at NeurIPS 2018 (Montreal), NeurIPS 2020 (virtual), NAACL 2022, ACL 2024 (Bangkok) and EMNLP 2025 (Suzhou)
- Non-archival; accepted papers are posted on the workshop website and previously published work is welcome
- The 2022 edition published its papers in the ACL Anthology; for 2025 the Anthology holds only the front matter
- Main track takes papers of 4 to 8 pages and 2-page extended abstracts via OpenReview; 2025 also had a track for the Commonsense Persona-Grounded Dialogue Challenge (CPDC)
- No 2026 edition listed among the EMNLP 2026 workshops
- Not ranked in ICORE2026 and not on the CCF list
