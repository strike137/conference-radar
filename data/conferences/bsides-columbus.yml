notes:
- Community-driven Security BSides conference for the Central Ohio infosec community, founded in 2014
- Held at BrewDog DogTap Columbus in Canal Winchester, Ohio, USA (2025 and 2026)
- Moved from September (2025) to November (2026); the 2026 edition runs November 4 to 6 with training by TrustedSec
- Call for speakers on Sessionize, free for speakers; hacking villages and workshops
- Past keynotes include David Kennedy, Runa Sandvik, Jayson Street and Thomas Drake
- No proceedings
