notes:
- Conference on machine learning on graphs and geometric deep learning, started in 2022
- Proceedings track papers (up to 9 pages) published in PMLR (vol. 269 for 2024); 4-page extended abstracts are
  non-archival; a TMLR journal track for papers already published in TMLR
- Double-blind review on OpenReview with public discussion and a rebuttal stage
- Virtual from 2022 to 2024; fully in person since 2025 (Phoenix 2025, Boston 2026)
- At least one author per accepted paper must attend in person
- Not listed in CORE ICORE2026 or the CCF 2026 list
