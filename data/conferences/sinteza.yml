notes:
- One-day conference run by Singidunum University in Belgrade, Serbia, held every year since 2014
- Broad scope across computer science and AI, information technology, data science, IT in education, foreign language teaching and sports, management and technology, plus a student session
- Papers of 5 to 7 pages in English using the conference Word template
- Proceedings published by Singidunum University with ISBN and per-paper Crossref DOIs (10.15308/Sinteza-YYYY), free online on the Sinteza portal
- "Sinteza 2026: 110 papers submitted, 90 accepted, 287 authors from 16 countries"
- "Sinteza 2025: 103 papers submitted, 78 accepted"
- Supported by the Ministry of Science, Technological Development and Innovation of Serbia
- Not listed in CORE ICORE2026
