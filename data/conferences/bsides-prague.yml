notes:
- Community-run Security BSides event in Prague, held since 2024 (2024 inaugural edition, 2025, 2026)
- 2026 had two workshop days at Novotel Praha followed by two conference days at Lucerna Cinema
- 2027 moves to Narodni dum na Vinohradech, with workshops held during the two conference days
- Talks of 40 or 20 minutes and workshops of an hour or more; conference language is English
- Agendas published on Sched and talk recordings on YouTube; no proceedings
