links:
  website: https://www.ieeeindicon.org
notes:
- Flagship annual conference of the IEEE India Council; successor of the Annual Convention and Exhibition (ACE),
  first INDICON in 2004
- Held in India, usually in December, at a different host each year (2024 IIT Kharagpur, 2025 IIIT Bangalore, 2026
  Chennai)
- Broad EE and CS scope with about ten tracks; 4 to 6 page papers, double-blind review
- Accepted and presented papers are submitted to IEEE Xplore
