notes:
- Workshop on knowledge graphs as memory and reasoning support for LLM agents
- 1st edition at NeurIPS 2025 (Mexico City), 2nd at IJCAI-ECAI 2026 (Bremen, jointly with GenAIK 2026), 3rd at AACL-IJCNLP 2026 (Hengqin, Zhuhai)
- "Proceedings vary by host: CEUR-WS for NeurIPS 2025 (Vol-4162) and IJCAI-ECAI 2026, ACL Anthology for AACL-IJCNLP 2026 (2026.nora-1)"
- Research (8 pages), position and demo (6 pages), industry and use case (5 pages) and short (2 pages) papers; submission on OpenReview, ARR commitment accepted at AACL 2026
- At least one author must register and present for the paper to be included in the proceedings
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
