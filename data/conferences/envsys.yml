notes:
- Workshop on IoT, wireless and AI systems for environmental monitoring in smart cities
- Held with ACM MobiSys every year since 2023 (Helsinki 2023, Tokyo 2024, Anaheim 2025, Cambridge UK 2026)
- Runs as a joint one-day workshop with NetAISys
- Research papers up to 6 pages and challenge papers up to 4 pages including references, ACM format
- Single-blind review by default, double-blind accepted if the authors prefer
- Accepted papers are published in the ACM MobiSys workshop proceedings in the ACM Digital Library
- Small workshop, 7 of 8 papers accepted in 2023 and 7 of 8 in 2025
- Organized by the University of Helsinki
- Not listed in ICORE2026 and not on the CCF 2026 list
