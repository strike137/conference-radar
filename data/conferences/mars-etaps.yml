links:
  website: https://mars-workshop.org/
notes:
- Workshop on formal models of real systems (networks, cyber-physical systems, hardware/software codesign, biology, finance), emphasising modelling over verification
- Accepted formal models are archived in the MARS Repository hosted by Inria
- Editions in 2015, 2017, 2018, 2020, 2022, 2024, 2026 and 2027; affiliated with ETAPS in recent years, so mostly in Europe
- Papers up to 15 pages in EPTCS style (references and appendices not counted), at least three reviewers each
- Proceedings in the open-access EPTCS series (MARS 2024 -> EPTCS 399, MARS 2026 -> EPTCS 443)
- Not listed in ICORE2026
