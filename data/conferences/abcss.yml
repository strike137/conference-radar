notes:
- Workshop on big data for computational social science (sociophysics, econophysics, social media analysis, marketing science); 2026 is the 11th edition
- Run by the Society for Computational Social Science of Japan; chairs from the University of Tokyo, Soka University and the University of Tsukuba
- Held with the IEEE International Conference on Big Data every year since 2016
- Registered and presented papers go to IEEE Xplore with the main conference papers
- Papers up to 10 pages (6 to 8 recommended) in IEEE format; single-blind review
- "Accepted papers: 17 of 24 submissions (2025), 30 of 50 submissions (2026)"
- 2025 edition ran online over Zoom on Dec 9 (JST daytime) with free attendance; 2026 is hybrid
- Most authors are from Japanese universities; a friendly venue for Japanese students
- Not ranked by CORE (not in ICORE2026) or CCF
