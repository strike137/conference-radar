notes:
- Workshop at IEEE/IFIP DSN on data privacy through co-design of hardware architecture, system software and formal verification
- Topics include TEEs, confidential VMs, trusted I/O and accelerators, verified hypervisors and OSes, and side-channel defenses
- First edition 2026 at DSN in Charlotte, USA; five accepted papers and a keynote by Takahiro Shinagawa (University of Tokyo)
- DSN workshop papers go in the DSN-W supplement to the DSN proceedings on IEEE Xplore
- Regular papers up to 8 pages and short papers up to 4 pages including references, IEEE format, double-blind, at least three reviews
- Submission via EasyChair (DSN track)
- Not listed in CORE ICORE2026 or the CCF list
