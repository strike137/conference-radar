notes:
- Run by the Institute of Visual Informatics at Universiti Kebangsaan Malaysia (IVI-UKM) with MITS; held every two years
  since 2009
- Proceedings in Springer LNCS as "Advances in Visual Informatics" (2025 -> LNCS 16215, 2023 -> LNCS 14322)
- Held in Malaysia (Kuala Lumpur in 2009, then Bangi, Kajang or elsewhere in Selangor) from 2009 to 2023; the 2025 edition moved to Guangdong, China with Chinese
  co-organizers
- Broad tracks covering modelling and simulation, mixed reality and HCI, intelligent data analytics, applied AI and
  visual informatics applications
- Not listed in ICORE2026 or the CCF list; a small regional venue
- 2025 submission deadline was extended three times (from 31 May to 31 July); papers up to 12 pages, extra pages 60 USD
  each
- Online presentation option available
