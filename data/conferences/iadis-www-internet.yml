notes:
- Organized by IADIS, a Portuguese association; chair Pedro Isaias (Universidade Aberta, Portugal); running since 2002
  (25th edition in 2026)
- Proceedings published by IADIS Press with Crossref DOIs and kept in the IADIS Digital Library; extended versions of
  the best papers go to the IADIS International Journal on WWW/Internet
- Blind peer review; covers both technical and non technical aspects of the web and the Internet
- Two calls for papers (1st and last CFP); full, short and reflection papers plus posters
- "Acceptance rate: 18% for full papers (2025, 28 of 158 submissions shared with Applied Computing 2025)"
- Held in Portugal most years, sometimes elsewhere in Europe (online 2020 and 2021, Lisbon 2022, Funchal 2023,
  Zagreb 2024, Porto 2025, Lisbon 2026); co-located with other IADIS conferences such as CELDA, Applied Computing and DSDI
- IADIS conferences are generally regarded as minor venues; not listed in CORE ICORE2026 or on the CCF 2026 list
