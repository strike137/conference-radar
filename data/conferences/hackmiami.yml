notes:
- Hacker conference run by HackMiami, a South Florida security community that started in 2008 around Florida International University
- First official conference in 2013; recent editions are HackMiami X (2023), XI (2024), XII (2025) and 1101 (2026)
- Recent editions held in Sunny Isles Beach, Florida, USA (Marenas Beach Resort in 2024 and 2026)
- Format is four days of paid trainings followed by one talks day with two tracks (Nu World Order and Old World Order)
- "CFP by email to cfp@hackmiami.info with presenter name, talk title and synopsis"
- Topics include offensive security, AI security, OSINT, OT and threat intelligence; CTF competitions
- No proceedings
