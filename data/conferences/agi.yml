notes:
- Run by the AGI Society since 2008; chaired by Ben Goertzel, with a strong SingularityNET presence (livestreamed on its YouTube channel)
- Proceedings in Springer LNCS; in two parts since 2025 (LNCS 16057 and 16058 for AGI-25)
- "AGI-24: 25 papers selected from 55 submissions"
- Held mostly in the USA (Seattle 2022 and 2024, San Francisco 2026) with editions in Stockholm (2023) and Reykjavík (2025); in-person plus virtual attendance
- Four-day format with workshops, tutorials and demos around the main track
- Not ranked in CORE ICORE2026 or the CCF list; regarded as a niche venue
