notes:
- Annual since 2018; online in 2021 and 2022, then Shanghai 2023 to 2025, Jinan 2026 and Hangzhou 2027
- Run by a commercial conference service (AEIC/AiScholar) with a different host university each year; Liang Hu (Tongji University) is the recurring general chair
- Proceedings published by IEEE since 2024 (2026 ISBN 979-8-3315-8324-8) and indexed in EI Compendex and Scopus; 2019 to 2023 in Journal of Physics Conference Series (IOP)
- Large proceedings (316 papers in 2024, 487 papers in 2025 per the EI and Scopus records shown on the site)
- Topics span algorithms, control engineering and applied AI
- Abstract-only presenter and listener registration are also offered
- Not listed in CORE ICORE2026 or the CCF list
