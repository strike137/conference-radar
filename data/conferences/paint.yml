notes:
- SPLASH workshop on programming environments, visual and block-based programming, projectional editors and mixed notations
- Research papers (6 to 8 pages suggested, no hard limit, ACM SIGPLAN acmart format) and demos submitted as videos up to 5 minutes
- Run in a Writers' Workshop format with moderated structured feedback on each paper
- Accepted papers are published in the ACM DL
- Organized by researchers from Hasso Plattner Institute, Cambridge and VU Amsterdam
- Moves with SPLASH (Auckland 2022, Cascais 2023, Pasadena 2024, Singapore 2025)
- Not listed in the SPLASH/ISSTA 2026 workshop programme
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
