notes:
- Billed by ION as the world's largest technical meeting and showcase of GNSS technology, with a large exhibit hall
- Held every September in the USA (Denver 2022 and 2023, Baltimore 2024 and 2025, Orlando 2026 and 2027, Dallas 2028
  and 2029)
- Selection is based on abstracts (extended abstracts of 500 to 2500 words recommended); ION states an average
  acceptance rate of about 50%
- Research Track papers must be submitted by June 30 and pass peer review by at least two reviewers; only papers
  passing peer review go into the official proceedings, and Commercial Track papers are peer reviewed only on request
- All presenters must provide a pre-recorded video; there is no live remote presentation option
- Exceptional papers are recommended to NAVIGATION, the journal of the Institute of Navigation
- Navigation venue outside the usual CS rankings, not listed in ICORE2026 or the CCF 2026 list
