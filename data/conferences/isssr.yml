notes:
- Formerly the International Symposium on System and Software Reliability (renamed in 2022); running since 2015
- Hosted on the same techconf.org platform as QRS and DSA; steering committee chaired by W. Eric Wong (UT Dallas)
- Proceedings published by IEEE CPS and submitted to IEEE Xplore and Ei Compendex (ISSN 2835-2823)
- Technical sponsor is the IEEE Reliability Society; selected papers invited to SCI journal special issues
- Always held in China (Chengdu 2018 to 2020, Chongqing 2021 and 2022, Hangzhou 2023, Xiamen 2024, Anshun 2025, Xiangyang 2026, Kunming 2027)
- Regular papers up to 12 pages, short papers up to 10; also industry track, fast abstracts and workshops
- Not listed in CORE ICORE2026 or the CCF list
