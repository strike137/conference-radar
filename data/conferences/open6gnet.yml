notes:
- Workshop on open source 5G and 6G core and RAN software, private networks and testbeds for affordable coverage
  in developing and developed countries
- Moves between IEEE events; Open6GNet 2025 at IEEE NetSoft 2025 (Budapest), 3rd edition at IEEE WCNC 2026 (Kuala
  Lumpur), run jointly with the INTRAN workshop
- 2026 organizers from TU Berlin, University of Cape Town, SUTD and University of Campinas
- WCNC workshop papers go into the WCNC proceedings and are planned for IEEE Xplore; no-show papers can be excluded
- Program mixes papers with keynotes and a panel; many papers from the TU Berlin and Fraunhofer FOKUS group
- Not in the IEEE WCNC 2027 workshop list
- Not listed in ICORE2026
