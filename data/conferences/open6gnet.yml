notes:
- Workshop co-located with IEEE WCNC; the 2026 edition (WS-02, 9:00 to 15:30) was the third
- Organizers from TU Berlin, University of Cape Town, SUTD and University of Campinas (led by Thomas Magedanz)
- Topics include open source 5G and 6G building blocks, private networks, testbeds and coverage for unconnected areas
- In 2026 it ran joint sessions with the INTRAN workshop, with keynotes from NTT Docomo and VIAVI
- Accepted and presented papers go into the WCNC proceedings in IEEE Xplore; no-show papers are removed
- Workshop papers up to 6 pages (2 extra pages at 100 USD each); submissions via EDAS
- Not listed in ICORE2026
