notes:
- Annual interactive systems and HCI workshop of the JSSST SIG on Interactive Systems and Software, held every
  December at a resort hotel in Japan (2026 is the 34th edition)
- Oral papers up to 6 pages in Japanese or English with single-blind review; a working implementation is required
- Papers and some reviewer comments are published in open web and PDF proceedings; presenting does not prevent
  later submission to international conferences or journals, and demo papers are explicitly non-archival
- Demo (2 pages), WISS Challenge and invited talks on international conference papers in addition to orals
- On-site only, usually over 150 participants
