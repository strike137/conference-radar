links:
  website: https://www.semdial.org/
notes:
- Standalone annual workshop series on dialogue semantics and pragmatics, running since 1997; each edition has a nickname
  (2025 Bialogue, 2026 LuffDial)
- Interdisciplinary audience from formal semantics, computational linguistics, AI, philosophy and psychology
- Held at a different European university each year (Maribor 2023, Trento 2024, Bielefeld 2025, Loughborough 2026)
- Proceedings published by SemDial in its own SemDial Anthology, not in the ACL Anthology
- Long papers 4 to 8 pages and short papers (posters) up to 2 pages in ACL format; short papers can be non-archival on
  request
- Endorsed by ACL SIGdial and ACL SIGSEM in 2026
- Not listed in CORE ICORE2026 or the CCF 2026 list
