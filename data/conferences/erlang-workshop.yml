notes:
- Satellite workshop of ICFP, sponsored by ACM SIGPLAN; 2026 is the 25th edition
- Covers Erlang, Elixir, Gleam and other BEAM languages, actor model programming, distribution and concurrency
- Accepted papers are published by ACM in the ACM Digital Library; lightning talks are not peer reviewed and not in the proceedings
- Technical papers and practice and application papers up to 12 pages, short papers up to 6 pages (ACM SIGPLAN acmart format)
- Academic and industrial audience (Ericsson, Meta/WhatsApp, Erlang Ecosystem Foundation)
- Follows ICFP around the world (Singapore 2025 with ICFP/SPLASH, Indianapolis 2026); 2026 edition was hybrid
- Not listed in the CORE portal (ICORE2026)
