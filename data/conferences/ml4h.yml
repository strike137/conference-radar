notes:
- Machine learning for health venue run by AHLI (the organizer of CHIL); held right before NeurIPS in the same city
- Began in 2015 as a NeurIPS workshop; a standalone symposium since 2021
- Proceedings track papers (8 pages) appear in PMLR (2025 -> vol. 297, 2024 -> vol. 259)
- Findings track papers (4 pages) are non-archival and only posted on OpenReview
- Double-blind review on OpenReview with an author response period
- Recent editions in New Orleans 2022 and 2023, Vancouver 2024, San Diego 2025, Sydney 2026
- Not ranked in CORE ICORE2026
