notes:
- Sponsored by IEEE CEDA and ACM SIGDA; machine learning and AI (including LLMs) applied to CAD of chips, circuits
  and systems
- Started as a workshop at DATE 2019; ACM/IEEE Workshop on Machine Learning for CAD from 2019 to 2023, renamed
  Symposium from 2024
- Mostly held in North America (Snowbird, Utah 2022 to 2024; Santa Cruz 2025); 2026 edition in Jeju, South Korea
- Formal shared ACM/IEEE proceedings in both IEEE Xplore and ACM DL; extended versions of accepted papers invited to
  an ACM TODAES special issue
- Research papers up to 6 pages in ACM format (references and appendices excluded); double-blind review via EasyChair
- ACM Open Access from 2026, so authors from non-ACM Open institutions may pay an APC (subsidized 250 or 350 USD in 2026)
- Runs an annual MLCAD contest alongside the paper track
- Not listed in CORE ICORE2026 or the CCF 2026 list
