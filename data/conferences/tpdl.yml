id: tpdl
name: TPDL
full_name: International Conference on Theory and Practice of Digital Libraries
type: conference
tier: major
areas: [data, ai]
region: europe
language: english
frequency: annual
organizer: Host university each year (University of the Algarve in 2026)
organizer_country: [europe]
proceedings: Springer LNCS
archival: true
rank:
  core: B
typical:
  deadline_months: [4, 5]
  conference_months: [9]
links:
  website: https://www.tpdl.eu/
notes:
- The European digital library conference; called ECDL until 2010
- Proceedings in Springer LNCS (2025 is LNCS volume 16097); in 2026 short, demo and doctoral consortium papers go to
  Springer CCIS
- Research and practitioner papers up to 15 pages plus references in LNCS style; separate short paper, demo and
  doctoral consortium tracks with later deadlines
- 2025 (29th edition) was in Tampere, Finland, co-located with ADBIS 2025; 2026 (30th edition) in Faro, Portugal
- CORE B in ICORE2026
