links:
  website: https://icat.etf.unsa.ba
notes:
- Run by the Faculty of Electrical Engineering Sarajevo since the early 1970s; 2025 was the 30th edition
- Technically co-sponsored by the IEEE Control Systems Society, IEEE Industrial Electronics Society and IEEE SMC Society
- Broad scope covering computer science, AI, control and automation, communications and networking, and power engineering
- Held in Sarajevo, Bosnia and Herzegovina; recent editions in 2022 (June), 2023 (June) and 2025 (September), so not strictly annual
- Papers up to 6 pages in IEEE format, submitted via EDAS; final papers submitted to IEEE Xplore
- Not listed in CORE ICORE2026 or the CCF list
