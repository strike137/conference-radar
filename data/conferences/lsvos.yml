id: lsvos
name: LSVOS
full_name: Large-scale Video Object Segmentation Workshop and Challenge
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: LSVOS organizing committee (2026 organizers from Fudan University, SUFE, Apple, ByteDance and Meta Reality Labs); co-located with ECCV or ICCV
organizer_country: [international]
proceedings: ECCV/ICCV Workshops proceedings (CVF Open Access)
archival: true
typical:
  deadline_months: [7]
  conference_months: [9, 10]
links:
  website: https://lsvos.github.io/
notes:
- Workshop and challenge on video object segmentation and referring video object segmentation
- Held with the major computer vision conference of the year (ECCV 2024 Milan, ICCV 2025 Honolulu, ECCV 2026 Malmo)
- "2026 challenge tracks: MOSEv2, MeViSv2-Text and MeViSv2-Audio, plus the extra MUMU track"
- Regular papers up to 8 pages in the ECCV/ICCV format, double-blind review on OpenReview; accepted papers are presented as posters
- Accepted papers go into the official ECCV/ICCV Workshops proceedings and the CVF Open Access archive
- Separate PVUW workshop (with CVPR) covers related video segmentation challenges
- Not listed in ICORE2026 or the CCF list
