notes:
- Community-organized Security BSides conference in Montreal, Quebec, Canada, with programs online for every year since 2021
- One day on a Saturday in September at the Grande Bibliotheque (BAnQ) in Montreal
- Single track of 30 minute talks in French or English, grouped in blocks with a subject matter moderator, plus a hands-on workshop
- Call for speakers on pretalx in two rounds (round 1 closing in May, round 2 in July in 2026)
- Topics include threat intelligence, reverse engineering, exploitation, forensics, application security and cryptography, as well as ethics, law and sociology of cybersecurity
- Talks are not published or made available online; first-time speakers welcome
