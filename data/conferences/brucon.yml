notes:
- Belgian security and hacker conference run by the non-profit BruCON; editions are numbered in hex (2026 is BruCON 0x12)
- Held at Lamot Mechelen, Belgium, with trainings at Novotel Mechelen
- Two-day conference in late September, preceded by three days of autumn trainings; separate spring trainings in April
- CFP open 1-30 April via Sessionize, up to 3 proposals per speaker
- Talks posted on YouTube; no published proceedings (non-archival)
