notes:
- Annual technology conference of Rakuten Group, held at its headquarters Rakuten Crimson House in Futako Tamagawa, Tokyo
- Renamed from Rakuten Technology Conference to Rakuten AI Technology Conference in 2026, its 18th edition
- One-day Saturday event with keynotes and panels by Rakuten executives and invited speakers from cloud and security companies
- Open to anyone and free to join, with registration required
- Satellite events at Rakuten offices in Sendai, Fukuoka and Osaka
- Includes a Lightning Talk session for engineering students seeking entry-level jobs at Rakuten
- No open call for papers and no proceedings; invited talks only
- Not listed in the CORE ICORE2026 portal or the CCF list
