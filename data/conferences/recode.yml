notes:
- One-day ICSE workshop on code translation and migration across languages, refactoring legacy systems and software modernization, including LLM-based approaches
- First edition at ICSE 2026 (Rio de Janeiro); second edition at ICSE 2027 (Dublin)
- Six submission categories (research, position, industry/experience, education, benchmarks, extended abstracts), up to 6 pages; double-anonymous review
- Accepted papers appear in the ICSE workshop proceedings; a non-archival option is offered at submission
- Keynotes from industry and academia (Amazon, Google and UC Berkeley in 2026), best paper awards
- Not listed in ICORE2026
