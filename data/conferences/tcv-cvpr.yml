links:
  website: https://fadetrcv.github.io/2025
notes:
- CVPR workshop on fairness, bias, data-efficient learning, explainability, adversarial robustness and privacy in vision systems
- Held with CVPR every year from 2020 to 2025; 2025 was the 6th edition
- Accepted technical papers are published in the CVPR workshop proceedings (12 papers on CVF Open Access in 2025)
- Papers follow the CVPR author guidelines, submitted through Microsoft CMT
- No edition at CVPR 2026
- Not listed in ICORE2026 or the CCF list
