notes:
- Student-run security conference at Abertay University, Dundee, Scotland, organized by the Abertay Ethical Hacking Society
- Describes itself as Europe's largest student-run cybersecurity conference
- One day of talks, workshops and networking, usually on a Friday in late February, with pre-party and after-party
- No proceedings; three talk tracks open to seasoned professionals and first-time speakers, plus a workshop village and a CTF (2025)
