notes:
- 100% volunteer-organized Security BSides conference in San Diego, California, USA, run by a 501(c)(3) non-profit
- Held at San Diego State University (Montezuma Hall and Theater) in 2026, one day in April
- Speakers selected by the BSides SD committee; tracks for new speakers (with mentoring), regular speakers and 1 to 2 hour training workshops
- New speaker talks are not recorded, regular speaker talks are recorded
- Tickets are suggested donation tiers; villages, CTF, badge challenge and Hacker Jeopardy
- No proceedings
