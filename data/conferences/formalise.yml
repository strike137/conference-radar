notes:
- Conference at the intersection of formal methods and software engineering; supported by Formal Methods Europe
- Co-located with ICSE every year and moves with it (Melbourne 2023, Lisbon 2024, Ottawa 2025, Rio de Janeiro 2026, Dublin 2027)
- Accepted papers appear in the ICSE co-located proceedings in the ACM and IEEE digital libraries
- 2027 uses the IEEE template (2026 used the ACM template)
- "Paper types for 2027: research and experience report papers (10 pages plus 2 of references), research ideas and vision papers, tool demos, posters (posters not in the proceedings)"
- Lightweight double-anonymous review; optional artifact evaluation track
- 2026 was the 14th edition; 2027 is the 15th
- Not listed in the CORE ICORE2026 ranking or the CCF 2026 list
