notes:
- Java and JVM developer conference covering JVM languages, enterprise architecture, distributed computing,
  software craftsmanship, DevOps and practical AI
- Run by 4GC Sp. z o.o. (Krakow) together with the Polish Java User Group community
- Held every May at Multikino Krakow, Poland; 2027 is the 17th edition
- A separate GeeCON Prague edition ran in October in 2014 to 2019, 2022 and 2023
- About 800 participants, 50 speakers and 60 sessions
- Talks chosen from a call for papers (abstracts of at least 120 words); all talks in English, 15 or 50 minutes
- Practitioner talks only; no papers or proceedings
- "Fee: from 999 PLN + VAT for the first 100 tickets (2027)"
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
