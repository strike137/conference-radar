full_name: Workshop on Patent Text Mining and Semantic Technologies
type: workshop
tier: minor
areas: [nlp, data, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizing committee (ZBW and CAU Kiel, FIZ Karlsruhe, TU Wien, EPO in 2027)
organizer_country: [europe]
proceedings: CEUR-WS
archival: true
typical:
  deadline_months: [1, 4]
  conference_months: [3, 7]
links:
  website: http://ifs.tuwien.ac.at/patentsemtech/
notes:
- Workshop on text mining, NLP, LLMs and information retrieval for patents and IP, bridging the IP industry and academia
- Started at SEMANTiCS 2019, then co-located with SIGIR from 2021 to 2025; moves to ECIR 2027 in Southampton after a break in 2026
- Proceedings in CEUR-WS (6th edition 2025 is Vol-4062, 9 of 19 submissions accepted)
- Selected papers invited to extended versions in Elsevier's World Patent Information journal
- Full papers up to 12 pages and short papers up to 6 pages in CEUR-ART style, at least two reviewers; submission via EasyChair
- At least one author must register and present in person
- Not listed in ICORE2026 and not on the CCF list
