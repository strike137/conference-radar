notes:
- One of the oldest continuously running parallel computing conferences (55th edition in 2026); organized by IACC
  with ACM SIGHPC in cooperation
- Proceedings in the ACM ICPS series (ACM DL); ACM open access model may require an APC for authors outside ACM Open
  institutions
- CORE B and CCF B; well regarded mid-to-upper venue for parallel and distributed systems, HPC and accelerators
- Seven tracks (algorithms, applications, architecture, multidisciplinary, performance, software, quantum computing);
  double-anonymous review, 10 pages including references in ACM sigconf format
- Abstract registration one week before the full paper deadline; one full registration required per accepted paper
  and in-person presentation expected
- Location rotates worldwide (2023 Salt Lake City, 2024 Gotland, 2025 San Diego, 2026 Singapore); workshops on the
  first day
