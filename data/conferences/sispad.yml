notes:
- Long-running conference on TCAD, process and device simulation and compact modeling; formed in 1996 from NUPAD (USA), VPAD (Japan) and SISDEP (Europe)
- Held every September, rotating between the United States, Japan and Europe (2023 Kobe, 2024 San Jose, 2025 Grenoble, 2026 Kumamoto, 2027 Salt Lake City)
- Submission is a 2-page abstract; accepted authors send a 4-page camera-ready paper in IEEE Xplore-compatible format
- Oral and poster presentations, plus a one-day workshop the day before the main conference
- 2026 edition sponsored by the Japan Society of Applied Physics and technically co-sponsored by IEEE EDS
- "Registration 2026: JPY 90,000 regular and JPY 40,000 student (early bird)"
- Not ranked by CORE or CCF, whose lists cover computing venues
