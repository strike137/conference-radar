notes:
- Main conference on TCAD, process and device simulation, compact modeling and nanoelectronic device modeling
- Started in 1996 in Tokyo as the merger of NUPAD (USA), VPAD (Japan) and SISDEP (Europe)
- Held every September, rotating between the USA, Japan and Europe; a satellite workshop the day before
- Two-page abstract submission; accepted authors submit a four-page IEEE Xplore compatible camera-ready paper for the proceedings
- Oral and poster presentations; in-person only; no-show papers are withheld from IEEE Xplore (2025 policy)
- 2026 edition sponsored by the Japan Society of Applied Physics and technically co-sponsored by IEEE EDS
- Not ranked by CORE or CCF, whose lists cover computing venues
