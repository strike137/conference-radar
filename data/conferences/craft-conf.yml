notes:
- Software craftsmanship and engineering practitioner conference for senior engineers, architects and tech leaders
- Run by CraftHub, a Budapest company spun off from Prezi and IBM Budapest Lab in 2020; the conference started in 2014
- Held every spring in Budapest, Hungary; recent editions at the Hungarian Railway History Park (online only in 2021)
- About 2000 attendees and 80 or more international speakers, plus pre-event and on-site masterclasses
- Talks (30 minutes) and 90-minute tutorials chosen by a program board from a call for papers; no papers or proceedings
- Call for papers usually open until November for the following year's edition
- Selected speakers get hotel, a full ticket and travel reimbursement (up to 500 USD within Europe, 1500 USD globally)
