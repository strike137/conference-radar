notes:
- Small conference on number theory applied to cryptography and cryptanalysis (curves, lattices, isogenies, factorization)
- 'Editions: Warsaw 2017, Paris 2019, Poznan 2022, Szczecin 2024, Katowice 2026; mostly held in Poland'
- Full papers up to 30 pages via EasyChair; revised papers appear afterwards as a Springer LNCS post-proceedings volume
- 2026 edition had 34 participants from 10 countries, 4 plenary lectures and 11 contributed talks
- Not ranked by CORE and not on the CCF list
