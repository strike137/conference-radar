notes:
- Small conference on number theory for cryptology (lattices, elliptic and higher genus curves, post-quantum cryptography, quantum computing in cryptology)
- Held in Poland and France roughly every two years (Warsaw 2017, Paris 2019, Poznan 2022, Szczecin 2024, Katowice 2026)
- Full papers up to 30 pages via EasyChair; revised selected papers in Springer LNCS (LNCS 14966 for 2024)
- Single-track program of invited talks plus about 9 contributed talks (2024)
- 2026 edition had 34 participants from 10 countries, 4 plenary lectures and 11 contributed talks
- "Registration fee about 200 EUR (2024: 900 PLN including VAT)"
- Not listed in CORE ICORE2026 or the CCF list
