notes:
- Annual symposium on medical image processing, biosignals, e-health and AI in healthcare, run by the SIPAIM Society with local organizers
- Rotates around Latin America (Colombia 2025, Guatemala 2024, Mexico 2023, Chile 2022, Brazil 2021, Peru 2026)
- Full papers of up to 4 pages plus 1 page of references, single-blind review via CMT, submitted for inclusion in IEEE Xplore
- One-page abstracts are accepted as posters (not published in IEEE Xplore)
- Endorsed by MICCAI; IEEE SPS and EMBS listed among supporters
- Not listed in ICORE2026
