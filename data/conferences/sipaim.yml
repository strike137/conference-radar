notes:
- Annual symposium of the SIPAIM Society, a nonprofit that promotes biomedical engineering research in Latin
  America; 22nd edition in 2026
- Medical imaging, biosignals, digital pathology, e-health and AI in healthcare; endorsed by MICCAI
- Full papers up to 4 pages plus 1 page of references (IEEE template), single-blind review, published in IEEE
  Xplore; 1-page abstracts presented as posters
- Rotates within Latin America (Valparaiso 2022, Mexico City 2023, Antigua 2024, Pasto 2025, Lima 2026)
- Deadlines are usually extended by about four weeks
- Not ranked in CORE ICORE2026; not on the CCF 2026 list
