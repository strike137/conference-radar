notes:
- ACM SIGOPS workshop held annually in Asia-Pacific since 2010 (Kyoto 2024, Seoul 2025 co-located with SOSP, Bangkok
  2026)
- 'Short papers: 5 pages excluding references, ACM sigconf format, double-blind review via HotCRP'
- Accepts preliminary results, new directions and position papers; proceedings in the ACM Digital Library
- Separate poster track with a later deadline; student travel grants offered in some years
- 'Small workshop: 19 papers accepted in 2026, from Asian, US and European groups'
