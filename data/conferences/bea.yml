notes:
- Annual workshop of ACL SIGEDU, 21st edition in 2026; one of the largest one-day workshops in the ACL community
- Proceedings in the ACL Anthology (open access)
- Long and short papers; hosts shared tasks every year (2026 on vocabulary difficulty prediction and German short
  answer scoring)
- Follows its host conference (EACL 2021 online, NAACL 2022 Seattle, ACL 2023 Toronto, NAACL 2024 Mexico City,
  ACL 2025 Vienna, ACL 2026 San Diego)
- 2026 edition ran two days, one in person and one virtual
