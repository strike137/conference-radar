organizer: ACIVS steering board (DGA France, University of Auckland, with a local host university)
organizer_country: [europe, new-zealand]
proceedings: Springer LNCS
archival: true
rank:
  core: B
fee: NZD 1,050 (2026, in-person with one paper, on or before Aug 15); NZD 950 online with paper
typical:
  deadline_months: [4, 6]
  conference_months: [7, 12]
links:
  website: https://acivsconf.org/
notes:
- Long-running image processing and computer vision conference; the 23rd edition is in 2026
- Proceedings in Springer LNCS; papers up to 12 pages
- Single-blind review with at least two reviewers, submission via Microsoft CMT
- Recent editions held in Antwerp 2017, Poitiers 2018, Auckland 2020, Kumamoto 2023, Tokyo 2025 and Okinawa 2026
- Fees are charged in New Zealand dollars
- Best student paper award (1,000 EUR sponsored by Springer in 2026)
- Small conference with many European program committee members
