notes:
- Series on novel forms of computation and nature-inspired computing (molecular, quantum, optical, neural and
  evolutionary computation, cellular automata, membrane computing, artificial life, synthetic biology)
- Formerly the International Conference on Unconventional Computation (UC); 23rd edition in 2026
- Regular papers up to 16 pages and short papers up to 8 pages appear in Springer LNCS as post-proceedings; late-breaking
  abstracts (3 pages) and posters are presentation only
- Satellite workshops (2026 reaction systems, quantum computing, cellular automata and Boolean automata networks) have
  their own publication arrangements
- 'Rotates globally: Tokyo 2019, Espoo 2021, Jacksonville 2023, Pohang 2024, Nice 2025, Trieste 2026 (no 2020 or 2022 edition)'
- 'Deadlines are usually extended (2026: submission Mar 13 -> Mar 27)'
- CORE C in ICORE2026 (listed under the acronym UC); not on the CCF 2026 list
