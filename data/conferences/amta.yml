notes:
- Biennial conference of AMTA, the North American branch of the International Association for Machine Translation
  (IAMT, with EAMT and AAMT); AMTA is a US 501(c)3 non-profit
- Mixes researchers, MT developers, language service providers, translators and government users
- Two review routes, peer-reviewed research papers (up to 8 pages, blind review) and less formal presentation proposals
- Proceedings in the ACL Anthology (research track and presentations volumes); archival for peer-reviewed papers
- Held in North America (Austin 2016, Boston 2018, virtual 2020, Orlando 2022, Chicago 2024, Quebec City 2026)
- 2026 had an online tutorial day (Aug 19) before the three-day in-person conference, which was not live streamed
- CORE National/Regional (ICORE2026)
