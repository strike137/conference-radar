notes:
- One of the three flagship database conferences, with SIGMOD and VLDB
- Two research submission rounds a year (June and October/November); deadlines at 5 pm US Pacific Time
- Single-blind review; at most 5 research submissions per author per round; a paper rejected in one round cannot
  be resubmitted until a year later
- 'ICDE 2027 drops the revise-and-resubmit phase: each round is accept or reject after a rebuttal'
- Rotates worldwide; Hong Kong hosted in 2025
