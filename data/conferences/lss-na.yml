notes:
- Technical forum on Linux security run by The Linux Foundation, with a program committee selecting refereed talks
- Refereed presentations (about 45 minutes), breakout sessions and BoFs; no papers, recordings go to the Linux Foundation
  YouTube channel and slides to the event schedule
- Topics include access control, kernel and OS hardening, integrity, crypto and key management, containers and supply chain
- Held in a North American city that changes between editions (Denver 2025, Minneapolis 2026); a separate LSS Europe also exists
