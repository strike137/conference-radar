notes:
- Community Java and JVM conference in Warsaw, Poland, run as a non-profit since 2007; one of the largest Java community events in Poland
- Talks in Polish and English, mixing well-known speakers with first-time speakers
- Program chosen by the community, a Call for Papers (C4P) followed by a public Vote for Papers (V4P)
- About 450 participants, 47 talks and 12 workshops in 2025 (15th edition)
- "Fee: 666 PLN for both days, 444 PLN for one day (2026, incl. tax, lunch not included)"
- No papers or proceedings; talks are recorded and published on YouTube
- Not listed in CORE ICORE2026
