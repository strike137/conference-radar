notes:
- Half-day workshop on generative, retrieval-augmented and agentic approaches to recommendation and personalization
- Co-located with ACM CIKM 2026 in Rome (Sapienza University of Rome), listed among the CIKM 2026 accepted workshops
- Organizing team mixes industry (Airbnb, Amazon, Google DeepMind, Disney, Thumbtack) and academia
- Papers are non-archival; accepted papers are posted as PDFs on the workshop website
- Full papers up to 8 pages, short papers up to 4 pages (plus references and appendix), ACM double-column template, single-blind review via EasyChair
- At least three reviews per paper; at least one author must present in person in Rome
- 2026 submission deadline was extended from 24 August to 28 August 2026
- Not listed in CORE ICORE2026 or the CCF 2026 list
- Unrelated to the MICCAI GRAIL workshop on graphs in biomedical image analysis (id grail)
