notes:
- Annual symposium mostly held in Timisoara, Romania (Nancy 2023 and Linz 2022 were the exceptions)
- Tracks on symbolic computation, numerical computing, logic and programming, AI, distributed computing and theory of computing
- Electronic pre-proceedings at the event; camera-ready papers for post-proceedings published by IEEE Conference Publishing Services in IEEE Xplore
- Regular papers up to 8 pages, short papers up to 4 pages, two-column format
- Several co-located workshops and special sessions with their own later deadline
- Extended versions of selected papers considered for journals such as Journal of Symbolic Computation
- CORE National (Romania) in ICORE2026
