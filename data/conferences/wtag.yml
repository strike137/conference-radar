notes:
- Undergraduate student workshop of SBBD, the Brazilian Symposium on Databases (SBC); 7th edition in 2026
- First author must be an undergraduate or recent graduate, with a faculty advisor as co-author
- Up to 6 pages of content plus 1 page for references in SBC format, English or Portuguese (English abstract required), via JEMS
- Accepted papers appear in the Anais Estendidos do SBBD (ISSN 2966-3946) in SBC OpenLib (SOL), each with a DOI
- Publication requires SBBD registration and a presentation by the student
- Not listed in CORE ICORE2026
