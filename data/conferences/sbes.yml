notes:
- Main Brazilian software engineering symposium of the Brazilian Computer Society (SBC); 40th edition in 2026
- Held each year within CBSoft (Congresso Brasileiro de Software) in a different Brazilian city (Recife 2025, São Paulo 2026)
- Proceedings (Anais) published open access in the SBC OpenLib (SOL)
- Papers in Portuguese or English; research track double-anonymous review with rebuttal, up to 10 pages plus 2 pages of references
- Several tracks (research, education, ideas and emerging results, tools, industry, student contests) and a journal-first track
- Best papers invited to an extended version in the Journal of Software Engineering Research and Development (JSERD)
- Not ranked in CORE ICORE2026
