notes:
- Workshop on security testing of software (automated security test generation, fuzzing, vulnerability reproduction, supply chain security testing, empirical studies)
- First edition in 2024 co-located with EASE in Salerno, Italy; second edition in 2026 co-located with ASE in Munich, Germany
- Held every two years so far (2024, 2026); no third edition announced yet
- Double-anonymous review by three PC members; full papers up to 8 pages, ongoing research and tool or data papers up to 5 pages, ACM format
- SECUTE 2026 proceedings published open access in the ACM Digital Library with the other ASE 2026 workshops
- Authors of accepted 2026 papers were invited to extend them for a special issue of the Empirical Software Engineering journal (Springer)
- Small workshop with five accepted papers in 2026 and four in 2024
- Organized in the context of the EU SEC4AI4SEC project
