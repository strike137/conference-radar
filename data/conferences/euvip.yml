id: euvip
name: EUVIP
full_name: European Conference on Visual Information Processing
type: conference
tier: minor
areas: [vision]
region: europe
language: english
organizer: EURASIP with IEEE Signal Processing Society support, and a local host university (2025 University of Malta, 2026 University of Luxembourg)
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
fee: 1025 EUR non-member early, 850 EUR IEEE/EURASIP member early, 500 to 600 EUR student early (2026)
typical:
  deadline_months: [5, 6]
  conference_months: [9, 10]
links:
  website: https://euvip2026.github.io/
notes:
- Standalone event on image and video processing, visual quality, perception and multimedia; 2025 was the 13th edition, 2026 the 14th
- Called European Workshop on Visual Information Processing up to 2025, renamed European Conference from 2026
- All accepted regular papers go to IEEE Xplore; a paper not presented in person is withdrawn from the proceedings
- Double-blind review; full papers 4 to 6 pages including references (page 6 only references), IEEE format, A4
- Also has 2-page project dissemination papers, a student poster session, special sessions and one-day tutorials
- Best Paper, Best Student Paper and Student poster/demo awards
- Not listed in CORE ICORE2026 or the CCF 2026 list
