notes:
- Smaller commercially organized Chinese conference run through the AiScholar (ais.cn) service; contact via a 163.com address and WeChat
- Called ICC until 2023 and rebranded as ICICC in 2024; not the IEEE ICC and not the Indian ICICC (Innovative Computing and Communication)
- Held in a different Chinese city each year (Nanchang 2023, Zhengzhou 2024, Nanjing 2025, Hangzhou 2026)
- IEEE ComSoc technical sponsorship in 2024 and IEEE technical sponsorship in 2025
- 2026 papers published by IEEE (ISBN 979-8-3195-3487-3) and submitted to IEEE Xplore, EI Compendex and Scopus; 4 pages minimum
- Short review cycle (5 days from submission deadline to notification in 2026); abstract-only presentation is also offered
- Not listed in ICORE2026 or the CCF 2026 list
