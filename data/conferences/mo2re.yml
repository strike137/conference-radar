notes:
- ICSE workshop that brings requirements engineering together with other software engineering areas (testing, human aspects, architecture, AI for RE, RE for AI)
- Held at ICSE since 2024; 3rd edition at ICSE 2026 in Rio de Janeiro, 4th edition at ICSE 2027 in Dublin
- 2027 accepts long research papers up to 7 pages, short and demo papers up to 4 pages, extended abstracts up to 5 pages and 2-page lightning talks, references included
- Lightning talks are not included in the proceedings
- ICSE 2027 workshop papers are published by IEEE
- MO2RE 2027 is co-located with the RAISE workshop on requirements engineering for AIware
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
