notes:
- One-day ICSE workshop on requirements engineering and its links to the rest of software engineering, including RE for and with AI
- Held with ICSE since 2024; Lisbon 2024, Ottawa 2025, Rio de Janeiro 2026 (3rd edition), Dublin 2027 (4th edition)
- Called Multi-disciplinary, Open, and RElevant Requirements Engineering in 2024 and 2025; renamed integRatEd from 2026
- Long papers 7 pages, short papers 4 pages (plus 1 page of references), demo papers and extended abstracts; lightning talks are not in the proceedings
- Single-anonymous review; 2027 edition co-located with the RAISE workshop
- 2026 proceedings in the ACM Digital Library as "Proceedings of the 3rd Workshop on Multi-disciplinary, Open, and IntegRatEd Requirements Engineering"
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
