notes:
- Annual New Zealand conference on research computing, research data, HPC and research software; the NZ counterpart of eResearch Australasia
- Co-organised by REANNZ and Genomics Aotearoa with support from MBIE; 2026 edition was the 17th
- Abstract-based submissions reviewed by the Programme Committee; formats are 5 min lightning talks, 15 min presentations, 60 min BoF sessions and half or full day workshops
- Abstracts appear in an abstract book PDF, slides on Figshare and recordings on YouTube; no full papers, so non-archival
- 2026 in Auckland; 2027 at Victoria University of Wellington, Kelburn Campus, main programme 10 to 12 Feb with NZ Carpentry Connect the day before (9 Feb)
- Not listed in CORE ICORE2026
