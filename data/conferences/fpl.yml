notes:
- Oldest and largest conference on FPGAs and reconfigurable computing, started in 1991 in Oxford as a workshop
- Run by an FPL Steering Committee of mostly European academics; a different European university hosts it each year
- Held in Europe every year in late August or early September (Dresden 2021, Belfast 2022, Gothenburg 2023, Torino
  2024, Leiden 2025, Ghent 2026)
- Long papers 8 pages and short papers 5 pages plus references; double-blind review; both are published and presented
- Proceedings published by IEEE Conference Publishing Services and submitted to IEEE Xplore and the CSDL
- Also has a journal track with ACM TRETS, a PhD forum, a demo night and workshops and tutorials after the main days
- CORE B (ICORE2026) and CCF C
