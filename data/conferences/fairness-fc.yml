organizer: Organizers Chen-Da Liu-Zhang (Lucerne University of Applied Sciences and Arts), Pratik Soni (University of
  Utah), Sri Aravinda Krishnan Thyagarajan (University of Sydney), Ke Wu (University of Michigan) and Elisaweta Masserova
  (Carnegie Mellon University); affiliated with FC (IFCA)
organizer_country: [europe, usa, australia]
