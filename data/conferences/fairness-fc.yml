notes:
- Half-day or one-day workshop co-located with Financial Cryptography and Data Security (FC); 1st edition at FC 2025, 2nd at FC 2026
- Topics are fairness in blockchains and distributed applications, such as rational cryptography, fairness in MPC,
  timed and threshold cryptography, fair randomness, MEV, fair rewards in consensus and fair payments
- Program of invited talks plus a panel discussion; there is no call for papers, and the 2026 site invites people to
  contact the organizers to propose a talk
- Held at the FC venue, which rotates worldwide (2025 Miyakojima, Japan; 2026 St. Kitts)
- Not in the FC 2027 (Barbados) list of affiliated workshops as of 2026-10-31
