notes:
- ACM SIGCSE conference on computing education, the newest of its four conferences
- Held every other year outside North America and Europe (Chengdu 2019, Hyderabad 2023, Gaborone 2025, Sao Paulo 2027)
- Papers in the ACM Digital Library; fully dual-anonymous review with an expected acceptance rate of 25 to 35% (2025 call)
- Full papers up to six pages plus one page of references; mandatory abstract one week before the paper deadline
- Paper categories are computing education research, experience reports and tools, and curriculum and position papers; a phased paper track was piloted in 2025
- Also has working groups, panels, posters and a doctoral consortium; in person only, at least one author must present
- Not listed in the CORE portal (ICORE2026)
