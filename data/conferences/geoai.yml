notes:
- One-day workshop co-located with ACM SIGSPATIAL, first held in 2017; 9th edition in 2026; the website is hosted by Oak Ridge National Laboratory
- Topics are geospatial AI, foundation models for Earth data, GeoAI for remote sensing, mobility and urban analytics
- SIGSPATIAL workshop proceedings are published in the ACM Digital Library
- Full papers 8-10 pages plus up to 2 appendix pages, short or industry demo papers 4 pages, vision papers 2 pages; includes a paper competition
- Follows SIGSPATIAL (Seattle 2022, Hamburg 2023, Atlanta 2024, Minneapolis 2025, Riverside 2026)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
