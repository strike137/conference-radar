notes:
- Flagship symposium of the IEEE Geoscience and Remote Sensing Society; 46th edition in 2026, 47th in 2027
- Very large meeting; IGARSS 2026 reported nearly 2,600 submissions
- Three submission options; full papers (4 pages plus references, IEEE two-column) go to IEEE Xplore, 400 to 600 word abstracts are presented but not published, and recently published Q1 journal articles can also be presented
- Topics cover remote sensing of land, atmosphere, oceans and cryosphere, data processing, electromagnetics, sensors and platforms
- Rotates worldwide (Brussels 2021 online, Kuala Lumpur 2022, Pasadena 2023, Athens 2024, Brisbane 2025, Washington DC 2026, Reykjavik 2027)
- Remote sensing venue outside the usual CS rankings; CORE C in ICORE2026, not on the CCF list
