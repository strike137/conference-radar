notes:
- Long-running workshop on OCL (Object Constraint Language) and other textual modeling languages such as textual MOF, Epsilon and Alloy, running since 2000
- Co-located with MODELS in most years (2022 Montreal, 2023 Vasteras, 2026 Malaga) and with STAF in some (2021 virtual, 2025 Koblenz)
- No edition in 2024; the 2020 edition was canceled due to COVID-19
- Accepted papers of the 2026 edition go into the joint MODELS workshop proceedings published by ACM; the 2025 edition at STAF published in CEUR-WS
- Full papers 7 to 10 pages, extended abstracts 5 pages, plus presentation-only 1-page abstracts that are not included in the proceedings; ACM format in 2026
- Minimum 2 reviews per paper, usually 3
- Not listed in the CORE portal (ICORE2026)
