notes:
- Venue for formal verification and certification, proof assistants, mechanized mathematics and certified software
- Sponsored by ACM SIGPLAN in cooperation with ACM SIGLOG; co-located with POPL every January
- Proceedings in the ACM Digital Library (also on SIGPLAN OpenTOC); Gold Open Access since 2026
- Up to 12 pages in ACM SIGPLAN acmart format, excluding bibliography and appendices
- Lightweight double-blind review; abstract deadline one week before the paper deadline, no extensions
- About 10% of accepted papers receive Distinguished Paper Awards
- At least one author of each accepted paper must attend and present
- Recent hosts are Boston (2023), London (2024), Denver (2025), Rennes (2026) and Mexico City (2027)
- CORE B (ICORE2026); not in the CCF 2026 list
