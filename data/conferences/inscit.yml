notes:
- Brazilian symposium on instrumentation and measurement (sensors and transducers, measurement systems, circuit testing, data converters, energy harvesting, biomedical instrumentation)
- Held each year in Brazil as part of the Chip in ... umbrella event with SBMicro, SBCCI, WCAS and SForum (Chip in Sampa at the University of Sao Paulo, 24 to 28 August 2026; INSCIT sessions on 26 to 28 August; 10th edition)
- Papers presented at the symposium are considered for submission to IEEE Xplore; no-show papers are excluded from the proceedings
- Full papers of 4 to 6 pages, IEEE two-column format; review via Microsoft CMT; in-person presentation required
- Best Student Paper Award for papers authored and presented by students
- Not ranked in CORE ICORE2026
