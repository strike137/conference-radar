notes:
- Annual medical robotics symposium of the Hamlyn Centre at Imperial College London, held since 2007; usually in London in June
- Papers are 2 pages, peer reviewed by the Hamlyn Symposium Programme Committee, submitted via EasyChair
- Accepted papers appear in the Hamlyn Symposium proceedings published by the Hamlyn Centre, with a DOI per paper
- Accepted papers are presented as a talk or a poster with a 90-second teaser
- Strong clinical audience (surgeons and engineers), about 500 delegates; includes workshops and the Surgical Robot Challenge
- 2027 is a one-off Hamlyn-MRC Joint Symposium in Hong Kong with the Multi-Scale Medical Robotics Center (CUHK), right after ICRA 2027 in Seoul; returns to London in 2028
- Not listed in CORE ICORE2026 or the CCF 2026 list
