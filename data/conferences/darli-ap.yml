notes:
- Workshop on data analytics for real-life applications (IoT, smart cities, health care), held with EDBT/ICDT
- Chaired by Tania Cerquitelli and Silvia Chiusano (Politecnico di Torino) and Genoveva Vargas-Solar (CNRS, LIRIS)
- Papers appear in the joint EDBT/ICDT Workshops volume of CEUR-WS (2026 Vol-4192, 2025 Vol-3946, 2024 Vol-3651)
- Research papers up to 8 pages, application and industrial papers up to 6 pages, CEUR double column format, EasyChair
- 10th edition in 2026 (Tampere), 11th in 2027 (Lille)
- Not ranked in ICORE2026 and not on the CCF 2026 list
