notes:
- National symposium of the Swedish Society for Automated Image Analysis (SSBA), the Swedish member of IAPR
- Held jointly with the Swedish Symposium on Deep Learning (SSDL); host university in Sweden changes every year
- 2027 edition organized by the Computer Vision and Medical Image Analysis Group at Chalmers University of Technology
- SSBA takes short papers up to 6 pages (mostly oral); SSDL takes 2-3 page extended abstracts (mostly posters); submission by email
- Non-archival; contributions are not made openly available online, and work submitted or published elsewhere is welcome
- "Registration fee 2026: 2600 SEK regular, 3200 SEK late (excluding VAT)"
- Includes a PhD student day, industry session and the SSBA annual meeting
- Not listed in ICORE2026 or the CCF list
