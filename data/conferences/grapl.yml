notes:
- Co-located with IEEE IPDPS; formed in 2019 from the GABB (2014 to 2018) and GraML (2017 to 2018) workshops
- 'Topics: graph analytics and graph learning (GNNs, knowledge graphs), graph programming models such as GraphBLAS,
  graph databases, and hardware for large graphs'
- Long papers up to 10 pages, short papers up to 4 pages, IEEE double-column format including references
- Submission through the IPDPS Linklings site; IPDPS workshop proceedings go to IEEE Xplore
- Program includes keynotes and a community debate panel
- Location follows IPDPS (St. Petersburg 2023, San Francisco 2024, Milan 2025, New Orleans 2026)
