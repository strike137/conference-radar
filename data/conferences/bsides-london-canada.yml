- 2026 edition at the Landon Branch of London Public Library; 2027 edition at the Schmeichel Building, Western University
- Talks are 25 or 55 minutes including Q&A, at most two presenters and two submissions per person
- Registered Canadian not-for-profit; no proceedings
- Not listed in the CORE ICORE2026 portal or on the CCF list
