id: iscsic
name: ISCSIC
full_name: International Symposium on Computer Science and Intelligent Control
type: conference
tier: minor
areas: [ai, vision, systems]
region: china
language: english
frequency: annual
organizer: Organized by Chinese universities (Huazhong University of Science and Technology and China University of Geosciences in 2027)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI Compendex, Scopus]
fee: Full paper authors 500 USD early / 550 USD regular / 600 USD on site, students 450 / 500 / 550 USD; abstract presenters 400 / 450 / 500 USD (students 350 / 400 / 450 USD); listeners 250 USD (2027)
typical:
  deadline_months: [3]
  conference_months: [9]
links:
  website: https://www.iscsic.org/
notes:
- Smaller commercially run conference (secretariat with a Chengdu phone number, site hosted on forwardacademy.org.cn)
- Topics mix computer science (vision, AI, security, networks) with control engineering (unmanned systems, cyber-physical systems, robotics)
- Held in Europe 2017 to 2019 (Budapest, Stockholm, Amsterdam), online 2020 to 2022, in China since 2023 (Nanjing, Zhengzhou, Hangzhou, Nanjing, Wuhan)
- Proceedings in IEEE Xplore (2017, 2021 to 2025) and the ACM DL (2018 to 2020), stated as indexed by EI Compendex and Scopus
- Full papers reviewed on a rolling basis; abstract-only presentation without publication is also offered
- Not listed in ICORE2026 or the CCF 2026 list
