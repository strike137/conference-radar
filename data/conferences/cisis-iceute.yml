notes:
- Spanish-run conference on computational intelligence and machine learning for information security, 19th edition in 2026
- Not the same as the Barolli CISIS (Complex, Intelligent and Software Intensive Systems), which is a separate entry
- Held as a joint event with HAIS, SOCO and ICEUTE, plus Startup OLE
- Proceedings in Springer CCIS since 2025 (Springer LNNS 2022 to 2024, AISC before that)
- Papers up to 12 pages in Springer format, at least two reviews per paper; general track and special sessions
- Selected papers invited to journal special issues
- 'CORE rank National: Spain (ICORE2026); not on the CCF list'
- Always in Spain (Burgos 2020, Bilbao 2021, Salamanca 2022 to 2025, Marbella 2026)
- Deadlines are usually extended
