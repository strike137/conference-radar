notes:
- Non-profit, volunteer-run Dutch hacker weekend organized by Stichting Connected Freedom (Amersfoort)
- Held in a hotel in the Netherlands every February; attendees book a hotel room package that includes the program and meals
- Talks, workshops and quizzes on pentesting, hardware hacking, cryptography, ransomware and maker topics, plus a CTF
- Call for participation through pretalx; talks preferably in English, Dutch accepted; talks are recorded and classified with the Traffic Light Protocol
- No proceedings; videos are published afterwards
- No edition in 2026 because of renovations at the former venue (Hotel De Werelt, Garderen); 2027 moves to Hotel Zuiderduin, Egmond aan Zee
- Tickets usually sell out quickly; 2027 prices from 452 euro (single room, two nights)
