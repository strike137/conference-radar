notes:
- Symposium on testing, diagnosis and design of microelectronic systems, also covering hardware security, IoT, automotive and AI
- Held since 2003; general chairs Vladimir Hahanov and Yervant Zorian
- Sponsored by IEEE, IEEE Computer Society and the IEEE Test Technology Technical Council (TTTC)
- Final papers of 4+ pages in IEEE Computer Society proceedings format; proceedings published by IEEE (Xplore)
- 2026 edition hybrid in Yerevan, Armenia (Yerevan State University); 2025 edition was online (UTC+4)
- "Registration 2026 (online, early): 200 USD IEEE member, 240 USD non-member, 140 USD student member"
- Not listed in the CORE ICORE2026 portal
