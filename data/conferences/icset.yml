id: icset
name: ICSET
full_name: International Conference on System Engineering and Technology
type: conference
tier: minor
areas: [general, systems, ai]
region: southeast-asia
language: english
frequency: annual
organizer: Institut Teknologi Bandung (ITB) and Universiti Teknologi MARA (UiTM)
organizer_country: [indonesia, malaysia]
proceedings: IEEE Xplore
archival: true
fee: 200 USD IEEE member, 225 USD non-member (2026, onsite regular); virtual and student 125 / 150 USD
typical:
  deadline_months: [6, 7]
  conference_months: [11]
links:
  website: https://icset2026.org/
notes:
- Annual series run jointly by ITB (Bandung, Indonesia) and UiTM (Malaysia); 2026 is the 16th edition
- Supported by the IEEE Indonesia Section and the IEEE CAS Society Indonesia Chapter; accepted papers are submitted to
  IEEE Xplore (PDF eXpress conference ID 72218X)
- Broad scope covering control, computer engineering, signal and image processing, robotics, AI, power and biomedical
  engineering
- Full papers of 4 to 6 pages in IEEE format, blind review by 2 to 3 reviewers, submission via EasyChair
- Deadlines get extended (2026 submission moved from June 8 in the CFP poster to July 9)
- 2026 edition is hybrid at the ITB campus in Bandung; papers with no-show authors are not sent to IEEE Xplore
