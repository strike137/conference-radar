notes:
- Workshop on multimedia and multimodal content analysis in sports (tracking, activity recognition, 3D
  reconstruction, performance and injury analysis, sports datasets)
- Co-located with ACM Multimedia every year since 2018, so it moves with the host (2022 Lisbon, 2023 Ottawa, 2024
  Melbourne, 2025 Dublin, 2026 Rio de Janeiro)
- Accepted papers are published in the ACM Digital Library
- Papers of 6 to 8 pages plus up to two pages of references in the ACM Multimedia format; no long/short distinction
- Submission through OpenReview; double-blind preferred but not enforced
- Runs sports vision challenges alongside the paper track
- Organized by Rainer Lienhart (Augsburg), Thomas B. Moeslund (Aalborg) and Hideo Saito (Keio)
