notes:
- Volunteer-run Security BSides conference in Newcastle upon Tyne, UK, for the North East security community
- 2025 edition on 27 September 2025 at North East Futures UTC with over 250 attendees, 3 tracks, workshops and a CTF
- 2026 edition is a smaller one-day event at the Star and Shadow Community Cinema, with community micro sponsorships instead of sponsor tiers
- CFP on Sessionize with standard talks (30 to 45 min), rookie talks with mentoring (15 to 30 min) and lightning talks (15 min)
- No sales pitches; travel and expenses are not covered for speakers
- Talks are recorded for YouTube, no proceedings
