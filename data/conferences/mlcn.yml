notes:
- MICCAI satellite workshop on machine learning for clinical neuroimaging, held every year since 2018
- Two tracks, Machine Learning (methods) and Clinical Neuroimaging (applied)
- Accepted papers are published in Springer LNCS jointly with the MICCAI satellite event proceedings
- Papers up to 8 pages plus 2 pages of references in LNCS format, double-blind review on OpenReview
- Organizers from the USA, Germany, Canada and Israel (Yale, UT Health San Antonio, Max Planck, UPenn, Jena, Concordia,
  Haifa)
- Location follows MICCAI (Strasbourg 2026, Auckland 2027)
- Not listed in CORE ICORE2026 or the CCF 2026 list
