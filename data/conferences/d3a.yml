notes:
- Annual national meetup of the Danish computer science, data science and AI research community at Hotel Nyborg Strand, Nyborg, Denmark
- Hosted jointly by the Pioneer Centre for AI (P1), the Danish Data Science Academy (DDSA) and Digital Research Centre Denmark (DIREC)
- Programme built from peer-reviewed session proposals (workshops, panels, seminars, hackathons) submitted via CMT, plus keynotes and a poster session with jury and audience awards
- No paper proceedings; non-archival
- More than 500 participants at D3A 4.0 (74 posters); PhD and postdoc community day the day before
- First edition February 2024, then October 2024, August 2025 and October 2026
