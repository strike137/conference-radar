id: immercom
name: ImmerCom
full_name: ACM Workshop on Mobile Immersive Computing, Networking, and Systems
type: workshop
tier: minor
areas: [networking, systems]
region: worldwide
language: english
frequency: annual
organizer: ImmerCom steering committee (chair Bo Han, George Mason University), co-located with ACM MobiCom
organizer_country: [usa]
proceedings: ACM DL
archival: true
typical:
  deadline_months: [6, 7, 8]
  conference_months: [10, 11]
links:
  website: https://immercom.github.io/
notes:
- One-day workshop on AR, VR and XR systems and networking, held with ACM MobiCom every year since 2023 (2026 is
  the 4th edition)
- Papers published in the ACM Digital Library as part of the ACM MobiCom proceedings
- Papers up to 6 pages in two-column 10pt ACM format plus references and appendices; single-blind review via HotCRP
- Location follows MobiCom (2023 Madrid, 2024 Washington D.C., 2025 Hong Kong, 2026 Austin)
- Deadlines are usually extended by a few weeks
- Not listed in ICORE2026 or the CCF 2026 list
