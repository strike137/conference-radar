frequency: annual
organizer: PACMI workshop chairs, co-located with ACM SOSP
proceedings: ACM DL (optional, for papers that opt in)
archival: true
typical:
  deadline_months: [7]
  conference_months: [9, 10, 11]
links:
  website: https://sites.google.com/view/pacmi/home
notes:
- One-day workshop on the practical obstacles to deploying classic ML, generative AI and agents in computer systems
  (reliability, rollout, verification, safety, debuggability)
- Co-located with SOSP since 2024 (Austin 2024, Seoul 2025, Prague 2026); 2022 edition was co-located with MLSys in
  Santa Clara
- Position papers and short papers up to 4 pages, abstracts of published work up to 2 pages (references excluded);
  single-blind review
- Accepted papers may be included in ACM proceedings; acceptance does not preclude later publication at a major
  conference
- 2024 and 2025 proceedings published in the ACM DL (3rd and 4th Workshop on Practical Adoption Challenges of ML for
  Systems)
- 2026 program co-chairs from Google and Columbia University
- Not found in the ICORE2026 CORE portal search and not on the CCF 2026 list
