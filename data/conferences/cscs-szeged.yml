notes:
- Forum for PhD students in all areas of computer science, run by the Institute of Informatics, University of Szeged, Hungary
- Held every two years since 1998 (2016, 2018, 2020, 2022, 2024, 2026); 2026 edition in Szeged
- Short papers of at most 4 pages, reviewed before acceptance; the short paper volume is available at the conference and as a PDF on the website
- Selected papers are invited as full papers to a special issue of Acta Cybernetica (indexed by Scopus and DBLP)
- "Registration fee 2026: 50,000 HUF (140 EUR), or 60,000 HUF (170 EUR) with two nights in a dormitory"
- Held in parallel with the Conference of PhD Students in Mathematics
- Not listed in the ICORE2026 CORE ranking
