notes:
- Volunteer-driven non-profit practitioner security summit, brought to you by LinuxFests and Pacific Hackers
- Co-located with SCaLE (Southern California Linux Expo) at the Pasadena Convention Center, Pasadena, California
- Two days of practitioner talks and hands-on workshops on AppSec, infrastructure, cloud, corporate security and AI agents
- Talks and workshops selected through an open CFP on pretalx; no papers or proceedings
- Registration goes through SCaLE; the 2026 full access pass was 100 USD and also covered SCaLE sessions
- Held since 2025; about 250 attendees reported for 2026
