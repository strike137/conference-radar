notes:
- Workshop co-located with ISCA every year since 2020, on systems and architecture for foundation models and ML for architecture and systems
- 2026 added a track on agentic approaches for architecture and systems
- Short papers, position pieces and early-stage work up to about 4 pages excluding references, double-blind, via OpenReview
- Accepted papers and their reviews are made public on OpenReview; submissions with parts of ongoing work intended for a future conference are welcome
- Recent locations follow ISCA (Orlando 2023, Buenos Aires 2024, Tokyo 2025, Raleigh 2026)
- Not listed in CORE ICORE2026 and not on the CCF list
