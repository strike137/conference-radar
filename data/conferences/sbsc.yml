notes:
- Brazilian symposium on collaborative systems and CSCW, run by the Brazilian Computer Society (SBC); 21st edition in 2026
- Proceedings (Anais) published in the SBC OpenLib (SOL) digital library with DOIs under 10.5753/sbsc
- Research track papers up to 12 pages (excluding acknowledgements and references), in Portuguese or English, with
  double-anonymous review; one author must register and present in person
- Tracks for research papers, innovative ideas and emerging results, extension, collaboration in practice, research
  design, a thesis contest, a student marathon (MaratonaColab) and international papers
- Held in a different Brazilian city each year (Manaus 2025, Porto Alegre 2026)
- Not listed in the CORE ICORE2026 portal
