notes:
- Workshop on real-time operating systems (RTOS design, resource management, timing, OS support for embedded platforms), held with ECRTS since 2005; 20th edition in 2026
- Held on the workshop day of ECRTS in Europe in July (Lund 2026)
- Formats include full technical papers (up to 6 pages), short papers (up to 3 pages), open problem talks, demos and tutorials, calls to action and experiment reports
- All proposals and papers are reviewed by the program committee; accepted papers appear in an informal proceedings PDF distributed online and at the workshop
- The 2026 CFP also offers an optional DOI-based publication track for accepted papers
- Full-day workshop with an industry keynote (QNX lead architect in 2026); 7 contributions accepted in 2026
- Not listed in CORE ICORE2026 or the CCF 2026 list
