notes:
  - Biennial Brazilian conference on industry applications, first held in 1992; 16th edition in 2025
  - Sponsored by IEEE, the IEEE Brazil South Section and the South Section Chapter of IEEE IAS
  - Covers Industry 4.0, robotics, automation and process control, power systems, electrical machines and drives, power electronics, smart grids, EVs and renewables
  - Always held in Brazil (Sao Paulo state recently; 2027 in Ouro Preto, Minas Gerais); recent editions hybrid
  - Full papers up to 8 pages and 1-2 page short papers, both published in IEEE Xplore
  - Papers accepted in English, Portuguese and Spanish (2023 edition); submissions through PaperCept
  - Selected 2023 papers were invited for submission to IEEE Transactions on Industry Applications and a magazine
  - Not listed in ICORE2026 or the CCF list
