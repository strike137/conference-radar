id: adiot
name: ADIoT
full_name: International Conference on Attacks and Defenses for Internet-of-Things (ADIoT)
type: conference
tier: minor
areas: [security, networking]
region: china
language: english
frequency: annual
organizer: Rotating Chinese host with Lancaster University and SPTAGE Lab (2025 Jiangsu University of Technology, 2026
  Zhejiang Gongshang University)
organizer_country: [china, europe]
proceedings: Springer LNCS
archival: true
indexing: [Springer LNCS, DBLP]
rank:
  core: Unranked
fee: 4300 CNY (600 USD) author, 1400 CNY (200 USD) participant (2025)
typical:
  deadline_months: [7, 9, 10]
  conference_months: [9, 11, 12]
links:
  website: https://adiot.sptagelab.org/2026/
  dblp: https://dblp.org/db/conf/adiot/
  wikicfp: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=189488
notes:
- Began as a workshop (IEEE CNS 2018 in Beijing, then ESORICS workshops in Europe 2019 to 2023, e.g. Copenhagen
  2022); standalone conference held in China since 2024 (Hangzhou 2024, Changzhou 2025, Hangzhou 2026)
- Proceedings in Springer LNCS; full papers up to 20 pages, short papers up to 14 pages (12 in 2024), at least three
  reviews
- Hybrid; online presentation allowed
- Deadlines are extended repeatedly and the website dates are often stale, so check the latest CFP
