notes:
- One-day workshop affiliated with Asiacrypt 2026 at Hong Kong Polytechnic University; 2026 is the first edition
- Organized by Xianhui Lu and Ruida Wang (IIE CAS); invited speakers mostly from Chinese universities
- Topics are design, cryptanalysis, hardware acceleration and standardization of post-quantum cryptography and FHE
  (BGV, BFV, CKKS, TFHE)
- Talk-based format; submissions are PDF abstracts of up to 3 pages, and talks may be based on published work or work
  in progress
- Submissions are sent by email to the organizers; two submission rounds in 2026
- Not listed in ICORE2026
