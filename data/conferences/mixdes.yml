notes:
- Central European forum on design, modeling, simulation, testing and manufacturing in micro and nanoelectronics,
  semiconductors, sensors, actuators and power devices
- Organized by the Department of Microelectronics and Computer Science, Lodz University of Technology; the series
  started in 1994 near Warsaw and is held each year in a different Polish city (2025 Szczecin, 2026 Poznan)
- Papers submitted to IEEE Xplore; only presented papers go into the proceedings
- Each paper reviewed by at least two reviewers
- Authors invited to extend papers for a special issue of the MDPI journal Electronics
