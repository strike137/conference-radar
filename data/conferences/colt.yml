notes:
- Leading venue for the theory of machine learning, held annually since 1988 (formerly the Conference on Computational
  Learning Theory)
- Run by the Association for Computational Learning, whose board picks locations and program chairs
- Proceedings in PMLR; authors may opt out in favor of a 1-page extended abstract pointing to an archival full version
- Double-blind review with a rebuttal phase; main body limited to 12 PMLR pages excluding references and appendices
- At least one author per accepted paper must attend in person
- 'Location rotates: London 2022, Bangalore 2023, Edmonton 2024, Lyon 2025, San Diego 2026, Tokyo 2027'
- CORE A* but only CCF B
