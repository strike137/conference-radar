links:
  website: https://www.imf-conference.org/
notes:
- Conference of the SIDAR special interest group of the German Informatics Society (GI), running since 2003
- Focus on IT security incident response and management and digital forensics, including legal aspects
- Accepted papers are published as an open access special issue of the ACM DTRAP journal (Digital Threats, Research and Practice)
- ACM open access fees apply to authors from 2026
- Full papers up to 20 pages, short papers up to 10 pages; anonymized submissions
- Also accepts practitioner presentations, panels and posters
- Held in Germany every year (Munich 2023, Saarbruecken 2024, Albstadt 2025, Bonn 2026)
- Limited student scholarships (fee waiver and two hotel nights) for students presenting a paper
- Sister conference of DIMVA within GI SIDAR
