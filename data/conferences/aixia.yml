notes:
- Main conference of the Italian AI society AIxIA (founded 1988); always held in Italy (Rome 2023, Perugia 2026)
- Main track, discussion track, doctoral consortium and many co-located workshops by the AIxIA working groups
- Attendance requires an active AIxIA membership in addition to the registration fee
- 2026 proceedings published as Springer LNAI (AIxIA 2026, Advances in Artificial Intelligence)
- 24th edition in 2026 after the 22nd in 2023
