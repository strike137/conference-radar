id: iciccnt
name: icICCNT
full_name: International Conference on Intelligent Computing, Communication and Network Technology
type: conference
tier: minor
areas: [networking, communications, ai]
region: europe
language: english
frequency: annual
organizer: icICCNT conference secretariat (zmeeting submission system), with UPEC and Paris 8 University listed as organizers and University of Haute-Alsace and KIT as technical supporters
proceedings: Springer LNDECT (Lecture Notes on Data Engineering and Communications Technologies), post-proceedings (2023 and 2024)
archival: true
indexing: [EI, Scopus]
typical:
  deadline_months: [7]
  conference_months: [9]
links:
  website: https://www.iccnt.org/
notes:
- Called International Conference on Communication and Network Technology (ICCNT) until 2025; renamed icICCNT in 2026 (10th edition)
- Zurich 2017, Stockholm 2018, Amsterdam 2019, virtual 2020 and 2021, hybrid Paris 2022, Madrid 2023, Florence 2024, Amsterdam 2025, Paris 2026
- Papers of the 2023 and 2024 editions published in Springer LNDECT as post-proceedings; 2022 papers went to the Journal of Communications
- The 2026 site only says proceedings are submitted to EI Compendex and Scopus, without naming the publisher
- Extended papers can be recommended to a special issue of the Journal of Communications
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
