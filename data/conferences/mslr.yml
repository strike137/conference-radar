notes:
- Workshop on multimodal sign language recognition and translation, including radar and other privacy-preserving sensing
- 1st edition at ICCV 2025, 2nd at CVPR 2026 in Denver
- Runs the SignEval challenge alongside the paper track (isolated LIS and continuous sign language recognition)
- Double-blind review, CVPR format, accepted papers in the CVPR Workshops proceedings
- Distinct from SLRTP (Sign Language Recognition, Translation and Production workshop)
- Not listed in ICORE2026 or the CCF list
