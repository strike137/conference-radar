notes:
- Large annual SPIE symposium on medical imaging, held in February
- Several parallel conferences, including Image Processing, Computer-Aided Diagnosis, Physics of Medical Imaging, Imaging Informatics, and Digital and Computational Pathology
- Held in Vancouver, BC, Canada in 2026 and 2027
- Papers and presentations are published in the SPIE Digital Library (Proceedings of SPIE)
- Submission is a 200-300 word abstract plus a required supplemental file for review; accepted papers need a manuscript of at least 4 pages about 3 weeks before the event
- Not listed in ICORE2026 or the CCF list
