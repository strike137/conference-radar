notes:
- One-day ICSE workshop on testing deep learning and reinforcement learning systems and on using deep learning for software testing
- Held with ICSE since 2019 (no 2022 edition); Melbourne 2023, Lisbon 2024, Ottawa 2025, Rio de Janeiro 2026
- Full papers up to 8 pages, short papers up to 4 pages, extended abstracts up to 5 pages (all including references), ACM format, double-blind
- 2026 also ran a tool competition with its own deadlines
- Proceedings published by IEEE CS as "IEEE/ACM International Workshop on Deep Learning for Testing and Testing for Deep Learning (DeepTest)", in IEEE Xplore
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
