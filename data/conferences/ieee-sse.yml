notes:
- One of six theme conferences of the IEEE World Congress on SERVICES (with CLOUD, EDGE, ICDH, ICWS and QSW), sponsored
  by IEEE and the IEEE Computer Society and supported by the IEEE Technical Community on Services Computing
- Replaced the IEEE International Conference on Services Computing (SCC) in 2023; first held in Chicago in 2023
- CORE B (ICORE2026, listed as the successor of SCC) and CCF C (software engineering list)
- 'Rotates worldwide with the congress: Chicago (2023), Shenzhen (2024), Helsinki (2025), Sydney (2026)'
- Regular papers 7 to 10 pages, short papers 4 to 6 pages, references extra; IEEE two-column format
- Shares one submission deadline with the other SERVICES conferences except ICDH; the 2026 deadline was extended by two weeks
- Expensive registration; one full-rate author registration per paper
