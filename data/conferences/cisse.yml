notes:
- Describes itself as the longest-running cybersecurity education conference in the US; audience is mainly university
  and community college faculty and institutions designated as National Centers of Academic Excellence in Cybersecurity
  (CAE)
- Accepted papers are published open access in JCISSE (CC BY 4.0) with Crossref DOIs; 24 papers were accepted from
  the 28th Colloquium (2024) into JCISSE Vol. 12
- Double-blind review; papers of 3,000 to 4,000 words in IEEE template; at least one author must present in person;
  also takes panels, posters, workshops and course walk-throughs
- 30th Colloquium was planned for Oct 26-28, 2026 in Indianapolis but was moved to mid-2027; papers submitted by
  2026-09-15 stay in review, venue and dates TBA
- Held every June until 2019, online 2020-2022, then every November at US universities (2023-2025); 2025 edition
  held jointly with CCERP
