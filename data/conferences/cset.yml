notes:
- Long-running workshop (first held 2008, 19th edition in 2026) on the science of security experiments, testbeds, datasets,
  measurement, reproducibility, ethics and security education
- Website hosted by USC/ISI; since 2025 sponsored by and held the day before ACSAC (2025 Honolulu, 2026 Los Angeles)
- Proceedings published through IEEE Computer Society (2025 and 2026); IEEE conference template, compsoc format
- Short papers up to 4 pages and long papers up to 8 pages, excluding references and appendices
- Research, position, experience, preliminary work and extended work papers; extended versions of previously published
  work are welcome
- Double-blind review; artifact sharing strongly encouraged; at least one author must register and present
- Held in the USA or Canada every year except 2020 to 2022, which were virtual
- Not listed in ICORE2026
