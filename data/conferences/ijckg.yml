region: asia-pacific
language: english
frequency: annual
organizer: IJCKG Steering Committee; 2026 hosted by NECTEC and AIAT (Artificial Intelligence Association of Thailand)
proceedings: Springer LNCS/LNAI
indexing: [Scopus, DBLP]
rank:
  core: Unranked
fee: USD 400 presenting non-member / USD 350 AIAT or JSAI member / USD 225 student non-member, early (2026)
typical:
  deadline_months: [6, 7]
  conference_months: [10, 11, 12]
links:
  website: https://ijckg2026.aiat.or.th/
  dblp: https://dblp.org/db/conf/jist/
notes:
- Asian knowledge graph conference that evolved from JIST (Joint International Semantic Technology Conference)
- Mostly held in Asia (Bangkok 2021 online, Tokyo 2023, Bangkok 2026); 2025 edition in Crete was the first in Europe
- Full papers in Springer LNAI; posters, demos and workshops in CEUR-WS
- Single-blind review (2025); research deadlines were extended by several weeks in both 2025 and 2026
- JSAI members get the member registration rate
