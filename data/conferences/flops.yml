notes:
- Sponsored by JSSST SIG-PPL; 2024 edition in cooperation with ACM SIGPLAN
- Biennial in even years since 2004, always held in Japan (Kochi 2016, Nagoya 2018, Akita 2020 online, Kyoto 2022
  online, Kumamoto 2024, Tsukuba 2026)
- Proceedings in Springer LNCS (LNCS 14659 for 2024, LNCS 16533 for 2026); the 2026 CFP said selected
  papers would be invited to a Science of Computer Programming special issue
- 2026 proceedings contain 14 papers selected from 25 submissions (Springer volume front page)
- Covers declarative programming (functional, logic, functional-logic), rewriting, program transformation and
  verification; accepts regular papers, system descriptions and declarative pearls
- Up to 15 pages excluding references in Springer format; single-blind review; abstract deadline about a week before
  the paper deadline
- At least one author must present in person; no general online presentation option
- 'ICORE2026 lists it as National: Japan'
