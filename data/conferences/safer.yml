organizer: SBA Research (co-located workshop of ARES)
organizer_country: [europe]
proceedings: Springer LNCS
archival: true
typical:
  deadline_months: [5]
  conference_months: [8]
links:
  website: https://www.ares-conference.eu/safer
notes:
- Held as a workshop of ARES (International Conference on Availability, Reliability and Security) in Europe every August;
  first held at ARES 2025 in Ghent
- ARES papers including workshop papers are published in Springer LNCS since 2025; submission guidelines are the
  same as for the ARES conference
- Security and its ESG side (environment, socio-economic, governance), green IT, fairness, usable security,
  privacy, compliance, disinformation, cyber insurance
- 2026 chairs from CNR-IMATI and University of Cagliari (Italy) and IRIT, University of Toulouse (France); supported
  by the Horizon Europe DUCA project
- Small workshop; 2025 edition was a single 90 minute session with 4 papers
- Not listed in CORE ICORE2026
