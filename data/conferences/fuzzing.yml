notes:
- Workshop dedicated to fuzzing and automated bug finding; started in 2022, 5th edition in 2026
- 'Host conference alternates: NDSS 2022 (San Diego), ISSTA 2023 (Seattle), ISSTA 2024 (Vienna), ISSTA 2025 (Trondheim),
  NDSS 2026 (San Diego)'
- Main track is registered reports (Stage 1); accepted reports are invited as ACM TOSEM Registered Papers, where the
  full evaluation is reviewed in Stage 2 with artifact evaluation
- Also a short paper track (Fuzzing Nuggets) for position papers and experience reports, up to 4 pages
- 2026 papers published in the NDSS workshop proceedings (Internet Society); registered reports go in only if the authors
  choose; 2025 papers went to the ISSTA'25 workshop proceedings
- Double-anonymous review; registered reports up to 8 pages excluding references (NDSS template, 2026)
- Not listed in ICORE2026 or the CCF list
- 2027 edition not announced yet ("stay tuned" on the workshop site); NDSS 2027 is in Seoul, Korea (March 22 to 26, 2027)
