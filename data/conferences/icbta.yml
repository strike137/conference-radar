notes:
- Smaller commercially organized blockchain conference, held every December since 2018; 2026 is the 9th edition
- Proceedings in Springer Lecture Notes in Networks and Systems since 2025 (LNNS vol. 1920); ACM ICPS for 2018 to 2024
- Held in Xi'an, China (2018, 2019, 2023, 2024), online (2020 to 2022), Kanazawa, Japan (2025) and Seoul, Korea (2026)
- Abstract-only submission (not published) and delegate registration are also offered
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
