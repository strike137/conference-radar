id: fedkdd
name: FedKDD/FedMAS
full_name: International Joint Workshop on Federated Learning for Multi-agent Systems and Data Mining
type: workshop
tier: minor
areas: [ai, data]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizers co-located with ACM SIGKDD (2026 general chair Haozhao Wang, Huazhong University of
  Science and Technology)
organizer_country: [international]
proceedings: None (non-archival; papers on OpenReview)
archival: false
typical:
  deadline_months: [5]
  conference_months: [8]
links:
  website: https://fedmas-fedkdd.github.io/fedmas-fedkdd2026/
notes:
- Half-day workshop co-located with ACM SIGKDD; follows FedKDD@KDD 2025 (Toronto)
- Topics are federated learning for multi-agent systems, federated large models, graph analytics and data mining
- Short papers up to 5 pages in the ACM sigconf template, double-blind, at least 2 reviewers, submitted via OpenReview
- Following the KDD 2026 policy, accepted papers are not included in proceedings or any form of publication
- All accepted papers get posters; best paper awards and possible travel awards
- Not listed in the CORE ICORE2026 portal or the CCF list
