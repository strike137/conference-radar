notes:
- Applied AI conference of HES-SO (University of Applied Sciences and Arts Western Switzerland) and the Swiss AI Center
- Aimed mainly at SME leaders in French-speaking Switzerland, with an academic track for researchers and students
- Scientific papers of 4 to 8 pages are peer-reviewed and published in the proceedings; 2026 proceedings in PMLR vol. 309
- Also has industry talks, workshops, posters and demos (not in the proceedings)
- 2027 edition (5th) spread over three cities, Geneva, Yverdon-les-Bains and Fribourg, one day each
- Rebuttal phase with reviewers before notification
- Not listed in ICORE2026 and not on the CCF list
