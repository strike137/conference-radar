notes:
- Hosted by KICS and run by the KICS AI Society; started in 2020 (7th edition in 2026)
- Short 1 to 2 page papers via ManuscriptLink; best paper awards; English paper session for foreign researchers
- Program includes keynotes, tutorials, invited talks by authors of top-tier conference papers, a Ph.D forum and
  an undergraduate paper contest
- Held in Jeju in late September (Sono Calm 2024, KAL Hotel Seogwipo 2025, Sono Calm 2026 in hybrid mode)
