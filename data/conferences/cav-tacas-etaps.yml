notes:
- 'Federation of four conferences from 2027: ESOP, FoSSaCS, iFS (merger of FASE and iFM) and TACAS, plus satellite workshops'
- 'CORE ranks of the member conferences (ICORE2026): TACAS A, ESOP A, FoSSaCS B; ETAPS itself is listed in CCF B'
- CAV is not part of ETAPS; it is a separate conference (CAV 2027 in Amsterdam, July 2027)
- Proceedings in Springer LNCS (ARCoSS subline), gold open access (CC-BY) since 2018
- One joint deadline in October for all conferences (ESOP also has an earlier round in May); deadlines are firm and not extended
- TACAS requires artifact evaluation for tool papers; rebuttal phase for ESOP, FoSSaCS and TACAS
- Held in Europe almost every year (Turin 2026, Copenhagen 2027); Hamilton, Canada in 2025
