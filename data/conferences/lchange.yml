links:
  website: https://www.changeiskey.org/event/2026-eacl-lchange/
notes:
- Workshop on computational modeling of diachronic semantic change and language change in digital text corpora
- Formerly the Workshop on Computational Approaches to Historical Language Change
- Editions at ACL 2019 (Florence), ACL-IJCNLP 2021 (online), ACL 2022 (Dublin), EMNLP 2023 (Singapore), ACL 2024 (Bangkok) and EACL 2026 (Rabat); no edition in 2025
- 6th edition was a half-day hybrid workshop at EACL 2026 in Rabat, Morocco, on March 28, 2026
- Proceedings in the ACL Anthology
- Long papers up to 8 pages and short papers up to 4 pages; double-blind review by at least three reviewers via OpenReview; ARR pre-reviewed papers also accepted
- Has hosted shared tasks on lexical semantic change detection
- Not ranked in ICORE2026 and not on the CCF list
