organizer: Workshop organizers (Nina Tahmasebi, Pierluigi Cassotti, Syrielle Montariol, Andrey Kutuzov and others) from the Change is Key! research programme; co-located with ACL-family conferences
organizer_country: [europe]
proceedings: ACL Anthology
