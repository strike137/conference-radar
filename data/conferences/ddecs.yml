notes:
- Forum on design, test and diagnosis of microelectronic circuits and systems
- Primarily organised by Central European countries; the steering committee has members from Poland, Czechia, Slovakia, Estonia, Germany and others
- Started in 1997 as a workshop series and became a symposium in 2008
- Formal proceedings with ISBN go to IEEE Xplore; an informal digest covers extra content
- Held in a different European city each year, mostly in Central Europe (Tallinn 2023, Kielce 2024, Lyon 2025, Bratislava 2026, Berlin 2027)
- CORE C (ICORE2026)
