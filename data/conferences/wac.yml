notes:
- One-day workshop affiliated with Crypto at UCSB, Santa Barbara; established by Nadia Heninger in 2018
- Editions every year from 2018 to 2024, then WAC8 in 2026 (no 2025 edition is listed)
- Showcases attacks on deployed cryptography, cryptanalysis of new schemes and systems attacks that break cryptography
- Talk proposals (extended abstract, paper or slides) sent by email and selected by the organizers on real-world impact
  and interest
- No proceedings and no papers published, so talks on work published elsewhere are welcome
- Streamed on Zoom and recordings posted on YouTube with speaker consent; no travel funding
- Not listed in ICORE2026 or the CCF 2026 list
