notes:
- Threat-intelligence research conference presented by SentinelOne
- Invite-only, vendor-agnostic event held every September since 2022; the 2026 edition is at the Omni Scottsdale Resort & Spa at Montelucia, Scottsdale, Arizona, USA
- Talks are 20 minutes plus 5 minutes of Q&A; topics include threat hunting, malware analysis, threat actor tracking and exploits
- CFP closes in June and accepted speakers are notified by July; talks are not streamed, recordings may be shared later with speaker approval
- No published proceedings (non-archival)
