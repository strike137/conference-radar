notes:
- Flagship electronic design automation (EDA) venue, now billed as the Chips to Systems Conference; sponsored by ACM and IEEE with ACM SIGDA and IEEE CEDA
- Regarded as a top venue (ICORE2026 A*, CCF A); acceptance rate 20 to 25% in recent years per the CFP
- Always held in the USA, mostly San Francisco (2022 to 2025), Long Beach 2026, San Jose 2027
- Research manuscripts are 6 pages plus 1 page of references, double-blind, two-stage submission (abstract then full paper)
- Publication in IEEE Xplore or the ACM DL requires registration and presenting at the poster session
- Large event with an exhibition, an engineering track, workshops, tutorials and a PhD forum
