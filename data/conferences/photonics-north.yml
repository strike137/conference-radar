notes:
- Canada's annual photonics conference, combining research tracks, plenary and industry keynotes, tutorials and an exhibition
- Always held in Canada, mostly Quebec City, Montreal and Ottawa (2023 Montreal, 2024 Vancouver, 2025 Ottawa, 2026 Quebec City)
- Submissions are abstracts of up to 2 pages reviewed by the track committees; review is not blind
- Accepted abstracts appear in IEEE Xplore if an author registers by the presenting author deadline; IEEE template recommended for Xplore publication
- Nine technical tracks in 2026 covering biophotonics, lasers, nanophotonics, photonic materials, photonics and AI and more
- Up to three abstracts per author; at most two presentations per registration
- Photonics venue outside the usual CS rankings, not listed in ICORE2026
