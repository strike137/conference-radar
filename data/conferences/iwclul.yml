  conference_months: [11, 12]
links:
  website: https://acl-sigur.github.io/
notes:
- Small specialist workshop on NLP for Uralic languages (Finnish, Hungarian, Estonian, Sami, Komi, Udmurt, Erzya and others), many of them low resource or endangered
- Run by ACL SIGUR; held as a self-standing event despite the workshop name
- Recent editions in Munich 2026, Joensuu 2025, Helsinki 2024 and Tokyo 2023 (joint with NLP4DH)
- Long papers up to 8 pages and short papers up to 4 pages, double-blind review on OpenReview
- Papers in the ACL Anthology; 750-word lightning talk abstracts go to a separate lightning proceedings
- No registration or publication fees; remote presentation allowed for a valid reason
- Not listed in the CORE portal (ICORE2026)
