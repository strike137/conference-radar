notes:
- Workshop on machine learning and computer vision for Earth observation, covering data curation, data archiving and representation learning
- Follows a host ML or vision conference; first edition at ICML 2025 (Vancouver), second (TerraBytes II) at ECCV 2026 (Malmo)
- 2025 full-length papers could opt in to a PMLR volume (vol. 292, published December 2025); short papers are non-archival
- 2026 full-length papers could opt in to the ECCV workshop proceedings; short papers are non-archival
- "TerraBytes II: 61 submissions, 23 full papers eligible for the proceedings and 13 non-archival presentations accepted"
- Reviewed on OpenReview by three reviewers per full paper (two for short papers) plus an area chair
- Organizers are mostly European research institutes and agencies (KTH, IGN, CNAM, ESA Phi Lab, Asterisk Labs)
