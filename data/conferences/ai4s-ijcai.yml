notes:
- IFIP TC12 workshop chaired by Eunika Mercier-Laurent (University of Reims, chair of IFIP TC12) and Gulgun Kayakutlu (ITU, chair of WG 12.11)
- Continues AI4KM (IJCAI 2015 to 2019) and AI4KMES (IJCAI 2020 and 2021), then AI4S at ECAI 2023 and IJCAI 2025
- 2025 edition was IJCAI 2025 workshop W14, two full days in Montreal, held alongside the AI4GS workshop
- Selected papers in electronic proceedings, extended papers published by Springer in IFIP AICT
- Full papers up to 7 pages (6 + 1 for references) in Springer LNCS format; extended abstracts also considered
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
