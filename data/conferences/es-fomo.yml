links:
  website: https://es-fomo.com/
notes:
- ICML workshop on training and inference systems and algorithms for foundation models (efficiency in compute, memory, bandwidth, energy)
- Held with ICML in 2023 (Honolulu), 2024 (Vienna) and 2025 (Vancouver); 2025 was the third edition
- Non-archival, the CFP states the workshop will not result in proceedings and papers may be submitted elsewhere
- Recommended length up to 4 pages in the ICML template, double-blind review on OpenReview; engineering and code-focused papers welcome
- Papers already accepted at ICML may also be presented
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
