notes:
- Biennial flagship meeting of the IEEE Israel Section, covering all of electrical engineering
- 2026 edition resumed the series after a hiatus of several years
- Short papers of two pages plus one page of references, peer reviewed by a TPC with 13 subcommittees
- Accepted and presented papers can go to IEEE Xplore; authors may opt out and present only
- Oral and poster sessions, plenary lectures, tutorials and special symposia; also hosts a 3MT student competition
- 2026 held at the Ramada Hotel and Convention Center, Jerusalem
