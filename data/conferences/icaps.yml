notes:
- Premier forum for automated planning and scheduling, run by ICAPS Inc.
- Formed by merging AIPS and the European Conference on Planning (ECP); ICAPS editions since 2003
- Proceedings published by AAAI Press, open access on ojs.aaai.org with an ISSN
- Rotates worldwide (Prague 2023, Banff 2024, Melbourne 2025, Dublin 2026, Columbia SC 2027)
- Long papers (8 pages) and short papers (4 pages) plus references, in AAAI format
- Deadline in December with an author response period in February; conference late June to early July
- Summer school, doctoral consortium, workshops and tutorials run alongside the main conference
- ICAPS 2027 adds a special track on "Planning Under a Different Name" for work from neighboring AI communities
