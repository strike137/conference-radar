id: ivsp
name: IVSP
full_name: International Conference on Image, Video and Signal Processing
type: conference
tier: minor
areas: [vision, communications]
region: asia-pacific
language: english
frequency: annual
organizer: Commercial conference secretariat (acm-sg.org contact, zmeeting.org submission system) with a Japanese host university each year (Hokkaido University 2027)
organizer_country: [china]
proceedings: SPIE Proceedings
archival: true
indexing: [EI, Scopus]
fee: 580 USD per full paper up to 14 pages (2027, non-member author), 530 USD student, 430 USD presentation only, 350 USD delegate
typical:
  deadline_months: [11]
  conference_months: [3]
links:
  website: https://www.ivsp.net/
notes:
- Annual since 2019 (Shanghai 2019); online 2020 to 2022, Singapore 2023, held in Japan since 2024 (Kawasaki 2024 and 2025, Tokyo 2026, Sapporo 2027)
- Proceedings in the SPIE Digital Library since 2026; ACM DL (ICPS) for 2019 to 2025, all stated as indexed by EI Compendex and Scopus
- Contact address on acm-sg.org, a conference service domain shared with other commercial conferences
- Each paper reviewed by at least two reviewers; abstract-only presentation is offered
- Not listed in CORE ICORE2026 or the CCF list
