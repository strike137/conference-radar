notes:
- Main international conference of Thailand's ECTI Association, held in Thailand since 2004; in May in recent years
  (2024 Khon Kaen, 2025 Bangkok, 2026 Chonburi), June or July in 2015 to 2018
- Three submission periods with separate notifications; submission via EDAS; IEEE Xplore proceedings
- Tracks include Information and Network Security, Computing and Cybersecurity, Communication and Network Technology,
  and AI, Data and Intelligent Systems
- Broad EE and computing scope; technical co-sponsors include IEEE (Thailand Section and Computer Chapter), SICE,
  ICROS and REV; online or on-site presentation allowed in 2026
