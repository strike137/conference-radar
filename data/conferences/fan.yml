notes:
- Japanese national symposium on fuzzy systems, AI, neural networks and computational intelligence; 34th edition in 2026
- Hosting rotates among IEEJ, JSME, SOFT and SICE; the 2026 edition was hosted by the Japanese Society for Evolutionary Computation
- Papers of 2 or more A4 pages; copyright stays with the authors
- The proceedings are handed out on site only
- FAN paper award for first authors aged 40 or under; presentation awards for speakers aged 35 or under
- No submission or presenter fee in 2026; registration about 10,000 JPY (members, early) and 3,000 JPY (students, early)
- Different from the SICE Intelligent System Symposium (sice-is) held every March
- Not listed in CORE ICORE2026
