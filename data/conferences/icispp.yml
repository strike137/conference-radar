notes:
- Security and privacy workshop held together with the International Conference on Signal and Image Processing (ICSIP)
- Accepted papers appear as a special chapter of the ICSIP proceedings, which are in IEEE Xplore
- Held in Jiangsu, China in July (Nanjing, Suzhou, Wuxi, Changzhou; Nantong in 2027); the 2021 edition was in October
- Papers 4 to 5 pages, up to 10 with 70 USD per extra page; double-blind review; abstract-only presentation possible
- Not listed in the CORE portal (ICORE2026)
