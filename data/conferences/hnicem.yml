id: hnicem
name: IEEE HNICEM
full_name: IEEE International Conference on Humanoid, Nanotechnology, Information Technology, Communication and
  Control, Environment, and Management
type: conference
tier: minor
areas: [general, ai, communications, systems]
region: southeast-asia
language: english
frequency: annual
organizer: Philippine IEEE community (organizing committee mostly Philippine university faculty); registration is
  paid to IEEE Robotics and Automation Society Philippines Inc.
organizer_country: [philippines]
proceedings: IEEE Xplore
archival: true
indexing: [IEEE Xplore]
rank:
  core: Unranked
typical:
  deadline_months: [7, 8, 9]
  conference_months: [11, 12]
links:
  website: https://www.hnicem.org/
notes:
- Philippine IEEE conference held since 2003 (annual since at least 2017; 2026 is the 18th); city changes every
  year (2023 Coron, 2024 Baguio, 2025 Cebu, 2026 Tacloban)
- 'Very broad scope: robotics, nanotechnology, IT and AI, communication and control, environment, management'
- Double-blind review (2025); 4 to 6 page IEEE-format papers via EasyChair; accepted papers submitted to IEEE Xplore,
  Scopus indexing subject to evaluation
- On-site only, no virtual presentation option; one author registration covers up to two papers
- Deadline extended repeatedly in 2026 (Jul 1 -> Jul 15 -> Jul 31 on the CFP page; the home page shows Aug 31)
