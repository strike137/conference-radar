notes:
- Conference on algebraic and coalgebraic methods in computer science (semantics, automata, modal logic, rewriting, specification)
- Formed by merging CMCS and WADT; held every two years (odd years) since 2005, usually co-located with MFPS
- Proceedings in the open-access LIPIcs series (Schloss Dagstuhl); CALCO 2025 is LIPIcs volume 342
- Submission categories are regular papers, (co)algebraic pearls, tool papers and early ideas abstracts (abstracts not in the LIPIcs volume)
- Abstract registration a few days before the full paper deadline
- Ranked B in ICORE2026
