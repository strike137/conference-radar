notes:
- Annual conference on distributed computing and machine learning held every January since 2020, hosted by a different Indian institution each time
- Hosts so far include VIT Vellore (2020), SOA University (2021), NIT Warangal (2022), NIT Rourkela (2023), VIT-AP (2024), NTUST Taiwan, NIT Jamshedpur and NIT Puducherry (2027)
- Proceedings in Springer Lecture Notes in Networks and Systems (LNNS), indexed by Scopus
- Double-blind review via Microsoft CMT; papers 10 to 12 pages in Springer format
- Extended versions of selected papers invited to the Inderscience journals IJCSE and IJES
- 2027 edition is hybrid and received DST-SERB sponsorship
- Not listed in ICORE2026 or the CCF 2026 list
