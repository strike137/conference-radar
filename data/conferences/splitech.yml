notes:
- Run by FESB, University of Split, Croatia; held every June in Split and Bol (island of Brac)
- Topics are smart cities, energy, health and IoT, with a cross-cutting AI focus in 2026; includes a large set of symposia, workshops and special sessions
- Technical program papers go to IEEE Xplore; the separate professional program is not included in IEEE Xplore
- The International Symposium on Internet of Things inside SpliTech is technically co-sponsored by IEEE ComSoc
- Full papers up to 6 pages, short papers 3 to 4 pages, submitted via EDAS; extra pages cost EUR 45 each
- "Fee: EUR 590 academia or industry, EUR 430 students (2026, before May 1, without gala dinner)"
- Hybrid participation is offered (online join option)
- Not listed in ICORE2026 or the CCF list
