notes:
- Workshop co-located with IEEE GLOBECOM; 2nd edition in Taipei (2025), 3rd edition in Macau (2026)
- Covers wireless positioning and sensing (cellular, mmWave/THz, optical wireless, UWB, WiFi), ISAC and learning or
  foundation models for sensing
- Organizers from BUPT, University of Miami and Ericsson; steering committee Shiwen Mao (Auburn), Julian Cheng (UBC)
  and Zabih Ghassemlooy (Northumbria)
- Accepted and presented papers go into the IEEE GLOBECOM workshop proceedings in IEEE Xplore; in-person
  presentation required (no-show papers removed)
- Submissions via EDAS through the GLOBECOM workshop call
- Not listed in ICORE2026
