notes:
- Cybersecurity conference held every year in Toulouse since 2017, for hobbyists, professionals and researchers
- Run by a volunteer team supported by a non-profit association of students and alumni of the TLS-SEC security programme
- Two days of talks at the Marthe Condat auditorium (Paul Sabatier University), followed by a CTF at ENSEEIHT with remote participation
- CFP on EasyChair accepts regular, industry and student papers or talks; already presented work is accepted and talks must be in English
- Talks only, no formal proceedings
- 2026 was the 10th edition
