notes:
- New venue (first edition 2024) dedicated to language model research; quickly became competitive
- Double-blind review on OpenReview with abstract deadline a few days before the full paper; accepted papers and
  reviews are made public
- Single-track, three-day main program plus a workshop day
- All editions so far in North America (Philadelphia 2024, Montreal 2025, San Francisco 2026)
- Not ranked in ICORE2026 and not in the CCF list
