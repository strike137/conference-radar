notes:
- Flagship congress of ISPRS, held every four years (Nice 2022 after COVID delays, Toronto 2026)
- Rotates worldwide (Istanbul 2004, Beijing 2008, Melbourne 2012, Prague 2016, Nice 2022, Toronto 2026)
- Covers photogrammetry, remote sensing, 3D reconstruction, point clouds, mapping robotics and AI for geospatial data
- Extended abstracts (2 pages) are reviewed and accepted authors may submit full papers to the ISPRS Archives; double-blind reviewed full papers (6 to 10 pages) go to the ISPRS Annals or Archives
- Very large meeting (2,200+ delegates announced for 2026); 2026 edition held jointly with the 47th Canadian Symposium on Remote Sensing
- ISPRS also runs Geospatial Week (Warsaw 2027) and Technical Commission midterm symposia in between congresses
- Next congress (2030) not yet announced on the ISPRS site
- Not listed in ICORE2026 or the CCF list
