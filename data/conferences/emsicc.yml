id: emsicc
name: EMSICC
full_name: International Workshop on Energy Management for Sustainable Internet-of-Things and Cloud Computing
type: workshop
tier: minor
areas: [networking, systems, ai]
region: worldwide
language: english
frequency: annual
organizer: CNAM Paris (founding chair Samia Bouzefrane) with co-chairs from MAHE Manipal and CISTER Porto, at IEEE FiCloud
organizer_country: [europe]
proceedings: IEEE CPS (FiCloud workshop proceedings)
archival: true
typical:
  deadline_months: [4, 5]
  conference_months: [7, 8]
links:
  website: https://emsicc2026.roc.cnam.fr/
notes:
- Workshop co-located with IEEE FiCloud (Future Internet of Things and Cloud); 2026 was the 11th edition, held hybrid
- Topics are energy-efficient IoT, CPS and cloud systems, energy harvesting and machine learning for energy management
- Single-blind review, up to 6 pages in IEEE 2-column format, submitted via EasyChair
- Proceedings published by IEEE Conference Publishing Services (CPS) with the FiCloud proceedings
- Follows the FiCloud host city (Istanbul 2025, Granada 2026)
- Deadlines are usually extended several times (2025 - Mar 25 -> Apr 25 -> May 20)
- Not listed in the CORE ICORE2026 portal or the CCF list
