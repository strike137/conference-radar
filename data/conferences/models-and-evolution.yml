id: models-and-evolution
name: ME
full_name: International Workshop on Models and Evolution
type: workshop
tier: minor
areas: [software]
region: worldwide
language: english
frequency: annual
organizer: ME steering committee (University of L'Aquila, Nantes Universite, Gran Sasso Science Institute), co-located with MODELS
organizer_country: [europe]
proceedings: MODELS Companion proceedings (ACM 2026, IEEE 2025)
archival: true
typical:
  deadline_months: [7]
  conference_months: [10]
links:
  website: https://models-and-evolution.github.io/
notes:
  - Workshop on (meta-)model evolution, co-evolution, consistency and migration in model-driven engineering
  - Long-running series; 2026 was the 20th edition, started as MoDSE at CSMR in 2007 and 2008, at MODELS since 2009
  - Co-located with the MODELS conference, so it moves with MODELS (2025 Grand Rapids, 2026 Malaga)
  - Accepted papers go into the joint MODELS workshop proceedings (IEEE in 2025, ACM in 2026)
  - Full papers up to 10 pages, position and tool papers up to 5 pages, ACM format; at least 3 reviewers per paper
  - Deadlines follow the MODELS workshop schedule
  - Not listed in the CORE portal (ICORE2026)
