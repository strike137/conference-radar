notes:
- Formerly the ACM Conference on Embedded Networked Sensor Systems (last edition under that name in 2025);
  from 2026 SenSys, IPSN and IoTDI merged into one flagship conference jointly sponsored by ACM and IEEE
- Held in May as part of CPS-IoT Week since 2025 (in November before that); location rotates worldwide
- Regular papers in the ACM DL (open access, APC unless covered by ACM Open); demo and poster abstracts in IEEE Xplore
- Two submission deadlines per edition (around June and November, AoE), double-blind; full papers 12 pages, short
  papers 6 pages for visions, experiences, tools, datasets and benchmarks
- At least one author must present in person and one full (non-student) registration per paper is required
- "ICORE2026 lists the old SenSys entry as 'unranked: merged' (it was A* in CORE2023); the CCF list (B, networking)
  still uses the old full name"
