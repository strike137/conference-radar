notes:
- Biennial power electronics conference of SOBRAEP, the Brazilian Power Electronics Society, held in odd years since 1991
- Described by SOBRAEP as the most traditional power electronics event in the Southern Hemisphere
- Always held in Brazil, at a different host city each edition (2019 Santos, 2021 Joao Pessoa, 2023 Florianopolis, 2025 Vitoria, 2027 Rio de Janeiro)
- Papers since 2009 are in IEEE Xplore; authors can instead opt for a short paper in the COBEP proceedings only
- Digest submission, then a final IEEE paper of 4 to 8 pages; accepted papers not presented are removed from IEEE Xplore
- 2023 edition was held jointly with SPEC (Southern Power Electronics Conference)
- Future host cities announced by SOBRAEP are Rio de Janeiro (2027), Campina Grande (2029) and Belo Horizonte (2031)
- Not listed in ICORE2026
