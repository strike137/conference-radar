links:
  website: https://hust-workshop.github.io/
notes:
- Workshop held with SC (the International Conference for High Performance Computing, Networking, Storage and Analysis); 13th edition in 2026, first held in 2014
- Audience of HPC system administrators, user support staff and tool developers; topics include software build tools, user environments, monitoring, documentation and AI-based user support
- Full papers of 5 to 12 pages (including references) go into the proceedings; 2 to 4 page short papers are not published
- Double-blind review, submitted through the SC submissions site
- Optional Artifact Description appendix following the SC reproducibility initiative
- Half day (Sunday afternoon in 2025, Sunday morning in 2026); location follows SC (St. Louis 2025, Chicago 2026)
- 2021 papers went to Zenodo and 2019 papers to Springer instead of the SC workshops proceedings
