links:
  website: https://algo-conference.org/2026/atmos/
notes:
- Running since 2000; 2026 was the 26th edition
- Held every year as part of the ALGO meeting with ESA, ALGOCLOUD, ALGOWIN, IPEC, WABI and WAOA (Warsaw 2025, L'Aquila 2026)
- Algorithms, mathematical optimization and operations research for transport (timetabling, routing, vehicle and crew scheduling)
- Open-access proceedings in the Dagstuhl OASIcs series (2026 was OASIcs volume 147)
- Regular papers up to 20 pages in total and short papers of 4 to 6 pages, in OASIcs format
- At least one author must register for ALGO and present on site
- Selected papers invited to a special issue of the journal Networks
- Best paper and best student paper awards
- Ranked C in ICORE2026 (listed as Workshop on Algorithmic Approaches for Transportation Modelling, Optimization, and Systems); not on the CCF list
