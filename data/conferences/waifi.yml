notes:
- Standalone biennial workshop (even years since 2008) on finite fields for cryptography, coding theory and implementation
- Revised selected papers published in Springer LNCS (WAIFI 2026 -> LNCS 16611)
- Double-blind review; three invited talks plus about 20 contributed papers
- Rotates worldwide (2016 Ghent, 2018 Bergen, 2020 Rennes, 2022 Chengdu, 2024 Ottawa, 2026 Santander)
- Small, mathematically oriented audience of mathematicians, computer scientists and engineers
