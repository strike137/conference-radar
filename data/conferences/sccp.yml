notes:
- New one-day workshop on checking consistency models and isolation levels in databases, distributed systems and concurrent programs
- 1st edition in 2026, co-located with VLDB 2026 in Boston
- Workshop papers (about 4 pages excluding references) and 1-page extended abstracts; double-blind review on Microsoft CMT
- Authors of accepted workshop papers may choose to publish them in the VLDB workshop proceedings
- Student registration grants offered in 2026 thanks to sponsors
- Not listed in CORE ICORE2026 or in the CCF 2026 list
