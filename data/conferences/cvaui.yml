notes:
- Workshop on computer vision for underwater and marine environments, from underwater image formation to fish and coral monitoring
- Merges the CVAUI series (earlier held with ICPR, latest ICPR 2022) and the AAMVEM series (CVPR 2018, CVPR 2019)
- Joint Workshop on Marine Vision at ICCV 2025 (6th CVAUI, 3rd AAMVEM); 2nd Workshop on Marine Vision at ECCV 2026 (7th CVAUI, 4th AAMVEM)
- Full papers get double-blind review by 2 to 3 reviewers on OpenReview and appear in the host conference workshop proceedings
- ECCV 2026 full papers up to 14 pages in Springer LNCS style; short papers are on OpenReview only and a Nectar track for already published work is non-archival
- In-person presentation is mandatory for accepted papers
- Distinct from MaCVi (Maritime Computer Vision workshop)
- Not listed in ICORE2026 or the CCF list
