notes:
- Applied data, analytics and AI practitioner conference run by the Swedish company Hyperight, held annually in Stockholm since 2016
- Main Nordic edition at Kistamassan, Kista, Stockholm; smaller regional editions in Dubai, Singapore and Sydney
- 2027 is the 12th edition, with about 350 speakers on 15 stages, workshops and an exhibition of 100+ exhibitors
- Hybrid event; recordings available on demand to delegates for five weeks after the event
- Speakers are nominated via Hyperight with priority for enterprise and public sector organisations; vendors present through sponsorship packages
- No papers or proceedings
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
