notes:
- Main venue for runtime verification, monitoring and dynamic analysis of software and hardware systems
- Started as a workshop in 2001; a conference since 2010 (26th edition in 2026)
- Proceedings in Springer LNCS (RV 2026 is LNCS volume 17117)
- Regular papers up to 16 pages, short, tool demo and benchmark papers up to 8 pages, excluding references
- Single-blind review with at least three reviews per paper; tutorials can publish a paper in the proceedings
- Separate Tool Showcase track with a later deadline and no paper required
- 'Recent hosts: Tbilisi (2022), Thessaloniki (2023), Istanbul (2024), Graz (2025), Kingston, Canada (2026)'
- Sponsored by Formal Methods Europe; Springer best paper award and FME best tool award
- CORE B, CCF C
