notes:
- Half-day workshop co-located with ACM SIGKDD; 2026 was the fourth edition
- Topics are data-efficient, model-efficient and hardware-efficient learning for knowledge discovery
- Papers of at least 4 pages in any template, peer reviewed, submitted via Microsoft CMT
- Accepts papers already accepted or under review at other venues; KDD 2026 workshop papers are not archived in the ACM DL
- Invited talks, spotlight talks, poster session and a best paper award
- Not listed in the CORE ICORE2026 portal
