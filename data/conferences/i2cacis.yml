notes:
- Run by the IEEE CSS Malaysia Chapter as part of its yearly conference series (with CSPA, ICSGRC, ICSET and ICSPC in 2023); 8th
  edition in 2023
- Held in Malaysia every year, usually in Shah Alam or Kuala Lumpur in late June
- Short event (one day in 2023 and 2024, two days in 2025 and 2026)
- Broad scope (control and intelligent systems, system identification, instrumentation and automation, power,
  communication, electronics and computer engineering)
- Proceedings in IEEE Xplore; 2024, 2025 and 2026 volumes are listed there
- Not ranked by CORE (ICORE2026); not in the CCF list
