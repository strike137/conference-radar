notes:
- Run by the Faculty of Computing at SLIIT, Sri Lanka; held every year since 2019 (8th edition in 2026, in Colombo in December)
- Technical co-sponsorship from the IEEE Sri Lanka Section; every edition so far is in IEEE Xplore and indexed in Scopus
- Broad computing scope in research clusters (AI, multimodal AI, CPS and IoT, networking, cybersecurity, immersive
  tech, health informatics, bioinformatics, and more)
- Up to 6 pages in IEEE double-column A4 format, submitted via Microsoft CMT
- 2026 received 825 submissions; hybrid conference
- Industry Research and Innovation Track added in 2026 (research papers plus innovation and experience submissions)
- Not listed in ICORE2026 or the CCF list
