notes:
- Biennial symposium on the interaction of mathematics, theoretical computer science and AI; 2026 was the 19th edition
- Sponsored by the Springer journal Annals of Mathematics and Artificial Intelligence (AMAI)
- Electronic proceedings on the symposium website are explicitly non-archival, so papers can be submitted elsewhere afterwards
- Selected papers are invited to a special volume of AMAI, refereed at journal standards
- Three days with invited talks, technical papers and special topic sessions; submissions via OpenReview
- 2026 edition held in Fort Lauderdale, Florida, with Florida Atlantic University providing local organization
