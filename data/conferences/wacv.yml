notes:
- Run under IEEE and the Computer Vision Foundation; papers open access on the CVF site, final versions in IEEE
  Xplore
- Held in the USA (2026 Tucson, 2027 Buena Vista, Florida); 2027 edition moves from March to early January
- Two review rounds per year; round 1 papers can be revised and resubmitted in round 2
- Applications, Algorithms and (from 2027) Evaluations and Datasets tracks
- Double-blind review on OpenReview; 8 pages plus references
- Extended versions of WACV 2026 papers invited to a Machine Vision and Applications special issue
