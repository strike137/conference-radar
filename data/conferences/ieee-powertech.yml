notes:
- Biennial European flagship conference of the IEEE Power & Energy Society, co-sponsored by IEEE PES and the host university
- Power and energy systems engineering focus
- Always held in Europe in late June (2015 Eindhoven, 2017 Manchester, 2019 Milan, 2021 Madrid, 2023 Belgrade, 2025 Kiel)
- The 16th edition was held in Kiel in 2025, co-sponsored by Kiel University
- Proceedings in IEEE Xplore (for example the 2025 IEEE Kiel PowerTech volume)
- Not listed in the CORE ICORE2026 portal
