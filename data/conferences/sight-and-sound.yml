notes:
- Workshop on audio-visual learning (sound and vision, audio-visual generation, speech, sound localization)
- Held with CVPR every year since 2018 (Seattle 2024, Nashville 2025, Denver 2026)
- Short papers of at most 4 pages including references, or 1 to 2 page extended abstracts, submitted anonymously via CMT
- Non-archival; accepted papers only appear on the workshop website, so they can be submitted to the next CVPR
- Work already accepted at other venues is welcome
- Accepted papers get a 5-minute talk, in person or by video
- Not listed in ICORE2026 or the CCF list
