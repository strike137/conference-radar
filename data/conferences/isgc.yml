notes:
- Run by the Academia Sinica Grid Computing Centre and held at Academia Sinica in Taipei, Taiwan, usually in March; first edition in 2003
- Covers distributed and cloud infrastructures for science, including networks and security infrastructures, HPC, FAIR data and AI
- ISGC 2023 was held together with the HEPiX Spring 2023 workshop; 2022 was virtual
- Selection is by abstract; full papers (up to 15 pages) are submitted after the symposium
- Full papers are reviewed and published open access in Proceedings of Science (PoS) by SISSA
- Six-day event with keynotes, co-located workshops and project reports
