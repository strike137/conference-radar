notes:
- Approximate computing across hardware and software, including dependability, test, fault tolerance and security of approximate systems and approximation for deep learning
- Co-located with a different host conference each year; 9th edition with ACM/IEEE ICCAD in New Jersey (October 2024), 10th edition with IEEE/IFIP DSN in Naples (June 2025)
- Extended abstracts and short papers up to 4 pages plus references, IEEE template, submission via the DSN workshops EasyChair
- At DSN 2025 accepted papers went into the DSN supplemental volume in IEEE Xplore
- Not on the list of DSN 2026 workshops; no 2026 edition found
- Not listed in the CORE ICORE2026 portal
