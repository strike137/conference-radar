notes:
- Workshop on design patterns, pattern languages and governance practices for agentic and responsible AI engineering
- 2027 edition co-located with IEEE ICSA 2027 in Sydney; papers in the ICSA 2027 Companion proceedings in IEEE Xplore
- Predecessor AI-Pattern'24 (Patterns and Practices of Reliable AI Engineering and Governance) was held with ISSRE 2024 in Tsukuba, Japan, papers in the ISSRE supplemental proceedings in IEEE Xplore
- Full papers 8 pages, short papers 4 pages, position/new-idea papers 2 pages, all including references, IEEE Computer Society format
- At least one author must register for ICSA and present in person
- Led by Hironori Washizaki (Waseda University)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
