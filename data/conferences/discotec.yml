notes:
- Federated event of three IFIP WG 6.1 conferences with shared deadlines, namely COORDINATION (coordination models and languages),
  DAIS (distributed applications and interoperable systems) and FORTE (formal techniques for distributed systems), plus the ICE workshop
- Sponsored by IFIP and EAPLS; each edition is hosted by a European university
- Each member conference has its own Springer LNCS-IFIP volume (DAIS 2026 is LNCS 16591); open access in the IFIP digital library after a 3-year embargo
- DisCoTec itself is not on the CORE list; the member conferences COORDINATION, DAIS and FORTE are CORE C (ICORE2026), and FORTE is CCF C
- Artefact evaluation track; best paper per conference plus a DisCoTec-wide best paper award
- Selected papers invited to journal special issues (Logical Methods in Computer Science, Science of Computer Programming)
- Held in Europe every year (Lisbon 2023, Groningen 2024, Lille 2025, Urbino 2026, Augsburg 2027)
