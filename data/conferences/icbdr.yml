notes:
- Held 2017 (Osaka), 2018 (Weihai), 2019 (Paris), virtual 2020 to 2022, then no edition until the 7th ICBDR in Chengdu in 2026
- Proceedings published by ACM every year since 2018 (ACM ICPS, ACM DL), indexed by EI Compendex and Scopus
- 2026 edition co-organized by Southwestern University of Finance and Economics and Southwest University of Science and Technology, assisted by Donghua University
- Run by a commercial conference secretariat (163.com contact address)
- Full papers at least 8 pages; abstract only submissions are presented as posters and not published
- Not listed in the CORE ICORE2026 portal
