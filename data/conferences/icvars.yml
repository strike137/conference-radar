id: icvars
name: ICVARS
full_name: International Conference on Intelligent Computing and Virtual & Augmented Reality Simulations
type: conference
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: Commercial conference secretariat (contact icvars@163.com) with host universities (RheinMain University of Applied Sciences and Arts in 2027); co-sponsored by IEEE SMC Society in 2027
organizer_country: [china]
proceedings: IEEE Xplore (2025 to 2027; ACM ICPS 2019 to 2024)
archival: true
indexing: [EI Compendex, Scopus]
fee: 620 USD regular author, 580 USD student author (2027, early bird before 2027-05-20); six pages included, 70 USD per extra page
typical:
  deadline_months: [2]
  conference_months: [6, 7]
links:
  website: https://www.icvars.org/
notes:
- Annual since 2017; 11th edition in 2027
- Covers VR, AR, MR and XR, HCI in immersive environments, neural rendering and intelligent computing
- Held in Australia 2017 to 2024 (virtual in 2021 and 2022), then Birmingham UK 2025, Chalon-sur-Saone France 2026, Wiesbaden Germany 2027
- Proceedings in ACM DL for 2019 to 2024 and IEEE Xplore for 2025 and 2026; 2027 proceedings announced for IEEE Xplore
- 2027 edition co-sponsored by IEEE Systems, Man, and Cybernetics Society and listed in the IEEE conference calendar
- Run by a commercial conference secretariat (163.com contact address, zmeeting submission); held together with ICCAE in 2017 and 2018
- Abstract-only presentation option without publication
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
