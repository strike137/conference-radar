id: pdcat
name: PDCAT
full_name: International Conference on Parallel and Distributed Computing, Applications and Technologies
type: conference
tier: minor
areas: [systems, networking]
region: asia-pacific
language: english
frequency: annual
organizer: PDCAT Steering Committee (chair Hong Shen, Central Queensland University) with a host university each
  year (2025 Griffith University, 2026 Hunan University)
organizer_country: [international]
proceedings: Springer LNCS
archival: true
rank:
  core: C
fee: 490 USD author, 260 USD attendee; RMB 3,400 / 1,800 for Chinese participants; 150 USD per extra page (2026)
typical:
  deadline_months: [8, 9, 10]
  conference_months: [11, 12]
links:
  website: https://www.pd-cat.org/
notes:
- Series started in Hong Kong in 2000; 27th edition in 2026
- Rotates around Asia and Oceania (2022 Sendai, 2023 Jeju, 2024 Hong Kong, 2025 Gold Coast, 2026 Changsha)
- Papers in Springer LNCS (PDCAT 2025 is LNCS volume 16465); selected papers invited to journal special issues
- Up to 14 pages in LNCS format including references; hybrid format with online presentation allowed
- 2026 edition has two submission cycles
- Broad scope covering parallel and distributed systems, networking, AI, big data, and security and privacy
- CORE C (ICORE2026); not on the CCF 2026 list
