notes:
- Organized and hosted by the Ethiopian Artificial Intelligence Institute (EAII); held in Addis Ababa, Ethiopia every year since 2022
- Accepted papers published in Springer Communications in Computer and Information Science (CCIS); 2023 papers appeared as revised selected papers in CCIS 2068 and 2069
- Two-stage submission, abstract first, then a full paper in Springer format for invited abstracts
- Topics include NLP for African languages, medical AI, AI in FinTech, AI in cybersecurity and generative AI
- Not listed in the ICORE2026 CORE ranking
