notes:
- Organized and hosted by the Ethiopian Artificial Intelligence Institute (EAII); held in Addis Ababa every year since
  2022
- Accepted papers are published in Springer CCIS
- 2026 process has an abstract stage, then invited full papers of 10 pages or more in Springer format via EasyChair
- Topics include NLP for African languages, healthcare AI, agriculture and finance
- Not listed in ICORE2026 and not on the CCF list
