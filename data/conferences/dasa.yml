notes:
- Series run by Applied Science University (ASU), Bahrain, since 2020; 2026 edition hosted by Mae Fah Luang University with ASU and Ajman University
- Held in Bahrain (2020, 2021, 2024, 2025), Chiang Rai, Thailand (2022), Annaba, Algeria (2023) and Bangkok, Thailand (2026); hybrid
- Proceedings of every edition from 2020 to 2025 are in IEEE Xplore; 2026 is technically sponsored by IEEE Thailand Section
- Interdisciplinary decision sciences venue; tracks cover decision aid in computer science and engineering, AI and data, plus logistics, healthcare, energy, finance and management
- Papers at most 5 pages via EDAS; selected papers invited to extended versions in international journals
- Includes a workshop for early-stage PhD students
- Students from developing countries can register for online participation at 50 USD with support from ASU
