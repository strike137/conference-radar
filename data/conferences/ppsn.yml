notes:
- Biennial evolutionary computation and nature-inspired optimization conference; 2026 was the 19th edition
- Proceedings in Springer LNCS (five volumes in 2026, LNCS 16985 to 16989)
- CORE A (ICORE2026), CCF B
- Held in Europe (Hagenberg 2024, Dortmund 2022, Leiden 2020)
- In-person only; at least one author must register and attend, virtual participation is not possible
- 2026 edition hosted by the University of Trento at Trento Expo, with workshops and tutorials
