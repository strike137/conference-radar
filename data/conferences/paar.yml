notes:
- Workshop on implementation and application of automated reasoning tools (SAT, SMT, first-order and higher-order provers, proof assistants, benchmarking)
- Held with IJCAR since 2008, every two years; PAAR 2026 was the 10th edition
- Recent locations are Coimbra 2016, Oxford 2018, online 2020, Haifa 2022, Nancy 2024 and Lisbon 2026 (FLoC)
- Extended abstracts (up to 8 pages) or regular papers (up to 15 pages), refereed by the program committee
- Proceedings in CEUR-WS (PAAR 2024 -> Vol-3717, PAAR 2026 -> Vol-4241)
- Steering committee consists of all past program chairs
- Not listed in ICORE2026 or the CCF list
