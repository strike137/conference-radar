links:
  website: https://www.ashes-hpc.org/2026/
notes:
- Workshop on heterogeneous and accelerator-based systems (GPUs, FPGAs, novel accelerators), covering applications,
  programming models, compilers and runtime systems
- Held since 2011 (first as CACHES); 16th edition in 2026
- Co-located with IEEE IPDPS every year, so it moves with IPDPS (virtual 2021 and 2022, St. Petersburg FL 2023, San
  Francisco 2024, Milan 2025, New Orleans 2026)
- Papers appear with the IPDPS workshops proceedings in IEEE Xplore (stated on the 2024 and 2025 calls)
- Full papers up to 10 pages and short papers up to 4 pages, both including references; single-blind review;
  submission through the IPDPS Linklings site
- Best paper award; steering committee from US labs and industry plus members in Europe and Asia
- Not listed on the CORE portal (ICORE2026) or the CCF 2026 list
