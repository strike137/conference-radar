notes:
- Interdisciplinary workshop on NLP grounded in psychological theory, social interaction and interpersonal communication
- First edition at ICWSM 2025 in Copenhagen (proceedings published by AAAI, listed in the ACL Anthology)
- Second edition held jointly with the 1st Workshop on Social Context (SoCon) at LREC 2026 in Palma de Mallorca, with separate SoCon and NLPSI tracks
- 2026 joint proceedings published by ELRA in the ACL Anthology (2026.socon-1)
- Long papers up to 8 pages and short papers up to 4 pages, submitted via Softconf
- Not ranked in ICORE2026 and not on the CCF list
