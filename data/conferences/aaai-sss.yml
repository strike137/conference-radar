notes:
- Set of about six to eight small symposia (40 to 75 participants each) run in parallel at one site over two and a
  half days; topics change every year
- Held in the San Francisco Bay Area (Burlingame near SFO 2023, Stanford 2024, Burlingame 2025 and 2026, Santa Clara
  University 2027)
- Each symposium runs its own call for papers and review; 2026 paper deadlines ranged from January 9 to February 27
- Papers are published by AAAI Press in the Proceedings of the AAAI Symposium Series (ISSN 2994-4317)
- Symposium proposals are due in November; work in progress and speculative work are welcome
- In person only, all presenters must register
- "Registration fee (2026, early): 395 USD member, 560 USD nonmember, 225 USD student member, 335 USD student nonmember"
