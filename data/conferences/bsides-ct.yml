notes:
- Security BSides conference for the Connecticut infosec community, started in 2011 and run by an all-volunteer crew
- One day on a Saturday in September in Fairfield, Connecticut (Sacred Heart University in 2025, Fairfield University in 2026)
- Two tracks of talks plus hands-on workshops, a lockpick village, a ham radio exam session and an annual CTF
- Open to everyone from students to seasoned professionals; talks only, no proceedings
