notes:
- Workshop on requirements engineering for responsible, accountable and human-centered AI (ethics, fairness, explainability, governance)
- New series; 1st edition with RE 2025 in Valencia (1 September 2025), 2nd with RE 2026 in Montreal
- Accepted papers appear in the IEEE RE workshops (REW) proceedings
- Empirical studies, experience reports and design research up to 6 pages plus 1 page of references; extended abstracts of 2 to 3 pages for posters and lightning talks; IEEEtran format
- Organized by Irit Hadar, Boris Kantsepolsky, Eran Sadovski and Sofia Sherman (Israel)
- Not listed in ICORE2026 or the CCF 2026 list
