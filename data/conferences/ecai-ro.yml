notes:
- Not the European Conference on Artificial Intelligence (see ecai); this is a Romanian electronics and computing conference
- Promoted by the Pitesti University Centre of POLITEHNICA Bucharest; 2027 host is the Petroleum-Gas University of Ploiesti
- The site states that all papers from the 2013 to 2026 editions are in IEEE Xplore and Scopus
- Broad topics from electronic circuits, communications and signal processing to AI, control, energy and biomedical applications
- Two submission rounds (early with 10% fee discount, then normal); two review rounds with a revised paper and response letter; papers up to 10 pages (up to 20 with extra fee)
- "Fee: 300 EUR regular, 180 EUR for online e-sessions (2027)"
- Many co-located workshops and special sessions (IWAE, smart grid, IoT, hydrogen and others)
- Not listed in ICORE2026
