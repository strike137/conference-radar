id: icghit
name: ICGHIT
full_name: International Conference on Green and Human Information Technology
type: conference
tier: minor
areas: [communications, networking, security, ai, vision, general]
region: southeast-asia
language: english
frequency: annual
organizer: GHIT (Green and Human Information Technology) and IEIE (Institute of Electronics and Information Engineers,
  Korea)
organizer_country: [korea]
proceedings: IEEE Xplore (accepted and presented papers submitted, subject to IEEE screening)
archival: true
rank:
  core: Unranked
fee: USD 600 early author registration (2027); ASEAN academics and students USD 250
typical:
  deadline_months: [11, 12]
  conference_months: [1, 2]
links:
  website: https://icghit.org
notes:
- Co-hosted by GHIT and IEIE (Institute of Electronics and Information Engineers, Korea); committee is mostly Korean
  academics with local co-chairs; held in Southeast Asia each January or February (2024 Hanoi, 2025 Nha Trang, 2026
  Bali, 2027 Jakarta)
- Regular papers up to 6 pages, work-in-progress papers up to 4 pages, submitted via EDAS; accepted and presented
  papers are submitted to IEEE Xplore
- 'Deadlines are usually extended (2026 cycle: Nov 7 -> Nov 21 -> Dec 5)'
- Online presentation is allowed; discounted fees for ASEAN participants
- Selected papers are extended into special issues (Sensors, Electronics, Applied Sciences, IEIE SPC)
