notes:
- ACM conference run through SIGCHI (submissions via the SIGCHI PCS) on the intersection of AI and HCI (intelligent and generative AI
  interfaces, explainable AI, human-AI interaction)
- CORE A (ICORE2026); CCF B
- Proceedings in the ACM DL
- Double-blind review with an invited rebuttal; abstract one week before the paper deadline; single-column ACM TAPS
  format with no fixed page limit (about 8,000 words encouraged)
- IUI 2026 ran in July in Limassol, Cyprus (the site mentions refunds for earlier March dates); IUI 2027 returns to
  February in Helsinki with an August 2026 paper deadline
- Posters, demos and doctoral consortium have later deadlines (Oct to Nov for IUI 2027)
