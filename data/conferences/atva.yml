notes:
- Formal methods venue on automated analysis, verification and synthesis of hardware and software systems
- Run by an international steering committee; contact address at Academia Sinica, Taiwan
- Proceedings in Springer LNCS; 18 pages plus references in LNCS format
- Regular papers double-blind, tool papers single-blind with mandatory artifact evaluation; author response period
- 'Mostly held in Asia or Oceania; recent hosts: Gold Coast (2021), Beijing (2022), Singapore (2023), Kyoto (2024),
  Bengaluru (2025), Hong Kong (2026)'
- Co-located with APLAS since 2025; 2026 adds the Spotlights of Verification talks (no proceedings)
- CORE B, CCF C
