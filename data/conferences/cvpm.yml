notes:
- Workshop on camera-based measurement of vital signs and health monitoring (remote PPG, respiration, sleep, clinical monitoring)
- Held with CVPR 2020 to 2024 and with ICCV 2019 and 2025; 2025 was the 8th edition
- CVPM 2020 also ran a challenge on remote physiological measurement
- Papers of up to eight pages plus references in the host conference format, submitted through OpenReview with blind review
- 4 papers on CVF Open Access for ICCV 2025
- Not listed in ICORE2026 or the CCF list
