notes:
- Workshop on the design, analysis and implementation of algorithms and data structures (compact data structures, massive data, external memory, streaming), held within the Jornadas Chilenas de Computación (JCC)
- Accepts extended abstracts of up to 4 pages and posters; work in progress and work already published in journals or conferences are welcome
- Submissions via Microsoft CMT; presentation by a registered author is required
- The workshop page says papers presented and meeting IEEE quality rules go to the JCC proceedings in IEEE Xplore (indexed in Scopus)
- Not listed in CORE ICORE2026
