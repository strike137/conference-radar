notes:
- Workshop on 6G connectivity for robotics and the Metaverse (low-latency and holographic communications, ISAC,
  digital twins, QoE for immersive applications)
- Second edition held at IEEE GLOBECOM 2025 in Taipei (WS-24, half day)
- Endorsed by the one6G Association and supported by members of the IEEE SA COM/MobiNet-SC working group
- 2025 general chairs from Universidad Carlos III de Madrid, SmartAvatar (Netherlands) and Huawei (UK)
- Accepted and presented workshop papers go into the GLOBECOM proceedings and IEEE Xplore; no-show papers are removed
- Submissions via EDAS
- Not in the GLOBECOM 2026 workshop list (checked 2026-10-17)
- Not listed in ICORE2026
