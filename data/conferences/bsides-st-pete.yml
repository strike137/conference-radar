notes:
- Community-driven Security BSides conference in St. Petersburg, Florida
- Fiscally sponsored project of the Cyber Ohana Project, a US 501(c)(3) non-profit
- 2027 is the 5th edition; the organizers skipped 2026 and moved the event to February
- Two days, trainings on day 1 at spARK Labs and talks on day 2 at the SPC Midtown Campus
- Tracks include offensive security, defense and incident response, AI and ML security, cloud and web, hardware and IoT, OSINT and privacy
- Vendor pitches are discouraged; 600+ attendees according to the organizers
- No proceedings
