  website: https://sites.google.com/view/disqic2026/home
notes:
- Half-day workshop held with IEEE ICDCS on distributed and modular quantum computing, quantum networking, quantum data centres and hybrid quantum/HPC workflows
- First edition in 2026 with ICDCS 2026 in Seoul; one invited talk and six accepted papers
- Regular papers up to 6 pages, short papers up to 4 pages, IEEE two-column format, submitted via EasyChair
- Camera-ready papers go through IEEE CPS with an IEEE copyright form and are included in the ICDCS proceedings; full registration required
- Not listed in the ICORE2026 portal or the CCF 2026 list
