notes:
- Practitioner conference on data engineering, machine learning and AI run by Hasgeek in Bengaluru since 2012
- Annual conference in July; a Winter Edition on data practice and analysis was added in December 2026
- Sessions are curated and peer reviewed by volunteer editors and practitioners from a call for proposals on Hasgeek
- Talks, showcases, posters, workshops and Birds of a Feather sessions; work in progress welcome
- No proceedings; talk videos and livestream are for annual members
