notes:
- Biennial robotics conference of The Robotics Society (formerly the Robotics Society of India), hosted by a different Indian institute each time
- Past hosts include DRDO Pune (2013), BITS Pilani Goa (2015), IIT Delhi (2017), IIT Madras (2019), IIT Kanpur (2021), IIT Ropar (2023) and IIT Jodhpur (2025)
- Proceedings in the ACM International Conference Proceedings Series (ICPS) for every edition; ICPS now uses an open access model
- Two submission rounds; papers rejected in Round 1 can be revised and resubmitted in Round 2
- Strict double-blind review; final papers up to 6 pages in the ACM two-column format
- Includes workshops and tutorials, a doctoral symposium and a startup exposition
- Not found in ICORE2026
