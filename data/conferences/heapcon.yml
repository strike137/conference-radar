notes:
- Regional tech conference for software engineers and tech businesses in Belgrade, Serbia
- Run since 2018 by Heapspace, a Serbian organizer of IT community events and meetups
- Editions in 2018, 2019 and every year since 2022; 2025 and 2026 held at the Madlenianum Opera and Theatre, Belgrade
- Two days, two parallel tracks; about 700 attendees and 30 or more speakers
- Talks (35 minutes including Q&A) chosen by an independent committee from a call for speakers; no papers or proceedings
- Topics include software development, DevOps, AI and machine learning, web, data, cybersecurity and tech leadership
- "Fee: 320 EUR regular, 130 EUR online (2026)"
