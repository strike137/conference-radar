notes:
- Regional PyCon for the Pacific Northwest, started in 2018
- Rotates each year between Vancouver BC, Seattle WA and Portland OR (online in 2021 and 2022)
- Two-day single-track conference with in-person talks of 25 or 40 minutes, no Q&A after talks, plus a sprint day
- Call for proposals on Pretalx; first-time speakers are welcomed and offered mentors
- No papers or proceedings
