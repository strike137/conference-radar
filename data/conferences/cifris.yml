notes:
- National cryptography conference of the Italian association De Cifris, held in or near Rome since 2023 (CIFRIS23 in
  December 2023, CIFRIS24 in Frascati in September 2024, CIFRIS25 and CIFRIS26 at Roma Tre University)
- One-day format in 2026 - morning session for institutional and industry stakeholders (in Italian), scientific session
  of invited talks, then parallel workshops in the afternoon
- Permanent workshops on applied cryptography, number theory, post-quantum cryptography and symmetric/code-based
  cryptography, plus an open workshop
- Each workshop talk gets a two-page abstract in the De Cifris Koine book series; the full paper can still be published
  elsewhere
- Koine is open access with no author fees but is not indexed (not in Scopus), so the venue is marked non-archival here
- Italian national cybersecurity agency (ACN) was the cooperating body in 2025 and co-chairs the 2026 organizing committee
- Not listed in ICORE2026 and not on the CCF list
