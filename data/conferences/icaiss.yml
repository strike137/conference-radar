notes:
- Organized in 2027 by CARE College of Engineering, Tiruchirappalli (Trichy), Tamil Nadu
- Proceedings in IEEE Xplore; the official site links the 2022, 2023, 2025 and 2026 proceedings
- 2027 has an IEEE Xplore compliant ISBN; all registered and presented papers are submitted to IEEE Xplore
- Broad scope covering augmented intelligence, autonomous learning systems, smart communities and sustainable systems
- 5th edition in 2027; no 2024 proceedings are listed on the official site
- IEEE Xplore records all four earlier editions (2022, 2023, 2025, 2026) as held in Trichy, India
- Not found in ICORE2026; not on the CCF list
