links:
  website: https://fosdem.org/
notes:
- Free, non-commercial two-day event for free and open source software developers, run by volunteers since 2000
- Held at the ULB Solbosch Campus in Brussels, Belgium, on a weekend at the end of January or start of February
- Some 8000+ attendees; 1013 lectures in 65 developer rooms in 2026
- Attendance is free with no registration
- Main track talks (25 or 50 minutes) chosen through a call for participation; devroom talks go through calls run by each developer room after devrooms are announced
- All content must relate to free and open source software; everything is recorded and published under CC BY
- No papers or proceedings; practitioner talks only
