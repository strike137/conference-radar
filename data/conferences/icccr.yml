id: icccr
name: ICCCR
full_name: International Conference on Computer, Control and Robotics
type: conference
tier: minor
areas: [ai, systems]
region: china
language: english
frequency: annual
organizer: ICCCR conference secretariat with a host university each year (Southwest Jiaotong University in 2027); IEEE co-sponsored the 2026 edition
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 590 USD regular, 530 USD student (2027, early bird); covers one 6-page paper
typical:
  deadline_months: [1]
  conference_months: [3, 4, 5]
links:
  website: http://www.icccr.org/
notes:
- Held in China every year since 2021 (Shanghai 2021 to 2024, virtual in 2021 and 2022; Hangzhou 2025, Nanjing 2026, Chengdu 2027)
- Covers computer science, control engineering and robotics, including AI, embedded systems and distributed system security
- Proceedings of all editions 2021 to 2026 are in IEEE Xplore, indexed in EI Compendex and Scopus
- Submission through EasyChair; papers 4 to 10 pages; abstract-only presenter option without publication
- Listed in the IEEE conference calendar; bilingual Chinese and English site
- Not listed in CORE ICORE2026 or the CCF list
