links:
  website: https://iske2025.com/
notes:
- Series since 2006; ISKE 2025 was the 20th edition
- Steering committee chaired by Etienne Kerre (Ghent University) with members from China, Europe, Australia, Turkey and Brazil; each edition has a local host university
- Proceedings published by IEEE in IEEE Xplore and submitted to EI Compendex and Scopus; award papers nominated to Knowledge-Based Systems and IJCIS
- Papers up to 8 pages, single-blind review, submission via EasyChair; extra pages 60 USD each (2025)
- Scope covers AI methods, knowledge engineering and management, applications of AI and intelligent robotics
- "CORE rank: National: China (ICORE2026); not on the CCF 2026 list"
