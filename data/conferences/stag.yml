notes:
- Annual computer graphics, geometric modeling and visual computing conference organized by the Italian Chapter of the Eurographics Association, held since 2014
- Accepted full papers (up to 10 pages plus references) and 2-page posters are published in the Eurographics Digital Library
- Research, dataset and software papers; software papers must release code under an open-source license
- Double-blind review
- Held at a different Italian city each year (Matera 2023, Verona 2024, Genoa 2025, Catania 2026)
- Selected papers are invited to extend into special issues of Computers & Graphics and Graphical Models
- Deadlines are usually extended by one to two weeks
- "Registration 2026: 300 EUR early (EG member), 350 EUR early (non-member), students from 150 EUR"
- Also runs a PhD school, a hackathon and a best thesis award
- Not listed in the ICORE2026 portal and not on the CCF list
