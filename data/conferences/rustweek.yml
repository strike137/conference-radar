notes:
- Billed as the world's biggest Rust conference; organised by RustNL, a Dutch non-profit and associate member of the Rust Foundation
- Held every May in Utrecht, Netherlands (Kinepolis cinema for the talk days)
- A week with one workshop day, two talk days in three parallel tracks (including an industry track), a hackathon, an unconference and the Rust Project All Hands
- About 800 conference attendees in 2026; talks chosen through an open call for proposals on Sessionize
- No papers or proceedings; talk recordings are published on YouTube
- Not listed in CORE ICORE2026
