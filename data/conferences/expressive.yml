notes:
- Symposium on computational aesthetics, non-photorealistic rendering and animation, and sketch-based interfaces and modeling
- Successor of the CAe, SBIM and NPAR workshops, merged as Expressive in 2012
- Held yearly from 2012 to 2019, then no edition until the 9th Expressive in London in 2025
- 2025 edition joined with WICED and co-located with Eurographics 2025
- Two paper tracks in 2025, a journal track (Elsevier Computers & Graphics special issue) and a conference track
- Conference papers, posters and demos appear in the Eurographics Digital Library and the ACM Digital Library
- Anonymous submission; all deadlines 23:59:59 UTC
- Not listed in the ICORE2026 portal or the CCF 2026 list
