notes:
- Sponsored by IEEE ComSoc; 8th edition in 2026, 9th in 2027
- Double-blind review with a rebuttal period; full papers 8 pages, short 4, posters 2, SoK 16 (excluding references)
- CORE C; not in the CCF list
- Location rotates globally (Brisbane 2026, Toronto 2027)
- Deadline in December or January for a late May or early June conference; ComSoc and student travel grants offered
