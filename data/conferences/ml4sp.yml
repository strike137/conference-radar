notes:
- Workshop on machine learning for SAT, SMT, CP and MIP solvers and for automated and interactive theorem provers, including LLMs for proof guidance
- 1st edition (invited talks only) at SoCS/SAT/CP 2025 in Glasgow; 2nd edition with contributed papers at FLoC 2026 in Lisbon
- Organized by Vijay Ganesh (Georgia Tech) and Nguyen Dang (University of St Andrews)
- Extended abstracts (up to 2 pages) or full papers (up to 15 pages) in LIPIcs format, not anonymized; previously published work welcome
- Accepted papers are posted as PDFs on the workshop website
- Not listed in ICORE2026
