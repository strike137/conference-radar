id: mlicom
name: MLICOM
full_name: EAI International Conference on Machine Learning and Intelligent Communications
type: conference
tier: minor
areas: [communications, ai, networking]
region: china
language: english
frequency: annual
organizer: EAI (European Alliance for Innovation), with Chinese host universities (2026 local host Minzu University of China)
organizer_country: [europe, china]
proceedings: Springer LNICST
indexing: [Scopus, EI Compendex, Web of Science, DBLP]
acceptance_rate: 41% (2023, 18/44)
fee: 600 USD author package for EAI members (membership is free), 750 USD non-member (2026)
typical:
  deadline_months: [7, 8]
  conference_months: [11, 12]
links:
  website: https://mlicom.eai-conferences.org/2026/
notes:
- EAI-sponsored conference run with Chinese universities; every in-person edition has been in China (2016 Shanghai,
  2017 Weihai, 2018 Hangzhou, 2019 Nanjing, 2023 Beijing, 2026 Sanya); 2020 to 2022 and 2024 were virtual
- Proceedings in Springer LNICST (2023 edition is LNICST volume 518); full papers 12 to 20 pages, short papers 6 to
  11 pages in Springer format
- Main track plus a later late track; selected papers invited to the Springer MONET journal and EAI Endorsed
  Transactions
- Not found in the ICORE2026 CORE list; minor venue
- Edition numbering is inconsistent (2024 and 2026 are both called the 9th); no edition found for 2025
