- CCF C; not ranked in CORE
- Location moves between Europe and the USA (Miami 2025, Reykjavik 2026, New York 2027); hybrid option
- Several submission rounds (main track plus a later final round); deadline month has shifted a lot between editions
- 50% discount on a second paper by the same presenting author; student registration does not cover paper upload
