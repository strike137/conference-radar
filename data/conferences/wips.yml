notes:
- Workshop at SOUPS on privacy and security for people with disabilities and for vulnerable or marginalized groups
- Series runs back to 2015; WIPS 2024 was the 9th edition
- Held online since 2021 even when SOUPS was in person (2024 on Zoom); earlier editions were in the US with SOUPS
- Papers up to 4 pages excluding references in USENIX format, not anonymized, submitted via HotCRP
- Format centers on mentoring and small-group feedback on submitted papers; registration was free in 2024
- 2024 general chairs from Oberlin College and Brigham Young University
- Not held with SOUPS 2025 or SOUPS 2026
- Not listed in CORE ICORE2026 or the CCF list
