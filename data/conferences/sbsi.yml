notes:
- Main Brazilian information systems symposium of the Brazilian Computer Society (SBC), held since 2004; 23rd
  edition in 2027
- Proceedings (Anais) published open access in the SBC OpenLib (SOL); extended abstracts in separate Anais Estendidos
- Double-blind review; 67 full papers accepted out of 292 submissions in 2026 (about 23%)
- Held in a different Brazilian city each year (Vitória 2026, Campo Grande 2027)
- Not ranked in CORE ICORE2026
