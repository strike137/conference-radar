notes:
- Engineering and computing education conference held every year since 1971, co-sponsored by the IEEE Education Society, IEEE Computer Society and ASEE ERM Division
- CORE C (ICORE2026)
- Peer-reviewed proceedings published in IEEE Xplore; papers must be presented in person
- Two-stage submission, an extended structured abstract first, then a preliminary paper and a revised paper; double-anonymous review
- Full papers up to nine pages and work-in-progress papers up to five pages, in innovative practice, research to practice and research categories
- Also accepts workshops, special sessions and panels through a separate alternative session track
- Mostly held in the USA with some editions in Europe (Uppsala 2022, Paphos 2026)
