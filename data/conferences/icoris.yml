notes:
- Indonesian conference hosted by a different university each year; IndoCEISS listed as supporter up to 2025; IEEE Indonesia Section logo shown as sponsor
- Proceedings in IEEE Xplore; the site says the 2019 to 2025 proceedings are in IEEE Xplore and Scopus about three months after the event
- Only accepted and presented papers (onsite or online) go to IEEE Xplore
- Three tracks (signal processing and analysis; computing and processing; communication, networking and broadcasting)
- Hybrid format
- "Hosts: ITB STIKOM Bali 2019, Universitas Klabat 2020 (virtual), Universitas Dipa Makassar 2021, Universitas Potensi Utama Medan 2022, ISB Atma Luhur 2023, Universitas Sahid Surakarta 2024, Universitas Bumigora 2025, Universitas Teknologi Bandung 2026"
- Submission deadline is usually extended
- Not the IEEE CIS conference (IEEE International Conference on Cybernetics and Intelligent Systems, see ieee-cis-ram)
- Not listed in the ICORE2026 portal or the CCF 2026 list
