notes:
- Serbian telecommunications and microwave conference held in odd years at the Faculty of Electronic Engineering,
  University of Niš
- Technically co-sponsored by IEEE MTT-S, IEEE AP-S and IEEE Region 8
- Topics range from wireless, optical and satellite systems and networking to antennas, RF and microwave
  engineering, computational electromagnetics and AI for communications
- Regular papers up to 4 pages (invited papers up to 10) via EasyChair; accepted and presented papers go to IEEE
  Xplore and Scopus
- The 2025 paper deadline was moved twice (first call 2025-05-15, then 2025-06-15, finally 2025-08-01)
- Not listed in the CORE ICORE2026 portal
