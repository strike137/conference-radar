notes:
- Software development conference run by Trifork under the GOTO brand, held since 1997; 2027 is the 30th year
- Held at TAP1, Copenhagen, Denmark; two days of masterclasses at venues around the city followed by three conference days
- No open call for papers; every talk is picked by the GOTO program committee and there are no sales pitches from the stage
- Sponsorship page cites more than 1200 on-site team leads, architects and developers
- No papers or proceedings; talks are recorded and published on the GOTO YouTube channel
- Sister events include YOW! in Australia
