notes:
- Conference for doctoral students in computing, electrical and industrial engineering; the first author of each paper must be a PhD student
- Run by the Department of Electrical and Computer Engineering, NOVA School of Science and Technology, Caparica (Lisbon), Portugal
- Proceedings in the Springer IFIP AICT series; previous editions indexed in Scopus, Web of Science and DBLP
- Double-blind review on the full paper; a short abstract is submitted first to check scope
- Regular papers on ongoing PhD work (12 pages) and finished thesis overview papers (16 pages); each paper must relate the work to the yearly theme
- Held annually since 2010 (editions 2010 to 2026)
- Not listed in the ICORE2026 CORE ranking
