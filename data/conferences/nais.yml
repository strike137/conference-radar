notes:
- Symposium of the Norwegian AI Society, a meeting place for AI researchers in Norway and Scandinavia; held at a Norwegian university (Trondheim 2019, Oslo 2022, Bergen 2023, Tromso 2025)
- In some years NAIS runs the Scandinavian Conference on AI (SCAI) with the other Scandinavian AI societies instead (2024 Jonkoping, 2026 Odense), so there is no NAIS symposium every year
- Proceedings in CEUR-WS (2023, 2025), earlier in Springer; approved as a level 1 publication channel in Norway
- Single-blind review; full papers up to 10 pages plus bibliography, position papers up to 5 pages (2025)
- "NAIS 2025: 9 of 23 submitted papers accepted (5 full, 4 position papers), CEUR-WS Vol-3975"
- Small and student-friendly; 2025 regular fee 2300 NOK including the dinner
- Not listed in CORE ICORE2026 and not on the CCF list
