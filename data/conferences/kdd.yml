notes:
- ACM SIGKDD flagship data mining conference; proceedings in ACM DL; CCF A, CORE A*
- 'Two submission cycles per year: a July/August deadline and a February deadline, with a Resubmit decision between
  cycles'
- KDD 2026 was held in Jeju, Korea; KDD 2027 goes to San Jose, USA (Aug 1 to 5, 2027)
- Double-blind review on OpenReview; research track acceptance around 20%; max 7 research submissions per author
  per cycle (2027)
- Separate Applied Data Science (ADS), Datasets and Benchmarks, and AI for Sciences tracks
