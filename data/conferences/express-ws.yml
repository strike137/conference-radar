notes:
- Workshop co-located with ISSTA; 1st edition in Trondheim 2025 (with ISSTA/FSE), 2nd in Oakland 2026 (with SPLASH/ISSTA)
- Not to be confused with the older EXPRESS/SOS concurrency theory workshop
- Topics are explainability, dependability and trustworthiness of software and AI agent systems, testing and verification
- Full papers up to 8 pages, work-in-progress and industry or tool papers up to 4 pages, references excluded; double-blind
- Accepted full papers are published in ACM proceedings; short papers may opt out of ACM publication
- Organizers mostly from Chinese universities and industry labs
- Not listed in the CORE ICORE2026 portal
