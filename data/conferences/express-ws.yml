organizer: EXPRESS steering committee (Kunlunxin / UNSW Sydney, Tsinghua University, UNSW Sydney, NIO); ACM SIGSOFT sponsored proceedings in 2026
organizer_country: [china, australia]
proceedings: ACM DL
archival: true
