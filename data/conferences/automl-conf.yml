notes:
- Annual conference on automated machine learning (hyperparameter optimization, NAS, meta-learning, AutoML systems)
- Proceedings in PMLR (2025 -> volume 293 with 25 papers)
- Two parallel tracks on equal footing, Methods (double-blind) and ABCD for applications, benchmarks, challenges and datasets (single-blind by default)
- At least three reviewers plus one reproducibility reviewer per paper; no rebuttal phase
- 9-page main paper limit; also late-breaking abstracts and hot-off-the-press tracks
- Location rotates (New York 2025, Ljubljana 2026)
- Not listed in the ICORE2026 portal or the CCF list
