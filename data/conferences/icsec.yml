notes:
- Thailand's long-running international CS and CE conference (29th in 2025), backed by the IEEE Thailand Section
  with a different host university each year
- City changes every year (2023 Samui, 2024 Khon Kaen, 2025 Chiang Mai, 2026 Hua Hin)
- Double-blind review by three reviewers (2025); submission via EDAS; IEEE Xplore proceedings; 4 to 6 pages IEEE format
  (2026)
- '2026 used three submission rounds (Jul 31, Sep 5, Sep 30)'
- 2024 used two submission rounds and a hybrid format; 2025 was co-located with JCSSE 2025, the IEICE Internet Architecture
  (IA) workshop and an IEEE R10 meeting
- Broad scope including AI, networks and cybersecurity
