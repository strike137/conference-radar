  website: https://www.academic-conferences.org/conferences/icair/
notes:
- Run by ACPI, a commercial academic conference organizer (also runs ICCWS and ECCWS)
- Covers AI from machine learning to its social, ethical and business impact; attracts social scientists as well as computer scientists
- Formerly ECIAIR (editions as ECIAIR up to 2024, Lisbon)
- Abstract-first submission, then full paper under double-blind review
- Proceedings open access with ISSN and ISBN; submitted for Web of Science CPCI listing
- Held in Europe (Lisbon 2024, Genoa 2025, DFKI Kaiserslautern 2026); hybrid participation possible
