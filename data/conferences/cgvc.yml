notes:
- Annual UK computer graphics, visualization and visual computing conference run by the Eurographics UK Chapter; Eurographics supported since the first edition in 1983 (44th edition in 2026)
- Papers are published in the Eurographics Digital Library after expert review
- Full papers 4 to 8 pages plus references, short papers up to 4 pages, posters as 2-page extended abstracts
- Authors choose single- or double-blind review
- Held at a different UK university each year (Aberystwyth 2023, City London 2024, Liverpool John Moores 2025, Nottingham 2026)
- Usually in September; the 2026 edition moved to June to co-locate with EuroVis in Nottingham
- Not listed in the ICORE2026 portal and not on the CCF list
