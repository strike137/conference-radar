notes:
- One-day workshop co-located with ACM SIGSPATIAL since 2022 (Seattle 2022, Hamburg 2023, Atlanta 2024, Minneapolis 2025, Riverside 2026)
- Bridges industry and academia on geospatial big data and AI; organized largely by Amazon researchers with academic co-chairs
- Proceedings of each edition in the ACM Digital Library (GeoIndustry 2025 -> DOI 10.1145/3764919)
- Regular papers 8-10 pages, short papers 4 pages; ACM format; at least one author must register and present
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
