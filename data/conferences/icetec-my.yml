  conference_months: [12]
links:
  website: https://icetec.utem.edu.my/
notes:
- Run by UTeM FTKEK, technically co-sponsored by the IEEE Malaysia ComSoc/VTS Joint Chapter
- ICETEC 2026 is held in Melaka, Malaysia, in hybrid mode; no earlier editions are listed on the site
- Accepted papers to be submitted to IEEE Xplore, expected Scopus indexing
- Covers 5G/6G and wireless, RF and embedded electronics, AI and IoT, smart mobility
- 4 to 6 page papers via EDAS; 40 USD per extra page
- Submission deadline extended several times (2026 moved from September 15 to October 31)
- Not listed in ICORE2026 or the CCF list
