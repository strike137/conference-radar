organizer_country: [malaysia]
proceedings: IEEE Xplore
archival: true
indexing: [Scopus]
fee: 350 USD IEEE member, 400 USD non-member, 250 USD IEEE student (2026, international, physical); virtual 150 to 300 USD
typical:
