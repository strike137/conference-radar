notes:
- Workshop on LLM-based language agents, generative models and conversational AI for information retrieval and recommender systems
- First edition co-located with ACM SIGIR 2025 in Padua, Italy, on July 17, 2025; builds on the ROEGEN workshop at RecSys 2024
- Full papers up to 9 pages, short papers up to 4 pages and extended abstracts of 2 to 3 pages, ACM two-column format, double-blind review
- The CFP said papers would appear in CEUR-WS or a similar open-access venue; accepted papers are posted as PDFs on the workshop site and no CEUR-WS volume was found
- Selected papers may be invited to a journal special issue
- Not listed in ICORE2026 and not on the CCF list
