id: iccee
name: ICCEE
full_name: International Conference on Computer and Electrical Engineering
type: conference
tier: minor
areas: [general, communications]
region: asia-pacific
language: english
frequency: annual
organizer: Commercial conference secretariat (academic.net contact, iconf.org submission system) co-sponsored by the Singapore Institute of Electronics (SIE) and a host university
organizer_country: [china]
proceedings: IOS Press ATDE (2025 and 2026); IOP Journal of Physics Conference Series (2017 to 2024)
archival: true
indexing: [EI, Scopus]
fee: 650 USD per full paper (2027, regular; 580 USD student); presentation only 420 USD
typical:
  deadline_months: [12]
  conference_months: [6]
links:
  website: https://www.iccee.org/
notes:
- Annual since 2008; 2027 is the 20th edition
- Held worldwide from 2008 to 2019 (Dubai, Paris, Tokyo, Delft, ...); recent onsite editions are in Asia and Oceania (Xi'an 2023, Singapore 2025, Brisbane 2026, Canberra 2027) and 2020 to 2024 are described as virtual on the home page
- Proceedings in IOS Press Advances in Transdisciplinary Engineering for 2025 and 2026 and in IOP Journal of Physics Conference Series before that, stated as EI Compendex and Scopus indexed
- The 2027 proceedings publisher is not named on the site
- "ICCEE 2025: 98 submissions, 57 papers and abstracts accepted, 28 full papers published"
- Run by a commercial secretariat (+86 phone number); abstract only presentation without publication is also offered
- Not listed in the CORE ICORE2026 portal
