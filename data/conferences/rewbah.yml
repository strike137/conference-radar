notes:
- Workshop on requirements engineering for software that supports healthcare, well-being, healthy lifestyles and aging populations
- Multidisciplinary audience from requirements engineering, medicine, health sciences and psychology
- Held with IEEE RE every year since 2020 (1st edition proceedings in IEEE Xplore); 6th edition in Valencia 2025, 7th in Montreal 2026
- Accepted papers are published in the IEEE Xplore Digital Library as workshop proceedings
- Long papers 8-10 pages and short vision papers 4-6 pages including references, IEEE CS format, double-blind review by three PC members
- Pronounced roo-bah
- Not listed in the CORE portal (ICORE2026)
