notes:
- Workshop of IEEE COMPSAC (IEEE Computer Society); 18th edition in 2026, 17th at COMPSAC 2025 in Toronto
- Covers security of service-oriented systems, cloud/edge/IoT, blockchain platforms and secure systems design
- Co-chaired by Nadia Bennani (INSA Lyon, France) and Stelvio Cimato (Universita degli Studi di Milano, Italy)
- Not listed in the CORE portal; COMPSAC itself is CORE B
- Workshop papers are 6 pages (up to 2 extra pages at USD 125 each) and appear in the COMPSAC proceedings on IEEE Xplore
- Workshop deadlines are shared across all COMPSAC workshops; the 2027 workshop list (COMPSAC 2027 in Tokyo, July 13 to 16) was not yet published
