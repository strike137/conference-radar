notes:
- Organized by IFCA; focus on blockchain, DeFi, payments and applied cryptography for commerce
- Traditionally held at island venues, often in the Caribbean (2025 Miyakojima, Japan; 2026 St. Kitts; 2027 Barbados)
- Double-blind; regular (15 pages), short (8 pages) and SoK (20 pages) papers; proceedings in Springer LNCS
- Several co-located workshops (for example WTSC, DeFi, CoDecFin, Voting) with separate proceedings; student grants
  offered
- 'Paper deadline was extended in recent years (2026: by 4 days; 2027: by 7 days)'
