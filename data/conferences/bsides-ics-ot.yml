notes:
- Community Security BSides conference on ICS/OT (industrial control systems and operational technology) security in the USA
- Held each year since 2025 on the day before the S4 ICS security conference, modeled on how the first BSides ran alongside Black Hat
- Founded by Mike Holcomb, an OT/ICS cybersecurity educator and consultant
- The 2026 edition was in Miami; the 2027 edition is announced for Tampa, FL
- Not the same event as BSides ICS Downunder or other regional BSides ICS/OT events
- No proceedings; talks only
