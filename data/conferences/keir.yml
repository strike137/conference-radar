links:
  website: https://keir-workshop.github.io/
notes:
- Workshop on augmenting retrieval and LLM-based systems with external knowledge (RAG, knowledge graphs, agents)
- Editions at ECIR 2024 (Glasgow), ECIR 2025 (Lucca) and CIKM 2026 (Rome)
- 2024 edition was non-archival; 2025 and 2026 papers can go into a Springer LNCS post-proceedings volume (2025 -> LNCS 16086)
- Publishing in LNCS is optional; authors can keep the paper non-archival
- Double-blind review; half-day, in-person workshop in 2026
- "Acceptance rate: 47% (2026, 15 of 32 submissions)"
- Not listed in ICORE2026 or the CCF list
