frequency: annual
organizer: KEIR organizing committee (University of Bologna, University of Glasgow and others), co-located with ECIR or CIKM
organizer_country: [international]
proceedings: Springer LNCS (revised post-proceedings, opt-in)
archival: true
acceptance_rate: 47% (2026, 15/32)
typical:
