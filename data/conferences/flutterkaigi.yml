notes:
- Technical conference in Tokyo focused on Flutter and Dart (cross-platform mobile and app development), run by
  the volunteer FlutterKaigi Executive Committee since 2021
- 2026 edition held over two days at Hamamatsucho Convention Hall, Tokyo; 2025 was one day at Otemachi PLACE Hall
  & Conference
- Talks chosen from a call for speakers on Sessionize; 30-minute sessions in Japanese or English, 10-minute
  lightning talks, and a beginners' LT track for students and engineers with under 3 years of experience
- Up to 3 proposals per person; speakers must present on site; sessions translated or interpreted between
  Japanese and English
- Scholarship program for attendees; sessions recorded and published on YouTube
- No papers or proceedings; talks only
