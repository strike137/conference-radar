notes:
- Organized by IARIA as part of the InfoSys congress, co-located with ICNS and other IARIA events (4th edition in 2027)
- Covers AI applied to health, such as predictive analytics, precision medicine and deep learning for medical data
- Started in 2024 (Athens); published open access in the IARIA ThinkMind library; prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Greece, Portugal, Spain and Italy so far (Athens, Lisbon, Valencia, Venice)
- Onsite and online participation options
