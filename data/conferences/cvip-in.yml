id: cvip-in
name: CVIP
full_name: International Conference on Computer Vision and Image Processing
type: conference
tier: minor
areas: [vision, ai]
region: south-asia
language: english
frequency: annual
organizer: CVIP steering committee with a host institute in India (IIT Ropar in 2025, NIT Calicut with NTNU Norway in 2026), endorsed by IAPR
organizer_country: [india]
proceedings: Springer CCIS
indexing: [Scopus, DBLP, EI]
fee: INR 10,620 / USD 300 student, INR 12,980 / USD 400 faculty (2025, early bird, non IAPR/IUPRAI member, incl. GST)
typical:
  deadline_months: [5, 8]
  conference_months: [11, 12]
links:
  website: https://cvip2026.nitc.ac.in/
notes:
- Indian computer vision conference held at a different Indian institute each year (IIT Roorkee, IIITDM Jabalpur, MNIT
  Jaipur, IIIT Allahabad, IIT Ropar, VNIT Nagpur, IIT Jammu, IIITDM Kancheepuram); 10th edition in 2025
- Proceedings in Springer CCIS (Communications in Computer and Information Science), indexed in Scopus and EI
- Two submission rounds per year (May and August in 2025); papers up to 15 pages in Springer format, extra pages charged
- Not listed in ICORE2026 or in the CCF list; smaller than ICVGIP, the IUPRAI flagship
- At least one author must register and present for the paper to appear in the proceedings
- 2026 edition (11th) at NIT Calicut, Kerala; proceedings announced as Springer LNCS or CCIS
