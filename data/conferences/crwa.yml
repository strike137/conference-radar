language: english
frequency: annual
organizer: Workshop organizers led by CSIRO Data61 (2026 with University of Manchester, Princeton and UCL); affiliated
  event of IACR Asiacrypt
organizer_country: [australia, europe, usa]
proceedings: None
archival: false
typical:
  deadline_months: [10]
  conference_months: [12]
links:
  website: https://crwa.site/
notes:
- One-day workshop affiliated with Asiacrypt; location follows Asiacrypt (2025 Monash University, Melbourne; 2026 PolyU,
  Hong Kong)
- First edition in 2025; 2026 is the second edition
- Topics are cryptography for tokenized real-world assets, CBDCs, stablecoins, proof of reserve, ZK, MPC and FHE for
  finance, and post-quantum security for long-lived assets
- Non-archival with no formal proceedings; accepted talks are listed on the workshop website
- 2026 accepts short abstracts (up to 3 pages excluding references) or full papers, including published work and
  work in progress; submission through HotCRP
- 2025 asked for blind-refereed papers in Springer LNCS format (recommended 15 pages plus references)
- Registration goes through Asiacrypt; workshop-only rates are lower than conference rates
- Not listed in ICORE2026
