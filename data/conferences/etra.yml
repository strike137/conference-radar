notes:
- ACM symposium on eye tracking across HCI, graphics, vision, perception and cognition; co-sponsored by SIGCHI and SIGGRAPH
- Full papers appear as journal articles in a special issue of PACM HCI or PACM CGIT (authors choose); short papers in the ETRA proceedings in the ACM DL
- CORE B (ICORE2026); not on the CCF list
- Full papers have two review rounds with a revision step; short papers have a single round about three months later
- Mandatory abstract one week before the paper deadline; a privacy and ethics statement is required
- ACM Open Access APC applies to full and short papers for authors from non-ACM Open institutions
- Location rotates worldwide (Tubingen 2023, Glasgow 2024, Tokyo 2025, Marrakech 2026, Pamplona 2027)
