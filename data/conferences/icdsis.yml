id: icdsis
name: ICDSIS
full_name: International Conference on Data Science and Information System
type: conference
tier: minor
areas: [data, ai, general]
region: south-asia
language: english
frequency: irregular
organizer: Department of Computer Science and Engineering, Malnad College of Engineering, Hassan
organizer_country: [india]
proceedings: IEEE Xplore
archival: true
fee: Indian authors 5,000 to 8,500 INR; foreign authors 150 USD (IEEE member) or 250 USD (2027)
typical:
  deadline_months: [10]
  conference_months: [1]
links:
  website: https://icdsis.in/
notes:
- Run by the CSE department of Malnad College of Engineering, Hassan, Karnataka, India
- Previous editions in 2022, 2024 and 2025; the 4th edition is in January 2027
- Accepted and presented papers are submitted to IEEE Xplore; earlier editions appear there
- Double-blind review via Microsoft CMT; papers 4 to 8 pages, extra fee after 6 pages
- In-person presentation required (IEEE no-show policy)
- Broad computer science and engineering scope despite the data science name
- Not listed in ICORE2026 or the CCF 2026 list; a small regional venue
