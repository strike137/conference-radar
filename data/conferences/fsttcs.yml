notes:
- Held every December since 1981 at a rotating Indian host institution; organized by IARCS in association with ACM
  India; described by its organizers as the premier international computer science conference in India
- Proceedings in LIPIcs (open access, CC-BY) since 2008; Springer LNCS from 1984 to 2007
- 'Two tracks: Track A (algorithms, complexity, cryptography, learning theory) and Track B (logic, automata, formal
  methods, programming languages, verification)'
- Double-blind review with a rebuttal phase; papers up to 15 pages in LIPIcs style plus optional appendix
- At least one author must present in person for the paper to appear in the proceedings
- Pre- and post-conference workshops and tutorials around the main conference
- Ranked CCF C (theory) and National India in ICORE2026; well regarded in the theory and formal methods community
