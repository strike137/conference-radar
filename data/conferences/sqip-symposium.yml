notes:
- Practitioner symposium on software quality run by JUSE under its SQiP brand; describes itself as one of the largest software quality events in Japan
- Two submission categories, experience papers (up to 8 pages, A4) and experience presentations (slides only), both selected by peer review of an abstract
- Japanese submissions and talks only; 30 minute slots (25 minutes talk, 5 minutes questions)
- Held online in 2025 and 2026, streamed from JUSE in Tokyo, with half-day tutorials before the main conference (the day before in 2026, a week before in 2025)
- Accepted papers and slides are posted on the participants page and later on the public symposium site; no formal proceedings
- "2026 final report: 2,468 registered participants from 151 companies, submissions were 13 experience papers and 18 experience presentations"
- Awards for best paper or report (Effective and Future) and best presentation (by audience vote)
- High fees aimed at company attendees; company-wide flat rate registration available
