notes:
- One-day event co-located with ACM FSE (Montreal 2026, Trondheim 2025, Porto de Galinhas 2024, San Francisco 2023);
  listed as a workshop here although it calls itself a conference
- Papers published in the ACM Digital Library within the International Conference Proceedings Series (ICPS)
- Predictive models, AI and data analytics for software engineering; encourages sharing datasets and replications
- Technical papers up to 10 pages; industrial and new idea or extended abstract papers up to 4 pages
- Double-blind review (data papers may opt for single-blind); at least one full-rate registration and in-person
  presentation per paper
- Not listed in ICORE2026 (portal search returns no results) or the CCF list
