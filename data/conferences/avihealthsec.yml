notes:
- Workshop of ARES (International Conference on Availability, Reliability and Security), held in Europe every summer
- For ARES 2026 the two workshops SecHealth (healthcare security) and SecAviation (security in aviation) were merged
  into AviHealthSec
- Submission guidelines are the same as for the ARES conference; ARES 2026 and its workshop papers are published in
  Springer LNCS, workshop papers up to 18 pages including references
- Topics include medical device security, AI security in healthcare, compliance and data sharing, aviation security,
  resilience of critical infrastructures and human factors
- Chairs from the Norwegian Computing Center, NTNU, the German Aerospace Center (DLR) and German universities of
  applied sciences (Ingolstadt, Nuremberg, Brandenburg)
- Not listed in CORE ICORE2026
