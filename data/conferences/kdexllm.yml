notes:
- Workshop on LLMs for knowledge base and database tasks (data cleaning, query processing, tuning) and on databases and knowledge bases for LLMs (RAG, vector data, data preparation), held with IEEE ICDE, so it moves with ICDE
- Started as DExLLM (Data Engineering Meets Large Language Models) at ICDE 2025 in Hong Kong (May 19, 2025, at PolyU); renamed KDExLLM for ICDE 2026 in Montreal
- Papers up to 10 pages including references, IEEE conference template, no appendix; double-blind review on Microsoft CMT
- ICDE 2026 call for workshops says workshop proceedings are published jointly alongside the conference proceedings
- Half-day workshop; 5 oral papers, one keynote and one industry talk in 2026
- Not listed in CORE ICORE2026 or in the CCF 2026 list
