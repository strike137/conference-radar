id: aiotc
name: AIoTC
full_name: International Conference on Artificial Intelligence, Internet of Things and Cloud Computing Technology
type: conference
tier: minor
areas: [ai, networking, systems]
region: china
language: english
frequency: annual
organizer: AEIC (AiScholar) conference service with a host university each year (Nanchang University in 2026)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 545 USD or 3800 CNY per 4-page paper (2026, regular); 515 USD student; 55 USD per extra page
typical:
  deadline_months: [5]
  conference_months: [7, 8]
links:
  website: https://www.icaiotc.net/
notes:
- Annual since 2022; held in China (online 2022, Nanjing 2023, Wuhan 2024, Guilin 2025, Nanchang 2026)
- 2026 had two venues -> Nanchang, China (Jul 17-19) and a joint session with ECPDC and AANN at SUTD, Singapore (Aug 7-9)
- Run by a commercial conference service (AEIC/AiScholar) with a Chinese host university each year
- Accepted papers are published by IEEE and submitted to IEEE Xplore, EI Compendex and Scopus
- Each paper is reviewed by two or three committee members; presenter-only option without publication
- Not listed in CORE ICORE2026 or the CCF list
