notes:
- Workshop on theory, methods and applications of probabilistic inference and generative models for structured data (graphs, 3D, time series, text, video, science)
- Held at ICML 2023, ICML 2024, NeurIPS 2025 (3rd) and ICML 2026 in Seoul (4th)
- 4 to 8 page papers in the host conference template, double-blind review on OpenReview
- Papers already published in journals or non-ML venues are welcome; papers from ML venues only with substantial extensions
- Accepted papers presented as posters, some as contributed talks
- Not listed in ICORE2026 and not on the CCF list
