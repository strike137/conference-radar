notes:
- Three-day conference for software developers in Sydney, run by NDC Conferences Australia Pty Ltd, part of the NDC conference family (NDC Oslo, NDC London, NDC Security and others)
- 2026 edition at Hilton Sydney with 65 conference sessions, 50 speakers and 5 workshops
- Talks cover .NET, AI, architecture, cloud, DevOps, security, web and work skills; 60 minute talks in five parallel rooms
- No papers or proceedings; NDC talks are recorded and published on the NDC Conferences YouTube channel
- Not listed in CORE ICORE2026
