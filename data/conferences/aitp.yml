notes:
- Small conference on AI and machine learning for automated and interactive theorem proving, autoformalization and formal mathematics
- Held every year at the CNRS Paul-Langevin conference center in Aussois, Savoy, France (Obergurgl, Austria in some early years)
- Contributed talks selected from 2-page extended abstracts; abstracts are non-archival and appear in an informal book of abstracts
- Week-long in-person meeting; accommodation and food cost about 650 EUR for five days (2026)
- Organized by Georges Gonthier (INRIA), Cezary Kaliszyk (University of Melbourne) and Josef Urban (CTU Prague)
