notes:
- Community workshop of the Zeek open source network security monitor (formerly Bro); successor of BroCon and ZeekWeek
- Two days, talks on deployment and real-world use cases on day one and hands-on training on day two
- "Recent editions: Munich (Feb 2025), CERN Geneva (Mar 2026), Berkeley (Sep 2026), CERN Geneva (Mar 2027)"
- Attendance free but space limited; training seats capped (35 at CERN 2027)
- Zeek is supported by Corelight as custodian; previously headquartered at ICSI in Berkeley
- Talks only, no proceedings; recordings posted for some editions
