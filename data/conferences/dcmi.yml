notes:
- Annual conference on metadata, linked data, knowledge organization and metadata for AI; 26th edition in 2026, listed as DC in CORE
- Run by DCMI, a project of the US nonprofit ASIS&T, usually with a host library or university
- Open-access proceedings on DCPapers with DOIs, indexed by Scopus and DBLP; online before the conference
- 'Submission types: full papers 8-10 pages, short papers 4-5 pages, plus panels, workshops, posters, project reports, tutorials and a student forum'
- DCMI 2026 was in person only; at least one author of an accepted submission must attend in person
- 'Recent hosts: virtual (2020 to 2022), Daegu (2023), Toronto (2024), Barcelona (2025), Seoul (2026)'
- CORE C (ICORE2026, as DC); not on the CCF 2026 list
