notes:
- Broad EE and computing conference run by the IEEE Jordan Section, held in Amman; 8th edition in 2026
- Held as AEECT in 2011, 2013, 2015 and 2017 and, with the Jordan Engineers Association, as JEEIT in 2019, 2021 and 2023
- Tracks on communications and networks, data science and AI, cybersecurity, electronics, power and smart grids, biomedical engineering, control and robotics
- Presented papers are submitted to IEEE Xplore (IEEE conference record 69724 for 2026); full-paper review by at least three reviewers
- Not listed in CORE ICORE2026
