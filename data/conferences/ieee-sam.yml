notes:
- IEEE Signal Processing Society workshop run under its Sensor Array and Multichannel (SAM) technical committee; held every two years
- Topics include array processing, MIMO, radar, ISAC and multichannel signal processing for communications
- Proceedings in IEEE Xplore and EI-indexed; full papers are 4 pages of content plus 1 page of references
- SAM 2026 (14th edition) was held at the Westin Shenzhen Nanshan, China, with tutorials on 13 July and a best student paper award
- Not listed in the CORE ICORE2026 ranking
