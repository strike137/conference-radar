notes:
- Held annually with ECOOP since 1999; named Formal Techniques for Java-like Programs until 2024 (CORE still lists
  it under that name)
- Formal methods, semantics, type systems, verification and program analysis for modern languages (Java, C#, Rust,
  Scala, ...)
- 2026 papers published in the ACM Digital Library (authors may opt out); 2025 papers went to Journal of Object
  Technology as post-proceedings
- Full papers up to 12 pages and short papers up to 6 pages, excluding references; single-blind review
- CORE C (ICORE2026, as Workshop on Formal Techniques for Java-like Programs); not on the CCF list
