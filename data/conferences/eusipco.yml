notes:
- Flagship conference of EURASIP; held every year in a European city (Dublin 2021, Belgrade 2022, Helsinki 2023, Lyon 2024, Palermo 2025, Bruges 2026)
- Accepted papers appear in IEEE Xplore and open access on the EURASIP website; authors keep copyright
- Five-page papers (references included), single-blind review
- Not listed in the CORE ICORE2026 portal; regarded as the main European general signal processing venue
- Also has a journal paper track (papers already published in journals presented at the conference)
