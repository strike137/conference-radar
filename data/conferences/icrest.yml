notes:
- Run by the Faculty of Engineering at AIUB, a private university in Dhaka, Bangladesh; held every two years in January (2019, 2021, 2023, 2025, 2027)
- Technically sponsored by the IEEE Bangladesh Section; IEEE conference record number 72895
- Accepted and presented papers are submitted for inclusion in IEEE Xplore subject to scope and quality checks
- Selected papers are invited to a special issue of the AIUB Journal of Science and Engineering (AJSE)
- Broad EEE and CS scope (antennas, communications and signal processing, photonics, AI and ML, power and energy, robotics and control, biomedical)
- Double-blind review via Microsoft CMT; papers 4 to 6 pages in IEEE two-column format, extra charge beyond 5 pages
- 4th edition (2025) accepted 81 papers with 365 authors from 7 countries
- "Registration 2027: 400 USD foreign non-IEEE author, 340 USD foreign IEEE member author"
- Not found in ICORE2026
