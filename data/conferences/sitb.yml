id: sitb
name: SITB
full_name: Symposium on Information Theory and Signal Processing in the Benelux
type: conference
tier: minor
areas: [communications, networking]
region: europe
language: english
frequency: annual
organizer: WIC (Werkgemeenschap voor Informatie- en Communicatietheorie) and IEEE Benelux Signal Processing Chapter
organizer_country: [europe]
proceedings: Online proceedings with ISBN on the WIC website (optional full paper or abstract)
archival: false
typical:
