links:
  website: https://www.w-i-c.org/events.html
notes:
- Annual two-day symposium of the WIC, the Benelux community for information and communication theory, held since 1980
  (46th edition in 2026)
- Topics cover information theory, coding, wireless and sensor networks, cryptography, signal processing, ML for signal
  processing, biometrics, IoT and localization
- Submission is a one-page abstract; each accepted abstract gets an oral or poster presentation
- On request a full paper or the abstract appears in the online proceedings on the WIC site; authors may opt out, and
  work under review elsewhere may be submitted, so it works as a non-archival regional forum
- Hosted by a different Benelux university each year (Brussels 2023, Delft 2024, Boekelo 2025, Ghent 2026)
- Mostly PhD students from Belgium, the Netherlands and Luxembourg; best student paper, presentation and poster awards
- "Registration fee: 250 EUR (2026), including lunches, conference dinner and social event; three grants for MSc students"
- Not listed in CORE ICORE2026 or in the CCF 2026 list
