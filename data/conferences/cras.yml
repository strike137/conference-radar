links:
  website: https://cras-eu.org/
notes:
- European meeting on computer and robot assisted surgery, started as a workshop in 2011; 15th edition in 2026
- Submissions are 2-page extended abstracts, peer reviewed (CMT in 2026, EasyChair in 2025)
- Proceedings are a self-published open-access PDF on the website (2025 volume password protected), so non-archival
- Selected authors are invited to journal special issues (2026, Magnetic Medicine and Advanced Robotics Research)
- Held in a different European city each year (Paris 2023, Odense 2024, Lisbon 2025, Leeds 2026), usually in September
- 2026 hosted the CoSuR Summer School on Control of Surgical Robots
- Not listed in CORE ICORE2026 or the CCF 2026 list
