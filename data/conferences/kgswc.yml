id: kgswc
name: KGSWC
full_name: International Knowledge Graph and Semantic Web Conference
type: conference
tier: minor
areas: [data, ai]
region: europe
language: english
frequency: annual
organizer: KGSWC general chairs (Universidad Autonoma de Tamaulipas, Mexico; Sharda University, India and TIB Hannover), with ShodhGuru Research Labs (India) as technical sponsor
organizer_country: [india, other]
proceedings: Springer LNCS
archival: true
typical:
  deadline_months: [8]
  conference_months: [11]
links:
  website: https://kgsw.org/
notes:
  - Conference series on knowledge graphs and semantic web research; 2026 is the 8th edition, held in hybrid mode
  - Proceedings in Springer LNCS under the title Knowledge Graphs and Semantic Web (about 20 to 25 papers per volume)
  - Started in 2019 as an Ibero-American conference (Villa Clara, Cuba), later Mexico (2020) and Kingsville, TX, USA (2021)
  - "Recent hosts: Madrid (2022), Zaragoza (2023), Paris (2024), Leipzig (2025), Belgrade (2026)"
  - Full papers 12 to 15 pages, short papers 6 to 8 pages, double-blind review with at least three reviewers, EasyChair
  - Not listed in CORE ICORE2026; not on the CCF list
