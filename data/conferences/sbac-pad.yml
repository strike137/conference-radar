notes:
- Annual symposium on computer architecture, HPC applications and parallel and distributed systems, held since 1987
- Run by the Brazilian Computer Society (SBC) special committee CE-ACPAD and promoted with the IEEE Computer Society
- Proceedings published by IEEE and available in IEEE Xplore (an author must register at the full rate and present)
- Double-anonymized review with a rebuttal phase; six tracks; selected papers invited to a journal special issue
- CORE C; not on the CCF list
- Acceptance rate below 30% in recent years according to the 2026 site
- Alternates between Brazil and abroad (Porto Alegre 2023, Hilo 2024, Bonito 2025, Madrid 2026, Belem 2027)
- "Registration fee 650 EUR IEEE member, 780 EUR non-member, 455 EUR IEEE student member (2026, advance); SBC members pay the IEEE member rate"
- Main conference papers are limited to 10 pages excluding references; extra pages cost 100 EUR in total
