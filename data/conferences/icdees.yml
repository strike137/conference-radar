notes:
- Run by the Doctor of Computer Science Department of BINUS University, Jakarta
- IEEE conference record 71545; registered and presented papers are submitted to IEEE Xplore, no-show papers are not published
- 4 to 6 page papers in IMRaD format, double-blind review, similarity and AI similarity each capped at 15%
- Topics cover databases and integration, AI and decision support, IS analysis, enterprise architecture, data engineering, HCI and software engineering
- Very short cycle (about 5 days from submission deadline to notification in 2026)
- Not listed in ICORE2026 and not in the CCF list; a small regional venue
