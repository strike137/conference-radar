notes:
- Held every year since 2012 in a different Indonesian city (2024 Lombok, 2025 Padang, 2026 Manado); hybrid attendance
- Organized under IEEE ComSoc through its Indonesia Chapter; 2025 edition co-organized with the IEEE GRS/AES Indonesia
  Joint Chapter, technically co-sponsored by the IEEE Indonesia Section
- 'Five tracks: communications technology, networks and IT (incl. network management and security), satellite, broadband
  and photonics, data science and AI'
- 2026 has two submission batches; the Batch 2 deadline is Oct 18, 2026
- Submission via EDAS; proceedings in IEEE Xplore
