id: pcds
name: IEEE PCDS
full_name: IEEE International Conference on Privacy Computing and Data Security
type: conference
tier: minor
areas: [security, data]
region: asia-pacific
language: english
frequency: annual
organizer: Institute of Information Engineering (CAS), Xidian University, SJTU, HUST and BUPT
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
fee: 900 USD IEEE member, 1080 USD non-member (2026, advance full registration)
typical:
  deadline_months: [3, 4]
  conference_months: [8]
links:
  website: https://pcds.xidian.edu.cn/2026/
notes:
- Formerly the PriComp conference series (started 2015), renamed PCDS from 2024
- Co-organized by the Institute of Information Engineering (Chinese Academy of Sciences), Xidian University, SJTU,
  HUST and BUPT; steering committee led by Fenghua Li
- Accepted papers are submitted to IEEE Xplore; distinguished papers invited to World Wide Web Journal or Cyber
  Security and Applications
- Held mostly in Asia-Pacific (Haikou 2022, Portsmouth UK 2023, Fiji 2024, Hakodate 2025, Jeju 2026)
- Regular papers up to 8 pages in IEEE two-column format for review
- Not listed in ICORE2026 or the CCF recommended list
