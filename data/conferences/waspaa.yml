id: waspaa
name: WASPAA
full_name: IEEE Workshop on Applications of Signal Processing to Audio and Acoustics
type: conference
tier: minor
areas: [communications, nlp, ai]
region: north-america
language: english
frequency: biennial
organizer: IEEE Signal Processing Society (Audio and Acoustic Signal Processing Technical Committee)
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
fee: 920 USD non-member, 765 USD IEEE member, 470 USD student non-member (2025, advance rate; regular 1,150 / 1,020 / 625 USD)
typical:
  deadline_months: [4, 5]
  conference_months: [9, 10]
links:
  website: https://waspaa.com/
notes:
- Run by the Audio and Acoustic Signal Processing Technical Committee of the IEEE Signal Processing Society since
  1986; held every two years (odd years)
- Small workshop of two and a half days
- Held at the Mohonk Mountain House in New Paltz, NY for decades (2021 fully virtual); moved to Granlibakken Tahoe,
  Tahoe City, CA in 2025 and to Levi, Finland in 2027, the first WASPAA in Europe
- 4 pages of content plus an optional 5th page of references only; double-blind review with rebuttal, no arXiv
  blackout
- Authors sign the IEEE copyright form at camera-ready; one full registration covers up to 4 papers
- Not listed in CORE ICORE2026, but well regarded in the audio and acoustic signal processing community
