notes:
- Main venue for empirical software engineering; held as part of the Empirical Software Engineering International
  Week (ESEIW) together with the ISERN meeting, doctoral symposium (IDoESE) and tutorials (IASESE)
- Called the ACM/IEEE symposium up to 2025; the 2026 proceedings moved to Dagstuhl LIPIcs (open access)
- Technical track uses double-anonymous review with at least three reviews and a meta-review; 17 pages main content
  plus up to 3 pages for data availability and references (2026)
- Also has emerging results/vision, registered reports, industry (SEIP) and journal-first tracks
- Recent editions in Helsinki 2022, New Orleans 2023, Barcelona 2024, Honolulu 2025, Munich 2026; CORE A, CCF B
