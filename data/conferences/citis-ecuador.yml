notes:
- Run by Universidad Politecnica Salesiana in Guayaquil, Ecuador; annual since 2014 (2018 and 2019 merged into one edition)
- Broad engineering conference; tracks on AI, digital networks and cybersecurity, energy and smart cities, digital health, and agribusiness and bioeconomy
- Accepted papers published in Springer Lecture Notes in Networks and Systems (LNNS), indexed in Scopus
- Double-blind review; papers in English, 12 to 15 pages, at most two papers per author
- "Selective: 50 of 301 submissions accepted in 2025, 45 of 188 in 2024"
- Moved from June/July to late October in 2026; workshops on the two days before the main conference
- Not listed in the CORE ICORE2026 portal
