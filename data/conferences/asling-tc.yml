notes:
- Long-running conference on translation and language technology (MT, LLMs, terminology, CAT tools) for translators, language service providers, institutions and researchers; TC47 in 2026 is the 47th edition
- Run by AsLing, a non-profit association registered in Geneva, Switzerland, since 2014 (TC36)
- Held in London until 2019, online in 2020 and 2021, and at the European Convention Center Luxembourg since 2022 with support from the EU Publications Office
- Tracks for research (talk plus paper up to 5,000 words), user experience (optional paper), posters and short talks, workshops and panels; submission via START (softconf)
- Proceedings are self-published by AsLing with an ISBN (Editions Tradulex) and free to download; older volumes up to TC38 (2016) are in the ACL Anthology
- No TC conference in 2025 (TC46 in November 2024, TC47 in December 2026); AsLing held an online TCeXcellerate event in late 2025 instead
- Not listed in CORE ICORE2026 and not on the CCF list
