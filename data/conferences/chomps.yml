notes:
- Workshop on LLM hallucination detection and mitigation, focused on multilingual and precision-critical (medical, legal) settings
- 1st edition with IJCNLP-AACL 2025 in Mumbai, India, with a hallucination detection shared task
- Archival and non-archival papers up to 8 pages (long) or 4 pages (short), plus 1-page dissemination submissions
- Double-blind review via OpenReview; ARR commitments accepted
- Archival papers in the ACL Anthology (2025.chomps-main, 10 papers)
- Not listed in the CORE portal (ICORE2026)
