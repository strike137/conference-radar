notes:
- Main scientific meeting on computational processing of Portuguese and Galician (text and speech); held since 1993
  (first edition in Lisbon), now biennial
- Hosted alternately in Brazil and Portugal; Santiago de Compostela, Spain in 2024 and Salvador, Brazil in 2026
- Proceedings published by ACL in the ACL Anthology (2026 in two volumes, 116 + 41 papers)
- Full papers up to 8 pages plus 2 for references, short papers up to 4 plus 1; double-blind review with mandatory
  reviewing by co-authors
- Papers historically in English only; 2026 also accepted papers written in Portuguese
- Not listed in CORE ICORE2026
- "Registration 2026: 1,800 BRL professional non-SBC member, 450 BRL student non-SBC member (early bird)"
