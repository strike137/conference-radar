notes:
- First edition in 2027, a one-day workshop at the HiPEAC 2027 conference in Glasgow
- Teaching computer architecture and digital design with open-source SoCs, RISC-V, FPGA labs, verification and classroom tape-outs
- Three tracks; full papers (up to 10 pages) and short papers or experience reports (up to 6 pages) get double-blind review and go into the proceedings
- Talk or demo only contributions (1 to 2 page abstract) appear in the program but not in the proceedings
- Papers use the Dagstuhl OASIcs template and are published open access in the HiPEAC workshop proceedings by Schloss Dagstuhl
- Main output is a community roadmap for teaching with open hardware, drafted at a closing panel
- Not listed in ICORE2026 or the CCF 2026 list
