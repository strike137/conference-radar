notes:
- Held in India every December since 2011; strong in hardware security, side channels and cryptographic engineering
- Two submission cycles per year; double-blind review; LNCS format up to 20 pages including bibliography and appendices
- The 2026 call targets real-world security and privacy; purely theoretical crypto papers and papers mainly on blockchain
  or ML are discouraged
- Proceedings in Springer LNCS; recent editions ran a poster session for work in progress where the first author
  must be a student
- Not ranked by CORE and not on the CCF list
