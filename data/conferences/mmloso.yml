notes:
- Workshop on multimodal learning, NLP and AI for social good in low-resource and data-constrained settings
- First edition held with IJCNLP-AACL 2025 in Mumbai, India, on 2025-12-23
- Long (8 pages) and short (4 pages) papers, at least three reviewers each, submission via OpenReview
- Proceedings in the ACL Anthology (2025.mmloso-1)
- Includes a shared task and competition sponsored by the Ministry of Tribal Affairs, Government of India
- Three rounds of calls for papers in 2025 (deadlines October 3 after an extension from September 29, October 22 and October 28)
- Not listed in ICORE2026 and not on the CCF list
