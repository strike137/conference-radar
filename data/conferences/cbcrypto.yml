id: cbcrypto
name: CBCrypto
full_name: International Workshop on Code-Based Cryptography
type: workshop
tier: minor
areas: [crypto]
region: europe
language: english
frequency: annual
organizer: 'Volunteer chairs that change each year (2026: Michele Battagliola, Polytechnic University of Marche, and Alessio Meneghetti, University of Bari); affiliated event of Eurocrypt'
organizer_country: [europe]
proceedings: None (abstracts shared at the event); selected full papers in a Cryptography and Communications (Springer) special issue
archival: false
