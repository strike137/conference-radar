links:
  website: https://www.cb-crypto.org/
notes:
- Two-day workshop on code-based and post-quantum cryptography, held as an affiliated event of Eurocrypt
- Contributed talks are proposed via an extended abstract of at most 2 pages, no format restriction; recent, in-progress or already published work is welcome
- From 2026 selected unpublished works may be submitted to a post-conference special issue of the journal Cryptography and Communications with independent review
- Earlier editions published revised selected papers as Springer LNCS post-proceedings (2020 and 2021; the 2022 to 2024 calls also announced an LNCS volume)
- Registration goes through the Eurocrypt registration; partial student travel support was offered in 2026
- 'Past locations: Zagreb 2020 and Munich 2021 (both online), Trondheim 2022, Lyon 2023, Zurich 2024, Madrid 2025, Rome 2026'
