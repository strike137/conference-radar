notes:
- Swedish national Python conference, held yearly since 2014 and organized by Python Sverige, a registered nonprofit (membership is free)
- Two days of talks, workshops, keynotes and panels at the Clarion Hotel Skanstull in Stockholm (2024, 2025 and 2026)
- Talk and workshop proposals through pretalx with single-blind review by a program committee; accepted speakers get a free ticket but no travel grant
- No papers or proceedings; talk recordings on the PyCon Sweden YouTube channel
- Not listed in CORE ICORE2026
