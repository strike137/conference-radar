notes:
- Half-day workshop on prompt engineering and prompting techniques for LLMs, held with The Web Conference (WWW) since 2024
- Organized by Damien Graux (EcoVadis), Sebastien Montella (Huawei) and Hajira Jabeen (University Hospital Cologne), joined by Fabrizio Orlandi (Semantic Partners) in 2027
- 2026 proceedings published in CEUR-WS Vol-4258, not in the ACM Companion Proceedings
- Research papers up to 10 pages; position, demo and industry papers up to 5 pages; expressions of interest and prompting technique papers up to 2 pages; ACM double-column format, single-blind review
- Editions at WWW 2024 (Singapore), WWW 2025 (Sydney), WWW 2026 (moved from Dubai in April to online in June); 4th edition at WWW 2027 in Dublin
- Not listed in the CORE ICORE2026 portal
