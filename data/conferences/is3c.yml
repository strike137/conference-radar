notes:
- Hosted by the NCUT College of EECS in Taichung (central Taiwan, not Taipei)
- Held about every two years (2018, 2020, 2023, 2025); the 2016 edition was in Xi'an
- 'Broad scope: computing, multimedia, communications, ICs, consumer electronics, renewable energy, control'
- First deadline in March with several extensions; accepted papers go to IEEE Xplore and are submitted to EI
- Selected papers invited to SCI(E)/EI journals; academic sponsors include MDPI Applied Sciences and Sensors
