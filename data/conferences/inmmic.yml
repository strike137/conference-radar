notes:
- Small two-day workshop on nonlinear RF, microwave, millimetre-wave and terahertz devices, circuits and systems
  (measurement, modeling, linearization, power amplifiers, noise)
- First held in Duisburg in 1990, current form since Rome 2004; moves between European universities (2023 Aveiro,
  2025 Torino, 2026 Castelldefels)
- Not on a fixed cycle (2023 November, 2025 April, 2026 November)
- Four-page papers submitted via EDAS and peer-reviewed; presented papers go into IEEE Xplore
- Authors of accepted papers may submit extended versions to a mini-special issue of IEEE Transactions on Microwave
  Theory and Techniques
- "Registration 2026: 260 EUR advance for IEEE members, 360 EUR non-members, 150 EUR student members"
- Friendly atmosphere aimed at PhD students; best student paper award and student travel grants supported by the GAAS Association
- Not listed in ICORE2026 or the CCF list
