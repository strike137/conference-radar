notes:
- Small two-day workshop on nonlinear RF, microwave, millimetre-wave and THz devices, circuits and systems (nonlinear measurement, modelling, linearization, power amplifier efficiency)
- Standalone event despite the name; started in Duisburg in 1990 and relaunched in Rome in 2004, held at different venues around Europe
- Four-page papers are peer reviewed (submitted via EDAS); final papers must be IEEE Xplore compatible
- Extended versions can go to a mini-special issue of IEEE Transactions on Microwave Theory and Techniques
- Known for an informal, interactive atmosphere that suits PhD students; student awards
- Not listed in ICORE2026 or the CCF list
