id: disa
name: DisA
full_name: International Workshop on Computational Methods for Emerging Problems in Disinformation Analysis
type: workshop
tier: minor
areas: [security, ai]
region: europe
language: english
frequency: irregular
organizer: Workshop chairs from Bydgoszcz University of Science and Technology and Wroclaw University of Science and
  Technology (Poland) with Yunnan University (China); technically endorsed by the IEEE SMC TC on Big Data Computing
organizer_country: [europe]
proceedings: Springer LNCS
archival: true
typical:
  deadline_months: [7]
  conference_months: [9]
links:
  website: https://disa-iccs.github.io/
notes:
- Small workshop on fake news and disinformation detection, image and video manipulation, explainability and
  adversarial attacks on detectors
- Co-located with ESORICS (Bydgoszcz 2024, Toulouse 2025)
- Papers appear in the Springer LNCS volumes of the ESORICS International Workshops (2024 -> LNCS 15264 Part II,
  2025 -> LNCS 16233 Part III)
- "Acceptance: 4 of 8 submissions (2024), 4 of 7 submissions (2025)"
- LNCS format, at most 16 pages excluding bibliography and appendices (20 pages total); submission via the ESORICS
  EasyChair
- Not among the accepted workshops of ESORICS 2026 (Rome)
