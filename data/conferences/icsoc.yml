notes:
- Run by the ICSOC Steering Committee; each edition is hosted by a local university (Lodz University of Technology
  in 2026, Harbin Institute of Technology in 2025)
- Proceedings in Springer LNCS (LNCS 16320 and 16321 for 2025); workshops, PhD symposium and demos have separate
  calls later in the year
- Location rotates worldwide; recent editions were Sevilla (2022), Rome (2023), Tunis (2024), Shenzhen (2025)
  and Lodz (2026)
- Two review rounds (early submission in May, regular submission in July); early-round papers can get a revision
  decision and resubmit in the regular round
- Double-blind review; submissions 10 to 15 pages in LNCS format, accepted papers are full (up to 15 pages) or
  short (up to 8 pages)
- In-person event; the 2025 site states that papers of no-show authors are removed from the proceedings
- Main venue of the services computing community; CORE A and CCF B
