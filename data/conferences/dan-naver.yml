notes:
- NAVER's annual conference combining technology, creative, service and business tracks
- DAN 24 included DEVIEW developer sessions, NAVER's former developer conference
- Topic filters include AI/data, infrastructure, DevOps, SRE, security and trust and safety alongside product and business talks
- Held at COEX Grand Ballroom in Seoul (Nov 11-12 2024, Nov 6-7 2025)
- On-site attendance by invitation or first-come registration; Day 1 keynotes are live-streamed with Korean/English interpretation
- Slides and session videos are published on the site and the PLAY NAVER channels
- No papers or proceedings; practitioner talks only
- Not listed in the CORE ICORE2026 portal
