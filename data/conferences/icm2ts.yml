links:
  website: https://icmmts.org/home
notes:
- THz systems venue covering THz communications, radar, localization, sensing, electronics and photonics
- Successor of the International Workshop on Mobile Terahertz Systems (IWMTS, 2018 to 2023), launched by the German MARIE research center
- Organized by the Institute of Digital Signal Processing, University of Duisburg-Essen (general chair Thomas Kaiser)
- Recent editions in Bonn (2023), Dubai (Feb 2025) and Kruger National Park, South Africa (Jul 2026); no edition in 2024
- Two to five page IEEE format papers via EDAS; presented papers are submitted to IEEE Xplore
- Small meeting, attendance capped at 125
- Not listed in ICORE2026
