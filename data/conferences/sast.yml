notes:
- Brazilian software testing symposium of the Brazilian Computer Society (SBC); 11th edition in 2026, annual since 2016
- Held each year within CBSoft (Congresso Brasileiro de Software) in a different Brazilian city (Recife 2025, São Paulo 2026)
- Proceedings (Anais) published open access in the SBC OpenLib (SOL)
- Papers in Portuguese or English; regular papers 6 to 10 pages including references, double-anonymous review by at
  least three PC members; industry abstracts up to 3 pages
- "Acceptance rate: 38.6% for full papers (2026, 27/70); 64.3% for industry abstracts (9/14)"
- Not ranked in CORE ICORE2026
