notes:
- Started in 2025 as an NDSS co-located workshop on 5G/6G, O-RAN, Wi-Fi and Bluetooth security
- Full papers up to 8 pages and short papers up to 4 pages in NDSS format; double-blind review
- Official proceedings, with an option to opt out ('No proceedings')
- Includes a panel on 6G security and privacy; steering committee includes Yongdae Kim (KAIST)
- NDSS 2027 will be held in Seoul, Korea (March 22 to 26, 2027); a FutureG 2027 edition has not been announced yet
