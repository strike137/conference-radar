notes:
- Long running series on intelligent tutoring and AI in education, started in Montreal in 1988 by Claude Frasson
- Now run by the Institute of Intelligent Systems (IIS) in Athens
- Proceedings in Springer LNCS
- Full papers 12 pages, short papers 8 pages, posters 6 pages (references excluded); double-blind review via EasyChair
- Hybrid format; online attendance is free but each accepted paper needs a paid author registration
- Annual since 2018; mostly held in Greece recently (Bucharest 2022, Corfu 2023, Thessaloniki 2024, Alexandroupolis 2025, Pafos 2026, Rome 2027)
- CORE B (ICORE2026); not on the CCF list
