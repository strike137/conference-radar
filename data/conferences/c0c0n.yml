notes:
- Described as India's longest-running hacking and security conference (since 2009); hosted by Kerala Police with
  ISRA, held every October in Kochi, Kerala (19th edition in 2026)
- Two conference days with 6+ parallel tracks, villages and CTFs, surrounded by paid pre and post conference trainings
- CFP by email; the abstract document must not identify the author, and vendor or product talks are rejected
- 'Strong law enforcement flavor: LEA track and CFP, LEA CTF, child safety (CSEA) track'
- Student tickets are cheap (4,999 INR in 2026); a student scholarship was offered in 2025
