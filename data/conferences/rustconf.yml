notes:
- Main annual conference of the Rust programming language community, hosted by the Rust Foundation; held annually since 2016
- Talks, workshops and more over four days in September, in person plus an online component
- Recent hosts are Montreal (2024), Seattle (2025), Montreal (2026) and Vancouver (2027)
- No papers or proceedings; session recordings are published on the Rust Foundation YouTube channel
- Not listed in CORE ICORE2026
