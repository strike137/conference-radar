notes:
- Biennial week-long meeting of the Latin American AI community, modelled on the Deep Learning Indaba; lectures, practicals,
  parallel sessions, poster sessions and Women in AI mentoring
- Held in Latin America (Montevideo 2019 and 2023, online series 2021, Santiago 2025, Sao Paulo 2027)
- Attendance by application (about 500 places from 1,000+ applicants, each reviewed by two reviewers); free for selected
  attendees, with travel and accommodation grants
- Accepted participants can present posters; submissions are non-archival, so no proceedings
- New for 2027 -> call for workshops and tutorials on the last two days (Apr 8 to 9), up to four in parallel
- Run since 2024 by the nonprofit KHIPU.AI (Latin American AI Institute), a U.S. 501(c)(3) tax-exempt organization; lectures in English
- Not listed in CORE ICORE2026
