id: smap
name: IEEE SMAP
full_name: IEEE Symposium on Microwave, Antenna, and Propagation
type: conference
tier: minor
areas: [communications]
region: southeast-asia
language: english
frequency: annual
organizer: IEEE Indonesia Joint Chapter MTT/AP
organizer_country: [indonesia]
proceedings: IEEE Xplore
archival: true
fee: 100 USD (IEEE MTT/AP member), 110 USD (IEEE member or student), 120 USD (non-member) per paper, hybrid (2027)
typical:
  deadline_months: [11]
  conference_months: [1]
links:
  website: https://smap.or.id/
notes:
- Organized and sponsored by the IEEE Indonesia Joint Chapter MTT/AP; steering committee from Universitas Indonesia,
  ITS and other Indonesian universities
- Topics are microwave devices and circuits, antennas (incl. metamaterials, mmWave and THz) and propagation
- Held in Jakarta at a host university (2026 Universitas Pancasila, 2027 Universitas Budi Luhur); hybrid with
  virtual presentation
- Accepted and presented papers are submitted to IEEE Xplore (no-show policy)
- 4 to 6 page IEEE two-column papers via EDAS; similarity must be below 30%
- Best paper authors (three per year) get the registration fee reimbursed
- Not listed in ICORE2026 and not on the CCF list
