notes:
- Main ACM conference on evolutionary computation, held annually since 1999 (usually in July) and sponsored by ACM SIGEVO
- Full papers (8 pages excluding references) in the ACM DL main proceedings; poster-only papers (4 pages) and workshop
  papers in the ACM DL companion proceedings
- Double-blind review organized per track (genetic algorithms, genetic programming, swarm intelligence, neuroevolution,
  evolutionary ML, theory, real-world applications, and more)
- Each track accepts at most 40% of its full paper submissions; rejected full papers can be accepted as posters
- Mandatory abstract one week before the full paper deadline; both deadlines are non-extensible
- Rotates worldwide (Boston 2022, Lisbon 2023, Melbourne 2024, Malaga 2025, San Jose Costa Rica 2026); hybrid in
  recent years, but GECCO 2027 in Krakow is in person only
- Also has late-breaking abstracts, Hot off the Press, a student workshop, competitions and the Humies awards
