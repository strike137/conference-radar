notes:
- Practitioner conference on web development, UX and UI design, AI, data, product, digital marketing and business
- Run by WebExpo s.r.o., a Prague company; held since 2008
- Held every May at Lucerna Palace, Prague, Czechia; two conference days plus a day of paid workshops
- About 1,600 attendees and 70 speakers
- Speakers chosen through a call for papers announced via the newsletter; 2027 applications are already closed
- Talk videos published on SlidesLive; no papers or proceedings
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
