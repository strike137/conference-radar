notes:
- Organized by INSTICC; proceedings in the SCITEPRESS Digital Library, a short list of extended papers goes to a
  Springer CCIS post-proceedings book
- CORE C (ICORE2026); regarded as a minor venue; 151 submissions in 2025 (per the Springer CCIS post-proceedings)
- Two submission stages (submit in the 1st stage for an earlier notification) plus a separate abstracts track that
  is not published; deadlines are usually extended by a few weeks; remote presentation allowed only exceptionally
- Held in European tourist cities (Porto 2025, Marbella 2026, Valletta 2027 at the 5-star Grand Hotel Excelsior)
  and co-located with other INSTICC conferences (ICAART and ICPRAM in both 2026 and 2027), so registration is expensive
