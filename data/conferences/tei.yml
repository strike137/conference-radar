notes:
- Sponsored by ACM SIGCHI; proceedings of every edition since 2007 are in the ACM Digital Library
- CORE B (ICORE2026); the main venue for tangible user interfaces, wearables, physical computing and embodied interaction
- Papers have no page limit (typically 7,000 to 8,000 words, one-column template); each paper gets two ACs plus two external reviewers
- Tracks besides papers include pictorials, work-in-progress, studios, art and performance, graduate student consortium and a student design challenge
- Mostly held in Europe and North America (Warsaw 2023, Cork 2024, Bordeaux 2025, Chicago 2026, Lisbon 2027)
