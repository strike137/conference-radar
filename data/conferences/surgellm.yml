notes:
- First edition held at ACL 2026 in San Diego; covers LLMs over tables, charts, maps, flowcharts and diagrams (table QA, Text-to-SQL, structure-aware retrieval and generation)
- Main track papers can be archival (ACL Anthology workshop proceedings) or non-archival at the author's choice; a presentation-only track takes papers already accepted elsewhere
- Long (8 pages) and short (4 pages) papers via direct OpenReview submission or ARR commitment
- Not ranked in ICORE2026 and not on the CCF list
