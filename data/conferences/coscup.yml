  website: https://coscup.org/
notes:
- Community-run open source practitioner conference in Taiwan, organized by volunteers since 2006
- Talks only, no papers or proceedings; session proposals plus BoF / Hacking Corner and lightning talks
- 2026 edition held jointly as COSCUP x UbuCon Asia 2026, co-hosted by the NTUST Department of Electronic and
  Computer Engineering with the Open Culture Foundation as co-organizer
- Held in Taipei on a university campus over two days in early August; free admission (official site calls it a free
  annual conference)
- General open source software rather than security, AI or networking specifically
