id: icaci
name: ICACI
full_name: International Conference on Advanced Computational Intelligence
type: conference
tier: minor
areas: [ai]
region: asia-pacific
language: english
frequency: annual
organizer: City University of Hong Kong with local host universities (2026 organizers Lanzhou University and Lanzhou University of Technology); IEEE SMC technical co-sponsor
organizer_country: [china]
proceedings: IEEE Xplore
rank:
  core: Unranked
fee: 500 USD or 3,500 CNY full registration per paper (2026)
typical:
  deadline_months: [4]
  conference_months: [5, 7, 8]
links:
  website: https://conference.cs.cityu.edu.hk/icaci/
notes:
- Started in 2008 as a workshop (until 2011), a conference since 2012; website hosted by City University of Hong Kong,
  which also provides the general chair; IEEE Systems, Man and Cybernetics Society is technical co-sponsor
- Accepted papers are submitted to IEEE Xplore; selected papers go to journal special issues
- Mostly held in mainland China with the host city changing each year; 2023 in Seoul and 2025 in London, Bath and
  Cambridge (UK)
- Full papers up to 10 pages in IEEE double-column format, two extra pages with overlength charge; special sessions
  invited
- Not ranked in ICORE2026
