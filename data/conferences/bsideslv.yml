notes:
- The original BSides event, started in 2009 as an alternative to Black Hat and DEF CON; held during Las Vegas
  security week in early August
- Run by Security BSides Las Vegas, Inc., a volunteer non-profit; held at the Tuscany Suites and Casino, Las Vegas
- General CFP (all tracks) usually open April to early May; Proving Ground track pairs first-time speakers with mentors
- No proceedings; talk videos are posted on YouTube
- Not listed in ICORE2026
