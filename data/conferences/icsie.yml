notes:
- Smaller commercially organized conference on software engineering, information systems, services, CS education and biomedical applications
- Started in 2012; held in Derby, Phuket, Chennai, Singapore, Dubai, Tokyo, Cairo, Sharm El-Sheikh and Kobe, online 2020 to 2022
- Proceedings 2018 to 2026 in the ACM Digital Library (ACM ICPS), listed as indexed in Ei Compendex and Scopus
- Papers at least 4 pages (double column); abstract-only presentation possible without publication
- No edition dated 2025 (ICSIE 2024 in December 2024, ICSIE 2026 in January 2026)
- Not listed in the CORE portal (ICORE2026) and not on the CCF 2026 list
