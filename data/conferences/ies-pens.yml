notes:
- Annual conference run by Politeknik Elektronika Negeri Surabaya (PENS), Indonesia, technically co-sponsored by IEEE; 2025 was the 27th edition
- Two tracks registered with IEEE as separate conferences, IES-ETA (Engineering Technology and Applications) and IES-KCIC (Knowledge Creation and Intelligent Computing)
- Accepted and presented papers are submitted to IEEE Xplore; selected papers are invited to extended versions in the EMITTER, IJASEIT or JOIV journals
- Double-blind review via EDAS; 4 to 6 page papers in IEEE format
- Held in Indonesia (Surabaya, Bali, Yogyakarta), with an online presentation option for authors
- Submission deadline is usually extended by several weeks
- Not listed in ICORE2026 (the CORE entry 'IES' is the unrelated Asia Pacific Symposium on Intelligent and Evolutionary Systems) or in the CCF list
