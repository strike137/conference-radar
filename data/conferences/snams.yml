notes:
- Run by the Emerging Technologies Network, the same group behind FMEC; technically co-sponsored by the IEEE section of the host country (IEEE Austria Section in 2025, IEEE Spain in 2026)
- Proceedings in IEEE Xplore
- Topics cover social network analysis, social media mining, misinformation, and privacy and security in social systems
- Short, poster, position, PhD symposium and SoK tracks plus workshops; a late main track with a second deadline was offered in 2026
- Very fast review cycle (2026 main track notification 15 days after the submission deadline)
- Held almost every year in Europe (2021 Gandia, 2022 Milan, 2024 Gran Canaria, 2025 Vienna, 2026 Barcelona); 2023 was in Abu Dhabi
- Not listed in ICORE2026; not on the CCF list
