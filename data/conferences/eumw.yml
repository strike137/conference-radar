notes:
- Week of three co-located conferences run by EuMA with Horizon House; 2026 was the 29th EuMW
- "2026 conferences: 56th European Microwave Conference (EuMC), 21st European Microwave Integrated Circuits Conference
  (EuMIC) and 23rd European Radar Conference (EuRAD)"
- One paper deadline for all three conferences, with forums, workshops, short courses and a large industry exhibition
- Covers microwave and millimetre-wave engineering, radar and sensing, RF integrated circuits, antennas, terahertz
  and 6G
- Peer-reviewed papers; at least one author must register and present in person, otherwise the paper is not published
  in IEEE Xplore
- Rotates among European cities (Berlin 2023, Paris 2024, Utrecht 2025, London 2026)
- Main European counterpart of IEEE IMS; microwave engineering venue outside the usual CS rankings, not listed in
  ICORE2026
