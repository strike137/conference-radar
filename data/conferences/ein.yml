notes:
- Half-day workshop co-located with IEEE INFOCOM; first held with INFOCOM 2026 in Tokyo
- Topics are networking for embodied and agentic intelligence (semantic communication, edge and in-network computing for embodied AI, multi-agent coordination, testbeds and simulators)
- Accepted and presented papers appear in the IEEE INFOCOM 2026 proceedings and IEEE Xplore
- Papers up to 6 pages in IEEE two-column format including references; single-blind review via EDAS; short papers, posters and demos solicited
- General chair Baochun Li (University of Toronto); international steering committee
- Ten accepted papers in the 2026 program
- Not listed in ICORE2026
