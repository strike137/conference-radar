notes:
- Long-running US symposium on reliability, availability, maintainability and safety, held every January since 1954
- Covers hardware and software systems (fault tolerance, FMEA, fault tree analysis, prognostics, AI and ML for R&M)
- Abstract first (late April), then draft paper in July, peer review in August and September, final paper at the end of September
- RAMS policy is to publish all presented papers in IEEE Xplore; presentation-only and tutorial tracks also exist
- Held in the USA, alternating between east and west coast areas (Miramar Beach FL 2026, St. Petersburg FL 2027, Houston 2028)
- Practitioner-heavy audience with a large tutorial program; costly (presenter early rate 845 USD for members, 2027)
- Reliability engineering in general, not computing only
- Not listed in CORE ICORE2026 or in the CCF 2026 list
- 2026 edition moved from Planet Hollywood, Las Vegas to Miramar Beach, Florida (old venue struck through on the 2026 call for papers)
