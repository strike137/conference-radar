notes:
- Polish community security conference, part of the global Security BSides series
- 2025 was the 11th edition; held every year in Warsaw
- Two days of talks and workshops; the 2025 edition took place at the University of Warsaw Faculty of Psychology (ul. S. Banacha 2D)
- Attendance is free with prior registration; the organizing committee covers speakers' meals
- Talks chosen through a CFP form; no proceedings
- Official site is in Polish
