id: iecc
name: IECC
full_name: International Electronics Communication Conference
type: conference
tier: minor
areas: [communications]
region: asia-pacific
language: english
frequency: annual
organizer: Commercial conference secretariat (zmeeting.org submission system, 163.com contact) with a host university each year (2026 South-Central Minzu University)
organizer_country: [china]
proceedings: ACM DL
archival: true
indexing: [EI, Scopus]
fee: 475 USD author non-member, 435 USD student, 285 USD presentation only (2026)
typical:
  deadline_months: [9]
  conference_months: [7, 11]
links:
  website: https://www.iecc.net/
notes:
- Annual since 2019; Okinawa 2019, online 2020 to 2022, Osaka 2023, Fukuoka 2024, Tangshan 2025, Wuhan 2026
- Held in July up to 2025; the 2026 edition moved to November
- Proceedings of 2019 to 2024 in the ACM Digital Library (ACM ICPS), stated as EI Compendex and Scopus indexed
- The site does not name the publisher for the 2025 and 2026 proceedings
- Run by a commercial conference secretariat with a host university each year; abstract only presentation without publication is also offered
- Full papers at least 4 pages, double blind review stated
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
