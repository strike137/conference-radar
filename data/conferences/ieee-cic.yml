id: ieee-cic
name: IEEE CIC
full_name: IEEE International Conference on Collaboration and Internet Computing
type: conference
tier: minor
areas: [networking, ai, systems]
region: north-america
language: english
frequency: annual
organizer: IEEE, IEEE Computer Society
organizer_country: [usa]
proceedings: IEEE Xplore
archival: true
fee: 950 USD (2026, IEEE member author, early by Oct 15); 1140 USD non-member author
typical:
  deadline_months: [6, 8]
  conference_months: [10, 11]
links:
  website: https://cic.ieee-cs.org/2026/
notes:
- Running since 2015; co-located with IEEE CogMI and IEEE TPS (plus IEEE RISC from 2026), one registration covers all
- Two submission rounds (June and August), AoE; rejected Round 1 papers can be revised and resubmitted to Round
  2; deadlines usually extended by one to three weeks
- Anonymous review; research papers up to 10 pages in IEEE two-column format; industry/government and invited vision
  tracks
- Held in the USA except the first edition (Hangzhou 2015); Atlanta 2020 and 2021, Washington DC 2024, Pittsburgh 2025,
  San Jose 2026
- Not listed in ICORE2026 or the CCF 2026 list
