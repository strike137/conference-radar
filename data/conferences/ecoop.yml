notes:
- Long-running programming languages conference (despite the name it covers PL broadly, not only OO)
- Proceedings open access in Dagstuhl LIPIcs; camera-ready up to 25 pages plus references
- CORE A (ICORE2026); CCF B
- Two submission rounds (November and February) with author response; revisions can go to a later round
- Journal First / Journal After arrangements with TOPLAS, SCP and JOT
- ACM SIGPLAN listed as supporter and ACM as in-cooperation (2026); AITO Dahl-Nygaard prizes are presented at the conference
- Held in Europe almost every year (Bergen 2025, Brussels 2026, Turin 2027)
