notes:
- IEEE MTT-S conference on RF, microwave, THz and antenna technology for biomedical applications (bio-electromagnetics, medical imaging, radar vital-sign sensing, wireless power for implants, EM safety)
- Continues a series of MTT-S biomedical events since 2011; rotates between Europe, North America and Asia (Suzhou 2022, Leuven 2023, Montreal 2024, Taiwan 2025, Cosenza 2026, Chicago 2027)
- Full papers of up to 3 pages are submitted via EDAS; accepted and presented papers go to IEEE Xplore
- A 1-page abstract option exists that is not published in IEEE Xplore
- Authors of accepted papers can submit extended versions to a special issue of IEEE J-ERM
- Not listed in ICORE2026 or the CCF list
