notes:
- Flagship Brazilian networking and distributed systems symposium of the Brazilian Computer Society (SBC); 44th
  edition in 2026
- Papers in Portuguese or English, up to 14 pages including references in the SBC template; each paper reviewed by at
  least three specialists; submission through JEMS 3
- Proceedings (Anais) published open access in the SBC OpenLib (SOL) digital library; at least one author must
  register and present in person
- Held in a different Brazilian city each year (Praia do Forte, Bahia in 2026); the per-year site changes, the SOL
  page is the stable link
- Many co-located workshops (WTF, WGRS, CoUrb, WPEIF, WQuNets, WIARC, WBlockchain, WTG, WRNP), plus a tools session,
  hackathon and industry track
- Not ranked in CORE ICORE2026
