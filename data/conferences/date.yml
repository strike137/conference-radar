notes:
- Europe's main electronic design automation conference; sponsored by EDAA, ESD Alliance, IEEE CEDA and ACM SIGDA
- 30th edition in 2027 (Dresden); held every spring in Europe (Verona 2026)
- Four research tracks (D design methods and tools, A application design, T test and dependability, E embedded systems)
- Double-blind review for research papers; 6 pages plus 1 page of references; abstract one week before the paper deadline; strict 23:59 AoE deadlines with no extensions
- Proceedings in IEEE Xplore (the archive page also points to the ACM DL); all DATE proceedings become publicly available two years after the conference
- In-person only; also has Late Breaking Results, Multi-Partner Projects, focus sessions, workshops and a PhD Forum
- ICORE2026 rank A; CCF B
