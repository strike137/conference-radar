notes:
- Organized by IOE Purwanchal Campus of Tribhuvan University, Dharan, Nepal (2026 and 2027 editions)
- Proceedings in IEEE Xplore (2022 to 2025 proceedings linked from the official site); listed in the IEEE conference calendar (conference ID 70384)
- IoT focused scope covering IoT networks and protocols, 5G and SDN, edge and fog computing, big data analytics and cyber-physical systems
- Double-blind review is stated; papers are submitted by email, 6 to 8 pages, similarity score must stay below 15%
- Part of a family of Tamil Nadu linked IEEE Xplore conferences (ICOEI, ICICV, ICIDCA and others) with a broad scope
- 11th edition in 2027
- Not found in ICORE2026; not on the CCF list
