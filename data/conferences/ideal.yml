notes:
- Computational intelligence and intelligent data analysis (machine learning, data mining, big data, bio-inspired
  models, agents, applications)
- Proceedings in Springer LNCS every year since at least 2002
- Held in Europe, mostly the UK, Spain and Portugal (2023 Evora, 2024 Valencia, 2025 Jaen, 2026 Manchester)
- Papers up to 10 pages including references (12 pages max with extra page charge), double-blind not mandatory
- IDEAL 2026 is held jointly with the WSOM+ workshop on unsupervised learning
- Submission deadline is usually extended by about a month
- Selected papers invited to journal special issues
