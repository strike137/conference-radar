id: icooolps
name: ICOOOLPS
full_name: Workshop on Implementation, Compilation, Optimization of Object-Oriented Languages, Programs and Systems
type: workshop
tier: minor
areas: [software, systems]
region: europe
language: english
frequency: annual
organizer: ICOOOLPS organizing committee, co-located with ECOOP
organizer_country: [international]
proceedings: ACM DL
archival: true
typical:
  deadline_months: [3, 5]
  conference_months: [6, 7]
links:
  website: https://2026.ecoop.org/home/ICOOOLPS-2026
notes:
- Language implementation and optimization workshop held with ECOOP (scope now goes well beyond OO languages)
- 2026 full papers published in the ACM Digital Library (authors may opt out); 2025 full papers went to Journal of
  Object Technology as post-proceedings
- Full papers up to 12 pages, position papers up to 4 pages, plus code walks, demos and lightning talks (only full
  papers go in the proceedings)
- Submissions accepted in any format; ACM sigplan format only for the camera-ready version
- Not listed in ICORE2026 (portal search returns no results) or the CCF list
