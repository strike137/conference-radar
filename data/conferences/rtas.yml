notes:
- Sponsored by the IEEE Computer Society Technical Community on Real-Time Systems (TCRTS); held as part of CPS-IoT Week each May
- Main papers, plus brief industry, work-in-progress and demo papers, appear in the RTAS proceedings with IEEE
- Two tracks (Systems and Applications; Applied Methodologies and Foundations); double-anonymous review with an author response period
- Up to 11 pages of technical content in IEEE conference format (12 after acceptance); optional artifact evaluation
- Firm November deadline; Irvine 2025, Saint-Malo 2026, Boulder 2027
- CORE A (ICORE2026); CCF B
