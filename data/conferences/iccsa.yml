notes:
- Run by the ICCSA Society since 2003; each edition is co-organized with a host university
- Proceedings in Springer LNCS, with General Tracks and workshop papers in separate LNCS volume sets (2026 main
  volumes LNCS 16767 to 16769, workshop volumes LNCS 16758 to 16766)
- Very broad scope (computational science, applications, numerical methods, GIS and more) with dozens of co-located
  workshops
- Full papers 12 to 18 pages in LNCS format; short papers 8 to 11 pages; at least three reviews per paper
- Recent editions mostly in Europe (Cagliari 2021, Malaga 2022, Athens 2023, Istanbul 2025, Braga 2026) with Hanoi
  in 2024; 2027 is in Bali, Indonesia
- CORE C (ICORE2026); not on the CCF list
- WASET runs fake events under the ICCSA name; the real ICCSA is only at iccsa.org
