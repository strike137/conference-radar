notes:
- One-day affiliated workshop of ASIACRYPT 2026 bringing together mathematicians and cryptographers on the hard problems behind post-quantum schemes
- Topics include lattices, isogenies of supersingular elliptic curves and abelian varieties, decoding of linear codes and multivariate quadratic equations
- Contributed talks of 15 minutes (12 plus 3 for questions), proposed with a title and abstract via a form; a poster session may be added
- 'Non-archival: no papers are published, only talks'
- Invited speakers for 2026 include Elena Kirshanova, Hiroshi Onuki and John Voight
- 'Registration goes through ASIACRYPT: 120 USD before 7 Nov 2026, 180 USD after (affiliated events only, 2026)'
