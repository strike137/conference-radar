notes:
- Run by the Department of Electrical, Electronic and Communication Engineering (EECE) at MIST, Dhaka, Bangladesh;
  editions in 2014, 2015, 2016, 2018, 2021 and 2024
- Editions up to 2016 were jointly organized with the Institute of Information Technology, Jahangirnagar University
- Planned as biennial since 2018 but the actual gap has been three years (2018, 2021, 2024, 2027)
- Accepted and presented papers are submitted to IEEE Xplore (2024 proceedings published there as IEEE conference 62016)
- Broad EE and ICT scope with eight tracks, including AI and data analytics, computer networks and security,
  communication technology, power, semiconductors and signal processing
- Double-blind review via Microsoft CMT; max 6 pages in IEEE double-column format; similarity index must be below 30%
- 2027 edition is hybrid (in person and virtual); the 2024 submission deadline was extended twice
- Not ranked in ICORE2026; not the same as the Indian ICEEICT (International Conference on Electrical, Electronics,
  Information and Communication Technologies), which shares the acronym
