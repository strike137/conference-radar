notes:
- Workshop held with SC (the International Conference for High Performance Computing, Networking, Storage and Analysis)
- Forum for HPC applications written in programming models other than MPI+X (PGAS, task-based runtimes, high-level languages)
- Started as the PGAS Applications Workshop (PAW) in 2016 and 2017; PAW-ATM since 2018
- Full papers of 8 to 10 pages are published in the SC workshops proceedings; 1 to 4 page user experience abstracts are not published
- Artifact Description appendix mandatory for papers; optional Artifact Evaluation with reproducibility badges
- Location follows SC (St. Louis 2025, Chicago 2026)
