notes:
- International English-language conference launched by the Serbian ETRAN Society in 2014; runs in parallel with the national ETRAN conference (in Serbian, since 1955)
- Broad EE scope in many sections (electronics, telecommunications, computing, automation, antennas, signal processing, power, biomedical, AI and more)
- Papers of 4 to 6 pages in IEEE format, reviewed by two anonymous peers; submission via EasyChair
- Presented papers go into proceedings with ISBN on the ETRAN site and can be submitted to IEEE Xplore (IcETRAN 2025 papers appeared there in August 2025)
- Technically sponsored by IEEE Region 8, IEEE IES and the IEEE Serbia and Montenegro Section
- Held in Serbia or neighbouring Bosnia and Herzegovina each June (Cacak 2025, Silver Lake 2026)
- Submission deadline is usually extended several times (2026 -> 28 Feb, then 31 Mar, then 8 May)
