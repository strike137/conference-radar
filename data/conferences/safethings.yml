notes:
- Workshop on safety, security and privacy of IoT and cyber-physical systems (autonomous vehicles, smart homes,
  medical devices, smart grid, intelligent transportation)
- Co-located with the IEEE Symposium on Security and Privacy in San Francisco; papers appear in the IEEE S&P
  Workshops (SPW) proceedings in IEEE Xplore
- Full papers up to 6 pages excluding references in IEEE format, demos up to 2 pages; double-blind review via HotCRP
- 2025 was the 9th edition (May 15, 2025); SafeThings is not on the IEEE S&P 2026 workshop list
- Not listed in the ICORE2026 portal
