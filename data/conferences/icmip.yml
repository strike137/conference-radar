organizer: Conference secretariat (contact icmip2016@vip.163.com, iconf.org submission system), co-sponsored by Ritsumeikan University
organizer_country: [china]
proceedings: SPIE Proceedings (SPIE Digital Library)
archival: true
indexing: [EI, Scopus]
fee: 600 USD regular author registration (2027, normal; 550 USD early bird before 2026-11-20); 520 to 570 USD for students
typical:
  deadline_months: [12]
  conference_months: [3, 4]
links:
  website: https://www.icmip.org/
notes:
- Annual since 2016; held in Brunei, China and Malaysia, virtual in 2022, Tianjin 2023, then in Japan (Osaka 2024, Okinawa 2025, Sapporo 2026, Nagoya 2027)
- Proceedings in IEEE Xplore (2017), ACM DL (2018 to 2024) and SPIE Digital Library (2025, 2026), indexed by EI Compendex and Scopus
- Co-sponsored by Ritsumeikan University since 2024
- Run by a commercial conference secretariat (163.com contact address, +86 phone number)
- Despite the name, recent programs include many security and cryptography sessions
- Full papers at least 8 pages; abstract only presentation without publication also offered
- Not listed in the CORE ICORE2026 portal
