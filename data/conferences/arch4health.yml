notes:
- Workshop on computer architecture for healthcare workloads such as genomics, medical imaging, brain-machine interfaces and wearables
- Run by the ETH Zurich SAFARI group (Nika Mansouri Ghiasi, Konstantina Koliogeorgi, Onur Mutlu)
- Moves between host conferences; MICRO 2025 (Seoul), HPCA 2026 (Sydney), ICS 2026 (Belfast), MICRO 2026 (Athens)
- Invited talks plus contributed talks selected from extended abstracts submitted through a Google Form
- The ICS 2026 edition also took short papers (up to 4 pages) for the ACM proceedings; other editions are talk only
- Sessions are livestreamed on YouTube
- Not listed in CORE ICORE2026 or the CCF list
