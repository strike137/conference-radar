notes:
- INSTICC conference with proceedings in the SCITEPRESS Digital Library; CORE B, the best ranked of the INSTICC
  AI venues
- 'Two submission stages: stage 1 gives earlier notification; also position papers and an abstracts track'
- Co-located with other INSTICC events; 2027 edition runs alongside ICISSP (security), VISAPP, PHOTOPTICS and GRIVAPP
  with free cross access
- Held in southern Europe (Marbella 2026, Valletta 2027); remote presentation allowed in exceptional cases
- All deadlines AoE; deadlines are usually extended
