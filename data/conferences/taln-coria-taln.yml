notes:
- Annual French NLP conference of ATALA, with the student session RECITAL; 2026 was the 33rd TALN
- Held jointly with CORIA (French information retrieval conference, ARIA) in 2023, 2025 and 2026, and with JEP
  (speech) in 2024
- Official language is French; papers may be in English only if a co-author is not French-speaking
- 6 to 10 page papers, double-blind review on OpenReview; tracks for original papers, position papers and recently
  published work, plus an industry session
- Proceedings in the ATALA TALN Archives and the ACL Anthology (JEP/TALN/RECITAL volumes)
- Held in France every year (Lille 2021, Avignon 2022, Paris 2023, Toulouse 2024, Marseille 2025, Nantes 2026)
- Not listed in the CORE portal (ICORE2026)
