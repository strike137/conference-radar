links:
  website: https://edocconference.org/
notes:
- Formerly the IEEE International Enterprise Distributed Object Computing Conference; CORE still lists it under that name
- Enterprise architecture, enterprise modeling, business process management, service-oriented and model-driven software engineering
- Co-located with CBI (International Conference on Business Informatics) in 2024 (Vienna), 2025 (Lisbon) and 2026 (Enschede)
- Proceedings in Springer LNCS; 2025 used a post-proceedings format (LNCS 16213) where final papers could be extended by one page after the conference
- 30th edition in 2026 at the University of Twente; papers must follow the FAIR guidelines for artifacts to be published
- Two submission rounds; first-round papers can be accepted, rejected or invited to resubmit in the second round
- Full papers up to 15 pages plus bibliography in Springer format
- 2025 program had 38 full papers across CBI and EDOC
- ICORE2026 rank B; not in the CCF list
