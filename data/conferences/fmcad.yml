notes:
- Formal verification of hardware and software systems, with strong ties to EDA; IEEE CEDA is technical co-sponsor
- Open-access proceedings by TU Wien Academic Press (CC license) since 2020, distributed through IEEE Xplore
- Regular and tool/case-study papers, 9 pages (long) or 5 pages (short) in IEEE format; single-blind review with a rebuttal phase
- Alternates between the USA and Europe (Prague 2024, Menlo Park 2025, Graz 2026); includes a student forum
- Co-located with VSTTE in 2026
- CORE B (ICORE2026)
