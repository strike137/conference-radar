organizer_country: [europe]
proceedings: IEEE CPS (Conference Publishing Services)
archival: true
fee: 400 EUR early, 450 EUR late (2026)
typical:
  deadline_months: [5, 6]
  conference_months: [9]
links:
  website: https://scpconf.eu/
notes:
- New conference formed by merging EuroUSEC (European Symposium on Usable Security) and STAST (Workshop on Socio-Technical Aspects in Security); first edition 2026
- Usable security and privacy, human factors and socio-technical security; SoK, replication and negative-result papers welcome
- Full papers 8 to 12 pages in IEEE format, double-anonymous review by at least two PC members, possible shepherding
- Mandatory abstract registration about a week before the paper deadline; deadlines 23:59 AoE
- Accepted papers published by IEEE Conference Publishing Services (CPS); at least one author must register and present
- 2026 held at the University of Luxembourg Belval campus, Esch-sur-Alzette
- Not found in ICORE2026 or the CCF list
