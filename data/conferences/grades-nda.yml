id: grades-nda
name: GRADES-NDA
full_name: Joint Workshop on Graph Data Management Experiences & Systems (GRADES) and Network Data Analytics (NDA)
type: workshop
tier: minor
areas: [data, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizers Akhil Arora (Aarhus University) and Stefania Dumbrava (ENSIIE and Telecom SudParis);
  steering committee with Olaf Hartig, Semih Salihoglu, Vasiliki Kalavri and George Fletcher
organizer_country: [international]
proceedings: ACM DL
archival: true
indexing: [DBLP]
typical:
  deadline_months: [3, 4]
  conference_months: [6]
links:
  website: https://gradesnda.github.io/
notes:
- Co-located with ACM SIGMOD/PODS (Berlin 2025, Bengaluru 2026); joint GRADES and NDA workshop since 2018 (9th joint
  edition in 2026), GRADES itself dates back to 2013
- Topics include graph data management, graph query languages, knowledge graphs, graph mining and graph machine learning
- Archival papers (8-page regular, 4-page short, demo, vision and case study) appear in the ACM DL and DBLP;
  4-page work-in-progress papers are non-archival and only listed on the website
- Double-anonymous review following SIGMOD/PODS rules; ACM two-column template
- Student travel awards funded by sponsors; best paper award introduced in 2026
- Not listed in CORE (ICORE2026) or the CCF 2026 list
