notes:
- Jointly sponsored by SIAM and ACM SIGACT; the flagship conference on discrete algorithms and, with STOC and FOCS, one of the main theory venues
- Proceedings published by SIAM (SODA 2025 and SODA 2026 volumes on SIAM epubs)
- Submissions through HotCRP with a single deadline in early July; the conference is held in January
- SODA 2027 is the 38th edition
- CORE A* (ICORE2026), CCF A
