notes:
- IEEE conference series on data management for mobile, ubiquitous and pervasive computing, running since 1999; 28th
  edition in 2027
- Proceedings published by IEEE via Conference Publishing Services and included in IEEE Xplore
- 'Rotates worldwide: Brussels (2024), Irvine, USA (2025), Athens, Greece (2026), Hamilton, New Zealand (2027)'
- Single-blind review; regular papers 10 pages and short papers 6 pages, references not counted
- Research and industry tracks plus workshops, demos and posters, doctoral forum, PhD dissertation showcase and
  advanced seminars
- Research deadline has been extended several times in recent years (2026 moved from January 30 to March 6)
- One author registration at the full rate is required per paper, also for students
