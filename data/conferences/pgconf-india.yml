notes:
- Practitioner PostgreSQL conference run by the India PostgreSQL User Group; bills itself as Asia's premier PostgreSQL conference
- Talks range from PostgreSQL internals by core developers to end user case studies from startups, multinationals and government
- Format is a training day followed by two conference days; tracks for application developers, DB engine developers, DB administration, case studies, extensions/tools and community
- Talk proposals (25 or 40 minutes) and 3.5 hour workshop proposals chosen by a program committee; no proceedings
- 'Held in Bengaluru every edition on the site: 2019, 2020, 2023, 2024, 2025, 2026; 2025, 2026 and 2027 at Sheraton Grand Hotel at Brigade Gateway'
- Not listed in the CORE ICORE2026 portal
