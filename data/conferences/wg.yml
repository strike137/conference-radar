notes:
- Long running theory venue on graph algorithms and graph theory in computer science, held since 1975 (52nd edition in 2026)
- Despite the name it is a full peer reviewed conference with archival proceedings
- WG 2026 was the first edition with LIPIcs proceedings (Volume 376, diamond open access); earlier volumes are in Springer LNCS
- Submissions limited to 500 lines (about 12 pages) in the LIPIcs class, lightweight double-blind review
- Held in Europe almost every year (Fribourg 2023, Gozd Martuljek 2024, Otzenhausen 2025, Kortrijk 2026)
- Gives a WG Test of Time Award each year
