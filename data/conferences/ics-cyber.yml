notes:
- Practitioner conference on industrial control system (ICS/OT, SCADA) security run by SecurityWeek
- Described by the organizer as the largest and longest-running ICS cybersecurity event series, held since 2002
- 2026 was billed as a special 25-year anniversary edition, held at the W Hotel Nashville, Tennessee
- Speakers are chosen through a call for presentations on Sessionize; no proceedings are published
- Audience of ICS users and vendors, security providers and government representatives
