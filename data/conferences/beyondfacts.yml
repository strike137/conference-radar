notes:
- Workshop on modeling, extraction and analysis of online discourse (claims, arguments, stance, fact-checking, misinformation, bias)
- Held with The Web Conference (WWW) every year since 2021; 2026 was the 6th edition and 2027 the 7th
- Organized by Konstantin Todorov (LIRMM, France), Stefan Dietze (HHU Dusseldorf and GESIS, Germany), Pavlos Fafalios (TU Crete and FORTH-ICS, Greece) and Dimitar Dimitrov (GESIS, Germany)
- Papers appear in The Web Conference Companion Proceedings in the ACM Digital Library
- Full papers up to 10 pages, short, demo, resource and position papers up to 6 pages, ACM double-column template
- Single-blind review; at least one author must register and present
- Location follows The Web Conference (Austin 2023, Singapore 2024, Sydney 2025, Dubai 2026 held virtually, Dublin 2027)
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
