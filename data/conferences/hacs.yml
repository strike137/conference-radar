id: hacs
name: HACS
full_name: High Assurance Crypto Software Workshop
type: workshop
tier: minor
areas: [crypto, security, software]
region: worldwide
language: english
frequency: annual
organizer: HACS organizers and general committee, facilitated by Aspiration; co-located with IACR Real World Crypto
organizer_country: [international]
proceedings: None (no papers or talks; interactive working sessions)
archival: false
typical:
  conference_months: [3, 4]
links:
  website: https://www.hacs-workshop.org/
notes:
- Launched in 2016 by Gilles Barthe, Ben Laurie and Trevor Perrin to bring crypto developers together with formal verification experts
- Invite-only and small (aims for fewer than 100 attendees); for 2027 self-nominations are accepted through an application form
- No lectures to the whole group; most time is spent in small-group working sessions, plus an optional hack day (2026-03-08, 2027-04-04)
- Held just before or after Real World Crypto in the same city (2023 Tokyo, 2024 Toronto, 2025 Sofia, 2026 Taipei, 2027 Seattle)
- Sponsored by industry (Amazon, Apple, Google, SandboxAQ, Signal and others)
- Not listed in ICORE2026 and not in the CCF list, so no rank is given
