links:
  website: https://www.zksummit.com/
notes:
- One-day event on zero-knowledge proofs mixing research and application talks (cryptographic primitives, proof
  systems, zkVMs, privacy); attendees are researchers, cryptographers, founders and developers
- Run by the Zero Knowledge Podcast; speakers come from universities (EPFL, UCL, NYU, TU Graz) and ZK companies
- Talks only, videos posted on YouTube; no proceedings
- Earlier editions were invite-only with an application to attend (2024)
- One or two editions a year in rotating cities, mostly in Europe (Lisbon 2023, London 2023, Athens 2024, Lisbon
  2024, Toronto 2025, Rome 2026)
- Not listed in CORE ICORE2026
