notes:
- Single-track robotics conference run by the RSS Foundation since 2005; widely regarded as one of the top robotics venues alongside ICRA and IROS
- Proceedings published online at roboticsproceedings.org (MIT Press for the 2005-2012 volumes)
- Location rotates worldwide (2022 New York, 2023 Daegu, 2024 Delft, 2025 Los Angeles, 2026 Sydney, 2027 Athens)
- RSS 2027 uses a new two-stage review; a 6-page extended abstract first, then an 8-page full paper that follows an agreed extension charter
- Not listed in the CORE ICORE2026 portal; the ccfddl mirror of the CCF list marks it as not in CCF
