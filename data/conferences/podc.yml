notes:
- Sponsored by ACM SIGACT and ACM SIGOPS; the leading venue for the theory of distributed computing
- Proceedings published by ACM (ACM DL), fully open access from 2026; authors outside ACM Open pay an APC
- Regular papers (first 10 pages carry the evaluation) and brief announcements (up to 5 pages)
- Lightweight double-blind review; papers are expected to be presented in person (limited exceptions)
- Selected papers invited to a special issue of Distributed Computing; up to two may be considered for JACM
- Rotates between North America and Europe with occasional other hosts (Huatulco, Mexico 2025; Egham, UK 2026;
  Reykjavik, Iceland 2027)
