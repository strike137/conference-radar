notes:
- Developer practitioner conference organized by iThome (Taiwanese IT media), the organizer of CYBERSEC Taiwan and KubeSummit
- Held at the Taipei Cultural and Creative Building 6F (Sep 11-13 2024, Oct 14-15 2025, Oct 14-15 2026); first edition 2024
- 2026 theme was AI and developers, plus general software development topics, with multi-track talks and hands-on workshops
- Call for Papers for 30 min and 45 min talks and 90 min workshops; vendor-neutral talks only, sales pitches are declined
- "Speaker travel allowance (2026): 3,000 / 5,000 / 9,000 TWD by session type; overseas speakers get 1,000 USD"
- "Tickets (2026): 3,600 TWD early bird to 5,000 TWD last minute, lunch included"
- No papers or proceedings; slides released with the speaker's consent
- Not listed in the CORE ICORE2026 portal
