notes:
- Workshop on system software for emerging memory technologies (CXL, far memory, memory tiering, near-memory processing)
- Co-located with ACM SOSP every year since 2023 (Koblenz 2023, Austin 2024, Seoul 2025, Prague 2026)
- Papers of at most 6 pages plus references and demo abstracts of 2 pages (ACM sigplan format), double-blind
- Accepted papers and demos are published in the ACM DL; early-stage work and prototype demos are encouraged
- Steering committee from ETH Zurich and Ruhr University Bochum
- Not listed in the CORE portal (ICORE2026) or on the CCF list
