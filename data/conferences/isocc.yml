notes:
- Annual SoC and circuit design conference run from Korea by ISE (The Institute of Semiconductor Engineers), with
  financial co-sponsorship from IEEE CAS Society
- 'Topics: analog, data converter, RF, wireline and digital circuits, architecture, ML/AI accelerators, hardware
  security circuits, SoC design methodology and CAD, emerging devices'
- Short papers (2 pages, IEEE double-column) submitted via Microsoft CMT; accepted papers go to IEEE Xplore
- Invited speakers may submit a 1-page abstract to present without IEEE Xplore publication
- Usually held in Korea in October or November (often Jeju); the 2024 edition was held in Sapporo, Japan in August
- Not listed in ICORE2026 or the CCF list
- Each accepted paper needs one regular registration; extra papers by the same corresponding author can use the
  student rate, up to four papers per registrant
- Also runs a Chip Design Contest and U-REF (undergraduate research) track
