notes:
- Russian national HPC and supercomputing conference with international participation; held every year at Moscow State University since 2015, 12th edition in 2026
- Part of the Russian Supercomputing Days congress (conference, workshops, young scientists conference, exhibition); mixed onsite and online format
- English full papers (12 to 15 pages, LNCS format) go to a Springer LNCS volume after the conference; Russian full papers, short papers and poster abstracts go to a local proceedings book on the website (RSCI)
- Papers accepted in English or Russian; blind review by 3 reviewers; one author must present in person and pay the fee
- Topics cover HPC software and hardware, large-scale simulation, big data, AI, quantum computing and supercomputing education
- Not ranked in ICORE2026 and not on the CCF 2026 list
