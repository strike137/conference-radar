links:
  website: https://conf.kiee.or.kr/
notes:
- Main annual conference of KIEE, the Korean electrical engineering society; 2026 was the 57th edition
- Very large (1,435 papers in 2026, about 86% presented as posters), plus workshops, special sessions and an exhibition
- Tracks follow KIEE divisions (power systems, electrical machines and power electronics, electrical materials,
  information and control, electrical installations, industrial applications) plus an undergraduate S-Session
- Two-step submission (title, then a paper of up to 2 A4 pages); only members with paid dues can submit
- Oral sessions are meant for professors and experts; master's students presenting orally need their advisor present
- Papers already presented at another conference are not accepted
- Held at a Gangwon resort in July in 2026 (Yongpyong Resort, Pyeongchang)
- Registered participants can download the papers for one month from the conference site
