notes:
- Workshop co-located with ECML PKDD; the 2026 edition was a workshop day in Naples on 7 September
- Covers AI and machine learning for process mining (predictive process monitoring, conformance checking, LLMs, object-centric process mining)
- Regular papers up to 12 pages and short research statements up to 6 pages, including references; Springer LNCS style, submitted via Microsoft CMT
- Accepted papers go into the joint post-proceedings volume of the ECML PKDD 2026 workshops after shepherding; presentation by a registered author is required
- The ECML PKDD 2026 workshop call names Springer CCIS for the joint post-workshop proceedings
- Not listed in CORE ICORE2026
