notes:
- National Italian academic cybersecurity conference, organized by the CINI Cybersecurity National Lab with Fondazione SERICS; held yearly since 2017 in a different Italian city
- Papers must be in English; open-access post-proceedings in CEUR Workshop Proceedings (indexed by Scopus and DBLP per the CFP)
- Three tracks; only original unpublished papers go into the post-proceedings, preliminary work and already published work can be presented without proceedings
- Single-blind review; up to 16 pages in the CEURART single-column template plus references and up to 4 pages of appendices
- Strong papers may be invited to journal special issues
- Not listed in CORE ICORE2026
- Recent editions in Bologna (2025), Cagliari (2026) and Siena (2027)
