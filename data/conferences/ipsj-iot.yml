notes:
- Internet, system operation technology and service management; four research meetings a year (May, July, September,
  March)
- May meeting joint with IPSJ CSEC and IEICE ICM; March with IEICE IA and SITE in Naha; the September 2026 meeting
  was joint with IPSJ OS
- 'Also runs the refereed IOT Symposium (IOTS2026: Dec 17 to 18, Kunibiki Messe, Matsue; paper deadline was Sep
  4; poster deadlines Oct 13 reviewed, Nov 6 non-reviewed)'
- Presenters are generally expected on site; IPSJ junior (pre-university) members are welcome to submit
