notes:
- Also called ML4Cyber; workshop on machine learning and data mining for cybersecurity, including LLM security and adversarial ML; 2026 is the 6th edition
- Steering chairs include Battista Biggio, Elisa Bertino, Hsinchun Chen, Yang Liu and Xinming Ou; program chairs from A*STAR I2R, Southern Cross University and the University of South Florida
- Held with the IEEE International Conference on Data Mining (ICDM), so the location rotates with ICDM
- Accepted papers published in the ICDMW proceedings (IEEE Computer Society Press, IEEE Xplore), indexed by EI
- Up to 8 pages plus 2 extra pages; triple-blind review
- Hybrid session in 2026; remote presentations allowed in 2025
- Not ranked by CORE (not in ICORE2026) or CCF
