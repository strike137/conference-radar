links:
  website: https://citisma.org/
notes:
- New conference; 2026 appears to be the first edition
- Hosted by Bina Nusantara University (Indonesia); many committee members are from Sydney-based institutions
- Hybrid event connecting participants in Indonesia, Australia and Malaysia; physical host is BINUS in Jakarta
- Technical sponsors are the IEEE Indonesia Section and its Computer Society chapter
- Broad scope (AI, IoT, cybersecurity, data analytics, cloud and edge, robotics, Industry 4.0)
- Papers of 4 to 6 pages in IEEE format via Microsoft CMT; presented papers are submitted to IEEE Xplore
- "Fee: USD 250 regular, USD 200 students, USD 50 off for IEEE members (2026)"
- Important dates are published only as images on the official site
