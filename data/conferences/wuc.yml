notes:
- Workshop on computing with brain-inspired unary (spike, rate or temporal coded) data, from theory and applications to unary circuits, ISAs and systems
- Editions at ISCA 2019, ASPLOS 2024 and ASPLOS 2026 (Pittsburgh); irregular schedule
- Unpublished, work-in-progress and already published work are all welcome
- Up to 4 pages excluding references in the ACM sigplan template; double-blind
- Accepted papers are presented and included in the workshop report; no formal proceedings series named
- Separate registration (abstract) deadline one week before the paper deadline
- Attendance requires ASPLOS registration
- Not listed in CORE ICORE2026
