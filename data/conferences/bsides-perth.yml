notes:
- Community-driven Security BSides conference in Perth, Western Australia, running since 2017
- Two days of technical talks, hands-on workshops and a CTF; held at UWA Business School, Crawley
- Call for papers via a Google Form; first-time speakers welcome, sales pitches not accepted
- Run at cost; ticket and sponsorship income goes back into the event
- No proceedings; the organizers run a YouTube channel
