notes:
- Annual congress of the Spanish NLP society SEPLN, held for more than 30 years; 2026 was the 42nd edition
- Papers in Spanish or English, at most 10 pages plus references, blind review by at least three members of the
  SEPLN advisory board via OpenReview
- High-quality papers go into the society journal Procesamiento del Lenguaje Natural (2026 -> issue 77, Scopus and
  JCR ESCI indexed); other accepted papers, projects and demos go into CEUR-WS proceedings as posters
- Co-located with the IberLEF evaluation workshop and a doctoral symposium
- Held in Spain (A Coruna 2022, Jaen 2023, Valladolid 2024, Zaragoza 2025, Leon 2026), virtual in 2020 and 2021;
  2027 in Santiago de Compostela
- Website mostly in Spanish
- Fee 300 EUR early for members, 400 EUR non-members, 230 EUR students (2026)
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
