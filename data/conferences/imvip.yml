notes:
- Flagship annual conference of the IPRCS, the Irish member body of the IAPR
- Held at a different university on the island of Ireland each year (Galway 2023, Limerick 2024, Derry 2025, Maynooth 2026)
- Full papers up to 8 pages and short papers up to 4 pages, both including references
- Blind review by at least two program committee members
- Proceedings published open access by the IPRCS with an ISBN (2024 volume hosted in the IET Digital Library)
- Each registration covers one paper only
- Small, friendly venue popular with Irish and UK students; travel bursaries offered
