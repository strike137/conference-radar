notes:
- Workshop on mechanically movable antennas and electronically reconfigurable antennas (also fluid and flexible
  antennas) for wireless communication and sensing
- Held at GLOBECOM 2024 (as "Intelligent and Reconfigurable Antennas"), GLOBECOM 2025 in Taipei (3rd) and
  GLOBECOM 2026 in Macau (5th)
- Steering committee includes Rui Zhang (NUS), Robert Schober (FAU), Naofal Al-Dhahir (UT Dallas) and Zhiguo Ding
- 2025 edition was a full-day workshop with several paper sessions
- Workshop papers go into the GLOBECOM proceedings and IEEE Xplore; no-show papers are removed
- Not listed in ICORE2026
