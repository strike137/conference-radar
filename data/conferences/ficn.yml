notes:
- New conference in 2026 from the Emerging Technologies Network, the same group behind FMEC and SNAMS
- Broad scope covering 5G/6G, AI for networking, IoT, edge computing, network security and general AI topics
- Accepted, registered and presented papers are submitted to IEEE Xplore and Scopus
- Full papers up to 8 pages in the IEEE conference template, two extra pages for a fee
- Hybrid format; at least one author must register and present or the paper is dropped from the proceedings
- Very fast review cycle (2026 notification about two weeks after the submission deadline)
- First edition in San Antonio, USA, with local organizers from Texas A&M University San Antonio
- Not listed in ICORE2026; not on the CCF 2026 list
