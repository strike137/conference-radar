organizer: YOW! (Trifork, which also runs GOTO conferences)
organizer_country: [europe]
proceedings: None (non-archival; talks recorded and posted on YouTube)
archival: false
fee: AUD 1,375 standard two day conference ticket, masterclasses AUD 990 extra (Melbourne 2026)
typical:
  conference_months: [12]
links:
  website: https://yowcon.com/
notes:
- Vendor-neutral software developer conference, first held in May 2008 as the Australian sibling of JAOO (now
  GOTO); owned by Trifork, which runs the GOTO conferences, since September 2022
- Runs as a December tour of Australian cities (Melbourne, Brisbane, Sydney), each with two conference days plus a
  masterclass day
- No open call for presentations; speakers are invited by an international program committee, with community
  nominations accepted
- Intermediate to advanced talks of 30 to 45 minutes on building modern software; no papers
- Also runs one day YOW! Tech Leaders Summits in mid-year
