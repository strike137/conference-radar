notes:
- Annual national symposium of the SICE (Society of Instrument and Control Engineers) Systems and Information
  Division, planned by its Technical Committee on Intelligent Systems; held every March (53rd edition in 2026)
- Covers computational intelligence, AI, learning, fuzzy systems, neural networks, swarm and evolutionary
  computation, artificial life, human interfaces and social information systems
- Co-sponsored by IPSJ, IEICE, IEEJ, JSAI, RSJ, SOFT, the Japanese Society for Evolutionary Computation and others
- Papers of 2 to 6 A4 pages submitted via EasyChair; peer review is not mentioned
- Proceedings are released as a single PDF on the symposium website
- Recent venues - Matsue (2023, hybrid), Kindai University Higashi-Osaka (2024, 2025), Toyama (2026); online 2021
  and 2022
- Deadlines are usually extended
- Not listed in CORE ICORE2026
