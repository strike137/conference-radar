id: cniot
name: CNIOT
full_name: International Conference on Computing, Networks and Internet of Things
type: conference
tier: minor
areas: [networking, systems]
region: china
language: english
frequency: annual
organizer: CNIOT conference secretariat with a host university each year (Nanjing University and XJTLU in 2027)
organizer_country: [china]
proceedings: IEEE Xplore (2022, 2025, 2026) or ACM DL (2020, 2021, 2023, 2024)
archival: true
indexing: [EI, Scopus]
fee: 550 USD regular, 500 USD student (2027, early bird, 5 pages)
typical:
  deadline_months: [2]
  conference_months: [5]
links:
  website: http://www.cniot-conf.net/
notes:
- First held in 2020; editions in Qingdao (2022, moved online), Xiamen (2023), Tokyo (2024), Shanghai (2025), Guangzhou (2026) and Suzhou (2027)
- Proceedings alternate between IEEE Xplore and ACM ICPS, indexed in EI Compendex and Scopus
- Double blind review by 2 or 3 committee members after a preliminary check; revisions allowed within 10 days
- Run by a conference secretariat (bilingual Chinese and English site); hybrid with online presentation
- Not listed in CORE ICORE2026
