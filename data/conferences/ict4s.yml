notes:
- Interdisciplinary conference on ICT and environmental, social and economic sustainability (green software, energy of ICT, data centers, policy)
- 'Recent hosts: Rennes (2023), Stockholm (2024), Dublin (2025), Bern (2026), Paris (2027)'
- Research papers in IEEE Xplore (2024 onward; 2020 ACM DL, 2019 CEUR-WS, 2014 to 2016 Atlantis Press); borderline papers may become short papers in CEUR-WS (2027)
- Double-blind review; 10 pages plus 2 pages of references, IEEE format; mandatory abstract one week before the paper
- Week-long event with workshops, doctoral symposium, posters and an industry and policy day; hybrid participation encouraged
- Not ranked in ICORE2026 and not on the CCF 2026 list
