notes:
- Flagship conference of the International Society of Information Fusion (ISIF), held annually since 1998
- Covers sensor, data, information and knowledge fusion, including tracking, nonlinear filtering, data association,
  localization, situation assessment and machine learning for fusion
- Rotates between Europe, North America and other regions (2021 Sun City, 2022 Linkoping, 2023 Charleston, 2024
  Venice, 2025 Rio de Janeiro, 2026 Trondheim, 2027 Buffalo)
- Full papers of 5 to 8 pages in IEEE format, single-blind peer review via Microsoft CMT
- Accepted papers are published in IEEE Xplore; the 2027 site says they are indexed in Scopus and Web of Science
- FUSION 2026 allowed up to two extra pages for a fee of NOK 1000 each; FUSION 2027 allows no extra pages
- Announced future editions are 2028 Prague, Czech Republic and 2029 Huntsville, Alabama, USA
- CORE C in ICORE2026; not on the CCF 2026 list
