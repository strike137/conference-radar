notes:
- Workshop on Craig interpolation, Beth definability, second-order quantifier elimination, forgetting and uniform interpolation, across proof theory, automated reasoning, knowledge representation, verification and databases
- Merges earlier series SOQE (Dresden 2017, online 2021), iPRA (latest in 2022 at FLoC Haifa) and CIBD (Amsterdam 2024); 2026 was the first edition under this name
- CI-BD-SOQE 2026 was held at FLoC 2026 in Lisbon
- Full papers (10 to 15 pages), extended abstracts (5 to 9 pages) and abstracts of published work (1 to 4 pages), reviewed by the PC
- Proceedings in CEUR Workshop Proceedings (CI-BD-SOQE 2026 -> CEUR Vol. 4228; SOQE 2021 -> Vol. 3009; SOQE 2017 -> Vol. 2013)
- Not listed in ICORE2026 or the CCF 2026 list
