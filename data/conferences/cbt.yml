notes:
- Co-located with ESORICS every year since 2017; 10th edition in 2026 (Rome)
- Springer LNCS post-proceedings (revised selected papers), in the ESORICS workshops volumes together with DPM and CyberICPS
- Full papers up to 16 pages, short papers up to 8 pages in LNCS format; double-blind review
- Submitted through the ESORICS EasyChair site, selecting the CBT track
- One-day workshop; at least one author must hold a full (non-student) registration and present
- Not listed in ICORE2026 or the CCF 2026 list
