notes:
- Founded in 2023 as the successor of the AutoSec workshop at NDSS; the 2023 and 2024 editions were co-located with
  NDSS in San Diego, and since 2025 it is a USENIX symposium co-located with USENIX Security in August
- Covers security and privacy of ground, aerial, water and space vehicles, including in-vehicle networks, V2X, autonomy
  and AI/ML for driving
- Regular and SoK papers up to 13 pages, short position or WIP papers up to 6 pages (excluding references and appendices);
  anonymized review
- Proceedings published open access by USENIX; separate demo/poster/tutorial/lightning talk call with a later deadline
  (May)
- Unranked in CORE and CCF; a young, niche venue that is realistic for student work on automotive and drone security
