notes:
- Organized and sponsored by ACL SIGLEX; proceedings in the ACL Anthology (volumes every year since 2012)
- Co-located with a major ACL conference each year (EMNLP 2025 in Suzhou, ACL 2026 in San Diego), so the location
  follows that conference
- Accepts direct submissions and ARR commitments; long papers up to 8 pages and short papers up to 4 pages (plus 1
  page each when accepted)
- 2026 edition was a one-day event because of ACL venue size limits; travel support for student lead authors was
  offered in 2025
- Not found in the ICORE2026 or CCF 2026 lists
