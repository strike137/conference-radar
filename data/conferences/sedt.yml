notes:
- One-day workshop on digital twins from a software engineering perspective; first edition in 2025 with CBSoft in Recife
- Organized by Everton Cavalcante and Thais Batista (UFRN) and Flavio Oquendo (Université Bretagne Sud)
- Full papers up to 10 pages, short papers and experience reports up to 6, references included; SBC template, Portuguese
  or English, submitted via JEMS3
- Single-blind review; accepted papers published in SBC OpenLib (SOL) with DOIs
- "2025: 3 papers accepted out of 9 submissions (33.3%)"
- At least one author must register for CBSoft and present in person
- Not listed in CORE ICORE2026
