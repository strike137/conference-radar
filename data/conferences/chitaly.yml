notes:
- Human-computer interaction conference of the Italian ACM SIGCHI chapter, held every two years in Italy (odd years)
- Accepted long and short papers are published in the ACM Digital Library in the International Conference Proceedings Series
- Tracks for long and short papers, pictorials, posters, interactive experiences, workshops and a doctoral consortium
- Submissions are anonymous; papers in English using the ACM SIG template
- 2025 edition (16th) in Salerno with 40 long and 34 short papers, 25 posters and 11 workshops
- "Registration fee: 550 EUR main conference for ACM members, 350 EUR for students, plus 22% VAT (2025, early)"
- Not listed in the CORE portal (ICORE2026) or on the CCF list
