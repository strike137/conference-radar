links:
  website: https://algo-conference.org/2026/algocloud/
notes:
- Held every year as part of the ALGO meeting with ESA, ALGOWIN, ATMOS, IPEC, WABI and WAOA (Egham 2024, Warsaw 2025, L'Aquila 2026)
- Algorithmic and systems work on cloud, edge and fog computing, the cloud-edge continuum, decentralized systems and dynamic networks
- 2026 was the 11th edition
- Post-proceedings in Springer LNCS, camera-ready due in October after the event (2025 was LNCS 16349)
- Regular papers up to 12 pages plus optional appendix, short papers 2 to 8 pages, and survey proposals of 5 to 10 pages
- At least one author must register for ALGO and present
- Steering committee chaired by Christos Zaroliagis (University of Patras)
- Small program, 10 accepted papers in 2025 and 2026
- Not in ICORE2026 and not on the CCF list
