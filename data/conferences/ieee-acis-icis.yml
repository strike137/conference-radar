id: ieee-acis-icis
name: IEEE/ACIS ICIS
full_name: IEEE/ACIS International Conference on Computer and Information Science
type: conference
tier: minor
areas: [general, software, ai, networking, systems]
region: worldwide
language: english
frequency: multiple-per-year
organizer: ACIS (International Association for Computer and Information Science, USA)
organizer_country: [usa]
proceedings: IEEE Xplore (IEEE CPS); selected papers in IJNDC (Springer), IJSI or IJBDIA (IGI Global), or Springer
  Studies in Computational Intelligence
archival: true
indexing: [EI, INSPEC, DBLP]
rank:
  core: C
typical:
  deadline_months: [2, 3, 5, 6, 7]
