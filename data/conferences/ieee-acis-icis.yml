links:
  website: https://www.acisinternational.org/conferences/
notes:
- Run by ACIS several times a year alongside SNPD and SERA; 27th edition at Towson University in 2026
- '2027 editions: Las Vegas (May), Hohhot (Jul), Beijing (Aug) and Kyoto Institute of Technology (Sep)'
- Proceedings published by IEEE Conference Publishing Services and submitted to EI, INSPEC and DBLP; outstanding papers
  go to ACIS journals and Springer SCI
- Regular papers up to 8 pages, short papers up to 4 pages (IEEE template), submitted via EasyChair; hybrid option
  in Las Vegas 2027
- CORE C (ICORE2026); generally regarded as a low-tier venue
