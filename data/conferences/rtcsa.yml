notes:
- Long-running real-time and embedded systems conference (32nd edition in 2026); steering committee drawn mainly
  from Asia (Japan, Korea, Taiwan, China/Hong Kong, Singapore) plus one US member
- Rotates around Asia (Sokcho 2024, Singapore 2025, Qingdao 2026)
- Three tracks (real-time systems; IoT, CPS and emerging applications; embedded systems) plus an industry session
  and posters/demos
- Full papers 10 pages plus 2 for references, short papers 6 plus 2, IEEE format, single-blind review
- Accepted papers go to IEEE Xplore; selected papers invited to the Journal of Systems Architecture
- In-person presentation required; ICORE2026 rank B
