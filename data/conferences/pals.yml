- Workshop held with ICISSP (INSTICC); 2027 edition in Valletta, Malta
- Interdisciplinary computer science and law workshop; papers co-authored by technical and legal researchers are especially welcome
- 'Topics: GDPR compliance of AI systems, EU AI Act, content moderation, AI in criminal investigations, digital evidence, cybercrime'
- Accepted papers go in a special section of the ICISSP proceedings and the SCITEPRESS Digital Library with a DOI
