id: icbdc
name: ICBDC
full_name: International Conference on Big Data and Computing
type: conference
tier: minor
areas: [data, general]
region: asia-pacific
language: english
frequency: annual
organizer: Commercial conference secretariat (contact icbdc@chairmen.org, zmeeting submission system) with host and co-sponsor universities that change each year
organizer_country: [china]
proceedings: IET Conference Proceedings (IET Digital Library, IEEE Xplore)
archival: true
indexing: [EI, Scopus]
fee: 590 USD per author registration (2026, regular; 560 USD early bird); 430 USD presentation only
typical:
  deadline_months: [4]
  conference_months: [5]
links:
  website: https://www.icbdc.org/
notes:
- Annual since 2016; held in China from 2018 to 2021, virtual in 2022 and 2023, then Bangkok 2024, Singapore 2025 and Jeju 2026
- Proceedings in ACM ICPS (ACM DL) from 2018 to 2024; since 2025 in IET Conference Proceedings, included in IEEE Xplore
- Run by a commercial conference secretariat (secretary office in GMT+8 with a +86 phone number)
- 2026 edition technically co-sponsored by Jeju National University and the Sensors and System Society of Singapore, supported by Chulalongkorn University
- Papers 4 to 10 pages, one registration covers 5 pages; the site says the review is double-blind but asks for author names in the paper
- Presentation only registration without publication is also offered
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
