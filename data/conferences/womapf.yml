notes:
- Workshop on multi-agent path finding, planning and coordination, held with IJCAI or AAAI (editions in 2012, 2016, 2019, 2020, 2023, 2025, 2026 and 2027)
- Annual with AAAI since 2025 (Philadelphia 2025, Singapore 2026, Montreal 2027)
- Non-archival, light single-blind review with at least two reviews per submission; no page limit, published or concurrent work welcome
- Industry panel and poster session; all presentations in person under AAAI policy
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
