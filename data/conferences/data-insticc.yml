notes:
- Organized by INSTICC; proceedings in the SCITEPRESS Digital Library, a short list of revised and extended papers
  is planned for a Springer CCIS book and best papers are invited to a Springer Nature Computer Science special issue
- CORE C (ICORE2026); regarded as a minor venue
- Covers databases, big data, data mining, data management, analytics and data privacy
- Two submission stages (1st stage gives an earlier notification), plus late-breaking papers and an abstracts track;
  all deadlines AoE
- Co-located with ICSOFT, DeLTA, SECRYPT, QUANTICS and SIMULTECH with free cross access; hybrid presentation allowed
  when speakers cannot travel
- Held in European cities (Lisbon 2022, Rome 2023, Dijon 2024, Bilbao 2025, Porto 2026, Rome 2027)
