id: icicsp
name: ICICSP
full_name: IEEE International Conference on Information Communication and Signal Processing
type: conference
tier: minor
areas: [communications, networking]
region: china
language: english
frequency: annual
organizer: Rotating Chinese host university with IEEE as co-sponsor (Xi'an Jiaotong University 2025, East China Normal
  University with IEEE China Council 2026)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 530 to 580 USD regular, 500 to 520 USD student (2026)
typical:
  deadline_months: [8]
  conference_months: [9]
links:
  website: https://www.icsp.org/
notes:
- Started in 2018 in Singapore; held in China since 2019 (Weihai 2019, virtual 2020, Shanghai 2021, Shenzhen 2022,
  Xi'an 2023, Zhoushan 2024, Xi'an 2025, Shanghai 2026)
- Proceedings in IEEE Xplore and indexed by Ei Compendex and Scopus every year since 2018 (IEEE record 71235 for 2026)
- Broad scope covering signal processing, multimedia, communication theory, networking and antennas; many special
  sessions (17 in 2026) on acoustics, radar, array processing and integrated sensing and communications
- Papers up to 5 pages in IEEE format, maximum 8 pages with 70 USD per extra page; abstract-only option not in IEEE Xplore
- Selected papers recommended to the journals Intelligence & Robotics and Displays (2026)
- Not listed in CORE ICORE2026 or the CCF list
