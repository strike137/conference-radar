notes:
- ASE workshop on analysis of Android, iOS and OpenHarmony apps (security and privacy, malware, testing, performance, LLM-based app analysis)
- Held with ASE every year since 2018; 8th edition at ASE 2025 in Seoul on 16 November 2025
- Regular papers up to 8 pages and short papers up to 4 pages, ASE formatting rules
- Accepted papers go into the ASE workshop proceedings; selected 2024 papers were invited to an ASE Journal special issue
- Past venues follow ASE (Melbourne 2020, virtual 2021, Ann Arbor 2022, Luxembourg 2023, Sacramento 2024, Seoul 2025)
- Not among the accepted ASE 2026 workshops
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
