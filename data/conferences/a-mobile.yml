notes:
- One-day workshop on mobile app analysis (Android, iOS, OpenHarmony) covering static and dynamic analysis, security and privacy, malware, testing and LLM-based analysis
- Held with IEEE/ACM ASE every year since 2018 (Melbourne 2020, virtual 2021, Ann Arbor 2022, Luxembourg 2023, Sacramento 2024, Seoul 2025)
- Regular papers up to 8 pages and short papers (new ideas, visions, tool demos) up to 4 pages, including references
- Accepted papers go into the ASE workshop proceedings; the 2025 volume (ASEW 2025) is in IEEE Xplore
- Selected papers invited to extend for an Automated Software Engineering journal special issue
- Not among the ASE 2026 workshops; no 2026 edition announced as of 2026-10-17
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
