notes:
- Long-running Japanese agile practitioner conference, held since 2009, aimed at spreading agile across Japanese industry
- Talks come from a public call for sessions (experience reports on agile, AI, organizational change and product development) plus invited keynotes
- Held in November since 2020; at Bellesalle Shinjuku Central Park, Tokyo, as a hybrid event in 2025 and 2026
- Supported by JUAS, JUSE, PMI Japan Chapter and the Japan SPI Consortium
- "Fee: 22,000 JPY early on-site, 16,500 JPY online (2026)"
- No papers or proceedings; talks only
- Not listed in CORE ICORE2026
