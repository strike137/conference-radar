notes:
- Kakao's flagship developer conference, where the company shares its technology vision and engineering work
- "if(kakao)26 themes: Day 1 on AI across Kakao services, Day 2 on trust in technology"
- Held at Kakao AI Campus since 2024 (Oct 22-24 2024, Sep 23-25 2025, Oct 13-14 2026); 2022 was an online event
- The third day of if(kakao)25 was open to Kakao staff only
- Free to attend; on-site seats go to applicants selected from an application window (Sep 7 to Sep 28 for 2026), one day per person, age 18 or over
- Sessions are live-streamed; slides are posted on the site and session videos on the kakaotech YouTube channel
- No papers or proceedings; practitioner talks only
- Not listed in the CORE ICORE2026 portal
