notes:
- Flagship international conference of ICROS, the Korean Institute of Control, Robotics and Systems; held since 2001
- "Topics: control, automation, robotics and systems"
- Proceedings regularly indexed in IEEE Xplore, Scopus and EI Compendex; authors choose whether their paper goes to IEEE
  Xplore
- Regular and organized session papers 1 to 6 pages via PaperCept (only papers of 3 pages or more can go to IEEE
  Xplore); also 1 to 2 page late result papers (poster, not indexed) and dissemination papers (not in the proceedings)
- An IJCAS option sends an extended version to the ICROS journal IJCAS; papers accepted there are not put in IEEE Xplore
- Held in Korea almost every year (Jeju, Busan, Yeosu, Incheon); 2026 edition in Sapporo, Japan
