notes:
- Flagship annual security and privacy summit of DSCI, the industry body for data protection in India set up by NASSCOM
- 2026 is the 21st edition; held since 2009, usually in December; at The Leela Ambience, Gurugram from 2016 to 2023 (virtual in 2020 and 2021) and at Pullman Aerocity, New Delhi since 2024
- Three days of keynotes, track sessions, workshops, panels and invite-only sub-events, with sponsors and exhibitors
- Audience of CISOs and other executives, policy makers and regulators, security and privacy professionals, academia, government and startups
- No call for papers and no proceedings; speakers apply through a speaker submission form with no stated deadline
- Not listed in the CORE ICORE2026 portal
