notes:
- Satellite workshop of MICCAI on ophthalmic image analysis, 13th edition in 2026
- Moves with MICCAI (Daejeon 2025, Strasbourg 2026)
- Proceedings in Springer LNCS, own volume each year (LNCS 16209 for OMIA 2025, 17 full papers from 33 submissions)
- Run together with ophthalmic imaging challenges (GAVE and SICS-155 in 2025, GAVE2 in 2026)
- Site hosted by the HDMI Lab of Prof. Yanwu Xu, who founded the workshop; 2026 organizers from the UK, China, Singapore, the USA, Austria and the UAE
- Full day workshop in 2025 and 2026
- Not listed in CORE ICORE2026 or the CCF 2026 list
