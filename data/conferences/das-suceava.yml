notes:
- Biennial (even years) general EECS conference held in Suceava, Romania, every edition; 18th edition in 2026
- Organized by Stefan cel Mare University of Suceava with TU Cluj-Napoca and the Technical University of Moldova; IEEE IAS technical sponsorship
- Four sections, covering control and automation, communications and networks, electronics and CAE, and software and IT
- Proceedings in IEEE Xplore (2016 onward); 2014 and 2018 proceedings indexed in Web of Science
- Small conference with about 30 to 60 papers per edition (36 papers in 2024)
- Extended versions of selected best papers invited to Advances in Electrical and Computer Engineering
- Not to be confused with the IAPR Document Analysis Systems workshop (also DAS)
- Not listed in ICORE2026
