notes:
- Workshop on explainable AI methods that support scientific discovery (hypothesis generation and validation, counterfactuals, interpretable models for scientific data)
- 1st edition co-located with EDBT/ICDT 2026 in Tampere, Finland (half-day, 24 March 2026)
- Papers appear in the CEUR-WS EDBT/ICDT 2026 workshops volume (Vol-4192)
- Full papers up to 6 pages (excluding references), short papers up to 4 pages (including references), ACM double-column format; double-blind review via Microsoft CMT
- Not in the list of EDBT/ICDT 2027 workshops (Lille); no next edition announced
- Not listed in CORE ICORE2026 or the CCF 2026 list
