notes:
- Run by the Chinese Association for Artificial Intelligence (CAAI); 2026 edition co-sponsored by IEEE Computational Intelligence Society and hosted by Chongqing University of Technology
- 2026 is the 10th edition; held in China every year (2024 Fuzhou, 2025 Ordos, 2026 Chongqing)
- All areas of AI, from machine learning and multi-agent systems to LLMs, embodied intelligence and AI applications
- Accepted papers go to IEEE Xplore; past proceedings (2021 to 2024) are in IEEE Xplore and indexed in EI Compendex and Scopus
- Single-blind review by 2 to 3 reviewers; selected papers are recommended to SCI and EI journals
- Online and in-person registration both offered in 2026; not listed in CORE ICORE2026 or the CCF list
