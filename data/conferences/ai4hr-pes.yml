notes:
- Full-day workshop at ECML PKDD on AI, NLP and data science for job markets, HR and public employment services
- Continues FEAST (ECML PKDD 2021 online, 2022 Grenoble); AI4HR&PES at Turin 2023, Vilnius 2024 and Naples 2026, no 2025 edition listed
- Extended abstracts up to 6 pages in Springer LNCS style, single-blind review; papers already published elsewhere are also accepted
- No formal proceedings; accepted papers are posted on the workshop website and a journal special issue may follow
- Not listed in CORE ICORE2026
