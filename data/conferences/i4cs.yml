notes:
- Started in 2001 in Ilmenau as the I2CS workshop (Innovative Internet Computing Systems); renamed I4CS in 2014
- Held every June; the steering committee alternates between a German and an international location
- 'Recent venues: Bamberg 2023, Maastricht 2024, Munich 2025, Copenhagen (DTU) 2026, Ingolstadt (TH Ingolstadt) 2027'
- Papers published in Springer CCIS (2026 edition is CCIS 3007); submitted for DBLP and Scopus indexing
- Full papers up to 20 pages, single-blind review by at least three program committee members, submission through EasyChair
- Broad scope covering networks, IoT, security, data, AI and applications for digital communities
- Small conference supported by Deutsche Telekom; CORE C in ICORE2026
