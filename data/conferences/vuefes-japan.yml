notes:
- Frontend conference in Tokyo run by the Vue.js Japan Users Group, billed as one of the largest frontend
  conferences in Japan
- Rebranded in 2025 to cover the wider JavaScript ecosystem (Vite, VoidZero tools), not only Vue.js
- Held at Otemachi Place Hall and Conference, Tokyo, in 2025 and 2026; one day in October
- Over 800 attendees in 2025; speakers include Vue.js and Vite creator Evan You and other OSS core team members
- Talks chosen from an open call for proposals; student support program offered
- No papers or proceedings; talks only
