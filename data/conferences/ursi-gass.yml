full_name: URSI General Assembly and Scientific Symposium
type: conference
tier: minor
areas: [communications]
region: worldwide
language: english
frequency: irregular
organizer: URSI (International Union of Radio Science)
organizer_country: [international]
proceedings: IEEE Xplore (summary papers) and URSI proceedings
archival: true
fee: 935 EUR standard early, 765 EUR URSI/IEEE AP-S/MTT-S member early, 395 EUR student early (2026)
typical:
  deadline_months: [1, 2]
  conference_months: [8]
links:
  website: https://www.ursi-gass2026.pl/
notes:
- Flagship event of URSI, held every three years since 1919 and covering all ten URSI commissions (electromagnetics,
  radio communication and signal processing, propagation, remote sensing, radio astronomy, bioelectromagnetics, ...)
- Rotates worldwide (2014 Beijing, 2017 Montreal, 2021 Rome hybrid, 2023 Sapporo, 2026 Krakow, 2029 Singapore);
  the 2020 Rome edition was cancelled
- Large meeting with about 1300 accepted papers in 2026
- Summary papers (2 to 4 pages) go to IEEE Xplore unless the author opts out; 1-page extended abstracts appear only
  in the conference proceedings
- Student Paper Competition and Young Scientist Awards; SPC full papers are prepared as Radio Science Letters submissions
- One author registration by the early bird deadline covers at most 2 papers
- Not listed in CORE ICORE2026 or the CCF 2026 list
