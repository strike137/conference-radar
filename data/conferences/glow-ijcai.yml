notes:
- IJCAI workshop on data-efficient and model-efficient generalization (few-shot learning, domain adaptation, model compression, efficient generative models)
- Editions at IJCAI 2023 (Macao), IJCAI 2024 (Jeju), IJCAI 2025 (Guangzhou venue) and IJCAI-ECAI 2026 (Bremen)
- Accepted papers published in Springer Communications in Computer and Information Science (GLOW 2024 is CCIS volume 2160)
- 2026 long papers up to 7 pages, extended abstracts up to 4 pages; double-blind review on OpenReview
- Runs a challenge alongside the workshop
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
