notes:
- Practitioner conference of the NLUUG association for Unix, Linux, open source and open standards professionals in the Netherlands
- Usually a spring conference (voorjaarsconferentie) and an autumn conference (najaarsconferentie); 2026 had only the spring conference plus a short member afternoon in November
- Talks selected by a programme committee through an open call for proposals; audience of sysadmins, network engineers, developers and security people
- No proceedings; talks are recorded and slides and recordings are posted on the event pages
- Talks in Dutch and English; held in Utrecht in 2025 and 2026, moving to TU Delft for 2027
