id: weis
name: WEIS
full_name: Workshop on the Economics of Information Security
type: conference
tier: major
areas: [security, general]
region: worldwide
language: english
frequency: annual
organizer: WEIS community with rotating local hosts (2025 University of Tokyo IIS, 2026 UC Berkeley / ICSI)
organizer_country: [international]
proceedings: None (non-archival)
rank:
  core: Unranked
fee: 600 USD academic, 700 USD industry, 300 USD student, 50 USD online-only (2026); early 30,000 JPY academic,
  20,000 JPY student (2025)
typical:
  deadline_months: [1, 2]
  conference_months: [6]
links:
  website: https://weis2026.econinfosec.org/
notes:
- Main interdisciplinary forum on the economics of security and privacy (economics, law, policy, business and computer
  science)
- 'Non-archival: no refereed proceedings; authors can submit revised papers to a Journal of Cybersecurity special
  collection'
- Double-anonymous review with no fixed format; work must not be under review elsewhere during the review period
- Mostly held in the US and Europe; the 24th edition (2025) was at the University of Tokyo, locally supported by
  JSSM and IPSJ SIG SPT
- Online-only attendance possible (50 USD in 2026)
