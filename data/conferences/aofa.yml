notes:
- Annual meeting of the Analysis of Algorithms community (analytic combinatorics, probabilistic and average-case analysis of algorithms and data structures)
- Proceedings in the open-access LIPIcs series (Schloss Dagstuhl); AofA 2026 is LIPIcs volume 381
- Extended abstracts of 12 to 15 pages in LIPIcs style, submitted via EasyChair
- Hosts the Flajolet Lecture, given by the winner of the Philippe Flajolet Lecture Prize
- Location rotates worldwide (Taipei 2023, Bath 2024, Toronto 2025, Munich 2026, Marne-la-Vallee 2027, Graz 2028)
- Ranked C in ICORE2026
