notes:
- Small conference on programming education (teaching tools, AI in education, pedagogy, gamification), held every year since 2020
- Always held in Portugal (Vila do Conde 2023, Lisbon 2024, Porto 2025, Guimaraes 2026)
- Proceedings in the open-access OASIcs series (Schloss Dagstuhl), indexed by Scopus and DBLP
- Full papers 8-14 pages, short papers 6-8 pages, OASIcs template, submission via Microsoft CMT
- Two submission calls in 2026; best paper invited to a journal special issue
- "Registration fee: 195 EUR regular, 170 EUR student author (2026)"
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
