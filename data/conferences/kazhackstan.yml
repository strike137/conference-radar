notes:
- Practitioner cybersecurity and hacker conference in Kazakhstan, billed as the largest hacker conference in Central Asia
- Run by TSARKA, the Kazakh Center for Analysis and Investigation of Cyber Attacks
- Theme days (government and business, secure SDLC, offensive and hacking techniques, malware research) plus the CyberKumbez CTF; more than 6,000 visitors
- Speaker applications cover lectures, workshops, panels, demos and lightning talks; no formal proceedings
- Site in Russian, Kazakh and English; standard ticket 5,000 KZT (2026)
