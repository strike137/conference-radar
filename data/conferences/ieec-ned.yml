id: ieec-ned
name: IEEC
full_name: International Electrical Engineering Conference
type: conference
tier: minor
areas: [communications, ai, networking, general]
region: south-asia
language: english
frequency: annual
organizer: Department of Electrical Engineering, NED University of Engineering and Technology, with the Institution of Engineers Pakistan (IEP) Karachi Centre
organizer_country: [other]
proceedings: IEEE Xplore (ICEEET 2026, pending IEEE approval); Scientific.Net (IEEC April 2026); MDPI Engineering Proceedings (2022, 2023)
archival: true
links:
  website: https://ieec.neduet.edu.pk/ieec_drupal/IEEC_Index
notes:
- Run by NED University, Karachi, Pakistan, with IEP Karachi Centre since 2016; usually held on the NED campus in Karachi
- Broad electrical engineering scope (power and smart grids, renewables, ICT, AI, networks, embedded systems, electronics, control)
- Two editions in 2026 -> the 11th IEEC in Karachi in April and the 12th, renamed IEEE ICEEET (International Conference on Electrical Engineering and Emerging Technologies), at the University of Peradeniya, Kandy, Sri Lanka in October
- ICEEET 2026 signed an MoU with IEEE Sri Lanka Section for IEEE Xplore proceedings, still awaiting final IEEE approval
- Publisher changes often; 2022 and 2023 papers in MDPI Engineering Proceedings, 2025 proceedings as PDFs on the conference site, April 2026 proceedings on Scientific.Net
- Dates move around (June to August 2023, May to August 2025); hybrid format, submission via Microsoft CMT
- Not listed in ICORE2026 or the CCF 2026 list; a small regional venue
