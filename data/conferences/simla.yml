notes:
- ACNS satellite workshop held every year since 2019 (8th edition in 2026); the ACNS 2026 workshop list writes it
  as SMLA
- Post-proceedings in Springer LNCS (ACNS Workshops volumes); LNCS format up to 20 pages including references, anonymous
  submission, work-in-progress papers welcome
- 'Follows ACNS around the world: Kyoto 2023, Abu Dhabi 2024 (held in March), Munich 2025, Stony Brook 2026; ACNS
  2027 is at Royal Holloway, UK (June 28 to July 1, 2027)'
- 10 papers in the 2026 program; SiMLA papers won the ACNS best workshop paper award (EUR 500, sponsored by Springer)
  in 2019, 2020 and 2026
