notes:
- Hosted by KIISC (Korea Institute of Information Security and Cryptology) with NSR; held in Seoul every year since
  1998 (only 2006 was in Busan), late November or early December
- Proceedings in Springer LNCS; anonymous submission, up to 20 LNCS pages excluding bibliography and appendices
- 'Regarded as mid-tier, but relatively high-level among the Korean-society security venues; ICORE2026 lists it
  as National: Korea (it was CORE B in 2018)'
- 'Not in the CCF list: the CCF-C venue with the same full name is Inscrypt (China), a different conference'
- 'Deadline usually extended twice (2025: Sep 5 -> Sep 19 -> Sep 24; 2026: Aug 28 -> Sep 11 -> Sep 27), 18:00 KST'
