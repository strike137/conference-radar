id: icisc
name: ICISC
full_name: International Conference on Information Security and Cryptology
type: conference
tier: minor
areas: [security, crypto]
region: korea
language: english
frequency: annual
organizer: KIISC (Korea Institute of Information Security and Cryptology) and NSR (National Security Research Institute)
proceedings: Springer LNCS
indexing: [DBLP, Scopus]
rank:
  core: 'National: Korea'
acceptance_rate: 38% (2025, 28/74); 40% (2024, 23/58)
fee: 550 USD general, 350 USD student (2025, international registration)
typical:
  deadline_months: [8, 9]
  conference_months: [11]
links:
  website: https://www.icisc.org/
