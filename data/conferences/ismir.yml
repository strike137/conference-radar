full_name: International Society for Music Information Retrieval Conference
type: conference
tier: major
areas: [ai, data]
region: worldwide
language: english
frequency: annual
organizer: International Society for Music Information Retrieval (ISMIR), with a local organizing team each year
organizer_country: [international]
proceedings: ISMIR Proceedings (open access on ismir.net and Zenodo, with DOIs and ISBN)
archival: true
indexing: [DBLP]
fee: 500 USD full author, 250 USD student author, plus 5% VAT (2026, in-person or virtual)
