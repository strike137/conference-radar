  deadline_months: [3, 4]
  conference_months: [9, 10, 11]
links:
  website: https://ismir2026.ismir.net/
  dblp: https://dblp.org/db/conf/ismir/index.html
notes:
- Annual flagship conference of the International Society for Music Information Retrieval, held since 2000
- Rotates worldwide (2022 Bengaluru, 2023 Milan, 2024 San Francisco, 2025 Daejeon, 2026 Abu Dhabi)
- Open access proceedings published by ISMIR on ismir.net and Zenodo, each paper with a DOI
- Double-blind review with at least three reviewers and a meta-reviewer; abstract deadline one week before the full
  paper deadline
- Interdisciplinary community (signal processing, machine learning, musicology, library science); also has late
  breaking demos, tutorials, a music program and satellite workshops
- 2026 is hybrid; every accepted paper needs one registered author who presents in person or online
- Not listed in ICORE2026 and not in the CCF list
- Related journal is TISMIR (Transactions of the International Society for Music Information Retrieval)
