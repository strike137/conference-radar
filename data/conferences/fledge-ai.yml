notes:
- Workshop co-located with ACM MobiCom; first held with MobiCom 2025 at the HKUST campus in Hong Kong
- Topics are federated learning and edge AI in mobile, vehicular and wireless networks, including privacy and security
  of mobile FL
- Accepted papers appear in the ACM Digital Library as part of the MobiCom 2025 workshop proceedings
- Single-blind review by at least three PC members; full papers up to 6 pages, short papers 3 pages, demo papers 2 pages
- Not in the MobiCom 2026 workshop list
- Not listed in ICORE2026
