notes:
- Positioning, navigation and timing (PNT) symposium founded by IEEE AESS in 1976; jointly sponsored by IEEE AESS and
  ION since 2006
- The official site describes it as biennial in the spring of odd-numbered years; recent editions were 2016, 2018,
  2020 (virtual) and 2023, then Portland 2027 and Toronto 2029
- Held in the USA for decades, often in Monterey, California
- Selection is based on abstracts; full manuscripts are then peer reviewed once and must pass review to go into the
  IEEE Xplore proceedings
- In-person presentation is required; no virtual option, and classified or ITAR restricted work is not accepted
- One day of tutorials (extra fee) plus three days of technical sessions in four parallel tracks
- Best paper awards include the IEEE Walter Fried Award and a PLANS Student Award
- Navigation venue outside the usual CS rankings, not listed in ICORE2026
