notes:
- Workshop on writing systems, orthography and written language in NLP, run under ACL SIGWrit
- CAWL 2023 at ACL 2023 (Toronto), CAWL 2024 at LREC-COLING 2024 (Turin), CAWL 2026 at LREC 2026 (Palma)
- Short (4-page) and long (8-page) papers in the LREC style; double-anonymous review
- Proceedings in the ACL Anthology; some papers are presented as non-archival
- 2026 offered a 500 USD prize for the best student submission
- Not listed in CORE ICORE2026 and not on the CCF list
