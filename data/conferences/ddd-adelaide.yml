notes:
- Inclusive, non-profit, one-day conference for the Adelaide software community, part of the Developer! Developer! Developer! (DDD) series
- Organised by DDD Adelaide Inc., a non-profit association; run by volunteers on a Saturday
- Anyone can submit a talk on any software-industry topic; sessions are chosen by anonymous community vote
- Ticket is 60 AUD and includes catering; aims to give juniors, first-time speakers and underrepresented groups a chance to present
- 2026 edition at Adelaide University City Campus East with three parallel theatres
- No papers or proceedings
- Not listed in CORE ICORE2026
