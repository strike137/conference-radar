notes:
- Founded in 2020 as the merger of IEEE ICAC (Autonomic Computing) and IEEE SASO (Self-Adaptive and Self-Organizing
  Systems)
- Covers autonomic computing, self-adaptive and self-organizing systems, multi-agent systems, swarm intelligence and
  LLM-based agentic adaptation
- Main proceedings and the ACSOS-C companion volume (vision papers, workshops) are published by IEEE Computer Society
  Press in IEEE Xplore
- Lightweight double-blind review; research papers and experience reports 10 pages plus 2 for references
- Week-long event with workshops, tutorials, doctoral symposium, posters and demos and an artifact track
- Rotates worldwide (2023 Toronto, 2024 Aarhus, 2025 Tokyo, 2026 Cesena, 2027 Bogota)
- Best papers invited to an extended journal special issue
- Not listed in ICORE2026 or the CCF list
