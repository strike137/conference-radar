links:
  website: https://conf.researchr.org/home/cisose-2025
notes:
- Service-oriented systems, microservices, APIs and cloud and edge services; running since 2005, 19th edition in 2025
- One of several co-located conferences of the IEEE CISOSE congress (with AITest, BigDataService, JCC, IMC, ISADS, DAPPS), which rotates between the Americas, Europe and Asia
- 'Recent hosts: Athens (2023), Shanghai (2024), Tucson (2025), Fukuoka (2026)'
- Proceedings in IEEE Xplore; top papers invited to a Cluster Computing special issue (2025)
- 'Paper types (2025): full 10+2 pages, short 5+1, vision and demo 4+1; double-blind review; remote presentation allowed'
- Not ranked in ICORE2026 and not on the CCF 2026 list
