notes:
- Workshop on cloud and network resource convergence, computing power networks, SD-WAN, edge and cloud native
  networking and AI for networks
- Host conference changes each year (IEEE MASS 2024 in Seoul, IEEE ICNP 2025 in Seoul, IEEE INFOCOM 2026 in Tokyo)
- 2026 papers appear in the IEEE INFOCOM 2026 Workshop Proceedings submitted to IEEE Xplore
- Papers up to 6 pages including figures, tables and references, IEEE double-column format, submitted via EDAS
- 2026 workshop chairs Jie Wu (Temple University), Eyuphan Bulut (Virginia Commonwealth University) and Falko
  Dressler (TU Berlin); web and submission chair from China Telecom, which also hosted the 2024 site
- Not listed in ICORE2026 or in the CCF 2026 list
