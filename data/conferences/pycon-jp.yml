notes:
- Japan's largest conference on the Python programming language, organized entirely by volunteers of the PyCon JP
  Association
- Talks (30 minutes) chosen from a call for proposals on Pretalx; proposals accepted in Japanese and English, up to 2
  per person
- About 40 to 50 talk slots planned in 2026, 39 talks confirmed; four parallel tracks plus keynotes, sprint day,
  lightning talks and community booths
- Travel grants available for speakers and attendees traveling from afar
- No papers or proceedings; talks only
- 'Recent venues: Tokyo 2024, Hiroshima 2025 and 2026, Numazu (Shizuoka) 2027'
