notes:
- Umbrella congress (12th edition in 2026) bundling UIC, ATC, ScalCom, Digital Twin, Metaverse plus workshops, with
  a shared registration and proceedings submitted to IEEE Xplore
- 'Rank belongs to member conferences: UIC is CORE C and CCF C, ATC is CORE C; the congress name itself is not ranked'
- 'Rotates worldwide: 2023 Portsmouth, 2024 Nadi (Fiji), 2025 Calgary, 2026 Rende (Italy); 2027 planned (tentative)
  for Zhengzhou, China'
- '2026 page limits: full papers 6 pages, short 4, poster/demo 2, plus up to 2 extra pages with overlength charge;
  deadlines usually April to May'
- ATC (Autonomous and Trusted Computing) covers trustworthy and secure AI and privacy-preserving learning, the most
  security-relevant member conference
