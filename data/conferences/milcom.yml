id: milcom
name: IEEE MILCOM
full_name: IEEE Military Communications Conference
type: conference
tier: minor
areas: [communications, networking, security]
region: north-america
language: english
frequency: annual
organizer: IEEE Communications Society
organizer_country: [usa]
proceedings: IEEE Xplore
indexing: [DBLP]
fee: 900 USD IEEE member author, 1100 USD non-member author, unclassified paper (2026)
typical:
  deadline_months: [5, 6]
  conference_months: [10]
links:
  website: https://milcom2026.ieee-milcom.org/
  dblp: https://dblp.org/db/conf/milcom/
notes:
- Run by IEEE ComSoc; held in the USA (Boston 2023, Washington DC 2024, Los Angeles 2025, Washington DC
  area 2026), every October
- Unclassified technical papers are published in IEEE Xplore; separate restricted (CUI) and classified programs
  are not public
- Five unclassified tracks (waveforms and signal processing, networking, cybersecurity, network architecture,
  AI/ML for communications) plus many co-located workshops with a later August deadline
- Unclassified papers are 6 pages max, up to 2 extra pages at 100 USD each; submission via EDAS
- Audience is largely US government, military and defense industry; also has a vendor exhibition
- Not ranked in ICORE2026
