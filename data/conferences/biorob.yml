notes:
- Biennial conference jointly sponsored by IEEE RAS and IEEE EMBS, held since 2006
- Covers surgical and rehabilitation robotics, exoskeletons, prosthetics, bio-inspired, soft and micro/nano robotics
- Regular papers 6 pages plus up to 2 extra pages at 175 USD each; single-blind review via PaperPlaza
- Proceedings in IEEE Xplore; 1-page late-breaking abstracts are posters only and not in IEEE Xplore
- Best papers fast-tracked to a special issue of IEEE Transactions on Medical Robotics and Bionics (2026)
- Accepts revised papers previously rejected at other IEEE RAS conferences, and presentation of RA-L papers (2026)
- Rotates worldwide (Singapore 2016, Enschede 2018, virtual 2020, Seoul 2022, Heidelberg 2024, Edmonton 2026)
- 2026 edition held a few days after EMBC 2026 (Toronto, July 26-30)
- Not listed in the CORE portal (ICORE2026) or the CCF list
