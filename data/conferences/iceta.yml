notes:
- Slovak conference on ICT in education and eLearning; 2026 is the 24th edition
- Organized by the Kosice company elfa, s.r.o. in cooperation with Technical University of Kosice, STU Bratislava and University of Zilina
- Accepted papers are submitted to IEEE Xplore and Scopus; only papers presented on site or as posters are sent to IEEE Xplore
- Full papers of at least 6 pages are reviewed; plagiarism above 15 percent leads to rejection
- Always held at the Grand Hotel Stary Smokovec in the High Tatras, Slovakia
- Author fee 410 EUR (2026), 360 EUR for students and IEEE members; extra pages 24 EUR each
- Selected extended papers go to special issues of EAI Scalable Information Systems, EAI Internet of Things and Wireless Networks
- Not listed in CORE ICORE2026 or in the CCF 2026 list
