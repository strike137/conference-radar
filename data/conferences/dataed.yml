notes:
- Workshop on teaching and learning databases and data systems, bridging the database and computing education research communities
- Co-located with ACM SIGMOD 2022 to 2025 (Philadelphia, Seattle, Santiago, Berlin) and with EDBT/ICDT since 2026 (Tampere 2026, Lille 2027)
- Research papers, experience reports and artefact papers, up to 5 pages excluding references; single-anonymous review
- Since 2026 papers appear in the CEUR-WS EDBT/ICDT workshops volume (Vol-4192 for 2026); the 2025 edition at SIGMOD used the ACM Digital Library
- Abstract registration one week before the paper deadline
- Not listed in CORE ICORE2026
