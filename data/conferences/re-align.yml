notes:
- Workshop on representational alignment between artificial and biological neural systems (how and when different models learn similar representations)
- Held with ICLR 2024 (Vienna), ICLR 2025 (Singapore) and ICLR 2026 (Rio de Janeiro)
- Non-archival; accepted papers are listed on OpenReview and authors are expected to publish later at an archival venue
- Also runs a call for challenge reports with its own later deadline
- Not listed in ICORE2026 and not on the CCF list
