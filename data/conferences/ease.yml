notes:
- Main venue for empirical software engineering and evidence-based SE (systematic reviews, replications, mining studies)
- Proceedings published by ACM as open access under the ACM model, so authors pay an article processing charge
- 'Research track: 10 pages plus up to 2 pages of references, double-anonymous review, abstract one week before the paper'
- Also industry, short papers and emerging results, posters and vision, doctoral symposium and workshop tracks with later deadlines in February and March
- Held every June, mostly in Europe (Oulu 2023, Salerno 2024, Istanbul 2025, Glasgow 2026); 2027 edition in Hanoi, Vietnam
- CORE A (ICORE2026), CCF C
