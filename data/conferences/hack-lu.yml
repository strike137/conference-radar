notes:
- Open hacker and security conference organized by CIRCL, held every October in Luxembourg
- 2026 is the 20th edition, at the Parc Hotel Alvisse in Luxembourg City
- CFP takes papers, talks and training/workshop proposals; lightning talks and a Call for Failure track open later
- Authors keep the rights to their papers but let the organizers redistribute them; there is a best paper award, but
  no formal proceedings series
