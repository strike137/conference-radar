links:
  website: https://www.mpcalliance.org/rwmpc-2026
notes:
- One-day workshop on real-world applications of secure multiparty computation, held as an affiliated event of RWC
- Topics include deployments, standardization, threshold signatures, compilers, formal verification, economics and policy; purely theoretical protocols are out of scope
- Contributed talks may cover work in progress, papers under submission or papers published elsewhere
- No proceedings
- Attendance requires registration for the main RWC event
- 2026 program committee chaired by Jonathan Katz (Google)
- Not listed in ICORE2026 or the CCF 2026 list
