notes:
- One-day affiliated workshop of Real World Crypto on deployed secure multiparty computation (MPC)
- Calls for contributed talks; no proceedings, so work in progress or papers published elsewhere can be presented
- Topics include MPC deployments, standardization, threshold signatures, implementations, verification and policy; purely theoretical MPC is out of scope
- Moves with RWC (Sofia 2025, Taipei 2026); attendees must also register for RWC
- Not ranked by CORE and not on the CCF list
