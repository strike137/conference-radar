notes:
- Premier venue for recommender systems research, held annually since 2007
- Proceedings in the ACM Digital Library; long-paper acceptance has stayed around 17 to 22% since 2015
- Main track takes long (8 pages), short (4 pages) and past/present/future papers; separate reproducibility,
  resource, industry, demo and Research and Practice Notes tracks with later deadlines
- Anonymous submission with a rebuttal phase; at least one author must present in person
- Rotates between Europe, North America and Asia (Singapore 2023, Bari 2024, Prague 2025, Minneapolis 2026,
  Honolulu 2027)
- Many co-located workshops and the RecSys Challenge run alongside the main conference
