notes:
- Long-running European conference on information systems engineering (38th edition in 2026), covering requirements, conceptual modeling, business process management and data-driven information systems
- Main track papers in Springer LNCS, up to 14 pages excluding references in LNCS format
- Double-blind review from 2027 (2026 was not blind); at least two PC reviews, a third for positive papers, then a program board meeting
- Mandatory abstract before the full paper deadline, both AoE and announced as firm
- Workshops, Forum and Doctoral Consortium papers go to Springer LNBIP volumes; co-located with the BPMDS and EMMSAD working conferences
- Best papers invited to a special issue of the Elsevier Information Systems journal
- CORE A and CCF B (software engineering list); held almost every year in Europe
