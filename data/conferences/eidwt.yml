notes:
- Part of the Barolli (Fukuoka Institute of Technology) conference family; standalone conference held every February
- Internet, data and web technologies; topics include network and data security, trust and reputation, big data
  and cloud computing, and machine learning on large data sets
- 'Rotates worldwide: Semarang 2023, Naples 2024, Matsue 2025, Chania 2026, Shaoxing (China) 2027'
- Hard deadline was Nov 30 in both the 2025 and 2026 cycles; in the 2026 cycle the initial Oct 31 deadline was extended
  to Nov 30 (Oct 31 -> Nov 30); not ranked by CORE or CCF
