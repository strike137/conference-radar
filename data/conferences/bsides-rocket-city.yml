notes:
- Volunteer-run, free Security BSides conference in Huntsville, Alabama, USA
- One Saturday; 2027 edition at Calhoun Community College, Huntsville
- "Tagline: Bridging the Gap from Student to Rocket Scientist; aimed at K-12 and university students as well as professionals"
- Call for presenters on Sessionize with rolling review in waves; 15-minute lightning talks, 1-hour talks and multi-hour workshops
- No marketing or sales talks; sponsors submit through the same CFP
- Lockpicking village and a Meshtastic meetup
- Talks only, no proceedings
