notes:
- Community-run Scala programming conference in Tokyo that bills itself as the largest international Scala
  conference in Asia
- Started as Scala Conference in Japan 2013; editions in 2014, 2016 to 2020 and 2022 to 2024 (2022 online, 2023
  online with a satellite venue)
- 2024 edition held offline at Tokyo International Exchange Center, Odaiba, with a training day and an open mic
  conference
- "Open call for proposals: 20 min talks (40 min as an exception), in English or Japanese with slides in English;
  Japanese subtitles provided"
- Travel grants offered to speakers (2024)
- No papers or proceedings; talks only
