links:
  website: https://trec.nist.gov/
notes:
- IR evaluation campaign run by NIST since 1992; the yearly cycle ends with a conference for track participants
- Organizations register to take part in tracks (2026 tracks include RAG, RAGTIME, AutoJudge, Change Detection,
  Million LLM, User Simulation and Video QA), submit runs in June to August and write a notebook paper in October
- "No open call for papers: attendance requires registering as a participant"
- Notebook papers are revised for the TREC Proceedings (due January or early February); TREC states they are not
  peer-reviewed and equal unreviewed working papers, so the venue is non-archival
- Held at NIST in Gaithersburg, MD, USA until 2019; online from 2020 to 2025; 2026 back in person at NIST with a
  remote attendance option
- Peer of NTCIR (Japan) and CLEF (Europe)
- Not listed in ICORE2026 or the CCF 2026 list
- Region is online because the last six held editions (2020 to 2025) were online; 2026 returns to NIST
