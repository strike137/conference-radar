notes:
- Evaluation workshop series run by the US National Institute of Standards and Technology since 1992
- Participation is through tracks (2026 has AutoJudge, Change Detection, Million LLM, RAG, RAGTIME, User Simulation
  and Video QA); groups register in spring and submit runs, mostly June to August
- No regular paper call; participants write notebook papers that NIST publishes as a Special Publication without
  peer review
- Only registered track participants can attend the November conference
- Held at NIST in Gaithersburg, Maryland, with a remote option; online from 2020 to 2025
- Calls for track proposals for the next year close in late September
- Counterparts are CLEF (Europe), NTCIR (Japan) and FIRE (India)
- Not found in the CORE ICORE2026 search and not in the CCF 2026 list
