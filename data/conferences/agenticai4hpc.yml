notes:
- Half-day workshop on agentic AI for HPC (code modernization and translation, performance tuning, workflows, HPC facility operations), held with SC
- First edition in 2026 (AgenticAI4HPC'26), opened by Jeffrey S. Vetter (ORNL)
- Full papers up to 10 pages including references, IEEE conference template, single-blind review, submitted via the SC26 workshop system
- Accepted papers appear in the IEEE Digital Library as part of the SC 2026 workshop proceedings
- Optional SC-style Artifact Description and Artifact Evaluation appendices; a Distinguished Paper Recognition is given
- Not listed in CORE ICORE2026
