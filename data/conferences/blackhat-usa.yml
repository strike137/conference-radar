notes:
- 'Flagship industry security conference, six days at Mandalay Bay, Las Vegas: four days of Trainings (Aug 1-4 in
  2026), a Summit Day, then two days of Briefings (Aug 5-6); DEF CON starts on the last Briefings day'
- Talk proposals go through a CFP portal reviewed by the Black Hat Review Board; tool demos go to the separate Arsenal
  track
- 2026 CFP opened Jan 27 and closed Mar 23 (the preparation document said Mar 20), with notification by May 22;
  at most two speakers per talk
- 'Speaker benefits (USA): 1,000 USD honorarium, airfare up to 1,500 USD (international) and 3 hotel nights for
  one speaker per session'
- Recordings go public on YouTube about 90 to 120 days after the event; no archival proceedings
