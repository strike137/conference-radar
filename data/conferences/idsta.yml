notes:
- Accepted papers from IDSTA and its co-located workshops are submitted to IEEE Xplore; earlier proceedings are in Scopus and DBLP
- Full papers up to 8 pages in the IEEE conference template, two extra pages for a fee; overlength papers are rejected without review
- At least one author must register and present or the paper is dropped from the proceedings
- Technically co-sponsored by the IEEE section of the host country (IEEE Bulgaria Section in 2025, IEEE Romania Section in 2026); hybrid in 2025
- Held mostly in Europe (2020 Valencia, 2021 Tartu, 2024 Dubrovnik, 2025 Varna, 2026 Bucharest) with 2022 San Antonio and 2023 Kuwait City
- Not listed in ICORE2026; not on the CCF 2026 list
