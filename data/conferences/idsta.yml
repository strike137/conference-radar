notes:
- Broad data science and applied AI conference, first held in 2020 (Valencia, Spain)
- Accepted papers of IDSTA and its co-located workshops are submitted to IEEE Xplore; earlier proceedings are in IEEE Xplore, Scopus and DBLP
- Full papers up to 8 pages in the IEEE conference template, up to 2 extra pages for a fee; double-blind review
- At least one author must register and present, otherwise the paper is removed from the proceedings
- Hosted by a different local university each year (2021 Tartu, 2022 San Antonio, 2023 Kuwait City, 2024 Dubrovnik, 2025 Varna, 2026 Bucharest), often hybrid
- Selected papers are invited to journal special issues
- Not listed in ICORE2026; not on the CCF 2026 list
