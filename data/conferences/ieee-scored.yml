notes:
- Student-oriented flagship conference of the IEEE Malaysia Section; 2026 is the 24th edition
- 2026 edition hosted by the Multimedia University IEEE Student Branch at MMU Cyberjaya
- Broad tracks on intelligent systems, sustainable engineering, computing and networks (IoT, cloud, cybersecurity), and
  electronics and communications
- Accepted and presented papers are submitted to IEEE Xplore; past proceedings are in IEEE Xplore
- Submission through EDAS; 10 minute talks plus 5 minutes Q&A, in-person presentation only (no recorded videos)
- Not ranked by CORE (ICORE2026); not in the CCF list
