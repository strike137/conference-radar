notes:
- Joint conference of APWeb (Asia-Pacific Web Conference) and WAIM (Web-Age Information Management) since 2017
- Two submission rounds per year; papers rejected in round 1 cannot be resubmitted to round 2
- Main proceedings in Springer LNCS, workshops in CCIS; 15 pages, double-blind review via Microsoft CMT
- Usually held in China (2022 Nanjing to 2025 Shenyang); 2026 moved to Danang, Vietnam, and allowed online presentation
- Topics include data security and privacy, web security, and LLMs for data management
