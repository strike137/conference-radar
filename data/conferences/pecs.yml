notes:
- Workshop on energy efficiency and performance analysis and optimization in concurrent, parallel and distributed systems
- Papers must address energy; performance-only papers may be rejected before review
- Running since 2021 (called Performance and Energy Efficiency in Concurrent Systems in 2021 and 2022); 6th edition in 2026
- Co-located with Euro-Par 2026 in Pisa; 2025 edition at TU Dresden, 2024 edition at the University of Pisa
- Revised papers appear in the Euro-Par workshops volume of Springer LNCS after the conference
- LNCS format, 10 to 12 pages; papers under 10 pages are presented but not published
- Double-blind review; submission through the shared Euro-Par workshops EasyChair
- Not listed in the CORE ICORE2026 portal
