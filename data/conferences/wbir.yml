notes:
- Workshop series on biomedical image registration (learning-based and classical registration, validation, motion modelling)
- Accepted papers published in Springer LNCS (Biomedical Image Registration volumes)
- Open review on OpenReview; papers are public during review and reviews are published afterwards
- 2024 was the 11th edition, held as part of MICCAI 2024 in Marrakesh together with the Learn2Reg challenge
- 'Past venues: London 2014, Las Vegas 2016, Leiden 2018, Portoroz 2020 (online), Munich 2022, Marrakesh 2024'
- 2024 general chairs from King's College London, Sussex, Ljubljana, Erasmus MC, Radboud UMC and HKUST
- Not listed in CORE ICORE2026 or the CCF 2026 list
