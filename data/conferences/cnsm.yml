id: cnsm
name: CNSM
full_name: International Conference on Network and Service Management
type: conference
tier: major
areas: [networking, ai]
region: europe
language: english
frequency: annual
organizer: Technical co-sponsors IFIP, IEEE and IEEE ComSoc; in cooperation with ACM SIGCOMM
proceedings: IEEE Xplore
indexing: [DBLP]
rank:
  core: B
fee: 800 EUR IFIP/ACM/IEEE member, 850 EUR non-member (2026, author registration covering up to 2 papers; same rates
  in 2025)
typical:
  deadline_months: [6, 7]
  conference_months: [10, 11]
links:
  website: http://www.cnsm-conf.org/
notes:
- Selective single-track conference on network and service management; evolved from the MANWEEK workshops (DSOM,
  MMSN, IPOM)
- Single-blind review followed by a rebuttal phase; full papers 9 pages including references, short papers 5
- Selected papers invited to IEEE TNSM (and IJNM in 2026)
- Mostly in Europe or Canada (Tokyo in 2017); 2026 adds an experimental track for papers written entirely by LLM
  agents
