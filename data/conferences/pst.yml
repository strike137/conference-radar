notes:
- Run by the Canadian PST Network (23rd edition in 2026); often held in Fredericton, Canada, with editions abroad (New Zealand 2021
  virtual, Denmark 2023, Australia 2024, United Kingdom 2027)
- Proceedings in IEEE Xplore; regular papers up to 10 pages, short papers up to 6 pages, IEEE two-column format
- Double-blind review; authors pick a Privacy, Security or Trust track, plus a special track on Emerging Technologies
  and Trends
- One industry day followed by two days of technical sessions; remote presentation allowed (hybrid support)
- Optional artifact evaluation with IEEE reproducibility badges (2026)
- PST 2026 was co-located with SAC 2026 (Selected Areas in Cryptography) in Ottawa
- Selected papers invited to journal special issues after extension
- ICORE2026 rank C; not in the CCF list
