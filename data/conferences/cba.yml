notes:
- Largest Brazilian congress on control and automation, promoted by the Brazilian Society of Automation (SBA) since
  1976; biennial (even years)
- Papers in Portuguese or English (Portuguese papers need an English abstract); final version 4 to 8 pages, extra
  fee per page after the sixth
- Submission via EasyChair; proceedings (Anais) published open access by SBA
- 2026 edition (XXVI CBA, 50th anniversary) organized by UNICAMP and Escola Politécnica da USP in São Paulo
- Not listed in the CORE ICORE2026 portal
