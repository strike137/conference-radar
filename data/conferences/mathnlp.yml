id: mathnlp
name: MathNLP
full_name: Workshop on Mathematical Natural Language Processing
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: Academic and industry organizing committee (University of Sheffield, University of Edinburgh, Idiap, University
  of Manchester, The MathWorks); co-located with EMNLP or LREC-COLING
organizer_country: [europe]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [8]
  conference_months: [10, 11]
links:
  website: https://sites.google.com/view/mathnlp2026
notes:
- Workshop on NLP for mathematical language, formulas, math reasoning and theorem proving with language models
- Held with EMNLP 2022 (Abu Dhabi), LREC-COLING 2024 (Turin), EMNLP 2025 (Suzhou) and EMNLP 2026 (Budapest)
- Long (8 pages) and short (4 pages) papers, double-blind review
- Authors choose archival or non-archival; only archival papers go into the ACL Anthology proceedings
- Accepts pre-reviewed ARR papers via a commitment deadline (2026)
- Not listed in ICORE2026 and not on the CCF list
