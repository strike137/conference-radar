notes:
- Organized by the Department of CSE, Francis Xavier Engineering College, Tirunelveli, Tamil Nadu, and held there
- Proceedings in IEEE Xplore (2021 and 2024 to 2026) and Springer (2019, 2022, 2023), all linked from the official site
- 2027 papers are to be submitted for inclusion in IEEE Xplore (Xplore compliant ISBN issued)
- Scope covers intelligent communication technologies, mobile cloud computing and virtual mobile networks
- Part of a family of Tamil Nadu linked IEEE Xplore conferences (ICOEI, I-SMAC, ICIDCA and others) with a broad scope
- 8th edition in 2027
- Not found in ICORE2026; not on the CCF list
