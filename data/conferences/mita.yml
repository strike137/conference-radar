id: mita
name: MITA
full_name: International Conference on Multimedia Information Technology and Applications
type: conference
tier: minor
areas: [ai, vision, networking, general]
region: asia-pacific
language: english
frequency: annual
organizer: Korea Multimedia Society (KMMS)
organizer_country: [korea]
proceedings: Springer CCIS (optional CCIS track); MITA proceedings for regular, short and poster papers
archival: true
fee: 700,000 KRW / 500 USD regular, 450,000 KRW / 350 USD student (2026)
typical:
  deadline_months: [6]
  conference_months: [7]
links:
  website: http://icmita.org/
notes:
- Annual international summer conference of the Korea Multimedia Society; the domestic spring and fall meetings are
  listed separately as KMMS Conference
- Held in Jeju (Grand Hyatt) in 2025 and at Auckland University of Technology, New Zealand in 2026
- "Tracks: Springer CCIS (12 to 15 pages, short CCIS 6 pages), regular MITA papers (1 page short or 2 to 4 pages) and
  a poster-only abstract track; the CCIS and regular tracks are peer reviewed via Microsoft CMT"
- Selected papers invited to special issues of JMIS (KMMS journal), MDPI Electronics and Graphical Models
- Reports over 150 submissions and 200 participants a year; short deadlines in June, close to the July conference
