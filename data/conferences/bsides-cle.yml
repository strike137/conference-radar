notes:
- Community-driven Security BSides conference for the Northeast Ohio infosec community, free and volunteer run
- One-day event with three concurrent tracks (red team, blue team, hardware hacking) plus villages and sponsors
- Held at Ingenuity Cleveland in 2025 and at Tinkham Veale University Center, Case Western Reserve University in 2026
- The 2024 conference was cancelled and replaced by an informal community social event
- Talks selected through a call for presentations; no papers or proceedings
