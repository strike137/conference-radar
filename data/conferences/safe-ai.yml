notes:
- Workshop on systems and architecture for privacy-preserving AI with FHE, MPC and zero-knowledge proofs
- Organized by Carnegie Mellon University (Skarlatos, Zheng, Jayashankar) with Brandon Reagen (NYU)
- 1st edition at ASPLOS 2025 (Rotterdam) with a hands-on tutorial on the Cinnamon framework; 2nd edition at ISCA 2026 (Raleigh)
- Two-page anonymous submissions via HotCRP; unpublished, previously published and work-in-progress papers are welcome
- Non-archival; the CFP states that proceedings will not be published
- Not listed in CORE ICORE2026 or the CCF list
