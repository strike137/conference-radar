notes:
- Independent, community-led Security BSides conference in Exeter, South West England
- 2025 and 2026 main events were one Saturday in April at The Forum, University of Exeter, with charity workshops (2026) or a NextGen event (2025) the day before
- 2027 edition grows to two days (18 and 19 June 2027) of talks and hands-on workshops
- Ticketed via Tito; the main event ticket included a BSides Exeter T-shirt
- Talks are posted on YouTube, no proceedings
