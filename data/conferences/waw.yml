notes:
- Formerly the Workshop on Algorithms and Models for the Web Graph; now the Workshop on Modelling and Mining Networks
- Standalone annual workshop on graph-theoretic and algorithmic aspects of complex networks, random graph models and network mining
- Proceedings in Springer LNCS
- "Small venue: 7 full papers from 10 submissions (2026), 13 from 20 (2025), 12 from 19 (2024)"
- Recent editions in Warsaw (2024), Vilnius (2025) and the Fields Institute, Toronto (2026)
- CORE C (ICORE2026, listed under the old name Workshop on Algorithms And Models For The Web Graph); not on the CCF 2026 list
