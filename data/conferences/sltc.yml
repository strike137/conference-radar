notes:
- Main national meeting of the Swedish language technology community (NLP, computational linguistics, speech technology, language resources)
- Held every two years, hosted by a different Swedish university; earlier hosts include GU, LiU, KTH, LU, UU, UmU and SU
- Extended abstracts of 2 to 4 pages in ACL style, single-blind review on OpenReview; system demonstrations as a separate track
- No proceedings; accepted abstracts are made available on the conference web page, so work published elsewhere can be presented
- Two main conference days followed by a dedicated workshop day
- 2026 main days were moved to 23 and 24 November to avoid clashing with NLP4CALL
