notes:
- Organized by the Chinese security company Knownsec since 2012; Chinese-language hacker conference in Beijing with
  about 1,000 attendees
- 2026 edition is the security forum of the national 2026 AI+ conference (GAI+ C), late October at Zhongguancun
  International Innovation Center; morning on AI security risks, afternoon on secure AI applications
- Talks are submitted by email and reviewed by the KCon technical committee; 20 to 25 minute talks, product or sales
  pitches rejected
- Speakers get lifetime free KCon attendance plus travel and accommodation during the event
- 'Recent editions were in August (2023: Aug 19-20; 2024: Aug 24-25); no 2025 edition appears in the official history'
