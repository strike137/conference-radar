notes:
- Two-day web and application security conference presented by the OWASP New Zealand Chapter and organized by AppSec New Zealand Incorporated, a volunteer non-profit society
- Held in Auckland; AUT City Campus in 2023 (July) and 2024, University of Auckland (Owen G. Glenn Building) in 2025 and 2026
- Two talk streams (introductory and policy/risk, deeper technical) plus a smaller sponsor and OWASP tools stream
- Pre-conference training days run two days before the main conference at the same venue
- Open call for presentations via pretalx; no proceedings, practitioner talks only
