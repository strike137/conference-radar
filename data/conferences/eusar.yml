notes:
- Biennial conference on SAR techniques, technology and applications, held in Germany in even years; 2026 was the 16th edition and the 30-year anniversary
- Organized by VDE together with Airbus Defence and Space, DLR, Fraunhofer FHR and HENSOLDT
- Two-stage process; draft papers of 3 to 6 pages reviewed single-blind by at least three TPC reviewers in EDAS, then final papers of up to 6 pages
- Proceedings uploaded to IEEE Xplore and indexed in Scopus and Web of Science; at least one author must register by the final paper deadline
- At most two papers per first author; about 330 contributions accepted and over 600 participants in 2026
- Tutorial day before the conference; best paper, best poster and best student paper awards
- EUSAR 2028 will be organized by Fraunhofer FHR (dates and venue not yet announced)
- Radar engineering venue outside the usual CS rankings, not listed in ICORE2026
