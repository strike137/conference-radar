id: clic-it
name: CLiC-it
full_name: Italian Conference on Computational Linguistics
type: conference
tier: minor
areas: [nlp, ai]
region: europe
language: mixed
frequency: annual
organizer: AILC (Italian Association of Computational Linguistics) with a host university
organizer_country: [europe]
proceedings: CEUR-WS, ACL Anthology
archival: true
typical:
  deadline_months: [5, 6]
  conference_months: [9, 11, 12]
links:
  website: https://www.ai-lc.it/conferenze/clic-it/
notes:
- Annual conference of the Italian Association of Computational Linguistics (AILC); 2026 was the 12th edition
- Papers in English or Italian (abstract in English), up to 11 pages plus unlimited references; single-blind review
- Proceedings in CEUR-WS (2025 -> Vol-4112) and also in the ACL Anthology
- "Research communications track: papers accepted at CORE A* conferences or Q1 journals can be presented, not published"
- Best student paper winners are invited to submit an extended version to the Italian Journal of Computational
  Linguistics (IJCoL)
- Held in Italy every year (Milan 2022, Venice 2023, Pisa 2024, Cagliari 2025, Palermo 2026)
- Not listed in the CORE portal (ICORE2026)
