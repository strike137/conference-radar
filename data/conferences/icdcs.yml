notes:
- One of the IEEE Computer Society flagship conferences; 46th edition in 2026; CORE A, CCF B
- 'Rotates between North America, Europe and Asia-Pacific: Glasgow, UK (2025), Seoul, Korea (2026), Melbourne, Australia
  (2027)'
- Double-blind review; up to 11 pages including references; one main deadline per year (Dec or Jan)
- Has a Security, Privacy and Trust track; co-located workshops, posters/demos and a doctoral consortium with April
  deadlines
- In-person presentation required; selected papers invited to extend for IEEE TPDS
