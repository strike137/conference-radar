notes:
- Organized by ITE, the Japanese society for image information, broadcasting and television engineering; held every
  late August at a venue that moves around Japan, hybrid with Zoom
- No peer review mentioned in the call; papers are 1 or 2 A4 pages with a 15 min talk and 4 min Q&A
- Covers image sensing, displays, broadcasting technology, media engineering (vision, coding, multimedia AI), human
  information, CG, 3D media and sports information processing
- Japanese or English talks; students can give a cheaper freshperson talk (for example on their graduation research)
- Awards for young presenters (Suzuki Memorial Encouragement Award) and students (Student Excellent Presentation
  Award)
- Includes a KIBME/ITE joint session; ITE also runs a separate Winter Annual Convention in December
- Application deadline in early June (usually extended by one week), manuscript in late July
- Not held in 2020 and 2021 because of the Tokyo Olympics
