notes:
- One-day workshop on the interplay of technical, organizational and human factors in security, privacy and trust
- 2025 was the 15th edition, held in Venice on 30 June and affiliated with IEEE EuroS&P 2025
- Proceedings in IEEE Xplore in the volume accompanying the IEEE EuroS&P workshops
- 'Paper types: full papers up to 10 pages, position and work-in-progress papers up to 6 pages (bibliography and appendices
  excluded); double-blind review by at least three PC members via EasyChair'
- Organized by Giampaolo Bella (University of Catania) and Gabriele Lenzini (University of Luxembourg)
- 'CORE: not listed in ICORE2026'
- From 2026 STAST and EuroUSEC were merged into the new Conference on Sociotechnical Cybersecurity and Privacy (SCP),
  first held 2026-09-02 to 2026-09-03 in Belval, Luxembourg (scpconf.eu); no standalone STAST edition since 2025
