notes:
- 'Held in India every December under CRSI; CORE lists it as National: India, not in the CCF list'
- Double-blind review, 20-page LNCS limit; proceedings in Springer LNCS
- 'Deadline is usually extended by one to two weeks (2025: 1 Sep -> 10 Sep; 2026: 15 Aug -> 27 Aug)'
- In 2025 and 2026 it started two days after Asiacrypt ended, so both can be combined in one December trip
