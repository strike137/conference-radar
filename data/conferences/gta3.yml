notes:
- Workshop on graph analytics and graph machine learning for adversarial activities (cybersecurity, illicit finance,
  disinformation, attacks on graph models); 2026 is the 10th edition
- Run since 2018 by HRL Laboratories; the host conference changes (mostly IEEE BigData, CIKM 2024 in Boise, IEEE ICDM
  2025 in Washington DC, back at IEEE BigData 2026 in Phoenix)
- Papers in the host's workshop proceedings (IEEE BigData workshop proceedings for 2026, ICDM workshop proceedings for 2025)
- Papers 6 to 10 pages in two-column IEEE format; single-blind review for 2026 (double-blind in 2025)
- Half-day workshop with keynotes and remote access over Zoom
- Not ranked by CORE (not in ICORE2026) or CCF
