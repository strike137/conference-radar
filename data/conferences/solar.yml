id: solar
name: SoLaR
full_name: Workshop on Socially Responsible Language Modelling Research
type: workshop
tier: minor
areas: [ai, nlp]
region: worldwide
language: english
frequency: annual
organizer: SoLaR organizing committee (researchers from Cambridge, University of Washington, AI2, CMU, UCL, Oxford, Stanford
  and others); co-located with NeurIPS (2023, 2024) and COLM (2025)
organizer_country: [international]
proceedings: None (non-archival)
archival: false
typical:
  deadline_months: [6, 9]
  conference_months: [10, 12]
links:
  website: https://solar-neurips.github.io/
notes:
- Workshop on responsible and safe language models, with a technical track and a sociotechnical track
- Held with NeurIPS 2023, NeurIPS 2024 (Vancouver) and COLM 2025 (Montreal, 3rd edition); the host conference changes
- No formal proceedings; accepted papers are posted on the website and OpenReview
- Papers up to 5 pages in the host conference style; double-blind review by at least two reviewers
- Not listed in ICORE2026 and not on the CCF list
