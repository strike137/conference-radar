region: southeast-asia
language: english
frequency: annual
organizer: Department of Informatics, Faculty of Science and Mathematics, Universitas Diponegoro (Undip)
organizer_country: [indonesia]
proceedings: IEEE Xplore
archival: true
fee: 300 to 425 USD onsite, 260 to 335 USD online for international authors (2026, by IEEE membership and early bird)
typical:
  deadline_months: [4, 5]
  conference_months: [8]
links:
  website: https://icicos.org/
notes:
- Organized by the Department of Informatics, Universitas Diponegoro, Semarang, Indonesia; IEEE Indonesia Section on the steering committee
- Proceedings of the 1st to 8th editions (2017 to 2025, no 2023 edition) published in IEEE Xplore
- Only papers that are registered and presented go to IEEE Xplore (no-show policy)
- Double-blind review; submission through EDAS
- Broad scope covering AI, machine learning, NLP, cybersecurity, networks, IoT, vision, data mining, software engineering and HCI
- 2026 edition held in hybrid mode at Hotel Santika Premiere, Semarang
- Three submission rounds with separate notification dates
- Not listed in the ICORE2026 portal or the CCF 2026 list
