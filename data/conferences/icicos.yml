organizer: Department of Informatics, Faculty of Science and Mathematics, Universitas Diponegoro (UNDIP)
organizer_country: [indonesia]
proceedings: IEEE Xplore
fee: 310 to 425 USD non-IEEE member, 260 to 325 USD IEEE member (2026, international authors, online to onsite)
typical:
  deadline_months: [4, 5]
  conference_months: [8]
links:
  website: https://icicos.org/2026/
notes:
- Organized by the Department of Informatics at Universitas Diponegoro, Semarang; the IEEE Indonesia Section logo
  appears among the sponsors
- Proceedings of all editions (1st 2017 to 8th 2025) are in IEEE Xplore; no edition in 2023
- 2026 was the 9th edition, hybrid, at Hotel Santika Premiere, Semarang
- Double-blind review through EDAS; papers of 4 to 6 pages in IEEE format; no-show papers are not sent to IEEE Xplore
- Broad scope covering AI, machine learning, NLP, cybersecurity, networks, IoT, vision, big data, software engineering
  and smart city systems
- Three submission rounds in 2026 (April, May and end of May)
- Not listed in the ICORE2026 portal or the CCF 2026 list
