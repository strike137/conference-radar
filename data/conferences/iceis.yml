id: iceis
name: ICEIS
full_name: International Conference on Enterprise Information Systems
type: conference
tier: minor
areas: [data, software, ai]
region: europe
language: english
frequency: annual
organizer: INSTICC (Institute for Systems and Technologies of Information, Control and Communication)
organizer_country: [europe]
proceedings: SCITEPRESS; revised and extended selected papers planned for a Springer LNBIP book
archival: true
indexing: [Scopus, DBLP, EI, Web of Science CPCI (submitted for evaluation)]
fee: 620 EUR INSTICC member, 680 EUR non-member (2027, basic registration with lunches; later and on-site rates are higher)
typical:
  deadline_months: [11, 12, 1, 2]
  conference_months: [4, 5]
links:
  website: https://iceis.scitevents.org/
  dblp: https://dblp.org/db/conf/iceis/index.html
notes:
- Organized by INSTICC; proceedings in the SCITEPRESS Digital Library, a short list of revised and extended papers is
  planned for a Springer LNBIP book and best papers are invited to a Springer Nature Computer Science special issue
- Broad information systems venue (databases and integration, AI and decision support, IS analysis, internet
  computing, HCI, enterprise architecture); 2027 is the 29th edition
- Not listed in CORE ICORE2026 (was CORE C in CORE2018); not on the CCF list
- Two submission stages (1st stage gives an earlier notification), plus position papers, workshops, special
  sessions and an abstracts track; all deadlines AoE
- Held in European cities (Prague 2023, Angers 2024, Porto 2025, Benidorm 2026, Rome 2027) and co-located with
  ENASE, IoTBDS, GISTAM, ICT4AWE and FEMIB with free cross access as a non-speaker
- Remote presentation allowed only exceptionally when speakers cannot travel
