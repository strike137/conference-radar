id: rwc
name: RWC
full_name: Real World Crypto Symposium
type: conference
tier: major
areas: [crypto, security]
region: worldwide
language: english
frequency: annual
organizer: IACR (International Association for Cryptologic Research)
organizer_country: [international]
proceedings: None (non-archival)
archival: false
rank:
  core: Unranked
fee: USD 400 regular / USD 200 student including IACR dues (2026, before Feb 6; USD 100 late surcharge)
typical:
  deadline_months: [10]
  conference_months: [3, 4]
links:
  website: https://rwc.iacr.org/
notes:
- Organized by IACR since 2018; brings cryptography researchers together with engineers deploying crypto; rotates
  worldwide (Taipei 2026, Seattle 2027)
- 'No proceedings: contributed talks are picked by light-touch single-blind review of a 3-page abstract, so work
  published or under submission elsewhere can be presented'
- Widely regarded as the main venue for applied cryptography talks; talks are livestreamed and posted on YouTube
- Student presenters get their registration covered; student stipends available
- Levchin Prize for real-world cryptography is presented at the symposium
