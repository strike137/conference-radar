notes:
- Biennial general computer science conference run by the Technical University of Kosice (Slovakia) with SSAKI and ZSVTS
- Held in Poprad, Slovakia, every November since 2015 (earlier editions in Spisska Nova Ves, Roznava, Herlany)
- Papers up to 6 pages in IEEE format, two reviewers per paper; extra pages cost EUR 20 each
- Proceedings in IEEE Xplore (2024 volume DOI 10.1109/Informatics62280.2024); papers must be presented
- Selected papers invited to partner journals (Open Computer Science, Journal of Information and Organizational Sciences, Acta Electrotechnica et Informatica)
- Deadlines are usually extended
- Ranked National (Slovakia) in ICORE2026
