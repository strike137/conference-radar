id: ieecon
name: iEECON
full_name: International Electrical Engineering Congress
type: conference
tier: minor
areas: [communications, general]
region: southeast-asia
language: english
frequency: annual
organizer: Electrical Engineering Academic Association (Thailand) (EEAAT), with a host university department each year; technical sponsor IEEE Thailand Section
organizer_country: [thailand]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [10, 12]
  conference_months: [3]
links:
  website: https://www.ieecon.org/
notes:
- Run by the Electrical Engineering Academic Association (Thailand) together with a Thai university department that
  changes every year; IEEE Thailand Section is listed as technical sponsor
- Held annually in Thailand since 2013; 14th edition in Pattaya (2026), 15th in Rayong (2027)
- Broad electrical engineering scope (power and energy, electronics and control, signal processing, communications,
  computer and IT, industrial technology)
- Double-blind review by three reviewers; full papers up to 6 pages in IEEE format; presented papers are submitted to
  IEEE Xplore
- Submission deadlines are usually extended
- Not listed in the CORE ICORE2026 portal
