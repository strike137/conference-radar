notes:
- Annual national AI conference of Taiwan run by TAAI; 31st edition in 2026, hosted by a different Taiwanese institution
  each year (2025 NTNU in Taipei, 2026 NTPU at Sanxia, New Taipei)
- International track (English, 10-15 pages LNCS, Springer CCIS post-proceedings) plus a domestic track in Chinese
  or English (up to 6 pages or a 2-page extended abstract)
- Single-blind review on OpenReview; late September deadline with October notification
- Has an exchange with JSAI; JSAI members pay the member rate
