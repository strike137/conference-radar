id: ukrmw
name: IEEE UkrMW
full_name: IEEE Ukrainian Microwave Week
type: conference
tier: minor
areas: [communications]
region: online
language: english
frequency: biennial
organizer: IEEE Ukraine Section (MTT, AP and ED joint chapters) with Yuriy Fedkovych Chernivtsi National University
organizer_country: [other]
proceedings: IEEE Xplore
archival: true
fee: 240 to 300 EUR (2026, by membership); 150 to 200 EUR for students; large discounts for Ukrainian authors
typical:
  deadline_months: [3, 4]
  conference_months: [8]
links:
  website: https://uamweek.ieee.org.ua/
notes:
- Joint week of six IEEE conferences traditionally held in Ukraine (MSMW, ICATT, MRRS, UWBUSIS, DIPED and, from 2026,
  MMET), each kept as a track with its own numbering
- Held every even year since 2020; the 2026 edition was the 3rd Ukrainian Microwave Week
- 2026 edition held fully online over Zoom
- Covers microwaves, millimeter waves, antennas, radar and remote sensing, computational electromagnetics, UWB signals
  and photonics
- Peer reviewed by two or three reviewers; papers 4 to 6 A4 pages; presented papers go to IEEE Xplore, no-show papers
  are excluded
- Microwave engineering venue outside the usual CS rankings; not listed in ICORE2026 or the CCF 2026 list
