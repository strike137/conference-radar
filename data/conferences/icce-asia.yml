notes:
- Jointly organized by IEEE Consumer Technology Society and IEIE (Korea); Asian counterpart of IEEE ICCE
- Mostly held in Korea in late October or November (Busan 2023 and 2025, Da Nang 2024, Gangneung 2026)
- Regular papers 2 to 6 pages; broad scope including AI, security and privacy of CE, IoT and wireless
- Very late deadline with rolling notification in order of submission (2026)
- Best papers recommended to JSTS or IEIE Transactions on Smart Processing and Computing
