notes:
- Symposium on logic-based program synthesis, transformation, analysis and verification, held since 1991
- Usually co-located with PPDP (with ICLP in 2025, as part of FM 2024 in 2024)
- 2026 edition held as a joint LOPSTR+PPDP symposium co-located with ICFP 2026 in Indianapolis, USA
- Proceedings in Springer LNCS
- Regular papers up to 15 pages and short papers up to 8 pages, excluding references
- A few best papers are invited to the journal Theory and Practice of Logic Programming (TPLP)
- Mostly held in Europe (Lisbon 2023, Milan 2024, Rende 2025); Indianapolis in 2026
- CORE C (ICORE2026); CCF C
