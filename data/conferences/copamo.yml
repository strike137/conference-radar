  website: https://copamo.github.io/
notes:
- Full-day workshop on collaborative modeling (real-time collaboration, version control, consistency) and participatory modeling with stakeholders in model-driven engineering
- Co-located with the MODELS conference, so it moves with MODELS (2025 fully online for Grand Rapids, 2026 Malaga)
- Successor of the Hands-on Workshop on Collaborative Modeling (HoWCoM, 2021 and 2023); CoPaMo editions in 2024 and 2025
- Accepted papers go into the MODELS Companion proceedings (joint workshop proceedings, IEEE in 2025, ACM in 2026)
- Full papers up to 10 pages and short papers up to 5 pages including references, ACM format; at least 3 reviewers per paper
- Not listed in the CORE portal (ICORE2026)
