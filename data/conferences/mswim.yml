notes:
- Long-running venue (28th edition in 2026, first held 1998 in Montreal) on modeling, analysis and simulation of
  wireless and mobile networks, with an emphasis on rigorous performance evaluation
- Known as ACM MSWiM through 2023 (proceedings in the ACM DL); since 2025 papers go to IEEE Xplore and the
  conference is technically sponsored by IEEE
- No 2024 edition; recent editions in Montreal (2022, 2023), Barcelona (2025) and Paris (2026)
- Single-blind review via EDAS; 8 pages IEEE double-column, up to 10 with paid extra pages (120 EUR each)
- Extended versions of selected papers are considered for a fast track issue of Elsevier Computer Communications
- ICORE2026 rank A; CCF C (computer networks)
- Co-located symposia and workshops, plus poster, demo and PhD Forum tracks
