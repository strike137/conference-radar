id: icsecs
name: IEEE ICSECS
full_name: International Conference on Software Engineering & Computer Systems
type: conference
tier: minor
areas: [software, systems, general]
region: southeast-asia
language: english
frequency: biennial
organizer: Faculty of Computing, Universiti Malaysia Pahang Al-Sultan Abdullah (UMPSA)
organizer_country: [malaysia]
proceedings: IEEE Xplore
archival: true
fee: RM1000 physical local, RM1200 physical international for non-IEEE members; RM700 to RM900 for IEEE student members (2027)
typical:
  deadline_months: [5, 6, 7]
  conference_months: [8, 10]
links:
  website: https://icsecs.umpsa.edu.my/
notes:
- Biennial conference run by the Faculty of Computing of UMPSA (formerly Universiti Malaysia Pahang) since 2009; 2027 is the 10th edition
- Accepted and presented papers are submitted to IEEE Xplore; strict IEEE no-show policy, online presentation allowed
- 4 to 6 page IEEE format papers, blind-reviewed by at least three reviewers
- "Nine broad tracks: IoT, big data and AI, networking, image processing and robotics, software engineering, cyber security and privacy, e-learning, industrial electronics, instrumentation"
- Held in Malaysia (2023 Penang, 2025 Pekan, 2027 Kuantan); submission deadline was extended twice in 2025
- Not in the CORE ICORE2026 list
