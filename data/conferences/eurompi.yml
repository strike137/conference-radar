notes:
- Main venue for research on MPI and message passing; successor of the EuroPVM/MPI meeting series that started in 1994
- 2026 papers published in Springer LNCS (as in 2024 and 2025); 2020, 2022 and 2023 proceedings were in the ACM Digital Library
- Full papers 12 to 15 pages in LNCS format; short and position papers and a non-archival poster track also accepted
- Single-anonymous review with at least three reviews per paper; deadlines AoE and usually extended by a few weeks (the separate 2026 abstract deadline was dropped)
- Despite the name it rotates worldwide (Bristol 2023, Perth 2024, Charlotte 2025, Vienna 2026)
- 2026 edition held the same week as IWOMP (OpenMP workshop), with an MPI Forum meeting before the conference
