id: icmai
name: ICMAI
full_name: International Conference on Mathematics and Artificial Intelligence
type: conference
tier: minor
areas: [ai]
region: china
language: english
frequency: annual
organizer: Conference secretariat (icmai@young.ac.cn); ICMAI 2027 organized by Jozef Stefan Institute with University of Ljubljana
proceedings: ACM DL (ACM ICPS)
archival: true
indexing: [EI, Scopus]
fee: 425 USD regular author, 400 USD student author (2027); ACM ICPS open access APC charged separately
typical:
  deadline_months: [5]
  conference_months: [9]
links:
  website: https://www.icmai.org/
notes:
- Held in China up to 2024 (Chengdu 2018 to 2021, Chongqing 2022 and 2023, Beijing 2024); 2027 edition moves to Ljubljana, Slovenia
- Proceedings in the ACM International Conference Proceedings Series (ACM DL) from 2018 to 2024, stated as indexed in EI Compendex and Scopus
- The 2027 registration page refers to ACM ICPS open access; authors outside ACM Open institutions pay an APC (350 USD subsidized rate)
- 2022 edition was run as a workshop of ICICSE 2022
- Abstract only submission accepted for oral presentation without publication
- Smaller commercially run conference; organizer_country left out because the secretariat's country is not stated
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
