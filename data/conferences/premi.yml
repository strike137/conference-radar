notes:
- Biennial; the 11th edition was held at IIT Delhi in December 2025, organized with the Machine Intelligence Unit
  of ISI Kolkata
- Proceedings in Springer LNCS (2025 edition in two volumes); 2025 edition endorsed by IAPR
- Mostly held in India; earlier editions also went to Moscow (2011) and Warsaw (2015)
- Broad pattern recognition and machine intelligence scope; papers up to 8 pages; has tutorials, workshops and a
  doctoral colloquium
- Not ranked in ICORE2026 or CCF; regional venue
