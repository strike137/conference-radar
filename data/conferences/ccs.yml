rank:
  core: A*
  ccf: A
acceptance_rate: 14% (2025, 316/2186)
fee: About 1200 EUR early for ACM/SIG members, 1400 EUR non-members, 850 EUR students (2026, main conference)
typical:
  deadline_months: [1, 4]
  conference_months: [10, 11]
links:
  website: https://www.sigsac.org/ccs/CCS2026/
  dblp: https://dblp.org/db/conf/ccs/index.html
notes:
- Flagship conference of ACM SIGSAC; one of the 'Big 4' security conferences
- Two review cycles (January and April) with mandatory abstract submission one week before; double-blind; minor
  revision decisions possible; at most 7 papers per author per cycle
- 'Location rotates worldwide: Taipei (2025), The Hague (2026), Atlanta (2027)'
- Papers rejected in the first cycle cannot be resubmitted to the second cycle of the same year
- Many co-located workshops (e.g., AISec, CCSW) that are easier entry points for students; student conference grants
  offered
