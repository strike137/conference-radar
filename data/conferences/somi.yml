notes:
- Workshop plus hands-on MLOps tutorial at ECML PKDD on deploying reproducible and reliable end-to-end ML pipelines in industry
- First edition at ECML PKDD 2026 in Naples (listed by ECML PKDD as 'Systems, Not Models')
- Regular papers up to 14 pages plus references go into the Springer workshop proceedings of ECML PKDD 2026
- Short papers up to 6 pages (work in progress, position papers, negative results) are presented but not published
- In-person presentation by at least one author is required
- Not listed in CORE ICORE2026
