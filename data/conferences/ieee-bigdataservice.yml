notes:
- Big data computing, services and machine learning applications; 12th edition in 2026, 13th in 2027
- One of several co-located conferences of the IEEE CISOSE congress (with SOSE, JCC, IMC, DAPPS, AITest, FTS, FITYR), which rotates between the Americas, Europe and Asia
- 'Recent hosts: Athens (2023), Shanghai (2024), Tucson (2025), Fukuoka (2026), Oxford (2027)'
- Proceedings in IEEE Xplore (DOI prefix 10.1109/BigDataService)
- 'Paper types: full up to 8 pages, short/demo up to 5 pages, posters 2 pages (IEEE format); workshop proposals welcome'
- Selected papers invited to journal special issues (SCI-indexed journal, MDPI Electronics in 2026)
- 2026 had a special track on Secure AI with a later deadline
- Not ranked in ICORE2026 and not on the CCF 2026 list
