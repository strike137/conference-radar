organizer: ACL SIGSEM and ISO TC 37/SC 4 WG 2 (Semantic annotation and representation); co-located with LREC or IWCS
organizer_country: [international]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [3, 6]
  conference_months: [5, 9]
links:
  website: https://sigsem.uvt.nl/isa22/
notes:
- Joint workshop series of the ACL Special Interest Group on Computational Semantics (SIGSEM) and ISO TC 37/SC 4 WG 2,
  running since 2005 (ISA-22 in 2026)
- Topics are semantic annotation of text, speech, gestures, images and video, and ISO standard annotation schemes
- Alternates between LREC (Marseille 2022, Turin 2024, Palma de Mallorca 2026) and IWCS (online 2021, Nancy 2023,
  Duesseldorf 2025)
- Long papers (6 to 8 pages), short papers and project notes (3 to 5 pages); double-blind review
- Proceedings in the ACL Anthology (15 papers in 2026, 11 in 2025, 19 in 2024)
- Not listed in ICORE2026 and not on the CCF list
