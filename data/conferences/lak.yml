notes:
- Flagship conference of the Society for Learning Analytics Research (SoLAR), held since 2011; research and practitioner audience
- Full and short research papers go through double-blind review with a short optional rebuttal phase (7 days, max 500 words)
- Research papers were published in ACM proceedings up to LAK26; from LAK27 they appear (as a trial) in special issues of the Journal of Learning Analytics, short papers as emerging works
- Practitioner reports, posters, demos, workshops and doctoral consortium papers go to open access companion proceedings on the SoLAR website
- At least one author must register by the early bird deadline for the paper to be included in the proceedings
- Rotates worldwide (Arlington 2023, Kyoto 2024, Dublin 2025, Bergen 2026, Recife 2027); usually in March
- Sister venue to EDM; LAK focuses on learning theory and practice rather than comparing prediction algorithms
- ICORE2026 rank A; not on the CCF list
