notes:
- Co-located with the NDSS Symposium since 2024 (2024, 2025, 2026 editions all in San Diego); papers published by
  the Internet Society
- 'Focus on IoT standards and shared implementations: Matter, FCC IoT cybersecurity labeling, SBOM/CBOM/HBOM and
  supply chain rules'
- Double-blind review; regular papers up to 8 pages, short or work-in-progress papers up to 4 pages (NDSS format)
- 'Small one-day workshop: 10 accepted papers in 2026; deadlines have been extended every year'
- 2027 edition not announced yet; the NDSS 2027 call for co-located workshops is still open, and NDSS 2027 is in
  Seoul (22-26 Mar 2027)
