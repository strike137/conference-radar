id: hkoscon
name: HKOSCon
full_name: Hong Kong Open Source Conference
type: industry
tier: minor
areas: [software, systems]
region: china
language: mixed
frequency: annual
organizer: Hong Kong Creative Open Technology Association (HKCOTA), with Hong Kong Linux User Group and Open Source Hong Kong
organizer_country: [china]
proceedings: None
archival: false
typical:
  conference_months: [6, 7]
links:
  website: https://hkoscon.org/
notes:
- Community-run open source practitioner conference in Hong Kong, held since 2013; calls itself the largest annual
  open source event in Hong Kong
- OSHK handed the leading organizer role to HKCOTA in 2023; HKLUG and OSHK are supporting organizers
- Talks, workshops and lightning talks in English, Cantonese and Mandarin; no papers or proceedings
- Usually one or two days in June or July on a university or Science Park campus; 2021 was virtual
- No 2025 edition is listed in the official archive (2024 was followed by 2026)
- "Official timeline: call for proposals in January to March, conference in June"
