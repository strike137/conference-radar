notes:
- Joint conference of IJTCS (started 2020) and FAW, Frontiers of Algorithmics Workshop (started 2007); joint since 2021
- Three tracks in 2025, algorithms and complexity (the FAW track), blockchain and multi-agent systems, and algorithmic game theory and ML theory
- Proceedings in Springer LNCS titled Frontiers of Algorithmics (LNCS 15828 for 2025)
- Selected papers invited to special issues of TCS, Journal of Combinatorial Optimization, Theory of Computing Systems and Blockchain
- Held in China until 2024 (Beijing 2020 and 2021, Hong Kong 2022, Macao 2023, Hong Kong 2024); Paris 2025 hosted by Sorbonne University
- 12 page extended abstracts in LNCS format via EasyChair
- CCF C (2026 list); ranked National China in ICORE2026 under its old name International Frontiers of Algorithmics Workshop (FAW)
