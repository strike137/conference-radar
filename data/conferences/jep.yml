notes:
- French-language speech science conference with scientific backing from AFCP; 2026 is the 36th edition
- Topics span phonetics and speech technology (recognition, synthesis, speaker and language recognition, speech coding, language models)
- Held every two years in France; joint with TALN and RECITAL in 2020 and 2024 (JEP-TALN-RECITAL)
- Long papers of 8 pages or 2-page short abstracts, anonymous submission on EasyChair; translations of already published work accepted
- Proceedings in the ACL Anthology (35th JEP 2024 volume)
- Not listed in the CORE portal (ICORE2026)
