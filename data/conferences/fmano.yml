notes:
- Workshop on formal methods for network verification, synthesis, diagnosis and operation, co-located with ACM SIGCOMM
- Held since 2024 (Sydney 2024, Coimbra 2025, Denver 2026)
- Papers appear in the SIGCOMM Workshop Proceedings in the ACM Digital Library
- Regular papers up to 6 pages including references; extended abstracts up to 2 pages plus 1 page of references; single-blind
- Half-day workshop with two keynotes
- Not listed in the CORE portal (ICORE2026)
