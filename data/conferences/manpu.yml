notes:
- Half-day workshop on comics and manga image analysis, co-located with ICPR or ICDAR
- Recent editions with ICPR 2020 (virtual, January 2021), ICPR 2022 Montreal, ICDAR 2024 Athens and ICPR 2026 Lyon
- Papers appear in the host conference workshop proceedings in Springer LNCS
- Double-blind review in 2026 (single-blind in 2024); LNCS format up to 15 pages, extra pages 150 EUR each
- Registration goes through the host conference; one full (non-student) registration per paper
- Very small; five oral papers in the 2026 program
