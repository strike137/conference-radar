notes:
- Half-day workshop at ACM RecSys on fairness, accountability, transparency and social responsibility in recommender systems
- Held as FATREC in 2017 and 2018 and as FAccTRec from 2020; the 8th edition was at RecSys 2025 in Prague
- No official proceedings; authors are expected to post accepted papers on arXiv, and already published work may be submitted
- A workshop summary article appears in the ACM Digital Library
- Position papers (2 pages sigconf) and research papers (6 pages sigconf), single-blind review via EasyChair
- Remote presentation possible
- Not listed in the CORE ICORE2026 portal
