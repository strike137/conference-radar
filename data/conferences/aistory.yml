links:
  website: https://aistory2026.github.io/
notes:
- Half-day workshop on generative AI for coherent visual and multimodal storytelling (character consistency, story
  generation with LLMs and VLMs, visual narrative)
- Held with ICCV 2025 (Honolulu) and CVPR 2026 (Denver)
- 4-page short and 8-page long papers, double-blind via OpenReview; accepted papers go into the CVPR/ICCV workshop
  proceedings
- Separate call for demos in any medium
- 8 papers on CVF Open Access for CVPR 2026, 4 for ICCV 2025
- Not listed in ICORE2026 or the CCF list
