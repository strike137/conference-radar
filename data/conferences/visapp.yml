id: visapp
name: VISAPP
full_name: International Conference on Computer Vision Theory and Applications
type: conference
tier: minor
areas: [vision, ai]
region: europe
language: english
frequency: annual
organizer: INSTICC (Institute for Systems and Technologies of Information, Control and Communication)
organizer_country: [europe]
proceedings: SCITEPRESS
archival: true
fee: 620 EUR INSTICC member, 680 EUR non-member (2027, basic registration with lunches; later and on-site rates are higher)
typical:
  deadline_months: [9, 10, 11]
  conference_months: [2, 3]
links:
  website: https://visapp.scitevents.org/
  dblp: https://dblp.org/db/conf/visapp/index.html
notes:
- Organized by INSTICC; proceedings in the SCITEPRESS Digital Library, a short list of extended papers is planned
  for a Springer CCIS book
- Co-located with other INSTICC conferences (ICORES and GRIVAPP in 2026; ICAART, PHOTOPTICS, ROBOVIS and GRIVAPP
  in 2027); registration gives free access to them
- Not listed on its own in CORE ICORE2026, which lists only VISIGRAPP (GRAPP and VISAPP combined) as a multiconference
- Two submission stages (submit in the 1st stage for an earlier notification) plus a separate abstracts track;
  all deadlines AoE
- Held in European tourist cities (Marbella 2026, Valletta 2027 at the Grand Hotel Excelsior); remote presentation
  allowed only exceptionally
