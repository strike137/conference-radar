notes:
- Described by IEEE Computer Society as its flagship conference on computers, software and applications; 51st edition
  in 2027
- Organized as many symposia, including Security, Privacy and Trust (SEPT), Applied AI (AAI) and Networks (NCIW)
- COMPSAC 2027 will be held in Tokyo (July 2027); 2024 was in Osaka
- Double-blind review; 10-page full papers (limit includes references) plus up to 2 extra pages at USD 125 each;
  JC/CJ program for journal-related papers
- Student Research Symposium (4 pages) and Fast Abstracts (2 pages) give short-paper options; CORE B, CCF C
