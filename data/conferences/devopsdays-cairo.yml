notes:
- Cairo edition of the worldwide community DevOpsDays series, held every year since 2018
- Organized by the Egyptian government agency ITIDA through its Software Engineering Competence Center (SECC), with local organizers from Orange Labs, DXC Technology and ATOS and Cairo University as an academia sponsor (2026)
- One-day event on a Saturday in late September at Creativa Innovation Hub, Giza
- Free registration; onsite only in 2025
- No papers or proceedings
