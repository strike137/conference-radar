- Research papers up to 8 pages and position papers up to 4 pages, including references, in the ASE workshop format
- 2026 papers published in the ACM Digital Library with the other ASE 2026 workshop proceedings
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
