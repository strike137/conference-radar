notes:
- Annual symposium of the Brazilian Telecommunications Society (SBrT), held since 1983; 44th edition in 2026
- Covers telecommunications and signal processing (antennas and microwaves, 5G/6G, ML for communications, quantum
  communication, information theory, image and biomedical signal processing)
- Papers in Portuguese or English; full papers up to 5 pages (oral), undergraduate research papers up to 3 pages
  (poster); submission through EDAS
- Papers published open access with DOIs (prefix 10.14209) in the SBrT digital library; 231 papers in 2025
- Held in a different Brazilian city each year, hosted by a local university (Natal/UFRN 2025, Salvador/UFBA 2026);
  IEEE ComSoc is listed as a supporter
- Not ranked in CORE ICORE2026
