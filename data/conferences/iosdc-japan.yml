notes:
- Conference for software engineers with iOS-related technology as its core theme; talks need not be about iOS
- Annual since 2016 in Tokyo; Waseda University Nishi-Waseda campus 2022 to 2024, Ariake Central Tower Hall and
  Conference 2025 and 2026 (online only in 2021); talks also streamed online
- Talks (20 or 40 minutes, LT and rookies LT of 5 minutes) chosen from an open call for proposals on fortee; several
  proposals per person welcome
- Talks in Japanese or English; English talks are not translated
- Accepted speakers get a free ticket; no travel support or speaker fee
- Separate call for technical articles printed in the conference pamphlet (2, 4 or 8 pages)
- No papers or proceedings; talks are recorded and published later
- Independent event, not endorsed by Apple
