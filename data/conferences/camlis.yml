notes:
- Independent academic/industry conference on machine learning for information security, held since 2017 (no 2020
  edition); held in Arlington, VA (Washington DC area) every year since 2021
- Accepts full papers (10 pages minimum) or extended abstracts (up to 4 pages) for talks or posters; only full papers
  are eligible for the proceedings, published in PMLR since 2025 (CAMLIS 2025 is PMLR vol. 299; 2021 to 2024 proceedings
  were in CEUR-WS)
- Double-blind review via Microsoft CMT; all presentations must be in person
- Limited to 200 in-person attendees with a free Zoom livestream; student scholarships available
- Strong practitioner audience (organizers from NVIDIA, Google, CrowdStrike, Meta); the separate CAMLIS Red red-teaming
  day of 2025 was merged into the main program in 2026
