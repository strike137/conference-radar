links:
  website: https://infinity2026.pages.dev/
notes:
- Workshop on mathematical techniques for analysing and verifying systems with infinitely many states (VAS, Petri nets, counter and pushdown systems)
- Satellite of a host conference that changes (CONCUR, ICALP, LICS, ATVA, FSTTCS); 2026 edition at ICALP, 2023 at CONCUR
- Talks only; the 2026 edition had invited and spotlight talks with slides on the website, and the 2023 call stated there are no formal proceedings
- Annual until 2020, then irregular (2023, 2026)
- Not listed in CORE ICORE2026 or the CCF 2026 list
