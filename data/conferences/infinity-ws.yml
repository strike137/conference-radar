id: infinity-ws
name: INFINITY
full_name: International Workshop on Verification of Infinite-State Systems
type: workshop
tier: minor
areas: [general]
region: worldwide
language: english
frequency: irregular
organizer: Rotating organizers (2026 University of Warwick and MPI for Informatics)
