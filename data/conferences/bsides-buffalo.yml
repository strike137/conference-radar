notes:
- Grassroots Security BSides conference for Western New York; the 2026 edition was the fifth
- One-day Saturday event at Canisius University Science Hall, Buffalo, New York, USA
- Call for Presenters on Sessionize, usually open from mid January to the end of March
- "Tracks: General (50 minutes), Lightning Talk (20 minutes), Hacking is Art and Introsec for newcomers"
- CTF, soldering and lockpicking; students and job seekers get a free ticket by sharing a resume with sponsors
- No proceedings
