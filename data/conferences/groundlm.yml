notes:
- First edition in 2026, a one-day workshop at EMNLP 2026 in Budapest (listed as GLM on the EMNLP workshops page)
- Topic is grounding language models in knowledge, interaction, perception and action for faithfulness and learning efficiency
- Two tracks, direct submission via OpenReview and an ARR commitment fast track that also takes papers rejected elsewhere with their reviews
- Long (8 pages) and short (4 pages) archival papers appear in the ACL Anthology (2026.groundlm-1); non-archival papers are presented only
- Double-blind review; best paper award
- Hosts two shared tasks, GoldenViewVQA (multi-view driving VQA) and LitTraceQA (literature-grounded QA)
- Not ranked in ICORE2026 and not on the CCF list
