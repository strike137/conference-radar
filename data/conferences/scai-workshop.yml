notes:
- Workshop on conversational AI for information access, bridging NLP, information retrieval, machine learning and HCI
- Not to be confused with the Scandinavian Conference on Artificial Intelligence (also SCAI)
- First held at ICTIR 2017; co-located with a different conference each year (EMNLP 2018, WebConf 2019, IJCAI 2019, EMNLP 2020, online 2021, SIGIR 2022, CHIIR 2024, IJCAI 2025, SIGIR 2026, ECIR 2027)
- The 2025 call states the venue is non-archival and previously published work may be submitted
- 2026 call took long (8 pages), short (4 pages) and proposal (2 pages) papers in ACM sigconf format via EasyChair, original or recently accepted
- 2026 edition (10th) hosted the iKAT shared task on personalized conversational information access, formerly a TREC track
- 2027 edition at ECIR plans a challenge-driven format with a live collaborative conversational search task instead of paper sessions
- Not listed in ICORE2026 and not on the CCF list
