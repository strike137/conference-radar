notes:
- Run by the Department of Computer Science at AIUB; held every two years on the AIUB campus in Dhaka, Bangladesh (2020,
  2022, 2024, 2026)
- Proceedings in the ACM Digital Library (ACM ICPS); 2024 edition in cooperation with ACM SIGAPP; the site says most
  earlier ICCA papers are indexed in Scopus
- Extended versions of selected papers go to a special issue of the AIUB Journal of Science and Engineering (AJSE)
- Broad computer science scope in eight tracks, from AI and data science to networking, security, software engineering
  and HCI
- Low registration fees; one author registration required per paper, with 50% off for additional papers by the same
  author
- Deadlines are usually extended (2024 deadline moved from 2024-05-15 to 2024-05-25, 2026 from 2026-05-15 to 2026-06-06)
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list; not to be confused with other venues using the ICCA acronym
