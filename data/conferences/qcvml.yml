notes:
- Half-day workshop introducing quantum computing (quantum annealing and gate-based) to the computer vision and machine learning community
- 2026 edition focused on quantum generative models (quantum GANs, quantum diffusion models, hybrid quantum-classical generators)
- Editions at CVPR 2023, ECCV 2024 and ECCV 2026 (3rd edition)
- Program of a tutorial, invited talks from academia and industry, and a panel
- No paper or poster submission track in 2026; authors of recently published peer-reviewed papers can propose a highlight talk by email
- 2024 edition took poster proposals by email; 2023 edition presented only previously published papers
- Hybrid in 2026, with live streaming through the ECCV platform
- Not listed in ICORE2026 or the CCF list
