notes:
- Main venue for parameterized and exact algorithms and complexity (was IWPEC before 2004); CORE B
- Held every year as part of ALGO together with ESA, WAOA, ATMOS, ALGOWIN, ALGOCLOUD and WABI, so always in Europe
- Proceedings in the open-access LIPIcs series as post-proceedings; camera-ready is due after the conference
- Submissions in LIPIcs format; the first 500 lines must be enough to judge the paper; final version up to 15 pages plus bibliography
- Lightweight double-blind review; at least one author is expected to present in person
- Hosts the EATCS-IPEC Nerode Prize and the PACE implementation challenge award ceremony
- Steering committee members come from Europe, India and Israel
