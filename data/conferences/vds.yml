  conference_months: [10]
links:
  website: https://www.visualdatascience.org/
notes:
- Symposium on the role of visualization across the data science pipeline (collecting, cleaning, mining, exploring and communicating data) and its link with ML and AI
- Held since 2015; the 2024 edition at IEEE VIS was the tenth
- Full papers (up to 8 pages) and short papers (up to 4 pages) in the IEEE VIS TVCG format; position papers accepted for the special theme
- Accepted papers archived in IEEE Xplore (publishing fees may apply)
- No VDS edition found at IEEE VIS 2025 or 2026; the website still points to 2024 as the latest
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
