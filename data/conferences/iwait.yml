id: iwait
name: IWAIT
full_name: International Workshop on Advanced Image Technology
type: conference
tier: minor
areas: [vision, ai]
region: asia-pacific
language: english
frequency: annual
organizer: Rotating host society with an Asian advisory committee; IWAIT 2027 organized by KIBME (Korean Institute of
  Broadcast and Media Engineers)
organizer_country: [korea, japan, taiwan]
proceedings: SPIE Proceedings (SPIE Digital Library)
fee: 340 USD general, 540 USD regular, 260 USD student (2027, international attendees)
typical:
  deadline_months: [8, 9]
  conference_months: [1]
links:
  website: https://iwait.online/
notes:
- Annual since 1998, held every January and rotating among Japan, Korea, Taiwan, Singapore, Thailand, Malaysia, Vietnam,
  Indonesia and Hong Kong
- Image, video and multimedia processing, compression, broadcasting, computer vision, graphics and machine learning
- Submission is a one-page extended abstract in IEEE style; accepted authors are encouraged (not required) to submit
  a 4 to 6 page full paper in SPIE format for the SPIE Proceedings
- IWAIT 2026 proceedings are Proc. SPIE volume 14072; abstracts are also distributed to participants
- Some editions are held jointly with IFMIA (International Forum on Medical Imaging in Asia), e.g. 2023 and 2026
- Has a student award; applicants submit the abstract plus a supervisor recommendation letter
- Not listed in ICORE2026 or the CCF list
