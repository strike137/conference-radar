notes:
- Workshop on LLMs for programming language problems (program analysis, verification, synthesis, compiler optimization) and PL techniques for LLMs
- Co-located with SPLASH; 1st edition at ICFP/SPLASH 2025 in Singapore, 2nd at SPLASH/ISSTA 2026 in Oakland, USA
- Research papers 8 to 10 pages in ACM SIGPLAN format go into the ACM proceedings (optional in 2026); extended abstracts are talk only
- Double-blind review via HotCRP
- Not ranked in CORE ICORE2026 and not on the CCF 2026 list
