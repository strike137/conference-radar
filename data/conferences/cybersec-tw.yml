notes:
- Organized by iThome (Taiwanese IT media) since 2015; 2026 was the 12th edition, theme 'Resilient Future'
- Held every spring at Taipei Nanggang Exhibition Center Hall 2 (Apr 15-17 in 2025, May 5-7 in 2026); claims 20,000+
  attendees, 300+ sessions and 400+ exhibiting brands
- Call for Speakers closes 30 November for the following spring; 30 min breakout and 45 min deep dive talks, vendor-neutral
  content only
- Talks are mostly in Mandarin; CYBERSEC GLOBAL is a pre-recorded English-only online track
- Speakers receive an honorarium (6,000 or 9,000 TWD in 2026); overseas speakers can claim up to 1,000 USD travel
  support
