notes:
- One-day symposium co-located with NDSS Symposium in San Diego (Feb 27, 2026; Feb 24, 2025; Feb 26, 2024)
- 'Topics: human factors and usability in security and privacy; papers must address both a human aspect and security
  or privacy'
- Research and Meta-Science tracks (up to 12 pages) plus a Vision track (up to 5 pages) for work in progress and
  position papers; double-blind, NDSS template
- Proceedings published by the Internet Society with ISBN and DOIs (10.14722/usec.YYYY.*); papers posted on the
  NDSS site
- 22 accepted papers listed for 2026; fast review (about two weeks from deadline to notification)
- Test of Time award announced in the 2025 and 2026 calls (2026 recipient gave the keynote)
- Much smaller than SOUPS (CORE A), the main usable security venue; ICORE2026 lists USEC as National USA
- NDSS 2027 moves to Seoul, Korea (March 22 to 26, 2027); a USEC 2027 edition there is not announced yet
