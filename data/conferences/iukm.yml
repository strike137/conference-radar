notes:
- Symposium on uncertainty management, reasoning and decision making (fuzzy sets, Dempster-Shafer theory, rough sets,
  machine learning, decision support); started at JAIST in 2010 as IUM, renamed IUKM in 2011
- Proceedings in Springer LNAI, available at the symposium; full papers up to 12 pages, submitted through CMT
- Held in Japan, Vietnam, China and Thailand; recent editions 2023 Kanazawa, 2025 Ho Chi Minh City, 2026 Quy Nhon
- Not held every year (2019, 2020, 2022, 2023, 2025, 2026), and the month varies (March, September, November)
- Selected papers of past editions went to special issues of Annals of Operations Research and the International
  Journal of Approximate Reasoning
- Hybrid format; the submission deadline is usually extended, sometimes more than once
- Not listed in ICORE2026 and not in the CCF list
