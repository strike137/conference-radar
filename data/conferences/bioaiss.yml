notes:
- Inaugural edition in 2026, a one-day workshop co-located with IEEE ACSAC 2026 in Los Angeles
- Security and safety of AI in biotechnology, healthcare and synthetic biology (Bio-LLM jailbreaks, adversarial ML,
  biomedical data leakage, cyberbiosecurity governance)
- Regular papers 7 to 12 pages, short and case study papers 2 to 6 pages, posters 1 to 2 pages, IEEE compsoc
  double-column format
- Submissions are non-blinded and go through the ACSAC HotCRP
- ACSAC states that each workshop has online proceedings through the IEEE Digital Library; final proceedings details
  for BioAISS are to be announced by ACSAC
- General chair Mohammad GhasemiGol (Old Dominion University); vice-chairs from ODU, BioSView Labs, Ben-Gurion
  University and DayBlink Consulting
- Not listed in CORE ICORE2026
