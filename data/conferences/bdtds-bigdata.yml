notes:
- Workshop on distributed storage coding (erasure codes, regenerating and locally repairable codes), storage systems and blockchain; 2026 is the 14th edition
- Started as the Workshop on Distributed Storage Systems and Coding for Big Data; blockchain added to the title from the 6th edition
- Run by Hui Li's lab at Peking University Shenzhen, with co-chairs from Shenzhen University of Advanced Technology and Peng Cheng Laboratory
- Held with the IEEE International Conference on Big Data every year
- Papers in the IEEE BigData workshop proceedings (IEEE Computer Society Press, IEEE Xplore); at least one author must register
- Papers up to 10 pages in two-column IEEE format; extra pages cost an additional fee
- 2025 edition (WS16) ran online as a half-day workshop
- Not ranked by CORE (not in ICORE2026) or CCF
