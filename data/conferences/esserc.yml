id: esserc
name: ESSERC
full_name: IEEE European Solid-State Electronics Research Conference
type: conference
tier: major
areas: [general]
region: europe
language: english
frequency: annual
organizer: ESSERC Steering Committee with IEEE SSCS, IEEE EDS and IEEE CASS; secretariat Sistema Congressi (Padova)
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [4]
  conference_months: [9]
links:
  website: https://www.esserc.org/
notes:
- Merger of ESSDERC (devices, since 1971) and ESSCIRC (circuits, since 1975); last joint ESSDERC/ESSCIRC in Lisbon
  2023, first unified ESSERC in Bruges 2024 (numbered the 50th)
- Main European forum for solid-state circuits and devices, with tracks for circuits, technologies and joint topics
- Measurement results or calibration against measured data required; final papers must be IEEE Xplore compliant
- Papers in IEEE Xplore; no-shows are excluded from the proceedings; one registration per paper
- Held every September in Europe (Milan 2022, Lisbon 2023, Bruges 2024, Munich 2025, Palma 2026, Helsinki 2027,
  Bordeaux 2028)
- Not listed in ICORE2026 under ESSERC or ESSCIRC; circuits and devices venue outside the usual CS rankings
