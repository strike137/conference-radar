notes:
- Interdisciplinary conference on historical cryptography, cryptanalysis and the history of cryptology (cipher machines, steganography, AI methods for historical ciphers)
- Series started as HistoCrypt 2018 in Uppsala, preceded by EuroHCC 2016 and 2017
- Held in Europe every year (Amsterdam 2022, Munich 2023, Oxford/Bletchley Park 2024, Poznan 2025, Amiens 2026, Stockholm 2027)
- Regular papers up to 10 pages and short papers up to 4 pages, excluding references; at least two double-blind reviews; submissions via EasyChair
- Proceedings are published before the conference and are freely downloadable
- Low fees (2026 attendance free; packages with lunches and dinners 30 to 170 EUR)
- Not listed in ICORE2026 or the CCF 2026 list
