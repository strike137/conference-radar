notes:
- One of ten co-located conferences of SCF run by the Services Society, a US-registered nonprofit (siblings include ICWS, SCC, CLOUD, EDGE and ICBC)
- Established in 2016 as the International Conference on Internet of Things Services
- Proceedings in Springer LNCS; research and application tracks up to 15 pages, short papers up to 8 pages
- Each submission reviewed by at least three program committee members; submission via EDAS
- Several submission rounds (early bird, regular, special track) in one cycle
- Recent editions in Honolulu (2022), Shenzhen (2023), Bangkok (2024), Hong Kong (2025) and Kuala Lumpur (2026); 2020 and 2021 were virtual
- SCF ran in November or December from 2021 to 2024 (part of 2023 in September); the 2026 edition is in August
- Not listed in ICORE2026; not on the CCF 2026 list
