id: dmbih
name: DMBIH
full_name: Workshop on Data Mining in Biomedical Informatics and Healthcare
type: workshop
tier: minor
areas: [data, ai]
region: worldwide
language: english
frequency: annual
organizer: Samah Jamal Fodeh (Yale University) and Mohammad-Reza Siadat (Oakland University); co-located workshop of IEEE ICDM
organizer_country: [usa]
proceedings: IEEE Xplore (ICDM workshop proceedings)
archival: true
typical:
  deadline_months: [8, 9]
  conference_months: [11]
links:
  website: https://medicine.yale.edu/lab/fodeh/dmbih-workshop/
notes:
- Workshop on data mining and AI (including LLMs and multimodal learning) for EHRs, clinical text, biomedical images and genomics; 2026 is the 14th edition
- Chaired by Samah Jamal Fodeh (Yale University) and Mohammad-Reza Siadat (Oakland University); site alternates between Yale and Oakland University pages
- Held with the IEEE International Conference on Data Mining (ICDM), so the location rotates with ICDM
- Accepted papers published in formal proceedings by the IEEE Computer Society Press (ICDM workshop proceedings, IEEE Xplore)
- Up to 10 pages in IEEE 2-column format, triple-blind review; best paper award
- Not ranked by CORE (not in ICORE2026) or CCF
