id: iocrci
name: IOCRCI
full_name: Workshop on Impact of IT/OT Convergence on the Resilience of Critical Infrastructures
type: workshop
tier: minor
areas: [security, networking]
region: europe
language: english
frequency: annual
organizer: Workshop organizers from TU Delft, TNO and IRT SystemX, at IFIP Networking
organizer_country: [europe]
proceedings: IEEE Xplore (IFIP Networking workshop proceedings)
archival: true
typical:
  deadline_months: [3, 4]
  conference_months: [5, 6]
links:
  website: https://networking.ifip.org/2026/index.php/workshops/iocrci.html
notes:
- Half-day workshop held with IFIP Networking on cyber resilience of critical infrastructures (power, water, traffic, gas) as IT and OT systems converge
- Editions in Barcelona 2023, Thessaloniki 2024, Limassol 2025 and Lugano 2026, always with IFIP Networking
- Papers up to 6 pages in IEEE double-column format, single-blind review via EDAS
- Papers appear in the IFIP Networking proceedings and are submitted to IEEE Xplore
- In-person only (2026)
- Not listed in the ICORE2026 portal or the CCF 2026 list
