notes:
- IEEE-branded US conference run by the Smart Society team that also runs IEEE UEMCON, IEMCON and AIIoT
- Accepted and presented papers are sent to IEEE Xplore (2027 conference record 71326)
- Held in early January at the University of Nevada, Las Vegas (UNLV); virtual in 2022 and 2023; 2027 is the 17th
  edition and fully physical
- Two tracks (computing, communication); double-blind review via EDAS; regular papers up to 7 pages, short papers
  up to 6 pages
- Short cycle of about two months from submission deadline to conference
- Not listed in CORE ICORE2026; generally regarded as a low-selectivity venue
