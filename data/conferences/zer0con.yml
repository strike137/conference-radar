notes:
- Closed, invite-only international conference on offensive vulnerability research (bug hunting, exploit development
  for browsers, kernels, mobile, AI systems, IoT and security products)
- Run by POC Security, the organizer of the POC conference; held every April in a Seoul hotel (Fairmont Ambassador
  Seoul in 2024 to 2026)
- Call for papers by email with a 50 minute talk slot; slides and materials are shared only among speakers,
  attendees and sponsors
- Registration is reviewed for eligibility before a payment link is sent
- Three day trainings in the days before the conference; call for training closes around January 1
