notes:
- Annual non-profit European conference on scientific Python for users and developers of scientific tools from research and industry (18th edition in 2026)
- Entirely volunteer run; the German Python Software Verband e.V. handles the financial administration
- Talks, tutorials and posters are selected from proposals submitted on Pretalx; no papers or proceedings
- Format of about six days with sprints, two talk days and two tutorial days; in 2026 the sprints were shared with EuroPython
- Includes a maintainers track for open-source scientific Python package maintainers
- 'Recent venues: Basel 2022 and 2023, Szczecin 2024, Krakow (AGH University) 2025 and 2026'
- Separate from the US SciPy conference
- Not listed in CORE ICORE2026
