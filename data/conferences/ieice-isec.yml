organizer: IEICE Engineering Sciences Society (ESS), Technical Committee on Information Security
proceedings: IEICE Technical Report (non-refereed)
archival: false
rank:
  core: Unranked
fee: Presentation fee 3,300 JPY per talk for IEICE members; audience fee 3,300 JPY for members (advance, 2026);
  student members attend free via annual registration (up to 3 committees)
typical:
  deadline_months: [1, 3, 5, 9]
  conference_months: [3, 5, 7, 11]
links:
  website: https://www.ieice.org/~isec/
notes:
- Main Japanese committee for cryptography and information security; organizes SCIS (Symposium on Cryptography and
  Information Security) every January (SCIS2026 in Hakodate)
- 'Regular meetings: May in Tokyo, July Security Summer Summit in Sapporo, November joint with LOIS, March joint
  with IT, RCC and WBS'
- WCIS (September, online, free) gathers invited talks on papers accepted at CRYPTO, EUROCRYPT, ASIACRYPT, CCS,
  S&P, USENIX Security and NDSS
- Talks are published as non-refereed IEICE Technical Reports; presenters pay a per-talk fee
