notes:
- Workshop co-located with IEEE WCNC; first edition as WS-19 at WCNC 2026 in Kuala Lumpur (3/4 day)
- 2026 organizers from NTU Singapore (incl. Dusit Niyato), SUSTech, Arizona State, Jilin University and Heriot-Watt
- Topics include UAV and low-altitude network architecture, air-to-ground channels, spectrum sharing, ISAC, URLLC for command and control, UTM and Remote ID, and aerial link security
- Accepted and presented papers go into the WCNC proceedings in IEEE Xplore; no-show papers are removed
- Different from the GLOBECOM ISAC-LAI workshop (ISAC for Low-Altitude Intelligence)
- Not listed in ICORE2026
