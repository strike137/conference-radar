links:
  website: https://acit2k.org/
notes:
- Official scientific conference of the Colleges of Computing and Information Society (CCIS) of the Association of
  Arab Universities
- Broad IT scope (AI, data science, cybersecurity, NLP, networks and IoT, parallel and distributed systems, software
  engineering)
- Proceedings in IEEE Xplore (2023, 2024 and 2025 volumes listed there); for 2026 the official site says the IEEE
  application is pending; papers use the IEEE conference format
- Selected papers can be extended for a special issue of the International Arab Journal of Information Technology
  (IAJIT)
- Rotates among Arab countries (Sultan Qaboos University, Oman 2021; Zarqa, Jordan 2024; Alexandria, Egypt 2025; Sousse, Tunisia 2026);
  2025 was hybrid with IEEE Egypt Section technical co-sponsorship
- Running since 2000; 2026 is the 27th edition
- Not listed in the CORE portal (ICORE2026)
