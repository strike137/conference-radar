notes:
- Workshop of ICTH (International Conference on Current and Future Trends of ICT in Healthcare), held together with
  EUSPN
- Accepted papers appear in the ICTH proceedings in Elsevier Procedia Computer Science (open access)
- Double-blind review; full papers up to 6 pages and short papers up to 4 pages, including references
- Host conference rotates between Leuven (Belgium), Almaty (Kazakhstan) and Istanbul (Türkiye) in recent years
- Virtual participation allowed in 2026
- Not listed in ICORE2026 (portal search returns no results) or the CCF list
