notes:
- Russian-led international conference on crypto agility; steering committee of TC 26 standardization committee members, chaired by Stanislav Smyshlyaev (CRYPTO-PRO); program contact agilecrypto@tc26.ru, logistics by Avangard Media Group
- 2026 is the second edition (first held in 2025)
- Topics include interchangeable primitives in protocols, block ciphers, hash functions, KEMs and signatures (including post-quantum), cryptanalysis and mathematical aspects of cryptography
- Talk proposals are submitted as abstracts and reviewed by the program committee; 30-minute talks, conference language English
- Accepted abstracts and the presentation slides are published on the conference website only
- Held outside Russia with a local partner; Nha Trang, Vietnam 2025 (Academy of Cryptography Techniques) and Jaipur, India 2026 (LNMIIT)
- Not listed in the CORE ICORE2026 portal
