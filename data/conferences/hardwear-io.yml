notes:
- Practitioner hardware security conference and training (chip, embedded, side channel and fault injection
  topics); the main edition is in the Netherlands every November
- Also runs a separate USA edition (Santa Clara Marriott, May 26 to 30, 2026); the editions below are the
  Netherlands ones
- Three days of trainings followed by two conference days at the Amsterdam Marriott Hotel (2025 and 2026)
- "Talk categories: new research, current research and workshop, and tool; new research speakers get travel
  reimbursement up to 1000 EUR (international) or 300 EUR (domestic) plus 3 hotel nights"
- No proceedings; the organizers may publish slides, papers and recordings online
