notes:
- Organized by IARIA as part of the NexComm congress, co-located with ICN, ICONS, ICDT, SPACOMM, CTRQ and other IARIA events (13th edition in 2027)
- Published open access in the IARIA ThinkMind library (ISSN 2519-8386); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in southern Europe (Porto 2021, Barcelona 2022, Venice 2023, Barcelona 2024, Nice 2025, Venice 2026, Lisbon 2027)
- Covers big data, linked data, open data and data management and analytics
