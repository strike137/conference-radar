id: silcon
name: IEEE SILCON
full_name: IEEE Silchar Subsection Conference
type: conference
tier: minor
areas: [general, communications]
region: south-asia
language: english
frequency: annual
organizer: IEEE Silchar Subsection (technical co-sponsorship by IEEE Kolkata Section); hosted by NIT Nagaland (2025) and NIT Manipur (2026)
organizer_country: [india]
proceedings: IEEE Xplore
archival: true
indexing: [IEEE Xplore]
fee: Author INR 4,720 (IEEE student) to INR 14,160 (non-IEEE industry); foreign authors 177 to 413 USD (2026, GST included)
typical:
  deadline_months: [7, 8]
  conference_months: [11, 12]
links:
  website: http://ieeesilcon.org.in
notes:
- Flagship annual conference of the IEEE Silchar Subsection, held every November or December since 2022 in hybrid mode
- 2025 at NIT Nagaland (6 to 8 November); 2026 at NIT Manipur (18 to 20 December)
- Broad scope covering communications and networks, signal processing, RF and microwave, microelectronics, AI and data science, software engineering, power and control
- Short (4 pages) and regular (up to 6 pages) papers, reviewed via Microsoft CMT
- Accepted and presented papers are submitted to IEEE Xplore
- 50% fee discount for the second and further papers of the same author
- Not listed in ICORE2026 or the CCF 2026 list
