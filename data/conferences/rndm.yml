notes:
- Standalone single-track workshop on network resilience, survivability and dependability
- Founded and co-organized by Gdansk University of Technology (Poland); hosted by a different European university
  each time (NTNU Trondheim in 2025, Lancaster University in 2026)
- Technically co-sponsored by IFIP TC6
- Papers up to 7 pages in IEEE two-column format, submitted through EDAS
- 2023, 2024 and 2025 proceedings published in IEEE Xplore
- Timing varies a lot between editions (June 2025, November 2024 and 2026, September 2023)
- No edition in 2020 and 2021
