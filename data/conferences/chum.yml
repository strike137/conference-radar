notes:
- Workshop on computational processing of humor (detection, generation, evaluation, resources, translation and formal models of humor)
- First edition with COLING 2025 and second with ACL 2026; both held virtually
- Long and short papers in ACL format submitted through START; all accepted papers appear in the proceedings and are presented as talks
- Proceedings in the ACL Anthology (9 papers in 2026, 12 in 2025)
- Not ranked in ICORE2026 and not on the CCF list
