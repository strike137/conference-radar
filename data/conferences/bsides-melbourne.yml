notes:
- Not-for-profit, 100% volunteer-run Security BSides conference in Melbourne, Australia, first held in 2019
- Two-day conference plus one day of community training; about 600 participants (2026)
- Held at the SEEK HQ event space in Cremorne, Melbourne
- Past editions in September (2022, 2023) and November (2024); 2020 cancelled due to COVID; no 2025 edition in the archives; 2026 edition held in May
- Call for papers on Sessionize with two 30 min tracks (Standard Talk and Career Track); mentoring for new speakers, no vendor pitches
- Tickets regularly sell out, with a waitlist; DEI fund supports underrepresented attendees
- No proceedings; slides from 2026 talks are shared on Google Drive
