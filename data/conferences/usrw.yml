notes:
- Full-day workshop on the convergence of information retrieval and recommender systems (unified architectures, generative retrieval, semantic IDs, shared evaluation)
- First edition in 2026 with RecSys 2026 in Minneapolis; organizers are collecting feedback for a 2027 edition
- Non-archival; accepted papers are hosted on the workshop website
- Papers of 4 to 9 pages in ACM sigconf format, double-blind review by at least two reviewers, via EasyChair
- At least one author must attend in person; best paper award
- Not listed in the CORE ICORE2026 portal and not on the CCF list
