notes:
- IEEE ICDM workshop series on opinion mining and sentiment analysis, held every year since 2011; 2026 is the 16th edition
- Run by Erik Cambria and Rui Mao (NTU Singapore) with co-organizers from Shanghai University, A*STAR IHPC and Singapore Management University (2026)
- Held with the IEEE International Conference on Data Mining (ICDM), so the location rotates with ICDM
- Accepted papers published in the ICDMW proceedings (IEEE Computer Society Press, IEEE Xplore), indexed by Scopus and Web of Science
- Up to 10 pages including references; camera-ready is 8 pages plus 2 extra chargeable pages; each paper reviewed by 3 PC members
- Selected papers invited to extended versions in Cognitive Computation or IEEE ACSA
- Not ranked by CORE (not in ICORE2026) or CCF
