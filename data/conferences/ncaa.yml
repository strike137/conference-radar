notes:
- Annual neural computing and applications conference hosted by AACI (Hong Kong); first edition 2020
- Proceedings in Springer CCIS; full papers 12 to 15 pages in CCIS format, double-blind review on CMT
- Two submission rounds (early round in March, second round in April)
- Hybrid events; Jinan 2022, Hefei 2023, Guilin 2024, Hong Kong 2025, Osaka 2026
- Authors of selected papers are invited to submit extended versions to journals
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
