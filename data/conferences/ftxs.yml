notes:
- Formerly the Workshop on Fault Tolerance for HPC at eXtreme Scale; renamed in 2026 with a new focus on faults in AI systems at scale
- Usually held with SC (Atlanta 2024, Chicago 2026); the 2025 edition planned with ICPP 2025 in San Diego was cancelled
- Regular papers of 6 to 11 pages including references are published; extended abstracts (up to 4 pages) are presented but not published
- IEEE template, submission through the SC submissions site, in-person presentation required
- Five papers accepted in 2026
- Listed by SC26 among the workshops with papers in the SC Workshop Proceedings
- Not listed in CORE ICORE2026
