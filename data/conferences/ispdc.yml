notes:
- Symposium on parallel and distributed algorithms, HPC, cloud and edge computing, federated learning and ML for distributed systems
- Held every year since 2002, mostly in Europe (Bucharest 2023, Chur 2024, Rennes 2025, Hamburg 2026)
- 2026 was the 25th edition, hosted by DESY in Hamburg and technically co-sponsored by the IEEE Computer Society
- 2026 papers published in the conference proceedings and submitted to IEEE Xplore
- "2026 formats: full papers up to 10 pages, short papers up to 6 pages, poster papers 2 pages (all including references), talks as 1 page abstracts that are not published"
- Small venue; 15 papers were accepted in 2026
- One author must register at the full rate and present the work
- "CORE C (ICORE2026); not in the CCF 2026 list"
