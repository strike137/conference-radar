notes:
- Workshop on involving the crowd in requirements engineering, user feedback analysis and automated requirements elicitation and validation
- Held with the IEEE RE conference since 2015 and follows it around the world (Hannover 2023, Reykjavik 2024, Valencia 2025, Montreal 2026)
- 2026 was the 10th edition; the 2018 edition was run jointly with AIRE
- Accepted papers appear in the joint RE workshop proceedings, published in the IEEE Digital Library
- Technical solution papers and experience reports of 4 to 6 pages plus 1 page of references, problem and vision statements of 2 to 3 pages, IEEE format
- 2026 also took one-page proposals for ten-minute talks in a 10-year celebratory session
- 2026 organizers were Oliver Karras, Nitish Patkar, Maria Spichkova and Eduard C. Groen
- Not listed in ICORE2026 or the CCF 2026 list
