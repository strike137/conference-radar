id: icatc
name: ICATC
full_name: International Conference on Advances in Technology and Computing
type: conference
tier: minor
areas: [general, ai, security, networking, systems, software, data]
region: south-asia
language: english
frequency: annual
organizer: Faculty of Computing and Technology, University of Kelaniya
organizer_country: [other]
proceedings: IEEE Xplore
acceptance_rate: 30% (2024, 203 full paper submissions)
fee: 100 USD IEEE member, 125 USD non-member (international author); 20,000 to 25,000 LKR local author, 12,000 to 15,000 LKR local student author (2026)
typical:
  deadline_months: [9]
  conference_months: [12]
links:
  website: https://icatc.kln.ac.lk/
notes:
- Run by the Faculty of Computing and Technology, University of Kelaniya, Sri Lanka; held at the faculty in
  December (9th edition in 2024)
- Technical co-sponsorship from the IEEE Sri Lanka Section; the 2024 and 2025 proceedings are in IEEE Xplore
- Two tracks, Computing Technology (data science, security, AI, networking, software) and Engineering, Science and
  Technology (automation, embedded systems and IoT, robotics, materials, energy)
- Double-blind review by at least two reviewers, 4 to 6 pages in IEEE format, submitted via Microsoft CMT
- Not the same as SCSE, which is run by the Faculty of Science of the same university
- Not listed in ICORE2026 or the CCF list
