id: ieee-naecon
name: IEEE NAECON
full_name: IEEE National Aerospace and Electronics Conference
type: conference
tier: minor
areas: [general, communications, ai]
region: north-america
language: english
frequency: annual
organizer: IEEE Dayton Section and University of Dayton (supported by AFIT, Wright State, Ohio State, University of Cincinnati, IEEE-USA, IEEE CAS, AESS, MTT-S, APS)
organizer_country: [usa]
proceedings: IEEE Xplore
archival: true
indexing: [IEEE Xplore]
fee: 'About 550 USD IEEE member / 650 USD non-member, early full registration (2025)'
typical:
  deadline_months: [5, 6]
  conference_months: [7, 8]
links:
  website: https://attend.ieee.org/naecon-2026/
notes:
- Oldest IEEE conference on aerospace electronics systems (since 1948), run from Dayton, Ohio with strong Air Force Research Laboratory and AFIT involvement
- 'Tracks: microelectronics, autonomous systems, integrated photonics, RF and microwave systems, cyber systems and security, biomedical applications, sensors, quantum, AI and machine learning'
- Two-stage process; abstract plus 2 to 6 page paper for review, then an optional 4 to 6 page paper for the IEEE Xplore proceedings (presentation-only papers are not published)
- Authors must obtain company and government clearances before submitting
- 'Held near Dayton, Ohio (Fairborn 2024 and 2025); 2026 in Cincinnati, co-located with IEEE MWSCAS'
- Student paper and poster competitions; top 10 student papers get free registration
- Not listed in the CORE portal (ICORE2026)
