notes:
- Large IEEE big data conference (over 1,200 participants in 2025) with many workshops and special sessions, including
  one on privacy and security of big data
- Single-blind review; 10 pages including references, no appendix
- Main-conference papers must be presented in person by an author registered at the full (non-student) rate; workshops
  and special sessions allow remote talks
- Mostly in the US, with editions in Osaka (2022), Sorrento (2023) and Macau (2025)
