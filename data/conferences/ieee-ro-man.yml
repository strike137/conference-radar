notes:
- IEEE conference on human-robot interaction and interactive robotics; submissions through the IEEE RAS PaperCept system
- Proceedings in IEEE Xplore; RA-L papers can be presented through a joint RA-L option
- Regular papers 6 pages (up to 2 extra pages at 100 USD each); single-blind review by at least two reviewers
- Separate special session paper track and late breaking reports (June deadline)
- Rotates worldwide; 2026 edition in Kitakyushu, Japan (hybrid, at least one author must attend in person)
- CORE B (ICORE2026); not in the CCF list
