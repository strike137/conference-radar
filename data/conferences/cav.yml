notes:
- Premier conference on computer-aided formal verification (model checking, theorem proving, SMT, synthesis, testing); CORE A*, CCF A
- Held every July since 1990, usually alternating between North America and Europe (Paris 2023, Montreal 2024, Zagreb 2025, Lisbon 2026, Amsterdam 2027)
- CAV 2026 was part of FLoC 2026 in Lisbon
- Proceedings in Springer LNCS; selected papers invited to special issues of Formal Methods in System Design and the Journal of the ACM
- Regular and tool papers up to 18 pages, application and case study papers up to 10 pages (LNCS format); regular papers are anonymized
- Two-stage review with early rejection after two reviews and an author response period for papers that continue
- Artifact evaluation, mandatory registration of artifacts for tool papers; at most 5 submissions per author
- Not part of ETAPS (see cav-tacas-etaps for ETAPS and TACAS)
