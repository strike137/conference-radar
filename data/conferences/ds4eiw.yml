notes:
- Workshop on data science for societal challenges (bias, fairness, transparency, inclusion, well-being), held with IEEE ICDE in 2026
- Editions 1 to 4 (2021 to 2024) were co-located with IEEE BigData; no 2025 edition; the 2026 edition moved to IEEE ICDE
- 5th edition in 2026
- Regular research papers up to 8 pages and short research, application and vision papers up to 4 pages, excluding references; no appendix; at least three reviewers per paper; Microsoft CMT
- All accepted papers appear in the IEEE ICDE 2026 proceedings; in-person presentation and one author registration required
- Organized by researchers from CNRS (France), Politecnico di Torino and Kore University of Enna (Italy)
- Not listed in CORE ICORE2026 or in the CCF 2026 list
