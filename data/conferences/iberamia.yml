notes:
- Flagship conference of the Ibero-American AI community, run by the IBERAMIA society with support from national AI
  societies (SBC, AEPIA, APPIA, SMIA, SADIO and others); held every two years since 1988
- Proceedings in Springer LNCS/LNAI as "Advances in Artificial Intelligence" (2024 -> LNCS vol. 15277, 2022 -> LNCS
  vol. 13788)
- Papers in English, LNCS format, up to 12 pages including references; double-blind review; submission through
  Springer METEOR
- Selected top papers get a fast track to journals such as AI Communications, Progress in Artificial Intelligence
  and Inteligencia Artificial
- Held in Latin America in recent editions (Santiago de Chile 2014, San Jose 2016, Trujillo 2018, Cartagena de Indias
  2022, Montevideo 2024, Asuncion 2026); no 2020 edition
- Co-located with the SIMDIA doctoral and masters consortium, workshops and tutorials
- Not ranked in CORE ICORE2026
