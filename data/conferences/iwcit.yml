notes:
- Standalone annual workshop organized by Sharif University of Technology in Tehran, Iran; 14th edition in 2026
- Covers information theory, communication theory, coding theory, information theoretic security and ML for communications
- Always held at Sharif University of Technology, Tehran; in-person with online presentation possible for authors abroad
- Peer reviewed, papers up to 6 pages in IEEE format, submission via EDAS
- The 2025 site says accepted papers are submitted for inclusion in IEEE Xplore
- Best Paper award with a prize of 500,000,000 Rials
- Not ranked in CORE ICORE2026
