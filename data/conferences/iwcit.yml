notes:
- Annual workshop on communication, information and coding theory, run by Sharif University of Technology, Tehran
- Held at Sharif University of Technology, Tehran, Iran (2024 to 2026, Kahroba Hall of the EE department in 2026); 14th edition in 2026
- Topics also include information theoretic security, ML for communications, cryptography and privacy
- Peer reviewed papers of up to 6 pages in IEEE format, submitted through EDAS
- 2024 and 2025 calls said accepted papers are submitted to IEEE Xplore; the 2026 pages only mention the workshop proceedings
- In person, with online presentation possible for authors abroad
- Not listed in ICORE2026
