notes:
- Organized by KIISE; the December counterpart of KCC
- Held in December at a regional convention center (Yeosu Expo Convention Center 2025, Gyeongju Hwabaek Convention
  Center 2026)
- General papers plus an undergraduate/junior paper competition
- Papers in the 'AI application' track are poster-only and not eligible for best paper awards (2025, 2026)
- Deadline extended three times in 2025 (Oct 13 -> Oct 30); includes a Top Conference session and young researcher
  sessions
