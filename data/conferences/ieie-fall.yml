notes:
- Organized by IEIE; the autumn domestic conference, complementing the IEIE Summer Annual Conference in June
- Papers 1 to 5 pages in double-column format; best paper award (3,000,000 KRW top prize in 2025), undergraduate
  paper contest and My Chip design contest
- 'Covers IEIE''s six societies: communications, semiconductor, computer, AI signal processing, systems and control,
  industrial electronics (includes security-related research groups)'
- Held in late November at resort venues (High1 Resort 2024, Gonjiam Resort 2025 and 2026)
- IEIE also runs the international ICEIC (January) and co-organizes ITC-CSCC (June or July)
