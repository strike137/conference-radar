notes:
- Flagship annual conference of the IEEE Bangalore Section, held in Bengaluru (Bangalore)
- 'Broad scope: the 2027 edition has 18 tracks in 7 focus areas (VLSI and embedded, signals, communication systems,
  computing and software, control and robotics, energy and mobility, education and technology management)'
- Held in July for 2024 to 2026; the 13th edition moves to March 2027 with a mid-December 2026 paper deadline
- 4 to 6 page IEEE-format papers including references, submitted via CMT (2025 rules); literature-review-only papers
  are not accepted; proceedings in IEEE Xplore
- The 2026 theme was trusted, secure and resilient systems
