notes:
- Annual conference of JSSST, held every September at a university, with a tutorial and PPL summer school on the
  day before
- Talk track (general and software papers) and a demo/poster track; non-members can give a talk if a co-author is
  a JSSST member
- Own previously published work may be presented; papers can be submitted at the same time to the JSSST journal
  Computer Software
- 'Awards: Takahashi Encouragement Award, Student Encouragement Award, Best Presentation and Best Demo/Poster awards'
- Registration was free for student members in 2026
