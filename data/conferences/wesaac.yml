notes:
- Brazilian workshop and school on multi-agent systems (agent architectures, BDI, agent-based simulation, LLM-based
  agents); 20th edition in 2026, annual since 2007
- Co-located with BRACIS in recent years (Fortaleza 2025, Cuiabá 2026); combines a paper workshop with tutorials
  for students
- Proceedings (Anais) published in the WESAAC series of the SBC OpenLib (SOL)
- Papers in Portuguese or English; full papers up to 12 pages, short and demo papers 6 to 8 pages; double-blind
  review by at least two reviewers
- Best undergraduate papers invited to the Revista Eletrônica de Iniciação Científica (REIC)
- "Acceptance rate: 64.6% for full papers (2026, 31/48)"
- Not ranked in CORE ICORE2026
