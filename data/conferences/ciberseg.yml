notes:
- Security and cyber defense days held every January at the Escuela Politecnica Superior, Universidad de Alcala (Alcala de Henares, Spain)
- Organized by the Networks and Intelligent Systems research group, the ATALANTA, ISDEFE and INCIBE chairs, the Master in Cybersecurity and the student delegations
- One day of invited talks followed by one day of hands-on workshops (limited places, UAH students first), plus a CTF
- Free attendance; no call for papers and no proceedings
- Talks in Spanish; 2027 is the 14th edition
