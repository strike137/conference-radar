region: taiwan
language: english
frequency: annual
organizer: ITRI (Industrial Technology Research Institute), technically co-sponsored by IEEE
organizer_country: [taiwan]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [12]
  conference_months: [4]
links:
  website: https://expo.itri.org.tw/2027VLSITSA/
notes:
- Hosted by ITRI at the Ambassador Hotel in Hsinchu, Taiwan, every April; technically co-sponsored by IEEE (listed
  by IEEE CASS)
- Covers VLSI technology, circuits, systems and applications; VLSI-DAT (design, automation and test) was merged
  into it from 2023, so there are separate TSA and DAT submission tracks
- Accepted papers presented in person are published in IEEE Xplore; selected presentations are invited to extend
  into journal papers
- Five-day event in 2026 (13 to 17 April); paper deadline in early December
- The ITRI site path changes every year (2025VLSITSA, 2026VLSITSA, 2027VLSITSA); the IEEE CAS event page is a stable
  backup
- Not listed in ICORE2026
