notes:
- Workshop on AI and ML for efficient and manageable cloud services (scheduling, anomaly detection, incident management, LLMs for cloud ops); 7th edition in 2026
- Host conference changes; ASPLOS 2026 (Pittsburgh), ICSE 2025 (Ottawa), ASPLOS 2024 (San Diego), ICSE 2023 (Melbourne), MLSys 2022 (Santa Clara)
- Non-archival; accepted papers are listed and posted as PDFs on the workshop website (2026 template uses the nonacm option)
- Double-blind review; technical papers up to 6 pages, 1-page abstracts, 2-page project and dataset showcases
- Run largely by Microsoft researchers; strong industry participation
- Not listed in CORE ICORE2026
