notes:
- Main venue for persuasive technology and behavior change support systems (HCI, health, sustainability, gamification, AI for persuasion); held since 2006
- Run by the Society for Persuasion and Technology, whose steering committee appoints the chairs each year; logistics by EasyConferences
- Full (12 pages) and short (8 pages) papers in Springer LNCS; posters, demos, doctoral consortium, late breaking results and workshop papers in Springer CCIS
- Double-blind review; abstract due one week before the full paper
- Selected papers invited to a special issue of Behaviour and Information Technology (2027)
- Rotates worldwide (Doha 2022, Eindhoven 2023, Wollongong 2024, Limassol 2025, Hakodate 2026, Santiago de Compostela 2027)
- CORE rank B (ICORE2026); not on the CCF 2026 list
