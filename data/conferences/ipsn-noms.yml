notes:
- IEEE/IFIP workshop co-located with NOMS (NOMS 2023, 2024, 2025 and 2026); 5th edition in 2026
- Not the ACM/IEEE IPSN conference on information processing in sensor networks
- Topics are AI/ML for management of SDN/NFV networks, network slicing, service function chaining and intent-based management
- Papers up to 6 pages including references, short or work in progress papers 4 pages, IEEE two-column format
- Workshop papers go into the NOMS proceedings and IEEE Xplore (per the NOMS 2026 author instructions)
- Best papers may be invited to a journal special issue (to be confirmed in 2026)
- Half-day workshop with a keynote in 2026
- Not listed in CORE ICORE2026 or the CCF list
