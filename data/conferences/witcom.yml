notes:
- Annual Mexican congress on telematics and computing run by UPIITA of the Instituto Politécnico Nacional (IPN), with ANTACOM and Universidad Mayor (Chile) as collaborators; 15th edition in 2026
- Proceedings in Springer Communications in Computer and Information Science (CCIS), usually two volumes per year, indexed in Scopus
- Topics include telematics, IoT, cloud, cybersecurity, data science, AI, computer vision, NLP and GIScience
- Full papers of at least 12 pages with no maximum; submission through EasyChair
- Hybrid format; authors may present online or on site
- Held in Huatulco, Oaxaca, Mexico in 2025 and 2026
- Not listed in CORE ICORE2026
