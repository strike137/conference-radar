notes:
- Workshop of the IEEE International Conference on Cyber Security and Resilience (IEEE CSR); first edition in 2026
  in Lisbon, in person only
- Workshop papers go into the IEEE CSR proceedings in IEEE Xplore; 6 pages plus up to 2 extra pages with overlength
  charges
- Topics include situational awareness, threat hunting, cyber threat intelligence, incident response and recovery
  for large hyperconnected networks, cyber-physical systems and industrial IoT
- In 2026 the workshop program was merged with the CSR DAISY workshop
- Deadline was extended by one month in 2026 (Apr 13 -> May 13)
- Not listed in CORE ICORE2026 or the CCF list
