notes:
- 1st edition was a half-day workshop at IEEE INFOCOM 2025 in London; 2025 papers went into the INFOCOM 2025 proceedings in IEEE Xplore
- 2nd edition is a full-day workshop co-located with ACM MobiCom 2026 in Austin, Texas, with two keynotes, a panel, papers and a demo session
- Topics are digital twins for beyond-5G and 6G wireless networks, AI for digital twins, and digital twin testbeds
- Double-blind; technical papers up to 6 pages including references (2 extra pages for a fee), demo papers 2 pages
- Camera-ready papers go through ACM rights management and use the ACM template (ACM proceedings)
- No remote participation; a full or workshop-only MobiCom registration is required
- 2026 program has six papers and four demos
