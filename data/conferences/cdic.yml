notes:
- Long-running Thai cybersecurity conference and exhibition; 2026 is the 25th edition
- Organized by ACIS Professional Center, a Bangkok security training and consulting company
- Held in November at BITEC Bangna, Bangkok (2025 and 2026 editions); organizers report 2,500+ attendees
- Executive and practitioner audience (CISOs, regulators, vendors); sponsor packages include speaking slots
- No call for papers and no proceedings; workshops are sold separately from the conference pass
