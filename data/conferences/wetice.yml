notes:
- Long-running venue on enabling technologies for collaboration, originally a workshop series; 34th edition in 2026
- Topics include collaborative business processes, blockchain and DAOs, IoT platforms, distributed trust, cloud and
  data analytics
- Main track plus several invited tracks (security and privacy, formal methods and others)
- Proceedings submitted to IEEE Xplore; papers up to 6 pages in IEEE format, submitted via Microsoft CMT
- Usually held in France or Italy (Paris 2026, Catania 2025, Reggio Emilia 2024, Paris 2023); 2027 edition in Marrakech,
  Morocco
- Dates vary a lot from year to year (July 2025, July 2026, April 2027)
- CORE C (ICORE2026)
