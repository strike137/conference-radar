notes:
- Run by the IEEE Computer Society Malaysia Chapter since 2021; always held in Malaysia (2021 virtual, 2022 Kota
  Kinabalu, 2023 Langkawi, 2024 Kuala Lumpur, 2025 Kuching, 2026 Langkawi), hybrid with online presentation
- Merges six earlier chapter conferences into tracks (IC3e, GAME, ICOS, ICBDA, AINS, ICWiSe), including a Networking
  and Information Security track
- All proceedings in IEEE Xplore and indexed in Scopus; 6-page double-blind IEEE papers via EDAS
- Submission deadline is usually extended (2025 Jun 30 -> Jul 31 -> Aug 15); not in the ICORE2026 or CCF lists
- Discounted online rate for Malaysian institutions submitting 10 or more papers
