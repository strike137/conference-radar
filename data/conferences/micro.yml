notes:
- One of the flagship computer architecture venues; technical sponsors ACM SIGMICRO and IEEE TCuARCH
- Regarded as a top venue (ICORE2026 A*, CCF A)
- Held in October or November, rotating worldwide (Toronto 2023, Austin 2024, Seoul 2025, Athens 2026)
- Double-blind review with a rebuttal/revision period; abstract registration one week before the full paper
- Industry track added in 2026; artifact evaluation and an ACM Student Research Competition
- Lead publisher alternates between IEEE and ACM (IEEE for MICRO 2024, ACM for MICRO 2025, whose proceedings are in the ACM Digital Library)
