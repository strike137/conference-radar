links:
  website: https://stacom.github.io/
notes:
- One-day MICCAI satellite workshop on cardiac image analysis, statistical atlases and computational heart modelling,
  run every year since 2010
- Papers and challenge papers are published in a Springer LNCS volume after the workshop (LNCS 15448 for 2024)
- Hosts cardiac imaging challenges each year (CMRxRecon series, EchoRisk in 2026)
- Organisers are mostly from European groups (King's College London, Inria, Universitat Pompeu Fabra, TU Delft, DTU)
- Location follows MICCAI (Singapore 2022, Vancouver 2023, Marrakesh 2024, Daejeon 2025, Strasbourg 2026)
