notes:
- Workshop on gender bias and gender-inclusive language in machine translation and cross-lingual NLP, open to technical and non-technical work
- Held with EAMT 2023 Tampere, EAMT 2024 Sheffield, MT Summit 2025 Geneva and EAMT 2026 Tilburg
- Research papers (4 to 10 pages) and 2-page extended abstracts appear in the proceedings, published by EAMT in the ACL Anthology
- Non-archival research communications and potluck presentations are also accepted
- Submission through EasyChair; archival submissions anonymized
- Not ranked in ICORE2026 and not on the CCF list
