notes:
- Workshop of the IEEE/IFIP International Conference on Dependable Systems and Networks (DSN); held with DSN in Porto 2023, Brisbane 2024 and Naples 2025
- Verification and validation of safety-critical cyber-physical systems, with a focus on safety and security (fault and attack injection, runtime and formal verification, simulation, testing)
- Full papers up to 8 pages and short papers up to 4 pages including references, IEEE two-column format, submission via EasyChair
- Accepted papers published in the DSN supplemental volume (DSN-W) in IEEE Xplore
- Supported by EU projects (VALU3S for the first edition, AGRARSENSE since 2024)
- Not on the list of DSN 2026 workshops; no 2026 edition found
- Not listed in the CORE ICORE2026 portal
