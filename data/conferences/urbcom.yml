notes:
- Workshop co-located with IEEE DCOSS-IoT; the 2026 edition in Reykjavik was the 8th, and the 9th is listed for DCOSS-IoT 2027 in Montreal
- Run mainly by Brazilian researchers (Leandro Villas, Thiago H. Silva, Daniel Guidoni, Wellington Lobato)
- Topics are urban sensing, human mobility, intelligent transportation, smart cities and urban data analysis
- Papers up to 8 pages IEEE two-column; submitted via EasyChair
- Accepted papers appear in the same volume as the DCOSS-IoT proceedings (IEEE Xplore)
- Best papers invited to submit an extended version to the Journal of Internet Services and Applications
- Past editions Santorini 2019, online 2020 to 2022, Coral Bay 2023, Abu Dhabi 2024, Lucca 2025, Reykjavik 2026
