id: icnc
name: ICNC
full_name: International Conference on Computing, Networking and Communications
type: conference
tier: minor
areas: [networking, communications, ai, security]
region: north-america
language: english
frequency: annual
organizer: Technology Innovation Association (TIA)
proceedings: IEEE Xplore
fee: 750 USD IEEE member, 800 USD non-member (2026, full author registration covering up to two papers); 150 USD
  late fee after the author registration deadline
typical:
  deadline_months: [9, 10]
  conference_months: [2]
links:
  website: http://www.conf-icnc.org/
notes:
- Sponsored by the Technology Innovation Association (TIA); held every February in Hawaii (Honolulu, Maui or Big
  Island), with occasional California editions before 2018
- Papers go into the conference proceedings and are submitted to IEEE Xplore; only papers presented onsite are included
- Organized as technical symposia (AI, machine learning for networking, security, edge/cloud, wireless, optical,
  signal processing and more) plus workshops, keynotes and many invited talks
- 5 pages via EDAS in IEEE double column format; up to 2 extra pages at 100 USD per page
- One full registration covers up to two accepted papers by a common author; in-person presentation is required
- Not listed in ICORE2026 (the ICORE 'ICNC' entry is the Chinese International Conference on Natural Computation, a
  different venue) and not in the CCF list
- No editions were held in 2021 and 2022
