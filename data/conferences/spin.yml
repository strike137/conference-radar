notes:
- Started in 1995 as a workshop on the SPIN model checker; now a broad symposium on automated software analysis
- Topics include model checking, deductive verification, SAT/SMT, symbolic execution, static analysis and testing
- Proceedings in Springer LNCS; full research and tool papers 16 pages, short papers 6 pages
- Tool papers need an artifact that earns at least the Functional badge; artifacts optional for other papers
- Co-located with ETAPS since 2023 (Paris 2023, Luxembourg 2024, Hamilton 2025, Torino 2026)
- Small two-day event, historically 50 to 70 participants
- Not found on the CORE ICORE2026 portal; CCF C
