notes:
- One-day workshop on mutation analysis and mutation testing (including mutation for ML models and LLMs), co-located with IEEE ICST
- 20th edition in 2025 (Naples, with ICST 2025); 2026 edition held with ICST 2026 in Daejeon, South Korea
- Full papers up to 10 pages, short papers, full and short industry papers, and 1-page Hot Off the Press abstracts of recently published work
- Each paper reviewed by three reviewers; double-anonymous review except for industry and Hot Off the Press submissions
- Accepted papers (except Hot Off the Press) published in the ICST workshop proceedings
- 2026 organizers based in Switzerland, the United Kingdom and South Korea
- Not among the ICST 2027 workshops yet (workshop proposals due 2026-11-04); not listed in ICORE2026 or the CCF 2026 list
