notes:
- Informal workshop on formal verification of Rust programs, for language designers, developers and verification tool builders
- No published proceedings; talk proposals of at most 2 pages, slides and working documents posted on the website
- Invited talks, contributed talks (30 minutes by default), tool demos and discussion sessions
- Co-located with ETAPS every year since 2022 (first edition virtual in 2021); two days since 2024
- Follows ETAPS around (Munich 2022, Paris 2023, Luxembourg 2024, Hamilton, Canada 2025, Turin 2026, Copenhagen 2027)
- Listed as RUST 2027 on the ETAPS 2027 site
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
