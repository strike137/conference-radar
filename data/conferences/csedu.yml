notes:
- Organized by INSTICC; educational technology, AI in education, learning and teaching methods and assessment
- CORE B (ICORE2026)
- Proceedings in the SCITEPRESS Digital Library; a short list of revised and extended papers may go to a Springer CCIS book and best papers to a Springer Nature Computer Science special issue
- Two submission stages (1st stage gives an earlier notification), plus position papers, special sessions and an abstracts track
- Held in European cities (Prague 2023, Angers 2024, Porto 2025, Benidorm 2026, Rome 2027) and co-located with other INSTICC conferences (CLOSER, VEHITS, SMARTGREENS, IMPROVE and IoTBDS in 2027)
- Hybrid support, speakers may exceptionally present remotely
