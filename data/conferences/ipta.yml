id: ipta
name: IPTA
full_name: International Conference on Image Processing Theory, Tools and Applications
type: conference
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: IPTA steering committee (chair at University of Evry Paris-Saclay, France) with local hosts; 2026 hosted by Jadavpur University and IEEE Kolkata Section
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
fee: 550 USD early, 600 USD regular for IEEE member academics from abroad; students 400 USD early (2026)
typical:
  deadline_months: [6]
  conference_months: [10, 12]
links:
  website: https://ipta-conference.com/
notes:
- Image processing conference started in 2008; steering committee is mostly French universities
- Annual since 2022; hosts rotate (Paris 2023, Rabat 2024, Istanbul 2025, Kolkata 2026)
- "IEEE conference record #69052 (2026); papers go to IEEE Xplore, no-show papers are removed"
- Up to 6 pages in IEEE format, submitted via Microsoft CMT; special sessions accepted through a proposal call
- "2026 camera-ready rules: similarity below 15% and AI-generated text below 20%"
- Not listed in ICORE2026 or the CCF 2026 list
