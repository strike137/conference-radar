notes:
- Workshop on knowledge graphs, semantic annotation, NLP and LLMs for scientific articles, patents, standards and legal data
- Editions 2023 to 2025 were held at ESWC (Hersonissos 2023 and 2024, Portoroz 2025) as SemTech4STLD, with CEUR-WS proceedings
- 4th edition in 2026 moved to The Web Conference 2026 and was held online on June 29, 2026
- 2026 papers go into The Web Conference 2026 Companion Proceedings in the ACM Digital Library; ACM open access APC (250 to 350 USD) may apply
- Full papers 6 to 8 pages, short and reproducibility papers 4 pages, ACM double-column template, single-blind review by three reviewers
- Different venue from PatentSemTech (patent text mining workshop at SIGIR)
- Not listed in the CORE ICORE2026 portal
