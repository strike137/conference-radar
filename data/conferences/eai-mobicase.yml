notes:
- EAI conference on mobile computing, applications and services, with recent emphasis on AI and on security and privacy in mobile systems
- Proceedings in Springer LNICST; selected papers invited to extend for Mobile Networks and Applications (MONET)
- Regular papers 12 to 20 pages, short papers 6 to 11 pages in Springer format; submission via EasyChair
- 2026 edition used two submission cycles
- 17th edition in 2027; recent editions in Messina (2022), London (2023, online), Washington DC (2024, fully online) and Oklahoma City (2026, hybrid)
- The 2027 site lists the Oklahoma City edition under 2025, but the official 2026 site dates it 6 to 7 August 2026
- Not listed in ICORE2026
