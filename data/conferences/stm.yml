notes:
- Run by the ERCIM working group on Security and Trust Management; co-located with ESORICS, so held in Europe
- 22nd edition in 2026 (Rome, with ESORICS 2026); two-day workshop
- Springer LNCS proceedings in its own volume (Security and Trust Management series)
- Anonymous submission, up to 16 pages in LNCS format excluding bibliography and appendices, 20 pages total
- Submitted through the ESORICS EasyChair site; deadlines are 23:59 American Samoa time (UTC-11)
- At least one author per accepted paper must present at the workshop
- Not listed in ICORE2026
