notes:
- Conference on biomimetic and biohybrid systems; 2025 was the 14th edition
- Topics include biomimetic robots, neuromimetic computing, active biomimetic materials, brain-machine interfaces, intelligent prostheses and organism-level biohybrids
- Proceedings in Springer Lecture Notes in Artificial Intelligence (LNAI); at least one author per paper must register
- Full papers 10 to 12 pages and short papers 4 to 6 pages in Springer format; short papers are posters only
- Late-breaking abstracts are posters only and not in the proceedings
- Authors are expected to review 1 to 2 papers
- One workshop and tutorial day followed by a three-day single-track program
- Recent hosts are online 2021 and 2022, Genoa 2023, Chicago 2024 and Sheffield 2025
- No 2026 edition; the official site announces the next conference for 2027
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
