links:
  website: https://www.ieee-cicc.org/
notes:
- IEEE SSCS conference devoted to IC design (analog, data converters, digital, power management, RF, wireline,
  biomedical, systems and security)
- Regular papers are 4 pages and must include measured results; double-blind review
- Submission deadline is firm and is not extended
- Papers in IEEE Xplore; top-rated papers invited to special issues of IEEE JSSC and IEEE TBioCAS
- Held every April in the USA (San Antonio 2023, Denver 2024, Boston 2025, Seattle 2026, San Diego 2027)
- Co-located CHISIC chiplet workshop and Internet of Bodies workshop; exhibits hall with industry
- Authors must register and present in person
- Not listed in ICORE2026; circuits venue outside the usual CS rankings
