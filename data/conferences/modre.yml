notes:
- Workshop on applying model-driven development to requirements engineering; 2026 focus on LLMs and generative AI for model-based RE
- Held with the IEEE RE conference every year since 2011 and follows it around the world (Hannover 2023, Reykjavik 2024, Valencia 2025, Montreal 2026); 2026 was the 16th edition
- Proceedings of every edition since 2011 are in IEEE Xplore as part of the RE workshops proceedings
- Research papers 8 to 10 pages, short and position papers 4 to 5 pages, industry papers 4 to 10 pages, IEEEtran format
- Not double-blind (unlike RE itself); each paper gets at least three reviews
- Highly interactive format with brainstorming sessions and a group dinner
- 2026 organizers were Ana Moreira, Gunter Mussbacher, Joao Araujo, Pablo Sanchez and Boqi Chen
- Not listed in ICORE2026 or the CCF 2026 list
