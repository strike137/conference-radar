id: sealp
name: SEALP
full_name: Workshop in South East Asian Language Processing
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: irregular
organizer: Workshop organizing committee (Monash University Indonesia, MBZUAI, ITB, Amazon, Capital One); ACL SIGSEA
  workshop co-located with ACL-family conferences
organizer_country: [indonesia, usa, other]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [11]
  conference_months: [11, 1]
links:
  website: https://sealp-workshop.github.io/
notes:
- Workshop on NLP and speech for South East Asian languages (resources, benchmarks, low-resource and code-switching
  methods, LLM evaluation)
- Two editions so far (IJCNLP-AACL 2023 in Nusa Dua, Bali, and COLING 2025 held online); no later edition announced
- Proceedings in the ACL Anthology (9 papers in 2023 and 9 in 2025), listed under ACL SIGSEA
- Archival and non-archival submissions; short (4 pages) and long (8 pages) papers, double-blind via Softconf
- Not listed in ICORE2026 and not on the CCF list
