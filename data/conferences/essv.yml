notes:
- German-speaking speech technology conference held since 1990, usually in March; 2027 is the 38th edition
- Talks mainly in German; papers in German or English, and English talks are welcome
- Two-step submission; a 2-page extended abstract is reviewed, then accepted authors send a full paper of up to 8 pages
- Proceedings in the TUDpress series Studientexte zur Sprachkommunikation and free in the ESSV online archive
- Held mostly in Germany (Munich 2023, Regensburg 2024, Halle 2025, Eichstaett 2026); 2027 in Sonderborg, Denmark
- Best Student Paper Award; work in progress and Show and Tell demos are welcome
- Not listed in CORE ICORE2026 or in the CCF 2026 list
