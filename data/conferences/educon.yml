notes:
- One of the flagship conferences of the IEEE Education Society, held annually since 2010
- CORE C (ICORE2026)
- Accepted and presented papers go to IEEE Xplore and the Conference Proceedings Citation Index (Web of Science) and Scopus
- Two-stage submission through EDAS, a 250-word abstract first, then a preliminary paper; double-blind review
- Full papers, short papers, posters, panels, workshops and special sessions
- Rotates within IEEE Region 8, Europe, Middle East and Africa (Kuwait 2023, Kos 2024, London 2025, Cairo 2026, Timisoara 2027)
