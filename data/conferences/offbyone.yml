notes:
- Offensive security conference in Singapore run by STAR Labs SG, first held in 2024 (2024 M Hotel, 2025 Pan Pacific,
  2026 Grand Copthorne Waterfront)
- Single track, two days, about 500 attendees; no vendor pitches, talks chosen by a peer review board of practising
  researchers
- Topics are exploitation, hardware and firmware, vulnerability research, malware and reverse engineering, AI, cloud
  and post-quantum attack surfaces; CTF, villages and hardware badges
- CFP via pretalx, open about two months; talk videos and slides published free on YouTube and GitHub
- Held in June 2024, May 2025 and September 2026, so the month moves between editions
