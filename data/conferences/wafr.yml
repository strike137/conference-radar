notes:
- Biennial single track symposium on algorithmic and mathematical robotics (motion planning, manipulation,
  multi-robot systems, robot learning theory), held since 1994
- Formerly the International Workshop on the Algorithmic Foundations of Robotics; CORE lists it under that name
  as C, but it is well regarded in the robotics algorithms community
- Recent hosts are 2018 Merida, 2020 virtual, 2022 College Park, 2024 Chicago, 2026 Oulu
- Single blind review with no rebuttal; papers up to 16 pages plus references in SPAR format; camera ready after
  the symposium
- Selected papers invited to journal special issues
