id: siela
name: SIELA
full_name: International Symposium on Electrical Apparatus and Technologies
type: conference
tier: minor
areas: [communications]
region: europe
language: english
frequency: biennial
organizer: Union of Electronics, Electrical Engineering and Telecommunications (CEEC) and IEEE Bulgaria Section, with Technical University of Sofia
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
fee: 350 EUR regular, 300 EUR for students, CEEC/IEEE members and early registration (2026)
typical:
  deadline_months: [2, 3]
  conference_months: [6]
links:
  website: https://siela.tu-sofia.bg/
notes:
- Oldest electrical engineering symposium in Bulgaria, started in 1971; biennial (even years) since 1995
- Held in Bourgas on the Black Sea coast since 2009 (Plovdiv until 2007); 2026 was the 24th edition
- Classic EE topics (low and high voltage apparatus, power electronics, machines and drives, renewable energy,
  electrohydraulics) rather than computing or networking
- IEEE conference; accepted and presented papers go to IEEE Xplore after a similarity check
- Four page full papers in IEEE format, each reviewed by at least two reviewers; at most three papers per author
- About 120 to 140 participants from 15 to 20 countries; industry exhibition alongside the sessions
- Not listed in ICORE2026 or the CCF 2026 list
