notes:
- Half-day workshop on small and efficient LLMs (compression, distillation, RAG, fine-tuning) for knowledge and information extraction
- 1st edition co-located with ACM CIKM 2025 in Seoul, Korea, on the CIKM workshop day (14 November 2025)
- Organized by a mix of industry (Cognism, distil labs, Miniml.AI) and academia (Universite Paris-Saclay, University of Edinburgh)
- Proceedings published in CEUR-WS Vol-4200 (SmaLLEXT 2025)
- Long papers up to 8 pages, short and industry papers up to 4 pages (excluding references), ACM template, double-blind review
- At least one author per accepted paper must attend and present
- 2025 submission deadline was extended from 29 August to 1 September 2025
- Not listed among the CIKM 2026 accepted workshops
- Not listed in CORE ICORE2026 or the CCF 2026 list
