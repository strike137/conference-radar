notes:
- Workshop on soundness bugs and sources of unsoundness in type systems, proof assistants and verification tools
- Held with SPLASH 2022 (Auckland), SPLASH 2024 (Pasadena) and ECOOP 2026 (Brussels); 2026 was the third instance
- Two-page extended abstracts in ACM SIGPLAN acmart format; friendly peer review focused on fit for the workshop
- Non-archival, no formal proceedings; accepted abstracts are posted on the workshop webpage
- Welcomes theory people and people who like hacking things; students especially welcome
- Not listed in the CORE portal (ICORE2026)
