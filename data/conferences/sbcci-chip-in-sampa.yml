notes:
- Brazil's main symposium on integrated circuit and systems design, test and EDA; sponsored by SBMicro and SBC,
  technically supported by IEEE CASS, IEEE CEDA, IEEE EDS and IFIP; 39th edition in 2026
- Held each year in Brazil as part of the Chip in ... umbrella event together with SBMicro, WCAS, INSCIT and SForum
  (Chip in Sampa at the University of Sao Paulo in 2026)
- Accepted papers are submitted to IEEE Xplore; no-show papers are excluded from the proceedings
- Short papers of up to 4 pages plus 1 page of references, IEEE two-column format; double-blind review via
  Microsoft CMT; in-person presentation required
- Best papers invited to extended versions in IEEE OJCAS, IEEE Design and Test and JICS
- Not ranked in CORE ICORE2026
