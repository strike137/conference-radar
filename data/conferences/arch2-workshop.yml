notes:
- Workshop on using AI and agentic AI to design, optimize and evaluate computer architectures and systems
- Held with ASPLOS 2026 (Pittsburgh, March 2026, with a student question-writing competition for QuArch) and ISCA 2026 (Raleigh, June 2026, themed on agentic AI)
- Formats are 4-page work-in-progress papers, 2-page extended abstracts of completed work and 2-page position papers; single-blind review
- No formal proceedings; accepted papers are on OpenReview and authors may publish extended versions elsewhere
- The ASPLOS 2026 edition piloted an AI review assistant (ArchScholar) whose feedback was posted on OpenReview
- Not listed in CORE ICORE2026 and not on the CCF list
