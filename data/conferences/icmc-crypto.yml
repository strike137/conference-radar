notes:
- Practitioner conference on commercial cryptography and cryptographic module certification (FIPS 140-3, CMVP, ISO/IEC 19790, Common Criteria)
- Produced by the New York based events company Cnxtd Event Media Corp., presented with the support of the Cryptographic Module User Forum (CMUF)
- Speakers submit a title and short abstract via EasyChair; proposals are peer reviewed and must be vendor neutral
- No papers or proceedings; talk videos go to a password-protected video archive
- Includes special focus days (post-quantum preparedness, cryptographic infrastructure), exhibits and a NIST FIPS 140 certificate ceremony
- Held in the USA or Canada; 2026 in Arlington, VA and 2027 in Toronto
- Accepted speakers get a free 3-day registration (about 1100 USD value); travel is not covered
