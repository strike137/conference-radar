notes:
- One-day workshop co-located with IJCAI, bringing together knowledge representation and reasoning and machine learning work on space, time, motion and events
- Editions at IJCAI-ECAI 2022 (Vienna), IJCAI 2023 (Macao), IJCAI 2024 (Jeju), IJCAI 2025 (Montreal) and IJCAI-ECAI 2026 (Bremen)
- STRL 2026 is non-archival; papers under review elsewhere are allowed and selected authors may be invited to a journal special issue
- STRL 2024 and STRL 2025 proceedings were published in CEUR-WS (Vol-3827, Vol-4102)
- Regular papers 8 pages, short papers 4 pages, extended abstracts 2 pages in IJCAI format; 2026 review was double-blind
- 2026 organizers at University of Hamburg, Constructor University Bremen and Southwest Jiaotong University
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
