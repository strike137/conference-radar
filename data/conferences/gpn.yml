notes:
- Four-day hacker event run by Entropia e.V., the Karlsruhe chapter (Erfa-Kreis) of the Chaos Computer Club
- Held in Karlsruhe, Germany, since 2002 (no edition in 2020 and 2021 due to the pandemic); recent editions at the HfG (Hochschule fuer Gestaltung) and the ZKM
- Talks, short talks, workshops and meetups on hardware and software development, IT security, privacy and net politics, plus a hackcenter
- Submissions go through a pretalx call for participation; talks are streamed and recorded via media.ccc.de, no proceedings
- Talks in German and English (GPN24 had about 100 German and 48 English sessions)
- Volunteer-run and donation-funded; mandatory registration with limited places, more than 1500 visitors expected
