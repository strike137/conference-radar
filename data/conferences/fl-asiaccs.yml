notes:
- Half-day workshop co-located with ACM AsiaCCS; first held in 2025 (Hanoi), then 2026 (Bangalore), so location
  follows AsiaCCS
- Proceedings in the ACM Digital Library as a separate workshop proceedings volume
- Double-blind review; up to 6 pages including references in ACM sigconf format, submitted via EDAS
- 'Deadlines have been extended every year so far (2025: 21 Feb -> 30 Mar -> 25 Apr; 2026: 13 Feb -> 22 Feb)'
- 'Very small program: 7 papers in 2025 and 5 papers plus invited plenary talks and a Flower tutorial in 2026, several
  presented online'
