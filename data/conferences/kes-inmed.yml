notes:
- Organized by KES International; 14th edition in 2026, 15th in 2027
- Covers intelligent systems and AI for medicine, surgery and healthcare (theme Smart Medical and Healthcare Systems)
- Held as part of the KES Smart Digital Futures multi-conference together with AMSTA, HCIS and IDT
- Held in Europe every June (Madeira 2024, Solin 2025, Barcelona 2026, Iasi 2027)
- Full papers published by Springer in the Smart Innovation Systems and Technologies series; short papers and
  abstracts are published online only, not in the Springer volume
- Many papers come through invited sessions, whose chairs set their own deadlines
- Not listed in ICORE2026; not on the CCF list
