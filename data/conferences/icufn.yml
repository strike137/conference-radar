- Full (6 pages) and short (3 pages) papers via EDAS, published in IEEE Xplore
- Tracks include AI, B5G/6G networks, and security/military/defense
- 'Deadline usually extended several times (2026: Feb -> Mar -> May)'
- 2026 site announced it meets Korea's BK21 conference requirements
