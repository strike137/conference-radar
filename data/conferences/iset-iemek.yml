notes:
- Annual domestic embedded engineering symposium of IEMEK, the Institute of Embedded Engineering of Korea; 21st edition in 2026
- Short papers of 2 to 3 pages submitted through Microsoft CMT, with oral and poster sessions
- About the top 10% of accepted papers and of presentations are recommended to the IEMEK journal and get best paper awards
- Topics cover all of embedded engineering (embedded systems, hardware, software, on-device AI, security)
- ISET2026 was held at the Gravel Hotel, Jeju over four days with keynotes, tutorials and invited sessions
- IEMEK also runs a separate fall conference (추계학술대회) and the international ICETA
