notes:
- Established in 1991; founded by Hamid Aghvami (King's College London) and Farokh Marvasti; each edition has its own
  local organizer (University of Montenegro in 2025)
- IEEE ComSoc technical sponsorship; papers published in IEEE Xplore and indexed in Scopus
- Covers PHY, networking/MAC, AI for communications, and experiments/applications tracks
- Rotates worldwide (Hanoi 2019, Bali 2020, London 2021, Toba 2023, Amman 2024, Budva 2025)
- Submission deadlines are extended several times; the 2025 CFP lists a chain of crossed out deadlines
- Not listed in CORE ICORE2026
