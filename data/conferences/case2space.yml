notes:
- ICSE workshop on software engineering for mission-critical, autonomous and AI-enabled systems (space, Earth observation, maritime robotics, UAVs, autonomous transport)
- First edition at ICSE 2027 in Dublin (workshop day 2027-05-01); no earlier edition in its conf.researchr.org series
- Organized by Francesco Basciani, Martina De Sanctis, Patrizio Pelliccione, Gianluca Filippone and Sara Pettinari (Gran Sasso Science Institute, Italy)
- Regular papers up to 8 pages and short papers up to 5 pages plus references, IEEE conference template; extended abstracts up to 2 pages are not included in the proceedings
- Single-blind review by at least three PC members; accepted regular and short papers go to the IEEE workshop proceedings of ICSE 2027
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
