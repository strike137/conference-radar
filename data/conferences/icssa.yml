notes:
- Run by Universiti Teknologi Malaysia (UTM) with the IEEE IMS Malaysia Chapter; held in Malaysia (2024 Penang, 2026 Putrajaya)
- Editions in 2015, 2018, 2020, 2022, 2024 and 2026, so roughly every two years
- Accepted and presented papers go to IEEE Xplore; no-show papers are excluded
- Six-page IEEE format papers via EDAS, at least three reviewers
- Broad scope across sensors, AI, IoT, 5G/6G networking and biomedical applications
- 2026 deadline was extended from April to the end of June
- Not listed in the ICORE2026 CORE portal
