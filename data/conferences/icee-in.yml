language: english
organizer: IEEE Electron Devices Society, with a steering committee from IISc Bengaluru and the IITs
organizer_country: [india]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [9]
  conference_months: [12]
links:
  website: https://www.ieee-icee.org/
notes:
- Indian electron devices and semiconductor conference presented by the IEEE Electron Devices Society; steering
  committee from IISc Bengaluru, IIT Bombay, IIT Jodhpur, IIT Gandhinagar and IIT Madras
- Covers logic and memory devices, neuromorphic and in-memory computing, power and RF devices, optoelectronics,
  sensors and MEMS, materials, modeling and packaging
- Accepted 4-page papers go to IEEE Xplore (IEEE conference ID 72661X in 2026); submission through EDAS
- Late News papers can opt into the proceedings; "Abstract Only Poster" submissions are not published
- Extended versions of selected papers invited to special issues of IEEE JEDS and IEEE TMAT
- Large industry presence (plenaries from L&T Semiconductor, Infineon, Applied Materials), rump sessions, tutorials
  and a job fair
- At least one author must register and present in person; one registration covers two papers
- 2025 (7th) edition held in Bengaluru in December; 2026 (8th) edition also set for Bengaluru in December
- Not listed in ICORE2026 or in the CCF list; device and circuits venue outside the usual CS rankings
