notes:
- One-day workshop on consistency in distributed systems (CRDTs, replication, transactions, verification), running since 2014
- Co-located with EuroSys every recent year (Rome 2023, Athens 2024, Rotterdam 2025, Edinburgh 2026)
- 'Three formats: short papers (up to 6 pages), full papers (up to 12 pages, may be submitted elsewhere, not published) and 300-word lightning talks'
- Only short papers can go into the ACM Digital Library (author's choice, with other EuroSys workshops); full papers and lightning talks are not published
- Submissions need not be anonymised; deadline in January or February, usually extended (by one to three weeks in 2025 and 2026)
- Not listed in CORE ICORE2026 or the CCF list
