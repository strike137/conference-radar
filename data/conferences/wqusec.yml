notes:
- Co-located workshop of SBSeg, the Brazilian Symposium on Cybersecurity run by the Brazilian Computer Society (SBC); held in 2025 and 2026
- Covers quantum and post-quantum security, quantum and post-quantum cryptography, hybrid schemes and their standardization and performance
- Short papers up to 7 pages or talk proposals up to 4 pages, in Portuguese or English, SBC template, submitted through JEMS3
- Accepted papers published in the SBC OpenLib (SOL) digital library
- Program mixes invited talks and accepted papers
- Held with SBSeg in a different Brazilian city each year (Foz do Iguaçu 2025, Armação dos Búzios 2026)
- Not listed in CORE ICORE2026
