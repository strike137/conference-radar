notes:
- Long-running IEEE convention of the Central America and Panama sections; 2026 is the 44th edition (CONCAPAN XLIV)
- Broad EECS scope with IEEE society tracks (PES, RAS, IAS, ComSoc, Computer Society, EMBS, EDS, EdSoc, CAS)
- Papers 4 to 6 pages in IEEE format and in English only; presentations in English or Spanish
- Accepted and presented papers go to the conference proceedings and are submitted to IEEE Xplore and Scopus
- Submission via EDAS; one registration covers one paper, extra pages 100 USD each (2026)
- Large event with an exhibition of more than 110 stands and over 1000 participants (2026)
- Not listed in CORE ICORE2026
