notes:
- Flagship convention of the IEEE CAPANA Council, run each year by a different IEEE section in Central America (Panama 2022, Costa Rica 2024, El Salvador 2025, Guatemala 2026)
- Broad electrical, electronics and computer engineering scope with IEEE society tracks (ComSoc, Computer Society, PES, RAS, EMBS, CAS, ...); also a large technical exhibition
- Accepted papers go to IEEE Xplore (2024 edition was IEEE conference #63470) and Scopus
- Papers must be written in English (4 to 6 pages, IEEE format); talks may be given in English or Spanish
- Submission via EDAS (2026) or Microsoft CMT (2025); peer reviewed
- Not listed in CORE ICORE2026
