id: icaicta
name: ICAICTA
full_name: 'International Conference on Advanced Informatics: Concepts, Theory and Applications'
type: conference
tier: minor
areas: [ai, data, vision, nlp, security]
region: southeast-asia
language: english
frequency: annual
organizer: 'Institut Teknologi Bandung (ITB) and Toyohashi University of Technology (TUT), with a rotating host
  (2026: UTAR Faculty of ICT and Centre for IoT and Big Data, jointly with ITB, TUT and Institut Teknologi Sepuluh
  Nopember)'
organizer_country: [indonesia, japan]
proceedings: IEEE Xplore
indexing: [Scopus]
rank:
  core: Unranked
fee: 1,150 MYR non-IEEE presenter early (onsite), 950 MYR IEEE member presenter early, plus 8% SST; online presentation
  from 210 MYR (2026)
typical:
  deadline_months: [6, 7]
  conference_months: [9, 10]
links:
  website: https://icaicta.org/
  wikicfp: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=200024&copyownerid=199175
notes:
- Japan-Indonesia informatics conference co-run by ITB and Toyohashi University of Technology; rotates among Indonesia,
  Japan, Singapore, Malaysia and Thailand
- Hybrid format with online presentation allowed; IEEE Xplore proceedings indexed in Scopus
- Small venue; topics include AI/ML, vision, NLP, data mining, cryptography and audit/security
- Two submission phases (2025) and repeated extensions; deadlines at 23:59 host local time
