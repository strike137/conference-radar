notes:
- Workshop at ECIR on misinformation, credibility assessment and retrieval of trustworthy information
- Held every year with ECIR since 2021 (Lucca online 2021, Stavanger 2022, Dublin 2023, Glasgow 2024, Lucca 2025, Delft 2026, Southampton 2027)
- Proceedings of the 2021 to 2025 editions in CEUR-WS (Vol-2838, 3138, 3406, 3677, 3986)
- Regular papers 12 to 15 pages and short papers 6 to 11 pages in LNCS style; single-blind review via EasyChair
- Already published or preliminary work may be presented without inclusion in the proceedings
- Abstract registration one week before the paper deadline
- Not listed in the CORE ICORE2026 portal
