notes:
- Soft computing and applied AI conference run by CHARUSAT (Changa, Gujarat, India); general chair K. K. Patel
- Proceedings in Springer CCIS (2025 in three volumes, CCIS 2873 to 2875); the 2024 and 2023 volumes are revised selected papers
- Held at CHARUSAT in Changa from 2020 to 2023, then Bangkok 2024, Hanoi 2025 and Singapore 2026 (hybrid)
- Double-blind review via Springer Meteor; full papers 12 to 13 pages and short papers 10 to 11 pages in CCIS format
- Extra page charges beyond 13 pages (1500 INR for Indian authors, 50 USD for foreign authors per page, 2026)
- Submission deadline is usually extended several times
- The 1st iwAIIS workshop runs alongside the 2026 edition
- Not listed in ICORE2026 and not on the CCF list
