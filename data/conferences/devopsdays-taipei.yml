notes:
- Taipei edition of the worldwide community DevOpsDays series, organized with the IT media company iThome; editions
  in 2017 to 2019 and every year since 2021
- Topics include automation, CI/CD, observability, SRE, security, AI and DevOps culture
- Two days in June at Taipei New Horizon (Taipei Cultural and Creative Building) in 2025 and 2026; 2024 at Nangang
  Bottle Cap Factory, 2023 in September
- Over 700 attendees expected (2026)
- Talk proposals (30 min talks or Ignite talks) by email through the devopsdays.org event page; no vendor pitches
- No papers or proceedings
