notes:
- IEEE Systems Council conference, first held in 2021 (virtual); 2025 was the fifth edition
- Rotates within Asia (Tainan 2022, Kerala 2023, Taichung 2024, Singapore 2025, Chengdu 2026)
- Very broad systems science and engineering scope (cyber-physical systems, digital twins, embedded and VLSI, communication systems, hardware security, AI circuits)
- Proceedings published by IEEE and included in IEEE Xplore; papers not covered by a full registration are removed
- Regular papers up to 8 pages, industry case study papers up to 6 pages; also a PhD/student forum
- Extended versions of accepted papers can go to IEEE Systems Journal and IEEE Transactions on Reliability special issues
- Not listed in CORE (ICORE2026)
