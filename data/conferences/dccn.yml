notes:
- Long-running Russian conference on distributed systems, communication networks, queueing theory and performance modeling; 29th edition in 2026
- Organized by the V.A. Trapeznikov Institute of Control Sciences of RAS and RUDN University with support of the IEEE Russia Section Communications Society Chapter
- Held every September in Moscow in hybrid mode (2025 at ICS RAS, 2026 at RUDN University)
- Working languages are Russian and English; 4 to 6 page papers, double-blind review
- All accepted papers go into a proceedings volume indexed in the Russian Science Citation Index
- Selected English papers are extended to 12 to 15 pages, reviewed again and published by Springer in LNCS or CCIS
- "Registration fee 200 EUR for international participants, 10000 RUB for Russian participants (2026)"
- Not listed in ICORE2026 or the CCF list
