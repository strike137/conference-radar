notes:
- Workshop of IEEE COMPSAC (IEEE Computer Society); 9th edition in 2026, 8th at COMPSAC 2025 in Toronto
- Yearly theme; 2026 theme was AI for proactive and responsible autonomy (agentic AI, trustworthy and explainable autonomous systems)
- Chaired by Aswani Kumar Cherukuri (Vellore Institute of Technology, India) with co-chairs from Australia and Dubai
- Not the CORE-ranked AiML (Advances in Modal Logic); not listed in the CORE portal; COMPSAC itself is CORE B
- Workshop papers appear in the COMPSAC proceedings on IEEE Xplore
- Workshop deadlines are shared across all COMPSAC workshops; the 2027 workshop list (COMPSAC 2027 in Tokyo, July 13 to 16) was not yet published
