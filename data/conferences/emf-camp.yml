notes:
- Non-profit camping festival in the UK for hackers, makers, artists, scientists and engineers, organised entirely by volunteers
- Held every two years (2022, 2024, 2026); 2026 at Eastnor Castle Deer Park, Herefordshire
- Nearly 4000 attendees; talks on three stages plus workshops, covering everything from computer security and electronics to crafts
- Talk and workshop proposals are reviewed anonymously; accepted speakers can buy a weekend ticket or get a free day ticket
- No proceedings; talk videos are published on media.ccc.de and YouTube
- Known for its reprogrammable electronic camp badge (Tildagon)
