notes:
- Run by the Multimedia Signal Processing Technical Committee of the IEEE Signal Processing Society
- Despite the name it is a standalone annual event (28th edition in 2026), not a co-located workshop
- Accepted papers are submitted to IEEE Xplore; about the top 10% are invited to a fast track in IEEE Transactions
  on Multimedia (2026)
- Location rotates worldwide (Beijing 2025 with a thematic school at Tsinghua University, Istanbul 2026)
- CORE C (ICORE2026)
- "Submission deadline is usually in late May or June, with extensions; conference in September"
