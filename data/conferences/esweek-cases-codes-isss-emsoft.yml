notes:
- One week that runs three parallel conferences, CASES (compilers and architecture for embedded systems), CODES
  (hardware/software co-design, formerly CODES+ISSS) and EMSOFT (embedded software), plus MEMOCODE and workshops
- One registration covers all three conferences
- "Journal-integrated model: accepted full papers are published in IEEE TCAD after two review rounds; late-breaking
  papers (4 pages) go to IEEE Embedded Systems Letters"
- Journal track papers up to 12 pages in IEEE double-column format; deadlines midnight AoE; artifact evaluation offered
- CORE lists CASES, CODES+ISSS and EMSOFT as journal published; CCF ranks CODES+ISSS and EMSOFT B, CASES C
- Held late September or early October; recent editions in Hamburg (2023), Raleigh (2024), Taipei (2025) and
  Barcelona (2026)
