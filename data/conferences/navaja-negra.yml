notes:
- Spanish hacker and cybersecurity conference in Albacete, run by the Asociación Navaja Negra since 2012
- Held at the University of Castilla-La Mancha campus (Paraninfo Universitario and the computer engineering school)
- Three days of talks, workshops, a CTF and evening networking; the 2025 site cites more than 900 professionals
- Talks mainly in Spanish
- The association announced that no 2026 edition will take place, citing a dispute over the Navaja Negra trademark
