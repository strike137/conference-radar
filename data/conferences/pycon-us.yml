notes:
- Largest and longest-running annual gathering of the Python community, produced by the Python Software Foundation
- Two days of tutorials, three main conference days with 90+ talks (including AI, Security and Spanish-language Charlas tracks), posters and lightning talks, then two days of sprints
- Talks, tutorials, Charlas and posters chosen from one call for proposals on Pretalx, at most 3 proposals per person; a proposal mentorship programme and speaker travel grants are offered
- Moved to Long Beach, California from 2026 after Salt Lake City (2023) and Pittsburgh (2024, 2025)
- 1,901 attendees from 58 countries in 2026
- No papers or proceedings; practitioner talks only
