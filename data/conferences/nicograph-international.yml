notes:
- International conference on computer graphics, visual computing, interactive media and digital art, run by the
  Society for Art and Science (Japan); 25th edition in 2026
- Grew out of the domestic NICOGRAPH paper contest (since 1985); the international series started in 2002
- Accepted full (6 to 8 pages) and short (3 to 4 pages) papers are published by IEEE CPS and submitted to IEEE
  Xplore and the Computer Society digital library; posters (1 to 2 pages) are a separate later track, with a few strong posters invited to IEEE Xplore
- Single-blind review; deadlines are 23:59 GMT
- Held in Japan in June (Hokkaido 2023, Hachioji 2024, Kanazawa 2025, Nagoya 2026); online in 2021 (July) and 2022
- Not listed in the CORE portal (ICORE2026, 0 results); not on the CCF list
