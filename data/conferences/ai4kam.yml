notes:
- Workshop on AI for knowledge representation, knowledge discovery, knowledge management, business process automation and AI in management
- Continues a series on intelligent technologies in management established in 1992, renamed in 2003 and part of FedCSIS from 2012
- 2025 edition was the 11th IFIP WG 12.6 International Workshop (per the Springer volume)
- 2025 edition held on August 17, 2025 as an IJCAI 2025 workshop in Montreal
- Full papers up to 6 pages plus 1 page of references in Springer format; papers rejected from the IJCAI main track may be resubmitted with reviews and a change letter
- Selected extended papers published by Springer in IFIP AICT vol. 776 as "Artificial Intelligence for Knowledge Acquisition and Management" (2026, revised selected papers)
- Chaired by Maciej Pondel and Iwona Chomiak-Orsa (Wroclaw University of Economics and Business), Petr Berka (Prague University of Economics and Business) and Agnieszka Siennicka (Wroclaw Medical University)
- Not in the IJCAI 2026 workshop list
- Not listed in the ICORE2026 portal or the CCF 2026 list
