id: imw
name: IMW
full_name: 'Workshop on Image Matching: Local Features & Beyond'
type: workshop
tier: minor
areas: [vision, ai]
region: north-america
language: english
frequency: annual
organizer: Organizing team from Czech Technical University in Prague, University of Palermo, Bruno Kessler Foundation, Google,
  University of British Columbia and USDA-ARS; co-located with CVPR
organizer_country: [europe, usa, canada]
proceedings: IEEE Xplore and CVF Open Access (CVPR Workshops)
archival: true
typical:
  deadline_months: [3]
  conference_months: [6]
links:
  website: https://image-matching-workshop.github.io/
notes:
- Held every year at CVPR since 2019; 8th edition at CVPR 2026 in Denver, 7th at CVPR 2025 in Nashville
- Topics are local features, keypoint matching, structure from motion, re-localization and 3D reconstruction
- Every edition runs an open image matching challenge, hosted on Kaggle in recent editions
- Papers up to 8 pages excluding references in the CVPR template, double-blind with at least two reviews, submitted via CMT
- Accepted papers go into the CVPR Workshops proceedings (IEEE Xplore and CVF Open Access); 9 papers on CVF Open Access for 2026
- Half-day workshop with invited talks and paper talks
- Not listed in ICORE2026 or the CCF list
