notes:
- Annual open source community conference on Suricata, the network intrusion detection and prevention engine
- Run by OISF, a US 501(c)3 nonprofit based in Lafayette, Indiana, which develops Suricata
- Three days of talks plus optional two-day hands-on trainings led by Suricata developers just before the conference
- Moves between Europe and North America (Athens 2022, virtual 2023, Madrid 2024, Montreal 2025, Lisbon 2026)
- No proceedings; slides (PDF) and talk videos are posted on the edition archive pages
- "Fees 2026: conference only 750 EUR, conference plus training 2500 EUR, virtual 150 EUR"
