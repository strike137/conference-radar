  conference_months: [1, 2]
links:
  website: https://alife-robotics.co.jp/
notes:
- Successor of the AROB symposium series (ICAROB 2027 is the 32nd AROB anniversary); held in January in Oita
  Prefecture (B-Con Plaza, Beppu 2026, J:COM HorutoHall, Oita 2027)
- Topics span artificial life, robotics, AI, complex systems, multi-agent systems, evolutionary computation and
  networking
- Proceedings open access with JaLC DOIs (10.5954/ICAROB.YEAR.ID), stated as indexed by Scopus and CPCI-Web of
  Science; extended papers can go to JRNAL or JAALR, journals of the Society of Artificial Life and Robotics
- Two-step submission by e-mail to the ICAROB office (abstract proposal first, final paper about a month later);
  remote participation via Zoom is offered
- Technically co-sponsored by IEEE Fukuoka Section and co-organized by CAAI (China)
- ICAROB itself is not in the CORE portal; ICORE2026 lists the predecessor name "International Symposium on Artificial
  Life and Robotics" (AROB) as C, not applied here because the full name differs
