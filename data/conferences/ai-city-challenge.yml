id: ai-city-challenge
name: AI City Challenge
full_name: AI City Challenge Workshop
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop committee led by NVIDIA with Santa Clara University, University at Albany, Iowa State University, Johns
  Hopkins University and others
organizer_country: [usa]
proceedings: Springer (ECCV 2026 workshop proceedings); IEEE Xplore and CVF Open Access for earlier CVPR and ICCV workshops
archival: true
typical:
  deadline_months: [4, 7]
  conference_months: [6, 9, 10]
links:
  website: https://www.aicitychallenge.org/
notes:
- Challenge workshop on computer vision for smart cities, intelligent transportation and warehouse video analytics, with
  several challenge tracks and a paper track
- Held with CVPR through 2024, with ICCV 2025 (Honolulu) and with ECCV 2026 (Malmo); the 2026 edition was the 10th
- Papers are open to non-participants; acceptance is based on technical merit rather than challenge ranking
- Review is not double-blind; 2026 papers were 4 to 14 pages in ECCV format, submitted through OpenReview
- 30 papers in the ICCV 2025 workshop proceedings on CVF Open Access
- Challenge awards require paper acceptance and open-sourcing the code
- Not listed in ICORE2026 or the CCF list
