notes:
- Practitioner conference on data engineering, streaming, cloud, machine learning and AI, organised by the Lithuanian company UAB DATA MINER
- Held in Vilnius since 2017 (as Big Data Conference Vilnius until 2018); online in 2020 to 2022, back in Vilnius with online access since 2023
- A workshop day followed by three conference days; 2026 plans 90+ talks, 7 workshops and 6 tracks with 700+ attendees
- Speakers apply through a call for papers and a separate call for workshops; no proceedings
- Co-located with AI Summit Europe (and RPA Europe in 2024 and 2025)
- Not listed in the CORE ICORE2026 portal
