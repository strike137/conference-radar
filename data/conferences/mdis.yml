notes:
- Run by the Department of Mathematics and Informatics, Lucian Blaga University of Sibiu, Romania; always held in Sibiu
- Covers modelling and development of intelligent systems, from theory to applications
- Post-conference proceedings in Springer CCIS (the last four editions and 2026)
- Double-blind review with at least three reviewers per paper (single-blind in 2024)
- Biennial since 2020 (editions 2009, 2011, 2013, 2015, 2017, 2019, 2020, 2022, 2024, 2026); 2026 is the 10th edition
- Deadlines are usually extended (2026 submission moved from 12 July to 30 August)
- "Fee: 300 EUR regular, 250 EUR approved online participation (2026); one fee covers up to two papers"
- Mainly onsite; online presentation only in justified exceptional cases
- Not listed in ICORE2026; not on the CCF 2026 list
