notes:
- Workshop co-located with WACV every year since 2022; the WACV 2027 edition is the 6th
- Organized by applied scientists at Amazon
- Accepted papers appear in the WACV Workshops proceedings (IEEE Xplore and CVF Open Access)
- Single-blind, single-round review via OpenReview; up to 8 pages excluding references in WACV format
- Topics include image, video and audio quality assessment and enhancement, and evaluating generative AI outputs
- Not listed in ICORE2026 or the CCF list
