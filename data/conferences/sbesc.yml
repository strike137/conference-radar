notes:
- Promoted by the Technical Committee on Computing Systems Engineering (CE-ESC) of the Brazilian Computer Society (SBC)
- Covers embedded, real-time, cyber-physical and distributed systems, IoT, embedded AI, dependability and related topics
- Full papers up to 6 pages in the IEEE two-column template; English full papers are published by IEEE CPS and indexed in IEEE Xplore
- Full papers in Portuguese or Spanish and work-in-progress papers go to the SBC Open Library (SOL)
- Top-ranked full papers are invited to submit extended versions to partner journals
- Held in a different Brazilian city each year (Porto Alegre 2023, Recife 2024, Campinas 2025, Salvador 2026)
- Grew out of earlier independent workshops (WSO, WTR, WSE) and CBSEC; editions since 2011
- Not ranked in CORE ICORE2026
