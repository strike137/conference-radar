notes:
- Community-driven Security BSides conference in Frankfurt am Main, Germany, held every year since 2023; run entirely by volunteers
- Held at Goethe University Frankfurt (Campus Westend) since 2024; the 2023 edition was at OutOfOffice Sachsenhausen
- Purely technical talks and workshops; no vendor pitches or marketing presentations
- One conference day plus one workshop day since 2025
- Early-bird and student tickets available; BSides Women initiative offers discounted tickets
- Most main-track talks are recorded and published after the conference
- No proceedings
