notes:
- Security BSides conference in Boulder, Colorado, USA, held in June at the Wolf Law Building on the University of Colorado Boulder campus (2022 to 2026)
- One-day event; past editions listed on the site go back to 2020
- Call for Speakers on Sessionize for 25 and 50 minute talks on any security topic, opening in January
- Submissions are ranked by multiple reviewers; review is double blind since 2026
- Talks only, no proceedings
