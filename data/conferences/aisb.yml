notes:
- Annual convention of AISB, the largest AI society in the UK (founded 1964), held at a different UK university each year
- Run as a set of co-located symposia, each with its own programme committee and call for papers
- Symposium proposal deadline in November; paper deadlines are set by each symposium
- Proceedings are compiled by AISB and posted as downloads on the society website (non-archival)
- Strong cognitive science, philosophy of AI and simulation of behaviour flavour
- No convention in 2022 or 2024; AISB 2025 was in January at UWE Bristol
- Not listed in CORE ICORE2026; not in the CCF list
