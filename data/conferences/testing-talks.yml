notes:
- Practitioner software testing and quality engineering conference that bills itself as Australia's premier software testing conference
- One-day events in Sydney (July or August) and Melbourne (October) each year since 2023; first in-person Melbourne edition in October 2022
- Recent venues are the Melbourne Convention and Exhibition Centre and the Sydney Masonic Centre
- Recent topics include AI-assisted testing, test automation and quality engineering leadership
- No papers or proceedings
- Not listed in CORE ICORE2026
