notes:
- Organized by IARIA as part of the InfoSys congress, co-located with ICNS, ICAS, ENERGY and other IARIA events (19th edition in 2027)
- Published open access in the IARIA ThinkMind library (ISSN 2308-4332); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in southern Europe (Venice, Barcelona, Athens, Lisbon, Valencia in recent years)
- Covers databases, knowledge management and data applications
- The 2027 edition moves from March to late May
