notes:
- One-day workshop on detecting and influencing mental states with speech and music (affective computing, music therapy, explainable AI for audio)
- Organized by TCS Research with IIIT Hyderabad; 2026 organizers Meghna Pandharipande, Subhrojyoti Roy Chaudhuri and Venkata Subramanian Viraraghavan
- Held since 2018 (Hyderabad 2018, Vienna 2019, Nanjing/virtual 2020, Brno 2021, Vienna 2022, Dublin 2023, Kos/virtual 2024); no edition in 2025
- SMM26 was an IEEE ICASSP 2026 satellite workshop on 4 May 2026 in Barcelona, with submissions through the ICASSP workshop system
- Papers of up to 4 pages plus 1 page of references in ICASSP format, at least two reviews per paper
- Proceedings of SMM18 to SMM24 are in the ISCA Archive
- Not ranked in ICORE2026 and not on the CCF list
