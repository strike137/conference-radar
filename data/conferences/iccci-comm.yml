notes:
- Not the same venue as ICCCI (International Conference on Computational Collective Intelligence)
- Smaller conference on communication networks, IoT, multimedia communications, network management and security
- Run by the commercial organizer SCIEI (submission via zmeeting) with Japanese universities as hosts
- Held in Japan every year since 2022 (Chiba, Shonan, Tokyo, Tokushima, Okayama); Tokyo in 2027
- Proceedings 2016 to 2025 in IEEE Xplore with Scopus and EI Compendex indexing per the site
- Full papers 4 to 10 pages, regular registration covers 6 pages; abstract-only presentation possible but not published
- Double-blind review per the submission page
