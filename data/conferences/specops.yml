notes:
- Workshop on specification-driven software development with foundation models and agentic AI (specification synthesis, validation, traceability, datasets)
- First edition on 2026-10-06 with SPLASH/ISSTA 2026 in Oakland, California
- Co-chairs from Amazon, KBR / NASA Ames and Cornell University
- Full papers up to 10 pages plus 2 for references, short, tool and dataset papers up to 4 pages plus 1; ACM two-column format (sigplan or sigconf), double-blind for full papers, HotCRP
- All accepted papers are published by ACM in the ACM Digital Library
- Optional abstract submission one week before the paper deadline
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
