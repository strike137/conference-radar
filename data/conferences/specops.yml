notes:
- New workshop; 2026 was the 1st edition, co-located with SPLASH/ISSTA 2026 in Oakland
- Topics are AI and agent based synthesis, validation and traceability of specifications across the software life cycle
- Full papers up to 10 pages plus 2 pages of references; short, tool demo, dataset papers and extended abstracts up to 4 pages plus 1
- Double-blind review; ACM SIGPLAN or sigconf acmart two-column format, submitted via HotCRP
- All accepted papers are published by ACM in the ACM Digital Library; extended abstracts are not charged ACM Open APCs
- Not listed in the CORE ICORE2026 portal
