notes:
- Flagship evolutionary computation conference of the IEEE Computational Intelligence Society, held annually since 1994
- In even years it runs inside IEEE WCCI together with IJCNN and FUZZ-IEEE (WCCI 2026 in Maastricht); in odd years
  it is held on its own (CEC 2025 Hangzhou, CEC 2027 Edinburgh)
- Rotates worldwide; recent Asian editions are Yokohama 2024 (WCCI) and Hangzhou 2025
- Proceedings in IEEE Xplore; at least one author must register and present, in person or virtually (2026)
- 2027 has full papers (8 pages) plus a separate 4-page short paper track published in the CEC Companion
  Proceedings, and conference-to-journal and journal-to-conference tracks with IEEE TEVC
- Deadlines are firm; the official pages state that no extension will be given
- Main IEEE venue for evolutionary computation; the ACM counterpart GECCO is ranked higher by CORE (A vs B)
