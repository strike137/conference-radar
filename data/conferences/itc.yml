notes:
- Flagship conference on electronic test (DFT, BIST, ATPG, memory test, diagnosis, yield, silicon debug), held as
  the week-long ITC Test Week with tutorials, workshops and an exhibition
- Not the same as the International Teletraffic Congress (also called ITC; see itc-congress)
- Papers up to 10 pages; AI-focused papers may add an appendix of up to 6 pages; submissions under 4 pages are rarely
  accepted
- Accepted papers go to IEEE Xplore; separate poster track for late-breaking results
- "Regular paper acceptance rate: 18.5% (2023, 30/162), 23.2% (2024, 36/155), 24.4% (2025, 40/164)"
- Started in 1970 as a symposium on IC testing (Cherry Hill, NJ); held in the USA, San Antonio in 2026 and 2027
- CORE A (ICORE2026), CCF B
