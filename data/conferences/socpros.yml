id: socpros
name: SocProS
full_name: International Conference on Soft Computing for Problem Solving
type: conference
tier: minor
areas: [ai]
region: south-asia
language: english
frequency: biennial
organizer: Department of Applied Mathematics and Scientific Computing, IIT Roorkee (series run by IIT Roorkee and Liverpool Hope University faculty)
organizer_country: [india]
proceedings: Springer (Springer Proceedings in Mathematics and Statistics for 2025; Springer LNNS for 2023)
archival: true
fee: Indian authors 8,500 INR regular, 6,500 INR full-time students; foreign authors 350 USD (2027)
typical:
  deadline_months: [10, 12]
  conference_months: [2, 3]
links:
  website: https://socpros2027.iitr.ac.in/
notes:
- Series started in 2011 at IIT Roorkee, run by faculty of IIT Roorkee and Liverpool Hope University, UK
- Mostly held at IIT Roorkee, India; a few editions abroad
- Covers soft computing, evolutionary and swarm algorithms, fuzzy systems, machine learning, optimization and operations research
- Recent editions every two years (2023, February 2025, March 2027) although the site calls it annual
- 2025 papers published in two Springer Proceedings in Mathematics and Statistics volumes; 2023 papers in Springer LNNS
- Springer publication for 2027 is stated as approval in process
- Double-blind review via Microsoft CMT; papers up to 12 pages in Springer format
- Held in person; extended abstracts and poster presentations also accepted
- Not listed in ICORE2026 or the CCF 2026 list
