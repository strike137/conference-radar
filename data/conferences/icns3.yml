notes:
- Annual conference on the ns-3 discrete-event network simulator, its models, validation and use in networking research
- Renamed from the Workshop on ns-3 (WNS3, 2009 to 2024) to ICNS3 in 2025
- Proceedings in the ACM International Conference Proceeding Series (ACM DL); APC applies to authors outside ACM Open without a waiver
- Papers up to 9 pages in the ACM format, single-blind review; reproducibility and artifacts weigh in the review and ACM badges are awarded
- Held together with the ns-3 developers meeting, training and tutorials; posters, demos and lightning talks are published on the ns-3 website only
- Location moves around (2023 Washington DC area, 2024 Barcelona, 2025 Osaka, 2026 Naples)
- Not listed in ICORE2026
