notes:
- Official workshop of the MICCAI Special Interest Group on Medical Ultrasound, held with MICCAI every year, so it moves with MICCAI
- Covers AI and robotics for ultrasound acquisition and interpretation, ultrasound guided interventions and multimodal ultrasound
- Proceedings in Springer LNCS (own volume for ASMUS 2025); 2026 papers go into the MICCAI satellite events joint proceedings
- Double-blind review by at least 3 reviewers; up to 8 pages plus up to 2 pages of references in LNCS format
- Submission via OpenReview in 2026 (Springer Meteor in 2025); each paper must nominate at least one reviewer
- Organizers in 2026 from the University of Birmingham, TUM, UCL and the University of Oxford
- Not listed in CORE ICORE2026 or the CCF 2026 list
