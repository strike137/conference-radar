notes:
- Community-driven hacker conference in the Research Triangle Park (RTP) area of North Carolina, USA
- Run by a 501(c)(3) non-profit founded in 2019 as a community partnership
- 100% community funded through donations and ticket sales; no sponsors or vendors accepted
- Three-day event with talks, hands-on workshops and 10+ villages
- Talks on hacking, security, privacy and technology chosen through an open call for papers
- Students attend free with a valid student ID (paper badge, no pre-registration)
- No proceedings
