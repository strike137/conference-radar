notes:
- Workshop of ARES (International Conference on Availability, Reliability and Security), held in Europe every summer;
  the 2026 edition was held with ARES 2026 in Linköping
- Submission guidelines are the same as for the ARES conference; ARES and its workshop papers are published in
  Springer LNCS since 2025, workshop papers up to 18 pages including references
- Topics include AI-based intrusion and anomaly detection for cyber-physical systems, trustworthy and robust AI for
  infrastructure security, smart grids, ICS and IoT security
- 2026 chairs from IIIT Dharwad and NIT Warangal (India), Stockholm University (Sweden) and the Institute for Energy
  Technology (Norway)
- Not listed in CORE ICORE2026
