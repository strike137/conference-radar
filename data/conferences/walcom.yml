notes:
- Started in 2007 in Dhaka as the Workshop on Algorithms and Computation, organized by the Bangladesh Academy of Sciences;
  renamed Conference and Workshops on Algorithms and Computation from 2017
- Held mostly in Bangladesh and India until 2019, then rotating in Asia (Singapore, Myanmar online, Indonesia, Taiwan,
  Japan, China); 2026 in Perugia, Italy was the first edition in Europe
- Proceedings in Springer LNCS every year since 2008
- Theory scope with a strong graph algorithms and graph drawing community (graph theory, computational geometry,
  combinatorial optimization, parameterized, online and string algorithms)
- Papers up to 14 pages in LNCS style including references, optional appendix read at the discretion of the PC
- Selected papers invited to journal special issues (2027 lists Algorithmica, JGAA and TCS)
- Ranked B in ICORE2026
