notes:
- Annual Chaos Computer Club (CCC) conference held since 2004 with a slight focus on IT security
- Run by the non-profit MRMCD e.V. together with local hackerspaces, CCC groups and universities of the Rhine-Main area
- Held every September in the Robert Piloty building of TU Darmstadt, Germany
- Talks and workshops on IT security, privacy, eGovernment, network politics and hacking; first-time speakers welcome
- Call for participation runs on pretalx and is mostly in German; talks in German and English
- No proceedings; public talks are recorded and published on media.ccc.de under CC BY
