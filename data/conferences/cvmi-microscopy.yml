notes:
- Workshop on computer vision for microscopy and multimodal (imaging plus omics) biomedical data, held with CVPR
- 11th edition in 2026; earlier editions held every year since 2016, with CVPR since at least 2022
- Named "Computer Vision for Microscopy Image Analysis" until 2025; "Multimodal" added in 2026
- Full papers up to 8 pages excluding references in CVPR style, double-blind review on Microsoft CMT, no rebuttal or supplementary material
- Accepted papers appear in the CVPR Workshops proceedings on IEEE Xplore and CVF Open Access (7 papers on CVF Open Access in 2026)
- Also takes short work-in-progress spotlight submissions and has run the CTMC cell tracking challenge
- Hybrid format; talks recorded and posted on YouTube
- Not related to the Indian IEEE CVMI conference (Computer Vision and Machine Intelligence)
- Not listed in ICORE2026 or the CCF list
