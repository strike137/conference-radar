notes:
- Annual community meeting for algorithmic model theory, automata theory, databases, games for logic and verification, logic and verification
- No publications and no formal proceedings; submissions are a short abstract (optional extended abstract up to 2 pages) proposing a short talk
- Single-author submissions by the speaker, at most one per speaker; already published work is welcome
- Two submission rounds (early round in April to help travel planning, regular round in May)
- Held on-site in Europe (Kassel 2023, Bordeaux 2024, Saarbruecken 2025, Vienna 2026); remote talks via prerecorded video are allowed
- Followed by a Collaborative Research Week (CREW) in the next week
- Not listed in CORE ICORE2026
