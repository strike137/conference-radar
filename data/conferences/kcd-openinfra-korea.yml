notes:
- Community-run practitioner conference on Kubernetes and cloud native, Ceph storage and open infrastructure
  (OpenStack), listed as a CNCF Kubernetes Community Days (KCD) event
- Joint edition of the three Korean user groups in 2023 (Jul 3, Seoul) and 2026 (Sep 1); KCD Seoul 2025 (May 22)
  was a Kubernetes-only edition; first KCD Korea was virtual in 2021
- 2026 held at the Kim Koo Museum and Library, Seoul, one day with keynotes, three tracks, lightning talks and sponsor booths
- Talks chosen from an open Call for Speakers on Sessionize; 30 minute in-person talks, product pitches not accepted
- Talks in Korean; no papers or proceedings
