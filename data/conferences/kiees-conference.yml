notes:
- Domestic conferences of KIEES, three a year; winter at ICC Jeju (February), summer at Alpensia Resort Pyeongchang
  (August), fall in Seoul together with the society's annual general meeting (November)
- Antennas, RF/microwave and millimeter-wave circuits, EMC, radar, propagation, wireless power, satellite and wireless
  communications, 5G/6G
- 1-page A4 papers in Korean or English, oral or poster; the summer conference also has an English paper session
- Best papers are chosen from session chair recommendations and judging on the day; award winners and
  chair-recommended papers can go through extra review for the Journal of KIEES
- Undergraduate paper contest at each meeting
