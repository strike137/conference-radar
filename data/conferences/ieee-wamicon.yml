notes:
- Regional RF, microwave and wireless conference founded in 1999 by the University of South Florida WAMI lab; fully sponsored by IEEE MTT-S since 2004
- Held every year in Florida, usually at a beach location in March or April (2026 Clearwater)
- Submissions are 3 to 4 page papers in the IEEE conference template; accepted papers appear in IEEE Xplore
- Oral and poster sessions plus workshops, tutorials, a young professionals and women in microwaves panel, and an exhibition
- Microwave engineering venue outside the usual CS rankings, not listed in ICORE2026
