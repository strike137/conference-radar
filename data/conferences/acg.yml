notes:
- One of the two conference series of the International Computer Games Association (ICGA)
- Held in odd-numbered years, alternating with Computers and Games (CG) in even-numbered years
- Started in Edinburgh in 1975 as Advances in Computer Chess; described as the longest running game AI conference
- AI for board, card, puzzle and video games (search, MCTS, game solving, machine learning for games)
- Proceedings in Springer LNCS; papers up to 10 pages including references in LNCS style
- Held online since 2021 (2021, 2023, 2025); attendance free, 50 EUR fee per accepted paper (2025)
- 18 papers presented in 2025
- Not listed in CORE ICORE2026 and not on the CCF 2026 list
