notes:
- Run under the International Computer Games Association (ICGA); described as the longest ongoing game AI conference, first held in Edinburgh in 1975
- Proceedings published by Springer as a volume in the LNCS series
- 2021, 2023 and 2025 editions were held online, with free attendance to view all talks
- Papers up to 10 pages including references in LNCS style, submitted via EasyChair
- Topics include chess and variants, solving games, board and card games, and game AI in general
