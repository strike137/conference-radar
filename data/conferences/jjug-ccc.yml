notes:
- Java community conference run by the Japan Java User Group, described by the organizers as the largest Java
  community event in Japan
- Held twice a year, in spring and autumn, one day on a weekend
- 'Recent venue: Bellesalle Shinjuku Grand Conference Center, Tokyo (2025 Fall, 2026 Spring, 2026 Fall)'
- Free to attend; 2026 Fall is on site only, with no live streaming or recordings
- Talks chosen from a call for proposals on Sessionize (open about six weeks, closing in March for spring and August for autumn in 2026)
- No papers or proceedings; talks only
