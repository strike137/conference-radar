notes:
- Workshop on OTFS, ODDM, OCDM, AFDM and other waveforms for high-mobility communications, sensing, localization and ISAC in 6G
- Ran as WS-11 at IEEE WCNC 2026 in Kuala Lumpur (full day) and as a workshop of IEEE PIMRC 2026 in Singapore
- WCNC workshop papers that are presented go into IEEE Xplore; submissions via EDAS in the host conference format
- Different from the GLOBECOM delay-Doppler workshop (ddcs)
- Not listed in ICORE2026
