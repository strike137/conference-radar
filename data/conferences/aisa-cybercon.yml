notes:
- Annual conference of the Australian Information Security Association (AISA), the national cyber security peak body
  with about 14,000 members
- Held in Melbourne at the Melbourne Convention and Exhibition Centre, mostly in October (late November in 2024);
  separate CyberCon Canberra editions ran in March 2024 and March 2025
- Practitioner, government and industry oriented; keynotes, panels, think tanks, workshops, villages and a large
  exhibition; talks only, no papers or proceedings
- Organizers report 5,500+ delegates, 450+ sessions and 160+ exhibitors (2025 to 2026), described as Australia's
  largest cyber security conference
- Speakers are chosen by an AISA program selection committee; RSAC CISO Boot Camp is held alongside
- Student ticket requires a valid student ID and attendees must be 18 or over
