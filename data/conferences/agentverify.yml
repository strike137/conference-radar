notes:
  - ICSE workshop on testing, debugging, benchmarking, observability, sandboxing and evaluation infrastructure for LLM-based software agents
  - First edition at ICSE 2027 in Dublin, Ireland
  - Full papers up to 8 pages, short and demonstration papers up to 4 pages, extended abstracts up to 2 pages (all including references)
  - IEEE format in line with ICSE 2027, double-blind review via HotCRP
  - Accepted papers appear in the ICSE 2027 workshop proceedings by default; extended abstracts are included and free of APC charges
  - Different from AGENT (International Workshop on Agentic Engineering, also at ICSE)
  - Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
