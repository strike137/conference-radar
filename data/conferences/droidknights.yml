notes:
- Android developer conference in Seoul, described by the organizers as the largest Android developer conference in Korea
- One-day event with two tracks; 2026 had 12 sessions, mostly in Korean with a few English talks
- Held at COEX (Jun 11 2024), Science and Technology Convention Center (Jun 17 2025) and again at ST Center (Nov 2 2026)
- From 2026 talks are not recorded or published; sessions are on site only
- "Tickets: 49,000 KRW regular and 25,000 KRW students up to high school (2024); 59,000 KRW regular (2025)"
- Resume and portfolio review sessions by the organizers are part of the program
- No papers or proceedings; practitioner talks only
- Not listed in the CORE ICORE2026 portal
