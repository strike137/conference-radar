notes:
- Annual since 2017, single-track conference at the intersection of robotics and machine learning; papers must focus
  on a core robotics problem
- Proceedings in PMLR (2025 -> volume 305, 263 papers)
- Location rotates worldwide (2021 London, 2022 Auckland, 2023 Atlanta, 2024 Munich, 2025 Seoul, 2026 Austin)
- Double-blind review on OpenReview; 8-page initial submission, 9 pages for camera-ready; abstract deadline a few
  days before the full paper; one-page PDF rebuttal, and papers without any weak accept can be rejected before rebuttal
- Reciprocal reviewing required (at least one qualified author per submission must review)
- Accepted papers and reviews are made public after decisions
- Widely regarded as a leading robot learning venue, although ICORE2026 lists it as Unranked and it is not on the CCF
  list
- 2025 was co-located with Humanoids 2025 at COEX, Seoul
- 2026 main conference is November 9 to 11 with workshops on November 12; the end date includes the workshop day
