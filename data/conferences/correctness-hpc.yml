links:
  website: https://correctness-workshop.github.io/2026/
notes:
- Workshop on verification, testing and debugging of HPC software, held with the SC conference (10th edition in 2026)
- Moves with SC, so it is held in the USA (Atlanta 2024, St. Louis 2025, Chicago 2026)
- Proceedings archived in ACM according to the workshop site
- Regular papers 7 to 8 pages plus references and short papers of 5 pages; peer-reviewed by the program committee
- Includes the HPC Bug Fest session for short papers on correctness benchmarks
- Full day in 2025, half day in 2024 and 2026
- Not ranked in CORE ICORE2026 and not on the CCF 2026 list
