organizer: Correctness workshop organizers (Ignacio Laguna, LLNL, and Cindy Rubio-Gonzalez, UC Davis), held as an SC workshop
organizer_country: [usa]
proceedings: SC Workshops Proceedings (ACM DL)
archival: true
typical:
  deadline_months: [7, 8]
