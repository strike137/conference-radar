notes:
- Main conference on agile software development, combining a research track with industry and practice, agile games,
  training and education, posters, PhD symposium and workshops
- Started as the eXtreme Programming conference; the 2027 edition is the 28th
- CORE B (ICORE2026, listed as Conference on Agile Software Development); not on the CCF list
- Main proceedings published open access by Springer in Lecture Notes in Business Information Processing (LNBIP)
  as "Agile Processes in Software Engineering and Extreme Programming"
- Research papers in Springer LNCS/LNBIP format, evaluated by at least three PC members
- Mostly held in Europe (Brugg-Windisch 2025, Tampere 2027); 2026 was the first edition in Brazil (Sao Paulo, April)
