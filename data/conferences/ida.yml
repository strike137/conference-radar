notes:
- Small single-track symposium on data analysis and machine learning that promotes ideas over performance; reviewers weigh novelty over exhaustive benchmarks
- Proceedings in Springer LNCS as Advances in Intelligent Data Analysis (2026 -> volume XXIV, 33 papers)
- Papers 10 to 12 pages in LNCS format; single-blind review; a senior PC member can champion a paper to acceptance
- Held in Europe every spring (Porto 2021, Rennes 2022, Louvain-la-Neuve 2023, Stockholm 2024, Konstanz 2025, Leiden 2026)
- PhD forum with mentoring; frontier prize for the most visionary paper
- CORE B (ICORE2026)
