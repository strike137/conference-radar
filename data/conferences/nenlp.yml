links:
  website: https://nenlp.github.io/
notes:
- One-day regional NLP meeting for academic and industry researchers who live and work in New England, with keynotes,
  oral talks, posters and a panel
- Hosts so far 2022 MIT, 2023 UMass Lowell, 2024 Brown (Providence), 2025 Yale (New Haven)
- Submissions are extended abstracts of at most 500 words; work in progress and already published work are both
  welcome, so it is non-archival
- Accepted work is presented as posters, with a few selected for 10-minute oral talks and best paper awards (2025)
- Aimed mainly at graduate students at New England universities; the 2025 edition reached full capacity and closed
  registration early
- Not listed in the CORE ICORE2026 portal and not on the CCF list
