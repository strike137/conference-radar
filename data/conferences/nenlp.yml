organizer: Rotating New England host university (2025 Yale, 2024 Brown, 2023 UMass Lowell, 2022 MIT) with a senior
  committee from Brown, UMass Lowell, MIT and Yale
organizer_country: [usa]
proceedings: None
archival: false
