notes:
- Secure-by-design conference for critical infrastructure (water, energy, transport, healthcare, telecom, OT/ICS/SCADA)
- Jointly organized by SUTD's iTrust centre and The Water Tower; general chair Jianying Zhou (SUTD)
- Grew out of the iTrust DCS-Water 24 and DCS-Water 25 conferences on water infrastructure security; DCS-CI 2026 is the first edition under this name
- Proceedings in Springer CCIS (Vol. 3109 for 2026); double-blind review, at least three reviews per paper
- 2026 edition held at The Water Tower in Buford, Georgia, USA; also has a poster session and an industrial track
