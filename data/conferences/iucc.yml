notes:
- Ubiquitous and pervasive computing and communications conference; 24th edition in 2026
- Accepted papers submitted to IEEE Xplore and to indexers such as EI; selected papers invited to journal special issues
- Not listed in CORE ICORE2026 or the CCF 2026 list
- Held in China and the UK in recent years (Exeter 2020, London 2021, Chongqing 2022, Chengdu 2023 and 2024, Exeter 2026); no 2025 edition is listed
- 2026 edition co-located in Exeter with CIT, DSCI, IOI and ICA3PP; the 2026 submission deadline was extended by about two weeks
