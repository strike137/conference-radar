notes:
- Annual French national conference on information systems engineering, held since 1982 by the INFORSID association
- Topics include big data, data science, security, AI and generative AI, process engineering and IS governance
- Official language is French; contributions in English are accepted
- "Categories: research papers (long 12 to 16 pages, short 4 to 6 pages), international (3-page French summary of a paper published elsewhere), demo (2 to 4 pages)"
- Reviewed by the program committee; accepted papers appear in the conference proceedings (actes), published as a PDF on the conference website
- Best papers can be invited to a special issue of the Revue ouverte d'ingénierie des systèmes d'information (ISI)
- 2026 edition held jointly with IEEE RCIS in Toulouse, with a dual submission option; 53 submissions in 2026
- Not ranked in ICORE2026; not on the CCF 2026 list
