notes:
- Regional security practitioner conference in Rochester, New York, USA, held annually since 2006 during Cybersecurity
  Awareness Month (October)
- Run by the Rochester chapter of ISSA; 2026 was the 20th anniversary edition
- Two days of 50 minute talks in several tracks plus a sponsor track; talks must be vendor neutral
- Call for Presentations (talk proposals, no papers); 2026 submitters were notified by August 7
- Not the same event as BSidesROC (bsides-roc), also in Rochester
- Not listed in ICORE2026 or the CCF 2026 list
