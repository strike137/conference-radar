notes:
- Hacking contest and conference running since 2014 (originally GeekPwn), now GEEKCON founded by DARKNAVY; 18 editions
  held worldwide
- Main event on October 24 in Shanghai (West Bund) in 2025 and 2026; past editions also in Beijing, Singapore (2024),
  Hong Kong, Macau, Silicon Valley and Las Vegas
- 'Tracks in 2026: AI Security Challenge, DAF Vulnerability and Exploitation Challenge, 30+5 In-depth Sharing (30
  min talk plus 5 min live demo), DARKNAVY Insight special disclosure'
- Submissions by email (cfp@geekcon.top), reviewed in order of arrival; winning DAF exploits are disclosed to vendors
  responsibly
- Practitioner venue with no proceedings; recent focus on AI, robots, drones and autonomous systems
