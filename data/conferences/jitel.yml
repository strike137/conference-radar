notes:
- Spanish national conference of the telematics engineering research community, held since 1997 and now organized by
  SCITEL with a different Spanish university hosting each edition
- Held every two years in odd years (A Coruña 2021, Barcelona 2023, Cáceres 2025); the 2027 edition is planned at the
  Universidad de Oviedo
- Topics include next-generation networks (5G/6G), IoT and sensor networks, SDN/NFV, network management, AI for networks,
  security in communications and systems, multimedia, and telematics teaching
- "Three paper types: TF (finished unpublished work, up to 8 pages), TP (work in progress, up to 4 pages), TY (already
  published work or research lines, 1-page abstract with poster)"
- Papers in Spanish or English; peer reviewed via Microsoft CMT
- Accepted TF and TP papers appear in the proceedings book with ISBN and in Zenodo
- "Registration fee (2025, early): 550 EUR full, 350 EUR for SCITEL members"
- Not listed in CORE ICORE2026 or in the CCF 2026 list
