id: ynlg
name: YNLG
full_name: Workshop for Young Researchers in Natural Language Generation
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: Volunteer organizing committee of early-career researchers under the auspices of ACL SIGGEN; co-located with INLG
organizer_country: [international]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [8]
  conference_months: [10]
links:
  website: https://ynlg-workshop.github.io/
notes:
- Workshop for PhD students, Master's students and postdocs new to natural language generation, held as part of INLG
- Organized under the auspices of the ACL Special Interest Group on Natural Language Generation (SIGGEN)
- Participants submit a 2-page position paper (research overview, short bio, questions for senior researchers, roundtable topics); no anonymity requirement
- Submissions are checked for topic fit and, if applicable, get at least two reviews; authors choose whether their paper appears in the proceedings
- 2025 proceedings in the ACL Anthology (5 papers); 2026 preliminary proceedings posted on the workshop site
- 'Editions: Hanoi, Vietnam (INLG 2025, one day) and Utrecht, Netherlands (INLG 2026, workshop day plus hackathon day)'
- No travel funding for participants
- Not listed in ICORE2026 and not on the CCF list
