notes:
- Sponsored by the IEEE Vehicular Technology Society (VTS) and hosted by its South African chapter, with SAIEE and the Sentech Research & Innovation Collaborative Network
- The newest VTS conference series, started in 2018; the 2025 edition was the third
- 3rd edition (WAC 2025) held at the University of Pretoria Future Africa campus, Pretoria, South Africa
- Covers terrestrial, satellite and vehicular wireless communications, spectrum, IoT, ML/AI for communications
- 5-page papers in IEEE conference format; up to 2 extra pages at 100 USD each
- Papers are published in the WAC proceedings and submitted to IEEE Xplore
- Not listed in ICORE2026 or in the CCF 2026 list
