notes:
- National Chinese theory conference sponsored by the China Computer Federation (CCF) and run by its Technical Committee on Theoretical Computer Science with a local host university
- Topics include computational complexity, algorithms and data structures, logic and program theory, models of computation (quantum, economics, bioinformatics) and theory of AI and data science
- Accepts Chinese or English papers; English papers go to a Springer CCIS volume of revised selected papers, Chinese papers are recommended to Chinese journals
- Also invites talks on papers already published at top venues; those are presented but not included in the proceedings
- "NCTCS 2025 (43rd edition) CCIS volume 2710: 10 papers selected from 83 submissions"
- Held in a different Chinese city each year (Yinchuan 2021, Changchun 2022, Guangzhou 2023, Qingdao 2024, Kunming 2025, Jinhua 2026)
- Not listed in ICORE2026 or the CCF 2026 list
