notes:
- Workshop on autonomous, goal-driven AI agents and LLM-based agents for software testing, verification and validation, co-located with IEEE ICST
- First held at ICST 2026 in Daejeon (2026-05-18), hybrid with remote attendance
- Regular papers up to 8 pages, short papers up to 4 pages, extended abstracts up to 2 pages for tools, visions and hands-on sessions (IEEE format)
- Single-blind review by two or three PC members; accepted papers appear in the ICST Workshop Proceedings
- 2nd edition announced for ICST 2027 in San Sebastian, Spain
- Not listed in the ICORE2026 portal or the CCF 2026 list
