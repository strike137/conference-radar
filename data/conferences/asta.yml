notes:
- New workshop on autonomous, goal-driven AI agents and LLM-based agents for software testing, verification and validation
- First edition in 2026, co-located with IEEE ICST in Daejeon; hybrid, with remote attendance possible
- Regular papers up to 8 pages, short papers up to 4 pages and 2-page extended abstracts for tools, vision and hands-on sessions (references included), IEEE format
- Single-blind review by two or three PC members
- Accepted papers published in the ICST workshop proceedings
- Not among the ICST 2027 workshops yet (workshop proposals due 2026-11-04); not listed in ICORE2026 or the CCF 2026 list
