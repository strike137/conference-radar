notes:
- Organized by IARIA as part of the DigitalWorld congress, co-located with ICDS, SMART ACCESSIBILITY and other IARIA events (12th edition in 2027)
- Covers sensors, actuators, metering and sensing technologies
- Published open access in the IARIA ThinkMind library (ISSN 2519-836X); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in France, Portugal, Italy or Spain (Nice, Porto, Venice, Barcelona, Lisbon in recent years)
- Onsite and online participation options
