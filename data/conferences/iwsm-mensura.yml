notes:
- Joint conference of IWSM (since 1990) and Mensura (since 2006), held together since 2007
- Moves between countries each year; recent editions in Izmir (2022, 2026), Rome (2023) and Montreal (2024)
- No edition was held in 2021 or 2025
- Proceedings published in CEUR-WS (2024 edition is CEUR-WS Vol-3852)
- Strong industry participation; the call says 50 to 60 percent of participants come from industry
- Regular papers at least 10 pages, short papers 5 to 9 pages, extended abstracts also accepted; submission via EasyChair
- Journal First track talks are not included in the proceedings
- 2026 edition (34th IWSM, 19th Mensura) was organized by Izmir Institute of Technology
- In 2024 COSMIC workshops and a PMI day ran from 2024-09-30 to 2024-10-02 before the two main conference days
