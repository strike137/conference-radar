notes:
- One-day ICSE workshop on the quality of empirical and secondary studies in software engineering (study design, statistics, threats to validity)
- Held with ICSE since 2024; Lisbon 2024, Ottawa 2025, Rio de Janeiro 2026 (3rd edition), Dublin 2027
- Technical papers 6-8 pages, experience reports and work in progress 4-6 pages, vision and position papers 2-4 pages
- 2026 required a mandatory abstract one week before the paper deadline
- 2025 proceedings in IEEE Xplore, 2026 workshop proceedings by ACM, 2027 workshop proceedings by IEEE
- 2027 edition places special emphasis on human-in-the-loop AI-powered software engineering
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
