notes:
- Satellite workshop of ACNS (Applied Cryptography and Network Security); 1st edition in 2026
- 'Topics: security and privacy of 5G/6G and beyond, cellular protocols, and post-quantum schemes for NextG networks'
- Workshop papers go into the ACNS workshops volume in Springer LNCS; separate call for talk proposals (no full
  paper needed)
- ACNS requires at least one author per workshop paper to register at the author rate for the main conference
- Location follows ACNS, which rotates worldwide (2026 Stony Brook, USA; ACNS 2027 at Royal Holloway, UK)
