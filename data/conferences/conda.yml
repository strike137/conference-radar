id: conda
name: CONDA
full_name: Workshop on Data Contamination
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: irregular
organizer: Oscar Sainz, Iker Garcia-Ferrero, Eneko Agirre (HiTZ, University of the Basque Country), Jon Ander Campos
  (Cohere), Alon Jacovi, Yoav Goldberg (Bar-Ilan), Yanai Elazar (AI2 / UW); co-located with ACL 2024
organizer_country: [international]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [5]
  conference_months: [8]
links:
  website: https://conda-workshop.github.io/
notes:
- Workshop on detecting, preventing and addressing evaluation data contamination in LLMs
- Only one edition so far (1st, at ACL 2024 in Bangkok)
- Regular papers up to 8 pages go in the proceedings in the ACL Anthology; non-archival papers and 2-page extended
  abstracts also accepted
- Double-blind review on OpenReview; also took ACL Rolling Review commitments
- Ran a shared task collecting contamination evidence, summarized in a compilation paper
- Not listed in ICORE2026 and not on the CCF list
