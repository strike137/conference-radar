id: privatenlp
name: PrivateNLP
full_name: Workshop on Privacy in Natural Language Processing
type: workshop
tier: minor
areas: [nlp, security]
region: worldwide
language: english
frequency: annual
organizer: Academic organizing committee; co-located with ACL, NAACL or EMNLP
organizer_country: [international]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [1, 3]
  conference_months: [5, 7]
links:
  website: https://sites.google.com/view/privatenlp/home
notes:
- First held at WSDM 2020, then with EMNLP 2020, NAACL 2021, NAACL 2022, ACL 2024 (Bangkok), NAACL 2025 (Albuquerque) and ACL 2026 (San Diego); no edition in 2023
- Archival papers appear in the ACL Anthology; a non-archival track is shown only on the workshop website
- Long (8 pages) and short (4 pages) papers with double-blind review via OpenReview
- Fast-track for papers already reviewed by ACL, EMNLP, EACL or ARR; accepted ACL Findings papers can also be presented
- Hybrid with Zoom participation
- Not listed in the CORE ICORE2026 portal
