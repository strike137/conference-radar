notes:
- Run by the SoCS council, an unincorporated volunteer association with an international board
- Proceedings archived in the AAAI Digital Library (ojs.aaai.org) since 2010, free to download
- CORE B (ICORE2026), not in the CCF 2026 list; the main venue for heuristic search, path finding and search-based planning
- Usually held next to a larger AI venue (IJCAI, ICAPS, AAAI, CP); Europe and North America in recent years
- Long papers 8 pages and short papers 4 pages plus references, double-blind; also position papers of the same
  lengths and 2-page extended abstracts
- Mandatory abstract registration in EasyChair one week before the paper deadline
