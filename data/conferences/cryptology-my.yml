notes:
- Organized by MSCR (Malaysian Society for Cryptology Research) with CyberSecurity Malaysia and INSPEM-UPM; held
  every two years in Malaysia since 2008 (online in 2020; Cyberjaya 2024, Kota Kinabalu 2026)
- Proceedings indexed in Scopus since 2014; in 2024 selected papers were also offered publication in the International
  Journal of Cryptology Research (MSCR's journal)
- Regional venue centred on the Malaysian cryptology community; the paper deadline was extended by one month in
  2024 and by two months in 2026
- 2026 registration packages bundled hotel rooms and a Kundasang (Mount Kinabalu) tour
- 2024 edition ran as part of Malaysia Cryptology Week together with a cryptography school (CRYPTOS) and the SEA-PQC
  summit
