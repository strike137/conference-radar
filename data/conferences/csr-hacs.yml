notes:
- Workshop of the IEEE International Conference on Cyber Security and Resilience (IEEE CSR); not the High Assurance Crypto Software workshop (hacs)
- Held with IEEE CSR every year since at least 2023 (Venice 2023, London 2024, Chania 2025, Lisbon 2026)
- Topics are hardware security, side channels, hardware Trojans, lightweight crypto hardware and secure firmware
- Papers go into the IEEE CSR proceedings in IEEE Xplore; 6 pages plus up to 2 extra pages with overlength charges
- In person only in 2025 and 2026 (hybrid in 2023); two sessions on Wednesday 5 Aug in 2026
- Deadlines were extended by about three to four weeks in 2025 and 2026
- Not listed in CORE ICORE2026 or the CCF list
