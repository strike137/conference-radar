notes:
- Volunteer-run Security BSides conference in Leeds, UK, held since 2018 and annual again since 2023
- One Saturday in June; 2027 edition at Cloth Hall Court, Leeds
- Two main tracks plus a 101 track aimed at first-time speakers, with speaker mentoring on request
- Call for papers opens in March and closes around the end of March; blind review by a panel of experienced speakers
- More than 80 speakers submitted to the 2026 call for papers
- Villages such as lockpicking, car hacking and battlebots, a conference badge and a scavenger hunt
- Very low ticket price (10 GBP plus Eventbrite fees in 2025) released in several ticket drops; 2026 sold out
- Talks are posted on YouTube, no proceedings
