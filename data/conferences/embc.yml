notes:
- Annual flagship conference of the IEEE Engineering in Medicine and Biology Society (EMBS); billed as the largest
  international biomedical engineering conference
- Full contributed papers are published in IEEE Xplore and indexed in PubMed MEDLINE; 1-page poster papers are not
  published
- From 2027 full papers are limited to 4 pages of content plus 1 page of references (max 20 references)
- Single-blind review; strict no-show policy, and deadlines are not extended
- Selected top papers (about 7%) invited to a special issue of IEEE TBME
- Held worldwide in July (Glasgow 2022, Sydney 2023, Orlando 2024, Copenhagen 2025, Toronto 2026, Singapore 2027)
- Not listed in CORE ICORE2026 or the CCF 2026 list
