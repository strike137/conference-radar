notes:
- Workshop for PL researchers and practitioners using the Rocq Prover, with members of the core Rocq development team
- Called CoqPL until 2025 (11th edition in 2025); renamed RocqPL from 2026 after Coq was renamed Rocq
- Co-located with POPL every January; location follows POPL (London 2024, Denver 2025, Rennes 2026, Mexico City 2027)
- Submissions are 1 to 2 page extended abstracts (ACM SIGPLAN two-column style suggested), single-blind review via HotCRP
- No papers are published, so work can later go to full conferences; presentations may be recorded and posted
- Not listed in CORE ICORE2026 (under RocqPL or CoqPL); not in the CCF 2026 list
