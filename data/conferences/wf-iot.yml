id: wf-iot
name: IEEE WF-IoT
full_name: IEEE World Forum on Internet of Things
type: conference
tier: minor
areas: [networking, communications, security, ai, systems]
region: worldwide
language: english
frequency: annual
organizer: IEEE IoT Technical Community (financially co-sponsored by several IEEE societies, including ComSoc, CAS,
  PES and IES); 2026 local organizer Khalifa University
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
indexing: [IEEE Xplore]
rank:
  core: Unranked
fee: Full author registration 800 USD IEEE member, 850 USD non-member (2026, incl. 5% VAT, covers up to 2 papers);
  limited author registration 650/700 USD
typical:
  deadline_months: [4, 5, 6]
  conference_months: [10, 11]
links:
  website: https://wfiot2026.iot.ieee.org/
notes:
- Annual IEEE IoT conference run under the IEEE IoT Technical Community, first held 2014 in Seoul (no edition in
  2017)
- 'Rotates worldwide: Yokohama 2022, Aveiro 2023, Ottawa 2024, Chengdu 2025, Abu Dhabi 2026'
- Proceedings in IEEE Xplore; not ranked by CORE or CCF
- Besides technical papers it has workshops and special sessions (6-page papers, later deadline), industry forums,
  and IEEE WICE student travel grants of up to 1000 USD for student co-authors
- In Aug 2026 organizers allowed virtual presentation for authors unable to travel because of documented government
  or institutional restrictions
