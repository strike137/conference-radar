notes:
- Academic security conference run by the Cybersecurity Centre of Excellence at UEM Kolkata, India
- The 2026 edition is billed as the 8th eHaCON (2nd edition of 2026) with the theme Cyberchain (blockchain, AI and cyber resilience)
- Accepted and presented papers published in Springer Lecture Notes in Networks and Systems (LNNS), indexed by Scopus
- Double-blind review via Microsoft CMT; full papers at least 10 pages in the Springer LNNS Word template, similarity at most 10%
- Hybrid event at UEM, New Town, Kolkata
- Not listed in ICORE2026 or the CCF 2026 list
