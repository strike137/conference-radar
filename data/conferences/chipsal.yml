id: chipsal
name: CHiPSAL
full_name: Workshop on Challenges in Processing South Asian Languages
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: irregular
organizer: Workshop chairs from the University of Jaffna (Sri Lanka), IIT Delhi (India), Kathmandu University (Nepal), Virginia Tech (USA) and Mohammad Ali Jinnah University (Pakistan); co-located with COLING 2025 and LREC 2026
organizer_country: [other, india, usa]
proceedings: ACL Anthology
indexing: [ACL Anthology]
acceptance_rate: About 50% (2026, 21/42 main track)
typical:
  deadline_months: [11, 2]
  conference_months: [1, 5]
links:
  website: https://sites.google.com/view/chipsal
notes:
- Workshop on NLP and language resources for South Asian languages (encoding and scripts, morphology, dialects,
  code-mixing, speech, LLMs)
- First edition with COLING 2025 (virtual, January 2025); second with LREC 2026 in Palma, Spain (hybrid, May 2026)
- Proceedings in the ACL Anthology (40 papers in 2025, 33 in 2026)
- Long papers 8 pages, short papers 4 pages; double-blind review via START, three reviews per paper
- Also accepts papers rejected by ARR, LREC main or EACL 2026 if submitted with their reviews
- Runs a shared task (2026 multimodal hate and sentiment understanding in Nepali memes)
- Also organizes regional symposia (Jaffna, July 2026)
- Not listed in the CORE ICORE2026 portal or on the CCF list
