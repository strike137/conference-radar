id: icta-vn
name: ICTA
full_name: International Conference on Advances in Information and Communication Technology
type: conference
tier: minor
areas: [ai, security, vision, nlp, data, general]
region: southeast-asia
language: english
frequency: annual
organizer: Thai Nguyen University of Information and Communication Technology (ICTU), with a host university that rotates each year
organizer_country: [vietnam]
proceedings: Springer LNNS
archival: true
indexing: [Scopus]
typical:
  deadline_months: [6, 7]
  conference_months: [11, 12]
links:
  website: https://icta-conf.com/
notes:
- Run by ICTU (Thai Nguyen University) with a rotating Vietnamese co-host (2023 ICTU Thai Nguyen, 2024 Hung Vuong University Phu Tho, 2025 VNU ITI Hanoi, 2026 Hai Phong University)
- Partners include FISU (Vietnam ICT Club of Faculties, Institutes, Schools and Universities), JAIST and the Institute of Information Technology of VAST
- Proceedings in Springer Lecture Notes in Networks and Systems (LNNS), indexed in Scopus
- First edition in 2016, then yearly since 2023 (5th edition in 2026)
- Broad ICT scope (AI, LLMs, vision, cybersecurity, smart cities, IoT, semiconductors); double-blind review, Springer format, 8 pages plus up to 2 paid extra pages, submission via EasyChair
- 179 submissions reported for the 2023 edition
- Deadlines are usually extended by about two weeks
- Not listed in ICORE2026 or the CCF 2026 list
- Not the same as IEEE ICTA (Integrated Circuits, Technologies and Applications)
