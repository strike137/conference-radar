notes:
- Annual ACM SIGGRAPH sponsored conference on 3D graphics on the Web, WebXR and the metaverse, held since 1995 (first as
  the VRML Symposium)
- Accepted papers and poster summaries are published in the conference proceedings in the ACM Digital Library
- Full papers (10 pages), short papers (4 pages), posters and industrial use cases share one deadline; blind peer review
- Best papers are invited to submit extended versions to the Computers & Graphics journal
- Recent editions mostly in Europe (Evry 2022, San Sebastian 2023, Guimaraes 2024, Siena 2025), then Doha 2026; hybrid
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
