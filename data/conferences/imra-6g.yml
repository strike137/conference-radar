notes:
- Workshop on movable antennas and reconfigurable antennas for wireless communication and sensing
- Co-located with the IEEE ComSoc flagships, alternating between ICC and GLOBECOM
- 3rd edition at GLOBECOM 2025 (Taipei), 4th at ICC 2026 (Glasgow), 5th at GLOBECOM 2026 (Macau)
- Steering committee includes Rui Zhang (NUS), Robert Schober (FAU), Naofal Al-Dhahir (UT Dallas) and Zhiguo Ding
- Workshop papers go into the ICC or GLOBECOM proceedings and IEEE Xplore; no-show papers are removed
- Different series from the GLOBECOM Fluid Antenna System (FAS) workshop
- Not listed in ICORE2026 or in the CCF 2026 list
