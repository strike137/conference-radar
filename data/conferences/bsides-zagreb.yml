notes:
- Community-driven, non-profit Security BSides event in Zagreb, Croatia, run by a group of infosec volunteers
- Held every year since at least 2023 (archive pages for 2023 to 2026); one day of technical talks, two tracks since 2025
- 2023 and 2024 editions were powered by SRCE (University of Zagreb University Computing Centre)
- Talks are 40 minutes plus 5 minutes of questions; marketing and non-technical commercial talks are not accepted
- Supporter tickets sold through Entrio
- No proceedings
