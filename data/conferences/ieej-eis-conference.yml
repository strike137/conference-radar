notes:
- Annual national conference of the IEEJ Electronics, Information and Systems Society (C部門), held at a Japanese university each late August
- Broad EECS scope (devices, circuits, control, communications, information systems, AI, signal processing, robotics)
- General sessions, organized sessions, a student poster session (2-page papers, masters and undergraduates) and an English Student Competition Session
- Talk registration in mid May (extended by one week in 2025 and 2026), manuscripts due mid June; organized session proposals in March
- Proceedings book with CD-ROM sold for 13,000 JPY; awards for young presenters and student posters
