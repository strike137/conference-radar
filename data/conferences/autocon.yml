notes:
- Practitioner conference on network automation, orchestration and observability, run by the Network Automation
  Forum (Network Automation Forum LLC, founded by Chris Grundemann and Scott Robohn)
- Twice a year, alternating between North America (fall) and Europe (spring) since AutoCon 0 in Denver in 2023
- Talks chosen from a call for speakers (about 100 submissions for about 30 slots); no product pitches, talks
  only, no papers
- Two days of paid hands-on workshops (Monday and Tuesday) precede the conference, which runs from Wednesday afternoon to Friday noon
- 'Past venues: Denver 2023, Amsterdam 2024, Denver 2024, Prague 2025, Austin 2025, Munich 2026'
