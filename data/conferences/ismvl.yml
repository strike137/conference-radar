notes:
- Held annually since 1971 by the IEEE Computer Society Technical Community on Multiple-Valued Logic
- All accepted papers published by IEEE; proceedings indexed in Scopus and Ei Compendex
- Papers up to 6 pages in IEEE format; research, survey and tutorial papers; selected papers invited to journals
- Co-located with the International Workshop on Post-Binary ULSI Systems (and the Reed-Muller Workshop in 2027)
- 'Rotates among Japan, North America and Europe: Shimane (2023), Brno (2024), Montreal (2025), Sendai (2026), Kongsberg (2027)'
- Small, specialized venue covering logic design, circuits, computer arithmetic, fuzzy logic and quantum computing
