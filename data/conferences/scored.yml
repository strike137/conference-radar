notes:
- First academic venue focused only on software supply chain security; started in 2022 as an ACM CCS workshop
- Workshop co-located with ACM CCS from 2022 to 2025 (Los Angeles, Copenhagen, Salt Lake City, Taipei); renamed a
  conference in 2026 and co-located with OpenSSF Community Day Europe in Prague
- Proceedings of the 2022 to 2025 editions published by ACM (2025 volume doi 10.1145/3733827)
- Two tracks -> research papers (original work or SoK, double-column ACM format, 11 pages incl. references in 2026)
  and 20-minute security-in-practice talks with a 2-page abstract
- Double-blind review; mixes academic, industry, open source and policy participants
- Not listed in ICORE2026
