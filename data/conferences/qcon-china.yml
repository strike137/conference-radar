notes:
- China editions of the QCon practitioner software conference, run by InfoQ China, part of Geekbang Technology; held
  in China since March 2007
- Two editions a year, Beijing in April and Shanghai in October
- 2026 Shanghai tracks were mostly on AI engineering (agents, AI native architecture, AI-driven software engineering,
  SRE, AI infra, security, data systems)
- Invited and proposed talks by industry engineers; no paper submission and no proceedings
- Paid tickets; prices not listed on the edition page
- Not in the CORE ICORE2026 portal or the CCF 2026 list
