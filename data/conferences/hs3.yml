id: hs3
name: HS3
full_name: Workshop on Hardware-Supported Software Security
type: workshop
tier: minor
areas: [security, systems]
region: europe
language: english
frequency: annual
organizer: Program chairs from IRISA/CentraleSupelec/Inria, CNRS and Universite Libre de Bruxelles, co-located with
  ESORICS
organizer_country: [europe]
proceedings: Springer LNCS
archival: true
acceptance_rate: 50% (2025, 3 regular and 4 short papers from 14 submissions)
typical:
  deadline_months: [6]
  conference_months: [9]
links:
  website: https://hs3-workshop.github.io/
notes:
- Co-located with ESORICS since its first edition in 2025 (Toulouse); 2nd edition in 2026 (Rome)
- Springer LNCS post-proceedings, published in the ESORICS workshops volumes
- Regular papers up to 20 pages, short, position, WiP and idea papers up to 10 pages, LNCS format incl. references
- Anonymisation not required (follows the ESORICS rules); submitted through the ESORICS EasyChair site, selecting the
  HS3 track
- Topics include TEEs and enclaves, micro-architectural and software side-channel attacks, hardware-assisted monitoring
  and hardware/software security contracts
- One-day workshop; at least one author must attend
- Not listed in ICORE2026
