notes:
- One-day workshop held with ACM SIGMOD/PODS every year since 2018, so it moves with SIGMOD (2025 Berlin, 2026 Bengaluru)
- 'Scope: using AI techniques inside data management systems (natural language interfaces, learned query optimization and tuning, generative AI for enterprise data workloads)'
- Full papers up to 12 pages plus references; shorter 4 or 8 page papers are encouraged
- Double-blind review via EasyChair, ACM SIGMOD format
- Accepted papers are published in the ACM Digital Library (proceedings for every edition since 2018 are linked from the site)
- 9th edition in 2026
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
