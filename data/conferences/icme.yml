notes:
- Flagship multimedia conference since 2000, jointly sponsored by four IEEE societies (CAS, ComSoc, Computer
  Society, SPS)
- Main track, special session, industry, workshop, demo and grand challenge papers all go to IEEE Xplore and are
  indexed by EI Compendex
- Main track papers have an author rebuttal phase; camera-ready limit of 6 pages (2026)
- One author full registration covers up to two papers, and every paper must be presented in person
- Venue rotates worldwide (Taipei 2022, Brisbane 2023, Niagara Falls 2024, Nantes 2025, Bangkok 2026, Xiamen 2027)
- Rated A in ICORE2026 and B in the CCF list
