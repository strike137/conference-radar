notes:
- One-day Saturday security engineer conference run by the Japan Hacker Association, held every July (editions found for 2024 to 2026)
- In person only at Akihabara UDX, Tokyo; no online streaming
- Public call for presentations closing at the end of May; 12 proposals received and 5 accepted in 2026
- Talks and workshops in Japanese across several tracks, plus sponsor sessions and an evening networking party
- 2025 theme "AI, hackers and beyond"; 2026 theme cyber defense, aimed at engineers, academics and defense professionals
- No papers or proceedings
