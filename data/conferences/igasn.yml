notes:
- Workshop on integrating terrestrial, aerial and satellite networks (architecture, channel modelling, interference, mobility and resource management, standardization)
- Co-located with IEEE WCNC; first edition at WCNC 2025 (Milan), second at WCNC 2026 (Kuala Lumpur, full day)
- Organizers from BUPT, Zhejiang University, Linkoping University, Australian National University, King's College London and others
- Accepted and presented papers go into the WCNC workshop proceedings in IEEE Xplore; no-show papers are removed
- Not in the IEEE WCNC 2027 call for workshop papers (checked 2026-10-17)
- Not listed in ICORE2026
