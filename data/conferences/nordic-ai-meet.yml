notes:
- Annual symposium for PhD students, postdocs and early-career AI researchers in the Nordic countries
- Run by the Nordic AI Partnership of NORA (Norway), Pioneer Centre P1 (Denmark), FCAI (Finland), WASP (Sweden) and CADIA (Iceland)
- Abstract-based call for oral and poster presentations; abstracts accepted only from researchers affiliated with a Nordic institution
- Non-archival; accepted abstracts are posted on the conference website
- Started in Norway in 2021 and rotates through the Nordic countries; 2026 hosted by CADIA at Reykjavik University, 2027 returns to Norway
- About 100 attendees, 24 oral talks and 43 posters in 2026
- "Registration fee 2026: 28,000 ISK for PhD students and postdocs, 35,000 ISK regular"
