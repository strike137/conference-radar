id: icar
name: ICAR
full_name: International Conference on Advanced Robotics
type: conference
tier: minor
areas: [ai, general]
region: worldwide
language: english
frequency: biennial
organizer: IEEE Robotics and Automation Society (IEEE RAS) with a local host institution
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [7, 8]
  conference_months: [12]
links:
  website: https://icar2025.inaut.unsj.edu.ar/
notes:
- Long-running robotics conference held since 1983, now every two years (2025 San Juan, 2027 Zagreb)
- Covers all areas of robotics (vision, cognitive robotics, humanoids, HRI, multi-robot, aerial and underwater robots, learning, control)
- Listed by IEEE RAS among its sponsored conferences; the 2025 call says technically co-sponsored, the 2025 home page says supported technically and financially
- Full papers 6 pages including references (up to 2 extra pages for a fee), IEEE format, submitted via PaperPlaza; optional 1-minute video
- Accepted papers are published in IEEE Xplore
- 2025 (22nd edition) was hosted by the Instituto de Automatica (INAUT), Universidad Nacional de San Juan, Argentina, with a special session on mining and robotics
- Not listed in CORE ICORE2026 and not on the CCF 2026 list
