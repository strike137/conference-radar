notes:
- IFAC conference series on hybrid dynamical systems, cyber-physical systems, verification and control; meets control, computer science and applied mathematics
- Held every three years since 2003 (Saint-Malo 2003 to Boulder 2024); the 9th edition is in 2027
- Location rotates between Europe and the USA (Eindhoven 2012, Atlanta 2015, Oxford 2018, Brussels 2021, Boulder 2024)
- Accepted and presented papers are published in the open access IFAC-PapersOnLine series; NAHS extended abstracts are not
- Regular papers up to 8 pages at submission, 6 pages in the proceedings; optional repeatability evaluation (2024)
- Not listed in ICORE2026 or the CCF 2026 list
