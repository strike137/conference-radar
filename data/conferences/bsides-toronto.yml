notes:
- Security BSides conference in Toronto, Canada, running since 2013
- Two days in October; 2026 edition at the Ted Rogers School of Management, Toronto Metropolitan University
- In-person talks only, 25 minute slots including Q&A; preference given to speakers from the Greater Toronto Area
- Saturday talks are recorded; Sunday talks are not recorded and follow the Chatham House Rule
- Activities include Hak4Kidz, a CTF, an OSINT search party, a TOOOL lockpicking village and a physical security village
- Talks only, no proceedings
