id: iswc
name: ISWC
full_name: International Semantic Web Conference
type: conference
tier: top
areas: [data, ai]
region: worldwide
language: english
frequency: annual
organizer: SWSA (Semantic Web Science Association)
organizer_country: [international]
proceedings: Springer LNCS
indexing: [Scopus, DBLP]
rank:
  core: A
  ccf: B
acceptance_rate: 20% (2025 research track, 34/171)
fee: 810 EUR regular / 670 EUR academic / 500 EUR student, early, excl. 22% VAT (2026)
typical:
  deadline_months: [4, 5]
  conference_months: [10, 11]
links:
  website: https://iswc2026.semanticweb.org/
  dblp: https://dblp.org/db/conf/semweb/
  wikicfp: http://www.wikicfp.com/cfp/program?id=1769
notes:
- Flagship venue of the Semantic Web and knowledge graph community; research, resource and in-use tracks share one
  Springer LNCS volume set
- Research track uses dual-anonymous review with a rebuttal phase and mandatory abstract pre-submission about one
  week before the full paper (Resource and In-Use tracks were single-anonymous in 2025)
- 'Rotates worldwide: Baltimore (2024), Nara, Japan (2025), Bari, Italy (2026); ISWC 2027 is planned for Oct/Nov
  2027, location to be announced'
- Since SWSA took over ESWC, rejected research-track papers can be resubmitted between ISWC and ESWC together with
  their reviews
- Posters and demos, workshops and doctoral consortium papers are published in CEUR-WS
