notes:
- Commercial AI and data science practitioner conference in Boston run by ODSC AI, sister event of ODSC AI West;
  ODSC has run since 2015
- Tracks on agentic AI, LLMs and RAG, AI engineering and MLOps, data science, data engineering and AI for robotics, plus
  hands-on trainings, an expo and the co-located AI X Leadership Summit
- Call for speakers in two rounds (January and March deadlines for 2027); accepted speakers get a complimentary
  conference pass
- 2026 edition held at the Hynes Convention Center, Boston
- No papers or proceedings; in-person passes include the virtual conference
- Not listed in the CORE ICORE2026 portal
