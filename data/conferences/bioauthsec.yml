notes:
- One-day affiliated workshop of ASIACRYPT 2025 on biometric authentication, spoofing detection, template protection and bio-cryptography
- Two streams, peer-reviewed papers (may be recommended to a Sensors special issue) and presentations of published work, abstracts, work in progress or industrial contributions
- 'Non-archival: the workshop has no formal proceedings, so papers can be submitted elsewhere later'
- Springer LNCS format, no strict page limit (about 15 to 20 pages encouraged)
- In 2025 low submission numbers led the organizers to accept in-scope papers after a desk review without full peer review
- 'Registration fee: 160 USD (2025, workshop only)'
- Program of two invited keynotes and short contributed talks
