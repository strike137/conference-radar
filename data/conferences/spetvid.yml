- Focus on security and privacy of multimodal data (text, images, audio, video, sensor streams) and multimodal AI, including PETs, deepfakes and adversarial attacks
- 2026 chairs from University of Galway (Ireland) and Keele University (UK)
- Not listed in CORE ICORE2026
