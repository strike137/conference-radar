id: icmlca
name: ICMLCA
full_name: International Conference on Machine Learning and Computer Application
type: conference
tier: minor
areas: [ai, general]
region: china
language: english
frequency: annual
organizer: CAAI Technical Committee on Natural Computing and Digital Intelligent City with the Hangzhou company Heshan Shuzhi (2026), conference service by AiScholar (ais.cn)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 570 USD or 3800 CNY per 4-page paper, 510 USD early bird, 540 USD student (2026); 60 USD per extra page
typical:
  deadline_months: [9]
  conference_months: [10, 11]
links:
  website: http://www.icmlca.org/
notes:
- Smaller commercially organized Chinese conference series running since 2020, with a different host university each year
- Held in China every year (Shangri-La 2020, Shenyang Ligong University 2021 and 2022, Zhejiang University of Technology 2023, Hangzhou 2024, Shenzhen 2025, Hangzhou 2026)
- 2026 accepted papers published by IEEE (ISBN 979-8-3195-2722-6) and submitted to IEEE Xplore, EI Compendex and Scopus; the 2020 volume went to IOP Journal of Physics Conference Series
- Each paper reviewed by two or three reviewers, per the site; abstract-only submissions and listener registration are also accepted
- 2025 edition hosted by Shenzhen Technology University in hybrid mode with 78 posters
- Not listed in ICORE2026 or the CCF list
