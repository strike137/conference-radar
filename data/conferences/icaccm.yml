notes:
- Organized by Tula's Institute (now TULAS University), Dehradun, Uttarakhand, India; every edition so far held in Dehradun
- Technically co-sponsored by IEEE UP Section (R10); accepted papers are submitted to IEEE Xplore
- Held every two years so far (2020, 2022, 2024, 2026)
- Broad scope covering computing, communication systems and materials science
- Reviewing via Microsoft CMT; the 2026 edition is physical mode only
- "Registration fee 2026: INR 7,000 to 12,000 for Indian participants, USD 200 to 300 for foreign participants"
- Not listed in ICORE2026 or CCF
