notes:
- Workshop on decentralized information access, privacy-preserving search and recommendation over user-controlled data (Solid PODs, dataspaces, federated learning)
- 1st edition with The Web Conference 2024 in Singapore (13 May 2024), 2nd with ACM CIKM 2025 in Seoul (14 November 2025, half day)
- 2025 short papers up to 4 pages in ACM sigconf format, double-blind review via EasyChair; camera-ready in CEURART style
- Organized by the University of Southampton (Thanassis Tiropanis) and Birkbeck, University of London (George Roussos)
- Not listed in CORE ICORE2026 or the CCF 2026 list
