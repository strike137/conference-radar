notes:
- EAI conference series on context-aware and emotion-aware systems, annual since 2012
- Nearly always hosted in Vietnam (Ho Chi Minh City 2023 and 2025, Da Lat 2024); 2020 to 2022 and 2024 to 2025 ran fully online
- Proceedings in Springer LNICST; selected papers invited to Mobile Networks and Applications (MONET)
- Late track with a deadline after the main track closes
- Not listed in the ICORE2026 CORE portal
