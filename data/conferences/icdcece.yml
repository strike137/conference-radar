links:
  website: https://icdcece.in/
notes:
- Organized by Ballari Institute of Technology and Management, Ballari, Karnataka, India
- Held every year since 2022; 2027 is the 6th edition
- Proceedings of the 2022 to 2026 editions are in IEEE Xplore (linked from the official site)
- Broad scope covering computer engineering, electrical engineering and electronics
- Double-blind review via Microsoft CMT; papers 4 to 8 pages; in-person presentation required under the IEEE no-show policy
- "Fee: Rs. 5,000 to 8,500 for Indian authors, 150 to 250 USD for foreign authors (2027)"
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
