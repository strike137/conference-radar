notes:
- Theory-oriented venue for formal security models, protocol analysis and verification; started in 1988 as a workshop
  (CSFW), a symposium since 2007
- Three submission cycles per year (summer, fall, winter); double-blind; accept, reject or major revision (resubmit
  within the next two cycles)
- CSF 2027 (40th) will be held in Tokyo, Japan, 13 to 17 September 2027; next deadline is the fall cycle on 15 October
  2026
- Proceedings by IEEE Computer Society; student travel grants offered; papers lacking foundational aspects risk
  desk rejection
