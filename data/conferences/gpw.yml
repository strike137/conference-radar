notes:
- Annual workshop on game informatics held almost every year since 1994, run by IPSJ SIG GI (Game Informatics)
  since 1999; 2026 is the 31st edition
- Topics include game-playing programs (shogi, Go, puzzles, imperfect-information games, Werewolf), combinatorial
  game theory, reinforcement learning and LLMs applied to games
- Single-blind review of a 2-page extended abstract; accepted authors submit a camera-ready paper of up to 8 pages,
  published in the IPSJ Symposium Series
- Residential workshop, usually at Hakone Seminar House in Kanagawa, hybrid since 2022; presenters are expected
  on site; fee includes lodging and meals
- Papers in Japanese or English, but more than 90% of talks are in Japanese
- Best Paper, Best Poster and student Research Encouragement awards
- Not listed in ICORE2026
