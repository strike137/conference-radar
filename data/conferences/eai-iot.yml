links:
  website: https://sites.google.com/view/eai-iot-2026/home
notes:
- Co-located workshop of ICCCN (International Conference on Computer Communications and Networks), started in 2025
- Topics are edge AI architectures, federated learning, communication protocols and resource management for IoT
- 6-page papers in IEEE double-column format; accepted and presented papers appear in the ICCCN proceedings and IEEE Xplore
- One author must register at the full rate and present in person
- Follows ICCCN; 2025 in Tokyo, 2026 in Honolulu
- Not listed in ICORE2026
