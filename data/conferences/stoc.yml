notes:
- Flagship conference of ACM SIGACT and, with FOCS, the top venue for theoretical computer science
- Proceedings in the ACM DL
- Run as TheoryFest, a week of talks, workshops and tutorials around the paper sessions
- Mostly held in North America with some editions in Europe (Rome 2022, Prague 2025)
- STOC 2027 is part of ACM FCRC in Atlanta and adds a TCS+AI day
- CORE A* (ICORE2026), CCF A
