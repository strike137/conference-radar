notes:
- Started in 2005 as the International Conference on Mobile Ad-hoc and Sensor Networks; renamed Mobility, Sensing
  and Networking; 2026 is the 22nd edition
- CCF C; proceedings published by IEEE in IEEE Xplore (2020 to 2025 editions); the 2026 site states accepted papers
  go to EI Compendex
- Held every December, mostly in China (2023 Nanjing, 2024 Harbin, 2026 Ningbo), sometimes abroad (2020 Tokyo, 2021
  Exeter, 2025 Bandung)
- 8-page limit at submission, up to 10 pages in camera-ready with extra fees; double-blind from 2026 (2025 was single-blind)
- Deadlines are usually extended by about 10 to 14 days
