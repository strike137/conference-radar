notes:
- Workshop on annotator disagreement, human label variation and meaning in context in NLP datasets
- Single edition so far, with COLING 2025 in Abu Dhabi (January 19, 2025)
- Long (8 pages) and short (4 pages) archival papers plus non-archival abstracts and already published work
- Included a shared task on predicting median judgments and disagreement in ordinal Word-in-Context annotations
- Proceedings in the ACL Anthology (2025.comedi-1, 16 papers)
- Not listed in ICORE2026 and not on the CCF list
