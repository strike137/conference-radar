notes:
- New international navigation conference of the IEEE Aerospace and Electronic Systems Society; the first edition is in Munich in December 2026
- Covers satellite, terrestrial and sensor based navigation, data fusion, signal processing and machine learning, safety and cybersecurity, and applications from aviation to pedestrians
- Full papers of up to 6 pages in IEEE format with full peer review by the TPC
- Accepted and presented papers are submitted to IEEE Xplore and indexed by EI Compendex; registration and in-person presentation are required
- Best Student and Best Conference paper awards; selected papers are invited to a special issue of IEEE Aerospace and Electronic Systems Magazine
- Chairs from Northeastern University, University of Malaga, Politecnico di Torino and Ohio State University
- Navigation venue outside the usual CS rankings, not listed in ICORE2026 or the CCF 2026 list
