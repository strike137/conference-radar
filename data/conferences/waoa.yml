notes:
- Standalone peer-reviewed venue on approximation and online algorithms despite the "Workshop" name; CORE B
- Held every year as part of ALGO together with ESA, IPEC, ATMOS, ALGOWIN, ALGOCLOUD and WABI, so always in Europe
- Proceedings published by Springer in LNCS; selected papers may be invited to a special issue of Acta Informatica
- Submissions up to 10 pages plus appendix; lightweight double-blind review
- At least one author must register for ALGO, attend onsite and present
- Steering committee from France, UK, Greece, Germany, Italy and Canada
