notes:
- Annual meeting of the neuromorphic computing community since 2013 (neural algorithms, neuromorphic hardware, spiking networks, applications)
- Three conference days plus a hands-on tutorial day
- Regular papers of 4 to 8 pages are reviewed by the program committee and accepted as full talk, lightning talk or poster
- Proceedings in IEEE Xplore since 2024 (ACM DL for 2022 and 2023); authors can opt out of the proceedings
- Separate late breaking news abstract track about two months before the conference
- Talk videos are published on the NICE YouTube channel
- Location alternates between the USA and Europe (2023 San Antonio, 2024 La Jolla, 2025 Heidelberg, 2026 Atlanta, 2027 Brighton)
- Not listed in ICORE2026
