notes:
- Workshop and challenge on face presentation attack detection, held with CVPR or ICCV
- Editions at CVPR 2019, CVPR 2020, ICCV 2021, CVPR 2023, CVPR 2024 and ICCV 2025
- The 6th edition (ICCV 2025) focused on unified physical and digital attack detection with the UniAttackData+ dataset
- 14 papers in the ICCV 2025 workshop proceedings on CVF Open Access
- Workshop paper deadline comes right after the challenge ends
- No 2026 edition announced as of November 2026
- Not listed in ICORE2026 or the CCF list
