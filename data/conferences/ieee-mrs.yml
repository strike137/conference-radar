notes:
- Small two-day symposium on multi-robot and multi-agent systems, an initiative of the IEEE RAS Technical Committee on Multi-Robot Systems
- Held every two years in early December (2017 Los Angeles, 2019 New Brunswick NJ, 2021 Cambridge UK, 2023 Boston, 2025 Singapore, 2027 Granada)
- 2025 was the first edition in Asia; fully sponsored by IEEE and IEEE RAS (2023 was technically co-sponsored)
- Papers 6 pages plus unlimited references, IEEE two-column format, double-blind review, submitted via PaperCept; optional video
- Proceedings submitted to IEEE Xplore
- Also has late-breaking results and a Young Pioneer session
- Not listed in CORE ICORE2026 and not on the CCF 2026 list
