notes:
- Series started in 2007 (Dalian); held jointly with SocialSec (security and privacy in social networks and big
  data) as NSS-SocialSec
- Proceedings in Springer LNCS (22 papers in the 2025 volume)
- Mostly held in China and the Asia-Pacific (Sapporo 2019, Melbourne 2020, Fiji 2022), sometimes Europe, the USA
  or the Middle East (Canterbury 2023, Abu Dhabi 2024)
- CORE B but a small venue; the 2025 deadline was extended twice; anonymous submissions, deadlines AoE
- Not in the CCF list
