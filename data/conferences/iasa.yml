notes:
- Workshop on acoustic sensing, communication and systems (mobile and wearable audio, ultrasound, acoustic ML
  and foundation models, acoustic side channels)
- Held with ACM MobiSys 2022 (Portland, 1st edition), CPS-IoT Week 2023 (San Antonio, 2nd edition) and ACM
  MobiCom 2025 (Hong Kong, 3rd edition)
- Research papers up to 6 pages and challenge papers up to 4 pages including references, ACM double-column format
- Single-blind review via HotCRP; accepted papers appear in the ACM proceedings
- Not held with MobiCom 2026
- Not listed in ICORE2026 or the CCF 2026 list
