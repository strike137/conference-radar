notes:
- Workshop co-located with ECML PKDD every year since 2020 (2020 and 2021 virtual); 7th edition in Naples 2026
- Covers embedded and edge machine learning across the stack (compression, hardware-aware NAS, compilers, accelerators, federated learning on devices)
- Accepted papers go into the joint ECML PKDD post-workshop proceedings in Springer CCIS
- Full papers up to 12 pages, short papers up to 6 pages, including references; Springer LNCS style; single-blind review via Microsoft CMT
- Envisioned as the peer-reviewed counterpart to the invitation-only WEML workshop series on embedded machine learning
- Best paper award
- Not listed in CORE ICORE2026
