notes:
- Workshop on QBF theory, solving and applications, and on related quantified formalisms (DQBF, QCSP, SMT with quantifiers)
- Affiliated with and co-located with the SAT conference; QBF 2026 was the 13th edition, at FLoC 2026 in Lisbon
- Earlier editions co-located with SAT 2020, SAT 2021 (virtual) and SAT 2022 (hybrid)
- Extended abstracts on published, unpublished or in-progress work, plus short tutorial proposals; no mandatory format
- Discussions and extended abstracts are collected in a public technical report, not a formal proceedings series
- Hosts the QBF Gallery solver evaluation (2026 edition)
- Not listed in ICORE2026
