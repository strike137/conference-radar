notes:
- Half-day workshop held with IEEE ICDCS on the cloud, edge and IoT computing continuum (orchestration, edge intelligence, zero trust, sustainability)
- Chaired by Schahram Dustdar (TU Wien) with co-chairs from Prishtina, Stockholm, UPF and Klagenfurt; project page hosted by the TU Wien Distributed Systems Group
- Held with ICDCS every year since 2024 (New Jersey 2024, Glasgow 2025, Seoul 2026)
- Papers up to 6 pages in IEEE two-column format, submitted through the ICDCS workshops EasyChair
- Accepted papers are published in the IEEE ICDCS workshop proceedings; one author must register fully and present on site
- 9 papers in the 2026 program, including one invited paper
- Not listed in the ICORE2026 portal or the CCF 2026 list
