  website: https://icp2026.photonicssociety.org.my/
notes:
- Flagship conference of the IEEE Photonics Society Malaysia Chapter (MyIPS); 11th edition in 2026
- Covers optics, integrated photonics, optical communication and networks, photonic devices, sensing and imaging
- Presented papers are submitted for inclusion in IEEE Xplore
- Biennial since 2014 (annual 2010 to 2014); 2020 and 2022 editions were virtual
- Held in Malaysia (Langkawi 2018, Penang 2024, Johor Bahru 2026)
- Submission via EDAS; deadline extended twice in 2026
- Not listed in ICORE2026 or the CCF list
