notes:
- Annual symposium of IFIP Working Group 7.3 on computer system modelling; 44th edition in 2026
- Accepted regular papers are published in a special issue of the Performance Evaluation (PEVA) journal, with an extended abstract in ACM PER; authors may opt out for expedited review in ACM ToMPECS, Queueing Systems or Stochastic Models
- Regular papers up to 20 pages single column (Elsevier format), short papers up to 5 pages in PER double-column format and published in a special ACM PER issue
- Double-blind review via HotCRP; fully on-site, at least one author must present
- Topics span queueing and stochastic modeling, scheduling, simulation, measurement and performance of networks, cloud and AI systems
- Hosts workshops on its last day; ASMTA 2026 runs as a workshop within Performance 2026
- Held jointly with ACM SIGMETRICS in some years (Mumbai 2022, Venice 2024)
- CORE lists it as Journal Published in ICORE2026; CCF B (architecture, parallel and distributed computing, storage category)
