notes:
- Workshop on security of cyber-physical systems (IIoT, automotive, medical devices, power grids), including AI and
  LLM based defenses and attacks; 2026 is the 11th edition
- Held in conjunction with IEEE CNS, so it follows CNS around the world (Newark, Delaware in 2026)
- Accepted papers are included in the IEEE CNS proceedings and published in IEEE Xplore after the conference
- Short format, maximum 6 pages in IEEE two-column format, submission via EDAS
- The 2026 submission deadline was extended by about a month (June 22 -> July 21)
- Not ranked by CORE (not in ICORE2026) or CCF
