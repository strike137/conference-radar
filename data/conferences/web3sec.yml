id: web3sec
name: WEB3SEC
full_name: Workshop Encouraging Building Better Blockchain Security
type: workshop
tier: minor
areas: [security, crypto]
region: north-america
language: english
frequency: annual
organizer: WEB3SEC organizing committee (general chair from Arizona State University), co-located with ACSAC (Applied
  Computer Security Associates)
organizer_country: [usa]
proceedings: IEEE Xplore (ACSAC Workshops volume); papers and slides also posted on the ACSAC website
archival: true
typical:
  deadline_months: [10]
  conference_months: [12]
links:
  website: https://web3sec.ws/
notes:
- One-day blockchain and Web3 security workshop co-located with ACSAC; 2024 was the third annual edition
- 2024 and 2025 editions held on the Monday of ACSAC week at the Alohilani Resort, Honolulu
- 'Topics: consensus protocols, smart contract and DeFi security, cross-chain bridges, ZK proofs, quantum threats to blockchain'
- 2024 CFP asked for papers of at most 6 pages (ACM acmart, double-blind) via EasyChair
- 2024 and 2025 papers appear in the IEEE ACSAC Workshops proceedings in IEEE Xplore; slides are also posted on the
  ACSAC site
- Mix of academic and industry speakers (keynotes and panel from blockchain companies)
- Not on the ACSAC 2026 workshop list, so a 2026 edition is unlikely
- Not listed in CORE ICORE2026 or on the CCF list
