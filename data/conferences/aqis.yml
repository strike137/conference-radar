id: aqis
name: AQIS
full_name: Asian Quantum Information Science Conference
type: conference
tier: minor
areas: [crypto, communications, general]
region: asia-pacific
language: english
frequency: annual
organizer: AQIS Steering Committee (chair Mio Murao, University of Tokyo) with a local host university each year
organizer_country: [international]
proceedings: None
archival: false
typical:
  deadline_months: [4, 5]
  conference_months: [8]
links:
  website: https://aqis-conf.org/
notes:
- Asian conference on quantum information processing, quantum computation, quantum communication and quantum cryptography
- Successor of the EQIS meetings held in Japan (2001 to 2005); AQIS since 2006, rotating through Japan, Korea, China,
  Taiwan, Singapore, India and Australia
- Recent hosts are Seoul 2023, Sapporo 2024, HKU Hong Kong 2025 and KAIST Daejeon 2026
- Submission is a 3-page extended abstract via EasyChair, considered for a long talk, short talk or poster; separate
  later poster-only deadline
- "No published proceedings: previously published work is welcome, and acceptance does not block publication elsewhere"
- Best student poster award; satellite workshops around the main conference
- Not listed in CORE ICORE2026 or the CCF list
