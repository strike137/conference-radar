notes:
- Workshop on the creation, documentation and use of dialectal language resources (text and speech) for NLP
- First edition (DialRes-LREC26) held with LREC 2026 in Palma de Mallorca on May 16 2026, as a hybrid event
- Proceedings in the ACL Anthology (2026.dialres-1, 34 papers)
- Papers of 4 to 8 pages in the LREC template, double-blind review by at least two PC members; papers rejected from the LREC main conference may be revised and resubmitted
- Offers tutoring and mentoring for early-career authors on request
- Endorsed by the UniDive COST Action CA21167 and Archimedes Athena R.C.
- No 2027 or later edition announced as of 2026-11-07
- Not listed in ICORE2026 and not on the CCF list
