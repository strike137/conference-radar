notes:
- International cybersecurity festival in Moscow, Russia, organized by the security vendor Positive Technologies; held since 2011 (Positive Hack Days 1)
- 2025 edition held at the Luzhniki sports complex in Moscow, with an online live stream
- 500+ talks in tracks such as offense, defense, AI security, ML, OSINT, hardware and firmware security, SOC and CISO topics
- Includes the Standoff cyberbattle, hacker contests, workshops, booths and a free family-friendly area
- About 150,000 participants from 40 countries in 2025 according to the organizer
- Open call for papers with a selection committee; speakers must not promote products or vendors; no proceedings, festival content published on the official YouTube channel
- Not listed in CORE ICORE2026
