notes:
- HCI conference on speech and language interfaces (voice UX, chatbots, LLM-based agents, conversational search)
- Founded in 2018; a SIGCHI specialised conference since late 2022
- Proceedings in the ACM DL
- Tracks for full papers (6,000 to 10,000 words), provocations, short papers and works in progress, interactivity, workshops and doctoral consortium
- Mandatory abstract one week before the full paper deadline; each submission must volunteer three reviews
- "Full paper acceptance: 26.1% (2026), 34.0% (2025), 33.3% (2024)"
- Small community event (about 100 to 150 attendees); mostly in Europe (Glasgow 2022, Eindhoven 2023, Luxembourg 2024, Bremen 2026, Swansea 2027) with Waterloo, Canada in 2025
- Not listed in CORE (ICORE2026) or CCF
