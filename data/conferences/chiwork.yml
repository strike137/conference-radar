notes:
- Small ACM in-cooperation symposium on HCI and the future of work, editions since 2022
- Held in Europe so far (Amsterdam 2025, Linz 2026, Aalborg 2027); hybrid, authors may present virtually
- Full papers appear in the Proceedings of the CHIWORK Conference in the ACM Digital Library, open access
- Full papers of at least 6 pages in the single-column ACM SIGCHI format (typically 7,000 to 10,000 words); double-blind with
  at least 3 reviews
- Also workshops, conversations, late-breaking work, artworks and demos, and a student consortium
- Not listed in the CORE portal (ICORE2026)
