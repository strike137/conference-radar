notes:
- Workshop bringing together formal linguists, computational linguists and NLP researchers
- First edition at ESSLLI 2022, second at IWCS 2025 (Düsseldorf), third as a standalone event in Paris in 2026
- Archival papers (4 or 8 pages, ACL style) go to the ACL Anthology; non-archival and dissemination submissions are also accepted
- Submission via OpenReview; BriGap-3 strongly discouraged the use of generative AI in submissions
- BriGap-3 registration was free but mandatory
- A fourth edition is being organised (no dates yet)
- Not listed in ICORE2026 and not on the CCF list
