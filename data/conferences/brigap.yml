language: english
frequency: irregular
organizer: BriGap chairs (Timothee Bernard, Universite Paris Cite, and co-chairs); grew out of the ILFC online seminar of the French CNRS research network LIFT
organizer_country: [europe]
proceedings: ACL Anthology
archival: true
typical:
