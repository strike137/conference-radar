links:
  website: https://brigap-workshop.github.io/
notes:
- Workshop for formal linguists, computational linguists and NLP researchers on how their fields can build on each other
- 1st edition at ESSLLI 2022, 2nd at IWCS 2025 in Dusseldorf, 3rd as a standalone one-day event in Paris in 2026
- Archival papers (short up to 4 pages, long up to 8 pages) go into the ACL Anthology; non-archival work in progress and dissemination submissions also accepted
- Submissions via OpenReview using the ACL style; camera-ready gets one extra page
- BriGap-3 registration was free but mandatory; funded by RT LIFT2, LLF and InIdEx EFL
- BriGap-3 strongly discourages use of generative AI in submissions; detected hallucinations lead to rejection
- A fourth edition is being organised (no dates yet)
- Not listed in ICORE2026
