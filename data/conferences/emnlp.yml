id: emnlp
name: EMNLP
full_name: Conference on Empirical Methods in Natural Language Processing
type: conference
tier: top
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: ACL SIGDAT
proceedings: ACL Anthology
indexing: [DBLP]
rank:
  core: A*
  ccf: B
acceptance_rate: 22.2% main (2025, 1811/8174)
fee: Author/presenter rate 850 USD academic / 550 USD student, in person (2026), plus a paper presentation fee (200
  USD for 1-2 papers); general early rate 650 / 350 USD; ACL membership required
typical:
  deadline_months: [5, 6]
  conference_months: [10, 11]
links:
  website: https://2026.emnlp.org/
  wikicfp: http://www.wikicfp.com/cfp/program?id=883
notes:
- One of the two flagship NLP venues with ACL; submissions only via ARR (May cycle), then commitment
- EMNLP 2025 was held in Suzhou, China; EMNLP 2026 is in Budapest (Oct 24-29, 2026)
- The May ARR cycle is shared with AACL-IJCNLP, so papers not taken by EMNLP can be committed to AACL
- Main acceptance around 21-22%; Findings of EMNLP adds a second tier (17.3% in 2025)
- EMNLP 2027 is planned for Mexico or Central America, tentatively early November 2027
