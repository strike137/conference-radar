notes:
- Small two-day ACM symposium combining perception research (psychology, psychophysics, neuroscience) with graphics, vision, visualization, VR and HCI
- Successor of APGV (Applied Perception in Graphics and Visualization, 2004 to 2011); named SAP since 2012
- Long papers up to 8 pages and short papers up to 4 pages, excluding references; double-blind review on EasyChair
- Required abstract registration about one to two weeks before the paper deadline
- Strongest accepted papers are invited to the ACM TAP journal special issue (with a second review cycle) instead of the proceedings
- Rejected papers can be presented as posters; poster abstracts can go in the ACM DL, late-breaking posters do not
- CORE B (ICORE2026); not in the CCF 2026 list
- Held in Europe and North America (online 2021 and 2022, Los Angeles with SIGGRAPH 2023, Dublin 2024, Vancouver 2025, Rennes 2026)
- "2026 registration: 360 EUR ACM members, 420 EUR non-members, 250 EUR students (early)"
