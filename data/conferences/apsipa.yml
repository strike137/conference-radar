notes:
- Annual conference of APSIPA since 2009 (first held in Sapporo); rotates around Asia-Pacific (2024 Macau, 2025
  Singapore, 2026 Bangkok)
- 4 to 6 page papers; IEEE Xplore proceedings; many special sessions, grand challenges and tutorials
- Regular tracks include Multimedia Security and Forensics, Machine Learning and Data Analytics, Speech and Language
  Processing, and Wireless Communications and Networking
- Full (non-student) registration required per paper, one registration covers at most two papers
- Has a 2-page late-breaking report (poster) track with a deadline about two months after the main one; paper deadlines
  were moved several times in 2026
