links:
  website: https://works-workshop.org/
notes:
- Long-running one-day workshop on scientific workflows, held with SC (the ACM/IEEE supercomputing conference); 2026 is the 21st edition
- Full papers up to 8 pages in IEEE format, single-blind review with at least three reviews, published in the SC Workshops Proceedings
- Abstracts up to 4 pages feed a contributed panel discussion and are not published
- WORKS 2026 papers go to IEEE Xplore; SC25 workshop papers went to the ACM DL
- Submission goes through the SC submission site (submissions.supercomputing.org); deadlines are AoE
- Not listed in CORE ICORE2026
