id: aciids
name: ACIIDS
full_name: Asian Conference on Intelligent Information and Database Systems
type: conference
tier: major
areas: [ai, data]
region: asia-pacific
language: english
frequency: annual
organizer: 'Wroclaw University of Science and Technology (Dept. of Applied Informatics) with local co-organizers
  (2027: IEEE Computer Society Indonesia Chapter, BINUS University, International Institute of Applied Informatics);
  in cooperation with IEEE SMC TC on Computational Collective Intelligence'
organizer_country: [europe]
proceedings: Springer LNAI (full papers) and CCIS (poster papers)
indexing: [Scopus, Web of Science, DBLP]
rank:
  core: B
fee: About 600 USD (2026, author early); 550 USD student early
typical:
  deadline_months: [9, 12]
  conference_months: [4]
links:
  website: https://aciids.pwr.edu.pl/
  dblp: https://dblp.org/db/conf/aciids/
  wikicfp: http://www.wikicfp.com/cfp/program?id=30
notes:
- Run from Poland (Wroclaw University of Science and Technology) but held in a different Asian city every year (2025
  Kitakyushu, 2026 Kaohsiung, 2027 Bali)
- Full papers go to Springer LNAI, poster papers to CCIS; 12-15 pages, at least three reviews per paper
- Many special sessions; 2026 had one on information security and cryptology (ISCrypt)
- 'Deadlines are often extended substantially (2026: 2025-09-30 -> 2025-12-15 hard deadline)'
- CORE B since 2021; generally seen as mid-tier despite the rank
