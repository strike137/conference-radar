notes:
- Theory of data management (query languages, data models, algorithms, provenance, logic); held jointly with EDBT
  following the SIGMOD/PODS model
- Held jointly with EDBT every year since 2009, always in Europe (Ioannina 2023, Paestum 2024, Barcelona 2025,
  Tampere 2026, Lille 2027)
- Proceedings in the LIPIcs series by Schloss Dagstuhl, open access and free of charge; authors keep the rights
- Two submission cycles per year; a paper rejected in cycle 1 cannot go to cycle 2 unless the reviewers ask for it
- Regular papers up to 15 pages in LIPIcs style plus references, anonymized submission; also a 4-page non-anonymous
  Database Theory in Action track
- Best Paper and Best Newcomer (or Best Student) Paper awards, plus an ICDT Test-of-Time award
- At least one author per accepted paper had to register and present in person (2026, onsite only)
