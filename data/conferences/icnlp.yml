id: icnlp
name: ICNLP
full_name: International Conference on Natural Language Processing
type: conference
tier: minor
areas: [nlp, ai]
region: china
language: english
frequency: annual
organizer: Chinese host universities, a different one each year (Jiangsu University of Science and Technology in
  2027, Xi'an University of Posts and Telecommunications in 2026)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
typical:
  deadline_months: [11, 12]
  conference_months: [3, 4]
links:
  website: https://www.icnlp.net/
notes:
- Chinese NLP conference series started in 2019; not the same venue as ICON (International Conference on Natural
  Language Processing) in India
- Proceedings of ICNLP 2025 and 2026 are in IEEE Xplore and indexed by EI Compendex and Scopus
- Selected ICNLP 2027 papers can be extended (at least 30% new content) for an MDPI Mathematics special issue
- Held in China in hybrid format with online presentation sessions (Xi'an 2024, Guangzhou 2023, Zhenjiang 2027)
- Not listed in the CORE ICORE2026 portal (0 results), so no CORE rank is given
