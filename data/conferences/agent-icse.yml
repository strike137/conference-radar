notes:
- ICSE workshop on software engineering for agentic AI systems built on foundation models (requirements, architecture, testing, AgentOps, responsible AI)
- 1st edition at ICSE 2026 in Rio de Janeiro; 2nd edition at ICSE 2027 in Dublin
- Co-chaired by Qinghua Lu and Liming Zhu (CSIRO Data61), Ahmed E. Hassan (Queen's University) and David Lo (SMU)
- 2027 accepts full papers up to 8 pages and short papers up to 5 pages, both including references, IEEE template, single-anonymous review
- 2026 papers published by ACM; ICSE 2027 workshop papers are published by IEEE
- Selected 2026 papers were invited to an IEEE Software special issue on engineering agentic systems
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
