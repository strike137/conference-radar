notes:
- ICSE workshop on engineering agentic AI systems (requirements, architecture, testing, AgentOps, evaluation) and agents for software engineering
- First held at ICSE 2026 in Rio de Janeiro; second edition at ICSE 2027 in Dublin
- 2027 accepts full papers up to 8 pages and short papers up to 5 pages, IEEE format, single-anonymous review
- 2027 papers published by IEEE; 2026 papers used the ACM template and were published by ACM
- Selected 2026 papers invited to an IEEE Software special issue on engineering agentic systems
- Different from AGENT-SEC (security of agentic AI systems)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
