notes:
- Biennial symposium on circuits and signal processing, held in odd years in Iasi, Romania (17th edition in 2025)
- Organized by the Faculty of Electronics, Telecommunications and Information Technology of the Technical University of Iasi with the IEEE Romania Section
- Topics include linear and nonlinear circuits, VLSI, power electronics, analog and digital signal processing, image and video processing; AI applications and cyber security added in 2027
- Papers in IEEE A4 double-column format, published in IEEE Xplore (exactly 4 pages in 2025, up to 6 pages in 2027); at least one author must register for the paper to appear
- On-site presentation expected, online presentation possible
- "Fee: 250 EUR non-member, 130 EUR student (2025, online registration)"
- Not listed in CORE ICORE2026
