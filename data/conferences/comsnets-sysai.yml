notes:
- Co-located workshop of COMSNETS, held each January in Bengaluru, India
- Systems for AI/ML (training and inference infrastructure, model serving, edge AI, LLM systems, energy-efficient AI)
- Double-blind review; papers up to 6 pages in IEEE format, submitted through EDAS (HotCRP in 2025)
- Workshop papers appear in the COMSNETS proceedings and are submitted to IEEE Xplore
- First held with COMSNETS 2025; also held in 2026
- Workshop deadline is usually extended by one to three weeks
