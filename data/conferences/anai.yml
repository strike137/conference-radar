notes:
- Workshop on AI over access networks (FTTR, Wi-Fi 7, edge sensing) and AI for access network optimization
- Only edition so far is 2025, a half-day workshop at ACM MobiCom 2025 in Hong Kong with keynotes, a panel and a Huawei
  industry talk
- Papers published in the ACM Digital Library as Proceedings of the 2025 ACM Workshop on Access Networks with
  Artificial Intelligence
- Papers up to 5 pages including references in ACM sigconf 10pt format; submission via HotCRP
- Not listed in ICORE2026 or the CCF 2026 list
