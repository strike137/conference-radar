links:
  website: http://www.ksii.or.kr
notes:
- Organized by KSII; the society holds a spring and a fall general conference every year
- Short 1 to 2 page papers; the presenter must be a paid-up KSII member (annual fee 50,000 KRW regular, 30,000 KRW
  associate; undergraduates exempt)
- Tracks include AI, network, information security, defense IT, big data, digital twin, IoT and quantum, with a
  research group session on AI cybersecurity
- Best papers are recommended to the society journal JICS (KCI); KSII also publishes KSII TIIS
- Held late April or early May at resort venues (Gangneung 2025, Jeju 2026)
