links:
  website: https://www.epeps.org/
notes:
- Jointly sponsored by IEEE EPS, IEEE MTT-S and IEEE AP-S; describes itself as the premier conference on electrical
  modeling, analysis and design of interconnects, packages and systems
- Covers signal, power and thermal integrity, high-speed channels and SerDes, 2.5D/3D integration, antennas in
  package, EM modeling and ML for packaging
- Submissions are camera-ready 3-page double-column IEEE papers, reproduced as-is in the proceedings; papers
  (including posters) must be presented to appear in IEEE Xplore
- Selected papers are invited to a special section of IEEE Transactions on Components, Packaging and Manufacturing
  Technology
- Held in North America (2022 San Jose, 2023 Milpitas, 2024 Toronto, 2025 Milpitas, 2026 Fort Worth)
- Submission deadline usually extended by several weeks (2026 -> June 29, then July 13, then July 22)
- "Registration 2026: 700 USD early for IEEE members, 880 USD for non-members, 460 USD for IEEE student members"
- Best paper, best student paper and best poster awards; IEEE EPS student travel grants
- Not listed in ICORE2026 or the CCF list
