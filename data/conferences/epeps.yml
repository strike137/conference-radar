id: epeps
name: EPEPS
full_name: IEEE Conference on Electrical Performance of Electronic Packaging and Systems
type: conference
tier: minor
areas: [communications]
region: north-america
language: english
frequency: annual
organizer: IEEE Electronics Packaging Society (EPS), IEEE MTT-S and IEEE AP-S (joint sponsors)
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
fee: About 650 to 880 USD early, 780 to 1060 USD regular (2026, IEEE society member to non-member)
typical:
  deadline_months: [6, 7]
  conference_months: [10]
links:
  website: https://www.epeps.org/
notes:
- Leading conference on electrical modeling, analysis and design of interconnects, packages and systems (signal,
  power and thermal integrity, high-speed channels, SerDes, advanced packaging, antennas-in-package)
- Jointly sponsored by IEEE EPS, IEEE MTT-S and IEEE AP-S
- Held in North America every October (2026 in Fort Worth, Texas)
- Short 3-page double-column camera-ready papers, reproduced as submitted in the proceedings (IEEE catalog
  CFP25EPP-POD for 2025)
- Selected papers are invited to a special section of IEEE Transactions on Components, Packaging and Manufacturing
  Technology
- Best paper, best poster paper, best student paper and best benchmark paper awards; Sunday tutorials and exhibits
- Not listed in CORE ICORE2026 or the CCF list
