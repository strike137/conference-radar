notes:
- Small standalone workshop on causal discovery and causal models, run by INAOE researchers (chairs include L. Enrique Sucar)
- Held since 2023 (Tonantzintla 2023, Montevideo 2024, Xalapa 2025, Tonantzintla 2026)
- 2026 edition is hybrid; authors choose in-person or virtual presentation
- Full papers up to 12 pages and extended abstracts up to 4 pages in Springer CCIS format
- Proceedings move to Springer CCIS for 2026; the 2023 and 2025 proceedings were self-published with ISBN and are downloadable from the site
- Includes a tutorial day on causal discovery; low registration fees
- Not listed in CORE ICORE2026
