language: english
frequency: annual
organizer: Tashkent University of Information Technologies (TUIT)
organizer_country: [other]
proceedings: IEEE Xplore
archival: true
fee: 200 USD international, 150 USD IEEE member, plus 12% VAT (2026)
typical:
  deadline_months: [8]
  conference_months: [12]
links:
  website: https://optima2026.tuit.uz/
notes:
- Run by Tashkent University of Information Technologies (TUIT) and held on its campus in Tashkent, Uzbekistan; technically co-sponsored by the IEEE Photonics Society (IEEE conference 71623 in 2026)
- First edition in December 2025, with proceedings published in IEEE Xplore
- Six tracks covering optical communication and networks, photonics, telecom and wireless (5G/6G), AI in communication, IoT, and quantum technologies
- Papers up to 6 pages plus 2 extra pages in IEEE format via Microsoft CMT; double-blind review with at least two reviews per paper
- Hybrid format, but in-person presentation is mandatory except with chair approval; no-show papers are not published
- Fees are paid by card or bank transfer to an account in the name of a TUIT staff member
- Region set to south-asia as the closest listed value for Central Asia
- Not listed in ICORE2026 or the CCF 2026 list
