notes:
- New Zealand's main visual computing conference, 41st edition in 2026; hosted by a different New Zealand university
  each year (2025 Wellington, 2026 Dunedin)
- Covers computer vision, image processing, graphics, XR and visualisation; general AI papers without a vision
  application are rejected as out of scope
- Six-page IEEE format papers including references, single-blind review via EasyChair; proceedings in IEEE Xplore
- Ranked Australasian C by CORE; small, friendly and hybrid in 2025, when it was co-hosted with PRICAI
- 2025 submission deadline was extended by three weeks
