notes:
- Workshop on efficient and robust deep learning; 2025 theme was robustness of compressed foundation models (quantization, pruning, distillation)
- Held with AAAI 2022, AAAI 2023, IEEE CAI 2024 and as an IJCAI 2025 satellite event in Guangzhou
- Accepted papers are posted as PDFs on the workshop website; no formal proceedings series
- Long papers 7 pages, extended abstracts 4 pages, IJCAI template, submission via OpenReview
- Best paper and outstanding paper awards
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
