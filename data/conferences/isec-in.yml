notes:
- Annual software engineering conference of iSOFT, the India chapter of ACM SIGSOFT, under ACM India; formerly
  India Software Engineering Conference, held annually since 2008, usually in February
- 'Held in India at a different institute each year: Bangalore (2024), Kurukshetra (2025), Jaipur (2026), Mumbai
  (2027)'
- Proceedings in the ACM International Conference Proceedings Series (ACM DL), indexed by DBLP; ACM Open Access
  applies, and authors at ONOS-participating Indian institutions are covered by a national read-and-publish agreement
- Two submission rounds (June and September in the 2027 cycle); first-round papers can get a minor or major
  revision and resubmit in round two; double-blind review
- Regular papers up to 10 pages plus references, short papers 5 pages including references, in ACM sigconf format; 2-page ideas and
  experience papers are presented but not included in the proceedings
- Also has demo and tools, industry innovations, doctoral symposium, student posters, workshops and a data science
  challenge
- Not listed in ICORE2026
- At least one non-student registration per accepted paper; in-person presentation expected, remote only in
  exceptional cases such as authors based outside India
