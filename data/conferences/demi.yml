notes:
- Satellite workshop of MICCAI on data engineering for medical imaging (data curation, noisy labels, synthetic data, distributed data), 4th edition in 2026
- Moves with MICCAI (Daejeon 2025, Strasbourg 2026)
- Proceedings in Springer LNCS, own volume (LNCS 16191 for DEMI 2025, 24 full papers from 33 submissions)
- Up to 8 pages plus 2 pages of references in LNCS format, double-blind review; submission via OpenReview in 2026 (CMT in 2025)
- Organizers from the University of Aberdeen, West Virginia University, Oxford, UCL, Liverpool and others
- Not listed in CORE ICORE2026 or the CCF 2026 list
