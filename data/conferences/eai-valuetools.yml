notes:
- EAI conference on performance evaluation (queueing, stochastic models, simulation, Markov decision processes) of
  networks, cloud, AI and other systems; 19th edition in 2026
- Proceedings in Springer LNICST; selected papers invited to Mobile Networks and Applications (MONET)
- Full papers 12 to 20 pages, short papers 6 to 11 pages; extra pages are charged
- Small conference (11 to 23 papers per volume, 2021 to 2025)
- Recent editions in Europe (Crete 2023, Milan 2024, Glasgow 2025); 2021 was online
- 2026 site lists Gran Canaria, Spain but the header also calls it an online conference
- Not ranked by CORE or CCF
