notes:
- Run by IADIS as part of the MCCSIS multi-conference; blind peer review
- Proceedings in the IADIS Digital Library with a DOI per paper; best papers invited to the IADIS International Journal on WWW/Internet and the IADIS Journal on Computer Science and Information Systems
- Covers AI and its use and concerns across society (education, business, health); researchers and practitioners
- 2026 appears to be the first edition; the site's previous editions page lists only Digital Transformation and Innovation Management proceedings
- Several calls for papers per edition; the last call closes about eleven weeks before the conference
- Not listed in the ICORE2026 CORE ranking
