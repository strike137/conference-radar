organizer: HumanAISE organizing and steering committee (Vanderbilt University, UC Irvine and others), co-located with FSE
organizer_country: [international]
proceedings: ACM DL (FSE companion proceedings)
archival: true
typical:
  deadline_months: [2, 3]
