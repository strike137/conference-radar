links:
  website: https://humanai4se.github.io/
notes:
- FSE workshop on human-centered AI for software engineering (human-AI collaboration, explainable AI for SE, trust, ethics and fairness, SE education with AI)
- Held with FSE since 2025; Trondheim 2025 (1st, with FSE and ISSTA), Montreal 2026 (2nd)
- Full papers up to 8 pages plus 2 pages of references, short papers up to 4 plus 1, position papers up to 2 pages, extended abstracts up to 5 pages (APC free)
- Double-blind review by at least three PC members; accepted papers published in the ACM Digital Library as part of the FSE companion proceedings
- Linked special issue on HumanAISE in Empirical Software Engineering (EMSE) for extended versions of selected papers
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
