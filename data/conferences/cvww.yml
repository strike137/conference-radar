notes:
- Annual meeting of the computer vision groups in Prague, Ljubljana, Graz and Vienna since 1996, open to everyone
- Standalone workshop aimed at giving PhD students conference experience
- Rotates between Austria, Czech Republic and Slovenia (2026 Jindrichuv Hradec, 2027 Rust)
- Two tracks, reviewed contributed papers that appear in the proceedings, and an unpublished feedback track
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
