notes:
- Half-day workshop co-located with IEEE CCNC in Las Vegas; 2nd edition in 2026, 3rd edition (DiSCA'27) in 2027
- Chairs Giovanni Delnevo (University of Bologna) and Pietro Manzoni (Universitat Politecnica de Valencia)
- Topics are energy-efficient consumer devices, green networking, sustainable software, IoT and cloud, and the environmental impact of AI
- Papers up to 6 pages (up to 3 extra pages at 100 USD each) go into the CCNC proceedings in IEEE Xplore; submissions via EDAS
- Not listed in ICORE2026
