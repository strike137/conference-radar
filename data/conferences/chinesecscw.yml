notes:
- National CSCW and social computing conference of the China Computer Federation (CCF) cooperative computing
  committee, held since 1998 (named CCSCW before 2016); 2026 is the 21st edition
- English proceedings published in Springer Communications in Computer and Information Science (CCIS), usually two
  volumes; papers may be submitted in Chinese or English but final papers must be in English
- Double-blind review, at least 3 reviewers; submissions at least 10 pages, final long papers at least 12 pages
- Held in a different Chinese city each year (Harbin 2023, Hohhot 2024, Guangzhou 2025, Luoyang 2026)
- Not ranked in CORE ICORE2026; not the IEEE CSCWD conference
