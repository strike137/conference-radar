notes:
- Workshop on Age of Information, semantics of information and goal-oriented communication, held with IEEE INFOCOM
  every year (9th edition in 2026; London 2025, Tokyo 2026)
- Papers up to 6 pages in IEEE format, up to 2 extra pages at 100 USD each; submission via EDAS
- Accepted and presented papers go into the IEEE INFOCOM Workshop Proceedings and IEEE Xplore; one author must
  register for the workshops
- Deadline is usually extended into mid January
- Not listed in the CORE portal (ICORE2026)
