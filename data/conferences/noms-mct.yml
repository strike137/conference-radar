links:
  website: https://noms-mct.lre.epita.fr/
notes:
- First held at IEEE/IFIP NOMS 2026 in Rome; follows the Detection of Complex Attacks sessions (Sevilla 2024, Osaka 2025)
- Topics are AI, ML and generative AI for detecting and managing complex network threats (APTs, zero-days, LLM attacks)
- Original papers 6 pages in IEEE 2-column format; tutorial and tool demo proposals 2 to 6 pages; submitted via JEMS3
- Accepted and presented papers appear in the NOMS 2026 proceedings and are submitted to IEEE Xplore
- Eight papers plus a keynote and a tool demo in 2026
