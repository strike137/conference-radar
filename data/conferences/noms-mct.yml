notes:
- Workshop co-located with IEEE/IFIP NOMS; first held at NOMS 2026 in Rome
- Grew out of the Detection of Complex Attacks (DCA) invited sessions at KES 2024 (Seville) and KES 2025 (Osaka)
- Topics are AI and machine learning for network security, generative AI for defense and pen testing, adversarial ML and complex threats such as APTs
- Papers up to 6 pages in IEEE two-column format; tutorial and tool demo proposals of 2 to 6 pages; submission via JEMS3
- Accepted and presented papers go into the NOMS 2026 proceedings and are submitted to IEEE Xplore
- One-day workshop; eight papers and one tool demo in the 2026 program
