id: ai-pa
name: AI-PA
full_name: International Workshop on AI-enabled Process Automation
type: workshop
tier: minor
areas: [ai, data, software]
region: worldwide
language: english
frequency: annual
organizer: Macquarie University (Amin Beheshti) with Dublin City University and UpBrains AI; co-located with ICSOC
organizer_country: [australia, europe]
proceedings: Springer LNCS (ICSOC Workshops volume)
archival: true
typical:
  deadline_months: [10]
  conference_months: [11, 12]
links:
  website: https://data-science-group.github.io/AIPA_workshop/2026
notes:
- Workshop on AI for business processes and services (agentic service computing, process data science, cognitive assistants, AI in industry)
- Held every year with ICSOC since 2020; 2026 is the 7th edition (Dubai 2020 to 2022, Rome 2023, Tunis 2024, Shenzhen 2025, Lodz 2026)
- Run by the AI@MQ Research Centre at Macquarie University with Dublin City University
- Position papers up to 8 pages, research and industry papers up to 12 pages, LNCS format, at least three reviewers
- Accepted papers go into the ICSOC workshop proceedings in Springer LNCS
- Small workshop; four papers on the 2026 program
- Not listed in ICORE2026 or the CCF list
