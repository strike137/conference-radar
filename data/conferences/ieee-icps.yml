notes:
- Annual IEEE Industrial Electronics Society conference on industrial cyber-physical systems, started in 2018; 10th edition in 2027
- Topics include ICPS architectures, industrial IoT, security and trust, communication networks, edge and cloud computing,
  digital twins, automation, smart grids and AI in industrial systems
- Single-blind review; regular papers up to 6 pages plus up to 2 extra pages for a fee; work-in-progress track
- Accepted and presented papers go to IEEE Xplore
- 2026 used two submission rounds; 2027 is co-located with IEEE INDIN 2027 in Lisbon
- Rotates worldwide (Canada 2021 online, UK 2022, Wuhan 2023, St. Louis 2024, Emden 2025, Perth 2026, Lisbon 2027)
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
