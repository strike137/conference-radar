notes:
- Half-day workshop on hyperbolic, spherical and other geometric spaces, architectures and objectives for foundation models
- First edition at KDD 2026 in Jeju, Korea (August 9, 2026, afternoon)
- Submission and review via OpenReview; accepted papers presented as oral talks or posters, in person
- KDD 2026 workshop papers are not archived in the ACM Digital Library; accepted GALOP papers are listed on OpenReview
- "6 accepted papers in 2026, 4 of them with oral talks"
- Run by the same group as the NEGEL workshops (TheWebConf 2025, NeurIPS 2025) and the hyperbolic learning tutorials at KDD and AAAI
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
