language: english
frequency: annual
organizer: Ubi-Media organizing committee led by Taiwanese universities (Tamkang University, National Central
  University), run jointly with the IC conference series
organizer_country: [taiwan]
proceedings: Springer CCIS
archival: true
typical:
  deadline_months: [10, 11]
  conference_months: [1]
links:
  website: https://2027umediaconf.com/
notes:
- Ubiquitous multimedia computing; topics span wireless and mobile networking, context-aware services, HCI,
  security and privacy, and applications
- Accepted papers (6 to 16 pages) appear in Springer CCIS; best papers are recommended to journal special issues
- Held every January in Asia (Bangkok 2025, Penang 2026, Okinawa 2027) together with workshops (MLMA, MIOT) and
  the joint IC conference
- Submission via EasyChair; deadlines are usually extended once or twice
- At least one non-student full registration per accepted paper is required
- Not listed in ICORE2026 or the CCF 2026 list
