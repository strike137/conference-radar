notes:
- Formerly the IEEE North Atlantic Test Workshop (NATW, 1992 to 2020); renamed MDTS in 2021; 36th edition in 2027
- Covers electronic test, design for test, EDA, yield, hardware security, reliability, analog/mixed-signal/RF and emerging devices
- Six-page full papers or two-page extended summaries; only full papers can go to IEEE Xplore
- Accepted papers presented at the symposium can opt in to post-symposium publication in IEEE Xplore; the pre-symposium digest is attendees only
- Selected papers invited to the Journal of Electronic Testing (JETTA) (2026 CFP)
- Held every May in Albany, New York (2023 to 2027); virtual in 2021 and 2022
- Small academia-industry forum with a best student paper award and student sessions
- Not listed in CORE ICORE2026 or in the CCF 2026 list
