notes:
- Jointly sponsored by ACM and IEEE (IEEE Computer Society); a dedicated systems venue for edge computing, started in 2016
- Proceedings alternate between ACM DL (2025, ACM template) and IEEE Xplore (2024); posters and demos also appear
  in the proceedings
- Double-blind review with a rebuttal phase; 12 pages plus references in the IEEE two-column format, short position
  papers up to 6 pages
- Usually held in the USA (Washington D.C. 2025, Wilmington 2023, Seattle 2022); 2024 was in Rome
- 2026 edition (11th) is at Santa Clara University, co-located with IEEE IC2E 2026
- CCF C (computer architecture / parallel and distributed computing); Unranked in ICORE2026
- Several co-located workshops (EdgeSP, Edge Intelligence, DroneSys, EdgeCAV) and a poster/demo track offer easier
  entry for students
- At least one author per paper needs a full (non-student rate) registration
