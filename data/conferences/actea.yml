notes:
- Broad engineering conference on computational tools, run by Notre Dame University-Louaize in Lebanon
- Six editions since 2009 (2009, 2012, 2016, 2019, 2023, 2025), all held in Lebanon
- Mixes EECS topics (AI, 5G security, antennas, networks, power) with civil, mechanical and environmental engineering
- Proceedings of every edition are in IEEE Xplore; papers submitted through EDAS
- 2025 edition was hybrid, held at the NDU campus in Zouk Mosbeh, 10 km north of Beirut
- Sponsored by local branches of international societies; committees are mostly NDU faculty
- "Fee: 300 to 425 USD (2025, early IEEE member to on-site non-member); attendance without a paper is free"
- Not listed in the CORE ICORE2026 portal
