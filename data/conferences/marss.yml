notes:
- Annual non-profit conference run by the microrobotics community; technical support from IEEE RAS and IEEE NTC
- Micro/nano manipulation, automation and characterization, and small-scale robots (nm to cm)
- Full papers 5 to 6 pages go to IEEE Xplore (Ei indexed); short papers 1 to 3 pages are accepted on a rolling basis
- Full paper decisions within two weeks of submission; selected papers invited to a Journal of Micro-Bio Robotics
  special issue
- In person only, no online or poster presentations
- Rotates worldwide (Helsinki 2019, Toronto 2022, Abu Dhabi 2023, Delft 2024, West Lafayette 2025, Hangzhou 2026,
  Istanbul 2027; Tokyo 2028 tentative, Barcelona 2029)
- Not listed in CORE ICORE2026 or the CCF 2026 list
