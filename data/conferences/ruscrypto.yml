notes:
- Long-running Russian conference on cryptography and information security, held every year since 1999 (28th edition in 2026)
- Held in late March at the Solnechny Park Hotel and SPA in the Moscow region; Russian-language program
- Supported by the FSB of Russia, technical committee TC 26 and the Bank of Russia; mix of scientific sections (cryptography and cryptanalysis), round tables and vendor talks
- Talks are selected by the organizing committee from 1 to 2 page abstracts; slides are published in the conference archive
- Student and PhD paper contest; works presented are published in the conference materials and in the journal Problems of Information Security. Computer Systems
- Paid participation; discounted rate for faculty, PhD students and students when paid by their university
- Not listed in CORE ICORE2026
