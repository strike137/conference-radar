notes:
- Smaller conference on big data, learning analytics and AI in education
- Proceedings published by ACM (ACM DL) every year since 2018; EI Compendex and Scopus indexed per the site
- Location varies (London and Shanghai online editions, Jinan 2023, Oxford 2024, Beijing 2025, Bangkok 2026)
- Double-blind review by 2 to 3 committee members per the site
- Papers 8 to 15 pages; the fee covers 10 pages, then 70 USD per extra page
- Submission through the zmeeting system
- Not listed in ICORE2026
