notes:
- Founded in Geneva in 1988 as Computer Animation (CA) by the Computer Graphics Society; formerly International Conference on Computer Animation and Social Agents
- Renamed CASA-XR (International Conference on Computer Animation, Social Agents, and Extended Reality) from the 2026 edition
- Two publication routes in 2025 (only the CAVW journal route was announced for 2026), a journal track whose accepted papers appear in a special issue of Computer Animation and Virtual Worlds (Wiley) and a short paper track published in Springer LNCS
- Rotates worldwide (Limassol 2023, Wuhan 2024, Strasbourg 2025, Geneva 2026, Xi'an 2027); hybrid in 2025 and 2026
- Not listed in ICORE2026; CCF C (computer graphics and multimedia)
