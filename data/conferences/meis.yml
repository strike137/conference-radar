notes:
- Workshop on cooperative intelligence in multi-agent embodied systems (V2X cooperative driving, multi-robot and
  drone swarms, cooperative perception, agentic AI)
- Series started at ECCV 2024 as the Workshop on Cooperative Intelligence for Embodied AI, then CVPR 2025
  (Nashville) and CVPR 2026 (Denver)
- Archival track (up to 8 pages, CVPR template, double-blind) goes into the CVPR workshop proceedings;
  separate non-archival track with a later deadline
- Runs challenges alongside the paper track, with best paper and best demo awards
- 7 papers on CVF Open Access for CVPR 2026 and 7 for CVPR 2025
- Not listed in ICORE2026 or the CCF list
