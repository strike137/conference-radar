organizer: MELT organizing committee (researchers from MBZUAI, LMU Munich, EPFL, KAIST, Sogang University, Cohere Labs,
  Cardiff University, Universitas Gadjah Mada, Ohio State and University of Tuebingen); co-located with COLM 2025
organizer_country: [international]
