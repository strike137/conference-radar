notes:
- Workshop on multilingual and multicultural LLMs, cultural bias, value pluralism and low-resource languages
- 1st edition at COLM 2025 in Montreal
- Workshop track takes extended abstracts (2 pages), short (5) and long (9) papers, all non-archival, double-blind on
  OpenReview
- Conference track takes papers accepted elsewhere within a year, with light-touch screening only
- Not listed in ICORE2026 and not on the CCF list
