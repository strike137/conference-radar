notes:
- Organized by Tamkang University and the IEEE Tainan Section Sensors Council; same conference family (IIKII) as ECICE and ICKII
- Called IEEE ICEIB up to 2026; 7th edition in 2027
- 2021, 2023 and 2024 proceedings in IEEE Xplore (EI); 2023 to 2025 papers also in MDPI Engineering Proceedings (Scopus), 2025 in volume 108
- For 2027, papers in IEEE fields are to be indexed by EI and other papers go to MDPI Engineering Proceedings
- Abstract first, then a 4 to 8 page full paper; full paper acceptance comes after the conference
- Selected papers can be recommended to about 20 partner SCI, SSCI and Scopus journals (extra charge) or IIKII journals (no charge)
- Hybrid (in person or online); 2026 and 2027 editions at Tamkang University, New Taipei
- "Registration fee: USD 500 early, USD 600 normal for a regular author on site; USD 400 online (2027)"
- Not listed in CORE (ICORE2026); a broad, low-barrier venue
