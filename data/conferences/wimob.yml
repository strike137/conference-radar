id: wimob
name: WiMob
full_name: IEEE International Conference on Wireless and Mobile Computing, Networking and Communications
type: conference
tier: major
areas: [networking, communications]
region: worldwide
language: english
frequency: annual
organizer: WiMob steering committee (chair at Polytechnique Montreal), IEEE ComSoc technical sponsorship
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
acceptance_rate: 36.5% (2024, 60/164)
fee: 680 EUR IEEE member, 820 EUR non-member (2026, author registration; students also pay the full rate to present)
rank:
  core: B
