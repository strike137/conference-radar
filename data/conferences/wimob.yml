links:
  website: http://www.wimob.org/
notes:
- Running since 2005; IEEE ComSoc technical sponsorship; papers in IEEE Xplore (papers not presented may be excluded)
- CORE B (ICORE2026)
- Five parallel symposia (wireless communications, next generation mobile networking, AI for networking, blockchain, security and privacy) plus workshops and a short paper, poster and demo track
- Full papers 6 pages in IEEE format (up to 2 extra pages for a fee), submitted via EDAS
- Main deadline is usually early June and gets extended by about four weeks
- "Acceptance rate: about 30 to 38% in recent years (2024 60/164, 2023 30/95)"
- Mostly held in Europe, also Canada and Morocco (2023 Montreal, 2024 Paris, 2025 Marrakech, 2026 Avignon)
- Not the same venue as IEEE APWiMob (Asia Pacific Conference on Wireless and Mobile)
