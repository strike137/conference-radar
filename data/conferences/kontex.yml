links:
  website: https://kontex-workshop.github.io/
notes:
  - Workshop on turning informal domain knowledge (requirements, user stories, sketches) into conceptual and executable models
  - Topics include NLP and LLM based model extraction, model quality, human factors and model-driven toolchains
  - Co-located with the MODELS conference (Malaga 2026); deadlines follow the MODELS workshop schedule
  - Accepted papers go into the joint MODELS workshop proceedings published by ACM (MODELS workshop call)
  - Full papers up to 10 pages, short papers up to 5, opinion papers up to 3, ACM format; at least three reviewers per paper
  - Organized by David A. Manrique Negrin and Jean-Sebastien Sottet (LIST, Luxembourg) and Jean-Marie Favre (Universite Grenoble Alpes)
  - No earlier edition listed on the site; the 2026 edition appears to be the first
  - Not listed in the CORE portal (ICORE2026)
