id: ictai
name: ICTAI
full_name: IEEE International Conference on Tools with Artificial Intelligence
type: conference
tier: major
areas: [ai]
region: worldwide
language: english
frequency: annual
organizer: IEEE Computer Society
organizer_country: [usa]
proceedings: IEEE Xplore; extended versions of selected papers in special issues of IEEE and international journals
archival: true
indexing: [IEEE Xplore, DBLP]
rank:
  core: B
  ccf: C
fee: 800 USD IEEE member or IEEE student member, 960 USD non-member or non-member student (2026; same rate for authors
  and non-authors, no separate student discount)
typical:
  deadline_months: [6, 7]
  conference_months: [10, 11]
links:
  website: https://ictai.computer.org/2026/
notes:
- Annual IEEE Computer Society AI conference running since 1989 (38th edition in 2026)
- Usually held in the USA (Herndon 2024, Boca Raton 2026); 2025 edition was in Athens, Greece
- Double-blind review; 8-page IEEE papers, up to 2 extra pages at 100 USD each
- Deadlines are usually extended by a few weeks (final deadlines in mid/late July in 2024 to 2026); in-person only
  in 2026
- CORE B and CCF C; financial awards for the top 5 student papers and journal special issues for selected papers
