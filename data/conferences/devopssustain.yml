id: devopssustain
name: DevOpsSustain
full_name: International Workshop on DevOps for Sustainability
type: workshop
tier: minor
areas: [software, systems]
region: worldwide
language: english
frequency: annual
organizer: DevOpsSustain workshop organizers (Polytechnique Montreal, University of L'Aquila, University of Guelph, Munich University of Applied Sciences HM); co-located with ACM FSE
organizer_country: [canada, europe]
proceedings: ACM DL (FSE Companion Proceedings)
archival: true
typical:
  deadline_months: [2]
  conference_months: [6, 7]
links:
  website: https://devopssustain.github.io/ws2026/
notes:
  - Half-day workshop on energy efficiency and sustainability in DevOps, CI/CD, testing, deployment and operations
  - Co-located with ACM FSE; first edition at FSE 2025 in Trondheim, second at FSE 2026 in Montreal
  - Long papers (up to 10 pages) and short papers (up to 4 pages) appear in the FSE Companion Proceedings in the ACM DL
  - Extended abstracts (up to 2 pages, demos and industry talks) are presentation only and not in the ACM DL
  - Double-anonymous review via HotCRP; in-person presentation required for publication
  - Linked special issue on sustainable software development and operations in the Automated Software Engineering journal
  - Not listed in CORE ICORE2026 or the CCF 2026 list
