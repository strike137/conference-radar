id: ieee-isbi
name: IEEE ISBI
full_name: IEEE International Symposium on Biomedical Imaging
type: conference
tier: major
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: IEEE SPS and IEEE EMBS
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [10, 11]
  conference_months: [4, 5]
links:
  website: https://biomedicalimaging.org/2027/
  dblp: https://dblp.org/db/conf/isbi/index.html
notes:
- Joint initiative of the IEEE Signal Processing Society (SPS) and the IEEE Engineering in Medicine and Biology
  Society (EMBS)
- Accepted 4-page papers are published in IEEE Xplore; 1-page abstracts are poster only and not published
- Submission through EDAS; deadlines at 11:59pm US time (CDT, i.e. UTC-5, in 2026; EDT in 2027)
- 'Held worldwide: Nice 2021, Kolkata 2022, Cartagena 2023, Athens 2024, Houston 2025, London 2026, Lausanne 2027'
- Also hosts challenges, workshops, tutorials and special sessions
- Not listed in CORE ICORE2026 or the CCF 2026 list; regarded as the main IEEE venue for biomedical image analysis
