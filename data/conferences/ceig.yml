notes:
- Main Spanish computer graphics and visualization conference, run by the Spanish Section of Eurographics (35th edition in 2026); foreign groups are welcome
- Accepted papers are published open access in the Eurographics Digital Library with a DOI; authors may opt out and only present
- Full papers up to 10 pages, short papers up to 4 pages, posters with a 1 to 2 page extended abstract, plus a track for already published work
- Papers must be written in English since 2026; talks may be given in English or Spanish
- Double-blind review for full papers
- Selected full papers go to special sections of Computers & Graphics or Graphical Models after an extra review round
- Held at a different Spanish city each year (Jaen 2025, Valencia 2026)
- Not listed in the ICORE2026 portal and not on the CCF list
