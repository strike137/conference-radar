notes:
- Workshop on quality, measurement and testing of conceptual models in model-driven development, including low-code and AI-generated software
- Host conference changes; with QSIC in 2013 and 2014, RCIS 2022, ER 2023 to 2025, and MODELS 2026 (Malaga)
- Proceedings follow the host; IEEE Xplore (2013, 2014), CEUR-WS (2022), Springer LNCS ER workshop volumes (2023 to 2025), ACM MODELS joint workshop proceedings (2026)
- Full papers up to 10 pages and short papers up to 5 pages in 2026 (ACM format); at least three reviewers per paper
- Organized by researchers from Spain and Switzerland
- Not listed in the CORE portal (ICORE2026)
