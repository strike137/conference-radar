notes:
- Ethical hacking conference in Grenoble, France, followed by a CTF on the second day
- Call for papers takes papers (30 minute long talks or 15 minute short talks) and workshops of up to 3 hours
- Submissions are not anonymized; the programme committee mixes industry and academia
- The CFP pages do not mention published proceedings
- Editions every year since 2015 listed on the official site
