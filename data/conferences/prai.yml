id: prai
name: PRAI
full_name: International Conference on Pattern Recognition and Artificial Intelligence
type: conference
tier: minor
areas: [ai, vision]
region: china
language: english
frequency: annual
organizer: Conference secretariat with a different Chinese host university each year (Shanghai Jiao Tong
  University in 2026), technically co-sponsored by IEEE
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 525 USD regular author, 475 USD IEEE member or student (2026, early)
typical:
  deadline_months: [6]
  conference_months: [8]
links:
  website: https://www.prai.net/
notes:
- Not the same venue as ICPRAI (CENPARMI, Concordia University)
- Smaller commercially organized conference on pattern recognition, vision, speech and applied AI
- Held in China every August since 2020 (Yibin 2021 and Chengdu 2022 online, Haikou 2023, Hangzhou 2024, Guizhou
  2025, Shanghai 2026); the 2018 edition was at Kean University, USA
- Proceedings in IEEE Xplore since 2021 (ACM Digital Library before), listed as indexed in Ei Compendex and Scopus
- Single-blind review; papers 4 to 12 pages, 6 pages included and 50 USD per extra page
- Abstract-only presentation possible without publication
- Not listed in the CORE portal (ICORE2026)
