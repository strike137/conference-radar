id: ieee-asap
name: IEEE ASAP
full_name: IEEE International Conference on Application-specific Systems, Architectures and Processors
type: conference
tier: minor
areas: [systems]
region: worldwide
language: english
frequency: annual
organizer: IEEE, with a host university each year (Imperial College London in 2026)
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
rank:
  ccf: C
fee: 800 USD non-member, 665 USD IEEE member, 465 USD IEEE student member (2026, early registration)
typical:
  deadline_months: [2, 3, 4]
  conference_months: [7, 9]
links:
  website: https://2026.asap-conf.org/
  dblp: https://dblp.org/db/conf/asap/index.html
notes:
- Started in 1986 in Oxford as the International Workshop on Systolic Arrays; current title since 1996
- Accelerators, domain-specific processors, reconfigurable computing (FPGAs, CGRAs), computer arithmetic, embedded
  and heterogeneous systems, security architectures
- Traditionally alternates between Europe and North America (Gothenburg 2022, Porto 2023, Hong Kong 2024, Vancouver
  2025, London 2026)
- Full papers 8 pages including references, short papers 4 pages; double-blind review with at least three reviewers
- Accepted papers that are presented go into the IEEE Xplore Digital Library
- One author must register at the non-student rate for a paper to appear in the proceedings
- Held a few days before FPL in 2026, so both can be attended in one trip
- CCF C (2026 list); not listed in CORE ICORE2026
