notes:
- Annual workshop of the DCASE community, held together with the yearly DCASE challenge on sound event detection
  and acoustic scene classification
- Proceedings freely available on Zenodo with a DOI and ISBN (2025 ISBN 978-84-09-77652-8)
- Challenge participants submit technical reports; workshop papers are a separate peer-reviewed track
- About 100 to 130 registered participants and 66 to 69% paper acceptance in recent in-person editions; industry
  sponsors include Google and Apple
- Not listed in CORE ICORE2026 or the CCF 2026 list
- Held in Europe, Japan and the USA (Tampere 2023, Tokyo 2024, Barcelona 2025, Boston 2026)
