notes:
- One-day workshop on LLVM, MLIR and Flang based compilers, tools and runtimes for HPC and AI, held with SC; 2026 is the 12th edition
- In cooperation with IEEE Computer Society and ACM
- Contributed papers of at least 5 pages (8 two-column pages maximum in 2026, excluding references) plus an invited talk and short talks
- Accepted papers appear in the SC workshop proceedings (IEEE Xplore for SC26)
- 2026 papers use the IEEE template; 2025 used the ACM template with single-blind review
- Held at SC every year in the USA (St. Louis 2025, Chicago 2026)
- Not listed in CORE ICORE2026
