notes:
- Half-day workshop co-located with CVPR on fisheye, catadioptric and 360 degree vision
- Held with CVPR in 2020, 2021, 2022, 2023, 2024 and 2026 (no 2025 edition); 2026 was the 6th edition
- Up to 8 pages excluding references in CVPR format, double-blind review on OpenReview
- Accepted papers are presented as posters and published in the CVPR Workshops proceedings
- 4 papers in the CVPR 2026 workshop proceedings on CVF Open Access
- Not listed in ICORE2026 or the CCF list
