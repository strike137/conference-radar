notes:
- Long-running annual small satellite conference run since 1987 by Utah State University and its Space Dynamics Laboratory; 2026 was the 40th edition
- Held in Utah, USA; 2026 edition at the Salt Palace Convention Center, Salt Lake City
- Large mixed academic and industry event (2026 site reports 5550 attendees and 450 exhibiting companies)
- Research and Academia and Enterprise technical sessions, posters, flash talks and NASA short talks; communications and ground systems are regular session topics
- Talks are selected from abstracts; full papers are due after acceptance and posted open access on DigitalCommons@USU, not in a formal series or digital library
- Frank J. Redd Student Competition with prizes up to 10000 USD
- "Registration 775 USD early, 350 USD for students (2026)"
- Aerospace venue outside the usual CS rankings, not listed in ICORE2026
