notes:
- Non-profit, volunteer-run practitioner conference on public cloud and cloud-native security, organized by the Forward CloudSec Association (US 501(c)(3))
- Two editions a year since 2024 -> North America (June) and Europe (September)
- "North America venues: Salt Lake City 2021, Boston 2022, Arlington VA 2024, Denver 2025, Bellevue WA 2026"
- "Europe venues: Brussels 2024, Berlin 2025, London 2026"
- Two-round CFP via Pretalx; first-pass review is blind; sales pitches are rejected; first-time speakers can ask for detailed feedback
- No proceedings; talk recordings are posted on YouTube
