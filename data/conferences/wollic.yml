notes:
- Annual forum on interdisciplinary research in logic, computing and programming theory, and natural language and reasoning, running since 1994
- Despite the name it is a standalone meeting with invited talks, tutorials and contributed papers, not a co-located workshop
- Proceedings in Springer LNCS (published after the meeting in 2026, before it in 2027); abstracts also appear in the Logic Journal of the IGPL
- Selected papers invited to a post-conference journal special issue after a new round of review
- Papers up to 12 pages in LNCS format plus up to 5 pages of references and appendices; submission via EasyChair
- At least one author must pay a full on-site registration fee for the paper to appear in the proceedings
- Started in Brazil and now rotates worldwide (Halifax 2023, Bern 2024, Porto 2025, Lima/online 2026, Helsinki 2027)
- ASL student members can apply for travel grants
- Ranked C in ICORE2026 (B in CORE2021 and earlier, C in CORE2023); not on the CCF list
