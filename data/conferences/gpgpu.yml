notes:
- Long-running workshop on GPU architecture, programming models, compilers and applications; 18th edition in 2026
- Series started in 2007 at Northeastern University; held with ASPLOS 2008-2014, with PPoPP 2015-2018, and in cooperation with ASPLOS in 2026
- Recent editions in Pittsburgh (2026), Las Vegas (2025), Edinburgh (2024), Montreal (2023) and online (2022)
- Proceedings are in the ACM Digital Library (2024, 2025 and 2026 editions; the 2023 call named the ACM Online Conference Proceedings Series)
- Full papers of up to 6 pages in ACM format; authors choose whether to reveal their identity
- Half-day program with one keynote and about six papers in 2026
- Not listed in CORE ICORE2026
