notes:
- CVPR workshop on domain generalization beyond classification and images, multimodal and open-world settings, and calibration
- 1st edition at CVPR 2025 in Nashville, 2nd at CVPR 2026 in Denver
- Archival track (up to 8 pages) goes into the CVPR Workshops proceedings; non-archival track for 4-page short papers and CVPR dual submissions
- Double-blind review via Microsoft CMT in CVPR format
- 17 papers on CVF Open Access for 2025, 10 for 2026
- Best paper prize (750 USD in 2025) sponsored by AWL Inc Japan
- Not listed in ICORE2026 or the CCF list
