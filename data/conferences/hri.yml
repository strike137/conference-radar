notes:
- Sponsored by ACM SIGCHI and SIGAI and IEEE RAS; the premier venue for human-robot interaction research
- CORE A* (ICORE2026); full papers archived in the ACM Digital Library
- Highly selective two-stage review with rebuttal and a program committee meeting; double-blind; full papers up to
  8 pages excluding references; mandatory abstract one week before the paper deadline
- Five full paper tracks; also short contributions, late-breaking reports, alt.HRI, videos and demos, industry
  white papers, student design competition and HRI Pioneers
- Location rotates worldwide (Edinburgh 2026, Santa Clara 2027)
