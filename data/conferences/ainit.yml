id: ainit
name: AINIT
full_name: International Seminar on Artificial Intelligence, Networking and Information Technology
type: conference
tier: minor
areas: [ai, networking, communications]
region: china
language: english
frequency: annual
organizer: AEIC (AiScholar, ais.cn) conference service with a host university each year (Dalian Jiaotong University in 2026)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 570 USD or 3800 CNY per 4-page paper (2027, regular); 510 USD early bird before 2027-02-23; 60 USD per extra page; attendee without paper 225 USD
typical:
  deadline_months: [2]
  conference_months: [4, 5]
links:
  website: http://www.ainit.org/
notes:
- Annual since 2020 and held in China (virtual 2020 and 2021, Shanghai 2022, Nanjing 2023 and 2024, Shenzhen 2025, Dalian 2026)
- Run by a commercial conference service (AEIC/AiScholar) with a different host university each year
- Proceedings published by IEEE (2025 and 2026 covers on the site), submitted to EI Compendex and Scopus
- Despite the name it is an ordinary paper conference with keynotes, oral and poster sessions
- Presenter (abstract only) and listener registration are also offered
- Not listed in CORE ICORE2026 or the CCF list
