notes:
- Run by the ECE department of IEM Kolkata since 2017 with technical co-sponsorship of the IEEE Kolkata Section
- Held at IEM Kolkata except the online 2022 edition; the 10th edition in 2027 moves to IIT Guwahati, co-organized with IIT Guwahati
- Topics are electronics, VLSI and devices, nano-materials, opto-electronics and materials engineering rather than computing
- Proceedings in IEEE Xplore for 2017 to 2021, 2023, 2025 and 2026; the online 2022 edition was published by River Publishers
- Papers in IEEE format submitted via Microsoft CMT; includes an IEEE WIE session
- Dates have drifted between editions (April to December in earlier years, around early February in 2025 and 2026, June in 2027)
- Not listed in ICORE2026 or the CCF list
