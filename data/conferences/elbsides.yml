notes:
- North Germany's annual community-run computer security conference in Hamburg
- Editions in 2019, 2021, 2023, 2024, 2025 and 2026
- Main conference at Hotel Hafen Hamburg (Elbkuppel); 2026 workshops the day before at Jungheinrich, Hamburg-Wandsbek
- Tickets at a nominal charge; the 2026 edition sold out
- Talks only, no proceedings
