notes:
- Large Polish practitioner security conference with 150+ talks in 15+ tracks
- One online day followed by one on-site day at PGE Narodowy, Warsaw, with the CyberSec Expo
- Call for speakers reviewed by a programme council; English preferred, Polish accepted
- Talks are recorded; no papers or proceedings
- Paid ticket packages; 50% student discount for under-24s; Expo entry is free
