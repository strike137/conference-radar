notes:
- Workshop on quantum networking and distributed quantum computing, co-located with ACM SIGCOMM (Coimbra 2025, Denver
  2026)
- Papers appear in the SIGCOMM 2025 workshop proceedings in the ACM Digital Library and count as published work
- Research papers up to 6 pages including figures, tables and appendices, plus extended abstracts of 2 pages; references
  do not count; ACM SIGCOMM two-column format
- Half-day workshop in 2025, full-day in 2026, held on the first day of SIGCOMM
- Not listed in the CORE portal (ICORE2026); not the same venue as QCNC
