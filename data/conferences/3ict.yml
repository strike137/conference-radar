notes:
- Annual general computing conference run by the College of Information Technology, University of Bahrain, since 2018
- Proceedings of every edition from 2018 to 2025 are in IEEE Xplore; papers use the IEEE conference template and are submitted via EDAS
- Held at the University of Bahrain; 2023 and 2024 editions were virtual, 2025 and 2026 editions hybrid
- Topics span AI, cybersecurity, blockchain, IoT, cloud, big data, software engineering and computer vision
- Selected authors are invited to submit extended papers to the Arab Journal of Basic and Applied Sciences and the International Journal of Computing and Digital Systems
- Not listed in the CORE ICORE2026 portal
