notes:
- Half-day workshop on quantum computing and HPC integration for science (hybrid algorithms, architectures, applications)
- Held with IEEE IPDPS since 2025 (Milan 2025, New Orleans 2026, Seattle 2027); 2027 is the third edition
- Full papers up to 6 pages and short papers up to 4 pages, IEEE style, plus up to 2 pages of references; single-blind review
- Workshop proceedings submitted to IEEE Xplore with the IPDPS workshops
- Chaired by LBNL researchers (Anastasiia Butko, Katie Klymko, Jonathan Carter) with RIKEN and University of Arkansas
- Not listed in CORE ICORE2026; not on the CCF 2026 list
