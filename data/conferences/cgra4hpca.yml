notes:
- Workshop on coarse-grained reconfigurable arrays (CGRAs) for HPC and AI, covering architectures, compilers, runtimes and applications
- Co-located with IEEE IPDPS, so it moves with IPDPS (New Orleans 2026, Seattle 2027); 2027 is the sixth edition
- Accepted papers go into the IPDPS workshop proceedings, submitted to IEEE Xplore
- Papers up to 8 pages, IEEE conference style; single-blind review
- Industry and startup talks on new CGRA technologies in a lightning session
- Organized by Artur Podobas (KTH), Kentaro Sano and Tomohiro Ueno (RIKEN) and Jason Anderson (University of Toronto)
- Not listed in CORE ICORE2026; not on the CCF 2026 list
