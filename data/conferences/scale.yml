notes:
- Community-run open source and Linux conference, billed as the largest community-run open source conference in North America
- Four days of sessions, workshops and an expo floor covering open source, security, DevOps, cloud native, kernel and more
- Talk proposals (short and long abstract) reviewed by a volunteer program committee of about 40 people; no papers or proceedings
- Talks are about 45 minutes and in person only; speakers get a complimentary full conference pass but no travel support
- Co-located events include SunSecCon, PostgreSQL@SCaLE, DevOpsDay LA, Cloud Native Days, PlanetNix and AstriCon
- Held at the Pasadena Convention Center, Pasadena, California, near Los Angeles
