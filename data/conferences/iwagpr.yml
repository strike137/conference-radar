links:
  website: https://www.iwagpr2025.gr/
notes:
  - Biennial workshop on ground penetrating radar (GPR) systems, antennas, signal and image processing, modelling, inversion and applications; first held in 2001 at TU Delft
  - Standalone event despite the name; held in European cities (Florence 2015, Edinburgh 2017, The Hague 2019, Valletta 2021, Lisbon 2023, Thessaloniki 2025)
  - Papers of 4 to 6 pages, reviewed by the scientific committee; almost all editions published in IEEE Xplore (2019 with EAGE)
  - Best Student Paper Award supported by URSI Commission F
  - 2025 had 163 participants from 34 countries and 83 papers, the largest edition so far
  - In 2025 the IWAGPR and GPR conference scientific committees formally merged
  - Next host chosen by bid at the preceding workshop; IWAGPR 2027 announced for Italy
  - IEEE GRSS was a technical sponsor in 2025
  - Not listed in ICORE2026 or the CCF list
