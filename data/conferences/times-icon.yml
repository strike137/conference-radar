notes:
- Run with the IT Management program of the Faculty of Engineering, Mahidol University (patron) and the Association of Thai Digital Industries (ATDI, financial sponsor)
- Supported by the IEEE Thailand Section and the IEEE EMBS Thailand Chapter
- Scope mixes technology and innovation management with IT and engineering (data science, AI, IoT, blockchain, cybersecurity management, healthcare IT, smart city, digital business)
- Accepted papers are expected to appear in IEEE Xplore (EI indexed); selected papers invited to the Journal of Mobile Multimedia
- Held in Bangkok, Thailand (2025 and 2027 editions)
- "Acceptance rate: about 63% (2025, 57/90)"
- Submission via EDAS; the 6th edition was in December 2025 and the 7th is set for June 2027, so the schedule is irregular
- Not ranked by CORE (ICORE2026); not in the CCF list
