notes:
- Flagship application security conferences of the OWASP Foundation, held twice a year as a European and a US edition
- "Past and current hosts: EU in Dublin (2023), Lisbon (2024) and Vienna (2026); US in Washington DC (2023) and San Francisco (2024, 2026)"
- Each edition has three days of paid hands-on training followed by two conference days; training and conference are separate tickets
- Talks selected through a call for presentations; no proceedings, talks are posted on the OWASP YouTube channel
- EU 2026 marked OWASP's 25th anniversary with 800+ attendees expected, plus a project demo lab, CTF and the MAScon mobile security track
- Training and conference sessions count for CPE credits
