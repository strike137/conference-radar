notes:
- Founded in 2022 in Hangzhou, China; run by a conference secretariat with a Chinese language site and fees in CNY and USD
- Sponsored by IEEE ComSoc and listed on the IEEE conference site (ID 72925 for 2026)
- Proceedings published by IEEE in IEEE Xplore since 2023 and submitted to EI Compendex and Scopus
- Held in Hangzhou (2022 online, 2023), Bangkok (2024), Singapore (2025) and Hong Kong (2026); hybrid with Zoom
- Full papers up to 5 pages, extra page fee from page 6; each accepted paper needs one paid registration
- Not listed in CORE ICORE2026
