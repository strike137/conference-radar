links:
  website: https://luhme.up.pt/
notes:
- Workshop on how meaning is represented, inferred and negotiated by humans and machines (semantics, pragmatics, dialogue, LLM understanding)
- Co-located with ECAI in 2024 (Santiago de Compostela) and 2025 (Bologna), and with EMNLP in 2026 (Budapest)
- Organized by the University of Porto (CLUP, LIACC), the University of Eastern Finland and the Universidad de Alcala
- Proceedings in the ACL Anthology; the 2024 and 2025 volumes were published by the University of Porto, the 2026 volume by ACL
- 2026 papers up to 8 pages, double-blind review via OpenReview; ARR commitments accepted
- Not ranked in CORE ICORE2026
