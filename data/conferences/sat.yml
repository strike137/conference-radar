notes:
- Main annual venue for propositional satisfiability, MaxSAT, pseudo-Boolean, QBF, SMT, model counting and SAT-related CP
- Proceedings in LIPIcs (open access, Dagstuhl)
- CORE A (ICORE2026), CCF B
- Long papers (9 to 15 pages), short papers and tool papers (up to 8 pages), LIPIcs format
- Single-blind review with abstract registration about a week before the paper deadline and an author rebuttal
- Often co-located (with CP and SoCS in Glasgow 2025, part of FLoC in Haifa 2022 and Lisbon 2026)
- Mostly Europe but rotates worldwide (Barcelona 2021, Haifa 2022, Alghero 2023, Pune 2024, Glasgow 2025, Lisbon 2026, Barcelona 2027)
