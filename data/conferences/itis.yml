id: itis
name: ITIS
full_name: IEEE Information Technology International Seminar
type: conference
tier: minor
areas: [general, ai, networking]
region: southeast-asia
language: english
frequency: annual
organizer: Faculty of Computer Science, UPN "Veteran" Jawa Timur
organizer_country: [indonesia]
proceedings: IEEE Xplore
archival: true
fee: 300 to 400 USD online, 400 to 500 USD onsite for international authors depending on IEEE/student status (2026)
typical:
  deadline_months: [7, 8]
  conference_months: [10]
links:
  website: https://2026.itisconf.org/
notes:
- Run by the Faculty of Computer Science, UPN "Veteran" Jawa Timur (Surabaya) since 2009; 2026 is the 12th edition
- Technically sponsored by the IEEE Indonesia IMS/ITS Joint Chapter since 2024 (IEEE CAS/RAS Indonesia before);
  proceedings in IEEE Xplore since 2020, earlier editions were part of UPN's IJCST/ICST/ICSS proceedings
- 'Three tracks: instrumentation and measurement, computational intelligence, information technology'
- Hybrid; held in Indonesian tourist destinations (Mataram, Lombok in 2025; Kuta, Bali in 2026); submission via EDAS
- In 2026 day 1 (Oct 14) is online registration only, the in-person program is on Oct 15 and Oct 16 is an optional tour
- Deadlines are extended in steps (2026 deadline moved from July 31 to a final August 31)
