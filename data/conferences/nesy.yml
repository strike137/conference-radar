notes:
- Annual meeting of the Neurosymbolic Learning and Reasoning Association; run since 2005, as a workshop until 2023
- Proceedings in PMLR (2025 is volume 284, 58 papers); extended versions invited to the Neurosymbolic Artificial
  Intelligence journal (IOS Press)
- CORE C (ICORE2026)
- Two submission rounds on OpenReview with a revise-and-resubmit option; double-blind; full papers 10 pages,
  short papers 5 pages; reviews of accepted papers made public
- In-person only; held in Santa Cruz, USA (2025) and Lisbon, Portugal (2026)
