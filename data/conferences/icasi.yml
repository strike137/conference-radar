notes:
- Run by the Taiwanese ITIKI with the IEEE Nanotechnology Council Tainan Chapter; committees are mostly from Taiwanese universities
- Very broad multidisciplinary scope (materials, communications, computer science, EE, mechanical engineering, management, design)
- Abstract-first submission (up to 250 words), then a 3 to 6 page full paper; invention and design fair (MADF and TIIDF) sessions run alongside
- 2026 proceedings go to the IET Digital Library (also listed in IEEE Xplore) and papers outside the IET scope to a Taylor and Francis proceedings volume; 2019 to 2025 proceedings are in IEEE Xplore
- Held in Japan or Taiwan (2021 Alishan, 2022 Sun Moon Lake, 2023 Chiba, 2024 Kyoto, 2025 Tokyo, 2026 Kyoto)
- "Registration fee: 650 USD regular early, 550 USD for IEEE or IET members (2026)"
- Sister conference IET ICICE is run by the same institute
- Not listed in the CORE portal (ICORE2026)
