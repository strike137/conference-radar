notes:
- Signal processing conference with a strong radar, remote sensing and intelligent sensing focus, run by Beijing Institute of Technology
- Sponsored by IEEE Signal Processing Society, IEEE Guangzhou Section and the Signal Processing Society of the Chinese Institute of Electronics
- Only two editions so far (Chongqing 2019, Zhuhai 2024); no later edition announced
- Large event with mostly poster papers; 2024 had 137 oral and 550 poster papers plus 171 invited talks
- Papers must be presented in person to appear in IEEE Xplore; the 2024 proceedings went online in February 2025
- Not ranked in CORE ICORE2026; not on the CCF 2026 recommended list
