notes:
- Workshop at The Web Conference 2026 on zero-knowledge proofs, blockchain and post-quantum migration for decentralized systems
- Led by Shiho Kim (Yonsei University), with organizers from KAUST, Khalifa University, Inha University, Penn State and RISE
- Held virtually during WWW 2026
- Extended abstracts (2 pages), short papers (4 pages) and full papers (8 pages), ACM double-column format, double-blind review on OpenReview
- Inclusion in The Web Conference 2026 Companion Proceedings (ACM DL) is optional at the authors' choice; ACM APC of about 250 to 350 USD may apply
- Not listed in the CORE ICORE2026 portal
