notes:
- Young IEEE MTT-S and AP-S symposium on microwaves, antennas and wireless technologies, started in 2023
- Held mostly in Africa (Egypt 2023, Morocco 2024, Kenya 2025, Stellenbosch 2027); 2026 edition in Jeddah, Saudi Arabia
- Papers of 3 to 6 pages in IEEE two-column format, submitted via EDAS; registered and presented papers are sent to IEEE Xplore
- Workshops, tutorials, young professional competitions and travel grants for students and early-career researchers
- Not listed in ICORE2026 or the CCF list
