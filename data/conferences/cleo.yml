notes:
- Long-running flagship conference on lasers, photonics and electro-optics, presented by Optica, the IEEE Photonics Society and the American Physical Society; CLEO is a registered trademark of Optica
- Over 2,000 technical presentations in 29 topic categories, split into Fundamental Science, Science and Innovations, and Applications and Technology, with a large exhibition
- Contributed papers are a 35-word abstract plus a two-page summary, peer reviewed by the Technical Program Committee; postdeadline papers are oral only
- Presented papers are published through the Optica Publishing Group platform and submitted to IEEE Xplore; indexed in Ei Compendex and Scopus
- Held in the USA every May (San Jose 2022 and 2023, Charlotte 2024 and 2026, Long Beach 2025 and 2027)
- Photonics venue rather than computer science; not listed in ICORE2026 or CCF
