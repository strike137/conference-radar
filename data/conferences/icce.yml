notes:
- Flagship conference of IEEE Consumer Technology Society; traditionally held in Las Vegas in January alongside
  CES
- 2026 edition (44th) moved to Dubai in February; 2027 (45th) returns to Las Vegas
- 2 to 6 page papers via EDAS; single-blind (author names not removed); IEEE Xplore
- Tracks include Security and Privacy in Consumer Technology, PUF and Security, and ML/AI in CE
- Not to be confused with ICCE, the International Conference on Computers in Education (CORE C)
