notes:
- Organized by IARIA as part of the DigitalWorld congress, co-located with ACHI, GEOProcessing and other IARIA events (21st edition in 2027)
- Covers e-government, e-health, digital services, privacy and security in the digital society
- Published open access in the IARIA ThinkMind library (ISSN 2308-3956); prints via Curran Associates; selected papers invited to IARIA journals
- CORE C (ICORE2026); IARIA events are generally regarded as low-selectivity
- Held in southern Europe (Nice, Porto, Venice, Barcelona, Lisbon in recent years); onsite and online participation offered
- The 2027 edition moves earlier to April, with the submission deadline in December 2026
