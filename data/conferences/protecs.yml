notes:
- One-day workshop affiliated with Eurocrypt (2024 Zurich, 2025 Madrid, 2026 Rome); third edition in 2026
- Call for presentations, not papers; abstracts of up to 3 pages for 15 to 30 minute talks
- Nothing is published; talks on existing publications and work in progress are welcome
- Topics include reductions, simulation, computer-aided proofs and teaching proof techniques
- Registration goes through the Eurocrypt registration
- Not listed in ICORE2026 or the CCF 2026 list
