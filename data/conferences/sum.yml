frequency: biennial
organizer: SUM steering committee with a local host university (National Technical University of Athens in 2026)
organizer_country: [europe]
proceedings: Springer LNAI
archival: true
typical:
  conference_months: [10, 11]
links:
  website: http://sum2026.math.ntua.gr/
notes:
- Small conference on uncertainty in AI and databases (uncertainty reasoning, argumentation, inconsistency,
  probabilistic and possibilistic logics, incomplete knowledge); first held in 2007
- Proceedings in Springer LNCS, LNAI subseries (2022 -> LNCS 13562, 2024 -> LNCS 15350, 2026 -> LNCS 17188)
- Long, short and extended abstract submissions with single-blind review; long and short papers go to LNAI, extended
  abstracts of already published work only to a separate booklet
- "Acceptance: 23 full and 6 short papers from 38 submissions (2026); 28 full and 7 short from 43 (2024)"
- Annual until 2020, every two years since (2020 Bolzano, 2022 Paris, 2024 Palermo, 2026 Athens)
- Held in Europe in recent years (Milan 2018, Compiegne 2019, Bolzano 2020, Paris 2022, Palermo 2024, Athens 2026);
  earlier editions also in the USA and Canada
