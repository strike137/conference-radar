notes:
- Premier international event on logic programming since 1982 (Marseille); answer set programming, Prolog,
  semantics, program analysis and implementation
- Regular papers (up to 14 pages) appear in the journal Theory and Practice of Logic Programming (TPLP)
- Technical Communication papers (up to 12 pages) and the Recently Published Research track appear in EPTCS
- Regular papers not accepted for TPLP may be invited to the Technical Communication proceedings
- Part of FLoC every four years (Haifa 2022, Lisbon 2026); other recent editions in London 2023, Dallas 2024 and
  Rende (Italy) 2025
- Workshops, a Doctoral Consortium, a summer or autumn school and the LP/CP programming contest are co-located
- CORE B (ICORE2026)
