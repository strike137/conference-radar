notes:
- International conference on computer-aided design, computer graphics and visualization, held since 1989 and
  affiliated with the China Computer Federation (CCF); 2026 is the 20th edition
- Biennial until 2025 (odd years), but the 20th edition follows one year later in December 2026
- Run by the CCF Technical Committee on CAD and Graphics with a local host university, together with Asiagraphics;
  2026 is hosted by Seoul National University with the Korea Computer Graphics Society
- Journal-first model with a revision round and no separate proceedings volume; 2025 papers went to Computers &
  Graphics, Graphical Models, CSIAM Transactions on Applied Mathematics and Visual Informatics, 2026 papers are
  invited to IEEE TVCG, Computers & Graphics, Visual Informatics and CSIAM Transactions on Applied Mathematics
- Full papers in English, up to 12 pages in Computers & Graphics style, double-blind review via CMT
- Usually held in China (Zhangjiajie 2017, Qingdao 2019, Xi'an 2021, Shanghai 2023, Yantai 2025); 2026 is held in
  Seoul, Korea
- 2025 was co-located with the Chinese-language CCF CAD/CG conference
- Each accepted paper needs one full registration, even if all authors are students
- CCF C (computer graphics and multimedia); not listed in the CORE ICORE2026 portal
- About 200 to 250 participants expected in 2026
