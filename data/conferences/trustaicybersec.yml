notes:
- Third edition in 2026; moved from IEEE ISCC (2024 Paris, 2025 Bologna, IEEE Xplore proceedings) to ACM CCS 2026 in The Hague
- 'Topics: trusted computing and remote attestation, AI for intrusion detection, post-quantum crypto integration, incident response, IoT security'
- 2026 papers up to 10 pages in ACM sigconf format including references; anonymous submission via HotCRP; full research and SoK papers
- 2026 papers are published in the ACM Digital Library; a small one-day program (eight papers plus two keynotes in 2026)
