notes:
- The main IAPR conference on document analysis and recognition (OCR, handwriting, layout, tables, historical documents,
  scene text, document understanding)
- Biennial until 2023, annual since 2024; rotates worldwide (San Jose 2023, Athens 2024, Wuhan 2025, Vienna 2026, Kuala
  Lumpur 2027)
- Proceedings in Springer LNCS (four volumes in 2026); double-blind review with a rebuttal phase; up to 17 pages in LNCS
  format
- Separate ICDAR-IJDAR journal track with a November deadline; accepted papers appear in a special issue of IJDAR
  and get an oral slot
- Workshops, competitions, tutorials and a doctoral consortium run alongside the main conference
- Papers must be presented in person; each paper needs one regular (non-student) registration
- CORE A and CCF C
