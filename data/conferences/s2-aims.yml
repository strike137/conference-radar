notes:
- Formerly the International Conference on AI and Mobile Services (until 2023); renamed AI and Multimodal Services from 2024
- One of ten co-located conferences of SCF run by the Services Society, a US-registered nonprofit (siblings include ICWS, SCC, BigData, ICIOT and CLOUD)
- Proceedings in Springer LNCS; research and application/industry tracks up to 15 pages, short papers up to 8 pages
- Each submission reviewed by at least three program committee members; submission via EDAS
- Several submission rounds (early bird, regular, special track) in one cycle
- Covers AI models, multimodal understanding and generation, human and AI interaction, and AI delivered as a service
- 'Recent hosts: Seattle (2018), San Diego (2019), virtual (2020, 2021), Honolulu (2022, 2023), Bangkok (2024), Hong Kong (2025), Kuala Lumpur (2026)'
- 2026 theme was Agentic AI as a Service for Multimodal Services
- Not listed in ICORE2026; not on the CCF 2026 list
