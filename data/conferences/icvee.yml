language: english
frequency: annual
organizer: Faculty of Engineering, Universitas Negeri Surabaya (FT-UNESA); technically supported by IEEE Indonesia
  Section
organizer_country: [indonesia]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [6]
  conference_months: [9]
links:
  website: https://icvee.conference.unesa.ac.id/
notes:
- Run by the Faculty of Engineering of Universitas Negeri Surabaya (UNESA) as a joint conference of its Electrical
  Engineering and Informatics Engineering departments
- Accepted and presented papers are submitted to IEEE Xplore; IEEE no-show policy applies
- Scope mixes power, embedded systems, control, AI, information systems, telecommunications and antennas, and
  engineering education
- 4 to 6 page IEEE-format papers via EDAS; hybrid attendance
- Held in Surabaya, Indonesia (2021 to 2023 virtual, 2025 on the UNESA campus, 2026 at a hotel); editions in 2015, 2017
  and yearly since 2020
- Not listed in ICORE2026 or the CCF list
