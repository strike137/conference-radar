id: visiondocs
name: VisionDocs
full_name: Workshop on Computer Vision Systems for Document Analysis and Recognition
type: workshop
tier: minor
areas: [vision, ai]
region: north-america
language: english
frequency: annual
organizer: AVML Lab, University of Udine, with University of Modena and Reggio Emilia
organizer_country: [europe]
proceedings: IEEE Xplore and CVF Open Access (WACV or ICCV Workshops proceedings, regular papers)
archival: true
typical:
  deadline_months: [10, 12]
  conference_months: [1, 3]
links:
  website: https://sites.google.com/view/avml-lab-visiondocs-wacv2027/
notes:
- Workshop on document analysis with computer vision, multimodal and foundation models (layout analysis, handwriting, historical documents, document VQA)
- Editions at WACV 2025, ICCV 2025, WACV 2026 and WACV 2027
- Regular papers up to 8 pages go in the workshop proceedings; short papers up to 4 pages appear on the website only
- Double-blind review on OpenReview; papers must be presented in person
- 16 papers in the ICCV 2025 and 7 in the WACV 2026 workshop proceedings on CVF Open Access
- Not listed in ICORE2026 or the CCF list
