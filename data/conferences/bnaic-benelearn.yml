notes:
- Joint meeting of BNAIC (37th in 2025) and BeNeLearn (34th in 2025); overview of AI and ML research in Belgium, the Netherlands and Luxembourg
- Run under the auspices of BNVKI and the Dutch research school SIKS; hosted by a different Benelux university each year (Namur 2025)
- Accepts regular papers, encore abstracts of already published work, demos, bachelor/master thesis abstracts and late-breaking posters
- All accepted contributions go to non-archival CEUR pre-proceedings; selected regular papers are invited to Springer CCIS post-proceedings
- Single-blind review via OpenReview; prizes for best paper, best demo and best bachelor/master thesis
