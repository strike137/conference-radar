notes:
- Annual since 2009, steered from Southeast University (Nanjing); held in Chinese cities (Hefei 2024, Chongqing
  2025, Shenzhen 2026)
- Technically co-sponsored by IEEE and IEEE ComSoc; proceedings in IEEE Xplore
- Six pages plus one extra page with charge (50 USD); submissions via EDAS to symposia
- Deadline usually extended by several weeks and marked firm
