language: english
frequency: annual
organizer: IEEE Boston Section, with MIT Lincoln Laboratory as technical organizer
organizer_country: [usa]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [7]
  conference_months: [9]
links:
  website: https://ieee-hpec.org/
notes:
- Long-running conference on high performance and embedded computing, AI at scale, graph analytics and
  supercomputing (30th edition in 2026)
- Chaired by MIT Lincoln Laboratory staff and administered by the IEEE Boston Section; hosts the MIT/Amazon/IEEE
  Graph Challenge
- Held as a virtual conference (Engagez platform) in mid September; formerly in Waltham, MA
- Full papers up to 6 pages (extra pages 200 USD each) are submitted to IEEE Xplore; 2-page extended abstracts are
  shown as posters
- Extended abstracts and other accepted submissions are posted on ieee-hpec.org only and are non-archival
- Not listed in the CORE ICORE2026 portal
