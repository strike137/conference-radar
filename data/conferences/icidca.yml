notes:
- The 2027 edition is organized by and held at Woldia University, Weldiya, Ethiopia; tutorial chairs come from RVS College of Engineering and Technology, Coimbatore, India
- 2027 papers are to be submitted for inclusion in IEEE Xplore (Xplore compliant ISBN issued)
- Proceedings series has varied by year -> Springer (2019 to 2021), Elsevier Procedia Computer Science (2022, 2024), IEEE Xplore (2023, 2025)
- Broad scope covering communication signal processing, wireless systems, edge computing, data analytics, computer vision, IoT and cybersecurity
- Submission through Microsoft CMT; plagiarism must stay below 15% excluding references
- Part of a family of Tamil Nadu linked IEEE Xplore conferences (ICOEI, ICICV, I-SMAC and others) with a broad scope
- Not found in ICORE2026; not on the CCF list
