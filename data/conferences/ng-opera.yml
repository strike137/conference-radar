notes:
- Half-day workshop co-located with IEEE INFOCOM every year since 2023 (New York 2023, Vancouver 2024, London 2025,
  Tokyo 2026)
- Topics are O-RAN, AI-RAN, open-source RAN software, RAN slicing and 6G RAN architectures
- Accepted and presented papers appear in the IEEE INFOCOM proceedings in IEEE Xplore
- Papers 6 pages suggested, up to 8 pages with overlength charges, submitted via EDAS; posters and demos also solicited
- Not listed in ICORE2026
