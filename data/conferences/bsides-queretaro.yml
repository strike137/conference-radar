notes:
- Community Security BSides conference in Santiago de Querétaro, Mexico, serving the Bajío region
- The 2026 edition was the second one
- "2026 format: workshops at the Universidad Autónoma de Querétaro (Facultad de Informática) on day one, talks at Bloque on day two"
- Runs alongside BSides ICS/OT MX, billed as the first BSides in Mexico dedicated to industrial control systems and OT security
- Talks, workshops, villages and a CTF; speakers chosen through a CFP; no proceedings
- Program mostly in Spanish
