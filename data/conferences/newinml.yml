notes:
- Workshop for newcomers who have not yet published at a top ML conference (NeurIPS, ICML, ICLR); all ML topics
- Held at NeurIPS 2019, ICML 2022, NeurIPS 2022 to 2025, ICML 2025 and NeurIPS 2026
- 2026 edition is at the NeurIPS 2026 Paris satellite venue (main NeurIPS 2026 is in Sydney)
- Non-archival; papers of 2 to 8 pages in the NeurIPS template, double-blind review on OpenReview
- Reviews and feedback from invited researchers; best papers get awards and oral slots, accepted papers are posters
- Not listed in ICORE2026 and not on the CCF list
