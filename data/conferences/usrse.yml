notes:
- Annual conference of the US Research Software Engineer Association (US-RSE), a fiscally sponsored project of Community Initiatives
- 2027 is the fifth edition; held in a different US city each year (Philadelphia 2025, San Jose 2026, Ann Arbor 2027)
- Tracks for papers (up to 10 pages, IEEE template), talks, notebooks, BoFs, workshops and posters; all peer reviewed, submitted via EasyChair
- Papers, abstracts, notebooks and posters are published on Zenodo; accepted papers and talks can be extended (40% new content) for a special issue of Future Generation Computer Systems
- Poster deadline is after the main notification so rejected submissions can be resubmitted as posters
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
