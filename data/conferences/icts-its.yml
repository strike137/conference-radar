links:
  website: https://elib.its.ac.id/conf/icts/public/
notes:
- Run by the Department of Informatics at ITS Surabaya; IEEE technically co-sponsored
- Proceedings in IEEE Xplore (2014, 2015, 2016, 2017, 2019, 2021, 2023) and indexed by Scopus
- Papers not presented, or presented by someone outside the author list, are left out of IEEE Xplore
- Biennial (odd years) since 2017; the 15th edition was in 2025
- 2025 edition co-hosted by Universitas Udayana and held in Sanur, Bali, with an online day via Zoom
- 4 to 6 page papers, blind review via EDAS, similarity check with iThenticate (below 30% expected)
- 'Broad CS and ICT scope: intelligent systems, image processing, networks, security, software engineering,
  information systems'
- The 2025 submission deadline was extended by four weeks (22 Aug -> 19 Sep)
- Not listed in ICORE2026 or the CCF list
