notes:
- Annual general computing conference run by AASTMT in cooperation with the Computer Scientific Society, technically
  co-sponsored by the IEEE Alexandria Subsection; 36th edition in 2026
- Held every year at the AASTMT campus in Alexandria, Egypt, in a hybrid physical and virtual format
- Accepted papers go to the conference electronic proceedings with archival requested in IEEE Xplore (Scopus
  indexed); past proceedings are listed in IEEE Xplore
- Papers up to 6 pages in IEEE double column format, submitted via Microsoft CMT; full or short paper acceptance
- Selected papers are invited to the AASTMT Advances in Computing and Engineering (ACE) journal
- Submission deadlines are usually extended several times; the date shown is the final extension
- Not listed in CORE ICORE2026 or the CCF list
