id: msr4ps
name: MSR4P&S
full_name: International Workshop on Mining Software Repositories Applications for Privacy and Security
type: workshop
tier: minor
areas: [security, software]
region: worldwide
language: english
frequency: annual
organizer: Organizing chairs Nicolás E. Díaz Ferreyra (Hamburg University of Technology, Germany) and Zadia Codabux
  (University of Saskatchewan, Canada); supported by the EU SEC4AI4SEC project
organizer_country: [europe, canada]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [12]
  conference_months: [3]
links:
  website: https://msr4ps.github.io/
notes:
- Co-located with IEEE SANER since 2024; 1st edition 2022 at ESEC/FSE in Singapore, then Rovaniemi (2024), Montreal
  (2025) and Limassol (2026)
- Papers appear in the SANER companion proceedings (SANER-C) in IEEE Xplore
- Double-anonymous review; regular papers up to 8 pages and short papers up to 4 pages including references; 2-page
  poster abstracts are not included in the proceedings
- No edition in 2023
- Not listed in ICORE2026 (portal search returns no results) or the CCF list
