notes:
- National informatics conference of SADIO, the Argentine computing society, held since 1961; 55th edition in 2026
- Organized as a set of one or two day symposia, for example ASAID (AI and data science), ASSE (software engineering),
  SACS (cybersecurity and cyberdefense), SAIV (images and vision), ASQC (quantum computing) and a student contest
- Papers in Spanish, Portuguese or English; full papers up to 14 pages, short papers up to 4 pages
- Single-blind review by at least three committee members; in-person presentation required for publication
- Accepted papers appear in the JAIIO Memorias (ISSN 2451-7496) on revistas.unlp.edu.ar/JAIIO; extended best papers
  go to the Electronic Journal of SADIO (EJS)
- Held in Argentina each year (Buenos Aires 2025, La Plata 2026)
- Not listed in CORE ICORE2026
