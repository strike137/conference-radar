notes:
- One-day ICSE workshop on systems-of-systems (SoS) and software ecosystems (SECO), held every year since 2013
- Ran as joint SESoS/WDES editions from 2017 to 2021
- Steering committee chaired from Brazil (University of Sao Paulo, UNIRIO) with members from Europe, North America and Korea
- 2027 accepts research papers up to 8 pages and short papers up to 4 pages, IEEE format, single-blind review
- 2026 papers published in the ACM Digital Library; 2027 papers will be published in IEEE Xplore
- Selected 2027 papers are invited to a special issue of the Automated Software Engineering journal
- 2027 edition co-located with the IWSiB software-intensive business workshop
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
