notes:
- Organized by IARIA as part of the NexComm congress, co-located with ICN, ICDT, SPACOMM, MMEDIA and other IARIA events (22nd edition in 2027)
- Covers systems engineering and systems theory, design methodologies and formal methods for system behavior
- Published open access in the IARIA ThinkMind library (ISSN 2308-4243); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Portugal, Spain, France or Italy (Porto, Barcelona, Venice, Nice, Lisbon in recent years)
- Onsite and online participation options
