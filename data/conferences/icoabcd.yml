notes:
- Organized by ASASI (Bandung, Indonesia) with committee members from Telkom University and the IEEE Indonesia Section
- Annual since 2023 (1st 2023, 2nd 2024, 3rd 2025, 4th 2026), all editions held in Indonesia
- All previous editions published in IEEE Xplore and indexed in Scopus
- Four tracks covering AI, blockchain, cloud computing and data analytics
- Double-blind review by 2 to 3 reviewers; submission via EDAS
- Hybrid format (onsite and virtual presentation)
- Not listed in the ICORE2026 portal or the CCF 2026 list
