notes:
- Annual conference of the European Association for eXtended Reality (EuroXR, an AISBL registered in Brussels); called EuroVR until 2020
- Scientific track papers are published in a Springer LNCS volume (Virtual Reality and Mixed Reality series); top papers are invited to extend for Computers & Graphics
- "Three paper sizes in the scientific track: long 14 to 20 pages, medium 8 to 12, short 4 to 6 (Springer format, excluding references)"
- Two scientific deadlines, an earlier one with a rebuttal phase and a later one without; at least three reviewers, anonymous submission, in-person presentation required
- Application, poster and demo tracks take 2 to 4 page extended abstracts with a later deadline, published in a separate ISBN volume edited by VTT
- Held in Europe every year (Milan 2021, Stuttgart 2022, Rotterdam 2023, Athens 2024, Winterthur 2025, Valencia 2026)
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
