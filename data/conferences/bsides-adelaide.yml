notes:
- Community-driven Security BSides conference in Adelaide, South Australia; first edition in 2024, third in 2026
- Village-focused format (CTF, lockpicking, hardware hacking, careers, space) plus a central talk stream and workshops
- Joint Call for Talks and Villages on pretalx; talks are 30 minutes plus 10 minutes Q&A; first-time presenters welcome, no vendor sales floor
- 2026 edition held at the Amora/Hilton Adelaide
- No proceedings; volunteer-run and not for profit, tickets kept low cost
