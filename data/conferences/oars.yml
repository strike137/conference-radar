links:
  website: https://oars-workshop.github.io/
notes:
- Half-day workshop on real-time and adaptive recommender systems, run mainly by industry researchers
- Held with KDD 2021 to 2023 and 2025, with CIKM 2024 and with ACM RecSys 2026; 2026 was the sixth edition
- Double-blind review, ACM two-column template, submissions via EasyChair
- Requires work not published or under review elsewhere; accepted papers are posted on the workshop website
- At least one author must register and present in person
- Not listed in the CORE ICORE2026 portal
