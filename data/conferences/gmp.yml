notes:
- Annual conference on geometric modeling, simulation and computing; one of the three flagship conferences of Asiagraphics
- Accepted papers form a special issue of Computer-Aided Geometric Design (CAGD, Elsevier); journal-first style two-stage review
- Papers needing major revision may be recommended to CAGD for a fast-track submission
- Full papers of 10 to 15 pages, double-blind review, submission via the Eurographics SRM system
- Rotates worldwide (Plzen 2021, Okinawa 2022, Genova 2023, Qingdao 2024, St. Louis 2025, Plzen 2026)
- ICORE2026 rank C (listed as Geometry Modeling and Processing); CCF C (computer graphics and multimedia)
