notes:
- Annual North Macedonian computer science conference run by the ICT-ACT association with FCSE, Ss. Cyril and Methodius University in Skopje, since 2009; 2026 was the 18th edition
- Full papers published in Springer CCIS; short papers go to web proceedings
- Held in North Macedonia (Skopje 2022, Ohrid 2023 to 2025, Struga 2026; online 2021)
- Each year has a theme; recent editions focus on AI and digital technologies
- Single-blind review with at least three reviewers per paper; papers up to 15 pages in Springer format
- Not listed in the CORE portal (ICORE2026)
