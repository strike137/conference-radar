notes:
- Sponsored by ACM SIGCHI and ACM SIGGRAPH; premier venue for novel user interface software and hardware
- Accepted papers are archival in the ACM DL; ACM Open from 2026
- Abstract deadline one week before the paper deadline; rebuttal phase and conditional acceptance
- Anonymized two-column submissions; standard and short papers
- Mostly held in North America (Busan, Korea 2025; Detroit 2026)
