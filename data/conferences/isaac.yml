notes:
- Long-running algorithms and theory of computation symposium, held since 1990
- Rotates in the Asia-Pacific region (Kyoto 2023, Sydney 2024, Tainan 2025, Hangzhou 2026)
- Advisory committee drawn from Japan, Korea, Hong Kong, Taiwan, Australia and China, chaired from Kyoto University
- Proceedings in the open-access LIPIcs series since 2016
- Double-blind review; 12 pages in LIPIcs style excluding title page, references and appendix
- Selected papers invited to Algorithmica and Computational Geometry (CGTA) special issues
- Best Paper and Best Student Paper awards
- CORE B in ICORE2026, CCF C
