notes:
- Practitioner cybersecurity conference in Davenport, Iowa, USA, run by a small nonprofit (Docent Institute); 2026 was the 12th edition (CornCon 12)
- Main conference Friday and Saturday at the RiverCenter in Davenport, with an invitation-only CISO Executive Summit on the Thursday
- Also runs a high school cyber career day and a K-12 Kids Hacker Camp alongside the conference
- Multiple speaking tracks with 45-minute talks, plus workshops, contests, villages and a vendor expo
- Rolling call for presentations; organizers aim to close it by the end of June; no travel reimbursement for speakers
- Talks are recorded and posted on YouTube (CornCon.tv); no proceedings
- Not found in ICORE2026 or the CCF list
