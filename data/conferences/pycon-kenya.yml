notes:
- Community-run conference of the Python community in Kenya, organised by the Python Nairobi User Group (PyNBO)
- Held in Nairobi at the Ngong' Hills Hotel in 2025 and 2026; earlier editions in 2017, 2018 and 2022
- Keynotes, talks and lightning talks chosen from an open call for proposals; one proposal per person, in person only
  with no live stream
- Proposals written largely by an LLM are rejected
- 627 attendees and over 40 sessions in 2025; data science and ML the largest topic, then web and DevOps
- Talks only, no papers or proceedings; keynotes and talks are recorded for the PyCon KE YouTube channel
