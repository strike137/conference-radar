notes:
- Annual AI and intelligent systems conference run by the Faculty of Computer Science at MSA University, Egypt, since 2023
- Held every July at MSA University in 6th of October City (Giza), Egypt
- Accepted and presented papers are submitted to IEEE Xplore; Scopus indexing announced, subject to IEEE approval
- Topics include AI tools and applications, machine learning, data science, HCI, computer vision and cybersecurity
- The 2026 event page also calls it the IEEE Conference on Intelligent Systems, AI, and Applications
- Not listed in the CORE ICORE2026 portal
