notes:
- Biennial cryptography and information security conference held in even years since 2002, run from the University of Salerno
- Always held in Amalfi, Italy (2020 edition was virtual)
- In cooperation with IACR; 2026 edition had IACR-ICW status
- Proceedings in Springer LNCS (SCN 2024 in two volumes, LNCS 14973 and 14974)
- Non-anonymous submissions of at most 20 pages in LNCS format, via EasyChair
- 'CORE rank: National: Italy (ICORE2026); not on the CCF list'
- SCN 2024 selected papers were invited to a special issue of Cryptography and Communications
