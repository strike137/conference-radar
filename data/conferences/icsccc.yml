notes:
- Organized by the CSE department of Dr B R Ambedkar NIT Jalandhar, Punjab, India, and technically sponsored by IEEE (IEEE Delhi Section)
- Editions in 2018 (December), 2021 (May, virtual), 2023 (May) and 2026 (May), all run from NIT Jalandhar
- Proceedings of the 2018, 2021 and 2023 editions are in IEEE Xplore; 2026 accepted papers are submitted to IEEE Xplore
- Five tracks in 2026 (cyber security, secure software systems, machine intelligence, cloud and data analytics, computer networks and security)
- "Acceptance rate: 47.86% (2021, 112/234), 40.6% (2023, 217/534)"
- Submission via Microsoft CMT in IEEE conference format
- Not listed in the CORE ICORE2026 portal
