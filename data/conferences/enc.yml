  website: https://enc-series.org/
notes:
- Annual European positioning, navigation and timing (PNT) conference for industry, academia, government and users
- Held in Europe; ESA ESTEC in Noordwijk hosted 2023, 2024 and 2027, with Wroclaw 2025 and Vienna 2026
- Selection is based on abstracts reviewed by the technical programme committee; early submissions get priority
- Full papers are optional and submitted after the conference; only papers presented at ENC enter peer review
- Accepted papers (4 to 9 pages) appear in a dedicated open access volume of MDPI Engineering Proceedings with a DOI,
  plus a conference e-book with ISBN
- Navigation venue outside the usual CS rankings, not listed in ICORE2026 or the CCF 2026 list
