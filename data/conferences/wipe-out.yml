notes:
- Workshop on machine unlearning and privacy preservation co-located with ECML PKDD; 2nd edition in 2026
- First edition 2025 in Porto was titled Workshop on Innovations, Privacy-preservation, and Evaluations Of machine Unlearning Techniques (about 50 participants)
- Not the same as STMUS (ESORICS unlearning workshop)
- Post-proceedings in Springer CCIS as part of the joint ECML PKDD workshop volumes; authors may opt out
- Full and reproducibility papers up to 14 pages, short, demo and position papers up to 8 pages, LNCS format, double-blind, at least three reviewers
- Submission via the ECML PKDD workshop CMT; pitch-style talks and head-to-head paper debates
- Not listed in CORE ICORE2026
