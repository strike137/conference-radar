notes:
- One-day regional student colloquium on NLP, speech and machine learning for students and postdocs in the US
  Mid-Atlantic area, with keynotes, oral talks and poster sessions
- Formerly MASC-SLL (Mid-Atlantic Student Colloquium on Speech, Language and Learning); renamed MASC-ALL for 2026, the 13th edition
- Held since 2011; hosts include George Mason (Arlington, 2023), Johns Hopkins (Baltimore, 2024) and Howard University
  (Washington DC, 2026)
- Submissions are one-page summaries in ACL style via OpenReview; reviewing is not blind; published and under-review work
  welcome
- All accepted summaries are non-archival; presented as posters or talks, with best oral and best poster awards
- Submissions and presentations must be by students or postdocs; no registration fee
- Not listed in CORE ICORE2026 and not on the CCF list
