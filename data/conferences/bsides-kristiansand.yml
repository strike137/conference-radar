notes:
- Community-driven, non-profit, volunteer-organised Security BSides conference in Kristiansand, Norway
- 2027 edition is one day (Friday 4 June 2027) at Noroff University College, Kristiansand
- 2025 edition had a special focus on digital forensics and incident response (DFIR); talks recorded and posted on the website
- Main track plus workshops and badge hacking; live visual illustrations of talks by a student artist
- Sponsorship packages from 8,000 to 75,000 NOK with no sales pitches from the stage
- Talks only, no proceedings
