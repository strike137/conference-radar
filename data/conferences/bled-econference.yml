notes:
- Information systems and digital transformation conference held every June in Bled, Slovenia, since 1988
- Run by the eCenter and Center for Education and Consulting, Faculty of Organizational Sciences, University of Maribor
- Information systems (business school) venue rather than core CS
- Fully refereed research track, research in progress (forum) papers up to 6 pages, doctoral consortium, student ePrototype bazaar
- Special tracks on digital health, digital ethics, twin transition, AI and data science, digital education and smart sustainable cities
- Proceedings published open access by University of Maribor Press and indexed in the AIS eLibrary (AISeL); selected papers invited to partner journals such as Electronic Markets
- 2026 edition had 82 research presentations; submission via EasyChair
- Not listed in ICORE2026
