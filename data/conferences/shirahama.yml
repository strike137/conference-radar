notes:
- Started in 1997 on the initiative of Wakayama Prefectural Police with ISACA Osaka Chapter as organizer; held in
  Shirahama, Wakayama, usually in late May (July in 2024, online in 2020 and 2021); 30th edition in 2026
- Brings together police, government, industry and academia; invited talks plus evening BoF sessions, with no call
  for papers (non-archival)
- 'Hosts the student Information Crisis Management Contest (incident response): web-based first qualifier in April,
  remote second qualifier over VPN in late April to early May, final at the symposium; winners receive METI and
  MEXT minister awards and an individual JPCERT/CC award'
- Student registration is cheap (3,300 JPY in 2026); past speakers include the FBI and the US NSA
