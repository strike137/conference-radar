notes:
- Run by Noakhali Science and Technology University (NSTU) and held on its campus in Noakhali, Bangladesh
- Held every two years so far (2022, 2024, 2026); hybrid mode with online sessions
- Proceedings in Springer Lecture Notes in Networks and Systems (LNNS) for 2024 and 2026, which the site says is indexed in DBLP,
  EI Compendex, INSPEC and Scopus; 2022 proceedings appeared in two Springer LNICST volumes
- Four tracks in 2026 covering AI and data science, IoT and sensing, networks and security, and signal processing, vision and HCI
- Double-blind review; full papers of 10 to 15 pages in Springer format, short papers not accepted
- Dates often shift (2024 submission deadline set to 2024-07-31 due to the situation in Bangladesh, 2026 notification extended
  to 2026-07-15)
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
