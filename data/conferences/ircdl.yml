links:
  website: https://ircdl.dei.unipd.it/
notes:
- Formerly the Italian Research Conference on Digital Libraries; held annually in Italy since 2005, launched with the
  EU DELOS network and the University of Padua
- Proceedings in CEUR Workshop Proceedings (open access, indexed by Scopus and DBLP); 2026 is CEUR-WS Vol-4240
- Two tracks, Computer Science Foundations for Digital Libraries and Digital Humanities
- Research papers 10 to 12 pages, short papers 6 to 7 pages, extended abstracts 5 pages, CEURART single-column
  format, single-blind review
- Best papers are invited to extended versions in special issues of the International Journal on Digital Libraries
  and Umanistica Digitale
- In-person only; recent editions in Bressanone (2024), Udine (2025), Modena (2026) and Pisa (2027)
- Not listed in CORE ICORE2026
