notes:
- One-day practitioner PostgreSQL conference run by the nonprofit Japan PostgreSQL Users Group (JPUG) in Tokyo
- Two morning keynotes (in English with interpretation in 2026) and three afternoon tracks including a tutorial track
- Call for talks by email for six 50 minute general sessions; lightning talks in the closing session
- Speakers submit a manuscript for a printed booklet handed to attendees; no formal proceedings
- About 200 attendees expected (2026)
- Not listed in the CORE ICORE2026 portal
