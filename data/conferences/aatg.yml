notes:
- One-day satellite workshop of ICALP on algorithms and complexity for temporal (time-varying) graphs, held every year since 2018
- Presentations are by invitation only; anyone may register and attend
- Talk slides and videos posted on the workshop page
- Follows ICALP (Prague 2018, Patras 2019, online 2020 and 2021, Paris 2022, Paderborn 2023, Tallinn 2024, Aarhus 2025, Egham 2026)
- Organized by researchers at Durham University and the University of Liverpool
- Not listed in CORE ICORE2026 or the CCF 2026 list
