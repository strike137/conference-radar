notes:
- Internet operation and management, architecture, protocols, testbeds and Internet security
- June meeting joint with ICSS, December with IN, March with IEICE SITE and IPSJ IOT (Okinawa in 2026 and 2027);
  a student session in autumn
- Runs the English-language IA Workshop in Asia (IA2025 Chiang Mai, co-located with ICSEC 2025; IA2024 Taipei) with
  papers published as IEICE Technical Report
- The IPSJ IOT call for the March joint meeting asks presenters to attend on site
