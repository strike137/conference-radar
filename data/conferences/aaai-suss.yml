notes:
- Summer counterpart of the AAAI Spring and Fall Symposium Series, held outside North America (at a host university in 2025 and 2026)
- 'Past venues: Singapore 2023, Heriot-Watt University Dubai 2025, Dongguk University Seoul 2026; no 2024 edition is listed by AAAI'
- Three to five small symposia run in parallel, each on a different AI topic chosen by proposal (three in 2026)
- Each symposium runs its own call and deadlines through one EasyChair site; full papers usually 6 to 8 pages, short papers or extended abstracts 2 to 4 pages
- Accepted papers appear in the Proceedings of the AAAI Symposium Series (2026 in Vol. 9 No. 1, about 55 papers)
- In person only; virtual attendance and remote presentations are not allowed
- Registration covers one symposium only
- Not listed in CORE ICORE2026
