notes:
- Optimization methods and their applications in CS, telecom, electrical and other engineering fields, plus finance and healthcare
- Started in 2015 in Kenitra, Morocco; general chair from ENSA Kenitra (Ibn Tofail University)
- Accepted and presented papers go to IEEE Xplore (IEEE conference record 71047 for 2026, 66896 for 2025)
- Hosts so far in Morocco, Germany (2021), Italy (2022), UAE (2023) and Spain (2024)
- ICOA 2026 was hybrid; submission via Microsoft CMT
