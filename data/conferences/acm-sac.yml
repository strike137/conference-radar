notes:
- Sponsored by ACM SIGAPP; a multi-track symposium (39 tracks in 2027) including Computer Security (SEC), AI-enabled
  Cybersecurity and Privacy for Emerging Systems (ACE), Safe, Secure and Robust AI (S2RAI) and Selected Area of
  Wireless Communications and Networking (WCN)
- Double-blind review by at least three reviewers; full papers limited to 8 pages plus up to 2 paid extra pages
  (80 USD per page in 2026); some rejected papers are recommended as posters
- Rotates worldwide; SAC 2027 will be in Gwangju, South Korea (supporters include Chonnam National University)
- Student Research Competition (SRC) and Student Travel Award Program (STAP)
- ICORE2026 lists it as a Multiconference rather than ranking it; not in the CCF list; ACM open-access APC may apply
  to authors outside ACM Open institutions
