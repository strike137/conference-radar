notes:
- New name (from 2026) of the MedComNet series (Mediterranean Communication and Computer Networking Conference), originally MedHocNet, started in Sardinia in 2002 by Mario Gerla
- Not the same venue as IEEE MeditCom (IEEE International Mediterranean Conference on Communications and Networking)
- Organized and sponsored by CNIT and a local university, technically co-sponsored by IEEE ComSoc; papers are submitted for possible inclusion in IEEE Xplore
- Held at Mediterranean seaside locations, mostly in Italy (Ibiza 2021, Paphos 2022, Ponza 2023, Nice 2024, Cagliari 2025, Mondello 2026)
- 2026 theme is AI in networks and networks for AI
- Papers up to 9 pages in IEEE two-column format (references unlimited), submitted via EDAS; in-person presentation required for inclusion in the proceedings
- Mario Gerla Best Paper Award; competitive student travel grants
- Not listed in CORE ICORE2026 or in the CCF list
