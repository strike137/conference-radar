notes:
- New workshop in 2026 (1st edition), co-located with the 47th IEEE Symposium on Security and Privacy in San Francisco
- Topics are building, sharing and maintaining software security datasets, benchmarks for AI-based security tools
  and lessons learned; 2026 theme was datasets for vulnerability detection and patching
- Regular papers 6 to 10 pages and experience or tool demo papers 2 to 6 pages, IEEE two-column format, double-blind
  review by at least three reviewers
- Partially supported by an NSF CIRC planning project; the 2026 workshop included a panel on vulnerability research
  infrastructure
- 2026 submission deadline was extended by two weeks
