notes:
- Formerly the IEEE International Conference on Artificial Intelligence and Knowledge Engineering (AIKE, 2018 to 2023); renamed AIxDKE in 2024
- Technically sponsored by the IEEE Computer Society; co-located with IEEE ICSC and RoboticCC
- Mostly held at The Hills Hotel, Laguna Hills, California (hybrid); 2024 was at Hitachi Central Research Laboratory, Tokyo, 2020 and 2021 were virtual, 2019 was in Cagliari, Italy
- No 2025 edition; the 2024 edition was held in December 2024 and the next in February 2026
- Regular papers up to 6 pages, short papers 4, position papers 2 (IEEE double-column format), at least three reviewers per paper
- Accepted papers must be registered at the full rate and presented or they are removed from the proceedings
- Free poster presentation for current PhD students with every full paper (via the ICSC doctoral symposium)
- Not listed in ICORE2026; not on the CCF list
