notes:
- Theory conference for papers with innovative conceptual, technical or methodological agendas; started in 2010
- Proceedings in the open-access LIPIcs series; authors may ask for only a one page abstract in the proceedings
- Lightweight double-blind review; single column, at least 11 point, no page limit
- Usually held in the USA (MIT 2023, Simons Institute Berkeley 2024 and 2027, Columbia 2025); Bocconi University, Milan in 2026
- Single track over four days, with Graduating Bits sessions for students and postdocs on the job market
- CORE A (ICORE2026); not on the CCF list
- Run by a steering committee of mostly US-based theorists, with members from Israel, Switzerland and China
- The 2022 edition was held online
