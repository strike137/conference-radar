notes:
- Workshop on constructive and intuitionistic modal logics and their links to type theory, computation and philosophical logic
- IMLA 2026 was the 8th edition, held at FLoC 2026 in Lisbon (24 to 25 July 2026)
- Earlier editions at FLoC 1999 (Trento), FLoC 2002 (Copenhagen), LICS 2005 (Chicago), LICS 2008 (Pittsburgh), CLMPS 2011 (Nancy), UNILOG 2013 (Rio de Janeiro) and ESSLLI 2017 (Toulouse)
- Call for 2-page abstracts for contributed talks, on published or unpublished work and work in progress; students and early-career researchers encouraged
- No formal published proceedings; organizers said they would explore post-proceedings
- Not listed in ICORE2026
