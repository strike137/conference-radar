notes:
- Workshop held with IEEE/ACM UCC since 2023 (Taormina 2023, Sharjah 2024, Nantes 2025, Florianópolis 2026)
- Topics are edge AI, cloud and edge systems, serverless, sustainable computing and quantum computing
- Papers up to 6 pages in IEEE double-column format; double-blind review; posters and work in progress also welcome
- Proceedings with UCC (IEEE in 2026, ACM DL in 2025); one author must register at the early full non-student rate and present
- Selected papers invited to a special issue of Elsevier Internet of Things
- Chaired by Sukhpal Singh Gill and Omer Rana; honorary chairs Rajkumar Buyya and Schahram Dustdar
- Deadlines are usually extended by several weeks; all times AoE
- Not listed in CORE ICORE2026
