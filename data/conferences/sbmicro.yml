notes:
- Brazil's symposium on semiconductor devices and processes (materials, MEMS, sensors, photovoltaics, TCAD, photonics); 40th edition in 2026
- Held each year in Brazil as part of the Chip in ... umbrella event with SBCCI, WCAS, INSCIT and SForum (Chip in Sampa at USP in 2026)
- Papers of up to 4 pages in IEEE two-column format, in English; proceedings submitted to IEEE Xplore, no-show papers excluded
- Best papers invited to submit extended versions to JICS (Journal of Integrated Circuits and Systems)
- In-person event; at least one author must present on site
- Not listed in CORE ICORE2026
