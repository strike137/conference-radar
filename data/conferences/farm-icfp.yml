notes:
- Satellite workshop of ICFP, sponsored by ACM SIGPLAN; 2026 was the 14th edition, 2027 is the 15th
- Covers functional programming for art, music, design and creative coding (music, visual art, textiles, 3D printing, games, ...)
- Accepted papers (5 to 12 pages) and demos (500 to 2000 words) are published in the ACM Digital Library as FARM proceedings
- Paper categories are original research, overview / state of the art and technology tutorials; ACM SIGPLAN template, HotCRP submission
- Traditional evening of performances alongside the workshop; performance proposals are reviewed separately and are not published
- Paid registration is usually required for paper and demo authors, but waived for performers
- Follows ICFP around the world (online 2021, Ljubljana 2022, Seattle 2023, Milan 2024, Singapore 2025, Indianapolis 2026, Nijmegen 2027)
- Not listed in the CORE portal (ICORE2026)
