organizer: IEEE Circuits and Systems Society (CASS)
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [4, 10]
  conference_months: [4, 9]
links:
  website: https://2026.ieee-aicas.org/
notes:
- Described by the organizers as the premier IEEE Circuits and Systems Society conference on AI circuits and systems
- Covers in-memory computing, AI accelerators and architectures, neuromorphic circuits, HW/SW co-design and AI for
  circuits and wireless
- Proceedings submitted to IEEE Xplore; selected papers recommended to IEEE Transactions on Circuits and Systems for AI
  (and TVLSI in 2026)
- Full papers up to 5 pages (4 technical plus 1 of references), anonymous blind review, in-person presentation expected
- Also has special sessions, live demos, tutorials and a grand challenge
- 7th edition in Bordeaux, France (April 2025), 8th in Ha Long Bay, Vietnam (September 2026); the month varies by
  edition
- Not listed in ICORE2026
