id: netdev
name: Netdev
full_name: 'Netdev: The Technical Conference on Linux Networking'
type: industry
tier: minor
areas: [networking, systems]
region: worldwide
language: english
frequency: annual
organizer: The NetDev Society
organizer_country: [canada]
proceedings: Netdev website (talk papers, slides and videos posted after the event)
archival: false
fee: 218 EUR physical, 35 EUR student, 66 EUR virtual (2026, early bird, excl. VAT; normal 435 / 87 / 131 EUR)
typical:
  deadline_months: [1, 6]
  conference_months: [3, 7]
links:
  website: https://netdevconf.info/
notes:
- Run by the NetDev Society, a volunteer Canadian non-profit, since 2015; developer conference of the Linux kernel
  networking community
- Editions are numbered in hex (0x19 in 2025, 0x1A in 2026); location moves between Europe and North America
- Blind review of talk, workshop and tutorial proposals by a program committee; working code is preferred
- 0x1A (2026) was hybrid; virtual attendance is cheap and students get large discounts; bursaries available
- Papers and slides are posted on the session pages; not a formal publication
