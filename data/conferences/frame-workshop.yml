notes:
- Workshop on resource and application management in the cloud-edge continuum (orchestration, edge AI, security, techno-economic models)
- Started from the EU H2020 ACCORDION project; run by researchers at ISTI-CNR with co-chairs from TU Korea and UCM Madrid
- Co-located with ACM HPDC until 2025 (Orlando 2023, Pisa 2024, Notre Dame 2025), with papers in the ACM DL
- Moved to Euro-Par in 2026 (6th edition, Pisa); papers go to the Euro-Par workshops volume of Springer LNCS
- Regular papers (10 to 12 pages) and short papers (4 to 9 pages) in LNCS format; only regular papers go into the proceedings
- At least three reviews per paper; submission through the shared Euro-Par workshops EasyChair
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
