region: middle-east
frequency: annual
organizer: Bilgi Güvenliği Derneği (Information Security Association, BGD) with Turkish universities
organizer_country: [other]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [8]
  conference_months: [10]
links:
  website: https://iscturkiye.com/
notes:
- Organized by the Turkish Information Security Association (BGD) with METU, Gazi, ITU, TOBB ETU, Ankara University and the National Intelligence Academy; IEEE Turkey Section supports it
- Held since 2007 (2026 is the 19th edition); recent editions in Ankara, hosted by the ICT Authority (BTK)
- Peer-reviewed papers of up to 6 pages in the IEEE template, submitted via Microsoft CMT; accepted and presented papers go to IEEE Xplore
- Large event mixing academic papers with government and industry talks (over 2,000 participants in 2025); attendance is free
- 'Paper fee: 4,500 TL, 3,250 TL for IEEE members (2026)'
- Not listed in CORE ICORE2026
