links:
  website: https://ejc.um.si/
notes:
- Started in 1988 as a Japan and Finland cooperation, continuing Scandinavian conferences from 1982
- Topics are conceptual modelling, knowledge representation, linguistic modelling, multimedia data and AI system modelling
- Small by design, limited to about 50 participants and 30 papers; full, short and position papers
- Preprint e-book handed out at the conference; revised papers then appear in the IOS Press Frontiers in Artificial Intelligence and Applications book series (Information Modelling and Knowledge Bases Vol. n)
- Selected papers are invited to ECTI Transactions on Computer and Information Technology
- Mostly held in Europe, occasionally in Japan or Thailand (Maribor 2023, Tokyo 2024, Ostrava 2025, Vaasa 2026, Hamburg 2027)
- "CORE rank: C (ICORE2026)"
- EJC2026.org is an unrelated juggling convention
