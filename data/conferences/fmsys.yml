notes:
- Workshop on foundation models, LLMs and multimodal models for sensor data, CPS and IoT, embodied and physical AI
- Held at CPS-IoT Week since 2024 (Hong Kong 2024, Irvine 2025, Saint-Malo 2026)
- 2026 proceedings in IEEE Xplore (2026 IEEE 3rd International Workshop on Foundation Models for Cyber-Physical Systems & Internet of Things)
- 2025 proceedings in the ACM Digital Library (Proceedings of the 2nd International Workshop on Foundation Models for Cyber-Physical Systems & Internet of Things)
- Papers up to 6 pages, ACM sigconf format, single-blind review; in-person presentation required
- Best paper award
- Not listed in the CORE portal (ICORE2026)
