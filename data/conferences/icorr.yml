notes:
- Biennial conference on rehabilitation robotics, started in 1990 as part of RESNA; 2027 is the 20th edition
- Run by the International Consortium for Rehabilitation Robotics; technically co-sponsored by IEEE RAS and IEEE EMBS
- Held as part of RehabWeek together with other rehabilitation technology societies
- Full papers only, IEEE format, 6 pages or up to 8 pages at 150 USD per extra page; submission via PaperPlaza
- Proceedings in IEEE Xplore
- Best Paper and Best Student Paper awards, 500 USD each (2027)
- Rotates worldwide (London 2017, Toronto 2019, London virtual 2021, Rotterdam 2022, Singapore 2023, Chicago 2025)
- Not listed in the CORE portal (ICORE2026) or the CCF list
