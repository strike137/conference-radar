notes:
- Workshop on recommendation as decision making (bandits, off-policy evaluation, causality, long-term objectives, A/B testing)
- Held every year with RecSys since 2022 (first edition as CONSEQUENCES+REVEAL); the 2026 edition was the fifth
- Non-archival; accepted extended abstracts are posted on the workshop website, and previously published work is welcome
- Extended abstracts up to four pages, single-blind review, three tracks (methods, benchmarks and software, open problems and industry)
- All accepted papers are presented as posters, selected ones as long talks
- Not listed in the CORE ICORE2026 portal and not on the CCF list
