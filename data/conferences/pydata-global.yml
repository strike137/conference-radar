notes:
- Annual virtual conference of the PyData community for data scientists, data engineers and developers of open source data tools (Python, Julia, R)
- Run by PyData, an educational program of the US non-profit NumFOCUS
- Fully online ("Anywhere on Earth"); 2025 edition ran December 9 to 11, 2025 over three days
- Talk, tutorial and lightning talk proposals through a call for proposals on Pretalx; accepted speakers get a free pass
- Community-driven, novice to advanced level talks; no papers or proceedings
- Not ranked in ICORE2026 and not on the CCF list
