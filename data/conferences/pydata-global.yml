notes:
- Virtual conference of the global PyData network for data scientists, data engineers and developers of data analysis tools
- PyData is an educational program of NumFOCUS, a US 501(c)(3) non-profit; ticket revenue supports PyData and NumFOCUS
- Held fully online with live keynotes, talks and lightning talks; pay-what-you-can tickets
- Talks are chosen from proposals submitted on Pretalx under a specific track (2026 tracks include Machine Learning & AI, Analytics, Visualization & Decision Science, Data Engineering & Infrastructure); no papers or proceedings
- Selected speakers receive a conference pass
- 3 days in 2025, 2 days in 2026
- Not listed in CORE ICORE2026
