notes:
- China-led annual networking conference since 2016 (first held in Hakodate, Japan; 2017 Kathmandu, 2019 Daegu,
  2025 Tashkent); otherwise held in China (2023 Qingdao, 2024 Yinchuan, 2026 Macau)
- 'Japanese involvement: Suwa University of Science and Future University Hakodate are technical sponsors; honorary
  general chair Norio Shiratori'
- Tracks include network management and automation, AI/ML in networks, and industrial control network security
- Proceedings in IEEE Xplore via IEEE CPS with EI indexing; submission via EasyChair; online presentation option
  offered
- No-show papers are not sent to IEEE Xplore; extra pages cost 100 USD each
