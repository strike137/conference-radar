links:
  website: https://ubicomp-mental-health.github.io/
notes:
- Workshop on ubiquitous sensing, AI and interventions for mental health and well-being, co-located with ACM
  UbiComp/ISWC every year since 2016
- 2026 was the 11th edition, themed "Navigating Opportunities and Risks in the Age of AI"
- Accepted papers appear in the UbiComp supplemental proceedings and the ACM Digital Library; authors may opt out of
  archiving in the ACM DL
- Papers up to 6 pages including references in ACM two-column format; single-blind review
- Accepts scientific, challenge, experience report, critical reflection, dataset and demo papers
- Not listed in ICORE2026 or the CCF 2026 list
