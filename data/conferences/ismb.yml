notes:
- Flagship conference of ISCB; CORE A (ICORE2026), CCF B (2026 list)
- Proceedings track papers appear in an online-only open access (CC-BY) special issue of the journal Bioinformatics
  (Oxford University Press) about a month before the conference
- "Publication fee: 700 USD per proceedings paper (2026)"
- Two review rounds with a possible major revision; no deadline extensions
- Large meeting with many COSI tracks, abstract and poster tracks besides the proceedings track; hybrid attendance
  is offered
- Alternates between North America and Europe; the 2027 edition is held jointly with ECCB as ISMB/ECCB in
  Copenhagen
