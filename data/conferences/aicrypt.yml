links:
  website: https://aicrypt2026.aisylab.com/
notes:
- One-day workshop co-located with Eurocrypt on AI for cryptanalysis and side-channel attacks and on cryptography for secure and private AI
- Extended abstracts of at most 2 pages (LNCS format) via EasyChair, reviewed by the workshop chairs for suitability
- 'Non-archival: no formal proceedings, so work submitted or published elsewhere is welcome'
- Registration goes through the Eurocrypt registration
- 6th edition in 2026 (Rome); 5th edition in 2025 (Madrid)
- 2026 program had one keynote (Christina Boura) and 9 contributed talks
