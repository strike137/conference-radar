id: css-jp
name: CSS
full_name: Computer Security Symposium
name_local: コンピュータセキュリティシンポジウム
type: conference
tier: domestic
areas: [security, crypto]
region: japan
language: japanese
frequency: annual
organizer: IPSJ CSEC (Special Interest Group on Computer Security), co-organized by IPSJ SPT (Security Psychology
  and Trust)
proceedings: CSS proceedings in the IPSJ Digital Library (Joho Gakkai Hiroba), not peer-reviewed; paid access, free
  after about 2 years
archival: false
rank:
  core: Unranked
fee: 15,400 JPY student member, 18,700 JPY student non-member, 33,000 JPY CSEC/SPT member, 36,300 JPY IPSJ/IEICE
  member, 39,600 JPY general (2026, early rate until 2026-09-11; same rates as 2025)
typical:
  deadline_months: [8]
  conference_months: [10]
links:
  website: https://www.iwsec.org/css/2026/
notes:
- Organized by IPSJ CSEC; held in mid or late October in various cities across Japan (Okayama 2025, Hamamatsu 2026)
- 8 workshops held jointly in 2026 (MWS, PWS, UWS, OWS, BWS, AWS, FWS, TWS); the CFP has tracks for MWS, PWS, UWS,
  OWS, BWS, AWS and TWS plus system and cryptography tracks
- Papers (up to 8 pages plus 5 pages appendix) are work in progress and not peer-reviewed; they appear in the IPSJ
  Digital Library as the CSS proceedings; many presenters are students
- Abstract/application deadline early August, final manuscript late August; demonstration (poster) session is first
  come, first served
- Hybrid (online viewing), but oral and poster presentations must be given on-site; English papers accepted, most
  talks in Japanese
