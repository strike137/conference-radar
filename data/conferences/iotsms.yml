id: iotsms
name: IOTSMS
full_name: 'International Conference on Internet of Things: Systems, Management and Security'
type: conference
tier: minor
areas: [networking, security, systems]
region: europe
language: english
frequency: annual
organizer: Emerging Technologies Network (emergingtechnet.org; 2025 site on gcet-conference.com), technically
  co-sponsored by IEEE and the IEEE Systems Council (2023, 2024) or the local IEEE section
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus, DBLP]
typical:
  deadline_months: [6]
  conference_months: [9, 10, 11, 12]
links:
  website: https://emergingtechnet.org/IOTSMS2024/
notes:
- Run by the Emerging Technologies Network, the same group behind FMEC and SNAMS; FMEC 2024 was co-located with
  IOTSMS 2024
- Proceedings submitted to IEEE Xplore, subject to IEEE scope and quality checks; also submitted for EI, Scopus
  and DBLP indexing
- Regular papers up to 8 pages in the IEEE format; research track plus workshops and a PhD forum and posters track
- Mostly held in Europe (2019 Granada, 2020 Paris, 2021 Gandia virtual, 2022 Milan, 2024 Malmo, 2025 Lyon);
  2023 was in San Antonio, USA
- Hybrid format in 2024
- 2025 (12th edition) held at Universite Claude Bernard Lyon 1; proceedings published by IEEE (ISBN 979-8-3315-7952-4)
- Not listed in ICORE2026 or the CCF 2026 list
