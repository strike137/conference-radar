id: iccet
name: ICCET
full_name: International Conference on Communication Engineering and Technology
type: conference
tier: minor
areas: [communications, networking]
region: china
language: english
frequency: annual
organizer: Commercial conference secretariat (chairmen.org contact, iconf.org submission) with a host university; Guangdong Polytechnic Normal University and IEEE in 2026
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 580 USD per paper (2026, non-student author); 60 USD per extra page beyond 6 pages; listener 250 USD
typical:
  deadline_months: [3, 5]
  conference_months: [5, 6]
links:
  website: https://www.iccet.org/
notes:
- Annual since 2018 (Singapore 2018, Nagoya 2019, Auckland online 2020, Shanghai online 2021 and 2022, Xi'an online 2023, Tokyo online 2024, Guangzhou 2025 and 2026)
- Run by a commercial conference secretariat (chairmen.org contact address); 2026 conference chairs from Guangdong Polytechnic Normal University and Guangzhou University
- Proceedings in IEEE Xplore (2019 and 2022 to 2025) and the ACM DL (2018 and 2020), indexed by EI Compendex and Scopus; ICCET 2026 is on the IEEE event list
- Moved from February to May and June from 2025
- Papers of at least 4 pages; pages beyond 6 are charged
- Presentation only (abstract) and listener registration are also offered
- Not listed in CORE ICORE2026
