notes:
- One-day workshop on AI techniques (DNNs, LLMs and others) for software testing, co-located with IEEE ICST
- 6th edition in 2026 (Daejeon, South Korea); earlier editions with ICST in Naples 2025 and Toronto 2024
- Full papers up to 8 pages, short and tool papers up to 4 pages, IEEE two-column format
- Each submission reviewed by three reviewers; papers do not need to be anonymized
- Accepted papers published in the ICST proceedings; at least one author must register and present
- Steering committee from Portugal, the USA and Austria; 2026 chairs from Spain and South Korea
- Not to be confused with the AIST conference on Analysis of Images, Social Networks and Texts
- Not among the ICST 2027 workshops yet (workshop proposals due 2026-11-04); not listed in ICORE2026 or the CCF 2026 list
