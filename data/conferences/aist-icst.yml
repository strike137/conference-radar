notes:
- Workshop on AI for software testing (test generation, prioritization, performance testing, explainable AI for testing) and on testing of AI systems
- Co-located with IEEE ICST every year since 2021; the 2026 edition was the 6th
- Full papers up to 8 pages, short and tool papers up to 4 pages, plus position papers (two-column IEEE format)
- Single-blind review by three reviewers; accepted papers appear in the ICST proceedings
- 2026 edition held on May 22, 2026 in Daejeon with four accepted papers, a keynote and a panel
- 2027 chairs are Jeongju Sohn (Kyungpook National University) and Valerio Terragni (University of Auckland)
- Different from the AIST conference on Analysis of Images, Social Networks and Texts (id aist)
- Not listed in the ICORE2026 portal or the CCF 2026 list
