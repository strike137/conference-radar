notes:
- One-day ICSE workshop on software engineering for entertainment games, serious games and gamified applications
- 2026 was the 10th edition; held with ICSE every year from 2023 to 2026
- 2026 organizers from Italy (University of L'Aquila), Canada and Brazil (UFPE, UFF, University of Fortaleza)
- Long papers up to 8 pages and extended abstracts up to 5 pages, ACM format, single-blind review
- 2026 papers published in the ACM Digital Library; long papers pay the ACM Open APC, extended abstracts are APC free
- Not on the ICSE 2027 workshop list, so the next edition is not announced yet
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
