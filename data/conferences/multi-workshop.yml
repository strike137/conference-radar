id: multi-workshop
name: MULTI
full_name: International Workshop on Multi-Level Modeling
type: workshop
tier: minor
areas: [software]
region: worldwide
language: english
frequency: annual
organizer: MULTI steering committee (University of Mannheim, Victoria University of Wellington, Universidad Autonoma de Madrid), co-located with MODELS
organizer_country: [europe, new-zealand]
proceedings: MODELS Companion proceedings (ACM 2026, IEEE 2025)
archival: true
typical:
  deadline_months: [7]
  conference_months: [10]
links:
  website: https://multi-workshop.github.io/
notes:
  - Workshop on multi-level modeling (more than two classification levels, deep characterization, clabjects) for conceptual modeling and software engineering
  - Held every year since 2014, always co-located with MODELS (2025 Grand Rapids, 2026 Malaga)
  - Papers in the MODELS Companion proceedings since 2019 (IEEE in 2025, ACM in 2026); CEUR-WS volumes for 2014 to 2018
  - Regular papers up to 10 pages, position papers up to 5 pages, plus challenge posters, challenge papers and 2-page industrial abstracts (website only)
  - "MULTI 2026: 20 submissions, 11 papers accepted (series homepage), plus position papers and posters"
  - Not listed in the CORE portal (ICORE2026)
