notes:
- Workshop held with IEEE PerCom (International Conference on Pervasive Computing and Communications); 10th edition in 2027
- Not the same venue as IoTSPT, the ICCCN workshop with a similar name
- Full papers of exactly 6 pages in the IEEE template (one extra page can be bought); short papers are rejected without review
- Single-blind review via HotCRP
- Accepted papers go into the PerCom workshop proceedings on IEEE Xplore
- Each paper needs a full PerCom registration (no workshop-only or student rate) and an in-person presentation
- Location follows PerCom (Pisa 2026, Goa 2027)
