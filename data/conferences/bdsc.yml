notes:
- National conference of the Chinese Association for Artificial Intelligence (CAAI) on big data and social computing; 10th edition in 2025
- Topics include social computing, social system modeling and simulation, social networks, urban computing and large models in society
- Double-blind review; papers in Chinese or English
- Outstanding English papers are published by Springer; good Chinese papers are recommended to Chinese journals
- All accepted papers are presented as posters
- 2026 edition (11th) held in Chongqing, co-hosted by the CAAI Technical Committee on Social Computing and Social Intelligence and Chongqing University
- English papers at least 12 pages (2026)
