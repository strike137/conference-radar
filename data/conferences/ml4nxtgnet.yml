notes:
- Workshop on distributed and decentralized learning, split learning and LLMs over the edge-to-cloud continuum
  for NextG networks, held with ACM MobiHoc (Athens 2024, Houston 2025, Tokyo 2026)
- 2024 and 2025 editions were programs of invited talks; 2026 (3rd edition) has a call for papers
- Papers up to 6 pages in ACM double-column format including references; submission via HotCRP
- Accepted 2026 papers go into the ACM MobiHoc 2026 proceedings; one full registration per paper; ACM open access
  APC (250 USD members, 350 USD non-members in 2026) applies outside ACM Open institutions
- Not listed in the CORE portal (ICORE2026) or the CCF list
