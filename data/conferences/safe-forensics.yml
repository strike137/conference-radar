id: safe-forensics
name: SAFE
full_name: Workshop on Synthetic and Adversarial ForEnsics
type: workshop
tier: minor
areas: [security, vision, ai]
region: north-america
language: english
frequency: multiple-per-year
organizer: Workshop organizers mostly from MIT Lincoln Laboratory, with UT Austin and Tufts University; co-located with a major AI or vision conference
organizer_country: [usa]
proceedings: CVF Open Access and IEEE Xplore (host conference workshop proceedings); PMLR planned for AAAI 2027
archival: true
typical:
  deadline_months: [11, 3]
  conference_months: [2, 3, 6]
links:
  website: https://www.safeworkshop.org
notes:
- Workshop series on synthetic media detection, deepfakes, watermarking and provenance, adversarial attacks and red teaming of generative models
- 1st edition at WACV 2026 (Tucson), 2nd at CVPR 2026 (Denver), 3rd at AAAI 2027 (Montreal); a new host conference each edition
- Full papers of 6 to 8 pages are archival in the host workshop proceedings; short papers and extended abstracts of 2 to 4 pages are non-archival
- Double-blind review; AAAI 2027 submissions on OpenReview with optional archiving in a PMLR volume (pending confirmation)
- Small workshop with keynotes; 7 full papers at WACV 2026 and 11 full papers at CVPR 2026
- Not listed in ICORE2026 or the CCF list
