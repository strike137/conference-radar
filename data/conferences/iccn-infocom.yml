notes:
- One-day workshop co-located with IEEE INFOCOM; 2026 was the 8th ICCN edition
- Successor of the CCSNA workshop series, which started at IEEE GLOBECOM 2013
- Accepted and presented papers appear in the IEEE INFOCOM 2026 proceedings in IEEE Xplore
- Papers up to 6 pages in IEEE two-column format, submitted via EDAS
- Topics are AI-native cloud and network design, edge-cloud computing, cloud storage and cloud security
- Not to be confused with the ICCNS conference on communication and network security
- Not listed in ICORE2026
