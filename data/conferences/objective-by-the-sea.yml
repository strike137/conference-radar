notes:
- Practitioner conference devoted to Apple (macOS/iOS) security, run by the Objective-See Foundation, a US 501(c)(3) non-profit
- Editions are numbered (v8.0 in 2025, v9.0 in 2026); training days come first, followed by talk days
- Alternates between Maui, Hawaii (2021, 2024, 2026) and Spain (2022, 2023, Ibiza 2025)
- Call for papers accepts only Apple security topics; trainings close earlier (May) than talks (end of July)
- No proceedings; slides, recordings and photos are posted after each edition
- Objective-We program gives students full or partial scholarships for ticket, training, travel and lodging
