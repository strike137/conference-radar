id: desires
name: DESIRES
full_name: Design of Experimental Search & Information REtrieval Systems
type: conference
tier: minor
areas: [data, nlp]
region: europe
language: english
frequency: irregular
organizer: DESIRES steering committee (Omar Alonso, Gianmaria Silvello)
organizer_country: [international]
proceedings: Abstracts on the conference website; optional extended papers in an open-access special issue of the Information Retrieval Research Journal (IRRJ)
archival: false
links:
  website: https://desires-conf.org/
notes:
- Systems-oriented information retrieval conference; editions 2018 Bertinoro, 2021 Padua, 2022 San Jose, 2024 Bressanone, 2027 Cologne
- 5th edition in 2027 at GESIS in Cologne, Germany
- From 2027 contributions are 2 to 5 page abstracts, published on the website with author consent
- Authors may extend accepted abstracts into full papers for an IRRJ special issue after a light second review
- 2024 papers were published in CEUR-WS (indexed by DBLP and Scopus)
- The 2024 site called it biennial, but the gaps between editions vary
- Not listed in CORE ICORE2026 or in the CCF 2026 list
