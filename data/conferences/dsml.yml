id: dsml
name: DSML
full_name: Workshop on Dependable and Secure Machine Learning
type: workshop
tier: minor
areas: [security, ai, systems]
region: worldwide
language: english
frequency: annual
organizer: Co-located with IEEE/IFIP DSN; 2026 chairs Zitao Chen (University of Kansas) and Pietro Liguori (University
  of Naples Federico II)
organizer_country: [usa, europe]
proceedings: IEEE Xplore
archival: true
rank:
  core: Unranked
fee: About 500 USD workshop-only author registration for IEEE/IFIP members, 600 USD for non-members (2026, DSN)
typical:
  deadline_months: [3, 4]
  conference_months: [6]
links:
  website: https://dependablesecureml.github.io/
notes:
- Co-located with IEEE/IFIP DSN every year since 2018 (9th edition in 2026); follows DSN around the world (Taipei
  2021 virtual, Brisbane 2024, Naples 2025, Charlotte 2026)
- Regular papers up to 6 pages plus 3 pages of references and supplement, double-blind; also 1-page proposals for
  talks on previously published work
- Published in the DSN supplementary volume (IEEE Xplore), or as a 2-page extended abstract with the full paper
  on arXiv
- Deadline usually late March, extended by about a week to early April; 12 papers in the 2026 program
- DSN 2027 will be in Berlin (June 22 to 25, 2027); DSML 2027 not announced yet
