notes:
- Indian conference on information security, privacy and digital forensics, run by SVNIT Surat, NFSU and NIT Goa
- Held in India; hosts alternate between NFSU Goa (2022, 2026), NFSU Gandhinagar (2023) and SVNIT Surat (2025)
- Hybrid mode (in person plus online sessions)
- Proceedings of the 2022 and 2023 editions in Springer Lecture Notes in Electrical Engineering (LNEE)
- Submissions through Microsoft CMT
- Not ranked in ICORE2026; not on the CCF 2026 list
