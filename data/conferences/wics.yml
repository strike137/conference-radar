notes:
- Satellite workshop of CSBC, the annual congress of the Brazilian Computer Society (SBC); 7th edition in 2026,
  held since 2020
- Topics include digital inclusion, ethics of computing systems, social and political implications of AI, privacy
  and surveillance, misinformation, and sustainability of computing
- Three tracks; research papers 10 to 12 pages, position or ongoing research papers and tool papers 6 to 8 pages,
  SBC template, submitted via JEMS
- Papers in Portuguese, Spanish or English; double-blind review
- Proceedings (Anais do WICS) published open access in SBC OpenLib (SOL) with a DOI per paper
- Held with CSBC in a different Brazilian city each year (Gramado 2026)
- Not listed in CORE ICORE2026
