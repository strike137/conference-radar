notes:
- Annual national conference of the Python community in South Africa, run by volunteers of the Python Software Society
  of South Africa since 2012
- Talks (25 minutes), 90 minute tutorials and posters chosen from an open call for proposals; first-time speakers can
  ask for a mentor
- Hybrid event with in-person and online tickets (online through Discord); about 250 in-person seats
- Five days in 2026 with a free Beginner's Day, two main conference days and two days of sprints
- In 2025 PyConZA merged with PyCon Africa 2025 in Johannesburg instead of running a separate edition
- 'Past venues: Durban 2022 and 2023, Cape Town 2024 and 2026'
- Talks only, no papers or proceedings; recordings on YouTube
