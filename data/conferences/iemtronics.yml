id: iemtronics
name: IEMTRONICS
full_name: International IOT, Electronics and Mechatronics Conference
type: conference
tier: minor
areas: [communications, networking, systems]
region: worldwide
language: english
frequency: annual
organizer: Smart Society (same team as IEEE IEMCON, CCWC and UEMCON), with Bengal Heritage Foundation, London
proceedings: Springer LNEE
archival: true
indexing: [DBLP, EI, Scopus]
fee: 300 GBP academic author for one paper, 400 GBP for two, 450 GBP per paper industry (current registration page)
typical:
  deadline_months: [1]
  conference_months: [4]
links:
  website: https://iemtronics.org/
notes:
- Run by the Smart Society team behind IEEE IEMCON, CCWC and UEMCON
- Earlier editions ran online on Toronto, Canada time (2021 and 2023 confirmed) with IEEE proceedings up to 2022; held in London since 2024 (Imperial College London 2026, Queen Mary University of London 2027)
- Proceedings in one volume of Springer Lecture Notes in Electrical Engineering
- Regular papers of at least 8 pages; short papers not accepted for 2027; submission via EDAS
- Short cycle of under four months from submission deadline to conference
- Not listed in ICORE2026 or the CCF 2026 list
