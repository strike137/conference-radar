notes:
- Interdisciplinary conference on metadata, ontologies, semantic web, linked data, knowledge graphs and digital libraries
- Proceedings in Springer CCIS; selected papers invited to journals such as the International Journal of Metadata, Semantics and Ontologies
- Full papers 12 pages, short papers 6 pages; double-blind review on EasyChair
- Special tracks on digital libraries, research information systems, cultural collections, digital humanities, agriculture (AgroSEM) and more, published in the same proceedings
- Held in Europe (London 2022, Milan 2023, Athens 2024, Thessaloniki 2025, Bucharest 2026); 2020 and 2021 were virtual
- Best paper and best student paper awards sponsored by euroCRIS
- Not listed in CORE ICORE2026 or in the CCF 2026 list
