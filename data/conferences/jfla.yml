id: jfla
name: JFLA
full_name: Journées Francophones des Langages Applicatifs
type: conference
tier: domestic
areas: [software]
region: europe
language: mixed
frequency: annual
organizer: JFLA steering committee (French programming languages and formal methods community, Inria, CNRS and university labs)
organizer_country: [europe]
proceedings: HAL (open archive collection per year, for example JFLA2026)
archival: false
typical:
  deadline_months: [10]
  conference_months: [1]
links:
  website: https://jfla.eu/
notes:
- French-speaking meeting on functional and applicative languages, proof assistants, logic and program verification; 38th edition in 2027
- Papers may be written in French or English, talks are preferably given in French
- Research papers up to 18 pages and short papers up to 9 pages in the jflart LaTeX style; single-blind review by at least two PC members, rejected papers get at least three reviews
- Accepted papers are published in conference proceedings on HAL; the steering committee explicitly allows resubmitting JFLA papers to international conferences, so it is marked non-archival here
- Residential format in a small French town each year (Praz-sur-Arly 2023, Saint-Jacut-de-la-Mer 2024, Roiffé 2025, Oberbronn in the Vosges du Nord 2026, Dinard 2027)
- "Fee 2026: 670 EUR including four nights of lodging and meals; free for student speakers with an accepted paper and for a few subsidized attendees"
- Not listed in ICORE2026 and not on the CCF list
