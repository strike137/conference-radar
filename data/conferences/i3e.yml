notes:
- Flagship conference of IFIP WG 6.11; information systems venue on e-business, e-services, e-society and the
  societal use of AI and digital technology
- Proceedings in Springer LNCS (2025 volume 16079, 2026 volume 16912); about 30 to 35 papers per year recently
- "Acceptance: 32 of 64 submissions (2026), 34 of 73 (2025)"
- Complete research papers up to 12 pages and research-in-progress papers up to 7 pages; double-blind review
- Mostly held in Europe (Galway 2021, Newcastle 2022, Heerlen 2024, Limassol 2025, Tampere 2026), with Curitiba,
  Brazil in 2023
- 2026 submission deadline was extended from Apr 10 to May 14
- 'CORE: not listed in ICORE2026'
