notes:
- Main venue for audio signal processing and digital audio effects, including machine learning for audio
- Full papers up to 8 pages; double-blind review with a rebuttal stage for borderline papers
- All papers open access in the DAFx paper archive since 1998
- Held in Europe almost every year (Copenhagen 2023, Guildford 2024, Ancona 2025, Cremona 2027); Cambridge, MA,
  USA in 2026
- CORE C (ICORE2026)
