notes:
- New tri-society conference (ComSoc, SPS, AESS) dedicated to integrated sensing and communications; 2026 is the first edition
- Full papers up to 6 pages (2 extra pages for a fee), submitted via EDAS; accepted and presented papers go to IEEE Xplore
- Best papers invited to a special section of IEEE Transactions on Aerospace and Electronic Systems
- 2026 edition at the Altis Grand Hotel, Lisbon; tutorials on the first day (Nov 15), technical program Nov 16 to 18
- Not ranked by CORE (new venue)
