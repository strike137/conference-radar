notes:
- New workshop in 2026 on modelling, generating and understanding verbal and non-verbal behaviour (speech, prosody, gesture, gaze, facial expression) in face-to-face dialogue
- First edition held with EMNLP 2026 in Budapest on 29 October 2026
- Archival papers appear in the ACL Anthology (2026.mint-1); non-archival track for published work, preliminary research and demos
- Long (8 pages) and short (4 pages) papers, double-blind review via OpenReview; also takes ARR commitments
- Not ranked in ICORE2026 and not on the CCF list
