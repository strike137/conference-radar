notes:
- Workshop of the ACL special interest group SIGBIOMED on biomedical and clinical language processing; running since
  the early 2000s
- Usually co-located with ACL (ACL 2022 Dublin, ACL 2023 Toronto, ACL 2024 Bangkok, ACL 2025 Vienna, ACL 2026 San
  Diego)
- Proceedings in the ACL Anthology, with a separate shared task volume (89 workshop papers and 35 shared task papers
  in 2026)
- 109 submissions in 2026
- Full papers 8 pages, short papers 4 pages; submission via Softconf START
- Hosts several shared tasks each year (MedGenVidQA, MedExACT, PsyDefDetect and ClinicalSkillQA in 2026)
- Not ranked in ICORE2026 and not on the CCF list
