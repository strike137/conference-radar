notes:
- Broad information technology and systems conference run by ITMA (Information and Technology Management Association); 13 themes from information management and software to networks, big data, HCI, security, health and education IT
- Papers in English go to Springer Lecture Notes in Networks and Systems (three volumes in 2025 and 2026); papers in Spanish or Portuguese go to a special issue of RISTI
- Double-blind review by at least two Scientific Committee members; English papers up to 12 pages, Spanish or Portuguese papers up to 15 pages
- One registration covers one published paper; an extra fee allows one more paper
- Held at a Latin American university each year (Cusco 2023, Temuco 2024, Mexico City 2025, Roatan 2026, Cusco 2027), with online participation
- Not ranked in CORE ICORE2026
