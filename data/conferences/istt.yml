notes:
- Flagship biennial symposium of the IEEE Malaysia ComSoc/VTS joint chapter (MyComVT); first held in 2012
- Always held in Malaysia so far (Kuala Lumpur, Langkawi, Selangor, Shah Alam, Johor Bahru); 2026 edition is hybrid
- Proceedings in IEEE Xplore (every edition since 2012 listed on the past proceedings page); the 2026 CFP says
  indexed by IEEE Xplore and Scopus
- Papers up to 6 pages in IEEE format via EDAS; at least one author must register at the full rate and present
- Not ranked in ICORE2026 and not in the CCF list; a small regional venue with repeated deadline extensions
- Student travel grants and best paper awards are offered
