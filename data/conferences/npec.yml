organizer_country: [india]
proceedings: IEEE Xplore
archival: true
fee: 10,000 INR + GST IEEE member, 6,000 INR + GST IEEE student member (2025, early bird)
typical:
  deadline_months: [8, 9]
  conference_months: [12]
links:
  website: https://www.npec2025.com
notes:
- Biennial national conference of the Indian power electronics community, first held at IIT Bombay in 2003
- Rotates among Indian institutes (IIT Bhubaneswar 2021, IIT Guwahati 2023, NIT Calicut 2025)
- Technically co-sponsored by IEEE Kerala Section, PELS, IAS, IES and PES (2025); papers published in IEEE Xplore
- Up to 6 pages in IEEE two-column format, single-blind review, papers with 30% or more similarity rejected
- Submission deadline was extended several times in 2025 (Jul 31 -> Sep 7 hard deadline)
- Not listed in ICORE2026 or the CCF list
