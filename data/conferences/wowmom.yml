notes:
- Annual IEEE symposium on wireless, mobile, IoT and multimedia networking, usually held in June (27th edition in 2026)
- Sponsored by the IEEE Computer Society; accepted papers published in IEEE Xplore
- Double-blind review; regular papers up to 10 pages, work-in-progress papers up to 4 pages (prefix WIP), IEEE two-column format
- One main deadline in early December (extended by about ten days in 2026); co-located workshops have a later common deadline
- Selected papers fast-tracked to the Elsevier Pervasive and Mobile Computing journal
- Rotates between Europe, North America and Oceania (Belfast 2022, Boston 2023, Perth 2024, Fort Worth 2025, Bologna 2026, Irvine 2027)
- Renamed from 2027 to IEEE Symposium on a World of Wireless Mobility, IoT and Machine Learning (acronym unchanged)
- 2027 edition requires in-person presentation by an author
- Rated C in ICORE2026 and C in the CCF list (computer networks category)
