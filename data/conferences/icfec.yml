notes:
- Held in conjunction with IEEE/ACM CCGrid every year, so it follows CCGrid around the world; registration and venue are shared
- Proceedings published through the IEEE Computer Society Conference Publishing Services
- Regular papers up to 8 letter-size pages including references; reviewers may accept as short (4 pages) or poster
  (2 pages) papers
- At least three reviewers per paper; submissions via EasyChair
- 2026 (10th edition) was in Parramatta, Sydney, with CCGrid 2026; student travel grants up to AUD 1,500 via CCGrid
- CORE C (ICORE2026); not on the CCF list
