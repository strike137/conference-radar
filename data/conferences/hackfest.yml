notes:
- Bilingual (French and English) hacking and cybersecurity conference in Quebec City, billed as the largest bilingual
  one in Canada, with over 1,700 attendees
- Run by the non-profit Hackfest Communication (incorporated 2009), which also runs iHack and QuebecSec
- Held at the Quebec City Convention Centre; talks and workshops of 20 or 50 minutes, CTFs, villages and trainings
- Two CFP rounds on pretalx (May to June and July to August); talks are recorded on YouTube, no proceedings
