notes:
- Asia-based sister conference of ACM CCS under SIGSAC, started in Taipei in 2006; proceedings in ACM DL
- Two cycles (around August/September and December/January); double-blind; 7 technical tracks; early rejection,
  rebuttal and major revision option
- 'Rotates within Asia-Pacific: Hanoi (2025), Bangalore (2026), Macau (2027); a realistic Asia-based target for
  the lab'
- CORE A but only CCF C; acceptance around 22%
