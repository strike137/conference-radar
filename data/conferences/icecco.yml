notes:
- Broad electronics and computing conference run by SDU University in Kaskelen near Almaty, Kazakhstan
- Tracks include computers and information theory, computational intelligence, communications, signal processing, electron devices and industry applications
- Accepted and presented papers are submitted to IEEE Xplore; no-show papers are excluded
- Offline and online presentation; presentation must be in English
- "Fee: 200 USD full conference, 75 USD for students (2026, offline); 20% discount online"
- Recent editions in 2021, 2023 and 2026 (18th edition), so not strictly annual
- Not listed in CORE ICORE2026
