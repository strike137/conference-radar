notes:
- Part of the Acadia University conference series run by Elhadi Shakshuki, held together with FNC (Future Networks
  and Communications) and SEIT (Sustainable Energy Information Technology)
- Accepted papers appear in the open-access Elsevier Procedia Computer Science series, indexed in Scopus, EI
  Compendex and DBLP
- Papers up to 8 pages in the Procedia format including references; submission via EasyChair
- Submission deadline is usually extended twice; the official page lists the final one as firm
- Location changes each year (Leuven 2021, Niagara Falls 2022, Halifax 2023, Huntington WV 2024, Leuven 2025,
  Athens 2026, Istanbul 2027)
- CORE ICORE2026 Unranked; not in the CCF 2026 list
