notes:
- Annual AI conference run by the Beijing Academy of Artificial Intelligence (BAAI), first held in October 2019
- Two days of keynotes, panels and topic forums on large models, agents, embodied AI and AI safety, mixing academic
  and industry speakers; talks in Chinese and English
- Invited speakers only, no call for papers and no proceedings
- Held in Beijing's Zhongguancun area (June editions in 2025 and 2026), with online streaming
- 2026 opening keynotes by Turing Award winners Whitfield Diffie and Andrew Barto
- Not in the CORE ICORE2026 portal or the CCF 2026 list
