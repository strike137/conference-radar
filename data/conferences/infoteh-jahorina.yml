notes:
- Regional EE and ICT symposium held every March on Jahorina mountain near East Sarajevo (Republika Srpska, Bosnia and Herzegovina) since 2001
- Co-organized by several Western Balkan universities (Banja Luka, Belgrade, Nis, Novi Sad, Montenegro, Split and others)
- Technically co-sponsored by IEEE Industry Applications Society and the IEEE Bosnia and Herzegovina and Serbia and Montenegro Sections
- Papers in the local languages or English; only English papers can be sent to IEEE Xplore
- Papers of 4 to 6 pages, blind review by at least two reviewers; submission via OpenConf
- Hybrid format with oral, poster and virtual (video) presentations; separate student session
- Selected papers can be offered to IJEEC, Electronics (Banja Luka) and JMAIT without fee
