notes:
- Workshop co-located with IEEE NetSoft; first edition at NetSoft 2026 in Berlin
- Topics are agentic AI and multi-agent coordination for SDN/NFV control, intent-to-action, decentralized and federated control planes, multi-domain orchestration, safety and verification
- Papers up to 7 pages in IEEE two-column format including references; at least 3 reviews per paper; submission via EDAS
- Papers appear in the IEEE NetSoft 2026 workshop proceedings (IEEE Xplore, subject to policy)
- Half-day workshop with a keynote and five papers in 2026
