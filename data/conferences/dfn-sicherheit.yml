notes:
- German security conference run by DFN-CERT for the DFN-Verein (formerly a workshop); 34th
  edition in 2027
- Held at the Grand Elysee Hotel in Hamburg; about 350 participants
- Technical and scientific focus; practice-oriented talks and research reports welcome, product presentations not
- Anonymous review by a program committee, at least five reviewers per submission; abstract (2+ pages) or full
  paper (10+ pages) accepted for review
- All accepted long versions published in a conference volume with ISBN; short talks (10 minutes) not published
- Official pages and most talks in German, some talks in English
- Tutorials on the afternoon of the second day
- Not ranked in ICORE2026; not on the CCF 2026 list
