notes:
- Annual symposium on on-line testing, design for reliability and robustness, fault tolerance, functional safety and
  fault-based attacks on microelectronic circuits and systems; 32nd edition in 2026
- Sponsored by IEEE CEDA and the IEEE Computer Society Test Technology Technical Community (TTTC)
- Regular papers up to 6 pages and posters up to 4 pages (references excluded); camera-ready goes through IEEE PDF
  eXpress and IEEE eCopyright
- Abstract registration one week before the full paper; 2026 deadlines were extended by two weeks
- Usually held in early July in Europe (Polignano a Mare 2026, Ischia 2025, Rennes 2024, Chania 2023, Turin 2022)
- Best papers invited to an IEEE Transactions on Device and Materials Reliability special issue
- One full author registration required per paper or poster
- CORE C (ICORE2026); not on the CCF 2026 list
