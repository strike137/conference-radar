notes:
- Organized by the IEEE Communications Society; described by its site as the main annual communications and computing conference in Colombia
- 19th edition in 2026, held at Universidad Industrial de Santander in Bucaramanga
- Tracks on wireless communications and networking, smart environments and IoT, cybersecurity, applied electromagnetics, and AI/ML for networking
- Papers up to 6 pages in IEEE format, in English or Spanish (abstract must be in English), submitted via Microsoft CMT
- Accepted and presented papers are eligible for IEEE Xplore and Scopus; no-show papers are excluded
- Separate poster track with a later deadline (August)
- Not ranked in CORE ICORE2026
