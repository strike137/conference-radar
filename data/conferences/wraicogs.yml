notes:
- Workshop on writing aids that fit human cognition, covering the whole writing process (ideation, planning, expression, revision) and the use of LLMs in it
- 1st edition (WR-AI-CogS-1) held at COLING 2025 in Abu Dhabi on 20 January 2025
- Organized by Michael Zock (CNRS, Aix-Marseille University), Kentaro Inui (MBZUAI, Tohoku University) and Zheng Yuan (King's College London)
- Long papers up to 8 pages and short papers up to 4 pages via START; all accepted papers appear in the ACL Anthology (6 papers in 2025.wraicogs-1)
- In-person presentation required; registration through COLING 2025
- Different from the In2Writing workshop series
- Only one edition so far; no later edition in the ACL Anthology as of 2026-11
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
