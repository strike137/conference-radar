notes:
- Flagship conference of the IEEE Nanotechnology Council, held every year since 2001; 2027 is the 27th edition
- Covers nanoelectronics, spintronics, nanosensors, nanophotonics, nanoscale communications, quantum and neuromorphic computing, chiplets and nanomaterials
- Full papers of 4 to 6 pages in IEEE style go into IEEE proceedings indexed in IEEE Xplore; a 1-page presentation-only abstract track is also offered
- Rotates worldwide (Montreal 2021, Palma de Mallorca 2022, Jeju 2023, Gijon 2024, Washington DC 2025, Nanjing 2026, Messina 2027)
- Deadlines are often extended by about two weeks (2026 full papers moved from March 1 to March 15)
- Not ranked by CORE (ICORE2026) and not on the CCF 2026 list; mainly a nanotechnology and device venue rather than a computer science one
