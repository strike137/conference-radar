notes:
- Annual practitioner conference of the anti-malware research community in Asia, held since 1998 by AVAR (founded June
  1998)
- Mostly threat research and malware analysis talks from security vendors and CERTs, plus a CISO track, CISO awards
  and training sessions
- No formal proceedings; abstracts appear in the conference handbook PDF published on the event site
- Host city rotates around Asia (2022 Singapore, 2023 Dubai, 2024 Chennai, 2025 Kuala Lumpur, 2026 Hyderabad); 2020
  and 2021 were virtual
- Held in late November or early December, usually two conference days plus a welcome day
- Expensive for students (875 to 1,475 USD for international delegates in 2026); India-based delegates pay lower INR rates
