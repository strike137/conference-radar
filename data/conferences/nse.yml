notes:
- One-day ICSE workshop on combining symbolic methods (formal methods, programming languages) with machine learning across software engineering tasks
- 1st edition at ICSE 2025 (Ottawa, May 2025), 2nd at ICSE 2026 (Rio de Janeiro)
- 2026 organizers from Hasso Plattner Institute (University of Potsdam), IBM Research Japan and IMC Krems (Austria)
- Full papers up to 8 pages, short papers up to 6 pages, extended abstracts up to 5 pages; ACM double-column format, single-blind review
- ICSE 2026 workshop papers are published by ACM; extended abstracts are APC free
- 2025 edition used the IEEE template, in line with the IEEE workshop proceedings of ICSE 2025
- Not on the ICSE 2027 workshop list, so the next edition is not announced yet
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
