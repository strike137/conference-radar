notes:
- Workshop on automated and verifiable software development (synthesis, formal methods, model-driven development, microservices, AI and LLMs for software)
- Co-located with SEFM from 2019 to 2022 and with IEEE/ACM ASE since 2023 (Luxembourg 2023, Sacramento 2024, Seoul 2025, Munich 2026)
- Regular papers up to 8 pages and short papers up to 4 pages (2026), ACM format, at least three reviewers
- Accepted papers appear in the ASE workshop proceedings; ASE 2026 proceedings are open access in the ACM DL
- Not listed in ICORE2026 and not on the CCF list
