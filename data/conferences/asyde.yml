notes:
- One-day workshop on automated and verifiable software development (formal methods, correct-by-construction development, model-driven engineering, microservices, AI and LLMs for software development)
- Co-located with SEFM from 2019 to 2022 and with IEEE/ACM ASE since 2023 (Luxembourg 2023, Sacramento 2024, Seoul 2025, Munich 2026)
- 8th edition in 2026; follows earlier workshops OrChor, SCFI, SCART and VeryComp
- Regular papers up to 8 pages and short papers (tool demos, position and vision papers) up to 4 pages, including references
- Each paper reviewed by at least three PC members; accepted papers appear in the ASE workshop proceedings
- ASYDE 2026 proceedings published open access in the ACM Digital Library; 2025 papers went into the ASE 2025 workshop proceedings (IEEE format)
- Organizers based in Italy and Sweden
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
