notes:
- Workshop on programming language approaches to concurrency, communication and distribution (session and behavioural types, process calculi, actors, verification of concurrent software)
- Satellite workshop of ETAPS since 2009 (first edition 2008 with DisCoTec); PLACES 2026 was the 17th edition
- Held with ETAPS, so mostly in Europe (Munich 2022, Paris 2023, Luxembourg 2024, Hamilton 2025, Turin 2026)
- Research papers up to 8 pages in EPTCS style appear in the proceedings; talk proposals up to 2 pages are presented only
- At least three reviewers per submission
- Proceedings in the open-access EPTCS series (PLACES 2025 -> EPTCS 420, PLACES 2026 -> EPTCS 444)
- Best papers invited to a JLAMP special issue (2026)
- Not listed in ICORE2026
