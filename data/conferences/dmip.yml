id: dmip
name: DMIP
full_name: International Conference on Digital Medicine and Image Processing
type: conference
tier: minor
areas: [vision, ai]
region: asia-pacific
language: english
frequency: annual
organizer: Conference secretariat at cbees.net (Hong Kong headquarters) with academic chairs from Japanese and Chinese universities
organizer_country: [china]
proceedings: ACM DL (ACM ICPS)
archival: true
indexing: [EI, Scopus]
typical:
  deadline_months: [10]
  conference_months: [11, 12]
links:
  website: https://www.dmip.org/
notes:
- Held every year since 2018; 2026 is the 9th edition
- Held in Japan almost every year (Okinawa 2018, Kyoto 2023, Osaka 2024, Tokyo 2025, Sapporo 2026); Shanghai in 2019 and online from 2020 to 2022
- Papers in the ACM International Conference Proceedings (ACM DL), stated as indexed in EI Compendex and Scopus; alternatively the Journal of Image and Graphics (JOIG)
- Topics cover medical image analysis and reconstruction, digital pathology, bioinformatics, image processing and machine learning
- Abstract-only presentation without publication and listener registration are also offered
- Smaller commercially organized conference; secretariat contact at cbees.net
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
