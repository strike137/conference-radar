id: eiecs
name: EIECS
full_name: International Conference on Electronic Information Engineering and Computer Science
type: conference
tier: minor
areas: [communications, general]
region: china
language: english
frequency: annual
organizer: AEIC (AiScholar, ais.cn) conference service with a host university each year (Dongguan University of Technology in 2026)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 570 USD or 3800 CNY per 4-page paper (2026, regular); 510 USD early bird before 2026-09-01; 540 USD student; 60 USD per extra page; attendee without paper 225 USD
typical:
  deadline_months: [8]
  conference_months: [9, 10]
links:
  website: http://www.eiecs.org/
notes:
- Annual since 2021 and held in China (Changchun 2021, virtual 2022, Changchun 2023, Yanji 2024, Changchun 2025, Dongguan 2026)
- Run by a commercial conference service (AEIC/AiScholar) with a host university each year; Changchun University of Science and Technology hosted most editions
- Broad scope covering electronic and communication engineering plus general computer science
- Proceedings published by IEEE (2025 cover on the site) and indexed in EI Compendex and Scopus; 2025 volume has 277 papers
- The site states 2 to 3 rounds of double-blind review; minimum paper length 4 pages
- Presenter (abstract only) and listener registration are also offered
- Not listed in CORE ICORE2026 or the CCF list
