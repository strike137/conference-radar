notes:
- Biennial conference of the g0v civic hacker community in Taiwan, held since 2014 (2014, 2016, 2018, 2020, 2024, 2026)
- Brings together civic tech developers, open source communities, government, NGOs and academics; topics include open
  government, open data, privacy and digital resilience
- Open call for proposals; held over two days at the Academia Sinica Humanities and Social Sciences Building, Taipei
- Site in Mandarin, English, Hakka and Taiwanese; talks only, no papers or proceedings
