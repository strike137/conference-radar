notes:
- Practitioner cybersecurity conference in Munich, Germany, run by Vogel IT-Akademie, a division of the publisher Vogel IT-Medien
- One training day followed by two conference days of keynotes and talks; no formal proceedings
- Small event, about 130 to 140 participants (2025 and 2026); 2026 had 40 speakers and trainers, 3 trainings and 32 keynotes and talks
- 2026 edition held at DIE MACHEREI Munich, an event location in a historic industrial setting
