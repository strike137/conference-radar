notes:
- CVPR workshop on efficient deep learning for smartphones, embedded and IoT hardware; held with CVPR every year since 2021, 6th
  edition in 2026
- Runs challenges where solutions are evaluated on real mobile NPUs and GPUs (super-resolution, denoising, ISP, bokeh, efficient LLMs
  and Stable Diffusion in 2026)
- Papers up to 8 pages excluding references in CVPR format, double-blind review via Microsoft CMT
- Dual submission allowed with the CVPR main conference only
- Early and late paper deadlines; the late deadline also covers challenge papers
- Accepted papers go into the CVPR Workshops proceedings on CVF Open Access and IEEE Xplore
- Same organizing team as the NTIRE (CVPR) and AIM (ICCV/ECCV) workshops
- Not listed in ICORE2026 or the CCF list
