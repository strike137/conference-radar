notes:
- Started in Asia-Pacific (2000 Hong Kong) but now rotates worldwide (2023 Australia, 2024 Doha, 2025 Marrakech,
  2026 Venice)
- Proceedings in Springer LNCS; 15 pages, double-blind review via Microsoft CMT
- CCF B and CORE B, but acceptance has been high recently (45-54%, 2023-2025)
- 2026 has special tracks on security and runtime governance of AI-driven critical systems, and on knowledge graphs
  and RAG; online presentation possible
