notes:
- Sponsored by the IEEE Computer Society VGTC; the leading academic venue for augmented, mixed and virtual reality
- Single paper deadline in March with a unified review for IEEE TVCG journal papers and ISMAR conference papers;
  rebuttal phase
- Journal-track papers appear in a special issue of IEEE TVCG, conference papers in the ISMAR proceedings; all in
  IEEE Xplore
- Main body 4 to 9 pages (11 total with references), VGTC conference style, anonymous review via PCS
- 763 submissions and 217 accepted papers (60 journal, 157 conference) in 2025
- Rotates worldwide (Daejeon 2025, Bari 2026, Kobe 2027, Cyprus 2028)
- CORE A* (ICORE2026); CCF B (computer graphics and multimedia category)
