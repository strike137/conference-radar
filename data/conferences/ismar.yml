id: ismar
name: ISMAR
full_name: IEEE International Symposium on Mixed and Augmented Reality
type: conference
tier: top
areas: [general, vision]
region: worldwide
language: english
frequency: annual
organizer: IEEE Computer Society and IEEE VGTC (supported by ACM SIGCHI)
organizer_country: [international]
proceedings: IEEE Xplore (IEEE TVCG special issue for journal-track papers)
archival: true
rank:
  core: A*
  ccf: B
typical:
  deadline_months: [3]
  conference_months: [10]
links:
  website: https://ismar.net/
