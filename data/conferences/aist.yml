notes:
- Data science conference covering image analysis, NLP, social network analysis and machine learning, held since 2012
- Main proceedings in Springer LNCS; a companion volume goes to Springer CCIS
- Full papers up to 15 pages in LNCS style; double-blind review by at least three PC members via OpenReview
- At least one author must attend in person to present
- Held in Russia until 2020, then in a different country each time (Tbilisi 2021, Yerevan 2023, Bishkek 2024, Astana 2026)
- No edition in 2022 or 2025
- "CORE ICORE2026 rank: National: Russia"
