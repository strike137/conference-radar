unverified:
- Only one edition so far; whether HTAPSys will run again (with ICDE 2027) is not announced, so frequency is left out
- The workshop page does not itself name the proceedings; taken from the ICDE 2026 call for workshops. The HTAPSys camera-ready date (March 19) is later than the ICDE workshop camera-ready limit (March 9, to be confirmed), so inclusion of the papers in IEEE Xplore was not confirmed
- Region set from the single 2026 edition
