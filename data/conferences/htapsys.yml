notes:
- Workshop on hybrid transactional and analytical processing (HTAP) database systems; 1st edition at IEEE ICDE 2026 in Montreal
- Regular research papers and visionary position papers up to 6 pages including references, IEEE proceedings format; single-blind review on Microsoft CMT
- ICDE 2026 call for workshops says workshop proceedings are published jointly alongside the conference proceedings
- Mostly invited talks from academia and industry (Boston University, Huawei, Snowflake, PingCAP) in 2026
- Co-chairs Tianzheng Wang (SFU) and Xun Xue (Huawei Canada)
- Not listed in CORE ICORE2026 or in the CCF 2026 list
