notes:
- Smaller commercially run conference (secretariat on a 163.com address, submission and registration via zmeeting)
- Held since 2018; online 2021, then Wuhan 2022, Nanjing 2023, Wuxi 2024, Hong Kong 2025 (hybrid), Jiangyin 2026
- Co-sponsored by IEEE, IEEE Robotics and Automation Society and Nanjing University of Science and Technology (2025 and 2026)
- Proceedings in IEEE Xplore since 2021, stated as indexed by EI Compendex and Scopus
- Single-blind review; abstract-only presentations accepted
- Not listed in ICORE2026 or the CCF 2026 list
