notes:
- Main venue for interactive theorem proving and proof assistants (Isabelle, Rocq/Coq, Lean, HOL, ...), from
  foundations to formalized mathematics and verified software and hardware
- Successor of TPHOLs (Theorem Proving in Higher Order Logics); 17th ITP in 2026, series history back to 1988
- Proceedings in LIPIcs (volume 382 for ITP 2026)
- Regular papers up to 16 pages and short papers up to 6 pages excluding references, LIPIcs format
- Lightweight double-blind review; submissions should come with a formalization or other evidence of an implementation
- Joins FLoC every four years (Haifa 2022, Lisbon 2026); mostly held in Europe (Rome 2021, Bialystok 2023, Tbilisi
  2024, Reykjavik 2025, Lisbon 2026)
- CORE B (ICORE2026)
