id: mipr
name: IEEE MIPR
full_name: IEEE International Conference on Multimedia Information Processing and Retrieval
type: conference
tier: minor
areas: [vision, data, ai]
region: worldwide
language: english
frequency: annual
organizer: IEEE (technically co-sponsored by IEEE Computer Society; 2026 also by IEEE Thailand Section, hosted by Mahidol University)
organizer_country: [international]
proceedings: IEEE Xplore
indexing: [DBLP]
fee: 850 USD IEEE member, 1020 USD non-member (2026, paper author registration)
typical:
  deadline_months: [3, 4]
  conference_months: [8]
links:
  website: https://mipr2026.org/
  dblp: https://dblp.org/db/conf/mipr/
notes:
- IEEE conference on multimedia processing, retrieval, multimodal learning and generative media; 9th edition in 2026
- Proceedings in IEEE Xplore every year since the first edition in 2018
- Regular, special session and workshop papers are 6 pages plus 1 page of references in IEEE two-column format;
  demo papers 4 pages including references
- Held in San Jose, USA in 2019, 2024 and 2025; other editions in Miami (2018), Shenzhen (2020), Tokyo (2021), online (2022), Singapore (2023) and Bangkok (2026)
- Not listed in ICORE2026 or in the CCF 2026 list; regarded as a smaller multimedia venue than ICME or ICMR
- At least one author must register at the full paper author rate and present in person
