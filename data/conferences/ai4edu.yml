organizer: Workshop at the AAAI Conference on Artificial Intelligence; organizers led by Zitao Liu (Guangdong Institute
  of Smart Education, Jinan University), with co-organizers that change each year
organizer_country: [china]
proceedings: Workshop website (papers posted on ai4ed.cc, non-archival in 2026; the 2024 edition offered PMLR)
archival: false
