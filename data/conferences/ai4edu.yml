links:
  website: https://ai4ed.cc/
notes:
- Workshop on AI in education held with AAAI; location follows AAAI (2024 Vancouver, 2025 Philadelphia, 2026 Singapore)
- Each edition has its own theme (2025 generative AI tools and risks, 2026 large multimodal models in education)
- 2026 organizers from Jinan University, Beijing Normal University, TAL Education Group (China) and University
  of Le Mans (France); 2025 also had Carnegie Mellon University and University of Memphis
- 2026 edition was non-archival with double submission allowed; papers 5 to 7 pages in AAAI two-column style, double-blind
  via OpenReview
- 18 accepted papers in 2026
- The 2024 edition invited extended versions of accepted full papers to PMLR workshop proceedings
- Not listed in ICORE2026 and not on the CCF list
