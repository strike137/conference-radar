notes:
- Workshop on graph machine learning with large models (LLMs for graph tasks, knowledge graphs, graph reasoning)
- 1st edition held with ACM CIKM 2025, 2nd edition (GMLLM'26) with ACM SIGKDD 2026 in Jeju, Korea; host conference is not fixed
- Non-archival; papers already published elsewhere are also accepted
- Full papers up to 8 pages, short papers up to 4 pages (ACM sigconf), double-blind review via OpenReview
- Accepted papers may optionally be recommended to the journal Transactions on Graph Intelligence and Network Applications
- Organized by Qingyun Sun, Ziwei Zhang and Jianxin Li (Beihang University), with Philip S. Yu among the organizers
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
