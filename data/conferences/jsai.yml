notes:
- Annual conference of JSAI, late May or early June, held in various cities in Japan (Osaka 2025, Takasaki/Gunma
  2026, Nagasaki 2027); hybrid with online participation
- Very large (the 2026 registration page warns it may close if applicants exceed 4,000); general sessions (Japanese
  or English, 2 to 4 pages) only get a light screening and are generally regarded as non-refereed
- International session in English is reviewed (work-in-progress 1 to 2 pages, regular 2 to 8 pages); excellent
  regular papers are recommended to the journal New Generation Computing
- All papers are free on J-STAGE; selected JSAI 2022 international session papers appeared in Springer LNCS 13859
  (LNAI) together with the co-located JSAI-isAI 2022 workshops, but the 2025 and 2026 CFPs mention only the New
  Generation Computing recommendation
- Presentation application mid or late January, paper deadline mid or late February; one presentation per presenter
