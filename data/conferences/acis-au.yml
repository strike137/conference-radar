links:
  website: https://acis.aaisnet.org/
notes:
- Premier Information Systems conference of Australia, New Zealand and the South Pacific, running since 1990 (37th
  edition in 2026)
- Covers technical, organizational, business and social sides of IT use; mostly IS and business school researchers
  rather than core CS
- Proceedings published in the AIS eLibrary (ACIS collection, ISSN 2652-4066)
- Full papers (up to 10 pages) and short research-in-progress papers (up to 5 pages), double-blind review in tracks,
  submitted via EasyChair
- Held in Australia or New Zealand each December (2024 Canberra, 2025 Sunshine Coast campus at Moreton Bay, 2026 Perth)
- Deadlines are 23:59 AEST (UTC+10) and have been extended by one to two weeks in recent years
- Doctoral consortium and development workshops run in the two days before the main conference
- Not listed in ICORE2026 (CORE2018 listed it under the Australasian category); not in the CCF list
