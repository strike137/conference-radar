language: english
frequency: annual
organizer: Australasian Association for Information Systems (AAIS), the AIS chapter for Australasia, with a rotating
  host university (2025 University of the Sunshine Coast, 2026 Edith Cowan University)
organizer_country: [australia]
proceedings: AIS eLibrary (AISeL)
archival: true
