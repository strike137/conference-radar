notes:
- Multidisciplinary conference on explainable AI, first held in 2023
- Editions in Lisbon 2023, Valletta 2024, Istanbul 2025 and Fortaleza (Brazil) 2026
- Full and short papers in main track and special sessions published after the event in Springer CCIS
- Late-breaking work, demos and doctoral consortium papers planned for CEUR-WS
- Many special sessions on applied XAI topics; special session papers go through the central review
- Not listed in ICORE2026 or the CCF 2026 list
