notes:
- Successor (since 2020) of the International Conference on Information Theoretic Security (ICITS, 2005 to 2017)
- Held in cooperation with the IACR; since 2025 affiliated with CRYPTO and held just before it at UC Santa Barbara
- Publication-track papers in open-access LIPIcs; selected papers invited to the Journal of Cryptology
- Also non-published Spotlight (invited surveys) and Highlights (recent work from other venues) tracks
- Steering committee co-chaired by Benny Applebaum and Elette Boyle
- Not ranked in CORE (ICORE2026); the CORE "ITC" entries are the IEEE Test Conference and the Teletraffic Congress
