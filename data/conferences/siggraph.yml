notes:
- Flagship computer graphics conference of ACM SIGGRAPH; conference plus a large exhibition every summer
- ICORE2026 A*, CCF A
- "Two technical paper tracks: journal papers in a SIGGRAPH issue of ACM TOG and conference papers in the ACM DL proceedings; authors submit journal-only or dual-track, and the committee picks the track for dual-track papers"
- Rebuttal phase, then a revised paper for final review; from 2026 accepted authors facing hurdles with the Los Angeles location could request to present at SIGGRAPH Asia instead
- Held in North America (Los Angeles 2026, Anaheim 2027)
