notes:
- Annual conference with an international steering committee led by Mohammad S. Obaidat (same group as CITS); site hosted by the University of Girona
- IEEE ComSoc technical co-sponsorship; accepted papers are submitted to IEEE Xplore and expected to be indexed in Scopus
- Extended versions of selected papers go to special issues of the International Journal of Communication Systems and the Security and Privacy journal (Wiley)
- Papers up to 8 pages in IEEE format via EDAS; the paper deadline is usually extended to mid August
- Recent editions in China (Beijing 2024 hybrid, Hangzhou 2025, Shanghai 2026 at Tongji University)
- "Acceptance rate: about 31% (2026)"
- Not ranked in CORE ICORE2026; not in the CCF 2026 list
