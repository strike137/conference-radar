notes:
- 'Japan''s network operators community: two 3-day meetings per year (January/February and July) in regional cities,
  plus one-day interim meetings in Tokyo'
- Main meeting is free; talks are in Japanese and in person only; the program committee selects proposals for usefulness,
  originality and discussion value
- Student travel support (Wakamono Shien Program, run by the IP Next Ikusei Kyokai association) covers travel, lodging
  and the social fee for students aged 18 to 29 who live about 1.5 hours or more from the venue
- 'Non-archival: slides and, if the speaker agrees, streaming video archived for about six months'
