full_name: IEEE Electron Devices Technology and Manufacturing Conference
type: conference
tier: minor
areas: [communications, general]
region: asia-pacific
language: english
frequency: annual
organizer: IEEE Electron Devices Society (EDS)
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
typical:
  conference_months: [2, 3]
links:
  website: https://ieee-edtm.org/
notes:
- Fully sponsored by the IEEE Electron Devices Society, started to use Asia's manufacturing base; first held in
  2017 in Toyama, Japan, and in 2026 in Penang, Malaysia for the first time
- 3-page A4 papers covering all areas of electron devices (materials, process, logic, memory, power/RF, photonics,
  packaging, modeling, reliability, neuromorphic and quantum)
- Presented papers go to IEEE Xplore; selected papers are invited to a J-EDS / T-MAT special issue
- Late News track with a separate deadline about three months before the conference
- Not ranked by CORE or CCF, whose lists cover computing venues; strong industry participation
