notes:
- Series started in 2001 in Maebashi, Japan; ran as WI only from 2016 to 2019, joint WI-IAT brand resumed in 2020
- Rotates worldwide (London 2025, Brisbane 2026); hybrid format; 2026 edition held in conjunction with Brain Informatics
  2026
- CORE lists it as WI (rank B); not in the CCF list
- Single-blind review; long papers up to 8 pages in IEEE format, with at most 2 paid extra pages (165 AUD per page
  in 2026)
- Proceedings in IEEE Xplore; selected papers invited to the Web Intelligence journal and other journals
