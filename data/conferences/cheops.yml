notes:
- One-day storage systems workshop co-located with EuroSys since 2021 (Rome 2023, Athens 2024, Rotterdam 2025, Edinburgh 2026)
- Steering committee from DDN, ENSTA Paris, Ohio State, CERN, Inria and OVGU Magdeburg
- Full papers (6 pages) or short papers (4 pages) excluding references, double-blind review with at least 3 reviews
- Proceedings in the ACM Digital Library; extended versions of selected papers considered for ACM SIGOPS Operating Systems Review
- Work-in-progress session with one-page abstracts that are not included in the proceedings (2025)
- Abstract deadline one week before the paper deadline; deadlines are usually extended
- Not listed in CORE ICORE2026 or the CCF list
