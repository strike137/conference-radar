notes:
- Workshop co-located with AINA since 2025 (Barcelona 2025, Wellington 2026, Tirana 2027); follows the AINA host city
- Chaired by Joe Rafferty and Bryan Scotney (Ulster University) with Mamun Abu-Tair (British Telecom Ireland Innovation Centre)
- Topics are autonomic and self-managing systems for IoT, self-healing networks, zero trust, trust attestation and agentic AI
- Papers up to 12 pages in Springer lecture notes format via EDAS; peer reviewed and published in the AINA Springer proceedings, submitted to Scopus
- Hybrid mode; papers not presented may be removed from the digital library
- Selected 2026 papers invited to an MDPI Sensors special issue
