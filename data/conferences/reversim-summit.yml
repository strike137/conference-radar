notes:
- Israel's community-driven software conference for developers, product managers and data scientists
- Not-for-profit and run by volunteers since 2013; content committee drawn from Israeli tech companies
- Two days at Expo Tel Aviv (Pavilion 10) in 2025 and 2026; 2024 edition was in Tel Aviv in March
- No 2023 edition in the official archive (2022, then 2024)
- 2026 is billed as the agentic edition, with many AI agent and LLM talks
- Talks only, no papers or proceedings
