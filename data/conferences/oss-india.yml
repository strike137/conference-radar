notes:
- Linux Foundation practitioner conference for open source developers, technologists and community leaders in India
- 2025 edition in Hyderabad was billed as the inaugural vendor-neutral open source conference in India; 2026 moved to Mumbai and grew to two days
- Umbrella event with tracks such as Cloud and Orchestration, Embedded, Linux, Open AI and Data, OSS Enabling and Management, Zephyr
- Talk proposals through Sessionize; no papers, session slides and recordings are posted afterwards
- 2026 venue is Jio World Convention Centre, Mumbai
