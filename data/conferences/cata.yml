notes:
- Run by the International Society for Computers and Their Applications (ISCA), a small US society that also runs BICOB, CAINE and SEDE
- Long-running general computing conference; 2027 is the 42nd edition
- Broad topics from AI, networks and security to databases, graphics and computers in education
- Since 2025 the proceedings are published by Springer Nature as one volume per year (35 papers in 2026, 19 in 2025); 2023 and 2024 were in the EasyChair EPiC Series in Computing
- Single-blind review; submission through Springer Nature Meteor
- Extended versions can be submitted to the ISCA journal after the conference
- Held in the USA each year in March (online 2023, New Orleans 2024, San Francisco 2025, Honolulu 2026, New Orleans 2027)
- Co-located with the ISCA BICOB conference
