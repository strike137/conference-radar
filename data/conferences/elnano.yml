notes:
- Long-running conference (43rd edition in 2026) owned by IEEE since 2013 and held at Igor Sikorsky Kyiv Polytechnic Institute in Kyiv, Ukraine, as part of IEEE Kyiv Polytechnic Week
- Biennial since 2020 (2020, 2022, 2024, 2026; next in 2028); annual before that
- Tracks on nanotechnology in electronics, biomedical engineering, electron devices, and microwave theory and techniques
- Papers of 4 to 6 pages get three anonymous reviews via Microsoft CMT; presented papers go to IEEE Xplore (Scopus and Web of Science)
- Hybrid format (in person and virtual)
- "Fees (2026): 240 EUR IEEE members, 290 EUR non-members, 145 EUR IEEE students, 190 EUR other students"
- Not listed in CORE ICORE2026
