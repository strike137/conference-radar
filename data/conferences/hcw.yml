notes:
- Workshop on heterogeneous computing (accelerators, hybrid clusters, clouds, memory hierarchies, scheduling), held
  since 1992 (35th edition in 2026)
- Co-located with IEEE IPDPS every year (virtual 2021 and 2022, St. Petersburg 2023, San Francisco 2024, Milan 2025,
  New Orleans 2026)
- Papers appear in the IPDPS workshops proceedings (IPDPSW) in IEEE Xplore
- Up to 10 pages IEEE double-column including references; single-blind review; submission through the IPDPS
  Linklings site
- Steering committee mostly US based; best paper award
- CORE C (ICORE2026); not on the CCF 2026 list
