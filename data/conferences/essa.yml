notes:
- Workshop co-located with IEEE IPDPS since 2020; called HPS (International Workshop on High Performance Storage) in 2020 and 2021, ESSA since 2022
- IPDPS workshop papers are submitted to IEEE Xplore after the conference
- 'Topics: storage and I/O for HPC, cloud and edge, I/O libraries, data reduction and compression, in-situ processing, I/O for machine learning workloads'
- Regular papers up to 8 pages and short papers up to 5 pages, excluding references; IEEE conference format, not anonymous
- Submission through the IPDPS Linklings portal; deadlines AoE, and the 2026 deadline was extended by two weeks
- Half-day workshop in 2027 (Tuesday afternoon of IPDPS week)
- Not listed in CORE ICORE2026
