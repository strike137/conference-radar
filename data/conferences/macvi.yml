id: macvi
name: MaCVi
full_name: Workshop on Maritime Computer Vision
type: workshop
tier: minor
areas: [vision, ai]
region: north-america
language: english
frequency: annual
organizer: Maritime Computer Vision Initiative (MaCVi) community; general co-chairs Benjamin Kiefer (LOOKOUT / University of Tuebingen)
  and Uma Mudenagudi (KLE Technological University); co-located with WACV or CVPR
organizer_country: [international]
proceedings: IEEE Xplore and CVF Open Access (WACV / CVPR Workshops)
archival: true
typical:
  deadline_months: [10, 12, 3]
  conference_months: [1, 2, 6]
links:
  website: https://macvi.org/
notes:
- Workshop on computer vision for surface, underwater and aerial maritime settings, started in 2023 by Benjamin Kiefer
- Held at WACV in 2023, 2024, 2025 and 2027, and at CVPR in 2026
- Combines regular papers, benchmark challenges on maritime datasets and keynotes; challenge result papers appear in the workshop
  proceedings
- Papers up to 8 pages in the host conference format, double-blind review on OpenReview
- 15 papers in the CVPR 2026 workshop proceedings on CVF Open Access
- Not listed in ICORE2026 or the CCF list
