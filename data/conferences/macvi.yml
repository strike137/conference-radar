  website: https://macvi.org/
notes:
- Workshop on computer vision for maritime, surface vessel, aerial and underwater settings, with benchmark challenges and keynotes
- Held with WACV in 2023, 2024 and 2025, with CVPR 2026 (4th edition, Denver) and with WACV 2027 (5th edition, Orlando)
- Papers up to 8 pages excluding references in the host conference format, double-blind review on OpenReview
- Accepted archival papers appear in the host conference workshop proceedings and IEEE Xplore
- 15 papers in the CVPR 2026 workshop proceedings on CVF Open Access
- Not listed in ICORE2026 or the CCF list
