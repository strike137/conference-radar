notes:
- Run by the Departments of Electrical, Electronics and Communication, and Computer Science Engineering of College of Engineering Trivandrum, Kerala, India
- Technical co-sponsor is the IEEE Kerala Section
- Accepted and presented papers are submitted to IEEE Xplore
- Biennial, held at CET Thiruvananthapuram in May (5th 2023, 6th 2025, 7th 2027)
- Single-blind review with at least two reviewers per paper; papers up to 6 pages
- Topics span control, communication and computing, including AI, NLP, vision and security
- Not listed in the CORE ICORE2026 portal
