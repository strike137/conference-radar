notes:
- Community-run Security BSides conference in Vilnius, Lithuania, held yearly since 2024
- Two days, a workshop day followed by a main day with one track of talks and a CTF finale; all talks and workshops in English
- Held at DC Valley in 2024 and at Kablys (Kauno str. 5) in 2025 and 2026
- 2026 drew 400+ attendees, 14 speakers and workshop instructors and 12 sponsors
- Open call for papers opens a few months before each event; the 2027 CFP is planned to open in early 2027
- No proceedings; talk recordings and photos posted on the archive pages
