id: c3nlp
name: C3NLP
full_name: Workshop on Cross-Cultural Considerations in NLP
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizing committee (2026 organizers from Google Research, Universidad Nacional de Cordoba, University of Copenhagen, University of Tubingen, CUHK Shenzhen, University of British Columbia and LMU Munich); co-located with EACL, ACL or NAACL
organizer_country: [international]
proceedings: ACL Anthology
archival: true
indexing: [ACL Anthology]
typical:
  deadline_months: [2, 3]
  conference_months: [5, 7]
links:
  website: https://c3nlp.github.io/
notes:
- Workshop on how culture shapes NLP data, models and applications, cultural harms and biases, and building cross-culturally competent NLP systems; invites social science and linguistics perspectives
- Held every year since 2023 with a *CL conference (EACL 2023 Dubrovnik, ACL 2024 Bangkok, NAACL 2025 Albuquerque, ACL 2026 San Diego)
- Long and short papers under full peer review can be archival (ACL Anthology) or non-archival; papers already accepted elsewhere can be presented as non-archival
- Direct submissions through OpenReview plus an ARR commitment deadline
- Offers limited travel funding for attendees
- Not ranked in ICORE2026 and not on the CCF list
