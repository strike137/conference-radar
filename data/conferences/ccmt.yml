organizer: CIPS (Chinese Information Processing Society of China), Technical Committee on Machine Translation and
  Multilingual Information Processing; 2026 hosted by Kunming University of Science and Technology
organizer_country: [china]
proceedings: None (accepted papers are recommended to journals such as MIR, JCST and Journal of Chinese Information
  Processing for separate review)
archival: false
fee: 2100 CNY main conference, early registration, CIPS professional member; 1800 CNY student member (2025)
typical:
  deadline_months: [8, 9]
  conference_months: [9, 10, 11]
links:
  website: http://sc.cipsc.org.cn/mt/conference/2026/
notes:
- National annual machine translation conference in China run by CIPS since 2005; formerly CWMT (China Workshop on
  Machine Translation, editions 1 to 14), then China Conference on Machine Translation (editions 15 to 20)
- Accepts Chinese and English papers; long papers up to 12 pages, short papers up to 6; double-blind review via
  OpenReview; English papers use the ARR format
- No conference proceedings; accepted English papers are recommended to MIR, JCST or Large Language Model, Chinese
  papers to domestic journals, each after separate journal review
- Parallel submission allowed when the other venue permits it
- Also runs machine translation evaluation campaigns (shared tasks) and tutorials; location changes each year within
  China
- Not listed in ICORE2026
