notes:
- Brazilian formal methods symposium supported by the Brazilian Computer Society (SBC); 29th edition in 2026; papers
  in English with an international steering committee
- Proceedings in Springer LNCS; the SBC OpenLib (SOL) also lists the volume with links to the Springer versions
- Regular papers up to 15 pages and short papers up to 8 pages (LNCS format, excluding references and appendices);
  at least three reviewers per paper
- Small venue; 12 of 24 full papers accepted in 2025 (50%)
- Held in a different Brazilian city each year (Manaus 2023, Vitória 2024, Recife 2025, Rio de Janeiro 2026)
- Not ranked in CORE ICORE2026
