notes:
- Half-day to one-day workshop co-located with the NDSS Symposium in San Diego (Feb 23, 2026; Feb 24, 2025; Mar 1, 2024; Feb
  27, 2023)
- Forum for academic researchers and Security Operations Center (SOC) operators; two tracks, short research papers
  and operator talk proposals
- 'Topics: SOC design and workflow, alert triage, incident response case studies, threat hunting, automation and
  agentic AI in the SOC, human factors and burnout'
- Short papers of 4 to 8 pages excluding references, NDSS template; talk proposals are a one-paragraph abstract plus
  outline and bio
- Papers and talk abstracts published in the NDSS proceedings with ISBN and DOIs (10.14722/wosoc.YYYY.*); talks are
  not recorded and the workshop follows the Chatham House Rule
- 10 accepted papers and talks listed for 2026, several from industry (Walmart, Panasonic)
- NDSS 2027 moves to Seoul, Korea (March 22 to 26, 2027); a WOSOC 2027 edition there is not announced yet
