notes:
- Non-profit undergraduate AI conference in Canada, run entirely by undergraduate volunteers since 2018
- Main event is an AI project showcase where student teams demo their project and paper to recruiters, sponsors and other delegates
- Project papers are collected as "CUCAI Proceedings" on the conference website; no formal publisher or indexing
- About 340 delegates from 19 schools (2024); invited talks from industry and academia
- Delegates register through partner student AI clubs or individually; presenting teams register in January
- Recent editions (2025, 2026) were held in Toronto
- Not listed in CORE ICORE2026
