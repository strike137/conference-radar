notes:
- Main venue for mining software repositories and empirical SE data; co-located with ICSE every year
- Two-day conference with Technical, Data and Tool Showcase, Mining Challenge, Industry and Registered Reports tracks
- Junior PC program puts early-career researchers (PhD students, postdocs) on the Technical track PC
- CORE A but only CCF C; double-anonymous review; 10 pages plus 2 pages of references
- MSR 2027 technical track adds an early reject stage before the author response
