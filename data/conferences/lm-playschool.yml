notes:
- Workshop on language agents that learn through situated interaction, dialogue games, interactive learning signals and machine language acquisition
- First edition (LMP 2026) held with EMNLP 2026 in Budapest on 28 October 2026
- Proceedings in the ACL Anthology (2026.lmplayschool-1)
- Includes the LM Playschool Challenge shared task (post-training LLMs for unseen dialogue games); challenge reports are archival
- Paper-only track accepts archival or non-archival work in progress and non-archival recently published papers; also takes ARR commitments
- Not ranked in ICORE2026 and not on the CCF list
