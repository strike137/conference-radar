notes:
- Premier annual venue for pervasive and ubiquitous computing (IoT, sensing, mobile systems, smart environments)
- Technically sponsored by the IEEE Computer Society; international steering committee chaired from Italy
- Papers published in IEEE Xplore; selected papers invited to a Pervasive and Mobile Computing journal special issue
- Double-blind review with early rejection and a rebuttal phase; 9 pages plus 1 page of references
- Held every March, rotating between Europe and the USA (Atlanta 2023, Biarritz 2024, Washington DC 2025, Pisa 2026); 2027 in Goa, India
- In-person only; remote presentations allowed only for visa or health problems
- Co-located workshops, demos, work-in-progress and PhD forum tracks
- CORE A*, CCF B (human-computer interaction and pervasive computing category)
