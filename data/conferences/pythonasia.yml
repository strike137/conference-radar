notes:
- Regional community conference for the Python programming language in East and Southeast Asia, renamed from PyCon APAC in 2026
- Run by the Python Asia Organization (PAO), a non-profit registered in Estonia that holds the PyCon APAC series rights, together with a local community
- Hosted in a different Asian country each year; past hosts include Singapore, Japan, Taiwan, South Korea, Malaysia, Thailand, Indonesia and the Philippines
- Three days of keynotes, talks, lightning talks, workshops, a poster session and sprints; talks chosen from a call for proposals
- No proceedings; practitioner talks only
- PythonAsia 2027 will be held in Singapore, co-organized with the Python User Group Singapore
