id: programming-conf
name: ‹Programming›
full_name: International Conference on the Art, Science, and Engineering of Programming
type: conference
tier: minor
areas: [software]
region: worldwide
language: english
frequency: annual
organizer: AOSA, Inc. (non-profit that also publishes The Art, Science, and Engineering of Programming journal)
organizer_country: [international]
proceedings: The Art, Science, and Engineering of Programming journal (AOSA, diamond open access, ISSN 2473-7321)
archival: true
typical:
  deadline_months: [2, 6, 10]
  conference_months: [3]
links:
  website: https://programming-conference.org/
notes:
- "Journal-first: to present a research paper, authors submit to the Programming journal; papers accepted in the three issues of the preceding cycle are presented"
- Journal has three submission deadlines per year (Feb 1, Jun 1 and Oct 1, AoE) with two rounds of review and a revision step
- Journal is diamond open access, free for authors and readers, articles under a Creative Commons license
- Several co-located workshops (MoreVMs, PX, Substrates, VIMPL, QP and others) with deadlines around December
- Held in Europe most years (Lund 2024, Prague 2025, Munich 2026), Tokyo in 2023 and Kyoto in 2027; 2021 was online and 2022 was hybrid from Porto
- Not listed in ICORE2026 or the CCF 2026 list
