notes:
- Workshop on intersection types, union and refinement types and related type systems, in theory and applications
- Held about every two years since 2000 (no edition in 2006, and 2020 skipped because of COVID-19); ITRS 2026 was the 12th edition
- Affiliated with FSCD, LICS, ICALP or FLoC; Vienna 2014, Porto 2016, Oxford 2018, online 2021, Tallinn 2024, Lisbon 2026
- Extended abstracts of 3 to 5 pages; short versions of published papers and papers submitted elsewhere are welcome
- Accepted papers appear on the workshop website as workshop proceedings
- Steering committee from Turin, TU Dortmund and Heriot-Watt
- Not listed in ICORE2026 or the CCF 2026 list
