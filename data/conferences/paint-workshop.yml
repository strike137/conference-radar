notes:
- One-day workshop on programming environments, visual and block-based programming, projectional editors and mixed notations
- Co-located with SPLASH (Auckland 2022, Cascais 2023, Pasadena 2024, Singapore 2025 with ICFP/SPLASH)
- Writers' Workshop format with moderated discussion of papers read beforehand; research papers and video demos
- No page limit for research papers (6 to 8 pages suggested), ACM sigplan format
- 2025 accepted papers planned for the ACM Digital Library; 2025 used conditional accepts with a resubmission round
- 2025 organizers from the Hasso Plattner Institute (Germany), University of Cambridge and Vrije Universiteit Amsterdam
- No 2026 edition is listed among the SPLASH/ISSTA 2026 workshops
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
