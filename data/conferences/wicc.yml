notes:
- Annual national meeting of Argentine computer science researchers, organized by RedUNCI since 1999; 28th edition in 2026
- Sibling event of CACIC, also run by RedUNCI
- Submissions are summaries (up to 5 pages) of research lines or R&D projects, not full research papers
- Accepted works are presented as posters, with a virtual poster exhibition before the event, plus meetings by thematic area
- Thematic areas include intelligent agents, networks and operating systems, databases and data mining, graphics and vision, software engineering, distributed and parallel processing, signal processing and security
- Proceedings book with ISBN (WICC 2026 ISBN 978-631-6904-02-7) and a poster book are posted on the event site
- Hosted by a different Argentine university each year (UNCuyo 2025, UAI Buenos Aires 2026, Universidad Nacional del Comahue 2027)
- Not listed in CORE ICORE2026
