notes:
- Flagship conference on requirements engineering; five-day event with research, industrial innovation, RE@Next!,
  posters and demos, doctoral symposium and workshops
- Research track uses double-blind review; solution-focused and evaluation-focused papers, 10 pages plus 2 pages of
  references, IEEEtran format
- Mandatory abstract one week before the full paper deadline in late February or early March
- Accepted papers appear in the IEEE Digital Library; CORE A, CCF B
- Rotates between Europe, North America and Oceania (Melbourne 2022, Hannover 2023, Reykjavik 2024, Valencia 2025,
  Montreal 2026, Milan 2027)
