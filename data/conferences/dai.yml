id: dai
name: DAI
full_name: International Conference on Distributed Artificial Intelligence
type: conference
tier: minor
areas: [ai]
region: asia-pacific
language: english
frequency: annual
organizer: DAI Steering Committee (Association for Distributed Artificial Intelligence)
organizer_country: [international]
proceedings: ACM ICPS (ACM DL)
archival: true
fee: 700 USD regular, 500 USD student (2026, early bird; 850/650 USD regular period)
typical:
  deadline_months: [8]
  conference_months: [11, 12]
links:
  website: https://www.adai.ai/
notes:
- Forum for distributed AI, multi-agent systems, agentic AI, distributed learning and computational game theory;
  held since 2019
- Held in China 2019 to 2022, Singapore 2023 and 2024, London 2025, Hong Kong (City University of Hong Kong) 2026
- 'Proceedings alternate by year: ACM DL (2019, 2023), Springer (2020 to 2022); 2026 Research and Industry papers
  go to ACM ICPS, open access with an APC unless covered by ACM Open or a waiver'
- 2026 tracks are Research (8 pages, double blind), Industry (6 pages, single blind), a non-archival AI Paper Track on
  research written with AI agents, and a non-archival Sister Conference Track for papers accepted at AAMAS, AAAI,
  IJCAI, NeurIPS and similar venues
- Submissions via OpenReview; no rebuttal period
- In-person only since 2023; at least one author per accepted paper must register
- Not listed in ICORE2026
