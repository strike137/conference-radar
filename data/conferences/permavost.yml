notes:
- Half-day workshop on HPC performance analysis, modelling, tools and visualization, bridging tool developers and application users
- Held with ACM HPDC every year since 2021, so it follows HPDC between the USA and Europe (Pisa 2024, Notre Dame 2025, Cleveland 2026)
- Full papers 5 to 8 pages in ACM sigconf format, single-blind review with at least three reviews, submitted via HotCRP
- Accepted papers published open access in the ACM Digital Library with no extra fee
- Deadlines are usually extended by one to four weeks
- Program has a keynote, an invited talk and a few paper presentations (three papers in 2026)
- Not listed in CORE ICORE2026; not on the CCF 2026 list
