notes:
- Organized by IARIA as part of the NetWare congress, co-located with SENSORCOMM, SENSORDEVICES and other IARIA events (21st edition in 2027)
- Published open access in the IARIA ThinkMind library (ISSN 2308-3530); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Portugal, Spain or France (Lisbon, Porto, Nice, Barcelona in recent years)
- Onsite and online participation options
