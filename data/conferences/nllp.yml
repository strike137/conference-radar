id: nllp
name: NLLP
full_name: Natural Legal Language Processing Workshop
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: Academic and industry organizing committee (University of Sheffield, Bloomberg, University of Copenhagen,
  Utrecht University, Maastricht University); co-located with EMNLP
organizer_country: [europe, usa]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [8]
  conference_months: [10, 11, 12]
links:
  website: https://nllpw.org/
notes:
- Workshop on NLP for the legal domain (legal reasoning, legal LLMs, contracts, regulation, platform governance)
- Held with NAACL 2019 and KDD 2020, and with EMNLP every year since 2021 (Punta Cana, Abu Dhabi, Singapore, Miami,
  Suzhou, Budapest)
- Long (8 pages) and short (4 pages) papers in the ACL Anthology; a non-archival option publishes only the abstract
- Double-blind review; also takes ARR commitments and rejected EMNLP papers with their reviews
- Runs a shared task each year (2026 on commercial content in child-facing YouTube videos)
