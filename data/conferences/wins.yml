notes:
- Small workshop-style event at the Budapest University of Technology and Economics (BME), Hungary, each February
- Topics span communication theory, quantum and optical comms, SDN/NFV, IoT, AI in networks and network security
- Papers up to 6 pages in IEEE two-column format, submitted via EasyChair
- 2023 and 2024 proceedings were posted for download by the organizers; no formal publisher named
- Not listed in the CORE ICORE2026 portal or the CCF list
