links:
  website: https://icmv.org/
notes:
- Series started in 2007 (Islamabad); held in Europe since 2013 apart from the 2020 and
  2021 virtual editions
- Recent editions in Rome 2022, Yerevan 2023, Edinburgh 2024, Paris 2025 and Budapest 2026
- Proceedings published by SPIE, listed as indexed in Ei Compendex and Scopus
- Selected papers invited to Computer Optics and the Journal of Electronic Imaging
- Full papers (up to 8 pages) and abstracts accepted; only full papers go into the proceedings
- Ranked C in ICORE2026; not on the CCF list
