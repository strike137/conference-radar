notes:
- Series started in 2013 in Hammamet, Tunisia; steering committee chaired from Tunisia
- Usually held in July around the Mediterranean (Rome 2023, Valletta 2024, Split 2025, Bari 2026, Mallorca 2027)
- Broad scope covering control, automation, robotics, optimization, decision, AI, networks and information technologies
- Regular papers up to 6 pages, short work-in-progress papers up to 5 pages; blind review via PaperCept
- All past proceedings are in IEEE Xplore; papers must be presented to be included
- Hybrid format with virtual registration available
- 2026 received 1080 submissions and had more than 600 participants
- Ranked C in ICORE2026
