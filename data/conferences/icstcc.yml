notes:
- Joint conference of the Romanian meetings SINTES, SACCS, SIMSIS and CONTI, run jointly by six Romanian technical universities
- Technically co-sponsored by the IEEE Control Systems Society since 2010; proceedings submitted to IEEE Xplore
- Proceedings of the 2013 to 2022 and 2024 editions are indexed in Web of Science, per the call for papers
- Always held in Romania (Sinaia for most years, Timisoara 2023, Sinaia 2024, Cluj-Napoca 2025, Iasi 2026)
- Papers up to 6 pages, up to 8 pages with 50 EUR per extra page; submission via PaperCept, iThenticate similarity check
- 2026 is the 30th edition
- Not listed in the CORE ICORE2026 portal and not on the CCF list
