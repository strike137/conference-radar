notes:
- North American sister event of ORConf, run by the FOSSi Foundation (a community interest company registered in England)
- Community conference on open source silicon -> open IP and SoCs, simulators, HDLs, synthesis and physical implementation for FPGA and ASIC, open PDKs, analog and mixed-signal
- Two days of single-track talks followed by a shorter day of small-group discussions and workshops; lightning talks at the Saturday dinner
- Talk proposals (full or lightning) are submitted as part of registration; no papers or proceedings
- Free to attend with registration; optional pay-what-you-want and professional tickets
- Moves around North America -> Portland 2019, Santa Barbara 2023, MIT Cambridge 2024, Santa Barbara 2025, University of Waterloo 2026
- 138 registrations in 2026
