notes:
- Organized by the NATO CCDCOE and held every year in Tallinn, Estonia
- Proceedings published by the CCDCOE and accredited by IEEE; all papers go through double-blind peer review
- Mixes academic papers with a large policy, legal and military audience (nearly 800 participants from 50 countries
  in 2026)
- Each edition has a theme (Securing Tomorrow 2026, Unified Response 2027)
- Not listed in the CORE ICORE2026 rankings
