frequency: annual
organizer: General chairs Denis Donadel (Fondazione Bruno Kessler) and Francesco Lupia (University of Calabria); steering
  committee from IMDEA Software, SAP Security Research, Stony Brook University, DTU, University of Padua and University
  of Calabria
organizer_country: [europe]
proceedings: Springer LNCS
archival: true
typical:
  deadline_months: [6]
  conference_months: [6, 7, 9]
links:
  website: https://adnd.work/
notes:
- Workshop on active defense (moving target defense, runtime defenses) and cyber deception (honeypots, canaries, attacker
  decision making)
- Held every year since 2022; the 5th edition in 2026 is co-located with ESORICS 2026 in Rome
- Earlier editions (2022 to 2025) took place in June or early July
- Accepts research papers (full up to 16 pages, short up to 10), position papers and experience papers; LNCS template,
  double-blind review
- Authors of accepted papers must agree to the Springer LNCS copyright
- The Honeynet Project offers student scholarships that cover workshop registration
