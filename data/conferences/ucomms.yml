notes:
- Organized by NATO STO CMRE (La Spezia); held on the Italian coast, 2026 in Sestri Levante
- Underwater acoustic, optical and RF communications, from waveforms and channel modelling to network protocols and interoperability
- Short papers of at most 4 pages plus references in IEEE format, reviewed by three reviewers
- Accepted and presented papers are submitted to IEEE Xplore; selected papers invited to a special collection of the IEEE Journal of Oceanic Engineering
- Off-the-record option, reviewed but not published
- Single track with structured sessions; capped at 100 registrations in 2026
