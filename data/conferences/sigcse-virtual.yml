notes:
- ACM SIGCSE conference on computing education, the newest of its conferences; first edition held fully online in December 2024
- Online only, held every two years in the September to December window in the years CompEd is not held
- Papers in three tracks (computing education research, experience reports and tools, position and curricula initiative), up to six pages plus one page of references in the ACM SIG format
- Also has posters, panels, special sessions, tutorials, birds of a feather, a spotlight track and a doctoral consortium
- Proceedings in the ACM Digital Library under ACM's open-access model (article processing charges apply)
- Not listed in the CORE portal (ICORE2026); only the main SIGCSE Technical Symposium is
