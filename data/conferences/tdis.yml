notes:
- Half-day workshop on testing, benchmarking and monitoring of distributed IoT and edge-cloud systems
- Co-located with ACM EuroSys since 2025 (Rotterdam 2025, Edinburgh 2026); the 2021 and 2022 editions were with IEEE IC2E
- No edition in 2023 or 2024
- 2026 edition had invited talks and five papers (full and short) with over 20 attendees
- Open-access proceedings in the ACM Digital Library
- 2026 deadline was CET with a 48-hour grace period
