notes:
- Organized by IFIP WG 11.4 and co-located with IFIP SEC; open to everyone, IFIP membership not needed
- Registration goes through IFIP SEC, with a workshop-only option
- Full papers up to 14 pages and short papers up to 10 pages in Springer LNCS format; submissions are not anonymized
- Work-in-progress, position and survey papers are welcome; best student paper award
- Proceedings published in the Springer IFIP series
- First held as WNDSS in 2025 (Maribor); no WNDSS in 2026, when IFIP SEC was in Perth and the working group met in Palaiseau instead
- The working group earlier ran the iNetSec workshop (2010 to 2017, Springer LNCS)
