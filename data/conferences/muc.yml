notes:
- German-speaking HCI conference held every year since 2001; describes itself as the largest HCI conference in Europe
- Run with the German Informatics Society (GI) and German UPA, which runs the practitioner track (Usability Professionals)
- Papers can be written in English or German (German papers need an English title and abstract)
- Full and short papers published open access in the ACM Digital Library; MuC 2026 covered fees for authors without an ACM Open agreement
- Full papers typically 4,000 to 9,000 words, short papers up to 6 pages; double-anonymous review on PCS, no rebuttal
- Also workshops, tutorials, demos, doctoral consortium and a student research competition
- CORE National Germany (ICORE2026); not in the CCF 2026 list
- Held in Germany or Switzerland (Rapperswil 2023, Karlsruhe 2024, Chemnitz 2025, Duisburg 2026, Oldenburg 2027)
