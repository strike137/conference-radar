notes:
- Organized by INSTICC; proceedings in the SCITEPRESS Digital Library, a short list of revised and extended papers
  is planned for a Springer CCIS book and best papers are invited to a Springer Nature Computer Science special issue
- Started in 2026 as the merger of the INSTICC graphics conference GRAPP and the visualization conference IVAPP,
  which used to run inside the VISIGRAPP joint conference
- Covers computer graphics (modeling, rendering, animation), information and scientific visualization, and HCI
- Co-located with VISAPP (ICORES in 2026; ICAART, PHOTOPTICS, VISAPP and ROBOVIS in 2027); registration gives free
  access to them
- Not listed on its own in CORE ICORE2026, which lists only VISIGRAPP (GRAPP and VISAPP combined) as a
  multiconference; not on the CCF list
- Two submission stages (submit in the 1st stage for an earlier notification) plus an abstracts track; all deadlines
  AoE
- Held in European cities (Marbella 2026, Valletta 2027); remote presentation allowed only exceptionally
