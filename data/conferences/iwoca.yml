notes:
- Standalone meeting despite the "workshop" name; started in 1989 as AWOCA (Australasian Workshop on Combinatorial Algorithms)
- Rotates worldwide (Ottawa 2021, Trier 2022, Tainan 2023, Ischia 2024, Bozeman 2025, Clermont-Ferrand 2026)
- Proceedings in Springer LNCS every year (2026 is LNCS volume 16587)
- Scope covers algorithms on graphs, strings and discrete structures, combinatorial optimization, complexity, computational geometry and related topics
- Papers up to 12 pages in LNCS format excluding references, optional appendix
- Lightweight double-blind review introduced for 2026
- Has a problems section and a collaborative workshop after the main event; selected papers invited to journal special issues
- Ranked C in ICORE2026
