notes:
- Turkish multidisciplinary congress held every year since 2019; 2027 is the 9th edition
- Run by the Turkish company SET Teknoloji (copyright holder of the official site), same organizer as ISMSIT
- Full papers go to IEEE Xplore (every year since 2020); abstracts and posters go to companion proceedings, and
  papers can instead go to the journal IJMSIT
- Double-blind review; full papers 4 to 10 pages, in Turkish or English (Turkish papers need an English title and abstract)
- Hybrid format with virtual and in-person sessions; held in Turkey (Istanbul 2023 and 2024, Ankara 2025 to 2027)
- Ten tracks from HCI, AI/ML, computer vision and NLP to robotics, IoT and cybersecurity
- Not listed in the CORE ICORE2026 portal
