notes:
- ICSE workshop on using AI for software performance engineering and on performance engineering of AI systems (training, inference, serving, RAG, agents)
- First edition at ICSE 2027 in Dublin (workshop day 2027-05-01); no earlier edition in its conf.researchr.org series
- Program co-chairs Alexander Pretschner (TU Munich, fortiss), Weiyi Shang (University of Waterloo), Yiming Tang and Derui Zhu (RIT)
- Research papers up to 8 pages and position papers up to 5 pages, excluding references; IEEE conference template
- Also accepts short, experience, tool and dataset papers, plus non-archival lightning talk proposals
- Accepted papers published in the IEEE workshop proceedings; at least three reviews per submission
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
