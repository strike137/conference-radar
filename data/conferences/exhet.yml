notes:
- Workshop on software, programming models, runtimes, architectures and co-design for extremely heterogeneous HPC systems
- Held with ACM PPoPP from 2023 to 2025 (Montreal, Edinburgh, Las Vegas); 5th edition moved to SCA/HPCAsia 2026 in Osaka
- PPoPP editions published in the ExHET-PPoPP workshops proceedings in the ACM Digital Library; SCA/HPCAsia workshop papers go to ACM-affiliated proceedings
- 2026 full papers 12 to 18 pages and short papers 8 to 9 pages, ACM single-column format, submitted via Linklings
- Best full and short paper awards
- Not listed in the CORE ICORE2026 portal
