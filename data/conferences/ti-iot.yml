notes:
- Workshop co-located with IEEE DCOSS-IoT; the 2026 edition was the 3rd
- Organised by Luis Lino Ferreira (INESC TEC/ISEP) and Ernesto Troiano (GFT)
- Topics are agentic and multi-agent IoT/AI systems, trustworthy and explainable AI, regulatory compliance, DLTs and Industry 5.0
- Papers up to 8 pages IEEE two-column (plus 2 appendix pages at 100 USD each), via EasyChair
- Accepted papers are published in the DCOSS-IoT proceedings and submitted to IEEE Xplore
- Follows the DCOSS-IoT host city (Reykjavik 2026)
