notes:
- National radio science conference of URSI Egypt, run yearly by the National Radio Science Committee of ASRT; 43rd edition in 2026
- Host institution changes every year (Horus University in New Damietta for 2024, AASTMT Heliopolis in Cairo for 2025); always held in Egypt
- Papers accepted and presented are published in IEEE Xplore and indexed in Scopus
- Scope follows URSI Commissions A to K (metrology, fields and waves, radio communication and signal processing, electronics and photonics, propagation, remote sensing, radio astronomy, EM in biology and medicine); recent programs also include AI and cybersecurity sessions
- Papers up to 8 pages; best paper, best student paper and student poster awards, with extended awarded papers invited to Radio Science Letters
- "Registration 4000 EGP from Egypt or 400 EUR from abroad per paper (2025)"
- Not listed in CORE ICORE2026
