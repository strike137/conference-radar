notes:
  - Workshop on deploying foundation models (VLMs, generative models) in autonomous vehicles through distillation
  - 1st edition at CVPR 2025 in Nashville, 2nd edition at ICCV 2025 in Honolulu
  - Papers up to 8 pages in the host conference format, submitted via OpenReview
  - Papers appear in the CVPR 2025 and ICCV 2025 workshop proceedings on CVF Open Access
  - Organizers are mostly from US industry and universities (Uber, Bosch, Purdue, Amazon, Toyota)
  - Not listed in ICORE2026 or the CCF list
