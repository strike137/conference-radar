notes:
- Annual meeting of the German-speaking medical image computing community since 1993, always held in Germany (Lübeck 2026, Hannover 2027)
- English and German are both accepted; English now dominates talks and posters
- Original papers of 6 to 8 pages are reviewed by three program committee members and published in the Springer Vieweg Informatik aktuell proceedings
- One-page abstracts of work published elsewhere are also accepted and appear with title, authors and abstract only
- Explicitly welcomes Bachelor and Master students; awards for best papers, best talk, best poster and the BVM-Award for theses
- Selected 2027 papers are invited to a special issue of Frontiers in Digital Health
- Registration 250 EUR regular, 200 EUR members of supporting societies, 50 EUR students up to 25 (2027, early)
- Not listed in CORE ICORE2026
