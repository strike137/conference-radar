notes:
- Interdisciplinary workshop on detecting and analysing online abuse and harms (hate speech, harassment, misinformation, radicalisation), open to NLP, social science, law and policy work
- Annual and co-located with a major *CL conference; proceedings in the ACL Anthology since 2021 (earlier editions ran as the Workshop on Abusive Language Online)
- 10th edition on October 29, 2026 at EMNLP 2026 in Budapest, Hungary; 2025 edition at ACL 2025 in Vienna, Austria (38 papers in the proceedings)
- Long papers up to 8 pages and short papers up to 4 pages are archival; 2-page non-archival abstracts and civil society reports are also accepted
- Direct submissions through Softconf plus a later deadline for papers with ARR reviews
- New mentorship programme in 2026 for authors from outside NLP
- Not ranked in ICORE2026 and not on the CCF list
