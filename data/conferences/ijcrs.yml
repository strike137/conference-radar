notes:
- Principal conference of the International Rough Set Society; rough sets, granular computing, three-way decisions,
  fuzzy sets and their applications
- Successor of RSCTC and related rough set conferences, joined in 2014
- Full-length papers (12 to 15 pages) appear in Springer LNCS/LNAI post-proceedings; 1 to 4 page extended abstracts
  go only to an online book of abstracts
- Rotates worldwide (2022 Suzhou, 2023 Krakow, 2024 Halifax, 2025 Chongqing, 2026 Cadiz)
- IJCRS 2026 accepted 27 full papers out of 106 submissions; IJCRS 2025 accepted 90 out of 187
- Selected IJCRS 2026 papers invited to a special issue of IJUFKS
- Submission deadline was extended twice in 2026 (January 9 -> January 31 -> February 22)
