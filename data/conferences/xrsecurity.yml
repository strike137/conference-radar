notes:
- Workshop on security, privacy and trust in AR/VR/XR systems, run by Maria Gorlatova (Duke), Bin Li (Penn State) and Ming Li (UT Arlington)
- 1st edition co-located with ACM MobiHoc 2025 in Houston (more than 30 attendees, nine full papers, five demos, twelve posters)
- 2nd edition is a full-day ACM workshop co-located with ACM MobiCom 2026 in Austin, Texas
- Full papers up to 6 pages in ACM double-column format, posters and demos up to 2 pages; submission via HotCRP
- Proceedings in the ACM DL (2025 papers went into the ACM MobiHoc 2025 conference proceedings via ACM e-Rights; 2026 has its own ACM proceedings volume)
