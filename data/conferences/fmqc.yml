notes:
- One-day workshop on formal methods for quantum computing (ZX-calculus, decision diagrams, tensor networks, SAT/SMT, model counting, quantum programming languages)
- First edition with CONFEST 2025 in Aarhus (2025-08-25); second edition with FLoC 2026 in Lisbon (2026-07-18)
- Accepts extended abstracts, short and long papers, including already published results; no formatting rules
- Non-archival; 2025 published accepted contributions informally on the workshop page and invited selected papers to an STTT special issue
- Organized by Max Bannach, Alfons Laarman, Jaco van de Pol and Christian Schilling
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
