organizer: Workshop organizing committee (2026 organizers from NTU Singapore, Utrecht University, Aix-Marseille University, University of Tokyo, AURYAL, City University of Hong Kong and MBZUAI), supported by NINJAL; co-located with ACL-family conferences or LREC
organizer_country: [international]
proceedings: ACL Anthology
archival: true
links:
  website: https://sites.google.com/view/cmclworkshop/home
notes:
- Long-running workshop on cognitive modeling, computational psycholinguistics and alignment of language models with human language processing
- 15th edition in 2026; earlier meetings at ACL, NAACL, EACL, EMNLP and LSA since 2010 (no edition in 2016 or 2023)
- 2026 edition co-located with LREC 2026 in Palma de Mallorca, Spain (May 16, 2026); 2025 at NAACL, 2024 at ACL
- Archival papers of 4 to 8 pages appear in the ACL Anthology (27 papers in 2026); non-archival extended abstracts and cross-submissions also accepted
- Direct submissions only (no ARR commitments); double-blind review
- Not ranked in ICORE2026 and not on the CCF list
