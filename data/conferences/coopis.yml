notes:
- Long-running conference on distributed and cooperative information systems (32nd edition in 2026); run by INSTICC since 2024
- Proceedings in Springer LNCS; in 2025 selected papers were invited to a special issue of the International Journal of
  Cooperative Information Systems
- CORE B (ICORE2026) and CCF C
- Topics include knowledge graphs, process analytics and automation, data ecosystems, IoT and digital twins, and AI-enabled
  information systems
- Tracks besides regular papers include ERA (early research), tool demos, doctoral symposium and panels (the 2026 tutorials
  and journal first tracks were cancelled)
- Held in European cities (Porto 2024, Marbella 2025, Angers 2026), co-located with ICINCO, WEBIST, IJCCI, IC3K and
  other INSTICC conferences
- All deadlines AoE
