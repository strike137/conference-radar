notes:
- Long-running forum on nonmonotonic, defeasible and default reasoning within knowledge representation, including
  belief revision, argumentation, reasoning about actions, logic programming and causality
- Started in 1984, held every two years until 2020 and every year since; usually co-located with KR
- Recent editions Haifa 2022, Rhodes 2023, Hanoi 2024, Melbourne 2025, Lisbon 2026 (with KR 2026 at FLoC)
- Full papers up to 14 pages including references and extended abstracts up to 3 pages, CEUR 1-column format
- Already published papers and papers under review elsewhere are welcome if this is stated on the first page
- Papers appear in CEUR Workshop Proceedings, which the organizers call informal proceedings; authors keep the
  copyright and only full papers are indexed by DBLP
- Not listed in the CORE ICORE2026 portal (the related conference LPNMR is CORE B)
