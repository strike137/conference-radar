notes:
- Workshop on deepfakes, media forensics, watermarking, synthetic media detection and security of large AI models
- Host conference changes each year; 1st at AVSS 2024, 2nd at NeurIPS 2025 (San Diego), 3rd at CVPR 2026 (Denver)
- Full papers in the host conference format, submitted via CMT
- 2026 accepted papers in the CVPR Workshops proceedings (IEEE Xplore, CVF Open Access); best papers invited to the Springer journal Machine Intelligence Research
- Student travel awards from IEEE TCMC and sponsors
- Not listed in ICORE2026 or the CCF list
