notes:
- Held every March since 2007 in the US (at SRI International, Arlington, Virginia from 2014 to 2025; virtual in
  2021 and 2022); moved to Singapore Institute of Technology for 2026 and 2027
- Small meeting capped at 50 participants (40 in 2025); papers up to 35 double-spaced pages, submitted by email
  to the program chair
- Only selected papers appear in the Springer edited book; extended versions go to IJCIP (2026) or Computers & Security
  (2027)
- 'Short cycle: submission in January, notification in February, conference in March'
