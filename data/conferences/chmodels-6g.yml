notes:
- Workshop co-located with IEEE GLOBECOM; the 2026 edition in Macau is the 5th, after four earlier GLOBECOM editions
- Covers channel measurement and modeling (sub-6 GHz to THz), AI-driven channel modeling and evaluation methods
  tied to ITU, 3GPP and ETSI standardization
- Run mainly by Huawei; general chair Peiying Zhu (Huawei Canada), co-chairs Jian Li (Huawei China) and Roberto
  Verdone (University of Bologna)
- The 2025 call for papers used the short name PCMEM6G
- 2025 edition was a half-day workshop
- Accepted and presented papers go into the IEEE GLOBECOM workshop proceedings in IEEE Xplore; in-person
  presentation required (no-show papers removed)
- Not listed in ICORE2026
