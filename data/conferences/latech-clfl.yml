notes:
- Annual workshop of ACL SIGHUM on NLP for cultural heritage, social sciences, humanities and literature
- Joint workshop since 2017, merging LaTeCH (since 2007) and CLfL (Computational Linguistics for Literature, since 2012)
- Follows a *ACL host conference (EMNLP 2021 Punta Cana, COLING 2022 Gyeongju, EACL 2023 Dubrovnik, EACL 2024 St Julian's, NAACL 2025 Albuquerque, EACL 2026 Rabat)
- Long papers (8 pages), short papers and demos (4 pages) and position papers; double-blind review; accepted papers in the ACL Anthology
- 2026 edition was a two-day workshop with one online day (March 28) and one on-site day (March 29); 32 papers in the proceedings
- The 11th edition (2027) is announced on the SIGHUM site without host conference or dates yet
- Not ranked in ICORE2026 and not on the CCF list
