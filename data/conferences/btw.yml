notes:
- Main database conference of the German-speaking community, run by the German Informatics Society (GI) every two
  years since 1985
- Research papers in English, long (20 pages) or short (10 pages) in LNI style, single-anonymous review
- BTW 2025 review had a feedback phase where authors could send a revision letter
- Accepted papers published in the GI Lecture Notes in Informatics (LNI); optional reproducibility check
- Besides research papers there are industry papers, demos, workshops, a student program and a dissertation award
- Held in Germany (Bamberg 2025, Munich 2027)
- Ranked National (Germany) in ICORE2026; not on the CCF 2026 list
