id: iccbdc
name: ICCBDC
full_name: International Conference on Cloud and Big Data Computing
type: conference
tier: minor
areas: [systems, data]
region: europe
language: english
frequency: annual
organizer: Co-sponsored by UK universities (Oxford Brookes University and University of Manchester in 2026) with a host university each year (University of Alcala in 2027)
proceedings: ACM DL (ACM ICPS)
archival: true
indexing: [EI Compendex, Scopus]
fee: Authors 650 USD early / 680 USD regular, students 620 / 640 USD, abstract presenters 350 / 400 USD, delegates 300 / 350 USD (2027)
typical:
  deadline_months: [2]
  conference_months: [6, 8]
links:
  website: https://www.iccbdc.org/
notes:
- Smaller commercially run conference (secretariat on an outlook.com address with a Chinese phone number, submission and payment via iconf.org)
- Held every year since 2017, almost always at a UK university (London, Oxford, Birmingham, Manchester, Cambridge); online in 2020 and 2021; Madrid, Spain in 2027
- Proceedings in the ACM Digital Library (ACM ICPS) in most years; the 2025 proceedings were published in IEEE Xplore
- Double-blind peer review; abstract-only presentation without publication is also offered
- 2027 edition moves from the usual August slot to June
- Not listed in ICORE2026 or the CCF 2026 list
