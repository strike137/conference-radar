notes:
- Long-running Japanese software developer conference run by the publisher Shoeisha (CodeZine); 2027 is the 25th edition
- Main edition every February in Tokyo; the event index also lists smaller Developers Summit editions later in the year
- 2026 and 2027 held at Ariake Central Tower Hall & Conference, Tokyo; on site only, no online streaming
- Free admission with advance registration; sponsor-driven talk conference
- Some sessions chosen by public call for proposals (2027 -> 10 regular 30-minute slots and a few 10-minute indie development slots)
- Talks only, no papers or proceedings
