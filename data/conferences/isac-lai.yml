notes:
- Half-day workshop co-located with IEEE GLOBECOM 2025 in Taipei, billed as the 13th workshop on integrated
  sensing and communications (ISAC)
- Part of a recurring ISAC workshop series at IEEE ComSoc flagships whose subtitle changes each time (8th edition
  at GLOBECOM 2023 was for Internet of Things, GLOBECOM 2024 had one for Edge Intelligence)
- Topics are ISAC for UAV and low-altitude networks (waveform and beamforming design, resource allocation,
  edge sensing intelligence, security, testbeds)
- Steering committee from Huawei, CUHK Shenzhen and Southeast University; 2025 co-chairs from BUPT, UCL,
  Tsinghua, SUSTech and other Chinese universities
- Accepted and presented papers go into the GLOBECOM workshop proceedings in IEEE Xplore; no-show papers are
  removed
- 12 papers in the 2025 program
- Not listed in ICORE2026
