notes:
- Main venue for new musical interfaces, instruments, music HCI and performance technology
- Started as a workshop at ACM CHI in 2001; an annual international conference since 2002
- Tracks for papers, music, installations, alt.nime, workshops and a doctoral consortium
- Papers get double-blind review by at least three reviewers; 2,000 to 6,000 words in 2027
- Proceedings are gold open access (CC BY 4.0) with Zenodo DOIs and indexed in Scopus
- Location rotates worldwide (Auckland 2022, Mexico City 2023, Utrecht 2024, Canberra 2025, London 2026, Paris 2027,
  Auckland 2028)
- Not listed in the ICORE2026 portal or the CCF 2026 list
