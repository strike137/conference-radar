notes:
- ACM SIGCHI conference on creativity, design, art and interactive technology, held since 1993
- Papers, pictorials and artworks share a January or February deadline (abstract one week before the full paper);
  posters, demos and student symposia follow in spring
- Proceedings in the ACM DL
- Alternates between in-person and online editions (online 2021, Venice 2022, online 2023, Chicago 2024, online
  2025, London 2026)
- 2026 edition had 289 attendees, 48 papers (20% acceptance) and 25 pictorials (31% acceptance)
- CORE B (ICORE2026); not on the CCF list
