id: mlnlp
name: MLNLP
full_name: International Conference on Machine Learning and Natural Language Processing
type: conference
tier: minor
areas: [ai, nlp]
region: china
language: english
frequency: annual
organizer: Commercial conference secretariat (Hong Kong contact, ISAC member pricing) with a host university each year (Jimei University in 2026); IEEE and IEEE CIS sponsorship in 2026
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI Compendex, Scopus]
fee: Regular author 600 USD or 4200 RMB, student author 550 USD (2026, after 2026-09-26); early bird 550 USD; 50 USD per page over 6 pages; listener 250 USD
typical:
  deadline_months: [10]
  conference_months: [10, 11, 12]
links:
  website: https://www.mlnlp2026.net/
notes:
- Annual since 2018; 2026 is the 9th edition
- Online 2020 to 2022, then in China (Sanya 2023, Chengdu 2024, Hangzhou 2025, Xiamen 2026)
- Proceedings by IEEE in 2021, 2024, 2025 and 2026 (IEEE Xplore, EI Compendex, Scopus); by ACM (ICPS) in 2018 to 2020, 2022 and 2023
- Run by a commercial conference service with a different host university each year
- Site states double-blind review by at least 3 reviewers; presenter-only and listener registration also offered
- Site also offers free extension in two quarterly journals from the same publisher group
- Not listed in CORE ICORE2026 or the CCF 2026 list
