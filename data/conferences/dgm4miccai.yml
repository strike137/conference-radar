notes:
- Half-day MICCAI satellite workshop on deep generative models (diffusion models, GANs, VAEs, flows) for medical
  image computing and computer assisted interventions; 2026 was the 6th edition
- Proceedings in Springer LNCS following the MICCAI workshop publication model
- Papers up to 8 pages in LNCS format (MICCAI template), double-blind review on OpenReview
- At least one co-author must volunteer to review for the workshop
- Location follows MICCAI (Strasbourg 2026, Auckland 2027)
- Organizers mainly from German groups (TU Darmstadt, Heidelberg, Regensburg) plus Istanbul Technical University,
  CUHK and the Netherlands Cancer Institute
- Not listed in CORE ICORE2026 or the CCF 2026 list
