id: bdiot
name: BDIOT
full_name: International Conference on Big Data and Internet of Things
type: conference
tier: minor
areas: [data, networking]
region: china
language: english
frequency: annual
organizer: Co-sponsored by the University of Macau and a host university (Shanghai University in 2026, Chongqing Technology and Business University in 2025)
organizer_country: [china]
proceedings: ACM DL (ACM ICPS)
archival: true
indexing: [EI Compendex, Scopus]
fee: Authors 650 USD regular / 600 USD student, presentation only 380 / 350 USD, delegates 280 / 250 USD (2026); ACM open access APC billed separately unless waived
typical:
  deadline_months: [9]
  conference_months: [10, 11]
links:
  website: http://www.bdiot.org/
notes:
- Smaller commercially run conference with a secretariat in China (contact via a yeah.net address and WeChat, submission via iconf.org)
- Simon Fong (University of Macau) has been a recurring organizing or program chair since the first edition
- Held since 2017 (London 2017, Beijing 2018, Melbourne 2019, online 2020 and 2021); in China since 2022 (Chongqing, Beijing, Macao, Chongqing, Shanghai)
- Proceedings in the ACM Digital Library every year, stated as indexed by EI Compendex and Scopus
- Papers peer reviewed by 2 to 3 reviewers; abstract-only presentation is also offered
- Selected extended papers recommended to an MDPI Sensors special issue
- Not listed in ICORE2026 or the CCF 2026 list
