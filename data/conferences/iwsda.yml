links:
  website: https://2025iwsda.github.io/iwsda2025/
notes:
- Workshop series on sequence and signal design, coding theory, cryptography and communications, running since 2001 (Chengdu); 11th edition in 2025
- Held about every two years, mostly in China and Japan, with editions in India (Bengaluru), the UK (Colchester 2022) and Australia (Melbourne 2025)
- Papers up to 5 pages in IEEE double-column format, submitted via EasyChair; proceedings published by IEEE and included in IEEE Xplore
- Authors of accepted papers are invited to submit extended versions to an IEICE Transactions on Fundamentals special section on Signal Design and its Applications in Communications
- Not listed in ICORE2026 or the CCF 2026 list
