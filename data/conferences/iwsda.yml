notes:
- Standalone workshop on sequence and signal design, coding theory, cryptography and their use in communications and radar
- Started in Chengdu in 2001; hosts since then are Dongguan, Yamaguchi, Chengdu, Fukuoka, Guilin, Tokyo, Bengaluru,
  Sapporo, Colchester (UK) and Melbourne (2025)
- The official site says it has been held every two years since 2005; the next edition is not yet announced
- Papers up to 5 pages in IEEE double-column format via EasyChair; proceedings in IEEE Xplore
- Extended versions of selected papers invited to an IEICE Transactions on Fundamentals special section (July 2027 issue
  for IWSDA 2025)
- Not listed in CORE ICORE2026 or the CCF list
