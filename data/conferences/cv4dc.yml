id: cv4dc
name: CV4DC
full_name: Workshop on Computer Vision for Developing Countries
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: Computer Vision for Developing Countries (US 501(c)(3) non-profit); co-located with ACCV or ICCV
organizer_country: [usa]
proceedings: Host conference workshop proceedings (ACCV 2026 Workshop Proceedings; IEEE Xplore and CVF Open Access for ICCV
  2025)
archival: true
typical:
  deadline_months: [7, 9, 10]
  conference_months: [10, 12]
links:
  website: https://cv4dc.github.io/
notes:
- Workshop for research done in or relevant to developing regions; open to all, with emphasis on authors from developing
  countries
- Editions at ACCV 2024 (Hanoi), ICCV 2025 (Honolulu) and ACCV 2026 (Osaka)
- Two tracks, a proceedings track (14 pages in ACCV LNCS style in 2026, double-blind on OpenReview) and a non-archival track
  (4 to 7 pages, also accepts recently published work)
- Includes a mentoring session for junior researchers; travel grants planned subject to sponsorship
- First workshop challenge in 2026 on resource-constrained computer vision
- Run by a non-profit founded in March 2025
- Not listed in ICORE2026 or the CCF list
