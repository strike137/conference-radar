links:
  website: https://mascots.iitis.pl
notes:
- Long-running symposium on measurement, modeling and performance evaluation of computer systems and networks (34th edition in 2026)
- Technically co-sponsored by the IEEE Computer Society; proceedings in IEEE Xplore
- Paris 2025 (Sorbonne University), Genova 2026 (University of Genova)
- Up to 8 pages in IEEE two-column format; single-blind review via EasyChair
- Good papers below the main threshold are invited to the MASCOTS workshop and published in the proceedings if presented live
- Selected 2025 papers invited to extended versions in the Performance Evaluation (PEVA) journal
- CORE B (ICORE2026), CCF C
