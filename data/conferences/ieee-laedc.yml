notes:
- Latin American electron devices conference sponsored by the IEEE Electron Devices Society
- Covers electron devices broadly (semiconductors, MEMS, RF/mmWave, sensors, modeling, reliability, photovoltaics,
  2D materials) plus humanitarian technology and STEM sessions
- Aimed at students and young researchers; up to 6 page papers in IEEE format, submitted via Microsoft CMT
- Accepted papers submitted to IEEE Xplore
- Held in Latin America (Puebla 2022 and 2023, Guatemala City 2024, Guadalajara 2025)
- Not listed in CORE ICORE2026 or the CCF list
