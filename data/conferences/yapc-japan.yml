notes:
- Community conference run by the Japan Perl Association; each edition is named after its host city
  (YAPC::Kyoto 2023, YAPC::Hiroshima 2024, YAPC::Hakodate 2024, YAPC::Fukuoka 2025, YAPC::Tokyo 2026)
- Centered on Perl but in practice covers web engineering, SRE, AI and other general software topics
- Rebooted as YAPC::Japan in 2017; 2024 had two editions (Hiroshima in February, Hakodate in October)
- Several editions held at universities (Future University Hakodate, Fukuoka Institute of Technology); 2026 at
  Tokyo Big Sight
- Talks of 20 or 40 minutes and live coding or hands-on sessions chosen from a call for proposals on fortee
- Student support and under-29 support programs for attendees
- No papers or proceedings; talks only
