notes:
- Flagship annual conference of the European Neural Network Society, held every year since 1991 in a different European
  city
- Proceedings in Springer LNCS (5 volumes in 2026), under the title Artificial Neural Networks and Machine Learning
- Relatively high acceptance (38% to 45% in 2022 to 2025, 66% in 2026); CORE C and CCF C
- ENNS student travel grants; each paper needs one full (non-student) registration
- Deadline usually late March after an extension; all deadlines AoE
