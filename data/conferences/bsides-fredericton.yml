notes:
- Community security conference in Fredericton, New Brunswick, Canada; part of the worldwide Security BSides movement
- Two days at the Fredericton Inn; day 1 has speaker sessions and a vendor area, day 2 has two hands-on workshops (pre-registration required)
- Free to attend, registration required (Eventbrite)
- Open to students, professionals and anyone interested in the cybersecurity community
- Talks only, no proceedings; not listed in the CORE ICORE2026 search
