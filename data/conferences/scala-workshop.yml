notes:
- Workshop on the design, implementation and applications of the Scala programming language; continuation of the ACM SIGPLAN Scala Symposium (last held 2022)
- Since 2025 a talk-proposal format; submissions are anonymous 2-page summaries in the ACM sigplan template
- Accepted talk proposals appear as post-proceedings on the workshop website only (non-archival)
- Co-located with a PL conference that changes yearly (ICFP/SPLASH 2025 in Singapore, ECOOP 2026 in Brussels)
- No edition in 2023 or 2024
- Organized by EPFL LAMP, the group behind Scala; keynotes by Martin Odersky and Li Haoyi in 2025
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
