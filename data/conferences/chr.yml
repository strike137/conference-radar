notes:
- Annual conference of the international Computational Humanities Research (CHR) society, founded in 2020
- Computational, statistical and machine learning methods (including LLMs and NLP) applied to humanities and cultural heritage data
- Proceedings in CEUR-WS for 2020 to 2024 and in the open access Anthology of Computers and the Humanities from 2025
- Double-blind review; long papers up to 6000 words, short papers and posters up to 3000 words, plus lightning talks and workshops (2027)
- Online in 2020 and 2021, then in Europe (Antwerp 2022, Paris 2023, Aarhus 2024, Luxembourg 2025, Manchester January 2027)
- The 7th edition moved from December to January 2027; at least one author must present in person
- Not listed in CORE ICORE2026 and not on the CCF 2026 list
