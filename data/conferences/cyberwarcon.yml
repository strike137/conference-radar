notes:
- One-day conference in Arlington, Virginia, USA on destructive, disruptive and influence cyber operations by states
  and other threat actors
- Audience from military, government, academia, media and the private sector; in person plus a paid virtual stream
- Short Call for Papers for 30 minute talks and lightning talks; speakers of full talks are paid 500 USD (2026)
- Many talks are never made public; no proceedings
- Held at the Hyatt Regency Crystal City; editions since 2018 (no 2020 edition listed in the archive)
- "Fee: 499 USD in person, 75 USD virtual (2026)"
- Not listed in ICORE2026 or the CCF 2026 list
