notes:
- Organized by Universitas Indraprasta PGRI in Jakarta, Indonesia; IEEE Indonesia Section members on the committee
- First edition on 21 January 2025 in Jakarta; second edition on 21 November 2026
- 2025 proceedings in IEEE Xplore and indexed by Scopus; 2026 papers to be submitted to IEEE Xplore
- 4 to 6 page IEEE papers via EDAS, peer reviewed by 3 reviewers; two submission batches in 2026
- Broad scope covering data science, computing, AI, automation, information systems, networks and education technology
- Not listed in the ICORE2026 CORE portal
