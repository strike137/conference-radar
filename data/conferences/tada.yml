notes:
- Half-day workshop on tabular data analysis and understanding, held with VLDB, so it moves with VLDB (2025 London, 2026 Boston)
- 4th edition in 2026; research track and a systems track that features SemTab Challenge participants
- Full papers up to 8 pages, short papers up to 4 pages, extended abstracts up to 2 pages, excluding references; non-anonymous submission
- Inclusion in the VLDB workshop proceedings is optional for authors; in-person presentation required
- 17 papers in the VLDB 2026 workshop proceedings
- Separate from the TRL workshop (tables, NeurIPS and ACL)
- Not listed in CORE ICORE2026 or in the CCF 2026 list
