notes:
- Long-running workshop series on disfluencies in spontaneous speech (phonetics, psycholinguistics, L2, health applications, speech and language technology)
- Satellite event of Interspeech; DiSS 2023 was in Bielefeld, Germany and DiSS 2025 (12th edition) in Lisbon after Interspeech 2025
- Proceedings in the ISCA Archive with DOIs (10.21437/DiSS.2025)
- DiSS 2025 had 21 papers plus 2 keynotes in the ISCA Archive
- Not listed in CORE ICORE2026 and not on the CCF list
