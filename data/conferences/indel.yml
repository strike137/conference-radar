notes:
- Biennial symposium on industrial electronics held in even years in early November in Banja Luka, Bosnia and Herzegovina (XVI edition in 2026)
- Organized by the Faculty of Electrical Engineering, University of Banja Luka; first held in 1997 as a national event, under IEEE technical co-sponsorship since 2010
- Co-sponsored by IEEE Industry Applications Society, IEEE Power Electronics Society and IEEE Industrial Electronics Society
- Accepted and presented papers are submitted to IEEE Xplore
- Topics include power electronics, electrical machines and drives, circuits and systems, measurement, signal processing, process control, renewable energy and energy efficiency
- Selected papers may be considered for IEEE Transactions on Industry Applications or the Electronics journal
- Roughly 100+ participants from the former Yugoslavia states and abroad; online participation offered
- Not listed in the CORE ICORE2026 portal
