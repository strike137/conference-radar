notes:
- Umbrella event of co-located conferences on evolutionary and bio-inspired computation; EuroGP, EvoApplications, EvoCOP and EvoMUSART, plus the new EvoLearn in 2027
- Each conference has its own Springer LNCS volume; late-breaking abstracts go to arXiv
- "CORE ranks per conference (ICORE2026): EuroGP B, EvoApplications B, EvoCOP B; EvoStar itself has no single rank"
- Double-blind review with at least three PC members per paper; one common submission deadline around 1 November
- Held in Europe every spring (Madrid 2022, Brno 2023, Aberystwyth 2024, Trieste 2025, Toulouse 2026, Mainz 2027), hybrid mode
