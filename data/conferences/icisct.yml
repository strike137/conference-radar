id: icisct
name: ICISCT
full_name: International Conference on Information Science and Communications Technologies
type: conference
tier: minor
areas: [communications, networking, ai, security]
region: asia-pacific
language: english
frequency: irregular
organizer: Tashkent University of Information Technologies named after Muhammad al-Khwarizmi (TUIT), with IEEE Kazakhstan Section oversight
organizer_country: [other]
proceedings: IEEE Xplore
archival: true
fee: 200 USD foreign participants, 160 USD IEEE members (2026 November edition, VAT included)
typical:
  deadline_months: [6, 8]
  conference_months: [2, 11]
links:
  website: https://icisct2026.tuit.uz/
notes:
- Run by TUIT and held in Tashkent, Uzbekistan, in hybrid format
- Accepted and presented papers are submitted to IEEE Xplore; no-show papers are excluded
- Irregular schedule; two editions both named ICISCT 2026 (February 2026 and November 2026), then ICISCT 2027 in April 2027
- "ICISCT 2027: IEEE technical co-sponsorship with the IEEE Kazakhstan Section is still pending"
- Broad tracks in AI, communications, photonics, IoT, cybersecurity and signal processing
- Review model varies by edition (double-blind stated for February 2026, single-blind with at least two reviewers for November 2026)
- IEEE members get 20% off registration
- Not listed in ICORE2026 or the CCF 2026 list; a regional venue
