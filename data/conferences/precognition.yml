notes:
- Workshop on vision-based forecasting (activity and trajectory prediction, autonomous driving, medical imaging, early event prediction); held with CVPR every year since 2019
- 2026 was the 8th edition (CVPR 2026, Denver)
- Up to 2025 accepted full papers were published in the CVPR workshop proceedings (CVF Open Access); the 2026 call says accepted papers will not be in the proceedings, and 2026 papers are only linked from the workshop website
- Full papers up to 8 pages in CVPR style, double-blind; 4-page extended abstracts, single-blind, never in the proceedings
- Not listed in ICORE2026 and not on the CCF list
