notes:
- One-day regional AI and ML symposium in Montreal with keynotes, contributed talks, posters and a panel
- Held 2017 to 2022 (2021 hybrid at Mila, 2022 at Mila) and in 2024 at Centre Mont-Royal; no 2023 edition and no
  later edition announced on the site
- Two-page abstracts via CMT, double-blind review by at least two reviewers; previously published work and preprints
  are accepted
- At least one author must be affiliated with a Quebec-based institution
- Non-archival; only titles of accepted work listed (83 accepted in 2024, 12 talks and 71 posters)
- Free registration, funded by sponsors
- Not listed in CORE ICORE2026
