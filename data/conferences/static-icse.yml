organizer: STATIC organizing committee (University of Luxembourg, Paderborn University, NJIT), co-located with ICSE
organizer_country: [international]
proceedings: IEEE Xplore / ACM DL (ICSE workshop proceedings)
archival: true
typical:
  deadline_months: [10, 11]
  conference_months: [4]
links:
  website: https://conf.researchr.org/series/static
notes:
- One-day ICSE workshop on static analysis for bug and vulnerability detection, its practical limits, and its combination with AI and LLMs
- Held with ICSE since 2025; Ottawa 2025 (1st edition), Rio de Janeiro 2026 (2nd edition)
- Not related to SAS (International Static Analysis Symposium)
- Research papers up to 8 pages, short papers (new ideas, visions, tool demos) up to 4 pages, extended abstracts up to 5 pages, all including references
- Double-blind review; best paper and best presentation awards
- 2025 proceedings in IEEE Xplore; 2026 papers in the ICSE workshop proceedings under ACM Open policies
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
