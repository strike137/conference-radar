notes:
- Workshop on cyber threat intelligence, threat hunting, AI-enabled SOCs and agentic cyber defence; 2026 is the 9th
  edition
- Co-located with the IEEE International Conference on Big Data (IEEE BigData), so it follows BigData around the
  world (Macau 2025, Phoenix 2026)
- Accepted and presented papers appear in the IEEE BigData proceedings (IEEE Computer Society Press, IEEE Xplore)
- Up to 10 pages including references, IEEE two-column format, double-blind review
- Hybrid event; at least one author must register for IEEE BigData and present
- Late deadline (October or November), useful for a quick end-of-year submission
- Not ranked by CORE (not in ICORE2026) or CCF
