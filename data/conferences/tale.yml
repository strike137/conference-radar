notes:
- Flagship Asia-Pacific conference of the IEEE Education Society, held every December in IEEE Region 10 since 2012
- Sister conference of FIE (North America) and EDUCON (Europe, Middle East and Africa)
- Covers engineering, technology, computing and STEM education plus technology-enhanced learning; AI in education was the 2026 spotlight
- Accepted and presented papers go to IEEE Xplore; double-anonymous review via EDAS
- Full papers up to 6 pages and short papers up to 4 pages (2026); at least one author must hold a full (non-student) registration
- Rotates around Asia and Oceania (Auckland 2023, Bengaluru 2024, Macao 2025, Pattaya 2026)
- Not listed in ICORE2026 or the CCF 2026 list
