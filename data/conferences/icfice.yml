id: icfice
name: ICFICE
full_name: International Conference on Future Information & Communication Engineering
type: conference
tier: minor
areas: [communications, networking, ai, security, general]
region: asia-pacific
language: english
frequency: annual
organizer: KIICE (Korea Institute of Information and Communication Engineering)
organizer_country: [korea]
proceedings: ICFICE e-proceedings (KIICE, ISSN 2765-3811); best and outstanding papers extended in Scopus-indexed
  journals such as JICCE
archival: true
rank:
  core: Unranked
fee: USD 500 early, USD 600 regular (2025 and 2026); waived if the first author is affiliated with a non-Korean
  institution
typical:
  deadline_months: [4, 5, 6]
  conference_months: [7]
links:
  website: https://kiice.org/conference/icfice2026
notes:
- International conference of KIICE (Korea Institute of Information and Communication Engineering); 17th edition
  2025 in Guam, 18th edition 2026 in Sapporo, both in early July
- Abstract first, with acceptance notified about a week later; full paper (up to 4 pages) follows; at least one
  author must register and present
- Registration fee is waived when the first author is affiliated with a foreign (non-Korean) institution (2025 and
  2026 policy)
- Best and outstanding papers can be extended for Scopus-indexed journals such as JICCE
- Committees are almost entirely from Korean universities
