notes:
- Flagship conference of the Arab Computer Society, co-sponsored by the IEEE Computer Society; running since 2001
- Broad scope with tracks on distributed computing and IoT, security, data science, AI, NLP and vision
- Proceedings in IEEE Xplore; best papers invited to journal special issues (2025)
- Held in the Arab world, rotating between the Gulf and North Africa (Tangier 2021, Abu Dhabi 2022, Egypt 2023,
  Sousse 2024, Doha 2025, Sharjah 2026); hybrid with online presentation allowed
- CORE C (ICORE2026); regarded as a regional venue
