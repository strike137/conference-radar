notes:
- Flagship practitioner conference of AI Engineer, a company that also runs AI Engineer Summit/Code, Europe and NYC
  events; held in San Francisco every June since 2024
- Talks chosen through an open call for speakers on Sessionize; product pitches are desk-rejected
- Formats are workshops (1-2 hours), stage talks of 15-20 minutes (18 minutes in 2025), lightning talks and online talks
- 2025 at the Marriott Marquis (about 3,000 attendees); 2026 moved to Moscone West with about 7,500 attendees, 400+
  sessions and a large sponsor expo
- No papers or proceedings; talks are published on the AI Engineer YouTube channel
- Not listed in CORE ICORE2026
