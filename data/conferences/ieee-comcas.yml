notes:
- Israeli conference on microwaves, RF, antennas, communications and electronic systems, run by the IEEE Israel
  Section with IEEE ComSoc involvement; grew out of the IEEE Israel AP/MTT chapter symposia
- Always held in Tel Aviv, mostly at the David Intercontinental Hotel
- Held every two years in October or November from 2009 to 2021; the next edition took place in July 2024
- Full papers of 2 to 6 pages go to IEEE Xplore; summary-only submissions appear only in proceedings handed to
  attendees
- Includes an industry exhibition, special sessions and the WirelessApps track
- Not listed in the CORE ICORE2026 portal
