id: cascade
name: CASCADE
full_name: Constructive Approaches for Security Analysis and Design of Embedded Systems
type: conference
tier: minor
areas: [security, crypto, systems]
region: europe
language: english
frequency: annual
organizer: CASCADE steering committee (European academia and industry); hosted by a different university each year
organizer_country: [europe]
proceedings: Springer LNCS
fee: 270 EUR early bird, 135 EUR student early bird; 330 EUR and 190 EUR after 28 Feb (2026)
typical:
  deadline_months: [7, 12]
  conference_months: [3, 4]
links:
  website: https://cascade-conference.org/
notes:
- New conference formed by merging COSADE (Constructive Side-Channel Analysis and Secure Design) and CARDIS (Smart Card
  Research and Advanced Applications); first edition in 2025
- Scope is cryptographic implementations and embedded security (side channels, fault attacks, PUFs, PQC implementations,
  hardware security)
- Two submission rounds (summer and winter) feed one conference held in late March or early April
- Proceedings in Springer LNCS; blind review, at most 20 pages in LNCS format; survey, SoK and data papers also invited
- Constructive review process with rebuttal; explicitly aimed at European PhD students
- Held in Europe (2025 Saint-Etienne, 2026 Regensburg, 2027 Heilbronn); COSADE editions were also European
- Low registration fee (270 EUR early bird, 135 EUR student in 2026)
- Not yet listed in ICORE2026 under this name; predecessor CARDIS is CORE C, COSADE is not listed
