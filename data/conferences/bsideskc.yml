notes:
- Community-driven Security BSides conference in Kansas City, USA, run by a non-profit educational organization; revived as a one-day event in 2017
- Main conference on a Saturday in late April with talks, villages (lockpick, OSINT, RF, hardware hacking) and CTFs; low-cost workshops have been held the day before
- Over 700 attendees across two days in 2018
- Call for papers on pretalx in three review rounds from January to late March, with acceptances announced after each round
- Lightning talks (15 minutes or less), 20 and 50 minute talks, and panels
- No proceedings
