id: iccsnt
name: ICCSNT
full_name: IEEE International Conference on Computer Science and Network Technology
type: conference
tier: minor
areas: [general, networking]
region: china
language: english
frequency: annual
organizer: ICCSNT organizing committee, sponsored by IEEE Harbin Section (2026); committee chairs from Anhui University, Dalian Jiaotong University and Heilongjiang University
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI]
fee: 3600 CNY or 500 USD per paper (2026, regular); 3300 CNY or 450 USD student; 50 USD per page beyond 6 pages
typical:
  deadline_months: [9]
  conference_months: [10, 12]
links:
  website: http://www.iccsnt.org/
notes:
- Held since 2011 with a few gaps (no 2014 or 2018 edition); 2026 is the 14th edition, in Harbin, China
- Broad scope covering computer applications, software engineering, data mining, intelligent systems, hardware and networking
- Site states that all papers from past editions are in IEEE Xplore and indexed by EI Compendex; papers must be presented to be considered for IEEE Xplore
- Regular papers up to 5 pages in two-column IEEE format; submission by online system or e-mail
- Small Chinese conference; the site contains leftover template text from other events
- Not listed in CORE ICORE2026 or the CCF list
