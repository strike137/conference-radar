notes:
- Non-profit Italian camp on hacking, free software and DIY, held every year since 2005
- Held at the Parco della Scultura in Architettura, San Dona di Piave (Venice), with camping on site
- Programme of talks (22 minutes plus questions), hands-on labs and projects, proposed through a Call for Content on pretalx
- Official site and Call for Content are in Italian; content must be non-commercial and released under CC BY-SA or BY-NC-SA
- No proceedings; talks are streamed on Twitch and published on YouTube
- Supported by Italian communities such as the Italian Linux Society, OWASP and local hackerspaces
