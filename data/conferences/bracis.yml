links:
  website: https://bracis.sbc.org.br/
notes:
- Promoted by the Brazilian Computer Society (SBC) and organized by a local university (UFMT in 2026); 36th
  edition in 2026
- Papers in English, up to 15 pages including references and appendices; double-anonymous review by at least three
  experts; deadlines 23:59 AoE
- Proceedings in Springer Lecture Notes in Artificial Intelligence (LNAI), also indexed in SBC OpenLib (SOL)
- Held in a different Brazilian city each year (Fortaleza 2025, Cuiabá 2026)
- Co-located with ENIAC, STIL, KDMiLe, WESAAC and the CTDIAC thesis contest
- Not ranked in CORE ICORE2026
