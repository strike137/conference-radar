notes:
- Annual international conference on optoelectronics and optical communications held in the Asia-Pacific region;
  the 2026 edition in Busan was the 31st
- 2026 edition organized by the Optical Society of Korea (OSK) and technically co-sponsored by IEEE Photonics Society,
  Optica, KICS and IEICE (CS and ES)
- Two-page papers with a 35-word abstract; accepted and presented papers go to IEEE Xplore (no-show papers are
  dropped)
- Six topic areas covering optical active and passive devices, optical fibres, access/data center/core networks,
  transmission systems, and quantum photonics, optical sensing and imaging
- Separate post-deadline paper track (oral only) with a June deadline
- Not listed in the ICORE2026 portal or the CCF 2026 list
