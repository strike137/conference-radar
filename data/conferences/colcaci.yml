notes:
- Run by the IEEE CIS Colombian Chapter and IEEE Colombia Section; regional computational intelligence conference for Colombia and Latin America
- Papers in Spanish, Portuguese or English, up to 6 pages in IEEE double-column format, submitted via EasyChair
- Accepted papers must be presented orally to be submitted to IEEE Xplore
- Best papers are invited to extend their work for the Springer book series Applications of Computational Intelligence
- 2026 was the ninth edition, co-located with STSIVA and COLCOM at Universidad Industrial de Santander, Bucaramanga
- Submission deadline extended by about two weeks in 2026
- Not listed in CORE ICORE2026 or the CCF list
