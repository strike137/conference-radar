notes:
- Annual since 2023; 2026 is the 4th edition
- Held virtually in 2023, in Hong Kong in 2024, in Macau in 2025 and in Niigata, Japan in 2026
- Proceedings in IEEE Xplore, stated as indexed in EI Compendex and Scopus; the 2025 proceedings also appear in the IET Digital Library
- Run by a commercial conference secretariat (126.com contact address, Chinese phone number); full paper or abstract submission
- Selected papers can be extended for the journal Engineering Reports
- Short review cycle (2026 notification ten days after the submission deadline)
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
