notes:
- Workshop on reconfigurable intelligent surfaces (RIS) and reconfigurable holographic surfaces (RHS) for 6G
- Runs at IEEE ComSoc flagships; WCNC 2024 (Dubai), WCNC 2025 (Milan), 9th edition at WCNC 2026 (Kuala Lumpur),
  GLOBECOM 2026 (Macau) and 11th edition at WCNC 2027 (Panama City)
- Since GLOBECOM 2026 titled "Reconfigurable Multi-Functional Intelligent and Holographic Surfaces for 6G"
- Steering committee Marco Di Renzo and Zhu Han; program co-chairs include Shuhao Zeng, Aryan Kaushik, Doohwan Lee
  (NTT) and Haobo Zhang
- Accepted and presented papers go into the host conference workshop proceedings and IEEE Xplore; no-show papers
  can be excluded
- Half-day workshop with about 7 papers at WCNC 2026
- Not listed in ICORE2026
