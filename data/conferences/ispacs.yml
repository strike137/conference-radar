notes:
- Held since 1992, rotating within Asia-Pacific (Kaohsiung 2024, Bandung 2025, Busan 2026)
- Covers signal processing and communication systems plus circuits and systems, VLSI and HCI
- 2026 edition organized by the KICS Busan-Ulsan-Gyeongnam Chapter; regular papers up to 4 pages via EDAS; 1 to
  2 page work-in-progress papers are not in the proceedings
- Regular papers submitted to IEEE Xplore and Scopus; selected papers invited to ICT Express and JCN (2026)
