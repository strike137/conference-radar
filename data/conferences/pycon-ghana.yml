links:
  website: https://gh.pycon.org/
notes:
- Annual conference of the Python community in Ghana, hosted by the non-profit Python Software Community in Ghana
- Three days with a workshop day followed by two main conference days of talks; sprints in some years
- Talks, workshops and tutorials chosen from an open call for proposals; from 2026 a short preview video is asked for
  with each proposal
- Held in Accra; past editions 2018, 2022, 2025 and 2026, with Python Ghana hosting PyCon Africa in 2019, 2020 (online)
  and 2024 instead
- About 200 attendees (2025)
- Talks only, no papers or proceedings
