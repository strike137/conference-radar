notes:
- Largest domestic computer vision symposium in Japan, organized by IEICE PRMU with IPSJ CVIM; held in late July
  or early August
- Oral candidate papers (4 pages, single-blind review) are due in March; poster and demo papers are accepted until
  June without selection
- 'Non-archival: the Extended Abstract collection is shared only with participants, so the work can still go to
  CVPR and similar venues'
- Papers may be in Japanese or English; oral candidates can opt into concurrent review for an IEICE Transactions
  letter
- 30th MIRU (2027) will be held in Takamatsu, July 26 to 29
