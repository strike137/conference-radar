notes:
- IEEE IMS symposium on biomedical measurement, sensors and instrumentation; 21st edition in 2026
- Recent hosts 2021 Neuchatel, 2022 Messina, 2023 Jeju, 2025 Chania, 2026 Montevideo, 2027 Rome; mostly Europe
- Full papers of 5 to 6 pages; accepted papers are submitted to IEEE Xplore
- Authors can also submit to a TIM / OJIM journal special section linked to the symposium
- Not listed in ICORE2026 or the CCF 2026 list
