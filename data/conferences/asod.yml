notes:
- Workshop of ARES (International Conference on Availability, Reliability and Security), held in Europe every summer;
  first edition found is the one at ARES 2026 (Linköping)
- Submission guidelines are the same as for the ARES conference; ARES 2026 and its workshop papers are published in
  Springer LNCS, workshop papers up to 18 pages including references
- Focus on secure deployment of software to production such as secure CI/CD, DevSecOps, containers, patching and
  air-gapped environments
- Chairs from Carnegie Mellon University (USA); academia and industry submissions welcome
- Not listed in CORE ICORE2026
