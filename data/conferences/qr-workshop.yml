notes:
- Long-running workshop of the qualitative reasoning community; the 2026 edition was the 39th
- Co-located with IJCAI in recent years (Montreal 2025, Bremen 2026)
- Accepted papers are published as a collection of working papers archived on the workshop website, so the same work may also go to a conference or journal
- Full papers up to 8 pages plus references (7 in 2025), short papers up to 3 pages plus references, IJCAI format, not anonymized
- At least two reviewers per paper; separate late-breaking deadline for short papers and demos
- Not listed in the CORE ICORE2026 portal
