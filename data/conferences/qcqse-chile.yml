notes:
- Satellite workshop of the Jornadas Chilenas de Computación (JCC), described as one of the first initiatives of its kind in Chile
- Engineering view of quantum computing (quantum software engineering, toolchains, testing, verification, hybrid quantum-classical systems, benchmarks)
- Papers of 4 to 8 pages in IEEE-CS proceedings format, in Spanish or English, submitted via Microsoft CMT
- Papers presented at the workshop are published in the JCC proceedings in IEEE Xplore (indexed in Scopus); presentation by a registered author is required
- Not listed in CORE ICORE2026
