notes:
- Half-day workshop co-located with ACM SIGSPATIAL, first held in 2024; 3rd edition in 2026
- Topics are anomaly detection for spatial, geospatial and spatiotemporal data (trajectories, mobility, remote sensing, urban and traffic data)
- Accepted papers appear in the ACM SIGSPATIAL workshop proceedings in the ACM Digital Library
- Full papers 8-10 pages, short papers 4 pages; single-blind review, submission via EasyChair
- At least one author must register for the workshop and ACM SIGSPATIAL and present in person
- Follows SIGSPATIAL (Atlanta 2024, Minneapolis 2025, Riverside 2026)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
