notes:
- Annual conference of the Italian Chapter of EATCS, open to researchers of all nationalities; papers and talks in English
- Covers all areas of theoretical computer science, from algorithms and complexity to logic, semantics and verification
- Regular papers up to 12 pages and communications up to 5 pages, CEUR-WS one-column style
- Proceedings in open-access CEUR-WS (2025 -> Vol-4039, 2026 -> Vol-4269); best papers invited to a journal special issue
- Held at a different Italian university each year (Palermo 2023, Turin 2024, Pescara 2025, Udine 2026)
- Registration includes one-year EATCS and Italian Chapter membership
- Not listed in the CORE portal (ICORE2026) or the CCF list
