id: isami
name: ISAmI
full_name: International Symposium on Ambient Intelligence
type: conference
tier: minor
areas: [ai, systems]
region: europe
language: english
frequency: annual
organizer: ISAmI advisory board (University of Minho, University of Salamanca, AIR Institute, NII, University of Granada) with a local host each year
organizer_country: [europe]
proceedings: Springer LNNS
archival: true
indexing: [Scopus, DBLP]
typical:
  deadline_months: [4, 5]
  conference_months: [6, 7, 10]
links:
  website: https://www.isami-conference.net/
notes:
- Symposium on ambient intelligence, ambient assisted living, pervasive and context-aware computing; 2026 is the 17th edition
- Co-located every year with DCAI, PAAMS and other events of the Salamanca BISITE/AIR Institute family
- Main track and workshop papers published in Springer Lecture Notes in Networks and Systems (LNNS)
- Papers up to 10 pages (6 for doctoral consortium), each reviewed by at least three experts; one author must register and present
- Held in Europe (Salamanca 2024, Lille 2025, Naples 2026)
- Small venue (12 papers in the 2025 proceedings, 36 in 2024)
- Selected papers invited to journal special issues (IJIMAI, CMC and others)
- 2026 deadlines were extended twice (17 Apr -> 8 May -> final 22 May)
- Not listed in CORE ICORE2026 or in the CCF 2026 list
