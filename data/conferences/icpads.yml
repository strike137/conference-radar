notes:
- IEEE Computer Society conference; 32nd edition in 2026
- Mostly held in Asia (2023 Hainan, 2025 Hefei), but 2024 was Belgrade, Serbia; 2026 edition at Waseda University,
  Tokyo (Nov 22-26)
- CORE B, CCF C; 2026 tracks include Web3.0 Security and Privacy, Agentic Design for System and Network, AI Infrastructure
  and Edge Intelligence
- Single-blind; 8 pages IEEE CS format, submissions over 10 pages rejected without review
- 'Deadlines are routinely extended (2025: Aug 15 -> Aug 31; 2026: Jun 30 -> Aug 15)'
