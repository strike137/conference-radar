notes:
- Long-running workshop on Chinese lexical semantics, held since 2000; standalone event despite the name
- Co-founded by Chin-Chuan Cheng, Yu Shiwen and Chu-Ren Huang; topics span theoretical, applied and computational lexical semantics
- Papers in Chinese or English, 8 to 15 pages, anonymous review; one first-author paper per person
- All accepted papers go into the conference proceedings; selected papers are revised in English, reviewed again and published by Springer in the LNAI series
- Selected papers may also be recommended to journals such as IJALP and IJKLP
- Hosted by a different university each year, mostly in China (Singapore 2023, Xiamen 2024, Hohhot 2025, Yantai 2026)
- Conference websites are hosted on the COLIPS (Singapore) site
