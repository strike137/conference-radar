notes:
- Main European symposium on electromagnetic compatibility (EMI, shielding, lightning and high-power electromagnetics, measurement, computational electromagnetics, EMC in automotive, railway, aerospace and medical systems, signal and power integrity)
- Run by an International Steering Committee of European EMC researchers; held in a different European city each year (Krakow 2023, Bruges 2024, Paris 2025, Prague 2026)
- Full 4 to 6 page IEEE-format papers are peer-reviewed; final papers are submitted to IEEE Xplore
- Workshops, tutorials and an industry exhibition alongside the technical program; best symposium paper and best student paper awards
- 2027 edition is a joint symposium with the IEEE International Symposium on EMC, Signal and Power Integrity in Glasgow
- Not listed in ICORE2026 or the CCF list
