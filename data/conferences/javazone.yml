notes:
- Community-driven developer conference organized on a voluntary basis by javaBin, the Norwegian Java User Group
- Held in the Oslo area since 2001; the 2026 edition was at NOVA Spektrum, Lillestrøm
- Two conference days in early September plus a workshop day before
- Program chosen from a call for speakers by an independent program committee; 45 or 60 minute talks, lightning talks and workshops
- International and Norwegian speakers; speakers can apply for travel and accommodation reimbursement
- No papers or proceedings; practitioner talks only
