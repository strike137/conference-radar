notes:
- Workshop on foundation models for scientific problems (PDEs, materials, biomedicine, Earth and space science)
- 1st edition at NeurIPS 2024 (Vancouver), 2nd at ICLR 2026 (Rio de Janeiro)
- A 3rd edition on scientific agents is proposed for ICLR 2027 (San Francisco); not yet accepted by ICLR as of 2026-11-07
- Non-archival with no formal proceedings; accepted papers are public on OpenReview
- Papers of 4 to 9 pages in the host conference template plus a short paper track; reviewed on OpenReview
- Each of the first two editions received about 100 submissions
- Not listed in ICORE2026 or the CCF list
