notes:
- Workshop on combining generative AI, LLMs and agents with knowledge graphs (KG construction, GraphRAG, neuro-symbolic reasoning, agent memory)
- Held with COLING 2025 (Abu Dhabi) and IJCAI-ECAI 2026 (Bremen); host conference changes each year
- 2026 edition was a joint workshop with NORA (Knowledge Graphs and Agentic Systems Interplay), which has its own entry
- "Proceedings vary by host: ACL Anthology for 2025 (16 papers), CEUR-WS for 2026"
- 2026 tracks were research (full 8 to 10 pages, short up to 6), industry (up to 6) and position and demo (up to 4) papers; single-anonymous review on OpenReview, CEUR-ART format
- In person only; best paper and best student paper awards
- Not listed in ICORE2026 and not on the CCF list
