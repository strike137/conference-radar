notes:
- EAI conference on trustworthy, explainable and responsible AI and data science in the context of Industry 5.0
- Organized with the University of Lille (ENSAIT, GEMTEX) and Dong A University; held at Dong A University in Danang, Vietnam
- Editions so far are 2024 (October, Danang), 2026 (March, Danang, hybrid) and 2027 (March, Danang, hybrid)
- Proceedings in Springer LNICST; the 2024 volume has 16 papers
- Accepted authors may submit extended versions to EAI Endorsed Transactions journals at a discounted fee
- Several submission rounds per edition
- Not listed in ICORE2026
