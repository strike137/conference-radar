links:
  website: https://paine-conference.org/
notes:
- Hardware security venue focused on physical inspection and assurance of electronics (side channels, fault injection, counterfeit detection, reverse engineering, advanced packaging)
- Strong government and industry participation (NIST, Sandia, Battelle, DARPA, chipmakers) alongside academia; includes invited talks, panels, posters and a competition
- Full papers of 4 to 7 pages in IEEE 2-column format, single-blind review via EasyChair
- Accepted papers go to IEEE Xplore and must be presented at the conference
- Held annually in the US since 2018 (Phoenix 2026)
