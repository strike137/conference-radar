notes:
- Main regional software engineering conference in the Asia-Pacific; held every December
- 'Recent hosts: Seoul (2023), Chongqing (2024), Macao (2025), Bali (2026)'
- Proceedings in IEEE Xplore; double-blind review in the technical track; 10 pages including references
- 'Besides the technical track: ERA, SEIP, tool demo, posters, doctoral symposium and a local student forum'
- CORE C, CCF C
