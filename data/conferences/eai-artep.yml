notes:
- EAI conference on control, industrial automation and ICT in industry, including AI in automation, Industry 4.0/5.0 and UAVs
- Proceedings in the Springer EAI/Springer Innovations in Communication and Computing book series; extended papers can go to EAI Endorsed Transactions journals for an extra fee
- Several submission tracks (main, late, poster) with separate deadlines
- Held in Slovakia 2023 to 2025 (Stara Lesna, Orechova Poton) and in Sromowce Nizne, Poland in 2026
- Not listed in ICORE2026
