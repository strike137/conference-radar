notes:
- Multidisciplinary workshop of academic and industrial researchers applying theory (information theory, ML,
  optimization, game theory, communications) to science and engineering, run at UC San Diego
- Presentations are by invitation only; speakers present their best work of the year, even if it appeared
  elsewhere, so there is no paper call and no proceedings
- Students present at poster sessions; graduating students and postdocs nominated by their institutions speak
  at Graduation Day, with jury-awarded prizes
- Held every February in San Diego (Catamaran Resort in 2019 and 2020, Wyndham Bayside in 2023, Bahia Resort
  since 2024); the 2022 edition moved to May
- Award sessions feature best papers from the IT, communications and signal processing societies and from ICML,
  ICLR, NeurIPS and ACL
