notes:
- Run by the Association for Health Learning and Inference (AHLI); machine learning for health
- Proceedings in PMLR (2026 -> vol. 333, 2025 -> vol. 287)
- Held in the USA (Cambridge MA 2023, New York 2024, Berkeley 2025, Seattle 2026); the 2020 to 2022 editions were virtual
- Three tracks (models and methods, applications and practice, impact and society); double-blind review with rebuttal
- Reciprocal reviewing; one author per submission must review at least three papers
- Not ranked in CORE ICORE2026
