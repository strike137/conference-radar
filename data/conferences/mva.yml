notes:
- Held in Japan every two years since 1988 (even years until 2002, odd years since 2005); 2023 Hamamatsu, 2025 Kyoto,
  2027 Fukuoka
- Often co-located with MIRU (2023 and 2025) and features IAPR invited talks
- 4-page papers with double-blind review; acceptance around 55% (70/126 in 2023, 64/119 in 2025)
- Proceedings in IEEE Xplore; for 2027 they go to the IEICE Proceeding Series and are submitted to IEEE Xplore
- ICORE2026 lists it as National (Japan); 2027 moves to May, so the deadline moves up to January 14, 2027
