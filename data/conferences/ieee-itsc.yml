notes:
- Flagship conference of the IEEE Intelligent Transportation Systems Society; first held in Boston in 1997
- Covers intelligent transportation, connected and automated vehicles, V2X and AI for mobility
- Papers up to 6 pages plus up to 2 extra pages (with extra page charge); proceedings in IEEE Xplore
- Regular and invited session papers due around 1 March; workshops and tutorials the day before the main conference
- Rotates worldwide (Gold Coast 2025, Naples 2026, Boston 2027, Tokyo 2028)
- Not listed in the CORE ICORE2026 portal
