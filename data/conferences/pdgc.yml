id: pdgc
name: PDGC
full_name: International Conference on Parallel, Distributed and Grid Computing
type: conference
tier: minor
areas: [systems, networking]
region: south-asia
language: english
frequency: biennial
organizer: Department of CSE and IT, Jaypee University of Information Technology (JUIT), technically sponsored by IEEE Delhi Section
organizer_country: [india]
proceedings: IEEE Xplore
archival: true
fee: 'INR 7,500 to 12,000 for Indian authors, 200 to 480 USD for international authors depending on category and IEEE membership (2026)'
acceptance_rate: 19.35% (2024, 143/739)
typical:
  deadline_months: [7, 9]
  conference_months: [11, 12]
links:
  website: https://www.juit.ac.in/pdgc-2026/index1.php
notes:
- Biennial conference held every even year since 2010 at JUIT, Waknaghat near Shimla, Himachal Pradesh, India
- All editions published in IEEE Xplore; technical sponsor is the IEEE Delhi Section
- Ninth edition in 2026, hybrid mode
- Papers up to 6 pages (full) or 4 pages (short or poster) in IEEE format, at least three reviewers per paper, submitted via Microsoft CMT
- Authors may submit at most 2 papers
- "Acceptance rates reported by the organizers: 17.3% (2010) to 28.8% (2018), 19.35% (2024)"
- Not listed in ICORE2026 or the CCF 2026 list
