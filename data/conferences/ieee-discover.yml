notes:
- Run by the IEEE Mangalore Subsection and hosted by a different engineering college in coastal Karnataka each year
- Recent hosts were Sahyadri College (Mangaluru, 2023), St. Joseph Engineering College (Mangaluru, 2024), P. A. College of Engineering (Mangaluru, 2025) and Vivekananda College of Engineering and Technology (Puttur, 2026)
- Six tracks on distributed computing, communications, VLSI, electrical and electronic circuits, robotics and healthcare
- Double-blind review; 6 pages max in IEEE format; submission via Microsoft CMT
- Proceedings of every edition since 2016 are in IEEE Xplore
- At least one author must present in person
- Not listed in ICORE2026 or the CCF 2026 list; a small regional venue
