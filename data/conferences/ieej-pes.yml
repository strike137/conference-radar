notes:
- Annual national conference of the IEEJ Power and Energy Society (B部門), held at a Japanese university each mid September
- Topics include power system planning and control, electricity markets, distributed generation and smart grids, power equipment, high voltage and insulation, energy conversion
- "Three paper types: Paper I (4 to 14 pages, oral), Paper II (2 pages, oral or poster) and EPSS (2-page English papers for students)"
- Papers in Japanese or English; all submitted papers can be presented (no selection)
- Paper I authors may separately submit to the peer-reviewed B部門大会 special issue of IEEJ Transactions on Power and Energy
- Non-members welcome to present; over 1000 registrants in 2026
- About 18,000 JPY for members and 40,000 JPY for non-members (2026, early registration, includes proceedings download)
- Not listed in CORE ICORE2026 or the CCF 2026 list
