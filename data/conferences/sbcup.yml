notes:
- Brazilian symposium on ubiquitous and pervasive computing held as a satellite event of CSBC, the annual
  congress of the Brazilian Computer Society (SBC); held since 2009 (18th edition in 2026)
- Topics include IoT, mobile, urban and context-aware computing, edge and cloud, sensor and vehicular networks,
  cyber-physical systems, security and privacy
- Full papers in Portuguese or English, up to 10 pages plus references in the SBC template, submitted via JEMS
- Proceedings (Anais do SBCUP, ISSN 2595-6183) published open access in SBC OpenLib (SOL) with a DOI per paper
- Selected authors invited to submit extended versions to a journal special call
- Held with CSBC in a different Brazilian city each year (Gramado 2026)
- Not ranked in CORE ICORE2026
