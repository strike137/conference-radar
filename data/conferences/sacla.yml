notes:
- Annual conference of SACLA, the association of Computer Science, Information Systems and IT lecturers at
  universities across Southern Africa, held since 1971
- Focus is computing education (teaching and learning of CS, IS and IT), not core CS research
- Full papers get double-blind review and must use the Springer LNCS template
- Best full papers go to a Springer CCIS volume (Scopus-indexed); other accepted full papers appear in local
  proceedings that are DHET subsidy-bearing in South Africa
- Hosted by a different South African university each year (NWU 2023, NMU 2024, UFS 2025, UCT 2026, Wits 2027,
  UKZN 2028)
- In-person only; also hosts a Heads of Department colloquium
- Not listed in the CORE ICORE2026 portal
