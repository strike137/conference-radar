notes:
- IFIP TC12 (Artificial Intelligence) conference, sponsored by an IFIP TC12 working group and CAAI; the series website
  is hosted by the Key Laboratory of Intelligent Information Processing at ICT, Chinese Academy of Sciences
- IIP 2024 local organizers were SUSTech, HIT Shenzhen and the CAAI Mind Computation Technical Committee
- Held every two years since 2000 (IIP 2000 to IIP 2024); mostly in China since 2012 (IIP 2016 in Melbourne), earlier
  editions also in Canada, Australia and the UK
- Proceedings in Springer IFIP AICT as "Intelligent Information Processing" volumes (IIP 2024 -> Intelligent
  Information Processing XII, two parts)
- Papers up to 15 pages; broad AI and intelligent information processing scope
- Small venue; not listed in the ICORE2026 portal
- IIP 2024 submission deadline was extended by two weeks (2023-12-04 -> 2023-12-18)
- Selected IIP 2024 papers were recommended to journal special issues (IEEE TEVC, JISA)
