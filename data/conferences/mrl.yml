notes:
- Workshop on multilingual pretraining, cross-lingual transfer and NLP for low-resource and underrepresented languages
- Held every year with EMNLP since 2021 (Punta Cana, Abu Dhabi, Singapore, Miami, Suzhou, Budapest)
- Long (8 pages) and short (4 pages) research papers go into the workshop proceedings in the ACL Anthology; 2-page extended abstracts are non-archival
- Direct submissions through OpenReview plus a later deadline for papers with ARR reviews
- Runs a collaborative shared task each year (multilingual physical reasoning datasets in 2025, a multimodal and multilingual benchmark in 2026)
- 41 papers in the 2025 proceedings
- Not ranked in ICORE2026 and not on the CCF list
