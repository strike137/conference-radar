id: semeval
name: SemEval
full_name: International Workshop on Semantic Evaluation
type: workshop
tier: minor
areas: [nlp]
region: worldwide
language: english
frequency: annual
organizer: ACL SIGLEX (Special Interest Group on the Lexicon)
organizer_country: [international]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [2, 3]
  conference_months: [7, 8]
links:
  website: https://semeval.github.io/
notes:
- Annual shared task evaluation workshop sponsored by ACL SIGLEX; SemEval-2026 was the 20th edition
- Co-located with a major *ACL conference (ACL 2025 in Vienna, ACL 2026 in San Diego)
- Runs on a long cycle; task proposals are due about 15 months before the workshop, evaluation runs in January
- Papers are system description papers from task participants and task description papers from organizers
- Large proceedings in the ACL Anthology (455 papers in 2026, 330 in 2025)
- Not listed in ICORE2026
