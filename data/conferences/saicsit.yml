notes:
- Main national computer science and information systems conference of South Africa, held since 1981 (before
  SAICSIT was founded in 1982) and now run by SAICSIT
- Two tracks, Computer Science and Information Systems, plus a postgraduate symposium for short work-in-progress papers
- "Full papers 12 to 16 pages in the Springer CCIS template; double-blind review; an abstract (intent to submit) is due a week before the paper"
- 2026 accepted full papers go to Springer CCIS; strong papers not accepted there go into the SAICSIT online
  proceedings; earlier proceedings are indexed in the ACM Digital Library
- Each accepted full paper needs at least one registered author presenting in person
- Hosted by a different South African university each year (UKZN 2025, UCT Cape Town 2026)
- Not listed in the CORE portal (ICORE2026)
