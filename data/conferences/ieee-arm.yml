notes:
- Flagship conference of the IEEE SMC TC on Bio-mechatronics and Bio-robotics Systems and the IEEE RAS TC on Neuro-Robotics Systems
- Covers mechatronics, bionic and neuro robotics, control, automation, rehabilitation and wearable robots
- Accepted and presented papers go to IEEE Xplore; six page papers, up to eight with a 100 EUR surcharge per extra page
- Peer review by at least two reviewers via PaperPlaza; optional video attachment
- Rated an A class conference by the Chinese Association of Automation; selected papers invited to journal special issues such as IEEE TASE
- Mostly held in China until 2023 (Chongqing 2021, Guilin 2022, Sanya 2023), then Tokyo 2024, Portsmouth 2025 and Paris 2026
- Not listed in the CORE ICORE2026 portal
