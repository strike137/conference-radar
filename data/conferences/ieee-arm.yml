notes:
- Flagship conference of the IEEE SMC TC on Bio-mechatronics and Bio-robotics Systems and the IEEE RAS TC on Neuro-Robotics Systems
- Covers mechatronics, robotics, automation and sensors, including bionic, rehabilitation and wearable robots
- Accepted and presented papers go into the conference proceedings and are submitted to IEEE Xplore
- Peer review by at least two reviewers via PaperPlaza; 6 pages, up to 8 with a 100 EUR surcharge per extra page
- Steering committee and many chairs from Chinese institutions (Tongji, HUST, CAS); site says it is rated A-Class by the Chinese Association of Automation
- Selected papers invited to journal special issues (for example IEEE TASE in 2026)
- 2026 edition held at the University of Evry Paris-Saclay, France
- Not listed in the CORE ICORE2026 portal
