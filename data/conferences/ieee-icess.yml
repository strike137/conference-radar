notes:
- Embedded software and systems conference with a focus on edge intelligence; 21st edition in 2025 (Exeter)
- Co-located with IEEE HPCC, DSS, SmartCity and DependSys since 2024 (Wuhan 2024, Exeter 2025, Luoyang 2026);
  earlier editions in Las Vegas (2019) and Shanghai (2020)
- Single-blind review via EDAS; 8 pages IEEE CS format (10 with over-length charge)
- Selected papers invited to journal special issues (IEEE TCE, IEEE IoT Journal, Journal of Systems Architecture,
  ...)
- Not ranked by CORE (ICORE2026) or CCF; deadlines are usually extended by about three weeks
