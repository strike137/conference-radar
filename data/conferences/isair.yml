notes:
- Society secretariat and payment account are in Kitakyushu, Japan; editions are mostly held in China
- "Past hosts: Wuhan (2016), Kitakyushu (2017), Nanjing (2018), Daegu (2019), virtual (2020), Fukuoka (2021), Shanghai (2022), Beijing (2023), Guilin (2024), Nantong (2025), Nanjing (2026)"
- Proceedings in Springer CCIS as revised selected papers since 2023 (earlier volumes in Springer, SPIE and IEEE)
- Rolling review (first submission, first publication) with double-blind review; selected papers are recommended to journals
- Regular paper deadline falls only about three weeks before the conference
- High registration fee for a small symposium (about 1,000 USD in 2026)
- Not listed in ICORE2026 or the CCF 2026 list
