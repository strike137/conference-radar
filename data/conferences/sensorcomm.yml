notes:
- Organized by IARIA as part of the NetWare congress, co-located with SENSORDEVICES and other IARIA events (20th edition in 2026)
- Published open access in the IARIA ThinkMind library (ISSN 2308-4405); selected papers invited to IARIA journals
- Covers sensor networks, sensor devices and sensor-based applications
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Usually held in Portugal, Spain, France or Greece; onsite and online participation offered
