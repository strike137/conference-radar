organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [IEEE Xplore, EI]
typical:
  conference_months: [6, 7, 8]
links:
  website: https://rcar2026.org/
notes:
- Founded in 2015; covers robotics and real-time computing (real-time control, human-robot interaction, perception and fusion, robot intelligence)
- Accepted full papers are submitted to IEEE Xplore and indexed by EI; abstract-only papers are presented but not published
- Full papers 4 to 6 pages in IEEE two-column format, up to 2 extra pages at USD 120 each; submission via Microsoft CMT
- Often held in tourist destinations; past venues include Toyama (2025), Alesund (2024), Datong (2023), Guiyang (2022), Xining (2021), Asahikawa (2020), Maldives (2018)
- Registration USD 750 to 950 for members and non-members, USD 600 to 800 for students (2026); one full registration covers up to two papers with an extra paper charge
- Not listed in the CORE ICORE2026 portal
