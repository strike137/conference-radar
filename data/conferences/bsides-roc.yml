notes:
- Volunteer-run Security BSides hacker conference in Rochester, New York, USA, held since 2013 (no 2020 edition)
- Run by B-Sides Rochester, Inc., a 501(c)3 not-for-profit
- One-day Saturday event in March at the RIT Inn & Conference Center, Henrietta, NY
- Call For Presenters for 20 or 50 minute technical talks; talks pitching a product or service are not accepted
- Separate Call For Trainers; trainings, CTF, crypto challenge, lockpick and hardware hacking villages
- Talks recorded and posted on YouTube; no proceedings
