id: ic-dsp
name: DSP
full_name: International Conference on Digital Signal Processing
type: conference
tier: minor
areas: [communications, general]
region: worldwide
language: english
frequency: biennial
organizer: DSP conference series started at Imperial College London; local organizing committee changes by edition (University of Patras for 2025, Imperial College London for 2027)
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
fee: 845 EUR IEEE member, 915 EUR non-member, 435 to 475 EUR student (2025, advance)
typical:
  deadline_months: [1, 3]
  conference_months: [6]
links:
  website: https://www.dsp2027.com/
notes:
- Series started in London in 1967 and calls itself the longest running conference in digital signal processing; DSP 2027 marks its 60th anniversary
- Technically co-sponsored by IEEE Signal Processing Society and EURASIP (APSIPA also for 2025)
- Held in Florence, Nicosia, Limassol, Santorini, Cardiff, Corfu, Hong Kong, Singapore, Beijing, Shanghai, Rhodes (2023) and Costa Navarino (2025)
- Every two years since 2023; earlier editions were more frequent
- Built around special sessions organized by invited experts, plus regular lecture and poster sessions
- Papers up to 4 pages plus a 5th page of references; single-blind review by at least two reviewers via Microsoft CMT
- Presented papers go to IEEE Xplore; no-show papers are excluded
- 2025 edition at a luxury resort; organizers acknowledged attendee comments about cost
- Not listed in ICORE2026
