id: iscc-iot
name: ISCC-IoT
full_name: International Workshop on Integrated Sensing, Communication, and Computing in Internet of Things (IoT) Systems
type: workshop
tier: minor
areas: [networking, communications]
region: worldwide
language: english
frequency: annual
organizer: Co-located with ICCCN; workshop chairs Jian Wang (NIST) and Guobin Xu (Morgan State University)
organizer_country: [usa]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [3, 4]
  conference_months: [7, 8]
links:
  website: https://sites.google.com/view/ssc-iot2026/home
notes:
- Workshop held with ICCCN (International Conference on Computer Communications and Networks); 3rd edition in 2026
- Topics are joint design of sensing, communication and computing in IoT, wireless and RF sensing, ISAC, edge computing and IoT security
- Workshop papers are limited to 6 pages and go into the ICCCN proceedings and IEEE Xplore; papers not presented onsite are left out of IEEE Xplore
- One author must register at the full rate and present in person; one workshop registration covers up to two workshop papers
- Location follows ICCCN (Tokyo 2025, Honolulu 2026, Rome announced for 2027)
