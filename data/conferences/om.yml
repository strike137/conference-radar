links:
  website: https://om.ontologymatching.org/
notes:
- One-day workshop on ontology, instance and knowledge graph matching, co-located with ISWC every year since 2006
- Location follows ISWC (Athens 2023, Baltimore 2024, Nara 2025, Bari 2026)
- Hosts the results of the OAEI (Ontology Alignment Evaluation Initiative) evaluation campaign
- Long papers up to 12 pages, short papers up to 6 pages, posters up to 3 pages, CEURART 1-column style, single blind, via EasyChair
- Accepted papers are published as a CEUR-WS volume and indexed on DBLP (OM 2025 -> Vol-4144)
- Organizers are mainly European researchers (INRIA, Mannheim, Linkoping, City St George's London, Trentino Digitale) plus IBM Research
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
