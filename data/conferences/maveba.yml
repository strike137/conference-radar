notes:
- Workshop series on models and analysis of the human voice and its biomedical applications (bioengineering, clinical voice and speech analysis)
- Started in 1999 and held every two years; the 14th edition was in Florence, Italy in December 2025
- 4-page papers, each reviewed by two anonymous reviewers; only one paper per author
- Proceedings published by Firenze University Press with ISBN; the call says they are indexed in Scopus
- Extended papers can go to a special issue of Logopedics Phoniatrics Vocology (Taylor and Francis)
- Late deadline, about three months before the workshop
- Not listed in CORE ICORE2026 and not on the CCF list
