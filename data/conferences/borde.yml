notes:
- Workshop held with IFIP Networking on the edge-to-cloud continuum for 5G-Advanced and 6G (UAV and mobile edge, D2D, federated learning, blockchain trust at the edge)
- First edition in Lugano 2026 with IFIP Networking
- Papers up to 6 pages in IEEE double-column format, single-blind review via EDAS
- Papers appear in the IFIP Networking proceedings and are submitted to IEEE Xplore
- In-person only
- Deadlines were extended twice in 2026 (March 22 -> April 7 -> April 14)
- Not listed in the ICORE2026 portal
