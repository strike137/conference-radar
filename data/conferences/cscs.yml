notes:
- Successor of the ACM Computer Science in Cars Symposium (7 editions, 2017 to 2023, held in Germany; online in
  2020 and 2021)
- 'Moved to ACM CCS as a workshop: 1st at CCS 2024 (Salt Lake City), 2nd at CCS 2025 (Taipei)'
- Double-blind; in 2025 full papers up to 10 pages, short or WIP papers up to 6 pages (ACM sigconf)
- Chairs and many authors come from German universities and the German automotive industry
- Not in the ACM CCS 2026 workshop list; no 2026 edition announced as of Sep 2026
