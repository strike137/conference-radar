notes:
- Half-day CVPR workshop on anomaly, novelty and out-of-distribution detection in images and video; VAND 4.0 in 2026
- With CVPR every year since 2023 (VAND 1.0 at CVPR 2023)
- Full papers only (8 pages, CVPR format), double-blind review on OpenReview with no rebuttal
- Strong industry involvement (Intel, MVTec, AWS, Amazon); runs anomaly detection challenges, including a retail track on the Kaputt dataset in 2026
- 7 papers in 2026 and 15 in 2025 on CVF Open Access
- Not listed in ICORE2026 or the CCF list
