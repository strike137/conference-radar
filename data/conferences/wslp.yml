id: wslp
name: WSLP
full_name: Workshop on Sign Language Processing
type: workshop
tier: minor
areas: [nlp, vision, ai]
region: worldwide
language: english
frequency: annual
organizer: Exploration Lab, IIT Kanpur, with ADAPT Centre (MTU, Ireland), University of West Bohemia and UNLP (Argentina); co-located with an ACL conference
organizer_country: [india, europe, other]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [8, 10]
  conference_months: [10, 12]
links:
  website: https://exploration-lab.github.io/WSLP-2026/
notes:
- Workshop on sign language translation, recognition and resources, with a shared task each year
- 1st edition with IJCNLP-AACL 2025 at IIT Bombay, 2nd edition with EMNLP 2026 in Budapest (hybrid)
- Archival track with proceedings in the ACL Anthology; dual submission with EMNLP or ARR not allowed
- Different from SignLang, the biennial sign language workshop at LREC
- Not listed in the CORE portal (ICORE2026)
