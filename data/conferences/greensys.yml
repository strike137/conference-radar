notes:
- One-day workshop co-located with EuroSys on energy, carbon and water footprint of large-scale AI systems
- Started in 2025 (Rotterdam, with EuroSys 2025); 2nd edition in Edinburgh with EuroSys 2026
- 2025 edition had invited talks, journal-first presentations and a panel; 2026 added a paper call with proceedings
- Accepted papers are published in the ACM Digital Library; one author must register and present
- 'Papers: up to 6 pages including references in ACM sigconf format, single-blind review via HotCRP'
- Welcomes early-stage ideas and work in progress
- Not listed in CORE ICORE2026 or the CCF list
