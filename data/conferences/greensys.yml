links:
  website: https://greensys-org.github.io/workshop/
notes:
- Workshop on energy and carbon efficiency of large-scale AI training and inference, AI data centers and environmental impact of AI
- Co-located with ACM EuroSys (Rotterdam 2025, Edinburgh 2026)
- Papers up to 6 pages including references, ACM sigconf format, single-blind review via HotCRP
- Accepted papers published in the ACM Digital Library; one author must register and present
- Program mixes invited talks, paper presentations and lightning talks; the 2025 edition also had journal-first presentations
- Not listed in CORE ICORE2026
