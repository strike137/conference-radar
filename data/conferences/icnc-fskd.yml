notes:
- Joint conference of ICNC (natural computation) and FSKD (fuzzy systems and knowledge discovery) since 2005, hosted by
  Chinese universities (2026 in Taiyuan)
- Technically co-sponsored by the IEEE Systems, Man, and Cybernetics Society (2026)
- Final papers must be IEEE Xplore compliant; the site states all editions 2005 to 2025 were indexed in EI Compendex
- Topics are nature-inspired computing, fuzzy systems, data mining and intelligent methods
- Late-breaking papers accepted for about a month after the main deadline
- "Registration fee: 500 to 550 USD for one paper up to 10 pages, 60 USD per extra page (2026)"
- "Rated National: China in ICORE2026 (listed as International Conference on Natural Computation)"
