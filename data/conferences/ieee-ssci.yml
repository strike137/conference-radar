notes:
- Large multi-symposium meeting of the IEEE Computational Intelligence Society; since 2025 it is organized as ten
  applied CI symposia under one roof
- Biennial since the 2025 restructuring (Trondheim 2025, Gold Coast 2027); earlier editions were annual, usually
  in December, and rotated worldwide
- Includes symposia on CI in Security, Defence and Biometrics (CISDB) and on CI in NLP and Social Media (CI-NLPSoMe)
- Full papers up to 6 pages plus 1 page of references (short papers 4 plus 1); also late-breaking (2 pages), poster-only
  abstract and journal-to-conference tracks that are not in the proceedings
- SSCI itself is not listed in CORE; several of its former constituent symposia (e.g. CICS, CIDM) are CORE C. Proceedings
  in IEEE Xplore; 2027 is primarily in person with a remote presentation option
