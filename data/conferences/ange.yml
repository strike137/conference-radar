notes:
- Workshop on architecting smart ecosystems with AI, self-adaptation and explainability, co-located with IEEE ICSA
- 1st edition at ICSA 2026 in Amsterdam, held jointly with the WASA workshop
- Accepted papers published as workshop proceedings in IEEE Xplore
- Full papers up to 8 pages and short papers up to 6 pages including references, IEEE CS format, single-anonymous review by at least three PC members
- In-person event; at least one author must register and present; best paper award
- Organizers from University of Naples Federico II, Gran Sasso Science Institute (Italy) and Malardalen University (Sweden)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
