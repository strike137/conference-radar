  website: https://sigos.ipsj.or.jp/event/comsys2026/
notes:
- Flagship annual symposium of IPSJ SIGOS (system software and operating systems), held since 1987; the 2026
  edition is the 38th
- Held in early December in a different Japanese city each year (Hiroshima 2023, Yokohama 2024, Nagoya 2025,
  Kanazawa 2026); hybrid for general talks, posters on-site only
- General talks with a paper, with a paper plus written comment feedback from the program committee (feedback, not
  peer review), or abstract only; abstract-only talks suit work already published at international venues
- Only papers from general talks go into the online proceedings in the IPSJ Digital Library, published one week
  before the symposium; poster and demo papers (1 to 2 pages) are posted on the SIGOS site
- Invited talks include "top conference return talks" by authors of recent papers at venues such as ACM CCS, VLDB
  and HPDC; best young presentation and best poster awards
- Small and student friendly (10 paper talks in 2025); papers use the IPSJ technical report format, and poster and
  demo papers may be in Japanese or English
- Not listed in ICORE2026
