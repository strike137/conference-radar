notes:
- Workshop on security, privacy and safety of IoT sensing systems, sensor ML, XR and autonomous vehicles
- 1st edition with ACM SenSys 2023 (Istanbul), 2nd with ACM SenSys at CPS-IoT Week 2025 (Irvine); no 2024 edition
- Both editions published in the ACM Digital Library
- 2025 format took technical papers up to 4 pages and vision papers up to 2 pages (ACM format, excluding references); double-blind review
- Not in the CPS-IoT Week 2026 workshop list
- Not listed in the CORE portal (ICORE2026)
