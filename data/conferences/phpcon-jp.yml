notes:
- Largest PHP developer conference in Japan, held once a year since 2000 by the Japan PHP User Group
- Held at Ota City Industrial Plaza PiO, Kamata, Tokyo (2025 and 2026)
- Multi-track talks plus lightning talks and sponsor booths; 2025 had 40+ sessions in five tracks
- Main admission free in 2026; after-party ticket 3,500 JPY
- Talks managed on fortee; no papers or proceedings
