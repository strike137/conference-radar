id: snpd
name: SNPD
full_name: ACIS International Conference on Software Engineering, Artificial Intelligence, Networking and Parallel/Distributed
  Computing
type: conference
tier: minor
areas: [software, ai, networking, systems, general]
region: asia-pacific
language: english
frequency: multiple-per-year
organizer: ACIS (International Association for Computer and Information Science, USA)
organizer_country: [usa]
proceedings: IEEE CPS
indexing: [EI, INSPEC, DBLP]
rank:
  core: C
fee: 750 USD IEEE/ACM/ACIS member, 875 USD non-member (2026 Okayama, on or before Jul 17); 200 USD per extra page
typical:
  deadline_months: [6, 7, 8]
  conference_months: [6, 7, 8, 9, 10]
links:
  website: https://acisinternational.org/conferences/
notes:
- 'Run by ACIS several times a year, usually co-located with ACIS ICIS and BCD; mostly in Japan, Korea and China
  (2025: Busan, Fukui, Toronto; 2026: Okayama)'
- IEEE/ACIS editions publish proceedings through IEEE Computer Society CPS; selected papers go to Springer SCI book
  series and IJNDC
- Regular papers up to 8 pages (6 included in the fee), short papers 4 pages, submitted via EasyChair
- '2027 editions announced: Hohhot (Jul 15-17), Beijing (Aug 25-27) and Kyoto (Sep 8-10); SNPD 2026-II (Dali, China,
  Nov 6-8) was canceled'
- Generally regarded as a low-tier venue with high registration fees; CORE C
