notes:
- Half-day workshop on evaluating agentic AI and its trustworthiness, held with ACM SIGKDD
- Held at KDD 2026 in Jeju, Korea (August 9, 2026, afternoon, ICC Jeju)
- Papers up to 9 pages in the ACM template, anonymous submission via OpenReview
- Accepted papers are posted on the workshop website but not included in the KDD proceedings
- Organized mainly by Amazon researchers
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
