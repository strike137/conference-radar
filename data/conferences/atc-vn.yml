id: atc-vn
name: ATC
full_name: International Conference on Advanced Technologies for Communications
type: conference
tier: minor
areas: [communications, networking]
region: southeast-asia
language: english
frequency: annual
organizer: Radio and Electronics Association of Vietnam (REV) and IEEE Communications Society; host university rotates
proceedings: IEEE Xplore
rank:
  core: Unranked
fee: 350 USD IEEE/ComSoc/REV member, 400 USD non-member, 200 USD student member (2026, before 2026-09-10)
typical:
  deadline_months: [5, 6, 7]
  conference_months: [10]
links:
  website: https://atc-conf.org/
notes:
- Co-organized by REV (Radio and Electronics Association of Vietnam) and IEEE ComSoc since 2008
- Held in Vietnam every October; host rotates (2024 Ho Chi Minh City, 2025 Hanoi University of Industry, 2026 Quy
  Nhon University)
- 'Communications-focused: communication theory, coding, networks, signal processing, antennas and electronics;
  blind review; 6-page IEEE papers via EDAS'
- Submission deadline is typically extended twice; not in the CORE ranking (CORE's ATC is Advanced and Trusted Computing,
  a different conference)
