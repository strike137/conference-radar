notes:
- Organized by TASN (Taiwanese Association for Social Networks) with National University of Kaohsiung; 13th edition
  in 2026 co-hosted by FPT University
- Renamed Management, Information and Social Network Conference from 2027, keeping the MISNC acronym and widening
  the scope to management and information systems
- Location rotates worldwide, mostly in Asia (Phuket 2023, Bali 2024, Da Nang 2026) with European editions in between
  (Oviedo 2025, Paris 2027)
- Post-conference proceedings in Springer CCIS, indexed by Scopus and EI; journal special issues for selected papers
- Uses a 'first come, first review' policy; deadline extended by two to three weeks in 2024, 2025 and 2026; online
  presentation allowed at a lower fee
