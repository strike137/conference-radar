notes:
- One of the oldest general AI conferences; held jointly with ECAI when in Europe (IJCAI-ECAI 2026 in Bremen)
- 'IJCAI 2027 will be held in Kyoto, Japan (Aug 7 to 13) plus Hengqin, China (Aug 15 to 17): very accessible from
  JAIST'
- 'Two-phase review: two reviews in Phase 1 with summary rejection, author response only in Phase 2; max 8 submissions
  per author (2026)'
- CORE A*, but moved from CCF A (2022 list) to CCF B in the 2026 CCF list
- Deadline in mid January, conference in August
