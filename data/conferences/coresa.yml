id: coresa
name: CORESA
full_name: COmpression et REprésentation des Signaux Audiovisuels
type: conference
tier: domestic
areas: [vision]
region: europe
language: mixed
frequency: irregular
organizer: French multimedia signal processing community with a rotating host lab (LS2N, Nantes Université in 2026)
organizer_country: [europe]
proceedings: CORESA website and HAL (conference actes)
archival: false
fee: "264 EUR student, 352 EUR academic, 384 EUR industry (2026, incl. VAT)"
typical:
  deadline_months: [2, 3]
  conference_months: [5, 6, 11]
links:
  website: https://coresa2026.sciencesconf.org/
notes:
- French national conference on image, video, audio and 3D compression, representation and analysis
- Short papers of 2 to 4 pages including references, in French (preferred) or English
- Recently published work from top venues can be presented as a 2-page summary that does not appear in the proceedings
- Papers posted on the CORESA website and HAL; best student papers invited to extend into a Signal Processing Image Communication special issue, so marked non-archival here
- Held in a different French city each edition (Lille June 2023, Rennes November 2024, Nantes May 2026)
- Not listed in CORE ICORE2026 or in the CCF 2026 list
