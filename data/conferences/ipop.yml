notes:
- Annual international conference on IP and optical networking (SDN/NFV, all-photonic networks, IOWN, 6G) held in Japan since 2005
- Founded and sponsored by Photonic Internet Labs (PIL) and ISOCORE; general chairs from Keio University, NTT and ISOCORE
- Submissions are one-page extended abstracts (400 words); accepted speakers then submit presentation slides
- Slides are posted on the Online Proceedings page; no formal proceedings, so non-archival
- Includes an exhibition and an interoperability showcase alongside the technical sessions
- iPOP 2026 reported over 300 participants
- Held at company and university sites in Japan (NTT Musashino 2023, Hakodate 2024, NICT Koganei 2025, Keio Yagami 2026)
