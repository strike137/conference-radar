notes:
- Held since 2004, mostly in China; 2015 to 2020 abroad (Jeju, Saint Petersburg, Sapporo, Minsk, Moscow, Cairo)
  and no edition 2021 to 2023; 2024 Weihai, 2025 Zhangye, 2026 Hanzhong, 2027 Hangzhou
- Proceedings in Springer LNCS; papers of about 10 pages (max 12, overlength charge) in LNCS format
- Technical co-sponsors Asian Pacific Neural Network Society and International Neural Network Society
- CORE C (ICORE2026); not in the CCF list
- The 2026 deadline was extended by four weeks; the 2027 edition moves earlier (May) with a November 2026 deadline
