notes:
- French national meeting of the coding theory and cryptography community, run by the C2 working group of the CNRS
  research groups GDR IFM and GDR Sécurité Informatique
- Week-long residential meeting at a holiday village (Najac 2023, Pornichet 2025, Blériot-Plage on the Côte d'Opale 2026, Ronce-les-Bains 2027)
- Talks selected from one-page proposals; work in progress or already published results are welcome, and PhD students
  and postdocs get priority
- No proceedings, so it is marked non-archival here
- Talks may be in French or English; slides in English are encouraged
- Held roughly every one or two years since 1996 (2017, 2018, 2020 online, 2022, 2023, 2025, 2026, 2027)
- Limited travel grants for young researchers
- Not listed in ICORE2026 and not on the CCF list
