notes:
- Workshop on the intersection of databases and machine learning (ML for DBMS, data management for ML and LLM systems, vector databases), held with IEEE ICDE, so it moves with ICDE
- 5th edition in 2026; held every year since 2022; earlier editions were hosted by TU Delft
- Papers up to 6 pages including references, IEEE template, no appendix; single-blind review on Microsoft CMT
- ICDE workshop papers are published together with the ICDE conference proceedings
- Small workshop; 3 accepted paper talks and 3 invited talks in 2026
- Not listed in CORE ICORE2026 or in the CCF 2026 list
