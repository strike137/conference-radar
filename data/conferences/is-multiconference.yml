notes:
- Slovenian multiconference held every October at the Jozef Stefan Institute in Ljubljana, 29th edition in 2026
- Umbrella for many small conferences, each with its own CFP and deadlines; IT ones include the Slovenian Conference on AI (SKUI), SIKDD (data mining) and MATCOS
- Papers in English or Slovene, usually up to 4 pages, single-blind review by at least one reviewer
- Each conference has its own proceedings volume published by the Jozef Stefan Institute, open access on the site
- Selected SKUI papers invited to the Informatica journal
- "Fee: 200 EUR per paper, 100 EUR for students (2026)"
- Not listed in CORE ICORE2026 and not on the CCF list
