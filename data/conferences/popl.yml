notes:
- Flagship venue for the principles and theory of programming languages; sponsored by ACM SIGPLAN with SIGACT and SIGLOG
- Papers are published in the PACMPL issue POPL (Gold Open Access, archived in the ACM DL); presenting is invited but not required
- Double-blind review with author response; all accepted papers are conditionally accepted and need a revision
- Up to 25 pages of text in the single-column acmsmall format, excluding bibliography; mechanized proofs strongly encouraged
- At least one senior author must register as a reserve reviewer, or the paper may be desk rejected
- Held in London 2024, Denver 2025, Rennes 2026 and Mexico City 2027
- CORE A* (ICORE2026), CCF A
