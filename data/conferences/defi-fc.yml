notes:
- Co-located workshop of Financial Cryptography and Data Security (FC); not the same venue as the ACM CCS DeFi workshop
- Interdisciplinary scope covering protocol design, MEV, AMMs, stablecoins, oracles, governance, financial economics and law
- Two submission types, talk proposals (about 2 pages) and papers (up to 15 pages in LNCS format in 2026, 8 pages in 2024)
- Papers appear in the FC workshops post-proceedings in Springer LNCS (2024 -> LNCS 14746, shared with Voting, WTSC and CoDecFin)
- "DeFi 2026: 42 submissions, 12 accepted papers"
- "DeFi 2024: 32 submissions, 4 papers in the LNCS post-proceedings"
- Held at the FC venue (Curacao 2024, St. Kitts 2026, Barbados 2027); there was no DeFi workshop at FC 2025
- DeFi 2027 (6th edition) uses double-blind review; papers can be accepted as a talk or as a poster, and all accepted papers go into the workshop proceedings
