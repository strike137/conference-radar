areas: [ai]
region: asia-pacific
language: english
frequency: annual
organizer: IEEE (proceedings by IEEE Computer Society CPS); agent research community from Japan, Australia and China
organizer_country: [japan, australia, china]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [9]
  conference_months: [12]
links:
  website: https://attend.ieee.org/ica-2026
notes:
- Agent and multiagent systems venue held since 2016 (Matsue); the 2025 and 2026 editions refocus it on Agentic AI
  (LLM agents, autonomous workflows, multiagent systems, human-AI collaboration)
- Rotates around Asia and Oceania -> Kyoto 2021 and 2023, Adelaide 2022, Wollongong 2024, Wuhan 2025, Kumamoto 2026
- 2026 edition co-located with PRIMA 2026 in Kumamoto with a shared registration system
- Accepted and presented papers go into proceedings by IEEE Computer Society CPS and are submitted to IEEE Xplore
- Regular papers up to 6 pages and posters up to 2 pages, double-blind via EasyChair; a final AI Declaration section
  is mandatory
- In-person presentation required in 2026 (no hybrid option)
- "Registration 2026: 139,000 JPY for a non-member author, 89,000 JPY for an IEEE student member author"
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
