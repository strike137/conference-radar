notes:
- Annual conference of the science gateways community (web platforms giving access to HPC, data and research software), run since 2016
- Organized by SGX3, the NSF-funded Science Gateways Center of Excellence; held at a different US location each year (Bozeman 2024, Green Bay 2025, Washington DC 2026, San Diego 2027)
- Papers of 4 to 6 pages; talk-only, poster, demo (bring-your-own-portal) and virtual tutorial tracks
- From 2026 papers appear in the ACM International Conference Proceedings Series; APC 250 or 350 USD in 2026 unless covered by ACM Open
- Accepted papers invited to extend for a journal special issue on science gateways
- "Registration 2026: 450 USD students, 550 USD early bird, 650 USD regular"
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
