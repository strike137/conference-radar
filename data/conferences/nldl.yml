notes:
- Organized by the Visual Intelligence centre and the UiT Machine Learning Group; held every January at UiT in
  Tromso, Norway since 2018 (online in 2021 and 2022)
- Proceedings in PMLR since 2024 (2026 -> vol. 307, 37 papers); 2020 to 2023 proceedings on UiT Septentrio
- Full papers 5 to 8 pages plus references and appendices; double-blind review with an author rebuttal
- Small and student-friendly; a winter school runs alongside the main conference
- Level 1 publication in the Norwegian system; not listed in CORE ICORE2026
