notes:
- French-language conference of IT staff in French higher education and research (networks, systems, applications, information security, IT management)
- Held every two years in December in a French city (Rennes 2024, Tours 2026); over 1500 attendees in 2022
- Program committee from the French research and education community selects proposals of 500 to 1300 words; full articles of 2000 to 3000 words are written only after acceptance
- Formats are long talks (30 min), short talks (15 min), posters and tutorials, plus lightning talks, small talks and demos submitted shortly before the event
- Mostly practitioner experience reports rather than research papers; articles are archived on HAL but not in a formal series, so marked non-archival here
