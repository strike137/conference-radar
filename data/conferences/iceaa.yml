notes:
- Electromagnetics, antennas and propagation conference founded in Torino in 1989; held jointly with the IEEE-APS
  Topical Conference on Antennas and Propagation in Wireless Communications (IEEE APWC) since 2011
- Biennial in Torino until 2009, annual since 2010 and rotating worldwide (Venice 2023, Lisbon 2024, Palermo 2025,
  Toyama 2026)
- Papers of 1 to 6 pages; all papers are forwarded to IEEE Xplore, but one-page papers may stay in the conference
  proceedings only
- In 2026 sponsored by IEICE and IEEE AP-S, with Politecnico di Torino and URSI as technical co-sponsors
- Selected papers can go to a Radio Science special collection and an IEEE JMMCT special section
- Submission deadline is usually extended (2026 moved from April 10 to May 1)
- Not ranked by CORE or CCF; separate from the IEEE VTS APWCS symposium
