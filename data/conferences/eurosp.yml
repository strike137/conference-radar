notes:
- European counterpart of IEEE S&P, run by the IEEE TC on Security and Privacy since 2016
- Single deadline (late November or early December) with mandatory paper registration one week before; double-blind;
  early rejection and rebuttal
- 'Held in a European city every July: Lisbon (2026), Madrid (2027)'
- Every accepted paper gets a short talk plus a poster; at most 7 submissions per author
- CORE A but CCF C
