notes:
- Informal workshop on symbolic execution around the KLEE engine, organised by Klovo and the Software Reliability Group at Imperial College London
- Editions in 2018 (London), 2021 (online), 2022 (London and online), 2024 (Lisbon, with ICSE) and 2026 (Munich, with ASE)
- Calls for presentations and posters; a presentation proposal is an extended abstract of up to two pages, submitted on HotCRP
- No proceedings, the extended abstract is only used for selection
- Two submission rounds in 2026, an early visa-safe round and a late round with fewer slots
- At least one author must register and attend in person
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
