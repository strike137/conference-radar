links:
  website: https://fmbc.gitlab.io/
notes:
- One-day workshop on formal methods for blockchains, smart contracts, consensus protocols and zero-knowledge proofs
- Steering committee from Nomadic Labs (France) and the University of Exeter (UK)
- Proceedings in Dagstuhl OASIcs every year since 2020 (FMBC 2026 -> OASIcs volume 142, FMBC 2025 -> volume 129)
- 'Hosts follow the parent event: FM 2019 (Porto), CAV 2020 and 2021 (online), CAV/FLoC 2022 (Haifa), ETAPS since 2024 (2024 Luxembourg City, 2025 Hamilton, 2026 Turin)'
- No edition in 2023
- Full papers up to 12 pages, short and tool papers up to 6 pages; 2-page extended abstracts get a lightning talk but are not in the proceedings
- At least three reviews per paper; revised selected papers considered for a JLAMP special issue (2026)
- Deadlines were extended by about one week in 2025 and ten days in 2026
- Not listed in ICORE2026 or the CCF list
