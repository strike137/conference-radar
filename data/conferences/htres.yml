links:
  website: https://aclanthology.org/venues/htres/
notes:
- Half-day workshop on NLP, speech technology and digital humanities methods for Holocaust survivor testimonies and related archives
- Held with LREC in even years so far, LREC-COLING 2024 in Turin and LREC 2026 in Palma, Mallorca
- Proceedings published by ELRA (with ICCL in 2024) and hosted in the ACL Anthology (9 papers in 2024, 11 in 2026)
- 2026 edition supported by CLARIN and EHRI
- No standalone workshop website found; the LREC 2026 workshop schedule and proceedings front matter give the date
- Not listed in ICORE2026 and not on the CCF list
