notes:
- Long-running Polish pattern recognition conference run by the Department of Systems and Computer Networks at Wroclaw
  University of Science and Technology; 14th edition in 2025
- Proceedings in Springer Lecture Notes in Networks and Systems; the 2023 volume was shared with the IP&C conference
  (Progress on Pattern Classification, Image Processing and Communications)
- Full papers in English in Springer LNCS format, about 8 to 10 pages; each paper is reviewed by two referees via
  Microsoft CMT
- Small single-track event; the 2025 edition was held online on May 21-23
- Topics cover statistical and structural pattern recognition, image processing, machine learning, data mining and
  decision support
