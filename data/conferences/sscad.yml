notes:
- Brazilian HPC symposium run by the SBC special committee CE-ACPAD; held since 2000 as WSCAD, renamed SSCAD in 2024
- Topics include HPC applications, parallel and distributed algorithms, computer architecture, operating systems, energy efficiency and AI with HPC
- Proceedings (Anais) published in the SBC OpenLib (SOL); papers in Portuguese or English, up to 12 pages
- Best papers invited to a special issue of Concurrency and Computation - Practice and Experience (CCPE)
- Held in a different Brazilian city each year (Bonito 2025, Natal 2026); associated events include a thesis contest, an undergraduate workshop, WEAC and a parallel programming marathon
- Deadlines are usually extended
- Not ranked in CORE ICORE2026
