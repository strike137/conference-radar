notes:
- Organized by 10 IPSJ SIGs, including CSEC (computer security) and SPT (security psychology and trust)
- Retreat-style (gasshuku) symposium held every late June at a resort or hot spring hotel; the fee includes lodging
  and meals and is the same without staying overnight
- Acceptance decided on a 1-page abstract in March; full paper in IPSJ journal format with no page limit due in
  May
- Regular talks about 20 min incl. Q&A, plus demo presentations; strong papers are recommended to IPSJ journal/transactions
- Goes back to the DiCoMo'97 workshop (July 1997); DICOMO2026 carried a 30th anniversary theme
