notes:
- Independent AI/ML conference started in 2018 in Russia; since 2023 a meeting point for the Russian-speaking AI community abroad
- Held in Yerevan (2023), Tbilisi (2024) and Belgrade (2026, Sava Centar)
- Business, R&D and academic tracks; all talks, posters and panels selected through a two-round call for proposals on EasyChair
- Selected speakers pay no fee; registration about 360 EUR (2026, standard)
- 1000+ participants and 100+ speakers over two days; official language English
- No papers or proceedings
- Not listed in CORE ICORE2026
