notes:
- Run by AALT (Association for Algorithmic Learning Theory), an international association created in 2018; sister
  conference of COLT
- Covers all theoretical and algorithmic aspects of machine learning (online learning, statistical learning,
  optimization, RL theory, privacy, theory of deep learning and LLMs)
- Proceedings in PMLR (ALT 2026 -> Volume 313, ALT 2025 -> Volume 272); authors may opt for a one-page extended
  abstract instead of the full paper
- Submission on OpenReview; no page limit but reviewers may not read beyond 12 pages; not fully double-blind (senior
  PC member sees author names)
- Held in person; at least one author of each accepted paper is expected to register and present in person
- 'Location rotates worldwide: Paris 2022, Singapore 2023, La Jolla (San Diego) 2024, Milan 2025, Toronto 2026, Leiden 2027'
- Regarded as the second learning theory venue after COLT; CORE B and CCF C
