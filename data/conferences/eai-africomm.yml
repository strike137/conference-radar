notes:
- EAI conference on Internet and ICT infrastructure and services for Africa; called e-Infrastructure and e-Services for Developing Countries until 2022
- Proceedings in Springer LNICST; accepted authors may submit extended versions to EAI Endorsed Transactions journals
- Anonymized submission via Confy+
- 2026 theme is digital transformation and the blue economy, with two submission rounds
- Held in Africa every year (Zanzibar 2021, 2022 and 2026, Bobo-Dioulasso 2023, Abidjan 2024, Ile-Ife 2025); the 2025 edition ran fully online
- Not listed in ICORE2026
