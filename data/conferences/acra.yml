notes:
- Annual conference of the Australian Robotics and Automation Association (ARAA), held since 1999
- Rotates between Australian cities and occasionally New Zealand (Sydney 2023, Auckland 2024, Perth 2025, Canberra 2026)
- Full papers 6 to 10 pages, single-blind review by at least two reviewers
- Proceedings published openly online (2025 volume hosted on Linklings); the site says they are indexed in Scopus and Google Scholar
- "CORE ICORE2026: Australasian C"
- Low cost (2026 early bird 700 AUD general, 500 AUD student); submission deadlines were extended by one week (2025) and two weeks (2026)
