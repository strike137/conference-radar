notes:
- Main European HPC conference and exhibition, run by PROMETEUS GmbH (Germany); held in Hamburg
- Research papers published open access in IEEE Xplore with publication costs covered by ISC (earlier editions in
  Springer LNCS, e.g. 2022 and 2023)
- Papers up to 10 pages excluding references in IEEE format; 3 to 4 reviews, rebuttal and PC meeting
- "Acceptance rate: about 27 to 30% (21/78 in 2023, 24/80 in 2024, 28/97 in 2025)"
- Workshops with proceedings publish in Elsevier Future Generation Computer Systems; also regular workshops, tutorials,
  posters and BoFs
- Hans Meuer Award for the best research paper
- CORE National/Regional (ICORE2026)
