links:
  website: https://ccf.org.cn/CWSN2026
notes:
- National Chinese IoT and wireless sensor network conference of the China Computer Federation (CCF), run by its
  IoT technical committee (formerly the Sensor Networks committee); 2026 is the 20th edition
- English proceedings published in Springer Communications in Computer and Information Science (CCIS) for 2023
  to 2025; selected papers recommended to journals such as ACM TOSN and ACM TIOT
- Accepts Chinese and English papers; double-blind review, up to 8 pages (Chinese) or 11 pages (English)
- Held in a different Chinese city each year (Dalian 2023, Taiyuan 2024, Hangzhou 2025, Harbin 2026)
- Not ranked in CORE ICORE2026
