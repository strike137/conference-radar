notes:
- Co-organized by HKCBEES and FPT University; conference secretariat at cbees.net
- Held every year since 2018; 2027 is the 12th edition
- Held in Vietnam almost every year (Hanoi, Da Nang, Ho Chi Minh City); Foshan, China in 2022
- Papers in the ACM International Conference Proceedings, stated as EI Compendex and Scopus indexed; some papers go to the Journal of Advances in Information Technology or Optoelectronics Letters instead
- Papers reviewed by 2 to 3 reviewers; abstract-only presentation and listener registration are also offered
- Smaller commercially organized conference; hybrid (online and offline) since 2021
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
