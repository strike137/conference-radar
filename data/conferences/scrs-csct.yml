notes:
- Technically sponsored by the Soft Computing Research Society (SCRS, New Delhi), which runs many hybrid conferences each year with Indian host institutions
- After-conference proceedings in the Springer book series Smart Innovation, Systems and Technologies (SIST); two volumes each for 2023 and 2024
- Hybrid (in-person and online); hosted by NIT Sikkim since 2024; 2022 and 2023 editions were run from South Asian University (scril.sau.int)
- 5th edition in 2026; submission via Microsoft CMT
- Not listed in CORE ICORE2026 and not on the CCF list
