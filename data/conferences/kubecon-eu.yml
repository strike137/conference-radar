notes:
- CNCF flagship practitioner conference on Kubernetes and cloud native computing, Europe edition run by The Linux Foundation
- Held in a different European city each spring (Amsterdam 2026, Barcelona 2027)
- Four days; the Monday is pre-event programming with CNCF-hosted co-located events (ArgoCon, CiliumCon, Open Source SecurityCon, Platform Engineering Day and others), keynotes and breakouts Tuesday to Thursday
- Talk proposals reviewed by a program committee across tracks such as Security, Observability, Connectivity and AI Inference; no papers, slides and recordings are posted afterwards
- The Emerging + Advanced track explicitly welcomes cloud native research and academic papers presented as talks; research topics are also steered to poster sessions
- Co-located events have their own separate call for proposals
