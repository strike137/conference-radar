notes:
- European edition of the IEEE PES ISGT smart grid conference series, held yearly since 2010 (Gothenburg) except 2015
- Always held in Europe (2021 Espoo, 2022 Novi Sad, 2023 Grenoble, 2024 Dubrovnik, 2025 Malta, 2026 Budapest)
- Power and energy focus; tracks include grid operation, energy markets, and digitalization, AI and grid cybersecurity
- Full papers up to 5 pages in IEEE format via ConfTool; accepted and presented papers go to IEEE Xplore
- Top 5% of papers are invited to submit extended versions to IEEE PES Transactions
- Recently accepted IEEE PES Transactions papers can be presented in a dedicated track (abstract only in proceedings)
- Additional paper by the same author costs 190 EUR (2026)
- Not listed in the CORE ICORE2026 portal
