notes:
- Workshop on timing and resource-consumption analysis of embedded real-time software (static and measurement-based WCET analysis, predictable hardware, tools)
- One-day workshop co-located with ECRTS in Europe (Stuttgart 2019, Modena 2022, Vienna 2023, Lille 2024)
- Open-access proceedings in Dagstuhl OASIcs since 2005; papers up to 10 pages plus references, not anonymized
- Annual until 2024 apart from 2020 and 2021; not listed among the ECRTS 2025 or 2026 workshops
- Not listed in CORE ICORE2026 or the CCF 2026 list
