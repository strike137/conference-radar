notes:
- Theory venue on searching, indexing and matching strings, trees, graphs and other structures; held every year since 1990 (founded by Maxime Crochemore)
- Run by an international steering committee; mostly held in Europe (Prague 2022, Marne-la-Vallee 2023, Fukuoka 2024, Milan 2025, Copenhagen 2026, London 2027)
- Proceedings in LIPIcs (Dagstuhl), open access; LIPIcs volume 369 for CPM 2026
- Two submission rounds (November and February); papers rejected in round one may be resubmitted in round two
- Extended abstracts up to 12 pages in LIPIcs style, excluding title page and references; single-blind review
- A summer school for students is usually held just before the symposium
- 'CORE rank B (ICORE2026); not on the CCF 2026 list'
