notes:
- International symposium of the Japan Society of Kansei Engineering (JSKE); 12th edition in 2026
- Held each March alongside the JSKE Spring Academic Conference, with parallel sessions
- Online since 2021; the JSKE spring conference host offers rooms for presenting (Kyoto Institute of Technology 2025, Utsunomiya University 2026)
- Earlier editions at Kogakuin University, Tokyo; 2018 at Eastern Washington University, USA (with MAICS)
- Topics are affective (kansei) engineering, affective computing, affective robotics, interaction and emotional design
- Short papers of up to 4 pages, reviewed by at least two reviewers
- Proceedings open access on J-STAGE (ISSN 2433-5428), marked as peer-reviewed conference proceedings
- Not listed in CORE ICORE2026
