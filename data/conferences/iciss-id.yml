notes:
- Organized by the Smart City and Community Innovation Center at Institut Teknologi Bandung (SCCIC ITB)
- Not to be confused with the Indian ICISS (Information Systems Security)
- 2026 is the 13th edition; recent editions (2024 to 2026) were held in Bandung, Indonesia
- Proceedings are published by IEEE (DOI prefix 10.1109, IEEE Xplore)
- Hybrid format with onsite and online attendance; submission via EasyChair
- Broad smart society scope covering AI, digital twins, IoT, smart cities, e-government and security
- Not listed in the ICORE2026 portal or the CCF 2026 list
