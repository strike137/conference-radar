notes:
- Workshop co-located with IEEE ICC; 1st edition at ICC 2025 (Montreal, WS27), 2nd edition at ICC 2026 (Glasgow, WS05)
- Topics are network-aided robotics and robot-aided networks (aerial, ground and underwater robots, control over 6G, sensing, localization, semantic communications)
- Organizers are Omid Esrafilian, Florian Kaltenberger, Zdenek Becvar and Ismail Guvenc
- Accepted and presented papers go into the IEEE ICC workshop proceedings in IEEE Xplore; in-person presentation required (no-show papers removed)
- Submissions via EDAS through the ICC workshop call
- Not listed in ICORE2026
