links:
  website: https://sites.google.com/view/kdd-mlf-2026/
notes:
- Finance workshop held with ACM SIGKDD; first held at KDD 2017, then every year since KDD 2019
- 2026 was the 9th edition (Jeju, Korea); location follows KDD (2024 Barcelona, 2025 Toronto)
- Topics include fraud, anti-money laundering, market manipulation, credit, DeFi and GenAI for financial data
- Papers up to 8 pages in the ACM proceedings template, double-blind, submitted via CMT; all accepted papers presented as posters
- Also invites short industry problem papers and algorithmic tutorials
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
