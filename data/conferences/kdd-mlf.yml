organizer: KDD workshop program; organized by Nitesh Chawla (University of Notre Dame), Saurabh Nagrecha (Google) and others from academia and the financial industry
organizer_country: [usa]
proceedings: None (non-archival; accepted papers are posted on the workshop website)
