frequency: annual
organizer: Orissa Information Technology Society (OITS), with a host institute
organizer_country: [india]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [8, 9]
  conference_months: [12]
links:
  website: https://oits-ocit.github.io/
notes:
- Run by the Orissa Information Technology Society; known as ICIT until 2019 and as OCIT since 2021 (24th edition in 2026)
- Held in December, mostly in Bhubaneswar; recent hosts were IIIT Bhubaneswar, KIIT, NIT Raipur, SRM University and NIT Kurukshetra
- Technically co-sponsored by an IEEE section; OCIT 2024 proceedings are in IEEE Xplore
- Tracks cover AI and ML, data science, networking and information security, distributed computing, signal processing and IoT
- Full papers up to 6 pages, double-blind; submission via Microsoft CMT; no-show papers are removed
- Not listed in ICORE2026 or the CCF 2026 list
