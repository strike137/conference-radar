notes:
- Annual conference of the AAAC (formerly Humaine), the main venue for affective computing; 14th edition in 2026
- Rated B in ICORE2026; not found in the CCF list
- Proceedings published in IEEE Xplore (IEEE Computer Society technical co-sponsorship in 2025)
- Main track papers up to 7 pages plus a mandatory ethical impact statement of up to 1 page, references unlimited, IEEE template
- Double-blind review on EasyChair with a rebuttal period; arXiv preprints are allowed
- One full registration required per paper in the proceedings
- Rotates worldwide (virtual 2021, Nara 2022, Cambridge MA 2023, Glasgow 2024, Canberra 2025, Puebla 2026)
- 2026 edition co-hosted with IVA 2026 in Puebla
- Workshops, tutorials, doctoral consortium, demos and late breaking research tracks with later deadlines
