id: icet-pk
name: ICET
full_name: International Conference on Emerging Technologies
type: conference
tier: minor
areas: [ai, networking, communications, security, software, general]
region: south-asia
language: english
frequency: annual
organizer: IEEE Islamabad Section, with a rotating Pakistani host university (GIKI in 2026, UET Peshawar in 2025)
organizer_country: [other]
proceedings: IEEE Xplore
indexing: [IEEE Xplore]
fee: Overseas 300 USD non-IEEE member, 250 USD IEEE member; national presenter 25,000 PKR non-member (2026)
typical:
  deadline_months: [6, 7]
  conference_months: [11]
links:
  website: https://icet.org.pk/2026/
notes:
- Flagship conference of the IEEE Islamabad Section, held every year since 2005 except 2020 (21st edition in 2026)
- The host university rotates within Pakistan (Islamabad, Peshawar, Topi Swabi)
- All previous proceedings are in IEEE Xplore; accepted papers are submitted subject to IEEE Xplore scope and quality
  requirements
- Broad scope covering AI, networking, communications, cyber security, software engineering, signal processing and
  electronics; submission via Microsoft CMT
- 67 accepted papers in 2025, 62 in 2024, 55 in 2023 (official history page)
- Not listed in ICORE2026 or the CCF 2026 list; a small regional venue
- Not the same as ICETC (IEICE International Conference on Emerging Technologies for Communications)
