notes:
- Flagship conference of IAPR, held in person every two years (2024 Kolkata, 2026 Lyon, 2028 Sydney)
- IAPR adds a first virtual 29th ICPR (ICPRv) in October 2027 between in-person editions, with the same paper length,
  reviewing and Springer LNCS proceedings; all its dates are still marked tentative
- Proceedings in Springer LNCS for the 2024 and 2026 editions; the 2028 preliminary CFP asks for LNCS papers of
  at most 15 pages
- Single-blind review with at least two reviews per paper; acceptance around 50% (710 of 1432 in 2026)
