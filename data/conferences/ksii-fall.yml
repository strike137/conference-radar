notes:
- Organized by KSII; held together with the KSII general assembly, alongside a spring conference each year
- Short 1 to 2 page papers; the presenter must be a paid-up KSII member (annual fee 50,000 KRW regular, 30,000 KRW
  associate; undergraduates exempt)
- Tracks include AI, network, information security, defense IT, big data, digital twin, IoT and quantum, with research
  group sessions on AI cybersecurity and defense IT
- Best papers are recommended to the society journal JICS (KCI); KSII also publishes KSII TIIS
- Held late October or early November (Yeosu 2025, Gangneung 2026)
