notes:
- Volunteer-run Security BSides conference in Atlanta, Georgia, USA; 2026 was the 14th annual event
- One-day Saturday event; 2026 at the Georgia Tech Hotel and Conference Center in Midtown with 13 content areas
- Call for content on pretalx for talks (20 or 50 minutes), villages, workshops and contests
- All selected talks must be given in person; no remote speaking
- No proceedings
- Date moves around the fall (September 2024, November 2025, October 2026)
