id: ccdc
name: CCDC
full_name: Chinese Control and Decision Conference
type: conference
tier: minor
areas: [general, systems, ai]
region: china
language: english
frequency: annual
organizer: Northeastern University (NEU), China
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI]
typical:
  deadline_months: [10]
  conference_months: [5]
links:
  website: http://www.ccdc.neu.edu.cn/
notes:
- Organized by Northeastern University (Shenyang) with local host universities; technically co-sponsored by IEEE
  Control Systems Society
- Covers control, systems, decision theory and related technologies; official language English
- Accepted English papers submitted to IEEE Xplore; proceedings EI Compendex indexed (CCDC 2022 and 2026 per the site)
- Initial submission up to 8 pages, final papers 6 pages with 200 CNY per extra page (2027)
- Position papers (extended abstracts) are presented and included in the proceedings but not sent to IEEE Xplore
- Held in a different Chinese city every year (Xiamen 2025, Nanjing 2026, Changsha 2027); 39th edition in 2027
- Not listed in ICORE2026
