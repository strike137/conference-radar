id: africacrypt
name: AFRICACRYPT
full_name: International Conference on Cryptology in Africa
type: conference
tier: minor
areas: [crypto]
region: africa
language: english
frequency: annual
organizer: 'Local African host, in cooperation with IACR (2026: University of Monastir and the Tunisian Mathematical
  Society)'
proceedings: Springer LNCS
indexing: [Scopus, DBLP]
rank:
  core: Unranked
acceptance_rate: About 33% (2026, 19/57)
fee: 500 EUR (2026, early, non-African academia/industry; 350 EUR non-African student)
typical:
  deadline_months: [3]
  conference_months: [7]
links:
  website: https://www.africacrypt2026.tn/
  dblp: https://dblp.org/db/conf/africacrypt/index.html
  wikicfp: http://www.wikicfp.com/cfp/program?id=78
notes:
- Held in cooperation with IACR; proceedings in Springer LNCS (Progress in Cryptology series)
- Held in Africa, most often Morocco (also Tunisia, Egypt, Senegal, South Africa, Cameroon), usually in July; annual
  since 2008 except 2015 and 2021
- Pure cryptology venue; blind review, up to 25 pages; about 20 papers per year
- Lower registration fees for African participants; 2026 had a post-quantum cryptography summer school (July 6 to
  7) right before the conference
- Not ranked by CORE
