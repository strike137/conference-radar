notes:
- Organized and sponsored by the IEEE ComSoc Indonesia Chapter with support from Telkom University; 2025 and 2026
  editions are hybrid, hosted from Bali in November
- Tracks on vertical IoT applications, IoT devices and computing, connectivity (5G, SDN, sensor networks), services
  including IoT security and privacy, and intelligence systems
- Submission via EDAS; one registration covers one paper
- Proceedings in IEEE Xplore every year since 2018; site states papers are Scopus indexed
- Paper deadlines are usually extended by about two weeks
