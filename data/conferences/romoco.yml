full_name: International Workshop on Robot Motion and Control
type: conference
tier: minor
areas: [ai, systems]
region: europe
language: english
frequency: irregular
organizer: Institute of Automatic Control and Robotics, Poznan University of Technology
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [1, 2]
  conference_months: [7]
links:
  website: https://romoco.put.poznan.pl/
notes:
- Standalone robotics workshop held at Poznan University of Technology, Poland, since 1999
- Technically co-sponsored by IEEE RAS; under the auspices of the Committee of Automatic Control and Robotics of the
  Polish Academy of Sciences
- Accepted and presented papers are expected to be published in IEEE Xplore (2027 CFP); the 2024 CFP said the same
- Robot control, motion planning, multi-robot systems, perception, teleoperation, autonomous vehicles
- Roughly biennial until 2019, then 2024 (13th) and 2027 (14th)
- Not listed in CORE ICORE2026 or the CCF 2026 list
