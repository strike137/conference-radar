notes:
- Brazilian NLP and human language technology symposium of the Brazilian Computer Society (SBC); annual since
  2023; the STIL 2026 page and the SOL proceedings call 2026 the 17th edition
- Papers in Portuguese, English or Spanish; long papers up to 10 pages (oral) and short papers up to 6 pages
  (poster) plus references; double-blind review by at least two reviewers
- Proceedings published in the SBC OpenLib (SOL) and the ACL Anthology, indexed in DBLP
- Co-located with BRACIS in a different Brazilian city each year (Fortaleza 2025, Cuiabá 2026)
- "Deadlines 23:59 AoE; extended several times in 2026, with a short grace period after the last deadline"
- Not ranked in CORE ICORE2026
