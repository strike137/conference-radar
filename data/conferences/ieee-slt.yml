notes:
- Flagship biennial workshop of the IEEE SPS Speech and Language Processing Technical Committee; alternates years with
  IEEE ASRU
- Papers up to 6 pages plus up to 2 pages of references; double-blind review with an author rebuttal period
- Papers appear in IEEE Xplore; papers not presented at the event are left out of Xplore (SPS no-show policy)
- One author registration covers up to four papers
- 2024 edition held in Macao, 2026 in Palermo; locations rotate worldwide
- About 750 submissions in 2026, reviewed on OpenReview
- IEEE SPS describes SLT 2026 as the final standalone SLT before the IEEE Audio, Speech and Language Intelligence (ASLI)
  conference launches in 2027
- Not listed in ICORE2026; CCF 2026 listing not checked directly
- Well regarded in the speech community despite having no CORE rank
fee: 930 USD early registration for IEEE members, 1,115 USD for non-members (2026, excl. 22% VAT; authors need a full-rate registration, which covers up to four papers)
