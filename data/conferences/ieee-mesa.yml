notes:
- Mechatronics and embedded systems conference run by the ASME/IEEE MESA Technical Committee; financially co-sponsored by IEEE ITSS
- Accepted and presented papers go to IEEE Xplore and are submitted to Scopus and Ei Compendex
- Full papers of 6 to 8 pages, submitted via PaperCept; single-blind review
- Location rotates worldwide (Taipei 2022, Genova 2024, Macau 2025, Beijing 2026)
- The MESA committee also runs an ASME-led MESA within ASME IDETC/CIE in odd years (Anaheim 2025)
- Not listed in ICORE2026 or the CCF 2026 list
