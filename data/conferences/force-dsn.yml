notes:
- Workshop on reliability of hybrid classical-quantum computing systems, held with the IEEE/IFIP International Conference on Dependable Systems and Networks (DSN)
- Accepted papers appear in the DSN-W supplement to the DSN proceedings in IEEE Xplore
- Regular papers up to 8 pages and short papers up to 4 pages including references, IEEE two-column format
- Held with DSN in Naples (2025) and Charlotte (2026), so the location follows DSN
- Chaired by Edoardo Giusto (University of Naples Federico II) with US co-chairs (Kent State and PNNL in 2025, SUNY Canton in 2026)
- Not listed in the CORE ICORE2026 portal or on the CCF list
