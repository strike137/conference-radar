notes:
- Community-driven Security BSides conference in Innsbruck, Austria; first edition in 2027
- Run by a registered Austrian non-profit association (ZVR 1899311559)
- One-day event at WKO Tirol in central Innsbruck; free admission with registration
- 30-minute talks and 10-minute lightning talks, in German or English
- Commercial presentations, product demos and sales pitches are not accepted; first-time speakers welcome
- Includes an art open call alongside the talk programme
- No proceedings
