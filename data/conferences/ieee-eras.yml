notes:
- New conference series started in 2025 on engineering reliable autonomous systems and robots (systems and software engineering, verification and validation, testing, assurance, standards)
- Fully sponsored by IEEE RAS since 2026 and run by the TCs on performance evaluation and benchmarking, software engineering for robotics, and verification of autonomous systems
- Editions so far are 2025 Worcester (WPI), 2026 Zagreb (FER) and 2027 Halifax (Dalhousie University)
- Regular papers 6 pages and short/position papers 4 pages including references, double-blind review, submitted via PaperPlaza
- Accepted regular and short papers go to IEEE Xplore (from 2026); late-breaking reports are poster-only and not in the proceedings
- Accepts r-articles (reproducibility articles) and presentations of papers accepted in IEEE RAS journals
- Not listed in CORE ICORE2026 and not on the CCF 2026 list
