notes:
- IEEE PES/IAS power and energy conference for Africa, held yearly since at least 2016 (PAC)
- Rotates around Africa (2022 Kigali, 2023 Marrakech, 2024 Johannesburg, 2025 Cairo, 2026 Nairobi); 2020 and 2021 were virtual
- Topics include renewable integration, grid resilience, AI and cyber-physical power systems, smart grid security, EVs and energy markets
- Full papers up to 6 pages (extra 2 pages at 50 USD each) and short papers up to 3 pages, via EasyChair
- Accepted and presented full and short papers are published in IEEE Xplore
- Postgraduate forum (poster session); strong postgraduate papers may also be published
- IEEE Smart Village co-locates workshops each year
- Submission deadline is usually extended by several weeks (2026 -> 7 Apr extended to 30 Apr)
- Not listed in the CORE ICORE2026 portal
