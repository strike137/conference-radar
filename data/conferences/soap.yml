notes:
- One-day workshop co-located with ACM PLDI; 2026 was the 15th edition
- Topics are static and dynamic program analysis tools, frameworks, industrial use and tool demos
- Short papers of 4 to 6 pages in the two-column ACM format
- Proceedings in the ACM Digital Library (2026 volume ISBN 979-8-4007-2709-2)
- Selected papers are invited to a special issue of the STTT journal
- No formal artifact evaluation
