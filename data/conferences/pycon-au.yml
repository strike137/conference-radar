notes:
- National conference for the Python community in Australia, held annually since 2010, run by volunteers under Linux
  Australia
- Talks (30 minutes), posters and 2 to 3 hour workshops chosen from a CFP through Pretalx; blind review first, every
  proposal reviewed by at least 12 people in 2026
- Specialist tracks in 2026 included Cybersecurity, Data and AI, DevRel, Education, Platform Engineering and Research
  Software Engineering
- From 2026 accepted talks and posters can opt in to a parallel academic peer review and appear as abstracts with a
  DOI in the PyCon AU Academic Proceedings on Zenodo (8 proposals in 2026); no full papers
- Usually held in the same city for two years
- 'Past venues: Adelaide 2023, Melbourne 2024 and 2025, Brisbane 2026'
