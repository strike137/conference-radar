id: icitiit
name: ICITIIT
full_name: International Conference on Innovative Trends in Information Technology
type: conference
tier: minor
areas: [general, ai, networking, security]
region: south-asia
language: english
frequency: annual
organizer: Indian Institute of Information Technology Kottayam (technically co-sponsored by IEEE Kerala Section)
organizer_country: [india]
proceedings: IEEE Xplore
archival: true
fee: Authors 8,000 to 9,000 INR or 250 to 300 USD before 2026-12-16, students less (2027)
typical:
  deadline_months: [10, 11]
  conference_months: [2, 3]
links:
  website: https://icitiit27.iiitkottayam.ac.in/
notes:
- Run by IIIT Kottayam every year on its campus in Valavoor, Pala, Kerala; technically co-sponsored by IEEE Kerala Section
- Accepted and presented papers are submitted to IEEE Xplore; registration of the presenting author is mandatory
- Papers up to 6 pages, up to 8 with extra page charges; submission via Microsoft CMT
- Broad IT scope with yearly themes; 2027 theme is trustworthy and autonomous computing beyond generative AI
- Held yearly since 2020; 2022 was virtual, 2023 hybrid, and 2024, 2025 and 2027 in person
- Not listed in ICORE2026 or the CCF 2026 list
