notes:
- Workshop held with MICAI, the Mexican International Conference on Artificial Intelligence; 2026 appears to be the first edition
- Covers hyper-heuristics, automated algorithm design, algorithm selection and configuration, and meta-learning for optimization
- Chaired by researchers from Tecnológico de Monterrey and Université de Lille (CNRS, Inria, CRIStAL)
- Complete papers in English in Springer LNCS/LNAI format, submitted through the MICAI Microsoft CMT site under the AHDAS track
- Double-blind review by the workshop program committee
- Accepted papers appear in the MICAI workshop proceedings in Springer LNAI
- Short session within MICAI 2026 (Tec de Monterrey Campus Chihuahua); the workshop page plans three hours, the MICAI activities page lists four
- Not listed in CORE ICORE2026
