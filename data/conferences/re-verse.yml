notes:
- Industry conference on reverse engineering, vulnerability research and malware analysis
- Run by Vector 35 Inc., the company behind the Binary Ninja disassembler
- Held at the Caribe Royale in Orlando, Florida (2026 and 2027); 2027 is its third year
- Speakers apply through a Sessionize call for speakers; no formal proceedings, talks are posted on the RE//verse YouTube
  channel
- Paid training courses run alongside the conference (Mar 2-5 in 2026, after the conference on Mar 14-17 in 2027)
