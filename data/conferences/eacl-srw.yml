notes:
- Student workshop held as part of the EACL conference; topics are the same as the main EACL conference
- First author of research papers must be a student (undergraduate or graduate); thesis proposals for PhD students are a separate category
- Long (8 pages), short (4 pages) and thesis proposal papers; ACL templates and the ARR anonymity policy
- Two routes, direct submission on OpenReview or commitment of papers already reviewed in ACL Rolling Review
- Authors choose archival or non-archival; archival papers appear as a volume of the EACL proceedings in the ACL Anthology
- Optional pre-submission mentorship (not anonymous) about six weeks before the direct submission deadline; grants for students
- All accepted papers are presented in the main conference poster sessions
- EACL 2026 SRW volume (Rabat, Morocco) has 71 papers (2026.eacl-srw in the ACL Anthology)
- EACL is not held every year (2023 Dubrovnik, 2024 Malta, 2026 Rabat, 2027 Athens)
- Not listed separately in ICORE2026 or the CCF 2026 list
