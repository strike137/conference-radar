notes:
- Biennial European forum on reasoning under uncertainty (belief functions, possibility theory, imprecise probabilities, argumentation, probabilistic graphical models); first held in 1991
- Proceedings in Springer LNCS since 1991 (2021 -> LNCS 12897); the 2025 call names the LNAI subseries; at most 12 pages plus references
- Single-blind review; abstract registration about one week before the paper deadline; submissions via OpenReview in 2025
- Always held in Europe (Compiegne 2015, Lugano 2017, Belgrade 2019, Prague 2021, Arras 2023, Hagen 2025)
- The 2027 edition is announced on the official site but no host or dates yet
- CORE ICORE2026 rank C
