id: apic-ist
name: APIC-IST
full_name: Asia Pacific International Conference on Information Science and Technology (renamed INTCOM, International
  Conference on Intelligent Computing, from 2026)
type: conference
tier: minor
areas: [ai, networking, data, general]
region: asia-pacific
language: english
frequency: annual
organizer: KSII (Korean Society for Internet Information)
organizer_country: [korea]
proceedings: KSII conference proceedings; selected full papers extended in KSII TIIS or JICS special issues
archival: true
rank:
  core: Unranked
fee: USD 650 early (KSII member, paper registration) + USD 100 non-member fee (2025 and 2026)
typical:
  deadline_months: [4, 5]
  conference_months: [6, 7]
links:
  website: https://intcom.kr
notes:
- Organized by KSII (Korean Society for Internet Information); renamed INTCOM (International Conference on Intelligent
  Computing) from the 21st edition in 2026
- 'Recent editions held outside Korea in June or July: 2023 Fukuoka, 2024 Takamatsu, 2025 Phuket, 2026 Prague (as
  INTCOM)'
- Short paper (2 pages) or full paper (3 to 6 pages); camera-ready must be a Word file; at least one author must
  present in person
- Selected full papers are recommended to KSII TIIS (SCIE) and JICS (KCI) special issues
- Deadlines were extended by about one week in both 2025 and 2026; chairs are mostly from Korean universities, the
  program committee is international
