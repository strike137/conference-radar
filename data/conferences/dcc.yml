notes:
- Long-running international forum on data compression and related applications (source coding, image, video, genomic and text compression)
- Sponsored by the IEEE Signal Processing Society, the IEEE Information Theory Society and the University of Arizona
- Held every year at the Cliff Lodge convention center in Snowbird, Utah, USA, near Salt Lake City
- Proceedings in IEEE Xplore; papers up to 10 pages in total including references; accepted posters get a one-page summary in the proceedings
- Single-blind review; submissions are accepted either as papers (oral) or as posters
- CORE B (ICORE2026); CCF B
