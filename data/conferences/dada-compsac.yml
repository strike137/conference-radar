notes:
- Workshop of IEEE COMPSAC (IEEE Computer Society); 8th edition in 2026 in Madrid, 7th at COMPSAC 2025 in Toronto
- Covers applications of deep learning, LLMs and agentic AI to data-driven scientific and engineering problems
- Organized by Akbar Namin (Texas Tech University, USA)
- Not listed in the CORE portal; COMPSAC itself is CORE B
- Workshop papers are 6 pages (up to 2 extra pages at USD 125 each) and appear in the COMPSAC proceedings on IEEE Xplore
- Workshop deadlines are shared across all COMPSAC workshops; the 2027 workshop list (COMPSAC 2027 in Tokyo, July 13 to 16) was not yet published
