notes:
- Main annual conference of the Julia programming language community, held since 2014, with talks, workshops, minisymposia, posters and a hackathon
- Talk, workshop and poster proposals go through a call for proposals; speakers come from both academia and industry
- Presenters can submit a paper to the Proceedings of the JuliaCon Conferences (JCON, ISSN 2642-4029), a peer-reviewed open-access journal with Crossref DOIs and no fees
- JCON accepts a one page extended abstract or a 5 to 10 page paper, and only for JuliaCon talks, posters or similar contributions
- In person only in 2026; talks are livestreamed and recorded on the Julia Language YouTube channel
- Recent venues were Cambridge MA 2023, Eindhoven 2024, Pittsburgh 2025, Mainz 2026 and Tallinn 2027 (online in 2021 and 2022)
- Smaller JuliaCon Local events are also held (Eindhoven 2023, Paris 2025, Tokyo 2026)
- Not listed in CORE ICORE2026
