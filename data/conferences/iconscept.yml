notes:
- Organized by NIT Puducherry (Karaikal, India) with the IEEE Madras Section as technical sponsor
- 2026 is the 4th edition; the 2023, 2024 and 2025 editions were published in IEEE Xplore
- Six tracks (communication, microelectronics and VLSI, energy conservation, power systems and control, AI/ML/DL, data computing)
- Papers in IEEE double-column format via Microsoft CMT; similarity must stay within 15%
- The home page banner says 16 to 18 December 2026; the important dates and about pages say 17 to 18 December 2026
- Not ranked by CORE (ICORE2026); not in the CCF list
