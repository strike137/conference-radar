full_name: ACM International Workshop on Edge Systems, Analytics and Networking
type: workshop
tier: minor
areas: [systems, networking, ai]
region: europe
language: english
frequency: annual
organizer: ACM (co-located with EuroSys or MobiSys)
organizer_country: [international]
proceedings: ACM DL
archival: true
typical:
  deadline_months: [2, 3]
  conference_months: [4, 5, 6]
links:
  website: https://edge-sys.github.io/2026/
notes:
- Workshop on edge computing systems, edge AI and analytics, decentralized networking and IoT; running since 2018
- Co-located with ACM EuroSys from 2021 to 2025 (2021 online, 2022 Rennes, 2023 Rome, 2024 Athens, 2025 Rotterdam)
  and with ACM MobiSys 2026 in Cambridge, UK
- Short papers of up to 6 pages in ACM double-column format excluding references, single-blind review
- Accepted papers are published in the ACM Digital Library; one author must register and present
- Single submission deadline in February or March, workshop about one month after camera-ready
