notes:
- Chinese-organized conference on wireless communication, networking, IoT and vehicular communication
- Renamed over time; GCNIoT (2021), then CNIoT, International Conference on Green Communication, Network and Internet of Things (2022 to 2025), WCNIoT from 2026
- Held in a different Chinese city each year (Xiangtan 2022, Dali 2023, Guiyang 2024, Chongqing 2026)
- Accepted full papers published by IEEE and submitted to IEEE Xplore; the site states the 2021 to 2025 papers were indexed in EI Compendex and Scopus
- Each paper reviewed by two or three reviewers; abstract-only submissions for presentation without publication are also accepted
- Run through a conference secretariat (contact via a 163.com address); a minor venue with no CORE or CCF rank
- Not listed in ICORE2026; not on the CCF list
