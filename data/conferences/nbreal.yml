notes:
- Half-day workshop on responsible evaluation and alignment of LLMs for Nordic and Baltic languages
- First edition held on March 2, 2025 with NoDaLiDa/Baltic-HLT 2025 in Tallinn, Estonia
- Organized as part of the EU-funded TrustLLM project
- Double-blind review with three reviewers per paper
- "Acceptance rate: 78% (2025, 7 of 9 submissions)"
- Proceedings in the ACL Anthology (2025.nbreal-1), published by the University of Tartu Library
- The original workshop domain nbreal.xyz no longer hosts the workshop site
- Not listed in ICORE2026 and not on the CCF list
