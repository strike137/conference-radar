notes:
- Volunteer-run national Python developer conference in China, held by the PyChina community every year since 2011
- Talks only, no papers or proceedings; topics chosen through a call for talks (submission form) plus open source
  bazaar and hackathon side events
- Earlier editions ran in several cities at once (seven cities in December 2023); held in Shanghai only in 2024 and
  2025, Shanghai and Shenzhen in 2026
- 2025 and 2026 themes focused on Python in the AI era (agents, large models, data science)
