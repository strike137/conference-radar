notes:
- Biennial conference run by the Faculty of Electrical Engineering and Information Technology, University of Zilina, Slovakia, since 1995; 2026 was the 16th edition
- Broad electrical engineering scope; 2026 tracks were intelligent digital technologies and autonomous systems (networks, 5G/6G, AI, cyber security), sustainable energy and e-mobility, materials and biomedical engineering, and engineering education
- Held in Central Europe (Zilina 2026, Zakopane 2024, Krakow 2022, Mikulov 2018, High Tatras 2016); 2024 co-organized with Cracow University of Technology and the University of Catania
- Accepted and presented papers are submitted to IEEE Xplore; up to 6 pages in IEEE format, at least two reviewers per paper
- Usually held in May until 2024; 2026 moved to September
- Registration fee covers two papers per author
- Not listed in the CORE portal (ICORE2026)
