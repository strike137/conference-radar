id: icipmc
name: IEEE ICIPMC
full_name: IEEE International Conference on Image Processing and Media Computing
type: conference
tier: minor
areas: [vision]
region: china
language: english
frequency: annual
organizer: Host Chinese universities (Ningxia University in 2026; Northwestern Polytechnical University and Northwest University in earlier years) with IEEE co-sponsorship; secretariat contact at cbees.net
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
typical:
  deadline_months: [7]
  conference_months: [5, 6, 9]
links:
  website: http://www.icipmc.net/
notes:
- Held every year since 2022; 2026 is the 5th edition
- Held in Xi'an (2022 virtual, 2023, 2025), Hefei (2024) and Yinchuan (2026)
- Supported by the Shaanxi Society of Image and Graphics and the Shaanxi Computer Society
- Accepted papers that are registered and presented go to IEEE Xplore, stated as EI Compendex and Scopus indexed
- Papers reviewed by 2 to 3 committee members; abstract-only presentation without publication is also offered
- Smaller commercially organized conference with about 110 to 120 delegates per edition (2023 to 2025)
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
