notes:
- European forum on model-based engineering (MBE), held as part of STAF (Software Technologies, Applications and Foundations)
- Held in Europe (2023 Leicester, 2024 Enschede, 2025 Koblenz, 2026 Rennes)
- Two submission rounds, each with a minor or major revision cycle judged by the same reviewers
- Papers up to 14 pages in the JOT template; accepted papers published as platinum open-access articles in the Journal of Object Technology
- ICORE2026 rank B; not on the CCF 2026 list
- 23rd edition (2027) in Pisa, Italy, with STAF 2027; conference dates to be announced, deadlines published
