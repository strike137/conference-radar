id: cicn
name: IEEE CICN
full_name: IEEE International Conference on Computational Intelligence and Communication Networks
type: conference
tier: minor
areas: [ai, networking, communications]
region: asia-pacific
language: english
frequency: annual
organizer: Machine Intelligence Research Labs (MIR Labs) Gwalior with IETE Gwalior and the IEEE Madhya Pradesh Section; host
  university each year
organizer_country: [india]
proceedings: IEEE Xplore
fee: 150 USD IEEE member / 200 USD non-member author from outside India and the Philippines; 100 / 150 USD for Indian and
  Philippine authors (2026)
typical:
  deadline_months: [4]
  conference_months: [6, 12]
links:
  website: https://www.cicn.in/
notes:
- Run by MIR Labs Gwalior (general chair G. S. Tomar) together with IETE Gwalior and the IEEE Madhya Pradesh Section; sister
  conference of CSNT from the same organizers
- Held since 2009 (as CICSyN, CICN from 2010), mostly in India; recent editions in Bangkok (Dec 2023), Indore (Dec 2024),
  NIT Goa (Dec 2025) and Philippine Women's University, Manila (Jun 2026, hybrid)
- Proceedings published through IEEE Conference Publishing Services; the site states all previous proceedings are in IEEE
  Xplore
- Full papers 4 to 8 pages in IEEE two-column format (6 pages included in the fee, 10 USD per extra page), submission via
  EDAS
- The site claims an acceptance rate below 25%
- At least one author must register and present each paper
- Not listed in ICORE2026 or the CCF list
