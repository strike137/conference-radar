notes:
- Phased array systems and technology symposium for radar, communications and electronic support applications, with military, commercial and scientific papers
- Primary sponsor is the IEEE Boston Section; the steering committee is mostly from MIT Lincoln Laboratory, MITRE and US defense companies
- 2026 is the 10th edition; earlier symposia were 1996 (Boston), 2000 (Dana Point, California) and 2003, 2010, 2013, 2016, 2019, 2022, 2024 near Boston
- Was held every three years until 2022; the official program says 2024 began an increased cadence, so it is now every two years
- Final papers up to 8 pages excluding references and acknowledgments, extra pages 200 USD each; camera-ready PDFs must be IEEE Xplore compatible via IEEE PDF eXpress
- More than 140 papers in 2026, with plenary, oral and poster sessions, tutorials, a student paper competition and a large industry exhibition
- Antenna and radar engineering venue outside the usual CS rankings, not listed in ICORE2026 or the CCF 2026 list
