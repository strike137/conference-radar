notes:
- IFIP TC6 flagship networking conference since 2000; tracks include architectures, modeling and operation, security
  and privacy, wireless
- Double-blind review; 9 pages including references and appendix
- Almost always in Europe, late May or June (2027 host not yet announced)
- Top papers fast-tracked to an Elsevier Computer Communications special issue; in-person presentation required
