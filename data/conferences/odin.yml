notes:
- MICCAI satellite workshop on oral, dental and maxillofacial image analysis (CBCT, intra-oral scans, dental radiographs)
- First held in 2025; 2026 was the 2nd edition
- Workshop and challenge papers published together in Springer LNCS (2025 -> LNCS 16473, with the ToothFairy and STSR challenges)
- Papers up to 8 pages plus 2 pages of references in LNCS format, OpenReview submission
- Hosts dental challenges (ToothFairy3 and STSR in 2025; ToothFairy4, Bite2Text and STS in 2026) with a separate, later challenge paper deadline
- Organizers from University of Modena and Reggio Emilia, Digital Research Center of Sfax, Hangzhou Dianzi University and University Grenoble Alpes
- Location follows MICCAI (Daejeon 2025, Strasbourg 2026)
- Not listed in CORE ICORE2026 or the CCF 2026 list
