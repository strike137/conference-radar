notes:
- 6th edition held at IEEE GLOBECOM 2025 in Taipei (half day on 8 December and full day on 12 December)
- Endorsed by the one6G Association; general chairs include Aryan Kaushik, Marco Di Renzo, Carlo Fischione and
  Kai-Kit Wong
- Topics include ISAC, RIS and holographic MIMO, integrated terrestrial and non-terrestrial networks, NGMA,
  THz connectivity, semantic communication and AI for 6G
- Accepted and presented papers go into the GLOBECOM workshop proceedings in IEEE Xplore; submissions via EDAS
- Not listed in ICORE2026
