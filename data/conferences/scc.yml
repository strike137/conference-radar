notes:
- Organized by the Information Technology Society (ITG) of the German VDE; IEEE and IEEE ComSoc are technical
  co-sponsors
- Held in Germany (14th edition at KIT, Karlsruhe in 2025; 15th at Universität Bremen in 2027); usually every two years
- Full papers up to 6 pages, peer reviewed; proceedings published in IEEE Xplore (papers not presented may be excluded)
- Late-submission posters with a one-page abstract are not published
- Not ranked in CORE (ICORE2026)
