notes:
- Romanian formal methods symposium, rotating among the University of Bucharest, Babes-Bolyai University Cluj-Napoca, Alexandru Ioan Cuza University Iasi and West University of Timisoara
- Held in Romania every year since 2017 (10th edition in 2026); 2020 and 2021 were virtual
- FROM 2026 co-located with SYNASC 2026 in Timisoara; submissions go through the SYNASC EasyChair as the FROM track
- Research papers (up to 16 pages) in EPTCS (FROM 2025 -> EPTCS 427, FROM 2026 -> EPTCS 452); extended abstracts up to 8 pages also accepted
- Selected papers invited to a journal (JLAMP planned for 2026)
- "Registration fee: 300 EUR (2026)"
- Not listed in ICORE2026 or the CCF list
