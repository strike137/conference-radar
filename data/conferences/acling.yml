notes:
- Formerly the International Conference on Arabic Computational Linguistics; now covers computational linguistics, NLP and language-model applications in any language, including Arabic
- Conference chairs from The British University in Dubai and New Giza University (2026)
- 2026 edition (8th) is a multi-site hybrid event with hubs at BUiD in Dubai and Jadara University in Irbid, Jordan, plus online presentation
- Proceedings in Elsevier Procedia Computer Science (open access, Scopus indexed); earlier volumes 117 (2017), 142 (2018), 189 (2021), 244 (2024) and 275 (2025 edition)
- Double-blind review on a rolling basis via EasyChair; 3 to 8 pages, up to 2 extra pages for a fee
- Extended versions can go to MDPI special issues (Computation, Cryptography, Computers) with an APC discount
- Very short gap between deadline and conference (deadline 3 weeks before the event in 2026)
- Not listed in the CORE ICORE2026 portal
