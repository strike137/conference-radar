notes:
- Ibero-American congress on smart cities, held every year since 2018; 9th edition in 2026
- Topics include sustainability, mobility, energy efficiency, social governance, AI, urban informatics and big data, sensors and IoT
- Papers of up to 15 pages in Springer format, in Spanish, Portuguese or English
- All accepted papers appear in a congress proceedings book with ISBN; selected English papers go to Springer CCIS ("Smart Cities"), Springer Proceedings in Energy or MDPI Proceedings
- Selected authors are invited to extend their papers for journal special issues
- Hybrid (in person and online); host city rotates in Latin America (Cuenca 2022, Mexico City and Cuernavaca 2023, San Carlos 2024, Puebla 2025, Barranquilla 2026)
- "Author registration fee: 200 EUR per paper, 50 EUR per poster (2026)"
- Not listed in CORE ICORE2026
