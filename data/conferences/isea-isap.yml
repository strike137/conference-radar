id: isea-isap
name: ISEA-ISAP
full_name: ISEA International Conference on Security and Privacy
type: conference
tier: minor
areas: [security, crypto]
region: south-asia
language: english
frequency: irregular
organizer: ISEA project (Information Security Education and Awareness), MeitY, Government of India; hosted by a different IIT or NIT each edition
organizer_country: [india]
proceedings: Springer Nature proceedings volume (CCIS format, 2026-27 edition); IEEE Xplore (Jan 2026 edition)
archival: true
typical:
  deadline_months: [7, 8]
  conference_months: [12, 1]
links:
  website: https://iitjammu.ac.in/isea-isap2027/
notes:
- Sponsored by the ISEA project of the Ministry of Electronics and Information Technology (MeitY), India
- Held in India at a different host each time (NIT Surat 2017, Jaipur 2019, IIT Guwahati 2020, IIT (ISM) Dhanbad 2021,
  IIT Madras Jan 2026, IIT Jammu Dec 2026)
- Irregular schedule; the 6th edition (IIT Jammu, Dec 2026) is named ISEA-ISAP 2027 or 2026-27 on its site
- 2026-27 edition uses Springer CCIS format; selected papers published by Springer Nature, double-blind review,
  full papers 10-15 pages
- Jan 2026 edition (IIT Madras) used IEEE format with proceedings in IEEE Xplore
- "Low registration fee (2026-27): INR 1000 students, INR 2000 authors and academia, INR 5000 industry"
- Not listed in CORE ICORE2026 or the CCF list
