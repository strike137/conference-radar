notes:
- Workshop on computational and qualitative analysis of medical and healthcare language, aimed at bridging NLP with the humanities and social sciences of medicine
- First edition held with EACL 2026 in Rabat, Morocco
- Long (8 pages) and short (4 pages) papers, double-blind review via OpenReview; accepts ARR-reviewed papers
- Proceedings in the ACL Anthology (29 entries in 2026)
- Supported by the ERC-funded ActDisease project at Uppsala University
- Not listed in ICORE2026 and not on the CCF list
