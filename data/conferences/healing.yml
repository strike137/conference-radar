notes:
- Workshop on quantitative and qualitative analysis of medical and healthcare language, bridging NLP with the humanities and social sciences
- 1st edition was a half-day workshop at EACL 2026 in Rabat, Morocco
- Full papers up to 8 pages and short papers up to 4 pages; double-blind review via OpenReview, ARR commitments accepted
- Proceedings in the ACL Anthology (2026.healing-1, 28 papers)
- Supported by the ERC-funded ActDisease project at Uppsala University
- Not listed in the CORE portal (ICORE2026)
