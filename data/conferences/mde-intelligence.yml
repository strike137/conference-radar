links:
  website: https://mde-intelligence.github.io/
notes:
  - Workshop on AI for model-driven engineering (LLMs, generative AI, ML for modeling) and MDE for AI systems
  - Co-located with the MODELS conference every year since 2019, so it moves with MODELS (2025 online for Grand Rapids, 2026 Malaga)
  - Accepted papers go into the joint MODELS workshop proceedings (IEEE in 2025, ACM in 2026)
  - Research papers up to 10 pages and extended abstracts up to 5 pages, ACM format; single-blind review with at least 3 reviewers
  - Also runs a lightning talk session with a late proposal deadline (end of September)
  - 2026 special theme on assessing the performance of MDE Intelligence approaches
  - Not listed in the CORE portal (ICORE2026)
