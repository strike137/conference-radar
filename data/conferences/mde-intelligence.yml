notes:
- One-day MODELS workshop on AI for model-driven engineering and model-driven engineering for AI
- Held every year since 2019; 2026 was the 8th edition (Malaga, Spain)
- Follows the MODELS venue, which rotates between Europe and North America
- 2026 organizers from TU Wien (Austria), University of Ottawa (Canada) and RWTH Aachen (Germany)
- Research papers up to 10 pages and extended abstracts up to 5 pages including references, ACM format, single-blind review by at least three PC members
- Accepted papers appear in the MODELS joint workshop proceedings published by ACM; extended abstracts are covered by an agreement with MODELS and pay no publication fee
- Also runs a lightning talk session with proposals sent by email
- 2026 special theme was assessing the performance of MDE Intelligence approaches
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
