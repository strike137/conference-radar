notes:
- Small European workshop on optical access networks (PON, fiber-wireless, fiber sensing, PICs, optical wireless) bringing together academia, industry and operators
- Rotates around Europe; editions in Moscow (2010), Budapest, St. Petersburg, Almaty, Brno, Lisbon, Munich, Sarajevo, Ljubljana (2021), Valencia (2022), Ghent (2023), Athens (2024), Szczecin (2025) and Pisa (2026)
- Steering committee from Slovenia, Czech Republic, Bosnia and Herzegovina, Poland, Italy, Taiwan and the USA; 2026 general chair from BH Telecom and University of Sarajevo
- Accepted papers are submitted for inclusion in IEEE Xplore; the site says all previous proceedings are indexed in Web of Science and Scopus
- Full papers up to 6 pages in IEEE format (4 recommended), one-page short reports, or presentation only; submission and registration via EDAS
- Fiber and Integrated Optics publishes a special issue based on presented papers
- Despite the name it is a standalone event, not co-located with a larger conference
- Not listed in ICORE2026 or the CCF 2026 list
