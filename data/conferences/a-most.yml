notes:
- One-day workshop on model-based testing (models, test generation, tools, industrial experience), co-located with IEEE ICST
- 21st edition in 2025; held with ICST in Naples 2025, Toronto 2024, Dublin 2023 and online 2022
- Full papers up to 8 pages and short experience or position papers up to 4 pages (IEEE two-column, excluding references); 2-page journal-first summaries also accepted
- Each paper reviewed by at least three PC members; accepted papers published in IEEE Xplore
- Organizers based in Austria and Sweden (Silicon Austria Labs, Mälardalen University, TU Wien)
- Not among the ICST 2026 workshops; no later edition announced as of 2026-10-17
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
