notes:
- Half-day workshop on graph data for LLM agents and agents for graph data management, held with VLDB 2026 in Boston
- 3rd edition in 2026; also written Agents+Graphs on the VLDB site
- Survey, regular research, vision, demo and extended abstract papers; short up to 6 pages, long up to 12 pages including bibliography; single-blind review on CMT
- All accepted papers are published in the VLDB workshop proceedings; in-person presentation required
- 4 papers plus a workshop overview in the VLDB 2026 workshop proceedings
- Not listed in CORE ICORE2026 or in the CCF 2026 list
