region: asia-pacific
language: english
frequency: annual
organizer: IEEJ Industry Applications Society
organizer_country: [japan]
proceedings: None (participants only)
archival: false
typical:
  deadline_months: [11, 12]
  conference_months: [3]
links:
  website: http://www2.iee.or.jp/~diic/samcon/
notes:
  - Yearly international workshop of the IEEJ Industry Applications Society (D部門), held since 2015
  - Topics are sensing, actuators and motor drives, motion control, robotics and mechatronics, and optimization
  - Papers in English are reviewed; oral papers 4 to 6 pages and poster papers 1 to 6 pages in the IEEJ format, submitted through EDAS
  - Copyright is transferred to IEEJ; proceedings are made available to registrants through the registration page
  - Selected papers are considered for a focused issue of the IEEJ Journal of Industry Applications; JIA authors can also present their published papers
  - Usually held in Japan in March (Kyoto 2024, Matsue 2025, Takayama 2027), with editions in China (2023) and Korea (2026)
