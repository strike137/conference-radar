notes:
- Community cybersecurity conference in Lima, Peru, organized by the CiberSecUNI community
- One day of talks plus a CTF and hacking workshops and trainings; talks mostly in Spanish
- First edition in 2024; 2025 edition (theme "Roots of Hack") reported 300+ attendees
- 2026 edition held at NOS PUCP in San Isidro, Lima; tickets via Eventbrite, talks submitted via Sessionize
- Free event per the call for speakers; no travel support for speakers
- Talks only, no proceedings
