notes:
- Annual DBSJ forum co-organized with IEICE DE and IPSJ DBS; Japan's main meeting for databases, data engineering
  and web/IR, usually 400+ presentations
- 'Serial hybrid format: online oral sessions first, then onsite interactive (poster) sessions, tutorials and the
  DBSJ hour a few days later'
- In principle every presentation is an online oral talk plus an onsite interactive presentation; interactive-only
  submissions are not accepted; long (about 8 pages) or short (about 4 pages) papers
- Onsite venue rotates (2025 Fukuoka, 2026 Kobe); mostly student presentations in Japanese
