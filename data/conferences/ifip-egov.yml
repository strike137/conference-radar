notes:
- Merger of the IFIP WG 8.5 EGOV (Electronic Government) and ePart (Electronic Participation) conferences and CeDEM (E-Democracy
  and Open Government)
- Topics include digital and open government, e-participation, AI in government, GovTech and algorithmic governance
- Completed research papers appear in two Springer LNCS volumes (2026 -> EGOV LNCS 16933 and ePart LNCS 16923)
- Ongoing research, workshop and poster papers have a separate volume (2025 -> CEUR-WS Vol-4127)
- Research paper submissions are anonymous; practitioner, workshop and poster submissions are not
- PhD Colloquium with a limited number of PhD bursaries and a Junior Faculty School the day before the main conference
- Held in Europe every year (Granada 2021, Linkoping 2022, Budapest 2023, Leuven/Ghent 2024, Krems 2025, Athens 2026)
- Conference pages are hosted by the Digital Government Society (DGS), which also runs the sister conference dg.o
- Not listed in ICORE2026; not on the CCF 2026 list
