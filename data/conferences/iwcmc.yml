id: iwcmc
name: IWCMC
full_name: International Wireless Communications and Mobile Computing Conference
type: conference
tier: major
areas: [communications, networking]
region: worldwide
language: english
frequency: annual
organizer: IWCMC steering committee, with IEEE and IEEE ComSoc as technical sponsors
organizer_country: [international]
proceedings: IEEE Xplore
rank:
  core: B
fee: 750 USD IEEE member / 850 USD non-member, early author registration (2026)
typical:
  deadline_months: [1, 2]
  conference_months: [5, 6]
links:
  website: https://iwcmc.net/
notes:
- Large multi-symposium wireless and mobile computing conference with many co-located workshops; 6-page papers
- Accepted papers are submitted to IEEE Xplore; selected papers are invited to special issues of WCMC (Wiley),
  IJSNet, IJAACS, KSII TIIS and Peer-to-Peer Networking and Applications
- Held in a different country each year (Cyprus 2024, Abu Dhabi 2025, Shanghai 2026, Barcelona 2027)
- Submission deadline is often extended (2026 -> moved from Jan 15 to Feb 26)
- 'Not in the CCF 2026 list (the CCF C entry "Wireless Communications and Mobile Computing" is the Wiley journal)'
- Each accepted paper needs one author registration at the full rate (students included); a second paper gets 50% off
