notes:
- Regional computing education conference of the CCSC for the northeastern US, held every spring since 1996
- Run on behalf of CCSC in cooperation with ACM SIGCSE
- Papers are double-anonymous reviewed by at least 3 reviewers, in two tracks (CS education and pedagogy; demo and applied computing)
- Proceedings appear as an issue of the Journal of Computing Sciences in Colleges, indexed in the ACM Digital Library
- Also panels, tutorials, workshops, faculty posters, lightning talks, undergraduate posters and a programming contest
- Not listed in ICORE2026; not on the CCF list
