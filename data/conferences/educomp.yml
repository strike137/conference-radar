notes:
- Annual Brazilian symposium on computing education run by the Brazilian Computer Society (SBC) through its special
  committee CEduComp; 6th edition in 2026
- Full paper tracks for research papers, experience reports, curricula, and educational resources and environments,
  plus an ideas lab, thematic panels, short courses and a thesis workshop and contest
- Accepted papers published in SBC OpenLib (SOL); at least one author must register and present orally, plus a
  publication fee of R$ 80 (2026)
- Editions 2021 to 2024 were online; first in-person edition in 2025 (Juiz de Fora); 2026 hosted by UFMS in Campo
  Grande
- Held together with SBC-EB (Brazilian Symposium on Computing in Basic Education)
- Not listed in CORE ICORE2026
