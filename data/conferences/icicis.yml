notes:
- Organized by the Faculty of Computer and Information Sciences, Ain Shams University, Cairo, Egypt
- Held every two years in Cairo (2015, 2017, 2019, 2021, 2023, 2025); the 2023 edition was the 11th
- Accepted papers are published in the conference proceedings in IEEE Xplore and indexed in Scopus
- Tracks cover AI and data visualization, robotics and embedded systems, networks, forensics and cyber security,
  IoT, data science, bioinformatics and health informatics, and software engineering
- Papers of 6 to 8 pages in IEEE format, double blind, submitted via Microsoft CMT; two notification rounds
- Not listed in CORE ICORE2026 or the CCF list
