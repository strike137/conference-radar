notes:
- New EAI conference; the first edition is in 2027 in Wrexham, UK, with local chairs from Wrexham University
- Covers generative AI for 5G/6G mobile systems, IoT and cyber-physical applications, and software-defined and autonomous networks
- Papers go to the Springer EAI SICC book series; extended versions can go to an EAI Endorsed Transactions journal
- Hybrid conference
- Not the same venue as GenAINet, the IEEE INFOCOM workshop on generative AI for networking
- Not listed in ICORE2026
