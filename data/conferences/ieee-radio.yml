id: ieee-radio
name: IEEE RADIO
full_name: IEEE Radio and Antenna Days of the Indian Ocean
type: conference
tier: minor
areas: [communications]
region: africa
language: english
frequency: irregular
organizer: Radio Society (Mauritius), with IEEE technical sponsorship
organizer_country: [other]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [6]
  conference_months: [10]
links:
  website: http://www.radiosociety.org/radio2026/
notes:
  - Also called the IEEE RADIO International Conference; run by the Radio Society of Mauritius
  - Covers radio frequency engineering broadly, including radio waves, antennas, propagation and electromagnetic compatibility
  - Supporters on the 2026 site include IEEE AP-S, MTT-S, EMCS, GRSS, AESS and URSI
  - Held around the Indian Ocean (Flic-en-Flac, Mauritius in 2025; Cape Town, South Africa in 2026)
  - Full papers of 2 to 4 pages (PDF eXpress compliant); accepted and presented papers in IEEE Xplore
  - Three Best Student Paper Awards, a Young Scientist Award and an Industrial Engineering Paper Award
  - Small venue, conference language English
  - Not listed in ICORE2026 or the CCF list
