id: loresmt
name: LoResMT
full_name: Workshop on Technologies for Machine Translation of Low-Resource Languages
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizing committee (Atul Kr. Ojha, Chao-Hong Liu, Ekaterina Vylomova, Flammie Pirinen, Jonathan Washington, Nathaniel Oco, Xiaobing Zhao); co-located with ACL-family and MT conferences
organizer_country: [international]
proceedings: ACL Anthology
archival: true
links:
  website: https://www.loresmt.org/
notes:
- Workshop on machine translation and supporting NLP tools (tokenizers, segmenters, morphology, corpora) for low-resource languages
- Held every year since 2018, each time with a different host conference (AMTA 2018, MT Summit 2019, AACL-IJCNLP 2020, AMTA 2021, COLING 2022, EACL 2023, ACL 2024, NAACL 2025, EACL 2026)
- Ninth edition held at EACL 2026 in Rabat, Morocco, on March 28, 2026; tenth edition confirmed at COLING 2027 in Macau (May 9-14, 2027)
- Proceedings in the ACL Anthology (24 papers in 2026, 17 in 2025, 20 in 2024, not counting front matter)
- Research, review and position papers of 4 to 8 pages and system demonstration papers up to 4 pages; double-blind review via OpenReview; ARR commitment also accepted
- 2026 ran a Turkic languages translation shared task
- Not ranked in ICORE2026 and not on the CCF list
