notes:
- INSTICC conference on operations research, optimization and decision support for enterprise systems; held since 2012
- For 2027 the proceedings move to a Springer CCIS book; editions up to 2026 were published by SCITEPRESS with selected extended papers in Springer CCIS
- Best papers invited to a special issue of INFOR (Information Systems and Operational Research)
- Two submission stages plus an abstracts track; all deadlines AoE
- 2027 edition co-located with MODELSWARD, ICISSP, ICPRAM and BIOSTEC in Valletta; registration gives free access to them
- Held in southern Europe (Lisbon 2023, Rome 2024, Porto 2025, Marbella 2026); remote presentation allowed in exceptional cases
- CORE C in ICORE2026
