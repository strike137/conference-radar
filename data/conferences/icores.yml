id: icores
name: ICORES
full_name: International Conference on Operations Research and Enterprise Systems
type: conference
tier: minor
areas: [general, ai]
region: europe
language: english
frequency: annual
organizer: INSTICC (Institute for Systems and Technologies of Information, Control and Communication)
organizer_country: [europe]
proceedings: SCITEPRESS
archival: true
rank:
  core: C
fee: 620 EUR non-member, 565 EUR INSTICC member (2027, early speaker rate, lunches included; late 725 / 660 EUR)
typical:
  deadline_months: [9, 10, 11]
  conference_months: [2, 3]
links:
  website: https://icores.scitevents.org/
notes:
- Organized by INSTICC; all papers presented at the venue go to the SCITEPRESS Digital Library
- For 2027 the site says the proceedings will be published by Springer in a CCIS series book; in 2026 only a short
  list of revised and extended papers went to a Springer CCIS book
- Selected best papers invited to a special issue of the journal INFOR (Information Systems and Operational Research)
- Operations research venue (methodologies and applications), so only partly in the EECS scope of this list
- CORE C (ICORE2026, field of research 4602 Artificial intelligence); regarded as a minor venue
- Two submission stages plus late-breaking papers and an abstracts track that is not published; remote presentation
  allowed only exceptionally
- Held in European tourist cities (Lisbon 2023, Rome 2024, Porto 2025, Marbella 2026, Valletta 2027) and co-located
  with other INSTICC conferences (MODELSWARD, ICISSP, ICPRAM and BIOSTEC in 2027), so registration is expensive
- 2027 is the 16th edition
