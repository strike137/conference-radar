notes:
- International conference on information display technology, sponsored by the Institute of Image Information and Television Engineers (ITE) and SID
- Organized as several technical workshops (each with its own sessions) plus topical sessions; the 3DSA conference runs as a topical session
- Submissions are technical summaries reviewed for acceptance; separate late-news paper call in September
- Proceedings go to attendees at the conference and become an online open-access archive with DOIs a few months later
- I-DEMO hands-on demonstrations and an exhibition run alongside the talks
- Held every December in a Japanese city (Niigata 2023, Sapporo 2024, Hiroshima 2025, Hamamatsu 2026); 33rd edition in 2026
- Not ranked by CORE (not listed in ICORE2026) or CCF
