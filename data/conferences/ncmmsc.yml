notes:
- Main Chinese conference on speech science and speech technology, held since 1990; also the annual meeting of the
  CCF and CIPS speech technical committees
- Listed as CCF C in the 2026 CCF list (new in 2026)
- Accepts English and Chinese papers; only accepted English full papers (12 to 15 pages) in the Springer CCIS
  proceedings count as formally published, Chinese papers may be recommended to Chinese journals
- Double-blind review via Microsoft CMT; also accepts short papers and late-breaking results
- '2026: co-located with NLPCC 2026 and AACL 2026 in Hengqin, Zhuhai'
- Held in a different Chinese city each year (Zhenjiang 2025, Zhuhai 2026)
