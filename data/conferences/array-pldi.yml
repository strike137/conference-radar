notes:
- One-day workshop co-located with ACM PLDI, moving with it each year
- Topics are array and tensor languages, semantics, type systems, verification, compilation and tile-oriented programming models
- Two categories, full papers (up to 12 pages, ACM SIGPLAN format) and extended abstracts (up to 2 pages)
- Full papers are reviewed and published in the ACM Digital Library; extended abstracts are lightly reviewed and not published
- Not to be confused with IEEE ARRAY (phased array systems)
- Not listed in the CORE ICORE2026 portal or the CCF list
