notes:
- Workshop on ML for genomics and biology, with a focus on target identification and drug discovery, held at ICLR
- The 2026 edition was the 3rd MLGenX, held on the last workshop day of ICLR 2026 in Rio de Janeiro
- Non-archival; papers under review elsewhere are allowed, and accepted papers may later be published at conferences or journals
- Double-blind review on OpenReview with the ICLR template; 2026 had a main track, a lab-in-the-loop special track, a tiny papers track (up to 4 pages) and an AI-generated papers track
- Top contributions can get a fast-track review at Nature Biotechnology (optional)
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
