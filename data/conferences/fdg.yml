notes:
- Interdisciplinary games research venue (game AI, procedural content generation, game analytics, design, criticism, serious games)
- Double-anonymised review with three reviews, a meta-review and an author response
- Full papers up to 10 pages in ACM SIGCONF format; late-breaking short papers also go in the proceedings; abstract track is not published
- Proceedings in the ACM Digital Library
- 2026 hosted by the Royal Danish Academy in Copenhagen with hybrid sessions
- All deadlines 23:59 AoE with no extensions (2026)
- CORE ICORE2026 rank C; not in the CCF 2026 list
