notes:
- Run by SASDG, a California nonprofit founded in 2008 as the organizational home of FDG; host chosen by its steering committee
- Interdisciplinary games research conference (computer science, engineering, humanities, social sciences, design) with a Game AI track
- Full papers up to ten pages in ACM SIGCONF format in 2026; 2027 switches to the single-column ACM Primary Article template, generally up to 16 pages excluding references (desk reject above 24)
- Double-anonymised review (2026 had three reviews, a meta-review and an author response)
- Proceedings in the ACM Digital Library; abstract-only submissions are presented but not published
- Abstract (metadata) registration one to ten days before the full paper deadline; separate later deadline for late-breaking short papers, games/demos and doctoral consortium
- Hybrid sessions allow remote presentations (2026)
- CORE ICORE2026 rank C; not on the CCF list
