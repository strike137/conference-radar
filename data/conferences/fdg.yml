notes:
- Run by SASDG, a California nonprofit founded in 2008 as the organizational home of FDG; host chosen by its steering committee
- Interdisciplinary games research conference (computer science, engineering, humanities, social sciences, design) with a Game AI track
- Full papers up to ten pages in ACM SIGCONF format; double-anonymised review with three reviews, a meta-review and an author response
- Proceedings in the ACM Digital Library; abstract-only submissions are presented but not published
- Abstract registration about ten days before the full paper deadline; separate later deadline for late-breaking short papers, games/demos and doctoral consortium
- Hybrid sessions allow remote presentations (2026)
- CORE ICORE2026 rank C; not on the CCF list
