notes:
- ACM SIGIR conference on foundational and theoretical IR (models of relevance, ranking, representation, evaluation);
  formerly the ACM SIGIR International Conference on the Theory of Information Retrieval, renamed in 2025
- One-day conference held the day after SIGIR at the same venue, so it moves with SIGIR (Padua 2025, Melbourne 2026)
- Proceedings in ACM DL; 2 to 9 pages plus references, length judged against contribution; lightweight double-blind
  review on OpenReview (2026)
- Accepts SIGIR Revise-and-Resubmit submissions from papers rejected at the SIGIR full and short paper tracks of the
  same year
- Experimental results are not required; purely theoretical and perspective papers are welcome
- All accepted papers are presented as posters, with a selection also given oral slots (2026)
- At least one author per accepted paper must register for ICTIR; registration is a flat add-on to SIGIR registration
