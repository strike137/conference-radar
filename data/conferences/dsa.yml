notes:
- Formed in 2017 by merging TSA (Trustworthy Systems and Their Applications) and DCIT (Dependable Computing and
  Internet of Things); sister venue of QRS, both hosted on techconf.org with W. Eric Wong as steering committee chair
- IEEE CPS proceedings in IEEE Xplore, submitted to Ei Compendex and Scopus; extended versions of top papers invited
  to SCI journal special issues
- Mostly held in China (Yinchuan 2021, Urumqi 2022, Suzhou 2024, Xiamen 2026) with editions in Tokyo (2023) and
  Sharjah, UAE (2025)
- Regular papers 12 pages, short papers 10; also fast abstracts, industry track and workshops
- In-person presentation by an author is required for the paper to appear in IEEE Xplore
- The 2025 paper deadline was extended to 2025-09-30; not listed in ICORE2026
