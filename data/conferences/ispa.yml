notes:
- Held annually since 2003; 23rd edition in 2025
- 2024 (Kaifeng) and 2025 (Shenyang) editions ran inside the IEEE AI for Science Congress together with BDCloud,
  SocialCom, SustainCom and SpaCCS (a security and privacy conference)
- CCF C and CORE C; has a security and blockchain track
- 8 pages IEEE CS format for regular papers, 6 for short/workshop papers; submission via EDAS
- 2026 (24th) edition listed on WikiCFP by the organizer account for Kuala Lumpur, Malaysia with a 2026-09-30 deadline;
  the official site was unreachable when checked
