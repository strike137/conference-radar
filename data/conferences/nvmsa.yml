notes:
- Small symposium on non-volatile memory systems and emerging memory technologies, from devices and circuits to architecture, storage software and applications
- Held each year together with IEEE RTCSA, sharing keynotes and venue
- Accepted papers are submitted to IEEE Xplore and indexed by EI; papers not presented in person are excluded from Xplore
- Regular papers up to 6 pages in IEEE two-column format; single-blind review; research and industry track papers plus a 2-page poster track
- Selected papers invited to fast-track extended versions in IEEE TCSAI or ACM Transactions on Storage (2026)
- Deadlines have been extended by about two to four weeks in recent years (2025, 2026)
- Rotates within Asia (Taipei 2022, Niigata 2023, Sokcho 2024, Singapore 2025, Qingdao 2026; 2021 was virtual)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
