notes:
- Annual national high performance computing conference of the China Computer Federation (CCF), run by its HPC
  technical committee; 2026 is the 22nd edition
- Large event with 20+ invited academicians, 40+ themed forums, an exhibition and the PAC national parallel
  application challenge final; over 3,300 registered attendees in 2025, when it ran alongside the WEC 2025 World
  Computing Expo
- Accepts Chinese and English papers; Chinese papers are submitted via EasyChair and accepted ones are recommended to
  Chinese journals such as Journal of Computer Research and Development and Chinese Journal of Computers
- English papers are submitted directly to a special issue of the CCF Transactions on High Performance Computing
  (CCF THPC) journal; there is no conference proceedings volume
- Held in a different Chinese city each year (Ordos 2025, Shenzhen 2026)
- Not listed in the CORE ICORE2026 portal or the CCF list
