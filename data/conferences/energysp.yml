notes:
- Interdisciplinary workshop between the energy systems and security/privacy communities (ACM SIGEnergy and SIGSAC)
- 2026 CFP says the venue will rotate between ACM e-Energy and ACM AsiaCCS; so far all editions were co-located with ACM e-Energy (Singapore 2024, Rotterdam 2025, Banff 2026)
- Papers appear in the ACM Digital Library as part of the host conference proceedings (ACM e-Energy '26 in 2026)
- Short papers of 4 to 6 pages in ACM double-column format plus unlimited references and appendices
- Submission is not anonymous; position and SoK papers welcome
- Small one-afternoon program with oral, lightning talk and poster sessions (about 18 papers in 2026)
