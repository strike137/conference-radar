id: excv
name: eXCV
full_name: Workshop on Explainable Computer Vision
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizing committee (MPI for Informatics, TUM and Helmholtz Munich, TU Darmstadt, Telecom Paris)
organizer_country: [europe]
proceedings: ICCV Workshops proceedings (CVF Open Access) or ECCV Workshops proceedings, proceedings track only
archival: true
typical:
  deadline_months: [6, 7]
  conference_months: [9, 10]
links:
  website: https://excv-workshop.github.io/
notes:
- Workshop on explainable AI (XAI) for computer vision, with a new sub-theme each year (foundation models in 2026)
- Held with ECCV 2024 (Milan), ICCV 2025 (Honolulu, "Quo Vadis?") and ECCV 2026 (3rd edition, Malmo)
- Proceedings track papers (4 to 14 pages in 2026, incl. position papers) go into the host conference workshop proceedings
- Nectar track (non-archival) for work already published at major CV and ML venues
- Different from the CVPR XAI4CV workshop
- Not listed in ICORE2026 or the CCF list
