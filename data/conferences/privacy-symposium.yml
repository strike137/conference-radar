links:
  website: https://privacysymposium.org/
notes:
- Large policy and practice conference on data protection, data governance and regulatory compliance with a peer reviewed scientific paper track
- Held every year at Ca' Foscari University in Venice, Italy since 2022; one week between April and June (April 2023, June 2024, May 2025, April 2026)
- Co-organized with the Council of Europe Data Protection Unit, ECCP, the Italian Institute for Privacy, ELSA and others; secretariat by the Swiss foundation Mandat International
- Speakers are mostly data protection authorities, regulators and practitioners (over 400 speakers in 2026)
- Papers up to 15 pages in LNCS format via EasyChair; three reviews each; multidisciplinary legal, technical and societal work welcome
- Accepted papers appear in a Springer proceedings book (Privacy Symposium 2022 to 2025 volumes on SpringerLink)
- Participation must be self-funded
