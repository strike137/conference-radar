notes:
- Workshop co-located with ESORICS; 1st edition in 2026 in Rome
- "Scope: security of AI-based cybersecurity systems in real deployments, and AI for security under operational
  constraints; industry and applied work encouraged"
- Full papers (up to 12 pages, 16 in camera-ready) go into the Springer LNCS ESORICS workshop proceedings
- Non-archival track of up to 6 pages for work in progress, experience reports and negative results, not in the
  proceedings
- Double-blind review with at least two reviewers; two submission rounds in 2026
- 2026 program had 7 short talks (10 minutes each), a keynote shared with HumSec and a panel
