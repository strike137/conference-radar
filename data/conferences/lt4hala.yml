id: lt4hala
name: LT4HALA
full_name: Workshop on Language Technologies for Historical and Ancient Languages
type: workshop
tier: minor
areas: [nlp, ai]
region: europe
language: english
frequency: biennial
organizer: CIRCSE Research Centre, Università Cattolica del Sacro Cuore di Milano (Marco Passarotti, Rachele Sprugnoli); co-located with LREC
organizer_country: [europe]
proceedings: ELRA LREC workshop proceedings (ACL Anthology)
archival: true
typical:
  deadline_months: [2]
  conference_months: [5, 6]
links:
  website: https://circse.github.io/LT4HALA/2026/
notes:
- One-day workshop on NLP for historical and ancient languages (Latin, Ancient Greek, Ancient Chinese, cuneiform and
  others), bridging computational linguistics and the humanities
- Held with LREC every two years (2020 Marseille, cancelled but proceedings published; 2022 Marseille; 2024 Torino;
  2026 Palma de Mallorca)
- Papers of 4 to 8 pages in LREC format, double-blind review by three reviewers
- Proceedings published by ELRA and listed in the ACL Anthology (50 papers in 2026 including shared task reports)
- Hosts the EvaLatin (Latin), EvaHan (Ancient Chinese) and EvaCun (cuneiform) evaluation campaigns
- Not listed in ICORE2026 and not on the CCF list
