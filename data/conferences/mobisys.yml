notes:
- Sponsored by ACM SIGMOBILE; one of the main venues for mobile and wireless systems research alongside MobiCom
- Papers published in the ACM Digital Library; ACM Open APC applies to authors outside ACM Open institutions
- One submission cycle with abstract registration in late November and full paper in early December (AoE),
  early rejection round and rebuttal
- Values working implementations and practical evaluation; artifact evaluation, posters, demos and workshops
  attached
- Location rotates worldwide (Helsinki 2023, Tokyo 2024, Anaheim 2025, Cambridge UK 2026, Ho Chi Minh City 2027)
- Each accepted full paper needed a unique non-student full pass registration (2026)
