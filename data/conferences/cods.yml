notes:
- India's main data science and data management conference, run by ACM IKDD; CODS started in 2014 and merged with
  COMAD (since 1989) as CODS-COMAD from 2018 to 2024, renamed CODS from the 2025 edition
- CORE lists it as COMAD with rank National India
- Held in India each year at a rotating host (Dec 2024 IIT Jodhpur, 2025 IISER Pune, 2026 DA-IICT Gandhinagar);
  moved from early January to December from the 2024 edition
- Archival papers 8 pages plus 2 of references (published in ACM DL); non-archival 2-page track for early ideas;
  submission via OpenReview
- Also a Young Researchers' Symposium, demo track, AI for Biology track and Rising Star Award; partial travel
  grants for students with accepted papers
- Deadlines are usually extended by one to two weeks
