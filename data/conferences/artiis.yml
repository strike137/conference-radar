id: artiis
name: ARTIIS
full_name: International Conference on Advanced Research in Technologies, Information, Innovation and Sustainability
type: conference
tier: minor
areas: [general, data, security]
region: worldwide
language: english
frequency: annual
organizer: Universidad Estatal Peninsula de Santa Elena (Ecuador) and Algoritmi Research Centre, Universidade do Minho (Portugal), with a local host university each year
organizer_country: [other, europe]
proceedings: Springer CCIS
archival: true
indexing: [Scopus, DBLP, EI]
typical:
  deadline_months: [7, 8]
  conference_months: [9, 10, 11]
links:
  website: https://www.artiis.org/
notes:
- Information systems conference with four topics, computing solutions, data intelligence, sustainability, and ethics, security and privacy
- Many special sessions run inside the conference, each with its own chairs
- Proceedings in Springer Communications in Computer and Information Science (CCIS)
- Selected papers are invited to extended versions in journals such as SN Computer Science and MDPI special issues
- Hybrid format with virtual sessions on a separate day
- Alternates between Latin America and Europe (2021 Santa Elena, 2022 Santiago de Compostela, 2023 Madrid, 2024 Santiago de Chile, 2025 Cartagena de Indias, 2026 Lisbon)
- Not listed in ICORE2026 or the CCF 2026 list
