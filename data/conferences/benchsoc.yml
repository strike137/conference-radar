notes:
- New workshop co-located with ICSOC; 1st edition at ICSOC 2026 in Lodz, Poland, on the workshop day (1 December 2026)
- Chaired by Ada Bagozi and Massimiliano Garda (University of Brescia) and Ilche Georgievski (University of Stuttgart)
- Scope is datasets, benchmark tasks, evaluation methodology, resource mappings and baseline systems for service-oriented computing
- Unlike the ICSOC workshops that publish in Springer, BenchSOC proceedings are submitted to CEUR Workshop Proceedings (open access, CC BY 4.0)
- Single-blind review; CEUR-ART one-column format, up to 12 pages excluding references
- Submission through the ICSOC 2026 EasyChair; in-person presentation is required for inclusion in the proceedings
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
