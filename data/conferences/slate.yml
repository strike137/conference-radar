links:
  website: https://sites.google.com/view/slate-2025
notes:
- Workshop of the ISCA special interest group SIG-SLaTE on speech and language technology for education (language
  learning, pronunciation, assessment); 10th edition in 2025
- Satellite workshop of Interspeech; 2025 edition ran together with WOCCI after Interspeech Rotterdam
- Full papers up to 5 pages (5th page for references) and short papers up to 2 pages in the Interspeech template;
  papers are not anonymous
- Proceedings in the ISCA Archive with DOIs (10.21437/SLaTE.2025)
- Held in Europe (Grenoble 2013, Leipzig 2015, Stockholm 2017, Graz 2019, Dublin 2023, Nijmegen 2025)
- Not listed in CORE ICORE2026
