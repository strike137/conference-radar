notes:
- Flagship conference of the NDC family, run by NDC Conferences AS (Oslo); first NDC held in Oslo in 2008
- Five day event; two days of pre-conference workshops at separate venues, then three conference days at Oslo Spektrum with multiple tracks and an expo
- Organizers expect more than 2500 attendees for 2027
- Open call for papers; 60 minute talks, 10 to 15 minute lightning talks, 60 to 120 minute workshops and 2 day pre-conference workshops
- NDC covers travel and accommodation for speakers, except lightning talk only and local speakers
- No papers or proceedings; sessions are recorded and posted on the NDC YouTube channel about one month after the event
