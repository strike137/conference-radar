organizer: MLCS organizers (University of Lisbon LASIGE, University of Bari, University of Genoa); co-located workshop of ECML PKDD
organizer_country: [europe]
proceedings: Springer CCIS (ECML PKDD post-workshop proceedings)
archival: true
typical:
  deadline_months: [6]
