links:
  website: https://mlcs.lasige.di.fc.ul.pt/
notes:
- Half-day workshop on machine learning for security (adversarial learning, intrusion detection, LLMs in cybersecurity, threat detection)
- Co-located with ECML PKDD every year since 2019 (Vilnius 2024, Porto 2025)
- Regular papers (12 to 16 pages) and short research statements (up to 6 pages) in Springer LNCS format, via Microsoft CMT
- Regular papers go into the ECML PKDD post-workshop Springer proceedings; at least one author must register and present in person
- Not held at ECML PKDD 2026 (not in the 2026 workshop list)
- Not listed in CORE ICORE2026
