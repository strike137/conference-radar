id: p3hpc
name: P3HPC
full_name: International Workshop on Performance, Portability and Productivity in HPC
type: workshop
tier: minor
areas: [systems, software]
region: north-america
language: english
frequency: annual
organizer: SC workshop; IEEE/ACM, with papers published through IEEE TCHPC
organizer_country: [usa]
proceedings: SC Workshops Proceedings (IEEE Xplore via IEEE TCHPC)
archival: true
typical:
  deadline_months: [8]
  conference_months: [11]
links:
  website: https://p3hpc.org/
notes:
- IEEE/ACM workshop run as part of the SC program since 2018; a separate P3HPC Forum (talks, panels and posters) grew out of the DOE Centers of Excellence performance portability meetings
- Topics include performance portable programming models, libraries and DSLs, case studies and P3 metrics
- Papers of 5 to 12 pages excluding references (16 pages maximum with references and appendices), IEEE template
- Single-blind review with at least three reviews per paper
- Optional Artifact Description and Artifact Evaluation appendices following the SC reproducibility initiative
- Full day in 2025; location follows SC (St. Louis 2025, Chicago 2026)
