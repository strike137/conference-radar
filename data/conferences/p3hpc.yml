notes:
- Peer-reviewed workshop held as part of the SC program since 2018, so it is held in the USA with SC
- Grew out of the DOE Centers of Excellence performance portability meetings; a separate non-archival P3HPC Forum also exists
- Full papers go into the SC Workshops Proceedings; the home page says accepted papers appear in IEEE Xplore via IEEE TCHPC
- Papers 5 to 16 pages including references (at most 12 pages excluding references and appendices), single-blind review with at least three reviews
- Artifact description and evaluation appendices encouraged, following the SC Reproducibility Initiative
- Not ranked in CORE ICORE2026 and not on the CCF 2026 list
