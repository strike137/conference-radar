notes:
- Ruby community conference in Taipei run by the Ruby Taiwan community, held since 2010
- Irregular schedule; recent editions 2018 (Apr), 2019 (Jul), 2021 (online), 2023 (Dec) and 2025 (Aug)
- 2025 edition was held jointly with COSCUP at National Taiwan University of Science and Technology, with free entry
- Talks in English and Chinese; international speakers including Ruby creator Matz
- No papers or proceedings; practitioner talks only
- Not listed in the CORE ICORE2026 portal
