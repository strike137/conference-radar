notes:
- Flagship conference of the IEEE Systems Council, covering systems engineering, MBSE, systems of systems, security and autonomous systems
- Held in Canada in recent years (Vancouver, Montreal, Halifax); earlier editions also in Orlando
- Two paper types; practitioner papers (extended abstract, 3-page final) and research papers (up to 8 pages)
- Accepted papers are published in IEEE Xplore and indexed by EI Compendex; one full registration covers one paper
- Submissions through EDAS
- Not ranked by CORE or CCF
