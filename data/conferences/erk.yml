notes:
- Slovenian national electrical engineering and computer science conference run by the IEEE Slovenia Section (35th edition in 2026)
- Bilingual, papers and talks in Slovenian or English; held every September at the Bernardin congress center in Portoroz, Slovenia
- Broad tracks including computer science, electronics, telecommunications, pattern recognition, robotics, multimedia and power engineering
- 4 page papers in the ERK template; papers appear in the ERK online proceedings (ISSN 2591-0442) behind a password published on the site, not in IEEE Xplore
- Includes the IEEE Slovenia Section student paper competition
- "Fee: 140 EUR per published paper (2026); sessions free for other visitors"
- Not listed in CORE ICORE2026 and not on the CCF list
