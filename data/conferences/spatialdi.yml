notes:
- Established and hosted by the ACM SIGSPATIAL China Chapter; no standalone website, the CFP is on EasyChair
- Topics include spatiotemporal data mining, urban computing, GIS retrieval, spatial machine learning, autonomous driving maps and digital twins
- English papers use the LNCS format and appear in Springer LNCS (volumes for 2021 to 2025); Chinese papers are also accepted
- Papers up to about 6,000 words; outstanding (student) paper awards
- Held in China every year (Hangzhou 2021, Wuhan 2022, Nanchang 2023, Nanjing 2024, Xiamen 2025, Changsha 2026)
- Not listed in ICORE2026; not on the CCF 2026 list
