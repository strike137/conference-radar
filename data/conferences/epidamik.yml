notes:
- Held every year at KDD since 2018, originally as Epidemiology meets Data Mining and Knowledge discovery
- Covers AI and data mining for public and population health, epidemic forecasting, surveillance, causal inference and health policy
- Co-located with ACM SIGKDD, so it moves with KDD (Jeju, Korea in 2026)
- Full papers 6 to 8 pages, short, work-in-progress, demo or position papers 2 to 4 pages; summaries of recently published papers also welcome
- Single-blind peer review; ACM double-column format recommended
- Accepted papers are posted online but are not archival, so they can be resubmitted elsewhere
- Not listed in ICORE2026 and not on the CCF list
