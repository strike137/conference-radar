notes:
- Run by the ECE department of JIIT Noida and held on its campus in Noida near New Delhi; not the IEEE ICSC on semantic computing
- Editions in 2013, 2015, 2016, 2018 to 2023, 2025 and 2027 (11th); recent editions roughly every two years
- Proceedings in IEEE Xplore for every edition except 2018 (Springer LNEE); 2027 has IEEE conference record number 71980
- Six tracks in 2027 covering communication, signal processing, VLSI and embedded systems, intelligent computing and ML,
  sustainable energy systems, and assistive technologies and robotics
- Single-blind review via Microsoft CMT; papers up to 6 pages in IEEE format
- 2027 edition is offline only; 2025 was held at JIIT with mostly on-site sessions and a few online sessions
- Deadline is usually extended (2027 moved from 2026-10-05 to 2026-10-15)
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
