notes:
- Workshop co-located with IEEE DCOSS-IoT; the 2026 edition was the 8th (formerly IoTI4, IoT Applications and Industry 4.0)
- Chaired by Thomas Lagkas, Panagiotis Sarigiannidis and John Soldatos; supported by the EU Horizon project XTRUST-6G
- Topics are industrial IoT, Industry 4.0/5.0, digital twins, IIoT security and smart grids
- Papers up to 8 pages IEEE two-column (plus 2 appendix pages at 100 USD each), published in the DCOSS-IoT proceedings in IEEE Xplore
- Follows the DCOSS-IoT host city (Reykjavik 2026)
