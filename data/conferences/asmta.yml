notes:
- Long-running conference on analytical, numerical and simulation methods for stochastic systems (Markov processes, queueing, stochastic games, rare events); 29th edition in 2026
- 2026 edition is held as a one-day workshop within IFIP WG 7.3 Performance 2026 in Ghent, Belgium
- Proceedings in Springer LNCS; papers up to 15 pages in LNCS format, submitted via Microsoft CMT
- Best papers invited to submit fast-tracked extended versions to the Performance Evaluation (PEVA) journal
- Recent editions Online 2021, Florence 2023, Venice 2024, Ghent 2026; no 2022 or 2025 edition
- Not listed in ICORE2026 or on the CCF 2026 list
