notes:
- New Zealand's long-running hacker conference, started in 2007 as Kiwicon and renamed Kawaiicon in 2019
- 'Held at the Michael Fowler Centre, Wellington: two con days (Friday and Saturday) plus pre-con events the day
  before'
- 'Irregular schedule: Kiwicon ran yearly until 2018, then Kawaiicon in 2019, 2022, 2025 and 2026 (Kawaiicon 4)'
- Call for Participation (talks, hallway con events, satellite events) closes in early August; talks are recorded
  and livestreamed
- Very cheap tickets released in waves that often sell out; 2025 offered sponsor-funded free student and unwaged
  tickets, but 2026 had no free-ticket form
