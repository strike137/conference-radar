notes:
- Community standardization workshop on zero-knowledge proofs run by ZKProof Standards; academics, startups and
  practitioners attend
- Calls for proposals and papers with a program committee and HotCRP submission (24 accepted submissions in 2025),
  but accepted work is presented as talks only, with no proceedings
- Recent editions co-located with cryptography conferences in Europe (Real World Crypto week in Sofia 2025,
  Eurocrypt in Rome 2026)
- Earlier editions in Boston 2018, Berkeley and Amsterdam 2019, Barcelona 2023 (ZK Week) and Berlin 2024
