id: greens
name: GREENS
full_name: International Workshop on Green and Sustainable Software
type: workshop
tier: minor
areas: [software]
region: worldwide
language: english
frequency: annual
organizer: GREENS steering committee (Vrije Universiteit Amsterdam, University of Hawaii), co-located with ICSE (IEEE/ACM)
organizer_country: [international]
proceedings: ACM DL or IEEE Xplore (ICSE or ICSA workshop proceedings; IEEE in 2023 to 2025, ACM in 2026)
archival: true
typical:
  deadline_months: [10, 11]
  conference_months: [4]
links:
  website: https://greensworkshop.github.io/
notes:
- One-day ICSE workshop on green software engineering and software sustainability; not to be confused with SMARTGREENS
- Series dates back to 2012; usually co-located with ICSE (Melbourne 2023, Ottawa 2025, Rio de Janeiro 2026, Dublin 2027); 2024 edition was co-located with ICSA 2024
- 2026 was the 10th edition; 2027 is the 11th
- Emerging research papers up to 8 pages, position papers up to 5, extended abstracts up to 2, plus registered reports with a path to ACM TOSEM
- Single-anonymous review; pitch sessions followed by group discussion
- 2026 proceedings in the ACM Digital Library as "Proceedings of the IEEE/ACM 10th International Workshop on Green and Sustainable Software"
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
