notes:
- Workshop on green software engineering, energy efficiency and the economic, social, environmental and technical dimensions of software sustainability
- 2027 is the 11th edition; held with ICSE in Dublin 2027, Rio de Janeiro 2026 and Ottawa 2025, and with ICSA in Hyderabad 2024
- Emerging research papers up to 8 pages, position papers up to 5 pages, extended abstracts up to 2 pages and registered reports (6 + 2 pages) that can continue in the ACM TOSEM registered report track
- IEEE format, single-anonymous review via HotCRP
- Workshop papers appear in the ICSE Companion proceedings (published by IEEE for ICSE 2027, ACM for ICSE 2026)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
