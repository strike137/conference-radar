notes:
- Workshop held with IFIP Networking on experimentally driven networking research, data sharing, reproducibility and FAIR data in Future G (5G/6G) networks and testbeds
- Linked to the EU ESFRI SLICES research infrastructure; TPC co-chairs include Serge Fdida (Sorbonne Universite) and Georg Carle (TUM)
- Held in Thessaloniki 2024 (as "Thought experiments, data and reproducibility for networking and FutureG research") and Limassol 2025, always with IFIP Networking
- Papers up to 6 pages in IEEE double-column format, submitted via EDAS
- Papers appear in the IFIP Networking proceedings and are submitted to IEEE Xplore
- Not in the IFIP Networking 2026 workshop list
- Not listed in the ICORE2026 portal or the CCF 2026 list
