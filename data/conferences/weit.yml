notes:
- Brazilian workshop-school on theoretical computer science, with talks, short courses and paper sessions
- Held every two years since 2011 (Pelotas 2011, Rio Grande 2013, Porto Alegre 2015, Santa Maria 2017, Passo Fundo
  2019, Bagé 2021, Rio Grande 2023, Ponta Grossa 2025)
- Mostly in southern Brazil; 8th edition in 2025 at UTFPR Ponta Grossa
- Proceedings (Anais do WEIT) in SBC OpenLib (SOL) with DOIs since at least 2021
- "2025: 16 full and 10 short papers, single-blind review, acceptance 72.7% (full) and 76.9% (short)"
- Separate from ETC, the theory of computation meeting held within CSBC
- Not listed in CORE ICORE2026
