id: llm4sec
name: LLM4Sec
full_name: Workshop on the Use of Large Language Models for Cybersecurity
type: workshop
tier: minor
areas: [security, ai, nlp]
region: worldwide
language: english
frequency: annual
organizer: ICAR-CNR and IMATI-CNR (Italy) with PBS University (Poland)
organizer_country: [europe]
proceedings: Springer LNCS
rank:
  core: Unranked
fee: Registration through ESORICS (Full or Workshop-only); onsite one-day workshop pass 300 EUR (2026)
typical:
  deadline_months: [7, 8]
  conference_months: [9, 11]
links:
  website: https://llm4sec-workshop.github.io/
notes:
- 'Young workshop that moves between host conferences: 1st edition at IEEE ICDM 2025 (Washington DC, IEEE ICDMW
  proceedings), 2nd edition at ESORICS 2026 (Rome, Springer LNCS)'
- 'Topics: LLMs for secure code generation, vulnerability and malware detection, phishing, forensics, anomaly detection
  and security policy generation'
- '2026: papers up to 16 pages in LNCS format, single-blind review, submitted through the ESORICS EasyChair; in-person
  presentation required (2025 used 8-page IEEE format with triple-blind review)'
- Half-day format; 10 papers in the 2026 program, including one from Yokohama National University
