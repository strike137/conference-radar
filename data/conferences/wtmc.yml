notes:
- Workshop on measurement-driven security (traffic analysis, DDoS, botnets, phishing, abuse infrastructure, censorship)
- Co-located with IEEE Euro S&P in 2020 and 2022-2025 (proceedings in IEEE Xplore); moved to ACM CCS for 2026 (proceedings
  in the ACM Digital Library), so the deadline shifted from March to July
- Earlier editions were co-located with IEEE S&P, ACM SIGCOMM and ACM AsiaCCS; 2026 is the 11th edition
- Short (4+2 pages), regular (6+2) and long (10+4) papers; double-blind review in 2026 (single-blind up to 2025)
- In-person presentation by at least one author is required; organized by researchers from Grenoble Alps, TU Delft,
  Warsaw University of Technology, ICANN and AIT
