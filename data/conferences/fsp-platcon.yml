notes:
- Registered workshop of PlatCon (co-hosted by ICRP and Shinhan University, technically co-sponsored by IEEE Busan
  Section), held each August, usually in Jeju (PlatCon-23 was in Busan)
- 'Runs every year with PlatCon since at least 2022; follows the Track 1 schedule and rules: 4-6 page IEEE-format
  full papers via EDAS, at least three reviews, proceedings in IEEE Xplore'
- Deadlines are typically extended twice and end only 2-4 weeks before the conference
- Selected papers are recommended to MDPI Electronics/Applied Sciences and CMC special issues
- Organized mainly by Korean security professors; on-site presentation required, with one or two online sessions
  for exceptions
