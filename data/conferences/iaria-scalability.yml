notes:
- Organized by IARIA as part of the TechWorld congress, co-located with EXPLAINABILITY and other IARIA events (first edition in 2024, 3rd in 2026)
- Covers scalability and expandability of computing systems
- Published open access in the IARIA ThinkMind library; prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Spain and Portugal so far (Valencia, Barcelona, Porto); onsite and online participation offered
