notes:
- Annual workshop of ACL SIGTYP on linguistic typology and its use in multilingual NLP, cross-lingual transfer and typological databases; 2026 put a special emphasis on LLMs for typological research
- Recent editions with EACL 2023 (Dubrovnik), EACL 2024 (St. Julian's, Malta), ACL 2025 (Vienna) and EACL 2026 (Rabat); 2020 and 2021 editions were online
- Long (8 pages) and short (4 pages) papers are archival in the ACL Anthology; 2-page extended abstracts are non-archival
- Double-blind review through OpenReview; ARR papers rejected or withdrawn from the host conference can be submitted with their reviews
- SIGTYP also runs shared tasks (2027 task on collaborative dictionary digitization) and hosts the MRL workshop
- Not ranked in ICORE2026 and not on the CCF list
