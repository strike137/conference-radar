notes:
- Workshop on in-network computing with programmable switches, SmartNICs and FPGAs for AI training and inference, analytics, storage and network management
- First edition held as a half-day morning workshop with ACM CoNEXT 2025 at HKUST, Hong Kong
- Steering co-chairs from NUDT and Carnegie Mellon University; organization chairs from Peking University, Sun Yat-sen University, BUPT and Nanjing University
- Papers of 2 to 6 pages excluding references in two-column ACM format, double-blind review, submitted via HotCRP
- 2025 program had 4 paper presentations and 2 keynotes
- 2025 papers published in the ACM Digital Library as Proceedings of the ACM CoNEXT Workshop on In-Network Computing and AI for Distributed Systems (DOI 10.1145/3769699)
- Not run with CoNEXT 2026 (Utrecht), whose workshop list does not include it
- Not listed in ICORE2026
