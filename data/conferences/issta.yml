notes:
- Leading venue for software testing and program analysis (fuzzing, verification, bug detection); CORE A, CCF A
- Papers published in PACMSE since 2025; 18 pages plus unlimited references
- Double-anonymous review with a major revision round
- Co-located with FSE in 2025 and with SPLASH in 2026; ISSTA 2027 will be in Singapore (September 2027)
- ACM open access APC may apply (USD 250 member / 350 non-member in 2026) unless covered by ACM Open
