notes:
- Workshop on community infrastructure for software engineering research on autonomous driving systems (tools, benchmarks, datasets, reproducibility)
- Organized by Joshua Garcia and Qi Alfred Chen (UC Irvine)
- 1st edition at ICSE 2025 in Ottawa (ICSE 2025 companion, IEEE format), 2nd at FSE 2026 in Montreal (FSE Companion, ACM)
- Position papers up to 4 pages, other papers (industrial, experience, education, artifact) up to 7 pages
- 2026 submission deadline was extended to 2026-03-05
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
