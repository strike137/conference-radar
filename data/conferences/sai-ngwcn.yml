notes:
- Workshop on energy-efficient and trustworthy AI for wireless communications and networking co-located with IEEE
  GLOBECOM
- Held at GLOBECOM 2025 (Taipei, WS-09) and GLOBECOM 2026 (Macau, WS-32)
- Co-chairs Yan Kyaw Tun, Nguyen Van Huynh, Dusit Niyato, Yaru Fu, Viet Quoc Pham and Zhu Han
- Accepted and presented papers go into the GLOBECOM conference proceedings and IEEE Xplore; no-show papers are
  removed
- Submissions via EDAS through the GLOBECOM workshop call
- The acronym SAI-NGWCN comes from the 2025 EDAS link, not from the workshop title
- Not listed in ICORE2026
