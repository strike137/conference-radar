notes:
- Interdisciplinary time series analysis and forecasting conference (computer science, statistics, econometrics), run from the University of Granada
- ITISE 2026 (12th edition) papers published in the open access MDPI Engineering Proceedings, volume 155
- A selection of full papers is also published in the Springer book series Contributions to Statistics
- Accepts full papers (5 to 9 pages) and abstracts (about two pages); in past years the call ran in several submission rounds
- Held at the Hotel Lopesan Villa del Conde in Meloneras, Gran Canaria, Spain
- Not listed in CORE ICORE2026 or the CCF 2026 list
