archival: true
indexing: [EI, Scopus]
fee: 550 USD or 3900 RMB per paper (2027, regular author early bird); 50 USD per extra page beyond 6 pages; listener 200 USD
typical:
  deadline_months: [3]
  conference_months: [3, 5]
links:
  website: https://www.cacml.net/
notes:
- Annual since 2022; online in 2022 and 2023, then in China (Shanghai Jiao Tong University 2024, Guangzhou 2025 and 2026, Shanghai 2027)
- 2027 edition sponsored by Shanghai DianJi University and the International Society for Applied Computing, co-organized by SJTU, Southeast, Fudan and Tongji universities
- Proceedings in IEEE Xplore for 2022 (IEEE CPS), 2025 and 2026; in the ACM DL for 2023 and 2024; indexed by EI Compendex and Scopus
- The site does not name the publisher for the 2027 proceedings
- Double-blind review with at least three reviewers per paper via Microsoft CMT, per the site
- Presenter only and listener registration are also offered
- Not listed in CORE ICORE2026
