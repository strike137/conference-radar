notes:
- Technically sponsored by IFIP WG 6.2 and IEEE ComSoc; held annually since 2012 (14th edition in 2025)
- Proceedings published in IEEE Xplore (stated on the 2022 site); camera-ready papers are checked with IEEE PDF eXpress (conference ID 67312X in 2025)
- Double-blind review; submission through EDAS with IEEE templates
- Extended versions of the 10 best papers are eligible for a special issue of Annals of Telecommunications (Springer)
- Best student paper award of 500 EUR (2025)
- "Recent locations: Berlin 2020 (virtual), Waterloo 2021 (virtual), Rome 2022, Berlin 2023, Agadir 2024, Paris 2025 (CNAM)"
- CORE C (ICORE2026); deadlines are usually extended
- 2026 (15th edition) is hybrid, in person in Montreal, Canada or online; the 2026 CFP calls its 7 Sep 2026 deadline a hard deadline
- 2026 regular page limit is 6 pages, with up to 2 extra pages for an additional fee
