id: icaitech
name: ICAITech
full_name: International Conference on Artificial Intelligence and Technological Solutions
type: conference
tier: minor
areas: [ai, general]
region: southeast-asia
language: english
frequency: annual
organizer: Faculty of Computer Science, Universitas Sriwijaya
organizer_country: [indonesia]
proceedings: IEEE Xplore
archival: true
fee: 175 USD early bird or 200 USD normal for international non-IEEE-member authors; 150 USD early bird for
  students; 2,000,000 IDR early bird for Indonesian authors (2026)
acceptance_rate: 52% (2025, 67/129)
typical:
  deadline_months: [8]
  conference_months: [11]
links:
  website: https://icaitech.org/
notes:
- Run by the Faculty of Computer Science, Universitas Sriwijaya, in Palembang, Indonesia; first edition in 2025
- Themed on AI for the UN Sustainable Development Goals (health, clean water and sanitation, partnerships)
- Hybrid format, in person in Palembang with virtual participation
- 2025 papers are in IEEE Xplore
- Held together with the national Annual Research Seminar (ARS) and, in 2026, the 14th ASEAN Workshop on Information
  Science and Technology (AWIST)
- Submission via EDAS; each paper reviewed by about three reviewers (2025 site)
- 2025 had 129 submissions and 67 accepted papers
- Not listed in ICORE2026 and not on the CCF list
