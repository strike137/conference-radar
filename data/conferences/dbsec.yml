notes:
- Annual working conference of IFIP WG 11.3, running since 1987 (40th edition in 2026)
- Submissions are not anonymous; full papers up to 16 pages LNCS (20 total) plus short papers up to 12 pages
- Proceedings in Springer LNCS; best paper and best student paper awards; 18 full and 10 short papers accepted in
  2026
- Alternates between North America and Europe (Sophia Antipolis 2023, San Jose 2024, Gjøvik 2025, Arlington 2026)
