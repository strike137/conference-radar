notes:
- Organized by Ben-Gurion University of the Negev (NHSA) in Be'er Sheva, Israel; 2025 and 2026 editions in early December
- Formerly Cyber Security Cryptography and Machine Learning (CSCML 2017 to 2021); 10th edition in 2026
- Academic track proceedings in Springer LNCS; regular papers 12 to 15+ pages and short papers 6 to 11 pages
  (short papers may describe work presented elsewhere)
- Also has an entrepreneurship pitch track and a PhD/Masters work-in-progress track, published only in an NHSA
  technical report
- 2025 and 2026 announced as virtual from Be'er Sheva; keynotes have included Turing Award winners (Leslie Valiant 2025, Silvio Micali 2026)
- Selected papers invited to a special issue of the journal Cryptography and Communications
- Not ranked by CORE (not found in ICORE2026)
