notes:
- Co-located with IEEE S&P on the Security and Privacy Workshops day in San Francisco; one-day workshop in May
- Started in 2024 as Security Architectures for Generative AI with a paper call (CFP said papers go into the IEEE
  workshop proceedings); 2025 was an invited-talk, Dagstuhl-style discussion format with no paper call; 2026 returned
  to peer-reviewed papers
- '2026: papers up to 6 pages plus references, IEEE two-column format, anonymized; 10 of 20 submissions accepted'
- Focus on security and privacy of LLM agents (prompt injection, tool integration, data exfiltration, red-teaming);
  2026 program had 4 keynotes from Gray Swan, Google DeepMind and Snowflake
- IEEE S&P 2027 moves to Montreal, Canada, with the workshops day on May 20, 2027
