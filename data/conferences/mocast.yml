notes:
- European conference on circuits and systems (analog, RF and mixed-signal circuits, digital design, nonlinear circuits, memristors, embedded systems, sensors, communication systems, AI hardware)
- Technically sponsored by IEEE; accepted papers go to IEEE Xplore (proceedings in IEEE Xplore every year since 2016)
- Held since 2012; hosted by a different European university each year (Sofia 2024, Dresden 2025, Palma de Mallorca 2026)
- Long-running general chair from Aristotle University of Thessaloniki, Greece
- Papers are 4 pages in IEEE format; selected papers are invited to special issues of MDPI journals (Electronics, Sensors, Telecom)
- Not listed in ICORE2026 or the CCF list
