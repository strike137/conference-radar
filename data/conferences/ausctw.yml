notes:
- Small annual workshop of the Australian and New Zealand communication theory community, held in early February
- Steering committee drawn from Australian universities and the University of Canterbury (New Zealand); host
  university rotates (Canterbury, Christchurch 2026 -> Adelaide University 2027)
- Abstract only (about 250 to 300 words) for a technical talk or poster; poster sessions are the main format
- Not peer reviewed and no proceedings; abstracts go into a printed booklet for delegates, so work in progress
  is welcome
- Abstract deadline is usually early January; submission by online form
- Topics include information theory and coding, wireless and cellular systems, signal processing for
  communications, physical layer security, quantum communications and ML for communications
