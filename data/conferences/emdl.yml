organizer: Steering committee Nic Lane (University of Cambridge and Flower Labs); 2026 PC chairs from Samsung AI Center
  Cambridge, University of Twente, University of Amsterdam and TU Delft; co-located with ACM MobiSys
organizer_country: [europe]
proceedings: ACM DL
