links:
  website: https://emdl-workshop.github.io/emdl26/
notes:
- Started in 2017; held with ACM MobiSys 2017 to 2019, MobiCom 2020 and MobiSys 2021 and 2022, then
  paused until the 7th edition at MobiSys 2026 in Cambridge, UK
- 2026 theme is system foundations for generative AI at the edge (on-device LLMs, KV cache, NPU acceleration)
- Full and position papers up to 6 pages go to the ACM Digital Library; 2-page work-in-progress and demo papers appear
  only on the workshop website
- Double-blind review; MobiSys format
- Not listed in the CORE portal (ICORE2026)
