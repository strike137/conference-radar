notes:
- Flagship conference of IEEE ComSoc; very large, with about 12 symposia plus Selected Areas in Communications tracks
- One deadline around October, often extended; submissions via EDAS
- Has a Communication and Information System Security symposium
- Acceptance rate historically around 38-40%
- Not listed in ICORE2026 or CORE2023 (CORE2018 ranked it B); CCF C
