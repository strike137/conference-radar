notes:
- Workshop on modeling and simulation in software engineering (digital twins, cyber-physical systems, DEVS,
  models@runtime, simulation tools); held since 2019
- Editions 2019 to 2025 were co-located with CBSoft in a different Brazilian city each year (Recife 2025), with
  proceedings (Anais do MSSiS) in SBC OpenLib (SOL)
- The 8th edition (2026) moved to ICSE 2026 in Rio de Janeiro, with papers in the ICSE 2026 workshop proceedings (ACM DL)
- "2026 submission types: emerging research papers (up to 8 pages), position papers (up to 5), extended abstracts (up to 2)"
- At least three reviewers per submission; extended abstracts are free of APC charges
- "2025: 5 full and 3 short papers accepted out of 6 full and 3 short (double-blind review)"
- Not listed in CORE ICORE2026
