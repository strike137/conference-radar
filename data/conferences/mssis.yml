notes:
- Workshop on simulation, executable models and digital twins in software engineering for cyber-physical systems, systems-of-systems and smart cities
- Held since 2019 and organized by the Brazilian Computer Society (SBC) in Brazil; editions 2019 to 2025 hosted by Brazilian universities
- 8th edition in 2026 moved to ICSE 2026 in Rio de Janeiro
- 2026 accepted emerging research papers up to 8 pages, position papers up to 5 pages and extended abstracts up to 2 pages, ACM format, references included
- Single-blind review by at least three reviewers
- 2026 papers published in the ACM Digital Library; extended abstracts are APC free; earlier papers are in the SBC SOL library
- Not on the ICSE 2027 workshop list, so the next edition is not announced yet
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
