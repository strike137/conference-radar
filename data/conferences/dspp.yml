notes:
- 'Young conference: first edition 2023 in Xi''an (IEEE proceedings), Springer LNCS proceedings from 2024'
- Held in Xi'an (Xidian University) 2023 to 2025, moved to Nanjing (NUAA) for 2026
- Anonymous submission, up to 16 pages in LNCS format; papers can be presented online or in person
- 2024 and 2025 had two submission rounds (spring and early summer); 2026 had a single August deadline
- Acceptance rate about 45% (2025, 47/105); 2026 honorary chairs are Elisa Bertino and Moti Yung
