id: aina
name: AINA
full_name: International Conference on Advanced Information Networking and Applications
type: conference
tier: major
areas: [networking, communications, systems, security]
region: worldwide
language: english
frequency: annual
organizer: Fukuoka Institute of Technology (steering committee chair Leonard Barolli) with a different host university
  each year
organizer_country: [japan]
proceedings: Springer LNDECT (Lecture Notes on Data Engineering and Communications Technologies); selected papers
  extended in journal special issues (Internet of Things (Elsevier), IJGUC, IJWGS, IJMCMC, Journal of High Speed
  Networks)
archival: true
indexing: [Scopus, EI, DBLP]
rank:
  core: B
fee: USD 600 per paper for author registration (2026 and 2027); student participants USD 400 early (2026 and 2027)
typical:
  deadline_months: [11, 12]
  conference_months: [3, 4]
links:
  website: https://voyager.ce.fit.ac.jp/conf/aina/2027/
  dblp: https://dblp.org/db/conf/aina/
notes:
- Flagship of the Barolli (Fukuoka Institute of Technology) conference family; the CORE entry reads 'was ICOIN',
  and 2026 was the 40th edition
- 'CORE B but very large: AINA-2026 proceedings filled 8 Springer LNDECT volumes, and 20 co-located workshops were
  listed for 2026'
- Security workshops include NetSMM, AI-SEC (AI for Cybersecurity) and INTRICATE-SEC; the main conference has a
  Security, Privacy and Trust track
- 'Rotates worldwide: Kitakyushu 2024, Barcelona 2025, Wellington 2026, Tirana 2027'
- 12-page limit for main papers (10 for workshop papers in 2027), up to 2 extra pages at USD 100 each; registration
  through EDAS in USD; at least one author must register and present each paper
