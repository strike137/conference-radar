notes:
- Korea's largest game developer conference, run by NEXON Korea; talks on game development, engineering, AI, art and production
- Started in 2007 as an internal event for NEXON staff and opened to the public in 2011
- NDC23 and NDC24 were private (internal) conferences; NDC25 returned as a public in-person event after six years
- Held at NEXON Korea HQ in Pangyo (Seongnam) and nearby session venues such as the CCEI Gyeonggi B2 International Hall, with live online streaming
- Talks selected from a public speaker application (proposal guide plus presentation draft); no papers
- On-site attendance needs pre-registration per day, first come first served; walk-ins not accepted
- Not to be confused with the NDC developer conferences in Oslo, Sydney and NDC Security
