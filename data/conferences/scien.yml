notes:
- Formerly the ACNS Workshop on Secure Cryptographic Implementation (SCI), held with ACNS from 2020 to 2025 (2023
  Kyoto, 2024 Abu Dhabi, 2025 Munich)
- 'Renamed SCIEN in 2026 and moved to Inscrypt: 7th edition on Nov 8, 2026 in Hong Kong; one author must register
  for Inscrypt at the author rate and present in person'
- 'Scope: implementation security of crypto algorithms and protocols, side channels, PKI/TLS, RNGs, PQC implementations;
  welcomes position papers and initial findings'
- Small workshop (6 accepted papers in 2026); LNCS format, up to 16 pages; run mainly by the Chinese crypto-engineering
  community (UCAS, USTC)
- Schedule follows the host conference, so deadline and conference months shift from year to year
