id: ascent
name: ASCENT
full_name: Workshop on Advances in Systems and Computation at the Edge and HPC Networks
type: workshop
tier: minor
areas: [systems, networking, ai]
region: south-asia
language: english
frequency: annual
organizer: Workshop chairs Anurag Satpathy (Missouri S&T), Arindam Khanda (Kennesaw State University), Sourav Kanti
  Addya (NIT Karnataka) and Hirozumi Yamaguchi (The University of Osaka)
organizer_country: [usa, india, japan]
proceedings: ACM DL (ACM ICPS, ICDCN companion proceedings)
archival: true
typical:
  deadline_months: [9, 10]
  conference_months: [1]
links:
  website: https://anuragsatpathy.github.io/ascent-icdcn2027/
notes:
- Co-located workshop of ICDCN; 1st edition at ICDCN 2026 in Nara, Japan (merged with the DistLLM workshop), 2nd at
  ICDCN 2027 at NIT Karnataka, Surathkal, India
- Topics are HPC and edge computing, distributed LLM inference, generative AI on edge platforms and quantum-aware
  workflows
- Double-blind; papers up to 6 pages in ACM format, submitted via the ICDCN EasyChair
- Accepted papers appear in a companion volume of the ICDCN proceedings in ACM ICPS; an ACM open access APC may apply
- At least one author must register and present in person; a workshop-day registration is available
- Small workshop (4 papers in the 2026 program); not listed in CORE ICORE2026
