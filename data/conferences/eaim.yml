id: eaim
name: EAIM
full_name: International Workshop on Emerging AI Technologies for Music
type: workshop
tier: minor
areas: [ai]
region: worldwide
language: english
frequency: annual
organizer: AMAAI Lab (Singapore University of Technology and Design) and Queen Mary University of London; co-located with AAAI
organizer_country: [singapore, europe]
proceedings: PMLR
archival: true
typical:
  deadline_months: [10, 11]
  conference_months: [1, 2]
links:
  website: https://amaai-lab.github.io/EAIM2027/
notes:
  - AAAI workshop on AI for music (composition and generation, music foundation models, production, MIR, singing voice synthesis, human-AI co-creativity)
  - 1st edition at AAAI-26 in Singapore (26 January 2026), 2nd edition at AAAI-27 in Montreal
  - 2026 papers published in PMLR volume 303; 2027 accepted papers also go to a PMLR volume
  - Papers 8 to 11 pages excluding references in PMLR format, double-blind review on OpenReview with three reviews per paper
  - Full-day in-person workshop; at least one author must present in person
  - Not listed in ICORE2026 or the CCF list
