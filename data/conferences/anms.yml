id: anms
name: ANMS
full_name: International Workshop on Autonomous Network Management Systems
type: workshop
tier: minor
areas: [networking, communications, ai]
region: worldwide
language: english
frequency: annual
organizer: Paul Harvey (University of Glasgow), Miguel Camelo and Paola Soto-Arenas (University of Antwerp - imec) and Francesc
  Wilhelmi (Nokia Bell Labs)
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
links:
  website: https://anms-conf.github.io/
notes:
- Started in 2022 as the International Workshop on Autonomous Network Management in 5G and Beyond Systems
- Host conference changes, so deadlines move around the year (NOMS 2022, NOMS 2023 Miami, NOMS 2024 Seoul, ICDCS 2025 Glasgow,
  CNSM 2026 Alcala de Henares)
- Topics are self-managing 5G/6G networks, AI-native and agentic network management, digital twins, intent and LLMs for
  network operation
- Papers up to 6 pages (regular) or 4 pages (position) in IEEE two-column format including references; submission via
  EDAS in 2026
- Papers go into the host conference workshop proceedings in IEEE Xplore (CNSM 2026 workshop papers are submitted to IEEE Xplore)
- Earlier editions offered fast-tracking of the best papers to the Springer Journal of Network and Systems Management
- Half-day workshop with a keynote; seven papers in the 2026 program
