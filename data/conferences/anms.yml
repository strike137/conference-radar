id: anms
name: ANMS
full_name: International Workshop on Autonomous Network Management Systems
type: workshop
tier: minor
areas: [networking, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizers from University of Glasgow, University of Antwerp - imec and Nokia Bell Labs; started by the EU DAEMON project
organizer_country: [europe]
proceedings: IEEE Xplore (host conference workshop proceedings)
archival: true
links:
  website: https://anms-conf.github.io/
notes:
- Started in 2022; moves between host conferences (IEEE/IFIP NOMS 2022 to 2024, IEEE ICDCS 2025, CNSM 2026)
- Topics are self-managing 5G and 6G networks, AI/ML for network management, network digital twins, intent and LLMs, agentic AI
- Papers 6 pages (regular) or 4 pages (position) in IEEE format via EDAS; in-person presentation required
- Workshop papers appear in IEEE Xplore with the host conference proceedings
- Extended versions of the best papers may be fast-tracked to the Journal of Network and Systems Management
- Deadline month follows the host conference, so it shifts from year to year
