notes:
- Run by the IEEE Malaysia Industrial Applications / Industrial Electronics Joint Chapter; sister conference of
  ISCAIE, ISIEA and ISWTA on the same conference management system
- One-day conference held in Kuala Lumpur, Malaysia every year since 2025; 2027 is the 3rd edition
- Accepted papers are submitted to IEEE Xplore; the 2025 and 2026 proceedings are on IEEE Xplore
- Double-blind review by at least 3 reviewers; papers with similarity above 30% are not considered
- Hybrid format; virtual presenters upload a pre-recorded YouTube video
- Scope covers robotics, industrial automation, AI and machine learning, autonomous systems, IIoT and computer
  applications
- Not listed in ICORE2026 and not in the CCF list; a small regional venue
