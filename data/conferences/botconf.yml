notes:
- Practitioner and research conference on botnets and malware ecosystems, run since 2013 by AILB, a French non-profit
  association based in Nantes
- Held in a different French city each year (Nantes 2022, Strasbourg 2023, Nice 2024, Angers 2025, Reims 2026, Vannes
  2027); moved from December to spring in 2022
- Workshops on the first day, then three days of single-track talks
- Submission types are workshops, full papers (40 to 60 min slot), presentations (30 to 50 min) and short talks (20
  min); a sprint CFP for late-breaking work opens in March
- Full and short papers are published online in the Journal on Cybercrime & Digital Investigations (CybIN) by CECyF;
  presentation-only talks are not published as papers
- The programme committee aims to select about 3 workshops and 25 talks
- Not listed in ICORE2026
