notes:
- Community cybersecurity conference run by Div0-N0H4TS, a Singapore community for students and early-career professionals
- Started in 2020; aimed at tertiary students and mid-career switchers
- Talks, hands-on workshops, villages (malware, lock picking, hardware), a student Project Corner and the Cyber
  League CTF competition
- One "Call For X" covers student projects, talks and workshops; project submissions are a short abstract plus demo
- 2026 (6th edition) held at the Lifelong Learning Institute, Singapore; the 2025 edition was in March
- Talks only, no papers or proceedings
