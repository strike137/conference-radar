notes:
- Organized by Tunku Abdul Rahman University of Management and Technology, Kuala Lumpur, Malaysia
- Editions in 2020, 2021, 2024, 2025 and 2026; the 2024 edition was in Kuala Lumpur, 2025 in Semarang (Indonesia), 2026 at BINUS University Medan campus (Indonesia), hybrid
- 2024 and 2025 proceedings in IEEE Xplore (Scopus indexed); 2020 and 2021 were university e-proceedings with ISBN
- Tracks on Industry 4.0, data science, computing and internet technology, intelligent systems and engineering applications
- Double-blind review via Microsoft CMT, IEEE format up to 6 pages, similarity limit 20%
- Not listed in the ICORE2026 CORE portal
