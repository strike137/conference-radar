notes:
- Formal methods and theory applied to software engineering (verification, model checking, program analysis,
  testing, semantics)
- Steering committee mostly from East China Normal University (Jifeng He, Huibiao Zhu), plus members from Japan,
  Ireland and Xidian University
- Proceedings in Springer LNCS; long papers up to 16 pages and short papers up to 6 pages (excluding bibliography)
  in LNCS format, submitted via EasyChair
- Selected papers invited to a special issue of Science of Computer Programming
- Alternates between China and Europe in recent years (Cluj-Napoca 2022, Bristol 2023, Guiyang 2024, Limassol
  2025, Shanghai 2026)
- 'ICORE2026 lists it as National: China; CCF C (software engineering category)'
- Registration about 4000 RMB (550 USD) for authors in 2026; at least one author must register per accepted paper
