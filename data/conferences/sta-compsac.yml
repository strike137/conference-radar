notes:
- Workshop of IEEE COMPSAC (IEEE Computer Society), run every year since 2008; 18th edition in 2026, 17th at COMPSAC 2025 in Toronto
- Covers software test automation, AI for testing and testing of AI-based systems
- Organized by Rajesh Subramanyan (University of Washington), T.H. Tse (University of Hong Kong) and Fevzi Belli (University of Paderborn)
- Not listed in the CORE portal; COMPSAC itself is CORE B
- Workshop papers are 6 pages (up to 2 extra pages at USD 125 each) and appear in the COMPSAC proceedings on IEEE Xplore
- Workshop deadlines are shared across all COMPSAC workshops
