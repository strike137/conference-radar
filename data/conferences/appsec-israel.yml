notes:
- Annual application security conference of the OWASP Israel chapter, held since 2007 (no editions in 2021, 2022 and 2024)
- One day at Tel Aviv Expo, Pavilion 10 (2025, 2026); over 800 attendees in 2025
- Vendor-neutral talks on secure development, cloud, mobile, API security and applied cryptography, chosen from a call for presentations on Sessionize
- 2026 edition was first announced for 18 May 2026 and then held on 6 October 2026
- Discounted ticket for OWASP members (membership 50 USD); no papers or proceedings
