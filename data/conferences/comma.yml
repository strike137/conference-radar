notes:
- Main conference series on computational argumentation (argumentation frameworks, dialogue, argument mining,
  explanation), started in Liverpool in 2006 out of the ASPIC project
- Biennial, held in even years in September, preceded by workshops and a summer school on argumentation
- All editions so far in Europe (2016 Potsdam, 2018 Warsaw, 2020 Perugia online, 2022 Cardiff, 2024 Hagen, 2026
  Barcelona)
- Proceedings published by IOS Press as an open access book
- Regular and Innovative Applications tracks, up to 12 pages including references; single blind review
- Also accepts system demonstrations (two page extended abstracts appear in the proceedings)
- Trevor Bench-Capon Best Student Paper Award
