notes:
- The first two editions ran with EuCNC & 6G Summit 2024 and 2025; the third (WS-17, half day) moved to IEEE WCNC 2026
- Organizers from Beihang, Queen's University Belfast, HKU, QMUL, Aalborg, Ericsson Research, TU Dresden, University of Seoul and the University of Oulu 6G Flagship
- Topics include AI-driven 6G air interface, ISAC, radio resource management, zero-energy devices, physical layer security and semantic communications
- Host conference may change from year to year
- Accepted and presented papers go into the WCNC proceedings in IEEE Xplore; no-show papers are removed
- Workshop papers up to 6 pages (2 extra pages at 100 USD each); submissions via EDAS
- Not listed in ICORE2026
