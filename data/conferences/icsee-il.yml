notes:
- Biennial flagship meeting of the IEEE Israel Section, held in Israel; the 2026 edition resumed the series after a hiatus of several years
- Steering committee of the heads of Israeli university and college EE and ECE departments
- Short papers of two pages (A4, IEEE template) plus one page of references, peer reviewed by a TPC of 13 subcommittees covering all of electrical engineering
- Accepted papers are presented orally or as posters; authors may choose to publish in IEEE Xplore by signing the IEEE copyright form, or present without archiving
- Two day conference with plenaries, tutorials, special symposia and a 3MT student competition
- Not listed in the CORE portal (ICORE2026)
