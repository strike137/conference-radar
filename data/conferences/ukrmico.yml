frequency: irregular
organizer: IEEE Ukraine Section and its chapters with Igor Sikorsky Kyiv Polytechnic Institute (part of IEEE Autumn
  Kyiv Polytechnic Week)
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
fee: 250 EUR IEEE member, 300 EUR non-member, 150 EUR IEEE student or life member, 200 EUR student (2027); large
  discounts for Ukrainian authors
typical:
  deadline_months: [7, 9]
  conference_months: [11]
links:
  website: https://ukrmico.ieee.org.ua/
notes:
- Ukrainian conference on telecommunications, microwaves, antennas, electron devices and computer networks, run by the
  IEEE Ukraine Section
- Held in Ukraine (Odesa 2017 to 2021, Kyiv 2023); annual until 2019, then 2021, 2023 and the 7th edition planned
  for 2027
- Separate from the IEEE Ukrainian Microwave Week (UkrMW)
- Hybrid format, single blind review, 4 to 6 page A4 papers via CMT; presented papers go to IEEE Xplore, no-show
  papers excluded
- At most two papers per author
- Not listed in ICORE2026 or the CCF 2026 list
