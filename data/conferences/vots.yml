id: vots
name: VOTS
full_name: Visual Object Tracking and Segmentation Challenge Workshop
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: VOT Challenge committee (University of Ljubljana, Czech Technical University in Prague, Linkoping University and others)
organizer_country: [international]
proceedings: ICCV / ECCV Workshops proceedings (CVF Open Access and IEEE Xplore for ICCV, Springer LNCS for ECCV)
archival: true
typical:
  deadline_months: [6]
  conference_months: [9, 10]
links:
  website: https://www.votchallenge.net/
notes:
  - Challenge workshop of the long-running Visual Object Tracking (VOT) series, held every year since 2013
  - Co-located with ICCV or ECCV in alternate years; renamed VOTS (tracking by segmentation) from 2023
  - Participants submit tracker results to the challenge; the challenge results paper is published in the ICCV or ECCV Workshops proceedings
  - 2026 edition had four challenges (VOTS, VOTSt transformative tracking, VOTSp point tracking, VOTSr referring tracking)
  - VOTS2026 workshop at ECCV 2026 had around 70 participants
  - The VOT series received the PAMI Mark Everingham Prize at ECCV 2026
  - Not listed in ICORE2026 or the CCF list
