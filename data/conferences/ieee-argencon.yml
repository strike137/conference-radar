id: ieee-argencon
name: IEEE ARGENCON
full_name: IEEE Biennial Congress of Argentina (ARGENCON)
type: conference
tier: minor
areas: [general, communications, ai]
region: latin-america
language: mixed
frequency: biennial
organizer: IEEE Argentina Section with a host Argentine university (Universidad Nacional de Cordoba FCEFyN in 2026)
organizer_country: [other]
proceedings: IEEE Xplore (English papers); Spanish papers in the congress proceedings book
archival: true
typical:
  deadline_months: [6]
  conference_months: [9, 11]
links:
  website: https://attend.ieee.org/argencon-2026/
notes:
- Biennial general engineering congress of the IEEE Argentina Section, first held in 2012 (8th edition in 2026)
- Broad EECS scope (electronics, computing, communications, energy, control, bioengineering, AI, signal processing)
- Papers in Spanish or English; only English papers can go to IEEE Xplore, for an extra 25 USD per paper (2026)
- Double-blind review via Microsoft CMT, single review cycle
- Held in Argentina, rotating between cities (San Juan 2022, San Nicolas de los Arroyos 2024, Cordoba 2026)
- Not listed in CORE ICORE2026 or the CCF list
