notes:
- Combined tutorial and workshop on processing-in-memory (PIM) and memory-centric systems, run by the ETH Zurich SAFARI group
- Moves between host conferences, often several times a year; ASPLOS 2025, ICS 2025, ISCA 2025, HPCA 2026 (Sydney), ASPLOS 2026 (Pittsburgh), ISCA 2026 (Raleigh), ICS 2026 (Belfast)
- Grew out of the SAFARI memory-centric computing tutorials (HEART, ISCA and MICRO 2024, PPoPP 2025)
- Lectures and invited talks plus contributed talks selected from short abstracts submitted through a form; no papers are published
- Slides are posted on the workshop page and sessions are livestreamed on YouTube
- Not listed in CORE ICORE2026 or the CCF list
