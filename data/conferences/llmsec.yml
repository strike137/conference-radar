notes:
- Workshop of the ACL Special Interest Group on NLP Security on adversarially induced failure modes of LLMs and their
  mitigations (prompt injection, jailbreaks, red teaming, RAG security, privacy)
- First edition co-located with ACL 2025 in Vienna; proceedings in the ACL Anthology (16 papers)
- Long papers up to 8 pages, short papers up to 4 pages, plus "war story" submissions up to 4 pages
- Accepts ARR pre-reviewed papers as well as direct submissions; coordinated disclosure required for new exploits
- Not listed in ICORE2026 and not on the CCF list
