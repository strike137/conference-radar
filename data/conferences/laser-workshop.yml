  website: https://www.acsac.org/2026/workshops/laser/
notes:
- One-day workshop on cybersecurity experiment methodology, negative results and reproducibility
- No call for papers since 2020; authors of accepted ACSAC papers are invited to present the experimental side of their
  work, and anyone can attend by registering for ACSAC
- No separate workshop papers or proceedings (2026 call); earlier standalone editions (2012 to 2017) had papers in ACM DL and USENIX
- Held with NDSS and ACSAC from 2020, with ACSAC only in recent years (Austin 2023, Honolulu 2024 and 2025, Los Angeles
  2026)
- About nine presentations and a keynote per edition
- Not listed in CORE ICORE2026 or the CCF list
