id: cv4ecology
name: CV4Ecology
full_name: Workshop on Computer Vision for Ecology
type: workshop
tier: minor
areas: [vision, ai]
region: europe
language: english
frequency: annual
organizer: Workshop organizing committee (MIT, KAUST, Texas A&M, Ohio State and others); co-located with ECCV or ICCV
organizer_country: [international]
proceedings: ICCV Workshops proceedings (CVF Open Access) or ECCV Workshops proceedings, archival track only
archival: true
typical:
  deadline_months: [7]
  conference_months: [9, 10]
links:
  website: https://cv4e-workshop.github.io
notes:
- Workshop on computer vision for ecological data collection and analysis (remote sensing, bioacoustics, camera traps, citizen science)
- Held with ECCV 2024 (Milan), ICCV 2025 (Honolulu) and ECCV 2026 (3rd edition, Malmo)
- Archival track papers (7 or 14 pages, ECCV format) go into the host conference workshop proceedings; non-archival track also accepts recently published work
- Double-blind review on OpenReview with at least two reviews per paper
- Runs a competition each year (Fish Species Recognition Challenge in 2026)
- Not listed in ICORE2026 or the CCF list
