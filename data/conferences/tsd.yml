notes:
- Czech conference on spoken and written language processing; Brno hosts in even years, Pilsen in odd years
- Blind review; papers up to 12 pages LNCS style including references; proceedings in Springer LNAI
- High acceptance (about 50%); 63 on-site participants in 2024
- 2025 edition moved abroad to Erlangen, Germany; TSD 2027 announced for Pilsen
- Not ranked by CORE or CCF
