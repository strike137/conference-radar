notes:
- International forum on visual data coding, established in 1969; claims the longest history of any conference in this area
- PCS 2027 is the 39th event in the series, held in Mexico City
- Topics include image and video coding, learning-based compression, coding for machines, point cloud, light field and immersive video coding, quality assessment and streaming
- Papers up to 5 pages including references in the IEEE template, no supplementary material; single-blind review
- Proceedings submitted to IEEE Xplore and indexed by Scopus and EI
- PCS 2027 hosts the 8th Challenge on Learned Image Compression (CLIC 2027); challenge entrants can also submit a full paper
- Not to be confused with the domestic Japanese PCSJ/IMPS
- CORE C (ICORE2026)
