id: icosst
name: ICOSST
full_name: International Conference on Open Source Systems and Technologies
type: conference
tier: minor
areas: [general, software, ai, security, networking, systems]
region: south-asia
language: english
frequency: annual
organizer: Al-Khawarizmi Institute of Computer Science (KICS), UET Lahore, with the Department of Computer Science, UET Lahore
organizer_country: [other]
proceedings: IEEE Xplore
fee: 200 USD IEEE member / 250 USD non-member author, students 125 / 150 USD (2025, foreign authors); Pakistani professional authors 15,000 / 18,000 PKR
typical:
  deadline_months: [9]
  conference_months: [12]
links:
  website: https://icosst.kics.edu.pk/
notes:
- Run by the Al-Khawarizmi Institute of Computer Science (KICS) at the University of Engineering and Technology (UET)
  Lahore, Pakistan; held annually at UET Lahore since 2006, in December in recent editions
- IEEE technical co-sponsorship (IEEE Lahore Section and chapters); papers that are presented go to IEEE Xplore
- Broad scope despite the name, from generative AI and LLMs to software engineering, IoT, networking and cyber security
- Hybrid event; presenters may join online or in person
- IEEE format, peer reviewed; at least one author per accepted paper must register and present
- Not listed in ICORE2026 or the CCF list
