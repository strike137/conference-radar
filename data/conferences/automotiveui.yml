notes:
- Also called AutoUI; ACM SIGCHI sponsored venue for in-vehicle and mobility user interfaces, human factors and
  automated driving interaction
- Full papers are peer reviewed and archived in the ACM Digital Library; other tracks (work in progress, demos,
  videos, workshops) appear in adjunct proceedings
- One full paper deadline in April with an abstract a week earlier; papers up to 13 pages in the single-column ACM
  format, deadlines AoE with no extensions
- Rotates worldwide (Seoul 2022, Ingolstadt 2023, Stanford 2024, Brisbane 2025, Gothenburg 2026, Guangzhou 2027)
- CORE B (ICORE2026); not on the CCF list
