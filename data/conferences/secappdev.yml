links:
  website: https://secappdev.org/
notes:
- Week-long application security course for developers, run since 2005 by the Belgian non-profit secappdev.org
- Organising committee includes KU Leuven faculty (Bart Preneel, Frank Piessens, Lieven Desmet) and Solvay (ULB);
  partners include KU Leuven and the Cyber Security Coalition
- Invited faculty only; there is no call for papers and no proceedings, but most speakers publish their slides on the
  site
- Held at the Faculty Club in the Groot Begijnhof, Leuven, Belgium
- '2026 format: three days of lectures followed by two days of workshops'
- Paid event aimed at practitioners (2026 full course 3500 EUR excl. VAT, early bird 3000 EUR, community ticket
  1750 EUR)
- Not listed in CORE ICORE2026
