notes:
- Danish community security conference run by the association Foreningen BSides Aarhus, relaunched with a kickoff conference in 2025
- One day with two parallel tracks of talks; the 2025 kickoff had ten speakers at EAAA, 2026 was held at INCUBA Next, Katrinebjerg
- Talks selected through an open CFP; the 2026 conference sold out
- Free student tickets for Aarhus university students
- No proceedings
