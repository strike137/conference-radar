notes:
- Regarded as the main venue dedicated to hardware security (Trojans, side channels, fault injection, PUFs/TRNGs,
  SoC and architecture security); not listed by CORE or CCF
- 'Held every year in the USA: San Jose, CA (2025), McLean, VA near Washington DC (2026), Washington DC (2027);
  2027 is the 20th edition'
- Two submission windows (Fall and Winter) with a first-round decision and a major-revision round; double-blind
  review, rebuttal for long papers
- 2027 accepts long (10 pages + 2 refs) and short (5 pages + 1 ref) papers in IEEE format
- NSF student travel grants are limited to full-time students at US institutions; a separate AsianHOST symposium
  is held in Asia
