notes:
- Workshop of IEEE COMPSAC on blockchain and DLT (consensus, smart contracts, security, privacy, zero-knowledge
  and post-quantum cryptography); follows COMPSAC around the world
- 1st edition at COMPSAC 2025 (Toronto), 2nd at COMPSAC 2026 (Madrid); COMPSAC 2027 is in Tokyo
- Workshop papers up to 6 pages (2 extra pages at 125 USD each), submitted via EasyChair; published in the COMPSAC
  proceedings on IEEE Xplore
- Shares the common COMPSAC workshop deadlines (mid April, usually extended); 6 papers in the 2026 program
- Separate from the COMPSAC BlockChain symposium (BEST)
- Not listed in ICORE2026
