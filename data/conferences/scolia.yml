notes:
- Continues the Bibliometric-enhanced Information Retrieval (BIR) workshop series, held since 2014 (BIR 2014 to 2024, renamed SCOLIA in 2025)
- Half-day workshop co-located with ECIR every year; also held as BIRNDL with JCDL and SIGIR in some years
- Topics are scholarly search, recommendation, bibliometrics and scientometrics for information retrieval
- Proceedings in CEUR Workshop Proceedings (Vol-4022 for 2025, Vol-4187 for 2026)
- Full papers (12 pages), short papers (6 pages) and shared task proposals (4 pages) in CEURART style; single-blind review via EasyChair with at least two reviewers
- At least one author must attend in person, otherwise the paper is removed from the proceedings
- Not listed in ICORE2026 and not on the CCF list
