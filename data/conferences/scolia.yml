notes:
- Workshop on academic search and recommendation at the crossroads of information retrieval, NLP and bibliometrics/scientometrics
- Continues the BIR (Bibliometric-enhanced Information Retrieval) series founded in 2014 (14 editions to 2024, some as BIRNDL at SIGIR or JCDL)
- Renamed SCOLIA in 2025 with a broader scope including generative AI, RAG and scientific integrity; SCOLIA 2026 is the second edition
- Co-located with ECIR almost every year; half-day workshop
- Proceedings in CEUR-WS (SCOLIA 2026 is Vol-4187); 8 of 17 submissions accepted in 2026
- Full papers 12 pages and short papers 6 pages in CEUR-ART style, single-blind, at least two reviewers; no-show papers are removed from the proceedings
- Hosts shared tasks (UP2DATE on updating systematic reviews in 2026)
- Not listed in ICORE2026 and not on the CCF list
