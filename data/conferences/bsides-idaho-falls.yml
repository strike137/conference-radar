notes:
- Volunteer-run Security BSides conference in Idaho Falls, Idaho, USA, financially supported by the nonprofit EICEA
- Held at the Idaho State University Idaho Falls campus; two days with workshops, two talk tracks and villages (car hacking, solder, ham radio, lockpick, KidsCon)
- Moving from September to April; the September 2026 edition was skipped and the next one is April 2027
- Separate calls for papers (talks) and workshops
- Talks only, no proceedings
- Not listed in the CORE ICORE2026 portal
