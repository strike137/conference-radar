notes:
- Written DC²-FPGA; first edition co-located with SOSP 2026 in Prague
- Half-day workshop on FPGA computing stacks at cloud scale (SmartNICs, accelerators, OS and hypervisor support, CXL memory, quantum control, cloud FPGA security)
- "Format: hands-on Coyote tutorial (open-source HW/SW stack for data center FPGAs), invited talks and contributed talks"
- Contributed talks selected from short abstracts (up to 1000 words) sent through a Google Form; published and ongoing work both welcome
- No papers or proceedings; talk only
- Organized by Gustavo Alonso, Benjamin Ramhorst, Maximilian Heer (ETH Zurich) and Atsushi Koshiba (Tokyo University of Science, chair)
- Not listed in CORE ICORE2026 or the CCF list
