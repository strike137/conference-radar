notes:
- Flagship IEEE CIS conference on computational intelligence and machine learning for bioinformatics, computational biology and biomedical engineering
- 24th edition in 2027
- Accepted and presented papers are submitted to IEEE Xplore
- In 2025 short papers appeared only on the conference website, not in IEEE Xplore
- Full papers up to 8 pages (oral), short papers up to 2 pages (poster), IEEE two-column format
- 2027 edition adds a pre-conference PhD competition and hackathon day
- CORE ICORE2026 rank C (listed as IEEE Symposium on Computational Intelligence in Bioinformatics and Computational Biology); not on the CCF 2026 list
