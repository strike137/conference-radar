notes:
- Bridges generative AI (LLMs) and formal verification (theorem provers, SAT solvers, program analysis), both directions
- First held at ICLR 2025 (Singapore); VerifAI-2 at ICLR 2026 (Rio de Janeiro) with a special theme on verifiable tasks and environments for RL
- Regular papers up to 8 pages and tiny papers up to 4 pages; double-blind review on OpenReview
- Non-archival; recently published or concurrently submitted work is allowed
- Not listed in ICORE2026 and not on the CCF list
