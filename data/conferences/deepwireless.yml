notes:
- One-day workshop co-located with IEEE INFOCOM every year since 2023 (New York 2023, Vancouver 2024, London 2025,
  Tokyo 2026)
- Accepted and presented papers appear in the IEEE INFOCOM workshop proceedings in IEEE Xplore
- Papers up to 6 pages including references in IEEE two-column format, submitted via EDAS; demo papers also solicited
- Steering committee Shiwen Mao (Auburn University) and Yingying Chen (Rutgers University)
- Covers deep learning for physical layer, wireless sensing, localization, RF fingerprinting and wireless security
- Not listed in ICORE2026
