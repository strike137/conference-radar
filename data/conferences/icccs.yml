id: icccs
name: ICCCS
full_name: International Conference on Computer and Communication Systems
type: conference
tier: minor
areas: [networking, communications]
region: china
language: english
frequency: annual
organizer: ICCCS organizing committee with a host university each year (Wuhan University of Technology 2026, Shenzhen
  University 2027), with IEEE
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 600 USD / 4200 RMB author non-member, 550 USD / 3900 RMB student non-member, 520 USD / 3700 RMB IEEE member;
  listeners 220 to 250 USD (2027)
typical:
  deadline_months: [10]
  conference_months: [4]
links:
  website: https://www.icccs.org/
notes:
- Started in 2015 (Kanyakumari, India); held in Krakow, Nagoya and Singapore before moving to China, held in
  Chinese university cities every year since 2020 (virtual in 2020 and 2022)
- Papers published in IEEE conference proceedings in IEEE Xplore; the site states all editions 2015 to 2026 are
  indexed by EI Compendex and Scopus
- Not listed in ICORE2026; host university changes every year
- Not the same venue as IEEE ICCC (International Conference on Computer and Communications, Chengdu)
