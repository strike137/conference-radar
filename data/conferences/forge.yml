notes:
- Foundation models and LLMs for software engineering and vice versa; co-located with ICSE every year
- 2026 edition was the 3rd (Rio de Janeiro, Apr 12 to 13); 2027 is the 4th (Dublin, Apr 26 to 27)
- "Full papers 10 pages plus 2 of references; new idea papers 4 pages plus 2 of references; strict page limit"
- Double-anonymous review via HotCRP; 2027 has research and data and benchmarking tracks (2026 also had an industry track)
- Best papers get an ACM SIGSOFT Distinguished Paper Award; in 2026 selected papers were invited to an Empirical Software Engineering special issue
- 2026 papers are in the ACM DL (Proceedings of the 2026 IEEE/ACM Third International Conference on AI Foundation Models and Software Engineering); 2027 switches to the IEEE template
- Not listed in the CORE ICORE2026 portal
