notes:
- Workshop on online data analysis and reduction (lossy compression, reduced-order models, in situ analysis) for HPC and scientific data
- Held with the SC conference since 2016; 11th edition (DRBSD-11) at SC25 in St. Louis
- Moves with SC, so it is held in the USA (Denver 2023, Atlanta 2024, St. Louis 2025)
- In cooperation with IEEE Computer Society and ACM; all accepted papers go into the SC workshop proceedings
- Full papers 10 pages and short papers 6 pages in ACM format, single-blind, at least 3 reviewers per paper
- Best paper, runner-up and best short paper awards
- Not ranked in CORE ICORE2026 and not on the CCF 2026 list
