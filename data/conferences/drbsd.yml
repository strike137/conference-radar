id: drbsd
name: DRBSD
full_name: International Workshop on Data Analysis and Reduction for Big Scientific Data
type: workshop
tier: minor
areas: [data, systems]
region: north-america
language: english
frequency: annual
organizer: DRBSD organizing committee (Argonne National Laboratory and partners), held with SC
organizer_country: [usa]
proceedings: SC Workshops Proceedings (ACM DL 2025)
archival: true
typical:
  deadline_months: [8]
  conference_months: [11]
links:
  website: https://drbsd.github.io/
notes:
- One-day workshop on data reduction, lossy compression and online analysis of large scientific data, held with SC; 2025 was the 11th edition (DRBSD-11)
- In cooperation with IEEE Computer Society and ACM
- Full papers (10 pages including references) and short papers (6 pages), single-blind ACM format, at least three reviews
- All accepted papers appear in the SC workshop proceedings (ACM DL for SC25)
- Best Paper, Best Paper Runner-up and Best Short Paper awards
- Held at SC every year in the USA (Denver 2023, Atlanta 2024, St. Louis 2025)
- Not among the workshops announced for SC26
- Not listed in CORE ICORE2026
