notes:
- Workshop on networking for the Internet of Agents (agent communication protocols such as MCP, A2A and ANP,
  discovery, congestion control for agentic workloads, security of multi-agent systems)
- Held with IEEE ICNP 2026 in Tempe, Arizona; not among the ICNP 2025 workshops
- Original research, position papers and early-stage work; up to 6 pages including references in IEEE Computer
  Society format; double-blind review via HotCRP
- Accepted papers are published in the ICNP workshop proceedings in IEEE Xplore
- Not listed in the CORE portal (ICORE2026) or the CCF list
