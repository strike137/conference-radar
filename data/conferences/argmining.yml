notes:
- Annual since 2014 (Workshop on Argument Mining); renamed Workshop on Argument Mining and Reasoning in 2026
- Long (8 pages) and short (4 pages) papers go into the ACL Anthology; extended abstracts and PhD proposals are
  non-archival
- Accepts pre-reviewed ARR papers via a commitment deadline; hosts a shared task each year
- Follows its host conference (COLING 2022 Gyeongju, EMNLP 2023 Singapore, ACL 2024 Bangkok, ACL 2025 Vienna,
  ACL 2026 San Diego, EACL 2027 Athens); hybrid format
