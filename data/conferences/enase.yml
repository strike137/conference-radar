notes:
- Organized by INSTICC; proceedings in the SCITEPRESS Digital Library, revised and extended selected papers planned for
  a Springer CCIS book
- CORE B (ICORE2026); not on the CCF list
- Software engineering venue focused on evaluating new methods, tools and processes; 2027 is the 22nd edition
- Two submission stages (1st stage gives an earlier notification), plus position papers and an abstracts track
- Held in European cities (Prague 2023, Angers 2024, Porto 2025, Benidorm 2026, Rome 2027) and co-located with
  ICEIS, IoTBDS, GISTAM, ICT4AWE and FEMIB with free cross access as a non-speaker
- Remote presentation allowed when speakers cannot travel
