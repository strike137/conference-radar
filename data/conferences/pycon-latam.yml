notes:
- Regional community conference for the Python language in Latin America, run by a volunteer organizing committee
- Talks chosen from an open call for proposals; newcomers are encouraged to submit
- Website is bilingual Spanish and English; scholarships for attendees from Latin America with limited means
- 2026 edition held at the University of Costa Rica Atlantic Campus in Turrialba, Costa Rica
- Talks only, no papers or proceedings
