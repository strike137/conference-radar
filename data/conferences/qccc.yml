notes:
- Half-day workshop on hybrid quantum-classical systems, architecture, compilation and error correction
- QCCC-26 was the fifth edition, held with ISCA 2026 in Raleigh; QCCC-25 was held with ISCA 2025 in Tokyo
- Submissions are 2 to 4 page extended abstracts in IEEE or ISCA workshop format via EasyChair
- Accepted abstracts appear in the workshop proceedings and authors remain free to submit a full version elsewhere
- Pure quantum or pure classical work and device benchmarking are out of scope
- Not listed in CORE ICORE2026 and not on the CCF list
