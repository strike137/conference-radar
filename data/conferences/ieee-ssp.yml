notes:
- Biennial IEEE Signal Processing Society workshop on statistical signal processing and its applications (23rd edition
  in 2025)
- Papers of four pages of technical content plus a fifth page for references only, submitted through EDAS; regular and
  special session tracks
- Proceedings in IEEE Xplore; papers not presented in person are withheld from Xplore
- Authors of SPS journal papers accepted or published within the last year can present them (not included in the
  proceedings)
- Location rotates worldwide (Edinburgh 2025)
- Not listed in ICORE2026
