notes:
- Long-running explainable AI workshop held with IJCAI every year; follows IJCAI around the world (Macau 2023, Montreal 2025, Bremen 2026)
- Not the World Conference on eXplainable AI (xai-world) or the XAIE workshop
- Covers XAI broadly, with special tracks on human-centered XAI, explainable sequential decision-making and interpretable machine learning (2026)
- Long papers 7 pages and short papers 4 pages plus references in the IJCAI template; double-blind review
- Proceedings are non-archived; authors keep copyright and may submit the work elsewhere later; papers and a full proceedings PDF are posted on the site
- Papers rejected from the IJCAI-ECAI Human-centered AI track can be submitted with their reviews
- Two-day workshop in 2026; program includes a keynote, paper and poster sessions and a fishbowl panel
- Not listed in ICORE2026 and not on the CCF list
