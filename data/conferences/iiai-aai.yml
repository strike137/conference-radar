organizer: International Institute of Applied Informatics (IIAI)
organizer_country: [japan]
proceedings: IEEE CPS / IEEE Xplore (ICT papers) and IIAI Letters / IIAI OCPS (other papers)
archival: true
rank:
  core: Unranked
fee: 86,800 JPY (560 USD) non-member, 70,800 JPY (460 USD) student non-member (2026, early)
typical:
  deadline_months: [4, 10, 11]
  conference_months: [7, 12]
links:
  website: https://iaiai.org/conference/aai2026/
notes:
- 'Umbrella congress run by IIAI: about nine small conferences in summer (ESKM, LTLE, DSIR, SCAI, BMOT, SBIT, IDDC,
  DSTM, CDEF), four in the Winter edition (ESKM, LTLE, DSIR, SCAI)'
- Summer congress in a Japanese regional city every July (2023 Koriyama, 2024 Takamatsu, 2025 Kitakyushu, 2026 Fukui);
  a Winter edition in December elsewhere in Asia (2023 Bali, 2024 Jakarta after a move from Ho Chi Minh City, 2025
  Phuket, 2026 Kaohsiung)
- ICT papers (6 pages full, 4 short, 2 poster) go to CPS proceedings, which appear in IEEE Xplore (including 2025-Winter
  and 2026); education and management papers go to IIAI Letters
- Blind review; submission deadlines are often extended; registration is relatively expensive and every attendee
  must register
- Not ranked by CORE or CCF
