id: wicv
name: WiCV
full_name: Women in Computer Vision Workshop
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: multiple-per-year
organizer: WiCV organizing committee (volunteer researchers); held with CVPR and with ICCV, ECCV or ACCV
organizer_country: [international]
proceedings: IEEE Xplore and CVF Open Access (CVPR Workshops proceedings); Springer LNCS (ECCV Workshops)
archival: true
typical:
  deadline_months: [3, 7]
  conference_months: [6, 9]
links:
  website: https://sites.google.com/view/wicv-cvpr-2026/
notes:
- Workshop for women researchers in computer vision with invited talks, mentoring, posters and travel grants; held since 2015
- Usually held twice a year, with CVPR and with ICCV, ECCV or ACCV (CVPR 2025 Nashville, ICCV 2025 Honolulu, CVPR 2026 Denver, ECCV 2026 Malmo)
- Paper submission open to those who identify as women; all genders may attend
- Full papers are double-blind reviewed and published in the host conference workshop proceedings (CVPR -> IEEE Xplore and CVF Open Access, ECCV -> Springer)
- Extended abstracts (2 pages at CVPR 2026, 4 pages at ECCV 2026) are presented as posters and are not in the proceedings
- Not listed in ICORE2026 and not on the CCF list
