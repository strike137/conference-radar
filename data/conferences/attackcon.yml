notes:
- Annual practitioner conference of the MITRE ATT&CK team on using the ATT&CK framework for threat-informed defense
- Held at MITRE in McLean, Virginia, USA with a virtual option; every edition since 2018 has been in McLean apart from the online 2020 PowerHour series
- Talks by ATT&CK users from industry and government; recordings and slide decks are posted on the ATT&CK website, no formal proceedings
- "In-person fee for 2026: 375 USD (industry or academia), 275 USD (U.S. government)"
- Optional threat-informed defense training session the day after the 2026 conference
