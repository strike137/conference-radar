notes:
- Spring general conference of KIICE (Korea Institute of Information and Communication Engineering), based in Busan;
  the society also runs a fall conference (see KIICE Fall) and the international ICFICE
- Held every May; Jeju in 2025 (57th) and 2026 (59th)
- Short papers of 2 to 3 pages in Korean (HWP or Word); pages beyond 3 cost 10,000 KRW each; title and abstract
  are submitted first, then the paper
- Presenting authors must pre-register; selected presented papers are invited to the society's Korean journal
  (JKIICE) after review
- Includes undergraduate special sessions and a middle/high-school session, plus online oral (Zoom) and poster
  (Padlet) sessions
