region: north-america
language: english
frequency: annual
organizer: HPC System Test Working Group (hosted by OLCF), held with SC
organizer_country: [usa]
proceedings: SC Workshops Proceedings (ACM template in 2025; IEEE templates in 2026)
archival: true
typical:
  deadline_months: [8]
  conference_months: [11]
links:
  website: https://olcf.github.io/hpc-system-test-wg/hpctests/hpctests2026
notes:
- Half-day workshop on HPC system testing, acceptance and regression testing, benchmarks and monitoring, held with SC since 2023 (2026 is the 4th edition)
- Run by the HPC System Test Working Group; chairs and committee from HPC centers and vendors in the USA, Europe, Saudi Arabia and Australia
- Papers of at least 4 two-column pages excluding bibliography (IEEE template in 2026), single-blind review
- Follows the SC reproducibility initiative; only the Artifact Evaluation-Functional badge is offered
- Listed by SC26 among the workshops with papers in the SC Workshop Proceedings
- Not listed in CORE ICORE2026
