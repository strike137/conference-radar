notes:
- ICSE workshop on AI for formal verification and trusted software (proof engineering, specification, neuro-symbolic and agentic approaches, trustworthy code synthesis)
- Held at ICSE 2027 in Dublin
- Research papers up to 8 pages and vision extended abstracts up to 2 pages, IEEE format, single-blind review
- Presentations of already published work are non-archival and not in the proceedings
- ICSE 2027 workshop papers are published by IEEE
- At least one author must register and present in person
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
