id: vdat
name: VDAT
full_name: International Symposium on VLSI Design and Test
type: conference
tier: minor
areas: [systems, communications, security]
region: south-asia
language: english
frequency: annual
organizer: VLSI Society of India, with a rotating Indian host institute (JIIT Noida in 2026)
organizer_country: [india]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [5]
  conference_months: [8]
links:
  website: https://vdat.org.in/
notes:
- Supported by the VLSI Society of India, whose president and secretary chair the steering committee
- Began as a workshop in 1998, became a symposium in 2005 and is held every year; 30th edition in 2026
- The host institute rotates within India (Chandigarh in 2025, Vellore in 2024, Noida in 2026)
- Accepted and presented papers are submitted to IEEE Xplore; recent volumes (2020, 2021, 2024, 2026) are in Xplore
- Covers VLSI and SoC design, devices, EDA, AI hardware, test and reliability, hardware security, packaging and quantum
  hardware
- Double-blind review, 6 pages max in IEEE format, submission and camera-ready via SoftConf
- Not listed in ICORE2026 or the CCF 2026 list; a regional venue with strong Indian industry participation
- Not the same as VLSI-DAT (Taiwan) or VLSID (International Conference on VLSI Design)
