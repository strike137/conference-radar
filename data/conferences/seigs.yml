notes:
- One-day ICSE co-located event (called a symposium) on software engineering challenges and solutions in Global South countries
- Also held at ICSE 2025 (Ottawa); the organizers say the initiative started at ICSE 2018
- 2026 organizers from Makerere University (Uganda), Eindhoven University of Technology and Chalmers / University of Gothenburg
- Full papers up to 8 pages, short papers and experience reports up to 4 pages, extended abstracts up to 5 pages; ACM format, double-blind review
- 2026 papers published by ACM; extended abstracts are APC free, other papers need an ACM Open agreement or APC (250 USD members, 350 USD non-members)
- At least one author must register and present in person
- Not on the ICSE 2027 workshop list, so the next edition is not announced yet
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
