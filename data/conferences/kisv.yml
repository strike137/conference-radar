notes:
- Workshop on kernel isolation, safe languages such as Rust and formal verification of kernel code, co-located with ACM SOSP
- Editions so far at SOSP 2023 (Koblenz), SOSP 2024 (Austin) and SOSP 2025 (Seoul); the 2024 edition was titled Workshop on
  Kernel Security, Isolation, and Verification
- Accepted papers are published in the ACM Digital Library by default
- Research papers, position papers and experience reports up to 6 pages plus references in the ACM sigplan format; double-blind
- KISV is not among the workshops co-located with SOSP 2026 (Prague)
- Not listed in the CORE portal (ICORE2026)
