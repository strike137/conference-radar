notes:
- Held as part of SPLASH (ACM SIGPLAN); Singapore 2025 and Oakland 2026
- Venue for visionary, early-stage ideas on programming and software that are well argued but not yet proven
- Two tracks, Onward! Papers (double-blind) and Onward! Essays (single-blind); both appear in the Onward! Proceedings in the ACM DL
- Papers up to 13 pages for the main body at submission, 17 pages after revision; two-stage review with conditional acceptance
- CORE C (ICORE2026)
