id: signlang
name: SignLang
full_name: Workshop on the Representation and Processing of Sign Languages
type: workshop
tier: minor
areas: [nlp, vision, ai]
region: europe
language: english
frequency: biennial
organizer: sign-lang@LREC organizing committee led by the University of Hamburg (Thomas Hanke) with Athena RC (Athens), Stockholm University and Gallaudet University; co-located with LREC
organizer_country: [europe]
proceedings: ELRA LREC workshop proceedings (ACL Anthology, sign-lang@LREC Anthology)
archival: true
typical:
  deadline_months: [2]
  conference_months: [5, 6]
fee: "130 EUR early, 60 EUR student early (2026, workshop only)"
links:
  website: https://www.sign-lang.uni-hamburg.de/lrec2026/
notes:
- Full-day workshop on sign language corpora, annotation, lexicons, recognition, translation and avatars, held on the
  last day of LREC every two years since 2004 (12th edition in 2026)
- Each edition has a special theme (2026 Language in Motion, 2024 Evaluation of Sign Language Resources)
- Proceedings published by ELRA with ISBN and DOI, also in the ACL Anthology and the sign-lang@LREC Anthology (52
  papers in 2026)
- Oral or signed presentations and posters; sign language interpretation provided
- Recent editions in Miyazaki (2018), Marseille (2020, online proceedings only; 2022), Torino (2024) and Palma de
  Mallorca (2026)
- Not listed in ICORE2026 and not on the CCF list
