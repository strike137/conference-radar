notes:
- One-day ICSE workshop on quantum software engineering (testing, verification, languages, architectures, quantum DevOps)
- Held with ICSE every year since 2020; 7th edition in Rio de Janeiro 2026, 8th edition in Dublin 2027
- Describes itself as the venue with the longest tradition in quantum software engineering
- 2027 accepts regular papers up to 8 pages and position or work in progress papers of 2 to 5 pages, IEEE format, double-anonymous review
- Proceedings follow ICSE workshop publication; 2025 in IEEE Xplore, 2026 with ACM (ACM template and ACM Open fees), 2027 with IEEE
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
