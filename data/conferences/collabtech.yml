notes:
- International forum on collaboration technology, CSCW, CSCL and social computing, with a strong Japanese community
- Proceedings in Springer LNCS; double-blind review
- Full papers 9 to 16 pages, work-in-progress papers 5 to 8 pages, short papers and posters 1 to 5 pages
- CollabTech 2026 (32nd) was hosted by Trier University, Germany, as a hybrid event
- The 2026 site is on the Trier HCI group pages under a URL that still says collabtech-2021
- 2026 program -> reception Sep 22, sessions Sep 23 to 24, social trip to Cochem Sep 25
- "Registration fee 2026: 310 EUR regular, 210 EUR student (early, on site, plus VAT on the social program part); 220 EUR online"
