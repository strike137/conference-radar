notes:
- Flagship conference on semiconductor process technology, devices and circuits, started in 1981 (Technology) and
  1987 (Circuits); the two symposia were merged into one event in 2022
- Sponsored by IEEE EDS, IEEE SSCS and JSAP, in cooperation with IEICE
- Alternates every June between Kyoto (Rihga Royal Hotel) and Honolulu (Hilton Hawaiian Village)
- Three-page paper submission; accepted papers are published as submitted with no revisions, in the Digest of
  Technical Papers on IEEE Xplore
- A small number of late news papers are accepted about two months after the main deadline
- Extended versions of outstanding papers are invited to IEEE TED, IEEE JSSC and IEEE SSC-L
- Best Student Paper Award and Best Demo Paper Award; strong industry participation
- Not listed in ICORE2026 or the CCF list; device and circuits venue outside the usual CS rankings
