region: southeast-asia
language: english
organizer: Centre for Artificial Intelligence and Data Science (CAIDaS), Universiti Malaysia Pahang Al-Sultan Abdullah
  (UMPSA), with the IEEE Malaysia Instrumentation and Measurement Chapter
organizer_country: [malaysia]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [5, 7]
  conference_months: [9]
links:
  website: https://icaiia.umpsa.edu.my/
notes:
- New conference; the 1st edition was held in 2026 at The Everly, Putrajaya, Malaysia
- Organized by CAIDaS at UMPSA in collaboration with the IEEE Malaysia Chapter (Instrument and Measurement)
- Papers of 4 to 6 pages in IEEE format, blind-reviewed by at least three reviewers; accepted papers that are not
  presented are not sent to IEEE Xplore
- The site states that all papers presented at ICAIIA 2026 are published in IEEE Xplore
- Eight tracks from AI foundations and data science to AI applications, robotics and IoT, and instrumentation and
  measurement
- "Registration RM1300 to RM1700 physical, RM800 to RM1200 online (2026, IEEE student member to non-member)"
- Not listed in ICORE2026 or the CCF list
