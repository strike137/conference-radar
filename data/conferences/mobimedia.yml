notes:
- EAI conference series run with Chinese universities; 19th edition in 2026
- Proceedings in Springer LNICST; full papers 12 to 20 pages, short papers 6 to 11 pages in the LNICST template
- Main track plus a later late track; selected papers invited to the Springer MONET journal and EAI Endorsed
  Transactions
- Held in China since 2015 (Guilin 2023, Hangzhou 2024 hybrid, Lhasa 2025, Kunming 2026 hybrid); 2020 and 2022
  were virtual
- Not found in the ICORE2026 CORE list; minor venue
