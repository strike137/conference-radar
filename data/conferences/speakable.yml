links:
  website: https://speakable-2026.github.io/
notes:
- Full-day workshop on speech-native language models for low-resource languages and speaker groups, with a focus on efficient adaptation, evaluation beyond WER, and bias analysis
- First edition held with LREC 2026 in Palma, Mallorca on May 11 2026
- Proceedings published by ELRA and hosted in the ACL Anthology (2026.speakable-1, 21 papers)
- Papers of 4 to 8 pages in the LREC 2026 template, double-blind review via Softconf START; oral or poster presentation
- Hybrid participation possible; at least one author must register for LREC 2026
- No 2027 or later edition announced as of 2026-11-07
- Not listed in ICORE2026 and not on the CCF list
