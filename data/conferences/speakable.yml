language: english
organizer: Workshop organizing committee (University of Luxembourg, RTL, Fondazione Bruno Kessler, Tallinn University of Technology); co-located with LREC
organizer_country: [europe]
proceedings: ACL Anthology (ELRA)
archival: true
typical:
  deadline_months: [2]
