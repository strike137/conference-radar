notes:
- Workshop co-located with IEEE WCNC; ran at WCNC 2025 in Milan and as the third edition at WCNC 2026 in Kuala Lumpur (half day)
- 2026 general chairs from University of Granada and Australian National University; TPC chairs from Liverpool,
  Coimbra, Linkoping and Southeast University
- Topics include secret key generation, physical layer authentication, RF fingerprinting, covert communications
  and machine learning for physical layer security
- Accepted and presented papers go into the WCNC proceedings in IEEE Xplore; no-show papers are removed
- Workshop papers up to 6 pages (2 extra pages at 100 USD each); submissions via EDAS
- Not in the IEEE WCNC 2027 call for workshop papers (checked 2026-10-17)
- Not listed in ICORE2026
