notes:
- Symposium on applying formal methods, verification and validation tools in practice, running since 2004
- Organised by track; each track has talks of about 20 minutes followed by a concluding panel discussion
- Run by Tiziana Margaria (Lero, Ireland) and Bernhard Steffen (TU Dortmund, Germany); local arrangements by EasyConferences (Cyprus)
- Held on Greek islands or Cyprus (Corfu 2016, Limassol 2018, Rhodes 2021 and 2022, Crete 2024, Kos 2026)
- Biennial in recent years; the sister symposium AISoLA on AI runs alongside it and also took place alone in 2023 and 2025
- Two routes to publication; mature papers go to on-site Springer LNCS proceedings, talk-only contributions can go to LNCS post-proceedings
- Selected papers invited to special issues or sections of the STTT journal
- CORE C (ICORE2026); not on the CCF list
