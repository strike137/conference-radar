id: winlp
name: WiNLP
full_name: Widening Natural Language Processing Workshop
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: WiNLP organizing committee; co-located with EMNLP (2025 Suzhou, 2026 Budapest)
organizer_country: [international]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [7, 8]
  conference_months: [10, 11]
links:
  website: https://winlp-workshop.github.io/
notes:
- Diversity and inclusion workshop of the ACL community that highlights research from underrepresented groups in NLP; held since 2017, 2026 is the 10th edition
- Co-located with EMNLP in recent years (Suzhou 2025, Budapest 2026); hybrid
- Archival papers appear in the WiNLP proceedings in the ACL Anthology (2025 -> 30 papers); authors may choose non-archival
- Long papers 8 pages, short papers 4 pages, extended abstracts 2 pages, and thesis proposals; ARR commitment also accepted
- Optional pre-submission mentoring round about two months before the paper deadline
- Travel grants for one author per accepted paper; no workshop registration fee listed
- Not listed in ICORE2026 and not on the CCF list
