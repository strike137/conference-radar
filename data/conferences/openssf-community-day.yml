links:
  website: https://events.linuxfoundation.org/openssf-community-day-north-america/
notes:
- One-day open source software security and supply chain security event run by OpenSSF on the Linux Foundation
  events site
- Co-located with a Linux Foundation Open Source Summit; OpenSSF also holds regional Community Days elsewhere as
  separate events
- Talks chosen from a call for proposals (5, 10, 15 or 20 minute sessions); no papers or proceedings
- Recordings go to the OpenSSF YouTube channel and slides are linked from the schedule
- Topics include supply chain security, AI and ML in security, regulatory compliance, signatures and verification
- Not listed in ICORE2026
