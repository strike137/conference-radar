id: codi-crac
name: CODI-CRAC
full_name: Joint Workshop on Computational Approaches to Discourse, Context and Document-Level Inferences and Computational Models of Reference, Anaphora and Coreference
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizing committee (CNRS IRIT, IT University of Copenhagen, UT Austin, University of Gothenburg, UT Dallas, Charles University, Polish Academy of Sciences, Queen Mary University of London, HITS and others); endorsed by SIGDIAL; co-located with ACL-family conferences
organizer_country: [europe, usa]
proceedings: ACL Anthology
archival: true
links:
  website: https://sites.google.com/view/codi-crac2026
notes:
- Merger of two workshop series, CODI (discourse, since 2020) and CRAC (reference, anaphora and coreference, since 2018, preceded by CORBON 2016 and 2017)
- First joint edition at EMNLP 2025 in Suzhou, China; second at ACL 2026 in San Diego, USA, on July 3, 2026 (7th CODI and 9th CRAC)
- Each year with a different host conference (CODI at EMNLP 2020, EMNLP 2021, COLING 2022, ACL 2023, EACL 2024); host and dates change every year
- Proceedings in the ACL Anthology
- Long papers up to 8 pages, short papers and demos up to 4 pages; 2-page extended abstracts are non-archival; ARR fast-track and non-archival presentation of papers accepted at other venues also accepted
- Hosts the CRAC shared task on multilingual coreference resolution (CorefUD), whose system papers appear in the proceedings
- Endorsed by SIGDIAL; student travel grants sponsored by HITS in 2026
- Not ranked in ICORE2026 and not on the CCF list
