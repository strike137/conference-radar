id: ieee-icsict
name: IEEE ICSICT
full_name: IEEE International Conference on Solid-State and Integrated Circuit Technology
type: conference
tier: minor
areas: [systems, communications]
region: china
language: english
frequency: biennial
organizer: IEEE China Council and IEEE Beijing Section (co-sponsors), with Chinese universities
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 3800 CNY / 565 USD non-member, 3500 CNY / 520 USD IEEE or IET member, 2700 CNY / 400 USD student (2026,
  before Sept. 30)
typical:
  deadline_months: [6, 7, 8]
  conference_months: [10]
links:
  website: https://www.icsict.org/
notes:
- Chinese conference on solid-state devices, IC design, process technology and materials, held since 1986, every two
  years since 2004 (even years); alternates with ASICON, which is held in odd years
- Papers of at least 3 pages in English, reviewed by at least two experts; extra page charges from page 6
- Accepted and presented papers are submitted to IEEE Xplore and for EI Compendex and Scopus indexing; papers not
  presented are not submitted to IEEE Xplore
- Always held in China (Nanjing 2022 online, Zhuhai 2024, Hangzhou 2026); includes a design competition and an
  exhibition
