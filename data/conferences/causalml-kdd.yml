notes:
- Half-day KDD workshop on applying causal inference with machine learning in industry; organizers are mostly from industry (Snap, Amazon, Instacart, Uber, Roblox) plus UC Berkeley and UW
- Held with KDD 2023 (Long Beach), KDD 2024 (Barcelona) and KDD 2025 (Toronto); not in the KDD 2026 workshop list
- Abstract deadline about five weeks before the paper deadline; all deadlines AoE
- Single-blind review via Microsoft CMT; up to 6 pages excluding references in the ACM two-column template
- Accepted papers are given as oral talks or posters and their PDFs are posted on the workshop website; no formal proceedings series
- Not listed in ICORE2026 and not on the CCF list
