notes:
- Workshop on HPC for big data and AI workloads, data-intensive parallel computing, storage and I/O, cloud and edge HPC, and quantum-related paradigms
- 2023 to 2025 editions were special tracks of ITADATA (Italian Conference on Big Data and Data Science) with CEUR-WS papers
- Moved to Euro-Par in 2026 (4th edition, Pisa); full papers go to the Euro-Par workshops volume of Springer LNCS
- Full papers and extended abstracts; a late extended abstract deadline with fast-track review; camera-ready only for full papers
- Held in Italy so far (Naples 2023, Pisa 2024, Turin 2025, Pisa 2026)
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
