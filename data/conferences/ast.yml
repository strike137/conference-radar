notes:
- Conference on software test automation, co-located with ICSE every year
- Held as a workshop since 2006 and as a conference since 2020; AST 2027 is the 8th conference edition
- Regular papers 10 pages plus 2 pages of references; short papers 4 pages plus 1; industrial abstracts 2 pages
- Double-blind review; research and industry contributions in the same call
- Best papers are invited to a journal special issue
- CORE C; not on the CCF list
