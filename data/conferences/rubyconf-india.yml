notes:
- Ruby and Rails community conference in India, organized by Emerging Technology Trust and conducted entirely in English
- 2026 edition is a single-day, single-track event at Novotel Hyderabad Airport with keynote, 25 minute talks and flash talks
- Talk proposals (title, abstract, short bio) reviewed by a program committee on a rolling basis; first-time speakers welcome
- No proceedings; practitioner talks only
- Not listed in the CORE ICORE2026 portal
