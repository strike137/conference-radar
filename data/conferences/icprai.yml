links:
  website: https://users.encs.concordia.ca/~icprai26/
notes:
- Run by CENPARMI at Concordia University (Montreal) with general chair Ching Y. Suen; biennial, held in even years
- Recent hosts are Zhongshan (2020), Paris (2022), Jeju (2024) and Montreal (2026)
- Springer LNCS proceedings; papers limited to 10 pages in LNCS format, extra pages charged 100 USD each
- Best papers invited to a special issue of the International Journal of Pattern Recognition and Artificial Intelligence
- Small venue; the 2026 program had about 70 technical papers plus 8 competition papers
- Not listed in ICORE2026
- Remote registration is available, but each main paper needs one general (non-student, non-remote) registration
