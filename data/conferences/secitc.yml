  wikicfp: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=201301
notes:
- Held in Bucharest, Romania, in November since 2018 (June until 2017; online 2020 to 2022, hybrid 2023); 19th edition
  in 2026
- 'Post-proceedings in Springer LNCS since 2015 (title: Innovative Security Solutions for Information Technology
  and Communications)'
- Anonymous submissions, at most 12 pages plus references/appendices (20 pages total) in LNCS format
- Low registration fee with reduced student rate; young researchers encouraged
- Not ranked by CORE or CCF; deadline usually extended by one or two weeks
