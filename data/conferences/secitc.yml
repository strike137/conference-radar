id: secitc
name: SecITC
full_name: International Conference on Security for Information Technology and Communications
type: conference
tier: minor
areas: [security, crypto]
region: europe
language: english
frequency: annual
organizer: Bucharest University of Economic Studies, Ferdinand I Military Technical Academy and Advanced Technologies
  Institute (Romania)
organizer_country: [europe]
proceedings: Springer LNCS
indexing: [Scopus, EI, DBLP]
rank:
  core: Unranked
acceptance_rate: 45% (2025, 20/44)
fee: 300 EUR non-students, 200 EUR students (2026)
typical:
  deadline_months: [9, 10]
  conference_months: [11]
links:
  website: https://secitc.eu/
