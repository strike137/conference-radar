notes:
- Software engineering conference series started in 2002 in Paris (25th edition in 2026), run by i-SOMET with
  general chair Hamido Fujita, the same team as IEA/AIE
- Proceedings in IOS Press Frontiers in Artificial Intelligence and Applications (open access, Scopus indexed)
- Regular papers up to 10 pages and short papers up to 6 pages in IOS Press format; submission via Microsoft CMT
- Recent editions rotate between Japan (Kitakyushu 2022 and 2025), Mexico (Cancun 2021 and 2024), Italy (Naples
  2023) and Malaysia (Kuala Lumpur 2026)
- Topics range from requirements engineering, testing and formal methods to AI for software engineering and
  medical informatics
- CORE C (ICORE2026); not on the CCF list
