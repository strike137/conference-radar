notes:
- Long-running privacy workshop co-located with ACM CCS every year; 2026 is the 25th edition; location follows CCS
  (2025 Taipei, 2026 The Hague)
- Proceedings published by ACM in the ACM Digital Library
- Regular papers up to 12 pages in ACM double-column format (excluding bibliography and appendix); short papers up
  to 4 pages
- Broad privacy scope, also open to submissions from law and business communities
- Steering committee chaired by Pierangela Samarati (University of Milan); program chairs change every year
- Not listed in the CORE portal (ICORE2026 or older editions)
- The 2026 CFP says submissions should not be anonymized, while the 2025 CFP required anonymized submissions
