notes:
- Run by the Florida AI Research Society (founded 1987); membership open to all who attend
- Always held at a Florida beach resort in May (Clearwater Beach 2023, Sandestin 2024, Daytona Beach 2025, Marco Island
  2026, St. Pete Beach 2027)
- General conference plus many special tracks and a poster abstract track; abstract registration in EasyChair is
  mandatory before the full paper
- Proceedings published open access by Florida Online Journals, indexed in DBLP and Scopus
- "CORE rank National: USA (ICORE2026); mid-size (168 attendees in 2026) and student friendly"
