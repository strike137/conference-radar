notes:
- Small Ukrainian cryptography workshop run by Borys Grinchenko Kyiv Metropolitan University (same editors as CPITS)
- Every edition so far co-located with the International Conference on Problems of Infocommunications. Science and Technology (PIC S&T) in Kyiv
- Held since 2023 (August 1, 2023 and August 6, 2024 online; August 5, 2025 in Kyiv)
- Proceedings in CEUR-WS (Vol-3504 for 2023, Vol-3829 for 2024, Vol-4016 for 2025); indexed in Scopus and DBLP
- "Acceptance: 6 of 11 submissions (2025)"
- No registration fee; submission through EasyChair in the CEURART one-column template
