notes:
- Workshop on the networking challenges of distributing generative and agentic AI workloads at large scale
  (collective communication, transport, in-network computing, edge placement, agent-to-agent networking)
- Started within the Internet Research Task Force (IRTF); co-located with ACM CoNEXT
- 1st edition 2025 at HKUST, Hong Kong; 2nd edition December 2026 in Utrecht
- The 2025 papers are in the ACM Digital Library as "Proceedings of the 1st Workshop on Inter-networking challenges for AI" (CoNEXT 2025, SIGCOMM)
- Double-blind review on HotCRP; up to 6 pages in two-column ACM format, excluding references and appendices
