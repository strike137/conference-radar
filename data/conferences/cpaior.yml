notes:
- Brings together constraint programming, AI and operations research (combinatorial optimization)
- Proceedings in Springer LNCS; separate extended abstracts track for presentation only (not in LNCS)
- CORE B (ICORE2026)
- Starts with a one-day master class; reviewing on OpenReview with a rebuttal phase
- Rotates worldwide, mostly Europe (Vienna 2021, USA 2022, Nice 2023, Uppsala 2024, Melbourne 2025 with ICAPS, Rabat
  2026, Toulouse 2027)
