region: asia-pacific
language: english
frequency: biennial
organizer: AsiaHaptics organizing committee (2026 hosted by the Korea Haptics Society)
organizer_country: [international]
proceedings: arXiv (extended abstracts)
archival: false
typical:
  deadline_months: [7, 8]
  conference_months: [10, 11]
links:
  website: https://asiahaptics2026.org/
notes:
- Biennial demonstration-centred haptics conference; every accepted paper is presented as a hands-on demo (or interactive poster)
- Submissions are 2-page extended abstracts in IEEE format plus an optional video and a floor plan, with juried review
- Accepted abstracts are collected on arXiv; extended versions can go to journal special issues (Intelligent Service Robotics, IEEE Transactions on Haptics by invitation)
- Held in Asia (Incheon 2018, Beijing 2022, Sunway University in Malaysia 2024, Incheon 2026)
- Not listed in CORE ICORE2026 and not on the CCF 2026 list
