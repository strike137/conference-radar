links:
  website: https://icsos2025.ieee-icsos.org/
notes:
- Conference on free-space laser communications for terrestrial, near-Earth and deep-space links (optical terminals, ground stations, atmospheric propagation, satellite QKD)
- Biennial in odd years, alternating between Japan and North America; linked with the International Conference on Space Optics held in Europe in even years
- "Recent editions: Portland 2019, virtual 2022 (Japan time), Vancouver 2023, Kyoto 2025 (10th edition)"
- Two-stage submission with a short abstract (under 1,000 words) first, then a full paper of 3 to 10 pages via EDAS
- Accepted and presented papers are submitted to IEEE Xplore; one full author registration covers up to three papers
- Strong participation from space agencies and industry (NICT, JAXA, ESA, NASA, satellite operators)
- Not listed in ICORE2026 and not on the CCF list
