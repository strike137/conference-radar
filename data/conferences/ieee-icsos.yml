language: english
frequency: biennial
organizer: IEEE ComSoc (portfolio conference); steering committee from NICT (Japan), Viasat (USA) and ESA
organizer_country: [japan, usa]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [6, 7]
