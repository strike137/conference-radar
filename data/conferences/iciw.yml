notes:
- Organized by IARIA; held together with ICIMP and other IARIA spring events (21st edition in 2026)
- Covers web services, web applications, mobile web and internet technologies
- Published open access in the IARIA ThinkMind library; selected papers invited to IARIA journals
- Ranked C in ICORE2026; IARIA events are generally regarded as low-selectivity
- Usually held in Spain, Portugal, France or Italy
- The 2027 edition moves earlier to March, with the submission deadline in November 2026
