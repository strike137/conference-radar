notes:
- Independently organized, community-driven security conference in Munich, Germany, held since 2017; 2026 is the 10th edition
- Workshop day (2 to 8 hour workshops) at Hochschule Muenchen on the Saturday, conference day at The Westin Grand Munich on the following Monday
- Talks are 30 minutes and in English; mentoring offered to first-time speakers
- 463 participants, 21 presentations and 12 workshops in 2025; recordings on YouTube
- "Fee: conference free in 2025; workshop tickets 19 EUR each in 2026"
- No proceedings
