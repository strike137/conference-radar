notes:
- Standalone annual workshop on the Khronos OpenCL and SYCL heterogeneous programming standards, run since 2013
- Organized by The Khronos Group with academic and industry chairs; mixes researchers, implementers and vendors
- Full papers (8 to 12 pages), short papers (3 to 4 pages) and poster abstracts appear in the ACM Digital Library proceedings
- Technical talks are reviewed from a 500 to 1,000 word abstract and are not included in the ACM DL
- In-person presentation and registration required for inclusion in the proceedings
- Held in Heidelberg 2025 and Heilbronn (hosted by TUM) 2026
- Not listed in CORE ICORE2026
