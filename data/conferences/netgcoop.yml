notes:
- Conference on game theory, control, optimization and queueing applied to networks; started in 2007 as NET-COOP
- Proceedings in Springer LNCS (NETGCOOP 2024 and 2025 volumes), published after the conference
- Selected papers invited to extended versions in Performance Evaluation (PEVA) and Queueing Systems (QUESTA)
- Regular papers 8 to 10 pages and short papers of exactly 4 pages in the Springer single-column format, via EasyChair
- At least one author must register and present in person for the paper to be included in the proceedings
- Mostly held in Europe (Avignon 2016, Lille 2024, Bilbao 2025, Palermo 2026); New York 2018; the 2020 edition ran virtually in 2021
- Small venue, the organizers report 50 to 100 attendees each year
- Not listed in ICORE2026 and not on the CCF list
