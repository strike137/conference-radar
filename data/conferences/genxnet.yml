notes:
- Workshop of IEEE WiMob (CORE B); first edition 2025 in Marrakech, second 2026 in Avignon
- Topics are generative AI and LLMs for networking (traffic generation, anomaly detection, log analysis, network management) and explainable AI for AI-driven networking
- Accepted and presented papers appear in the WiMob proceedings and are submitted to IEEE Xplore
- Papers up to 6 pages in IEEE format
- Half-day session on the WiMob workshop day
