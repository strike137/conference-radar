notes:
- IEEE MTT-S symposium on RF, mm-wave and THz integrated circuits, packaging and system integration
- Held in the Asia-Pacific region with an international executive committee; RFIT 2026 was in Yehliu, New Taipei
  City, Taiwan
- Three-page A4 papers in IEEE format, peer reviewed by the TPC; presented papers go into IEEE Xplore
- Oral and poster presentations, plus a student paper contest
- Paper submission through EDAS; the 2026 deadline was extended from 15 April to 1 May
- Microwave engineering venue outside the usual CS rankings, not listed in ICORE2026
