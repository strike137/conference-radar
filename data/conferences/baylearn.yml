notes:
- One-day machine learning symposium for researchers from academia and industry in the San Francisco Bay Area,
  with invited keynotes, posters and a few short oral talks; held every year since 2012
- Hosted by Bay Area companies and universities (Google, Facebook, Apple, Pinterest, Genentech, Block), online in
  2020 and 2021, and at Santa Clara University in 2025 and 2026
- Poster abstract submissions via Microsoft CMT; already submitted or published work and preliminary results are
  welcome
- No proceedings are published; accepted abstracts are only shared through an online repository, so it is
  non-archival
- Attendance is limited and assigned by a registration lottery
- Not listed in the CORE ICORE2026 portal and not on the CCF list
