notes:
- Software engineering conference on software for open, dynamic Internet environments (AI, IoT, cloud, services)
- Named Asia-Pacific Symposium on Internetware until 2024; renamed International Conference on Internetware from
  the 16th edition (2025)
- Steering committee co-chaired by Hong Mei (Peking University) and Jian Lu (Nanjing University); mostly Chinese
  community with European members and one US member
- Proceedings published by ACM (ACM DL); ACM SIGSOFT Distinguished Paper Awards for the best research papers
- Research track has two submission cycles with mandatory abstracts and a major revision round; double-anonymous
  review; 10 pages plus 2 pages of references in ACM double column format
- Selected papers invited to special issues of Springer EMSE and Automated Software Engineering
- Also has New Idea and Tool Demonstration tracks and a Future of Internetware Workshop
- 'Recent hosts: Hangzhou (2023), Macau (2024), Trondheim with FSE (2025), Gold Coast (2026)'
- Not ranked in ICORE2026; CCF C (listed under its former name Asia-Pacific Symposium on Internetware)
