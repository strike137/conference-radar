notes:
- Annual domestic conference of the KIEE Information and Control Division, co-organized with the IEIE Systems and
  Control Society
- Control theory, sensors and instrumentation, signal and image processing, robotics, automation, AI based
  modeling, machine learning, computer vision, energy and smart grid control, aerospace and defense systems
- Held at a resort in Korea in October or November (Delpino Resort, Goseong in 2025; Hanwha Resort, Gyeongju in 2026)
- Two-step submission (presentation application, then the full paper); paper templates in Korean and English
- Oral talks (13 min plus 2 min Q&A) and poster sessions; undergraduate paper contest
- Selected 2026 papers can go to an IJCAS special issue (separate IJCAS review, publication planned for June 2027)
- KIEE also runs the KIEE Summer Conference (July)
