id: apit
name: APIT
full_name: Asia Pacific Information Technology Conference
type: conference
tier: minor
areas: [general]
region: asia-pacific
language: english
frequency: annual
organizer: Conference secretariat (contact apit.conference@gmail.com), hosted by a local university each year (Ritsumeikan University for 2027)
proceedings: ACM DL (ACM ICPS)
archival: true
indexing: [EI Compendex, Scopus]
fee: 580 USD regular full paper, 530 USD student full paper, plus ACM ICPS APC of 400 USD (200 USD lower-middle-income) where applicable (2027)
typical:
  deadline_months: [11]
  conference_months: [1, 2]
links:
  website: https://www.apit.net/
notes:
- Annual since 2019; 2027 is the 9th edition
- "Hosts so far: Jeju 2019, Bali 2020, online 2021 and 2022, Ho Chi Minh City 2023, Bangkok 2024, Hong Kong 2025, Hokkaido University 2026, Ritsumeikan University Osaka 2027"
- Proceedings in the ACM Digital Library (ACM ICPS), stated as indexed in EI Compendex and Scopus; selected papers can go to the Journal of Advances in Information Technology (JAIT)
- ICPS open access model means authors outside ACM Open institutions pay an APC on top of the registration fee
- Broad information technology scope; abstract only presentation also offered
- Run by a commercial conference secretariat (gmail contact address)
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
