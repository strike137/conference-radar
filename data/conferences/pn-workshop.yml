notes:
- Workshop on polymorphic networks, a programmable network architecture where IP, NDN and other network paradigms coexist, plus traffic engineering, congestion control and verification
- First edition held as a morning workshop with ACM CoNEXT 2025 at HKUST, Hong Kong
- Program chairs from the National Digital Switching System Engineering and Technological Research Center (China), Peking University and Beijing Institute of Technology; TPC almost entirely from China
- Papers up to 6 pages including references in two-column ACM format, double-blind review, submitted via HotCRP
- Per the CoNEXT 2025 call for workshops, workshop papers appear in the ACM Digital Library with the CoNEXT short papers
- Not run with CoNEXT 2026 (Utrecht), whose workshop list does not include it
- Not listed in ICORE2026
