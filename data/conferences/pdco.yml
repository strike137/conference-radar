id: pdco
name: PDCO
full_name: IEEE Workshop on Parallel / Distributed Combinatorics and Optimization
type: workshop
tier: minor
areas: [systems]
region: worldwide
language: english
frequency: annual
organizer: IEEE IPDPS workshop; steering committee co-chaired by Pascal Bouvry (University of Luxembourg) and Didier
  El Baz (Harbin Engineering University)
organizer_country: [europe, china]
proceedings: IEEE Xplore (IPDPS Workshops)
archival: true
typical:
  deadline_months: [2]
  conference_months: [5, 6]
links:
  website: https://sites.google.com/view/ieeepdco
notes:
- Co-located with IEEE IPDPS; formed in 2017 by merging the PCO (since 2011) and NIDISC workshops (16th edition in
  2026)
- 'Topics: parallel and distributed combinatorial optimization, metaheuristics, integer and nonlinear programming,
  sparse matrix and graph algorithms, quantum optimization'
- Papers indexed in IEEE Xplore after the conference; up to 10 pages IEEE double-column, submitted via the IPDPSW
  system
- Small workshop with about 20 submissions and about 20 attendees a year; organizers state an average acceptance
  rate around 60%
- Location follows IPDPS (St. Petersburg 2023, San Francisco 2024, Milan 2025, New Orleans 2026)
acceptance_rate: About 60% (average over recent years, stated by the organizers)
