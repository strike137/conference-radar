notes:
- Full-day workshop on bias and fairness in speech LLMs and multimodal speech systems (accent, gender, speaker identity, low-resource languages)
- First edition held with EMNLP 2026 in Budapest on 29 October 2026
- Archival papers appear in the ACL Anthology (2026.impactspeech-1); non-archival track for published work, work in progress and 2-page extended abstracts
- Long (8 pages) and short (4 pages) papers in ACL format, double-blind review via OpenReview; also takes ARR commitments
- Not ranked in ICORE2026 and not on the CCF list
