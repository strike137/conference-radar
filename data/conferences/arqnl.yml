notes:
- Workshop on proof calculi, automated theorem provers and model finders for quantified non-classical logics (modal, intuitionistic, description, temporal, deontic, fuzzy and other logics)
- Held every two years with IJCAR; ARQNL 2026 was the 6th edition (2020 edition cancelled due to the pandemic)
- Vienna 2014, Coimbra 2016, Oxford 2018, Haifa 2022, Nancy 2024, Lisbon 2026 (FLoC 2026)
- Full papers up to 15 pages, short papers up to 8 pages and talk abstracts up to 2 pages, refereed by the PC
- Proceedings in CEUR Workshop Proceedings (ARQNL 2024 -> CEUR Vol. 3875, ARQNL 2022 -> CEUR Vol. 3326); ARQNL 2014 appeared in EasyChair EPiC
- Not listed in ICORE2026
