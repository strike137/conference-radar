notes:
- Interdisciplinary workshop on Internet censorship, surveillance, circumvention, content moderation and press freedom
  (technology, law and policy)
- Two issues per year -> Issue 1 is an online-only event (January or February), Issue 2 is a hybrid event co-located
  with PETS in July
- Co-located with PETS since 2023 (Lausanne 2023, Bristol 2024, Washington D.C. 2025, Calgary 2026, Delft 2027)
- Papers are published open access (CC BY 4.0) on the PoPETs site; extended abstracts (2 pages), short (4 pages) and
  long (8 pages) papers in the PoPETs template
- Double-blind review; FOCI asks other venues not to treat its 2-page extended abstracts as prior publications
- Encourages early-stage work and extensions of previously published research; for Issue 1 the PC may shepherd papers
  to acceptance
- Not listed in ICORE2026 or the CCF list
