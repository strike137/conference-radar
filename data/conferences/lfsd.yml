notes:
- Workshop at ECML PKDD on learning with limited data (few-shot, active, transfer, semi-supervised and physics-informed learning, design of experiments)
- Held at ECML PKDD 2025 in Porto (full day) and ECML PKDD 2026 in Naples
- Regular papers 8 to 16 pages or extended abstracts 2 to 4 pages, Springer LNCS style, double-blind review via the ECML PKDD CMT
- Accepted papers go into the ECML PKDD joint post-workshop proceedings with Springer
- Not listed in CORE ICORE2026
