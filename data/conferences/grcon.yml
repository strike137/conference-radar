notes:
- Annual conference of the GNU Radio open source software defined radio community, first held in 2011
- Week-long event with talks, papers, posters, workshops, tutorials, vendor exhibition, a capture the flag and
  amateur radio license exams
- Attendees from industry, academia, government and hobbyists; volunteer organizing committee
- Paper track published in the open-access Technical Proceedings of the GNU Radio Conference (pubs.gnuradio.org,
  indexed by Google Scholar); talk-only contributions are not published
- Review is on abstracts only (1 to 5 rubric, not blind); full papers are due on the first day of the conference
- Single call for participation (talks, papers, posters, workshops) handled on Indico
- Held in the USA (Everett, WA in 2025; Raleigh, NC at NC State University in 2026)
