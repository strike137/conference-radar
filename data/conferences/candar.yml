  wikicfp: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=173639&copyownerid=36915
notes:
- Held every year in late November in a different Japanese city (2024 Naha, 2025 Yamagata, 2026 Ishigaki); steering
  committee based at Hiroshima University
- 'Four tracks including Track D: Information and Communication Security; co-located workshops (WICS, CSA, GCA,
  PDAA, ASON, WANC) go to IEEE Xplore, while the NCSS workshop is non-reviewed and not in IEEE Xplore'
- Proceedings via IEEE CPS in IEEE Xplore and CSDL; selected papers invited to IJNC, IEICE Trans. and Concurrency
  and Computation special issues
- Main-track acceptance roughly 33 to 39% every year since 2013; long papers roughly 8 to 15%
- 2026 is in-person only; no-show papers are removed from IEEE Xplore
