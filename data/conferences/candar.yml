id: candar
name: CANDAR
full_name: International Symposium on Computing and Networking
type: conference
tier: minor
areas: [systems, networking, security, crypto, ai, software]
region: japan
language: english
frequency: annual
organizer: CANDAR steering committee (Hiroshima University)
organizer_country: [japan]
proceedings: IEEE Xplore
indexing: [IEEE Xplore, IEEE CSDL, EI Compendex, INSPEC, DBLP]
rank:
  core: Unranked
acceptance_rate: 38.4% (2025, 25/65; long papers only 13.8%, 9/65)
fee: 50,000 JPY speaker registration by credit card, 70,000 JPY by bank transfer (2026); 40,000 JPY by card in 2025
typical:
  deadline_months: [7, 8]
  conference_months: [11]
links:
  website: https://is-candar.org/
