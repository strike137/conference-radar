notes:
- First ASIACRYPT industry forum, an affiliated event of ASIACRYPT 2026 connecting cryptographers with banks, regulators, FinTech companies and policymakers
- Topics include digital payments, privacy-enhancing technologies, digital identity, CBDCs, tokenised assets, PQC for finance, ZK proofs, MPC and RegTech
- Call for talks of about 15 to 20 minutes, proposed by email with a title and a 200 to 300 word abstract; no full paper required
- 'Non-archival: no formal proceedings are planned'
- Program of academic and industry keynotes, invited and contributed talks and a panel
- In person only
