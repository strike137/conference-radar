notes:
- Flagship IACR general conference, held every August at UCSB in Santa Barbara, USA
- Two-round double-blind review with a rebuttal phase; proceedings in Springer LNCS
- Affiliated workshops run on the weekend before the main conference
- Authors may present in person or remotely by uploading a video (2026 CFP)
- Students presenting accepted papers get registration waived; limited IACR stipends for others
