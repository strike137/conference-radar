notes:
- Organized by IARIA as part of the InfoWare congress, co-located with ICCGI and other IARIA events (22nd edition in 2026)
- Published open access in the IARIA ThinkMind library (ISSN 2308-4219); selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Usually held in Spain, Portugal, Italy, France or Greece; onsite and online participation offered
- The 2027 edition moves later to May, with the submission deadline in February 2027
