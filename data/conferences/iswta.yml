notes:
- Run by the IEEE Malaysia Industrial Applications / Industrial Electronics Joint Chapter, alongside its sister
  symposia ISIEA, ISCI and ISCAIE on the same conference management system
- 2026 is the 10th edition; recent editions are all held in Malaysia (Shah Alam, Kuala Lumpur, Penang)
- Accepted and presented papers are submitted to IEEE Xplore; the site links the Scopus source record for past
  proceedings
- Double-blind review by at least 3 reviewers; papers with similarity above 30% are not considered
- Hybrid format; virtual presenters upload a pre-recorded YouTube video, and no-show papers are excluded from IEEE
  Xplore
- Broad scope despite the name (AI/ML, IoT, industrial electronics, computer applications, 5G/6G wireless)
- Not ranked in ICORE2026 and not in the CCF list; a small regional venue
