notes:
- Main IEEE venue for wireless power transfer, formerly Wireless Power Week (WPW), renamed WPTCE in 2023
- Covers inductive, capacitive and radiative WPT, rectennas, energy harvesting, SWIPT, EMC and applications such as EV charging
- Rotates worldwide (Bordeaux 2022, San Diego 2023, Kyoto 2024, Rome 2025, Halifax 2026, Chongqing 2027)
- Regular papers are published in IEEE Xplore; industry and application track 2-page papers stay in the electronic
  proceedings only
- Includes a wireless power school, workshops, an expo and a student design competition
- Authors of presented papers may submit extended versions to an IEEE Journal on Wireless Power Technologies special issue
- Not ranked by CORE or CCF; power electronics and microwave venue outside the usual CS rankings
