notes:
- Long-running workshop co-located with ACM HPDC (16th edition in 2026); earlier editions ran as the Workshop on Scientific Cloud Computing (ScienceCloud)
- Topics are HPC, big data and AI workflows on elastic and heterogeneous infrastructures across the edge-to-HPC continuum
- Short (5-page) and regular (8-page) papers in ACM sigconf format; single-blind review
- Accepted papers in the ACM Digital Library; 2026 papers are in the HPDC 2026 proceedings volume
- Follows HPDC's location (Pisa 2024, Cleveland 2026)
- Not listed in the ICORE2026 portal
