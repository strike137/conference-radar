notes:
- Workshop on AI for population and personalized health, held with AAAI every year; location follows AAAI (2026 Singapore, 2027 Montreal)
- 2027 is the 11th edition, special theme Agentic Biomedical and Clinical Workflows
- Full papers (up to 8 pages), short papers (up to 4 pages) and posters or demos (up to 2 pages) in AAAI format, single-blind, via EasyChair
- Accepted and presented papers are published by Springer Nature in the Studies in Computational Intelligence series
- Selected papers are invited to journal special issues
- AAAI does not allow virtual presentations, at least one author must present in person
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
