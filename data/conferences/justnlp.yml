notes:
- Workshop on legal NLP (legal summarization, translation, judgment prediction, retrieval, legal LLMs), motivated by court backlogs in India
- 1st edition with IJCNLP-AACL 2025 at IIT Bombay, Mumbai
- Shared tasks on legal summarization (L-SUMM) and legal machine translation (L-MT) in 2025
- Long (8 pages) and short (4 pages) papers following ARR rules; direct submission or ARR commitment via OpenReview
- Proceedings in the ACL Anthology (2025.justnlp-main, 22 papers)
- Different from NLLP, the legal NLP workshop held with EMNLP
- Not listed in the CORE portal (ICORE2026)
