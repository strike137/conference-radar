notes:
- First quantum computing systems workshop at a SIGMOBILE conference; 1st edition at ACM MobiSys 2025 in Anaheim
- Topics are quantum system architectures, hybrid quantum-classical execution, compilers, error correction, quantum networking
- Papers up to 6 pages in ACM sigconf format, submitted via HotCRP
- MobiSys workshop papers are published in the ACM Digital Library
- Not among the MobiSys 2026 workshops
- Not listed in the CORE portal (ICORE2026)
