notes:
- Annual flagship conference of the Association for Information Systems (AIS)
- Information systems (business school) venue rather than core CS; 2026 tracks include data management and analytics, cybersecurity and privacy, and blockchain and fintech
- Proceedings published in the AIS eLibrary
- Not the same venue as IEEE/ACIS ICIS (Computer and Information Science) or ICIS (Intelligence Science)
- Last listed in CORE2018 (rank A*); not in ICORE2026 or the CCF list
- Held in December; Nashville 2025, Lisbon 2026, Orlando 2027
