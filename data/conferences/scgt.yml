notes:
- Small new conference on green computing, energy-saving technologies and sustainability in computing; first held in 2025
- Co-organized by the Moroccan Mediterranean Association of Sciences and Sustainable Development (Medi-ASD, which also runs NISS and SCA), SIST School and Abdelmalek Essaadi University
- 2026 papers go to Springer LNNS; 2025 papers went to the MDPI Computer Sciences & Mathematics Forum
- Extended best papers of 2025 went to a Springer Studies in Systems, Decision and Control volume
- Held in Morocco (Larache, May 2025; Tangier, December 2026)
- Papers of 6 to 8 pages, double-blind review via Microsoft CMT
- Not listed in CORE ICORE2026
