notes:
- Flagship conference of the IEEE Instrumentation and Measurement Society, held every year since 1984
- Covers measurement theory and metrology, sensors, data acquisition, signal processing, ML and AI for measurement,
  and instrumentation for communications and IoT, energy, medicine, robotics and industry
- Rotates worldwide (2021 Glasgow virtual, 2022 Ottawa, 2023 Kuala Lumpur, 2024 Glasgow, 2025 Chemnitz, 2026 Nancy,
  2027 Chongqing)
- Full papers 4 to 6 pages in IEEE format via EDAS; two review rounds with a revised paper step
- Accepted and presented papers are submitted to IEEE Xplore
- Authors of presented papers can submit extended versions to a special section of IEEE TIM or OJIM; TIM and OJIM
  journal papers can also be presented
- Includes special sessions, tutorials, demos, industry sessions and a student poster contest
- Not listed in ICORE2026 (CORE portal) and not on the CCF list
