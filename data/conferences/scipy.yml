notes:
- Annual conference of the scientific Python community, running since 2002 (25th edition in 2026)
- Seven-day format of two tutorial days, three conference days and two developer sprint days
- Talks, posters and tutorials are selected from about 500 word proposals; the paper is optional
- Speakers can submit a paper of up to 8 pages after acceptance; two reviewers from the Proceedings Committee review it and accepted papers get a DOI in the SciPy Proceedings
- '25 peer reviewed articles in the 2023 proceedings, 39 in 2022'
- 2026 tracks included data-driven discovery, ML and AI, physics and astronomy, earth and climate science, biology and medicine, maintainers and community, and education
- In person with remote attendance options; tutorial instructors are paid a stipend
- 'Recent venues: Austin 2022 and 2023, Tacoma 2024 and 2025, Minneapolis (University of Minnesota) 2026'
- Not listed in CORE ICORE2026
