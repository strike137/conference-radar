notes:
- Annual conference of the American Automatic Control Council (AACC), the US national member organization of IFAC
- Co-sponsored by AIAA, AIChE, ASCE, ASME, IEEE (Control Systems Society), INFORMS, ISA, SCS and SIAM
- One of the two main general control conferences in North America (with IEEE CDC); covers all areas of automatic
  control theory and practice
- Held in the USA almost every year (2023 San Diego, 2024 Toronto, 2025 Denver, 2026 New Orleans, 2027 Philadelphia)
- Contributed papers up to 8 pages for review, 6 pages in the proceedings plus up to 2 extra pages for a fee (USD 200
  per page in 2026); final PDFs must be IEEE Xplore compatible; submission via PaperPlaza
- Joint option to submit to IEEE Control Systems Letters (L-CSS) and present at ACC, with an earlier deadline
- Not listed in ICORE2026 (control venue outside the CORE computing list)
