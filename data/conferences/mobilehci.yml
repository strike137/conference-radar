notes:
- A SIGCHI conference on interaction with and through mobile devices, applications and services
- Full papers are published as journal articles in a special issue of the Proceedings of the ACM on Human-Computer
  Interaction (PACM HCI); ACM Open access from 2026
- One paper deadline in January with a revise-and-resubmit round; typical length 4,000 to 9,000 words
- Rotates worldwide (Melbourne 2024, Sharm El-Sheikh 2025, Swansea 2026)
- CORE B (ICORE2026); CCF B (HCI and ubiquitous computing category)
