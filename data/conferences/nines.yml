notes:
- New conference with the same scope as SIGCOMM and NSDI but a reviewing philosophy focused on new ideas rather than detailed evaluation; not an ACM conference
- First edition on 2026-02-10 (online with local pods in Boston and New York); second on 2027-02-16
- One-day global, decentralized event; papers are not presented live on the day, recorded talks are posted online, and an online seminar series is planned for 2027
- Papers up to 12 pages plus references and appendices, two-column 10-point format; double-blind review
- Accepted papers appear in the NINeS proceedings in OASIcs (2026 proceedings are OASIcs volume 139)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
