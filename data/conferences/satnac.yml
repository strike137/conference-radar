notes:
- Annual ICT research and industry conference hosted by Telkom SA, tied to the Telkom Centres of Excellence programme
  for South African postgraduate students
- Peer-reviewed full papers and work-in-progress papers (IEEE templates); the proceedings volume is self-published as a
  PDF on the conference website, not in a digital library
- Held at South African resorts (Champagne Sports Resort 2021 and 2023, Fancourt George 2022, Skukuza 2024, Arabella
  Hermanus 2025, Champagne Sports Resort 2026); delegates book resort accommodation packages
- Mixes industry plenaries and panels with student paper sessions and an industry solutions challenge
- Not listed in CORE ICORE2026
