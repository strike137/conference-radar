notes:
- Workshop on vision-based sign language recognition, translation and production, bringing together computer vision researchers and sign language linguists
- 1st edition with ECCV 2020, 2nd with ECCV 2022, 3rd with CVPR 2025 (Nashville)
- Papers up to 8 pages excluding references in CVPR style, double-blind review on CMT
- 4 papers in the CVPR 2025 Workshops proceedings on CVF Open Access
- Ran the first Sign Language Production challenge in 2025
- Hybrid event with ASL and International Sign interpretation
- Not listed in ICORE2026 or the CCF list
