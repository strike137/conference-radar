notes:
- Co-located workshop of SBRC, the Brazilian Symposium on Computer Networks and Distributed Systems run by the
  Brazilian Computer Society (SBC); first edition (I WIARC) in 2026
- Covers AI and machine learning for network management, autonomous networks, 5G, intrusion detection, federated
  learning, SDN, edge computing and QoS/QoE
- Papers in Portuguese or English (Portuguese papers need an English abstract), up to 14 pages including references
  in the SBC template; submission through JEMS3
- Accepted papers published in SBC OpenLib (SOL); at least one author must register for SBRC and present orally
- Top three papers invited to submit extended versions to a Journal of Internet Services and Applications (JISA)
  special issue
- 15 papers in three technical sessions in 2026
- Not listed in CORE ICORE2026
