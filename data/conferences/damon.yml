notes:
- One-day workshop held with ACM SIGMOD/PODS, so it moves with SIGMOD (2026 in Bengaluru, India)
- 'Scope: database systems on modern hardware (GPUs, FPGAs, new memory and storage, RDMA, CXL, processing in memory)'
- Full papers up to 6 pages and short papers up to 2 pages at submission (10 and 4 pages for camera-ready), ACM SIGMOD format
- Single-blind review via Microsoft CMT
- All accepted papers are published in the ACM Digital Library
- Selected 2026 papers invited to a "Best of DaMoN 2026" special section of the VLDB Journal
- 22nd edition in 2026
- "Rank: CORE C (ICORE2026)"
