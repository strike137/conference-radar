id: dipca
name: DIPCA
full_name: International Conference on Digital Image Processing and Computer Applications
type: conference
tier: minor
areas: [vision, ai]
region: china
language: english
frequency: annual
organizer: AEIC (AiScholar, ais.cn) conference service with a host university each year
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 570 USD or 3800 CNY per 4-page paper (2027, regular); 510 USD early bird before 2027-02-09; 60 USD per extra page; attendee without paper 225 USD
typical:
  deadline_months: [1, 2]
  conference_months: [3, 4]
links:
  website: http://www.icipca.net/
notes:
- Started in 2024 as IPCA, a sub-conference of CVIDL in Zhuhai; standalone as DIPCA since 2025 (Xi'an 2025, Suzhou 2026, Urumqi 2027)
- Run by a commercial conference service (AEIC/AiScholar) with a different host university each year (Xi'an University of Technology in 2025)
- Proceedings published by IEEE (2026 ISBN 979-8-3315-8450-4) and submitted to EI Compendex and Scopus
- 2027 edition lists IEEE SMC technical committees as supporters
- Abstract-only presenter and listener registration are also offered
- Not listed in CORE ICORE2026 or the CCF list
