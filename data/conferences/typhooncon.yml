notes:
- Offensive security conference run by SSD Secure Disclosure, held every May in Myeongdong, Seoul (2025 at Le Meridien
  Seoul Myeongdong, 2026 at Moxy Seoul Myeongdong)
- Two-day conference (talks in English or Korean, 30 or 60 min) preceded by 3 to 4 days of paid trainings
- Hosts TyphoonPWN, a live hacking contest; 2025 payouts exceeded 500,000 USD (top item 250,000 USD for Chrome RCE
  plus sandbox escape)
- Talk CFP closes 1 March at 08:00 KST (trainings 1 February); accepted speakers get 3 hotel nights and up to 1,500
  USD airfare
- Small event (organizers cite 150+ attendees); deep technical focus on exploitation and reverse engineering
