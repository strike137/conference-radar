links:
  website: https://www.comsnets.org/ADVnet
notes:
- Co-located workshop of COMSNETS, held each January in Bengaluru, India
- Connected and autonomous vehicles (V2X and C-V2X, vehicular networks, perception, control, safety, CAV security)
- Double-blind review; papers up to 6 pages in IEEE format, submitted through EDAS
- Workshop papers appear in the COMSNETS proceedings and are submitted to IEEE Xplore
- Held under this name since COMSNETS 2025, which called it the 10th edition; COMSNETS 2023 and 2024 had a
  Connected Vehicles and Autonomous Driving (CVAD) workshop on the same theme
- Workshop deadline is usually extended by one to three weeks
