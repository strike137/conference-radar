notes:
- Software components, architecture and reuse symposium of the Brazilian Computer Society (SBC), held since 2007;
  20th edition in 2026
- Held each year within CBSoft (Congresso Brasileiro de Software) in a different Brazilian city (Recife 2025, São Paulo 2026)
- Proceedings (Anais do SBCARS) for all editions since 2007 available open access in SBC OpenLib (SOL)
- Papers in Portuguese or English; research papers up to 10 pages plus 2 pages of references, data papers up to 4
  plus 2; double-anonymous review with at least three reviewers
- One-day symposium (10 papers in the 2026 program)
- Not ranked in CORE ICORE2026
