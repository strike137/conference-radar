notes:
- Flagship annual conference of the IEEE Information Theory Society; ITW is its smaller companion workshop
- Papers are published in IEEE Xplore (for example 10.1109/ISIT62367.2026 for ISIT 2026)
- Rotates worldwide in late June or early July (Espoo 2022, Taipei 2023, Athens 2024, Ann Arbor 2025, Guangzhou 2026,
  Sorrento 2027)
- Submissions via EDAS; the paper deadline is in January (January 10 for 2027, January 16 for 2026)
- Accepted papers must be presented in person by an author to appear in IEEE Xplore
- Topics include coding theory, communications and network information theory, information-theoretic security and
  privacy, learning theory and quantum information
- CORE ranks it B, although it is the main venue of the information theory community
