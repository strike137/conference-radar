notes:
- IEEE Interregional NEWCAS conference sponsored by the IEEE Circuits and Systems Society
- Alternates between Canada (mostly Quebec) and Europe (mostly France); Cork, Ireland in 2027
- Complete 4-page papers in IEEE double-column format plus one page of references
- Broad circuits and systems scope (analog, RF, data converters, power, biomedical, AI hardware, hardware security)
- Not listed in the CORE ICORE2026 portal
