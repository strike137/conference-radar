id: inra
name: INRA
full_name: International Workshop on News Recommendation and Analytics
type: workshop
tier: minor
areas: [ai, data]
region: europe
language: english
frequency: annual
organizer: INRA organizers and steering committee (NTNU NorwAI, University of Mannheim, University of Fribourg, TU Berlin, Northwestern University)
organizer_country: [europe]
proceedings: CEUR-WS
archival: true
typical:
  deadline_months: [4, 7]
  conference_months: [6, 9]
links:
  website: https://research.idi.ntnu.no/NewsTech/INRA/index.html
notes:
- Workshop series on news recommendation, news analytics and the effect of LLMs on the news ecosystem; 14th edition in 2026
- Host conference varies; at ACM RecSys in most years (Bari 2024, Prague 2025), at ACM UMAP 2026 in Gothenburg
- Proceedings in CEUR-WS for every edition from 2021 to 2025 (Vol-4056 for INRA 2025); the 2026 call also states CEUR-WS
- Papers in the CEUR-WS single-column template, peer reviewed by the program committee, submitted via EasyChair
- At least one author must register and present in person
- Run from NTNU (Norway) with a steering committee of Jon Atle Gulla and Edward C. Malthouse
- Not listed in CORE ICORE2026 or the CCF 2026 list
