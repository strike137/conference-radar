id: ieee-icdl
name: IEEE ICDL
full_name: IEEE International Conference on Development and Learning
type: conference
tier: minor
areas: [ai]
region: worldwide
language: english
frequency: annual
organizer: IEEE, sponsored by IEEE Robotics and Automation Society (RAS) and IEEE Computational Intelligence Society
  (CIS)
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
fee: About 120,000 JPY early-bird for non-IEEE members, 75,000 JPY for non-member students (2026)
typical:
  deadline_months: [3, 4]
  conference_months: [9]
links:
  website: https://attend.ieee.org/icdl-2026/
notes:
- Interdisciplinary venue on development and learning in humans, animals and machines (developmental robotics,
  cognitive science, machine learning)
- Recent editions in Prague 2025 and Kyoto 2026; 2027 edition announced for Campinas, Brazil
- Full papers 6 pages (up to 2 extra pages at a fee), single-blind review via OpenReview, published in IEEE Xplore
- Late-breaking results (1 to 2 pages) and journal presentations are poster only and not in IEEE Xplore
- Authors with PhD-level expertise are expected to review about two submissions
- Not listed in ICORE2026 or the CCF list
