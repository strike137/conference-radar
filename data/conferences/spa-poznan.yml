notes:
- Polish signal processing conference run by Poznan University of Technology with the IEEE Poland Section Circuits and Systems and Signal Processing Chapters
- Grew out of the Signal Processing Workshops held in Poznan since 1993; renamed SPA in 2007; 2026 was the 29th edition
- Always held in Poznan, Poland; hybrid format (in person or online)
- Full papers of up to 6 A4 pages in IEEE two-column format, all reviewed
- Proceedings in IEEE Xplore (2007 to 2020 and 2022 to 2025 listed on the indexation page)
- Not listed in CORE ICORE2026 or the CCF list
