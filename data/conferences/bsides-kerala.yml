notes:
- Independent, community-driven Security BSides hacking and cybersecurity conference in Kochi, Kerala, India
- 2025 edition held 8 to 9 February 2025 (conference day 8 Feb, trainings 9 Feb); event announced in October 2024
- 2026 edition had two days of hands-on trainings (7 to 8 May) and one conference day (9 May) with a CXO track, a Hacker Ground track, a hands-on activity track and an onsite CTF
- Call for papers takes talks and hands-on workshops; the 2026 CFP closed on 10 April 2026
- Overseas speakers get accommodation and a 500 USD honorarium; speakers from India get two days of accommodation
- Industry-oriented event with many CIO/CISO and Kerala Police speakers; free lunch and snacks for attendees
- No proceedings; talks only
