notes:
  - Workshop on PromptOps, that is engineering rigor for prompts and developer-LLM workflows, and on moving beyond ad hoc vibe coding
  - Also written POVC or PROMPTOPS on the official site
  - First edition in 2026, co-located with IEEE/ACM ASE 2026 in Munich
  - Accepted papers published by ACM as the Proceedings of the 1st International Workshop on PromptOps and Vibe Coding (DOIs under 10.1145/3843779)
  - Research papers up to 8 pages including references; posters as 2-page extended abstracts; presentation proposals also accepted
  - At least two reviews per paper; at least one author must register and present
  - Not listed in the CORE portal (ICORE2026)
