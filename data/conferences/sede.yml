notes:
- Software engineering and data engineering conference of ISCA (35th edition in 2026), co-located with CAINE
- Proceedings in Springer CCIS since 2024; earlier volumes (2019 to 2021 listed by ISCA) in EasyChair EPiC Series in Computing
- Held in the USA (San Diego 2024, New Orleans 2025, San Francisco 2026)
- Single-blind review by at least two experts, no page limit; best paper award
- Not listed in ICORE2026 or the CCF 2026 list
- Extended papers may go to the ISCA journal (IJCA)
