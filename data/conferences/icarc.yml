organizer: Faculty of Computing, Sabaragamuwa University of Sri Lanka (IEEE technically co-sponsored)
organizer_country: [other]
proceedings: IEEE Xplore
indexing: [Scopus]
rank:
  core: Unranked
fee: 200 to 475 USD for international authors depending on IEEE membership, online or physical and early or late (2027)
typical:
  deadline_months: [11, 12]
  conference_months: [2]
links:
  website: https://icarc.lk/
notes:
- Run by the Faculty of Computing, Sabaragamuwa University of Sri Lanka; held in February at the university in
  Belihuloya, Sri Lanka, in hybrid mode
- Technically co-sponsored by IEEE and several IEEE Sri Lanka Section chapters; accepted and presented papers go to
  IEEE Xplore
- Broad computing scope (AI and ML, text analytics and NLP, computer networks and IoT, software engineering,
  digital transformation, digital health, generative AI in education, open track)
- Double-blind review; literature surveys and review papers are not accepted (2027)
- Not listed in ICORE2026 (only the unrelated ICARCV appears) and not in the CCF list
- 'Site states Google Scholar h5-index 11 and Scopus indexing for ICARC 2022 to 2026'
- Selected 2025 papers were invited to an MDPI Computers special issue
