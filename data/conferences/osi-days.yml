notes:
- Practitioner open source conference by the Open Source For You magazine team (EFY Group) with India's open source community and industry
- Started as LinuxAsia in 2004; 2026 was the 23rd edition, 24th announced for 2027 in Bengaluru
- Two days, six tracks (FOSS for Everyone, Developer's Meet, Data and Bases, DevOps, Open Source Hardware, AI and ML) plus paid hands-on workshops
- Tightly integrated expo floor alongside the conference; basic visitor pass is free
- Talks via a Propose a Talk form; no proceedings
- Held at NIMHANS Convention Center, Bengaluru
- Different event from the Linux Foundation's Open Source Summit India
- Not listed in the CORE ICORE2026 portal
