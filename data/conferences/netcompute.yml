notes:
- First held in 2026 as a half-day workshop at IEEE INFOCOM 2026 in Tokyo
- Topics include in-network computing, task scheduling and offloading, communication-efficient and federated learning, edge intelligence and satellite computing
- Papers up to 6 pages in IEEE conference format, submitted via EDAS
- Accepted and presented papers appear in the IEEE INFOCOM Workshop Proceedings in IEEE Xplore
- 7 papers accepted in 2026
- Organized by Bhaskar Krishnamachari (USC), Jared Coleman (Loyola Marymount University) and Carlee Joe-Wong (CMU)
- Not listed in ICORE2026; not on the CCF 2026 list
