notes:
- Biennial conference on language technology, linked data, knowledge graphs and the Semantic Web
- Open-access proceedings in the ACL Anthology, free of charge for authors (2025 published by Unior Press, 34 papers;
  2023 by NOVA CLUNL, 73 papers)
- Long papers 9 to 12 pages and short papers 4 to 6 pages including references, ACL templates; single-blind review on
  OpenReview
- Hybrid format in 2025; workshops on the first day
- Held in Europe (Vienna 2023, Naples 2025)
- CORE C (ICORE2026)
