notes:
- One-day ICSE workshop on GUI and user experience topics in software engineering (GUI testing, design, generation and accessibility)
- First edition at ICSE 2026 in Rio de Janeiro (14 April 2026); second edition at ICSE 2027 in Dublin (25 April 2027)
- 2026 papers published by ACM as "Proceedings of the 2026 1st International Workshop on User Interface and Experience for Software Engineering"
- "2027 page limits: full papers up to 8 pages and short papers up to 5 pages, including references"
- Single-anonymous review via HotCRP
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
