notes:
- Combined symposium and summer school on service-oriented computing, cloud, microservices, quantum software and data science
- Program chairs Frank Leymann and Marco Aiello (University of Stuttgart) and Schahram Dustdar (TU Vienna)
- Held every year in Crete, Greece (Mitsis Royal Mare, Hersonissos); virtual in 2020 and 2021
- Peer-reviewed papers published after the event in Springer CCIS ("Service-Oriented Computing"); earlier editions as IBM technical reports
- Small venue, about 9 to 11 papers per volume (2020 to 2025)
- Authors must attend, present in the plenum and in the poster session; PhD students also present posters
- Not listed in ICORE2026 or the CCF 2026 list
