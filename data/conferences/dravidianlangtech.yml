notes:
- Workshop on speech, language and multimodal technologies for Dravidian languages (Tamil, Kannada, Malayalam, Telugu,
  Tulu and others), including code-mixed text
- Annual since 2021; follows its host conference (EACL 2021 online, ACL 2022 Dublin, RANLP 2023 Varna, EACL 2024 Malta,
  NAACL 2025 Albuquerque, ACL 2026 virtual)
- Proceedings in the ACL Anthology (71 accepted papers in 2026 out of 123 reviewed submissions)
- Long papers 8 pages, short papers 4 pages in ACL format; submission via OpenReview, also accepts ARR-reviewed papers
- Runs several shared tasks each year (abusive language, sentiment, hope speech, depression detection and dialect
  recognition from speech in 2026); shared task papers go into the same proceedings
- Not ranked in ICORE2026 and not on the CCF list
