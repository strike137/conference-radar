links:
  website: https://unireps.org/2026/
notes:
- Workshop held with NeurIPS since 2023 (New Orleans 2023, Vancouver 2024, San Diego 2025); 2026 edition in Paris
- Topic is why different neural models, artificial or biological, learn similar representations (model merging, alignment, identifiability)
- "Two tracks: archival full papers (9 pages, PMLR proceedings) and non-archival extended abstracts (4 pages)"
- Proceedings in PMLR volumes 243 (2023), 285 (2024) and 322 (2025)
- Uses the NeurIPS template; submissions through OpenReview; also runs a blog post track
