notes:
- Workshop on security and privacy of IoT, edge and cloud infrastructures, AI-driven security and federated learning
- Held with IEEE/ACM CCGrid from 2020 to 2024 (Melbourne 2021, Taormina 2022, Bangalore 2023, Philadelphia 2024) and with ACM CIKM 2025 in Seoul
- 6th edition in 2025 was a half-day afternoon workshop on 14 November 2025
- 2025 papers up to 6 pages in ACM sigconf format, single-blind review via Microsoft CMT; published by ACM as SIoTEC Proceedings and indexed by Scopus
- Until 2024 papers (up to 8 pages, IEEE format) went into the CCGrid Workshops (CCGRIDW) proceedings
- Best papers invited to extended versions in Elsevier Internet of Things, MDPI Future Internet and MDPI Sensors
- Not listed in CORE ICORE2026 or the CCF 2026 list
