notes:
- Workshop co-located with ECML PKDD, held in Europe every September; 13th edition in 2026 (first in 2013, yearly
  since 2015)
- Post-proceedings in Springer CCIS (2026 page says the organizers intend to publish with Springer CCIS as in
  previous years); earlier volumes are on SpringerLink
- Long papers up to 9 pages plus references, or 2-page extended abstracts summarizing recent publications; Springer
  LNCS style, submitted via Microsoft CMT
- Each paper reviewed by at least two PC members; authors may choose whether to include their names
- Covers both traditional sports and e-sports
- Attendance requires registration for the ECML PKDD main conference
- Not listed in CORE ICORE2026
