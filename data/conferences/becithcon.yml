id: becithcon
name: IEEE BECITHCON
full_name: IEEE International Conference on Biomedical Engineering, Computer and Information Technology for Health
type: conference
tier: minor
areas: [general, ai]
region: south-asia
language: english
frequency: annual
organizer: IEEE Bangladesh Section and IEEE EMBS Bangladesh Chapter
organizer_country: [other]
proceedings: IEEE Xplore
archival: true
fee: Local authors 9,000 BDT non-IEEE, 7,500 BDT IEEE; foreign authors 200 USD non-IEEE, 150 USD IEEE (2026)
typical:
  deadline_months: [6, 9]
  conference_months: [9, 11]
links:
  website: https://becithcon.org/2026/
notes:
- Run jointly by the IEEE Bangladesh Section and the IEEE EMBS Bangladesh Chapter
- Held in Dhaka, Bangladesh at a different university each time, in hybrid mode
- Editions in 2019, 2021, 2024, 2025 and 2026; yearly since 2024
- Accepted and presented papers go to IEEE Xplore
- Covers biomedical engineering, biomedical signal and image processing, health informatics and machine learning for health
- Papers 4 to 6 pages; one registration covers one paper
- Co-located with the IEEE Bangladesh Section STUDENT-LED CON
- Not listed in ICORE2026 or the CCF 2026 list
