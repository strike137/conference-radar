notes:
- Practitioner IT security congress run by the German security consultancy cirosec (2027 is the 24th edition)
- Held in a different German city each year (Mainz 2023, Stuttgart 2024, Leipzig 2025, Wuerzburg 2026, Frankfurt 2027)
- Program of invited international speakers; no public call for papers and no proceedings
- No sponsors or vendor talks; program mixes technical talks, strategic presentations and round tables
- Talks in German and English; pre-conference trainings are offered
- Audience is mostly security staff from industry, military and public administration; recent editions sold out
