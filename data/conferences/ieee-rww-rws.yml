notes:
- IEEE MTT-S week of co-located topical conferences held every January -> Radio and Wireless Symposium (RWS),
  Power Amplifiers (PAWR), Silicon Monolithic ICs (SiRF), Wireless Sensors and Sensor Networks (WiSNet) and Space
  Hardware and Radio (SHaRC), plus the ARFTG measurement conference and an IEEE IoT Summit
- One common paper summary submission of up to 4 pages in a modified IEEE template; accepted papers go into a
  digest and presented papers into IEEE Xplore
- Late news paper summaries are accepted after the main notification
- Always held in the USA (2023 Las Vegas, 2024 San Antonio, 2025 San Juan, 2026 Los Angeles, 2027 Tampa)
- Not listed in ICORE2026; RF and microwave engineering venue outside the usual CS rankings
