region: taiwan
language: mixed
frequency: annual
organizer: Chinese Image Processing and Pattern Recognition Society (IPPR, 中華民國影像處理與圖形識別學會) with a host
  university each year (Southern Taiwan University of Science and Technology in 2026)
organizer_country: [taiwan]
proceedings: CVGIP conference proceedings (the conference's own volume; no formal series or digital library named on
  the site)
archival: false
rank:
