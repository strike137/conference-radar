fee: 'Early bird NT$4,500 IPPR member, NT$3,000 member student, NT$5,500 non-member, NT$4,300 non-member student;
  regular NT$5,000 / 3,800 / 6,000 / 4,800; banquet included; NT$1,500 per extra paper by the same author (2026)'
typical:
  deadline_months: [6, 7]
  conference_months: [8, 9]
links:
  website: https://cvgip2026.stust.edu.tw/
notes:
- Annual national conference of IPPR, Taiwan's computer vision and pattern recognition society; 39th edition in 2026
- Described on the conference site as the most important academic meeting in Taiwan for computer vision, graphics and image processing
- Papers in Chinese or English; oral papers up to 8 pages A4 plus a 1-page abstract, poster papers submit a 2-page
  extended abstract and the poster file
- Papers are reviewed; at least one author must register by the deadline or the paper is withdrawn from presentation and the proceedings
- Host university and venue change from year to year, always within Taiwan; best paper awards given
- The 2026 submission deadline was extended twice (Jun 15 -> Jun 24 -> Jul 3)
