full_name: International Conference on Image Processing and Vision Engineering
type: conference
tier: minor
areas: [vision]
region: europe
language: english
frequency: annual
organizer: INSTICC (Institute for Systems and Technologies of Information, Control and Communication)
organizer_country: [europe]
proceedings: Springer CCIS
archival: true
fee: 445 EUR (2027, INSTICC member), 495 EUR non-member
typical:
  deadline_months: [11, 12, 1, 2]
  conference_months: [4, 5]
links:
  website: https://improve.scitevents.org/
notes:
- Organized by INSTICC; image processing, computer vision, imaging and multimedia communications
- Proceedings in the SCITEPRESS Digital Library up to 2024; since 2025 published by Springer in a CCIS book
- Two submission stages (1st stage gives an earlier notification), plus late-breaking papers and an abstracts track;
  all deadlines AoE
- Held in European cities (Angers 2024, Porto 2025, Benidorm 2026, Rome 2027) and co-located with CLOSER, CSEDU,
  VEHITS, ICT4AWE, IoTBDS and other INSTICC conferences
- Hybrid support; speakers may present remotely if unable to travel
- Not listed in CORE ICORE2026 or the CCF list; regarded as a minor venue
