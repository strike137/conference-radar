organizer: Applied Category Theory community (local organizers each year)
organizer_country: [international]
proceedings: EPTCS (Electronic Proceedings in Theoretical Computer Science)
archival: true
typical:
  deadline_months: [3]
  conference_months: [6, 7]
links:
  website: https://www.appliedcategorytheory.org/
notes:
- Annual conference on applications of category theory in computer science, logic, semantics, physics and other sciences
- Held since 2018 (Leiden); hosts alternate between Europe and North America (Cambridge 2021, Strathclyde 2022, Maryland 2023, Oxford 2024, Florida 2025, Tallinn 2026)
- Preceded by the Adjoint School research week for students
- Three submission types; original papers (up to 12 pages, considered for talk and proceedings), talk proposals and software demos (1 to 2 page abstracts, not published)
- Proceedings papers appear in EPTCS (ACT 2025 is EPTCS volume 442); single-blind review
- "Registration fees 2025: 140 USD students, 300 USD academics, 700 USD industry"
- Not listed in CORE ICORE2026 or the CCF list
