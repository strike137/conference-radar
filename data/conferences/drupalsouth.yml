notes:
- Community practitioner conference for the Drupal CMS in Australia and New Zealand, run by the volunteer DrupalSouth Steering Committee
- Rotates between Australian and New Zealand cities -> Brisbane (2022), Wellington (2023), Sydney (2024), Melbourne (2025), Wellington (2026)
- Contribution Day followed by a two-day conference with tracks on Drupal development, web tools, UX and content, and people and culture; Splash Awards held at the conference
- Session proposals through a call for papers on the site; talks only, no proceedings
- A separate one or two day DrupalSouth Community Day is held in Canberra each November (19 to 20 Nov 2026, day one at the Hellenic Club)
- Not listed in CORE ICORE2026
