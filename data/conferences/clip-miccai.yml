notes:
- Satellite workshop of MICCAI on translating image-based techniques into clinical practice, 15th consecutive edition in 2026
- "Focus theme in 2025 and 2026: holistic patient models combining images with omics, demographic and other clinical data"
- Moves with MICCAI (Daejeon 2025, Strasbourg 2026)
- Proceedings in Springer LNCS (own volume, LNCS 16126 for CLIP 2025)
- Papers up to 10 pages, double-blind review by at least 3 program committee members; submission via OpenReview in 2026
- On-site only event; a best paper prize is chosen by the audience
- Organizers in 2026 from Tongji University, Fraunhofer IGD, Technion, University of Oslo and others; website run by Fraunhofer IGD
- Not listed in CORE ICORE2026 or the CCF 2026 list
