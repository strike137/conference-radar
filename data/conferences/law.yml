notes:
- Annual workshop of SIGANN on linguistic annotation (annotation schemes, tools, evaluation, inter-annotator agreement, crowdsourcing, LLM-generated annotations)
- Running since 2007; the 2026 meeting was the 20th edition (LAW XX)
- Follows its host conference (EMNLP 2021 Punta Cana, LREC 2022 Marseille, ACL 2023 Toronto, EACL 2024 St Julian's, ACL 2025 Vienna, ACL 2026 San Diego)
- Long (8 pages) and short or demo (4 pages) papers; double-blind review; direct OpenReview submissions plus ARR commitment; hybrid format
- Proceedings in the ACL Anthology (20 papers in 2026, 30 in 2025)
- Each edition has a special theme (Errors in Annotation in 2026)
- Not ranked in ICORE2026 and not on the CCF list
