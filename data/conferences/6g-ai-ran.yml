notes:
- One-day workshop co-located with IEEE INFOCOM; first held with INFOCOM 2026 in Tokyo
- Topics are AI-native 6G RAN and core networks (AI air interfaces, RIC control, Open RAN, federated edge learning, ISAC, RIS, NTN, testbeds)
- Accepted papers appear in IEEE Xplore, subject to registration and presentation
- Papers up to 6 pages in the IEEE INFOCOM workshop format, submitted via EDAS
- Selected papers may be invited for fast-track journal publication
- General chair Akihiro Nakao (The University of Tokyo), co-chairs from University of Oulu and Northeastern University
- Not listed in ICORE2026
