notes:
- Regional computing education conference of the CCSC (CCSC:SW), held at California universities
- Research studies and experience reports from K-12 to university level, up to fifteen single-column pages
- Papers are double-blind peer reviewed; deadline in early December, positioned after the SIGCSE deadline
- Accepted papers appear in the Journal of Computing Sciences in Colleges, and in the ACM Digital Library if presented by the author
- Also panels, tutorials, lightning talks, nifty tools and assignments, and student posters
- 2027 is the 20th edition, at UC Santa Barbara
- Not listed in ICORE2026; not on the CCF list
