notes:
- SEBD ("Sistemi Evoluti per Basi di Dati") is the main annual meeting of the Italian database research community, held since 1993
- Always held in Italy, usually in June at a seaside or resort town; English is the official language
- Regular papers (up to 12 pages), discussion papers (up to 8 pages, may describe already published results) and doctoral consortium papers
- Proceedings published on CEUR-WS and indexed in Scopus; submissions via Microsoft CMT
- Not ranked on CORE ICORE2026 or CCF
