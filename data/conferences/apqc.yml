notes:
- Invited-talk forum on post-quantum cryptography and PQC migration; call for participation only, no paper submissions
  or proceedings
- 2026 speakers included NIST (Dustin Moody), Tanja Lange, PQShield, and PQC leads from Japan, China, Taiwan and
  Singapore, plus a panel on PQC in Asia
- 7th edition was held in China (2025); 8th in Seoul (2026, ST Center/KOFST), hosted by IRCS and KIISC with General
  Chair Kwangjo Kim
- Hybrid format (on-site plus online); useful for networking with Asian PQC standardization people rather than for
  publishing
