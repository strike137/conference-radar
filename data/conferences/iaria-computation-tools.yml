notes:
- Organized by IARIA as part of the ComputationWorld congress, co-located with FUTURE COMPUTING, AIVR, COGNITIVE and other IARIA events (18th edition in 2027)
- Covers computational logics, algebraic methods, programming tools and benchmarking
- Published open access in the IARIA ThinkMind library (ISSN 2308-4170); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Southern Europe (Porto, Barcelona, Nice, Venice, Valencia, Lisbon in recent years)
- The 2027 edition moves from April to March
