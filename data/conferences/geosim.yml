notes:
- Half-day workshop co-located with ACM SIGSPATIAL every year since 2018 (9th edition in 2026)
- Topics are geospatial simulation, agent-based models, trajectory and synthetic data generators, traffic, mobility and digital twin simulation
- Accepted papers appear in the ACM Digital Library (GeoSim 2026 proceedings DOI 10.1145/3849737)
- Full papers up to 10 pages plus up to 2 appendix pages, short papers up to 4 pages; ACM format
- Follows SIGSPATIAL (Hamburg 2023, Atlanta 2024, Minneapolis 2025, Riverside 2026)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
