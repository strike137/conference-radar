notes:
- One-day workshop co-located with SSR 2026 (Security Standardisation Research), in parallel with the Protocol Analysis Workshop
- Focus on migrating blockchains and distributed ledgers to standardized PQC signatures, hybrid designs, crypto-agility, evaluation methods and governance; new PQC primitives are out of scope
- Feeds the specification of the NEDO/METI (Japan) international prize programme on blockchain PQC migration, FY2026 to 2028
- Reviewed paper track (double-blind, at least two reviews, LNCS, regular up to 12 pages, short up to 6, SoK or Vision) and a Work-in-Progress track of extended abstracts up to 4 pages
- No proceedings are announced for reviewed papers; the CFP points authors wanting an archival full paper to SSR 2027, and WiP abstracts are explicitly not in any proceedings (only shared with participants)
- 'Registration (2026, in person): 200 USD early, 250 USD regular, 300 USD late; virtual 100 to 150 USD; student discount available'
