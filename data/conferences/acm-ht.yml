notes:
- Long-running ACM SIGWEB conference (36th edition in 2025) on hypertext, the web, social media and digital
  narratives; proceedings and adjunct proceedings in the ACM DL
- Not listed in CORE ICORE2026 (last ranked A in CORE2018), so tiered minor here by the rank rule
- Long papers 6 to 10 pages and short papers 3 to 6 pages plus references; separate blue sky, late breaking and
  demo tracks
- Usually held in Europe in September (Barcelona 2022, Rome 2023, Poznan 2024, London 2026); Chicago in 2025
- HT 2025 was hybrid, allowing remote presentation for presenters with travel or visa problems
