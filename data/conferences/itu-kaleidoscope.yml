notes:
- Academic conference of ITU-T, the standardization sector of the UN telecom agency, held since 2008; each edition
  has its own theme linking research to future ITU standards and policy
- Technically co-sponsored by IEEE and IEEE ComSoc; accepted and presented papers go into the Conference Proceedings
  and IEEE Xplore, and extended versions of selected papers are considered for the ITU Journal on Future and Evolving
  Technologies (ITU J-FET)
- Double-blind review; full papers 5 to 8 pages presented in plenary, short papers 2 to 4 pages presented as posters;
  submission via EDAS
- Location rotates worldwide (2019 Atlanta, 2020 and 2021 online, 2022 Accra, 2024 New Delhi, 2026 Geneva at the AI
  for Good Global Summit)
- Mostly annual from 2008 to 2022, then no 2023 or 2025 edition (2024 New Delhi, 2026 Geneva)
- The 2026 final report announces the next edition for the week of 21 June 2027, hosted again by the AI for Good
  Global Summit, with the call for papers due in fall 2026
- Scope is broad and includes policy, regulation and ethics papers; Track 3 (social, economic and policy dimensions)
  had the most accepted papers in 2026
- Three best paper awards and Young Author Recognition certificates for presenting authors up to 30 years old
- Not listed in ICORE2026 or the CCF list
