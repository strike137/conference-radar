notes:
- Interdisciplinary workshop bringing together NLP researchers and mental health practitioners, held since 2014
- Proceedings in the ACL Anthology (46 papers in 2026, 28 in 2025, 29 in 2024)
- Recent editions at EACL 2024 (St. Julians, Malta), NAACL 2025 (Albuquerque) and ACL 2026 (San Diego); no edition
  in 2020 or 2023
- Long papers up to 8 pages and short papers up to 4 pages; double-blind review; clinicians sit on the program committee
- Runs a shared task alongside the workshop; 2026 edition was hybrid
- Not listed in ICORE2026
