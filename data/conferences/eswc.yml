id: eswc
name: ESWC
full_name: Extended Semantic Web Conference
type: conference
tier: major
areas: [data, ai]
region: europe
language: english
frequency: annual
organizer: SWSA (Semantic Web Science Association), steward of ESWC since June 2025
proceedings: Springer LNCS
indexing: [Scopus, DBLP]
rank:
  core: B
  ccf: C
acceptance_rate: 24% (2026 research track, 28/116)
fee: 1000 EUR standard / 900 EUR academic / 650 EUR student, main conference early, excl. 25% VAT (2026)
typical:
  deadline_months: [11, 12]
  conference_months: [5, 6]
links:
  website: https://eswc-conferences.org/
  dblp: https://dblp.org/db/conf/esws/
  wikicfp: http://www.wikicfp.com/cfp/program?id=933
notes:
- European sister conference of ISWC; research, resources and in-use tracks published together in Springer LNCS
- Dual-anonymous review with abstract pre-submission and a rebuttal period; deadlines in late Nov / early Dec for
  a May conference
- Accepts resubmissions of papers rejected at the previous ISWC research track (with reviews), introduced for ESWC
  2026
- 'Held in Europe every year: Portoroz (2025), Dubrovnik (2026), Limassol, Cyprus (May 23-27, 2027)'
- 2026 travel support came from the EU GOBLIN COST Action (for Action participants), not from the conference itself
