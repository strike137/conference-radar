notes:
- Information security conference in New Orleans, held since 2014 (no 2021 edition)
- Three conference days in mid May at the Astor Crowne Plaza on Canal Street, preceded by two days of paid training
- Talks on malware, exploits, vulnerabilities, social engineering and forensics, plus a CTF and a lockpick and
  solder village
- No published proceedings; past talk lists are kept in the site archive
