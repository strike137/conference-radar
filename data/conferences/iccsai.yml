language: english
organizer: Galgotias University, Greater Noida, India (with IEEE UP Section members on the committee)
organizer_country: [india]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [9]
  conference_months: [11]
links:
  website: https://www.iccsai.in/
notes:
- Hosted and run by Galgotias University in Greater Noida (Delhi NCR), India; every edition so far held there
- Accepted papers that meet IEEE scope and quality standards are submitted to IEEE Xplore (2023 and 2025 proceedings are in IEEE Xplore)
- Eight tracks covering AI and ML, cybersecurity and privacy, networking and communication, blockchain and cryptography, hardware and energy
- Papers up to 6 pages in IEEE two-column format, up to 2 extra pages for a fee; submission via Microsoft CMT
- "Registration fee (2026): 9,500 to 12,000 INR or 250 to 400 USD for regular authors depending on IEEE membership and mode"
- Hybrid; online presentation is allowed at a higher fee
- Not to be confused with the Indonesian ICCSAI (Computer Science and Artificial Intelligence, Jakarta)
- Not listed in ICORE2026 and not on the CCF list
