id: iccsie
name: ICCSIE
full_name: International Conference on Cyber Security and Information Engineering
type: conference
tier: minor
areas: [security, communications]
region: asia-pacific
language: english
frequency: annual
organizer: Host Chinese universities (Qinghai Institute of Technology in 2025 and 2026; Beijing University of Technology until 2024) with a commercial secretariat (contact iccisie@iaast.cn)
organizer_country: [china]
proceedings: IEEE Xplore (2026; ACM ICPS 2024; 2027 publisher not named)
archival: true
indexing: [EI Compendex, Scopus]
typical:
  deadline_months: [6, 7]
  conference_months: [9]
links:
  website: https://www.iccsie.com/
notes:
- Annual; called International Conference on Computer Science and Information Engineering until 2020, renamed in 2021
- Online 2020 to 2024 (2023 and 2024 nominally in Malaysia), hybrid in Xining, China in 2025 and 2026
- 2026 edition technically supported by IEEE Computer Society, proceedings announced for IEEE Xplore; 2024 had ACM publishing support
- Topics mix cyber security with broad information and communications engineering
- Submission by email to the secretariat; 4 to 8 pages
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
