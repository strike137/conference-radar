notes:
- Formed in 2015 by merging QSIC and SERE; traces back to the Asia-Pacific Conference on Quality Software (Hong
  Kong, 2000)
- Regular paper acceptance rate stable at about 23 to 27% (2021 to 2026)
- Proceedings were published by IEEE CPS (IEEE Xplore) through 2025; the 2026 proceedings moved to Springer LNCS
  (announced July 2026)
- Often held in China (Guangzhou 2022, Hangzhou 2025) but also elsewhere (Chiang Mai 2023, Cambridge 2024, Florence
  2026)
- Regular papers 12 pages, short papers 10; abstract registration one to two weeks before the paper deadline; many
  side tracks (fast abstracts, industry, posters, workshops)
