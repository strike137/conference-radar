notes:
- Regional computing conference run jointly by the computing departments of four CRUCH universities in northern Chile, rotating among Iquique, Arica, Antofagasta and Copiapó
- Modern series since 2010 (17th edition in 2026); successor of the INFONOR symposium held 11 times between 1979 and 1998
- Broad topics including AI and ML, data science, distributed systems, cybersecurity, software engineering, robotics, networks and computing education
- Double-blind review; papers in English (suggested), Spanish or Portuguese, submitted via ConfTool
- 2025 accepted papers were published digitally in the INFONOR-Chile annals; the best papers (15 in 2025) go to the journal Ingeniare (Scopus, SciELO Chile)
- Only papers presented at the conference are considered for publication
- Co-located workshops (education, robotics and others); also an academic, professional and industry meeting
- Not listed in CORE ICORE2026 and not in the CCF list
