  conference_months: [1]
links:
  website: https://ieeegscon.org/
notes:
- Flagship conference of the IEEE Gujarat Section (IEEE Region 10); IEEE conference record 71435
- 2027 is the first edition listed by the organizers, hosted at Sardar Vallabhbhai National Institute of Technology (SVNIT), Surat
- Accepted, registered and presented papers are submitted to IEEE Xplore; no-show papers are removed
- Broad EECS scope in ten tracks (AI, signal processing, communications and 6G, embedded systems, power, VLSI,
  cybersecurity, transportation, engineering education)
- Papers 4 to 8 pages in IEEE two-column format (500 INR or 6 USD per page beyond 6), peer review via Microsoft CMT
