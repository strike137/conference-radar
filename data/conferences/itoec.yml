notes:
- Run by the Chongqing Global Union Academy of Science and Technology (GUAST), which also runs ITNEC and IAEAC with the same committee and website template
- "ITOEC 2026 was the 9th edition; IEEE conference record 69754, proceedings series ISSN 2693-289X"
- The site says all accepted papers are published by IEEE and submitted to EI Compendex; selected papers go to SCI journals
- Two submission rounds per edition; minimum paper length 4 pages
- Broad scope (IT, mechatronics, networking, electronics, automation); regarded as a small, high-acceptance venue
- Held in Chongqing
- Not listed in CORE ICORE2026 or the CCF list
