full_name: IEEE Information Technology and Mechatronics Engineering Conference
type: conference
tier: minor
areas: [general]
region: china
language: english
frequency: irregular
organizer: Chongqing Global Union Academy of Science and Technology (GUAST), technically co-sponsored by IEEE Harbin Section
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI]
fee: 600 USD author, 550 USD student or IEEE member, 200 USD listener (2026)
typical:
  deadline_months: [5, 8]
  conference_months: [3, 9]
links:
  website: http://www.itoec.org/
notes:
- Run by the Chongqing Global Union Academy of Science and Technology, a company that also runs IAEAC, IMCEC, ITNEC and ITAIC
- Held in Chongqing every edition; 2026 was the 9th edition (IEEE conference record 69754)
- Proceedings in IEEE Xplore under ISSN 2693-289X; the site says all past papers are indexed in EI
- Broad scope covering IT, mechatronics, networking, electronics and automation control
- Two submission rounds with short review cycles; papers of at least 4 pages
- Not held every year (no edition in 2021 or 2024)
- Not listed in CORE ICORE2026 or the CCF list
