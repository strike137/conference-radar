areas: [networking, systems]
region: worldwide
language: english
frequency: annual
organizer: CEC workshop chairs (Dell Technologies Ireland and European partners) with IEEE ICNP; supported by the European
  Commission
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [7]
  conference_months: [9, 10]
links:
  website: https://cecf.github.io/
notes:
- One-day workshop co-located with IEEE ICNP since 2023 (Reykjavik 2023, Charleroi 2024, Seoul 2025, Tempe 2026)
- Papers are published in IEEE Xplore as part of the ICNP proceedings
- Papers up to 6 pages including references in IEEE double-column format; single-blind review via HotCRP
- Invited poster session for EU research projects; posters are not peer reviewed and are not in the proceedings
- Supported by the European Commission; chairs and PC mainly from Dell Technologies, European universities and EU
  projects
- Not listed in ICORE2026
