id: lanc
name: LANC
full_name: Latin America Networking Conference
type: conference
tier: minor
areas: [networking]
region: latin-america
language: english
frequency: biennial
organizer: LANC organizing committee, co-located with CLEI (in cooperation with ACM SIGCOMM in 2022 and 2024)
organizer_country: [other]
proceedings: ACM DL (ACM ICPS)
archival: true
fee: 350 USD per paper (2026, ACM Open APC included); 100 USD if an author is at an ACM Open institution
typical:
  deadline_months: [6]
  conference_months: [8, 9, 10]
links:
  website: https://lanc.top/2026/
notes:
- Networking conference for Latin America, held together with CLEI (Latin American Conference on Computing)
- Proceedings in the ACM Digital Library, ICPS open access
- Single-blind review, at least three reviews per paper; full and short papers, English only
- Hybrid (in person and virtual)
- Editions in 2016, 2018, 2022, 2024 and 2026; moves around Latin America (Armenia, Colombia 2022; Bahía Blanca, Argentina 2024; Mexico City 2026)
- Deadlines are usually extended once or twice
