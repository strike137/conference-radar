notes:
- IEEE ComSoc symposium on wireless and mobile radio communications; founded as a workshop in London in 1989
- Held every September; one deadline in March or April, often extended
- PIMRC 2026 was held in Singapore (Marina Bay Sands); 2027 in Lisbon
- Acceptance rate historically around 45%; not in the CCF list
