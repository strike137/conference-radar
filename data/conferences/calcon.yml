id: calcon
name: IEEE CALCON
full_name: IEEE Calcutta Conference
type: conference
tier: minor
areas: [general, communications]
region: south-asia
language: english
frequency: biennial
organizer: IEEE Kolkata Section
organizer_country: [india]
proceedings: IEEE Xplore
archival: true
indexing: [IEEE Xplore]
fee: 'Early bird author registration INR 7,000 / 250 USD (IEEE, academia) to INR 13,000 / 400 USD (non-IEEE, industry), plus GST (2026)'
typical:
  deadline_months: [6, 7]
  conference_months: [12]
links:
  website: https://ewh.ieee.org/r10/calcutta/calcon2026/index.html
notes:
- Flagship conference of the IEEE Kolkata Section, held in Kolkata, India
- Editions in 2005, 2008, 2011, 2014, 2017, 2020, 2022, 2024 and 2026 (9th edition); every two years since 2020
- 2022 and 2024 were held at Jadavpur University; 2026 at the Software Technology Park of India, Kolkata
- Broad engineering scope with oral and poster papers; reviewed via Microsoft CMT
- Accepted and presented papers are submitted to IEEE Xplore
- Not listed in ICORE2026 or the CCF 2026 list
