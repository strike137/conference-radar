id: ichci
name: ICHCI
full_name: International Conference on Intelligent Computing and Human-Computer Interaction
type: conference
tier: minor
areas: [ai, general]
region: china
language: english
frequency: annual
organizer: ICHCI conference secretariat with a host university each year (Nanchang University in 2025 and 2026)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 570 USD or 3800 CNY per 4-page paper (2026); 55 USD per extra page; attendee without paper 210 USD
typical:
  deadline_months: [7]
  conference_months: [9]
links:
  website: http://www.ichci.net/
notes:
- Annual since 2020 and held in China (Sanya 2020, Shenyang 2021, Guangzhou 2022 and 2023, Nanchang 2025 and 2026)
- Accepted papers go to an IEEE conference proceedings volume submitted to IEEE Xplore, EI Compendex and Scopus; papers are at least 4 pages
- Two or three reviewers per paper according to the site
- Run by a commercial-style conference secretariat with a bilingual Chinese and English site; abstract-only presenter and listener registration offered
- 2021 edition was held jointly with ICMLCA at Shenyang Ligong University
- Not listed in CORE ICORE2026 or the CCF list
