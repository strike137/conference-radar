notes:
- Workshop of IEEE COMPSAC (IEEE Computer Society); 14th edition in 2026, 13th at COMPSAC 2025 in Toronto
- Covers network architecture and design, QoS, network deployment, management and operation, network security and network applications
- Organized by Japanese researchers (Hiroki Kashiwazaki, Kindai University; Keisuke Ishibashi, International Christian University); program committee mostly from Japan
- Not listed in the CORE portal; COMPSAC itself is CORE B
- Workshop papers appear in the COMPSAC proceedings on IEEE Xplore
- Workshop deadlines are shared across all COMPSAC workshops; the 2027 workshop list (COMPSAC 2027 in Tokyo, July 13 to 16) was not yet published
