notes:
- MICCAI satellite workshop on shape analysis, statistical shape modelling and geometric deep learning in medical imaging
- Held in 2018 and 2020, then every year since 2023 (2026 was the 6th edition); successor of SAMI 2015 and SeSAMI 2016
- Proceedings in Springer LNCS (2025 -> LNCS 16171); selected papers may be invited to the MELBA journal
- Full papers 8 to 15 pages excluding references in LNCS style, single-blind review via OpenReview
- In-person only; posters come with a short pitch video
- Organizers from TU Munich, Kitware, University Hospital Essen, University of Utah and Harvard Medical School
- Location follows MICCAI (Daejeon 2025, Strasbourg 2026)
- Not listed in CORE ICORE2026 or the CCF 2026 list
