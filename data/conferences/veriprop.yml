notes:
- One-day workshop co-located with CAV on tool-supported verification of probabilistic programs, models and systems
- Topics include probabilistic model checking, inference, and probabilistic reasoning for safety, security and privacy (for example differential privacy)
- Call for short presentations; extended abstracts of 1 to 2 pages, previously published work welcome
- No formal proceedings
- Held every year since 2021 (online 2021, Haifa 2022 at FLoC, Paris 2023, Montreal 2024, Zagreb 2025, Lisbon 2026 at FLoC, Amsterdam 2027)
