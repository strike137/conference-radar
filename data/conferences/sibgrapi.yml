notes:
- Flagship Brazilian conference on computer vision, pattern recognition, image processing and graphics, promoted by
  SBC CEGRAPI
- Proceedings in IEEE Xplore, also archived in the SIBGRAPI Digital Library Archive and SBC OpenLib (SOL)
- Main track papers up to 6 pages, double-blind review by at least three reviewers, with rebuttal and revision rounds
- Held in Brazil every year (Manaus 2024, Salvador 2025, Goiania 2026); co-located with SBGames and SVR in 2025, and
  with SVR, SBGames and ICAT-EGVE 2026 in Goiania in 2026
- Separate tracks for journal papers (C&G, GRSL), thematic workshops, tutorials, theses, undergraduate work and works
  in progress
