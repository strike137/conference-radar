id: wiseml
name: WiseML
full_name: ACM Workshop on Wireless Security and Machine Learning
type: workshop
tier: minor
areas: [security, ai, communications]
region: worldwide
language: english
frequency: annual
organizer: Steering committee from Virginia Tech, University of Maryland, Stevens Institute of Technology and Ohio State
  University; co-located with ACM WiSec
organizer_country: [usa]
proceedings: ACM DL
archival: true
typical:
  deadline_months: [3, 4]
  conference_months: [6, 7]
links:
  website: https://wisec26.events.cispa.de/wiseml2026-workshops/
notes:
- Held with ACM WiSec every year since 2019; location follows WiSec (2024 Seoul, 2025 Arlington, 2026 Saarbrücken)
- Accepted, registered and presented papers appear in the ACM Digital Library
- Papers up to 6 pages in standard ACM conference style; double-blind review; submission via HotCRP
- Topics include adversarial ML for wireless, RF fingerprinting, jamming and spoofing, O-RAN and NextG security, and
  privacy of ML solutions
- 2026 workshop chairs from TU Dortmund, Nexcepta, Virginia Tech and University of Liverpool
- Not listed in CORE ICORE2026
