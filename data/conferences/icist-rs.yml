notes:
- International English-language sister conference of the Serbian YU INFO, held at the same time at Kopaonik, Serbia since 2011
- Not the same as ICIST, the International Conference on Information Science and Technology (icist)
- Broad ICT scope (information systems, model-based software engineering, e-government, big data, IoT, AI) with special tracks
- 60 to 100 papers and about 200 participants per edition
- Two routes - full papers (8 to 16 pages, single-blind) by the February deadline for a Springer Lecture Notes book; extended abstracts (up to 4 pages, double-blind) whose authors submit full papers after the conference for ISOS-CPS (ISSN 2738-1447)
- Submission via Microsoft CMT; at least one author must register and present
- "Registration fee: 17,500 RSD (2026, ICIST and YU INFO share the same fee)"
- Not listed in CORE ICORE2026
