notes:
- Biennial workshop of the Canadian Society of Information Theory, held in even years in early June
- Host university rotates within Canada (Laval 2017, McMaster 2019, Ottawa 2022, UBC Vancouver 2024, Dalhousie
  Halifax 2026)
- Submission is a one-page extended abstract in IEEE two-column format via EDAS; accepted abstracts are presented as
  talks or posters
- No published proceedings and already published work may be presented, so it is a non-archival forum aimed at
  graduate students
- Program has long-format tutorials, keynotes and a student paper competition
- "Registration (2026, CAD, HST extra): full 550 early / 620 late, student 300 / 350; covers tutorials, reception, banquet and lunches"
- Topics cover Shannon theory, coding, source coding, cryptology, machine learning and information theory, networks
  and quantum information
- Not listed in CORE ICORE2026 or in the CCF 2026 list
