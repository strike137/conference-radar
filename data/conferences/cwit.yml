notes:
- Biennial workshop run by the Canadian Society of Information Theory, held at a Canadian university in early June
- Submissions are one-page extended abstracts via EDAS, presented as talks or posters
- No published proceedings; already published work may be presented, so non-archival
- Tutorials, keynotes and a student paper competition; aimed at graduate students in information theory
- Topics include Shannon theory, coding, compression, communications, cryptology, ML and information theory
- 2026 registration was 550 CAD full and 300 CAD student (early, plus HST)
- Halifax (Dalhousie University) 2026, Vancouver (UBC) 2024
