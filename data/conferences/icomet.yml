notes:
- Run by Sukkur IBA University, Pakistan, and held on its campus in Sukkur
- Editions in 2018, 2019, 2020, 2023 and 2026 (5th); irregular schedule
- All editions have proceedings in IEEE Xplore; the 2026 call states EI Compendex indexing
- Three tracks (engineering, computing, mathematics); the 2026 theme was AI for socio-economic transformation
- Selected papers also invited to Springer Discover Artificial Intelligence and two Sukkur IBA journals
- 6 pages max in IEEE two-column format
- 2026 edition moved from March 30-31 to May 22-23, 2026
- Not listed in ICORE2026 or the CCF 2026 list; a small regional venue
