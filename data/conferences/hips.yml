notes:
- Workshop on high-level parallel programming, covering languages, compilers, runtime systems, tools and parallel
  applications; held since 1996 (31st edition in 2026)
- Co-located with IEEE IPDPS every year, so it moves with IPDPS (New Orleans 2026)
- Accepted full papers appear in the IPDPS workshops proceedings in IEEE Xplore; short papers are not published
- Full papers up to 10 pages and short papers up to 4 pages, IEEE style including references; single-blind review
  via EasyChair
- Steering committee from the University of Delaware, NC State and TU Munich
- CORE C (ICORE2026); not on the CCF 2026 list
