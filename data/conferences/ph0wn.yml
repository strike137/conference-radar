notes:
- Free on-site CTF dedicated to smart devices (IoT, embedded, OT, Android, hardware, retro computing), held on the SophiaTech campus in Sophia Antipolis, France
- Friday afternoon of free hands-on workshops at EURECOM, then the CTF; a warm-up social event is run by Sophia Hack Lab
- Call for Workshops (2 to 3 hour hands-on labs, French or English) and Call for Demos (5 minute live demos); submission by email, no papers
- 190 participants in 2026; 182 participants in 46 teams in 2023, mostly from France
- Editions since 2017; the event moved from late November (2023, 2024) to March (2026, 2027)
