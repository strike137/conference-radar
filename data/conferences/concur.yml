notes:
- Main venue for concurrency theory, held since 1990; semantics, logics, verification and analysis of concurrent,
  distributed, probabilistic and real-time systems
- Proceedings in LIPIcs (volume 348 for CONCUR 2025); selected papers invited to a special issue of Logical Methods
  in Computer Science
- Single-blind review with a rebuttal phase; papers up to 15 pages excluding references and appendices, LIPIcs style
- Held under the CONFEST umbrella with QEST+FORMATS and FMICS (Aarhus 2025, Liverpool 2026)
- Mostly held in Europe (Paris 2021 online, Warsaw 2022, Antwerp 2023, Calgary 2024, Aarhus 2025, Liverpool 2026)
- Test-of-Time, Best Paper and Best Student Paper awards
- 43 papers accepted at CONCUR 2026 (CONFEST statistics page)
- CORE B (ICORE2026)
