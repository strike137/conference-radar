notes:
- Industry sciences and computing conference (Industry 4.0, production and supply chain management, AI, IT, information systems); AIS affiliated conference
- Run by a Porto-based association; organization chair Nuno Mateus-Coelho (Lusofona University)
- Proceedings open access in Elsevier Procedia Computer Science, two volumes per edition (2022 to 2024 listed on the site); industry and poster papers in a separate ISBN volume
- Hybrid; all sessions can be presented in person or online
- Co-located workshops include CyberKnife (cybersecurity and data privacy), AI-SSS, IHI (healthcare informatics) and Project and Management in Review
- 2026 edition in Ponta Delgada (Azores) had 103 papers in 19 sessions; 2027 moves to Madeira
- Not to be confused with ISCSIC (Symposium on Computer Science and Intelligent Control)
- Not listed in ICORE2026
