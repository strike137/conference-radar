notes:
- Long-running (since 1989) single-track, industry-oriented networking conference with about 100+ delegates
- Traditionally held in Paris (2023 to 2025); now moving around Europe (Athens/Piraeus 2026, Pisa 2027)
- Full papers 8 pages, short papers 5 pages including references (IEEE format, EDAS); in-person presentation required
- CORE ranks it as a national (France) conference
