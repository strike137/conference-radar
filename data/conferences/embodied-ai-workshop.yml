notes:
- CVPR workshop bringing together computer vision, language, graphics and robotics researchers working on embodied agents
- The 2026 edition was the seventh annual Embodied AI Workshop at CVPR; theme was world models for embodied AI
- Hosts many embodied AI challenges (navigation, manipulation and more) with cash prizes for winners
- Call for 2-page extended abstracts in CVPR format, submitted through OpenReview; submissions need not be anonymized
- Accepted papers are posters or spotlight talks and are posted on the workshop website in a non-archival format
- Deadlines are AoE
- Not listed in ICORE2026 or the CCF list
