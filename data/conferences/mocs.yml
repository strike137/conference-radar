notes:
- Co-located workshop of IEEE ISCC, held every year since about 2011 (16th edition in 2026)
- Papers go into the ISCC Proceedings and are submitted to IEEE Xplore
- Topics include distributed and cognitive clouds, digital twins, privacy-aware applications and smart cities
- Follows ISCC, which is usually held in the Mediterranean region
- Deadlines are extended (2026 from March 15 to April 15)
- Papers up to 6 pages in IEEE double-column format, submitted through EDAS
- Not listed in CORE ICORE2026 or the CCF list
