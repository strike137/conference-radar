notes:
- Half-day, in-person workshop on temporal dynamics in recommender systems (sequential and session-based models, evolving preferences, LLM-based temporal recommendation)
- Held with RecSys 2017, RecSys 2024 (Bari, Italy) and RecSys 2026 (Minneapolis, USA)
- No official proceedings; accepted papers are posted on the workshop website
- Long papers 6 to 8 pages, short papers 4 pages, position and demo papers 2 pages, ACM two-column format, via EasyChair
- At least one author must register and present in person
- Not listed in the CORE ICORE2026 portal and not on the CCF list
