notes:
- One-day workshop on partial evaluation, program transformation, metaprogramming, program analysis and synthesis
- Co-located with POPL every January (Rennes 2026, Mexico City 2027)
- Regular research papers (12 pages) appear in formal ACM proceedings in the ACM Digital Library
- Short papers (6 pages) and talk proposals (2 pages) are not formal publications
- Single-blind review; two-column ACM sigplan acmart format; references and appendices excluded from page limits
- At least one author must attend, physically or virtually
- CORE C (ICORE2026); CCF C
