notes:
- Full-day workshop on data-centric agentic AI systems, LLM agents over data and human-in-the-loop methods, held with VLDB
- 2026 edition at VLDB 2026 in Boston, so the location follows VLDB
- Research track with long papers (up to 8 pages excluding references) and short papers (up to 4 pages including references); single-blind review on Microsoft CMT
- Separate systems track run as a competition for agentic SQL and API systems, with monetary prizes and 4-page system papers
- Accepted papers appear in the official VLDB workshop proceedings
- Steering committee includes Michael Stonebraker, Tom Mitchell, H.V. Jagadish and Renee J. Miller
- Not listed in CORE ICORE2026 or in the CCF 2026 list
