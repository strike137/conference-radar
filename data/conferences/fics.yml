notes:
- Workshop on fixed points in logic, automata, games, coalgebra, type theory, programming language semantics and verification
- Satellite workshop of CSL (Computer Science Logic) in recent editions; 14th edition in 2027
- Held in Europe (Warsaw 2023, Naples 2024, Paris 2026, Brighton 2027); irregular schedule with gaps (no edition between 2015 and 2023)
- Two submission types, short abstracts (3 to 5 pages) for talks and extended abstracts (6 to 10 pages) of original results, EPTCS format
- FICS 2024 post-proceedings appeared as EPTCS 435; for FICS 2026 the planned EPTCS volume was dropped and selected papers go to a Fundamenta Informaticae special issue
- FICS 2027 aims to offer post-proceedings for extended abstracts
- "Registration fee in 2026: 150 EUR (via CSL), EACSL membership not required"
- Not listed in CORE ICORE2026 or the CCF 2026 list
