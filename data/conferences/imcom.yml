notes:
- Run by Sungkyunkwan University (SKKU); started in 2007 as ICUIMC; proceedings were in the ACM DL up to 2018 and
  in IEEE Xplore since 2020
- Held every early January; Korea in 2021 to 2023, recently mostly Southeast Asia (Kuala Lumpur 2024, Bangkok 2025,
  Hanoi 2026), Taipei in 2027
- Two submission rounds (mid September and mid October)
- Regular papers up to 8 pages, short papers up to 4; IEEE Xplore, Scopus and EI; online presentation option
- Broad scope (information management, networks, AI, HCI); selected papers invited to journal special issues
