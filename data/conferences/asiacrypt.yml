notes:
- Third IACR general conference, rotating within Asia-Pacific every December (2023 Guangzhou, 2024 Kolkata, 2025
  Melbourne, 2026 Hong Kong)
- Two-round review with a rebuttal phase; proceedings in Springer LNCS
- 'Strong Japanese involvement: 2025 PC co-chaired by Goichiro Hanaoka (AIST), 2026 by Naofumi Homma (Tohoku University)'
- Students presenting accepted papers get registration waived; limited IACR stipends for others
