links:
  website: https://icosnikom.unprimdn.ac.id/
notes:
- Run by the North Sumatra region of APTIKOM, the Indonesian association of computing faculties; 2026 hosted by
  Universitas Prima Indonesia (UNPRI) in Medan
- 2023 proceedings published by IEEE (2023 edition held 10 to 11 November 2023 in Binjai); 2026 publication plan
  still to be announced
- Three scopes (computing, communication and networking, signal processing); 5 to 6 page IEEE-format papers via
  EDAS; double-blind review
- One-day hybrid conference held together with the APTIKOM North Sumatra regional coordination meeting
- "Fees 2026: Rp 1.8M to 3.5M depending on membership and registration date"
- Not listed in ICORE2026 or the CCF list
