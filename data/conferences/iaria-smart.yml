notes:
- Organized by IARIA as part of the DataSys congress, co-located with AICT, IMMM and other IARIA events (16th edition in 2027)
- Covers smart cities, digital cities, urban communications, smart houses and related devices and systems
- Published open access in the IARIA ThinkMind library (ISSN 2308-3727); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Spain, Portugal, France or Italy (Valencia, Porto, Nice, Venice, Lisbon, Barcelona in recent years)
- Onsite and online participation options
