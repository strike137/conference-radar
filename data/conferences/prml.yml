id: prml
name: PRML
full_name: International Conference on Pattern Recognition and Machine Learning
type: conference
tier: minor
areas: [ai, vision]
region: china
language: english
frequency: annual
organizer: Commercial conference service (iconf.org registration system) with host universities; Sichuan University a long-time co-sponsor, Phuket Rajabhat University and Maejo University in 2027
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 600 USD regular author, 540 USD student author, 560 USD IEEE member (2027); 60 USD per page beyond 5 pages; presentation only 420 USD
typical:
  deadline_months: [2, 3]
  conference_months: [6, 7, 8]
links:
  website: http://www.prml.org/
notes:
- Annual since 2020 (virtual 2020, Chengdu 2021 and 2022, Urumqi 2023, Chongqing 2024 and 2025, Urumqi 2026, Phuket 2027)
- Run by a commercial conference service with Chinese host universities; IEEE listed as co-sponsor
- Proceedings 2021 to 2026 published by IEEE and indexed in EI Compendex and Scopus
- Selected papers recommended to JAIT, JOIG and other journals run by the same publishing network
- Full paper (published) or abstract only (presentation without publication) submissions
- Hybrid online and onsite sessions in most years
- Not listed in CORE ICORE2026 or the CCF list
