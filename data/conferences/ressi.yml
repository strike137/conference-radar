organizer: RESSI steering committee with the CNRS GDR Sécurité Informatique and a rotating host lab (SnT, University of
  Luxembourg in 2026)
organizer_country: [europe]
proceedings: None (with author consent, a record of the talks may be posted on the event website)
archival: false
typical:
