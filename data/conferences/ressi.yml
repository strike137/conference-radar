links:
  website: https://ressi2026.sciencesconf.org/
notes:
- French-speaking meeting of the academic, industrial and teaching community in information systems security, supported
  by the CNRS GDR Sécurité Informatique
- Program mixes replays of notable talks and PhD defenses from the previous year, collaborative project presentations,
  teaching experience reports, a student security challenge and a PhD session
- PhD session takes short papers of 2 to 4 pages (IEEEtran conference template) presented as a short talk plus an A0
  poster; teaching papers up to 4 pages; French preferred but English is allowed
- No formal proceedings, so marked non-archival here
- Residential format with a 3-day program; registration includes meals and lodging (2026 early fee 500 EUR student, 550
  EUR regular)
- Held in a different French town each year (Eppe-Sauvage 2024, Lanniron 2025); 2026 was in Clervaux, Luxembourg
