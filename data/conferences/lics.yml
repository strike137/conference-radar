notes:
- Flagship venue for logic in computer science; sponsored by ACM SIGLOG and the IEEE Computer Society TCMF, in cooperation with the Association for Symbolic Logic
- Proceedings moved to Dagstuhl LIPIcs (open access, no publication charges) from LICS 2026
- Lightweight double-blind review with author response; up to 12 pages excluding references
- Titles and abstracts are due one week before full papers; deadlines are firm
- Held in Haifa 2022 and Lisbon 2026 as part of FLoC; Boston 2023, Tallinn 2024, Singapore 2025, Montreal 2027
- CORE A* (ICORE2026), CCF A
