notes:
- Workshop on data spaces and digital twins for critical infrastructure and smart cities (interoperability, data sovereignty, security, resilience, AI); 2026 is the 4th edition
- Co-located with the IEEE International Conference on Big Data (IEEE BigData) since 2023
- Papers go into the IEEE BigData workshop proceedings (IEEE Computer Society Press, IEEE Xplore)
- Full papers up to 10 pages and short or position papers up to 5 pages including references, IEEE Computer Society two-column format
- Half-day workshop held fully online over Zoom in 2025 and 2026
- One author must register for IEEE BigData at the full member or non-member rate, not the student rate
- Deadlines are usually extended; the 2026 deadline moved from Oct 15 to Nov 1
- Not ranked by CORE (not in ICORE2026) or CCF
