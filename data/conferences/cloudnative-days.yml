notes:
- Community-run Japanese practitioner conference on cloud native technology (Kubernetes, platform engineering, observability, SRE)
- Grew out of Japan Container Days (2018); first CloudNative Days in Fukuoka in 2019
- Main Tokyo edition usually in November or December (CloudNative Days Tokyo until 2023, Winter since 2024) at Ariake Central Tower Hall and Conference, hybrid with online streaming
- Smaller regional editions in spring or summer (Fukuoka 2023, Sapporo 2024, Okinawa 2025); in May 2026 replaced by Cloud Native Kaigi in Nagoya, co-hosted with Platform Engineering Kaigi and SRE Kaigi
- Talk proposals (CFP) selected by the executive committee, plus a separate lightning talk call; no papers
- CNDW2025 had 48 sessions and about 1,900 registrations including online
- Student scholarship program for travel support
