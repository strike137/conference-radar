notes:
- Workshop on instance-level recognition and generation (particular object retrieval, image matching, geo-localization, personalized generation)
- Started as a landmark recognition workshop at CVPR 2018 and 2019, then ECCV 2020, ICCV 2021, ECCV 2022, ECCV 2024, ICCV 2025 and ECCV 2026 (8th edition)
- Long papers (14 pages) and short papers (4 pages), double-blind review; only long papers go into the ECCV workshop proceedings
- Also hosts invited talks for papers from the main conference; best paper awards and student support grants in 2026
- Not listed in ICORE2026 or the CCF list
