notes:
- USENIX practitioner conference on site reliability engineering and running distributed systems at scale
- Two editions a year -> Americas (spring, US West Coast; Seattle, Santa Clara or San Francisco) and EMEA (October, Dublin)
- Talk proposals only, no papers or proceedings; slides of many talks are posted on the usenix.org program pages
- Lightning talks have a separate later call
