notes:
- Organized by the Eurographics Working Group on Data Visualization; the main European visualization conference
- ICORE2026 B (listed as Eurographics/IEEE Symposium on Visualization), CCF B
- Full papers are published as a special issue of Computer Graphics Forum (since 2008) after a two-stage review with a revision round
- Held in Europe (Odense 2024, Luxembourg 2025, Nottingham 2026, Stuttgart 2027); EuroVA workshop co-located
