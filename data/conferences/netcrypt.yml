notes:
- Organized by the School of Computer and Systems Sciences (SC&SS), Jawaharlal Nehru University, New Delhi
- Scope covers cryptology, network security, privacy and cyber security, plus networking, intelligent systems, blockchain and quantum computing tracks
- Accepted papers are submitted to IEEE Xplore; NETCRYPT 2025 proceedings published by IEEE (DOI 10.1109/NETCRYPT65877.2025, IEEE conference record 70801 for 2026)
- Held at JNU, New Delhi in hybrid mode (May 2025 and October 2026 editions)
- "Acceptance rate: 20.78% (2025, 345/1660)"
- "Fee: INR 12,550 or USD 350 for non-IEEE professional authors, USD 280 for IEEE members (2026)"
- Submission via Microsoft CMT
- Not ranked by CORE (ICORE2026); not in the CCF list
