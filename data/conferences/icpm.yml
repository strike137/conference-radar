notes:
- Flagship venue of the process mining community (process discovery, conformance checking, event data, predictive
  process monitoring)
- Held since 2019; mostly in Europe (Padua 2020, Eindhoven 2021, Bolzano 2022, Rome 2023, Copenhagen 2024),
  Montevideo 2025
- Moved from October to February; no research conference in 2026 (only Process Mining Industry Days, Karlsruhe,
  March 2026); 2027 edition in February
- Research papers up to 13 pages single column, single-blind, at least three reviewers; mandatory abstract one week
  before the paper
- 2027 regular papers open access in the ACM ICPS; research track was in IEEE Xplore up to 2025
- Workshop papers in Springer LNBIP; demos and doctoral consortium in CEUR-WS
- Selected papers invited to a special collection of the Process Science journal (Springer)
- CORE B (ICORE2026); not on the CCF list
