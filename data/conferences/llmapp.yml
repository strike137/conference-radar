notes:
  - FSE workshop on LLM app stores (GPT Store, Poe, Coze, FlowGPT and others) covering mining, security and privacy, quality and ecosystem analysis
  - First edition at FSE 2025 in Trondheim, Norway on 26 June 2025
  - Position papers (1 to 4 pages) and research papers (8 pages), ACM sigconf format, double-anonymous review by at least three PC members
  - Accepted papers published in the FSE 2025 companion proceedings (ACM)
  - Not on the FSE 2026 workshop list
  - Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
