  conference_months: [10]
links:
  website: https://www.icita.world/
notes:
- Broad IT conference held in hybrid mode (in person and online)
- Full papers appear in Springer Lecture Notes in Networks and Systems; posters and company papers are presented only
- Recent hosts include Lisbon (2022), Turin (2023), Sydney (2024), Oslo (2025) and Helsinki (2026)
- 2026 general chairs from Heriot-Watt University and Charles Sturt University
- Co-located IKIT workshop (Information and Knowledge in the Internet of Things)
- "ICORE2026 rank: Australasian C"
- The website is inconsistent in places (2025 called the 19th edition, 2026 the 21st; camera-ready date given as
  both 5 and 10 Sep 2026)
