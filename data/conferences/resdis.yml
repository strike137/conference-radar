notes:
- Half-day workshop on resource disaggregation and composable systems for HPC and cloud (memory pooling, optical interconnects, runtime and OS support), held with SC
- 2026 is the 6th edition; the 3rd (2023) to 6th (2026) editions were all held with SC in the USA
- Papers of at least 5 pages with no upper limit, IEEE template in 2026 (ACM in 2025), submitted through the SC Linklings site
- Papers published in the SC Workshops Proceedings volume
- Not listed in CORE ICORE2026
