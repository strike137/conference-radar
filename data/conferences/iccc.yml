notes:
- Organized by the Association for Computational Creativity since 2010; the main venue of the computational
  creativity community
- Not the IEEE ICCC communications conferences (see iccc-cn and iccc-chengdu)
- Open-access proceedings published by the ACC with an ISBN (ICCC'26 -> ISBN 978-989-54160-8-0)
- Full papers up to 8 pages plus 2 pages of references, double-blind review; separate short paper call about
  two months later; an author must present live for the paper to be in the proceedings
- Location changes every year (Campinas 2025, Coimbra 2026); the ACC asked for proposals outside Europe for 2027
- CORE C (ICORE2026)
