notes:
- EAI conference series on mobile networks and network management, held since 2009; 2026 is the 16th edition
- Proceedings in Springer LNICST; selected papers invited to extend for Mobile Networks and Applications (MONET)
- Held in China in recent years (Nanchang 2022, Yingtan 2023, Hefei 2024, Chongqing 2025 and 2026); 2020 was virtual
  and 2021 was an online edition hosted from Chiba, Japan
- Hybrid format; main track, late track and poster track with separate deadlines
- Not listed in ICORE2026
