links:
  website: https://field-matters.github.io/
notes:
- Workshop on NLP tools for field linguistics, language documentation and under-resourced languages
- Held since 2022 (COLING 2022 Gyeongju, EACL 2023 Dubrovnik, ACL 2024 Bangkok, ACL 2025 Vienna, EACL 2026 Rabat, EACL 2027 Athens as the 6th edition)
- Proceedings in the ACL Anthology every year since 2022
- Short archival papers up to 4 pages and long archival papers up to 8 pages; non-archival abstracts and papers also accepted, even after the main deadline
- Accepts ARR pre-reviewed submissions and presentations of Findings papers; submissions via OpenReview
- 2027 edition runs a shared task on automatic interlinear glossing
- Not listed in ICORE2026 and not on the CCF list
