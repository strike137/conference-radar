organizer: Field Matters organizing committee (2027 organizers from University at Buffalo, TU Munich, Palisade Research, University of Gothenburg and Chalmers, UC Santa Barbara); co-located with ACL-family conferences
organizer_country: [international]
proceedings: ACL Anthology
archival: true
typical:
