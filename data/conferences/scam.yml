notes:
- Two-day conference on source code analysis and manipulation, held since 2001 and co-located with ICSME
- "Recent hosts: Limassol (2022), Bogota (2023), Flagstaff (2024), Auckland (2025), Benevento (2026), Toronto (2027)"
- Proceedings in IEEE Xplore; best papers have been invited to journal special issues (JSS, EMSE, JSEP)
- Research track and engineering track; research papers up to 12 pages including 2 pages of references, IEEE format
- Double-blind review by at least three PC members; at least one author must register and present
- CORE C (listed as IEEE International Working Conference on Source Code Analysis and Manipulation), CCF C
