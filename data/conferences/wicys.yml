notes:
- Annual US conference of the WiCyS non-profit to recruit, retain and advance women in cybersecurity; allies welcome
- 'Non-archival: presentations, panels, workshops, lightning talks, plus a student poster track; no proceedings'
- Large scholarship program (865 scholarships and 254 travel stipends in 2026); in 2026 students could attend only
  with a scholarship, while 2027 offers limited open registration for students
- 2026 drew over 2,000 in-person attendees; includes a career fair, CTF and mentoring; a separate virtual edition
  followed on 22-23 Apr 2026
- Poster deadline is about 1 to 2 months after the presenter/scholarship deadline
