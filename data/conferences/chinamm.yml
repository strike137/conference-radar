id: chinamm
name: ChinaMM
full_name: China Multimedia Conference
name_local: 中国多媒体大会
type: conference
tier: domestic
areas: [vision, general]
region: china
language: mixed
frequency: annual
organizer: CSIG and CCF (CSIG Multimedia Technical Committee and CCF Multimedia Technical Committee)
organizer_country: [china]
proceedings: None (accepted papers are recommended to partner journals such as Journal of Software, Chinese Journal
  of Computers, IEEE Transactions on Multimedia and Multimedia Systems)
archival: false
fee: 2,800 CNY non-member, 2,200 CNY CSIG/CCF member, 500 CNY student member (2026, early)
typical:
  deadline_months: [3, 4]
  conference_months: [7]
links:
  website: https://chinamm.csig.org.cn/2026/
notes:
- National multimedia conference of China, organized by CSIG and CCF through their multimedia technical committees;
  held in a different Chinese city each year (2024 Yinchuan, 2026 Taiyuan)
- Accepts papers in Chinese (6 to 8 pages) or English (up to 10 pages); double-blind review
- "Non-archival as a conference: there is no proceedings volume, and accepted papers are recommended to Chinese
  journals or to SCI/EI multimedia journals for separate publication"
- All accepted papers must be presented at the conference; at least one author per paper pays a non-student registration
- Not in ICORE2026 or the CCF 2026 list (domestic venue)
