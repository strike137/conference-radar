notes:
- Workshop co-located with IEEE GLOBECOM; 4th edition in Taipei (2025, half day), 6th edition in Macau (2026)
- Steering committee Eduard Jorswieck (TU Braunschweig) and Shui Yu (UTS); 2026 general chairs from University
  of Ottawa and Virginia Tech
- Topics include RF fingerprinting, deep learning for physical layer security, adversarial ML in wireless, LLMs
  for wireless security and intrusion detection for wireless networks
- Accepted and presented papers go into the IEEE GLOBECOM workshop proceedings in IEEE Xplore; in-person
  presentation required (no-show papers removed)
- Submissions via EDAS through the GLOBECOM workshop call
- Not listed in ICORE2026
