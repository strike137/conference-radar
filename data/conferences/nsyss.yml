notes:
- Run by the CSE department of BUET (Dhaka, Bangladesh) since 2015; formerly the International Conference on Networking,
  Systems and Security (renamed in 2025)
- Proceedings in the ACM International Conference Proceedings Series (ACM Digital Library); papers must be presented
  (in person or online) to appear
- Held every December in Bangladesh (Dhaka, Cox's Bazar, Khulna, Sylhet); online presentation allowed when authors cannot travel
- Scope covers networking system design, system security, AI for systems and networks, computing systems and HCI
- Explicitly invites undergraduate student papers; also has a student poster track
- Full registration (not student) of one author required per paper; one registration covers up to two papers
- Not ranked in ICORE2026 and not on the CCF list
