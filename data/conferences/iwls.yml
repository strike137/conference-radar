id: iwls
name: IWLS
full_name: International Workshop on Logic and Synthesis
type: workshop
tier: minor
areas: [systems]
region: worldwide
language: english
frequency: annual
organizer: IWLS Steering Committee, with a host university each year (Fudan University in 2027)
organizer_country: [international]
proceedings: None (participants only)
archival: false
fee: 500 USD non-member, 400 USD IEEE/ACM member, 300 USD student (2026, early registration)
typical:
  deadline_months: [2, 3]
  conference_months: [5, 6]
links:
  website: https://www.iwls.org/
notes:
- Main research forum for logic synthesis, optimization and verification of integrated circuits; first held in 1987
- Standalone workshop hosted by a university each year; recent editions in Lausanne 2023, Zurich 2024, Verona 2025,
  Hong Kong 2026, Shanghai 2027 (2021 and 2022 virtual)
- Complete papers up to 8 pages excluding references; double-blind review; early-stage ideas are welcome
- Non-archival, accepted papers are distributed only to participants, so work can later go to DAC, ICCAD or DATE
- Runs a yearly logic synthesis programming contest with cash prizes and a best student paper award
- Not listed in CORE ICORE2026 or the CCF 2026 list
