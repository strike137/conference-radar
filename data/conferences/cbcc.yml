links:
  website: https://conf.ccf.org.cn/cbcc2025
notes:
- National blockchain conference of the China Computer Federation (CCF), run by its blockchain technical committee;
  2025 was the 8th edition
- English papers published in Springer Communications in Computer and Information Science (CCIS) as "Blockchain
  Technology and Application"; Chinese papers are recommended to Chinese journals
- Usually held in December in China (Haikou 2023, Shanghai 2024 and 2025); the 2023 edition was called the CCF
  China Blockchain Summit (CBCS 2023)
- 2025 accepted 24 papers for the English proceedings and 28 for Chinese journal recommendation
- Not ranked in CORE ICORE2026
