notes:
- Run by the Science and Information (SAI) Organization, a UK based company that also runs IntelliSys, Computing and the Future Technologies Conference (FTC)
- Held annually since 2018; formerly the Future of Information and Communication Conference, renamed to Information and Computing for 2026
- Virtual in 2021 to 2023 and held in Berlin from 2024 (April in 2024 and 2025)
- Since 2026 affiliated to FTC; FICC papers appear as a dedicated volume of the FTC proceedings in Springer Lecture Notes in Networks and Systems
- Double-blind review; two submission rounds plus a late-breaking round (late-breaking papers go to a separate volume after the conference)
- "Organizer reports 137 papers presented out of 401 submissions (2025)"
- Not listed in the CORE ICORE2026 portal
