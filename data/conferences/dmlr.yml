id: dmlr
name: DMLR
full_name: Workshop on Data-centric Machine Learning Research
type: workshop
tier: minor
areas: [ai, data]
region: worldwide
language: english
frequency: irregular
organizer: DMLR community (workshops, research retreats and the DMLR journal); 2024 organizers included Adam Mahdi,
  Ludwig Schmidt, Alex Dimakis and others; co-located with ICML, ICLR or NeurIPS
organizer_country: [usa, europe]
proceedings: None (no workshop proceedings; selected papers invited to the DMLR journal)
archival: false
typical:
  deadline_months: [5]
  conference_months: [7]
links:
  website: https://dmlr.ai/
notes:
- Data-centric AI and ML workshop series held at NeurIPS 2021, ICML 2022, ICML 2023, ICLR 2024 and ICML 2024 (fifth
  edition, Vienna)
- 'Non-archival: the 2024 CFP says no paper proceedings are published; accepted papers are presented as posters'
- Research papers up to 8 pages and extended abstracts up to 4 pages, submitted via OpenReview
- Top submissions are invited to send extended versions to the DMLR journal (JMLR family)
- 2024 edition was a one-day workshop on July 27 (program page); the CFP lists the ICML workshop days, 26-27 July
- No workshop edition announced since ICML 2024 (as of 2026-10-31)
- Not listed in ICORE2026 and not on the CCF list
