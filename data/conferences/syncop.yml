notes:
- Workshop on verification and parameter synthesis for real-time, hybrid and probabilistic systems and on parameterised verification
- Usually a satellite event of ETAPS (2014 to 2024, 2026); 2025 edition was held with CONFEST 2025 in Aarhus; no editions in 2020 and 2021
- SynCoP 2026 accepted short abstracts only (about 3 pages); recently published, ongoing or under-review work welcome
- Accepted abstracts are made available to participants only and are not referenced publications
- Program built around several invited keynote talks plus informal contributed talks
- Not listed in ICORE2026
