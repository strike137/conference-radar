links:
  website: https://qcrypt.net/
notes:
- Main yearly conference of the quantum cryptography community (QKD, quantum protocols, quantum-secure computation), theory and experiment; founded 2011
- Steering committee picks the host and PC chairs and rotates the venue across continents (Amsterdam 2021 online, Taiwan 2022, Maryland 2023, Vigo 2024, Sanya 2025, Ottawa 2026, Vienna 2027)
- Submission is a 2 to 3 page extended abstract, selected for a contributed talk or a poster; separate later poster-only deadline
- "No published proceedings: results may be published elsewhere, but contributed talks are highly competitive (32 contributed talks in 2026)"
- Student paper prize awarded since 2012; talks are recorded and posted on the site
- Held in person; usually one week (Monday to Friday) in August or September
- Not listed in CORE ICORE2026 or the CCF list
