notes:
- Organized by IARIA as part of the NexTech congress, co-located with UBICOMM and other IARIA autumn events (11th edition in 2026)
- Covers cybersecurity topics such as threat detection, critical infrastructure protection, blockchain, privacy and cyber forensics
- Published open access in the IARIA ThinkMind library (ISSN 2519-8599); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Spain, Portugal or Italy (Valencia, Porto, Venice, Lisbon, Barcelona in recent years); onsite or online presentation allowed
- Not to be confused with IEEE-CYBER (IEEE International Conference on CYBER Technology in Automation, Control, and Intelligent Systems)
