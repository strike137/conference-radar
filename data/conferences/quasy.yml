notes:
- Workshop on quantitative and statistical approaches to syntax using corpora and treebanks
- Part of the biennial SyntaxFest with Depling, IWPT, UDW and TLT or SLiDE, with one joint OpenReview submission
- Editions in 2019 (Paris), 2021 (Sofia, online), 2025 (Ljubljana); 4th edition at SyntaxFest 2027 in Prague
- Regular papers up to 8 pages and short papers up to 4 pages; archival or non-archival (previously published) submissions
- Proceedings in the ACL Anthology (14 papers in 2025, 2025.quasy-1)
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
