links:
  website: https://www2.ia-engineers.org/icisip2026/
notes:
- Run by the Institute of Industrial Applications Engineers (IIAE, Kitakyushu); 13th edition in 2026
- Held each September in Japan (Kobe 2021 and 2022, Beppu 2023, Matsuyama 2024, Nagasaki 2025, Akita 2026; 2021 to 2023 hybrid); 2017 in Hawaii and 2019 in Taipei
- Broad topics aimed at industrial applications (electrical and electronic, control, sensing, information and network systems, image processing)
- Full papers 4 to 8 pages; on-site oral and poster sessions, remote presenters via Zoom or video
- Proceedings self-published by IIAE (ICISIP2025 ISBN 978-4-907220-35-8); selected papers recommended to the IIAE journal JIIAE or MDPI Journal of Imaging special issues
- Not listed in CORE ICORE2026
