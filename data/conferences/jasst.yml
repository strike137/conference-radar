  website: https://jasst.jp/
notes:
- Japan's main software testing symposium for practitioners and researchers, run by NPO ASTER; the Tokyo edition in
  March is the flagship and the only one with a paper call
- Regional one-day editions (Hokkaido, Tohoku, Niigata, Tokai, Kansai, Shikoku, Kyushu) run through the year without
  a paper track
- "Paper track: research papers and experience papers, 4 to 8 A4 pages in Japanese or English, at least two PC
  reviewers; separate practice case study call"
- Accepted papers go into the symposium proceedings and are posted with slides on the JaSST website; no indexing
- One presenter per accepted paper gets free admission to the Tokyo symposium
