notes:
- Workshop of the IEEE International Conference on Blockchain and Cryptocurrency (ICBC); held with ICBC in Dublin
  2024, Pisa 2025 and Brisbane 2026
- Accepted papers appear in the ICBC proceedings in IEEE Xplore
- Full papers up to 6 pages and short papers up to 4 pages (excluding references), IEEE two-column format,
  double-blind review, submission via EDAS
- Topics include zk-rollups and zkVMs, privacy dApps, ZKP-based identity, zk-ML, ZKP tooling and languages
- One-day workshop; chairs from TU Berlin and University of Münster
- Not listed in CORE ICORE2026 or the CCF list
