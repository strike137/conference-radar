notes:
- Evaluation forum for multilingual and multimodal information access in the languages of the Americas and the Caribbean
- 2026 shared tasks on food safety image classification and Spanish-English gastronomic NER, plus applied AI and software engineering, education and doctoral symposium tracks
- System description papers of 5 to 8 pages in English (CEURART template), anonymous peer review via OpenReview
- Accepted papers published open access in CEUR Workshop Proceedings
- 1st edition in 2026, co-located with the 20th Colombian Conference on Computing (20CCC) in Cartagena
- Not listed in CORE ICORE2026
