notes:
- Offensive security conference organized by the Politecnico di Torino student team pwnthem0le, held entirely in
  English
- Held in the Aula Magna of Politecnico di Torino, Turin; editions since 2019 (none in 2024)
- On-site m0leCon CTF finals in the two days before the talk day; finalists qualify through an online teaser CTF
  held in autumn
- Free beginner workshops and a beginner CTF in October and November
- Not ranked in ICORE2026; not on the CCF 2026 list
