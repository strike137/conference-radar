notes:
- Small IAPR-endorsed conference on AI, pattern recognition, machine learning and computer vision, started in 2020
- Run by a steering committee centred on the University of Sfax (Tunisia) and Larbi Tebessi University (Algeria)
- Held in Hammamet, Tunisia (2020, 2022, 2023, 2025) and Istanbul, Turkey (2024, 2026)
- Proceedings in Springer CCIS as revised selected papers since 2022; the 2020 edition was published in ACM ICPS
- Double-blind review through EDAS with at least three reviewers; full papers 12 to 15 pages, short papers 6 to 11 pages
- IAPR best paper awards; selected papers invited to journal special issues
- Not listed in ICORE2026 (the CORE entry "ISPR" is the unrelated Workshop on Presence)
