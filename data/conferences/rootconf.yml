notes:
- Practitioner conference on platform engineering, SRE, infrastructure, distributed systems and security run by Hasgeek in Bengaluru
- Community editors and track curators review proposals and work with speakers to develop their sessions
- 2025 had four tracks (platform engineering, AI and GenAI for security, distributed data systems, software supply chain security)
- 2026 theme was Platforms for AI, and AI for Platforms, moved from May to November
- No proceedings; talk videos and livestream are for annual members
