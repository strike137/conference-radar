notes:
- Industry-oriented conference on video coding and streaming (codecs, adaptive streaming, CDNs, QoE, low latency,
  media over QUIC), held in Denver since 2016
- Talks are selected from one-page extended abstracts peer reviewed by the TPC; accepted talks are 15 to 20 minutes
  and recorded for YouTube
- Paper publication is opt-in; speakers may submit a full paper (up to 8 pages) or a short paper (up to 2 pages),
  reviewed separately and published in the ACM Digital Library
- Authors of rejected abstracts may still submit a full paper
- Audience mostly from industry (Netflix, Comcast, Akamai, BBC and others); includes a tutorial track and exhibits
- Always in Denver, Colorado (The Cable Center 2025 and 2026, Denver Botanic Gardens 2027)
- Not listed in ICORE2026; not on the CCF 2026 list
