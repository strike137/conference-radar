notes:
- Annual conference held every year since 2015 at a rotating host in India (IIT Kanpur 2015, IIT Bhilai 2024, PSG
  College of Technology 2025, IIT Dharwad 2026), under the aegis of ACSDM
- Proceedings in Springer LNCS
- Scope covers algorithms, graph theory, combinatorics, computational geometry and discrete applied mathematics
- Papers up to 14 pages in LNCS style including references, optional appendix
- Selected papers invited to a special issue of Discrete Applied Mathematics (Elsevier); the 2026 home page also
  mentions a Theoretical Computer Science special issue as in 2025
- Pre-conference school held before the main conference
- Not found in ICORE2026
