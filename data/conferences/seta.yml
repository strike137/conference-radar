notes:
- Long running conference on sequences, signals and waveforms for communications, radar, coding and cryptography
  (Boolean functions, stream ciphers, low correlation sequences)
- Held roughly every two years at a rotating host (2018 Hong Kong, 2020 online from Bergen, 2024 Colchester, 2026
  Wuhan); no edition in 2022
- Submissions are peer reviewed extended abstracts of up to 10 pages, made available only to conference
  participants
- All speakers are invited to submit a full version to a journal special issue (AMC for 2026, Cryptography and
  Communications for 2024), so the conference itself is non-archival
- Early editions (1998, 2001) had Springer books and later ones Springer LNCS, but the 2026 site names no
  proceedings series
