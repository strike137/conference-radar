notes:
- Pre-conference workshop of IEEE EuroS&P; 2026 edition in Lisbon on July 6 is the first (not in the EuroS&P 2024
  or 2025 workshop lists)
- 'Scope: using explainable AI for security tasks and the security and robustness of XAI itself'
- 'Short papers: 6 pages plus references and appendices, supplied IEEE A4 template, double-blind; published in IEEE
  Xplore'
- CFP says accepted papers are presented as posters; 2026 had 4 papers (4 of 13 submissions accepted) in one paper
  session plus 3 keynotes
- The original January 29 deadline was a mistake and was moved to February 26; EuroS&P 2027 will be in Madrid (July
  5 to 9, 2027), XAISEC 2027 not announced yet
