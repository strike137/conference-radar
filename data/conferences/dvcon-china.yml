notes:
- Industry conference on standardized languages, tools and methodologies for design and verification of electronic systems and ICs (SystemVerilog, UVM, SystemC, PSS, IP-XACT, UPF, AI agents for verification)
- Chinese edition of the Accellera DVCon series, first held in 2017; one-day event at the Shanghai Renaissance Pudong Hotel with tutorials, papers, posters and an exhibition
- Blind review of a 600 to 1000 word abstract first, then draft paper, final paper and slides after acceptance
- Some talks are given in Chinese; presentation slides are posted on the DVCon China website
- Not held in 2022 (cancelled because of COVID-19)
- Not listed in the CORE portal (ICORE2026) or on the CCF list
