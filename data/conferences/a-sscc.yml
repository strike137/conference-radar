id: a-sscc
name: IEEE A-SSCC
full_name: IEEE Asian Solid-State Circuits Conference
type: conference
tier: minor
areas: [general]
region: asia-pacific
language: english
frequency: annual
organizer: IEEE Solid-State Circuits Society (SSCS) with an Asian steering committee; local organizing committee
  rotates (2026 National Yang Ming Chiao Tung University, Taiwan)
organizer_country: [international]
proceedings: IEEE Xplore
fee: TWD 22,500 (about 750 USD) IEEE member author registration; student attendee early bird TWD 11,250 (about
  375 USD) for IEEE members (2026)
typical:
  deadline_months: [6]
  conference_months: [11]
links:
  website: https://a-sscc2026.org/
notes:
- Asian integrated circuit design conference supported by IEEE SSCS; 22nd edition in 2026
- Rotates among Japan, Korea, Taiwan and China (2020 Hiroshima, 2021 Busan, 2022 Taipei, 2023 Haikou, 2024
  Hiroshima, 2025 Daejeon, 2026 Taichung); held every November
- Two-page paper submission (plus one optional page of supplementary figures); tracks cover analog, data
  converters, digital, SoC, wireless, wireline, memory, emerging technologies, FPGA and an industry program
- Measurement results strongly recommended; papers only describing CAD tools are not considered
- Papers in IEEE Xplore; extended versions of selected papers go to special issues of IEEE JSSC and IEEE SSC-L
- Student Design Contest and FPGA demo sessions; student travel grants up to 1000 USD (2026)
- One author registration per accepted paper, and the registered author must present in person
- Not listed in ICORE2026; circuits venue outside the usual CS rankings
