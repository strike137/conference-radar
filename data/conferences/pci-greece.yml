notes:
- National Greek general computer science conference with international participation, established by the Greek Computer Society in 1984
- Proceedings published by ACM in the International Conference Proceedings Series (ICPS) since 2013
- Papers in English, ACM format; up to 9 pages single column for review, 8 pages two column camera-ready (5 for short papers)
- Held in Greece (mostly Athens) and occasionally Cyprus; 2024 and 2026 in Athens, no 2025 edition
- Research papers, research project results and special sessions tracks
- ACM ICPS open access model, so authors outside ACM Open institutions may have to pay an APC
- Not listed in ICORE2026 or the CCF 2026 list
