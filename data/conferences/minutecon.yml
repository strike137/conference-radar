notes:
- New independent hacker conference in Boston, first edition in 2027
- Run by NEISA, the group behind the Boston Security Meetup and the Boston Hackers Meetup
- Two tracks over two days, about 500 attendees, held at the Boston Marriott Cambridge
- Talks on offensive security, defense and detection, appsec, hardware and embedded, AI security and policy
- Talks only, no formal proceedings
