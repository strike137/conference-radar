notes:
- Full-day workshop with VLDB bridging data management and generative AI (LLM-powered data systems, semantic operators,
  LLM serving, vector databases, benchmarks)
- First edition in 2025 with VLDB; 2nd edition at VLDB 2026 in Boston
- Regular papers 6 pages and short papers 4 pages excluding references, VLDB workshop template, submitted via OpenReview
- Single-blind review; reviews of accepted papers are public on OpenReview
- 2026 papers appear in the VLDB 2026 Workshop Proceedings on vldb.org
- Not listed in the CORE ICORE2026 portal or the CCF list
