notes:
- Community conference on scientific computing and research software with Python and allied languages, held annually 2009 to 2021 (several editions at IIT Bombay)
- Revived in 2026 as the 14th edition, the first since 2021 and the first in Chennai (IIT Madras)
- Two days, a workshop day of 3 hour hands-on workshops and a conference day of 30 minute talks plus a poster session
- Proposals are abstracts reviewed on a rolling basis by the programme committee; no papers and no proceedings
- Slides are published on the website and conference day talks on YouTube
- Only free and open source software topics; product pitches are not accepted
- Official community partner of the Python Software Foundation
- Not listed in CORE ICORE2026
