notes:
- Despite the name, an international IEEE conference with a call for papers, run by the IEEE Ecuador Section with the Ecuadorian technical chapters
- Held every October in a different Ecuadorian city (Ambato 2023, Cuenca 2024, Quito 2025, Guayaquil 2026); 2026 is the 10th edition
- Broad EE and CS scope (communications, computing, computational intelligence, control, power and energy, robotics, biomedical)
- Papers in English, 4 to 6 pages in IEEE format, double-blind review via EasyChair
- Accepted and presented papers are submitted to IEEE Xplore; no-show papers are not
- Hybrid attendance allowed, with virtual presentations capped at 20% of registrations
- Submission deadlines are usually extended by about a month
- Not listed in the CORE ICORE2026 portal
