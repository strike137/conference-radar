notes:
- Long-running AI and security workshop, co-located with ACM CCS every year since 2008 (2026 is the 19th edition);
  location follows CCS (2025 Taipei, 2026 The Hague)
- Proceedings in the ACM Digital Library; papers up to 10 pages plus 2 pages of references/appendices in ACM format
- Anonymized (double-blind) submissions; research, position, SoK and (new in 2026) benchmark papers
- All accepted papers are presented as posters, with some selected for spotlight talks
- Regarded as the leading workshop at the intersection of ML and security; 18 papers accepted in 2024 (about 25%)
