notes:
- Full-day workshop on integrated communication, localization and sensing (ISAC, RIS, NTN positioning, radar and
  communication coexistence) for 6G
- Organized by Stefania Bartoletti (Rome Tor Vergata), Hui Chen (Chalmers), Harpreet S. Dhillon (Virginia Tech) and
  Yuan Shen (Tsinghua); steering committee includes Henk Wymeersch and Marco Di Renzo
- Held with IEEE ICC every year; editions at ICC 2023 (Rome), ICC 2024 (Denver, 3rd), ICC 2025 (Montreal) and ICC 2026
  (Glasgow, 5th)
- Workshop papers go into the ICC proceedings and IEEE Xplore; no-show papers are removed
- Not listed in ICORE2026 or in the CCF 2026 list
