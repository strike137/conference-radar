notes:
- Main annual venue for biomolecular computing, DNA nanotechnology and molecular programming, held since 1995
- Organized under the auspices of the International Society for Nanoscale Science, Computation and Engineering (ISNSCE)
- Track A full papers (15 pages, LIPIcs style) appear in LIPIcs (open access); Track B one-page abstracts for experimental work and Track C posters are not in the proceedings
- Proceedings in LIPIcs since 2020; earlier volumes in Springer LNCS
- Rotates worldwide (Sendai 2023, Baltimore 2024, Lyon 2025, Fayetteville 2026, Pohang 2027)
- Ranked B in ICORE2026; not on the CCF 2026 list
