links:
  website: https://tqc-conference.org/
notes:
- Leading annual conference on theoretical quantum information science (algorithms, complexity, quantum cryptography, communication, error correction)
- Run by an 8-member international steering committee that picks the venue and rotates it across continents
- Recent hosts are Aveiro 2023, Okinawa 2024, Bengaluru 2025 and Sherbrooke 2026; Grenoble 2027 and Sydney 2028 are announced
- Two talk tracks; only the With Proceedings track is published, in the open-access LIPIcs series (15 pages excluding references)
- The Without Proceedings track accepts already published work, so many talks are not archival papers
- Submission is a 3-page extended abstract plus a full technical manuscript; poster-only submissions also accepted
- Overall acceptance rate about 20 to 25% according to the 2026 call for papers
- At least one author must present on-site
- Not listed in ICORE2026 or the CCF list
