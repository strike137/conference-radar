notes:
- Community conference in Tokyo for users of the Go programming language
- Talks chosen from a call for proposals on Sessionize, plus hands-on workshops
- 2024 and 2025 editions held at Abema Towers, Shibuya; 2026 at Nakano Central Park Conference
- 'Tickets (2026): 5,000 JPY general, 1,500 JPY student (more with the official party); sessions streamed online for free'
- Student support program offered in 2026
- No papers or proceedings; talks only
