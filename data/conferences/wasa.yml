id: wasa
name: WASA
full_name: International Conference on Wireless Artificial Intelligent Computing Systems and Applications (formerly
  Wireless Algorithms, Systems, and Applications)
type: conference
tier: minor
areas: [networking, communications, ai, systems]
region: china
language: english
frequency: annual
organizer: WASA steering committee; local organizers change each year
organizer_country: [china]
proceedings: Springer LNCS
archival: true
indexing: [DBLP]
rank:
  core: Unranked
  ccf: C
fee: 800 USD regular / 550 USD student (2026); a student registration cannot cover a paper
typical:
  deadline_months: [1, 4]
  conference_months: [6]
links:
  website: http://www.wasa-conference.org/
  dblp: https://dblp.org/db/conf/wasa/
  wikicfp: http://www.wikicfp.com/cfp/program?id=3006
notes:
- Renamed in 2024 from Wireless Algorithms, Systems, and Applications to Wireless Artificial Intelligent Computing
  Systems and Applications; acronym kept
- CCF C; proceedings in Springer LNCS; 12-page regular and 10-page short papers; anonymous submission not required
  (single-blind)
- Usually held in June in recent years, mostly in China; 2025 edition was in Tokyo, Japan and 2019 in Honolulu;
  early editions were often in the USA
- First held in Xi'an in 2006; 2026 was the 20th edition, back in Xi'an
- 2022 and 2023 editions were combined (Dalian, April 2023)
