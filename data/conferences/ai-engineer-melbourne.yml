notes:
- Australian edition of the AI Engineer conference series, produced by Web Directions (John Allsopp) in partnership with AI Engineer
- Inaugural edition on 3-4 June 2026 at Federation Square, Melbourne, as part of AI Week Melbourne; it sold out
- Two days on production LLM systems, tooling, evaluation frameworks and safety, with about 600 attendees and 80+ talks in 2026
- 2027 edition returns to Federation Square (ACMI, The Edge and Zinc)
- Sister event AI Engineer Sydney is held in December
- No papers or proceedings
- Not listed in CORE ICORE2026
