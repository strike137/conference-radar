notes:
- Workshop on NLP methods for music and audio (lyrics, music text, audio language models)
- Held with ISMIR in 2020, 2021 and 2024 (San Francisco), and with EACL 2026 (Rabat, with an online option)
- Short papers of up to 4 pages, double-blind review; proceedings in the ACL Anthology
- Papers also submitted elsewhere are allowed if reported, but are not included in the proceedings
- Hosts a shared task (2026)
- Not listed in ICORE2026 and not on the CCF list
