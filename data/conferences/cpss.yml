links:
  website: http://jianying.space/cpss/
notes:
- Workshop co-located with ACM AsiaCCS every year since 2015 (12th edition in 2026)
- Covers ICS/SCADA, smart grid, IoT, automotive and maritime security; position papers and testbed papers welcome
- Double-blind, up to 12 pages in ACM format; acceptance rate between 25% and 45% since 2015 (40% in 2025, 33% in
  2026)
- Used two submission rounds in 2024 and 2025; 2026 had a single round
- Proceedings in ACM DL; best paper award
