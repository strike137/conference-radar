id: esref
name: ESREF
full_name: European Symposium on Reliability of Electron Devices, Failure Physics and Analysis
type: conference
tier: minor
areas: [general]
region: europe
language: english
frequency: annual
organizer: ESREF Steering Committee with a host university or institute each year (TU Wien 2026, IMS University of Bordeaux 2025)
organizer_country: [europe]
proceedings: IEEE Xplore (2026); HAL Open Science (2025); selected extended papers in an Elsevier journal special issue
archival: true
