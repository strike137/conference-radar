  conference_months: [9, 10]
links:
  website: https://www.esref2026.org/
notes:
- European symposium on reliability and failure analysis of electronic devices, run by a European steering committee with a different host each year
- Topics include reliability assessment, failure mechanisms of Si and nanoelectronic devices, failure analysis techniques, microwave, power, photonic and MEMS device reliability
- Submissions are 4-page papers; ESREF 2025 had each paper reviewed by at least five reviewers
- "Proceedings: ESREF 2026 papers are published in IEEE Xplore; ESREF 2025 proceedings were put online on HAL Open Science"
- Selected papers are invited to a journal special issue (Microelectronics Reliability for 2025, Microelectronic Engineering for 2026)
- Every accepted paper needs a full registration and an in-person presentation
- Registration about 850 EUR regular, 550 EUR student (2025, early)
- Held in a European city every autumn (Bordeaux 2025, Vienna 2026); 37th edition in 2026
- Not ranked by CORE (not listed in ICORE2026) or CCF
