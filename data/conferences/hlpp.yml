notes:
- Symposium on high-level parallel and distributed programming models, languages, compilers, runtimes and tools; 19th edition in 2026
- Held in Europe every year (Porto 2022, Cluj-Napoca 2023, Pisa 2024, Innsbruck 2025, Paris 2026)
- Papers up to 20 pages in Springer Nature journal format, at least three single-blind reviews, submission via EasyChair
- Papers presented on-site are proposed for an International Journal of Parallel Programming special issue after a full journal review, so treated as non-archival
- Small two-day event with one keynote; 2026 sponsored by Huawei
- CORE C (ICORE2026); not on the CCF 2026 list
