notes:
- Workshop on safe, dependable and sustainable use of AI in manufacturing, held with the IEEE/IFIP International Conference on Dependable Systems and Networks (DSN)
- First edition at DSN 2025 in Naples, Italy
- Accepted papers published by the IEEE Computer Society in the DSN workshop supplementary volume (IEEE Xplore)
- Regular papers 8 pages and short papers 4 pages including references, IEEE two-column format
- Program chairs Marcello Cinque (University of Naples Federico II) and Michele Zannoni (University of Bologna); partly supported by the Italian MICS partnership (NextGenerationEU)
- Not among the DSN 2026 workshops
- Not listed in the CORE ICORE2026 portal or on the CCF list
