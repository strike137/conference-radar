id: xaie
name: XAIE
full_name: Workshop on Explainable and Ethical AI
type: workshop
tier: minor
areas: [ai, vision]
region: worldwide
language: english
frequency: biennial
organizer: ICPR workshop endorsed by IAPR, run from LaBRI, University of Bordeaux (2026 chairs Romain Giot, Romain
  Bourqui, Jenny Benois-Pineau, Marco Angelini, Sebastian Lapuschkin)
organizer_country: [europe]
proceedings: Springer LNCS (ICPR workshop proceedings)
archival: true
typical:
  deadline_months: [5, 7]
  conference_months: [8, 12]
links:
  website: https://xaie4.sciencesconf.org/
notes:
- One-day workshop co-located with ICPR every two years; 4th edition in 2026 (Lyon), earlier ones in Kolkata 2024
  and Montreal 2022
- Follow-up of the EDL-AI workshop held at ICPR 2020, which the organizers count as the first edition
- Papers published in Springer LNCS in the ICPR workshop proceedings, edited by the ICPR workshop chairs
- Springer LNCS format, 12 to 15 pages including references; 150 EUR per extra page
- Single-blind review with at least 2 reviewers per paper; authors are expected to review one paper
- Not listed in ICORE2026
