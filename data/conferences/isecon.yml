notes:
- Conference for information systems educators, run by the Foundation for Information Technology Education since 1982
- Was held for many years together with CONISAR under the EDSIG of AITP; the two are now independent events
- Papers on IS research, classroom instruction, teaching cases, research in progress and student papers; also workshop and panel proposals
- The call says the proceedings include all accepted papers and abstracts
- Recent editions mostly virtual (2021, 2022, 2024, 2026, 2027); 2023 in Plano, TX; no 2025 edition is listed
- One-day virtual conference in 2027
- Not listed in the CORE portal (ICORE2026)
