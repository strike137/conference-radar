notes:
- Technically co-sponsored by the IEEE Computer Society and its Test Technology Technical Council (TTTC); held annually since 1996 (called ETW until 2003)
- Covers testing of electronic circuits and systems (VLSI test, design for test, reliability)
- Formal proceedings indexed in IEEE Xplore; an informal digest collects other contribution types
- Full papers up to 6 pages, short papers 4 pages presented as posters; single-blind review
- Held in late May in a different European city each year (Tallinn 2025, Chania 2026, London 2027)
- CORE B (ICORE2026); CCF C
