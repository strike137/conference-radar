notes:
- Half-day workshop on computer vision for people with visual impairments, co-located with CVPR
- Held in 2018 and every year since 2020; 2026 was held with CVPR 2026 in Denver
- Built around dataset challenges from real photos taken by blind people (VizWiz datasets), with top teams invited to give short talks
- Also accepts two-page extended abstracts in CVPR format, single-blind review, presented as posters
- Non-archival, the organizers state there are no proceedings; published and under-review work is accepted
- Camera-ready content must be accessible via a screen reader
- Not listed in ICORE2026 or the CCF list
