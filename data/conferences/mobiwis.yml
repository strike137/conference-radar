notes:
- Mobile web, web engineering, service-oriented computing, web of things, data management and security
- Hybrid; held with FiCloud (same venue and dates; co-located with FiCloud and AIBB in 2025), mostly around Europe and the Mediterranean (2022 Rome, 2023 Marrakech, 2024 Vienna, 2025 Istanbul, 2026 Granada, 2027 Prague)
- Proceedings in Springer LNCS (MobiWis 2025 is LNCS 16066); the 2026 site lists LNCS as approval pending
- Full papers 12 to 14 pages, short papers 8 to 10 pages in LNCS format, submission via EasyChair
- Deadlines are usually extended by a few weeks
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
