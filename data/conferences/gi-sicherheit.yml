notes:
- Conference of the German Informatics Society (GI) security division, held since 2003; usually every two years,
  but the 14th edition (2027) follows the 13th (2026) after one year
- Covers IT security, privacy, safety and dependability; aimed at academia, industry and public administration
- Conference language is German; papers can be submitted and published in German or English (2026 preferred German)
- Main track papers up to 10 pages, student track 4 to 6 pages, double-blind review via EasyChair (2027)
- Proceedings in GI Lecture Notes in Informatics (LNI); practitioners track, PhD forum and short talks on papers
  published elsewhere are not included in the proceedings
- Held in Germany (Konstanz 2018, Göttingen 2020, Karlsruhe 2022, Worms 2024, Hamburg 2026), Salzburg, Austria in 2027
- Not ranked in ICORE2026; not on the CCF 2026 list
