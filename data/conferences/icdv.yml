id: icdv
name: ICDV
full_name: International Conference on Integrated Circuits, Design, and Verification
type: conference
tier: minor
areas: [systems, security]
region: southeast-asia
language: english
frequency: annual
organizer: IEEE CASS and SSCS Vietnam Chapter, with a host university each year (LQDTU and VNU-ITI in 2026, VNUHCM
  University of Science and VNU-ITI in 2025)
organizer_country: [vietnam]
proceedings: IEEE Xplore
archival: true
indexing: [Scopus]
fee: 400 USD early (non-IEEE member), 350 USD (IEEE member), 300 USD (IEEE student), 200 USD (Vietnamese universities)
  (2026)
typical:
  deadline_months: [5, 7]
  conference_months: [6, 10]
links:
  website: https://icdv-conf.org/
notes:
- Run by the IEEE CASS and SSCS Vietnam Chapter, technically supported by the IEICE Vietnam Section
- Held in Vietnam every time (Hanoi, Ho Chi Minh City, Da Nang); first held in 2010; the site lists no edition
  between 2017 and 2024; annual since 2024
- Proceedings in IEEE Xplore (2017, 2024, 2025); the site says the series is indexed by Scopus and CPCI
- Topics are digital, analog, mixed-signal and RF IC design, verification and testing, FPGA, embedded systems, AI
  hardware and hardware security
- Submissions of at most 6 pages via EDAS
- 25 peer-reviewed papers in 2025; presenters from Vietnam plus India, China, Japan, Korea and Australia
- The 2026 full paper deadline was extended twice (May 30 -> June 30 -> July 15)
