notes:
- Organized by KIPS (Korea Information Processing Society); spring counterpart of ACK
- Held in May, location rotates (Kyungpook National University, Daegu 2025; Lakai Sandpine, Gangneung 2026); hybrid
  online and offline
- 2-4 page papers (undergraduates and high school students 2-3 pages); oral, video oral or poster
- Award papers are recommended to JIPS (Scopus) and TKIPS (KCI-listed)
- Presenters must be paid KIPS members (undergraduates exempt from dues); deadline usually extended twice by one
  week
