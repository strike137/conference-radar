notes:
- Main venue for combining and integrating formal systems (combined logics, SAT/SMT, decision procedures, term rewriting, ontologies)
- Stand-alone symposium in odd years; in even years it merges into IJCAR together with CADE and TABLEAUX
- Proceedings in Springer LNAI or LNCS (LNAI 15979 in 2025, gold open access; LNCS 14279 in 2023)
- Usually held in Europe (London 2019, Birmingham 2021, Prague 2023, Reykjavik 2025, Marseille 2027)
- Often co-located with TABLEAUX and ITP (2025 joint FroCoS/ITP/TABLEAUX in Reykjavik; 2027 with TABLEAUX)
- Papers up to 15 pages in LNCS style excluding references; abstract registration one week before the paper deadline
- One author must present in person and pay a regular registration fee
- 21 full papers from 32 submissions in 2025
- Not listed in ICORE2026 and not on the CCF list
