notes:
- Combination and integration of formal systems (logics, SAT/SMT, decision procedures, rewriting, ontologies) and their use
  in verification and automated reasoning
- Standalone symposium in odd years; in even years it merges with CADE and TABLEAUX into IJCAR (IJCAR 2026 at FLoC, Lisbon)
- Proceedings in Springer LNAI/LNCS (LNAI 15979 in 2025, Gold Open Access)
- Recent standalone editions co-located with TABLEAUX (Reykjavik 2025 with ITP, Marseille 2027)
- Small venue (2025 -> 21 full papers accepted out of 32 submissions, per the Springer volume); 15 pages LNCS excluding references; one author must attend in person
- Mostly held in Europe (London 2019, Birmingham 2021, Prague 2023, Reykjavik 2025, Marseille 2027)
- Not listed in CORE ICORE2026; not on the CCF 2026 list
