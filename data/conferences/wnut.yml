id: wnut
name: W-NUT
full_name: Workshop on Natural User-generated Text (formerly Workshop on Noisy and User-generated Text)
type: workshop
tier: minor
areas: [nlp]
region: worldwide
language: english
frequency: annual
organizer: Academic organizing committee; co-located with ACL conferences (EMNLP, NAACL, EACL, COLING)
organizer_country: [international]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [2, 7]
  conference_months: [3, 5, 10]
links:
  website: https://noisy-text.github.io/
notes:
- NLP over user-generated text (social media, forums, reviews, learner essays); renamed Natural User-generated
  Text in 2026 with a wider focus on real-world applications of LLMs
- Held since 2015; follows its host conference (EACL 2024 Malta, NAACL 2025 Albuquerque, EMNLP 2026 Budapest); no
  2023 edition
- Long and short papers in the ACL Anthology; direct submission via OpenReview or commitment of ARR-reviewed papers
- Dual submission allowed; hosts the MultiLexNorm lexical normalization shared task
