notes:
- Single-track USENIX practitioner conference on privacy engineering, held at the Hyatt Regency Santa Clara
- Peer-reviewed talk proposals (5-minute lightning talks, 15-minute extended talks, 45-minute panels); no papers
- No formal proceedings; talk abstracts, slides and videos are posted on the USENIX site
- Speakers mostly from industry privacy teams; researchers with applied work are also welcome
