notes:
- Co-located workshop of SBRC, the Brazilian Symposium on Computer Networks and Distributed Systems; created in
  1998, 27th edition in 2026
- Main national forum of the SBC special committee on fault-tolerant systems (CE-TF)
- Papers in Portuguese or English in the SBC template; full papers up to 14 pages and extended abstracts up to 5
  pages; submission through JEMS3
- Accepted papers published open access in SBC OpenLib (SOL), Anais do WTF; at least one author must register for
  SBRC and present orally
- Held with SBRC in a different Brazilian city each year (Praia do Forte, Bahia in 2026)
- Not listed in CORE ICORE2026
