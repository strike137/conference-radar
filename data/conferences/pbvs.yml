notes:
- CVPR workshop on imaging and vision beyond the visible range (infrared, thermal, radar, SAR, LiDAR, hyperspectral, depth)
- Running since 2004 (called OTCBVS until 2011); the 2026 edition was the 22nd
- Hosts several challenges each year (seven in 2026), such as thermal and hyperspectral super-resolution and object tracking
- Papers up to 8 pages plus references in CVPR format, submitted through Microsoft CMT
- Accepted papers go into the CVPR workshop proceedings (25 papers in 2026, 27 in 2025 on CVF Open Access)
- Not listed in ICORE2026 or the CCF list
