notes:
- Sponsored by ACM SIGCOMM; the main venue for Internet measurement, including security and privacy measurement
  studies
- Two deadlines per year since IMC 2025 (November and April/May, AoE) with a one-shot revision across cycles
- Full papers up to 13 pages and short papers up to 6 pages (plus references and appendix); replicability track
- 'Alternates between North America and elsewhere: Madison 2025, Karlsruhe 2026, Atlanta 2027; travel grants and
  a student workshop'
