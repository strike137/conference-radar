notes:
- Run by FCSE (FINKI) at Ss. Cyril and Methodius University in Skopje with the ICT-ACT association; held in North Macedonia since 2000
- From 2026 an IEEE-registered conference with technical co-sponsorship by the IEEE North Macedonia Section
- "2026: 181 submissions, 113 accepted; 37 papers went to IEEE Xplore, the rest to the web proceedings"
- Single-blind review via Microsoft CMT; full papers up to 6 pages, short and student papers up to 4 pages
- Student paper sessions; 44 student papers accepted in 2026
- "Fee: 150 EUR students, 200 EUR regular until 2027-04-12, then 250 EUR (2027)"
- Not listed in the CORE ICORE2026 portal and not on the CCF list
