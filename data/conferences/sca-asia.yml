organizer: SupercomputingAsia, co-organised by HPC centres in Australia, Japan, Singapore and Thailand (NSCC Singapore,
  RIKEN R-CCS, RIST, Pawsey, NCI Australia, ThaiSC)
organizer_country: [singapore, japan, australia, thailand]
proceedings: ACM DL (ICPS)
