links:
  website: https://www.sc-asia.org/
notes:
- Annual HPC event established in 2018 with plenary talks, an industry exhibition, workshops, tutorials, BoFs and a
  peer-reviewed technical paper track
- Mostly held in Singapore (2021, 2022, 2023, 2025); Sydney in 2024 and Osaka in 2026; SCA2027 returns to Singapore
- Technical papers published in the ACM International Conference Proceedings Series (SCA '25 had its own ACM
  volume); ACM open access APC may apply to authors outside ACM Open
- Held jointly with HPC Asia in 2023 (Singapore) and 2026 (Osaka); the SCA2027 CFP says accepted papers go into the
  SCA/HPCAsia 2027 proceedings, so its paper track overlaps with HPC Asia (see the hpcasia entry)
- SCA2027 papers are up to 18 pages in ACM single-column format, double-blind, one-pass review with no rebuttal
- Not listed in ICORE2026; not in the CCF list (the CCF 'SCA' is the Symposium on Computer Animation)
