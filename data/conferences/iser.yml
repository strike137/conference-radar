notes:
- Sponsored by the International Foundation of Robotics Research (IFRR), which also runs ISRR
- Focus on robotics work validated by physical experiments or new experimental paradigms
- Submission is a six-page extended abstract in SPAR format, single-blind review via PaperCept, optional video
- Accepted papers submit a final paper of up to ten pages (two extra pages at 125 USD per page) for the SPAR volume
- 2025 was the 19th edition, at La Fonda on the Plaza, Santa Fe, New Mexico, with single-track sessions and social
  excursions
- Not listed in ICORE2026
