notes:
- Workshop on channel coding for 6G (polar, LDPC, turbo, decoder hardware, coded modulation, HARQ, ML-based coding)
  co-located with IEEE GLOBECOM
- Held at GLOBECOM 2024 (Cape Town), GLOBECOM 2025 (Taipei) and GLOBECOM 2026 (Macau)
- Co-chaired by Wen Tong (Huawei), Erdal Arikan (Bilkent University) and Emanuele Viterbo (Monash University)
- Workshop papers go into the GLOBECOM proceedings and IEEE Xplore; no-show papers are removed
- Not listed in ICORE2026 or in the CCF 2026 list
