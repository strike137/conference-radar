id: ipin
name: IPIN
full_name: International Conference on Indoor Positioning and Indoor Navigation
type: conference
tier: minor
areas: [communications, systems]
region: worldwide
language: english
frequency: annual
organizer: IPIN Steering Committee, hosted by a local university each year (Sapienza University of Rome in 2026)
organizer_country: [international]
proceedings: IEEE Xplore
indexing: [Scopus, DBLP]
rank:
  core: C
acceptance_rate: 55% (2025, 59/107 full papers); 60% (2024, 78/130)
fee: 850 EUR regular, 700 EUR IEEE member, 400 EUR student (2026, early, complete registration)
typical:
  deadline_months: [4, 5]
  conference_months: [9, 10]
links:
  website: https://ipin-conference.org/2026/
notes:
- Run by the IPIN Steering Committee since 2010 (first edition at ETH Zurich); each edition is hosted by a different
  university, rotating mostly within Europe with some editions in Asia
- Regular papers are 6 pages in IEEE format, single-blind review by at least two reviewers, published in IEEE
  Xplore
- Co-located WCAL workshop (Workshop for Computing and Advanced Localization, which replaced the Work-in-Progress
  track in 2025) publishes its papers in CEUR-WS
- Includes the IPIN indoor localization competition, with an on-site track held just before the conference
- In 2025 the six best papers, sponsored by the IEEE Journal of Indoor and Seamless Positioning and Navigation
  (J-ISPIN), had the APC waived for extended versions in that journal
- Paper deadline has been extended by about two to three weeks in recent years (marked hard deadline)
- 2026 edition is co-located with ICL-GNSS in Rome
