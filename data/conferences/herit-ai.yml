notes:
- Workshop co-located with IBERAMIA 2026 (Ibero-American Conference on Artificial Intelligence); first edition in 2026
- Organized by Juan Carlos Nieves and Mariela Morveli Espinoza (Umea University) and Ulises Cortes (UPC)
- Topics are trustworthy AI for cultural heritage, including vision, NLP, knowledge graphs and generative AI for museums and archives
- Papers in English, Spanish or Portuguese (English abstract required), Springer LNCS format; single-blind review
- Full papers up to 15 pages, short papers and blue-sky ideas up to 10, emerging contributions up to 4 (posters)
- Accepted papers go into the workshop online proceedings (no series named); best papers invited to an Ibero-American journal
- Free registration; held at Universidad Nacional de Asuncion, a different venue from the IBERAMIA main conference
