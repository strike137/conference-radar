notes:
- Annual Indian computing education conference run by ACM India and iSIGCSE, the India chapter of ACM SIGCSE
- Ninth edition of the current series in 2026; held at a different Indian institution each year (IIT Ropar 2025, Amrita Vishwa Vidyapeetham Coimbatore 2026)
- 2026 papers published open access in ACM ICPS and the ACM DL at no cost to authors; 2025 papers went to Springer CCIS
- Research papers, experience reports and tools, and short papers; double-blind review via Microsoft CMT
- 2026 limits are 6 pages for full papers and 4 for short papers in the ACM two-column format
- Posters are non-archival; workshops, panels and working groups are also offered
- Not listed in ICORE2026 or the CCF 2026 list; a small national venue
