links:
  website: https://roscon.ros.org/fr/2026/
notes:
- French-language regional ROSCon, the ROS (Robot Operating System) developer conference
- Talks mostly in French; invited speakers sometimes speak in English
- Held in France (Toulouse, Paris, Bordeaux, Nantes, Strasbourg 2025 jointly with ROSCon DE, Paris 2026)
- Talk proposals of 10, 20 or 30 minutes reviewed by a program committee; no papers
- Two days of workshops and a hackathon followed by two conference days
