notes:
- Europe's main information retrieval conference (search, recommendation, RAG, evaluation), run under the BCS
  Information Retrieval Specialist Group; grew out of the BCS-IRSG Colloquium started in 1979
- Proceedings in Springer LNCS (Advances in Information Retrieval); ECIR 2026 filled four LNCS volumes with 209
  papers
- Usually held before or soon after Easter, hosted by a European university; ECIR 2027 is in Southampton, UK
- Full papers up to 12 pages plus references, double-blind; abstract deadline about two weeks before the paper
  deadline; high-quality rejected full papers may be invited as findings papers
- Many tracks with later deadlines (short, reproducibility, IR for Good, resource, demo, doctoral consortium,
  industry day); in-person presentation required
- Organizers state a strong tradition of supporting early-career researchers and welcome student submissions
