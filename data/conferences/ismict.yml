links:
  website: https://ismict2027.org/
notes:
- Small symposium on ICT for healthcare and medicine (body area networks, medical sensing, wireless for health,
  e-health systems)
- Launched in 2006 in Yokohama; the first open call edition was in Oulu in 2007; rotates worldwide
- Full papers 4 to 6 pages, short papers 1 to 3 pages, IEEE template; accepted and presented papers go to IEEE Xplore
- 2026 edition in Osaka was technically co-sponsored by IEEE Kansai Section, IEEE ComSoc Kansai Chapter and IEICE
  Communications Society
- The 2026 edition was held in late September; the 2027 edition returns to the usual spring slot (May, Oulu)
- Not listed in ICORE2026 or the CCF list
