notes:
- Held as part of the Australasian Computer Science Week (ACSW), run by CORE and ACDICT, in late January or February;
  host city rotates, usually within Australia
- Proceedings in the ACM Digital Library (as part of the ACSW proceedings)
- Scope covers system, network, software and ML security, applied cryptography and privacy; research papers 5 to
  10 pages, industry papers 4 to 6, anonymous submission via EasyChair
- 2027 edition has two submission rounds (September and November 2026)
- Ranked Australasian C in ICORE2026; small regional venue
