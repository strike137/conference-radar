notes:
- Main scientific forum of RoboCup, held as a one-day symposium right after the RoboCup world competition
- Robotics and AI research related to all RoboCup leagues (soccer, rescue, @Home, industrial, junior); authors need not take part in the competitions
- Proceedings published after the event in Springer LNAI as "RoboCup 20XX, Robot World Cup" volumes
- Main track up to 12 pages in LNAI format; 2026 added an Open Platforms and Tools track (4-page extended abstract plus tutorial website)
- Rotates worldwide with the competition (Bordeaux 2023, Eindhoven 2024, Salvador 2025, Incheon 2026)
- Competition participants attend free; symposium-only registration was 380 USD faculty and 245 USD students in 2025
- CORE C (ICORE2026, listed as "Robot Soccer World Cup"); not on the CCF list
