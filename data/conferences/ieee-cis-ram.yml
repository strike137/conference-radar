notes:
- Two IEEE conferences always held together (CIS on cybernetics and intelligent systems, RAM on robotics, automation
  and mechatronics)
- Organized by the IEEE Singapore Section and its RAS and SMC chapters with a local host (Jilin University in 2026)
- "Rank: CORE C for the CIS part (IEEE International Conference on Cybernetics and Intelligent Systems, ICORE2026)"
- Proceedings in IEEE Xplore, indexed by EI Compendex and ISI Proceedings per the organizers
- Papers 6 pages A4 plus up to 2 extra pages; submission via PaperPlaza; deadlines were extended in 2026
- Roughly every one to two years, rotating through Singapore, Thailand, Philippines, Cambodia, Malaysia and China
- 2026 edition in Changchun, China with a one-day satellite in Noida, India
