notes:
- One-day workshop held with ACM SIGMETRICS every year since 1999, on the day after the main technical program
- Focus on mathematical, methodological and theoretical aspects of performance analysis, modeling and optimization of
  computer systems and networks
- Accepts 3-page short papers on early research or work in progress, submitted by e-mail and reviewed by the MAMA
  program committee
- Revised short papers appear in a special issue of ACM Performance Evaluation Review (PER) after the workshop
- Authors keep copyright and are free to submit the full work elsewhere, so it works like a talk venue for theory
  results
- Follows the SIGMETRICS host city (Orlando 2023, Venice 2024, Stony Brook 2025, Ann Arbor 2026)
- Not listed in CORE ICORE2026 and not on the CCF 2026 list
