notes:
- Workshop on optical wireless communications (LiFi, VLC, free space optics, optical ISAC, optical RIS, underwater
  OWC) co-located with IEEE GLOBECOM
- Held at GLOBECOM 2024 (Cape Town, as "Energy Efficiency, Resilience, and Pervasive Coverage") and GLOBECOM 2026
  (Macau); not in the GLOBECOM 2025 workshop list
- Workshop papers go into the GLOBECOM proceedings and IEEE Xplore; no-show papers are removed
- 2026 co-chairs from Universidad Carlos III de Madrid, University of Glasgow and University of Cambridge
- 2026 edition also has a track for provocative concept papers
- Not listed in ICORE2026 or in the CCF 2026 list
