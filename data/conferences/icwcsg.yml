full_name: International Conference on Wireless Communications and Smart Grid
type: conference
tier: minor
areas: [communications]
region: china
language: english
frequency: annual
organizer: Conference secretariat on the AEIC (ais.cn) platform, with academic chairs varying by edition (University of Haute-Alsace in 2026)
organizer_country: [china]
proceedings: Varies by year (IOP JPCS 2025, SPIE 2024, IOP JPCS 2022 and 2023, IEEE Xplore 2020 and 2021)
archival: true
indexing: [EI, Scopus]
typical:
  deadline_months: [7]
  conference_months: [6, 7, 8, 9]
links:
  website: https://www.icwcsg.net/
notes:
- Held every year since 2019; 2027 is the 9th edition
- Held in China most years (Hulun Buir 2022, Sipsongpanna 2023, Dali 2024, Zhengzhou 2025, Dalian 2027); Colmar, France in 2026; virtual in 2021
- Publisher changes from year to year (IOP JPCS 2025, SPIE 2024, IOP JPCS 2022 and 2023, IEEE Xplore 2020 and 2021); all stated as indexed in EI Compendex and Scopus
- Covers wireless and optical communications together with smart grid and power system topics
- Smaller commercially organized conference; submission through the ais.cn system
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
