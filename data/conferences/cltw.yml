notes:
- Workshop on NLP and language technology for Irish, Welsh, Scottish Gaelic, Breton, Manx, Cornish and historical Celtic
  languages
- Five editions so far (2014, 2016, 2019, 2022, 2025), roughly every three years, each with a different host conference
- Hosts were COLING 2014 (Dublin), JEP-TALN-RECITAL 2016 (Paris), MT Summit 2019 (Dublin), LREC 2022 (Marseille) and
  COLING 2025 (Abu Dhabi, moved to a virtual event)
- Long (8 pages) and short (4 pages) papers, double-blind review; proceedings in the ACL Anthology (2016 proceedings as a
  JEP-TALN PDF)
- Small workshop; the 2025 edition had 5 papers and 2 keynotes
- Not listed in ICORE2026 and not on the CCF list
