notes:
- Workshop on NLP and language technology for the Celtic languages (Irish, Scottish Gaelic, Welsh, Breton, Manx, Cornish), including historical stages
- Started at COLING 2014 in Dublin; later editions at JEP-TALN-RECITAL 2016 (Paris), MT Summit XVII 2019 (Dublin), LREC 2022 (Marseille) and COLING 2025 (Abu Dhabi)
- The 5th edition (2025) was moved to a virtual-only event on January 20, 2025, co-located with COLING 2025
- Long papers up to 8 pages and short papers up to 4 pages, double-blind peer review
- Proceedings in the ACL Anthology (2025 volume published by the International Committee on Computational Linguistics)
- Irregular schedule, roughly every two to three years, attached to a different host conference each time
- Not ranked in ICORE2026 and not on the CCF list
