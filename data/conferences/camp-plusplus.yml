notes:
- Annual outdoor hacker camp run by Hackerspace Budapest (H.A.C.K.) with volunteer teams and on its own funds; 2026 was the 14th camp
- Held in Hungary, since 2024 at Fenyes Camping in Tata, a site with its own lake
- Talks on security, privacy and hacking plus workshops, selected through a Call for Participation on pretalx
- Talks are in English, up to 45 minutes plus 15 minutes of questions; commercial talks are not accepted
- Ticket price around 130 EUR per person
- No proceedings
