id: mike
name: MIKE
full_name: International Conference on Mining Intelligence and Knowledge Exploration
type: conference
tier: minor
areas: [ai, data, nlp]
region: worldwide
language: english
frequency: irregular
organizer: MIKE Conference Series with a host institute (IIIT Bhubaneswar in 2026, Amrita Vishwa Vidyapeetham Chennai in 2025)
organizer_country: [india]
proceedings: Springer LNAI
indexing: [DBLP, Scopus]
fee: INR 10,000 + GST / USD 440 author early bird, INR 12,000 + GST / USD 510 final (2026)
typical:
  deadline_months: [9, 10]
  conference_months: [12]
links:
  website: https://www.mike.org.in/
notes:
- Conference series on machine learning, data and text mining and knowledge discovery, started in 2013 in India
- 11th edition in 2026; annual until 2019, then 2021, 2023, 2025 and 2026
- Held mostly in India, with editions in Ireland, Mexico, Romania, Tunisia and Norway
- Proceedings in Springer LNAI (earlier volumes up to 2023 on SpringerLink; the 2026 call states LNAI again)
- Double-blind review, papers up to 10 pages in Springer LNCS format, submission via Microsoft CMT
- Two submission phases with separate notifications
- Not listed in ICORE2026
