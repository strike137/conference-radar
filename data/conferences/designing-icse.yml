notes:
- One-day ICSE workshop on software design practice, design reasoning and design with AI
- Held with ICSE since 2024 (Lisbon 2024, Ottawa 2025, Rio de Janeiro 2026, Dublin 2027 as the 4th edition)
- Proceedings published as "Proceedings of the 1st/3rd International Workshop on Designing Software" (ACM, 2024 and 2026) and "2025 IEEE/ACM International Workshop on Designing Software" (IEEE)
- "2027 page limits: technical papers 8 pages, position papers 4 pages, Design and AI Challenge papers 6 pages, including references"
- Single-blind review
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
