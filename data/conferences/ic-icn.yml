organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 545 USD per paper regular, 485 USD early bird before Oct 13, 515 USD student (2026, 4 pages; extra pages 55 USD each)
typical:
  deadline_months: [9]
