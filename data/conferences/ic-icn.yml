links:
  website: http://www.ic-icn.org/
notes:
- Smaller commercially organized Chinese conference; submission and registration through the AiScholar (ais.cn) system
- Not the ACM ICN (Information-Centric Networking); this is the intelligent communication venue at ic-icn.org
- Accepted papers are published by IEEE (2026 ISBN 979-8-3195-2376-1) and submitted to IEEE Xplore, EI Compendex and Scopus
- Each paper reviewed by two or three reviewers, per the site
- Held in China in November (Changzhou 2023, Shenyang 2024, online 2025, Changzhou 2026)
- Presentation-only attendance without publication is also offered
- Not listed in the CORE portal (ICORE2026)
