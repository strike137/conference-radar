notes:
- One of the oldest annual computer graphics conferences (since 1983), run by the Computer Graphics Society (CGS) founded in Geneva
- Two tracks with one EasyChair submission; the earlier Visual Computer track leads to publication in The Visual Computer journal after conditional acceptance and revision
- The later proceedings track is published as a Springer LNCS volume; outstanding papers are invited to The Visual Computer or Computer Animation and Virtual Worlds (Wiley)
- Full papers 8 to 12 pages, double-blind review
- Rotates worldwide (Shanghai 2023, Geneva 2024, Hong Kong 2025, London 2026, Cairns 2027); virtual 2020 to 2022
- 2026 edition was hybrid with online presentation allowed
- Renamed Computer Graphics International & Artificial Intelligence (CGI-AI) for the 2027 edition
- ICORE2026 rank C; CCF C (computer graphics and multimedia)
