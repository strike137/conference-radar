links:
  website: https://hbai2026.github.io/
notes:
- Workshop on NeuroAI (brain computing and brain-inspired computing) held with IJCAI in 2019, 2021, 2022, 2024 and 2026
- Proceedings in Springer CCIS (HBAI 2019 CCIS 1072, 2021 CCIS 1369, 2022 CCIS 1757, 2024 CCIS 2225)
- Double-blind review through OpenReview; at least one author must present in person
- One-day workshop with invited talks, short oral presentations and a poster session
- Not listed in CORE ICORE2026 or the CCF 2026 list
