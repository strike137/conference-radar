notes:
- Workshop on NLP for clinical text (EHR notes, patient encounter transcripts, clinical narratives); running since 2016
- Usually co-located with an ACL-family or LREC conference (ACL 2023 Toronto, NAACL 2024 Mexico City, LREC 2026
  Palma, NAACL 2027 San Francisco); the 2025 edition was held virtually
- Proceedings in the ACL Anthology (42 papers in 2026, 12 in 2025)
- Up to 8 pages plus unlimited references, ACL format, anonymous review; no preprint restrictions (2025)
- Hosts MEDIQA shared tasks (MEDIQA-EVAL and MEDIQA-SYNUR in 2026)
- Not ranked in ICORE2026 and not on the CCF list
