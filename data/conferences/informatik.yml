notes:
- Annual conference of the German Informatics Society (GI), held since 1971; run as the "INFORMATIK FESTIVAL" since 2023
- Mostly German-language; the scientific program is a set of around 40 to 50 workshops, each with its own call for papers
- Workshop papers go through ConfTool and appear open access (CC BY-SA 4.0, with DOI) in the LNI series in the GI Digital Library
- Not every workshop offers publication in the proceedings, and some workshops set their own deadlines
- "Held at a different German host each year (Potsdam 2025, Dresden 2026, Berlin 2027); KI (German AI conference) and #SKILL are partner conferences"
- About 1,000 participants in 2025 according to the 2026 site (the 2025 site reports 700)
- Not listed in CORE ICORE2026
