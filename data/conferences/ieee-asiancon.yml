notes:
- Annual conference hosted by PCCOER (Pimpri Chinchwad Education Trust), Ravet, Pune, India, technically co-sponsored by IEEE Bombay Section
- 2026 was the 6th edition, held in person at PCCOER, Pune; the 2021 edition was the first
- Accepted and presented papers are submitted to IEEE Xplore; the site states that all previous proceedings are in IEEE Xplore and indexed in Scopus
- Broad scope across computing, communication, signal processing, energy and AI; 2026 theme was futuristic technologies in computing and communication
- Submission through Microsoft CMT; author page gives 6 pages as the paper length and charges 100 USD per extra page for papers over 7 pages
- Organizing committee is almost entirely PCCOER faculty; a regional college conference rather than a selective venue
- Not listed in the CORE ICORE2026 portal
