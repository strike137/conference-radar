id: kiis
name: KIIS Conference
full_name: Korean Institute of Intelligent Systems Spring and Fall Conferences
name_local: 한국지능시스템학회 춘계/추계학술대회
type: conference
tier: domestic
areas: [ai, vision, data, security]
region: korea
language: korean
frequency: multiple-per-year
organizer: Korean Institute of Intelligent Systems (KIIS)
organizer_country: [korea]
proceedings: KIIS conference proceedings (web proceedings, Korean)
rank:
  core: Unranked
fee: 170,000 KRW member, 230,000 KRW non-member; graduate/undergraduate students 90,000 KRW member, 120,000 KRW
  non-member (2026 fall, pre-registration)
typical:
  deadline_months: [4, 10, 11]
  conference_months: [4, 5, 11]
links:
  website: https://www.kiis.or.kr/
notes:
- Two domestic conferences a year (spring and fall), hosted by a different university each time
- 'Abstract-first process: short abstract (300 characters), then a 2-page paper (Korean template) after acceptance;
  undergraduate capstone design track'
- Topics include ML, deep learning, generative AI, fuzzy systems, control and robotics, computer vision, and an
  information security and cryptography track
- Society publishes IJFIS (International Journal of Fuzzy Logic and Intelligent Systems); co-organizes the international
  SCIS&ISIS (with Japan SOFT) and ISIS conferences, and KIIS membership gives ISIS fee discounts
- Deadlines are often extended by several weeks (fall 2025 abstract 2025-09-26 -> 2025-11-02; spring 2026 abstract
  2026-04-10 -> 2026-04-27)
