notes:
- Organized by the Research Center for Human Centric Engineering (Humic), Telkom University; technically
  sponsored by the IEEE Indonesia Section
- Proceedings in IEEE Xplore every year since the first edition in 2021
- Held in Indonesia every December (Bandung 2021 and 2022, Bali 2023 and 2024, Yogyakarta 2025, Bali 2026)
- Broad scope covering signal processing, computing, communications, cybernetics and biomedical engineering, and
  software engineering
- 2026 edition is hybrid; not listed in the ICORE2026 CORE portal
