id: iccsit
name: ICCSIT
full_name: International Conference on Computer Science and Information Technology
type: conference
tier: minor
areas: [general, ai, data, vision, networking, security, software]
region: worldwide
language: english
frequency: annual
organizer: ICCSIT conference secretariat (iconf.org submission system), with a host university each year (University of Haute-Alsace in 2023 and 2025, University of Birmingham Dubai in 2024)
proceedings: ACM ICPS (ACM DL)
archival: true
indexing: [EI, Scopus]
typical:
  deadline_months: [8]
  conference_months: [9, 10]
links:
  website: https://www.iccsit.org/
notes:
- Held since 2008; 2026 was the 19th edition, with the co-located workshop ICOAI (International Conference on Artificial Intelligence)
- Proceedings in ACM ICPS (ICCSIT 2026 ISBN 979-8-4007-2514-2); ICCSIT 2025 proceedings archived in the ACM DL and indexed by EI Compendex and Scopus
- Early editions (2008 to 2010) were published by IEEE Press in IEEE Xplore
- Recent editions are hybrid (onsite plus Zoom); virtual 2020 to 2022, Dubai 2024, Paris 2025 and 2026
- Papers can alternatively go to partner journals (JAIT, JOIG, IJCTE)
- Commercial conference secretariat with a contact email on outlook.com; organizer_country left out
- Broad topics from AI, data science and vision to networking, security and software engineering
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
