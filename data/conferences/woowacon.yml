notes:
- Developer conference of Woowa Brothers, the company behind the Baemin food delivery service in Korea
- Talks by Woowa Brothers engineers on the technology behind the service, mostly in Korean
- "2026 theme: 멈추지 않는 도시를 만드는 기술 (technology that builds a city that never stops)"
- 2026 was a one-day event at the Grand InterContinental Seoul Parnas near Samseong Station, Seoul
- Attendance by application and lottery; 2026 applications ran from September 22 to October 13, results on October 16
- No call for papers and no proceedings; talk videos are published after the event
- Not listed in the CORE ICORE2026 portal or the CCF list
