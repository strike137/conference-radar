full_name: Open Source Cryptography Workshop
type: workshop
tier: minor
areas: [crypto, security, software]
region: worldwide
language: english
frequency: annual
organizer: Volunteer practitioners (Google, Mozilla, ISRG); affiliated event of Real World Crypto (RWC)
organizer_country: [usa]
proceedings: None (talks only, no proceedings)
archival: false
typical:
  conference_months: [3]
links:
  website: https://opensourcecryptowork.shop/
notes:
- One-day practitioner workshop on building, maintaining and using open source cryptography libraries and projects
- Affiliated event of Real World Crypto and moves with it (Tokyo 2023, Toronto 2024, Sofia 2025, Taipei 2026, Seattle 2027)
- Call for proposals for 20, 35 or 50 minute in-person talks and hands-on or interactive sessions; no papers or proceedings
- Talks are recorded and released under CC BY-NC-ND 4.0 with speaker consent
- Organized by engineers from Google, Mozilla and the Internet Security Research Group (Let's Encrypt)
- Not listed in the CORE portal (ICORE2026)
