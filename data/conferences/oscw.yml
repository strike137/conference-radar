notes:
- One-day practitioner workshop for people who build and maintain open source cryptography, held next to Real World Crypto
- Sessions of 20, 35 or 50 minutes chosen from a call for proposals; hands-on and interactive demonstrations are encouraged
- Talks only, no papers; sessions are recorded and released under CC BY-NC-ND 4.0 with speaker consent
- Follows RWC around the world (Tokyo 2023, Toronto 2024, Sofia 2025, Taipei 2026, Seattle 2027)
- 2026 was the 4th annual edition, at Academia Sinica in Taipei
- Not listed in ICORE2026
