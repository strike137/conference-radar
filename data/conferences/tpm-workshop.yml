notes:
- Workshop on tractable probabilistic models (probabilistic circuits, tensor networks, normalizing flows, bounded-treewidth models)
- Co-located with UAI (TPM 2025 in Rio de Janeiro, TPM 2026 in Amsterdam); earlier editions at ICML (2018, 2019)
- Papers up to 4 pages in UAI format; recently accepted papers from top ML venues can also be submitted
- Double-blind review on OpenReview; accepted papers and reviews are public there, with no formal proceedings
- One or two best paper awards per edition
