notes:
- Community-run security conference for defenders (SOC, incident response, detection engineering) held in
  Chicago every year since 2021
- Two days of paid trainings followed by two days of talks, villages and a CTF; 56 talks in 2026
- 850+ attendees; up to 32 CPE credits over four days
- Talks selected through an annual call for papers that opens around March; no proceedings
- Run by Blue Team Con, LLC on a not-for-profit basis and publishes a yearly financial disclosure
