notes:
- Organized by the Taiwan Fuzzy Systems Association (TFSA) jointly with a host university that changes each year;
  held in Taiwan almost every year (2024 edition in Kagawa, Japan; 2018 in Daegu, Korea)
- Accepted papers are submitted to IEEE Xplore; selected papers go to special issues of the International Journal
  of Fuzzy Systems
- Topics cover fuzzy theory, computational intelligence, intelligent control, robotics and AI applications; many
  organized sessions run by Taiwanese professors
- 6-page regular papers, plus single-page abstract or presentation-only papers
- Best Student Paper and Best Conference Paper contests; finalists present in front of judges
- The 2026 submission deadline was extended twice (Aug 15 -> Aug 31 -> Sep 6)
- Not listed in ICORE2026
