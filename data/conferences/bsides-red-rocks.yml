notes:
- Security BSides conference in Saint George, Utah, USA, at the Gardner Student Center of Utah Tech University
- Run by a 501(c)(3) non-profit; the planning committee is led by Utah Cybersecurity Society board members, the society behind BSidesSLC, and contact addresses are on bsidesslc.org
- One-day event with talks, workshops and hands-on competitions; friendly to beginners
- Call for Speakers on Sessionize covers talks, trainings, workshops and community areas; in person only, no remote talks
- No travel, lodging or speaking compensation for speakers
- Talks only, no proceedings
