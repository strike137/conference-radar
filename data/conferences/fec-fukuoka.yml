notes:
- Community-run web frontend practitioner conference in Fukuoka; held in 2018 and 2019, then revived in 2026 after
  seven years
- 2026 held at Kyushu Sangyo University; W3C Japan listed as a special supporter
- Open call for proposals through GitHub issues; 4 of 60 proposals accepted in 2026 alongside 13 invited guests
- 45 to 60 minute sessions in three parallel tracks; talks in Japanese or English without interpretation; no lightning
  talks in 2026
- No papers or proceedings; talks only
