id: ai4ts
name: AI4TS
full_name: "Workshop on Artificial Intelligence for Time Series Analysis (AI4TS): Theory, Algorithms, and Applications"
type: workshop
tier: minor
areas: [ai, data]
region: worldwide
language: english
frequency: multiple-per-year
organizer: Workshop organizing committee led by Dongjin Song (University of Connecticut), with organizers from the University of Houston, Singapore Management University, Georgia Tech, A*STAR I2R, UMBC, UIUC, NEC Labs America, Morgan Stanley and Squirrel AI
organizer_country: [usa]
proceedings: Workshop website (accepted papers listed with PDFs, non-archival)
archival: false
links:
  website: https://uconn-dsis.github.io/ai4ts-aaai2027
notes:
- Workshop series on AI for time series analysis held with major AI and data mining conferences since IJCAI 2022
- "Editions so far: IJCAI 2022, IJCAI 2023, ICDM 2023, AAAI 2024, IJCAI 2024, AAAI 2025, WebConf 2025, IJCAI 2025, AAAI 2026, AAAI 2027"
- Often held twice a year (AAAI in winter, IJCAI in summer); no IJCAI 2026 edition
- Non-archival without proceedings; accepted papers are presented as posters and listed on the website, a few selected as contributed talks
- Papers up to 7 pages excluding references in the host conference format; double-blind review on OpenReview for AAAI 2027 (CMT before)
- Papers submitted to or accepted at other venues are welcome if the other venue allows it
- Follows its host conference around the world (Montreal 2025, Singapore 2026, Montreal 2027)
- Not listed in ICORE2026 and not on the CCF list
