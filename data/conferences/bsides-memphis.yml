notes:
- Community-driven Security BSides conference for Memphis and the Mid-South, run by a local volunteer 501(c)(3) nonprofit
- Revival of an earlier BSides Memphis held at Southwest Tennessee Community College in 2013 and 2014
- 2026 edition was a one-day Saturday event at Epicenter Memphis, downtown Memphis, Tennessee, USA
- Keynote plus guest talks, villages (CTF, IoT, lock-picking, soldering, mental health) and an open call for presentations
- Donation-based tickets (suggested 5 USD in 2026)
- Talks only, no proceedings
