notes:
- Founded 1998 in Yokosuka, Japan; supported by NICT and CTIF Global Capsule; rotates worldwide (Tampa 2023, Greater
  Noida 2024, Sofia 2025)
- Technical papers of 5 pages in the 2025 CFP (the 2025 website says 6); selected papers invited to Springer Wireless
  Personal Communications
- Acceptance around 50% in 2025; deadlines extended twice
- Was ranked C only in ERA2010; absent from later CORE lists
