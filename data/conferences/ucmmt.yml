id: ucmmt
name: UCMMT
full_name: United Conference on Millimetre Waves and Terahertz Technologies
type: conference
tier: minor
areas: [communications]
region: worldwide
language: english
frequency: annual
organizer: UCMMT organising committee and international advisory committee, hosted by a university each year (University of Birmingham in 2026)
organizer_country: [europe, china]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [4]
  conference_months: [8]
links:
  website: https://ucmmt2026.bham.ac.uk/
notes:
- Started in 2008 and held annually since, alternating between Europe and China
- 19th edition in 2026 at the University of Birmingham, UK
- Topics cover mm-wave and THz components, antennas, MMICs, sources and detectors, imaging, radar, spectroscopy and
  telecom
- Peer-reviewed 3 to 4 page full papers go to IEEE Xplore; one-page abstracts are accepted but not published in
  IEEE Xplore
- Submission via EasyChair; best student paper awards
- Not listed in ICORE2026
