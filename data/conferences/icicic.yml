notes:
- Run by ICIC International (founded 2004); 20th edition in 2026
- Alternates between Japan and China (Kumamoto 2023, Qinhuangdao 2024, Kitakyushu 2025, Chongqing 2026); earlier also Korea and Taiwan
- Broad scope across computing, information and control (AI, data analytics, systems, control, signal processing)
- Two submission types, full papers (up to 8 pages) and 2-page extended abstracts; many special sessions and co-located workshops
- Accepted papers go into the conference program and proceedings; selected papers are recommended to Scopus, ESCI or Ei indexed journals
- Not listed in CORE ICORE2026
