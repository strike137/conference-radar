notes:
- Organized by IEICE ISEC; held every year since 1984 in various cities across Japan (Nagasaki 2024, Kitakyushu
  2025, Hakodate 2026)
- Security in general with a strong cryptography focus; no peer review (every application is accepted), papers up
  to 8 pages, English or Japanese style files, most talks in Japanese
- Late January, normally 4 days (Jan 23 to 26 in 2024, Jan 28 to 31 in 2025); SCIS 2026 was extended to 5 days (Jan
  26 to 30); presentation application early December, manuscript mid-December
- SCIS 2027 is held at the International Conference Center Hiroshima, Jan 26 to 29, 2027 (4 days); papers are
  submitted under IEICE copyright rules
- On-site only; poster session and night session; SCIS Paper Award for young presenters (mainly within 10 years
  of undergraduate graduation) and Innovation Paper Award
