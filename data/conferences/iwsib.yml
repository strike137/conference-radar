notes:
- One-day ICSE workshop at the intersection of software engineering and business (product management, platforms, ecosystems, startups, open source business, AI-native software business)
- 2027 is the 10th edition; held with ICSE every year since at least 2024
- Organizers from Finland (LUT University), Germany and Italy
- Full papers up to 8 pages, industry experience and position papers up to 4 pages, extended abstracts up to 4 pages (APC free); ACM format, single-blind review, at least three reviews per paper
- 2026 workshop papers published by ACM as part of the ICSE workshop proceedings
- Selected 2027 papers are invited to a special issue of the Automated Software Engineering journal
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
