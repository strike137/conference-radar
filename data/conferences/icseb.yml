id: icseb
name: ICSeB
full_name: International Conference on Software and e-Business
type: conference
tier: minor
areas: [software, data]
region: japan
language: english
frequency: annual
organizer: Shonan Institute of Technology and Kindai University (Japan) with HU University of Applied Sciences Utrecht (Netherlands); conference secretariat (icseb.conference@outlook.com)
organizer_country: [japan, europe]
proceedings: ACM DL (ACM ICPS)
archival: true
indexing: [EI Compendex, Scopus]
fee: Regular author 600 USD early / 650 USD standard, student or committee 550 / 600 USD, abstract only 400 / 450 USD (2026)
typical:
  deadline_months: [11]
  conference_months: [12]
links:
  website: http://www.icseb.org/
notes:
- Smaller commercially run conference; submission via zmeeting.org and an outlook.com secretariat address
- Annual since 2017; 2026 is the 10th edition
- "Hosts so far: Hong Kong 2017, Zhuhai 2018, Tokyo 2019, online 2020 to 2022, Osaka 2023 and 2024, Kyoto 2025, Fujisawa 2026"
- Proceedings in the ACM Digital Library (ACM ICPS) every year, stated as indexed by EI Compendex and Scopus
- Scope covers software engineering, web and mobile development, e-business applications and business analytics
- Papers at least 8 pages; one registration covers up to 10 pages
- Abstract only presentation also offered
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
