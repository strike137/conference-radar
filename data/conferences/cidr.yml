notes:
- Systems-oriented database conference for innovative and risky data management architecture ideas
- Biennial for its first 18 years; annual since 2020, alternating between California (Chaminade, Santa Cruz) and Amsterdam
- Papers up to 6 pages including references (ACM sigconf); single-blind review; demos also accepted
- Each person may author or co-author only one submission; at least one author must attend in person
- Open-access proceedings (CC-BY 4.0) published by the VLDB Endowment on cidrdb.org; camera-ready has no page limit
- "Rank: CORE A (ICORE2026), CCF B"
