id: svc
name: SVC
full_name: International Workshop & Challenge on Subtle Visual Computing
type: workshop
tier: minor
areas: [vision, ai, security]
region: worldwide
language: english
organizer: Workshop organizing committee led by Zitong Yu (Great Bay University) with Adam Czajka, Dan Guo, Sergio Escalera, Philip Torr, Xiaochun Cao and others; co-located with ACM MM or CVPR
organizer_country: [china]
proceedings: CVF Open Access and IEEE Xplore (CVPR 2026 Workshops); ACM DL (ACM MM 2025 workshop proceedings)
archival: true
typical:
  deadline_months: [3, 7]
  conference_months: [6, 10]
links:
  website: https://sites.google.com/view/svc-cvpr26
notes:
  - Workshop and challenge on subtle visual signals (face anti-spoofing, deepfake and manipulation detection, micro-expressions, remote physiological measurement, camouflaged objects, deception detection)
  - 1st edition at ACM MM 2025 in Dublin, 2nd edition at CVPR 2026 in Denver
  - Papers up to 8 pages, double-blind review by at least two reviewers on OpenReview
  - Runs challenges alongside the workshop (Multimodal Deception Detection, Domain Generalized Remote Physiological Measurement in 2026); top-3 challenge teams must submit workshop papers
  - Best paper recommended for extension in Machine Intelligence Research or Journal of Image and Graphics
  - Not listed in ICORE2026 or the CCF list
