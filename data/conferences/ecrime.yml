id: ecrime
name: eCrime
full_name: APWG Symposium on Electronic Crime Research
type: conference
tier: minor
areas: [security]
region: worldwide
language: english
frequency: annual
organizer: APWG (Anti-Phishing Working Group); IEEE Computer Society Technical Community on Security and Privacy
  as technical sponsor
proceedings: IEEE Xplore
rank:
  core: Unranked
fee: 350 USD (2026, general ticket; discounts for students and IEEE members on request)
typical:
  deadline_months: [6, 7]
  conference_months: [9, 11]
links:
  website: https://apwg.org/events/ecrime2026
