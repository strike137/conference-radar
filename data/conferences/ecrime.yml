notes:
- Organized by APWG; 2026 is the 21st edition
- Mixes peer-reviewed papers with industry, law-enforcement and policy sessions; strong focus on phishing, fraud
  and cybercrime measurement
- Papers up to 12 pages in IEEE format; submissions list authors but are otherwise anonymized
- Accepted papers go through shepherding; camera-ready is due after the symposium; limited travel stipends with
  priority for student presenters
- Held in the USA or Europe in recent years (Boston 2024, San Diego 2025, Lisbon 2026)
