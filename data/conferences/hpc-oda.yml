notes:
- Half-day workshop on operational data analytics for HPC systems (logs, scheduler records, telemetry, energy data, digital twins), held with IEEE/ACM SC
- 2026 is the first edition; grew out of eight years of Birds-of-a-Feather sessions at SC and ISC
- Full papers (8 pages) and short papers (4 pages) in the IEEE template, at least three single-blind reviews
- Papers published in the SC26 workshop proceedings in IEEE Xplore; lightning talks only go into a workshop report from the EE HPC WG
- Organizers from LRZ, Boston University, HPE, NERSC/LBNL and ORNL
- Not listed in CORE ICORE2026
