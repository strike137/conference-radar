id: nbis
name: NBiS
full_name: International Conference on Network-Based Information Systems
type: conference
tier: minor
areas: [networking, communications, systems, security]
region: worldwide
language: english
frequency: annual
organizer: Fukuoka Institute of Technology (steering committee chair Leonard Barolli) with a host university each
  year
proceedings: Springer LNDECT (Lecture Notes on Data Engineering and Communications Technologies)
indexing: [Scopus, EI, DBLP]
rank:
  core: Unranked
fee: USD 500 per paper for author registration (2026); student participants USD 400 early
typical:
  deadline_months: [5, 6]
  conference_months: [9]
links:
  website: https://voyager.ce.fit.ac.jp/conf/nbis/2027/
  dblp: https://dblp.org/db/conf/nbis/
notes:
- Part of the Barolli (Fukuoka Institute of Technology) conference family; always co-located with INCoS (shared
  venue, dates and keynotes)
- 'Often held in Asia: Chiang Mai 2023, Asan (Korea) 2024, Taichung 2025, Kwansei Gakuin University (Nishinomiya,
  Japan) 2026; 2027 moves to Timisoara, Romania'
- Not ranked by CORE or CCF; regarded as a lower-tier venue with a short review cycle (notification about 5 days
  after the hard deadline in 2025 and 2026)
- Co-located workshops include TwCSec (Trustworthy Computing and Security) and INWC (Information Networking and
  Wireless Communications); main conference has a Network Security and Privacy track
- 12-page limit; registration through EDAS in USD; selected papers invited to journal special issues
