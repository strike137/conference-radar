id: kse
name: KSE
full_name: International Conference on Knowledge and Systems Engineering
type: conference
tier: minor
areas: [ai, data, nlp, software, security]
region: southeast-asia
language: english
frequency: annual
organizer: 'VNU University of Engineering and Technology (VNU-UET) with a rotating co-organizer (2025: Dalat University;
  2026: JAIST); endorsed by Vietnam''s FISU'
organizer_country: [vietnam]
proceedings: IEEE Xplore
indexing: [Scopus, DBLP]
rank:
  core: Unranked
fee: 54,400 JPY regular non-IEEE early, 46,400 JPY student non-IEEE early (2026, on or before 2026-09-30)
