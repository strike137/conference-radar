notes:
- Mostly held in Vietnam (2022 Nha Trang, 2023 Hanoi, 2025 Da Lat) with occasional editions abroad (2024 Kuala Lumpur,
  2026 Kanazawa)
- KSE 2026 is in Kanazawa, co-organized by JAIST and VNU-UET, with IEEE Nagoya Section technical support
- 6-page IEEE format (up to 2 paid extra pages); at least three reviewers; many special sessions and co-located
  workshops
- Security appears in the main topics (cryptography and cybersecurity) and in 2026 special sessions AI for Security
  and Security for AI (ASSA) and Modern Cryptography and Information Security (MC-IS-SDS); selected papers to Vietnam
  Journal of Computer Science
