links:
  website: https://humeval.github.io/
notes:
- Workshop on human evaluation of NLP systems, covering experimental design, agreement, reproducibility and meta-evaluation
  of metrics
- Held at EACL 2021 (online), ACL 2022 (Dublin), RANLP 2023 (Varna) and LREC-COLING 2024 (Turin)
- Hosts the ReproNLP shared task on reproducing human evaluations
- Long papers up to 8 pages and short papers up to 4 pages; multiple submissions allowed if declared
- Proceedings in the ACL Anthology (26 papers in 2024, 16 in 2023)
- No edition announced after 2024 (as of 2026-10-31)
- Not listed in ICORE2026 and not on the CCF list
