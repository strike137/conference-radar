notes:
- Workshop on HPC performance analysis, debugging, correctness and performance visualization tools, held with SC since 2019
- Merger of two earlier SC workshops, Visual Performance Analytics (VPA) and Extreme-Scale Programming Tools (ESPT)
- 2026 is the 8th edition; supported by the Virtual Institute for High Productivity Supercomputing (VI-HPS)
- Up to 10 pages in the IEEE proceedings template in 2026 (ACM template in 2025), single-blind review, submitted through the SC Linklings site
- Accepted papers appear in the SC workshop proceedings
- Not listed in CORE ICORE2026
