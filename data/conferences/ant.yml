notes:
- Part of the Acadia University (Canada) conference series run by Elhadi Shakshuki, alongside EUSPN, FNC and MobiSPC
- Accepted papers appear in Elsevier Procedia Computer Science (open access), indexed in Scopus, EI and DBLP
- Full papers up to 8 pages including references, Procedia format, submission via EasyChair
- Held with EDI (International Conference on Emerging Data and Industry) each year
- Usually held in Europe (Warsaw, Porto, Leuven, Hasselt, Patras, Istanbul, Delft in 2027)
- Submission deadline is usually extended once or twice before a final deadline
- Unranked in ICORE2026; not on the CCF list
