notes:
- Workshop co-located with IEEE/IFIP CNSM; 2026 is the 6th edition (2nd edition was in 2020, 5th in 2025)
- Topics are data analytics, machine learning and AI for service and application management (observability, root-cause analysis, intent-based and closed-loop management)
- Regular and short papers up to 6 pages in IEEE 2-column format, submitted via EDAS
- Accepted papers go into the conference proceedings and are submitted to IEEE Xplore; in-person presentation expected
- Small one-day workshop (two sessions of three to four papers plus a keynote in 2025 and 2026)
- Not listed in the CORE ICORE2026 portal or the CCF list
