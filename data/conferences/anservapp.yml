notes:
- Co-located with IEEE/IFIP CNSM (Niagara Falls 2023, Prague 2024, Bologna 2025, Alcala de Henares 2026)
- Data analytics, machine learning, LLMs and AIOps for service and application management (observability, anomaly detection, root-cause analysis, intent-based management)
- Regular papers up to 6 pages in IEEE two-column format including references; short and work-in-progress papers also welcome; submission via EDAS
- Accepted papers go into the conference proceedings and are submitted to IEEE Xplore; in-person presentation required
- Half-day to full-day workshop with a keynote; seven papers in the 2026 program
