notes:
- Workshop on automatic text simplification, readability assessment and accessibility of text, including LLM-based simplification and evaluation metrics
- Held at EMNLP 2022 (Abu Dhabi), RANLP 2023 (Varna), EMNLP 2024 (Miami) and EMNLP 2025 (Suzhou)
- In 2026 it ran jointly with READI as READIxTSAR at LREC 2026 in Palma, Mallorca (May 2026), proceedings published by ELRA in the ACL Anthology
- Papers appear in the ACL Anthology (25 papers in 2025)
- READIxTSAR 2026 took papers of 4 to 8 pages in the LREC format, double-blind, via START
- Long, short and demo papers, double-blind review via EasyChair; 2025 also ran a shared task on readability-controlled simplification
- Not ranked in ICORE2026 and not on the CCF list
