notes:
- Flagship conference of the IEEE Internet of Things Technical Community for Latin America and the Caribbean
- 1st edition held 23 to 25 April 2025 in Fortaleza, Brazil; proceedings published by IEEE as "2025 IEEE Latin Conference on IoT (LCIoT 2025)"
- 2nd edition in Santiago, Chile in 2027 with a focus on networking and IoT for human-centered and industrial cyber-physical systems
- Short papers up to 4 pages and full papers up to 6 pages in IEEE format, submitted via EasyChair
- Accepted papers presented in person are submitted to IEEE Xplore; one author registration covers up to 2 papers
- Not listed in ICORE2026 and not on the CCF list
