notes:
- Co-located with the IEEE Symposium on Security and Privacy in San Francisco; started in 2018 as DLS (Deep Learning
  and Security Workshop), renamed DLSP in 2023
- 'Two tracks: archival full papers (6 pages plus references) in the IEEE S&P workshop proceedings, and non-archival
  extended abstracts (3 pages) posted on the website'
- Last held as the 8th edition on 2025-05-15; not on the list of IEEE S&P 2026 co-located workshops, so there was
  no 2026 edition
- 'Short deadline-to-event cycle: submission in February (usually extended by about a week), workshop in May'
