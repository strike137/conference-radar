notes:
- Grassroots Linux and open technologies conference run by Linux Australia since 2023, successor to linux.conf.au
- Covers the Linux kernel and ecosystem, open source software, open hardware, open data, open government and GLAM
- Talks (20 or 45 minutes) and 100 minute tutorials chosen by a Session Selection Committee from a Call for
  Sessions; no papers
- Each accepted proposal gets one complimentary conference ticket
- 2027 has three specialist tracks, including Operations and Security in Practice and Kernel Development
- Moves between Australian cities each year
- 'Past venues: Melbourne 2023, Gladstone 2024, Adelaide 2025, Canberra 2026, Brisbane 2027'
