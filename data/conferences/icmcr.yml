id: icmcr
name: ICMCR
full_name: International Conference on Mechatronics, Control and Robotics
type: conference
tier: minor
areas: [ai, general]
region: asia-pacific
language: english
frequency: annual
organizer: Jeju National University and Sensors and Systems Society of Singapore (co-sponsors), with a conference secretariat
organizer_country: [korea, singapore]
proceedings: IEEE Xplore
archival: true
indexing: [EI Compendex, Scopus]
typical:
  deadline_months: [3]
  conference_months: [2, 3, 8]
links:
  website: https://www.icmcr.org/
notes:
- Smaller commercially run conference; contact via an outlook.com address and submission via zmeeting.org
- Annual since 2023; 2027 is the 5th edition
- "Hosts so far: Jeju 2023, Jeju 2024, Singapore 2025, Tokyo 2026, Jeju 2027 (hybrid)"
- Proceedings of 2023 to 2026 archived in IEEE Xplore, stated as indexed by EI Compendex and Scopus
- 2024 edition was technically co-sponsored by IEEE Robotics and Automation Society
- Each registration covers 5 pages, extra pages 50 USD each; abstract-only presentation also offered (not published)
- Selected extended papers recommended to the International Journal of Mechanical Engineering and Robotics Research
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
