notes:
- Long-running national computer applications conference of the China Computer Federation (CCF), run by its Technical
  Committee on Computer Applications; 2026 is the 41st edition
- Broad scope (AI, data science, networking and security, applications such as education, energy, healthcare, finance)
  plus tutorials, themed forums, an exhibition and competitions
- English papers go into a Springer CCIS proceedings volume titled Computer Applications (NCCA 2023, 2024 and 2025
  volumes exist); Chinese papers are not published in proceedings but
  recommended to journals, which run a second review and make the final decision
- Authors must register and pay before learning the recommended journal, and must present in person; the
  registration fee is not refunded if the journal rejects the paper
- Held in a different Chinese city each year (Suzhou 2023, Harbin 2024, Beijing 2025, Wuhan 2026)
- Not listed in the CORE ICORE2026 portal or the CCF list
