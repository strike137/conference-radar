notes:
- Biennial conference on electrical and power engineering held in even years in October in Iasi, Romania (14th edition in 2026)
- Organized by the Faculty of Electrical Engineering of the Gheorghe Asachi Technical University of Iasi, technically co-sponsored by the IEEE Romania Section
- Two-step review; an extended abstract first (optional in 2026), then a 4 to 6 page full paper in IEEE format for IEEE Xplore
- EPEi 2024 proceedings indexed in the Web of Science Core Collection according to the organizers
- "Acceptance rate: 70% (2024, 136/194)"
- Mainly on-site, with online presentation possible; co-located workshops and the ELSTUDIS student contest
- Not listed in the CORE ICORE2026 portal
