notes:
- Formerly WiSARN (International Workshop on Wireless Sensor, Robot and UAV Networks); renamed NetRobiCS from the 2024 edition
- Held with IEEE INFOCOM; 2025 in London, 19th edition in 2026 in Tokyo on the first INFOCOM day
- Topics are UAV, ground and marine robot networks, swarm communication, 5G/6G and satellite enabled robotics, edge AI for robots
- Six-page IEEE two-column papers, peer reviewed, submitted through EDAS
- Accepted and presented papers go into the IEEE INFOCOM workshop proceedings and IEEE Xplore
- Best paper award sponsored by TII; selected papers invited to a journal special issue
- 2026 edition endorsed by the one6G Association; site run by the University of Bologna
- Not listed in ICORE2026
