full_name: IEEE International Conference on Advanced Networks and Telecommunications Systems
type: conference
tier: minor
areas: [networking, communications]
region: south-asia
language: english
frequency: annual
organizer: IEEE Communications Society (ComSoc)
organizer_country: [india]
proceedings: IEEE Xplore
rank:
  core: Unranked
fee: 330 USD IEEE member, 370 USD non-member (2025, author registration; 290 USD for ComSoc members)
typical:
  deadline_months: [7, 8]
  conference_months: [12]
links:
  website: https://ants2026.ieee-ants.org/
notes:
- Financially and technically supported by IEEE ComSoc; describes itself as a regional conference held in India
  every year (2025 IIIT-Delhi, 2026 IIT Roorkee)
- Short (max 4 pages) and regular (max 6 pages) papers via EDAS; proceedings in IEEE Xplore
- Extended versions of selected papers invited to a Springer Wireless Personal Communications special issue (optical
  papers to Photonic Network Communications)
- Co-located workshops with a later deadline (2026 includes quantum-safe security, trustworthy AI for network security,
  zero trust for 6G/CPS)
- ComSoc student travel grants and conference travel grants available; one author registration covers up to three
  papers
