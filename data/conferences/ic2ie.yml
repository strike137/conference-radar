notes:
- Annual since 2018, hosted by Politeknik Negeri Jakarta in Depok, Indonesia; hybrid format
- Technically sponsored by IEEE Indonesia Section; 2019 to 2025 proceedings in IEEE Xplore, 2018 in IOP Journal of Physics Conference Series
- Broad computer and informatics engineering scope (AI, multimedia, networking, IoT, forensics, signal processing)
- Papers 4 to 6 pages in IEEE format via EasyChair, extra pages charged 50 USD each up to 10 pages
- Deadlines are usually extended by several weeks
- Not listed in the ICORE2026 CORE portal
