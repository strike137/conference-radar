id: qcnc
name: QCNC
full_name: International Conference on Quantum Communications, Networking, and Computing
type: conference
tier: minor
areas: [communications, networking]
region: japan
language: english
frequency: annual
organizer: IEEE / IEEE ComSoc (steering committee from Kanazawa University, Telefonica and InterDigital)
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [10, 11]
  conference_months: [3, 4]
links:
  website: https://www.ieee-qcnc.org/
notes:
- IEEE and IEEE ComSoc branded conference on quantum communications, quantum networking, quantum computing and QKD
- "Proceedings: QCNC Conference Proceedings in IEEE Xplore; up to 8 pages for review, IEEE Computer Society format"
- Selected papers recommended to the journal Digital Communications and Networks for fast-track publication
- All editions so far held in Japan (Kanazawa 2024, Nara 2025, Kobe 2026); executive chair from Kanazawa University
- Paper deadline is usually extended by one month (Oct 30 -> Nov 30); co-located workshops and a poster track
- Not listed in CORE ICORE2026 or the CCF list
