notes:
- Standalone workshop series on smart antennas, MIMO and multi-antenna wireless systems, running since 1996
- 29th edition (WSA 2026) hosted by CTTC in Barcelona; 28th edition (WSA 2025) in Erlangen, Germany
- Technically co-sponsored by IEEE ComSoc
- Full papers up to 6 pages (7 in the camera-ready) in IEEE format via EDAS, peer reviewed
- Accepted and presented papers go to IEEE Xplore; papers not presented in person may be excluded
- Oral and poster presentations; each paper needs its own full registration
- 2026 tracks include MIMO, AI for smart antennas, ISAC, multi-antenna non-terrestrial networks and THz
- Not listed in ICORE2026
