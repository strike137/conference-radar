notes:
- Annual conference on applied electronic circuits and systems, organized since 1996 by the Faculty of Electrical Engineering, University of West Bohemia in Pilsen, Czech Republic
- Held in Pilsen; AE2026 took place at the Techmania Science Center
- Topics include analogue and digital electronics, automotive and biomedical electronics, EMC, embedded systems and signal processing
- Two-stage submission since 2026 -> 2-page abstract first, then a 4 to 6 page full paper in IEEE format after abstract acceptance
- Accepted and presented papers are submitted to IEEE Xplore (IEEE Conference Record 70687); the organizers expect Web of Science and Scopus indexing
- Double-blind review
- Up to two papers per author (extra fee for the second); online presentation for an additional fee
- Not listed in the CORE ICORE2026 portal
