notes:
- Regional IEEE PES conference and exposition on power generation, transmission and distribution
- Power and energy focus; topics include renewable integration, microgrids, energy storage, grid digitalization and cybersecurity for power systems
- Full papers up to 5 pages in English, IEEE double-column format, via EasyChair; accepted papers go to IEEE Xplore
- In-person presentation required
- Includes a commercial exhibition, workshops and technical visits
- Not listed in the CORE ICORE2026 portal
