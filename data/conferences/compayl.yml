notes:
- MICCAI workshop on computational pathology combined with other modalities (language, omics, radiology, spatial transcriptomics)
- Successor of the COMPAY workshops (2018, 2019, 2021), renamed COMPAYL in 2024; held every year since 2024
- 2026 run as COMPAYL++, a one-day event with a challenge (ASDP) and a tutorial (ESDIP) alongside the workshop
- Proceedings in PMLR for 2024 (volume 254) and 2025 (volume 316); 2026 papers go to the MICCAI satellite events Springer LNCS volume
- Papers up to 8 pages plus 2 pages of references, MICCAI format, submission via OpenReview
- Organizers from Radboudumc, TUM, HKUST, A*STAR, NKI and Western University
- Not listed in CORE ICORE2026 or the CCF 2026 list
