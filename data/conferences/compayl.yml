notes:
- MICCAI satellite workshop on computational pathology combined with other modalities (language, omics, radiology,
  spatial transcriptomics)
- Continues the COMPAY workshops (Granada 2018, Shenzhen 2019, online 2021); renamed COMPAYL in 2024
- Location follows MICCAI (Marrakesh 2024, Daejeon 2025, Strasbourg 2026)
- In 2026 run as COMPAYL++, a one-day event with an ASDP challenge and an ESDIP tutorial
- Accepted papers appear in the collective MICCAI Satellite Events Springer LNCS proceedings, with an open-access
  version on the MICCAI Society website
- Up to 8 pages plus 2 pages of references in MICCAI format, peer reviewed via OpenReview
- Not listed in CORE ICORE2026 or the CCF 2026 list
