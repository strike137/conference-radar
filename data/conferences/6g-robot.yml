notes:
- WS-30 at IEEE GLOBECOM 2026 in Macau
- Topics include URLLC for robotic control, edge intelligence for perception and control, federated learning for
  networked robots, ISAC for robots, drone swarms and human-robot interaction over wireless
- Co-chairs from Birmingham City University, University of Macau, Lancaster University, University of Houston,
  Khalifa University, China Telecom and Nokia, among others
- Accepted and presented papers go into the GLOBECOM workshop proceedings in IEEE Xplore; no-show papers are removed
- Submissions via EDAS through the GLOBECOM workshop call
- Not listed in ICORE2026
