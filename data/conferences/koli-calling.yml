notes:
- Computing education research conference held every year since 2001 at the Hotel Koli in Koli National Park, about 60 km north of Joensuu, Finland
- Single-track, moderate size, known for its intimate atmosphere and lively discussions
- Proceedings in the ACM International Conference Proceedings Series (ACM DL), open access under ACM Open; authors at non-ACM Open institutions may pay an APC
- Full papers (research or system and tool papers) up to 10 pages, discussion papers up to 6 pages, posters and demos up to 2 pages; at least three reviews with conditional acceptance and shepherding
- Metadata deadline one week before the full paper deadline; all accepted papers must be presented in person
- Doctoral consortium and a pre-conference workshop in Joensuu before the main conference
- "Registration fee: 320 EUR early bird, 350 EUR regular (2026), plus a separate hotel and full-board package"
- Not ranked in ICORE2026 and not on the CCF list
