notes:
- Generative models and AI agents for proteins, RNA, cells, drug discovery and lab-in-the-loop biology
- Held at NeurIPS 2023 (1st), ICML 2025 (2nd, Generative AI and Biology) and ICML 2026 (Seoul, renamed Generative and Agentic AI for Biology)
- Short papers up to 4 pages or long papers up to 9 pages; double-blind review on OpenReview
- Non-archival; ongoing work welcome; best paper awards sponsored by NVIDIA in 2026
- Different workshop from GEM (Generative and Experimental Perspectives for Biomolecular Design) at ICLR
- Not listed in ICORE2026 and not on the CCF list
