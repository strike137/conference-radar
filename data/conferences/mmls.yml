links:
  website: https://midwest-ml.org/
notes:
- Two-day regional machine learning symposium for researchers in the US Midwest, built around plenary and invited
  talks, lightning talks and poster sessions
- Hosts so far 2017 and 2018 UChicago, 2019 UW Madison, 2023 UIC Chicago, 2024 Minneapolis, 2025 UChicago, 2026
  Purdue (West Lafayette); skipped 2020 to 2022 because the organizers wanted it in person
- Poster-only call; posters can feature published or unpublished work and no proceedings are mentioned, so it is
  non-archival
- A few poster submitters are invited to give 5-minute lightning talks; student first authors are eligible for poster
  awards, and students and postdocs for travel awards
- About 300 attendees at the 2017 and 2018 editions
- Not listed in the CORE ICORE2026 portal and not on the CCF list
