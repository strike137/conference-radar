organizer: Workshop organizing committee (2026 organizers from Universidad Carlos III de Madrid, Stanford, Duke, Fraunhofer HHI,
  University of Calgary, Boston University, UIUC, MPI for Informatics, UT Austin and DTU); co-located with CVPR
organizer_country: [europe, usa, canada]
proceedings: CVPR Workshops proceedings (CVF Open Access) for the proceedings track
archival: true
typical:
  deadline_months: [2, 3]
