links:
  website: https://xai4cv.github.io/
notes:
- CVPR workshop on explainability and interpretability of computer vision models, accepting papers and demos
- Held with CVPR every year since 2022; the 2026 edition was the 5th
- Proceedings track takes up to 8 pages and is published in the CVPR workshop proceedings
- Non-proceedings track takes up to 4-page extended abstracts, including already published work, and is not published
- 14 papers in the CVPR 2026 workshop proceedings on CVF Open Access, 12 in 2025
- Submissions anonymized in the CVPR format through Microsoft CMT; deadlines are AoE
- Not listed in ICORE2026 or the CCF list
