notes:
- Half-day CVPR workshop on explainable and interpretable computer vision; the 2026 edition was the 5th
- Two tracks; proceedings track (max 8 pages) goes into the CVPR workshop proceedings, non-proceedings track (max 4 pages) does not
- Accepts papers and demos; anonymized CVPR format, submitted through Microsoft CMT
- 14 proceedings track papers in 2026 and 12 in 2025 on CVF Open Access
- All accepted papers are presented as in-person posters; some are picked as spotlights
- Not listed in ICORE2026 or the CCF list
