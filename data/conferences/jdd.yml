notes:
- Java and JVM developer conference widening to software engineering in general (architecture, cloud, AI-assisted engineering, security)
- Organized by PROIDEA, a Polish producer of IT events
- Held in October in Kraków, Poland; 2025 and 2026 at Hotel Metropolo
- Two days with six parallel tracks plus workshops; program committee reviews talks
- Talks in Polish and English, each marked [PL] or [EN] in the agenda
- 2025 was the 19th edition
- Practitioner talks only; no papers or proceedings
