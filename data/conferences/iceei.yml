  conference_months: [10, 11]
links:
  website: https://ftsm.ukm.my/iceei2025/
notes:
- Joint ITB (STEI) and UKM (FTSM) conference; held every two years, alternating between Indonesia and Malaysia (Bandung 2023, Kuching 2025)
- 10th edition in 2025; accepted and presented papers are submitted to IEEE Xplore, and the 2023 and 2025 proceedings are in IEEE Xplore
- Based on review scores, 50 extended papers are selected for Scopus-indexed journals (APJITM, IJEEI, BDCV and UKM Journal of Engineering)
- Tracks on software engineering, cybersecurity, AI and electrical engineering; hybrid presentation allowed
- Not the same venue as ICELTICs (International Conference on Electrical Engineering and Informatics, Banda Aceh)
- Not listed in ICORE2026 and not in the CCF list; a small regional venue
