region: southeast-asia
language: english
frequency: biennial
organizer: School of Electrical Engineering and Informatics, Institut Teknologi Bandung (ITB) and Faculty of Information Science and Technology, Universiti Kebangsaan Malaysia (UKM)
organizer_country: [indonesia, malaysia]
proceedings: IEEE Xplore
archival: true
fee: RM 2,200 international non-IEEE presenter, RM 1,900 international IEEE member presenter, RM 1,600 local non-IEEE presenter (2025)
