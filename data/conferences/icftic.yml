links:
  website: http://www.icftic.org/
notes:
- Annual since 2019 (Dalian 2019, Shenyang 2020); hosted by China University of Petroleum (East China) in Qingdao since 2021 (2021 virtual)
- Broad scope covering AI, systems, networks, communications, information security and cryptography
- Accepted papers are published by IEEE (ISBN listed on the site) and submitted to EI Compendex and Scopus; 2019 and 2020 papers were merged into other conferences in Journal of Physics Conference Series
- Each paper is reviewed by two or three committee members
- Supported by IEEE SMC and the CCF Qingdao branch; commercial conference service AEIC handles submissions and registration
- Not listed in CORE ICORE2026 or the CCF list
