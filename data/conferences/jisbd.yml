notes:
- Spanish and Ibero-American forum for software engineering and databases, held within the joint SISTEDES Jornadas (with JCIS and PROLE)
- 30th edition in 2026 at the Universidad de Alicante
- Papers in Spanish, Portuguese or English
- Tracks include AI for software engineering, software architecture, data engineering and data science, model-driven engineering, digital twins, testing and quality, research methods and quantum software engineering
- Full papers up to 14 pages, short papers and tool demos 2 to 4 pages, plus R&D project and industry contributions; each track has its own programme committee
- Already published high-quality work can be presented as a relevant paper (only a short note goes into the proceedings)
- Proceedings published digitally in the SISTEDES Digital Library
- Not listed in CORE ICORE2026 or in the CCF 2026 list
