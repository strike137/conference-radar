notes:
- Half-day workshop on industrial private 5G and beyond-5G networks (private network architectures, URLLC, TSN,
  AI-based resource management, NTN, security)
- Led by Kyeong Jin Kim (Samsung Research America); co-chairs include Petar Popovski (Aalborg)
- Held with IEEE ICC every year; 2nd edition at ICC 2023 (Rome), 3rd at ICC 2024 (Denver), 4th at ICC 2025 (Montreal),
  5th at ICC 2026 (Glasgow)
- Earlier editions were titled Workshop on Industrial Private 5G-and-beyond Wireless Networks
- Workshop papers (6 pages) go into the ICC proceedings and IEEE Xplore; no-show papers are removed
- Not listed in ICORE2026 or in the CCF 2026 list
