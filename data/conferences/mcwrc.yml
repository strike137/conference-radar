notes:
- Workshop co-located with IEEE VTC; 6th edition at VTC2026-Fall (Boston) as International Workshop on Mission Critical Communications, 7th at VTC2027-Spring (Hamburg) under the new name adding Wireless Real-Time Communications
- 2026 co-organizers from DLR, Nokia and Hanyang University; 2027 organizers from HS Osnabrueck, University of Wuerzburg and TU Chemnitz
- Topics include mission critical and public safety communications, wireless TSN, positioning and navigation in GPS-denied areas, LEO and HAP links, railway and traffic control, and security
- Papers 5 pages (up to 2 extra pages at 100 USD each); accepted VTC papers go to IEEE Xplore and may be removed if not presented
- IEEE VTS presents a Best Workshop Paper Award among accepted papers
- Acronym MCWRC is used here for the 2027 name; the workshop pages give no acronym
- Not listed in ICORE2026
