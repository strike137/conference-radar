notes:
- Workshop bridging reinforcement learning theory and practice, with a research paper track and an idea track for open problems
- Two editions so far, at ICML 2024 (Vienna) and NeurIPS 2025 (San Diego)
- No proceedings; parallel submissions and already published papers are allowed
- Papers up to 9 pages in adapted NeurIPS style; double-blind review on OpenReview
- Not listed in ICORE2026 and not on the CCF list
