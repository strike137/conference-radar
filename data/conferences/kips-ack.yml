notes:
- Organized by KIPS (Korea Information Processing Society); fall conference held in early November at a Seoul university
  (Dongguk 2025, Sejong 2026)
- 2-4 page papers (undergraduates 2-3 pages); in-person oral, recorded video oral, or in-person poster
- Award papers are recommended to JIPS (Scopus) and TKIPS (KCI-listed)
- Presenters must be paid KIPS members (undergraduates exempt from dues); hybrid online and offline
- Undergraduate paper competition and capstone results accepted; deadline usually extended twice to a final date
  of Sep 30
