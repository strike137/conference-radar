notes:
- Co-sponsored by IEEE and the Sichuan Institute of Electronics; held in Chengdu every year since 2015 (October
  in 2015 and 2016, December since 2017)
- Not to be confused with IEEE/CIC ICCC (International Conference on Communications in China)
- Proceedings in IEEE Xplore, indexed in Ei Compendex and Scopus; 5-page papers, extra pages 80 USD each
- Large and broad conference (nearly 480 attendees in 2025) with hybrid format and many online sessions
- Not ranked by CORE or CCF; the 2025 submission deadline was extended from October 20 to November 10
