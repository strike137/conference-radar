id: icmla
name: ICMLA
full_name: IEEE International Conference on Machine Learning and Applications
type: conference
tier: minor
areas: [ai]
region: north-america
language: english
frequency: annual
organizer: AMLA (Association for Machine Learning and Applications), technically co-sponsored by IEEE
organizer_country: [usa]
proceedings: IEEE Xplore
indexing: [IEEE Xplore, DBLP]
rank:
  core: C
fee: 650 USD regular, 575 USD IEEE SMC member or full-time student (2026, before 2026-07-25; +100 USD late)
typical:
  deadline_months: [5, 7]
  conference_months: [10, 12]
links:
  website: https://www.icmla-conference.org/icmla26/
  wikicfp: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=192856&copyownerid=837
notes:
- Organized annually by AMLA with host universities (official list of past editions starts at 2003); technically
  co-sponsored by IEEE
- Held in the USA, often Florida (Boca Raton 2025); 2026 edition at Oakland University, Rochester, Michigan
- Double-blind review; 6-page regular papers (+2 paid pages at 50 USD), 4-page short papers presented as posters
- Fully in person, no virtual track; many special sessions and workshops with later deadlines
- Application-oriented ML venue; CORE C, not in the CCF list
