notes:
- Community-organized Security BSides conference in Orlando, Florida, USA, launched in 2013 with 200 attendees
- Held at Full Sail University since 2018; virtual in 2020 and 2021; passed 1,000 tickets sold in 2025
- Pre-conference workshop day on Friday plus conference day on Saturday in late September, with villages and an unconference
- Call for Sessions on Sessionize for 25 and 45 minute talks and 3 to 4 hour workshops; anonymous review of talks
- Encourages new and first-time speakers; no vendor pitches
- Talks only, no proceedings
