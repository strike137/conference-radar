notes:
- Organized by the IEEE Madhya Pradesh Section with ABV-IIITM Gwalior, India
- Editions in 2022, 2024, 2025 and 2026 at ABV-IIITM Gwalior (2026 hybrid); the 2027 edition moves to Kathmandu, Nepal, with the IEEE Nepal Section as local co-organizer
- All papers of the 2022, 2024, 2025 and 2026 editions are in IEEE Xplore; the site states Scopus indexing
- Interdisciplinary tracks on healthcare, power and energy, AI and IoT, VLSI and communication, and IT-enabled management
- Very large submission volume (4,700+ in 2026, with a stated acceptance rate below 10%)
- 6 pages max in IEEE double-column format; submission via Microsoft CMT
- Not listed in ICORE2026 or the CCF 2026 list
acceptance_rate: "Below 10% (2026, 4,700+ submissions, as stated by the organizers)"
