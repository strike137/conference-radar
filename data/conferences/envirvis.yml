links:
  website: https://www.informatik.uni-leipzig.de/bsv/envirvis/envirvis-2026/index.html
notes:
- Half-day workshop on visualization of geoscientific, environmental, atmospheric and climate data
- Co-located with EuroVis (Leipzig 2023, Odense 2024, Luxembourg City 2025, Nottingham 2026); held since 2013
- Steering committee chaired by Gerik Scheuermann (Leipzig University); site hosted by Leipzig University
- Regular papers of 4 to 8 pages including references; since 2026 also two-page Exchange Topics for discussion slots
- Submission through PCS; papers published in the Eurographics Digital Library
- Small program (eight papers in 2026)
- Not listed in ICORE2026 or the CCF list
