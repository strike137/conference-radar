notes:
- Small invitation-only workshop run by ACSA (Applied Computer Security Associates), held since 1992, for ideas that
  challenge mainstream security thinking
- Standalone event, not co-located; recent editions alternate between North America and Europe (2022 New Hampshire, 2023 Segovia,
  2024 Pennsylvania, 2025 Aerzen, 2026 Sooke near Victoria BC)
- Only 10 to 12 papers per year; each gets about one hour of plenary presentation and discussion
- Participation limited to authors of accepted papers and organizers; at least one author must attend in person, with
  a strict no-device social contract
- Double-blind review, then pre-workshop shepherding; final papers revised after the workshop and published in ACM
  ICPS (open access, APC may apply)
- Regular, theme and implementation submissions; 6 to 15 pages in ACM sigconf format, plus a separate cover page and a
  justification statement
