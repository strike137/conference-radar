notes:
- Main international forum for all aspects of automated deduction; first held in the 1970s and run by CADE Inc.
- Held on its own in odd years; in even years it merges into IJCAR (with FroCoS, TABLEAUX and ITP)
- Proceedings in Springer LNCS/LNAI up to 2025 (LNCS 14132 in 2023, LNCS 15943 in 2025); CADE-31 (2027) moves to
  LIPIcs, open access
- Regular papers up to 16 pages and short papers (system descriptions, case studies) up to 10 pages, LIPIcs style (2027)
- Rebuttal period during review; Herbrand Award and best (student) paper awards presented at the conference
- Recent editions in Gothenburg 2017, Natal 2019, online 2021, Rome 2023 and Stuttgart 2025; 2027 in Nijmegen
  co-located with FSCD
- "Acceptance: 33 of 74 submissions in 2023 and 37 of 87 in 2025"
- CORE A (ICORE2026); CCF B (theory)
