notes:
- Student conference of the German Informatics Society (GI), held as part of the GI annual conference INFORMATIK each September
- Open to students of computer science and related fields from all areas of informatics; papers in German or English
- Papers may be based on seminar papers, internship reports, theses or extracurricular work; doctoral candidates and papers co-authored by professors are not accepted
- Short papers of 4 to 6 pages or full papers of 10 to 12 pages in the GI LNI format, peer reviewed by the program committee
- Proceedings appear as a volume of the GI LNI series in the GI Digital Library; prizes for outstanding papers
- "2026 figures: 50 submissions, 22 accepted (44%), authors from 19 universities"
- Host city follows INFORMATIK (Hamburg 2022, Berlin 2023, Wiesbaden 2024, Potsdam 2025, Dresden 2026)
- Not listed in the CORE portal (ICORE2026)
