notes:
- Hosted by Green University of Bangladesh at its permanent campus in Purbachal American City, Dhaka; annual since 2019,
  every edition in the Dhaka area (IEEE lists 2024 as Narayanganj), December in 2025 and 2026
- Called the International Conference on Sustainable Technologies for Industry 4.0 in its early editions; now Industry 5.0
- Accepted and presented papers (except the textile engineering track) are submitted to IEEE Xplore; every edition
  from 2019 to 2025 is on IEEE Xplore
- Textile engineering papers only go into the conference's own proceedings
- "Four tracks: intelligent computing, networking and security; energy, robotics, electronics, sensors and
  communications; Industry 5.0 design and applications; textile engineering"
- Double-blind review via EasyChair; the full paper deadline is usually extended by about one month
- Accepted 118 of 434 submissions in 2025 and 102 of 352 in 2024 (figures from the official site)
- Not found in ICORE2026
