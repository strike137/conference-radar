notes:
- Workshop of IEEE COMPSAC on AI for digital forensics, threat detection and cybersecurity; follows COMPSAC around
  the world (Madrid 2026, Tokyo 2027)
- 1st edition under this name in 2026; renamed from the COMPSAC workshop Data Science & Machine Learning for
  Cybersecurity, IoT & Digital Forensics (DSML), run by the same organizers in the previous three years
- Not the same as DSML, the Workshop on Dependable and Secure Machine Learning at IEEE/IFIP DSN
- Workshop papers up to 6 pages (2 extra pages at 125 USD each), submitted via EasyChair; published in the COMPSAC
  proceedings on IEEE Xplore
- Shares the common COMPSAC workshop deadlines (April 15, extended to April 20 in 2025 and April 30 in 2026)
- 2026 program had two sessions (one in person on July 10, one online)
- Not listed in ICORE2026
