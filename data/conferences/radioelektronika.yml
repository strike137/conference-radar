notes:
- Long-running Czech and Slovak conference on electronics, signal processing, communications, antennas and microwave engineering (36th edition in 2026)
- Host university rotates (University of Zilina 2024, Brno University of Technology with the Radioengineering Society 2025, VSB Technical University of Ostrava 2026)
- Held in the Czech Republic or Slovakia (Zilina 2024, Hnanice 2025, Hradec nad Moravici 2026)
- Proceedings in IEEE Xplore since 2007, also covered by Scopus and Web of Science
- Selected papers may be invited to the Radioengineering journal
- Timing varies by host (April 2024, May 2025, September 2026, April 2027)
- Submission via EDAS
