id: dpsws
name: DPSWS
full_name: Multimedia Communication and Distributed Processing Workshop
name_local: マルチメディア通信と分散処理ワークショップ
type: conference
tier: domestic
areas: [networking, communications, systems]
region: japan
language: japanese
frequency: annual
organizer: IPSJ SIG DPS (Multimedia Communication and Distributed Processing)
organizer_country: [japan]
proceedings: IPSJ Digital Library (workshop preliminary proceedings); best papers recommended to IPSJ Journal as
  SIG-recommended papers
archival: false
rank:
  core: Unranked
fee: 66,000 JPY (DPS SIG registered member), 71,500 JPY (IPSJ member), 50,600 JPY (IPSJ student member), 57,200
  JPY (student non-member), 77,000 JPY (non-member) (2026, includes lodging)
typical:
  deadline_months: [7, 8]
  conference_months: [10, 11]
links:
  website: https://www.dpsws.org/2026/
notes:
- Residential (gasshuku-style) workshop of IPSJ SIG DPS held since 1993 at a different location each year, often
  a hot-spring resort (Kochi 2025, Hakodate 2026); 2026 is the 34th edition
- General papers of about 6-8 pages are reviewed and may be accepted as talks, short presentations or posters; separate
  demo/poster track (1-8 pages)
- English papers welcome; best papers get awards and may be recommended to the IPSJ Journal
- Registration fee includes accommodation; deadlines are usually extended by about one week
