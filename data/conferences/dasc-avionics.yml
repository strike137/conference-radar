notes:
- R&D conference on digital avionics (avionics architectures, air traffic management, autonomy, UAS, aviation
  cybersecurity and communications); founded by AIAA in 1975, annual since 1990
- Owned by the AIAA Digital Avionics Technical Committee; IEEE AESS oversees it with the DATC, AIAA co-sponsors
- Two-stage double-blind review -> 750-word abstract decides talk or poster, then a 5 to 10 page full paper decides
  publication
- Papers in IEEE Xplore since 1990; papers not presented on site by an author are excluded
- Usually held in the USA in September or October, sometimes in Europe (Barcelona 2023, Belfast 2027)
- Not to be confused with IEEE DASC (Dependable, Autonomic and Secure Computing)
- Not listed in CORE ICORE2026 (only the other DASC is) or in the CCF 2026 list
