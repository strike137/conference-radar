notes:
- Long-running workshop on agent-based simulation of social and socio-technical systems, bridging multi-agent systems
  and the social sciences; series started in 1998 and annual since 2002
- Held as a one-day workshop at AAMAS, so it follows AAMAS around the world (Detroit 2025, Paphos 2026)
- Revised papers appear afterwards in Springer LNAI as Multi-Agent-Based Simulation volumes
- Submissions through OpenReview; less finished work with open questions is explicitly welcome
- CORE C (ICORE2026); not on the CCF list
