notes:
- Organized by the Air Defense College of the Egyptian Military Academy; held at the Egyptian Military Academy in the New Capital, Cairo
- Series started in 2021; 6th edition in 2026, 7th edition (ITC-Egypt 2027) announced for July 26 to 29, 2027
- Six technical tracks (antennas and RF, radar and space systems, IoT, AI for communications, green communications, advanced communication topics) plus tutorials, panels and a student project competition
- Papers 3 to 6 pages in IEEE format submitted via EDAS; registered and presented papers are sent for inclusion in IEEE Xplore
- Technical support from IEEE MTT-S, IEEE AP-S, IEEE Egypt Section and ComSoc Egypt Chapter (marked pending for 2027)
- Not listed in ICORE2026
