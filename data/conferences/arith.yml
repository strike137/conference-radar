notes:
- Sponsored by the IEEE Computer Society; long-running symposium on computer arithmetic (33rd edition in 2026)
- Accepted papers appear in the conference proceedings and in IEEE Xplore
- Full papers up to 8 pages and short industry papers up to 4 pages, IEEE CS conference format, references included
- Double-blind review; abstract due one week before the full paper
- CORE C (ICORE2026)
- Rotates between the USA and Europe (El Paso 2025, Malaga 2024, Portland 2023, Fulda 2026)
