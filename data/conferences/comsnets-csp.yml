notes:
- Co-located workshop of COMSNETS, held each January in Bengaluru, India
- Security and privacy for communication systems (network security, IoT, blockchain, AI/ML security, privacy)
- Double-blind review; papers 4 to 6 pages in IEEE format, submitted through EDAS
- Workshop papers appear in the COMSNETS proceedings and are submitted to IEEE Xplore
- One author must register at the workshop rate and present in person
- Co-chairs in 2026 and 2027 from Deakin University (Australia) and IIIT Hyderabad
- Held with COMSNETS every year in the 2022 to 2026 archives
