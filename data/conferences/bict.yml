notes:
- EAI conference on bio-inspired communications, molecular communication, DNA storage and computing, brain-computer
  interfaces and bio-inspired networking (formerly BIONETICS)
- Proceedings in Springer LNICST; selected papers invited to IEEE Transactions on Molecular, Biological, and
  Multi-Scale Communications and Springer MONET
- Not held every year; recent editions in Okinawa, Japan (2023) and Quzhou, China (2024), earlier ones mostly in the
  United States (2015 to 2019) and virtual (2020, 2021)
- 2027 edition in Shanghai, China as a hybrid conference
- Not to be confused with BIC-TA (Bio-Inspired Computing, Theories and Applications)
- Not listed in the CORE ICORE2026 portal
