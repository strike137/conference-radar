notes:
- Annual meeting of the North American fuzzy logic society on fuzzy sets, soft computing, approximate reasoning,
  possibility theory and fuzzy decision making
- Full papers (6 to 12 pages) and late-breaking papers (4 to 6 pages) are published by Springer; 1 to 2 page extended
  abstracts are presented only
- Each accepted paper or abstract needs a full registration
- Held jointly with the IFSA World Congress in some years (IFSA-NAFIPS 2025 in Banff, Canada)
- Dates move around the year (August 2025, March 2026), so typical months are only a rough guide
- Recent proceedings appeared in Springer Lecture Notes in Networks and Systems (NAFIPS 2022)
