notes:
- Workshop on integrating quantum computers into HPC facilities, hybrid workflows, resource allocation and scheduling
- First edition in 2026, a half-day workshop co-located with Euro-Par 2026 in Pisa
- Full papers up to 12 pages (LNCS) go to the Springer proceedings; short papers up to 10 pages are presented but not published
- At least three reviews per paper through the Euro-Par 2026 workshops EasyChair
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
