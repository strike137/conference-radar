notes:
- Run by the Computer Science Department of the Technical University of Cluj-Napoca with the IEEE Romania Section and IEEE Computer Society
- Held every year in Cluj-Napoca, Romania, since 2005
- Tracks on intelligent systems, deep learning, computer vision, perception for autonomous vehicles and robots, and distributed computing
- Accepted papers go to IEEE Xplore, indexed in Web of Science and Scopus
- Acceptance rate 59% in 2024 (stated on the ICCP 2025 site)
- Co-located workshops and special sessions; submission deadline usually extended by a few weeks
- CORE National (Romania) in ICORE2026; not to be confused with IEEE ICCP on Computational Photography
