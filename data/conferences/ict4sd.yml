notes:
- Broad ICT conference held together with an ICT summit and awards event, organised and managed by GR Foundation
- Held in Goa, India in recent editions; the 2027 edition is at Hotel Vivanta Goa, Panaji
- Proceedings in Springer Lecture Notes in Networks and Systems (LNNS), indexed by Scopus and EI Compendex
- Hybrid format; one physical day followed by digital sessions
- Submissions via EasyChair; papers about 10 pages in Springer format
- Not listed in ICORE2026 or the CCF 2026 list
