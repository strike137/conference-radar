notes:
- Workshop on information retrieval, NLP and computer vision for eCommerce (product search, recommendation), co-located with ACM SIGIR since 2017
- Strong industry participation (Walmart, Meta, eBay, Amazon, Uber papers in 2026); special theme in 2026 was agentic user interaction and experience
- Proceedings in CEUR-WS (2025 Vol-4123, 2026 Vol-4250)
- "Acceptance: 20 of 29 submissions in 2026"
- Short (8 pages) and long (15 pages) papers in CEUR single-column format; submission via the SIGIR EasyChair instance
- Runs a data challenge each year (2026 with the TREC Product Search track on query reformulation)
- In-person full-day workshop
- Not listed in ICORE2026 and not on the CCF list
