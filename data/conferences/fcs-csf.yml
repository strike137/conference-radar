notes:
- One-day workshop affiliated with the IEEE Computer Security Foundations Symposium (CSF), running since 2002
- Topics are the formal foundations of security and privacy (information flow, verification, security protocols, language-based security)
- Informal proceedings only; papers are made available to participants and may be published elsewhere later
- Full papers up to 12 pages and short papers up to 2 pages, light double-blind review
- Includes mentoring sessions for junior researchers alongside the research track
- Follows CSF (Haifa 2022 at FLoC, Dubrovnik 2023, Enschede 2024, Lisbon 2026 at FLoC)
- No 2025 edition is listed on the workshop site
