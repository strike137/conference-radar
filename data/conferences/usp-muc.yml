notes:
- Half-day workshop held at Mensch und Computer (MuC), the German-speaking HCI conference; run as a scientific workshop since 2015
- 12th edition in 2026 (Duisburg); earlier editions at MuC in Chemnitz 2025, Karlsruhe 2024, Rapperswil 2023, Darmstadt 2022
- Papers in German or English, 6 to 8 pages in the MuC format, double-blind review by three PC members
- Accepted papers published in the Digital Library of the German Informatics Society (GI) as part of the MuC proceedings
- Also accepts interactive contributions (moderated group work, tool exercises) besides regular papers
- Audience mixes researchers with practitioners from industry and public administration
- Organized by Luigi Lo Iacono (JLU Giessen), Hartmut Schmitt, Denis Feth (Fraunhofer IESE) and Andreas Heinemann (h_da)
- Not listed in CORE ICORE2026 or the CCF list
