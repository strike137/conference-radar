notes:
- Ran as the AAAI Conference on Human Computation and Crowdsourcing (2013 to 2024, proceedings in the AAAI digital
  library); from 2026 an ACM conference renamed to Human-AI Complementarity and Alignment
- 2026 proceedings in the ACM Digital Library; talks (formerly extended abstracts), posters and demos are non-archival
- Full papers up to 6,000 words excluding references; double-blind review with a meta-review
- Co-located with ACM Collective Intelligence (CI) 2026 at Virginia Tech's Academic Building One in Alexandria near
  Washington DC; 2024 was co-located with ACM UIST in Pittsburgh
- HCOMP 2027 announced for Tokyo, Japan in September 2027
- No 2025 volume appears in the AAAI HCOMP proceedings archive
- CORE B in ICORE2026 (listed under the old AAAI name)
