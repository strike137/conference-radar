notes:
- Annual flagship congress of CSIG (China Society of Image and Graphics), held in a different Chinese city each year
  (Suzhou 2023, Xi'an 2024, Changsha 2025, Guangzhou 2026, Qingdao 2027)
- Keynotes by academicians, about 50 academic, special and industry forums, an exhibition and a poster session;
  about 4000 attendees expected
- 'No call for new papers: the poster/spotlight call takes papers already published or accepted at top venues since
  2022 (T-PAMI, IJCV, CVPR, ICCV, NeurIPS and similar)'
- Forum proposals are collected from CSIG members before the congress; talks mostly in Chinese
- Registration about 2200 CNY for CSIG members and 500 CNY for CSIG student members (2026, early bird)
- Not to be confused with ICIG, the international conference of the same society
- Not listed in the CORE ICORE2026 portal or the CCF list
