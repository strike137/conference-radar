id: ines
name: IEEE INES
full_name: IEEE International Conference on Intelligent Engineering Systems
type: conference
tier: minor
areas: [ai, general]
region: worldwide
language: english
frequency: annual
organizer: Obuda University (Budapest), IEEE Hungary Section, John von Neumann Computer Society and Hungarian Fuzzy Association; IEEE IES technical co-sponsorship
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
indexing: [Scopus]
fee: EUR 580 regular, EUR 530 IEEE members, EUR 450 students (2026, payment until May 10)
typical:
  deadline_months: [3, 4]
  conference_months: [7, 9]
links:
  website: http://www.ines-conf.org
notes:
- Run by Obuda University (Hungary) as one of its IEEE symposium series (with SAMI, SISY, SACI, CINTI); held since 1997
- Broad intelligent engineering scope (AI and computational intelligence in engineering, robotics, mechatronics, manufacturing, transportation, HCI)
- Location changes every year (Crete 2022, Nairobi 2023, Gammarth 2024, Palermo 2025, Budapest 2026, Corfu 2027)
- Papers go to IEEE Xplore; the series is indexed by Scopus
- In-person only; at least one author must register and present, one paper per registration fee
- Small regional venue, not listed in ICORE2026
