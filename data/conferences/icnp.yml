notes:
- Held since 1993; covers design, analysis, verification and implementation of network protocols
- One deadline per year in May (abstract one week earlier, AoE); double-blind review with shepherding of accepted
  papers; ICNP 2025 introduced a rebuttal phase
- Papers up to 10 pages excluding references and appendices, IEEE format
- ICNP 2025 was held in Seoul, Korea; 2026 in Tempe, Arizona, USA; co-located workshops (e.g., AgentNet, NIPA)
