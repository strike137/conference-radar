notes:
- Workshop on applying AI and machine learning to database systems and data applications, held with VLDB, so it moves with VLDB (2025 London, 2026 Boston)
- 7th edition in 2026; earlier editions 2019 to 2023 and 2025
- The MIDAS workshop has merged into the AIDB series since 2026
- Short papers of at least 6 pages or long papers up to 12 pages, extended abstracts up to 4 pages, excluding bibliography; single-blind review on HotCRP
- Authors of accepted papers can choose to include them in the VLDB workshop proceedings; in-person presentation required
- 14 papers in the VLDB 2026 workshop proceedings
- Not listed in CORE ICORE2026 or in the CCF 2026 list
