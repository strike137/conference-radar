notes:
- Small Indian AI symposium organized by NIT Sikkim and the CSI Kolkata Chapter; 2025 was the second edition
- 2025 edition held at NIT Sikkim, Ravangla, India in hybrid mode
- Accepted and presented papers announced for the Springer Lecture Notes in Networks and Systems series
- Double-blind review via Microsoft CMT; papers up to 16 pages in LNNS format, extra charge beyond 10 pages
- Not to be confused with JSAI-isAI or iSAI-NLP
- Not listed in ICORE2026 or the CCF 2026 list
