notes:
- Optical networking and photonics venue covering photonic switching devices, systems and networks, photonics for
  computing and AI hardware, and quantum technologies for networks and computing
- Successor of the Photonics in Switching (PS) conference held annually since 2001; the official site says it
  alternates between the Americas, Europe and Asia
- 2026 is the sixth PSC edition; earlier ones were 2018 Limassol, 2019 Fukuoka (with OECC), 2022 Toyama (with OECC),
  2023 Mantova and 2025 Sapporo (with OECC)
- Three-page papers plus a 35-word abstract, submitted through EDAS; accepted and presented papers go to IEEE
  Xplore (no-show papers are not published)
- Postdeadline paper session with a separate call about two weeks before the conference
- "Registration fee (2026): 650 EUR member and 750 EUR non-member early, 420 EUR member student and 480 EUR
  non-member student early"
- 2026 edition held the week before ECOC 2026 in Malaga
- Not listed in the CORE ICORE2026 portal; optics venue outside the usual CS rankings
