notes:
- Workshop on IoT and data-driven computing for social good (urban computing, healthcare, crisis mitigation, rural
  development) plus security, privacy and communication for societal applications
- Co-located with ICDCN; editions in 2020, 2023, 2024, 2025 and 2027, all in India
- Papers up to 6 pages in ACM format; relaxed double-blind review; submission via the ICDCN EasyChair
- Accepted papers appear in the ICDCN companion volume in ACM ICPS; ACM open access APC applies to authors outside ACM
  Open institutions
- Not listed in ICORE2026 and not on the CCF list
