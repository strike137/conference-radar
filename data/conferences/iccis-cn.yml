id: iccis-cn
name: ICCIS
full_name: International Conference on Communication and Information Systems
type: conference
tier: minor
areas: [communications, networking]
region: china
language: english
frequency: annual
organizer: Commercial conference secretariat with a host university each year (North University of China in 2026; Chongqing University, Nanjing University of Posts and Telecommunications as technical supporters)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI Compendex, Scopus]
fee: Regular author 530 USD or 3800 RMB, student author 480 USD (2026, after 2026-06-20); 60 USD per page over 5 pages; delegate 310 USD
typical:
  deadline_months: [8]
  conference_months: [9, 10]
links:
  website: http://www.iccis.org/
notes:
- Held since 2016 (no 2020 edition); 2026 is the 10th edition
- Mostly held in China (Chongqing 2021 to 2023 hybrid or virtual, Shenzhen 2024, online 2025, Taiyuan 2026); early editions in Bangkok and Singapore
- Proceedings by IEEE since 2018 (IEEE Xplore, EI Compendex, Scopus); ACM DL for 2016 and 2017
- Run by a commercial conference service (163.com secretariat, zmeeting submission) with a host university each year
- Papers reviewed by 2 to 3 reviewers after an initial desk check; abstract-only presentation and delegate registration also offered
- Not to be confused with other venues using the ICCIS acronym
- Not listed in CORE ICORE2026 or the CCF 2026 list
