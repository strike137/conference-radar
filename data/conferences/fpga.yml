notes:
- Also known as ISFPGA; premier venue for FPGA architecture, CAD tools, high-level synthesis and reconfigurable
  computing
- Sponsored by ACM and ACM SIGDA; proceedings in the ACM DL
- Usually held in California (Monterey area in 2026, California in 2027)
- Double-blind review with a rebuttal; long papers up to 10 pages and short papers up to 6 pages, plus references
- Abstract and paper deadlines are not extended; there is also an industry track
- Best papers are invited to extend their work for an ACM TRETS special issue
- CORE A (ICORE2026), CCF B
