notes:
- Small specialist conference on similarity search, metric indexing and vector search; proceedings in Springer LNCS
- "Paper types: full papers up to 14 pages and short papers up to 8 pages; double-blind review for regular papers"
- Runs the SISAP Indexing Challenge, plus demos, special sessions and a doctoral symposium
- Selected best papers are invited to a special issue of Elsevier Information Systems
- Mostly held in Europe (Dortmund 2021, Bologna 2022, A Coruna 2023, Reykjavik 2025, Brno 2026), Providence USA in 2024
- CORE B (ICORE2026)
