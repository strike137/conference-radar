notes:
- Sponsored by the IEEE ITS Society; interdisciplinary venue on IT for intelligence, safety and security, recent
  calls stress AI, LLM and multimodal model security
- Papers limited to 6 pages in IEEE format, submitted via PaperCept; in-person only, one full registration per paper
- Proceedings in IEEE Xplore; selected papers recommended to journal special issues
- Ranked CORE C; not in the CCF list; location changes each year (Hong Kong 2025, University of Cambridge 2026)
