id: kmis
name: KMIS Conference
full_name: Korea Society of Management Information Systems Spring and Fall Conferences
name_local: 한국경영정보학회 춘계/추계학술대회
type: conference
tier: domestic
areas: [general, data, ai, security]
region: korea
language: mixed
frequency: multiple-per-year
organizer: Korea Society of Management Information Systems (KMIS)
organizer_country: [korea]
proceedings: KMIS Conference Proceedings (Korean society conference proceedings in the paid eArticle database; domestic,
  not formally indexed); best papers recommended for fast-track review in the KMIS journals APJIS and Information
  Systems Review
archival: false
rank:
  core: Unranked
fee: 120,000 KRW regular member, 70,000 KRW student member (up to master's), 500,000 KRW non-member (includes lifetime
  membership), 400,000 KRW institutional (2026 fall, pre-registration)
typical:
  deadline_months: [4, 9]
  conference_months: [6, 10, 11]
links:
  website: https://www.kmis.or.kr/
notes:
- Spring conference is a joint meeting with four other Korean societies (Big Data, Internet e-Commerce, Information
  Systems, Knowledge Management); fall conference is KMIS only
- Abstract first, then a full paper of up to 6 pages or slides; Korean or English; policy and case talks can submit
  an abstract only; copyright of submitted papers goes to the society
- Best papers get fast-track review in the society journals APJIS (Asia Pacific Journal of Information Systems,
  English) and Information Systems Review
- Management and business IS focus; the 2026 fall call includes AI governance, data, security and privacy tracks
- The Asia Privacy Bridge Forum (Yonsei Barun ICT Research Center; 15th edition 2026-10-16 in Seoul, free) is announced
  through KMIS
