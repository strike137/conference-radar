notes:
  - Formerly MAP-A, Workshop on Manipulation, Adversarial and Presentation Attacks in Biometrics; renamed GAPBio from 2026
  - Covers presentation attack detection, morphing, deepfakes, adversarial and generative attacks on biometric systems
  - Earlier editions with BTAS 2018 and WACV 2020 to 2026; the 2027 edition is with WACV 2027
  - Papers up to 8 pages excluding references, double-blind; accepted regular papers go in the WACV Workshops proceedings and IEEE Xplore
  - From 2027 also accepts non-archival presentation-only submissions; review moved from CMT to OpenReview
  - 9 papers in 2024, 6 in 2025 and 4 in 2026 in the WACV workshop proceedings on CVF Open Access
  - Not listed in ICORE2026 or the CCF list
