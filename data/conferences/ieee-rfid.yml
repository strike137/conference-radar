notes:
- Main conference of the IEEE Council on RFID; 20th edition in 2026
- "Two paper options: regular 4 to 6 page papers in the proceedings on IEEE Xplore, or journal papers reviewed by the
  IEEE Journal of RFID (JRFID) for a special issue (not in the conference proceedings)"
- Poster abstracts (1 page) are not published on IEEE Xplore
- All deadlines at 23:59 UTC-12 (AoE); submission via EDAS
- Held in the USA (Santa Fe, New Mexico in 2026)
- Not listed in the CORE ICORE2026 portal
