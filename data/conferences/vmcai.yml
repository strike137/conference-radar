notes:
- Formal methods venue on verification, model checking and abstract interpretation (28th edition in 2027)
- Co-located with POPL every January; two-day event
- Proceedings in Springer LNCS
- Regular papers (20 pages) double-blind; tool papers 12 pages, case studies 20 pages, excluding references
- Optional artifact evaluation concurrent with review; its outcome may affect the decision
- At least one author must register and present in person
- 'Recent hosts: Philadelphia (2022), Boston (2023), London (2024), Denver (2025), Rennes (2026), Mexico City (2027)'
- CORE B (ICORE2026); CCF B
