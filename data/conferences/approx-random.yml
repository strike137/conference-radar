notes:
- Two co-located theory conferences with one submission deadline and one joint proceedings volume
- APPROX covers approximation algorithms and hardness of approximation; RANDOM covers randomness in computation (pseudorandomness, property testing, sublinear algorithms, coding)
- RANDOM started in 1997 and APPROX in 1998
- Joint proceedings in the open-access LIPIcs series (APPROX/RANDOM 2026 is LIPIcs volume 392)
- Lightweight double-blind review; single column, at least 11 point, first 10 pages after the title page must carry the main ideas
- Mostly held in the USA (Atlanta 2023, Berkeley 2025, Boston 2026), sometimes in Europe (London 2024); virtual in 2020 to 2022
- CORE A (ICORE2026); not on the CCF list
