id: iwslt
name: IWSLT
full_name: International Conference on Spoken Language Translation
type: conference
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: SIGSLT (ACL-ISCA-ELRA Special Interest Group on Spoken Language Translation)
organizer_country: [international]
proceedings: ACL Anthology
archival: true
acceptance_rate: 50% research papers (2026, 3/6); 59% (2025, 13/22); system description papers are reported separately
typical:
  deadline_months: [3, 4]
  conference_months: [7, 8]
links:
  website: https://iwslt.org/
notes:
- Annual meeting of SIGSLT, supported by ACL, ISCA and ELRA; founded in 2004 out of the C-STAR speech translation
  consortium (formerly International Workshop on Spoken Language Translation)
- Two-day event co-located with ACL since 2022 (Dublin 2022, Toronto 2023, Bangkok 2024, Vienna 2025, San Diego 2026,
  Kyoto 2027); hybrid with virtual presentation from 2022 to 2026
- Built around evaluation campaigns (shared tasks such as offline, simultaneous, low-resource and Indic speech
  translation, subtitling, compression, instruction following); most papers are system descriptions
- Scientific papers 4 to 8 pages in ACL format, double-blind review (system description papers need not be anonymized); also accepts commitments of ARR-reviewed papers
- Proceedings in the ACL Anthology; registration goes through the ACL registration page
- From 2027 some shared tasks run as year-round leaderboards
- The main venue for speech translation; not listed in ICORE2026
