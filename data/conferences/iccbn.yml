notes:
- Annual since 2012; early editions in Phuket, Chennai, Singapore (2014, 2015, 2018), Bali and Nagoya (2019)
- Recent editions Auckland 2020, Shanghai 2021 and 2022, Xi'an 2023, Nyingchi (Tibet) 2024, Chengdu 2025 and 2026; the 2022 and 2023 editions were held online
- Proceedings in ACM DL (ACM ICPS) up to 2024; IEEE Xplore from 2025; stated as EI Compendex and Scopus indexed
- Run by a commercial conference secretariat (iconf.org submission system, +86 contact) with a host university each year
- Full papers 4 to 5 pages, double blind review; abstract only presentation without publication is also offered
- Small event (about 100 participants in 2025)
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
