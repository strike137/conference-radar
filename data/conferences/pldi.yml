notes:
- Premier forum for programming language design, implementation, theory, applications and performance; sponsored by ACM SIGPLAN
- Papers are published in the PACMPL issue PLDI (Gold Open Access journal, archived in the ACM DL); authors are invited but not required to present
- One submission deadline in November; double-blind review with author response, conditional acceptance and a revision round
- Up to 20 pages of text in the single-column acmsmall format, excluding references and supplementary material
- Held in Copenhagen 2024, Seoul 2025, Boulder 2026 and Atlanta 2027 (part of FCRC 2027)
- CORE A* (ICORE2026), CCF A
