notes:
- Regional conference of the IEEE Communications Society for the Middle East and surrounding countries
- Recent editions in Abu Dhabi 2024, Cairo 2025 and Marrakech 2026
- Papers up to 6 pages via EDAS (one extra page for 100 USD); accepted and presented papers go to IEEE Xplore
- Top papers are invited to a fast-track submission to IEEE Open Journal of the Communications Society (2026)
- Not ranked in CORE ICORE2026
- The per-year site moves (mecomYYYY.ieee-mecom.org); Wayback Machine copies of the official pages are listed as
  backup sources
