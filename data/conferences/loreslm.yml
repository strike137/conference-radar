notes:
- Workshop on building, adapting and evaluating language models and LLMs for low-resource languages and dialects
- Started in 2025; first edition at COLING 2025 in Abu Dhabi, UAE (January 20, 2025), second at EACL 2026 in Rabat, Morocco (March 29, 2026)
- Proceedings in the ACL Anthology (37 papers in 2025, 57 in 2026)
- Long papers up to 8 pages and short papers up to 4 pages; 2026 submissions through OpenReview
- Organizers also run a related special issue in the journal Natural Language Processing (Cambridge)
- Not ranked in ICORE2026 and not on the CCF list
