notes:
- Held every two years since 1992; single-track symposium on swarm, modular and multi-robot systems
- Rotates between Asia, Europe and North America (Montbeliard 2022, New York 2024, Tokyo 2026)
- Proceedings published as a book in Springer Proceedings in Advanced Robotics (SPAR)
- Full papers up to 12 pages plus references in Springer llncs format; up to two extra pages at 20,000 JPY each (2026)
- Separate 2-page late-breaking results and demo track; these abstracts are not in the proceedings
- "DARS 2024: 40 papers in the SPAR volume"
- Not listed in CORE ICORE2026 or the CCF list
