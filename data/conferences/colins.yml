notes:
- Ukrainian NLP and intelligent systems conference that grew out of the ISAL conference (since 2012) and became international as CoLInS in 2017
- Run jointly by Lviv Polytechnic National University and NTU "Kharkiv Polytechnic Institute"; held in Kharkiv in odd years and Lviv in even years per the site
- Papers are published in several CEUR-WS workshop volumes (Machine Learning, Computational Linguistics, Intelligent Systems, PhD workshops) plus a conference volume with DOIs
- "CoLInS 2025: 19 of 58 papers accepted for the Intelligent Systems Workshop volume, 16 of 36 for the Computational Linguistics Workshop volume"
- As of 2026-10-17 the official site says the conference is postponed indefinitely
- Not listed in CORE ICORE2026 and not on the CCF list
