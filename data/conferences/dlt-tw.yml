notes:
- Taiwanese national conference on digital life technologies, 26th edition in 2026; described on its site as one of the largest domestic meetings in the field
- Topics include AI, IoT, large language models, robots, smart health, smart agriculture, blockchain and social media
- Full papers in Chinese or English; oral and A1 poster presentations; general and special sessions (special session chairs review their own papers)
- Notification comes about three days after the deadline; the 2026 deadline was extended to Apr 15
- Papers appear only in an abstract book with ISBN, so treat it as non-archival
