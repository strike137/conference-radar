id: caibda
name: CAIBDA
full_name: International Conference on Artificial Intelligence, Big Data and Algorithms
type: conference
tier: minor
areas: [ai, data]
region: china
language: english
frequency: annual
organizer: Conference committee with a Chinese host university each year (BUPT 2025, Tianjin University of Science and Technology 2026, Nanchang University chairs 2027)
organizer_country: [china]
proceedings: IEEE Xplore (2021, 2022, 2025, 2026); ACM ICPS (2024); IOS Press (2023)
archival: true
indexing: [EI, Scopus]
fee: 550 USD or 3800 CNY per 4-page paper (2027, regular); 60 USD per extra page
typical:
  deadline_months: [3, 5]
  conference_months: [6, 7]
links:
  website: https://www.caibda.org/
notes:
- Annual since 2021; 7th edition in 2027
- Held in China (online 2022, Zhengzhou 2023 and 2024 hybrid, Beijing 2025, Tianjin University of Science and Technology as host 2026, Nanchang 2027)
- Publisher changes by year (IEEE Xplore 2021, 2022 and 2025; IOS Press 2023; ACM 2024; IEEE ISBN stated for 2026); stated as indexed by EI Compendex and Scopus
- Double-blind review by two or three reviewers per paper (editorial policy page)
- Website hosted on the AiScholar (ais.cn) conference platform; presenter and listener options without publication
- Not listed in CORE ICORE2026 or the CCF list
