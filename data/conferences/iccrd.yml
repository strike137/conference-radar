id: iccrd
name: ICCRD
full_name: International Conference on Computer Research and Development
type: conference
tier: minor
areas: [general]
region: asia-pacific
language: english
frequency: annual
organizer: Commercial conference secretariat (contact iccrd_office@126.com, zmeeting submission system); 2027 sponsored by the Sensors and Systems Society of Singapore and University of North Dakota
organizer_country: [china]
proceedings: Conference proceedings (IEEE Xplore for 2023 and 2025; 2027 publisher not named)
archival: true
indexing: [EI Compendex, Scopus]
fee: 700 USD regular, 650 USD student per full paper (2027, early bird before 2026-12-10); abstract only 450 USD
typical:
  deadline_months: [10]
  conference_months: [1]
links:
  website: https://www.iccrd.org/
notes:
- Annual since 2009 (19th edition in 2027); held in Vietnam 2013 to 2020, virtual 2021 to 2023, China 2024 and 2025, Singapore 2026 and 2027
- 2025 edition was co-sponsored by IEEE China Council; 2023 and 2025 proceedings in IEEE Xplore, stated as EI Compendex and Scopus indexed
- In 2014, 2015, 2016 and 2018 papers went to the secretariat's own journals instead of proceedings
- Double-blind review; abstract only presentation without publication is also offered
- Selected papers can be extended for the Journal of Electronic Science and Technology
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
