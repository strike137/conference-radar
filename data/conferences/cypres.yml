notes:
- Workshop of the IEEE International Conference on Cyber Security and Resilience (IEEE CSR); first held in 2025
  in Chania, Crete with 7 papers and 1 keynote
- Topics include resilience of critical infrastructures, cascading effects, crisis and emergency communication,
  and multi-hazard early warning for extreme weather driven failures
- Chairs from the University of Cyprus, Justus Liebig University Giessen and CERTH/ITI in 2026
- Workshop papers go into the IEEE CSR proceedings in IEEE Xplore; 6 pages plus up to 2 extra pages with overlength
  charges
- In person only; deadline was extended by one month in 2026 (Apr 13 -> May 13)
- Not listed in CORE ICORE2026 or the CCF list
