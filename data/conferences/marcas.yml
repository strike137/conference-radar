id: marcas
name: MarCaS
full_name: IEEE LCN Special Track on Maritime Communication and Security
type: workshop
tier: minor
areas: [networking, security, communications]
region: worldwide
language: english
frequency: annual
organizer: MarCaS chairs (Fraunhofer FKIE, Gary Kessler Associates) as a special track of IEEE LCN
organizer_country: [international]
proceedings: IEEE Xplore (IEEE LCN Companion Proceedings)
archival: true
typical:
  deadline_months: [5, 6]
  conference_months: [10]
links:
  website: https://lcn-marcas.org/
notes:
- Special track of the IEEE Conference on Local Computer Networks (LCN) on maritime communication systems and maritime
  cybersecurity
- Started in 2023 as an LCN workshop (Daytona Beach); a special track since 2024
- Accepted papers appear in the IEEE LCN Companion Proceedings in IEEE Xplore
- Papers up to 6 pages excluding bibliography in two-column IEEE format, double-blind review, submission via EDAS
- On-site only, no hybrid option; LCN registration is required for each paper and the LCN no-show policy applies
- Small track (one session of about four papers in 2026)
- Location follows LCN (Daytona Beach 2023, Caen 2024, Sydney 2025, Coimbra 2026)
- Not listed in CORE ICORE2026 and not on the CCF 2026 list
