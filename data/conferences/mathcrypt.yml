notes:
- One-day workshop affiliated with IACR Crypto, held at UCSB in Santa Barbara
- Topics are new mathematical assumptions and attacks in cryptography, plus implementation improvements for schemes and attacks
- Accepted full papers are published in a special issue of Transactions on Mathematical Cryptology (TMC); no page limit for full papers
- Short papers of up to 4 pages can be presented at the workshop
- Registration goes through the Crypto affiliated events registration
- Editions in 2018, 2019, 2021, 2022, 2023 and 2025 (6th edition); no edition listed for 2024
