notes:
- Annual flagship symposium of the IEEE EMC Society, held since 1959 (EMC, signal integrity and power integrity)
- Held in a different US city almost every year (Spokane 2022, Grand Rapids 2023, Phoenix 2024, Raleigh 2025, Dallas 2026, Portland 2027)
- Traditional papers are 4 to 6 pages and peer reviewed, with a revision round; accepted papers are uploaded to IEEE Xplore
- Abstract-reviewed papers (one-page extended abstract) have a later deadline
- Five-day program with workshops, tutorials, the Clayton R. Paul Global EMC University, experiments and demonstrations, and a large technical exhibition; industry-heavy audience
- Separate from EMC Europe and APEMC, which are regional symposia
- Not listed in ICORE2026 or the CCF list
