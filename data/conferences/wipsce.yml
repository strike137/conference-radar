notes:
- School-level (primary and secondary) computing education research conference, run in cooperation with ACM SIGCSE
- Grew out of a long-running workshop of the German computing education community (Workshop in Primary and Secondary Computing Education)
- Alternates between Germany and other European countries (2022 Morschach, 2023 Cambridge, 2024 Munich, 2026 Aachen, 2027 Ljubljana)
- No 2025 edition; the conference moved from autumn to spring with the 2026 edition
- Proceedings in the ACM International Conference Proceedings Series (ACM DL); authors at non-ACM Open institutions may pay an APC
- Full papers, reports and posters; title and abstract by the first deadline, full paper a week later
- Optional pre-review of an extended abstract by at least two PC members before the main submission
- Not ranked in ICORE2026 and not on the CCF list
