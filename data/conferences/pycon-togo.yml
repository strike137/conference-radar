notes:
- National conference of the Python community in Togo, run by the Python Software Community Togo
- First edition in 2025, second edition in Lome in August 2026
- Three days in 2026 (workshop day, conference day, speakers' dinner)
- Talks and workshops chosen from an open call for speakers; site in French and English
- Talks only, no papers or proceedings; an edition report is published after each event
