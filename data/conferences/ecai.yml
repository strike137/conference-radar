notes:
- Main European general AI conference under EurAI; open-access proceedings by IOS Press
- Annual since 2023 (biennial in even years before that); held jointly with IJCAI in some years when IJCAI is in
  Europe (Stockholm 2018, Vienna 2022, Bremen 2026)
- ECAI 2027 in Athens, Oct 2 to 7, 2027; full paper deadline Apr 14, 2027
- Double-blind review, 7 pages plus 1 page of references (2025); record 3266 abstracts in 2025, main track acceptance
  23%
- Co-hosts PAIS (Prestigious Applications of Intelligent Systems) as an applications track
