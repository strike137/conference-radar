links:
  website: https://agenticse.github.io/
notes:
  - Workshop on LLM-based autonomous agents for software engineering (agent architectures, code generation, testing, DevOps, human-agent collaboration, evaluation)
  - First edition held on November 20, 2025 with IEEE/ACM ASE 2025 in Seoul
  - Long papers up to 8 pages and short papers up to 4 pages including references (IEEEtran), plus talk-only abstracts without publication
  - Double-blind review with at least three PC members per paper
  - The six 2025 papers appear in the 2025 IEEE/ACM ASE Workshops proceedings (ASEW 2025, IEEE CPS)
  - AgenticDev at ASE 2026 is a separate first-edition workshop with different organizers
  - 2025 program had six published papers and two talk-only presentations, with keynotes from Google and ByteDance
  - Not in the ASE 2026 workshop list
  - Different from the KDD Agentic SE workshop and from Agent ICSE workshops
  - Not listed in CORE ICORE2026 or the CCF 2026 list
