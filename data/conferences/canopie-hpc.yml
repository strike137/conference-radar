notes:
- One-day workshop on containers, virtualization and orchestration (Kubernetes, HPC container runtimes) for HPC and AI, held with SC since 2019
- 2026 is the 8th edition (SC26); the site text still calls it the seventh in places
- Peer-reviewed papers plus lightning talks; papers published by IEEE in 2026 and by ACM in 2025, following the SC workshop proceedings publisher
- Hard submission deadline with no extensions, 23:59 AoE
- Not listed in CORE ICORE2026
