notes:
- Jordanian computing conference run by the King Hussein School for Computing Sciences at PSUT in Amman
- 2025 edition organized with the Royal Scientific Society (RSS); 2019 edition with Prince Mohammad bin Fahd University
- Technically co-sponsored by the IEEE Jordan Section; proceedings in IEEE Xplore, indexed in Scopus
- Double-blind review with at least two reviewers per paper; papers up to 8 pages in IEEE format, submitted via EDAS
- Described as a biannual forum, but editions so far were 2017, 2019 and 2025
- Tracks on AI, NLP, cyber security, IoT, data science and computers and education
- Selected papers invited to the Jordanian Journal of Computer and Information Technology (JJCIT)
- Online presentation allowed on request for authors from outside Jordan
- Not listed in the CORE ICORE2026 portal
- Not the Italian Conference on Theoretical Computer Science, which is also called ICTCS
