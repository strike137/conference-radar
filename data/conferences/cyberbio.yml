notes:
- First edition in 2026, co-located with the IEEE Symposium on Security and Privacy (SPW workshop)
- Program chairs 2026 Rami Puzis (Ben-Gurion University) and Jacob Beal (RTX BBN Technologies)
- Full papers 6 to 10 pages, short, industry and position papers up to 5 pages; also non-published 2-page
  presentation abstracts
- Papers appear in the IEEE CS Press SPW 2026 proceedings in IEEE Xplore; presentation abstracts only on the website
- Anonymization optional (double-blind on request); at least one author must attend in person
- Accepted papers invited to submit extended versions to Cyberbiosecurity Quarterly (diamond open access journal)
- Not ranked in CORE (ICORE2026)
