notes:
- Large Croatian ICT convention held in Opatija every year since 1979, with more than a thousand participants
- Made up of about 17 parallel conferences (AI, cyber and information security, telecommunications, distributed computing, microelectronics, software engineering, engineering education, ...) plus forums, workshops and a student track
- Technically co-sponsored by IEEE Region 8 and the IEEE Croatia Section
- Papers appear in the ISSN registered MIPRO proceedings; English papers presented at the convention are submitted to IEEE Xplore (375 papers from MIPRO 2026)
- Official languages are English and Croatian
- "Fees 2027: 370 EUR early, 185 EUR for undergraduate and graduate students (not PhD students)"
- Abstract deadline about four weeks before the full paper deadline
- Not listed in ICORE2026 or the CCF 2026 list
