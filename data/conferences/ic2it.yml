notes:
- Run by KMUTNB (Faculty of Information Technology and Digital Innovation) with the Council of IT Deans of Thailand
  and partner universities in Thailand and abroad (FernUni Hagen, Chemnitz, Oklahoma State, Edith Cowan, HNUE)
- 22nd edition in 2026; held every May in Thailand (Bangkok, Kanchanaburi, Pattaya)
- Proceedings in Springer LNNS since 2021 (Springer AISC before that); 18 papers in the 2025 volume
- Papers up to 10 pages in Springer format, double-blind, at least 3 reviewers, submission via EasyChair
- Broad computing topics with emphasis on machine learning, NLP, image processing, and network and security
- The 2026 submission deadline was extended from 2025-11-30 to 2026-01-30
- Small venue with mostly Thai and Southeast Asian authors in the 2026 program; low registration fee
