id: ifip-summer-school
name: IFIP Summer School
full_name: IFIP Summer School on Privacy and Identity Management
type: conference
tier: minor
areas: [security]
region: europe
language: english
frequency: annual
organizer: IFIP TC11 (WG 9.6/11.7 and WG 11.6)
organizer_country: [international]
proceedings: Springer IFIP AICT (post-proceedings)
archival: true
fee: 500 EUR regular early, 550 EUR late; 450 EUR / 500 EUR for IFIP members (2026)
typical:
  deadline_months: [5]
  conference_months: [8]
links:
  website: https://ifip-summerschool.github.io/
notes:
- Interdisciplinary privacy and identity management event (computer science, law, social sciences) supported by IFIP
  TC11, WG 9.6/11.7 and WG 11.6
- Summer school format with keynotes, tutorials, workshops and paper sessions; aimed at PhD students and young
  researchers
- Two-stage process; extended abstracts (2 to 4 pages LNCS) get a light review for presentation, then revised full
  papers are reviewed after the school for the proceedings
- Post-proceedings published by Springer in the IFIP AICT series, about half a year after the school
- At least one author per accepted abstract must attend and register by the early bird deadline
- Held in a different European city every year (Oslo 2023, Madrid 2024, Copenhagen 2025, Leuven 2026)
- ECTS certificates offered to student participants
- Not listed in CORE ICORE2026
