notes:
- Latin American workshop on quantum software engineering, run by the Ibero-American network RIPAISC as part of the CLEI conference
- Held since 2024 (Bahía Blanca 2024 with CLEI and JAIIO, Valparaíso 2025, Mexico City 2026)
- Papers in English, Spanish or Portuguese; full papers up to 10 pages, work in progress up to 4 pages; single-blind review
- Full papers appear in the CLEI proceedings in IEEE Xplore (indexed in Scopus); short papers go to the journal Memoria Investigaciones en Ingeniería
- 2024 papers were published in Memoria Investigaciones en Ingeniería only; 2025 papers in IEEE Xplore post-proceedings
- Submission through the CLEI EasyChair; in 2025 at least one author had to register for CLEI
- Not listed in CORE ICORE2026
