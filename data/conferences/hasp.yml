id: hasp
name: HASP
full_name: Hardware and Architectural Support for Security and Privacy
type: workshop
tier: minor
areas: [security, systems]
region: worldwide
language: english
frequency: annual
organizer: HASP steering committee
organizer_country: [international]
proceedings: ACM ICPS (ACM DL)
archival: true
typical:
  deadline_months: [8]
  conference_months: [10, 11]
links:
  website: https://www.haspworkshop.org/
notes:
- Long-running workshop (since 2012) on hardware and architecture for security and privacy, co-located with MICRO in recent years
- Research, SoK and position papers are published in ACM ICPS (ACM DL, open access, APC may apply); work-in-progress papers are not published
- Held with MICRO (Toronto 2023, Austin 2024, Seoul 2025, Athens 2026)
- Steering committee from Princeton, University of Houston, Yale, NTU Singapore and Tsinghua
- Not listed in CORE ICORE2026
