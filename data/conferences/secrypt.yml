id: secrypt
name: SECRYPT
full_name: International Conference on Security and Cryptography
type: conference
tier: minor
areas: [security, crypto]
region: europe
language: english
frequency: annual
organizer: INSTICC (Institute for Systems and Technologies of Information, Control and Communication)
proceedings: SCITEPRESS
indexing: [Scopus, DBLP, EI, Web of Science (CPCI)]
rank:
  core: C
fee: 650 EUR (2027, early registration, non-member speaker; 590 EUR for INSTICC members; no student discount for
  speakers)
typical:
  deadline_months: [2, 3, 4]
  conference_months: [6, 7]
links:
  website: https://secrypt.scitevents.org/
  dblp: https://dblp.org/db/conf/secrypt/index.html
  wikicfp: http://www.wikicfp.com/cfp/program?id=2611
notes:
- Organized by INSTICC; proceedings in the SCITEPRESS Digital Library, selected extended papers in a Springer CCIS
  book
- 'Double-blind review; two submission stages: regular papers in stage 1, regular or position papers in stage 2
  (earlier stage gives earlier notification)'
- 'Held in Europe every year in June or July, co-located with other INSTICC conferences (2027: ICSOFT, DATA, DeLTA,
  QUANTICS, SIMULTECH, ICSBT, ABH); one registration covers them as a non-speaker'
- Regarded as a lower-tier venue (CORE C); speaker registration is the same price for students and non-students,
  so fees are relatively high for students
- Has a non-archival abstracts track (abstracts are presented but not published)
