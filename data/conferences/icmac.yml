id: icmac
name: ICMAC
full_name: IEEE International Conference on Microwave, Antennas and Circuits
type: conference
tier: minor
areas: [communications]
region: south-asia
language: english
frequency: irregular
organizer: IEEE MTT-S/AP-S joint chapters in Pakistan with a host university (NUST Islamabad 2021 and 2025, ITU
  Lahore 2027)
organizer_country: [other]
proceedings: IEEE Xplore
archival: true
fee: About PKR 10,000 or 250 USD (2027, IEEE professional member)
typical:
  deadline_months: [11]
  conference_months: [4]
links:
  website: https://icmac2027.itu.edu.pk/
notes:
- Small regional conference in Pakistan on microwave engineering, antennas, RF circuits and ICs, metamaterials,
  photonics and THz
- Editions so far are 2021 (NUST Islamabad), 2025 (NUST-SEECS Islamabad) and 2027 (ITU Lahore)
- Technically co-sponsored by IEEE and IEEE MTT-S; 2025 accepted papers were submitted for possible inclusion in IEEE
  Xplore
- 2027 edition organized by Information Technology University of the Punjab with the IEEE APS/CAS/MTT/SSCS joint
  chapter of the Lahore Section; papers up to 6 pages in the IEEE template
- Not listed in CORE ICORE2026 or the CCF list
