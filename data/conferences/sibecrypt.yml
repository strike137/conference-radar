notes:
- Russian school-seminar on the mathematics of cryptography and computer security, held every September since 2002 in a different Siberian city (Novosibirsk 2021, Krasnoyarsk 2022, Barnaul 2023, Biysk 2024, Irkutsk 2025, Tomsk region 2026)
- 25th edition in 2026; organizer list changes per year, with Tomsk State University running the secretariat
- Topics include cryptographic methods and cryptanalysis, steganography, coding theory, automata theory, graph theory and the mathematical foundations of computer security
- Submissions are short abstracts (tezisy) in Russian or English in LaTeX with an English summary, sent by email; also lectures, plenary talks and 15 minute section talks
- Accepted abstracts are printed in Prikladnaya Diskretnaya Matematika. Prilozhenie by the opening of the conference
- Registration fee 3000 to 3500 RUB (2026); no banquet, a participants' talent evening instead
- Not listed in the CORE ICORE2026 portal
