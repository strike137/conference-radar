id: iccde
name: ICCDE
full_name: International Conference on Computing and Data Engineering
type: conference
tier: minor
areas: [data, general]
region: southeast-asia
language: english
frequency: annual
organizer: Commercial conference secretariat (academic.net contact, iconf.org submission system) with conference chair Peter Haddawy (Mahidol University)
organizer_country: [china]
proceedings: ACM DL (ACM ICPS)
archival: true
indexing: [EI, Scopus]
fee: 480 USD per full paper (2027, regular; 450 USD student); abstract only 380 USD; ACM ICPS open access APC may apply on top
typical:
  deadline_months: [11]
  conference_months: [1, 2]
links:
  website: https://www.iccde.org/
notes:
- Annual since 2018 (Shanghai 2018 and 2019, Sanya 2020, virtual 2021 to 2023, Bangkok 2024 and 2025, Phuket 2026 and 2027)
- The 2021 and 2022 editions were planned for Thailand but moved online because of COVID-19
- Proceedings in the ACM International Conference Proceedings Series (ACM DL), stated as EI Compendex and Scopus indexed
- Run by a commercial conference secretariat (contact office in UTC+8 with a +86 phone number)
- Full papers 8 to 10 pages with blind peer review; abstract only presentation without publication is also offered
- Not listed in the CORE ICORE2026 portal
