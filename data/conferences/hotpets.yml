notes:
- One-day workshop held with PETS on new, unusual or controversial topics in privacy enhancing technologies
- Submission is a short talk proposal by email (title, abstract of at most 1 page, two paragraphs on why the topic fits and how the audience will be engaged)
- Curated by the HotPETs chairs rather than peer-reviewed; talks are a 10-minute introduction followed by group discussion
- 'Non-archival: no papers are published; rejected PETS papers should not be resubmitted as is'
- Open to activists, artists, developers, journalists, public servants and researchers; audience vote picks a Best Talk Award
- Follows PETS locations (Washington DC 2025, Calgary 2026); hybrid, travel stipends may be available
