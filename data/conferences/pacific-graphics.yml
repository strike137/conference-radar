notes:
- Annual flagship conference of the Asia Graphics Association on computer graphics, geometry, rendering, animation,
  imaging and visualization
- Two integrated tracks with one review process; journal track papers appear in a Computer Graphics Forum special
  issue, conference track papers in the PG proceedings in the Eurographics Digital Library
- Double blind review with a rebuttal phase and a revision round; abstract registration about one week before the
  paper deadline
- Rotates within Asia-Pacific (2022 Kyoto, 2023 Daejeon, 2024 Huangshan, 2025 Taipei, 2026 Singapore)
- Each accepted paper needs its own standard (non student) registration
- ICORE2026 lists it as Journal Published; CCF B (computer graphics and multimedia)
