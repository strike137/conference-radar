notes:
- Main venue for human and social aspects of software engineering; an ICSE workshop from 2008, a co-located
  conference since 2021
- Always co-located with ICSE and held just before it (Lisbon 2024, Ottawa 2025, Rio de Janeiro 2026, Dublin 2027)
- Full papers up to 10 pages plus 2 pages of references; extended abstracts up to 5 pages; double-anonymous
  review with at least three reviewers
- Paper format switches between ACM (2026) and IEEE (2027) templates from year to year
- CORE B (ICORE2026); not on the CCF 2026 list
