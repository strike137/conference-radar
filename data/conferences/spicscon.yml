notes:
- Jointly organized by the IEEE Bangladesh Section and the IEEE Signal Processing Society Bangladesh Chapter; held in
  hybrid mode at a different Bangladeshi university each year since 2024 (Khulna 2024, Rajshahi 2025, Natore 2026)
- Accepted papers go to IEEE Xplore; all four earlier editions (2019, 2021, 2024, 2025) are on IEEE Xplore
- Broad scope across signal processing, communications, circuits and systems, machine learning, vision and security
- Page limit 4 to 6 pages including references; one registration covers one paper
- Co-located with other IEEE Bangladesh Section events such as ProCon; editions in 2019 and 2021, annual since 2024
- Not ranked in ICORE2026
