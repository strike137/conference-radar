notes:
- Hosted by the Faculty of Computer Science, Universitas Indonesia, with IEEE Indonesia Section as technical co-sponsor; held alongside ICACSIS on the same dates and campus (2026 registration includes the ICACSIS parallel sessions)
- Held annually 2016 to 2022 (7th edition in 2022); the 8th edition is in 2026 after a gap
- Proceedings of earlier editions are in IEEE Xplore and indexed by Scopus; 2026 papers go through IEEE PDF eXpress
- Three submission batches; double-blind review; up to 6 pages in IEEE two-column format, up to 10 with an extra page fee
- Topics cover big data (storage, ML for big data, knowledge graphs) and information security (privacy, crypto, forensics, blockchain)
- Not listed in ICORE2026
