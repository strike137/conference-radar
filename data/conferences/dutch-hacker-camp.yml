notes:
- Dutch outdoor hacker camp held every four years; the name changes each edition (HIP, HAL, WTH, HAR, OHM2013, SHA2017, MCH2022, WHY2025)
- Run by volunteers; the IFCAT Foundation is the legal and financial vehicle
- WHY2025 was held 8 to 12 August 2025 at Geestmerambacht, about 42 km north of Amsterdam, with over 3500 attendees
- Talk proposals via pretalx; streams on creations, hacking, society and ethics, plus foundation and kids tracks
- No proceedings; all talks are recorded, streamed and released under CC-BY
- IFCAT says the next camp will be in 2029
- Similar to EMF Camp (UK) and the CCC Camp (Germany)
- Not listed in the CORE ICORE2026 portal
