id: mad-icmr
name: MAD
full_name: ACM International Workshop on Multimedia AI against Disinformation
type: workshop
tier: minor
areas: [ai, vision, security]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizers from NUST POLITEHNICA Bucharest (AIMultimediaLab), CERTH-ITI, CEA LIST, CNIT, Fraunhofer IDMT, CTU Prague and TU Berlin
organizer_country: [europe]
proceedings: ACM DL
archival: true
typical:
  deadline_months: [3, 4]
  conference_months: [6]
links:
  website: https://mad2026.aimultimedialab.ro/
notes:
- Co-located with ACM ICMR every year since 2022 (Newark 2022, Thessaloniki 2023, Phuket 2024, Chicago 2025, Amsterdam 2026)
- Topics are AI for detecting and analysing multimedia disinformation, deepfakes and synthetic media, multimedia forensics and media verification
- Proceedings in the ACM Digital Library as a separate workshop volume
- Long papers up to 8 pages plus references; double-blind review; submission via EasyChair
- Supported by EU and Romanian research projects (AI4Debunk, AI-CODE, News-Polygraph, VeraXtract, DeteRel)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
