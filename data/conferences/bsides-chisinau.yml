notes:
- First Security BSides event in Moldova; one-day conference at CYBERCOR in Chisinau
- First edition on October 31, 2025 at CYBERCOR, Technical University of Moldova (9 speakers, 10 sessions)
- Second edition on October 30, 2026 drew more than 330 attendees, with a CTF-style cyber range workshop by ICI
  Bucharest
- Organisers and partners listed include CYBERCOR, the Moldova Agency for Cyber Security, the Technical University of
  Moldova and Innovate Moldova
- Talks in English or Romanian
- Free to attend with registration; speaking slots go through the call for speakers and are not sold to sponsors
- No proceedings; not listed in ICORE2026
