notes:
- Sustainable and green computing and communications conference; 16th edition in 2026
- Runs inside the IEEE AI for Science Congress with ISPA, BDCloud, SocialCom and SpaCCS; until 2023 the papers
  appeared in joint ISPA/BDCloud/SocialCom/SustainCom proceedings, since 2024 in its own IEEE volume
- Recent editions in New York (2021), Melbourne (2022), Wuhan (2023), Kaifeng (2024), Shenyang (2025) and Kuala
  Lumpur (2026)
- Not ranked by CORE (ICORE2026) or CCF; deadlines are usually extended by two to three weeks
