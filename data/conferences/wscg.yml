notes:
- Held every year since 1992 in Pilsen (Plzen), Czech Republic, near Prague; the 35th edition is in 2027
- Covers computer graphics, visualization, computer vision and image processing
- Double-blind review; full and short papers up to 10 pages, posters up to 4 pages with oral presentation
- Proceedings in Computer Science Research Notes (CSRN) with individual DOIs, published after the conference;
  best papers go to the Journal of WSCG
- All papers are open access in the WSCG digital repository with no extra charge
- At least one author must present; online presentation possible mainly for authors from distant countries
- "ICORE2026 label: National: Czecholslovakia (spelled this way on the CORE portal)"
