notes:
- Annual since 1992, run from the University of West Bohemia in Pilsen (Plzen), Czech Republic; 35th edition in 2027
- Covers computer graphics, visualization, computer vision, image processing, pattern recognition and VR
- In cooperation with the Eurographics Association, ACM and SIGGRAPH
- Full and short papers up to 10 pages, posters up to 4 pages; submissions via wscgreg.zcu.cz only
- All presented papers appear open access in CSRN with individual DOIs; best selected papers go to the Journal of WSCG
- Papers that are not presented are not published; online presentation allowed only for authors from distant regions
- "Fee from 10000 CZK or 420 EUR per paper when paid early (2026)"
- "CORE ICORE2026 lists it as a national conference (label: National: Czecholslovakia)"
