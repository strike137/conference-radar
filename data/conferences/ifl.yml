notes:
- Annual symposium on implementing and applying functional programming languages, held since 1989 (started in Nijmegen)
- Post-symposium review; draft papers are screened before the event, then revised full papers are reviewed (single-blind, at least three reviews) for the formal proceedings
- 2026 proceedings in the ACM International Conference Proceedings Series (ACM DL), ACM two-column format, up to 12 pages excluding references; ACM ICPS open access may require an APC
- Proceedings from 1996 to 2010 were Springer LNCS volumes
- Mostly held in Europe (Copenhagen 2022, Braga 2023, Nijmegen 2024, Gothenburg 2026); 2025 in Montevideo, Uruguay; 2020 and 2021 online
- Awards the Peter Landin Prize for the best paper
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
