links:
  website: https://mlg-europe.github.io/2026/
notes:
- Long-running workshop series on graph mining and graph machine learning; 23rd edition in 2026
- Co-located with ECML PKDD since 2022 (in 2022 and 2023 also held with KDD); earlier editions mostly at KDD, some at ICML and ECML PKDD
- Accepted papers are posted on the workshop website and are not considered archival for resubmission purposes; work under review elsewhere is welcome
- High quality original papers that are not dual submissions are invited to the ECML PKDD post-workshop Springer proceedings (CCIS in 2026), if ECML PKDD offers them
- Long papers up to 12 pages, short papers up to 8 pages, Springer LNCS style, references and appendix excluded; single-blind review
- Pitch and poster session for all accepted papers, best four chosen for oral talks
- Not listed in CORE ICORE2026
