notes:
- Formerly the Multi-disciplinary International Workshop on Artificial Intelligence; started in 2007 at Mahasarakham
  University, Thailand (19th edition in 2026)
- Run from Mahasarakham University and Zyntelligent in Thailand; held mostly in Southeast and South Asia (Hyderabad
  2023, Pattaya 2024, Ho Chi Minh City 2025), with Halifax, Canada in 2026
- Proceedings in Springer LNAI (2025 in three volumes); 12 pages max in LNCS format, double-blind review
- Hybrid format with online presentation allowed for a lower fee
- Broad general AI scope; 2026 tracks include LLMs, agentic AI and secure edge AI
- Deadlines are usually extended by several weeks; all deadlines are in UTC-12
- Not listed in ICORE2026 (CORE) and not in the CCF artificial intelligence list
