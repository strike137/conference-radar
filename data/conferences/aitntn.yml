notes:
  - Workshop on AI for integrated terrestrial and non-terrestrial (satellite, HAP, UAV) networks
  - 2nd edition at IEEE INFOCOM 2025 in London on May 19, 2025; next held as WS-04 at IEEE GLOBECOM 2026 in Macau
  - Accepted and presented papers go into the IEEE INFOCOM or GLOBECOM workshop proceedings in IEEE Xplore
  - Papers up to 6 pages in IEEE two-column format, submitted via EDAS
  - Chairs from University of Glasgow, Memorial University, Chinese University of Hong Kong and NVIDIA
  - Supported by the one6G association (2025)
  - Not listed in ICORE2026
