notes:
- Small single-track IEEE ComSoc symposium on local and metropolitan area networking; 2026 had 22 papers in four
  technical sessions over two days
- Each edition has a central theme; 2026 theme was integrated networking, sensing and communications for
  next-generation wireless networks
- Papers in IEEE Xplore; 6-page regular papers and 4-page short papers, up to 2 extra pages at 100 USD each
- Also has tutorials (earlier deadline) and posters, demos, PhD forum and an industry session (later deadlines)
- Rotates between North America and Europe (2023 London, 2024 Boston, 2025 Lille, 2026 Tempe); 2020 to 2022 were
  virtual
- ICORE2026 lists it as IEEE LAN/MAN Workshop, rank C
