id: mlbss
name: MLBSS
full_name: International Workshop on Machine Learning and Blockchain for Smart Society
type: workshop
tier: minor
areas: [ai, security, networking]
region: south-asia
language: english
frequency: annual
organizer: Workshop organizers from IIT (BHU) Varanasi, IITRAM Ahmedabad and IIT Jodhpur, held with ICDCN (ISDCN)
organizer_country: [india]
proceedings: ACM DL (ACM ICPS, ICDCN companion volume); the December 2025 edition with IEEE BuildSEC was in IEEE Xplore
archival: true
typical:
  deadline_months: [9, 10]
  conference_months: [1]
links:
  website: https://sites.google.com/view/6thmlbss/home
notes:
- Workshop on AI/ML and blockchain for smart cities, healthcare, transportation, smart grid and their security and privacy
- Usually co-located with ICDCN in India (2022, 2023, January 2025, 2027); the 5th edition in December 2025 ran with IEEE
  BuildSEC'25 at IIT Patna instead
- Papers 4 to 6 pages in ACM format; double-blind review for 2027 (single-blind in December 2025); submission via the
  ICDCN EasyChair
- ICDCN workshop papers appear in the ACM ICPS companion proceedings; ACM open access APC applies to authors outside
  ACM Open institutions
- At least one author must register and present; no-show papers are removed from the proceedings
- Not listed in ICORE2026 and not on the CCF list
