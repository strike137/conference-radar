notes:
- Asian offshoot of the IEEE International Test Conference (ITC), started in Taipei in 2017
- Topics are VLSI and system test (DFT, ATPG, BIST, memory test, fault diagnosis, test for AI, hardware security)
- Regular papers up to 6 pages in IEEE two-column format; at least one full registration per accepted paper
- The 2023 call stated that papers go to IEEE Xplore; technically co-sponsored by the IEEE Computer Society in 2023
- Outstanding papers can be invited in extended form to ITC in the US
- The 2025 edition (9th) was held jointly with ATS 2025 alongside SEMICON Japan at Tokyo Big Sight, with one joint call for papers
- Deadlines are usually extended several times
- Not listed in ICORE2026
