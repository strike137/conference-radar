notes:
- Biennial conference rotating among Estonia, Latvia and Lithuania (Vilnius 2024, Tartu 2026); started in 1994 with support from the VLDB Fund
- Formerly the International Baltic Conference on Databases and Information Systems; renamed to Digital Business and Intelligent Systems after the 2020 edition
- Full research papers of 14 to 16 pages in LNCS format, reviewed by at least three PC members, published in Springer CCIS
- Forum and Doctoral Consortium papers appear in a joint CEUR-WS volume
- Extended versions of selected papers are invited to Informatica, Computer Science and Information Systems and Baltic Journal of Modern Computing
- Topics cover conceptual modelling, business processes, information systems engineering, AI and ML, knowledge graphs, NLP and security risk management
- "CORE (ICORE2026): Regional - Baltic, listed as International Baltic Conference on Databases and Information Systems"
