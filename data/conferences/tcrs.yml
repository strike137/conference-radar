id: tcrs
name: TCRS
full_name: Workshop on Time-Centric Reactive Software
type: workshop
tier: minor
areas: [systems, software]
region: worldwide
language: english
frequency: annual
organizer: TCRS organizers (general chair at Arizona State University), co-located with ESWEEK
organizer_country: [usa]
proceedings: IEEE Embedded Systems Letters special issue (Present-and-publish papers); other papers in distributed workshop proceedings
archival: false
typical:
  deadline_months: [6, 7]
  conference_months: [10]
links:
  website: https://www.tcrs.io/
notes:
- Workshop on models, languages, tools and design methods for time-centric reactive, cyber-physical and distributed systems
- First edition at ACM/IEEE CPS-IoT Week 2023 (San Antonio); co-located with ESWEEK since 2024 (Raleigh 2024, Taipei 2025, Barcelona 2026)
- Submissions go through the IEEE Embedded Systems Letters (ESL) author portal; four pages maximum in the IEEE two-column format
- Two acceptance tiers. Present-and-publish papers appear in the TCRS special issue of IEEE ESL; present-only papers go only into the proceedings distributed at the workshop
- Single-blind review (not double-blind); at least one author must fully register and present
- Two-day workshop in 2026, full-day in earlier editions
- Not listed in the CORE portal (ICORE2026) or the CCF list
