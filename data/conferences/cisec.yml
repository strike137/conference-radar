notes:
- Long-running series on computational intelligence applied to information security, held in China every year (2024 Xiamen, 2025 Nanning, 2026 Guangzhou)
- Acronym changed from CIS to CISec in 2026; 22nd edition in 2026
- Accepted papers published by IEEE, with inclusion in IEEE Xplore subject to scope and quality requirements; CIS 2025 papers indexed in EI Compendex
- Selected extended papers go to SCI/EI indexed journals
- Blind review (authors must not reveal identity); papers up to 6 pages
- "CORE ICORE2026: National: China (listed as CIS); not on the CCF 2026 list"
