notes:
- Annual applications conference of the IEEE Control Systems Society (CSS); started in 2017 (10th edition in 2026)
- Focus on control technology and applications (automotive, aerospace, marine, robotics, energy, cyber-physical systems, learning-based control) with industry sessions and exhibits
- Contributed papers up to 8 pages for review in IEEE two-column format, 6 pages in the final version plus over-length fee; submission via PaperPlaza, reviewed by the CSS Conference Editorial Board
- Authors of recent IEEE Transactions on Control Systems Technology papers can apply to present them at the conference
- Late-breaking results poster track (abstract plus poster, later deadline)
- Location rotates (2023 Bridgetown, Barbados; 2024 Newcastle upon Tyne, UK; 2025 San Diego; 2026 Vancouver; 2027 Hiroshima)
- Not listed in ICORE2026 (control venue outside the CORE computing list); not on the CCF list
