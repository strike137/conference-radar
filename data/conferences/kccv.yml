notes:
- Main domestic computer vision conference in Korea, held every year since 2014 by the Korean Computer Vision Society
  (KCVS); in August since 2020 (2019 was in July at Yonsei University)
- No call for papers of its own; Korean researchers with recent papers at top venues such as CVPR, ICCV, ECCV, NeurIPS
  and ICLR are invited to give oral and poster presentations, so the papers are already published at those venues and
  no KCCV proceedings are listed on the site
- Three-day main conference (COEX Seoul 2020 to 2023, BEXCO Busan since 2024) plus a virtual-only workshop and tutorial
  day (a few days before the main conference since 2024, the day after in 2022 and 2023)
- Keynotes by international researchers, sponsor exhibitions and recruiting booths, mentoring sessions and a Doctoral
  Colloquium
- About 170 presentations and more than 1,300 participants were expected in 2026, which the organizers expected to be
  the largest edition so far
