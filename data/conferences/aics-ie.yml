id: aics-ie
name: AICS
full_name: Irish Conference on Artificial Intelligence and Cognitive Science
type: conference
tier: minor
areas: [ai]
region: europe
language: english
frequency: annual
organizer: Artificial Intelligence Association of Ireland (AIAI) with a rotating Irish host university (UCD 2024, DCU 2025, UCD 2026)
organizer_country: [europe]
proceedings: Springer CCIS (2025, revised selected papers); CEUR-WS (2024)
archival: true
typical:
  conference_months: [10, 12]
links:
  website: https://aics2026.com/
notes:
- Long-running national AI conference of Ireland (33rd edition in 2025), run with the Artificial Intelligence Association of Ireland
- Held in Ireland every year (Dublin in 2024, 2025 and 2026)
- 2025 proceedings in Springer CCIS vol. 2950 as revised selected papers; 2024 proceedings in CEUR-WS Vol-3910
- "AICS 2025: 33 full papers selected from 122 submissions for the CCIS volume"
- Double-blind review; full paper, student paper and NECTAR (previously published work, one-page abstract) tracks in 2026
- 2026 edition held alongside the AI in Science Summit at UCD as an associated event of the Irish EU Council Presidency
- Not listed in CORE ICORE2026
