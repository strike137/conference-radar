id: ecaf
name: ECAF
full_name: European Conference on Algorithmic Fairness
type: conference
tier: minor
areas: [ai]
region: europe
language: english
frequency: annual
organizer: EAAF (European Association for Algorithmic Fairness); local organizers change every year (Ghent University
  2026, Vilnius University 2027)
organizer_country: [europe]
proceedings: PMLR (Proceedings of Machine Learning Research)
archival: true
fee: 300 EUR academia, government and non-profit; 450 EUR industry (2026)
typical:
