  conference_months: [6, 7, 9]
links:
  website: https://2027.ecafconference.org/
notes:
- Formerly EWAF (European Workshop on Algorithmic Fairness, 2022 to 2025); renamed ECAF from the fifth edition in 2026
- Supported and organized by EAAF, the European Association for Algorithmic Fairness
- Interdisciplinary venue for algorithmic fairness covering computer science, law, philosophy and social science, with
  a focus on the European legal and societal context
- Full papers up to 15 pages (double blind) and extended abstracts up to 4 pages, submitted on OpenReview; authors can
  choose archival or non-archival
- Archival papers published as a PMLR volume (Vol. 294 for EWAF 2025, Vol. 350 for ECAF 2026); 2024 proceedings
  went to CEUR-WS
- Also calls for interactive sessions and non-archival posters
- Held in Europe (Zurich 2022, Winterthur 2023, Mainz 2024, Eindhoven 2025, Ghent 2026, Vilnius 2027)
- Not listed in ICORE2026 and not on the CCF list
