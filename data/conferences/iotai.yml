notes:
- Organized by IARIA as part of the DigiTech congress, co-located with other IARIA summer events (first edition in 2024, 3rd in 2026)
- Covers IoT systems combined with AI, including IoT for emergency and disaster management, cognitive IoT, industrial IoT, drones and smart cities
- Published open access in the IARIA ThinkMind library; prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Portugal, Italy, France or Spain so far (Porto, Venice, Nice, Valencia); onsite or online presentation allowed
- Not to be confused with IEEE IoTaIS (International Conference on Internet of Things and Intelligence Systems)
