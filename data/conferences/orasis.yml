id: orasis
name: ORASIS
full_name: ORASIS, Journees francophones des jeunes chercheurs en vision par ordinateur
type: conference
tier: domestic
areas: [vision, ai]
region: europe
language: mixed
frequency: biennial
organizer: AFRIF (Association Francaise pour la Reconnaissance et l'Interpretation des Formes) with a host lab (Vision-AD
  team of LabISEN in 2025, LIS UMR7020 in 2023)
organizer_country: [europe]
proceedings: HAL (online proceedings collection)
archival: false
typical:
  deadline_months: [2]
  conference_months: [5, 6]
links:
  website: https://orasis2025.sciencesconf.org/
notes:
- French-speaking computer vision meeting for young researchers (PhD students and recent PhDs), run by AFRIF every
  two years; 2025 was the 20th edition
- Held in France at a quiet residential venue over four to five days (Saint-Ferreol 2021, Carqueiranne 2023, Le Croisic
  2025)
- Long papers 6 to 8 pages and 2-page short papers (poster), preferably in French, English accepted; already published
  work may also be presented
- Proceedings published online on HAL (46 papers in the ORASIS2025 collection, 51 in ORASIS2023); informal French
  proceedings, so marked non-archival here
- Plenary and poster sessions plus invited talks; aimed at a first experience of submitting and presenting
- Not listed in ICORE2026 and not on the CCF list
