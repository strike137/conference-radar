notes:
- Biennial international conference on geographic information science and spatial data science
- Full papers (about 18 pages) published open access in LIPIcs (Schloss Dagstuhl); short papers and abstracts go to a Zenodo community
- Double-blind review with at least three program committee members per paper (2027 call)
- Recent editions in Poznan (2021, virtual), Leeds (2023), Christchurch (2025) and Shanghai (2027)
- GIScience 2027 at Tongji University is the first edition held in Asia
- First day is for workshops and tutorials, followed by three days of main conference
- Not listed in ICORE2026 or the CCF 2026 list
