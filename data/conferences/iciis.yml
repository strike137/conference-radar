links:
  website: https://iciis2026.iiitm.ac.in/
notes:
- Broad electrical, electronic and computer engineering conference; IEEE Xplore proceedings, papers not presented
  (no-show) are excluded
- Held in Sri Lanka (Kandy or Peradeniya, linked to the University of Peradeniya) or India (Rupnagar in 2018 and 2020,
  Gwalior in 2026)
- 2026 is the 20th edition, at ABV-IIITM Gwalior, India; 2025 (19th) was held in Peradeniya in January 2026
- 2026 has two submission phases with separate deadlines; papers submitted via Microsoft CMT
- Single-blind peer review
- 6 page papers, extra pages charged (1,180 INR each) up to 8 pages
- '2026 tracks: image, signal and AI; embedded systems; communication and IT; power and energy; control and robotics;
  VLSI; RF and photonics; data-driven technologies'
- Not listed in ICORE2026
