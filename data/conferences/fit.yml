notes:
- Jointly organized by IEICE ISS/HCG and IPSJ; held every early September at a university
- 'Two paper types: general papers (2 to 8 pages, no review) and award-candidate papers (4+ pages, members only)
  competing for the Funai Best Paper Award and FIT Paper Award'
- Selected papers can be recommended to IPSJ/IEICE journals
- Presenters can also join the interactive (poster) session at no extra cost; Japanese or English
- Application deadline in May (extended to early June in 2026), final manuscript in June
