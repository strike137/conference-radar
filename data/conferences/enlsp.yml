links:
  website: https://neurips2024-enlsp.github.io/
notes:
- Workshop on efficient training and inference of language, speech and foundation models (compression, distillation, efficient architectures)
- Held with NeurIPS from 2021 to 2024 (ENLSP-I to ENLSP-IV); each edition has its own site (neurips20XX-enlsp.github.io)
- 2024 papers were published in PMLR volume 262; the 2022 and 2023 editions were non-archival with papers hosted on the website
- Best paper and best poster awards from industry sponsors
- Not listed in ICORE2026 and not on the CCF list
