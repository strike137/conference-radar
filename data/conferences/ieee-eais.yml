notes:
- Conference on evolving and adaptive intelligent systems, such as online and lifelong learning, data streams and concept drift
- Held every two years since 2018 (2018 Rhodes, 2020 virtual, 2022 Larnaca, 2024 Madrid, 2026 Pisa); annual before 2018
- Grew out of earlier workshops on evolving fuzzy systems (EFS 2006, GEFS 2008, ESDIS 2009, EIS 2010)
- Papers up to 8 pages plus at most 2 extra pages in IEEE format; accepted papers go to IEEE Xplore
- Selected papers are invited to a special issue of the Springer journal Evolving Systems
- Not listed in ICORE2026 or the CCF 2026 list
