notes:
- Co-located workshop of Financial Cryptography and Data Security (FC) since CoDeFi 2020; 2026 was the 7th edition
- Covers technology, operation, regulation and governance of permissionless blockchains and DeFi, linked to the
  Blockchain Governance Initiative Network (BGIN)
- Mixes paper presentations with talks from regulators and industry, a joint session with WTSC and round tables
- Regular papers up to 15 pages in LNCS format excluding references and appendices, short papers up to 8 pages,
  double-blind review via EasyChair
- Revised papers appear in the FC workshops volume of Springer LNCS (2025 -> LNCS 15754, shared with FinTeAchin and
  Voting)
- Deadlines have been extended (2025 from Dec 31 to Jan 25, 2026 from Dec 20 to Dec 31)
- Held at the FC venue, which rotates worldwide (2025 Miyakojima, Japan; 2026 St. Kitts; 2027 Barbados)
