notes:
- Workshop on dependable and secure agentic AI through compositional design (verified orchestration, fault tolerance, runtime assurance, secure agent communication)
- First edition in 2026, co-located with IEEE/IFIP DSN 2026 in Charlotte; shared a room with the RASACC workshop on the workshop day
- Regular papers 8 pages, short or position papers 4 pages, vision papers up to 15 pages; IEEE Computer Society two-column format
- Double-blind review for regular research papers; submission via the DSN 2026 EasyChair
- DSN workshop papers are published in the DSN-W supplemental volume on IEEE Xplore
- Not listed in CORE ICORE2026
