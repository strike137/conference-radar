notes:
- Organized by GI SIG SIDAR (German Informatics Society) since 2004; proceedings in Springer LNCS
- Focus on intrusion detection, malware analysis and vulnerability assessment
- Two cycles (December and February); double-blind; rejected Cycle 1 papers cannot go to Cycle 2
- 'Held in Europe every summer (usually July): Graz (2025), Chania (2026); small event with comparatively low fees'
- CORE B, CCF C; about 25 full papers per year
