notes:
- 1st edition was a half-day workshop co-located with ACM SIGCOMM 2025 in Coimbra, Portugal
- Topics are open, federated and AI-driven 6G testbeds, Open RAN, open-source toolkits and shared open data
- Papers up to 6 pages including references and appendices in ACM SIGCOMM format, submitted via HotCRP
- SIGCOMM 2025 workshop papers go into the conference proceedings in the ACM Digital Library unless authors opt out
- 2025 program had five papers, a keynote and a panel
- Not among the ACM SIGCOMM 2026 workshops; no later edition found
