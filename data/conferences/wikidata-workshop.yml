notes:
- One-day workshop on research using and about Wikidata, held with the International Semantic Web Conference (ISWC)
- Started in 2020; editions in 2020, 2021, 2022, 2023, 2025 and 2026 (no edition in 2024)
- Proceedings in CEUR-WS (2020 Vol-2773, 2021 Vol-2982, 2022 Vol-3262, 2023 Vol-3640, 2025 Vol-4108)
- Two tracks; Novel Work papers are single-blind reviewed by at least two reviewers and published in CEUR-WS (authors may opt out)
- Previously Published Work track lets authors present papers from other venues; these are not included in the proceedings
- Full and resource papers 8 to 12 pages, short papers 3 to 5 pages, in-use and demo papers 6 to 8 pages, excluding references; CEURART format
- 2026 edition emphasised Wikidata and generative AI (LLM grounding, RAG, agents)
- Not listed in ICORE2026 and not on the CCF list
