region: europe
language: english
frequency: annual
organizer: University of Napoli Federico II (Giovanni Stanco, Stefania Zinno)
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [8]
  conference_months: [10]
links:
  website: https://sites.google.com/view/iwnc-2026/home-page
notes:
- Co-located with IEEE/IFIP CNSM since the 1st edition (Prague 2024, Bologna 2025, Alcala de Henares 2026)
- Wireless networking meets computing (O-RAN, MEC, in-network computing, AI/ML for wireless, federated learning, 5G/6G)
- Papers up to 6 pages in IEEE two-column format including references; submission via EDAS
- Papers go into the CNSM workshop proceedings, which CNSM submits to IEEE Xplore
- Small workshop; one 90-minute session with three papers in the 2026 program
