notes:
- Community-run Security BSides conference in Copenhagen, Denmark, run by a membership association; launched in 2019
- Held at the IT University of Copenhagen (ITU) from 2019 to 2025 (2020 and 2021 as live streams); moved to Bella Center in 2026
- Talks are chosen by blind CFP review; sponsors get no stage slots or participant data
- Talk videos from past years are published on Vimeo
- 2026 tickets were almost sold out by October 2026, with no student discounts
- No proceedings
