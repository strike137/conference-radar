notes:
- EAI conference on cognitive computing (AI, machine learning, edge AI) and cyber-physical systems
- Proceedings in Springer LNICST (6th edition 2025, 27 full papers from 110 submissions)
- Held at the ECE department of Vishnu Institute of Technology, Bhimavaram, India since 2022; 2020 and 2021 were virtual
- Short review cycle in 2025, about one week from submission deadline to notification
- Extended versions can be fast-tracked to EAI Endorsed Transactions journals for an extra fee
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
