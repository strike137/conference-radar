notes:
- Indian series run by mathematics departments of NITs; 2020 and 2021 editions online from NIT Jamshedpur, 2024
  hybrid at NIT Jamshedpur, 2025 at NIT Rourkela, 5th edition at NIT Warangal (2026); no 2022 or 2023 edition
- Proceedings in Springer CCIS since 2021 (the 2020 volume was in Springer LNEE); up to 16 pages in CCIS format,
  anonymous submission, plagiarism limit 20%
- Separate call for 3-page extended abstracts (presentation only, not in proceedings); some papers not taken for
  the proceedings may be invited to a journal (TMSCE)
- Strong cryptography flavour (post-quantum, protocols, blockchain); listed on the IACR calendar
- Deadlines are usually extended by one to two months
