notes:
- Annual conference of Ada-Europe on reliable and high-integrity software, held in June in a different European city each year (Lisbon 2023, Barcelona 2024, Paris 2025, Vasteras 2026, Berlin 2027)
- Journal track papers are submitted directly to a special issue of the Journal of Systems Architecture (Elsevier) and presented at the conference
- Regular track papers (up to 16 pages) are published in the open-access Dagstuhl OASIcs series
- Industrial and work-in-progress tracks publish in the Ada User Journal; also tutorials, satellite workshops and a vendor exhibition
- Topics include high-integrity and safety-critical systems, real-time and embedded systems, formal methods, Ada, SPARK and Rust, and AI for critical systems
- Springer LNCS proceedings up to 2018, then journal-track only before the OASIcs regular track was added
- Listed as Journal Published in ICORE2026
