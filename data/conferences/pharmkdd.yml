notes:
- Half-day KDD workshop on data mining and AI for drug discovery and development (molecule design, foundation models, real world evidence, in-silico trials)
- Short papers up to 5 pages in the ACM two-column template; double-blind, at least two reviewers, submitted via EasyChair
- In-person presentation required; all accepted papers get posters and some get oral or spotlight slots and best paper awards
- Per the KDD policy, accepted papers are not included in proceedings or any form of publication
- Only the 2025 edition (with KDD 2025, Toronto) was found; not in the KDD 2026 workshop list
- Not listed in ICORE2026 and not on the CCF list
