notes:
- Workshop on testing, security analysis, verification and maintenance of firmware, with a focus on UEFI and the TianoCore EDK II ecosystem
- First edition in 2026 with SPLASH/ISSTA 2026 in Oakland, California; organized as part of the NSF-funded TianoShield project (2025 to 2027)
- Chairs from Purdue University; follows the FirmVuln26 workshop held at VulnCon26 in April 2026
- Technical papers up to 18 pages, industry reports 12, short papers 8, tool papers 5, extended abstracts 4; ACM acmsmall single-column format, double-blind, HotCRP
- Accepted papers are published open access by ACM (article processing charges may apply); in-person presentation required
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
