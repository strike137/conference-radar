notes:
- Annual since 2007 on information science and information systems engineering (requirements, conceptual modelling, process mining, enterprise modelling, data science)
- Steering committee of European researchers (Paris 1, Geneva, UPC, Essex, Minho, Stockholm and others)
- Always held in Europe; recent editions Corfu (2023), Guimaraes (2024), Seville (2025), Toulouse (2026), next in Athens (2027)
- Main proceedings in Springer LNBIP (LNBIP 585 for 2026, LNBIP 513 and 514 for 2024); best papers invited to Data and Knowledge Engineering (DKE)
- Mandatory abstract one week before the full paper; papers up to 16 pages in Springer format including references; single-blind review via EasyChair
- Also runs Forum, Doctoral Consortium, Research Projects, Journal-First, tutorial and workshop tracks with a later deadline
- CORE B (ICORE2026); not on the CCF list
