notes:
- Annual European conference on information science and information systems engineering, running since 2007 (20th edition in 2026)
- Research papers in Springer LNBIP; Forum, Doctoral Consortium and Research Projects papers in a separate LNBIP volume
- Mandatory abstract one week before the paper deadline, all deadlines AoE
- Held in Europe every year (Limassol 2021, Barcelona 2022, Corfu 2023, Guimaraes 2024, Seville 2025, Toulouse 2026, Athens 2027)
- 2026 edition in Toulouse had joint sessions with the French INFORSID conference
- CORE B (ICORE2026)
