notes:
- One-day workshop on lightweight and efficient cryptography, post-quantum implementations, IoT and edge privacy
- 2026 (7th edition) is an official affiliated event of IACR CHES 2026, held on the opening day of CHES in Antalya
- Organized by Akdeniz University and the IACR, with TÜBİTAK 2223-B funding support
- Double-blind review; papers up to 20 pages in LNCS format; post-workshop proceedings in Springer LNCS, pre-proceedings for attendees
- Separate poster session with its own later deadline
- Earlier editions 2011, 2013, 2014 and 2016 in Türkiye (İstanbul, Gebze, Aksaray), 2015 in Bochum, Germany, and 2025 in İstanbul
