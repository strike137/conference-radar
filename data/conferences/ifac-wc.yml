links:
  website: https://ifac2026.org/
notes:
- Flagship event of IFAC, held every three years since 1960 with 3,000 to 4,000 participants; no other IFAC event is
  held in a World Congress year
- Covers all areas of automatic control theory and applications
- Hosted by a different country each time (2011 Milan, 2014 Cape Town, 2017 Toulouse, 2020 Berlin, 2023 Yokohama,
  2026 Busan, 2029 Amsterdam)
- Final papers are limited to 6 pages (survey papers 12) with no extra page charges; submission via IFAC PaperPlaza
- Accepted regular, invited, survey, demonstration and tutorial papers appear in the open access IFAC-PapersOnLine
  series on ScienceDirect; late-breaking/discussion and dissemination papers appear in the preprints only
- Journal option lets authors submit the same paper to a participating IFAC journal with an earlier deadline
- Not listed in ICORE2026 (control venue outside the CORE computing list); not on the CCF 2026 list
