notes:
- Brazilian workshop on sustainable high performance computing, a satellite event of SSCAD; first edition in 2026
- Topics include energy efficiency in HPC and AI, energy and carbon aware scheduling, data center sustainability, approximate computing and sustainable cloud computing
- Papers in Portuguese or English, up to 8 pages plus references in the SBC template, submitted via JEMS3 and reviewed by the program committee
- Accepted papers are published in the Anais Estendidos (extended proceedings) of SSCAD on SBC OpenLib (SOL)
- Presentation in person or remote
- Not ranked in CORE ICORE2026
