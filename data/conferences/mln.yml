notes:
- Small annual conference on machine learning for networks and networks for AI, held since 2018
- Held in France, mostly Paris (virtual in 2020 and 2021, Reims in 2024)
- Revised selected papers in Springer LNCS after the event (LNCS 11407 for 2018 to LNCS 16424 for 2025)
- 2026 edition has two submission rounds; registration forms are sent by email to the TPC chair
- Selected papers considered for a journal special issue (MDPI Machine Learning and Knowledge Extraction for 2026)
- 2019 edition was technically co-sponsored by IFIP WG 6.2
- Not listed in CORE ICORE2026 or the CCF 2026 list; the mlnlp entry is a different venue
