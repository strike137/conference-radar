notes:
- Long-running standalone workshop on applied imagery, computer vision and pattern recognition (54th edition in 2026)
- Held at George Washington University, Washington DC; audience from academia, industry and government (national security, geospatial, medical imaging)
- Abstract-based submission via Springer Meteor; full paper due after the workshop for the proceedings
- Proceedings in Springer LNCS since 2025; earlier editions were IEEE AIPR with IEEE proceedings
- Each year has a theme (2025 and 2026 on imagery challenges in generative AI and large language models)
- Not listed in CORE ICORE2026 or the CCF list
