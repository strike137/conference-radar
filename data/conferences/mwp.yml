notes:
- Premier international forum for microwave photonics (interaction of optical and radio waves for microwave, mmWave
  and THz signals, radio over fiber, photonic radar and sensing)
- Annual, rotating worldwide; 2026 in Matsue was the first in-person MWP in Japan since Sapporo 2014 (MWP 2020
  Matsue was held online)
- "2026 edition: organized and sponsored by IEICE, technically co-sponsored by IEEE MTT-S and IEEE Photonics Society"
- Contributed papers of 2 to 4 pages in IEEE format; accepted papers go to the IEICE proceedings archive and IEEE
  Xplore
- Small single-track style program (59 presentations in 2026) with a post-deadline session and five Best Student
  Paper Awards
- Journal of Lightwave Technology runs a special issue open to extended MWP papers
- Not listed in CORE ICORE2026
