notes:
- European RISC-V community summit run by RISC-V International with a European steering committee
- Started in 2023 as a merger of Red-RISC-V (Spain), RISC-V Week (France) and the German RISC-V workshop
- Mix of industry, research and academia; keynotes, plenary talks, posters, demos and an expo
- Two-page extended abstracts, blind (preferred) or non-blind review; most accepted contributions become posters, some selected for talks
- Accepted abstracts, slides and posters are posted on the event website only; no formal proceedings
- At least one author must register for the core conference days
- Editions so far -> Barcelona 2023, Munich 2024, Paris 2025, Bologna 2026
