notes:
- Long-running AAMAS workshop on adaptive and learning agents and multi-agent systems (reinforcement learning, multi-agent learning, game theory)
- 2026 edition held with AAMAS 2026 in Paphos, Cyprus; the series is in its eighteenth year
- Two-day workshop, in person only in line with AAMAS
- Double-blind review on OpenReview; up to 8 pages in ACM (AAMAS) format, 6-page work-in-progress and 2-page abstracts of recent journal papers
- Accepts work accepted only as a poster or extended abstract at AAMAS
- Camera-ready papers posted on the workshop website with the AAMAS copyright block removed
- ALA 2025 extended papers were eligible for a special issue of the Springer journal Neural Computing and Applications
- Best paper award each year
- Not listed in ICORE2026 or the CCF list
