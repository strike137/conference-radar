notes:
- Annual conference of IFIP Working Group 11.9 on Digital Forensics, running since 2005 (23rd edition in 2027)
- Usually held in early January; New Delhi, India since 2024 (also 2020), Arlington, USA in 2023, virtual in 2021 and 2022
- Revised papers appear after the event as the Advances in Digital Forensics volume in Springer IFIP AICT
- Small and discussion oriented (limited to about 100 participants in 2027); papers and panel proposals are both solicited
- Submissions up to 30 pages double spaced via EasyChair, with a cover page listing the authors (not anonymized)
- From 2027, extended versions of outstanding papers are published in Computers and Security (Elsevier)
- CCF C (listed as IFIP WG 11.9); not found in the CORE ICORE2026 portal
