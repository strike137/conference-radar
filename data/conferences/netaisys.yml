notes:
- Workshop on integrating AI with networked and edge systems, co-located with ACM MobiSys every year since 2023 (Helsinki
  2023, Tokyo 2024, Anaheim 2025, Cambridge UK 2026)
- Run jointly with the EnvSys workshop on environmental sensing (combined program)
- Full papers and position papers up to 6 pages including references go to the ACM Digital Library (MobiSys workshops
  proceedings); 2-page work-in-progress and demo abstracts appear only on the workshop website
- Single-blind review; MobiSys format
- Small program (six NetAISys papers in 2025, five papers in a half-day 2026 session)
- Not listed in the CORE portal (ICORE2026)
