notes:
- Formerly the IEEE North Atlantic Test Workshop (NATW, 1st to 29th editions up to 2020); renamed MDTS from the 30th edition in 2021
- Regional IEEE symposium co-sponsored by IEEE Region 1 and the IEEE Schenectady Section; academic and industry mix (IBM, onsemi, Cadence, Marvell)
- Covers testing, EDA, yield, hardware security, reliability, analog/mixed-signal/RF, nanoelectronics, AI in electronics and packaging
- Six-page full papers or two-page extended summaries in IEEE two-column format; at least one author must register and present
- Accepted full papers presented at the symposium may opt in to IEEE Xplore after the event; extended summaries are not considered for Xplore
- Selected papers invited to the Journal of Electronic Testing (JETTA)
- Has a Best Student Paper Award and dedicated student sessions
- Held every May at the Crowne Plaza Albany (The Desmond Hotel) in Albany, New York since 2023; virtual in 2021 and 2022
- Not listed in the CORE ICORE2026 portal or the CCF list
