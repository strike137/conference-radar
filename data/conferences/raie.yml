links:
  website: https://conf.researchr.org/home/icse-2026/raie-2026
notes:
- One-day ICSE workshop on engineering responsible and trustworthy AI systems, including LLM-based systems and AI governance
- 4th edition in 2026 (Lisbon 2024, Ottawa 2025, Rio de Janeiro 2026)
- Full research or experience papers up to 8 pages, short papers up to 4 pages, extended abstracts up to 5 pages, IEEE conference format
- Single-anonymous review in 2026
- 2025 papers published in IEEE Xplore with the other ICSE 2025 workshops
- Steering committee from CSIRO's Data61, Polytechnique Montreal and Fraunhofer IAIS; 2026 co-chairs from CSIRO and NIST
- Not listed in CORE ICORE2026 or the CCF list
