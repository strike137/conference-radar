organizer: RAIE organizing committee (co-located with ICSE); chairs mainly from CSIRO's Data61, Australia
organizer_country: [australia]
proceedings: IEEE Xplore (ICSE workshop proceedings)
archival: true
typical:
  deadline_months: [11]
