notes:
- Run by the Finland-based Open Innovations Association FRUCT; held twice a year (spring and November)
- Accepted full papers go to IEEE Xplore and the open access FRUCT proceedings (ISSN 2305-7254); weaker
  papers may be moved to a separate Work-in-Progress volume that is not in IEEE Xplore
- Broad ICT scope (AI, NLP, IoT, wireless and 5G, security, e-health, smart spaces); single-blind review
- Usually in Finland (Helsinki, Tampere) with some editions elsewhere in Europe (Riga 2023, Kufstein 2025,
  Zilina 2023 and 2027); hybrid with online presentation allowed
- Acceptance rate about 40% in most editions; an early-bird review round replaces deadline extensions
- "CORE ICORE2026 rank: Regional; rated JUFO 1 (Finland), NSD 1 (Norway), BFI 1 (Denmark)"
- Low registration fee compared with similar IEEE-indexed venues
