id: incit
name: InCIT
full_name: International Conference on Information Technology
type: conference
tier: minor
areas: [general, ai, data, networking, security, software]
region: southeast-asia
language: english
frequency: annual
organizer: 'IEEE Thailand Section (IEEE Computer Society Thailand Chapter) and the Association of Council of IT Deans
  of Thailand, with a rotating Thai host (2025: College of Computing, Prince of Songkla University)'
organizer_country: [thailand]
proceedings: IEEE Xplore; selected papers invited to ECTI-CIT and Technical Journal (Tehnicki glasnik)
archival: true
indexing: [IEEE Xplore]
rank:
  core: Unranked
fee: 'Author onsite 18,000 THB early / 20,500 THB regular for non-IEEE members (2025); online and student rates lower'
typical:
  deadline_months: [3, 4, 8]
  conference_months: [11]
links:
  website: https://incit2025.computing.psu.ac.th/
notes:
- Thai international IT conference (9th edition in 2025) co-organized by the IEEE Thailand Section and the Association
  of Council of IT Deans of Thailand; host university and city change every year
- Recent cities 2022 Nonthaburi, 2023 Chiang Rai, 2024 Chonburi, 2025 Phuket; held in November
- IEEE Xplore proceedings; up to 8 pages in IEEE format; double-anonymous review (2025)
- Two submission rounds; the second round also takes revised versions of papers rejected in the first round
- Hybrid format with online presentation and lower online fees (2025)
- Broad topics including AI and data science, networks and communications, information forensics and security, NLP
