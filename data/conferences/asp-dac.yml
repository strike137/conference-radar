notes:
- Started in 1995; describes itself as the largest conference on electronic design automation (EDA) for VLSI and
  systems in the Asia and South Pacific region; sister conference of DAC, ICCAD and DATE
- Held every January; by its bylaws the location alternates between Japan and other countries or areas in the region
  (Tokyo 2023, Incheon 2024, Tokyo 2025, Hong Kong 2026, Tokyo 2027)
- Topics include EDA, logic and physical design, test and verification, embedded and CPS systems, AI hardware and
  hardware security
- Double-blind review; 6 pages plus 1 page of references; abstract registration one week before the full paper
  deadline (5 PM AoE)
- Papers go to the ACM Digital Library and IEEE Xplore; ACM is fully open access, so authors outside ACM Open
  institutions may pay an APC
- Accepted papers must be presented on site by an author; each paper needs a separate speaker registration
- Also has a Designers' Forum, a University Design Contest, special sessions and tutorials
- ICORE2026 rank B; CCF C
