notes:
- Workshop on aligning AI with diverse and conflicting human values; mixes machine learning, HCI, philosophy, social science and policy
- Held with NeurIPS 2024 (Vancouver) and ICML 2026 (Seoul); the site lists no 2025 edition
- Non-archival; accepted papers are posted on the workshop website and OpenReview
- Papers of 4 to 8 pages in ICML format, double-blind with at least three reviewers; position and policy papers welcome
- Not listed in ICORE2026 and not on the CCF list
