notes:
- Brazilian workshop on software engineering for functional programming, for academia and industry; held since 2025, 2nd edition in 2026
- Co-located with CBSoft (Recife 2025, São Paulo at IME-USP 2026)
- Research papers up to 5 pages plus 1 page of references, industry papers up to 3 pages plus 1, CBSoft ACM-like template, Portuguese or English
- Double-blind review with at least three PC members; submission via JEMS
- Proceedings published in SBC OpenLib (SOL) as part of the CBSoft proceedings
- Not listed in CORE ICORE2026
