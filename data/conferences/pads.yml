notes:
- Flagship conference of ACM SIGSIM (formerly Parallel and Distributed Simulation); 40th edition in 2026
- Covers modeling and simulation methods, simulation infrastructure, digital twins and applications such as cybersecurity and networks
- Two-phase submission (first and second call); first-call papers can get revision feedback and resubmit to the second call
- Papers appear in the ACM Proceedings of SIGSIM PADS; selected papers go to a TOMACS special issue instead
- Usually held in the USA (2021 Suffolk VA, 2022 virtual, 2023 Orlando, 2024 Atlanta, 2025 Santa Fe); 2026 in Vienna, Austria
- 2027 edition is part of ACM FCRC 2027 in Atlanta
- Optional artifact evaluation with ACM badges; PhD colloquium with travel grants
