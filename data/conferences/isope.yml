notes:
- Organized by the IEEE Digital Privacy Initiative; first edition in 2025, follows a 2024 Digital Privacy Workshop at Carnegie Mellon University
- Held in New York City (2025, and Club 101 on Park Avenue in 2026); mix of practitioners, researchers and policymakers
- Two-step call; 1,000-word abstracts for in-person presentations, then optional extended abstracts (up to 4 pages, IEEE template) after the event
- Abstracts of non-paper presentations appear as open access front matter in the IEEE Xplore proceedings
- Not ranked by CORE and not on the CCF list
