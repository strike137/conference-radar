id: icmlt
name: ICMLT
full_name: International Conference on Machine Learning Technologies
type: conference
tier: minor
areas: [ai]
region: europe
language: english
frequency: annual
organizer: Commercial conference secretariat (contact icmlt_conf@163.com, iconf.org submission system) with a host university that changes each year
organizer_country: [china]
proceedings: IEEE Xplore (2025, 2026); ACM DL (ACM ICPS) 2018 to 2024
archival: true
indexing: [EI, Scopus]
fee: 700 USD per author registration (2027, regular; 650 USD early bird); 500 USD presentation only
typical:
  deadline_months: [12]
  conference_months: [5]
links:
  website: https://www.icmlt.org/
notes:
- Annual since 2016; virtual in 2021 and 2022, then Stockholm 2023, Oslo 2024, Helsinki 2025, Berlin 2026 and Stockholm 2027
- Proceedings in ACM ICPS (ACM DL) up to 2024 and in IEEE Xplore for 2025 and 2026, stated as EI Compendex and Scopus indexed
- Run by a commercial conference secretariat (163.com contact address); 2026 co-sponsored by IEEE and IICCI, 2027 co-organized by Dalarna University
- Hybrid format with onsite and online sessions; presentation only registration without publication is also offered
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
