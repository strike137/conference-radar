notes:
- Workshop on trustworthy AI from a human-centred perspective (risk management, assessment, ethical and legal requirements, EU AI Act)
- First edition at ECAI 2025 (Bologna, October 2025), second at IJCAI-ECAI 2026 (Bremen, two days)
- Accepted short papers (5-9 pages) published in CEUR Workshop Proceedings (Vol-4132 for 2025, Vol-4254 for 2026); position papers (2-4 pages) only on the workshop website
- Single-blind review with three reviewers per submission
- 45 submissions received for 2026
- Supported by the EU Horizon Europe project THEMIS 5.0
- Closing session of 2026 pointed to a next edition at ECAI 2027 in Athens (not yet confirmed)
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
