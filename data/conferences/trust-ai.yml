notes:
- Workshop on trustworthy AI from a human-centred and risk management perspective, including the EU AI Act
- Co-located with the main European AI conference (ECAI 2025 in Bologna, IJCAI-ECAI 2026 in Bremen)
- Two paper types, position papers (2 to 4 pages) and short papers (5 to 9 pages), single-blind review by three reviewers
- Short papers published in CEUR-WS (2025 -> Vol-4132, 2026 -> Vol-4254); position papers only on the workshop website
- "2025: 60 submissions, 37 short papers and 8 position papers accepted"
- "2026: 45 submissions"
- Registration goes through the host conference
- Not listed in CORE ICORE2026 and not on the CCF list
