notes:
- Workshop held with ACM SIGMOD/PODS 2026 in Bengaluru, India; 2026 appears to be the first edition
- 'Scope: data systems for finance, fraud detection, financial knowledge graphs, privacy-preserving ML, agentic payment systems'
- Full research papers 8 pages, short or vision papers 4 pages, ACM sigconf format, submitted via OpenReview
- Double-anonymous review following SIGMOD/PODS anonymity rules
- Every accepted paper gets an oral slot and a poster; papers are non-archival and posted on the workshop website
- Organized by Mastercard AI Garage with IIT Delhi (Srikanta Bedathur, Sayan Ranu)
- Not listed in ICORE2026 and not on the CCF list
