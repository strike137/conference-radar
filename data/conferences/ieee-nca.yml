notes:
- Symposium on network, cloud and distributed computing sponsored by the IEEE Computer Society; 24th edition in 2026
- Proceedings in IEEE Xplore; NCA 2026 selected papers invited to a special issue of Elsevier Future Generation
  Computer Systems
- Long held in Cambridge, MA (USA) through 2019; online in 2020 to 2022 and 2024; recent editions in Lisbon (2025)
  and Syracuse, Italy (2026)
- No edition in 2023
- Double-blind review for regular papers (2026); submissions via EDAS; poster, demo, PhD forum and workshop tracks
- At least one author must attend in person and present (2026)
- CORE B; not on the CCF list
