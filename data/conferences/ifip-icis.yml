links:
  website: http://www.intsci.ac.cn/ICIS/
notes:
- IFIP TC 12 conference on the nature of intelligence, linking brain science, cognitive science and AI; held every two years in China
- Website run by the Key Laboratory of Intelligent Information Processing, ICT, Chinese Academy of Sciences (Zhongzhi Shi)
- 2026 edition (7th) sponsored by the International Academy of Information Studies China Group and organized by Beijing Jiaotong University
- Proceedings in Springer IFIP AICT as Intelligence Science I, II, ... (ICIS 2024 -> Intelligence Science V, IFIP AICT 720)
- "Small venue: ICIS 2024 accepted 23 full and 2 short papers out of 32 submissions"
- Papers up to 15 pages in Springer LNCS format plus a cover page, submitted via EasyChair
- Not in ICORE2026 and not on the CCF list
