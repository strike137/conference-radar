full_name: International Conference on Intelligence Science
type: conference
tier: minor
areas: [ai]
region: china
language: english
frequency: biennial
organizer: IFIP TC 12 with the International Academy of Information Studies (China Group) and a local Chinese university
organizer_country: [china]
proceedings: Springer IFIP AICT (Intelligence Science series)
archival: true
indexing: [EI, Inspec]
typical:
  deadline_months: [5]
