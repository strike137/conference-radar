links:
  website: https://icwt-seei.org/2026/
notes:
- Annual conference of the School of Electrical Engineering and Informatics at ITB (Bandung); 2026 was the 12th edition
- Held in a different Indonesian city every year (2021 Bandung, 2022 Yogyakarta, 2023 Solo, 2024 Batam, 2025 Lampung,
  2026 Bali)
- Proceedings of ICWT 2020 to 2025 are in IEEE Xplore and indexed by Scopus; only registered and presented papers are
  submitted to IEEE Xplore (no-shows excluded)
- 4 to 6 page IEEE-format papers in English, submitted via EasyChair
- Broad scope despite the name, from telematics, IoT, SDN and security to antennas, radar, satellite, biomedical
  engineering and AI
- Deadlines were extended in both 2025 (by two months) and 2026 (by two weeks)
- Not in ICORE2026 or the CCF list
