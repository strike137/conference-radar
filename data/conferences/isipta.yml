notes:
- Flagship symposium of SIPTA, the society for imprecise probability (credal sets, lower previsions, belief functions)
- Held every odd year since 1999; called the International Symposium on Imprecise Probabilities and Their
  Applications before 2005
- Proceedings in PMLR since 2017 (vol. 290 for 2025, vol. 215 for 2023)
- Recent editions all in Europe (Pescara 2015, Lugano 2017, Ghent 2019, Granada 2021, Oviedo 2023, Bielefeld 2025)
- Not listed in CORE ICORE2026
