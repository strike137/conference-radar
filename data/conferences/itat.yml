notes:
- Annual Slovak conference since 2001, run as a bundle of workshops in a mountain hotel in Slovakia, aimed at young researchers and PhD students
- Workshops in 2026 were Applied Security (WAS), Computational Aspects of Large-Scale Problems in Discrete Mathematics (CADM), Automata, Formal and Natural Languages (WAFNL), Natural Computing (WNC) and Computational Intelligence and Data Mining (IWCIDM)
- Each workshop sets its own deadlines and runs its own review (usually two reviewers per paper)
- Regular papers appear in the ITAT proceedings in CEUR Workshop Proceedings, indexed in Scopus; overview and work-in-progress abstracts go to a separate volume outside CEUR
- Registration includes hotel and full board (2026 early fee 520 EUR full, 465 EUR students for four nights; cheaper two or three night workshop options and online rates)
- Not listed in CORE ICORE2026
