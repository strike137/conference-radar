notes:
- AI practitioner conference of the Taiwan AI Academy (AIA), held every year since 2018; 2026 was the ninth edition
- Held at the Humanities and Social Sciences Building, Academia Sinica, Taipei
- Invited keynotes, panels and parallel session talks on enterprise AI use, governance and technical case studies;
  no call for papers and no proceedings
- Mostly Mandarin talks; the 2026 programme listed 24 talks in Mandarin and 1 in English
- About 1,500 attendees expected in 2025 (about 70% from industry, government and academia, 30% students, per the
  organizer)
- 2025 was two days (Sep 9-10); 2026 was a single day (Aug 18)
- Not listed in the CORE portal (ICORE2026)
