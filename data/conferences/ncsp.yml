id: ncsp
name: NCSP
full_name: RISP International Workshop on Nonlinear Circuits, Communications and Signal Processing
type: conference
tier: minor
areas: [communications, general, ai]
region: worldwide
language: english
frequency: annual
organizer: RISP (Research Institute of Signal Processing, Japan)
organizer_country: [japan]
proceedings: None (participants only)
archival: false
fee: 75,000 JPY non-member onsite early, 65,000 JPY RISP member onsite early, 40,000 JPY student onsite early, 35,000
  JPY virtual (25,000 JPY student virtual) (2026)
typical:
  deadline_months: [11, 12]
  conference_months: [2, 3]
links:
  website: https://www.ncsp.jp/NCSP26/
notes:
- Run by the Research Institute of Signal Processing (RISP), Japan, in cooperation with the Acoustical Society of
  Japan
- Submission is a 1-page summary; accepted authors then submit a 4-page final paper for the workshop proceedings
- The call explicitly encourages students to present preliminary results not yet ready for journals; treated here
  as non-archival
- Proceedings are a download for registered participants and authors; award papers were recommended to a special issue
  of the RISP Journal of Signal Processing (2020, 2022)
- Held around late February to early March, mostly in Honolulu, Hawaii (2023, 2024, 2026); 2025 was in Penang,
  Malaysia and 2021 and 2022 were fully online
- Hybrid format with a separate online session day; many participants are students from Japanese universities
- Student paper awards for first-author students with a 4-page paper and an oral presentation
- Not listed in ICORE2026 or the CCF list
- Registration fee is paid in JPY by bank transfer only and is non-refundable
