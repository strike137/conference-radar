notes:
- Biennial neural engineering conference of the IEEE Engineering in Medicine and Biology Society (EMBS); sibling of EMBC
- Covers neurotechnology, brain-computer interfaces and neural interfaces, for engineers, neuroscientists and clinicians
- Full contributed papers (up to 6 pages, IEEE format) are peer reviewed and published in IEEE Xplore; late-breaking one-page abstracts are selected for posters and demos
- NER 2025 in San Diego had over 660 attendees and over 200 proceedings papers
- Held in San Diego in 2025 and at Politecnico di Milano in 2027
- Not listed in CORE ICORE2026 or the CCF 2026 list
