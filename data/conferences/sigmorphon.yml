notes:
- Annual workshop of the ACL special interest group on computational morphology, phonology and phonetics
- Co-located with ACL-family conferences (ACL 2023 Toronto, NAACL 2024 Mexico City, NAACL 2025 Albuquerque)
- 22nd edition held at NAACL 2025 in Albuquerque, USA, on May 3, 2025
- Proceedings in the ACL Anthology
- Long papers up to 8 pages and short papers up to 4 pages; anonymous review; ARR-reviewed papers accepted
- Known for its shared tasks (morphological reinflection, grapheme-to-phoneme); 2025 replaced shared tasks with a panel on the future of the field after low submission numbers
- Not ranked in ICORE2026 and not on the CCF list
