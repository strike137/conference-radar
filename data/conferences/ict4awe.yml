notes:
- Organized by INSTICC; proceedings in the SCITEPRESS Digital Library, a short list of revised and extended papers may go to a Springer CCIS book
- Covers ICT for ageing well, digital health, telemedicine and independent living (ambient assisted living)
- CORE C (ICORE2026); regarded as a minor venue
- Two submission stages (1st stage gives an earlier notification), plus late-breaking papers and an abstracts track
- Started in 2015 as ICT4AgeingWell; renamed ICT4AWE in 2016
- Held in European cities (Prague 2023, Angers 2024, Porto 2025, Benidorm 2026, Rome 2027), online in 2021 and 2022, and co-located with other INSTICC conferences with free cross access as a non-speaker
