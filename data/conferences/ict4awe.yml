notes:
- Organized by INSTICC; papers in the SCITEPRESS Digital Library, with a planned Springer CCIS book of revised and extended selected papers
- CORE C (ICORE2026); regarded as a minor venue
- Covers ageing well, digital health, telemedicine and independent living, ambient assisted living
- Two submission stages (1st stage gives an earlier notification), plus position papers and an abstracts track
- Held in European cities (Prague 2023, Angers 2024, Porto 2025, Benidorm 2026, Rome 2027) and co-located with CLOSER,
  ICEIS, ENASE, IoTBDS and other INSTICC conferences with free cross access; remote presentation allowed in exceptional cases
