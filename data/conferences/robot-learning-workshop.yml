notes:
- ML and robotics workshop, held at NeurIPS 2019 to 2023 (2020 to 2022 virtual), ICLR 2025 in Singapore and NeurIPS 2026 in Sydney (8th edition)
- Each edition has its own theme; 2026 is "Is Physical AI Going Zero-Shot?"
- Non-archival, so papers can later go to archival conferences or journals
- 2026 papers up to 6 pages in NeurIPS format, double-blind review on OpenReview; camera-ready up to 7 pages
- 2025 accepted full papers, ICLR tiny papers and systems papers with a video
- Not listed in ICORE2026 and not on the CCF list
