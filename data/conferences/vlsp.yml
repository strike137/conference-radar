notes:
- Workshop series of the Vietnamese language and speech processing community, run by the VLSP association (a chapter
  of VAIP)
- Two parts each year, scientific papers and software demos plus an evaluation campaign of shared tasks (8 shared
  tasks in 2026); shared task teams present their systems in technical papers
- Papers in English, 4 to 8 pages recommended, ACL template; VLSP 2025 proceedings published in the ACL Anthology
  (VLSP 2023 papers went to a special issue of the Journal of Computer Science and Cybernetics)
- Held in Vietnam, mostly at VIASM in Hanoi (2022, 2023, 2025); no edition in 2024
- VLSP 2022 was co-located with O-COCOSDA 2022; VLSP 2026 is a one-day hybrid workshop in Ho Chi Minh City held in
  conjunction with CSoNet 2026
- 2026 call is for technical papers on shared task systems and software demos only
- Not listed in the CORE portal (ICORE2026) or the CCF list
