notes:
- Workshop on responsible, theory-driven and classroom-ready AI for learning (continuous evaluation, learning theory,
  deployment in classrooms)
- 2025 edition named Innovation and Responsibility in AI-Supported Education, held at AAAI 2025 in Philadelphia
  (PMLR vol. 273)
- 2026 edition renamed Impactful and Responsible AI Systems for Education and held at the Festival of Learning 2026
  in Seoul (PMLR vol. 339)
- The organizers count the AAAI 2024 AI for Education workshop (PMLR vol. 257) as the first edition; that workshop
  series continues separately as AI4EDU (ai4ed.cc)
- Full papers 6 to 8 pages and short papers 2 to 4 pages in PMLR style, double-blind review on OpenReview
- Accepted papers are invited to submit an extended camera-ready version for the PMLR proceedings
- Not listed in ICORE2026 and not on the CCF list
