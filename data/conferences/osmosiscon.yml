notes:
- Practitioner conference for open-source intelligence (OSINT) professionals, run by the OSMOSIS Association
- Described by the organizer as the largest and longest running gathering for OSINT professionals, held for over a decade
- Keynote, speaker sessions, sponsor-led training sessions of 60 to 120 minutes, a panel, an expo hall and the Open-Source Intelligence Awards
- Speaker proposals collected through an online form; accepted speakers get reasonable travel expenses and registration
- 2026 edition at the Hyatt Regency Coconut Point, Bonita Springs, Florida; 2027 edition at the Rio Hotel & Casino, Las Vegas
- No proceedings
- Not listed in CORE ICORE2026 and not on the CCF list
