notes:
- Annual conference on the intersection of machine learning, AI, operations research and metaheuristics, run since
  2007 by the non-profit LION Association
- Proceedings in Springer LNCS, published after the conference so authors can use feedback from the event; only an
  informal preprint PDF is available at the conference
- "Paper types: long papers (12 to 15 pages LNCS), short papers (6 to 11 pages in 2026, 6 to 10 in 2027) and
  poster-only abstracts"
- Single-blind review (2026, 2027); for 2027 at least one author must register by the early deadline and present in
  person
- LION21 (2027) adds a fast track to ACM Transactions on Evolutionary Learning and Optimization (TELO)
- Held in Europe (Nice 2023, Ischia 2024, Prague 2025, Milan 2026, Barcelona 2027)
- Fee about 520 EUR regular early, 450 EUR student early (2026), including LION Association membership
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
