id: icics
name: ICICS
full_name: International Conference on Information and Communications Security
type: conference
tier: minor
areas: [security, crypto]
region: worldwide
language: english
frequency: annual
organizer: 'Rotating host institutions (2025: Southeast University with Swinburne University of Technology and University
  of Wollongong; 2026: general chairs from University of Tsukuba and Institute of Science Tokyo, program co-chair
  and organizing chairs from University of Aizu and University of Fukui among others)'
proceedings: Springer LNCS
indexing: [Scopus, DBLP]
rank:
  core: C
  ccf: C
fee: JPY 100,000 (2026, author registration); JPY 70,000 early attendee
typical:
  deadline_months: [2, 3, 5, 6]
  conference_months: [8, 10, 11]
links:
  website: https://sulab-sever.u-aizu.ac.jp/icics2026/index.html
  dblp: https://dblp.org/db/conf/icics/index.html
notes:
- Started in 1997 in China; recent editions alternate between China and other countries (Canterbury 2022, Tianjin
  2023, Mytilene 2024, Nanjing 2025, Fukui 2026)
- 2026 edition is in Fukui, Japan, next door to Ishikawa (JAIST)
- Proceedings in Springer LNCS (two volumes in 2024, three in 2025)
- Two submission rounds (about February/March and May/June); anonymous submissions; papers rejected in round 1 may
  be resubmitted to round 2 with a response letter; in-person presentation required
- CORE C and CCF C; regarded as a mid-to-lower tier security venue
