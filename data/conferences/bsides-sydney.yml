notes:
- Community-driven Security BSides information security conference in Sydney, Australia, started in 2019
- One-day event with offensive and defensive security talks, hands-on workshops and a CTF; 500+ attendees and 20+ talks (official site)
- 2026 edition held at the Cyber Range Training Centre, TAFE Meadowbank, supported by the Macquarie University Cyber Security Hub
- Call for papers covers talks and workshops; opened on 1 March and closed in mid July for 2026, with notifications in August
- No proceedings
