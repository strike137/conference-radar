notes:
- One-day workshop associated with FC (Financial Cryptography and Data Security); location follows FC (2024 Curacao,
  2025 Miyakojima, 2026 St. Kitts)
- 2026 was the 11th edition; also listed as Workshop on Advances in Secure Electronic Voting Schemes
- Papers appear in the joint Springer LNCS volume of FC workshops (revised selected papers); authors may opt out with
  an extended abstract only
- Double-blind; full papers 15 pages including references, short papers 8 pages, SoK papers 15 pages excluding
  references, LNCS format
- Topics include end-to-end verifiable voting, internet voting, election auditing and human factors
- Also runs a discussion panel with 1-page extended abstracts that do not appear in the proceedings
- Small workshop (about 6 papers in the 2026 program)
- Not listed in ICORE2026 or the CCF list
