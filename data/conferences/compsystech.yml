notes:
- Broad computer systems and technologies conference held every June at the University of Ruse "Angel Kanchev", Bulgaria
- Organized with the IEEE Bulgaria Section and the John Atanasoff Society of Automatics and Informatics
- Proceedings in the ACM ICPS (ACM DL) from 2007 to 2024, in IEEE Xplore since 2025; indexed in Scopus
- Hybrid format (face-to-face and online); each paper gets 3 reviews
- "Fee for CompSysTech'27: 250 EUR for one paper, 160 EUR for PhD students"
- Submission deadline usually extended by about three weeks
- Not listed in CORE ICORE2026 or the CCF list
