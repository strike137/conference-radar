notes:
- Half-day CVPR workshop on gaze estimation, gaze following, eye region analysis and eye modeling; 2026 was the 7th edition
- Named Gaze Estimation and Prediction in the Wild until 2024; started at ICCV 2019 in Seoul, then ECCV 2020 and CVPR since 2021
- No edition was held in 2025
- Full papers up to 8 pages in CVPR format, double-blind review on OpenReview; papers rejected from the CVPR main conference may
  be resubmitted with the previous reviews and a letter of changes
- Accepted papers go into the CVPR Workshops proceedings and CVF Open Access (7 papers in 2026)
- Not listed in ICORE2026 or the CCF list
