notes:
- Half-day CVPR workshop on eye gaze estimation and prediction, eye region modeling and gaze applications in VR/AR and egocentric vision
- Called "Gaze Estimation and Prediction in the Wild" until 2024; renamed "Eye and Gaze in Computer Vision" for the 7th edition in 2026
- First edition at ICCV 2019 (Seoul); with CVPR every year from 2021 to 2024 and again in 2026; no edition in 2025
- Full papers up to 8 pages in CVPR format, double-blind review on OpenReview; accepted papers are presented at a poster session
- Papers rejected from the CVPR main conference may be submitted with the previous reviews and a letter of changes
- Accepted papers go into the CVPR Workshops proceedings (7 papers on CVF Open Access in 2026)
- Best paper and best poster awards
- Not listed in ICORE2026 or the CCF list
