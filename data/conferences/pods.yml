notes:
- Premier venue for the theoretical foundations of data management (query languages, logic, complexity, algorithms)
- Held jointly with SIGMOD every year since 1991; one registration covers both
- Accepted papers appear in a PODS issue of the PACMMOD journal (ACM DL)
- Two submission cycles a year (June and December) with a rebuttal phase and a revision option
- Double-anonymous review; up to 15 pages in ACM acmsmall format plus references
- About 25 research papers a year according to the PODS pages
- Location follows SIGMOD (Bengaluru 2026, Huntington Beach 2027)
