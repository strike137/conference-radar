id: modevva
name: MoDeVVa
full_name: Workshop on Model Driven Engineering, Verification and Validation
type: workshop
tier: minor
areas: [software]
region: worldwide
language: english
frequency: annual
organizer: MoDeVVa organization committee (Queen's University, ISAE-SUPAERO, University of Antwerp and others), co-located with MODELS
organizer_country: [canada, europe]
proceedings: MODELS joint workshop proceedings (ACM DL 2026, IEEE 2025)
archival: true
