links:
  website: https://sites.google.com/site/modevva
notes:
- Workshop on the integration of verification and validation (V&V) with model-driven engineering and MBSE, including AI for model-based V&V
- Long-running series; 2026 was the 23rd edition, co-located with MODELS
- Proceedings published with the MODELS workshop proceedings (IEEE in 2025, ACM in 2026)
- Short papers up to 5 pages and full papers up to 10 pages including references; single-blind review
- Also accepts lightning talk abstracts (up to 2 pages) for a discussion session, with a later deadline and no publication
- Best papers, together with the SAM conference, invited to a special issue of Innovations in Systems and Software Engineering (Springer Nature)
- Not listed in the CORE portal (ICORE2026)
