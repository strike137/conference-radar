notes:
- One of the three URSI flagship meetings with the General Assembly (GASS) and AP-RASC; covers all ten URSI Commissions (fields and waves, radiocommunication, propagation, radio astronomy, EM in biology and others)
- Held every few years in Gran Canaria, Spain (2015, 2018, 2022, 2024, 2027); the CFP calls it triennial
- 2022 edition was a joint Atlantic and Asia-Pacific meeting (AT-AP-RASC)
- Submit a one-page Extended Abstract or a 2 to 4 page Summary Paper; only Summary Papers go to IEEE Xplore (opt-out possible)
- Each registered author may present at most two papers; early author registration is required for inclusion in the program
- Student Paper Competition and Young Scientist Awards
- Radio science venue outside the usual CS rankings, not listed in ICORE2026
