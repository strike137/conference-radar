notes:
- Workshop co-located with ECML PKDD, held every September since 2019 (online in 2020 and 2021)
- Organized mainly by French remote sensing and machine learning groups (UMR TETIS Montpellier, IRISA, CNRS LETG)
- Sponsored by ESA, AFRIF, GdR MADICS and EGC
- Post-proceedings in Springer CCIS since the 2023 edition; 2019 to 2022 proceedings in CEUR-WS
- Short position papers up to 6 pages or full papers up to 10 pages, references included, LNCS format; single-blind review via Microsoft CMT
- Camera-ready for the post-proceedings is due after the workshop
- Not listed in CORE ICORE2026
