notes:
- Free community tech conference founded in 2014 by Sysarmy, the Argentine IT and sysadmin community
- Talks and workshops for developers, SRE / DevOps, data and AI, security and management; mostly in Spanish
- Main edition in Buenos Aires every September (Ciudad Cultural Konex); since 2023 also editions in Santiago de Chile,
  Mexico City and Madrid
- Entry is free and all talks are streamed and published online; no papers or proceedings
- Talks chosen by an evaluation committee from a call for papers per edition
- Declared of cultural interest by the Argentine Ministry of Culture in 2023
