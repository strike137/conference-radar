notes:
- Biennial since 1994, run by the Department of Computer Science of Czestochowa University of Technology with a
  co-organizing university each time
- Usually held in Poland (Poznan 2026); Ostrava, Czech Republic in 2024
- Post-proceedings in Springer LNCS, published after the conference and containing only presented papers (2024 in
  LNCS 15579 to 15581)
- Regular papers up to 15 pages in LNCS style; many co-located HPC workshops and minisymposia
- Camera-ready deadline comes after the conference (October or November)
- "CORE rank: National: Poland (ICORE2026); not on the CCF list"
