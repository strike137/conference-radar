notes:
- Community information security conference in Winnipeg, Manitoba, run by the non-profit The Long Con Inc. (founded 2012)
- First held in 2013 as BSides Winnipeg (also 2015 and 2017); renamed The Long Con from 2018
- Weekend event at the West End Cultural Centre, Winnipeg; expenses covered by sponsors
- Talks only, no proceedings; talks may count toward ISC2 and ISACA CPE credits
