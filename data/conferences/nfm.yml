notes:
- Annual symposium run by the NASA Formal Methods Research Group (researchers from six NASA centers); grew out of the Langley Formal Methods Workshop series
- Formal methods for software and system assurance in space, aviation, robotics and other safety-critical systems
- Proceedings in Springer LNCS (Formal Methods subline)
- Held in the USA, hosted in turn by NASA centers or nearby universities (2023 Houston, 2024 Moffett Field, 2025 Williamsburg, 2026 Los Angeles, 2027 Houston)
- NFM 2027 takes regular papers (16 pages plus references) and 8-page short papers (tool papers and case studies)
- No registration fee for participants (2027), but all attendees must register
- Not listed in ICORE2026 or the CCF list
