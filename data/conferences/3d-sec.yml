notes:
- Co-located with ACM CCS; 1st edition at CCS 2025 in Taipei, 2nd at CCS 2026 in The Hague
- Double-blind; full papers up to 8 pages plus 2 appendix pages, short papers 6 pages, and 2-4 page discussion,
  demo, vision and poster papers
- 2026 edition has two submission rounds (June and July)
- 'Proceedings in the ACM Digital Library (2025 volume: ISBN 979-8-4007-1902-8)'
- Organizers and program committee are largely from Korea (Sungkyunkwan University) and Australia (CSIRO Data61)
