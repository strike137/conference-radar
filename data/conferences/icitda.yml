links:
  website: https://icitda.org/
notes:
- Organized by Universitas Islam Indonesia (UII), Yogyakarta; held yearly since 2016 (2026 is the 11th)
- Proceedings in IEEE Xplore (2025 edition published); no-show papers are not submitted
- Hosted by UII in Yogyakarta in 2022, 2023 and 2025 (2021 virtual); 2024 at INTI International University, Malaysia and 2026 at
  Universitas Bumigora, Lombok; hybrid format
- Submissions via EDAS in several batches; 4 to 8 page IEEE format papers
- 2026 theme is cybersecurity through intelligence and automation; broad IT topic list
- Not listed in the ICORE2026 portal or the CCF 2026 list
