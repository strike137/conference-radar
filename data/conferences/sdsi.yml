notes:
- Workshop on softwarisation of satellite constellations and non-terrestrial networks, co-located with IEEE NetSoft
- First edition at NetSoft 2026 in Berlin (half day, afternoon of 29 June 2026)
- Co-chairs from Eurescom, the European Space Agency, DLR and Airbus Defence and Space
- Papers up to 7 pages in IEEE two-column format, submitted via EDAS
- Accepted and presented papers go into the IEEE NetSoft 2026 proceedings and IEEE Xplore
- Four papers, a keynote and a panel in 2026
- Not listed in ICORE2026 or in the CCF 2026 list
