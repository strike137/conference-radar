id: ieee-ghtc
name: IEEE GHTC
full_name: IEEE Global Humanitarian Technology Conference
type: conference
tier: minor
areas: [general]
region: north-america
language: english
frequency: annual
organizer: IEEE (founded by the Seattle Section and Region 6; technical sponsors listed include IEEE Region 6, Region 5, Denver Section, IEEE-USA, SSIT and Silicon Valley units); hosted by a US university each year
organizer_country: [usa]
proceedings: IEEE Xplore
archival: true
indexing: [IEEE Xplore]
typical:
  deadline_months: [5]
  conference_months: [10]
links:
  website: https://ieeeghtc.org/
notes:
- IEEE conference on technology for underserved communities and humanitarian engineering, started in 2011 by the IEEE Seattle Section and Region 6
- 'Themes: healthcare, education and connectivity, water, food and energy access, disaster resilience, co-design and humanitarian engineering practice and education'
- Full papers (4 to 8 pages) are published and indexed in IEEE Xplore; 2-page oral-only abstracts appear in Xplore but are not indexed as publications
- Single-blind review via EDAS; also poster abstracts (student poster competition) and special sessions
- 'Held in the USA: online 2020 and 2021, Santa Clara University 2022, Villanova University 2023 and 2024, Colorado School of Mines 2025, University of Colorado Boulder 2026 (hybrid)'
- Not listed in the CORE portal (ICORE2026)
