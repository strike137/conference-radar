notes:
- Run every year since 2016 by the ECE department of SSN College of Engineering, Chennai, India
- 2027 is the 12th edition; 2026 and 2027 held at the SSN campus near Chennai in March
- Tracks cover 5G/6G wireless, signal and image processing, antennas/RF/VLSI, IoT, AI for networks, network security and green communications
- Papers 4 to 6 pages in IEEE format, peer reviewed via Microsoft CMT after a similarity screening
- Accepted papers presented in person by a registered author are submitted to IEEE Xplore; proceedings of past editions are in IEEE Xplore
- Not listed in ICORE2026 or the CCF 2026 list
