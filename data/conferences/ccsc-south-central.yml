notes:
- Regional computing education conference of the CCSC (CCSC-SC), a one-day event held in spring
- Papers and abstracts of tutorials, workshops and panels are published in the Journal of Computing Sciences in Colleges
- Also Nifty Assignments, Lightning Talks and a student poster session with prizes
- Held at universities in Texas and Louisiana; 2025 and 2026 at McNeese State University, Lake Charles, Louisiana
- 2021 and 2022 editions were virtual due to COVID
- "Registration fee: 160 USD until March 30, 75 USD for students and retirees (2026)"
- Not listed in ICORE2026; not on the CCF list
