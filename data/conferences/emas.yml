notes:
- Workshop on agent-oriented software engineering, programming multi-agent systems and declarative agent languages
- Formed in 2012 at a Dagstuhl seminar as a merger of the AOSE, DALT and ProMAS workshops; first held in 2013
- Held at AAMAS every year, so it follows AAMAS around the world (London 2023, Auckland 2024, Detroit 2025, Paphos 2026)
- Revised and extended papers appear afterwards in a Springer post-proceedings volume (EMAS 2023 -> LNCS 14378, EMAS 2024 -> LNCS 15152)
- Regular (16 pages), short (8 pages), student (6 pages) and tool or demo (4 pages) papers in LNCS format via OpenReview; single-blind review
- Two-day workshop with best paper and best student paper awards
- ICORE2026 rank B; not on the CCF list
