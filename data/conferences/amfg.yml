notes:
- Long-running workshop on face, gesture and multimodal human analysis; the first AMFG was held with ICCV 2003
- Held roughly every one or two years with ICCV or CVPR (CVPR 2018, 2019 and 2021; ICCV 2023 Paris; ICCV 2025
  Honolulu)
- Papers appear in the host conference workshop proceedings (IEEE Xplore and CVF Open Access)
- 8-page anonymous submissions in the host conference template; 2025 submissions via OpenReview
- Not listed in ICORE2026 or the CCF list
