notes:
- Workshop on face, gesture and body analysis, generation, soft biometrics and multimodal human understanding
- First held with ICCV 2003 in Nice; recent editions with CVPR 2018, CVPR 2019, CVPR 2021, ICCV 2023 (Paris) and ICCV 2025 (Honolulu, 12th edition)
- Roughly biennial in recent years, not tied to one host conference
- Full papers up to 8 pages in ICCV format, anonymous submission on OpenReview
- Accepted papers appear in the ICCV 2025 Workshops proceedings (CVF Open Access)
- Not listed in ICORE2026 or the CCF list
