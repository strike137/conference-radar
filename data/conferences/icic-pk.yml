notes:
- Multi-topic computing conference run by the School of Systems and Technology, University of Management and Technology (UMT), Lahore, Pakistan
- Not the Chinese International Conference on Intelligent Computing (ICIC)
- 6th edition (ICIC 2025) held at UMT in December 2025; its papers are in IEEE Xplore
- Research papers track and a PhD symposium; full papers up to 6 pages in the IEEE template
- Short gap between the paper deadline and the conference (about five weeks in 2026)
- Not listed in ICORE2026 or the CCF 2026 list
