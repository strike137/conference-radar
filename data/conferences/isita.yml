id: isita
name: ISITA
full_name: International Symposium on Information Theory and Its Applications
type: conference
tier: minor
areas: [communications, crypto, security]
region: asia-pacific
language: english
frequency: biennial
organizer: IEICE Engineering Sciences Society, Research Society of Information Theory and Its Applications (SITA);
  technical co-sponsor IEEE Information Theory Society
organizer_country: [japan]
proceedings: IEEE Xplore
archival: true
rank:
  core: C
fee: 80,000 JPY IEICE/IEEE member, 95,000 JPY non-member (2026, early); students 40,000/45,000 JPY
typical:
  deadline_months: [4, 5]
  conference_months: [11]
links:
  website: https://isita.ieice.org/2026/
notes:
- Biennial (even years) since 1990; recent venues Singapore 2018, virtual 2020, Tsukuba 2022, Taipei 2024, Okinawa
  2026
- Run by the IEICE SITA society (which also runs the domestic SITA symposium); technical co-sponsor IEEE Information
  Theory Society
- Papers up to 5 pages plus 1 page of references via EDAS; presented papers go to IEEE Xplore; copyright goes to
  IEICE
- Recent Results Poster track with a late deadline (one-page abstract, not in IEEE Xplore)
- Held back to back with the IEICE ESS Symposium in 2026, with a combined registration discount
