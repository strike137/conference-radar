id: vtc
name: IEEE VTC
full_name: IEEE Vehicular Technology Conference (VTC-Spring and VTC-Fall)
type: conference
tier: major
areas: [communications]
region: worldwide
language: english
frequency: multiple-per-year
organizer: IEEE Vehicular Technology Society
proceedings: IEEE Xplore
indexing: [DBLP, Scopus, EI]
rank:
  core: B
acceptance_rate: about 47% (2015 Spring, 421 of about 900)
fee: 835 USD IEEE member early, with workshops (VTC2026-Fall); VTS member 780 USD
typical:
  deadline_months: [1, 2, 3, 4, 9]
  conference_months: [6, 9, 10]
links:
  website: https://events.vtsociety.org/
  dblp: https://dblp.org/db/conf/vtc/
notes:
- Semi-annual flagship conference of the IEEE Vehicular Technology Society (Spring edition in June, Fall edition
  in September/October)
- VTC2027-Fall will be held in Osaka, Japan (Sep 27-30, 2027); VTC2025-Fall was in Chengdu, China
- Regular papers are 5 pages (up to 7 with overlength charges); a later Recent Results track and workshops
- High acceptance rate, historically around 45-55%; not in the CCF list
