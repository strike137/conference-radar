notes:
- Workshop for forward-looking and early-stage storage and file systems research; position papers welcome
- Sponsored by ACM SIGOPS in cooperation with USENIX (a USENIX workshop until 2020); proceedings in the ACM DL
- 1.5-day in-person workshop; at least one author of each accepted paper must attend
- Held in the USA in 2023 to 2025 (Boston, Santa Clara, Boston); 2026 in Prague just before SOSP
- Student grants that waive registration fees are offered based on need
- CCF C; not listed in ICORE2026
