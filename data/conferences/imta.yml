notes:
- Workshop on mathematical approaches to image analysis and pattern recognition and their applications
- Promoted by IAPR TC16 (Algebraic and Discrete Mathematical Techniques in Pattern Recognition and Image Analysis) and the Russian Academy of Sciences pattern recognition committee; sponsored by IAPR
- Co-chaired by FRC Computer Science and Control of the Russian Academy of Sciences (Moscow), ISTI-CNR (Pisa) and TU Munich
- Held as a satellite workshop of ICPR, so it follows the ICPR biennial schedule; IMTA IX was the 2024 edition, IMTA X the 2026 edition in Lyon
- Papers up to 15 pages in LNCS format (150 EUR per extra page) via Microsoft CMT; only papers longer than 6 pages go into the proceedings
- Extended versions of selected papers appear in a special issue of the journal Pattern Recognition and Image Analysis
- In-person and online participation
- Not listed in ICORE2026 or the CCF list
