notes:
- Theory venue on relation algebras, Kleene algebras, residuated lattices, semirings and related algebraic methods, with applications to program verification and concurrency
- Runs since 1994, first as RelMiCS; merged with the AKA (Applications of Kleene Algebra) conferences and named RAMiCS since 2009
- Proceedings in Springer LNCS, ready at the conference; papers up to 16 pages in LNCS style, at least three reviewers each
- Selected papers invited to a journal special issue; separate call for unpublished presentations and tutorials
- Mostly held in Europe (Groningen 2018, Palaiseau 2020 virtual, Marseille 2021, Augsburg 2023, Prague 2024, Bedlewo 2026); 2027 in South Africa
- Irregular schedule, roughly every one to two years
- "CORE ICORE2026: C; not in the CCF 2026 list"
