notes:
- 'Japanese community-oriented computer security short conference in Tokyo, run as a relaxed drinking party (motto:
  no drink, no hack)'
- Started as the attendee-only after-party of Black Hat Japan (until 2007); open to the public as a one-day short
  conference since 2008
- Talks are 30 min (long) or 10 min (short); English talks welcome but no live translation, English slides preferred
- Speakers get free entry and drinks; long-session speakers get travel support (up to 100,000 JPY from overseas,
  50,000 JPY domestic)
- Held in November at TK NIGHTCLUB, Shibuya (2024 to 2026); non-archival, CFP deadline in late September
