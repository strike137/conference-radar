notes:
- Annual since 2017; 11th edition in 2027
- Usually in Wuhan (fully virtual 2021 to 2023, with 2021 planned for Chengdu; hybrid 2024 and 2026); Bangkok 2025; Hong Kong 2027
- Covers management engineering and service sciences as well as software engineering
- Papers in IEEE Conference Publishing Services and IEEE Xplore since 2022; ACM ICPS 2017 to 2021; stated as indexed by EI Compendex and Scopus
- Reviewed by at least two committee members or international reviewers
- Submission via zmeeting; held in January until 2025, in March since 2026
- Not listed in CORE ICORE2026 or the CCF list
