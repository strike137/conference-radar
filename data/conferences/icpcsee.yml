notes:
- Formerly ICYCSEE (International Conference of Young Computer Scientists, Engineers and Educators); first held 2015
  in Harbin
- Run by the ICPCSEE Academic Committee and HeiLongJiang Computer Federation; focus on data science and applications
- Proceedings in Springer CCIS (EI indexed); selected papers recommended to SCI or EI journals, and authors can submit
  to the partner journals only instead of CCIS
- Held in mainland China 2015 to 2023, then Macao (2024), Hiroshima (2025) and Singapore (2026)
- Four tracks (research, industry, education, demo); double-blind review
- Not listed in ICORE2026 (searched as ICPCSEE, ICYCSEE and Pioneering)
