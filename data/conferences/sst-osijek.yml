notes:
- Organized and hosted by FERIT, University of Osijek, Croatia; co-organized with University of Zagreb faculties (FER, FOI)
  and University of Slavonski Brod
- IEEE Region 8, the IEEE Croatia Section and several of its chapters are technical co-sponsors
- Editions in 2016, 2017, 2018, 2020, 2022, 2024 and 2026, all in Osijek; biennial since 2018
- Papers presented at the conference go to IEEE Xplore; 6 pages IEEE double-column, up to 8 with extra page fees
- Selected papers invited to the International Journal of Electrical and Computer Engineering Systems
- Broad smart systems topics from power systems and smart grid to AI, IoT, wireless networks and security
- "Registration 2026: 600 EUR non-IEEE member, 550 EUR IEEE member, 300 EUR student, 150 EUR PhD forum"
- Not listed in CORE ICORE2026 (the CORE "SST" is Australasian Speech Science and Technology)
