notes:
- Formerly the International Workshop on Acoustic Echo and Noise Control; first held in Berlin in 1989
- Held every even year, alternating with IEEE WASPAA; 2020 edition cancelled due to Covid-19
- Focus on speech and audio enhancement, echo and noise control, microphone arrays, source separation, dereverberation and hearing devices
- Not run by a formal society; a loosely formed scientific committee picks the next host
- Recent editions in Bamberg (2022), Aalborg (2024) and Cremona, Italy (2026), earlier ones also in Japan and China
- 4 pages of content plus an optional 5th page of references only, IEEE template; single-blind review by at least 3 reviewers
- Proceedings of the 2012 to 2024 editions are in IEEE Xplore; papers must be presented to stay in the proceedings
- One full registration covers up to 3 papers
- Not listed in CORE ICORE2026
