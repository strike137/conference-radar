notes:
- Annual hacker meeting of the Chaos Computer Club Dresden (C3D2), held every year since 2004
- Held each September at the Zentralwerk cultural centre in Dresden, Germany; free admission
- Talks, workshops, art and music on technology and society, surveillance, privacy, open data and critical infrastructure
- Call for participation runs on pretalx; talks of 30 to 45 minutes and workshops of 1 to 3 hours
- No proceedings; talks are streamed and published on media.ccc.de
- Website and call for participation in German and English, most talks in German
