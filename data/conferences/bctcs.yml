full_name: British Colloquium for Theoretical Computer Science
type: conference
tier: minor
areas: [general]
region: europe
language: english
frequency: annual
organizer: BCTCS Organising Committee, with a host UK university
organizer_country: [europe]
proceedings: None (abstracts only, collected in the Bulletin of the EATCS)
archival: false
fee: 45 GBP early, 60 GBP late (2025)
typical:
  deadline_months: [2]
  conference_months: [3, 4]
links:
  website: https://www.bctcs.ac.uk/
notes:
- Annual meeting for UK-based researchers in theoretical computer science, held since 1985
- Aimed at training PhD students; 30 minute contributed talks submitted as abstracts
- No restrictions on originality or publication status of submissions; no formal proceedings
- A report and the contributed abstracts appear in the Bulletin of the EATCS
- Covers algorithms, complexity, automata, semantics, formal methods, concurrency, types and logic
- Held at a different UK university each year (Glasgow 2023, Bath 2024, Strathclyde 2025, Birmingham 2026)
- Small travel bursaries for students supported by the Heilbronn Institute (2025)
- Not listed in the CORE portal (ICORE2026) or the CCF list
