notes:
- Week-long IEEE conference on aerospace systems and their underlying science and technology, with AIAA and the PHM
  Society as technical cosponsors; tracks include space systems, communications and signal processing
- Held every year at the Yellowstone Conference Center in Big Sky, Montana, in early March (48th edition in 2027)
- Two-step submission -> a 500-word abstract in July, then the full paper in October; papers are peer reviewed and
  there is no appeal or secondary review
- Presented papers are published in IEEE Xplore; papers not presented at the conference can be excluded
- The proceedings hold 420+ papers per year; not listed in ICORE2026
