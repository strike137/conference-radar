notes:
- Organised by the Chinese Automation and Computing Society in the UK (CACSUK); held since 1995 (London)
- Automation, robotics, control, smart manufacturing, AI, computing and information systems
- Proceedings in IEEE Xplore since 2011 and EI indexed; 2026 technically co-sponsored by IEEE IES
- Up to 6 pages in IEEE format, submitted via Microsoft CMT
- Held at a different UK university every year (Sunderland 2024, Loughborough 2025, Buckinghamshire New University 2026, Cardiff 2027)
- Best Student Paper Award; selected papers invited to journal special issues
- Not the Sri Lankan ICAC (International Conference on Advancements in Computing)
- Not listed in ICORE2026 or the CCF 2026 list
