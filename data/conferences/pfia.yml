id: pfia
name: PFIA
full_name: Plate-Forme Intelligence Artificielle
type: conference
tier: domestic
areas: [ai, data]
region: europe
language: mixed
frequency: annual
organizer: AFIA (Association Francaise pour l'Intelligence Artificielle) with a host lab (CRIL, Lens in 2026)
organizer_country: [europe]
proceedings: HAL (per-conference online proceedings compiled by AFIA); JFSMA proceedings by Cepadues
archival: true
typical:
  deadline_months: [2, 3]
  conference_months: [6, 7]
links:
  website: https://afia.asso.fr/les-pfia/
notes:
- Annual French AI multi-conference of AFIA that hosts several national conferences in one week
- Hosted conferences in 2025 were APIA, CAp (machine learning), CNIA, IC (knowledge engineering), JFPC (constraints),
  JFSMA (multi-agent systems), JIAF-JFPDA, RJCIA (young researchers) and SFC, plus workshops, tutorials and theme days
- Each hosted conference runs its own call, deadlines and proceedings; most publish online proceedings on HAL and
  JFSMA publishes with Cepadues
- Papers in French or English, usually with French required in the final version when an author is French-speaking
  (CNIA 2025)
- Held in France every year since 2017 (Bordeaux 2021, Saint-Etienne 2022, Strasbourg 2023, La Rochelle 2024, Dijon 2025,
  Arras 2026); biennial before 2017
- Not listed in ICORE2026 and not on the CCF list
