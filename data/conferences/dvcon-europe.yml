notes:
- Industry-focused European conference on design and verification of chips and embedded systems (SystemC, SystemVerilog, UVM, IP-XACT, UPF)
- Sponsored by Accellera Systems Initiative; steering committee of industry and university members (Infineon, STMicroelectronics, Qualcomm, JKU Linz, Politecnico di Torino, ...)
- "Two tracks: engineering papers (extended abstract first, then full paper of up to 8 pages) and research papers (6 pages plus 1 page of references, IEEE format, double-blind)"
- Research papers are published in IEEE Xplore through VDE Verlag; engineering papers and posters go to the DVCon online proceedings
- Held every year at the Holiday Inn Munich City Centre, Germany, with tutorials and an exhibition
- At least one author must register at the speaker rate and present in person
- Not listed in the CORE portal (ICORE2026) or on the CCF list
