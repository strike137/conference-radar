notes:
- Security BSides event in San Francisco, 100% volunteer organized; held around the time of RSA Conference
- Two-day practitioner conference with talks, workshops, villages and a CTF; held at City View at Metreon in 2025 and 2026
- Almost 600 talk submissions for 2026; vendor pitches not accepted
- No speaker or travel reimbursement; talks are recorded and posted on YouTube
- No proceedings; past events listed back to 2010 (no 2020 event materials)
