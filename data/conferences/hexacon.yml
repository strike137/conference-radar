notes:
- Offensive security conference in Paris run by the French security company Synacktiv, held every October since 2022
- Two days of single-track talks (30 or 45 min) preceded by four days of trainings; also hosts a Speedrun contest
- Held at Palais Brongniart, Paris in 2026; about 500 tickets in 2025
- Talk CFP closes 1 August, answers by end of August; speakers get a hotel room and travel up to 2000 EUR (two
  speakers)
- No proceedings; talks are recorded with consent and published on YouTube
- Not listed in ICORE2026
