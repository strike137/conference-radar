notes:
- Forum for novel applications and implementation techniques of declarative programming (functional, logic,
  constraint and database programming, theorem proving)
- Co-located with POPL every January; held in Rennes 2026, Denver 2025, London 2024 and Boston 2023
- Proceedings in Springer LNCS (LNCS 15537 for 2025, LNCS 16401 for 2026)
- Regular papers up to 15 pages and short papers up to 8 pages (LNCS format, excluding references) go into the
  proceedings; extended abstracts up to 3 pages are posted on the website only
- Double-anonymous review; abstract deadline about a week before the paper deadline
- Distinguished papers are invited to extended versions in TPLP (logic programming) or JFP (functional programming)
- Registration is handled separately from POPL and paid to the ALP; at least one author per accepted paper must register
- CORE C (ICORE2026); not in the CCF 2026 list
