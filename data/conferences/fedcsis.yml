notes:
- Continues IMCSIT (2006 to 2010), which grew out of the autumn meetings of the Polish Information Processing Society; named FedCSIS since 2011
- Main track split into five topical areas (AI, data processing, security of AI and AI for security, business and society, software and system engineering) plus many thematic sessions
- Full and short papers go to IEEE Xplore and an ACSIS volume; position and communication papers appear in separate ACSIS volumes, not in IEEE Xplore
- Held in a different European city each year (Sofia 2022, Warsaw 2023, Belgrade 2024, Krakow 2025, Riga 2026, Gdynia 2027)
- Paper deadline is announced as having no extensions
- "Fees 2026: 800 EUR regular early, 700 EUR student early; IEEE no-show policy applies"
- Runs a yearly data mining competition on the KnowledgePit platform
- "CORE C (ICORE2026); not in the CCF 2026 list"
