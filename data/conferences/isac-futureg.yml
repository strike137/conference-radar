notes:
- Full-day in-person workshop co-located with IEEE INFOCOM; 2026 edition held in Tokyo on May 18, 2026
- Accepted and presented papers appear in the IEEE INFOCOM 2026 Workshop Proceedings in IEEE Xplore
- Papers up to 6 pages including figures, tables and references, IEEE conference format, submitted via EDAS
- General co-chairs Yao Zheng (University of Hawaii at Manoa) and Huacheng Zeng (Michigan State University); steering
  committee all at US universities
- Covers ISAC waveform and beamforming design, sensing architectures, AI for ISAC, RIS, testbeds and ISAC security
- Not in the IEEE INFOCOM 2024 or 2025 workshop lists, so 2026 appears to be the first edition
- Not listed in ICORE2026 or in the CCF 2026 list
