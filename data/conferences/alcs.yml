notes:
- Workshop on machine learning for cybersecurity co-located with ACS/IEEE AICCSA; 4th edition in 2026
- Run by the LIASD lab of University of Paris 8 (chair Larbi Boubchir)
- Accepted workshop papers go into the AICCSA proceedings, which are submitted to IEEE Xplore
- Follows AICCSA around the Arab world (Sousse 2024, Doha 2025, Sharjah 2026)
- Up to 8 pages in IEEE two-column format, double-blind; submission through the AICCSA EasyChair
- Selected papers invited to a special issue of Discover Artificial Intelligence (2026)
- Not listed in CORE ICORE2026 or the CCF list
