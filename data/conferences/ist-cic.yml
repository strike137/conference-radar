notes:
- Annual single-track conference on color science, color imaging, appearance, image quality and multispectral imaging, started in 1993
- "Two submission routes: journal-first papers in JIST or JPI (due mid May) or 4-6 page conference papers (due early June, double-blind review)"
- Conference papers published open access in the IS&T Digital Library; presentation-only extended abstracts are not published there
- Two days of short courses followed by three days of technical sessions
- Moves around the world (Paris 2023, Montreal 2024, Hong Kong 2025, Barcelona 2026)
- Not listed in CORE ICORE2026 or the CCF 2026 list
