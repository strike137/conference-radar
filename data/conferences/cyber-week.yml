notes:
- Large annual international cybersecurity conference at Tel Aviv University, 16th year in 2026 (online archive
  covers 2014 onwards)
- Organized by the Blavatnik ICRC, a joint initiative of Tel Aviv University and the Israel National Cyber
  Directorate; chaired by Prof. Isaac Ben-Israel
- Mix of academia, government, military, industry, startups and investors; more than 11,000 attendees from more than
  99 countries
- Plenaries, conferences, seminars, roundtables and side events, plus a sponsor area and startup exhibition;
  BSidesTLV and AI Week run in the same week
- No call for papers on the official site; no proceedings
- Not the same event as HITB+ CyberWeek in Abu Dhabi
