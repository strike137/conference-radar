notes:
- One-day application security conference of the OWASP France Chapter, held in Paris since 2025
- Both editions so far were held at La Maison des Associations et de la Solidarite, Paris 13e
- Around 150 security professionals expected; talks in French or English
- Call for presentations via Sessionize; 20 minute lightning talks and 45 minute sessions, in person only
- No proceedings; practitioner talks only
