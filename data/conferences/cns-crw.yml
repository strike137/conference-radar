id: cns-crw
name: CRW
full_name: IEEE CNS Cyber Resilience Workshop
type: workshop
tier: minor
areas: [security, networking]
region: worldwide
language: english
frequency: annual
organizer: Co-located with IEEE CNS; steering committee Charles A. Kamhoua (Army Research Lab), Alexander Kott and
  Nandi O. Leslie; 2026 chairs from University of Michigan-Dearborn, Fordham, CityU Hong Kong and NYU
organizer_country: [usa]
proceedings: IEEE Xplore (IEEE CNS proceedings)
archival: true
typical:
  deadline_months: [6, 7]
  conference_months: [9]
links:
  website: https://sites.google.com/view/cns-crw2025/home
notes:
- Workshop on cyber resilience (AI for resilience, zero trust, moving target defense, autonomous cyber defense)
  held with IEEE CNS; 5th edition in 2026
- Follows IEEE CNS around the world (Avignon 2025, Newark, Delaware 2026)
- All CNS workshop papers are published in the CNS proceedings and included in IEEE Xplore
- Papers up to 6 pages in IEEE two-column format, submission via EDAS
- Deadline usually late June, extended by one to two weeks; half-day program
- Not ranked by CORE (not in ICORE2026) or CCF
