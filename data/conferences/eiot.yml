notes:
- Workshop on embodied and physically grounded intelligence for IoT, sensing, edge AI and multi-agent systems
- Successor of the CPD workshops (UbiComp 2018 to 2023) and PICASSO workshops (MobiCom 2024, UbiComp 2025); 2026
  was the 9th edition of the series and the first under the EIoT name
- 2026 held as a half-day workshop at ACM UbiComp/ISWC 2026 in Shanghai
- Accepted papers appear in the ACM Digital Library as part of the UbiComp/ISWC Adjunct Proceedings
- Papers up to 5 pages plus 1 page of references, ACM sigconf, double-blind, at least two reviewers
- "Acceptance rate: 48% (PICASSO 2025, 11/23)"
- Not listed in ICORE2026 or the CCF 2026 list
