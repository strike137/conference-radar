notes:
- Sponsored by the IEEE Communications Society; covers e-health networking, devices, data analytics, AI for health and
  telemedicine
- CORE C (ICORE2026)
- Rotates worldwide (Nara 2024, Abu Dhabi 2025, New York 2026 hosted by Yeshiva University)
- Papers up to 6 pages via EDAS (up to 2 extra pages for a fee); accepted and presented papers go to IEEE Xplore
- One full or limited registration covers up to 3 papers; no-show papers can be removed from IEEE Xplore
- 92 papers accepted from 126 submissions in 2025; more than 400 submissions in 2026
- The per-year site moves (healthcomYYYY.ieee-healthcom.org); Wayback Machine copies of the official pages are
  listed as backup sources
