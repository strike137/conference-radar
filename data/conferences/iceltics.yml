id: iceltics
name: ICELTICs
full_name: International Conference on Electrical Engineering and Informatics (ICELTICs)
type: conference
tier: minor
areas: [ai, data, networking, communications, security, general]
region: southeast-asia
language: english
frequency: biennial
organizer: Department of Informatics, Universitas Syiah Kuala (USK), with APTIKOM
organizer_country: [indonesia]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [7, 8]
  conference_months: [10]
links:
  website: https://iceltics.usk.ac.id/
notes:
- Run by the Department of Informatics, Universitas Syiah Kuala, Banda Aceh, co-organized by APTIKOM (Indonesian
  association of informatics and computer science higher education)
- 2026 is the 6th edition, technically co-sponsored by the IEEE Indonesia Section; accepted and presented papers
  are submitted to IEEE Xplore
- Held every two years (2017, 2018, 2020, 2022, 2024, 2026), always in Banda Aceh; proceedings of all past
  editions are in IEEE Xplore
- Hybrid format in 2026; EDAS submission with IEEE PDF eXpress
- Broad scope (AI and data science, information systems, networks and IoT, IS security, electrical and computer
  engineering)
- Not the same venue as ICEEI (International Conference on Electrical Engineering and Informatics, Bandung)
- Not listed in ICORE2026 and not in the CCF list; a small regional venue
