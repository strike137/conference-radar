notes:
- Run by the IEICE ESS Technical Committee on Smart Info-Media Systems; started in 2007 as SISB (Smart Info-Media
  Systems in Bangkok) and renamed SISA in 2009
- Covers wireless and communication systems, speech, image, video and audio signal processing and multimedia systems;
  aimed at young researchers
- Full papers up to 6 pages; regular papers get a 2 minute short oral plus poster discussion; student paper awards
- Proceedings are a password-protected download for participants; presenters are invited to submit to a special
  section of IEICE Trans. Fundamentals
- Mostly held in Japan, sometimes in Southeast Asia (Phuket 2025, jointly with InCIT); online 2020 to 2022
- No 2026 edition; SIS authors are asked to present at the 2026 ESS Symposium instead, and SISA 2027 is planned for
  December 2027 in Chitose, Hokkaido
- Deadlines are usually extended by two weeks or more
