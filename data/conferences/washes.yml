notes:
- One-day satellite workshop of CSBC, the annual congress of the Brazilian Computer Society (SBC); 11th edition in
  2026, held since 2016
- Topics include human, social and economic aspects of software development, AI and LLMs in software
  engineering, diversity and inclusion, open source and software ecosystems
- Full papers up to 10 pages plus 2 of references, short papers up to 5 plus 1, SBC template, submitted via JEMS3
- Double-anonymous review; call for papers in Portuguese, with some accepted papers in English
- Proceedings (Anais do WASHES) published open access in SBC OpenLib (SOL) with a DOI per paper; in-person
  presentation required
- Best papers invited to submit extended versions to the iSys journal
- Held with CSBC in a different Brazilian city each year (Gramado 2026)
- Not listed in CORE ICORE2026
