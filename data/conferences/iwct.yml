notes:
- Workshop on combinatorial (t-way, pairwise) testing of software, systems and other domains, co-located with IEEE ICST; first edition in 2012
- 15th edition in 2026 with ICST 2026 in Daejeon, South Korea; 14th edition in Naples 2025
- Full papers up to 10 pages and short papers up to 4 pages including references; 2-page journal-first summaries and hot-off-the-press abstracts also appear in the proceedings
- Each paper reviewed by at least three PC members; accepted papers published in the ICST workshop proceedings in IEEE Xplore
- Steering committee from Austria (Salzburg) and NIST (USA); 2026 chairs from Italy, the USA and Austria
- 2025 best papers invited to extended versions in SN Computer Science
- Not among the ICST 2027 workshops yet (workshop proposals due 2026-11-04); not listed in ICORE2026 or the CCF 2026 list
