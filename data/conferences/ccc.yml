notes:
- Run by the Technical Committee on Control Theory (TCCT) of the Chinese Association of Automation; program
  secretariat at the Academy of Mathematics and Systems Science, CAS
- Large annual control theory and automation conference, always held in China (45th edition in 2026)
- English papers go to IEEE Xplore and are EI Compendex indexed (CCC 2025 proceedings in IEEE Xplore and EI per TCCT)
- Working languages Chinese and English; only English papers go to IEEE Xplore after the conference
- CCC 2026 was hosted by Hunan University in Changsha; submissions via the AMSS conference management system (cms.amss.ac.cn)
- Single submission deadline in March, notification in April, final papers in May (2026)
- Not listed in ICORE2026
