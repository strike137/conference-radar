id: mobisec
name: MobiSec
full_name: International Conference on Mobile Internet Security
type: conference
tier: minor
areas: [security, networking, communications, crypto]
region: asia-pacific
language: english
frequency: annual
organizer: KIISC (Korea Institute of Information Security and Cryptology)
organizer_country: [korea]
proceedings: Springer CCIS (post-proceedings of revised selected papers, Mobile Internet Security; only selected
  papers are invited after revision and extension, and other accepted papers appear only in non-official preliminary
  online proceedings for participants); other accepted papers may be extended in SCIE or Scopus-indexed journals
archival: true
indexing: [Scopus (CCIS volume)]
rank:
  core: Unranked
typical:
  deadline_months: [9, 10]
  conference_months: [12]
links:
  website: https://www.manuscriptlink.com/society/kiisc/conference/mobisec2026
  wikicfp: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=201536
notes:
- Organized by KIISC (Korea Institute of Information Security and Cryptology); steering chairs from Kookmin University,
  NICT and Yokohama National University
- 'Held in Korea, Japan or Taiwan (2018 in Cebu, Philippines); in December since 2022: 2022 Jeju, 2023 Okinawa,
  2024 and 2025 Sapporo, 2026 Taichung'
- Accepted papers appear in non-official preliminary online proceedings; only selected papers are invited to Springer
  CCIS after extension
- Main track (anonymous, 5 to 20 pages in EasyChair style), non-archival poster track, special sessions and the
  W-MobiSec workshop with later deadlines
- Program committee is mostly Korean and Japanese academics; 2026 is the 10th edition; the 2026 regular-paper deadline
  was extended by about two weeks
