notes:
- Series started in 2010, run by the ATIS Foundation with Deakin University; 16th edition in 2026
- Proceedings in Springer CCIS (not LNCS)
- Held mostly in Australia and India, sometimes China or New Zealand; 2025 was a multi-location event (Melbourne,
  Abu Dhabi, Kufa); no 2023 edition
- Late deadline (August to November), short papers up to 12 pages, anonymised; low registration fees; regarded as
  a minor venue
- Not ranked by CORE or CCF
