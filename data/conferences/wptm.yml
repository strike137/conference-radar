  website: https://ptmworkshop.gitlab.io/
notes:
- Half-day workshop co-located with the USENIX Symposium on Usable Privacy and Security (SOUPS); 2025 was the 4th annual edition
- Submissions are 1-page presentation proposals in the SOUPS template, handled on HotCRP; no full papers
- 'Non-archival: presentations are only posted on the workshop website'
- Program of a keynote, updates on privacy threat models (LINDDUN, PANOPTIC, UsersFirst), selected presentations and a group discussion
- "Workshop registration fee: 75 USD on top of SOUPS registration (2025); virtual attendance offered"
- Not among the accepted SOUPS 2026 (Hannover) workshops
