id: iconi
name: ICONI
full_name: International Conference on Internet
type: conference
tier: minor
areas: [networking, ai, security, data, general]
region: asia-pacific
language: english
frequency: annual
organizer: Korean Society for Internet Information (KSII)
organizer_country: [korea]
proceedings: ICONI proceedings (KSII); selected papers to KSII TIIS, Springer CCIS or JICS
archival: true
rank:
  core: Unranked
fee: 650 USD early for KSII members plus 100 USD non-member fee (2026)
typical:
  deadline_months: [9, 10]
  conference_months: [12]
links:
  website: https://iconi.org/
notes:
- Organized by KSII (Korean Society for Internet Information); international in name, most authors are from Korea
- Held every December in a different Asian city (Ho Chi Minh City 2023, Taipei 2024, Okinawa 2025, Singapore 2026)
- Short (2 pages) or full (3 to 6 pages) papers, double-blind review; abstract then paper deadline, both extended
  by roughly 10 to 18 days in 2025 and 2026
- Selected full papers are invited to extended versions in KSII TIIS (SCIE), Springer CCIS or JICS (KCI)
- In-person presentation required for inclusion in the proceedings; no-shows are listed and lose the early rate
  for two years
