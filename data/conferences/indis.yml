notes:
- One-day workshop of SCinet, the volunteer-built network of the SC conference, on research and education networking for data-intensive science
- Held with SC every year since SC14 (New Orleans); 2026 is the 13th edition
- Accepted papers appear in the SC workshop proceedings through IEEE TCHPC
- Full papers 8 pages and short papers 5 pages (excluding references), IEEE template, submitted via the SC Linklings system
- Short papers on testbed results (FABRIC, Chameleon, SCinet deployments) are encouraged; best paper award
- New in 2026, a Student Track for 2-page extended abstracts with a lightning talk
- Held at SC in the USA (Denver 2023, Atlanta 2024, St. Louis 2025, Chicago 2026)
- Not listed in CORE ICORE2026; not on the CCF 2026 list
