id: icaisd
name: ICAISD
full_name: International Conference on Advanced Information Scientific Development
type: conference
tier: minor
areas: [general, ai, security, software, networking]
region: southeast-asia
language: english
frequency: annual
organizer: Universitas Bina Sarana Informatika (UBSI)
organizer_country: [indonesia]
proceedings: IEEE Xplore
typical:
  deadline_months: [8, 9]
  conference_months: [11, 12]
links:
  website: https://conference.bsi.ac.id/
notes:
- Run by the Faculty of Engineering and Informatics of Universitas Bina Sarana Informatika (UBSI), Indonesia, with IEEE Indonesia Section and APTIKOM
- Past editions listed on the site are 2020, 2021, 2023, 2024 and 2025
- Usually held in Jakarta (UBSI Kramat 98); 2026 edition at the BSI Convention Center, Bekasi; hybrid
- Accepted and presented papers are submitted to IEEE Xplore; 4 to 6 page IEEE papers via EDAS, blind review by at least three reviewers
- "Acceptance rate: 41% (2025, 49/119)"
- Broad computer science scope; 2026 theme is AI-driven cybersecurity operation and strategy
- Not listed in ICORE2026 or the CCF list
