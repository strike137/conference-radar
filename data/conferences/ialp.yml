id: ialp
name: IALP
full_name: International Conference on Asian Language Processing
type: conference
tier: minor
areas: [nlp]
region: asia-pacific
language: english
frequency: annual
organizer: COLIPS (Chinese and Oriental Languages Information Processing Society, Singapore) with a local host university;
  technically sponsored by IEEE Singapore SMC Chapter
organizer_country: [singapore]
proceedings: IEEE Xplore
indexing: [DBLP]
rank:
  core: Unranked
fee: 800 SGD early full registration, non-member (2026); 700 SGD for COLIPS members; one paper per full registration
typical:
  deadline_months: [5, 7]
  conference_months: [8, 10]
links:
  website: https://www.colips.org/wp/ialpconf/
  wikicfp: http://www.wikicfp.com/cfp/program?id=1252
notes:
- Flagship conference of COLIPS (successor of ICCC, started 1986), rotating among Asian cities (Hohhot 2024, Kuching
  2025, Beijing 2026)
- Proceedings published by IEEE since 2009
- Covers all aspects of Asian language processing (NLP, speech, linguistics, language education); small conference
- Has a late-breaking submission round; deadlines are usually extended
- 'IALP 2026 (hosted by Minzu University of China): every accepted paper gets a 5-minute oral plus a poster slot'
