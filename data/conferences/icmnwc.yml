notes:
- Organized by the ECE and Electronics and Telecommunication departments of Sri Siddhartha Institute of Technology, Tumakuru, Karnataka, India
- Annual since 2021; the 2021 to 2025 proceedings are in IEEE Xplore
- 2026 papers are considered for Elsevier Procedia Computer Science (Scopus indexed)
- Papers 3 to 10 pages; submission via Microsoft CMT; similarity below 10% and AI-generated content below 20% required
- Short cycle, about 3.5 weeks from submission deadline to conference
- "Registration fee 2026: INR 12,000 (Indian authors), USD 200 (international authors)"
- Not listed in ICORE2026 or CCF
