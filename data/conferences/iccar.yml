notes:
- Smaller commercially run conference (secretariat on outlook.com and yeah.net addresses, registration via zmeeting)
- Held every April since 2016 (May in 2015); online 2020 to 2022, then Beijing 2023, Singapore 2024, Kyoto 2025, Nagoya 2026, Nanchang 2027
- Proceedings in IEEE Xplore every year since 2015, stated as indexed by EI Compendex and Scopus
- Full papers 4 to 10 pages, double-blind review; registration covers 6 pages, 70 USD per extra page
- Abstract-only presentations accepted without publication
- Not listed in ICORE2026 or the CCF 2026 list
