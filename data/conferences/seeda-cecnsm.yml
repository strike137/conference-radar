id: seeda-cecnsm
name: SEEDA-CECNSM
full_name: South-East Europe Design Automation, Computer Engineering, Computer Networks and Social Media Conference
type: conference
tier: minor
areas: [communications, networking, systems]
region: europe
language: english
frequency: annual
organizer: A Greek host university or research institute each year (Aristotle University of Thessaloniki in 2026), supported
  by the IEEE Greece Section
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
fee: 380 EUR regular, 330 EUR IEEE member, 100 EUR student (2026, early); 200 EUR per extra paper
typical:
  deadline_months: [6]
  conference_months: [9]
links:
  website: https://seeda2026.physics.auth.gr/
notes:
- Held every year in Greece since 2016, hosted by a Greek university or research institute (Preveza 2021, Egaleo 2024,
  Patras 2025, Thessaloniki 2026); 2026 was the 11th edition
- Broad scope across communication systems, design automation, computer networks, computer engineering and social
  media / e-technologies
- IEEE CIS technical co-sponsorship with proceedings in IEEE Xplore; only registered and presented papers are published
- Papers up to 8 pages in IEEE double-column format; pages beyond 6 cost 100 EUR each
- Submission via EasyChair
- Regional venue outside the usual CS rankings; not listed in ICORE2026 or the CCF 2026 list
