notes:
- Annual open-source technology conference started by OSCHINA, a Chinese open-source developer community
- Past editions per the official site, 2021 Shenzhen and Shanghai (Jul 31 to Aug 1, Shanghai part of WAIC), 2023
  Shanghai (May 27 to 28, 18 forums, 200+ talks), 2024 Shanghai (Aug 15 to 16, held together with GOGC), 2025
  Beijing (Nov 1 to 2, focus on open source and AI)
- 2026 theme is open source x AI; format changed to a one-day open fair with one main stage, four themed zones,
  workshops and hackathons
- Final of the 2026 open-source industry solution competition held the day before (not open to the public)
- No paper submission and no proceedings
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
