notes:
- Workshop on Arabic corpora, annotation and corpus based NLP; the 2025 edition focused on Arabic dialects
- Irregular series - WACL-1 in 2011, WACL-2 in 2013 at the Corpus Linguistics conference in Lancaster, WACL-3 in 2019 at Corpus Linguistics 2019 in Cardiff, WACL-4 in 2025 with COLING
- WACL-4 was held fully online on 2025-01-20 alongside COLING 2025 (Abu Dhabi)
- Long papers up to 8 pages and short papers up to 4 pages, excluding references
- 2019 and 2025 proceedings in the ACL Anthology
- Not listed in ICORE2026 and not on the CCF list
