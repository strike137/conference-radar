notes:
- Organized by IARIA as part of the ComputationWorld congress, co-located with PATTERNS, CLOUD COMPUTING, FUTURE COMPUTING and other IARIA events (19th edition in 2027)
- Covers cognitive science topics, brain-like and neuromorphic computing, cognitive models and applications
- Published open access in the IARIA ThinkMind library (ISSN 2308-4197); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Southern Europe (Porto, Barcelona, Nice, Venice, Valencia, Lisbon in recent years)
- The 2027 edition moves from April to March
