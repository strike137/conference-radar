links:
  website: https://www.waise.org/
notes:
- Workshop on AI safety engineering, ethically aligned design, regulation and standards for AI-based systems
- Co-located with SAFECOMP every year since 2018 (ninth edition in 2026); held on the SAFECOMP workshop day in Europe
- Papers published in the SAFECOMP workshops proceedings in Springer LNCS
- Full papers up to 12 pages, position papers up to 6 pages, technical talk abstracts up to 2 pages and doctoral papers
  of 6 to 8 pages
- Single-blind review with at least 3 reviewers per paper; best paper award
- Organizing committee from Arquimea Research Center, Lockheed Martin, University of Oldenburg, CEA LIST and Cyprus
  University of Technology (2026)
- Not listed in CORE ICORE2026 or on the CCF list
