notes:
- One-day workshop held with ACM SIGMOD/PODS 2026 in Bengaluru, India
- 'Scope: synthetic data pipelines, LLM-based data synthesis, evaluation and benchmarking, privacy and fairness, storage and management of synthetic datasets'
- Long papers up to 8 pages and short papers 4 to 6 pages, ACM SIGMOD template, submitted via Microsoft CMT
- Double-anonymous review
- Non-archival; accepted papers do not appear in the SIGMOD proceedings
- Region set as worldwide because it follows SIGMOD; only the 2026 edition is known
- Not listed in CORE ICORE2026 or in the CCF 2026 list
