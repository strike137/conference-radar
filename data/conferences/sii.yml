notes:
- Robotics and system integration symposium run by IEEE and SICE, steered by the SICE System Integration (SI) division
- Regular and special session papers of 4 to 6 pages (up to 8 with extra page charges), single-blind review by at
  least two reviewers, published in IEEE Xplore
- 1-page late breaking results are presented as posters, not reviewed and not in IEEE Xplore
- Held in early or mid January; rotates worldwide (Munich 2025, Cancun 2026, Kobe 2027)
- Paper deadline is usually extended by a few weeks (2027 moved from August 7 to September 10)
- Not listed in CORE ICORE2026
