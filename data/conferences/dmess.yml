notes:
- Workshop on data mining and machine learning for Earth system science, climate, hydrology, extremes and infrastructure resilience
- Co-convened by Forrest M. Hoffman and Jitendra Kumar (Oak Ridge National Laboratory) and Justin Jay Hnilo (US DOE)
- First held at ICCS 2009 and at ICCS through 2015; held with IEEE ICDM since 2017; 11 editions, not every year (2019, 2022, 2025; none at ICDM 2026)
- Accepted papers published in the ICDM workshop proceedings by the IEEE Computer Society Press (IEEE Xplore)
- 8 pages (10 maximum for an extra fee), IEEE 2-column format, triple-blind review
- Small half-day hybrid workshop (6 papers in 2025)
- Not ranked by CORE (not in ICORE2026) or CCF
