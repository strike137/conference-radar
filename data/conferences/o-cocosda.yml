notes:
- Annual flagship conference of Oriental COCOSDA, an independent Asian body for speech corpora and speech technology
  assessment for Oriental languages, independent since 1997
- 2025 edition hosted by Universitas Kristen Duta Wacana (UKDW) in Yogyakarta with KORIKA and BRIN
- Rotates around Asia (2020 Yangon, 2021 Singapore, 2022 Hanoi, 2023 Delhi, 2024 Hsinchu, 2025 Yogyakarta, 2026 Cebu)
- Proceedings in IEEE Xplore up to 2025; 2026 is ISCA-supported and its proceedings will be submitted to the ISCA Archive
- 2026 papers up to 8 pages plus 2 pages for references in the Interspeech 2026 template, double-blind review via EasyChair
  (2025 used up to 6 pages in IEEE SPS format)
- Topics include speech databases and text corpora, assessment of speech I/O, prosody, segmentation and labeling,
  multilingual corpora and standardization
- In-person conference; papers not presented on site are left out of the proceedings and IEEE Xplore
- Not listed in ICORE2026 or the CCF list
