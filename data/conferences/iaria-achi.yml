notes:
- Organized by IARIA as part of the DigitalWorld congress, co-located with ICDS, GEOProcessing, eTELEMED, eLmL, eKNOW and other IARIA events (20th edition in 2027)
- Covers human-computer interaction, including AI-powered and human-centered AI interaction tracks
- Published open access in the IARIA ThinkMind library (ISSN 2308-4138); prints via Curran Associates; selected papers invited to IARIA journals
- CORE C in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in southern Europe (Nice, Porto, Venice, Barcelona, Lisbon in recent years); onsite and online participation options
- IARIA deadlines are often extended after the initial date
