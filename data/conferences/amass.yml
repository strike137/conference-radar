notes:
- New ACM ASIACCS workshop, first held in 2026 in Bangalore, India
- Programme and general chairs from Robert Gordon University (Aberdeen, UK)
- 'Topics: malware detection and classification, binary analysis and reverse engineering, fuzzing, software supply
  chain attacks, AI and LLMs for malware and vulnerability analysis'
- Double-blind review, long papers up to 12 pages and short papers up to 6 pages in ACM sigconf format
- Proceedings in the ACM Digital Library, available during the conference
- Small first edition with 16 submissions and 5 accepted papers in 2026
- Not listed in ICORE2026 or the CCF list
