notes:
- Run yearly by Universitas Muhammadiyah Surakarta (UMS) since 2024; listed in the IEEE Conference Publication Program
- Proceedings in IEEE Xplore (2024 and 2025 volumes online)
- Held hybrid at Edutorium UMS, Surakarta, Central Java, from 2024 to 2026; the 2027 edition moves to BIM University, Denpasar, Bali
- Broad scope covering smart computing, IoT and machine learning (cybersecurity, NLP, machine vision, data mining, embedded systems)
- Submission via EDAS
- "Fee 2026: 500 USD overseas non IEEE member, 450 USD IEEE member, 300 USD students"
- Not listed in ICORE2026 or in the CCF 2026 list (no rank)
