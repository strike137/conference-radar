notes:
- Co-located with IEEE/IFIP NOMS; first edition at NOMS 2026 in Rome (WS1, full day)
- Built around the NOMS 2026 theme "AI for Management and Management for AI" (LLMs, DRL and XAI for network management, plus MLOps and AI lifecycle management)
- The same website lists the Manage-IoT workshops (IoT management, NOMS/IM 2021 to 2025) as previous editions
- Papers up to 6 pages in IEEE two-column format including references; submission via JEMS3
- Accepted and presented papers go into the NOMS proceedings and are submitted to IEEE Xplore
- Not listed in CORE ICORE2026 or the CCF list
- Deadline was extended twice in 2026 (Jan 19 -> Feb 2 -> Feb 9)
