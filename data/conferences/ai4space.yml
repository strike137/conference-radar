id: ai4space
name: AI4Space
full_name: Workshop on Artificial Intelligence for Space
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: irregular
organizer: Workshop organizing committee (series started by Tat-Jun Chin and Bo Chen, University of Adelaide); co-located with
  CVPR
organizer_country: [australia]
proceedings: IEEE Xplore and CVF Open Access (CVPR Workshops) for long papers
archival: true
typical:
  deadline_months: [2, 3]
  conference_months: [6]
links:
  website: https://ai4space.space/
notes:
- Workshop on computer vision and machine learning for space systems (spacecraft navigation, Earth observation onboard AI,
  planetary robotics, space debris)
- Editions at CVPR 2021, ECCV 2022, CVPR 2024, CVPR 2026 (4th, Denver) and CVPR 2027 (5th, announced as tentative)
- Long papers up to 8 pages in CVPR format, double-blind on OpenReview, published in the CVPR Workshops proceedings
- Short papers up to 4 pages appear only on the workshop website (non-archival)
- Hosts the SPARK spacecraft perception challenge (SPARK 2026 with the University of Luxembourg)
- Papers must target peaceful use of AI for space
- Older editions on https://aiforspace.github.io/
- Not listed in ICORE2026 or the CCF list
