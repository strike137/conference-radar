links:
  website: https://www.izs.ethz.ch/
notes:
- Organized by the Zurich Shannon Society in collaboration with ETH Zurich; held in Zurich every two years
- Topics are information theory, coding, detection and estimation, data storage, cryptography and optical or wireless
  communication; machine learning papers are discouraged unless closely related
- Papers up to 6 double-column A4 pages; proceedings published by ETH Library with a DOI
- Single track with 20-minute talks; about half of the talks are invited
- Not ranked in CORE (ICORE2026)
