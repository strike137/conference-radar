id: genaidetect
name: GenAIDetect
full_name: Workshop on Detecting AI Generated Content
type: workshop
tier: minor
areas: [nlp, ai, security]
region: worldwide
language: english
organizer: Workshop organizing committee from QCRI, MBZUAI, NYU Abu Dhabi, Qatar University and HBKU; co-located with
  COLING 2025
organizer_country: [other]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [11]
  conference_months: [1]
links:
  website: https://genai-content-detection.gitlab.io/
notes:
- Workshop on detecting machine-generated text, images, audio, video and multimodal content, deepfakes and AI-generated
  fake news
- Only one edition so far (1st, COLING 2025 in Abu Dhabi); ACL Anthology lists it as the Workshop on GenAI Content
  Detection
- Ran three shared tasks in 2025 (multilingual machine-generated text detection, academic essay authenticity,
  cross-domain detection)
- Long (8 pages), short (4 pages) and shared task papers (4 pages), double-blind review; dual submission allowed
- Proceedings in the ACL Anthology (2025.genaidetect-1)
- Not listed in ICORE2026 and not on the CCF list
