id: dai-workshop
name: DAI
full_name: Workshop on Deployable AI
type: workshop
tier: minor
areas: [ai, security]
region: worldwide
language: english
frequency: annual
organizer: AAAI workshop program; chaired by Balaraman Ravindran (Wadhwani School of Data Science and AI, IIT Madras) with co-organizers from IIT Madras, Rutgers and Google DeepMind India
organizer_country: [india]
proceedings: None (non-archival; the CFP states there are no official proceedings, accepted papers are made public)
archival: false
typical:
  deadline_months: [11]
  conference_months: [1, 2, 3]
links:
  website: https://dai-workshop.github.io/
notes:
- Workshop held with AAAI since 2023 (2023 Washington DC, 2024 Vancouver, 2025 Philadelphia, 2026 Singapore, 2027 Montreal)
- 2027 is the 5th edition, with a special focus on deployability of AI agents
- Topics include fairness, explainability, privacy, safety and security of deployed AI models
- Poster, short or position papers up to 4 pages and full papers up to 7 pages in AAAI format; double-blind review (2025)
- Non-archival, papers under review elsewhere are welcome
- Submissions via OpenReview since 2026
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
