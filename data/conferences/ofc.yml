notes:
- Largest conference and exhibition for optical communications and networking; OFC is a trademark of Optica, with
  IEEE ComSoc and IEEE Photonics Society as partners
- "Contributed papers: 3-page summary with blinded peer review by the Technical Program Committee; tracks for devices
  (D), systems (S) and networks (N) plus quantum (SC-Q)"
- Accepted papers appear in the OFC Technical Digest on the Optica Publishing Group platform and in IEEE Xplore after
  the conference
- Papers already posted on a preprint server are not considered
- Late-breaking results go to a separate postdeadline paper call about two weeks before the conference
- Held in the USA every March (Los Angeles in 2026 and 2027); about 17,800 attendees and 706 exhibitors in 2026
- Not listed in CORE or CCF (an optics and telecom venue rather than a computer science one)
