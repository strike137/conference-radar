id: icicacs
name: ICICACS
full_name: International Conference on Integrated Circuits and Communication Systems
type: conference
tier: minor
areas: [communications, networking, general]
region: south-asia
language: english
frequency: annual
organizer: Dept. of ECE, H.K.E. Society's Sir M Visvesvaraya College of Engineering, Raichur
organizer_country: [india]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [4]
  conference_months: [9]
links:
  website: http://iciccs.in/
notes:
- Run by the ECE department of H.K.E. Society's Sir M Visvesvaraya College of Engineering, Raichur, Karnataka, India
- Accepted and presented papers are submitted for possible inclusion in IEEE Xplore; the site links IEEE Xplore
  proceedings of the 2023 to 2026 editions
- Tracks on integrated circuits (IC and SoC design, RF devices, signal processing) and communication (5G and beyond,
  IoT, optical and wireless networks, network security)
- Double blind review by at least three reviewers; 4 to 10 page papers submitted through Microsoft CMT
- Hybrid conference held in Raichur
- "Registration fee (2027): Rs. 6,000 to 9,000 for Indian authors, USD 130 to 150 for foreign authors"
- Not to be confused with ICICCS (Intelligent Computing and Control Systems, iciccs.com)
