notes:
- Long-running workshop on scientific workflow systems, held with the SC conference every year (21st edition in 2026)
- Moves with SC, so it is held in the USA (St. Louis 2025, Chicago 2026)
- Accepted full papers go into the SC Workshops Proceedings volume; the 2026 CFP says it is available through IEEE Xplore
- Full papers up to 8 pages including references, single-blind review with at least three reviews; submission through the SC submission site
- Also takes short abstracts that feed a panel discussion; abstracts are not included in the proceedings
- Steering committee includes David Abramson, Malcolm Atkinson, Ewa Deelman and Michela Taufer
- Not ranked in CORE ICORE2026 and not on the CCF 2026 list
