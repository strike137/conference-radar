notes:
- Co-located workshop of Financial Cryptography and Data Security (FC), held since FC 2017 in Malta; 2026 was the 10th edition
- Topics are smart contract programming, verification, security and trust, plus blockchain theory and applications
- Two submission rounds (early deadline in January, late deadline in early February); abstract registration requested
  before each
- Regular papers up to 15 pages in LNCS format excluding references and appendices, anonymous submission
- Revised papers appear in the FC workshops post-proceedings volume of Springer LNCS (2025 -> LNCS 15753, shared with
  CAAW)
- At least one registration at the FC general or academic rate is required per accepted paper
- Held at the FC venue, which rotates worldwide (2025 Miyakojima, Japan; 2026 St. Kitts)
