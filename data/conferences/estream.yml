notes:
- Annual electrical, electronic and information sciences conference run by the Faculty of Electronics of VILNIUS TECH, held on its campus in Vilnius, Lithuania
- Technically co-sponsored by IEEE, with several IEEE Lithuania Section chapters
- Full papers of 4 to 6 pages in IEEE two-column format; accepted papers go to IEEE Xplore (proceedings since 2015) if at least one author presents in person
- In-person only; submissions are made by e-mail to the organizers
- Young Researchers Track for student posters (1-page extended abstract, not published in the proceedings)
- Selected best papers are invited to the journals New Trends in Computer Sciences and Science - Future of Lithuania
- Topics include communications and networking, circuits and devices, computing, signal processing, power, robotics and defence electronics
- Not listed in ICORE2026 or the CCF list
