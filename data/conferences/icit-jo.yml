notes:
- Biennial IT conference of Al-Zaytoonah University of Jordan, held in odd years (the site lists past editions back to 2005); 13th edition in 2027
- Not the IEEE International Conference on Industrial Technology, which uses the same acronym
- Held at Al-Zaytoonah University in Amman, Jordan; hybrid, with online presentation only for special cases
- Technically co-sponsored by IEEE; accepted and presented papers are submitted to IEEE Xplore (and Scopus)
- 2025 edition co-organized with BT, the BTIIC innovation centre and Ulster University (UK)
- Papers up to 6 pages in IEEE A4 format, submitted via EasyChair
- Selected papers are invited to the International Journal of Intelligent Engineering and Systems and the
  International Journal of Advances in Soft Computing and its Applications
- Tracks cover cybersecurity, AI and data science, software engineering, digital business and FinTech, and
  mathematical modeling
- Not listed in CORE ICORE2026 or the CCF list
