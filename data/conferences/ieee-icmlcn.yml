links:
  website: https://icmlcn2026.ieee-icmlcn.org/
notes:
- IEEE ComSoc conference started in 2024; the 2025 CFP calls Barcelona the second edition, 2026 was held in Abu Dhabi
- Covers ML for communication systems and networks and networking for distributed ML (wireless, optical, IoT, 6G)
- Accepted and presented papers are submitted to IEEE Xplore; papers up to 6 pages via EDAS, up to 2 extra pages at 100 USD each
- Also has workshops (own IEEE Xplore workshop proceedings), special sessions, demos, a doctoral forum and a 3MT
  competition
- 2026 edition was moved to 8 to 11 June and run as a hybrid conference with remote presentation allowed
- Not listed in ICORE2026
