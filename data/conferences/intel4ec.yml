notes:
- Workshop on AI/ML and LLM based operations (AIOps) for Edge-Cloud systems, such as monitoring, root-cause analysis, anomaly detection and fault prediction
- Held with IEEE/ACM UCC in 2022 (Vancouver, WA) and 2023 (Taormina); with IEEE IPDPS since 2025 (Milan 2025, New Orleans 2026, Seattle 2027)
- Accepted papers go into the IPDPS workshop proceedings, submitted to IEEE Xplore; papers must be presented to be included
- Full papers up to 8 pages and short papers up to 4 pages, IEEE style including references; single-blind review by at least three PC members
- 2026 program had four full and four short papers
- Not listed in CORE ICORE2026; not on the CCF 2026 list
