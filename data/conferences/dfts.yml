notes:
- Annual symposium on defect and fault tolerance, test, reliability, radiation effects and hardware security of VLSI systems; 39th edition in 2026
- DBLP and the history page list editions up to 2025 as DFT; the symposium itself uses the acronym DFTS
- Proceedings published by the IEEE Computer Society (CS Digital Library and IEEE Xplore); regular papers 6 pages, short papers 4 pages
- Abstract due one to two weeks before the full paper; 2026 deadlines were extended by two to three weeks
- Recently held in Europe (Juan-les-Pins 2023, Oxfordshire 2024, Barcelona 2025, Rome 2026); earlier often in the USA (Austin 2022)
- Strong links with the European Space Agency (2026 general co-chair and finance chair from ESA ESTEC)
- Authors of accepted papers are invited to a journal special issue
- Not ranked by CORE (ICORE2026) and not on the CCF 2026 list
