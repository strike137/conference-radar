notes:
- Organized in 2027 by the Department of IT, R P Sarathy Institute of Technology (formerly Narasu's Sarathy Institute of Technology), Salem, Tamil Nadu
- The 2023, 2024, 2025 and 2026 proceedings are in IEEE Xplore (linked from the official site); the 2027 publication page still says to be updated
- Broad scope covering pervasive computing, IoT, wireless sensor networks, social networks, AI and security
- Submission by email; papers 6 to 8 pages in IEEE format, double-blind review by at least two reviewers
- 7th edition in 2027
- Not found in ICORE2026; not on the CCF list
