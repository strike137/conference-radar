notes:
- Full-day workshop on LLMs and autonomous agents for recommendation, held with The Web Conference (WWW)
- Organized by industry researchers from Walmart Global Tech and Meta AI
- 1st edition at WWW 2026, held virtually on June 29, 2026 after the conference moved online from Dubai; 2nd edition accepted at WWW 2027 in Dublin
- Accepted papers appear in The Web Conference Companion Proceedings in the ACM Digital Library
- Short papers 4 to 6 pages, long papers 8 to 12 pages excluding references, single-blind review by at least 2 PC members, submission via OpenReview
- Not listed in the CORE ICORE2026 portal
