notes:
- 1st edition at IEEE EuroS&P 2023 (Delft); 2nd and 3rd co-located with ACM CCS (Salt Lake City 2024, Taipei 2025)
- Welcomes position papers on redesigning ICS for security and on secure open-source ICS software; 4 to 8 page anonymous
  submissions
- Also accepts presentations of previously accepted papers; authors can opt out of the ACM proceedings
- Best paper and best presentation awards; student travel grants may be available
- Not in the ACM CCS 2026 workshop list; no 2026 edition announced as of Sep 2026
