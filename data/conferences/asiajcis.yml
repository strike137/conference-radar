notes:
- Rotates among Japan, Korea, Taiwan and China (Seoul 2025, Dongguan 2026, Urayasu near Tokyo 2027)
- Supported by IEICE ICSS (Japan), KIISC (Korea) and CCISA (Taiwan); many Japanese university and NICT authors
- Double-blind review; regular and short papers; online presentation allowed in 2026
- Proceedings moved from IEEE CPS to EasyChair EPiC Series in Computing from 2025
- Small two-day conference (9 regular and 9 short papers in 2025); realistic and low-cost venue for students
