notes:
  - Workshop on hyperbolic, hyperspherical and other non-Euclidean representation learning for computer vision
  - Editions with ECCV 2024 (Milan), ICCV 2025 (Honolulu) and ECCV 2026 (Malmo)
  - Proceedings track papers (up to 14 pages, ECCV format) appear in the official workshop proceedings; a non-archival track takes 4-page extended abstracts and published work
  - Submissions on OpenReview; 6 proceedings track papers in the ICCV 2025 CVF Open Access workshop proceedings
  - 2026 edition is a morning half-day workshop titled "Beyond Euclidean, Hyperbolic Deep Learning for Computer Vision"
  - Not listed in ICORE2026 or the CCF list
