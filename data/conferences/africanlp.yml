links:
  website: https://sites.google.com/view/africanlp2026
notes:
- Workshop on NLP for African languages, corpora and tasks that matter in the African context; held every year since
  2020
- Co-located with ICLR 2023 (Kigali), ICLR 2024 (Vienna), ACL 2025 (Vienna) and EACL 2026 (Rabat); hybrid
- Proceedings in the ACL Anthology since 2025 (29 papers in 2025, 31 papers in 2026); the ICLR 2024 edition listed
  accepted papers on OpenReview only
- Papers of 4 to 8 pages can be archival or non-archival at the authors' choice; 2-page extended abstracts are
  non-archival; ARR-reviewed papers also accepted (2025)
- Yearly theme (Multilingual and Multicultural-aware LLMs in 2025, Multilingual Multimodal LLMs in 2026)
- Not listed in ICORE2026 and not on the CCF list
