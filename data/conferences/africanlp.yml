id: africanlp
name: AfricaNLP
full_name: Workshop on African Natural Language Processing
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizing committee from the Masakhane African NLP community; co-located with ICLR (2023, 2024) and
  ACL-family conferences (ACL 2025, EACL 2026)
organizer_country: [other]
proceedings: ACL Anthology (from 2025)
archival: true
typical:
  deadline_months: [12, 3]
