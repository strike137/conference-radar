archival: true
indexing: [IEEE Xplore, Scopus]
rank:
  core: Unranked
fee: 400 USD on-site early for non-IEEE members, 350 USD students (2026, international); virtual option cheaper
typical:
  deadline_months: [6, 7, 8]
  conference_months: [10]
links:
  website: https://icacsis.cs.ui.ac.id/
notes:
- Organized by the Faculty of Computer Science, Universitas Indonesia; held in Indonesia (Bali, Jakarta, Malang
  and Depok in past years)
- Annual up to the 14th edition in 2022; no editions 2023 to 2025; 15th edition in October 2026 on the UI campus
  in Depok
- Proceedings in IEEE Xplore (IEEE volumes found for 2013 to 2022) and indexed by Scopus; double-blind review, 6-page
  IEEE format (up to 10 pages with a 50 USD per page fee)
- Several submission batches; student travel support for partial lodging; virtual presentation option
