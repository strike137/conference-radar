organizer_country: [europe]
proceedings: ACM DL (2021, 2023, 2024); JOT special issue (2022, 2025)
typical:
  deadline_months: [4, 5]
  conference_months: [6, 7]
links:
  website: https://2026.ecoop.org/home/vortex-2026
notes:
- Workshop on runtime monitoring and runtime verification, including links to formal verification, testing and AI
- Co-located with ECOOP; 2026 was the 9th edition (series started in 2016)
- Held in Berlin 2022, Seattle 2023, Vienna 2024, Bergen 2025 and Brussels 2026; 2027 listed with ECOOP 2027 in Turin
- Long papers up to 10 pages and short papers up to 5 pages in ACM sigconf format; non-anonymous submission via EasyChair
- Proceedings of VORTEX 2021, 2023 and 2024 are in the ACM Digital Library; 2022 and 2025 instead had a JOT special issue of selected extended papers
- In-person attendance expected; online talks only in compelling circumstances
- Not listed in the CORE portal (ICORE2026)
