links:
  website: https://2027.ecoop.org/home/vortex-2027
notes:
- One-day ECOOP workshop on runtime monitoring and runtime verification, combining formal methods, program analysis, testing and AI
- 2026 was the 9th edition; held with ECOOP in Brussels 2026 and Bergen 2025, with ISSTA/ECOOP in Vienna 2024 and Seattle 2023
- Long papers up to 10 pages and short papers up to 5 pages, ACM sigconf format, non-anonymous submission via EasyChair
- Proceedings in the ACM DL for 2021, 2023 and 2024; 2022 and 2025 had a JOT special issue of selected extended papers
- 2026 call only says a selection of extended versions is planned to be published
- In-person attendance expected; online talks only in compelling circumstances
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
