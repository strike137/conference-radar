id: adma
name: ADMA
full_name: International Conference on Advanced Data Mining and Applications
type: conference
tier: minor
areas: [data, ai]
region: asia-pacific
language: english
frequency: annual
organizer: ADMA Steering Committee
proceedings: Springer LNAI
indexing: [EI, DBLP]
rank:
  core: C
  ccf: C
acceptance_rate: 45% (2025, 147/327)
fee: About 6,000 HKD, about 770 USD (2026, full paper author)
typical:
  deadline_months: [6, 7]
  conference_months: [10, 11]
links:
  website: https://adma2026.github.io/
