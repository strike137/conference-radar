  wikicfp: http://www.wikicfp.com/cfp/program?id=63
notes:
- Held mostly in China and Australia, recently also Japan (2023 Shenyang, 2024 Sydney, 2025 Kyoto, 2026 Hong Kong;
  2027 announced for Osaka)
- Proceedings in Springer LNAI; double-blind review; 15 pages max
- 'Many tracks with staggered deadlines: main, industry, special session, short paper, then poster and encore in
  August or September'
- Acceptance roughly 36-45% (2022-2025); deadlines are routinely extended
