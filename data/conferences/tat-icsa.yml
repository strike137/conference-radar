notes:
- Workshop on theory, architecture and guarantees for trustworthy agent-based systems, including security and privacy of agentic systems
- First edition in 2027 at ICSA 2027 in Sydney
- Accepted papers are published in the ICSA 2027 Companion Proceedings in IEEE Xplore
- Full papers up to 8 pages and short papers up to 4 pages in IEEE format, submitted through the ICSA 2027 EasyChair
- At least three reviews per paper; Distinguish Paper Award for about 5% of accepted papers
- Full-day, in-person workshop
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
