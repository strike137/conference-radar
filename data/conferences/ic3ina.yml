links:
  website: https://conference.brin.go.id/ic3ina2026/
notes:
- Run by BRIN, Indonesia's national research agency (Research Center for Data and Information Sciences, Research
  Organization for Electronics and Informatics); IEEE Indonesia Section is sponsor
- Held 2013 to 2019 and 2021 to 2025; proceedings in IEEE Xplore except 2021 and 2022 (ACM DL), all Scopus indexed
  per the site
- 4 to 6 page IEEE-format papers via EDAS; IEEE no-show policy applies; hybrid attendance
- Held in Indonesia (Bandung 2024, Jakarta 2025 at BRIN, Lombok 2026 at a resort; day 3 of the 2026 dates is an
  optional tour)
- Short timeline; rolling submission window of about five weeks with notifications by batch
- Not listed in ICORE2026 or the CCF list
