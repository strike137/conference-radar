notes:
- Japan-Korea computer vision workshop dating back to 1995 (FCV), international since 2017; host alternates each
  year between Japan and Korea (2023 Yeosu, 2024 Tokyo, 2025 Seoul, 2026 Tokushima)
- Traditionally held in February; moved to late September / early October from 2026
- Long papers 12 to 15 pages or short papers 2 to 11 pages in Springer format, not anonymous, submitted via
  Microsoft CMT
- Workshop papers are shared with participants only; long papers that opt in get a second post-workshop review for
  the Springer CCIS proceedings
- Small and student friendly, hybrid format in 2026; 2026 submission deadline was extended twice (Jul 31 -> Aug 17
  -> Aug 31)
