notes:
- Organized by INSTICC; papers in the SCITEPRESS Digital Library
- Not found in ICORE2026; photonics venue outside the usual CS rankings, regarded as a minor venue
- Three tracks (optics, photonics, lasers); photonics covers optical communication, sensing and quantum photonics
- Co-located with ICAART and other INSTICC conferences with free cross access; 2027 runs alongside ICAART, VISAPP,
  ROBOVIS and GRIVAPP
- Held in European cities (Lisbon 2023, Rome 2024, Porto 2025, Marbella 2026, Valletta 2027); remote presentation
  allowed in exceptional cases
- Two submission stages plus workshop (NanoPlasMeta), special session and abstracts tracks
