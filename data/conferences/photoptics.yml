frequency: annual
organizer: INSTICC (Institute for Systems and Technologies of Information, Control and Communication)
organizer_country: [europe]
proceedings: SCITEPRESS
archival: true
typical:
  deadline_months: [9, 10, 11]
  conference_months: [2, 3]
links:
