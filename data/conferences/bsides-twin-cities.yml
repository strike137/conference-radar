notes:
- Inclusive Security BSides conference for hackers, hobbyists and technologists in Minneapolis / St. Paul, Minnesota, USA
- Started in 2024 as a revival of BSides MSP, which stopped during COVID
- One-day event at Open Book, Minneapolis (2026), followed by a happy hour
- Talks of about 20 minutes including Q&A; call for proposals open from April to early September with rolling acceptances
- No proceedings
