notes:
- Sponsored by USENIX in cooperation with ACM SIGOPS; proceedings are open access on the USENIX site
- Held in July in the USA (2021 edition was virtual); co-located with USENIX ATC from 2021 to 2025 (Seattle 2026, Baltimore 2027)
- Double-blind review, 12 pages plus references (14 pages in the final version), abstract registration one week before the paper deadline
- Since 2026 has an Operational Systems track, at most eight submissions per author and conditional accept instead of revise and resubmit
- "Acceptance rate: 20% (2026, 134/669); 2026 was the first multi-track OSDI"
- Widely regarded as one of the two top systems venues together with SOSP (ICORE2026 A*, CCF A)
