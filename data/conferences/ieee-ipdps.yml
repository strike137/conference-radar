notes:
- Flagship parallel and distributed computing symposium sponsored by IEEE CS TCPP; 41st edition in 2027
- CORE A (ICORE2026), CCF B
- "Main papers: 10 pages IEEE format plus unlimited references; double-anonymous two-round review with rebuttal and a
  revise option"
- Early-reject notifications; at most eight submissions per author; accepted papers must add a reproducibility
  appendix and be presented in person
- Many co-located workshops each year (2027 workshops already announced)
- Mostly held in the USA with some editions in Europe and Latin America (Milan 2025, Lyon 2022, Rio de Janeiro 2019)
