notes:
- Workshop co-located with IEEE EuroS&P since 2019; 8th edition in 2026 (Lisbon)
- Interdisciplinary focus on measuring cyber-criminal and attacker operations, with contributions from computer
  security, criminology, psychology, law and economics
- Full papers about 10 pages and position papers about 4 pages (IEEE format) go into the EuroS&P IEEE workshops
  proceedings; Research Talk submissions get the same review but no proceedings
- Anonymous submission via EasyChair; open review model where reviews of accepted papers are published in a public
  GitHub repository
- Held in Europe with EuroS&P (virtual 2020 and 2021, Genoa 2022, Delft 2023, Vienna 2024, Venice 2025, Lisbon 2026)
- Submission deadline usually in February or March and often extended; workshop day in June or July (September in 2021)
- Not listed in ICORE2026
