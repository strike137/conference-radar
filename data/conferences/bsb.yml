notes:
- Bioinformatics and computational biology symposium of the Brazilian Computer Society (SBC), held since 2002; 19th
  edition in 2026
- Accepted papers published in the SBC OpenLib (SOL) with a DOI and indexed by DBLP (older editions appeared in
  Springer LNBI)
- Full papers up to 12 pages, short papers up to 6 pages, SBC template; abstracts and slides in English, talks in
  English (preferred) or Portuguese
- Selected papers invited to submit extended versions to PLOS Computational Biology
- Small venue (14 to 26 papers per year in SOL, 2020 to 2025); held in a different Brazilian city each year
  (Fortaleza 2025, Ribeirão Preto 2026)
- Not ranked in CORE ICORE2026
