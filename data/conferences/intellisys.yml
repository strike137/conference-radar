notes:
- Run by the Science and Information (SAI) Organization, a UK based company that also runs the Computing, FTC and Computer Vision conferences
- Founded in 2015; held in Amsterdam every year since 2022 (2021 was virtual)
- Proceedings in Springer Lecture Notes in Networks and Systems, several volumes per year (four volumes for 2026)
- Double-blind review by at least three PC members; the organizer states an acceptance rate of 37 to 39%
- Two submission rounds with deadlines about ten months before the conference; papers up to 18 pages plus 7 pages of references and appendices
- In person with a virtual presentation option; IntelliHealth is co-located and shares the proceedings
- Not listed in the CORE ICORE2026 portal
