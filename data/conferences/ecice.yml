notes:
- Organized by the IEEE Tainan Section Sensors Council, the College of Engineering of National Formosa University and
  its Smart Machinery and Intelligent Manufacturing Research Center
- Full papers go to MDPI Engineering Proceedings (Scopus) since 2024; IEEE ECICE 2019 to 2023 were in IEEE Xplore;
  grew out of IEEE ICAM 2018
- Selected papers can be recommended to partner journals (extra charge) or IIKII journals (no charge)
- Abstract first, then a 4 to 8 page full paper in the Engineering Proceedings Word template (no LaTeX); AI-generated
  papers may be rejected
- Hybrid (in person or online); 2026 edition at National Formosa University, Huwei, Yunlin
- Full paper acceptance comes after the conference; final papers due at the end of December
- Not listed in CORE (ICORE2026); a broad, low-barrier venue
