notes:
- Held every year with ACM CODASPY since 2021; location follows CODASPY (2024 Porto, 2025 Pittsburgh, 2026 Frankfurt)
- Proceedings in the ACM Digital Library
- Full papers up to 10 pages in double-column ACM format including references and appendix; position and work-in-progress
  papers up to 6 pages
- Submissions are not anonymized (author names and affiliations on the paper); submission via EasyChair
- Broad CPS and IoT security topics, including ICS, automotive, medical devices, drones and trustworthy AI for CPS
- Not listed in CORE ICORE2026
