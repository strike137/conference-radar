id: icpics
name: ICPICS
full_name: IEEE International Conference on Power, Intelligent Computing and Systems
type: conference
tier: minor
areas: [communications, ai]
region: china
language: english
frequency: annual
organizer: Conference convener (icpics@126.com) with Changshu Institute of Technology and Suzhou University of Technology as sponsors; IEEE listed as sponsor
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI Compendex, Scopus]
fee: 500 USD or 3600 RMB non-IEEE non-student, 450 USD IEEE member (2026, normal rate); 50 USD less before 2026-05-01; one paper of 4 to 6 pages
typical:
  deadline_months: [7]
  conference_months: [7, 8]
links:
  website: http://www.icpics.org/
notes:
- Annual since 2019, always in Shenyang, China (July until 2023, late August in 2026)
- Covers power engineering (power systems, renewable generation, high voltage) together with AI and intelligent computing
- Proceedings 2019 to 2023 in IEEE Xplore with IEEE catalog numbers, stated as indexed by EI Compendex
- Small conference run by a convener with a 126.com contact address; papers are submitted in Word format by system or email
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
