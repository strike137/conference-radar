notes:
- Annual practitioner conference of ISC2, the cybersecurity certification body behind CISSP; 2026 is the 16th edition
- In-person plus a virtual pass; sessions earn CPE credits (up to 60 for 2026 virtual attendees)
- Tracks cover AI security, quantum, GRC, zero trust, cloud, threat detection and cyber leadership, with
  pre-conference workshops and a sponsor expo
- Talks only, no proceedings; aimed at security professionals rather than researchers
- Not listed in the CORE ICORE2026 portal
