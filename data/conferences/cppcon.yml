notes:
- Annual week-long C++ community conference, a project of the non-profit Standard C++ Foundation
- Held in Aurora, Colorado, near the Denver airport (2026 edition)
- Keynotes by Bjarne Stroustrup, Herb Sutter and other C++ experts; main program of multiple tracks plus posters, lightning talks and open content sessions
- Main program proposals in spring, poster submissions in summer; poster competition with awards
- Pre- and post-conference classes (onsite and online) registered separately
- Hudson River Trading student scholarship for attendance
- No papers; all talks published on YouTube after early access on the Video Archive Portal
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
