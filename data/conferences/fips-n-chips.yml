notes:
- Practitioner conference on cryptographic module validation (FIPS 140-3, CMVP, ISO/IEC 19790) run by the
  non-profit Crypto-V Alliance
- Submissions are 1 to 2 page extended abstracts for talks, double-blind reviewed; accepted talks can be expanded
  into full papers for Springer post-proceedings (ACSAR series)
- 2026 edition held at UT Austin, co-located with Texas Crypto Day; includes the CVA and CMVP award ceremony
- Aims for a balance between academic research and industry practice
