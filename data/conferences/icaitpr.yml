id: icaitpr
name: ICAITPR
full_name: International Conference on Artificial Intelligence Trends and Pattern Recognition
type: conference
tier: minor
areas: [ai, vision]
region: south-asia
language: english
frequency: biennial
organizer: Vardhaman College of Engineering, Hyderabad
organizer_country: [india]
proceedings: IEEE Xplore
archival: true
indexing: [IEEE Xplore]
fee: 6,000 to 12,500 INR for Indian authors, 150 to 200 USD for foreign authors (2026)
typical:
  deadline_months: [7, 8]
  conference_months: [12]
links:
  website: http://icaitpr.com/
notes:
- Biennial conference on AI, machine learning and pattern recognition at Vardhaman College of Engineering, Hyderabad
- Editions in 2022 (March), 2024 (December) and 2026 (December)
- Presented papers submitted to IEEE Xplore; up to 6 pages, 2 extra pages for a fee
- Fully in person; virtual presentations not permitted
- Submission through Microsoft CMT; camera-ready similarity limit 15%
- Not listed in ICORE2026 or the CCF list
