notes:
- Run by the Faculty of Electronic Engineering & Technology, Universiti Malaysia Perlis (UniMAP)
- Co-sponsored by the IEEE Malaysia Industrial Electronics/Industry Applications (IE/IA) Joint Chapter
- Supported by Indonesian universities in Medan (Universitas Harapan Medan, Universitas Prima Indonesia, Universitas Al-Azhar Medan, Universitas Medan Area)
- Proceedings of the 2026 edition published in IEEE Xplore on 1 October 2026
- Broad EE scope (communications, RF, power, control, embedded and IoT, computer architecture, AI, signal processing)
- Papers limited to 4 pages in IEEE two-column format, double-blind review, submission via EDAS
- 2026 deadlines were extended (submission 17 May -> 14 June, notification 31 May -> 13 July)
- Not ranked by CORE (ICORE2026); not in the CCF list
