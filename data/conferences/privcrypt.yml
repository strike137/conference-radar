notes:
- One-day workshop affiliated with Eurocrypt; first edition on May 10, 2026 at Sapienza University of Rome
- 'Topics: anonymous credentials, privacy-preserving tokens, blind signatures and OPRFs, zero-knowledge proofs, post-quantum constructions'
- Call for presentations, not papers; abstract of at most 3 pages plus references, non-anonymous
- 'Non-archival: no formal proceedings, so work under submission or already published elsewhere is accepted'
- 2026 program had 4 keynotes and 7 contributed talks
