notes:
- Workshop on knowledge graph representation, construction, reasoning, embeddings, KGs with LLMs and applications on
  big data; 2026 is the 6th edition
- Held every year with the IEEE International Conference on Big Data, so it follows BigData around the world
- Accepted papers are published in the IEEE BigData proceedings (IEEE Computer Society Press, IEEE Xplore)
- Long papers up to 10 pages and short or position papers of 2 to 4 pages, IEEE two-column format
- At least one author needs a full IEEE BigData registration
- Virtual in 2025, hybrid in 2026
- Not ranked by CORE (not in ICORE2026) or CCF
