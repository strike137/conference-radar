notes:
- Run by Rostov State Transport University (RGUPS, Russia) and JSC NIIAS, supported by the Russian Association of Artificial Intelligence
- "Proceedings: Springer Lecture Notes in Networks and Systems (LNNS); papers must be presented to be indexed"
- English-only submissions via EasyChair; an application for participation is due a few weeks before the paper deadline
- Hosted by a partner university each year, recently in China and Russia (Harbin 2024, Sirius 2025, Changsha 2026); earlier hosts include ITMO, VSB Ostrava, TU Varna, Aydin University Istanbul and Shanghai University
- Hybrid format (in person and online) in 2025 and 2026
- 2026 is the 10th edition
- Not listed in CORE ICORE2026 or the CCF list
