notes:
- Workshop on disaggregated and composable systems (CXL, memory pooling, OS and runtime support, AI system disaggregation)
- Co-located with ASPLOS (San Diego 2024, Rotterdam 2025 with EuroSys, Pittsburgh 2026)
- 4 to 6 page papers in ACM sigplan format, double-blind review
- Accepted papers can go to the ACM DL (ICPS, open access with possible APC); authors may opt out and publish only on the workshop website
- Successor of the COMPSYS (2022, 2023) and HCM (2023) workshops listed as past editions
- Not listed in CORE ICORE2026
