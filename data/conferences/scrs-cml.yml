notes:
- Technically sponsored by the Soft Computing Research Society (SCRS, New Delhi), which runs many hybrid conferences each year with host institutions
- After-conference proceedings in Springer Lecture Notes in Networks and Systems (LNNS); three volumes each for 2024 and 2025
- Hybrid (in-person and online); hosted by the Department of Computer Applications, Sikkim Manipal Institute of Technology 2024 to 2026, then AIAT Adelaide, Australia in 2027
- 4th edition in 2027; submission via Microsoft CMT
- High-volume event; not listed in CORE ICORE2026 and not on the CCF list
