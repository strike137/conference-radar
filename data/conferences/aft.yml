notes:
- Annual conference of IFCA, the association that also runs Financial Cryptography (FC); first held in 2019
- Focus on blockchains, cryptocurrencies, DeFi, consensus, MEV, CBDCs and exchanges, from theory to measurement
- Proceedings are open access in Dagstuhl LIPIcs; authors may opt to publish only a 3 page extended abstract
  with a link to the full paper
- Anonymous submission, up to 20 pages in LIPIcs format; SoK papers welcome
- Held in person with no remote option; recent hosts were universities and central banks (Princeton 2023, Vienna
  2024, CMU 2025, LSE London 2026)
- 'AFT 2026 allowed simultaneous submission to WINE 2026 (withdraw from WINE if accepted at AFT)'
