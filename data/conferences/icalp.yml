notes:
- Flagship conference of the European Association for Theoretical Computer Science (EATCS); CORE A*, CCF B
- Two tracks (Track A and Track B) with separate chairs
- Proceedings in the open-access LIPIcs series (Schloss Dagstuhl) since 2015
- Held in Europe every year (Paris 2022, Paderborn 2023, Tallinn 2024, Aarhus 2025, London 2026)
- 2026 edition was the 53rd, held jointly with PODC and SPAA at Royal Holloway, University of London
- Track B has a rebuttal period; Track A authors are contacted only about correctness issues
