notes:
- Run by the French chapter of ACM SIGAPP (association SIGAPP.FR) in collaboration with ACM SIGAPP; 18th edition in 2026
- Proceedings in Springer CCIS; camera-ready is due after the conference, so the volume appears as post-proceedings
- Submissions up to 15 pages, at least 3 reviewers, with a rebuttal step before the final decision
- Main deadline is usually July and has been extended to September in 2025 and 2026
- Venue moves each year, mostly around the Mediterranean (Hammamet 2021, Venice 2022, Crete 2023, Naples 2024, Ho Chi Minh City 2025, A Coruña 2026)
- "Registration fee: 650 EUR (2026, regular)"
- Online attendance possible for authors who cannot travel
- Not on the CCF list
