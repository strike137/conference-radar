notes:
- Workshop on rigorous, reproducible AI for network traffic classification (benchmarks, datasets, shortcut
  learning, encrypted traffic, foundation models for networking)
- First edition in 2026, a half-day workshop co-located with ACM CoNEXT 2026 in Utrecht
- Accepted papers appear in the ACM Digital Library
- Double-blind review on HotCRP; up to 5 pages in two-column ACM format (6 pages for camera-ready), excluding
  references and appendix
- Welcomes negative results, reproducibility studies and benchmark contributions
- Registration goes through CoNEXT (Workshops Only or Full Conference and Workshops ticket)
