proceedings: IWIN Proceedings (Informatics Society)
rank:
  core: Unranked
fee: 80,000 JPY or 800 EUR full, 40,000 JPY or 400 EUR student (2026)
typical:
  deadline_months: [5, 6]
  conference_months: [8, 9]
links:
  website: https://www.infsoc.org/conference/iwin2026/
notes:
- Organized by the Informatics Society (INFSOC), a Japanese society; attendees are mostly from Japanese universities
  and companies
- Held around late August or early September, mostly in Japan (2022 to 2025); Europe in 2016 to 2019, online in
  2020 and 2021, Da Nang, Vietnam in 2026
- 'Two-step submission via EasyChair: a one-page abstract is screened first, then the full paper is reviewed; no
  page limit'
- Evening discussion sessions on each day of the program; selected papers invited to the International Journal of
  Informatics Society (IJIS)
