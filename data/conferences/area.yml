notes:
- One-day workshop bridging autonomous agents, robotics, software engineering and formal verification
- Organised by Angelo Ferrando (University of Modena and Reggio Emilia) and Rafael C. Cardoso (University of Aberdeen)
- Proceedings in Springer CCIS since 2024 (LNCS format); 2022 and 2023 proceedings in EPTCS
- Co-located with IJCAI-ECAI 2022 (Vienna), ECAI 2023 (Krakow), ECAI 2024 (Santiago de Compostela), ECAI 2025 (Bologna) and PAAMS 2026 (Naples)
- Single-blind review; 2025 accepted review transfers of papers rejected from ECAI
- Registration goes through the host conference
- Not listed in ICORE2026
