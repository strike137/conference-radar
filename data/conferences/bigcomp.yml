notes:
- Initiated and organized by KIISE (Korean Institute of Information Scientists and Engineers), co-sponsored by IEEE;
  covers big data, data mining, ML/AI, knowledge graphs, recommender systems
- Proceedings in IEEE Xplore; double-blind review; full papers 8 pages, short 4, poster 2 (IEEE two-column); at
  least one author is expected to present in person
- 'Rotates around East and Southeast Asia: 2025 Kota Kinabalu, 2026 Guangzhou, 2027 Fukuoka (in cooperation with
  DBSJ)'
- BigComp 2027 (Jan 25 to 28) is in Fukuoka the same week as ICEIC 2027 (Jan 24 to 27)
