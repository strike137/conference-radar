notes:
- Long-running applied AI conference (39th edition in 2026, 40th in 2027), strong in applications to engineering,
  industry and medicine
- Proceedings in Springer LNCS/LNAI; best papers invited to a special issue of Applied Intelligence
- Mostly held in Asia (Kitakyushu 2022 and 2025, Shanghai 2023, Kuala Lumpur 2026) with some European editions (Hradec
  Kralove 2024, Naples 2027)
- Moderate acceptance (about half in 2026); relatively low registration fee (about 500 USD)
