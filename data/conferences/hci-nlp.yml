notes:
- Workshop at the intersection of HCI and NLP (user evaluation, human-centered NLP, interfaces, participatory design, fairness)
- Editions at EACL 2021 (online), NAACL 2022 Seattle, NAACL 2024 Mexico City and EMNLP 2025 Suzhou; no 2023 edition
- Fifth edition announced as part of NAACL 2027, June 1 to 5, 2027 (exact day TBD)
- Long (8 pages) and short (4 pages) papers, archival or non-archival by author choice; archival papers go into the ACL Anthology
- Extended abstracts (up to 4 pages) are non-archival; fast-track submissions of papers rejected elsewhere with their previous reviews
- Two-way anonymized review via OpenReview
- Not ranked in ICORE2026 and not on the CCF list
