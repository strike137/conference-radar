links:
  website: https://kmms.or.kr/
notes:
- Organized by the Korea Multimedia Society, which also publishes the KCI-listed Journal of Korea Multimedia Society
  and the English journal JMIS
- 'Held twice a year: spring (May) and fall (November), at rotating universities or convention centers (Pusan National
  University in fall 2025, Daejeon DCC in spring 2026, Jeju National University in fall 2026)'
- Korean-language short papers presented orally (graduate students and above) or as posters; online presentation
  by pre-recorded video is allowed; separate undergraduate poster competition
- Broad multimedia scope incl. AI, vision, mobile computing and an information security and blockchain track
- Submission deadlines are usually extended by one week (Oct 19 -> Oct 26 in fall 2025, Apr 5 -> Apr 12 in spring
  2026)
