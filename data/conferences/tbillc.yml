notes:
- Biennial symposium on logic, formal semantics and linguistics, and theoretical computer science, held in Georgia since 1995
- Run by ILLC Amsterdam with Tbilisi State University and the Georgian Academy of Sciences
- Moves around Georgia (Lagodekhi 2017, Batumi 2019, Telavi 2023, Kutaisi 2025, Gori 2027); no 2021 edition
- Submission is an abstract of up to 3 pages (4 with references); accepted abstracts go into informal proceedings before the symposium
- After the symposium, authors may submit full papers to post-proceedings in Springer LNCS, with a new single-blind review
- TbiLLC 2025 was co-located with JELIA 2025 in Kutaisi
- Not listed in CORE ICORE2026 or the CCF list
