notes:
- Organized by IEICE; held every September, the counterpart of the March General Conference
- No peer review; 1-page paper for general sessions, up to 2 pages for symposium and poster sessions
- Application and manuscript share one strict deadline in late June (17:00)
- Japanese or English; presenters must present on site
- The 2026 edition ran 3 days instead of the usual 4
