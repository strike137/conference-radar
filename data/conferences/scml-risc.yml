notes:
- Conference on combining symbolic computation (computer algebra, automated reasoning) and machine learning, including LLMs and theorem proving
- Organized by RISC (JKU Linz) as part of RISC Summer, at Hagenberg Castle, Austria
- Presentation-oriented; submissions are 1-2 page extended abstracts, reviewed only for relevance
- Accepted abstracts are collected in one booklet with a DOI in the RISC Proceedings on SCML (SCML Publishing Forum)
- Full papers can be sent separately to the SCML Publishing Forum, which has a continuous call without deadline
- 2026 was the first edition; no follow-up edition announced yet
- Not listed in ICORE2026 or the CCF 2026 list
