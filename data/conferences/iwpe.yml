language: english
frequency: annual
organizer: Co-located with IEEE EuroS&P; 2026 general chairs Meiko Jensen (Karlstad University), Frank Pallas (University
  of Salzburg) and Isabel Wagner (University of Basel)
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
rank:
  core: Unranked
typical:
  deadline_months: [2]
  conference_months: [6, 7]
links:
  website: https://www.iwpe.info/
notes:
- Held annually since 2015; co-located with IEEE EuroS&P every year since 2020 (with IEEE EuroS&P in 2018 and IEEE S&P in 2017 and 2019)
- Archival papers appear in the IEEE EuroS&P Workshops proceedings on IEEE Xplore; a non-archival option is also
  offered
- Double-blind; short position papers up to 4 pages and long papers up to 8 pages including references, IEEE A4
  template, EasyChair
- Separate industry track for 15 minute talks or 60 minute panels (1-page proposal, not archived)
- Deadlines were extended by about two weeks in both 2025 and 2026
- Not listed in ICORE2026
