notes:
- Biennial European forum for logic-based approaches to AI (knowledge representation, argumentation, nonmonotonic
  reasoning, answer set programming, and related topics), running since 1988
- Proceedings in Springer LNAI
- Held in Europe; recent editions in Klagenfurt (2021), Dresden (2023) and Kutaisi, Georgia (2025)
- 2025 accepted 39 full and 5 short papers from 108 submissions
- CORE B; not on the CCF list
