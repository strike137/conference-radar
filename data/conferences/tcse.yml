notes:
- Annual national software engineering conference of SEAT, first held in 2005; 22nd edition in 2026
- Host university changes each year (NKNU in Kaohsiung 2025, NCUT in Taichung 2026, Fo Guang University in Yilan 2027)
- 'Four paper types: regular session (Chinese, 4-6 pages), English session (4-6 pages), software demo (2-4 pages) and
  poster (2-4 pages); submission via EasyChair'
- Selected English-session papers are recommended to a JISE (Journal of Information Science and Engineering) special
  issue
- 98 papers in 2026 (60 regular, 16 English, 12 poster, 10 demo)
- 'Full registration (per paper, 2026): NT$3,500 for SEAT members, NT$4,500 for non-members'
- Deadlines are usually extended several times
