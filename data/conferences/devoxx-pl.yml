notes:
- Part of the Devoxx family of developer conferences, "by developers, for developers"
- Held every June at the ICE Krakow Congress Centre, Kraków, Poland; three days
- Talks chosen from a call for papers on cfp.dev; 50 minute talks, short talks and 60 minute keynotes
- Early bird conference tickets (2026, until 31 January) from 1497 PLN plus VAT for all 3 days
- No papers or proceedings; practitioner talks only
