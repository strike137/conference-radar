region: china
language: english
frequency: annual
organizer: Host universities (Xijing University, Huanggang Normal University and others) with a commercial conference service (IAAST, iaast.cn, for 2024 and 2025)
organizer_country: [china]
proceedings: SPIE Proceedings
archival: true
indexing: [EI, Scopus]
fee: Author 450 USD early bird or 500 USD regular, listener 150 USD (2027)
typical:
  deadline_months: [4, 7]
  conference_months: [8, 9]
links:
  website: http://www.iccidt.org/
notes:
- Small Chinese-organized conference on communications, networking and digital technologies, started in 2024
- "Held in Wuhan (online) 2024, Singapore (online) 2025, Xi'an with a virtual Singapore track 2026, Xi'an 2027"
- Proceedings of 2024 and 2025 published by SPIE and indexed in EI Compendex; 2026 approved by SPIE, per the site
- Papers of 4 to 8 pages submitted by email; about three anonymous reviewers per paper, per the site
- Dates move from year to year (March 2024, September 2025 and 2026, August 2027)
- Not listed in CORE ICORE2026 or the CCF list
