links:
  website: http://www.iccidt.org/
notes:
- Small commercially organized conference; secretariat reached via an acamail.org address with GMT+8 office hours
- Editions so far -> Wuhan, China (Mar 2024), Singapore (Sep 2025), Xi'an, China with a virtual Singapore session (Sep 2026)
- 2026 edition hosted by Xijing University with IAAST; Huanggang Normal University, Haute Alsace University, ESIEA Paris and Zhejiang University of Technology listed as associates
- Accepted papers published by SPIE (CIDT 2025 in SPIE Proceedings vol. 14064) and submitted to EI Compendex and Scopus
- Each submission reviewed by about three reviewers, per the site
- Not listed in CORE ICORE2026 or the CCF list
