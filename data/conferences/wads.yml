notes:
- Biennial algorithms and data structures symposium held in odd years, alternating with SWAT
- Formerly the Workshop on Algorithms and Data Structures, first held in Ottawa in 1989
- Held in Canada almost every time (Halifax 2021, Montreal 2023, Toronto 2025), often co-located with CCCG
- Proceedings in Springer LNCS up to 2023; WADS 2025 appeared in the open-access LIPIcs series (volume 349)
- Submissions up to 12 pages plus references (14 pages total) in LIPIcs format
- Best paper award in memory of Alejandro Lopez-Ortiz and a best student presentation award
- Ranked B in ICORE2026; not on the CCF list
