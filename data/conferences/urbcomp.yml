notes:
- Long-running KDD workshop, held every year since 2012; 15th edition in 2026
- Co-located with ACM SIGKDD, so it moves with KDD (Barcelona 2024, Toronto 2025, Jeju, Korea 2026)
- 'Scope: urban sensing and data management, trajectory mining, spatio-temporal ML, transportation, environment, LLM-powered urban agents'
- Full papers up to 9 pages, vision and short papers up to 5 pages (including references), ACM sigconf format, submitted via EasyChair
- Single-blind review; one best paper award
- Accepted papers are posted as PDFs on the workshop website; authors may opt for a recommendation to the journal Transactions in Urban Data, Science, and Technology
- Not listed in ICORE2026 and not on the CCF list
