notes:
- Annual meeting of the Chinese-speaking computer vision and machine learning community, aimed at young researchers
- First held in 2011; 2026 in Wuhan was the 16th edition, with about 5000 expected attendees
- Run by the China Society of Image and Graphics (CSIG) with local host universities (HUST, Wuhan University and China
  University of Geosciences in 2026; Sun Yat-sen University in 2025)
- Invited keynotes, tutorials, workshops and a large poster session of top conference and journal papers already
  published or accepted, so no proceedings and nothing new is published
- No registration fee in past editions, but places are limited and pre-registration fills up within an hour
- Held in a different Chinese city each year (Hangzhou 2021, Tianjin 2022, Wuxi 2023, Chongqing 2024, Zhuhai 2025,
  Wuhan 2026)
- Also runs the year-round online VALSE Webinar series
- Not in the CORE ICORE2026 portal or the CCF 2026 list
