notes:
- Volunteer-run Security BSides conference in Dehradun, Uttarakhand, India
- Editions so far are 0x01 (2024), 0x02 (2026) and 0x03 (2027); checked-in attendance 187 in 2024 and 255 in 2026
- Two days of hands-on trainings, then a CTF final day and a single track of talks with villages
- Talks are 45 minutes or 15 minute lightning talks, chosen by five volunteer reviewers through an open CFP on cfp.directory
- Talks are in English; no proceedings
- Not listed in the CORE ICORE2026 portal or on the CCF list
