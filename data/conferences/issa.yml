notes:
- Formerly Information Security South Africa; held in South Africa
- Co-organised by the University of Pretoria, CHPC, DIRISA and SANReN; runs as a parallel stream of the annual CHPC
  National Conference
- Double-blind review by at least two reviewers; Springer format, up to 11 pages including references; submission via
  EasyChair
- Accepted papers are published after the event as Springer CCIS post-proceedings
- 2025 was the 24th edition (Cape Town); the 25th edition (ISSA 2026, planned for the Durban area) was cancelled
- Not listed in CORE ICORE2026
