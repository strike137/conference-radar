notes:
- Long-running series on automata and formal languages, theory and applications, started in Hungary in the 1980s by Istvan Peak
- Held every few years (Szeged 2014, Debrecen 2017, Eger 2023, Kosice 2026)
- AFL 2026 (17th) was the first edition held in Slovakia, organized by P. J. Safarik University in Kosice and the Mathematical Institute of the Slovak Academy of Sciences
- Papers up to 15 pages in EPTCS style; proceedings in EPTCS (open access)
- Extended versions of selected AFL 2026 papers invited to a special issue of the International Journal of Foundations of Computer Science (IJFCS)
- Small conference; 18 accepted papers in 2026
- Not listed in ICORE2026; not on the CCF 2026 list
