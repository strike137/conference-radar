id: iwssip
name: IWSSIP
full_name: International Conference on Systems, Signals and Image Processing
type: conference
tier: minor
areas: [communications, vision]
region: europe
language: english
frequency: annual
organizer: IWSSIP Steering Committee with a rotating host university (University of Ljubljana for the postponed 33rd edition)
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [3, 4]
  conference_months: [6, 7]
links:
  website: https://www.iwssip.org/
notes:
- Long-running series (since 1994) on signal processing, image processing and communications
- Proceedings of past editions in IEEE Xplore; the 2025 edition was technically co-sponsored by IEEE
- Rotates among Central and Southeast European host universities (Bratislava 2021, Sofia 2022, Ohrid 2023, Graz
  2024, Skopje 2025); the 2020 edition (Niteroi, Brazil) was held online
- The 33rd edition, planned for 10-12 June 2026 in Ljubljana, was postponed to 9-11 June 2027 because of low
  submission numbers; papers already submitted stay under consideration
- Full papers 4 pages standard, up to 6 pages
- Not listed in the CORE portal (ICORE2026)
