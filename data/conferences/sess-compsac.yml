notes:
- Workshop of IEEE COMPSAC (IEEE Computer Society); 10th edition in 2026 in Madrid, 9th at COMPSAC 2025 in Toronto
- Covers software engineering for smart systems, IoT, cyber-physical systems, context-aware and adaptive systems, and LLMs in smart systems
- Organized by Francois Siewe and Vasileios Germanos (De Montfort University), Sofia Meacham (Bournemouth University) and Shikun Zhou (University of Portsmouth), UK
- Not listed in the CORE portal; COMPSAC itself is CORE B
- Workshop papers are 6 pages (up to 2 extra pages at USD 125 each) and appear in the COMPSAC proceedings on IEEE Xplore
- Workshop deadlines are shared across all COMPSAC workshops; the 2027 workshop list (COMPSAC 2027 in Tokyo, July 13 to 16) was not yet published
