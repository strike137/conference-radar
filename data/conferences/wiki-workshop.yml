notes:
- Annual research forum on all aspects of Wikimedia projects (Wikipedia, Wikidata, Commons and others), from computational and AI work to social science
- Co-organized by the Wikimedia Foundation Research team; held with WWW (The Web Conference) or ICWSM from 2015, online since 2021 and as a standalone virtual event since 2023
- Research track takes 2-page extended abstracts (plus 1 page of references, figures, tables) submitted via OpenReview; single-blind review by the program committee
- Non-archival; accepted abstracts are posted on the workshop website and published work is welcome
- Accepted authors present a pre-recorded talk with live Q&A; registration via Pretix
- Not listed in ICORE2026
