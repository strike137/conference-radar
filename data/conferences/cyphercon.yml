notes:
- Hacker and technology conference in Milwaukee, Wisconsin, billed as the largest technology conference in the state
  (over 3000 attendees, around 150 talks)
- Held at the Baird Center; tracks on offensive and defensive security, AI, beginners and executives, plus 40+ Wards
  (villages)
- Aims for about 20% of talks on cryptography; blind speaker selection committee
- 2027 is the 10th edition (CypherCon 10.0); no published proceedings
