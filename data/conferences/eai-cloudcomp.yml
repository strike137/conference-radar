notes:
- EAI conference series on cloud computing, with a recent focus on AI and LLMs in cloud and edge environments
- Proceedings in Springer LNICST; selected papers invited to extend for Mobile Networks and Applications (MONET)
- Regular papers 12 or more pages, short papers 6 to 11 pages in Springer format; anonymized submission via Confy+
- Main track, late track and workshop track with separate deadlines
- Held since 2009; recent editions in Bratislava (2023), Luton (2024) and Derby (2026); no 2025 edition is listed
- 2020 to 2022 editions were virtual
- Not listed in ICORE2026
