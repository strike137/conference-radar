notes:
  - Workshop on computer vision for surveillance in real-world conditions (detection, tracking, action recognition, scene understanding, super-resolution, legal, ethical and privacy issues)
  - 6th edition at WACV 2026 in Tucson, 7th at WACV 2027 in Orlando
  - Runs alongside the UPAR challenge on pedestrian attributes, person retrieval and pose estimation
  - Accepted papers go in the WACV Workshops proceedings published by CVF and IEEE
  - 10 papers in 2025 and 16 in 2026 in the WACV workshop proceedings on CVF Open Access
  - Not listed in ICORE2026 or the CCF list
