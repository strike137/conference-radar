notes:
- Biennial series running since 1991, organized by the universities of Granada, Málaga and UPC (Barcelona)
- Full papers up to 12 pages in Springer LNCS format, published in Springer LNCS (2023 in two volumes, LNCS 14134 and 14135)
- Also accepts 2-page extended abstracts (Book of Abstracts only) and showcases of already published journal papers
- Extended versions of selected papers may go to journal special issues (Neural Computing and Applications, PLoS One, PeerJ
  Computer Science, Neural Processing Letters)
- Held in Spain or Portugal (Ponta Delgada 2023, A Coruña 2025, Puerto de la Cruz, Tenerife 2027)
- "CORE rank: National: Spain (ICORE2026)"
