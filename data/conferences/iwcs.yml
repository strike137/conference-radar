notes:
- Main conference of ACL SIGSEM (Special Interest Group on Computational Semantics); held every two years
- Proceedings in the ACL Anthology
- Long papers up to 8 pages and short papers up to 4 pages; double-blind review; in-person presentation required
- Workshops on the last day
- Held in Europe (Düsseldorf 2025, Nancy 2023, Groningen 2021 online, Gothenburg 2019, London 2015)
- Not listed in CORE ICORE2026
