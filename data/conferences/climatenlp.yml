id: climatenlp
name: ClimateNLP
full_name: Workshop on Natural Language Processing Meets Climate Change
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizing committee (2026 organizers from ETH Zurich, University of Zurich, Hitachi, Climate Policy Radar and Leuphana University of Luneburg); co-located with ACL or EMNLP
organizer_country: [europe]
proceedings: ACL Anthology
archival: true
indexing: [ACL Anthology]
typical:
  deadline_months: [5, 7]
  conference_months: [7, 8, 10]
links:
  website: https://nlp4climate.github.io/
notes:
- Workshop on NLP for climate change science and action, such as environmental claim detection, climate fact checking, climate QA systems, stance detection and policy and corporate disclosure analysis
- Brings together NLP researchers with NGOs, industry and policy makers; NGOs and industry can also submit talk abstracts
- Held with ACL 2024 (Bangkok), ACL 2025 (Vienna) and EMNLP 2026 (Budapest)
- Long (8 pages) and short (4 pages) papers in ACL format, double-blind review through OpenReview
- Papers submitted as archival go to the ACL Anthology proceedings (21 papers in 2024, 22 in 2025)
- Not ranked in ICORE2026 and not on the CCF list
