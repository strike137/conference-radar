id: cfail
name: CFAIL
full_name: Conference for Failed Approaches and Insightful Losses in Cryptology
type: workshop
tier: minor
areas: [crypto]
region: north-america
language: english
frequency: annual
organizer: CFAIL steering committee (general chair Allison Bishop, Proof Trading and City College CUNY); affiliated event
  of IACR Crypto
organizer_country: [usa]
proceedings: None (extended abstracts posted on the website)
archival: false
typical:
  deadline_months: [6]
  conference_months: [8]
links:
  website: https://www.cfail.org/
notes:
- One-day workshop affiliated with Crypto at UCSB, Santa Barbara, held every year since 2019 (2026 was the eighth edition)
- Solicits insightful failures in cryptology, such as unsuccessful attempts to prove a conjecture, break a scheme or
  implement a cryptosystem
- Extended abstracts in any format with no page limit, but reviewers need not read past page 5; submission through EasyChair
- No formal proceedings; accepted abstracts are posted online before the event, so work published elsewhere can be
  presented
- Hybrid event with remote talks allowed; also runs a puzzle challenge and PowerPoint karaoke
- Not listed in ICORE2026 or the CCF 2026 list
