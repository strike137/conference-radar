notes:
- One-day workshop on choreographic programming, i.e. languages, types, runtimes and verification for coordination plans of concurrent and distributed systems
- Held with PLDI in 2024 (Copenhagen) and 2026 (Boulder); the PLDI series page lists no 2025 edition
- Talk proposals as extended abstracts of up to 6 pages in ACM format, lightweight double-blind review
- No formal published proceedings, so work in progress and already published work are welcome
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
