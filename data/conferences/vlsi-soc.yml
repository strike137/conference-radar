notes:
- Sponsored by IFIP TC10 Working Group 10.5, IEEE CEDA and the IEEE Circuits and Systems Society; series started in
  1981 in Edinburgh
- Covers VLSI and SoC design broadly, from circuits and design automation to embedded systems, AI hardware and
  hardware security
- Rotates around the world (Singapore 2021, Patras 2022, Sharjah 2023, Tangier 2024, Puerto Varas 2025, Limassol 2026)
- Papers up to 4 pages plus 1 page of references in IEEE format; proceedings in IEEE Xplore
- Selected best papers are invited to submit extended versions as chapters of a Springer book
- Has a PhD and Student Forum with a later deadline, and travel grants for PhD students from emerging countries
- CORE C (ICORE2026); not in the CCF list
