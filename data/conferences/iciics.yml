notes:
- Organized by Sharnbasva University, Kalaburagi, Karnataka, India
- Proceedings of the first three editions (ICIICS-2023, 2024 and 2026) are in IEEE Xplore
- Two broad tracks, integrated intelligence (AI, ML, vision, security) and communication systems
- Papers of 4 to 8 pages; submission through Microsoft CMT; iThenticate similarity limit 30%
- 4th edition (ICIICS-2027) on 19 and 20 November 2027
- Not listed in ICORE2026 or the CCF list
