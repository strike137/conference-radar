notes:
- Pan-African cybersecurity conference of PAICTA, focused on security for development in Africa
- 2024 edition was virtual; 2025 held in Gqeberha, South Africa
- IEEE was the technical sponsor in 2025; registered and presented papers are submitted to IEEE Xplore, posters and workshop papers are not
- Double-blind review; full papers up to 10 pages and short papers up to 6 pages in IEEE format via EasyChair
- Also accepts industry talks, workshops, tutorials and demonstrations
- Not listed in the CORE ICORE2026 portal
