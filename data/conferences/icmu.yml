id: icmu
name: ICMU
full_name: International Conference on Mobile Computing and Ubiquitous Networking
type: conference
tier: minor
areas: [networking, communications, systems, ai, security]
region: asia-pacific
language: english
frequency: biennial
organizer: IPSJ SIG-MBL (Mobile Computing and Pervasive Systems), supported by IPSJ SIG-DPS, SIG-UBI, SIG-CDS and
  SIG-ITS
organizer_country: [japan]
proceedings: IEEE Xplore
indexing: [IEEE Xplore, DBLP, Scopus]
rank:
  core: Unranked
fee: '110,000 JPY (2025, full non-member, early); 2027 tentative: 132,000 JPY full non-member early, 77,000 JPY
  student non-member early; student registration covers only a poster/demo paper (2025 rule)'
typical:
  deadline_months: [4, 5, 6]
  conference_months: [9]
links:
  website: https://www.icmu.org/
  dblp: https://dblp.org/db/conf/icmu/
  wikicfp: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=184804&copyownerid=23162
notes:
- Organized by IPSJ SIG-MBL with other IPSJ SIGs; proceedings in IEEE Xplore
- Biennial since 2019 (odd years); mostly in Japan (2021 Tokyo, 2023 Kyoto) but 2025 was Busan and 2027 goes to
  Taipei
- Double-blind review; 6-page full papers (up to 2 extra pages for a fee) plus a 2-page poster/demo track
- 2027 CFP explicitly lists Intent-Based Networking (IBN), AI/ML for networking and trust, security and privacy
- 'Strict no-show policy: papers not presented are excluded from IEEE Xplore'
