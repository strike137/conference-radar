notes:
- Community security conference run by the not-for-profit Mainland Advanced Research Society, part of the Security BSides movement
- First held in 2013; drew 700+ attendees before COVID
- Held at SFU Harbour Centre, downtown Vancouver, over two days with several parallel tracks (including a GRC track), workshops, a malware village and a CTF
- Call for participation (talks) and call for workshops open for about one month; submissions scored by a review board
- Talks only, no proceedings
