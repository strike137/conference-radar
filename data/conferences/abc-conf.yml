notes:
- Small conference on human activity recognition and behavior computing (wearable, vision and ambient sensing, behavior change, healthcare and nursing applications)
- Run by a community centred on Sozo Inoue's group at Kyushu Institute of Technology (site at autocare.ai); IEEE technically co-sponsored
- Full papers (4 to 10 pages) go to IEEE proceedings in IEEE Xplore (2027 still subject to approval) or to the IJABC journal (6 to 15 pages); double-blind review via Microsoft CMT
- Also takes position papers and activity recognition challenge papers with their own later deadlines; one review round with a resubmission step
- Hybrid; editions in Spokane 2019, Kitakyushu 2020, online 2021, London 2022, Kaiserslautern 2023, Nakatsu and Kitakyushu 2024, Abu Dhabi 2025, Muroran and Hakodate 2026, Sydney 2027
- "Registration fee (2027): 550 USD regular or 450 USD student for IEEE Xplore papers; 390 USD regular for IJABC, challenge or position papers"
- Not listed in CORE (ICORE2026) or CCF
