id: raw
name: RAW
full_name: Reconfigurable Architectures Workshop
type: workshop
tier: minor
areas: [systems]
region: worldwide
language: english
frequency: annual
organizer: RAW steering committee (USC steering chair, Politecnico di Milano workshop chair; sponsored by IEEE CS TCPP, held with IEEE IPDPS)
organizer_country: [usa, europe]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [1, 2]
  conference_months: [5, 6]
links:
  website: https://raw.necst.it/
notes:
- Workshop on reconfigurable computing (FPGAs, CGRAs, high-level synthesis, CAD and runtime reconfiguration); 33rd
  edition in 2026
- Co-located with IEEE IPDPS every year, so it moves with IPDPS (New Orleans 2026); two-day workshop
- Proceedings submitted to IEEE Xplore with the IPDPS workshops; top papers invited to an ACM TRETS special issue
- Full papers up to 6 pages and short papers up to 4 pages plus up to 2 pages of references; single-blind review by at
  least three PC members; submission through Linklings
- Steering committee from USC, LSU, KIT and Politecnico di Milano; best paper and other awards, PhD forum
- Not found on the CORE portal (ICORE2026); not on the CCF 2026 list
