notes:
- Flagship ISCA conference and the largest venue for speech science and spoken language technology
- Regular papers are 4 pages plus up to 2 pages for references and acknowledgments (2026; it was 4+1 in 2025); double-blind
  with a rebuttal period
- 2026 added a Long Paper track (8 pages) with acceptance capped at 30%
- Record 2,694 submissions in 2025; ISCA requires at least one co-author to review if qualified
- 2026 edition in Sydney (Asia-Pacific); 2027 in Sao Paulo, the first Interspeech in South America
