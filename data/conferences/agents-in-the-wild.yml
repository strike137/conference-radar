notes:
- Workshop series (AIWILD) on the safety, security and trustworthiness of AI agents
- Three editions in 2026, at ICLR (Rio de Janeiro, 237 submissions), ICML (Seoul, 327 submissions) and NeurIPS (Sydney)
- Non-archival; papers under review or recently accepted elsewhere are welcome
- Regular papers up to 9 or 10 pages and short papers up to 4 pages; double-blind review on OpenReview
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
