notes:
- Workshop on large language and foundation models, from model research and efficiency to RAG, agents, domain models and safety; 2026 is the 4th edition
- Held with the IEEE International Conference on Big Data (IEEE BigData) every year since 2023
- Accepted papers are published by IEEE in the BigData proceedings and submitted to IEEE Xplore
- Long papers up to 10 pages, short and vision papers up to 5 pages (6 in 2025) including references, IEEE format, single-blind review
- Online in 2025; in person at the BigData venue in 2026
- The same lab also runs a special session on LLMs and foundation models (SSLLFM) at IEEE DSAA
- Not ranked by CORE (not in ICORE2026) or CCF
