notes:
- Full-day workshop at ACM RecSys on recommender systems for environmental and social sustainability
- Held with RecSys 2024 (Bari), RecSys 2025 (Prague) and RecSys 2026 (Minneapolis, third edition)
- Accepted papers go to a post-proceedings volume in Springer CCIS, indexed in Scopus and Web of Science
- Full and reproducibility papers up to 12 pages, short 6, position 4 (Springer LNCS format); 1-page extended abstracts are presented but not published
- Single-blind review by at least two PC members via EasyChair; deadlines in GMT
- Not listed in the CORE ICORE2026 portal
