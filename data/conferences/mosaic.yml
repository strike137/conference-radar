notes:
- New workshop on interconnects, optical fabrics, memory tiering and hardware-software co-design for large AI clusters,
  co-located with ACM SIGCOMM; 1st edition at SIGCOMM 2026 in Denver
- Organized and largely reviewed by Marvell engineers; strong industry focus, also takes whitepapers
- Workshop papers are published in the SIGCOMM proceedings in the ACM Digital Library unless opted out
- Research papers up to 6 pages including references; whitepapers and position papers up to 2 pages plus 1 page of
  references
- Half-day workshop with a keynote and an invited talk; four papers in the 2026 program
- Not listed in the CORE portal (ICORE2026)
