notes:
- Organized under the auspices of GSCL, the DGfS computational linguistics group, the Austrian Society for AI and
  SwissNLP
- Annual since 2018 (biennial before), started in 1992; rotates within Germany, Austria and Switzerland
- Proceedings published open access by the host university and archived in the ACL Anthology (2021 onwards)
- Long papers 8 pages and short papers 4 pages plus references in ACL style via OpenReview, double-blind, in
  English; 1-page abstracts are non-archival
- Workshops and the GermEval shared tasks run alongside the main conference
- Not listed in CORE ICORE2026 or the CCF 2026 list
