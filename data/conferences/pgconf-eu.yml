notes:
- Practitioner PostgreSQL conference run entirely by volunteers of PostgreSQL Europe; the largest PostgreSQL conference in Europe
- Talks range from internals discussions by core developers to end user case studies; multiple parallel tracks for DBAs, developers and decision makers
- Talk proposals scored 1 to 9 by a volunteer talk selection committee; more than 250 submissions every year; no proceedings
- Three conference days plus a Community Events Day; five minute lightning talks are proposed at the conference itself
- Moves around Europe every year (Berlin 2022, Prague 2023, Athens 2024, Riga 2025, Valencia 2026); usually held in October
- Not listed in the CORE ICORE2026 portal
