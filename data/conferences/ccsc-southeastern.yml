notes:
- Regional computing education conference of the CCSC (CCSC:SE), held in cooperation with SIGCSE and ACM
- Papers are double-blind peer reviewed, up to 10 single-spaced pages plus references
- Accepted papers appear in the Journal of Computing Sciences in Colleges; only works presented at the conference go to the ACM Digital Library
- Also panels, tutorials, workshops, a student research contest and a student programming contest
- Held at colleges in the US Southeast; 2026 (40th) at East Tennessee State University, Johnson City, Tennessee
- Fall 2027 edition is planned at Florida State University Panama City
- "Registration fee: 175 USD early (2026)"
- Not listed in ICORE2026; not on the CCF list
