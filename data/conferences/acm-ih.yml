notes:
- New ACM SIGCHI conference on HCI and health; first edition in Porto, Portugal in July 2026
- No full paper track; paper sessions mostly present papers accepted to the ACM HEALTH journal special issue on Human Centered Computing in Healthcare
- Short forms (up to 5,000 words, anonymous review) and demos are published as IH Extended Abstracts in the ACM DL but are considered non-archival
- Other tracks include workshops, doctoral colloquium, early career workshop, related contributions (already published work, presentation only) and birds of a feather
- Not listed in CORE (ICORE2026) or CCF
