notes:
- Workshop for papers that distill broader NLP research narratives (cross-lab reconciliation of findings, thesis-like
  overviews of a body of work)
- Held at EMNLP 2023 (Singapore) and ACL 2026 (San Diego)
- Archival papers of up to 8 pages plus references, submitted on OpenReview in ACL format
- Proceedings in the ACL Anthology (11 papers in 2023, 13 papers in 2026)
- Not listed in ICORE2026 and not on the CCF list
