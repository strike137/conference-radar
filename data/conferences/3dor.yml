notes:
- Eurographics symposium on 3D shape retrieval, similarity and understanding, held since 2008; hosts the SHREC shape retrieval contest tracks
- Two paper routes; full papers (up to 12 pages) go through a two-stage journal review into a Computers & Graphics (Elsevier) special section, proceedings papers (about 6 pages) go to the Eurographics Digital Library
- Double-blind review
- Held mostly in Europe (Cardiff 2021, Florence 2022, Lille 2023, Santiago de Chile 2024, London 2025, Genoa 2026)
- Each edition has its own website; not listed in the ICORE2026 portal and not on the CCF list
