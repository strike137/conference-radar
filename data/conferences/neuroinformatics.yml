notes:
- Russian neural network and neuroscience conference held every October in Moscow or Dolgoprudny (MEPhI or MIPT); 2026 was the 28th edition
- English site title is "International Conference on Artificial Neural Networks (Neuroinformatics)"; Russian name Neiroinformatika
- Covers neural network theory, machine learning, neurobiology, adaptive behavior and cognitive research; includes a school-seminar and a young scientists contest
- Selected English papers go to Springer SCI as "Advances in Neural Computation, Machine Learning, and Cognitive Research" (volume IX for 2025), plus special issues of Optical Memory and Neural Networks
- Papers may be in Russian or English; non-SCI papers go to a separate proceedings volume indexed in the Russian RSCI (RINTs)
- Submission through OpenReview; single-blind review; Springer papers 10-15 pages (minimum 6)
- Not listed in CORE ICORE2026
