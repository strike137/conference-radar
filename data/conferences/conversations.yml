  conference_months: [11]
links:
  website: https://conversations.ws/
notes:
  - Started in 2017 as a chatbot research workshop at Internet Science; independent workshop from 2019 and a symposium since 2025
  - Scope widened from chatbot research and design to chatbots and human-centred AI in 2024
  - Accepted full (12 to 16 pages) and short (6 to 8 pages) papers go to a Springer LNCS post-proceedings volume; position papers and project presentations appear only on the website
  - Double-blind review for full and short papers; all presenters must attend on site
  - "Recent hosts: Amsterdam (2022), Oslo (2023), Thessaloniki (2024), Lübeck (2025), Amsterdam (2026)"
  - "2026: nearly 40 papers selected from more than 80 submissions"
  - Interdisciplinary audience (informatics, communication science, HCI, psychology)
  - Not listed in CORE ICORE2026; not on the CCF list
