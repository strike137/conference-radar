notes:
- Biennial Nordic computer vision and image analysis conference; the host society rotates (Danish DSAGM ran 2025 in Reykjavik, Norwegian NOBIM runs 2027 in Gjovik)
- Full papers in Springer LNCS (2025 in two volumes); a separate abstract-only track is not published
- Up to 12 pages plus 2 pages of references; double-blind review by three reviewers, single round without rebuttal
- In-person presentation required; reviews of accepted papers are published
- Not listed in ICORE2026
