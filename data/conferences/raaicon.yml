notes:
- Jointly organized by the IEEE Bangladesh Section and the IEEE RAS Bangladesh Chapter; hosted by a different
  Bangladeshi university each edition (BUET 2024, MIST Dhaka 2025, JUST Jashore 2026)
- Accepted papers go to IEEE Xplore; the 2019, 2021 and 2024 proceedings are linked from the site
- Held in 2019 and 2021, annual since 2024; hybrid (physical and online)
- Scope covers robotics, automation, AI and machine learning, and IoT
- Co-located with IEEE Bangladesh Section events such as the WIE Bangladesh Summit and YPCon
- Not ranked in ICORE2026 and not in the CCF list
