notes:
- Independent Security BSides community event in Dresden, Germany, held on a Saturday in early December
- One-day, in-person conference in English with 30-minute talks, a CTF and a post-event activity
- Open CFP on pretalx; topics include vulnerability research, offensive and defensive security, AI security and cryptography
- Low-cost tickets (2026, 10 EUR students, 30 EUR regular, including catering)
- No proceedings
- Not listed in CORE ICORE2026
