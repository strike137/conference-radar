notes:
- Annual international conference held in China since 2009 (Hangzhou, Nanjing, Nanchang); 18th edition in 2026
- Financial sponsor Zhejiang University; technical sponsor IEEE CIS Nanjing Chapter
- Proceedings published by the IEEE Computer Society Conference Publishing Services (CPS) and submitted to IEEE Xplore
- The site states that proceedings from 2009 to 2025 are EI indexed
- Papers of up to 4 pages in IEEE format, with up to 3 extra pages
- "Topics: human-machine systems, AI, machine learning, robotics, computer vision, cybernetics"
- Short review cycle (notification about two weeks after the deadline)
