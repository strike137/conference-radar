notes:
- Community-driven Security BSides conference in Philadelphia, Pennsylvania, USA, held every December since 2016 except 2021 and 2022 (closed due to COVID-19); 2020 was virtual
- One day, single track, on a Friday in December at Live! Casino and Hotel Philadelphia (2025 and 2026)
- The 2025 edition had 642 attendees, 19 speakers and 33 sponsors
- Call for papers for 50 minute presentations and 30 minute short talks; first-time speakers are paired with a mentor
- Low-cost tickets (80 USD early bird, 35 USD student in 2026); OWASP CTF included
- Talks are recorded and slides shared afterwards; no proceedings
