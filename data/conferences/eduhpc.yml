links:
  website: https://cdercenter.org/eduhpc-2026/
notes:
- Workshop on HPC and parallel and distributed computing education, curricula, training and workforce development, held with IEEE/ACM SC every year since 2013
- Full papers 7 to 8 pages and short papers 4 to 5 pages (Research to Education track), single-blind review, published in the SC Workshops Proceedings
- Peachy Parallel Assignments track; accepted assignments are combined into one collective paper that goes through the paper track review
- Lightning talks are not in the proceedings (2025 rules, authors post them on arXiv)
- Most Distinguished Paper award
- Not listed in CORE ICORE2026
