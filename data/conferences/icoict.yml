notes:
- Organized by Telkom University with Multimedia University (Malaysia); usually held in Bandung, Indonesia
- 2026 edition was planned for Bali but moved to Bandung (Telkom University) on the same dates
- Proceedings in IEEE Xplore every year since 2013, including 2026 (the site had said indexing was pending)
- Two submission rounds; 6-page IEEE format; hybrid with online presentation option
- 'Broad scope: AI/ML, data science, IoT and smart infrastructure, IT applications including cybersecurity'
