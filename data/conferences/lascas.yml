notes:
- IEEE CASS flagship conference in Latin America; 2027 is the 18th edition, hosted by the IEEE Panama Section CASS
  Chapter (Region 9)
- Papers up to 5 pages (4 pages of content plus 1 optional page of references), submitted via EasyChair
- Accepted and presented papers go to IEEE Xplore (indexed in Scopus, Ei Compendex and INSPEC)
- Selected papers are invited to submit an extended version (at least 50% new material) to the IEEE Open Journal of
  Circuits and Systems (OJ-CAS)
- Covers analog, digital and mixed-signal circuits, VLSI and systems; also accepts special session and tutorial
  proposals
- Not ranked in CORE ICORE2026
