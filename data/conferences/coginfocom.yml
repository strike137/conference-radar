notes:
- Conference on cognitive infocommunications, linking infocommunications with cognitive sciences (human-AI interaction, HCI, VR/AR, cognitive networks, affective computing, digital education)
- Run by a Hungarian group around Péter Baranyi at Corvinus University of Budapest; editions were IEEE conferences through 2025 (IEEE Hungary Section sponsor in 2025)
- From 2026 the IEEE label was dropped and papers go to the Scopus-indexed Springer Nature book series Learning and Analytics in Intelligent Systems
- Location varies (online 2021 and 2022, Budapest 2023, Tokyo 2024, Vienna 2025, Hong Kong 2026)
- Short papers of 4 to 6 pages, plus 2-page demo and extended abstract papers (2025); selected papers invited to journal special issues
- Deadlines are usually extended by several weeks or months
- "Fee: 450 EUR full, 380 EUR student (2025)"
- Not listed in CORE ICORE2026
