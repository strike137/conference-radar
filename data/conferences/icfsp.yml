id: icfsp
name: ICFSP
full_name: International Conference on Frontiers of Signal Processing
type: conference
tier: minor
areas: [communications, vision]
region: europe
language: english
frequency: annual
organizer: Conference secretariat (zmeeting submission system); conference chair Jacques Blanc-Talon (Universite
  Paris XI), hosted by IRIT Toulouse in 2026
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
typical:
  deadline_months: [4, 5]
  conference_months: [6, 9]
links:
  website: https://www.icfsp.org/
notes:
- Smaller commercially organized conference on signal processing, image and multimedia, biosignals, speech and
  communications
- Proceedings in IEEE Xplore for every edition from 2016 to 2025 (no edition in 2020), listed as indexed in Ei Compendex and Scopus
- Listed in the IEEE Conference Calendar; 2019 edition technically sponsored by IEEE France Section and IEEE SPS
- Held in France almost every year (Paris 2021 (virtual), 2022, 2024, 2025, Marseille 2019, Toulouse 2026); Corfu, Greece in 2023
- Usually in September; moved to June in 2026
- Abstract-only submissions accepted for presentation without publication
- Not listed in the CORE portal (ICORE2026)
