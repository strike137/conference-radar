notes:
- Merger (since 2014) of the SBP conference on social computing and the BRiMS conference on behavior representation in modeling and simulation
- Computational social science venue; topics include social cyber security, social media analytics, network science, disinformation and human-AI interaction
- Full papers up to 10 pages in Springer LNCS format, archived in Springer LNCS; working papers up to 8 pages are presented as posters and kept on the website for one year
- Rejected full papers can be resubmitted as-is as working papers
- Each accepted paper needs its own author registration, and presenting authors are expected to review 2 to 3 papers
- Held every year at Carnegie Mellon University, Pittsburgh, in hybrid format (online in 2021)
- Funding panel with US agency program managers (NSF, ONR, DARPA and others)
- Best papers invited to a special issue of Computational and Mathematical Organization Theory
- Not listed in ICORE2026 or the CCF 2026 list
