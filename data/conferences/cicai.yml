links:
  website: https://cicai.caai.cn/
notes:
- Organized by the Chinese Association for Artificial Intelligence (CAAI); CAAI lists it as a class A recommended
  conference
- Editions in 2021 (Hangzhou, June), 2022 (Beijing, August), 2023 (Fuzhou, July) and 2026 (Zhejiang University Haining
  International Campus, October); no 2024 or 2025 edition found
- Double-blind review via OpenReview; English only, Springer single-column format, 10 pages plus 2 pages of references
- Proceedings by Springer (2021 to 2023 volumes in the LNCS family, EI indexed per CAAI); outstanding papers recommended
  to CAAI Transactions on Intelligence Technology
