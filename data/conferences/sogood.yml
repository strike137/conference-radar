notes:
- Workshop co-located with ECML PKDD every year since 2016; 11th edition in 2026
- Applications of data science for social good (public safety, health, climate, sustainability, fairness, UN development goals)
- Papers up to 16 pages in Springer LNCS format, single-blind, submitted via Microsoft CMT
- Accepted papers are published by Springer in the joint ECML PKDD workshop proceedings (2025 in Springer CCIS; the ECML PKDD 2026 workshop call also names CCIS)
- Best paper award; half-day workshop with keynote and panel
- Not listed in CORE ICORE2026
