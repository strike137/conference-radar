notes:
- Workshop on the OntoLex-Lemon model for lexical and linguistic linked data and its extensions (morphology, etymology, terminology)
- Run by the W3C Ontology-Lexica Community Group; held as a pre-conference event of LDK (3rd at LDK 2021, 5th at LDK 2025 in Naples)
- 2025 proceedings in the ACL Anthology (6 papers), published by Unior Press as part of the LDK 2025 proceedings
- Hybrid format in 2025; submissions via EasyChair following the LDK main conference guidelines
- Not listed in ICORE2026 and not on the CCF list
