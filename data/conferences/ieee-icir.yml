id: ieee-icir
name: ICIR
full_name: IEEE International Conference on Intelligent Reality
type: conference
tier: minor
areas: [ai, vision, systems]
region: worldwide
language: english
frequency: annual
organizer: IEEE Digital Reality initiative, with IEEE society co-sponsors (RAS, EMBS, CTSoc, RFID, EPS, Reliability)
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
typical:
  conference_months: [6, 11, 12]
links:
  website: https://icir.ieee.org/
notes:
- Small IEEE conference on intelligent reality; XR (AR/VR/MR), digital twins, AI-driven perception, cyber-physical systems
- Full papers 4 to 6 pages, short papers 2 to 4 pages, late-breaking papers 2 to 6 pages (2026); single-blind review via EDAS
- Presented full papers go to IEEE Xplore; selected best papers invited to IEEE Consumer Electronics Magazine and IEEE
  Transactions on Consumer Electronics
- Editions in 2021, 2022, 2024 (3rd), 2025 (4th, Boston, USA) and 2026 (5th, Pisa, Italy); none in 2023
- All deadlines are 23:59 AoE
- Not listed in CORE ICORE2026 or the CCF 2026 list
