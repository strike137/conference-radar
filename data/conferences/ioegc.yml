notes:
- Run by the Institute of Engineering, Tribhuvan University, Nepal, since 2013; held twice a year since 2019
- Hosted in turn by IOE campuses (Pulchowk in Lalitpur, Thapathali in Kathmandu, Purwanchal in Dharan, Paschimanchal in
  Pokhara)
- Aimed at graduate students, but open to undergraduates, faculty and authors outside IOE
- Broad science and engineering scope; most papers are civil, architecture and energy, with a smaller share of electrical,
  electronics and computing papers
- Proceedings with ISSN and per paper PDFs and BibTeX on the conference website, published after the event
- Not listed in ICORE2026 or the CCF list
