id: iccece
name: ICCECE
full_name: International Conference on Consumer Electronics and Computer Engineering
type: conference
tier: minor
areas: [general, ai, networking]
region: china
language: english
frequency: annual
organizer: ICCECE conference secretariat (registration via AIS, ais.cn) with a host university each year (Wuhan Institute of Technology in 2026)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus, Inspec]
fee: 545 USD or 3800 CNY per 4-page paper (2027); 55 USD per extra page
typical:
  deadline_months: [10]
  conference_months: [1]
links:
  website: http://www.iccece.org/
notes:
- Held in China every year since 2021, usually in January (2021 partly virtual, Guangzhou 2022 to 2024, Dongguan on March 1 2025, Wuhan 2026, Xiangtan 2027)
- Broad scope covering consumer electronics, computer engineering, AI, networking, IoT and security
- Accepted full papers go to an IEEE conference proceedings volume submitted to IEEE Xplore, EI Compendex, Scopus and Inspec; papers must be at least 4 pages
- Run by a commercial conference secretariat with a bilingual Chinese and English site; abstract-only presenter option without publication
- 2027 co-organizers include the CSIG Video Image and Security Technical Committee
- Not listed in CORE ICORE2026 or the CCF list
