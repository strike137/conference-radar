notes:
- Half-day workshop on LEO satellite mega-constellations, satellite and terrestrial integration, HAPS, inter-satellite
  links and AI for satellite networks
- Chaired by Gunes Karabulut Kurt (Polytechnique Montreal) with Halim Yanikomeroglu (Carleton University)
- Held with IEEE ICC every year; editions at ICC 2023 (Rome), ICC 2024 (Denver), ICC 2025 (Montreal) and ICC 2026
  (Glasgow, 6th edition)
- Workshop papers go into the ICC proceedings and IEEE Xplore; no-show papers are removed
- Submission through EDAS
- Not listed in ICORE2026 or in the CCF 2026 list
