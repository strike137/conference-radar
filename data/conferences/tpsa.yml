notes:
- Talk-based workshop on foundations and implementation of static analysis (program logics, abstract interpretation, separation logic, incorrectness reasoning)
- Co-located with POPL every January; held under the TPSA name in 2025 (Denver), 2026 (Rennes) and 2027 (Mexico City)
- Earlier iterations focused on incorrectness reasoning (POPL 2024 had a "Formal Methods for Incorrectness" workshop)
- 2027 expands the scope to AI-driven program analysis and assurance for AI-generated code
- Extended abstracts of at most 3 pages in SIGPLAN two-column format; no formal proceedings, so published or in-progress work is welcome
- Not listed in CORE ICORE2026; not in the CCF 2026 list
