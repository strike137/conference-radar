notes:
- Long-running German computer architecture and operating systems conference (40th edition in 2027), run by the
  joint GI/ITG special interest group
- Mostly held in Germany (2021 virtual, 2022 Heilbronn, 2023 Athens, 2024 Potsdam, 2025 Kiel, 2026 Mainz, 2027
  Magdeburg)
- Proceedings in Springer LNCS; selected 2026 papers invited to a special issue of the Elsevier Journal of Systems
  Architecture
- Double-blind review; main track and special tracks (Organic Computing, Dependability) take up to 15 pages plus
  references, PhD Forum 10 pages, Research Group Forum 5 pages
- Each year has a special focus (2027 unconventional computing beyond von Neumann; 2026 open-source architectures
  from RISC-V to AI accelerators)
- Small program (2025 had 13 main track papers) and deadlines have been extended in recent years
