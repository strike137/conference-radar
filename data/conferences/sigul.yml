links:
  website: https://sites.google.com/view/sigul2026
notes:
- Workshop of the joint ELRA and ISCA special interest group on under-resourced, endangered, minority and regional languages, covering both text and speech technology
- Editions at LREC 2022 (Marseille), Interspeech 2023 (Dublin), LREC-COLING 2024 (Turin) and LREC 2026 (Palma, Mallorca); no workshop in 2025
- 2026 edition was a two-day joint workshop with ELE, EURALI and DCLRL at LREC 2026, May 11 to 12, 2026, with remote participation
- Proceedings in the ACL Anthology, published by ELRA
- The 2023 Interspeech edition was published in the ISCA Archive instead
- Welcomes community-led project showcases and position papers besides research papers
- Not ranked in ICORE2026 and not on the CCF list
