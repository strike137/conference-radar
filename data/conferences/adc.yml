notes:
- Annual since 1990; proceedings in Springer LNCS
- Recent editions split across an Australian and an Asian site (2024 Gold Coast and Tokyo, 2025 Sydney and Bali,
  2026 Brisbane and Hengqin)
- Two research rounds plus a Shepherding Track for honours, master and early PhD students; single-blind review,
  12 pages excluding references
- Ranked Australasian B in ICORE2026; CORE student travel awards up to AUD 300
- Best papers recommended to the World Wide Web Journal
