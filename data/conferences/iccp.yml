notes:
- Annual IEEE Computer Society conference on computational imaging and computational photography
- "Two integrated tracks: after one common review, accepted papers go either to a special issue of IEEE TPAMI or to the ICCP Proceedings; both are presented as talks"
- Double-blind review on OpenReview with a one-page author rebuttal
- No strict page limit; papers over 12 pages including references pay 220 USD per extra page
- CORE B (ICORE2026)
- Mostly held in North America (Princeton 2026, Toronto 2025, College Park 2027), sometimes in Europe or Asia (Lausanne 2024, Haifa 2021, Tokyo 2019)
- A summer school is held just before the conference
