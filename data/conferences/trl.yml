id: trl
name: TRL
full_name: Table Representation Learning Workshop
type: workshop
tier: minor
areas: [ai, data, nlp]
region: worldwide
language: english
frequency: annual
organizer: TRL workshop organizers (Madelon Hulsebos, CWI, and co-chairs); co-located with NeurIPS (2022 to 2024) and
  ACL (2025)
organizer_country: [international]
proceedings: ACL Anthology (2025)
archival: true
typical:
  deadline_months: [4, 9]
  conference_months: [7, 12]
links:
  website: https://table-representation-learning.github.io/
notes:
- Workshop on representation learning, LLMs and generative models for tables, spreadsheets and relational databases
  (text-to-SQL, table QA, tabular ML, data preparation)
- Held at NeurIPS 2022, 2023 and 2024; the NeurIPS 2024 edition was non-archival (papers on the website and OpenReview only)
- The 4th edition at ACL 2025 in Vienna was archival, with proceedings in the ACL Anthology
- Short papers 4 pages and regular papers 8 pages plus references, ACL style; light double-anonymous review on
  OpenReview; in-person presentation expected
- Not listed in ICORE2026 and not on the CCF list
