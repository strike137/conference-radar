notes:
- Run by the University of Zagreb Faculty of Organization and Informatics since 1989, named CECIIS since 2008; 38th edition in 2027
- Broad information systems scope (intelligent systems, software engineering, data and knowledge bases, cyber-physical systems, learning analytics, digital transformation)
- Full papers up to 8 pages (extra pages 10 EUR each), double-blind review; also a poster section with 2-page extended abstracts and a free student poster section
- Papers appear in the ISSN registered CECIIS proceedings published by FOI; the site says the 2013 to 2023 and 2025 volumes are indexed in the Web of Science CPCI
- Selected papers are invited to the Journal of Information and Organizational Sciences (JIOS)
- Held in Croatia, in Varaždin (2026, 2027) or Dubrovnik (2022, 2023)
- Not listed in ICORE2026 and not on the CCF list
