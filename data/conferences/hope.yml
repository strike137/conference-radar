notes:
- Long-running hacker conference in New York City, first held in 1994 at the Hotel Pennsylvania in Manhattan
- Run by the nonprofit HOPE On Planet Earth; talks, workshops, performances and villages over three days
- Biennial until 2024, annual since 2025 (HOPE_16 in 2025, HOPE 26 in 2026)
- Held at St. John's University in Queens from 2022 to 2025; moved to the New Yorker Hotel in Midtown Manhattan for 2026
- No formal proceedings; talks are live streamed and recordings are published afterwards
- No fixed proposal deadline is posted; the call for participation asks for submissions as soon as possible
