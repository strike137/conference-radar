  - Full papers up to 8 pages, short and demo papers up to 4 pages including references, IEEE format, via EasyChair
  - Single-blind review by at least two PC members
  - Six papers in 2025, published in the 2025 IEEE/ACM ASE Workshops proceedings (ASEW 2025, IEEE CPS)
  - Not in the ASE 2026 workshop list
  - Not listed in CORE ICORE2026 or the CCF 2026 list
