notes:
  - Also written Ex-ASE; subtitle "Exploring Theory, Adaptation, Needs, Challenges, and Ethics"
  - Workshop on explainability in automated software engineering (testing, program repair, requirements, SE4AI and AI4SE, human-in-the-loop)
