notes:
- Asia-Pacific counterpart of IEEE HOST; aims to build the hardware security community in Asia and the Pacific
- 'Held every December in a different Asian city: 2022 Singapore (hybrid), 2023 Tianjin, 2024 Kobe, 2025 Nanjing,
  2026 Kolkata'
- 6-page IEEE double-column papers with anonymous (double-blind) submission; selected 4-page short papers go to
  a poster session; PhD forum
- Proceedings in IEEE Xplore; best paper award is reserved for papers whose first author is a full-time student
- 'Deadline in mid or late July, usually extended once or twice into August (2023: Jul 24 -> Aug 14; 2026: Jul 14
  -> Aug 9)'
