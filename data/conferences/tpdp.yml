notes:
- Main workshop of the differential privacy community, covering DP theory, DP and machine learning, statistics, systems and policy
- Submissions are 4-page abstracts (excluding references), not anonymized; work already published since the previous TPDP deadline is welcome
- 'Non-archival: no formal proceedings, so later publication elsewhere is allowed'
- Selected papers are invited to a special issue of the Journal of Privacy and Confidentiality
- Accepted abstracts are presented as talks or posters; the 2026 call expected more competitive review than earlier years
- Held as part of ICML in 2021 and 2022; standalone since 2023 (Boston 2023, Boston 2024, Google Mountain View 2025, Northeastern University Boston 2026)
- 2026 edition was co-located with the OpenDP health and genomics workshop and FORC
