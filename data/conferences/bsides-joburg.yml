notes:
- Volunteer-run, community-driven Security BSides conference in Johannesburg, South Africa, first held on 20 July
  2024 (workshops 19 July)
- Run by BSides Joburg NPC, registered as a non-profit in early 2024; funds go back into the event
- One-day event at the Focus Rooms, Johannesburg, with two talk tracks (2025), workshops, community villages and a CTF (over 50 CTF participants in 2024)
- Talks chosen by blind review via Pretalx; 45-minute standard talks and 15-minute lightning talks
- Paid tickets sold in batches via Quicket, with early bird discounts
- No proceedings
