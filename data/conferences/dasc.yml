notes:
- Joint event CyberSciTech/DASC/PICom/CBDCom; DASC reaches its 24th edition in 2026
- 'Strong Japanese involvement: 2025 held in Hakodate, Japan; 2026 general executive chair from Kyushu Sangyo University
  and an advisory committee mostly from Japan (Osaka, Tohoku, Kyoto Sangyo, NICT)'
- CORE C, not in the CCF list; IEEE CS proceedings (EI indexed); has a security, privacy and trust track
- 'Hybrid format: online presenters pay the same fee; separate regular, WiP/poster/workshop and late-breaking (LBI)
  paper deadlines'
- 'Rotates worldwide: 2022 Falerna (Italy), 2023 Abu Dhabi, 2024 Boracay (Philippines), 2025 Hakodate, 2026 Melbourne'
