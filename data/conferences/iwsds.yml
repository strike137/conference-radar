notes:
- Standalone annual workshop on spoken dialogue systems held since 2009 (16th edition in 2026), not co-located
- Proceedings published by ACL in the ACL Anthology (2025 and 2026 volumes)
- "Acceptance rate: 76% (2026, 42/55); each paper reviewed by at least three PC members"
- Long and short research papers, position papers and an industry track, plus special sessions
- Bilbao, Spain in May 2025 and Trento, Italy in Feb to Mar 2026
- No standing series site (iwsds.org redirects to the COLIPS home page, which has no IWSDS page); each edition has its own site
- Not listed in the CORE portal (ICORE2026)
