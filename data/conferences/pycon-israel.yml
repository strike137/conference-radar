links:
  website: https://pycon.org.il/
notes:
- Annual Python community conference in Israel, run by volunteers under Hamakor
- One day of talks at Cinema City, Gelilot (2024, 2025) plus a separate day of paid hands-on workshops (Microsoft Reactor Tel Aviv in 2024, Reichman University in 2025)
- Talks chosen from a call for proposals; a CFP workshop with mentors is held in Tel Aviv before the deadline
- Earlier editions in 2016, 2018, 2019, 2021, 2022 and 2023 (2023 at the Wohl Center, Bar Ilan University)
- Tickets about 250 ILS for individuals and 450 ILS for company purchases (2025)
- No papers or proceedings; practitioner talks only
