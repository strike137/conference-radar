notes:
- Founded in 2018 as IEEE AIVR (held in December through 2022); renamed IEEE AIxVR and moved to January, so there
  was no 2023 edition
- Sponsored by the IEEE Computer Society; in cooperation with ACM SIGAI, SIGCHI, SIGGRAPH and Eurographics
- Proceedings published by IEEE Computer Society Press in IEEE Xplore and the IEEE CSDL
- Rotates between the Americas, Europe and Asia (Los Angeles 2024, Lisbon 2025, Osaka 2026, Vancouver 2027)
- Full and short papers in the first round; work-in-progress, demo and video papers about a month later; workshops
  integrated into the main event
- In-person conference, remote presentation possible for authors who cannot travel
- Not listed in ICORE2026; not on the CCF list
