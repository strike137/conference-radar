notes:
- Single-track HCI conference on mobile and ubiquitous multimedia (interaction techniques, XR, context-aware services,
  wearables, automotive UI), held in cooperation with ACM SIGCHI
- Proceedings in the ACM International Conference Proceedings Series (ICPS) in the ACM DL; ICPS open access model can
  mean an article processing charge
- Full papers up to 16 pages and short papers up to 7 pages (single column, excluding references); double-blind review
  via EasyChair
- Paper deadline in late August, conference in early December; the paper deadline has been extended by one week in
  recent years
- Held in Europe (Vienna 2023, Stockholm 2024, Enna 2025, Glasgow 2026)
- CORE B (ICORE2026); not on the CCF 2026 list
