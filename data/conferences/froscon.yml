id: froscon
name: FrOSCon
full_name: Free and Open Source Software Conference
type: industry
tier: minor
areas: [software, systems]
region: europe
language: mixed
frequency: annual
organizer: Hochschule Bonn-Rhein-Sieg (Department of Computer Science) with FrOSCon e.V. (volunteers)
organizer_country: [europe]
proceedings: None (non-archival; abstracts, slides and talk videos published on the FrOSCon website and media.ccc.de)
archival: false
fee: Free entry with no registration; optional business ticket to support the event
typical:
  deadline_months: [5]
  conference_months: [8, 9]
links:
  website: https://www.froscon.org
notes:
- Two-day weekend conference on free and open source software, organized by the computer science department of Hochschule Bonn-Rhein-Sieg with the volunteer association FrOSCon e.V.
- Always held at Hochschule Bonn-Rhein-Sieg in Sankt Augustin near Bonn, Germany
- Talks and workshops in German or English; talks up to 45 minutes; also devrooms (project rooms), exhibitors and LPI exams
- Program committee selects contributions from the call for papers; slides must be submitted before the talk
- Contributions are published under CC BY 4.0
- No papers or proceedings; practitioner talks only
