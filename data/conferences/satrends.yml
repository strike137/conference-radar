notes:
- ICSE workshop on emerging software architecture trends (microservices, serverless, modular monoliths, AI/ML, sustainability, DevOps)
- 1st edition at ICSE 2024 in Lisbon, 2nd at ICSE 2025 in Ottawa
- PC co-chairs Davide Taibi, Luciano Baresi, Patricia Lago and Henry Muccini (2025)
- Short papers of at most 4 pages (industrial experience reports, position papers, extended abstracts), three reviews each
- 2025 papers in the IEEE workshop proceedings (IEEE format); 2024 used the ACM format
- No edition listed in the ICSE 2026 or ICSE 2027 workshop programs
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
