id: aris
name: ARIS
full_name: International Conference on Advanced Robotics and Intelligent Systems
type: conference
tier: minor
areas: [ai, systems]
region: taiwan
language: english
frequency: annual
organizer: Robotics Society of Taiwan (RST) and the host university
organizer_country: [taiwan]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [5, 7]
  conference_months: [8]
links:
  website: https://aris2026.ncku.edu.tw/
notes:
- Founded in 2013 and run every year by the Robotics Society of Taiwan with a host university (NCHU 2025, NCKU 2026)
- Held in Taiwan, usually in August; 2016 to 2020 at the Taipei Nangang Exhibition Center, online in 2021, Taipei 2022
  to 2024, Taichung 2025, Tainan 2026
- Technically sponsored by the IEEE SMC Society
- Full papers of 4 to 6 pages (IEEE two-column) go to IEEE Xplore; one-page presentation-only abstracts for
  late-breaking results are not published there
- Co-located with NCAR, the Chinese-language National Conference on Advanced Robotics of the same society
- Best paper contests with finalists presenting in a dedicated session
- Not listed in ICORE2026; not on the CCF list
