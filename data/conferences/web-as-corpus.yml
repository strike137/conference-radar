notes:
- Long-running workshop series on web corpora since 2005, endorsed by ACL SIGWAC; 13th edition (WaC-13) in 2026
- Co-located with different NLP and linguistics conferences (EMNLP 2026, LREC 2020, Corpus Linguistics 2017, ACL 2016,
  EACL 2014)
- Mostly held in Europe (Budapest 2026, Marseille 2020, Birmingham 2017, Berlin 2016, Herstmonceux 2015, Gothenburg 2014)
- WaC-12 (LREC 2020) was cancelled but its proceedings were published
- 2026 edition also endorsed by the Common Crawl Foundation and the OpenEuroLLM project
- Long (8 pages) and short (4 pages) papers; direct submission on OpenReview or ARR commitment; archival or non-archival
  option
- Proceedings in the ACL Anthology (30 papers in 2026)
- Not listed in ICORE2026 or the CCF list
