notes:
- Workshop on computer vision for plant phenotyping and agriculture, with a data challenge each year
- Called CVPPP (Computer Vision Problems in Plant Phenotyping) until 2020; held with ECCV, ICCV, CVPR or BMVC since 2014
- Recent editions with ICCV 2021, ICCV 2023, ECCV 2024, ICCV 2025 (10th edition, Honolulu) and ECCV 2026 (11th edition, Malmo)
- Full papers are double-blind and go into the host conference workshop proceedings; extended abstracts appear only on the website
- Different from the CVPR Agriculture-Vision workshop
- Not listed in ICORE2026 or the CCF list
