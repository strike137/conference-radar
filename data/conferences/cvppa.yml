id: cvppa
name: CVPPA
full_name: Workshop on Computer Vision in Plant Phenotyping and Agriculture
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizing committee (University of Nottingham, DTU, University of Bonn, University of Edinburgh and others); co-located with ICCV or ECCV
organizer_country: [europe]
proceedings: ICCV Workshops proceedings (CVF Open Access and IEEE Xplore) or ECCV Workshops proceedings (Springer)
archival: true
typical:
  deadline_months: [6, 7]
  conference_months: [9, 10]
links:
  website: https://cvppa2026.github.io/
notes:
- Formerly CVPPP (Computer Vision Problems in Plant Phenotyping), held since 2014 with ECCV, ICCV, BMVC or CVPR; now alternates between ICCV and ECCV
- The 2026 edition with ECCV 2026 was the 11th
- Accepted full papers (up to 14 pages in 2026, up to 8 pages in 2025) appear in the main conference workshop proceedings
- Extended abstracts up to 4 pages are peer reviewed and published only on the workshop website
- Double-blind review; 2026 submission through OpenReview, 2025 through CMT
- Hosts plant phenotyping and agriculture challenges alongside the workshop
- Not listed in ICORE2026 or the CCF list
