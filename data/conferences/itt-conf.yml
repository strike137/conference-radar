notes:
- Organized by the Higher Colleges of Technology (HCT), held at the HCT Dubai Academic City campus
- IEEE technically co-sponsored; proceedings in IEEE Xplore (Scopus-indexed)
- 11th edition in 2026; recent editions 2020, 2022, 2023, 2025 and 2026
- 2026 theme on autonomous agents, embodied AI and the cognitive economy, with tracks including responsible AI and cybersecurity
- Regular papers 6 pages, short papers 4 to 6 pages, IEEE format, via EasyChair
- Registration fee waived for accepted papers presented in person (2025 and 2026)
- Includes an undergraduate student poster competition
- Not listed in the CORE ICORE2026 portal
