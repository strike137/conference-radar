links:
  website: https://www7.in.tum.de/~kretinsk/LiVe2026.html
notes:
- One-day workshop on machine learning for formal verification and synthesis, and on verifying learning-based systems such as neural networks
- Satellite event of ETAPS since 2017 (Uppsala 2017 to Turin 2026); the 2020 edition was postponed and held online with the 2021 edition, and 2025 was in Hamilton, Canada; LiVe 2026 was the 10th edition
- Submissions are abstracts of at most two pages in LNCS style; already published and ongoing work welcome
- Non-archival; abstracts appear only in informal pre-proceedings, with no formal publication or post-proceedings
- Submission via EasyChair
- Not listed in ICORE2026
