id: iccerec
name: ICCEREC
full_name: International Conference on Control, Electronics, Renewable Energy, and Communications
type: conference
tier: minor
areas: [communications, general]
region: southeast-asia
language: english
frequency: irregular
organizer: Telkom University School of Electrical Engineering; sponsored by IEEE ComSoc Indonesia Chapter, IEEE
  Indonesia Section technical co-sponsor
organizer_country: [indonesia]
proceedings: IEEE Xplore
archival: true
fee: USD 400 IEEE member, USD 500 non-member, USD 300 IEEE student (2026, in person from abroad; virtual USD 350 / 450
  / 250)
typical:
  deadline_months: [7, 8]
  conference_months: [10]
links:
  website: https://iccerec.com/
notes:
- Run by the School of Electrical Engineering, Telkom University (Bandung, Indonesia)
- 2026 is the 5th edition after a gap; earlier editions 2015 to 2018 have proceedings in IEEE Xplore
- Five tracks; control and automation, electronics and sensors, renewable energy, communications, computer engineering
- 4 to 8 page IEEE-format papers via EDAS; IEEE no-show policy applies (unpresented papers are not put in IEEE Xplore)
- Hybrid format (on site or virtual); several extended deadlines in 2026
- Not listed in ICORE2026 or the CCF list
