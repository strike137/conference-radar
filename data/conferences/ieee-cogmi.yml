language: english
frequency: annual
organizer: IEEE, IEEE Computer Society
organizer_country: [usa]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [6, 8]
  conference_months: [10, 11]
links:
  website: https://cogmi.ieee-cs.org/2026/
notes:
- Co-located every year with IEEE CIC and IEEE TPS (plus IEEE RISC from 2026); 8th edition in 2026
- Proceedings in IEEE Xplore; steering committee chaired by James Joshi (University of Pittsburgh)
- Two submission rounds (June and August), AoE; rejected Round 1 papers can be revised and resubmitted to Round
  2; deadlines usually extended by one to two weeks
- Research, vision (by invitation) and industry/government tracks; research papers up to 10 pages in IEEE
  two-column format, anonymous review
- Held in the USA (Pittsburgh 2025, San Jose 2026)
- Selected top papers invited to an IEEE Transactions on Big Data special issue
- Not found in ICORE2026 or the CCF list
