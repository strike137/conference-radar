notes:
- Long-running symposium (28th edition in 2026) on self-stabilizing, fault-tolerant and secure distributed systems,
  rooted in the self-stabilization workshops (WSS) that started in 1989
- Run by an international steering committee; location rotates worldwide (Jersey City 2023, Nagoya 2024, Kathmandu
  2025, Gothenburg 2026)
- Proceedings in Springer LNCS; selected papers invited to a journal special issue (Theoretical Computer Science
  for 2025)
- Three non-overlapping submission rounds per year (two in 2024); papers rejected in an early round may be revised and
  resubmitted with the earlier reviews passed on
- Double-blind (relaxed, arXiv allowed); regular papers up to 15 pages in LNCS format, brief announcements up to 5
  pages
- Best paper and best student paper awards; student scholarships offered in 2026
- 'CORE rank C (ICORE2026); not in the CCF 2026 list'
- Each accepted paper needs a full regular/author registration, even when the presenter is a student
