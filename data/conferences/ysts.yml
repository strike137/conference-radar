notes:
- Long-running Brazilian information security conference for technical and managerial practitioners, held in Sao
  Paulo; 18th edition in 2026
- One-day event with curated talks (abstracts mostly in Portuguese, some in English), a CISO debate panel and
  networking with an open bar
- Attendance requires an invitation from one of the sponsors; the venue is kept secret and revealed only to
  confirmed attendees
- No public call for papers and no proceedings
