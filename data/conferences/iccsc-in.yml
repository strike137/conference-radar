notes:
- Run by LBS Institute of Technology for Women, Poojappura, Thiruvananthapuram, Kerala, India, and listed among IEEE Kerala Section conferences
- 2023 (2nd edition) proceedings in IEEE Xplore
- 2026 is the 3rd edition; tracks on AI and ML, communication and signal processing, cybersecurity, IoT, cloud and data analytics
- Review via Microsoft CMT
- Not the same as the International Conference on Circuit, Systems and Communication, which also uses the acronym ICCSC
- Not listed in ICORE2026 or the CCF 2026 list
