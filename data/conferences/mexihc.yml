notes:
- Main HCI conference in Mexico, run every two years by AMexIHC, which is linked to the ACM SIGCHI CHI-Mexico chapter
- 2026 was the 11th edition, held in Ensenada, Baja California; host city changes each edition
- All accepted full papers (up to 8 pages) and short papers (up to 4 pages) appear in a special issue of the open-access AMexIHC journal Avances en Interacción Humano-Computadora
- Papers in English or Spanish, fully anonymous review, submission via EasyChair
- Also has posters, workshops, tutorials, a graduate colloquium and a student design competition
- Not listed in ICORE2026; not on the CCF list
