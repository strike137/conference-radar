links:
  website: https://eit.r4.ieee.org/
notes:
- Broad electrical, electronic and computer engineering conference of IEEE Region 4 (US Midwest); official archive lists editions back to 2009
- Sponsored by IEEE Region 4 and IEEE-USA; hosted by a different university in the US Midwest each year
- 'Recent hosts: Romeoville IL (2023), Eau Claire WI (2024), Valparaiso IN (2025), La Crosse WI (2026), Edwardsville IL (2027)'
- Accepted papers published in IEEE Xplore
- Full papers of 4 to 6 pages in IEEE two-column format, extra fee above 6 pages; peer reviewed via Microsoft CMT
- At least one author must register at the author rate and present in person; one author registration covers up to two papers
- Also has an undergraduate student poster session
- Not listed in ICORE2026; not on the CCF list
