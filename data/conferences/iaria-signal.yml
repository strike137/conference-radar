notes:
- Organized by IARIA as part of the InfoSys congress, co-located with ICNS, ICAS and other IARIA events (12th edition in 2027)
- Published open access in the IARIA ThinkMind library (ISSN 2519-8432); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Spain, Italy, Greece or Portugal (Barcelona, Athens, Lisbon, Valencia, Venice in recent years)
- The 2027 edition moves from March to May
