notes:
- Workshop on building knowledge graphs from text, with a focus on LLMs since the 4th edition (renamed LLM-TEXT2KG)
- Started in 2022 as the International Workshop on Knowledge Graph Generation From Text; held with ESWC every year
- 2022 to 2024 editions in Hersonissos, Crete (Greece), 2025 Portoroz, 2026 Dubrovnik
- Proceedings in CEUR-WS (2022 Vol-3184, 2023 Vol-3447, 2024 Vol-3747, 2025 Vol-4020, 2026 Vol-4233), usually joint volumes with co-located events such as the BiKE challenge
- Full research, negative result and dataset papers up to 16 pages, short and demo papers up to 7 pages, excluding references; CEUR format
- Double-blind review via EasyChair
- One-day workshop with keynote, panel and some online presentations
- Not listed in ICORE2026 and not on the CCF list
