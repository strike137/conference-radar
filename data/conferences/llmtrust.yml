notes:
- FSE workshop on engineering trustworthy LLM-based systems and on the auditable use of LLMs across the software lifecycle
- First edition at FSE 2026 in Montreal on 2026-07-05 (half-day program with a keynote and paper sessions)
- Organized by Sumon Biswas (Case Western Reserve), Shibbir Ahmed (Texas State), Sayem Mohammad Imtiaz (Meta) and Hridesh Rajan (Tulane)
- Full papers 8 pages and short papers 5 pages, references included; extended abstracts 1 to 5 pages (APC-free); ACM format, double-anonymous review
- Proceedings in the ACM Digital Library as part of the FSE 2026 Companion Proceedings (ACM Open; APCs may apply)
- 2026 accepted 6 papers (accepted papers page)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
