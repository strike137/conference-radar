notes:
- Argentine biennial meeting on information processing and control, held since 1985 (22nd edition in 2027)
- Topics include control, signal and image processing, AI, communications, robotics, embedded systems and IoT, power electronics
- Full papers appear in the RPIC proceedings; accepted English papers are also sent to IEEE Xplore for an extra fee (2025)
- Papers reviewed by the scientific committee; includes an RPIC Estudiantil track for undergraduate students
- Held in Argentina, rotating between host universities (Obera 2023, San Francisco 2025, Rio Cuarto 2027)
- All presentations in person (2027)
- Not listed in CORE ICORE2026
