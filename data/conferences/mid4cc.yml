notes:
- Workshop on middleware for the cloud, fog/edge and IoT computing continuum (orchestration, data management, QoS and SLA management, DevOps, security), co-located with ACM/IFIP Middleware
- Held every year with Middleware since 2023 (Bologna 2023, Hong Kong 2024, Nashville 2025, Tarragona 2026)
- Papers up to 6 pages in ACM format, single-blind review; published in the Middleware companion proceedings in the ACM DL
- At least one author per accepted paper needs a full pre-conference registration
- Best papers invited to extended versions in MDPI journals (Future Internet, Sensors, Mathematics special issue)
- Not listed in the ICORE2026 portal or the CCF 2026 list
