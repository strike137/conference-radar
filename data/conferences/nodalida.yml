notes:
- Nordic and Baltic computational linguistics conference organized by NEALT every two years
- 2025 edition held jointly with the Baltic Conference on Human Language Technologies (Baltic-HLT)
- Proceedings in the NEALT Proceedings Series (University of Tartu Library) and in the ACL Anthology (82 papers in 2025, 80 in 2023)
- Held in the Nordic and Baltic countries (Copenhagen 2027, Tallinn 2025, Tórshavn 2023, Reykjavik 2021 online, Turku 2019, Gothenburg 2017, Vilnius 2015)
- 2027 accepts direct submissions and commitment of ARR-reviewed papers; main conference is on-site only
- Not listed in CORE ICORE2026
