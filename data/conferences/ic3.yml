notes:
- Run every year since 2008 jointly by JIIT Noida and the University of Florida (Sartaj Sahni is general co-chair)
- Always held at the JIIT Sector 62 campus in Noida near New Delhi; 2020 edition cancelled due to COVID-19; 2026 edition was hybrid
- Technically co-sponsored by the IEEE Computer Society and its Technical Committee on Parallel Processing (2026)
- Proceedings in IEEE Xplore from 2025; ACM ICPS for 2021 to 2024; Scopus and DBLP indexed
- Five tracks covering intelligent computing, network and social computing, data and cloud computing, algorithms, and software engineering
- 6-page papers in IEEE format submitted via EDAS; desk rejection above 20% similarity or 20% AI-generated content
- Paper deadline is usually extended twice from mid April to around mid May
- One author registration covers up to two papers
- Not listed in ICORE2026 or the CCF list
