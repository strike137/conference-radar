links:
  website: https://bcwsp.mercubuana.ac.id/
notes:
- Run by Universitas Mercu Buana (Jakarta) with the IEEE Indonesia Section; started by the IEEE Indonesia MTT/AP-S
  Joint Chapter
- Irregular so far; editions in 2017 (Jakarta), 2020 (virtual, hosted from Jakarta) and 2026 (3rd edition, Jakarta)
- Three tracks; wireless communication, electromagnetics and networks; signal processing, AI and computing; power,
  energy, robotics and industrial applications
- 4 to 6 page papers in the IEEE template, submitted via EDAS; accepted and presented papers go to IEEE Xplore
- Not listed in the ICORE2026 CORE portal
