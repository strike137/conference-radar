notes:
- Workshop on quantum and quantum-inspired NLP (DisCoCat-style compositional models, variational quantum circuits, hybrid quantum-classical NLP)
- 1st edition with IJCNLP-AACL 2025 in Mumbai; 2nd edition co-located with ICON 2026 at Gauhati University, Guwahati
- 2025 papers were published by ACL in the ACL Anthology (volume 2025.quantumnlp-1)
- Long papers and short or position papers, double-blind review, ACL-style template
- 2026 edition is in person only, with no virtual track
