id: ismr
name: ISMR
full_name: International Symposium on Medical Robotics
type: conference
tier: minor
areas: [ai, vision]
region: north-america
language: english
frequency: annual
organizer: Georgia Institute of Technology (general chair Jaydev P. Desai)
organizer_country: [usa]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [11]
  conference_months: [4, 5]
links:
  website: https://www.ismr.gatech.edu/
notes:
- Single-track symposium on surgical robotics, image-guided interventions, rehabilitation and assistive robotics, and prosthetics
- Two submission routes with the same deadline; papers via Papercept go to IEEE Xplore, or papers via the Journal of Medical Robotics Research (JMRR) are presented at ISMR and published in JMRR
- IEEE papers fit 6 pages of content plus unlimited references; JMRR papers up to 8 pages excluding references
- Run from Georgia Tech; held in Atlanta in 2025, Knoxville (University of Tennessee) in 2026 and Nashville (Vanderbilt) in 2027
- Workshops and tutorials on the first day; the biennial Spring School on Medical Robotics (SSMR) is held alongside in odd years
- A student registration covers one paper upload, a full registration up to two
- Not listed in CORE ICORE2026 or the CCF 2026 list
