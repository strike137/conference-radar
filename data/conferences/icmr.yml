notes:
- ACM SIGMM conference on multimedia and multimodal search and retrieval, 17th edition in 2027; successor of ACM MIR
- Rated B in ICORE2026 and B in the CCF list (Computer Graphics and Multimedia)
- Proceedings in the ACM International Conference Proceedings Series (ACM DL); ACM moved to full open access in 2026, so article processing charges apply unless the institution is in ACM Open
- Long papers up to 8 pages and short papers up to 4 pages, plus 2 pages of references, ACM sigconf template; no appendices
- Double-blind review; all authors must serve as reviewers when invited
- Also has Brave New Ideas, demonstrations, grand challenges, reproducibility papers, doctoral symposium and co-located workshops
- Rotates worldwide (Amsterdam 2026, Singapore 2027); hybrid attendance offered in 2026, oral presenters expected onsite
