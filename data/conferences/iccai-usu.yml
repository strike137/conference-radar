notes:
- Organized by the Faculty of Computer Science and Information Technology, Universitas Sumatera Utara, Medan, Indonesia; hybrid
- Editions in 2016 to 2020, 2022, 2025 and 2026 (8th)
- 2025 proceedings in IEEE Xplore; 2016 to 2018 in IOP Journal of Physics Conference Series (Scopus)
- For 2026 the organizer says it is still exploring proceedings publishers
- IEEE template, up to 6 pages (8 with extra fee), submission via EDAS; only presented papers are published
- Not to be confused with other venues using the ICCAI acronym (e.g. the International Conference on Computing and Artificial Intelligence)
- Not listed in the ICORE2026 CORE portal
