notes:
- Workshop held with SC (the International Conference for High Performance Computing, Networking, Storage and Analysis); 10th edition in 2026, first held in 2017
- Organizers Ignacio Laguna (LLNL) and Cindy Rubio-Gonzalez (UC Davis)
- 'Topics: verification, testing, debugging and correctness tools for HPC software, floating-point and numerical correctness, AI-assisted correctness checking'
- Regular papers of 7 to 8 pages and short papers of 4 pages (excluding references), single-blind review, submitted through the SC submissions site
- Optional Artifact Description appendix following the SC reproducibility initiative
- Half day in 2026; full day in 2025
- Location follows SC (St. Louis 2025, Chicago 2026)
