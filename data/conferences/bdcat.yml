notes:
- IEEE/ACM conference on big data computing, data processing platforms and machine learning at scale, first held in London in 2014
- Always co-located with UCC (IEEE/ACM Utility and Cloud Computing) in early December, with shared deadlines
- Rotates worldwide (Leicester 2020 and 2021, Vancouver 2022, Taormina 2023, Sharjah 2024, Nantes 2025, Florianopolis 2026)
- Double-blind review; full papers up to 10 pages, short papers 4 pages, posters 2 pages in IEEE format
- Proceedings in IEEE Xplore (some earlier editions in ACM DL); in-person presentation and a full registration per paper required
- CORE C (ICORE2026)
