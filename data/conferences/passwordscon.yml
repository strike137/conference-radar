id: passwordscon
name: PasswordsCon
full_name: International Passwords Conference
type: industry
tier: minor
areas: [security]
region: europe
language: english
frequency: annual
organizer: Per Thorsheim (founder), with a local host each year (CZ.NIC in 2025, Munster Technological University in 2026)
organizer_country: [europe]
proceedings: None
archival: false
fee: 500 EUR early bird, 400 EUR student, 600 EUR standard (2026)
typical:
  deadline_months: [9]
  conference_months: [12]
links:
  website: https://www.passwordscon.org/
notes:
- World's first conference on passwords, PINs and digital authentication; founded in 2010 by Per Thorsheim at the University of Bergen, Norway
- Mix of researchers, practitioners and regulators; academics welcome to present work in progress or past papers
- No proceedings; talks (long, short, lightning) are proposed by email and recorded and livestreamed on YouTube
- Third day is held under the Chatham House Rule, restricted to EU/NATO/FVEY/EFTA citizens, with no recordings
- 2026 (28th edition) hosted by Munster Technological University in Cork, co-located with the Cyber Research Conference Ireland (CRCI) on Dec 10
