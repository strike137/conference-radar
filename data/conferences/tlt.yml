notes:
- Long running workshop (23 editions) on the design, development and use of treebanks and other linguistically annotated corpora
- Part of SyntaxFest in 2019, 2021, 2023 (with GURT, Washington DC) and 2025; standalone edition in Hamburg in December 2024
- Regular papers up to 8 pages and short papers up to 4 pages in ACL style; double-blind review; authors choose archival or non-archival
- Archival papers go into the ACL Anthology
- TLT is not among the events announced for SyntaxFest 2027, so the next edition is unknown
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
