id: iadis-is
name: IADIS IS
full_name: IADIS International Conference on Information Systems
type: conference
tier: minor
areas: [general, data]
region: europe
language: english
frequency: annual
organizer: IADIS (International Association for Development of the Information Society)
organizer_country: [europe]
proceedings: IADIS Digital Library (proceedings with a DOI per paper via Crossref)
archival: true
typical:
  deadline_months: [11, 1]
  conference_months: [3]
links:
  website: https://www.is-conf.org/
notes:
- Run by IADIS since 2008; blind peer review
- Information systems from a socio-technological perspective (design, use and teaching of IS in organisations)
- Proceedings in the IADIS Digital Library, a DOI per paper via Crossref
- Best papers invited to the IADIS Journal on WWW/Internet and the IADIS Journal on Computer Science and Information Systems
- Several calls for papers per edition; the last call closes about two months before the conference
- Held in Europe (Porto 2024, Madeira 2025, Zagreb 2026, Porto 2027)
- Not listed in ICORE2026 or on the CCF 2026 list
