notes:
- Indonesian conference run by the ICCIT team and Asosiasi Dosen Indonesia (ADI); started at Universitas Raharja, Tangerang
- Not the Bangladeshi ICCIT (International Conference on Computer and Information Technology), listed separately as iccit
- Proceedings in IEEE Xplore and indexed by Scopus (the site lists all past editions as archived in IEEE Xplore)
- Host university changes each year in Indonesia (2023 Tangerang, 2024 Universitas Raharja, 2025 CIC Cirebon, 2026 Universitas Bunda Mulia Jakarta, 2027 UPH Tangerang)
- Hybrid format; four tracks (computer science and informatics, computer engineering, mobile multimedia, software engineering)
- Submission via Microsoft CMT
- Edition numbering differs between pages of the site (the 2026 edition is called the 5th)
- Not listed in ICORE2026 or in the CCF 2026 list (no rank)
