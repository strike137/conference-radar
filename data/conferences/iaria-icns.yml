notes:
- Organized by IARIA as part of the InfoSys congress, co-located with ICAS, ENERGY and other IARIA events (22nd edition in 2026)
- Published open access in the IARIA ThinkMind library (ISSN 2308-4006); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Spain, Italy, Greece or Portugal (Valencia, Venice, Barcelona, Athens, Lisbon in recent years)
- Not to be confused with the Integrated Communications, Navigation and Surveillance Conference (also ICNS); the 2027 edition moves to May
