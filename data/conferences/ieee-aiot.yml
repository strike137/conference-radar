notes:
- Congress on AI for IoT (edge intelligence, LLMs on devices, AIoT security and privacy, smart cities, healthcare)
- Technically co-sponsored by IEEE; accepted papers published in IEEE Xplore (site says indexed by EI)
- Held in Melbourne (July 2024), Osaka (December 2025) and Kobe (December 2026)
- Full papers up to 8 pages (2 extra pages at 100 USD each), double-blind with at least 3 reviews, via EasyChair
- Several co-located workshops (IoT-HR, SustainableAIoT-Afrasia, TNI-AIoT, ACAIoT-W in 2026)
- Selected papers recommended to journal special issues (IEEE JBHI, IEEE IoT Magazine and others)
- "Author registration 2026: 890 USD for IEEE members, 1190 USD for non-members"
- Submission deadline has been extended every year before a final firm date (twice in 2024 and 2026, once in 2025)
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
