notes:
- Annual US convening on cybersecurity education, training and workforce development, linked to the NIST NICE program
  and the NICE Workforce Framework for Cybersecurity
- Audience mixes employers, educators (K12 to universities), government and non-profits; includes an expo with sponsors
- Call for proposals for 45-minute breakout sessions and 3.5-hour pre-conference workshops, scored by a planning
  committee with a published rubric; no papers
- Accepted speakers pay their own registration, travel and lodging
- Held in a different US city each year (Seattle 2023, Dallas 2024, Denver 2025, Philadelphia 2026); virtual in 2020 and 2021 (the 2021 edition was the NICE Symposium)
- Not listed in the CORE ICORE2026 portal
