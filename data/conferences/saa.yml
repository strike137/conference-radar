notes:
- Workshop on systems and infrastructure for serving generative and agentic AI (inference optimization, model serving, hardware-aware tuning)
- 1st edition SAA '25 held with ACM SOSP 2025 in Seoul, Korea (Lotte Hotel World)
- Call for presentations; abstracts of at most 2 pages in ACM two-column format, single-blind review
- Camera-ready papers up to 4 pages, posted online before the workshop; not published in the ACM Digital Library
- Strong industry involvement (FriendliAI organizers, sponsorship from AI infrastructure companies)
- Not among the SOSP 2026 workshops; no 2nd edition announced as of 2026-11-14
- Not listed in CORE ICORE2026
