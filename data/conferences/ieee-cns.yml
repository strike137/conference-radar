notes:
- The only IEEE ComSoc conference dedicated to security; topics from the physical layer (wireless/6G) to applications,
  including AI/LLM security
- Single paper deadline in May, conference in September or October; double-blind review, 9 pages including references,
  submission via EDAS
- Mostly held in the USA; also Beijing (2018), Taipei (2024) and Avignon (2025)
- Not ranked by CORE or CCF; co-located workshops such as CPS-Sec and the Cyber Resilience Workshop; good fit for
  network and wireless security work
