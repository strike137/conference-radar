notes:
- Regional computing education conference of the CCSC for college faculty, K-12 educators and students in the eastern US
- Held every fall since 1985 (2012 edition canceled due to Hurricane Sandy), rotating among colleges in PA, MD, VA, NJ, NY, WV and DC
- Papers are double-blind reviewed by 3 to 5 reviewers, up to 15 pages in the CCSC template
- Accepted papers appear in the Journal of Computing Sciences in Colleges; only papers presented at the conference go to the ACM Digital Library
- Also panels, tutorials, workshops, nifty assignments, lightning talks, student papers and posters, and a programming contest
- "2025 deadlines: papers May 31 (extended to June 8), panels and workshops June 30, student submissions September 15"
- Not listed in ICORE2026; not on the CCF list
