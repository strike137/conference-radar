notes:
- Young commercially organized conference on image and video processing; first edition in 2025
- 2025 proceedings in IEEE Xplore; 2026 papers go to CPS Conference Proceedings submitted to IEEE Xplore, Ei Compendex and Scopus
- Jeju, Korea in April 2025; Kyoto, Japan in November 2026
- Papers reviewed by at least two TPC members; one registration covers 5 pages, 30 USD per extra page
- Abstract-only presentation possible without publication
- Not listed in the CORE portal (ICORE2026)
