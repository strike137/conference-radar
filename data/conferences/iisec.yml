notes:
- Turkish informatics and software engineering conference run by the Informatics Association of Turkiye (TBD) in Ankara
- Supported by IEEE since its start; accepted and presented papers are submitted to IEEE Xplore
- Co-organized with Turkish universities (Atilim, TED and OSTIM Technical University in 2026)
- Double-blind review with at least two reviewers per paper (2027 call); papers up to 6 pages in IEEE format via EasyChair
- Editions in 2019, 2021, 2022, 2023, then February 2026 and January 2027; the 2024 edition was postponed
- Yearly theme (LLMs in software engineering for 2026, GenAI in informatics, software engineering and computing education for 2027)
- 2027 edition is hybrid with in-person and online participation
- Not listed in the CORE ICORE2026 portal
