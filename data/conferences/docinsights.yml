notes:
- Workshop bridging NLP and document AI (layout, tables, forms, charts, multimodal and long-document reasoning, grounding, robustness to OCR noise)
- First edition held with EMNLP 2026 in Budapest on 29 October 2026
- Proceedings in the ACL Anthology (2026.docinsights-1, 34 papers); 48 accepted papers presented including non-archival ones
- Long (8 pages) and short (4 pages) papers, double-blind review via OpenReview; archival and non-archival direct submissions, plus ARR commitments
- Two shared tasks in 2026 (DocSem and Dr.DocBench) with system paper track
- Not ranked in ICORE2026 and not on the CCF list
