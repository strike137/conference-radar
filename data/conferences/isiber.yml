notes:
- Run by Universitas Siber Asia (UNSIA) and held in Jakarta, Indonesia
- Young venue; the 1st edition was in February 2026, the 2nd is set for July 2027
- Despite the name "Seminar" it is a peer-reviewed IEEE conference; 2026 papers are in IEEE Xplore
- "Acceptance rate: 30.72% (2026, 586 submissions from 33 countries, as stated by the organizer)"
- Broad scope covering communications, networking, security, computing, AI, signal processing, robotics and business IT
- Submission via EDAS, papers up to 6 pages in IEEE format
- Not listed in ICORE2026 or the CCF list
