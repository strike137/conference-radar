notes:
- German-language mobile communications conference of the VDE ITG, usually held in May at Hochschule Osnabrück; 30th
  edition in 2026
- Covers 5G/6G, IoT and sensor networks, O-RAN, SDN/NFV, machine learning for networks and mobile security
- Submit a paper of up to 6 pages or a meaningful extended abstract in German or English via EDAS
- Accepted full papers are published by VDE Verlag as an ITG-Fachbericht with ISBN (ITG-Fb. 322 for 2026); English
  papers also go to IEEE Xplore
- Mix of university, research institute and industry speakers, with an exhibition alongside the talks
- Not ranked in ICORE2026; not on the CCF 2026 list
