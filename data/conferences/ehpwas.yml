links:
  website: https://www.ehpwas.org/
notes:
- Workshop of IEEE WiMob (CORE B) since 2013; 2026 was the 14th edition
- Topics are e-health services over wireless and IoT networks, QoS and QoE, sensors, big data for healthcare and services for elderly and dependent people
- Accepted papers appear in the WiMob proceedings and are submitted to IEEE Xplore
- Selected papers are invited to an extended version in a special issue of the International Journal of E-Health and Medical Communications (IJEHMC)
- Follows WiMob; recent editions in Montreal (2023), Paris (2024), Marrakesh (2025) and Avignon (2026)
- Submission deadline is extended to late July most years; the extended date is called firm
- Registration goes through WiMob
