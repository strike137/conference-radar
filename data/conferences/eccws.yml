notes:
- Run by ACPI, a commercial academic conference organizer; European sister series of ICCWS
- Abstract-first submission, then full paper under double-blind review
- Proceedings open access, indexed in Scopus and submitted to Web of Science CPCI; selected papers may be extended
  for partner journals such as Journal of Information Warfare and IJCWT
- Held at a European university each year (Athens 2023, Jyvaskyla 2024, Kaiserslautern 2025, Nottingham 2026,
  Coimbra 2027)
- 'Hybrid: virtual participation allowed'
- Not listed in the CORE ICORE2026 rankings
