notes:
- Workshop on data management, analytics and AI for smart cities (IoT data, stream processing, digital twins, applications)
- Not to be confused with IEEE DASC (Dependable, Autonomic and Secure Computing) or the AIAA/IEEE Digital Avionics Systems Conference
- 6th edition with ICDE 2025 in Hong Kong, 7th edition with ICDE 2026 in Montreal
- Papers up to 8 pages in IEEE format via EasyChair; each paper reviewed by at least two reviewers
- ICDE 2026 call for workshops says workshop proceedings are published jointly alongside the conference proceedings
- Small program in 2026 (one invited talk, four research papers, a panel)
- Organized by Ekaterina Gilman, Xiang Su and Francesca Bugiotti
- Not listed in CORE ICORE2026 (the DASC entry there is Dependable, Autonomic and Secure Computing) and not on the CCF list
