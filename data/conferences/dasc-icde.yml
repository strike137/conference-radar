unverified:
- The call for papers page lists the workshop date as May 4, 2026, while the home page and the ICDE 2026 workshops page list May 8, 2026 (May 8 used)
- The call states deadlines in CEST although CET applied in January and February
- The workshop page does not itself name the proceedings; taken from the ICDE 2026 call for workshops, and inclusion in IEEE Xplore was not confirmed
- Venues of editions 1 to 5 not checked; region set from the 2025 and 2026 editions
- No 2027 edition announced as of November 2026
