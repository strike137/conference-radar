notes:
- Applied security event in Montreal with training, a two-day conference and a 48-hour on-site CTF
- Held at Marché Bonsecours in Old Montreal (2022 to 2024, again from 2026)
- 1500+ participants; the CTF has 90+ teams of 8 people
- CFP takes 30-minute talks, 2-3 hour workshops and community villages in two rounds; sponsored talks are not
  accepted
- Talks are streamed on YouTube; no published proceedings
- "Tickets (2027 early bird): conference 440 CAD, CTF 290 CAD, conference + CTF 590 CAD"
