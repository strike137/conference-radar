notes:
- Run by IADIS since 2002; blind peer review
- Proceedings in the IADIS Digital Library with a DOI per paper; best papers invited to the IADIS International Journal on WWW/Internet
- Covers both technical and non-technical aspects of the Web and the Internet
- Several calls for papers per edition; the last call closes about seven weeks before the conference
- Co-located with IADIS Applied Computing; held in Europe, mostly Portugal (Madeira 2023, Zagreb 2024, Porto 2025, Lisbon 2026)
- Not listed in the ICORE2026 CORE ranking
