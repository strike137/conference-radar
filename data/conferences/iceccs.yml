notes:
- Long-running venue (30th edition in 2026) on engineering complex computer systems, with a strong formal methods and
  software engineering flavor
- Proceedings in Springer LNCS (2024 Limassol in LNCS 14784, 2025 Hangzhou in LNCS 15746)
- 'Full papers up to 20 pages and short papers up to 11 pages (LNCS format); single-blind review by at least three
  reviewers'
- Selected formal methods papers invited to a special issue of ACM Formal Aspects of Computing
- Rotates worldwide (Toulouse 2023, Limassol 2024, Hangzhou 2025, Brisbane 2026); timing varies from June to November
- CORE B and CCF C
