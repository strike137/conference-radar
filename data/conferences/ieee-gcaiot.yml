notes:
- Run by GIE (Global Innovation & Entrepreneurship), an open innovation consultancy with offices in the UAE and Egypt, and co-sponsored by the IEEE Technology and Engineering Management Society (TEMS)
- Started in 2017 as IEEE GCIoT (Global Conference on Internet of Things); renamed GCAIoT in 2020
- Proceedings of the 2018 to 2024 editions are in IEEE Xplore
- Held in Dubai (UAE) or Alexandria and New Alamein (Egypt); 2025 (9th edition) was virtual
- Accepts technical papers, panel proposals, tutorial proposals and posters
- Not listed in ICORE2026
