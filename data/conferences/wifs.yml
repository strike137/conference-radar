notes:
- Annual flagship workshop of the IEEE SPS IFS Technical Committee; not ranked by CORE or CCF but well regarded
  in multimedia forensics and security
- 'Scope: multimedia forensics, watermarking, steganography, biometrics, physical-layer and network security, adversarial
  ML'
- 6-page IEEE papers, single-blind review with a rebuttal phase; in-person presentation required; also takes demos
  and presentations of IEEE TIFS/SPL papers
- '18th edition Dec 7-11, 2026 at Tohoku University, Sendai, Japan; earlier Asian editions: Guangzhou 2013, Hong
  Kong 2018, Shanghai 2022 (online)'
- In 2025 the top 5 papers were recommended to IEEE Open Journal of Signal Processing for extended versions (APC
  waived)
