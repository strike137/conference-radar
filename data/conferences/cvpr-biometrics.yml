notes:
- Long-running CVPR workshop on biometrics (face, fingerprint, iris and other modalities), organized by Bir Bhanu and Ajay Kumar
- Papers appear in the CVPR Workshops proceedings on CVF Open Access (also held in 2024)
- Runs with CVPR since 2006; the organizers report recent acceptance rates below 29%
- No CVPR 2025 edition is listed on the organizers' page (editions 2017 to 2024, then 2026)
- Distinct from IJCB, BIOSIG, IWBF and the CVPR workshop on Foundation and Generative Models in Biometrics
- Not listed in ICORE2026 or the CCF list
