notes:
- Sponsored by ACM SIGSAC; dedicated to wireless, mobile, IoT and cellular security (physical layer up to apps)
- Two submission cycles (November and March) with firm deadlines; double-blind review
- Full papers up to 10 pages (12 total), short papers up to 6 pages, SoK papers up to 15 pages total; proceedings
  in ACM DL
- Held in Seoul, Korea (KAIST) in 2024; otherwise mostly USA and Europe
- Regarded as competitive; acceptance rate around 20%
