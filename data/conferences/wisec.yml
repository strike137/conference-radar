notes:
- Sponsored by ACM SIGSAC; dedicated to wireless, mobile, IoT and cellular security (physical layer up to apps)
- Two submission cycles (November and February or March) with firm deadlines; double-blind review
- The 2027 call says all deadlines are firm and no extensions will be given
- Full papers up to 10 pages (12 total), short papers up to 6 pages, SoK papers up to 15 pages total; proceedings
  in ACM DL
- Held in Seoul, Korea (KAIST) in 2024 and Singapore in 2027; otherwise mostly USA and Europe
- Regarded as competitive; acceptance rate around 20%
