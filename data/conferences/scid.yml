notes:
- Workshop on misinformation, disinformation, deepfakes and fact-checking from a computer security perspective
- Held with ACM AsiaCCS in 2024 (Singapore) and 2025 (Hanoi); proceedings of both editions published as separate volumes in the ACM DL
- Regular papers up to 12 pages and short papers up to 6 pages (ACM sigconf in 2025), double-blind review via CMT
- The 3rd edition was planned with IEEE EuroS&P 2026 in Lisbon but was cancelled because of insufficient high-quality submissions
- Run by a small group of researchers from Vietnam and Europe; contact address at VNU-HCM University of Science
- Not ranked in ICORE2026 and not on the CCF list
