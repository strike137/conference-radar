  website: https://www.scid.app/
notes:
- Workshop on information disorder from a security angle (fake news, deepfakes and AI-generated media, detection and
  mitigation of false information)
- Held with ACM AsiaCCS in 2024 (Singapore) and 2025 (Hanoi)
- Proceedings in the ACM Digital Library as a separate workshop volume (2025 doi 10.1145/3709020, 2024 doi
  10.1145/3660512)
- Double-blind review; regular papers up to 12 pages and short papers up to 6 pages including references, ACM sigconf
  format, submitted via Microsoft CMT
- 'Very small program: 5 papers, 1 invited paper and 1 keynote in 2025'
- Deadlines were extended in both 2024 and 2025
- The 3rd edition was planned with IEEE EuroS&P 2026 (Lisbon) but was cancelled for lack of high-quality submissions
- Not listed on the CORE portal (ICORE2026) or the CCF list
