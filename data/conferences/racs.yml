id: racs
name: ACM RACS
full_name: International Conference on Resilience, AI and Cyber-Systems (formerly Research in Adaptive and Convergent Systems)
type: conference
tier: minor
areas: [systems, ai, security, networking]
region: worldwide
language: english
frequency: annual
organizer: ACM SIGAPP
organizer_country: [international]
proceedings: ACM DL (open access with APC)
fee: 800 USD ACM/SIGAPP member, 900 USD non-member, 500/600 USD student (2026, early)
typical:
  deadline_months: [7, 8]
  conference_months: [10, 11]
links:
  website: https://www.sigapp.org/RACS/RACS2026/
notes:
- Sponsored by ACM SIGAPP (the society behind ACM SAC); steering committee mostly from the US, Korea and Taiwan
- Renamed in 2026 from Research in Adaptive and Convergent Systems to Resilience, AI and Cyber-Systems, keeping
  the RACS acronym
- Accepted papers go to the ACM Digital Library; extended versions of selected papers go to journal special sections
- Blind review by at least three referees; full papers 8 pages (up to 2 extra pages at 80 USD each), posters 2 pages
- 'Location rotates: Gdansk 2023, Pompeii 2024, Ho Chi Minh City 2025, Fukuoka 2026'
- Deadlines are usually extended once or twice
- Not listed in the CORE ICORE2026 portal, so no CORE rank is given
