notes:
- Half-day workshop at The Web Conference on federated learning for foundation models (privacy, efficiency, fairness, data interoperability)
- Part of the FL@FM workshop series run by federated-learning.org (also at IJCAI, NeurIPS, AJCAI); The Web Conference editions in 2024 (Singapore), 2025 (Sydney) and 2026 (Dubai)
- Authors choose whether their paper goes into the WWW Companion proceedings (ACM DL, archival); papers left out may be submitted elsewhere
- Main paper 4 to 8 pages plus up to 2 pages of references and appendix, ACM double-column template; submissions are not anonymous
- Late-breaking track for papers rejected by the WWW main conference, decided by the organizers without another review round
- Organizers include Irwin King (CUHK), Guodong Long (UTS), Zenglin Xu (Fudan) and Han Yu (NTU)
- Not listed in the CORE ICORE2026 portal or on the CCF list
