notes:
- Organized by IARIA as part of the NexComm congress, co-located with other IARIA events (19th edition in 2027)
- Published open access in the IARIA ThinkMind library by IARIA Press; prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in southern Europe (Porto, Barcelona, Venice, Nice, Lisbon in recent years)
- Covers multimedia systems, signal processing, image and video, and multimedia applications
