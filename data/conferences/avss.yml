notes:
- Formerly IEEE International Conference on Advanced Video and Signal Based Surveillance; the 2026 site calls it the
  22nd International Conference on Advanced Visual and Signal-Based Systems
- 'ICORE2026 lists it as CORE B under the old name; not in the CCF 2026 list'
- Proceedings in IEEE Xplore; double-blind review; 6 pages in IEEE double-column format including references
- Two submission rounds in 2026; workshops, challenges and tutorials on the day before the main conference
- Each accepted paper needs one full non-student registration; up to 2 extra pages at 80 EUR each (2026)
- Location rotates globally (not checked on official pages for past editions); 2026 workshops on 2026-08-31 at Convitto Palmieri, main conference 2026-09-01 to 2026-09-03 at Charles V Castle, Lecce, Italy
