id: lod
name: LOD
full_name: International Conference on Machine Learning, Optimization, and Data Science
type: conference
tier: minor
areas: [ai, data]
region: europe
language: english
frequency: annual
organizer: ICAS (Interdisciplinary Centre of Advanced Studies, non-profit)
proceedings: Springer LNCS
archival: true
typical:
  deadline_months: [2, 3, 4, 6]
  conference_months: [9]
links:
  website: https://lod2025.icas.events/
notes:
- Run by ICAS as a non-profit event since 2015 (called MOD until 2017); 11th edition in 2025
- Revised selected papers published after the event as Springer LNCS post-proceedings (2025 -> volumes 16467 and 16468)
- Several submission rounds (four in 2025, February to June); long papers 12 to 15 pages, short papers 6 to 11 pages
- Anonymous submission; oral or poster presentation only option without a paper
- Residential conference held in Tuscany, Italy or the Lake District, UK; all participants must stay at the conference hotel
- Not listed in the CORE ICORE2026 or CCF 2026 rankings
