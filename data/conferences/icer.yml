notes:
- Leading research venue for computing education, sponsored by ACM SIGCSE; 22nd edition in 2026
- CORE A (ICORE2026, listed under its old name International Computing Education Research Workshop); not in the CCF 2026 list
- Research papers only in the main track, with title and abstract due one week before the full paper
- Anonymous review on HotCRP with meta-reviewers; conditional accept with a revision round
- Proceedings in the ACM Digital Library (ACM Open from 2026); also doctoral consortium, lightning talks and posters, and work in progress tracks
- Rotates worldwide (online 2021, Lugano 2022, Chicago 2023, Melbourne 2024, Charlottesville 2025, Uppsala 2026)
