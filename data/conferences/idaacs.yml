notes:
- Biennial IEEE conference on data acquisition, measurement, automation and advanced computing, running since 2001 (Foros, Crimea); 2027 is the 14th edition
- Run by the IDAACS organizing committee at West Ukrainian National University, Ternopil, with a different European host each time (Warsaw 2015, Bucharest 2017, Metz 2019, Cracow 2021, Dortmund 2023, Gliwice 2025, Athens 2027)
- Proceedings in IEEE Xplore, indexed by Scopus and DBLP; most past volumes also indexed in Web of Science
- Submission is an extended abstract via Microsoft CMT; selected papers go to journal special issues (MDPI Sensors in 2025)
- Many special streams and workshops with their own later deadlines
- Not listed in the CORE portal (ICORE2026)
