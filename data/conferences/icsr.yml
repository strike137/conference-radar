notes:
- Long-running social robotics conference (17th edition in 2025), renamed "Social Robotics + AI"; steering committee chaired by Shuzhi Sam Ge (NUS)
- Proceedings in Springer Lecture Notes in Artificial Intelligence (LNAI); indexed by EI Compendex and Scopus per the 2025 CFP
- Regular, special session and short paper tracks, plus workshops, robot competition and exhibition
- Rotates worldwide; 2025 edition in Naples, Italy
- Not to be confused with the International Conference on Software Reuse (also ICSR, CORE B); the social robotics ICSR is not ranked in CORE ICORE2026 or the CCF list
