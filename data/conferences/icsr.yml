notes:
- Long-running social robotics conference (18th edition in 2026); each edition adds a theme to the name ("+ AI" in 2025, "+ Art" in 2026, "+ Health" in 2027); steering committee chaired by Shuzhi Sam Ge (NUS)
- Proceedings in Springer Lecture Notes in Artificial Intelligence (LNAI); indexed by EI Compendex and Scopus per the 2025 CFP and the 2026 publication page
- Regular, special session and short paper tracks, plus workshops, robot competition and exhibition
- Rotates worldwide (Naples 2025, London 2026, Potsdam 2027)
- Not to be confused with the International Conference on Software Reuse (also ICSR, CORE B); the social robotics ICSR is not ranked in CORE ICORE2026 or the CCF list
