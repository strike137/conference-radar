notes:
- Workshop on performance tuning, optimization and benchmarking for big data analytics and large models (LLM fine-tuning, RAG, HPC and cloud); 2026 is the 9th edition
- Chaired by researchers from UMBC, UT Dallas and Oak Ridge National Laboratory
- Usually held with the IEEE International Conference on Big Data; the 2025 edition was held with IEEE ICDM 2025 instead
- Accepted papers appear in the IEEE BigData proceedings (IEEE Computer Society), or the ICDM workshop proceedings when held with ICDM
- Full papers up to 10 pages, short papers up to 6 pages (IEEE format); triple-blind review at the ICDM 2025 edition
- Not ranked by CORE (not in ICORE2026) or CCF
