notes:
- Spanish national cybersecurity research conference, organized jointly with INCIBE since the first edition in León in 2015
- Host city changes every year (Bilbao 2022, Sevilla 2024, Zaragoza 2025, Barcelona 2026, Salamanca 2027)
- Three tracks; research, training and educational innovation, and technology transfer
- Papers in Spanish or English; research papers up to 8 pages or 2-page extended abstracts of work already published, transfer papers up to 4 pages (2026)
- Accepted and presented papers appear in a book of proceedings published by the host university, not in a formal publisher series
- Hosts the RENIC prizes for the best PhD and master's theses in cybersecurity, plus a CTF
- Not listed in CORE ICORE2026
