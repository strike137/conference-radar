notes:
- Polish microwave, antenna and radar conference started in 1969 by the Polish Academy of Sciences
- Core conference of the biennial Microwave and Radar Week (MRW), held together with the International Radar
  Symposium (IRS) in even years
- MRW hosts Krakow 2016, Poznan 2018, Warsaw 2020, Gdansk 2022, Wroclaw 2024, Krakow 2026
- Full papers of 3 to 6 A4 pages, 2-page extended abstracts, or 1-page abstracts of already published journal work;
  all peer reviewed via EDAS
- Accepted full papers and extended abstracts are submitted to IEEE Xplore (authors can opt out); extended versions
  can go to IEEE Transactions on Microwave Theory and Techniques
- Not listed in the CORE ICORE2026 portal
