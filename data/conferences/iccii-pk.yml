notes:
- Multi-track computing conference run by Riphah International University at its I-14 campus in Islamabad, Pakistan
- Accepted and presented papers are to be submitted to IEEE Xplore, subject to IEEE requirements
- Five tracks covering AI and data science, software and systems engineering, cyber and network security, cloud and distributed computing, and biomedical and electrical engineering
- Full papers up to 6 pages in the IEEE template, submitted through Microsoft CMT; virtual presentation is possible
- Short gap between the paper deadline and the conference (under two months in 2026)
- Not listed in ICORE2026 or the CCF 2026 list
