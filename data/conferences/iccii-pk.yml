unverified:
- Earlier editions are not listed on the official site; 2026 may be the first edition
- Some site pages still carry INMIC 2026 and ICFC 2026 labels, so the conference name may have changed during planning
- The registration page says paper submission ends on 2026-11-25 23:59 PKT, which conflicts with the 2026-10-31 deadline on the home and CFP pages (likely leftover template text)
- No deadline extension announced on the home or CFP page as of 2026-10-31
- Riphah hosted INMIC 2025 with the same tracks and fees; whether ICCII replaces INMIC at Riphah is not stated
