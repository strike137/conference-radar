notes:
- Biennial symposium on algorithms, graph theory, combinatorics and combinatorial optimization, held since 2001
- Merger of the Brazilian GRACO and the Latin American LACGA conferences
- Steering committee from universities in Brazil, Argentina, Chile and Mexico
- Proceedings in Procedia Computer Science (Elsevier); selected full papers go to a Discrete Applied Mathematics special issue
- Usually held in Latin America (Belo Horizonte 2019, Sao Paulo 2021, Huatulco 2023, Buenos Aires 2025); Marseille, France in 2017
- Deadlines at 23:59 AoE
- CORE C (ICORE2026)
