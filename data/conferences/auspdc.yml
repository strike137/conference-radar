notes:
- Held as part of the Australasian Computer Science Week (ACSW) in late January or February; host city rotates within
  Australia
- 25th edition in 2027 (formerly AusGrid); aimed mainly at researchers from Australia and New Zealand but open to
  international submissions
- Scope covers cloud, fog and edge computing, serverless, HPC, IoT, distributed systems, AI for systems and blockchains
- Double-blind review by at least three PC members; full papers up to 10 pages, short papers 4, posters 2, tutorials 1;
  submission via the ACSW EasyChair
- Proceedings published by ACM together with ACSW (ICPS, ACM Open model); APCs subsidised for 2026 and 2027 with
  hardship waivers
- Ranked Australasian C in ICORE2026; not on the CCF list
- 2026 deadlines were extended by about three weeks
