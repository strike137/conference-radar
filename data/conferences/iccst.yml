  deadline_months: [4, 7]
  conference_months: [10]
links:
  website: https://site.ieee.org/iccst/
notes:
- Sponsored by the IEEE Aerospace and Electronic Systems Society; describes itself as the oldest international conference on security technology (first held 1967)
- Broad security technology scope with a physical security focus (access control, biometrics, video surveillance, intrusion detection, airport and infrastructure security) plus cyber security and AI
- Blind review; registered papers go to IEEE Xplore
- Rotates worldwide, usually in October (Chennai 2019, online 2021, Valec 2022, Pune 2023, San Antonio 2025, Las Palmas de Gran Canaria 2026)
- The 2024 edition (Belo Horizonte, Brazil) was cancelled because of insufficient paper submissions
- 2026 linked to a special issue of IEEE Aerospace and Electronic Systems Magazine
- "Registration 2026: 600 EUR non-member early, 550 EUR IEEE member, 500 EUR IEEE student"
- Not listed in the CORE portal (ICORE2026) or the CCF list
