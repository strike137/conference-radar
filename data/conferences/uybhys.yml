notes:
- Security conference in Brest, France, run by La Cantine numérique Brest; editions every year since 2016
- Two days, held at Le Quartz in 2026; Friday hands-on workshops (2 h), Saturday talks (45 min) and a social event
- Talks and workshops in French or English, chosen through an open CFP; topics range from offensive security to legal aspects
- Selected speakers get free entry, travel to Brest and up to 3 nights of accommodation
- Also runs a student bug bounty; 2026 programme had 8 talks and 6 workshops
- Not in the ICORE2026 portal and not on the CCF list
