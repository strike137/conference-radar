id: mlise
name: MLISE
full_name: International Conference on Machine Learning and Intelligent Systems Engineering
type: conference
tier: minor
areas: [ai]
region: worldwide
language: english
frequency: annual
organizer: AEIC (AiScholar, ais.cn) conference service with a host university each year (University of Naples Federico II in 2026, Shenzhen Polytechnic University in 2025)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 570 USD or 3800 CNY per 4-page paper (2027, regular); 60 USD per extra page
typical:
  deadline_months: [3]
  conference_months: [6]
links:
  website: http://www.mlise.org/
notes:
- Annual since 2021; online 2021 to 2023, Zhuhai 2024, Shenzhen 2025, Naples 2026, Milan 2027
- Run by a commercial conference service (AEIC/AiScholar, submission via ais.cn and aischolar.com); secretariat on a 163.com address
- 2021 and 2022 proceedings published by IEEE CPS; 2024 to 2026 proceedings published by IEEE and in IEEE Xplore, indexed by EI Compendex and Scopus
- Papers reviewed by two or three committee members; 4 to 12 pages; abstract-only presenter option without publication
- Not listed in CORE ICORE2026 or the CCF list
