notes:
- Workshop on misuse, harms, safety and governance of AI, including generative AI, deception, privacy and AI security
- Chaired by Esma Aimeur (Universite de Montreal)
- Earlier editions in 2021, 2022 and 2023 were held with IJCAI; the 4th edition in 2026 moved to The Web Conference
- 2026 papers appear in The Web Conference 2026 Companion Proceedings in the ACM Digital Library; ACM open access APC may apply
- Full papers 7 pages, short or demo papers 4 pages, position papers 2 to 3 pages, single-blind review by 3 to 4 PC members
- Authors of accepted 2026 papers invited to submit extended versions to a Frontiers research topic
- Not listed in the CORE ICORE2026 portal
