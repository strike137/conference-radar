notes:
- Workshop for negative and unexpected results in NLP (failed methods, ablations, trivial baselines, evaluation and reproducibility issues)
- Held every year since 2020 with a different *CL host each year; proceedings in the ACL Anthology
- 7th edition on October 29, 2026 at EMNLP 2026 in Budapest, Hungary (hybrid); 2025 edition at NAACL 2025 in Albuquerque, USA
- Short papers up to 4 pages are archival; 1-2 page abstracts of work published elsewhere are non-archival
- Own review process via Softconf plus commitment of papers with ARR reviews
- Small workshop (14 to 25 papers per year in the ACL Anthology)
- Not ranked in ICORE2026 and not on the CCF list
