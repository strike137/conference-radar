notes:
- Community information security conference in San Antonio, Texas, part of the Security BSides family; first held in 2013
- One-day event in June at St. Mary's University, San Antonio
- Call for Presenters on pretalx with 25 minute short talks and 45 minute full talks across themed tracks
- Separate calls for events (CTFs, workshops, villages) and volunteers
- Explicitly welcomes first-time speakers
- Talks only, no proceedings
