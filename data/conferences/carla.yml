notes:
- Flagship HPC conference of Latin America, held since 2014 in a different Latin American or Caribbean country each year
- Accepted papers published in Springer CCIS, one "High Performance Computing" volume per year
- "2026 tracks: HPC, AI at HPC scale, HPC applications, and HPC education"
- Papers up to 15 pages in Springer LNCS style, single-blind review; submissions via Springer Meteor
- Co-located workshops, tutorials, posters, a DevOps school for HPC and a student cluster competition; some workshop papers go to CEUR
- Recent hosts were Guadalajara 2021, Porto Alegre 2022, Cartagena 2023, Santiago 2024, Kingston (Jamaica) 2025 and Cordoba 2026
- Not listed in ICORE2026 or the CCF 2026 list
