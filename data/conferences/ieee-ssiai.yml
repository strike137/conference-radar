notes:
- Small biennial US symposium on computational analysis and interpretation of images, video and multidimensional data
- 4-page papers in double-column IEEE format; accepted papers go to IEEE Xplore if an author registers at the non-student rate and presents
- One non-student registration covers up to three papers by that author
- Held at La Fonda on the Plaza, Santa Fe, New Mexico in 2024 and 2026
- Organized by faculty from US Southwest universities (Texas Tech, UTEP, Arizona, New Mexico)
- Not listed in CORE ICORE2026 or the CCF 2026 list
