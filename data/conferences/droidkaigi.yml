notes:
- Android developer conference in Tokyo, described by the organizers as a conference where engineers are the main
  players, for sharing Android technical knowledge and communication
- Annual since 2015; 2023 to 2026 editions held at Belle Salle Shibuya Garden, Tokyo (2022 at Tokyo Dome City Prism
  Hall and Belle Salle Iidabashi First)
- 40-minute sessions chosen from a call for speakers on Sessionize; up to 3 proposals per person, normally 1 accepted
  per person; all submitted titles are published
- Speakers must present on site; accepted speakers attend free; travel support for speakers from far away (limited
  budget)
- Some sessions get simultaneous interpretation between Japanese and English
- 'Tickets (2026): 12,600 JPY early bird, 15,800 JPY regular; scholarship program for students'
- No papers or proceedings; talks only (videos and slides linked from the timetable)
