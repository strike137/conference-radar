notes:
- Supported by the IEEE Industrial Electronics Society and led by the IEEE-IES Technical Committee on Factory Automation
- Describes itself as the only IEEE conference dedicated to communication for industrial automation (TSN, industrial wireless, 5G/6G, OPC UA, IIoT)
- 2026 was the 22nd edition, hosted by Offenburg University with CNR-IEIIT (Italy)
- Regular and special session papers up to 8 pages, work-in-progress papers up to 4 pages, demo papers 2 or 3 pages, all in IEEE Xplore
- Several special sessions with their own calls; a tutorial day precedes the main conference
- "CORE C (ICORE2026); not in the CCF 2026 list"
