notes:
- Signature symposium of IEEE Canada, rotating among Canadian cities (Victoria 2014, Montreal 2016, Waterloo 2018,
  Winnipeg 2021 virtual, St. John's 2025, Kelowna 2027)
- Usually every two years, though there was no edition between 2021 and 2025; 2025 was the 20th edition
- Covers antennas, propagation, computational electromagnetics, microwave to THz devices, radar and wireless systems
- Proceedings in IEEE Xplore
- Abstract submission precedes the full paper deadline; student paper and WIE best paper competitions
- Antenna and electromagnetics venue outside the usual CS rankings; not listed in ICORE2026 or the CCF 2026 list
