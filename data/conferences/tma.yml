notes:
- Run by a steering committee of European network measurement researchers; technically sponsored by IFIP, IEEE
  and IEEE ComSoc; held in Europe (online in 2021; Copenhagen 2025, Delft 2026)
- Formed in 2017 by merging the IFIP/ACM TMA workshop, the IEEE TRAC workshop and the IEEE WNM workshop
- Papers are open access in the IFIP Open Digital Library and submitted to IEEE Xplore
- Double-blind review; full papers up to 8 pages in IEEE 2-column format plus 2 pages of references and appendices
- Co-located with the TMA PhD School (student poster session, travel grants); well regarded in the network
  measurement community
- Not listed in ICORE2026 or the CCF list
