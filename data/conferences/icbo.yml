notes:
- Annual conference on ontologies for biology, medicine, health, environment and agriculture, held since 2009
- Rotates between North America, Europe and South America (Brasilia 2023, Enschede 2024, virtual 2025, Washington DC 2026)
- 2026 edition co-located with ISMB 2026 with online participation; 2025 edition was fully virtual with an ICBO-EAST satellite in Japan
- Accepted papers (not posters or demos) are published in CEUR Workshop Proceedings as part of the IAOA series
- Also has a direct-to-journal track with the Journal of Biomedical Semantics (ICBO thematic series)
- Full papers 8 to 12 pages, short papers up to 7 pages (2025 call), reviewed via Microsoft CMT
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
