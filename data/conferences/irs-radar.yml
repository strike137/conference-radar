name: IRS
full_name: International Radar Symposium
type: conference
tier: minor
areas: [communications]
region: europe
language: english
frequency: annual
organizer: German Institute of Navigation (DGON) and Fraunhofer FHR, alternating with Polish hosts in even years
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [12]
  conference_months: [5, 6]
links:
  website: https://dgon-irs.org/
notes:
- European radar conference started in Germany in 1998; odd-year editions are run by DGON and Fraunhofer FHR,
  even-year editions are held in Poland (Wroclaw 2024, Krakow 2026)
- Recent hosts Berlin 2023, Wroclaw 2024, Hamburg 2025, Krakow 2026, Vienna 2027
- Draft papers of 4 to 6 pages including bibliography; accepted papers are submitted to IEEE Xplore
- IRS 2025 received about 104 papers and accepted 82 (about 79%), with about 162 attendees from 24 countries
- Young Scientists Prize (EUR 1,000, authors under 30) and Best Paper Prize (EUR 2,000)
- Covers radar signal processing and imaging, radar systems, applications and tracking; mixed academic and industry
  audience with a technical exhibition
- Not listed in the CORE ICORE2026 portal
