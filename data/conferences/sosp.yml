notes:
- Flagship operating systems and systems software conference sponsored by ACM SIGOPS, first held in 1967
- Biennial until 2021, annual since 2023 (Koblenz 2023, Austin 2024, Seoul 2025, Prague 2026)
- Rotates between North America, Europe and Asia; proceedings in the ACM Digital Library
- 'Double-blind review, 12 pages of technical content excluding references, author response period and optional artifact evaluation'
- Workshops held on the first day; at least one author per accepted paper needs a full (non-student) registration
- Widely regarded as one of the two top systems venues together with OSDI (ICORE2026 A*, CCF A)
