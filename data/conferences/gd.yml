notes:
- Main annual conference on graph drawing and network visualization, running for more than 30 years
- Proceedings in the open-access Dagstuhl LIPIcs series since 2024 (LIPIcs 320 and 357); Springer LNCS up to 2023
- LIPIcs publication fees are covered by the registration fee
- Two tracks (combinatorial and algorithmic; experimental, applied and network visualization), each with long papers (500 lines) and short papers (250 lines), plus posters
- Abstract deadline one week before the paper deadline; papers expected to be presented on site, with a limited number of remote presentations
- Graph Drawing Contest and a two-day PhD school held alongside the symposium
- Selected papers invited to a JGAA special issue; two Track 2 papers invited to IEEE TVCG
- Mostly held in Europe (Tubingen 2021, Palermo 2023, Vienna 2024, Norrkoping 2025, Budapest 2027), with Tokyo 2022 and St. Catharines 2026 outside
- Ranked A in ICORE2026
