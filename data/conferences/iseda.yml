notes:
- Young annual EDA symposium started in 2023 (Nanjing 2023, Xi'an 2024, Hong Kong 2025, Singapore 2026)
- Organized by the Chinese EDA alliance EDA² with advice from IEEE CEDA and ACM SIGDA; strong Chinese EDA industry
  sponsorship
- Covers the full EDA range from device modeling and physical design to AI for EDA and open-source EDA
- Regular papers 4 to 6 pages, double-blind; extended abstracts (1 to 2 pages) are not published
- Proceedings in IEEE Xplore (2023 to 2025 volumes online)
- Not listed in ICORE2026 or the CCF list
