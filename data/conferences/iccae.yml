id: iccae
name: ICCAE
full_name: International Conference on Computer and Automation Engineering
type: conference
tier: minor
areas: [general, ai]
region: oceania
language: english
frequency: annual
organizer: Commercial conference secretariat (contact iccaeconf@vip.163.com) with conference chair Subhas Mukhopadhyay (Macquarie University)
organizer_country: [china]
proceedings: Conference proceedings (IOS Press for 2026; IEEE Xplore 2021 to 2025; ACM ICPS 2017 to 2020)
archival: true
indexing: [EI Compendex, Scopus]
fee: 600 USD regular author, 550 USD student author (2027, early bird before 2027-02-10); 6 pages included, 70 USD per extra page
typical:
  deadline_months: [10]
  conference_months: [3]
links:
  website: https://www.iccae.org/
notes:
- Annual since 2009; held in Australia every year since 2016 (Sydney, Melbourne, Brisbane, Perth), virtual in 2021 and 2022
- Earlier editions rotated through Bangkok, Singapore, Chongqing, Mumbai, Brussels and Bali
- Proceedings moved between publishers (MATEC 2016, ACM DL 2017 to 2020, IEEE Xplore 2021 to 2025, IOS Press 2026), stated as EI Compendex and Scopus indexed
- Run by a commercial conference secretariat (163.com contact address, EasyChair submission)
- Full papers at least 4 pages; abstract only presentation also offered
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
