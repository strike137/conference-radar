notes:
- Annual meeting of the Asia Pacific CSIRT community; the host team rotates (2024 Taipei, 2025 Sydney, 2026 Busan)
- Most sessions are closed to APCERT members (AGM, annual conference, drill); in 2026 the APCERT-FIRST Regional
  Symposium day (Nov 5) is open, with free registration subject to secretariat approval
- Call for speakers and trainers opens around June with notification in September; practitioner talks, no proceedings
- Held online from 2020 to 2023; in person again since 2024
