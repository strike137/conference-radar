notes:
- One-day workshop on evaluating and assessing software engineering education and training, co-located with EASE
- Held with EASE in Oulu 2023, Salerno 2024, Istanbul 2025 and Glasgow 2026 (4th edition)
- 2026 special theme was software engineering education in the AI era
- Full research papers up to 10 pages, experience reports and ongoing research up to 5 pages, educational artifact papers 6 to 10 pages, ACM format
- Accepted papers go into the joint EASE workshop proceedings in the ACM Digital Library
- 2026 chairs from RISE (Sweden), Universitat Politecnica de Valencia, Chalmers and University of Porto
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
