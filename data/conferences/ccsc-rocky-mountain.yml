notes:
- Regional computing education conference of the CCSC, aimed at teaching faculty and students at smaller US colleges
- Pedagogy and research papers, posters, panels, workshops and tutorials; IT and cybersecurity education also welcome
- All submissions are double-blind reviewed; rejected papers are offered a poster slot
- Accepted papers appear in the Journal of Computing Sciences in Colleges and the ACM Digital Library
- 2026 was the 35th edition, at Regis University, Denver, Colorado
- "Registration fee: 150 USD early for authors and presenters (2026)"
- Not listed in ICORE2026; not on the CCF list
