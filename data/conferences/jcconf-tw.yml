notes:
- Annual community conference on Java, Kotlin and the JVM ecosystem, co-organized by the TWJUG and TKUG user groups
- One day event in Taipei; 2025 and 2026 held at the NTUH International Convention Center
- Talks chosen from a public call for proposals on pretalx -> 45-minute talks, 15-minute short talks and 3-hour workshops
- Talks only, no papers or proceedings
