notes:
- EAI conference on wireless and mobile technology for healthcare (medical IoT, e-health, health data, wearables); 13th edition in 2026
- Proceedings in Springer LNICST; extended papers can go to EAI Endorsed Transactions journals for an extra fee
- Small venue (21 accepted papers in 2026, 35 papers in the 2023 proceedings)
- Held in Europe (Vila Real 2022 online and 2023, Heraklion 2026); no edition in 2024 or 2025
- Not listed in ICORE2026; not on the CCF 2026 list
