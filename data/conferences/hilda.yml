notes:
- Workshop held with ACM SIGMOD/PODS since 2016 (no 2021 edition), so it moves with SIGMOD (2026 in Bengaluru, India)
- 'Scope: human interaction with data systems across databases, HCI, visualization, data mining and ML; 2026 theme on human and AI collaboration in data analysis'
- Papers of 4 to 6 pages excluding references, SIGMOD 2-column ACM format, submitted via Microsoft CMT
- Accepts research papers and non-traditional contributions (early work, visions, experience reports)
- Optional mentoring program pairs authors of accepted papers with a PC member before camera-ready
- Proceedings in the ACM Digital Library
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
