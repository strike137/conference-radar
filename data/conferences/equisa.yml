notes:
- One-day workshop on design and evaluation of intelligent software assistants (LLM coding assistants, recommender systems for SE), co-located with EASE
- 1st edition with EASE 2025 in Istanbul, 2nd edition with EASE 2026 in Glasgow
- Accepted papers go into the joint EASE workshop proceedings in the ACM Digital Library (ICPS open access model, APC may apply)
- Full papers 5 to 10 pages, short papers exactly 5 pages, ACM format, double-anonymous review
- Selected papers invited to a special issue of the Information and Software Technology journal
- 2026 organizers from Italy (L'Aquila, Salerno), Austria, Spain and Sweden
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
