notes:
- Workshop on network protocol design for AI agent ecosystems (agent naming and identity, capability-based discovery,
  thin-waist architectures, trust delegation, provenance, relation to ICN and DNS)
- Held with IEEE ICNP 2026 in Tempe, Arizona; not among the ICNP 2025 workshops
- Full papers up to 6 pages and short, position or experience papers up to 4 pages, excluding references; ICNP format;
  double-blind review
- ICNP workshop papers are included in the workshop proceedings and IEEE Xplore
- Not listed in the CORE portal (ICORE2026) or the CCF list
