notes:
- Annual flagship conference of the IEEE Pune Section, held in Pune, India every year since 2018, usually in December
- Accepted, registered and presented papers go to IEEE Xplore; the site also states the proceedings are Scopus indexed
- 'Broad multi-track scope: the 2026 edition (theme Generative Futuristic Systems) has 10 tracks incl. intelligent
  systems, secure systems, edge and cloud computing, cyber-physical systems, computer vision, EVs and life sciences'
- Peer review managed via Microsoft CMT
- Not listed in ICORE2026 or the CCF list
