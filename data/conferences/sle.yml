notes:
- Sponsored by ACM SIGPLAN; covers DSLs, language design and implementation, modeling languages and language
  workbenches (19th edition in 2026)
- Proceedings in the ACM Digital Library; 2026 ACM open access APC of 250 USD (members) or 350 USD (non-members)
  unless the institution is in ACM Open
- Co-located with SPLASH until 2024 and with STAF since 2025 (Koblenz 2025, Rennes 2026)
- Double-blind review; mandatory abstract registration about a week before the paper deadline
- Research papers 6 to 12 pages plus 2; also new ideas/vision, tool and SLE Body of Knowledge papers
- CORE B (ICORE2026)
