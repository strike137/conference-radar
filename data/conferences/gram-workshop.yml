notes:
- Machine learning workshop on geometric deep learning, group equivariance, non-Euclidean representations and geometry-aware generative models
- First edition at ICML 2024 (Vienna, an ELLIS workshop); second edition at ICLR 2026 (Rio de Janeiro); not held in 2025
- Proceedings track papers are published in PMLR (Volume 251 for 2024, Volume 326 for 2026)
- 2026 had a paper track, a blogpost track and a competition track; 84 accepted papers listed on the official site
- 2024 also had a non-archival extended abstract track (4 pages) next to the 8-page proceedings track
- Review on OpenReview
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
