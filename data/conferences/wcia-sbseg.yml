notes:
- Co-located workshop of SBSeg, the Brazilian Symposium on Cybersecurity run by the Brazilian Computer Society (SBC); first held in 2026
- Covers security and privacy of AI systems (adversarial attacks, LLM prompt injection and jailbreaks, red teaming, agent security, privacy-preserving ML)
- Full papers up to 8 pages and short papers up to 4 pages, Portuguese or English, SBC one-column template; double-blind review through JEMS3
- Accepted papers published in the SBSeg extended proceedings (Anais Estendidos) in SBC OpenLib (SOL); at least one author must register and present
- "2026 statistics: 48 submissions, 16 accepted (12 full, 4 short)"
- Held with SBSeg in a different Brazilian city each year (Armação dos Búzios 2026)
- Not listed in CORE ICORE2026
