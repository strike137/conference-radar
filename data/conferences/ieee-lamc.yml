notes:
- Created by the IEEE Microwave Theory and Techniques Society (MTT-S), which sponsors it technically and financially
- Covers RF and microwave engineering, RFIC and MMIC, antennas, communication systems, signal integrity and CAD
- Planned every two years in December; editions in Puerto Vallarta (2016), Arequipa (2018), Cali (2021, virtual),
  San Jose, Costa Rica (2023), San Juan, Puerto Rico (January 2025) and Buenos Aires (2026)
- Three-page two-column papers (four pages maximum including references), single-blind review, submitted through
  EDAS; accepted and presented papers go to IEEE Xplore
- Recent editions offer a mini special issue in IEEE Transactions on Microwave Theory and Techniques (T-MTT)
- "Fee: 500 USD IEEE member, 280 USD IEEE student member early bird (2026)"
- Not listed in CORE ICORE2026
