notes:
- Workshop on machine translation of patents, scientific papers and technical reports, including LLM-based translation
- Run by the AAMT/Japio Special Interest Group on Patent Translation; PC co-chairs from Japanese universities
- Held every two years with MT Summit; started as the Workshop on Patent Translation (2005 to 2013), renamed in 2015
- Recent editions in Nagoya 2017, online 2021, Macau 2023 (hybrid) and Geneva 2025; 11th edition in 2025
- Papers up to 10 pages in the MT Summit format, double-blind, submitted through the MT Summit EasyChair as a separate track
- Small workshop with invited talks from patent offices (JPO, WIPO in 2025); 2 contributed papers in the 2025 proceedings
- Proceedings in the ACL Anthology (2025 volume published by EAMT)
- Not listed in ICORE2026 and not on the CCF list
