notes:
- Asia-Pacific symposium on electromagnetic compatibility (EMC), signal and power integrity, EMC for wireless and
  power systems, computational electromagnetics and EMF safety
- Started in Singapore in 2008 and rotates between Asia-Pacific countries (Kuala Lumpur 2026, organized by the IEEE
  EMC Society Singapore Chapter; Jeju 2027, organized by KIEES)
- IEEE EMC Society is a technical sponsor; large industry exhibition alongside the technical program
- "Two formats: 3-4 page full papers go to the proceedings and IEEE Xplore; 1-page abstracts appear in the
  conference proceedings only"
- Submission via EDAS; best student paper and best symposium paper awards
