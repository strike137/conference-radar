notes:
- Workshop on bias, fairness, interpretability and robustness of multimodal LLMs in data mining and knowledge discovery
- First edition held at KDD 2026 in Jeju, Korea (afternoon session, August 9, 2026)
- Non-archival; accepted papers are posted on the workshop site and not in the ACM Digital Library
- Regular papers up to 6 pages and extended abstracts up to 2 pages, ACM sigconf, single-blind, via OpenReview
- Every submission must include a responsible AI component; unimodal LLM work is out of scope
- Accepted KDD 2026 main track papers on the topic may also be presented
- 22 accepted papers in two poster sessions in 2026; best paper award
- No 2027 edition announced as of November 2026
- Not listed in CORE ICORE2026 and not on the CCF list
