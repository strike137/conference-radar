notes:
- Long-running conference organized by UESTC and held in Chengdu; 23rd edition in 2026
- Sponsored by NSFC, the National High Technology Research and Development Program of China and the China International Talent Exchange Foundation
- Broad scope (wavelets, image processing, machine learning, control, networks, security, big data)
- Proceedings published by UESTC and submitted to IEEE Xplore (ISSN 2576-8964), indexed in EI; 10% to 20% of papers recommended to SCI journals
- Submission through Microsoft CMT or by e-mail; English only; online participation possible
- 2023 edition was held in December; 2026 moved to September
- Not listed in ICORE2026 or the CCF 2026 list
