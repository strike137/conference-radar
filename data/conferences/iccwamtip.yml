notes:
- Run by the International Centre for Wavelet Analysis and Its Applications at UESTC, Chengdu; IEEE sponsored
- Broad scope, wavelets and signal processing, ML and deep learning, vision and image processing, networks, control and security
- Accepted papers expected in IEEE Xplore and EI indexed; 10 to 20 percent of papers recommended to SCI journals
- Always held at UESTC in Chengdu, with online attendance via Tencent Meeting in 2026
- Submission through Microsoft CMT; paper templates in English and Chinese
- Short review cycle, about one to two weeks from submission deadline to notification
- Moved from December (2025) to September (2026)
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
