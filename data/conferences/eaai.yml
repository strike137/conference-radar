notes:
- AI education symposium sponsored by AAAI and co-located with the AAAI conference since 2010 (EAAI-27 is the 17th symposium)
- EAAI papers are published in the Proceedings of the AAAI Conference on Artificial Intelligence, together with AAAI and IAAI
- Main track (research papers and experience reports), a K-12 AI education track and Model AI Assignments
- Double-blind review; papers up to 7 pages plus 2 pages of references in AAAI style, submitted via EasyChair
- EAAI-27 is about teaching AI only; work on AI for teaching other subjects is out of scope
- Hosts the AAAI/EAAI Outstanding Educator Award and the AAAI/ACM SIGAI Innovative AI Education Program (travel support)
- The CCF list entry "EAAI" is the Elsevier journal Engineering Applications of AI, not this symposium; not ranked in ICORE2026
