notes:
- Annual symposium of IPSJ SIGSE, renamed from the Object-Oriented Symposium in 2006; described as one of the most
  important domestic software engineering venues, about 260 participants in 2026
- Held in Tokyo or Yokohama in recent years (Waseda University or Keio University Hiyoshi), usually in September,
  with a workshop day before the main conference
- Symposium paper track (research or practice papers, up to 8 pages) is peer-reviewed by the program committee;
  the deadline is announced as not extended
- Also has a non-reviewed general paper track, an industry talk track, an already-published paper track, poster
  track and discussion workshops
- Accepted papers are encouraged for the IPSJ Journal special issue on software engineering
- On-site only for paper and poster tracks (no online streaming in 2026); free registration for students
