notes:
- Official Security BSides chapter event for the Arizona security community, organized by the Ginger Hacker Initiative
- One-day Saturday event with three talk tracks, workshops, villages and an after party
- Free general admission (ticket required, released in batches from July); optional 50 USD supporter ticket
- 2027 edition at the Wrigleyville West Conference Center (Sheraton Mesa Hotel), Mesa, Arizona
- Call for papers for talks and workshops opens 12 December 2026 and closes 30 June 2027
- Talks only, no proceedings
- Not listed in the CORE portal (ICORE2026)
