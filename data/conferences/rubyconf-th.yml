notes:
- Community conference on the Ruby programming language and Rails, run by the Bangkok.rb meetup group
- Editions in 2019, 2022, 2023 and 2026, all in Bangkok
- 2026 edition had about 200 attendees, 18 speakers and 4 keynotes over two days
- Talks chosen from a call for papers (2023); talk slides and videos published after the event
- No proceedings; practitioner talks only
