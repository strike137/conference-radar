notes:
- Workshop on the design, implementation, verification and evaluation of RISC-V cores, SoCs and accelerators, including ISA extensions, security architectures and compilers
- Co-located with ISCA through 2023 (Phoenix 2019, virtual 2020 and 2021, New York 2022, Orlando 2023) and with MICRO 2024 in Austin
- Papers up to 6 pages plus references in ACM two-column format, submitted through EasyChair
- Non-archival; the site states that workshop publications do not preclude publishing at future conference venues, and papers are posted on the workshop site
- No 2025 or 2026 edition found; carrv.github.io still points to the 2024 edition
- Not listed in CORE ICORE2026 and not on the CCF list
