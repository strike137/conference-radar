notes:
- Main venue for program comprehension research; called IWPC (workshop) before 2006
- Always co-located with ICSE and held just before it (Ottawa 2025, Rio de Janeiro 2026, Dublin 2027)
- Research track uses double-anonymous review with at least three reviewers; 10 pages main text plus 2 pages of references
- Also has ERA (early research achievements), RENE (replications and negative results), tool demo and journal-first tracks
- Proceedings appear in the ACM or IEEE digital libraries; CORE A, CCF B
