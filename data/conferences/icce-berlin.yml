notes:
- European edition of IEEE ICCE run by the IEEE Consumer Technology Society
- Held every September in Berlin as the scientific forum alongside the IFA consumer electronics trade show
- 2 to 6 page papers in IEEE format, up to 2 extra pages at 100 USD each; accepted and presented papers go to IEEE Xplore and EI Compendex
- In person only; papers not presented are not published, and one author registration covers one paper
- Broad consumer technology scope including security and privacy of CE systems, IoT, wireless, AI and quantum
- Co-located with the IEEE Conference on Gaming, Entertainment, and Media (GEM) in 2026
- No edition in 2024 (2023 was the 13th, 2025 the 14th)
- Not listed in CORE ICORE2026
