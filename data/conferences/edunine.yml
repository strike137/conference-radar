notes:
- IEEE Education Society conference for Region 9 (Latin America), organized with COPEC; sibling of FIE, EDUCON and TALE
- Accepted and orally presented papers go to IEEE Xplore
- Full papers 6 pages, work-in-progress and doctoral symposium papers 4 pages; papers in English, talks in English, Spanish or Portuguese
- Two review rounds; conditionally accepted papers are re-checked by the program committee before final acceptance
- Hybrid, held in a different Latin American city each March (Bogota 2023, Guatemala 2024, Montevideo 2025, Mexico City 2026, Santa Cruz 2027)
- Not listed in ICORE2026 or the CCF 2026 list
