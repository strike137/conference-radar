notes:
- Flagship Brazilian security symposium of the Brazilian Computer Society (SBC), held since 2001; renamed from
  Simpósio Brasileiro de Segurança da Informação e de Sistemas Computacionais to Simpósio Brasileiro de
  Cibersegurança in 2025
- Papers in Portuguese or English; double-blind review; full papers up to 16 pages and short papers up to 7 pages
  in the SBC single-column template
- Proceedings (Anais) published open access in the SBC OpenLib (SOL) digital library
- Held in a different Brazilian city each year (Armação dos Búzios 2026); co-located workshops and tracks such as
  WTICG, WISE, CTDSeg and an industry track
- Not ranked in CORE ICORE2026
