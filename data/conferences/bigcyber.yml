notes:
- Workshop on big data analytics for cybersecurity (threat intelligence, attack detection, forensics); 2026 is the 9th
  edition
- Held with the IEEE International Conference on Big Data every year since 2018
- All accepted workshop papers go into the IEEE BigData workshop proceedings (IEEE Computer Society Press, IEEE Xplore)
- Papers up to 10 pages in IEEE format; mix of peer-reviewed and invited papers
- Small workshop (8 to 15 papers per edition, half or full day)
- Run online in 2025 and listed as online for 2026, although IEEE BigData itself is in person
- Late deadline (October), useful for a quick end-of-year submission
- Not ranked by CORE (not in ICORE2026) or CCF
