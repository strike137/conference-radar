notes:
- Proceedings in Springer LNAI; regular papers 12 pages plus up to 4 paid extra pages, special track papers 10 pages;
  double-blind review via EasyChair
- 2026 edition emphasized applied knowledge science in networking and cybersecurity, including LLMs
- Very large proceedings (seven LNAI volumes for the main conference in 2026)
- Location varies (2021 Tokyo, 2022 Singapore, 2023 Guangzhou, 2024 Birmingham, 2025 Macao, 2026 Beijing), but most
  editions are in China
- Co-located AICom2 symposium with a later deadline (2026-04-01); its papers form volumes 8 and 9 of the Springer
  proceedings
