notes:
- ICSE workshop on the software engineering side of digital twins (requirements, architecture, DevOps/TwinOps, testing, assurance)
- First edition at ICSE 2027 in Dublin (workshop day 2027-05-01)
- Co-chaired by Bentley Oakes (Polytechnique Montreal), Mirgita Frasheri (Aarhus University) and Judith Michael (University of Regensburg)
- Full papers up to 8 pages, short papers up to 5 pages, references included; IEEE conference template; single-blind review via HotCRP
- Papers published in the ICSE 2027 Companion proceedings; ICSE 2027 workshop papers are published by IEEE
- Program includes a keynote and a closing panel to set a research agenda for digital twin software engineering
- Different from SEDT (Brazilian CBSoft workshop on software engineering for digital twins) and DTwin (digital twins over wireless networks)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
