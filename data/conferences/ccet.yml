id: ccet
name: CCET
full_name: IEEE International Conference on Computer and Communication Engineering Technology
type: conference
tier: minor
areas: [general, communications, networking]
region: china
language: english
frequency: annual
organizer: Host universities with IEEE co-sponsorship (2026 co-sponsored by Taiyuan University of Technology and IEEE, hosted by Taiyuan University of Technology and North China University of Technology)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI Compendex, Scopus]
fee: General author 580 USD or 4100 RMB, student or committee author 520 USD (2026, after 2026-05-15); 50 USD per page over 5 pages; delegate 350 USD
typical:
  deadline_months: [7]
  conference_months: [8]
links:
  website: http://www.ccet.org/
notes:
- Annual since 2018; 2026 is the 9th edition
- Held in Beijing except virtual 2020 to 2022 (2023 to 2025 in person and online); Taiyuan in 2026
- Proceedings by IEEE every year (IEEE Xplore, EI Compendex, Scopus)
- Broad computer and communications scope
- Submission via EasyChair; presentation-only and delegate registration also offered
- Not listed in CORE ICORE2026 or the CCF 2026 list
