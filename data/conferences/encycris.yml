notes:
- Co-located with ICSE every year since 2020, so it moves with ICSE (Melbourne 2023, Lisbon 2024, Ottawa 2025, Rio de Janeiro 2026, Dublin 2027)
- Cybersecurity, safety and resilience of critical infrastructure and cyber-physical systems; values industrial experience papers
- Full papers up to 8 pages and short papers up to 5 pages, references included
- 2027 uses the IEEE template (ACM template in 2026)
- 2026 proceedings prepared by IEEE CPS for ACM DL and IEEE Xplore; 2027 proceedings published by IEEE
- Small workshop (six accepted papers in 2025)
- Not ranked by CORE and not on the CCF list
