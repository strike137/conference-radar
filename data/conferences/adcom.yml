notes:
- Flagship systems conference of the Advanced Computing and Communications Society (ACCS), based at IISc Bangalore; 2027 is the 31st edition
- Proceedings in Springer CCIS since 2024 (ADCOM 2023 was published by IET)
- Each edition has a theme (Responsible AI 2024, Technologies for a Sustainable Future 2025, Multi-Agent Systems and Decentralized Intelligence 2027)
- Double-blind review, papers up to 20 pages in Springer CCIS format
- Held in Bangalore since 2009 with a partner institution (IIIT Bangalore 2024 and 2025, PES University 2027); Kochi in 2023
- Includes a PhD forum
- Low registration fees (2025, 4000 INR for authors, 1000 INR for students)
- "CORE ICORE2026: National: India"
