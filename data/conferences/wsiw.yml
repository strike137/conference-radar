notes:
- Workshop at SOUPS on people who handle security and privacy information as part of their jobs (developers, admins, analysts, consultants, privacy engineers)
- Series runs back to 2014; WSIW'24 was the 10th edition, held in person in Philadelphia with SOUPS 2024
- Held with SOUPS in North America; 2020 and 2021 editions were online, plus quarterly online meetings in 2021
- Papers up to 6 pages excluding references in the SOUPS template, anonymized, submitted via HotCRP
- Papers are given to attendees and posted on the workshop site but do not appear in the official SOUPS proceedings
- "Registration fee: 75 USD (2024, through SOUPS)"
- Not held with SOUPS 2025 or SOUPS 2026
- Not listed in CORE ICORE2026 or the CCF list
