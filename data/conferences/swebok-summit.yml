notes:
- Industry- and practice-focused one-day in-person workshop on the IEEE CS SWEBOK Guide, SE skills, competencies, education and certification
- Held with ICSE every year since 2025 (1st ICSE 2025, 2nd ICSE 2026 in Rio de Janeiro, 3rd ICSE 2027 in Dublin)
- 2027 papers up to 5 pages in IEEE format go into the Summit proceedings; 1-page talk summaries are not included
- ICSE 2027 workshop papers are published by IEEE
- Keynotes, panels and invited tutorials besides selected presentations
- Authors must register and present in person
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
