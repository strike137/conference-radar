links:
  website: https://pandora-workshop.github.io/
notes:
- First edition in 2026, a one-day workshop at EMNLP 2026 in Budapest
- Topic is pluralism in NLP and AI alignment (human label variation, disagreement-aware data, pluralistic alignment and evaluation)
- Long (8 pages), short (4 pages) and extended abstract (2 pages) submissions; double-blind via OpenReview
- Authors choose archival or non-archival; archival papers appear in the ACL Anthology (2026.pandora-1)
- Direct submission and ARR commitment tracks
- Hybrid format (online and in person)
- Not ranked in ICORE2026 and not on the CCF list
