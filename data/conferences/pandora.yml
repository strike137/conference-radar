id: pandora
name: PANDORA
full_name: "Workshop on Pluralistic AI & NLP: Diversity-aware, Sociotechnical, Responsible Alignment"
type: workshop
tier: minor
areas: [nlp, ai]
region: europe
language: english
organizer: Workshop organizers from University of Copenhagen, LMU Munich, Amazon, UNSW, AI Security Institute, MBZUAI and Ai2; co-located with EMNLP 2026
organizer_country: [international]
proceedings: ACL Anthology (EMNLP 2026 workshop proceedings)
archival: true
typical:
