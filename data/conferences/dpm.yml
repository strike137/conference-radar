id: dpm
name: DPM
full_name: International Workshop on Data Privacy Management
type: workshop
tier: minor
areas: [security, data]
region: europe
language: english
frequency: annual
organizer: Program chairs from Institut Polytechnique de Paris and Universitat Autonoma de Barcelona (J. Garcia-Alfaro,
  G. Navarro-Arribas), co-located with ESORICS
organizer_country: [europe]
proceedings: Springer LNCS
archival: true
typical:
  deadline_months: [6, 7]
  conference_months: [9]
links:
  website: https://deic.uab.cat/conferences/dpm/
  dblp: https://dblp.org/db/conf/dpm/index.html
notes:
- Co-located with ESORICS every year since 2009; 21st edition in 2026 (Rome)
- Springer LNCS post-proceedings (revised selected papers), in the ESORICS workshops volumes in recent years
- Full papers up to 16 pages, short papers up to 8 pages in LNCS format; single-blind review (submissions not anonymous)
- Submitted through the ESORICS EasyChair site, selecting the DPM track
- Pre-proceedings preprints are posted on the website before the workshop
- One-day workshop; at least one author of each accepted paper must register and present the paper
- Not listed in ICORE2026
