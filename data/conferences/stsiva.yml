notes:
- Colombian signal processing symposium run since 2000, hosted by the IEEE SPS Colombian Chapter and IEEE Colombia Section
- Proceedings in IEEE Xplore since 2012; accepted papers must be presented orally to be included
- Papers in English, up to 5 pages in IEEE double-column format, submitted via EasyChair; a separate call for posters
- Covers signal, image and video processing, computer vision, computational imaging, biomedical signals and ML for signal processing
- 2026 was the 26th edition (XXVI), co-located with ColCACI and COLCOM at Universidad Industrial de Santander, Bucaramanga
- "Author registration 2026: COP 1,300,000 (IEEE member, early) to COP 1,700,000 (non-member, regular)"
- Not listed in CORE ICORE2026 or the CCF list
