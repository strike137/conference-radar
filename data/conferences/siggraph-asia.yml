notes:
- Asian edition of ACM SIGGRAPH, sponsored by ACM SIGGRAPH and organized by Koelnmesse; conference plus exhibition every December
- Rotates within Asia-Pacific (Tokyo 2024, Hong Kong 2025, Kuala Lumpur 2026, Tokyo 2027)
- Rated A* in ICORE2026 (as SiggraphA); not listed separately in the CCF list, which rates only SIGGRAPH (A)
- "Two technical paper tracks: journal papers in a SIGGRAPH Asia issue of ACM TOG (no page limit) and conference papers in the ACM DL proceedings (7 pages)"
- Double-blind, four full reviews per paper, rebuttal phase, then conditional acceptance with a second review of the revised paper
- ACM moved to full open access in 2026, so article processing charges apply unless the institution is in ACM Open
- At least one author must present in person; also has posters, technical communications, courses and Real-Time Live! with later deadlines
- Graphics, animation, rendering, imaging, geometry and interactive techniques; listed here for reference as a top vision and graphics venue
