notes:
- Istanbul edition of the worldwide community DevOpsDays series; editions 2016 to 2021 and every year since 2024
- Organized by volunteers from companies such as Kloia, Trendyol, Hepsiburada and Akbank (2026)
- One-day Saturday event with talks and open spaces; 2024 and 2026 at Atasehir, Istanbul (Dedeman Bostanci hotel address)
- Moved from April (2024) to autumn (November 2025, October 2026)
- No papers or proceedings
