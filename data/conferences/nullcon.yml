notes:
- Started in Goa, India in 2010; flagship Goa edition in late Feb or early Mar, plus a Berlin edition whose month
  varies (Mar 2024, Sep 2025, Nov 2026) and Hyderabad or Bangalore editions (Hyderabad 2026 was training only)
- 'Research-first hacker conference: talks, hands-on trainings, CTFs and villages; new, unpublished research gets
  priority in the CFP review'
- 'Goa CFP usually closes in Oct or Nov (Goa 2026: 20 Nov 2025; Goa 2027: 30 Oct 2026); Berlin 2026 CFP closed 12
  Jul 2026'
- Scholarships offered (Goa 2027 applications 9 to 22 Nov 2026); Goa 2026 reported 3,000+ attendees
