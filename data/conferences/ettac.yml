notes:
- Workshop on eye tracking research that uses pattern recognition (gaze detection, gaze-based interaction, eye movement biometrics, eye tracking in VR/AR and health care)
- Chaired by researchers from the University of Pavia (Italy), Paris-Saclay University (France) and Silesian University of Technology (Poland)
- 2nd edition held as a half-day workshop at ICPR 2026 in Lyon
- Papers up to 15 pages in LNCS format (extra pages 150 EUR each), double-blind review through Microsoft CMT
- Only papers of at least 6 pages go into the ICPR 2026 Workshops proceedings in Springer LNCS
- Not listed in ICORE2026 or the CCF list
