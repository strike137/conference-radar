id: ltc
name: LTC
full_name: "Language & Technology Conference: Human Language Technologies as a Challenge for Computer Science and Linguistics"
type: conference
tier: minor
areas: [nlp]
region: europe
language: english
organizer: Adam Mickiewicz University in Poznan
organizer_country: [europe]
proceedings: LTC proceedings (open access, print and electronic; Adam Mickiewicz University Press in 2023)
archival: true
fee: 400 EUR regular, 260 EUR student (2025, early)
links:
  website: http://www.ltc.amu.edu.pl/
notes:
- Conference on human language technologies held at Adam Mickiewicz University (AMU) in Poznan since 1995
- Strong focus on less-resourced languages; 2025 title adds "and Low Resourced Languages"
- The 2023 proceedings were published by Adam Mickiewicz University Press, edited by Zygmunt Vetulani and Patrick Paroubek
- Fee covers open-access proceedings in print and electronic form and one paper of up to 5 pages
- Earlier editions also had revised selected papers in Springer LNAI (LTC 2019, the 9th edition, in LNAI vol. 13212, 2022)
- Not listed in ICORE2026 and not on the CCF list
