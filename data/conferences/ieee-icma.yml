organizer: IEEE RAS (technical sponsor); Kagawa University and Beijing Institute of Technology
organizer_country: [japan, china]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [4]
  conference_months: [8]
links:
  website: http://www.ieee-icma.org/
notes:
- Mechatronics, robotics and automation conference sponsored by IEEE RAS; held every August since 2007 (October in 2020)
- Accepted papers are submitted to IEEE Xplore; 6 pages standard, up to 8 pages with an extra page charge
- Mostly held in Chinese cities (Harbin, Tianjin, Beijing, Changchun, Guilin); returns to Takamatsu, Japan every few
  years (2021, 2027)
- ICMA 2027 in Takamatsu is planned as a hybrid event (on-site and online)
- Organized sessions of at least four papers can be proposed; deadlines are stated in US Pacific Time
- Not listed in CORE ICORE2026 or the CCF 2026 list
