notes:
- Long-running Asia-Pacific series (40th edition in 2026) mixing linguistics and computational linguistics
- 'Rotates in East and Southeast Asia: Hong Kong 2023, Tokyo 2024, Hanoi 2025, Taipei 2026 (National Taiwan University)'
- Acceptance around 50%; realistic venue for student papers; double-blind review via Microsoft CMT
- Proceedings listed in ACL Anthology and indexed in Scopus since PACLIC 19 (2005)
- Deadlines are often extended by about two weeks
