notes:
- Annual conference of the IEEE Photonics Society covering broad photonics topics (optical communications,
  biophotonics, detection and sensing, and more) with plenary and invited talks and special symposia
- 2-page papers; accepted papers that are presented go into IEEE Xplore; all accepted authors must register and
  present in person
- Post-deadline papers are accepted about a month before the conference for a post-deadline oral session
- Moves between continents (2023 Orlando, 2024 Rome, 2025 Singapore, 2026 Denver)
- Not listed in ICORE2026; photonics venue outside the usual CS rankings
