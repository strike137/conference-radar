notes:
- Biennial algorithms and data structures symposium held in even years, alternating with WADS
- Formerly named Scandinavian Symposium and Workshops on Algorithm Theory (title used up to 2024)
- Held in the Nordic countries (Reykjavik 2016, Malmo 2018, Torshavn 2020 and 2022, Helsinki 2024, Copenhagen 2026)
- Proceedings in the open-access LIPIcs series (Schloss Dagstuhl); 2026 was LIPIcs volume 370
- Double-blind submission, 15 pages in LIPIcs format excluding references
- Best student paper award
- Not listed in ICORE2026 (CORE B in the old ERA2010 list) and not on the CCF list
