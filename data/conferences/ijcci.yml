notes:
- Joint INSTICC conference of ECTA (evolutionary computation), FCTA (fuzzy computation) and NCTA (neural
  computation), each in its 18th edition in 2026
- Proceedings published by Springer in a CCIS series book (2025 and 2026)
- CORE C (ICORE2026)
- Co-located with IC3K, ICINCO, CoopIS, WEBIST and IN4PL, with free access to the co-located events
- Two submission stages plus a late-breaking track; all deadlines AoE
- Held in Europe (Valletta 2022, Rome 2023, Porto 2024, Marbella 2025, Angers 2026); 2021 was online
