notes:
- Workshop on discovering, indexing, ranking and evaluating AI agents and tools as an information retrieval problem
- First edition co-located with ACM SIGIR 2026 in Melbourne, Australia (full-day workshop on July 24, 2026)
- Non-archival; double-blind review in the ACM two-column SIGIR 2026 template
- Extended abstracts up to 2 pages and research, perspective or demo papers of 4 to 9 pages (excluding references), submitted via EasyChair
- "11 papers accepted in 2026"
- Runs the AgentSearch Challenge, a shared task on retrieving and reranking nearly 10,000 real-world agents (dataset released August 2026)
- Only one edition so far; region reflects the single 2026 edition
- Not listed in ICORE2026 and not on the CCF list
