notes:
- Non-profit one-day Security BSides conference in Chicago, held the day after THOTCON
- Run by longtime members of the Chicago hacking community, several of whom founded the original BSides Chicago; independent of BSides Chicago today
- 2026 edition had two talk tracks with 15 presenters, a CTF, lockpicking and a Linux village
- Talks chosen through a call for presentations; the 2027 CFP had not opened as of October 2026
- Talks posted on YouTube, no proceedings
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
