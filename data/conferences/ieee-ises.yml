full_name: IEEE International Symposium on Smart Electronic Systems
type: conference
tier: minor
areas: [systems, security, ai, general]
region: south-asia
language: english
frequency: annual
organizer: IEEE Computer Society Technical Committee on VLSI (TCVLSI), with a host institute in India each year
organizer_country: [india, usa]
proceedings: IEEE Xplore
typical:
  deadline_months: [8]
  conference_months: [12]
links:
  website: https://ieee-ises.github.io/
notes:
- Sponsored meeting of the IEEE Computer Society Technical Committee on VLSI (TCVLSI), a sister venue of ASAP,
  ISVLSI and ARITH; annual since 2015 (proceedings 2015 to 2024 linked from the official site)
- Steering committee of mostly US and Indian academics, founded by Saraju Mohanty (University of North Texas)
- Proceedings in IEEE Xplore
- Tracks on nanoelectronic VLSI and sensor systems, energy efficient reliable VLSI, hardware/software for IoT and
  consumer electronics, hardware for secure information processing, hardware/software for AI, robotics and
  automation, and hardware/software for vehicular intelligent systems
- Regular papers up to 6 pages, short papers and posters up to 4 pages; student research forum and research
  demo session tracks
- Held in India every year (Chennai 2020; Jaipur 2021; Warangal 2022; Ahmedabad 2023; New Delhi
  2024; Jaipur 2025)
- Selected 2025 papers invited to an extended special edition of SN Computer Science
- Submission deadline was extended several times in 2025 (to June 30, July 21, then August 10)
- Official site and past edition websites are hosted at ieee-ises.github.io
