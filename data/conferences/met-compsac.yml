notes:
- 10th edition in 2026, held as a workshop of IEEE COMPSAC 2026 in Madrid
- Covers metamorphic testing and metamorphic relations, including applications to AI, autonomous systems and LLMs
- Organized by Dave Towey and Alejandro Guerra-Manzanares (University of Nottingham Ningbo China) with Alberto Nunez and Pablo Cerro Canizares (Universidad Complutense de Madrid)
- Not listed in the CORE portal; COMPSAC itself is CORE B
- Workshop papers are 6 pages (up to 2 extra pages at USD 125 each) and appear in the COMPSAC proceedings on IEEE Xplore
- Workshop deadlines are shared across all COMPSAC workshops
