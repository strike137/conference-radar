notes:
- Biennial series since 2006, run by the ECE Department of IIUM; held at the IIUM Gombak campus in Kuala Lumpur
  (2023 and 2025 in August, hybrid)
- Proceedings in IEEE Xplore and indexed in Scopus; up to 6 pages in IEEE double-column format, submitted via EDAS
- Broad scope covering wireless and satellite communications, antennas, RF, networks, AI, IoT and cyber security
- At least one author must attend and present, otherwise the paper is not sent to IEEE Xplore
- Submission deadline is usually extended (2023 May 1 -> May 19 -> May 31; 2025 extended to May 31)
- Not in the ICORE2026 or CCF lists
