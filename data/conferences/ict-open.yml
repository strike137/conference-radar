notes:
- National conference of the Dutch ICT research community, run by the Dutch Research Council (NWO) with the ICT Research Platform Netherlands (IPN) and PRIO
- Researchers submit abstracts for oral, poster or demo presentations in themed parallel tracks; no proceedings
- Open to master students, PhD candidates, postdocs, industry and universities of applied sciences
- Poster and demo prizes for early career researchers; the Dutch Prize for ICT research is awarded here
- Held in the Netherlands (Utrecht in 2025, de Doelen Rotterdam in 2026 and 2027); more than 400 visitors in 2026
