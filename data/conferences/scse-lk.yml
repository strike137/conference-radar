notes:
- Run by the Department of Industrial Management, Faculty of Science, University of Kelaniya, Sri Lanka; held at
  the university every year since 2018 (8th edition in 2025, 10th edition announced for 2027)
- Papers from SCSE 2019 onward are in IEEE Xplore and indexed in Scopus; technical sponsorship from the IEEE Sri
  Lanka Section (IEEE and IEEE Computer Society also listed in 2024)
- Applied computing scope in eight tracks for 2027 (software engineering, AI, health analytics, text analytics,
  smart logistics, industrial engineering and management, smart systems engineering, IT and education)
- Anonymized submission via Microsoft CMT, 4 to 6 pages in IEEE format; papers of no-show authors are not sent to
  IEEE Xplore
- Pre-conference workshops are held in the days before the main conference
- Recent editions held in early April (2024, 2025); the 2023 edition was a one-day event in late June
- Not listed in ICORE2026 or the CCF list
