notes:
- Workshop on diagrammatic methods in logic and computation (string diagrams, proof nets, graph rewriting, Petri nets, interaction nets, visual proof assistants)
- First edition in 2026, co-located with LICS 2026 at FLoC 2026 in Lisbon; keynote shared with TERMGRAPH 2026
- Contributions are short abstracts of 1 to 5 pages (research, work in progress, position papers, tool demos); remote presentations possible
- No formal proceedings
- Not listed in ICORE2026 or the CCF 2026 list
