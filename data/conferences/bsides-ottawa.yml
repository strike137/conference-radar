notes:
- Grassroots, volunteer-powered Security BSides conference in Ottawa, Canada
- Two-day event in 2026 at the Ottawa Conference and Event Centre with talks, villages (policy, defenders, embedded, malware, lockpick, career), a CTF and an escape room
- "Formats: 20 min rookie slot, 30 min standard talk, 45 min deep dive or panel, 120 min workshop, 10 min lightning"
- First-time speakers and international submissions explicitly welcome; 2026 theme is Who Controls the Stack?
- Separate CFP for the Policy Village
- No proceedings
