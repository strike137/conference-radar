notes:
- Single-track conference on networked embedded systems, wireless sensor networks, IoT and cyber-physical systems
- Founded in 2004 as the European Workshop on Wireless Sensor Networks, renamed European Conference on Wireless
  Sensor Networks in 2007 and International Conference on Embedded Wireless Systems and Networks in 2016
- Run by a steering committee (chair at TU Graz); held in Europe in most years (2024 in Abu Dhabi, 2019 in Beijing)
- Proceedings in the ACM Digital Library, also indexed in Scopus and DBLP
- Two submission rounds (winter and spring) with accept, reject or one-shot revision decisions; double-blind review
- Full papers up to 12 pages and short papers up to 6 pages; at least one author must register at the full
  (non-student) rate and present in person
- Moved from February to autumn in 2022 (October 2022, September since 2023 except December 2024)
- ICORE2026 rank B; not in the CCF list
