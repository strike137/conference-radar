notes:
- Annual since 2018; 2026 was the 9th edition
- Recent hosts are mostly Japanese and Greek universities (Nagoya 2022, University of Macedonia 2023, Kogakuin University 2024, SUSTech Shenzhen 2025, Okinawa 2026); 2020 and 2021 were online
- Sponsored by Nagoya University and IEEE and hosted by the Nagoya University Information Technology Center (2026); listed in the IEEE conference list
- Proceedings in IEEE Xplore, stated as submitted to EI Compendex and Scopus
- Run by a commercial conference secretariat (163.com contact address); full paper or abstract only presentation
- Short review cycle (2026 notification ten days after the submission deadline)
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
