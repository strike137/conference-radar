notes:
- Annual since 2009, co-sponsored by IEEE and the Cloud Computing Association; the 2026 edition also lists IEEE
  TCCLD and IMT SudParis among its organizers
- Accepted papers go into the IEEE CloudCom conference proceedings, submitted to IEEE Xplore and EI Compendex; demos
  are not published
- Up to 8 pages in IEEE CS format including references, double-blind review via EasyChair; at least one author
  must register and present in person
- 'Tracks cover cloud architecture and virtualization, cloud services, security and privacy, IoT and distributed
  cloud, edge computing, AI for cloud, large models and e-health'
- Rotates worldwide (Bangkok 2020 virtual and 2021, Brisbane 2022, Naples 2023, Abu Dhabi 2024, Shenzhen 2025,
  Paris 2026); each year has its own cloudcomYYYY.org site
- CORE C (ICORE2026); not to be confused with the ACM CCSW workshop or IEEE CloudNet
- Short gap between deadline and conference (about 2 months in 2025 and 2026)
