notes:
- Small committee; recent meetings are the SMASH multi-agent symposia (summer and winter), co-organized with JSSST
  MACC, IPSJ ICS, JSAI DOCMAS and the IEEE Computer Society Tokyo/Japan Joint Chapter
- Also joins the March research week on social systems and information technology (WSSIT) with JSAI and IPSJ SIGs
  (Furano in 2026)
- Manuscripts in Japanese or English, 2 to 8 pages; work similar to talks given elsewhere is accepted
- Only three meetings in FY2025
