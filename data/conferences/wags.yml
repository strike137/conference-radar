notes:
- One-day workshop co-located with FSTTCS on automata, logic and games for automated synthesis
- Invited talks plus short contributed talks; contributions are submitted through a Google form, with an early and a final deadline
- No proceedings
- Held in India with FSTTCS since 2024 (Gandhinagar 2024, Goa 2025, New Delhi 2026)
- Registration was through the FSTTCS registration page in 2025; 2026 registration to be announced
- Not listed in CORE ICORE2026 or the CCF 2026 list
