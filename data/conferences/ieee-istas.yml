notes:
- Annual symposium organized by the IEEE Society on Social Implications of Technology (SSIT); 2026 hosted by the IEEE SSIT Kerala Chapter
- Covers social, ethical, policy and humanitarian aspects of technology, including AI ethics, privacy and governance
- Location rotates worldwide (Swansea 2023, Puebla 2024, Santa Clara 2025, Kovalam near Thiruvananthapuram 2026)
- 2026 used single-blind review via Microsoft CMT; camera-ready papers up to 8 pages including references in IEEE two-column format
- Accepted and presented papers are submitted for possible inclusion in IEEE Xplore
- Has a separate student track with abstract submission
- CORE ICORE2026 rank C
