notes:
- Workshop on formal verification of program equivalence and relational properties (regression verification, product programs, refinement, hyperproperties and secure information flow)
- 6th edition in 2026 at FLoC 2026 (Lisbon), satellite of CAV; 5th edition in 2022 at FLoC 2022 (Haifa); no editions 2023 to 2025
- Regular papers up to 15 pages and extended abstracts up to 3 pages (LNCS format); work in progress and position papers welcome
- Informal proceedings posted on the website; speakers asked to consider a post-proceedings volume (no series named)
- 2026 co-chairs from Imperial College London and Karlsruhe Institute of Technology
