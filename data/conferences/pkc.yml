notes:
- IACR area conference on public-key cryptography; symmetric-key and pure information-theoretic topics are out of
  scope
- PKC 2027 is in Taipei (general chairs from Academia Sinica), PC co-chaired by Tung Chou (Academia Sinica) and
  Ryo Nishimaki (NTT); PKC 2022 was Yokohama, Japan
- Two-round review with a rebuttal phase; proceedings in Springer LNCS
- Deadline moved earlier for 2027 (16 Aug 2026 AoE instead of October)
- Students presenting accepted papers get registration waived; limited stipends via the general chairs
