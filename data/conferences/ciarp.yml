notes:
- Main Ibero-American pattern recognition conference since the 1990s, endorsed by IAPR; hosted each year by a
  national pattern recognition association
- Proceedings in Springer LNCS ("Progress in Pattern Recognition, Image Analysis, Computer Vision, and Applications";
  2025 -> LNCS 16528 to 16529, 52 full papers from 110 submissions)
- Papers of 6 to 15 pages in LNCS format, submitted through Springer EquinOCS
- Held in Latin America, Spain and Portugal (Havana 2019, Porto 2021, Coimbra 2023, Talca 2024, Bogota 2025,
  Mexico City 2026); no 2020 or 2022 edition
- IAPR Best Paper and Best Student Paper awards
- CORE C (ICORE2026); not in the CCF list
