links:
  website: https://www.aiverification.org/
notes:
- Formal methods for AI (neural network verification, safeguards for machine learning) and AI for formal methods
- Successor to the FoMLAS and WOLVERINE workshops; counts its editions from FoMLAS 2018, so 2026 is the 9th edition but only the third SAIV volume in LNCS
- Proceedings in Springer LNCS (SAIV 2025 -> LNCS 15947, SAIV 2026 -> LNCS 16831)
- Hosts the International Verification of Neural Networks Competition (VNN-COMP)
- 'Co-located with CAV: 2024 Montreal, 2025 Zagreb, 2026 Lisbon (FLoC)'
- 'SAIV 2027 becomes a standalone event for the first time: a SAIV week in London (Oct 31 to Nov 5, 2027) with an autumn school, main conference on Nov 2 to 3 and a co-located workshop'
- Single-blind review, LNCS format, papers up to 18 pages; presentation-only papers allowed (not in the proceedings)
- 2026 had a separate FLoC track for papers rejected from CAV, IJCAR, KR or SAT
- Not listed in ICORE2026 or the CCF list
