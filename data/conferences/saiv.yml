notes:
- Formal methods for AI, verification of neural networks, safeguards for machine learning and AI for formal
  methods; brings the formal methods and AI communities together
- Successor (since 2024) of the FoMLAS and WOLVERINE workshops; 9th edition in 2026
- Two-day symposium co-located with CAV (Montreal 2024, Zagreb 2025, FLoC Lisbon 2026)
- Proceedings in Springer LNCS; papers up to 18 pages in LNCS format excluding references and appendices,
  single-blind review on HotCRP
- Also accepts benchmark and case-study papers and presentation-only papers that do not appear in the proceedings
- Hosts the International Verification of Neural Networks Competition (VNN-COMP)
- Not listed in ICORE2026 or on the CCF list
