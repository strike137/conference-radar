notes:
- Workshop on how people form impressions of others from language and how NLP and LLMs model social perception, stereotypes and bias
- First edition in 2026, co-located with ICWSM 2026 in Los Angeles
- Archival long (5 to 8 pages) and short (up to 4 pages) papers, plus non-archival extended abstracts (2 pages); AAAI format, double-blind, via OpenReview
- Archival papers appear in the ICWSM Workshop Proceedings with a DOI per paper
- Not listed in ICORE2026 and not on the CCF list
