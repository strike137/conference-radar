notes:
- Flagship international conference of the IEEE Delhi Section (IEEE Region 10), started in 2022
- "Hosts so far: NSUT New Delhi (2022), Chitkara University Punjab (2023), BVPCE New Delhi (2024), Jamia Millia Islamia New Delhi (2025), BITS Pilani (2026)"
- Each edition has its own theme; 2026 is technically co-sponsored by the IEEE Industry Applications Society
- Broad electrical, electronics and computer engineering scope with many tracks
- Double-blind review via EDAS; accepted and presented papers are submitted to IEEE Xplore, no-show papers are excluded
- 2026 edition is fully in person with no online presentation option
- Submission deadlines are usually extended several times
- Not listed in ICORE2026 or the CCF 2026 list
