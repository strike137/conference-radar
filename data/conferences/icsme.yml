notes:
- Main IEEE conference on software maintenance and evolution (called ICSM before 2014); held in September since
  2025 (early October in 2023 and 2024)
- 'Early decisions (since 2025): clear accepts and clear rejects are notified at the start of the author response
  period'
- Double-anonymous review; 10 pages plus 2 pages of references; CORE A, CCF B
- Co-located with SCAM and VISSOFT in 2026
- 2025 edition was in Auckland; 2027 edition in Toronto
