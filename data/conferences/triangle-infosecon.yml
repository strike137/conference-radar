notes:
- One-day regional practitioner security conference in Raleigh, North Carolina, USA; run by the Raleigh chapter of ISSA
- 2026 edition at the Raleigh Convention Center; the website lists the 2027 edition at the Atlantic Union Bank Convention Center
- Speakers are chosen through a call for speakers on Sessionize, open from March to early October in 2026
- Speakers pay their own travel and lodging; conference admission is free for speakers
- No proceedings; presentation archives are posted on the website
