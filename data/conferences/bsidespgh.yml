notes:
- Volunteer-run Security BSides conference in Pittsburgh, Pennsylvania, USA, held since 2011 (2020 canceled)
- One day on a Friday in July at Rivers Casino Pittsburgh, attendees must normally be 21 or older
- Over 1,000 attendees; multiple presentation tracks, CTF, lockpick, career and wireless villages, after party
- Talks of 45 or 20 minutes chosen by anonymous (blind) review; speaker process begins in early spring
- 2026 talks were not recorded; no proceedings
