notes:
- Top-ranked IEEE ComSoc networking conference (ComSoc lists it as a premier conference), covering both theory and
  systems; large program (327 papers in 2026)
- One deadline per year in late July (AoE) with early-reject notification in October; two-round, double-blind review
- INFOCOM 2026 was held in Tokyo, the first time in the city; INFOCOM 2027 is in Honolulu
- Workshops, posters/demos, student travel grants and N2Women fellowships
