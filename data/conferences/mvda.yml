notes:
- Workshop of IEEE COMPSAC (IEEE Computer Society); 14th edition in 2026, 13th at COMPSAC 2025 in Toronto
- Covers modeling, formal specification and verification of distributed, cloud service and real-time embedded applications
- Organized by Leila Ben Ayed (ENSI, University of la Manouba), Ahlem Ben Younes (ENSIT, University of Tunis) and Sarra Abidi (University of la Manouba), Tunisia
- Not listed in the CORE portal; COMPSAC itself is CORE B
- Workshop papers are 6 pages (up to 2 extra pages at USD 125 each) and appear in the COMPSAC proceedings on IEEE Xplore
- Workshop deadlines are shared across all COMPSAC workshops
