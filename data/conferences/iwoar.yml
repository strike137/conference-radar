notes:
- Standalone workshop with a conference-like format on human and animal activity recognition with wearable and device-free sensors
- Started as WOAR 2014 at Fraunhofer IGD Rostock; renamed from "Sensor-based Activity Recognition and Interaction" to "... and Artificial Intelligence" in 2022
- Held mostly in Germany (Luebeck 2023, Potsdam 2024, Wiesbaden 2026), Enschede (Netherlands) in 2025
- 2025 proceedings in Springer LNCS; 2026 papers go to SpringerLink in LNCS format; authors must register and present to be published
- Single-blind review with 2 to 3 reviews per paper; full papers 8 to 20 pages, separate poster/short paper track
- Not listed in ICORE2026 or the CCF list
