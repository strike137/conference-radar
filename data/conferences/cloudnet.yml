notes:
- IEEE ComSoc conference on cloud, data center and edge networking, SDN/NFV, network softwarization and cloud security;
  held since 2012
- Rotates worldwide (2022 Paris, 2023 New York area, 2024 Rio de Janeiro, 2026 Athens; 2020 and 2021 virtual)
- No 2025 edition; the 2026 site lists 2024 and 2023 as the previous conferences
- Proceedings in IEEE Xplore; accepted papers must be registered and presented to be published
- 2026 limit is 6 pages (up to 8 with 100 USD per extra page), submission via EDAS; 2024 allowed 8-page full papers
  and 4-page short papers
- Workshops, special sessions and a demo, datasets and open repositories track run alongside the main conference
- One full or limited author registration covers up to 3 papers
- Not listed in ICORE2026 (portal search returns no results) and not in the CCF 2026 list
