notes:
- ACM SIGIR conference on user-centered information access, seeking, retrieval and interactive search
- Proceedings in the ACM Digital Library; CORE B (ICORE2026)
- Many tracks (full, perspective, short, demo and design, resource, industry papers, tutorials, workshops,
  doctoral consortium); full papers up to 10 pages plus references, double-blind review
- Abstract registration one week before the full paper deadline in October; held in March
- Held in person; location rotates worldwide (Seattle 2026, Berlin 2027)
- ACM is fully open access from 2027, so authors outside ACM Open institutions may pay an APC (subsidized 500 USD
  for ACM/SIG members in 2027)
