notes:
- Network measurement and analysis venue (Internet, wireless, cloud, security and privacy through measurement, QoE)
- Proceedings in Springer LNCS (PAM 2026 is LNCS 16477)
- Held as a virtual event every year since 2021; PAM 2027 is again virtual-only
- Long papers up to 24 pages and short papers up to 11 pages in LNCS format, double-blind review
- Abstract registration one week before the paper deadline (late October and early November, AoE)
- Ethics appendix is mandatory; best paper and community contribution awards
- PAM 2026 accepted 9 full and 9 short papers out of 51 submissions; PAM 2025 accepted 20 out of 67
- CORE B (ICORE2026) and CCF C (network and information security list)
