notes:
- Industry conference on languages, tools, methodologies and standards for design and verification of electronic systems and ICs (SystemVerilog, UVM, PSS, SystemC, formal, AMS, post-silicon validation, AI/ML in verification)
- Indian edition of the Accellera DVCon series, held in Bengaluru; expanded to three days in 2026
- Two-stage submission, extended abstract of 600 to 1200 words via EasyChair first, then a final paper of up to 8 pages after acceptance
- At least one author must register and present the paper or poster in person
- Papers and presentations go to Accellera's DVCon proceedings archive, not to IEEE Xplore or the ACM DL
- Best paper and best poster awards, a student design contest, and an exhibition
- Not listed in the CORE portal (ICORE2026) or on the CCF list
