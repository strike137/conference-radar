notes:
- IEEE CS conference focused on knowledge graphs and graph learning; 17th edition in 2026; the series ran as IEEE
  ICBK (Big Knowledge) until 2021
- 'Location rotates worldwide: Orlando (2022), Shanghai (2023), Abu Dhabi (2024), Limassol, Cyprus (2025), Shenyang
  (2026)'
- Single-blind review, 8 pages IEEE 2-column including references, submissions via CyberChair; no separate abstract
  deadline
- Special tracks (KG construction, KG reasoning, KG and LLMs, GNNs) are included in the main proceedings
- Not ranked by CORE or CCF; 2026 allowed presentation on site or remotely
