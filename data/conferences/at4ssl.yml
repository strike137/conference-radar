notes:
- Workshop on machine translation between sign and spoken languages (sign language data, recognition, avatar synthesis, linguistics, ethics, deaf community involvement)
- Held with MT Summit 2021 (virtual), EAMT 2023 (Tampere) and MT Summit 2025 (Geneva)
- 2023 edition accepted 6 of 9 submissions
- Interpreting between English and International Sign provided at the workshop
- Proceedings published by EAMT in the ACL Anthology (2025.at4ssl-1, ISBN 978-2-9701897-3-2)
- Not ranked in ICORE2026 and not on the CCF list
