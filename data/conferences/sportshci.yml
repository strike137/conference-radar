notes:
- New series on HCI and sports, started in 2025 (Enschede, Netherlands); 2026 is the second edition
- In cooperation with ACM SIGCHI; proceedings in the ACM International Conference Proceedings Series (ICPS), open access with APCs for authors outside ACM Open
- Full papers have a mandatory abstract one week before the paper deadline; double-blind review, single-column ACM format, no upper page limit
- Late-breaking work and demo tracks with later deadlines
- Single-track, fully in-person conference
- Not ranked by ICORE2026 and not on the CCF list
