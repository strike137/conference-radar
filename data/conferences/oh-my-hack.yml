notes:
- Polish practitioner cybersecurity conference run by the events company PROIDEA (Krakow), which also runs CONFidence
- Talks are in Polish; program council under Adam Haertle of the Zaufana Trzecia Strona security news site
- 2026 is the 8th edition, at PGE Narodowy in Warsaw; about 1450 attendees and 65 speakers in 2025
- Talk proposals via a Google Forms CFP; speakers get free entry, accommodation and travel up to 1000 PLN
- "Tickets: 899 PLN first round, 399 PLN students under 26 (2026)"
- No published proceedings; talks are recorded
