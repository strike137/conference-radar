notes:
- Yearly workshop for Scheme, Racket, Lisp dialects and other dynamic functional languages, co-located with ICFP
- Full papers and experience reports of 5 to 12 pages go into the proceedings; position papers of 2 to 4 pages are optional for the proceedings; 1-page lightning talks are not published
- Proceedings published in the ACM Digital Library; ACM acmart sigplan two-column format
- Lightweight double-blind review
- 2026 had a second submission round two weeks after the first deadline
- Held at ICFP/SPLASH 2025 in Singapore and ICFP 2026 in Indianapolis
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
