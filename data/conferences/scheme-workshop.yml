notes:
- Yearly workshop for Scheme, Racket, Lisp dialects and other dynamic functional languages, co-located with ICFP
- Full papers and experience reports 6 to 12 pages go into the proceedings; position papers 2 to 4 pages are optional in the proceedings; 1-page lightning talks are not published
- Proceedings are published in the ACM Digital Library
- Lightweight double-blind review; acmart sigplan two-column format; HotCRP submission
- 2026 had a second submission round two weeks after the first deadline
- Authors of accepted papers can apply for SIGPLAN PAC travel grants
- Follows ICFP (Singapore 2025 with ICFP/SPLASH, Indianapolis 2026)
- Not listed in the CORE portal (ICORE2026)
