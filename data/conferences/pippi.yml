notes:
- MICCAI satellite workshop on fetal, neonatal and paediatric image analysis, held every year since 2016; 2026 was the 11th edition
- Proceedings in Springer LNCS (2025 -> LNCS 16118, 18 full papers)
- Organizers from King's College London, Medical University of Vienna, Boston Children's Hospital, Technion, Erasmus MC and University of Zurich
- Best presentation award; selected full papers have appeared in the MELBA journal
- Not listed in CORE ICORE2026 or the CCF 2026 list
