notes:
- Organized by IARIA as part of the ComputationWorld congress, co-located with SERVICE COMPUTATION and other IARIA events
- Called International Conference on Cloud Computing, GRIDs, and Virtualization up to 2026; renamed for the 18th edition in 2027
- Published open access in the IARIA ThinkMind library (ISSN 2308-4294); selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Usually held in Spain, Portugal, Italy or France; onsite and online participation offered
- The 2027 edition moves earlier to March, with the submission deadline in December 2026
