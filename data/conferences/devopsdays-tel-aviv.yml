notes:
- Tel Aviv edition of the worldwide community DevOpsDays series; editions 2013 to 2019, 2021, 2022 and every year since 2024
- Organized by volunteers from Israeli tech companies (organizers from RTFM Please, AWS, Akeyless, Port and others in 2026)
- One-day event; 2026 at David Intercontinental, Tel Aviv; 2024 (two days, 10th anniversary) and 2025 at Expo Tel Aviv Pavilion 10
- Keynotes from industry figures (Solomon Hykes, creator of Docker, in 2025)
- Paid tickets; 30 min talks, Ignite talks and open spaces; no papers or proceedings
