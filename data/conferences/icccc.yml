notes:
- Biennial conference held since 2006 at Baile Felix near Oradea, Romania (11th edition in 2026)
- Organised by Agora University of Oradea and its R&D centre under the aegis of the Romanian Academy, Information Science and Technology Section
- No separate proceedings; extended versions of accepted and presented papers appear in IJCCC after a further journal review
- IJCCC is indexed in Web of Science (SCIE) and DBLP
- Two-stage review, draft paper (at least 8 pages) submitted through the IJCCC platform, then camera-ready for presentation
- "Fee: 1200 EUR without accommodation, 1600 EUR with three nights at the hotel (2026, includes 900 EUR for IJCCC publication)"
- Not listed in CORE ICORE2026
