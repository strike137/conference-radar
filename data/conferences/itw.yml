notes:
- Workshop of the IEEE Information Theory Society, the smaller companion to ISIT; plenary talks, themed sessions
  and contributed papers
- Full papers of up to 5 pages plus a page of references, submitted via EDAS; accepted and presented papers go to
  IEEE Xplore
- In person only; papers not presented by an author are left out of the proceedings and IEEE Xplore
- Rotates worldwide (Sydney 2025, Tempe 2026, Munich 2027); timing varies, so the 2027 edition in April follows
  the 2026 edition in November
- Topics include coding theory, communications theory, information-theoretic security, ML theory, network
  information theory and quantum information and coding
- First student paper award introduced in 2026
