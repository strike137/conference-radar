notes:
- Workshop co-located with IEEE WCNC; held as WS-06 at WCNC 2026 in Kuala Lumpur (full day)
- 2026 organizers from Beijing Institute of Technology, SUSTech, TU Berlin, South China University of Technology, Tampere University and UC3M
- Topics are new 6G waveforms (OTFS, OCDM, AFDM), mmWave/THz/optical waveforms, ISAC waveforms, AI/LLM-based waveform design and low-complexity transceivers
- Accepted and presented papers go into the WCNC proceedings in IEEE Xplore; no-show papers can be excluded
- Workshop papers need their own author workshop registration
- Not listed in ICORE2026
