archival: true
typical:
  deadline_months: [5]
  conference_months: [8]
links:
  website: https://cccg.ca/
notes:
- Annual since 1989 and usually held in a Canadian city in mid-August (Montreal 2023, St. Catharines 2024, Toronto 2025, Orillia 2026)
- Theoretical and applied work in computational, combinatorial and discrete geometry
- Proceedings published online only on cccg.ca, no paper proceedings
- Papers limited to six pages plus references and appendix, double-blind review
- Accepted papers must be presented in person and need at least one registration
- Co-located with WADS in 2025 (Toronto)
- Selected papers invited to a special issue of Computing in Geometry and Topology (2025)
- Best PhD dissertation award in computational geometry
- Registration fees in CAD plus 13% HST (2026)
- Not in ICORE2026 and not on the CCF list
