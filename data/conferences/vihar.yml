notes:
- Interdisciplinary workshop on vocalisation and speech-based interaction between humans, animals and robots (bioacoustics, animal communication, speech technology, social robots)
- Satellite event of Interspeech, supported by ISCA; VIHAR-2024 (4th edition) was held right after Interspeech 2024 in Kos, Greece
- Started with a Dagstuhl seminar in 2016; held in 2017 (Sweden), 2019 (London), 2021 (Paris, online) and 2024 (Kos, plus an online day)
- 5-page papers (5th page for references only) or 2-page extended abstracts in the Interspeech template; at least two reviews per submission; EasyChair
- 2024 proceedings published as a PDF on the workshop site (ISBN 978-2-9562029-3-6), not in the ISCA Archive
- Not ranked in ICORE2026 and not on the CCF list
