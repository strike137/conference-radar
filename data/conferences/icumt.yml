notes:
- Run by the Department of Telecommunications, Brno University of Technology (Czech Republic), together with
  Tampere University and the local host university
- IEEE technically co-sponsored by a local IEEE section or chapter each year; proceedings in IEEE Xplore
  (2022 and 2023 proceedings confirmed indexed; 2026 papers are sent to IEEE Xplore and Scopus)
- Covers telecommunications, networking, control systems and robotics; security appears only as IoT and
  broadcast security and cryptography topics
- Small event of around 100 participants with co-located workshops (WeaRIoT, AIDL-HCSy, TSP)
- Rotates around Europe (Valencia 2022, Ghent 2023, Gran Canaria 2024, Florence 2025, Prague 2026)
- Submission via EDAS; the paper deadline is extended by several weeks almost every year
- Not listed in the CORE ICORE2026 portal
