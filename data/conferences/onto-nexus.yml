notes:
- Workshop on ontological modeling and analysis for model-based software and systems engineering (MBSE), including formal methods, DevOps and AI for ontologies
- Run by the openCAESAR community around NASA JPL; organizers from the USA, Canada and Denmark
- Co-located with MODELS (1st edition 2025 Grand Rapids, hybrid; 2nd edition 2026 Malaga)
- Accepted papers published in the MODELS joint workshop proceedings
- Regular papers up to 10 pages, short and tool papers up to 5 pages, industry short talks up to 2 pages
- Single-blind review, at least three reviewers per paper
- Not listed in the CORE portal (ICORE2026)
