id: rrpr
name: RRPR
full_name: Workshop on Reproducible Research in Pattern Recognition
type: workshop
tier: minor
areas: [vision, ai, software]
region: worldwide
language: english
frequency: biennial
organizer: ICPR satellite workshop supported by IAPR TC22; 2026 chairs Federico Bolelli, Miguel Colom, Daniel Lopresti
  and Bertrand Kerautret
organizer_country: [europe]
proceedings: Springer LNCS (own post-proceedings, separate from the ICPR workshop volumes)
archival: true
typical:
  deadline_months: [5, 9]
  conference_months: [8, 12]
links:
  website: https://tc22-team.github.io/rrpr2026/
notes:
- Satellite workshop of ICPR every two years; 6th edition in 2026 (Lyon), earlier ones in Kolkata 2024, Montreal 2022,
  Milan (virtual) 2020, Beijing 2018 and Cancun 2016
- Publishes its own post-proceedings in Springer LNCS, distinct from the ICPR workshop proceedings, so revised papers
  can be submitted after the event
- Track 1 on reproducible research frameworks and platforms; Track 2 on companion papers describing the
  reproducibility of results, for example of an accepted ICPR paper
- LNCS format, 6 to 15 pages, blind review by at least 2 referees who also check that the source code matches the paper
- Companion papers tied to an ICPR paper can earn the ICPR Reproducible Badge
- Not listed in ICORE2026
