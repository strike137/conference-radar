notes:
- Annual meeting of the Israeli NLP and computational linguistics community, established in 1995
- Non-archival (the FAQ says presented works are not archived); work submitted or published elsewhere is welcome
- Submissions are 2-page extended abstracts (*ACL format) or full papers from other venues, through OpenReview
- Light, non-anonymous review by the organizing committee
- One-day event with oral and poster sessions; registration is required, presentations in English
- Hosted by Bar-Ilan University in 2025 and the Hebrew University of Jerusalem in 2026
- Earlier hosts -> University of Haifa (2024), Tel Aviv University (2022), Ben-Gurion University (2021), online (2020)
- New in 2026 -> a Call for Collaborations track for one-page collaboration pitches
- Not listed in ICORE2026 and not on the CCF list
