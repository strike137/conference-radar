notes:
- Industry oriented software engineering conference on systems, software and service process improvement, functional
  safety and cybersecurity (Automotive SPICE, ISO 26262, ISO 21434), agile, standards and innovation
- Running since 1994; the 2026 edition was the 33rd
- CORE B (ICORE2026, listed as European SPI); not on the CCF list
- Research and industry/applied science papers are published by Springer in CCIS (two volumes in 2023 to 2026)
- Selected extended experience papers go to the Wiley Journal of Software, Evolution and Process
- Full papers about 12 to 15 pages, short papers 6 to 8 pages, key statement or poster papers 4 pages
- Organised as a hybrid event (onsite and online) with thematic workshops in parallel streams; online participation
  has a reduced fee
- Usually held in Europe in September (Krems 2021, Salzburg 2022, Grenoble 2023, Munich 2024, Riga 2025); 2026 was hosted by Nile
  University in Giza, Egypt
- All presenters must register by the early registration deadline or the paper is removed
