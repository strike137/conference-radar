notes:
- Eurographics symposium on visual computing, visualization and visual analytics for biology, medicine and healthcare; held since 2008, annual since 2014
- Journal track (full and survey papers) goes through two review cycles into a Computers & Graphics (Elsevier) special issue
- Conference track papers (recommended 4 to 8 pages) are published in the Eurographics Digital Library
- Journal track is double-blind; double-blind is optional in the conference track
- Also has posters and demos, an image contest, a Bio+Med+Vis summer school and a MedVis and BioVis workshop
- Held in Europe every year (Vienna 2022, Norrkoping 2023, Magdeburg 2024, Delft 2025, Ljubljana 2026; Berlin announced for 2027)
- All deadlines 23:59 AoE
- Not listed in the ICORE2026 portal and not on the CCF list
