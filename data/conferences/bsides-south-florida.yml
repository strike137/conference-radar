notes:
- Security BSides conference run by a South Florida non-profit founded by regional security executives
- First edition 30 September 2025 at FAU Live Oak Conference Center, Boca Raton (240+ attendees, 19 sessions)
- Second edition 26 April 2026 (400+ attendees); third edition set for 6 May 2027 at Marriott Harbor Beach Resort, Fort Lauderdale
- Two tracks, Technical and Executive (leadership for CISOs and managers)
- Call for papers through a form on the official site; vendor-neutral content and responsible disclosure expected
- Talks only, no proceedings
