notes:
- Organized by IARIA as part of the DataSys congress, co-located with AICT, MOBILITY, INFOCOMP and other IARIA events (13th edition in 2027)
- Published open access in the IARIA ThinkMind library (ISSN 2519-8440); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Portugal, Spain, Italy or France (Porto, Nice, Venice, Valencia, Lisbon, Barcelona in recent years)
- Onsite and online participation options
