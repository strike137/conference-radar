notes:
- CVPR workshop on generative models (text-to-image, video, 3D) used to build synthetic visual datasets for training and evaluating vision models
- 1st edition at CVPR 2024 in Seattle, 2nd at CVPR 2025 in Nashville; not in the CVPR 2026 workshop list
- Full papers up to 8 pages excluding references with the option to go into the CVPR Workshops proceedings; short papers up to 4 pages are non-archival
- Submission via OpenReview in CVPR format, anonymized
- 7 papers on CVF Open Access for 2025, 2 for 2024
- Best paper and runner-up awards with oral presentations; half-day (morning) workshop
- Not listed in ICORE2026 or the CCF list
