region: southeast-asia
language: english
frequency: annual
organizer: Electrical and Electronics Engineering Institute (EEEI), University of the Philippines Diliman
organizer_country: [philippines]
proceedings: Book of abstracts (conference website)
archival: false
typical:
  deadline_months: [6, 7]
  conference_months: [7, 8]
links:
  website: https://neececon2026.eee.upd.edu.ph/
notes:
- National conference of UP Diliman EEEI, held annually since 2024 in the Philippines
- Only a book of abstracts is published on the conference website; no formal proceedings series is stated
- 2026 call asked for 4 to 6 page full papers in IEEE format, reviewed via Microsoft CMT; the 2025 call asked
  for extended abstracts
- Held in Quezon City 2024 (co-located with ASTICON 2024), Panglao, Bohol 2025 (co-located with ISMAC 2025) and
  UP BGC campus, Taguig 2026
- Strong industry participation (keynotes and sponsors from Philippine electronics and energy companies)
- Registration PhP 10,000 per accepted abstract (2025)
- Not listed in ICORE2026 or the CCF list
