notes:
- Annual French-speaking human-computer interaction conference supported by AFIHM; 36th edition in Toulouse in 2025,
  37th in Lille (Villeneuve d'Ascq) in 2026
- Official language is French, but submissions in English are allowed
- Scientific papers get double-blind review by three reviewers with a rebuttal phase; no fixed page limit, a typical
  paper is 13 to 16 single-column pages
- Papers are published in the ACM International Conference Proceedings Series (ACM DL); authors outside ACM Open
  institutions may have to pay an article processing charge
- IHM explicitly allows republishing an English translation of a paper published in French, following the ACM SIGCHI
  policy
- Other tracks include work in progress (TeC), demos, industrial papers, Alt-IHM, workshops and a doctoral consortium
- "Registration fee 300 to 500 EUR for academics and 400 to 700 EUR for industry (2026, by category and date)"
- Not listed in ICORE2026 and not on the CCF list
