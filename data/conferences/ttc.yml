notes:
- Contest comparing graph, model and program transformation tools on shared case studies; participants submit a solution paper plus the solution itself
- Long-running series (AGTiVE 2007 session, GraBaTs 2008 and 2009, TTC 2010, 2011 and 2013 onward); part of STAF, held in Rennes in 2026
- Open peer review round among solution authors right after the submission deadline
- Revised solution papers and case descriptions appear in formal post-proceedings (CEUR-WS Vol-4122 for 2025); per-case journal articles may follow in SoSyM, JOT or STTT
- Solutions to older cases are also accepted
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
