notes:
- Conference on memory-centric computing (processing in memory and near memory) across the whole stack, from devices and circuits to architecture, systems software and applications
- Run by the EclectX group, with IEEE, IEEE CAS and IEEE CEDA among the listed technical sponsors
- First edition in Dresden in 2025 (117 participants from 15 countries); second edition in Lyon in 2026
- Long papers 10 to 12 pages and short papers 4 to 6 pages in IEEE format; authors choose single-blind or double-blind
- Accepted full papers that are presented are submitted to IEEE Xplore; 1-page extended abstracts are presentation only and not in the proceedings
- Also has tutorial and workshop proposals and a journal track
- Not listed in ICORE2026 or the CCF list
