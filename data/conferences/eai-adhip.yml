notes:
- EAI conference on hybrid information processing, weak signal processing, multi-source information fusion and hybrid intelligent computing
- Proceedings published by Springer in the LNICST series; selected papers invited to the MONET journal
- Main track and late track with separate submission deadlines; submission via Confy+
- Held in China since 2017 (Harbin 2017 and 2023, Yiyang 2018, Nanjing 2019, Changsha 2022, Jiaxing 2024); 2020 and 2021 were virtual
- 9th edition in 2025 was held online (nominally Zhengzhou) on 18 to 19 December 2025
- Not listed in ICORE2026
