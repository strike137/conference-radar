notes:
- One-day practitioner conference for Rust developers in London, run by Copia Events
- Held annually since 2023; the 2027 edition is the fifth
- Three tracks, 18 sessions and 2 keynotes; a workshop day the day before is being planned for 2027
- Talks selected by a community programme committee that reviews abstracts before seeing speaker names
- About 400 delegates in 2026
- No papers or proceedings; every talk is recorded and published on YouTube
- Not listed in CORE ICORE2026
