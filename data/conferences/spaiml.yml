notes:
- Workshop on using AI/ML for security and privacy (intrusion and anomaly detection, threat intelligence, access control, GDPR and AI Act compliance)
- First edition in 2025, co-located with ECAI 2025 in Bologna
- Also welcomes negative results papers, following the PerFail workshop
- Papers up to 6 pages including references in the ECAI template, double-blind review, EasyChair submission
- 2025 papers published in CEUR-WS Vol-4154
- Organized by Jens Leicht and Malte Josten (University of Duisburg-Essen)
- Not listed in CORE ICORE2026 and not on the CCF list
