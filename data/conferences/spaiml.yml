notes:
- Workshop on using AI/ML for security and privacy (intrusion detection, threat analysis, anomaly detection, access control, AI Act and GDPR compliance); negative results are explicitly welcome
- Organized by Jens Leicht (now University of Salzburg) and Malte Josten (University of Duisburg-Essen distributed systems group); follows the PerFail workshop on failed research
- 1st edition co-located with ECAI 2025 in Bologna; 2nd edition co-located with ACM TRUST 2027 in Washington DC
- 2025 papers in CEUR-WS Vol-4154; 7 of 10 submissions accepted
- For 2027, accepted papers will be considered for the TRUST 2027 conference proceedings, possibly after an additional light review
- Double-blind review, 6 pages maximum including references; at least one author must register through the host conference
- Not listed in CORE ICORE2026 or the CCF list
