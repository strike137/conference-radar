notes:
- EAI conference on smart grid and the telecommunications that support it; 2026 is the 10th edition
- Proceedings in Springer LNICST; selected papers invited to the Wireless Networks (WINET) journal
- Often online (2021, 2022, the 2023 edition held in March 2024 from Santa Clara, and 2026 from Tempe); 2024 held in Hong Kong
- No 2025 edition; the 2023 edition took place in early 2024
- Two submission cycles plus a posters and demos track
- Not listed in ICORE2026
