notes:
- INSTICC conference on ICT for healthcare and medicine (medical informatics, health data, decision support, assistive technology); one of the conferences of the BIOSTEC joint conference
- Proceedings in SCITEPRESS (ISBN, DOI via CrossRef), submitted for indexing by Scopus, DBLP, EI and Web of Science
- Selected extended papers appear in the BIOSTEC Revised Selected Papers volumes of Springer CCIS
- Two submission stages plus abstracts track; all deadlines AoE
- Held in Europe (Lisbon 2023, Rome 2024, Porto 2025, Marbella 2026, Valletta 2027)
- 2027 BIOSTEC runs at two venues, Valletta (Feb 19 to 21) and Nanjing, China (May 14 to 16); remote talks allowed only for Malta
- Co-located with ICORES, MODELSWARD and ICPRAM in 2027; registration gives free access to them and to the other BIOSTEC conferences
- Not listed in CORE ICORE2026 and not on the CCF 2026 list
