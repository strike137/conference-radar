notes:
- Annual conference since 2003 on modelling, simulation, analysis and design of biological systems, with a strong formal methods side
- Proceedings in Springer Lecture Notes in Bioinformatics (LNCS/LNBI); indexed in Web of Science, Scopus and DBLP
- Regular papers up to 15 pages and tool papers of 4 to 6 pages in LNCS style; abstract pre-submission one week before the paper deadline
- Posters (1 to 4 pages) are presented but not included in the proceedings
- "Acceptance rate: 37% in 2026 (17/46), 54% in 2025 (21/39); mean 42% from 2003 to 2025"
- Not listed in CORE ICORE2026 or the CCF 2026 list
- Held in Europe (Konstanz online 2020, Bordeaux 2021, Bucharest 2022, Luxembourg 2023, Pisa 2024, Lyon 2025, Lisbon 2026 at FLoC, Paris 2027)
- Registration fee about 200 EUR in 2025
