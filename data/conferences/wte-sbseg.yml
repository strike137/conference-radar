notes:
- Satellite workshop of SBSeg, the Brazilian Symposium on Cybersecurity run by the Brazilian Computer Society (SBC); 7th edition in 2025
- Covers electronic voting (auditing, attacks on existing systems, voter authentication, verifiability, ballot secrecy, cryptographic voting protocols, legal aspects)
- Extended abstracts up to 4 pages in Portuguese or English, SBC template; double-blind review through JEMS3
- Accepted papers must be presented by an author to appear in the SBSeg extended proceedings (Anais Estendidos) in SBC OpenLib (SOL)
- "Not held every year: no WTE section in the SBSeg extended proceedings of 2023, 2024 or 2026; 3 papers in 2025"
- Not listed in CORE ICORE2026
