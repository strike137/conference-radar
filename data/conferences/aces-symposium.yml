notes:
- Annual symposium of the Applied Computational Electromagnetics Society, for developers and users of computational EM techniques
- Topics cover numerical methods, antennas, EMC, microwave devices, metamaterials, remote sensing, radar and ML for EM design
- Two-page papers in IEEE conference format; reviewed with an initial review and a revised-paper round before final acceptance
- Accepted papers are archived in IEEE Xplore if presented at the symposium; authors can submit extended versions to the ACES Journal
- Usually held in the USA (Monterey 2023, Orlando 2024 and 2025, Monterey 2027); 2026 edition in Thessaloniki, Greece
- The conference archive also lists editions held in China (2017 to 2022)
- In-person only for 2027; remote presentation not offered
- Includes short courses, software tutorials and vendor exhibits
- Electromagnetics venue outside the usual CS rankings; not listed in ICORE2026
