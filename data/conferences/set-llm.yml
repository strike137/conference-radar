notes:
- Workshop on LLM security and trustworthiness (prompt injection, jailbreaks, privacy leakage, robustness,
  alignment, agent security)
- 1st edition at ICLR 2024 in Vienna; 2nd edition at KDD 2026 in Jeju, Korea (half day)
- Papers up to 4 pages plus references and appendix in the ACM two-column format, double-blind review on OpenReview
- Non-archival; accepted papers are made public on OpenReview and are not in the KDD proceedings
- Concurrent submission to other venues is allowed
- Not listed in ICORE2026 and not on the CCF list
