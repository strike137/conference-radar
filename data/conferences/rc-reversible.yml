notes:
- Annual conference on reversible computation, including reversible circuits, programming languages, process calculi and quantum computation
- Proceedings in Springer LNCS since 2011
- Full papers and tutorials up to 15 pages, work-in-progress and tool papers up to 6 pages (LNCS style, excluding references)
- Abstract registration one week before the paper deadline
- Started as a workshop in 2009; a conference since 2013
- Mostly held in Europe (Urbino 2022, Giessen 2023, Torun 2024, Odense 2025, Torino 2026, Nancy 2027)
- Ranked C in ICORE2026; not on the CCF 2026 list
