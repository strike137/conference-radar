notes:
- EAI conference on nature-inspired computing and communication (neural networks, genetic algorithms, quantum computing, NLP, optimization)
- Founded and chaired by Phan Cong Vinh (Nguyen Tat Thanh University, Ho Chi Minh City); 10th edition in 2024
- Always hosted from Vietnam (Ho Chi Minh City 2014, Rach Gia, Tam Ky, Viet Tri, My Tho, Vinh Long 2022); 2020, 2021 and 2023 were virtual and 2024 (Da Lat) was online
- 2024 edition held together with the 16th EAI VALUETOOLS
- Proceedings in Springer LNICST (2024 volume published 2026)
- Small and regional; not ranked by CORE or CCF
