notes:
- Hot-topics workshop on sustainability and carbon footprint of computer and networked systems, held next to OSDI
- Research and position papers up to 5 pages plus references, double-blind
- Paper registration deadline one week before the submission deadline
- Also accepts 1-page proposals for panels and events (single-blind)
- Papers published in the ACM Digital Library as a special issue of SIGEnergy Energy Informatics Review
- Recent editions in Santa Cruz 2024, Cambridge MA 2025 and Seattle 2026; first edition 2022
- Not listed in ICORE2026 or the CCF 2026 list
