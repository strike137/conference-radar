notes:
- New ACM-sponsored conference on compound AI and agentic systems (architectures, optimization, evaluation, operations, security); first held in 2026
- Steering committee includes Omar Khattab (MIT), Graham Neubig (CMU), Jeff Dean (Google DeepMind) and Monica Lam (Stanford)
- Research papers up to 9 pages in ACM sigconf format, double-blind review with a rebuttal phase; system demos as 4-page short papers
- ACM open access publishing from 2026; authors from institutions outside ACM Open pay an APC (subsidized 250/350 USD in 2026)
- 2026 edition in San Jose sold out with 623 attendees; 60 papers accepted from 170 reviewed submissions (about 35%) plus 46 demos
- Partnered with the AI Engineer World's Fair in 2026 (selected papers invited to present there too)
- Not listed in the CORE ICORE2026 portal or the CCF list
