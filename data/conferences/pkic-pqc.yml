notes:
- Practitioner conference on migrating to post-quantum cryptography, run by the PKI Consortium; not the NIST PQC
  Standardization Conference
- Editions so far - Ottawa (Mar 2023), Amsterdam (Nov 2023), Austin (Jan 2025), Kuala Lumpur (Oct 2025), Amsterdam (Dec 2026)
- Hybrid events, free to attend in person or online and open to non-members
- Session proposals (talks, panels, workshops) reviewed by a committee; product promotion is not allowed
- Recordings and slides are shared after the event; no formal proceedings
- Not listed in ICORE2026 and not on the CCF list
