notes:
- Practitioner conference on post-quantum migration run by the PKI Consortium, a Utah, USA non-profit of CAs, vendors and users
- Location rotates (Ottawa Mar 2023, Amsterdam Nov 2023, Austin Jan 2025, Kuala Lumpur Oct 2025, Amsterdam Dec 2026)
- Three days in recent editions; hands-on workshops plus strategic and technical tracks; hybrid with livestreams
- Free registration for in-person and virtual attendance; slides and recordings are posted after the event
- Open call for session proposals (talks, panels, workshops) with a no product promotion rule; no papers or proceedings
- Speakers come from NIST, BSI, national agencies, standards bodies and industry
