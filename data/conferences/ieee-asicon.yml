notes:
- Chinese integrated circuit design conference sponsored by IEEE, held every two years since 1994, usually in late
  October (odd years since 2001); alternates with ICSICT, which is held in even years
- Always held in China, in a different city each time (Nanjing 2023, Kunming 2025, Hefei 2027)
- The 2027 site still has "2026" in its page titles; the content gives Oct. 26 to 29, 2027 in Hefei
