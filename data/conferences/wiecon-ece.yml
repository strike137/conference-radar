id: wiecon-ece
name: IEEE WIECON-ECE
full_name: IEEE International Women in Engineering (WIE) Conference on Electrical and Computer Engineering
type: conference
tier: minor
areas: [general, communications, networking, ai, security]
region: south-asia
language: english
frequency: annual
organizer: IEEE Bangladesh Section and its WIE Affinity Group, often jointly with an Indian IEEE section
organizer_country: [other]
proceedings: IEEE Xplore
rank:
  core: Unranked
fee: 150 USD IEEE member author / 200 USD non-member author for foreign authors; local 7,500 to 9,000 BDT (2025)
typical:
  deadline_months: [7, 8]
  conference_months: [10, 11, 12]
links:
  website: https://wiecon-ece.org/
notes:
- Run by the IEEE Bangladesh Section and its Women in Engineering (WIE) Affinity Group since 2015, often co-organized
  with an Indian IEEE section (Pune, Uttar Pradesh, Bangalore, Bhubaneswar, Madhya Pradesh, Kerala)
- Every paper must have at least one female author
- Broad EECS scope (antennas, power, VLSI, signal processing, AI, computer networks, security and IoT, wireless
  communication, humanitarian technology)
- Proceedings in IEEE Xplore (2015 to 2023 volumes linked from the official site)
- Max 6 pages in IEEE two-column format including references; double-blind review via Microsoft CMT
- Held in Bangladesh or India in most years (Thailand in 2018, virtual in 2020 and 2021); hybrid with online
  presentation allowed
- Small cash awards and a student travel grant only for papers presented in person
