notes:
- ML theory workshop on learning dynamics of large models in high dimensions (scaling laws, stochastic optimization limits, random matrix theory, loss landscapes)
- Held at ICML every year since 2023; the 4th edition at ICML 2026 in Seoul had the theme scaling laws
- Non-archival; submitting to HiLD and to a conference such as NeurIPS at the same time is usually allowed
- Up to 5 pages plus supplementary material in the HiLD style file, double-blind review on OpenReview; camera-ready up to 6 pages
- Accepted papers presented as posters
- Not listed in ICORE2026 and not on the CCF list
