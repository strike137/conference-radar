notes:
- Main Chinese HCI conference, held as part of the CCF HHME joint conference (Harmonious Human-Machine Environment)
  together with the national pervasive computing conference PCC; since 2025 co-located with HMCC (China
  Conference on Human-Machine Collaborative Computing)
- Accepts anonymous papers in Chinese (Chinese Journal of Computers template) or English (Springer template);
  accepted papers must be prepared in English for the Springer proceedings
- HHME 2025 papers appeared in two Springer CCIS volumes titled Harmonious Human-Machine Environment
- Also has exchange papers (recent CHI, UIST, IMWUT, CSCW, IEEE VR and similar papers, not published) and tech demos
- Selected papers recommended to journals such as CCF Transactions on Pervasive Computing and Interaction
- Held in a different Chinese city each year (Harbin 2023, Taiyuan 2024, Dalian 2025, Changsha 2026)
- Not in the CORE ICORE2026 portal or the CCF 2026 list
