links:
  website: http://www.ist-africa.org/
notes:
- Annual ministerial-level ICT research and innovation conference (IST-Africa Week), supported by the European
  Commission and the African Union Commission; coordinated by the IST-Africa Institute and IIMC (Ireland)
- Broad ICT4D scope with themes such as eHealth, technology-enhanced learning, next generation computing (AI, IoT,
  cloud), cybersecurity, privacy and trust, and eGovernment
- Double-blind peer review; papers 8 to 10 pages (maximum 4,000 words) in the IST-Africa template; each presenter
  presents one paper
- In 2026 the proceedings were published by the IST-Africa Institute and IIMC in the IST-Africa Paper Repository
  with ISSN, ISBN and a DOI per paper; 94 papers in the 2026 proceedings
- In-person editions are hosted by African partner governments (Nairobi, Kenya 2025; South Africa 2023); 2021,
  2022, 2024 and 2026 were virtual and 2027 is announced as virtual
- Practice and policy oriented rather than a competitive research venue; not listed in CORE ICORE2026
