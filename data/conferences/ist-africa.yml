region: africa
language: english
frequency: annual
organizer: IST-Africa Institute and IIMC (International Information Management Corporation, Ireland)
organizer_country: [europe]
proceedings: IST-Africa Conference Proceedings (IST-Africa Institute and IIMC, ISSN 2576-8581, DOI per paper)
archival: true
