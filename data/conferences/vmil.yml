id: vmil
name: VMIL
full_name: ACM SIGPLAN International Workshop on Virtual Machines and Intermediate Languages
type: workshop
tier: minor
areas: [software, systems]
region: worldwide
language: english
frequency: annual
organizer: ACM SIGPLAN (with SIGAda); steering committee chair Stefan Marr (Johannes Kepler University Linz)
organizer_country: [international]
proceedings: ACM DL
archival: true
typical:
  deadline_months: [7, 8]
  conference_months: [10]
links:
  website: https://conf.researchr.org/home/splash-issta-2026/vmil-2026
notes:
- One-day workshop co-located with ACM SPLASH; 2026 was the 18th edition
- The 2026 site calls it the Workshop on Virtual Machines and Language Implementations; the ACM proceedings keep the old name
- Topics are language virtual machines, JIT compilers, garbage collection, intermediate languages and runtimes
- Research and experience papers 6 to 10 pages; work-in-progress and position papers up to 6 pages
- Accepted papers go to the ACM Digital Library unless authors opt out; the later work-in-progress deadline is presentation only
