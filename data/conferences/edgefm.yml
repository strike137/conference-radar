id: edgefm
name: EdgeFM
full_name: International Workshop on Edge and Mobile Foundation Models
type: workshop
tier: minor
areas: [ai, systems]
region: worldwide
language: english
frequency: annual
organizer: EdgeFM organizers (Mengwei Xu, BUPT; Ting Cao, Microsoft Research; Yuanchun Li, Tsinghua; Yunxin Liu, Tsinghua, in 2024), co-located with ACM MobiSys or MobiCom
organizer_country: [china]
proceedings: ACM DL
archival: true
typical:
  deadline_months: [4, 8]
  conference_months: [6, 11]
links:
  website: https://edgefm.github.io/
notes:
- Workshop on running foundation models (LLMs, vision and multimodal models) on edge and mobile devices and on
  apps built on them
- Held with ACM MobiSys 2024 (Tokyo) and ACM MobiCom 2025 (Hong Kong); supported by ACM SIGMOBILE and SIGBED China
- 5-page technical or position papers plus 2-page demo and work-in-progress abstracts, ACM format, single-blind review
- Proceedings in the ACM Digital Library (Proceedings of the 2nd International Workshop on Edge and Mobile
  Foundation Models, 2025)
- Not listed in ICORE2026 or the CCF 2026 list
