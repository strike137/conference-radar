notes:
- Half-day workshop at ACM RecSys on interdisciplinary, human-centered and societal perspectives on recommender systems
- First held at RecSys 2025 in Prague as "Beyond Algorithms, Reclaiming the Interdisciplinary Roots of Recommender Systems"; second edition at RecSys 2026 in Minneapolis
- Proceedings in CEUR-WS after the event (BEYOND 2025 -> CEUR-WS Vol-4063)
- Position, research and case study papers of 6 to 10 pages in the CEURART single-column template, submitted via EasyChair
- Single-anonymized review by three PC members
- At least one author must attend in person; video presentations allowed only for visa or travel problems
- Not listed in the CORE ICORE2026 portal
