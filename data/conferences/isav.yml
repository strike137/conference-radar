notes:
- Workshop on in situ visualization, analysis and AI/ML for large-scale HPC simulations, held with SC since 2015 (2026 is the 12th edition)
- Full papers up to 10 pages including references and short papers of 5 pages plus 1 page of references appear in the proceedings; community talk abstracts (1 page) are not published
- Three reviews per submission; participates in the SC reproducibility initiative
- Listed by SC26 among the workshops with papers in the SC Workshop Proceedings
- Half-day workshop
- Not listed in CORE ICORE2026
