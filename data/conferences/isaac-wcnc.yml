notes:
- Workshop co-located with IEEE WCNC; held as WS-05 at WCNC 2026 in Kuala Lumpur (full day)
- 2026 organizers from Shenzhen Research Institute of Big Data, Southeast University, SUSTech and CAICT
- Topics include joint sensing, AI and communication design, ISAC waveforms, AI for distributed sensing and 5G/6G systems
- Accepted and presented papers go into the WCNC proceedings in IEEE Xplore; no-show papers are removed
- Not the algorithms symposium ISAAC (International Symposium on Algorithms and Computation)
- Not listed in ICORE2026 (the ISAAC entry there is the algorithms symposium)
