notes:
- Estonian Python conference of the PyCon family, run by the Python Estonia community
- Held in Tallinn (Tallinn University 2023, MEKTORY, Raja 15 in 2024, T1 Venue in 2025); editions 2018 to 2020 and 2022 to 2025
- Two-day event aimed at developers, CTOs and tech leads; the sites announce 300+ (2023, 2025) to 500+ (2024) attendees; strong AI and machine learning theme
- The 2026 edition was cancelled; the site announces a return on 2027-09-01 with venue TBD
- No papers or proceedings
- Not listed in the CORE ICORE2026 portal
