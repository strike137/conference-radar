notes:
- Standalone workshop series of the computational social choice community, held every two years since 2006 (2020 skipped)
- No formal proceedings; accepted papers appear in informal workshop notes, so work can also go to a journal or a conference with proceedings
- Accepts papers under review elsewhere or recently published; anonymous submission optional
- Held in Pittsburgh (2014), Toulouse (2016), Troy NY (2018), Haifa (2021), Beersheba (2023), Vienna (2025)
- Not ranked in CORE ICORE2026
