notes:
- Sweden's largest developer conference, focusing on Java, AI/ML, DevOps and emerging technologies
- Held every February in Stockholm, running for more than 20 years
- First day is deep dive and hands-on lab sessions, followed by two regular conference days
- Talks chosen from a call for speakers that closes on 30 September; 45 minute sessions and 10 minute lightning talks
- Jfokus normally does not cover speaker travel expenses
- No papers or proceedings; practitioner talks only
