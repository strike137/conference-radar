notes:
- Half-day workshop co-located with ECML PKDD on active, semi-supervised, transfer and interactive adaptive learning
- Held at ECML PKDD every year since 2017 (online in 2020 and 2021); the 9th edition was in Porto on 19 September 2025
- Full papers of 8 to 16 pages and extended abstracts of 2 to 4 pages, excluding references; one-column CEUR-WS LNCS format, double-blind review
- Accepted papers published on CEUR-WS.org in the ECML PKDD joint post-workshop proceedings
- Not in the ECML PKDD 2026 workshop list
- Not listed in CORE ICORE2026
