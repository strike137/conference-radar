notes:
- Led by Guojun Wang (Guangzhou University); successor of the SpaCCS, UbiSafe and IWCSS series
- Mostly held in China in late December (2021 Guangzhou, 2022 Zhangjiajie, 2024 Changsha); 2023 was in Exeter, UK
  (November)
- Two submission batches; papers up to 14 pages in CCIS format, under 12 pages tagged as short
- Proceedings in Springer CCIS (revised selected papers); acceptance about 44% in 2024
- No 2025 or 2026 edition found; the website and Springer list editions only up to 2024
