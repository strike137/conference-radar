notes:
- Sponsored by KICS KNOM (Korea) and IEICE ICM (Japan); mostly rotates among Japan, Korea and Taiwan (also Sydney
  2001, Beijing 2008), usually in September
- Ranked CORE C and CCF C; the main Asia-Pacific venue for network operations and management
- Papers are 3 to 6 pages in IEEE format; innovation session (slide style) papers are not indexed
- No APNOMS in 2004, 2010, 2018 or 2024; in those years IEEE/IFIP NOMS itself met in Seoul, Osaka, Taipei and Seoul
- 2026 edition required on-site presentation (online only for unavoidable reasons)
