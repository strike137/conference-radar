notes:
- Run by Muthoot Institute of Technology and Science (MITS), Kochi, Kerala, India, and listed among IEEE Kerala Section conferences
- Proceedings in IEEE Xplore
- Usually held at MITS Kochi in July or August; some editions abroad (Sarawak, Malaysia 2019; Bali, Indonesia 2024)
- Editions in 2019 (7th), 2021 (8th), 2023 (9th), 2024 (10th), 2025 (11th); the 2027 edition is the 13th
- Six tracks in 2027 covering smart computing, communication and signal processing, IoT and security, analytics, embedded systems and power systems
- Not listed in the CORE ICORE2026 portal
