notes:
- Annual European workshop on signal and power integrity at chip, package, board and system level (high-speed links,
  power distribution networks, interconnect modeling, EMC, macromodeling)
- Started in 1997 as the IEEE Workshop on Signal Propagation on Interconnects; renamed Signal and Power Integrity in 2012
- Rotates between Italy, Germany, France, Belgium and Portugal (Siegen 2022, Aveiro 2023, Lisbon 2024, Gaeta 2025,
  Turin 2026, Riva del Garda 2027)
- Peer-reviewed 2 to 4 page papers in IEEE conference format, submitted via EasyChair; always held in person
- Accepted and presented papers go to IEEE Xplore; best papers are invited to a special section of IEEE Transactions
  on Components, Packaging and Manufacturing Technology
- Best Student Paper Award and student travel grants
- Not listed in CORE ICORE2026 or the CCF list
