links:
  website: https://scdm.uthm.edu.my/
notes:
- Run by the UTHM Faculty of Computer Science and Information Technology, Malaysia
- Held every two years since 2014 (7th edition in 2026); mostly in Malaysia (2018 Johor, 2020 Langkawi, 2024 Putrajaya; 2016 in Bandung, Indonesia), the 2026 edition was online
- Proceedings "Recent Advances on Soft Computing and Data Mining" in Springer Lecture Notes in Networks and Systems (Advances in Intelligent Systems and Computing up to 2020); the official site says the volume is published before the conference
- Selected papers invited to a Scopus journal
- Topics are soft computing, data mining and data science (fuzzy and rough sets, evolutionary and swarm methods, neural networks, big data)
- Submission deadline is extended in steps (2026 cycle moved from November to the end of December)
- Not listed in ICORE2026 or the CCF 2026 list
