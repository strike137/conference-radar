notes:
- National AI research meeting for researchers across the UK; plenary talks, short talks and posters
- Started in 2023 as a Turing AI Fellowship event; editions in London 2023, Birmingham 2024, London 2025, Nottingham 2026
- Papers published in PMLR (vol. 295 for 2024 with 5 papers, vol. 348 for 2026 with 13 papers); no PMLR volume found for 2025
- Small event with a broad AI scope from ML theory to ethics, vision and robotics; month varies from year to year
- Not listed in CORE ICORE2026
