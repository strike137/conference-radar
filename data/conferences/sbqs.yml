notes:
- Brazilian software quality symposium run by the Brazilian Computer Society (SBC); the 2026 site calls it the
  25th edition (XXV)
- Proceedings (Anais) published open access in the SBC OpenLib (SOL) digital library; many 2025 papers have English
  versions
- Technical papers 8 to 10 pages plus up to 2 pages of references; double-blind review by at least three PC
  members, with a rebuttal phase and two notification rounds
- Tracks for technical papers, experience reports, software quality education and journal first, plus a thesis
  workshop (WTDQS) and thesis and undergraduate research contests
- Held in a different Brazilian city each year (São José dos Campos 2025, Maringá 2026)
- Not ranked in CORE ICORE2026
