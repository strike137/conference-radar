id: red-team-summit
name: Red Team Summit
full_name: Red Team Summit
type: industry
tier: minor
areas: [security]
region: worldwide
language: english
frequency: multiple-per-year
organizer: Red Team Summit steering committee, with a host organization chosen each edition
proceedings: None (no recordings)
archival: false
typical:
  deadline_months: [1, 7]
  conference_months: [3, 9]
links:
  website: https://redteamsummit.com/
notes:
- Conference by and for internal (corporate) red teams, held since 2017
- Invitation only with no ticket sales; an organization must submit a bona fide talk to the CFP to be invited
- Red team and pentest consulting firms are not accepted as submitters
- Held under the Chatham House Rule; no recordings or photos without permission, and talk titles are published without names or organizations
- Host organization rotates, chosen by a steering committee vote from a call for hosts
- US edition each spring (McLean 2026, Cupertino 2027) and an EMEA edition each fall since 2025 (Zurich 2025, Toulouse 2026)
- 20 and 45 minute talks and panels; 240 attendees from 74 organizations at the 2026 US edition
- Not listed in the CORE portal (ICORE2026)
