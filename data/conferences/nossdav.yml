notes:
- Long-running multimedia systems workshop (36th edition in 2026), held annually as a one-day single-track workshop co-located with ACM MMSys
- Rated B in ICORE2026 and B in the CCF list (computer networks)
- Proceedings published in the ACM Digital Library
- Short papers up to 6 pages plus 1 page of references, ACM sigconf double-column template, double-blind review on HotCRP
- Favors high-risk, high-return and exciting-even-if-incomplete ideas on streaming, immersive media, real-time communication and AI for multimedia
- Deadline in January, after the MMSys research track rounds; same deadlines as the other MMSys workshop, demo and open source tracks
- Rotates worldwide with MMSys (Athlone 2022, Vancouver 2023, Bari 2024, Stellenbosch 2025, Hong Kong 2026, Ghent 2027)
