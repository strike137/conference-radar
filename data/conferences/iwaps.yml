id: iwaps
name: IWAPS
full_name: International Workshop on Advances on Security and Privacy Technologies and Solutions
type: workshop
tier: minor
areas: [security, ai]
region: europe
language: english
frequency: annual
organizer: Workshop chairs from University of Piraeus (Greece), InQbit Innovations (Romania) and FORTH (Greece); co-located
  workshop of ARES, run by SBA Research
organizer_country: [europe]
proceedings: Springer LNCS
archival: true
typical:
  deadline_months: [4, 5]
  conference_months: [7, 8]
links:
  website: https://www.ares-conference.eu/iwaps
notes:
- Held as a workshop of ARES (International Conference on Availability, Reliability and Security) in Europe
- ARES 2026 papers including workshop papers are published in Springer LNCS; workshop papers up to 18 pages
  including references; double-blind review
- Topics include adversarial ML, privacy-enhancing technologies, IoT and CPS security, security economics and human
  factors
- Named International Workshop on Advances on Privacy Preserving Technologies and Solutions in 2024 (4th edition)
- 2024 workshop held on July 31 within ARES 2024 (July 30 to August 2)
- Chaired by Christos Xenakis (University of Piraeus) in 2024 and 2026
- Not listed in CORE ICORE2026
