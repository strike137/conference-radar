notes:
- Half-day workshop held with KDD every year since at least 2024 (Barcelona 2024, Toronto 2025, Jeju 2026)
- Topics are search, recommendation, matching, pricing, growth and generative AI in two-sided marketplaces
- Practitioner oriented; most accepted papers come from companies such as Airbnb, Lyft, Expedia, Amazon and DiDi
- Papers up to 8 pages plus 1 page of references in the ACM two-column template, submitted via EasyChair
- Accepted papers are presented as talks or posters and linked as PDFs on the workshop website
- Not listed in the CORE ICORE2026 portal or the CCF list
