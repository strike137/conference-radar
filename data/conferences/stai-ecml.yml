notes:
- Workshop on AI security co-located with ECML PKDD; 2026 edition held in Naples on 7 September (afternoon)
- Topics include adversarial machine learning, poisoning and backdoors, prompt injection, privacy attacks, explainability and robustness
- Regular papers of 12 to 16 pages and short research statements up to 6 pages, including references; Springer LNCS style, submitted via Microsoft CMT
- "CFP: regular papers tentatively published in an LNCS proceedings volume; papers based on recently published work are not included in the proceedings"
- The ECML PKDD 2026 workshop call names Springer CCIS for the joint post-workshop proceedings, not LNCS
- One author of each accepted paper must attend and present
- Not listed in CORE ICORE2026
