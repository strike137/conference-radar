notes:
- Co-sponsored by the IEEE Electron Devices Society and the IEEE Reliability Society; regarded as the main conference on reliability physics of electronic devices
- Covers transistor, dielectric, memory, BEOL and packaging reliability, ESD and latchup, radiation effects, failure analysis, GaN and SiC devices and system reliability
- Abstract-based submission in October; final papers due in late January; presenting authors must register and present in person
- Also has tutorials, workshops, a year-in-review seminar, a poster session and a Late News track in January
- Proceedings in IEEE Xplore (series since 1967), published around August after the symposium
- Held in the USA every spring (Tucson 2026, San Diego 2027, Long Beach 2028)
- Not ranked by CORE or CCF, whose lists cover computing venues
