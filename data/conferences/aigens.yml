notes:
- Workshop on neural compression, image and video enhancement, quality assessment, generative models and rendering for streaming
- 1st edition at CVPR 2024 (as AIS, Vision Graphics and AI for Streaming), 2nd at ICCV 2025, 3rd at CVPR 2026 in Denver
- Papers up to 8 pages excluding references in CVPR style, double-blind review via Microsoft CMT, no dual submission
- Accepted papers go into the CVPR or ICCV Workshops proceedings on CVF Open Access
- Half-day workshop with invited industry speakers (Meta, Netflix, Sony and others on the committee)
- Not listed in ICORE2026 or the CCF list
