notes:
- Part of the IEEE Hyper Intelligence Congress with HPCC, DSS, SmartCity, ICESS and Embodied AI; earlier editions
  shared joint HPCC/DSS/SmartCity/DependSys proceedings
- Mostly held in China (2022 Hainan, 2024 Wuhan, 2026 Luoyang), occasionally abroad (2023 Melbourne, 2025 Exeter)
- Single-blind review; 8-page IEEE CS format with paid extra pages
- Deadlines are usually extended by about three weeks; unranked by both CORE and CCF
- Four tracks cover dependability and security fundamentals, systems, applications and assessment, including LLM
  security
