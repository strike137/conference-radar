notes:
- Workshop on AI for requirements engineering (NLP, ML, LLMs, agents) and RE for AI-based systems
- Held with IEEE RE every year since 2014; AIRE'26 was the 13th edition (Montreal)
- Papers appear in the RE workshops proceedings in the IEEE Digital Library
- Long papers 7-10 pages and short or position papers up to 4 pages, references included, IEEE format
- Single-blind review; replication packages are expected
- "Acceptance: 10 of 18 papers (2025)"
- 2026 organizers from FH SWF (Germany), University of Calgary (Canada) and UPC (Spain)
- Not listed in the CORE portal (ICORE2026)
