notes:
- Workshop on synthesis of computing systems from formal specifications (reactive, functional and neuro-symbolic synthesis, complexity, tools, benchmarks)
- Held since 2012; SYNT 2026 was the 15th edition and SYNT 2027 is the 16th
- Co-located with CAV (Paris 2023, Montreal 2024, Zagreb 2025, Amsterdam 2027) and with FLoC 2026 in Lisbon
- Calls for extended abstracts of up to 3 pages in LNCS format; no published proceedings, so parallel submissions are welcome
- Hosts the reactive synthesis competition (SYNTCOMP); SYNT 2027 also hosts the syntax-guided synthesis competition (SyGuS)
- Selected papers of some past editions went to special issues of Acta Informatica and Formal Methods in System Design
- Not listed in ICORE2026 or the CCF list
