notes:
- Security conference focused on reverse engineering and advanced exploitation, held every June in downtown Montreal,
  Canada (DoubleTree by Hilton Montreal)
- Three days of conference preceded by four days of trainings
- Talks of 30 or 60 minutes, plus workshops, software and hardware villages and lightning talks at the REcon party
- Speakers get an economy round trip and hotel for at least one speaker per talk, plus a 40% training discount
- Running since 2005; a Brussels edition was also held in 2017
