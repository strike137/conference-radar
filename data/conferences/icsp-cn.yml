notes:
- Long-running signal processing conference series that began in Beijing in 1990; held every two years in even years
- Held in China, mostly Beijing (Hangzhou 2014, Chengdu 2016, Beijing 2018/2020/2022, Suzhou 2024)
- Proceedings in IEEE Xplore; the 2016 organizers stated all past editions were indexed by EI and ISTP; broad scope
  covering DSP, image, speech, communications signal processing, pattern recognition and SP for security
- Do not confuse with the annual International Conference on Intelligent Computing and Signal Processing (also ICSP)
  held in Xi'an and Hefei
- Former website icsp.bjtu.edu.cn no longer resolves; no 2026 (18th) edition announcement could be found as of September
  2026
