notes:
- Ukrainian workshop with two sections, intelligent information technologies and systems of information security
- Organized by Khmelnytskyi National University with the public organization Ukrainian Scientific and Educational IT Society; PC chair from City St George's, University of London
- Held every year since 2020; the 2025 and 2026 editions ran online over Zoom from Khmelnytskyi
- Proceedings in CEUR-WS (Vol-4242 for 2026, Vol-3963 for 2025); the organizers say the proceedings are planned to be indexed in Scopus and DBLP
- "Acceptance: 16 of 45 submissions (2026), 29 of 74 (2025)"
- Participation and publication are free of charge
- Regular papers only, 10 to 20 pages in English in the CEUR-ART one-column template; at most two papers per author
- The 2026 edition was moved from April 3 to July 3, 2026
- Not listed in CORE ICORE2026 or the CCF list
