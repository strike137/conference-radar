notes:
- Ukrainian workshop run by the Computer Engineering & Information Systems Department of Khmelnytskyi National University with the support of the public organization USE IT; held yearly since 2020
- Proceedings in CEUR-WS, planned to be indexed in Scopus and DBLP per the site
- Two sections, intelligent information technologies and systems of information security
- Participation and publication are free of charge
- Regular papers only, 10 to 20 pages in English in the CEUR-ART one-column template; at most two papers per author; reviewed by two reviewers, a third if needed
- The 2026 edition moved from April 3 to July 3, 2026 and ran with remote sessions
- "IntelITSIS 2026: 16 of 45 submitted papers accepted (CEUR-WS Vol-4242)"
- Not listed in CORE ICORE2026 and not on the CCF list
