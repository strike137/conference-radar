id: apcap
name: IEEE APCAP
full_name: IEEE Asia-Pacific Conference on Antennas and Propagation
type: conference
tier: minor
areas: [communications]
region: china
language: english
frequency: annual
organizer: UESTC, IEEE AP-S Chengdu Joint Chapter and Sichuan Institute of Electronics (2026); technically sponsored by IEEE and IEEE AP-S
organizer_country: [china]
proceedings: IEEE Xplore
indexing: [EI]
fee: 550 USD IEEE member, 350 USD IEEE student member (2026, early bird); 90 USD per page beyond two pages
typical:
  deadline_months: [3, 4]
  conference_months: [8]
links:
  website: https://www.apcap2026.org/
notes:
- Started in Singapore in 2012; held in Chiangmai, Harbin, Bali, Kaohsiung, Xi'an, Auckland and Incheon, then mostly in China since 2020 (Xiamen 2020 online and 2022, Guangzhou 2023, Nanjing 2024, Christchurch 2025, Chengdu 2026)
- Covers antennas and arrays, wave propagation, measurements, computational electromagnetics, microwave to THz circuits and EMC
- Two-page IEEE double-column papers (up to five with overlength charges) via EasyChair; presented papers go to IEEE Xplore
- One-page abstracts can be presented without publication and are not in IEEE Xplore
- One regular registration covers up to two papers; has a Student Paper Contest
- Not ranked by CORE or CCF; antennas and propagation venue outside the usual CS rankings
