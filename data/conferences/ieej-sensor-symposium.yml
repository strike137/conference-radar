notes:
  - Annual divisional conference of the IEEJ Sensors and Micromachines Society (E部門); the largest domestic sensor and MEMS symposium in Japan
  - Held jointly with the JSME Micro-Nano Engineering Symposium, the JSAP Integrated MEMS Symposium and a CHEMINAS meeting; one registration covers all of them
  - Two-page abstracts are reviewed by the paper committee; accepted talks then submit a 2 to 6 page paper in Japanese or English
  - Late-breaking poster abstracts are accepted about two months before the event
  - Proceedings are a download for participants (no printed book); papers with copyright transferred to IEEJ go into the IEEJ Electronic Library
  - Papers can be submitted in parallel to IEEJ Transactions on Sensors and Micromachines (reviewed separately)
  - Held every autumn in a different Japanese city (Kumamoto 2023, Sendai 2024, Utsunomiya 2025, Matsue 2026)
