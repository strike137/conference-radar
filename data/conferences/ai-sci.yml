notes:
- Half-day workshop at ECML PKDD 2025 in Porto on AI for critical infrastructures (energy, railways, airspace, water, ICT)
- Sponsored by the Horizon Europe AI4REALNET project, coordinated by INESC TEC
- Long papers up to 12 pages and short papers up to 8 pages in Springer LNCS format, submitted via CMT; previously published work also welcome
- Authors may opt in to the joint ECML PKDD post-workshop proceedings in Springer CCIS; in-person presentation with full registration required
- Only one edition so far (2025); not in the ECML PKDD 2026 workshop list
- Not listed in CORE ICORE2026
