notes:
- Flagship symposium of URSI Commission B on electromagnetic theory, antennas, scattering, inverse problems and
  computational electromagnetics; 25th edition in 2025
- Held about every two to three years (San Diego 2019, Vancouver 2023, Bologna 2025, Thessaloniki 2028)
- Two paper types; 2 to 4 page summary papers go to IEEE Xplore unless the author opts out, 1-page extended
  abstracts appear only in the URSI proceedings
- Young Scientist Awards and a Commission B school for young scientists; extended papers can go to URSI Radio
  Science Letters at reduced page charges
- Not listed in CORE ICORE2026
