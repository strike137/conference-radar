- No edition listed between the 16th (online, December 2021) and the 17th (Shenzhen, March 2026)
- 17th edition (2026) held at Shenzhen Institute of Information Technology as a hybrid one-day conference
- Proceedings in Springer LNICST; main track plus a later late track
- Accepted authors may submit an extended version to a fast track of an EAI journal
- Not listed in the CORE ICORE2026 portal
