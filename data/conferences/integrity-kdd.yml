notes:
- Half-day workshop on integrity in social networks and media (misinformation, coordinated manipulation, content
  moderation, AI-generated media, safety of AI agents)
- 6th edition in 2026, co-located with KDD 2026 in Jeju, Korea
- Editions 1 to 5 (2020 to 2024) were co-located with WSDM; the 2024 edition was held in Merida, Mexico; no 2025 edition
- Organized mostly by trust and safety teams at Meta, Google, Microsoft and LinkedIn; invited talks from industry
- Short papers 2 to 4 pages and full papers 5 to 8 pages in the ACM template, peer reviewed, submitted via OpenReview
- Accepted papers are presented in person and posted on the workshop website
- Not listed in the CORE ICORE2026 portal or the CCF list
