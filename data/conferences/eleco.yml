notes:
- Turkey's long-running general electrical and electronics engineering conference, held in Bursa every year since 1999
- Alternates by year -> international edition in English in odd years, national edition in Turkish in even years
- Jointly organized by EMO Bursa Branch, Bursa Uludag University and Istanbul Technical University; technically
  co-sponsored by IEEE Turkiye Section and chapters
- Papers of both international and national editions are published in IEEE Xplore (ELECO 2024 and 2025 included)
- Full papers peer reviewed; national edition papers up to 5 pages in Turkish with an English abstract
- Selected extended papers invited to journals such as the Turkish Journal of Electrical Engineering and Computer
  Sciences and Electrica
- Not listed in the CORE ICORE2026 portal
