notes:
- Workshop on teaching formal methods, affiliated with the FM symposium and supported by the FME Teaching Committee
- Proceedings in the Springer LNCS 'Formal Methods Teaching' series; papers up to 15 pages, single-blind, at least three reviews
- Held with FM, so it follows the FM schedule (2019 Porto, 2021 Beijing, 2024 Milan, 2026 Tokyo)
- Successor of the Teaching Formal Methods conferences TFM 2004 and TFM 2009
- One-day event of keynotes and paper talks; registration through FM
- Not listed in ICORE2026
