notes:
- Free, independent offensive security conference in Lima, Peru, run by volunteers since 2013 (14th edition in 2026)
- One day, single track of offensive security talks (50 min plus 10 min questions), plus a CTF in 2026
- Talks chosen through a CFP by an independent technical committee; commercial or defensive talks are not accepted
- Held at UPC in Lima since 2022 (UPC Monterrico, Santiago de Surco in 2025 and 2026); 2020 and 2021 editions were virtual
- Talks are not recorded or streamed; no proceedings
- Not listed in the CORE portal (ICORE2026)
