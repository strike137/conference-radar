notes:
- German national Python conference held since 2011, run jointly with PyData as PyCon DE & PyData; over 2,000 attendees
- Organized by the Python Software Verband e.V., a German non-profit, with Pioneers Hub gGmbH as institutional partner
- Talks chosen from a call for proposals on Pretalx; each proposal gets about three reviews, plus community voting by past participants
- Three conference days with 100+ talks, plus masterclasses, sprints and hackathons
- 'Past venues: Berlin 2023 and 2024, Darmstadt 2025 and 2026, Heidelberg 2027'
- No papers or proceedings; talk recordings are published online
