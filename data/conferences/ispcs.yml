notes:
- Main research venue for IEEE 1588 Precision Time Protocol (PTP), White Rabbit, NTP and time-based distributed
  systems; mixes industry, academia and national metrology labs
- Six-page IEEE-format full papers, peer reviewed, published in IEEE Xplore and indexed by EI/Compendex
- One-page abstract-only track for presentation without publication
- Co-located IEEE 1588 Plugfest for interoperability testing of PTP equipment
- 'Recent venues: London 2023, Tokyo 2024, Ottawa 2025, Brescia 2026'
- Not listed in ICORE2026 and not on the CCF list
