id: aacl
name: AACL-IJCNLP
full_name: Conference of the Asia-Pacific Chapter of the ACL and International Joint Conference on Natural Language
  Processing
type: conference
tier: major
areas: [nlp]
region: asia-pacific
language: english
frequency: irregular
organizer: AACL (Asia-Pacific Chapter of the ACL) and AFNLP (Asian Federation of NLP)
organizer_country: [international]
proceedings: ACL Anthology
indexing: [DBLP]
rank:
  core: B
  core_source: ICORE2026, as IJCNLP
acceptance_rate: 19% main, 12% Findings (2025, per proceedings preface; 232 main papers)
fee: 650 USD academic / 400 USD student, early, in person with paper registration (2026), plus ACL membership (100
  USD / 50 USD student)
typical:
  deadline_months: [5, 7]
  conference_months: [11, 12]
links:
  website: https://aaclnet.org/
notes:
- The ACL chapter conference for Asia-Pacific, held jointly with AFNLP's IJCNLP; the Asian counterpart of NAACL/EACL
- Led by AFNLP in odd years and AACL in even years; not held separately when ACL itself meets in the region (none
  in 2024)
- ARR only; the 2026 edition shares the May ARR cycle with EMNLP, with two commitment rounds
- 2026 edition (5th AACL, 15th IJCNLP) is in Hengqin, Zhuhai, China, next to Macau; virtual registration available
- CORE rank B is listed under IJCNLP; not in the CCF list; 2025 (Mumbai) had 1,456 submissions, 2.6 times the previous
  AACL record
