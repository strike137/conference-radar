notes:
- Blockchain conference with a broad scope that also covers AI, IoT, edge computing, cybersecurity and quantum computing, first held in 2019 (Granada, Spain)
- Accepted papers of the main tracks and co-located workshops are submitted to IEEE Xplore, DBLP and Scopus
- "Paper lengths: long 7 to 8 pages, short 5 to 6, SoK 10 to 15, poster 1 to 2 (IEEE A4 template, overlength charges)"
- Several submission rounds (main track, late track, workshop papers); main track notification one month after the deadline
- At least one author must register and present (onsite or online), otherwise the paper is removed from the proceedings
- Location rotates (2021 Tartu, 2022 San Antonio, 2023 Kuwait City, 2024 Dubai, 2025 Dubrovnik, 2026 Barcelona), hybrid format
- "Fee: author registration from 800 USD (2026, IEEE member, early)"
- Not listed in ICORE2026; not on the CCF 2026 list
