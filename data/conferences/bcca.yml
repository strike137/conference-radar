id: bcca
name: BCCA
full_name: International Conference on Blockchain Computing and Applications
type: conference
tier: minor
areas: [security, systems, networking]
region: worldwide
language: english
frequency: annual
organizer: BCCA steering and organizing committees, technically co-sponsored by local IEEE units (IEEE Spain 2026, IEEE Croatia Section 2025)
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [5]
  conference_months: [10, 11]
links:
  website: https://www.bcca-conference.org/
notes:
- Blockchain and decentralized systems, with broad tracks on AI, IoT, edge and cloud computing, cybersecurity and 6G; running yearly since 2019, 8th edition in 2026
- 'Recent hosts: Tartu (2021), San Antonio (2022), Kuwait City (2023), Dubai (2024), Dubrovnik (2025), Barcelona (2026)'
- Proceedings in IEEE Xplore; one author must register and present (onsite or online) for the paper to be included
- Hybrid event; several deadline rounds (main track, late track, workshops) with extensions common
- Submissions and registration run through the Sparcly platform
- Not ranked in ICORE2026 and not on the CCF 2026 list
