region: middle-east
language: english
frequency: annual
organizer: Jordan University of Science and Technology (JUST), Irbid; IEEE Jordan Section technical co-sponsor (2022 to 2025)
organizer_country: [other]
proceedings: ACM ICPS (ACM DL) for 2026; IEEE Xplore for 2024 and 2025
archival: true
fee: 500 USD full registration before Apr 10, 550 USD after; 350 USD local students and scholars (2026); ACM open access
