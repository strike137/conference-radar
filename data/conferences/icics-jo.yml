links:
  website: https://www.just.edu.jo/icics/
notes:
- Run by Jordan University of Science and Technology (JUST) and held on its campus in Irbid, Jordan (2021 edition was
  virtual under a Valencia, Spain banner); 17th edition in 2026
- Not the same venue as ICICS, the International Conference on Information and Communications Security (CORE C, CCF C)
- Broad computer and information science scope with tracks on AI, NLP, health informatics, security and forensics,
  software engineering, networking and IoT, and e-learning
- Proceedings in IEEE Xplore in 2024 and 2025; the 2026 edition moved to ACM ICPS open-access proceedings (sigconf,
  up to 10 pages)
- One-pass review via EasyChair; at least one author must register and present (in person or virtually)
- Conference month moves from year to year (Nov 2023, Aug 2024, Jul 2025, May 2026); deadlines are usually extended once
  and marked firm
- Not listed in CORE ICORE2026 or the CCF list under this name
