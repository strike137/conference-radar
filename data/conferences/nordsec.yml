notes:
- Annual since 1996, rotating among Nordic and Baltic countries; two days in November
- Proceedings in Springer LNCS; double-blind review; up to 16 pages LNCS excluding references and appendices (20
  pages overall)
- Regional meeting place for Nordic security faculty, students and industry; moderate fees with a student rate
- Deadline in mid or late August, extended by 10 days in both 2025 and 2026; notification about a month later
- Not listed in ICORE2026 (was ranked C in the old ERA2010 list); 2026 emphasis is security and privacy of agentic
  AI
