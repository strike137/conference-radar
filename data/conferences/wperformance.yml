notes:
- Brazilian workshop on performance evaluation of computer and communication systems, held every year since 2002
  as a satellite event of CSBC, the annual congress of the Brazilian Computer Society (SBC); 25th edition in 2026
- One-day workshop (about 26 papers in six sessions in 2026)
- Full papers up to 12 pages, short papers up to 6 pages, SBC template, Portuguese or English, submitted via JEMS
- Proceedings (Anais do WPerformance, ISSN 2595-6167) published open access in SBC OpenLib (SOL)
- Authors of accepted papers invited to submit extended versions to a special issue of the Journal of Internet
  Services and Applications (JISA)
- Held with CSBC in a different Brazilian city each year (Gramado 2026)
- Not ranked in CORE ICORE2026
