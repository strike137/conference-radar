notes:
- Leading venue for file systems and storage research, run by USENIX
- Proceedings and slides are free and open to the public from the first day of the conference
- Two submission cycles (spring in March, fall in September) with an author response period; early rejections
  are notified before the response period
- Double-blind review; long papers up to 12 pages and short papers up to 6 pages, plus references; deployed-systems
  papers welcome
- Held in Santa Clara, CA in 2026 and in Renton, WA in 2027
- CORE A (ICORE2026), CCF A
