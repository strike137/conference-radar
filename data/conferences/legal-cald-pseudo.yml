id: legal-cald-pseudo
name: LEGAL / CALD-pseudo
full_name: Joint Workshop on Legal and Ethical Issues in Human Language Technologies and Computational Approaches to Language Data Pseudonymization, Anonymization, De-identification, and Data Privacy
type: workshop
tier: minor
areas: [nlp, security]
region: europe
language: english
frequency: biennial
organizer: LEGAL organizers (OVGU Magdeburg, ELRA/ELDA, IDS Mannheim) and CALD-pseudo organizers (University of Gothenburg and others); co-located with LREC
organizer_country: [europe]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [2, 3]
  conference_months: [5]
links:
  website: https://legal2026.mobileds.de/
notes:
- Workshop on legal and ethical issues of language data (GDPR, Data Act, AI Act, copyright) and on anonymization and pseudonymization of text and speech data
- LEGAL runs with LREC every two years (LREC 2022 Marseille, LREC-COLING 2024 Turin, LREC 2026 Palma); in 2026 it was held jointly with CALD-pseudo
- Long papers up to 8 pages, short papers up to 4 pages; extended abstracts allowed for legal, ethical or policy papers
- Papers published in the LREC workshop proceedings and the ACL Anthology
- Not listed in CORE ICORE2026
