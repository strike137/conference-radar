notes:
- First edition in 2026; grew out of the IEEE SR-CIST workshop (Security and Resiliency of Critical
  Infrastructure and Space Technologies) held with IEEE TPS in 2024 and 2025
- Focus on security and resilience of space systems and space-dependent critical infrastructure
- Co-located with IEEE TPS, IEEE CIC and IEEE CogMI in the USA; proceedings in IEEE Xplore
- Two submission rounds (June and August), AoE; rejected Round 1 papers can be revised and resubmitted to Round 2
- Full papers 8 to 10 pages and 2-page posters, anonymous review, IEEE two-column format
- Not found in ICORE2026 or the CCF list
