notes:
- Annual soft computing conference series running since 2016, held in December at a different Indian institution each year
- Recent hosts include IIIT Kota (2021, virtual), NIT Jalandhar (2025) and SVNIT Surat (2026)
- Post-conference proceedings in Springer Lecture Notes in Networks and Systems (LNNS), indexed by Scopus; the 2025 proceedings appeared in three volumes
- 2026 LNNS proceedings are listed as to be approved by the publisher
- Hybrid format; review via Microsoft CMT
- In collaboration with the Research Center for Engineering and Management, Politehnica University of Timisoara
- Not listed in ICORE2026 or the CCF 2026 list
