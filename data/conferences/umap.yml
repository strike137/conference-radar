notes:
- Run by User Modeling Inc. (UM Inc.) and sponsored by ACM SIGCHI and ACM SIGWEB; proceedings in the ACM DL
- Main venue for user modeling, adaptive systems, personalization and recommender systems
- CORE A (ICORE2026)
- Long papers up to 8 pages and short papers up to 4 pages plus references (ACM two-column format), double-blind
  review with a rebuttal phase
- Abstract deadline one week before the paper deadline (late January in 2026)
- Mostly held in Europe (Cagliari 2024, Gothenburg 2026); New York in 2025; in-person conference
