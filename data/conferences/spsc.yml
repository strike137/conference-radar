notes:
- Organized by the ISCA special interest group on Security and Privacy in Speech Communication
- One-day satellite event of Interspeech, held jointly with the VoicePrivacy Challenge (VPC) workshop
- Follows Interspeech around the world (Incheon 2022, Dublin 2023, Kos 2024, Delft 2025, Sydney 2026)
- Proceedings in the ISCA Archive with a DOI per edition (e.g. 10.21437/SPSC.2025)
- Small venue; 13 papers (8 oral, 5 poster) in the 2025 proceedings
- Not listed in the CORE ICORE2026 portal
