  website: https://fase4games.quest/
notes:
  - Workshop on software engineering methods for game development (entertainment games, serious games, gamified applications)
  - Co-located with ACM FSE (Porto de Galinhas 2024, Trondheim 2025, Montreal 2026)
  - Editions in 2021, 2022, 2024, 2025 and 2026; no edition in 2023 because of schedule conflicts
  - "2026 formats: research papers up to 8 pages and APC-free extended abstracts up to 5 pages, both including references, via HotCRP"
  - At least three PC reviews per submission; at least one author must attend in person
  - Accepted papers are ACM publications under the FSE 2026 workshop proceedings process (ACM Open Access, subsidized APC of 250 or 350 USD in 2026)
  - Small workshop (four papers in 2024, three in 2025, four in 2026)
  - 2024 and 2025 CFPs state accepted papers appear in the ACM Digital Library with the FSE Companion booktitle
  - Organized by Cristiano Politowski, Jessie Galasso, Fabio Petrillo and Yann-Gael Gueheneuc
  - Distinct from SE4Games, the Brazilian workshop at CBSoft
  - Not listed in CORE ICORE2026 or the CCF 2026 list
