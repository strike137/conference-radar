notes:
- Run by the IEEE CSS Malaysia Section Chapter every year since 2011; held in Penang (2023 to 2026), in Batu Ferringhi in 2025 and 2026
- Proceedings published by IEEE (2023 to 2025 volumes registered with IEEE DOIs)
- Broad scope covering control systems, robotics, AI and optimization, signal and image processing, IoT, big data and biomedical engineering
- Hybrid in 2026; local participants must attend in person, overseas participants may present virtually
- Not listed in ICORE2026
