notes:
- Only conference devoted to the design, measurement and analysis of test structures for semiconductor processes, devices and circuits
- Technically sponsored by the IEEE Electron Devices Society; run by a permanent steering committee with Japanese, European and North American members
- Presented papers go to IEEE Xplore; the archive says all 1638 papers published at ICMTS are there
- Submissions are 4-page abstracts (1 page of text plus up to 2 pages of figures) selected by the technical program committee
- Single-track program with a tutorial short course and an equipment exhibition; best paper award chosen by the TPC
- Usually held in late March or early April, rotating among Japan, Europe and the USA (Tokyo 2023, Edinburgh 2024, San Antonio 2025, Matsue 2026, Udine 2027)
- 2027 is the 39th edition
- 2027 abstract deadline was extended to Nov 20, 2026 (homepage timeline and CFP)
- Not ranked by CORE (not listed in ICORE2026) or CCF, whose lists cover computing venues
