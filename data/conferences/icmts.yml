id: icmts
name: IEEE ICMTS
full_name: IEEE International Conference on Microelectronic Test Structures
type: conference
tier: minor
areas: [communications, general]
region: worldwide
language: english
frequency: annual
organizer: ICMTS Steering Committee, technically sponsored by IEEE Electron Devices Society (EDS)
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [11, 12]
  conference_months: [3, 4]
links:
  website: https://icmts.net/
notes:
- Only conference focused on test structures for semiconductor process characterization, device modeling,
  measurement and reliability; co-sponsored by IEEE EDS
- Single-track program; location rotates between Japan, Europe and the USA (2023 Tokyo, 2024 Edinburgh, 2025 San
  Antonio, 2026 Matsue, 2027 Udine)
- Selection based on a four-page abstract (one page of text plus figures); accepted authors then write a manuscript
  of up to six pages for IEEE Xplore
- Papers must be presented at the conference to count as published
- Steering committee with representatives from Japan, Europe and North America
- Tutorial short course before the main conference and an equipment exhibition
- "Registration 2026 (Matsue): 48,000 JPY early for IEEE members, 56,000 JPY for non-members, 28,000 JPY for students"
- Not listed in ICORE2026 or the CCF list
