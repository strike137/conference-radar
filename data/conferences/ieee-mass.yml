notes:
- Sponsored by the IEEE Computer Society and its TCDP; running since 2004, 2026 is the 23rd edition
- Formerly the IEEE International Conference on Mobile Ad-hoc and Sensor Systems; CORE and CCF still list it under
  that name (ICORE2026 B, CCF C)
- Proceedings in IEEE Xplore; papers not presented in person by an author are removed from Xplore
- Single-blind review; 9-page regular papers, some accepted as 5-page short papers or 2-page posters
- Mostly held in North America, with editions in Asia (2020 Delhi, 2024 Seoul, 2026 Hong Kong)
- Around ten co-located workshops each year (6-page papers, later deadline), plus posters and demos
- Main submission deadline was extended by three weeks in 2026
- Student authors must pay the full author registration rate
