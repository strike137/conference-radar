notes:
- Workshop on using static types for program development (dependent types, generic programming, type-directed tools)
- Usually co-located with ICFP; 2026 edition was held at FPW 2026 in Paris (Functional Programming Workshops, a European gathering in the ICFP week)
- Full papers up to 12 pages go into ACM proceedings in the ACM Digital Library; 3-page extended abstracts are not in the formal proceedings
- Two-column ACM SIGPLAN acmart format; remote presentation possible
- Steering committee of past PC co-chairs appoints new co-chairs each year; 2026 was the 11th edition
- Held in Seattle 2023, Milan 2024, Singapore 2025, Paris 2026; 2027 planned for Nijmegen (TBC)
- Not listed in the CORE portal (ICORE2026)
