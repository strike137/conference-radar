notes:
- New community-run Security BSides conference in Melbourne, Florida, USA; 2027 is its first year
- One-day Saturday event at Eastern Florida State College (EFSC), CITE Building 17
- CFP via Google Form for about 20 and 45 minute talks, workshops and lightning talks, reviewed by a program committee
- Topics include offensive and defensive security, privacy, cloud, DFIR, hardware, and space and aerospace systems
- Speaking slots are not sold; product demo talks are declined; first-time speakers welcome
- Talks only, no proceedings; not listed in the CORE ICORE2026 search
