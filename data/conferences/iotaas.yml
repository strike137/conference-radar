notes:
- Small EAI conference on IoT services, edge intelligence, 5G for IoT, M2M and V2X; 11th edition in 2025
- Proceedings in Springer LNICST; selected papers invited to Mobile Networks and Applications (MONET)
- Held in China since 2023 (Nanjing 2023, Wuhan 2024, Yibin 2025, hybrid); 2020 to 2022 were online (2021 hosted
  from Sydney); earlier editions in Xi'an (2018, 2019), Taichung (2017) and Rome (2014, 2015)
- EAI sites list a main track and a late track with overlapping deadlines
- Not ranked by CORE or CCF
