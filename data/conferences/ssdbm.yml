notes:
- Formerly the International Conference on Scientific and Statistical Database Management; renamed Scalable Scientific
  Data Management with an expanded scope from 2025
- Long-running series since 1981; site maintained by the Scientific Data Management Group at LBNL
- 2025 proceedings in the ACM Digital Library; papers use the ACM sigconf template
- Regular papers up to 12 pages and short or demo papers up to 6 pages, both in the proceedings; posters only on the
  website
- Mostly held in the USA with some editions in Europe; Singapore in 2027
- CORE B (ICORE2026), CCF C
