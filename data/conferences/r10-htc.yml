notes:
- Humanitarian technology conference of IEEE Region 10 (Asia-Pacific), held since 2013; the 2026 edition is the 14th
- Interdisciplinary scope (disaster management, healthcare for underserved communities, sustainability, education,
  digital inclusion, AI and IoT for social good)
- 4 to 6 page papers in IEEE two-column format via EDAS; accepted and presented papers go to IEEE Xplore
- 'Hosted by a different section each year: 2021 Bangalore, 2022 Hyderabad, 2023 Rajkot, 2024 Kuala Lumpur,
  2025 Ichikawa (Chiba, Japan), 2026 Bangkok'
- Papers not presented in person are removed from IEEE Xplore
- Also hosts tutorials, workshops, special sessions and a pre-university student competition
- Not listed in the CORE portal (ICORE2026)
