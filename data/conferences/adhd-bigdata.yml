notes:
- Workshop on machine learning and analytics for high-dimensional data (dimensionality reduction, clustering, embeddings, foundation models, RAG and vector search); 2026 is the 11th edition
- Run by researchers from the University of Thessaly and Ionian University, Greece
- Held with the IEEE International Conference on Big Data
- Proceedings published by IEEE Computer Society Press in the IEEE BigData workshop proceedings (IEEE Xplore)
- Short papers up to 4 pages, full papers up to 10 pages; three reviewers per paper; submissions need not be anonymized
- 2025 edition (WS20) was an in-person half-day workshop in Macau
- Not ranked by CORE (not in ICORE2026) or CCF
