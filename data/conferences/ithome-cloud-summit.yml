notes:
- Cloud computing practitioner conference organized by iThome (Taiwanese IT media), the organizer of CYBERSEC Taiwan and KubeSummit
- One-day event with keynotes, 9 parallel tracks, hands-on labs and vendor booths
- Held at Taipei Nangang Exhibition Center Hall 2 (Jul 19 2023, Jul 3 2024, Jul 2 2025, Jul 1 2026); 2022 at Taipei International Convention Center
- The organizers say over 50% of 2026 talks came from a public call for papers reviewed by an advisory board
- Free registration aimed at enterprise IT staff; the organizer screens registrations and may decline non-target attendees
- 2026 edition paired with the first AI Enterprise Summit on the next day
- No papers or proceedings; slides are offered for download
- Not listed in the CORE ICORE2026 portal
