notes:
- MICCAI satellite workshop on foundation models and general-purpose AI for medical imaging, held since MICCAI 2023
- Moves with MICCAI (Vancouver 2023, Marrakesh 2024, Daejeon 2025, Strasbourg 2026)
- Full papers published in Springer LNCS (MedAGI 2025 -> LNCS 16112, own volume)
- "Two tracks: full papers (up to 8 pages plus 2 pages of references, double-blind) and 2-page extended abstracts, which may be previously published work"
- Organizers from KAIST, Korea University, Shanghai AI Laboratory, University of Cambridge and others
- Best paper award chosen by an award committee
- Not listed in CORE ICORE2026 or the CCF 2026 list
