id: icacds
name: ICACDS
full_name: International Conference on Advances in Computing and Data Sciences
type: conference
tier: minor
areas: [data, general]
region: worldwide
language: english
frequency: annual
organizer: Consilio Research Lab (Tallinn, Estonia) with a different host institution each year (PIET Panipat in 2026)
organizer_country: [europe]
proceedings: Springer CCIS
archival: true
acceptance_rate: 13% (2025, 24/178); 16% (2024, 28/174)
typical:
  deadline_months: [2, 6, 8]
  conference_months: [4, 5, 8, 12]
links:
  website: https://icacds.com
  dblp: https://dblp.org/db/conf/icacds/index.html
notes:
- Series run with Consilio Research Lab, Estonia; hosted by a different university each year
- Recent hosts are Nashik (2021, virtual), Kurnool (2022), Kolkata (2023), Paris (2024, with Universite Paris-Saclay LISV and ECE Paris), Tallinn (2025) and Panipat (2026)
- Proceedings published as revised selected papers in Springer CCIS every year since 2016
- Two tracks, data science and advanced computing; double-blind review by three reviewers via Microsoft CMT
- Papers up to 14 pages in Springer single-column format
- Not listed in ICORE2026 or the CCF 2026 list
