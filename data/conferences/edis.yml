notes:
- Embedded and distributed systems conference run by Oran 1 University Ahmed Ben Bella, Algeria; the 2024 edition was sponsored by IEEE and IEEE Algeria
- Five editions so far (2017, 2020, 2022, 2024, 2026), every two years since 2020, all held in Algeria (Oran, Bechar in 2024)
- Accepted papers submitted to IEEE Xplore; 16 papers from EDiS 2024 were invited to a JSA journal special issue
- Steering committee includes researchers from France, Spain, Italy and Belgium
- 2026 edition came with workshops on smart farming and smart health
- Not listed in CORE ICORE2026
