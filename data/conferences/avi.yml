notes:
- Biennial human-computer interaction conference on visual and interactive interfaces, first held in 1992
- Always held in Italy, in even years; AVI 2026 (18th edition) on San Servolo island, Venice
- Proceedings in the ACM International Conference Proceedings Series (ACM DL); SIGCHI logo shown on the AVI 2026 site
- Long papers 8 pages and short papers 4 pages plus references, anonymized submission via EasyChair
- Interactive experiences, demo and poster papers (2 pages) have a later deadline
- "Fee (2026, early): 750 EUR ACM member, 800 EUR non-member, 450 EUR student (conference only)"
- Ranked B in ICORE2026 and C in the CCF 2026 list (HCI)
