id: ieee-spmb
name: IEEE SPMB
full_name: IEEE Signal Processing in Medicine and Biology Symposium
type: conference
tier: minor
areas: [ai]
region: online
language: english
frequency: annual
organizer: IEEE Philadelphia Section, Temple University and the Neural Engineering Data Consortium
organizer_country: [usa]
proceedings: IEEE Xplore; selected full papers expanded into a Springer book
archival: true
fee: Free (2026)
typical:
  deadline_months: [7, 8]
  conference_months: [12]
links:
  website: https://www.ieeespmb.org/2026/
notes:
- Single-day symposium in early December on signal processing and AI for medicine and biology (EEG, ECG, MRI, clinical
  AI), held since 2011 and hosted by Temple University since 2014
- Held online via Zoom since 2020; no registration fee, about 100 to 150 attendees
- Two peer-reviewed tracks, 4 to 6 page papers with an oral talk and short abstracts as posters; papers and abstracts
  indexed in IEEE Xplore since 2014
- About 12 oral papers and 8 to 12 posters accepted, acceptance around 50% (CFP)
- Each author may present only one contribution; submission by email
- Not listed in ICORE2026 or the CCF 2026 list
