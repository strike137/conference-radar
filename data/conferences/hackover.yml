notes:
- Volunteer-run hacker event ("Geekend") in Hannover, Germany, organized by Hackover e.V.
- Held at the Buergerschule Nordstadt in Hannover; a CCC-family event like GPN and MRMCD
- Talks, workshops and lightning talks submitted through a pretalx call for participation; no proceedings
- Each edition has a theme (2025 "Cloud Native", 2026 "100 Jahre Hackover")
- Official site and calls mostly in German
