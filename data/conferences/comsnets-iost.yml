notes:
- Workshop on SDN, NFV, network slicing, O-RAN and softwarized IoT for 5G/6G and beyond; 2027 edition adds quantum
  networking and AI/ML-driven network automation topics
- Has moved between host conferences -> IEEE GLOBECOM 2021 and 2022 (2nd and 3rd), ICDCN 2023 (4th), ACM MobiHoc
  2023 (5th), COMSNETS 2027 in Bengaluru (6th); no edition in 2024 to 2026
- 2027 papers appear in the COMSNETS conference proceedings and are submitted to IEEE Xplore
- Double-blind review; up to 6 pages in IEEE format including references; submission via EDAS
