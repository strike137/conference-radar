id: indiscon
name: IEEE INDISCON
full_name: IEEE India Council International Subsections Conference
type: conference
tier: minor
areas: [general, communications, ai]
region: south-asia
language: english
frequency: annual
organizer: 'IEEE India Council, with a host IEEE subsection each year (2026: IEEE Rajasthan Subsection)'
organizer_country: [india]
proceedings: IEEE Xplore
indexing: [IEEE Xplore]
fee: 350 to 400 USD foreign author, 11,000 to 15,000 INR Indian author, plus 18% GST (2026)
typical:
  deadline_months: [4, 6]
  conference_months: [8, 9]
links:
  website: https://www.ieeeindiscon.org/
notes:
- Flagship annual conference of the IEEE India Council run by an IEEE subsection in India; first edition in 2020
- Sister venue of IEEE INDICON (the India Council conference run by the larger sections, held in December)
- Held in India every summer at a different host (2023 Mysore, 2024 Chandigarh, 2025 NIT Rourkela, 2026 MNIT Jaipur)
- Broad EE and CS scope with about ten to twelve tracks (AI, communications and networks, security, VLSI, power,
  robotics)
- Accepted and presented papers are submitted to IEEE Xplore; at least one author must register and present
- Not listed in ICORE2026 or the CCF list
