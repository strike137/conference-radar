notes:
- Not the same venue as IEEE/ACIS ICIS (Computer and Information Science); this ICIS is about intelligence science
- Interdisciplinary scope across brain science, cognitive science, AI and information science (LLMs, brain-like intelligence, cognitive computing, neuromorphic computing)
- Sponsored by the International Academy of Information Studies (China Group); 2026 edition organized by Beijing Jiaotong University and listed as an IFIP TC12 event
- Papers up to 15 pages in Springer LNCS format, submitted via EasyChair; proceedings published by Springer and indexed by EI and Inspec per the CFP
- Held in China; the seventh edition is in 2026
- Not listed in ICORE2026; not on the CCF list
