notes:
- Workshop on the intersection of deep learning and neuromorphic computing (spiking networks, reservoir computing, in-memory and analogue hardware)
- Co-located with ECML PKDD; 3rd edition 2025 in Porto, 4th edition 2026 in Naples
- Authors may opt in to the joint ECML PKDD post-workshop proceedings in Springer CCIS; presentation-only contributions of already published work are also accepted
- Full papers up to 16 pages and position papers or extended abstracts up to 6 pages including references, LNCS format, via CMT
- Organized by Andrea Ceni and Claudio Gallicchio (University of Pisa) and Gianluca Milano (INRiM, Turin) in 2026
- Not listed in CORE ICORE2026 or on the CCF list
