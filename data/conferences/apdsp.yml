id: apdsp
name: APDSP
full_name: Asia-Pacific Digital Signal Processing Conference
type: conference
tier: minor
areas: [communications, general]
region: china
language: english
frequency: annual
organizer: Conference secretariat (icdsp@chairmen.org) with host universities that change by edition (Qinghai Institute of Technology in 2027)
organizer_country: [china]
proceedings: Conference proceedings (IET Digital Library and IEEE Xplore for 2026; ACM DL 2021 to 2025)
archival: true
indexing: [EI Compendex, Scopus]
fee: 500 USD regular author, 460 USD student author (2027, early bird on or before 2027-02-28); 5 pages included, 50 USD per extra page
typical:
  deadline_months: [1]
  conference_months: [2, 3]
links:
  website: https://www.icdsp.org/
notes:
- Formerly the International Conference on Digital Signal Processing (ICDSP); the site now calls it APDSP and still uses the icdsp.org domain
- Annual since 2017; early editions in Kuala Lumpur, Tokyo and Jeju, virtual 2020 to 2022, then Chengdu 2023, Hangzhou 2024, Chengdu 2025 and 2026
- 2027 edition moves to Xining in late May, later than the usual February or March dates
- Run by a commercial conference secretariat (chairmen.org contact address); conference chairs from UESTC and Southwest Jiaotong University
- Proceedings publisher changes by year (ACM DL up to 2025, IET Digital Library and IEEE Xplore for 2026); the 2027 publisher is not named
- Papers 4 to 10 pages; abstract only presentation without publication is also offered
- Not listed in the CORE ICORE2026 portal; no CCF rank set
