id: bwcca
name: BWCCA
full_name: International Conference on Broadband and Wireless Computing, Communication and Applications
type: conference
tier: minor
areas: [communications, networking, security]
region: worldwide
language: english
frequency: annual
organizer: Fukuoka Institute of Technology (steering committee chair Leonard Barolli) with a host university each
  year
organizer_country: [japan]
proceedings: Springer LNDECT (Lecture Notes on Data Engineering and Communications Technologies)
indexing: [Scopus, EI, DBLP]
rank:
  core: Unranked
fee: USD 500 per paper for author registration (2026); student participants USD 400 early
typical:
  deadline_months: [7, 8]
  conference_months: [10, 11]
links:
  website: https://voyager.ce.fit.ac.jp/conf/bwcca/2026/
  dblp: https://dblp.org/db/conf/bwcca/
  wikicfp: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=189205
notes:
- Part of the Barolli (Fukuoka Institute of Technology) conference family; always co-located with 3PGCIC
- Wireless and broadband networking focus; hosts the ATASP workshop (Advanced Techniques and Algorithms for Security
  and Privacy) and a Network Security and Privacy track
- 2025 edition (planned for University of Kalba, Sharjah, UAE) was switched to online only because of the situation
  in the Middle East; 2026 is at UTS, Sydney
- Not ranked by CORE or CCF; regarded as a lower-tier venue; notification came about one week after the hard deadline
  in 2025 and 2026 (about one month in 2024)
