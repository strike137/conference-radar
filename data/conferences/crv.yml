notes:
- Formerly the Conference on Computer and Robot Vision; annual Canadian vision and robotics conference sponsored by CIPPRS
- Held in Canada every year (Montreal 2023, Guelph 2024, Calgary 2025, Burnaby 2026)
- Co-located with the Canadian AI conference as the joint AI/CRV conference
- 4 to 8 page papers excluding references (IEEE-based template); single-blind review
- 2026 proceedings published open access on PubPub (CC BY 4.0, authors keep copyright)
- Not listed in ICORE2026
