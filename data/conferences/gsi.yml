notes:
- Biennial conference on information geometry, geometric statistics, geometric machine learning and quantum
  information geometry, run by the French SEE society
- Proceedings in Springer LNCS (2025 -> LNCS 16033 to 16035, three volumes, 124 full papers from 146 submissions)
- 8-page papers in Springer LNCS format, submitted through Microsoft CMT
- Always held in France (Paris 2013, Palaiseau 2015, Paris 2017, Toulouse 2019, Paris 2021, Saint-Malo 2023 and 2025)
- Not listed in CORE ICORE2026 or the CCF list
