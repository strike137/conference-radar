notes:
- ICLR workshop on AI for finance; the 2026 edition focused on agentic and responsible financial AI systems
- 1st edition at ICLR 2025 ("Opportunities, Innovations, and Responsible AI"), 2nd at ICLR 2026 in Rio de Janeiro
- Non-archival; accepted papers are made public on OpenReview
- Long papers up to 8 pages and short papers up to 4 pages in ICLR format; double-blind review
- In-person presentation required; best paper award with a monetary prize and travel grants
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
