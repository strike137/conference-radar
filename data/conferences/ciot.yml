  conference_months: [10, 11]
links:
  website: https://ciot.dnac.org/
notes:
- Organized by DNAC (the group behind NTMS, ICIN and BRAINS); technically co-sponsored by IEEE and IEEE ComSoc
- Cloud, edge and IoT systems, including Edge AI, TinyML, 6G-enabled IoT, IoT security and digital twins
- Earlier editions in 2016 and 2018 ran as Cloudification of the Internet of Things (2018 was the 3rd edition); every two years until 2020, every year since 2022
- Accepted and presented papers are submitted to IEEE Xplore; full papers up to 8 pages, short papers up to 4 pages, single-blind review via EDAS
- Industrial track with 2-page extended abstracts; posters and demos also accepted
- "Locations: Niteroi 2020 (virtual), Marrakech 2022 (hybrid), Lisbon 2023, Montreal 2024, London 2025, Athens 2026"
- "Fee: 650 EUR author rate for IEEE members, 700 EUR otherwise (2026); one author registration covers up to two papers"
- Not listed in the CORE ICORE2026 rankings
