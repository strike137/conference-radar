notes:
- Workshop on the design, theory and practice of configuration languages (build systems, infrastructure as code, cloud and package configuration)
- Held with SPLASH in 2021 (Chicago) and 2023 (Cascais); third edition with ASE 2026 in Munich
- Two kinds of contributions in 2026, non-archival extended abstracts (up to 2 pages) and archival short (up to 4 pages) or long (up to 8 pages) papers
- 2026 papers published by ACM as the Proceedings of the 3rd International Workshop on Configuration Languages
- Submissions via HotCRP
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
