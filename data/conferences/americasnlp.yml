id: americasnlp
name: AmericasNLP
full_name: Workshop on NLP for Indigenous Languages of the Americas
type: workshop
tier: minor
areas: [nlp, ai]
region: north-america
language: english
frequency: annual
organizer: Workshop organizing committee (2026 organizers from Johannes Gutenberg University Mainz, University of Colorado
  Boulder, Google DeepMind, Universidad de la Republica, Indiana University, Dartmouth College and Northeastern University);
  co-located with ACL-family conferences
organizer_country: [usa, europe]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [3, 4]
  conference_months: [5, 6, 7]
links:
  website: https://americasnlp.org/
notes:
- Workshop on NLP, computational linguistics and speech for Indigenous languages of the Americas and other low-resource
  languages
- Held since 2021 (NAACL 2021 online, ACL 2023 Toronto, NAACL 2024 Mexico City, NAACL 2025 Albuquerque, ACL 2026 San
  Diego); no workshop in 2022, when a speech-to-text competition ran instead
- Proceedings in the ACL Anthology (28 papers in 2026, 17 in 2025, 29 in 2024)
- Long papers up to 8 pages and short papers up to 4 pages; non-archival extended abstracts (2 pages), technical reports
  and already presented work also accepted
- Runs a shared task each year (cultural image captioning in 2026, low-resource machine translation in earlier years)
- Mentoring program for students and newcomers from underrepresented communities (2023)
- Not listed in ICORE2026 and not on the CCF list
