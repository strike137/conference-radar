notes:
- EAI conference series on AI methods applied to communications and networking; 2026 is the 6th edition
- Proceedings in Springer LNICST; selected papers invited to extend for Mobile Networks and Applications (MONET)
- Generic AI papers without a communications or networking contribution are out of scope
- 2026 edition is hybrid
- Rotates within Asia (Harbin 2019, online 2020, Xining online 2021, Hiroshima 2022, New Delhi online 2025, Phu Quoc 2026)
- No edition between 2022 and April 2025; the 5th edition was postponed to April 2025
- Main track, secondary track with special sessions and last track with separate deadlines; full papers 12 to 16 pages
- Not listed in ICORE2026 or the CCF 2026 list
