notes:
- Workshop on graph neural networks and other graph-based machine learning applied to networking problems
  (network modeling, digital twins, traffic analysis, security and anomaly detection)
- Co-located with ACM CoNEXT; 1st edition 2022 in Rome, 2nd 2023 in Paris, 3rd 2024 in Los Angeles
- Run by the Barcelona Neural Networking Center (UPC), which also ran the yearly Graph Neural Networking Challenge
- Papers of up to 6 pages including references in two-column ACM format, single-blind review on HotCRP
- Accepted papers appear in the ACM Digital Library
- No edition with CoNEXT 2025 or CoNEXT 2026 so far
