id: icadl
name: ICADL
full_name: International Conference on Asia-Pacific Digital Libraries
type: conference
tier: minor
areas: [data, ai]
region: asia-pacific
language: english
frequency: annual
organizer: ICADL Steering Committee with a host university each year (Khon Kaen University in 2026)
organizer_country: [international]
proceedings: Springer LNCS
indexing: [Scopus]
rank:
  core: Unranked
acceptance_rate: 45% overall (2025, 46/102, of which 12 full papers); 35% (2024, 38/110)
fee: USD 300 international early (by Oct 31), USD 400 late, USD 150 student (2026, joint registration with AP-iConference)
typical:
  deadline_months: [7, 8]
  conference_months: [12]
links:
  website: https://icadl.net/
notes:
- Started in Hong Kong in 1998 and rotates around Asia-Pacific (2023 Taipei, 2024 Bandar Sunway, 2025 Metro Manila,
  2026 Khon Kaen)
- Presents itself as one of the three main digital library venues alongside JCDL and TPDL
- Springer LNCS proceedings, indexed by Scopus
- Full (12-14 pages), short, practice and demo/poster papers; double-blind review in 2026
- Held jointly with the Asia-Pacific iConference since 2016; 2025 was part of the IFDIK 2025 forum with A-LIEP
- Topics mix computer science (IR, NLP, LLMs, metadata, knowledge graphs) with library and information science
- Listed as CORE A in CORE2018 but not listed in ICORE2026; not in the CCF list
- 2026 allows online presentation for authors who cannot travel
