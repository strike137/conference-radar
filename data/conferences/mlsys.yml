- Up to 10 pages in 2-column format plus references; voluntary artifact evaluation after acceptance
- 'Held in the USA: Miami 2023, Santa Clara 2024 and 2025, Bellevue 2026 and 2027'
- Not listed in CORE ICORE2026 or the CCF 2026 list
