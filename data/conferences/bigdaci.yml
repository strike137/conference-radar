notes:
- Run by IADIS since 2016 as part of the MCCSIS multi-conference; blind peer review
- Proceedings in the IADIS Digital Library with a DOI per paper; best papers invited to the IADIS Journal on Computer Science and Information Systems
- Several calls for papers per edition; the last call closes about eleven weeks before the conference
- Held in Europe in July (Porto 2023, Budapest 2024, Lisbon 2025, Valencia 2026)
- Not listed in the ICORE2026 CORE ranking
