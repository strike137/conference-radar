notes:
- Workshop on LLM-based speech and audio models (large audio-language models) covering speech, non-speech sounds and music
- Inaugural edition at ICASSP 2025 (25 accepted papers); second edition a full-day workshop at EMNLP 2026 in Budapest
- 2026 proceedings in the ACL Anthology (2026.salma-1); authors choose archival or non-archival
- Long papers up to 8 pages and short papers up to 4 pages, ACL format, double-blind via OpenReview; ARR commitment also accepted
- All accepted 2026 papers presented as posters
- Not ranked in ICORE2026 and not on the CCF list
