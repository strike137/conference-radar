notes:
- Standalone international conference despite the "workshop" name; held every two years (8th in 2023 in Beijing, 9th in 2025 in Zhuhai and Beijing)
- Organized by Beijing Institute of Technology; sponsored by the International Association for Computational Intelligence (IACI) and the Beijing Association of Automation
- Supporters include the Japan Society for Fuzzy Theory and Intelligent Informatics (SOFT), IFSA and IEEE CIS
- Full papers (12 to 15 pages) published in Springer CCIS and submitted to EI Compendex and Scopus; IWACIII 2025 proceedings filled four CCIS volumes
- Selected papers can be extended for a special issue of JACIII (Journal of Advanced Computational Intelligence and Intelligent Informatics, Fuji Technology Press)
- Broad computational intelligence scope (neural networks, fuzzy systems, evolutionary computing, LLMs, control and robotics); also runs an AI contest and project roadshows
- Not listed in ICORE2026 or the CCF 2026 list
