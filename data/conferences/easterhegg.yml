notes:
- Easter weekend meeting of the Chaos Computer Club community, first held in Hamburg in 2001
- Focus on workshops rather than talks; breakfast and an event mug are part of the ticket; about 400 to 500 attendees
- Hosting groups apply through a call for candidature; Hamburg traditionally hosts in odd years and the event moves in even years
- Recent editions in Hamburg 2023, Regensburg 2024, Hamburg 2025, Koblenz 2026 and Vienna 2027
- No editions in 2020 to 2022
- Talk schedule on pretalx plus self organized sessions; recordings published on media.ccc.de
- Talks mostly in German, some in English
