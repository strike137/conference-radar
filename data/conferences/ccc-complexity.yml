notes:
- Main conference on computational complexity theory; started in 1986 as Structure in Complexity Theory
- Run by the Computational Complexity Foundation since 2015; formerly the IEEE Conference on Computational Complexity
- Proceedings in the open-access LIPIcs series (CCC 2026 is LIPIcs volume 383)
- Lightweight double-blind review; single column, at least 11 point, first 10 pages must carry the main ideas, no page limit
- Single track over about four days; held in North America or Europe (Philadelphia 2022, Warwick 2023, Ann Arbor 2024, Toronto 2025, Lisbon 2026, Seattle 2027)
- Not to be confused with the Chinese Control Conference (id ccc) or the Chaos Communication Congress
- CORE A (ICORE2026, listed as IEEE Conference on Computational Complexity); CCF B
