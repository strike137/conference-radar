notes:
- Interdisciplinary workshop on norms and values (law, ethics, policy, social context) in the design and evaluation of recommender systems
- Held with ACM RecSys in 2023 (Singapore), 2024 (Bari) and 2025 (Prague); also run as a tutorial at ACM CHIIR 2024 in Sheffield
- 2023 and 2024 proceedings published in CEUR-WS (Vol-3639 and Vol-3898)
- 2025 call took extended abstracts of 2 to 4 pages (CEURART template) and previously published manuscripts from outside the RecSys community with a 1-page cover abstract
- Single-blind review by at least two reviewers
- Half-day workshop; 2025 edition on September 22 in Prague
- Not in the RecSys 2026 workshop list
- Not listed in the ICORE2026 portal or the CCF 2026 list
