full_name: "International Workshop on Agriculture-Vision: Challenges & Opportunities for Computer Vision in Agriculture"
type: workshop
tier: minor
areas: [vision, ai]
region: north-america
language: english
frequency: annual
organizer: Researchers from UIUC, Blue River Technology, Kansas State University, Georgia Tech and others
organizer_country: [usa]
proceedings: IEEE Xplore and CVF Open Access (CVPR Workshops proceedings)
archival: true
typical:
  deadline_months: [3]
  conference_months: [6]
links:
  website: https://www.agriculture-vision.com/
notes:
- Workshop co-located with CVPR every year since 2020; 2026 was the 7th edition
- Single proceedings track of full papers up to 8 pages excluding references in CVPR format, published in the CVPR Workshops proceedings
- Submission and review on OpenReview; top papers get oral slots, the rest posters
- Some editions also run a prize challenge on the Agriculture-Vision dataset and a tutorial
- Not listed in ICORE2026 or the CCF list
