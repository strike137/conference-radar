notes:
- Annual Italian big data and data science conference supported by the CINI National Lab on Data Science; first edition in 2022
- Held in Italy, moving between cities (Naples 2023, Pisa 2024, Turin 2025, Bari 2026)
- Regular papers (up to 12 pages) and discussion papers (up to 8 pages), each reviewed by at least 3 PC members; papers do not need to be anonymized
- Accepted research and industrial papers go to an open access CEUR-WS volume; presentation abstracts of already published work are not in the proceedings
- Also has tutorials/demos, thematic workshops, a hackathon and the co-located BigHPC event
- Not ranked on CORE ICORE2026 or CCF
