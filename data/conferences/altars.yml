notes:
- Workshop on Technology-Assisted Review (TAR) and high-recall retrieval, for systematic reviews, legal eDiscovery and Web-scale content review
- Chaired by Giorgio Maria Di Nunzio (University of Padua), Evangelos Kanoulas (University of Amsterdam) and Prasenjit Majumder (DAIICT and TCG CREST)
- Editions 2022, 2023 and 2024 were held with ECIR (Stavanger, Dublin, Glasgow); the 4th edition in 2026 moved to The Web Conference in Dubai
- 2026 papers can be included in The Web Conference 2026 Companion Proceedings in the ACM Digital Library; ACM open access APC may apply
- Full papers 8 pages, short papers 4 pages, plus up to 4 pages of references and appendices, ACM two-column format
- Not listed in the CORE ICORE2026 portal
