notes:
- Main Brazilian HCI symposium, run by the Brazilian Computer Society (SBC); 25th edition in 2026
- Proceedings (Anais) published in the SBC OpenLib (SOL) digital library with DOIs under 10.5753/ihc
- Calls written in Portuguese, but many accepted papers are in English; research papers reviewed by at least three
  PC members, with a revise and resubmit round
- Tracks for research, innovative ideas and emerging results, experience reports, industry, posters and demos,
  workshops, short courses, an evaluation competition and a thesis workshop (WTD-IHC)
- Held in a different Brazilian city each year (Belo Horizonte 2025, Quixadá 2026 at the Universidade Federal do
  Ceará campus)
- Not ranked in CORE ICORE2026
