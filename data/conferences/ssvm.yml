notes:
- Biennial forum on mathematical computer vision and imaging (variational methods, PDEs, scale space, geometry, inverse problems, machine learning in imaging)
- Held in Europe at a retreat-style venue; 2025 at Dartington Hall near Totnes (UK), 2027 in Veldhoven near Eindhoven (NL)
- Papers up to 12 pages including references in LNCS format; double-blind review
- Proceedings in Springer LNCS; 2027 edition supported by the Journal of Mathematical Imaging and Vision
- Respected in the mathematical imaging community, smaller and more theoretical than mainstream vision venues
- Not listed in ICORE2026
