notes:
- Organized by KICS (Korea); IEEE and IEEE ComSoc listed on the site
- Started in 2022 as the International Conference on Maritime IT Convergence; renamed to Mobile, Military, Maritime IT Convergence (M3 IT) from 2024
- Held in Jeju (2022, 2023), Kuala Lumpur (2024), Cebu (2025) and Taipei (2026, at NTUST)
- Regular papers up to 4 pages and work-in-progress papers of 1 to 2 pages via EDAS, IEEE format
- Only accepted and presented regular papers go to IEEE Xplore; WIP and workshop papers are not in the official proceedings
- Extended versions of selected papers invited to Scopus-indexed journals such as J-KICS
- Hybrid conference with in-person and virtual participation
- Not listed in ICORE2026 or the CCF 2026 list
