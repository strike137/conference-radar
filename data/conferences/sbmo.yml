notes:
- Biennial national symposium of the Brazilian Microwave and Optoelectronics Society (SBMO), held in even years;
  SBMO runs the international IMOC in odd years
- Covers antennas, microwaves, RF, propagation, optical communications, photonics, sensors, 5G/6G and AI for
  telecommunications
- Held jointly with the Brazilian Congress of Electromagnetism (CBMag) as MOMAG from 2004 to 2020; standalone again
  since 2022 (Natal 2022, Bento Gonçalves 2024, Gravatá 2026)
- Full papers of 4 to 5 pages in Portuguese, English or Spanish; undergraduate research papers up to 3 pages in
  Portuguese only, presented as posters
- All submissions are reviewed; accepted and presented papers appear in the event anais, published as one PDF on the
  SBMO website
- Selected authors may be invited to submit extended versions to the Journal of Microwaves, Optoelectronics and
  Electromagnetic Applications (JMOe)
- Not ranked in CORE ICORE2026
