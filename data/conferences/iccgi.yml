notes:
- Organized by IARIA as part of the InfoWare congress, co-located with ICWMC, VEHICULAR, INTELLI and other IARIA events (22nd edition in 2027)
- Broad multi-conference on computing and information technology, with tracks on the digital society, security, social computing and e-services
- Published open access in the IARIA ThinkMind library (ISSN 2308-4529); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Southern Europe (Nice, Venice, Barcelona, Athens, Lisbon, Valencia in recent years)
- The 2027 edition moves from March to May
