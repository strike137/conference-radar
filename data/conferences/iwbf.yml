id: iwbf
name: IWBF
full_name: International Workshop on Biometrics and Forensics
type: conference
tier: minor
areas: [security, vision]
region: europe
language: english
frequency: annual
organizer: IWBF advisory board with a different European host institution each year (EURECOM in 2026), publicity with the European Association for Biometrics (EAB)
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
fee: 300 EUR regular, 250 EUR student (2026, early bird)
typical:
  deadline_months: [1, 2]
  conference_months: [4]
links:
  website: https://iwbf2026.github.io/
notes:
- Standalone two-day workshop on biometrics, multimedia forensics, deepfake detection and forensic science
- 14th edition in 2026; recent editions in Rome 2021, Salzburg 2022, Barcelona 2023, Enschede 2024, Munich 2025 and Sophia Antipolis 2026
- Papers up to 6 pages in IEEE format, double-blind review; proceedings in IEEE Xplore
- Regular, position and blue sky papers accepted
- One author must register at the regular rate and present in person
- Each edition has its own website; no permanent series site
- Not listed in ICORE2026 or the CCF 2026 list
