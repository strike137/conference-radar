notes:
- Long-running signal processing conference (60th edition in 2026) technically co-sponsored by the IEEE Signal
  Processing Society
- Always held on the Asilomar Conference Grounds in Pacific Grove, California, USA, in late October or early November
- Initial submission is an abstract plus a 500 to 1000 word extended summary; the full paper (up to 8 pages, extra page
  charges beyond 5) is due after the conference
- Papers must be presented in person by an author to appear in the proceedings; proceedings in IEEE Xplore
- CORE National USA (ICORE2026); regarded as a well-known, mostly invited-session venue in signal processing and
  communications
