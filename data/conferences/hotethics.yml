notes:
- Workshop on the ethical side of computer systems and architecture design (energy and carbon, access, bias, privacy, reliability)
- Held with ACM ASPLOS; first edition 2024 in San Diego as Workshop on Hot Topics in Ethical Computer Systems, second edition 2026 in Pittsburgh
- No 2025 edition, so frequency is irregular so far
- Short papers up to 2 pages and long papers up to 4 pages excluding references, single-blind (not anonymized)
- Non-archival; accepted papers and slides are posted on the workshop website
- Organizers mainly from Carnegie Mellon University, with Harvard, Microsoft Research, UCSB, Georgia Tech and NUS
- Not listed in ICORE2026 and not on the CCF 2026 list
