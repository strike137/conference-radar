notes:
- Half-day affiliated workshop of ASIACRYPT 2026 on cryptography for collaboration without a single trusted controller
- Topics include threshold signatures, MPC signing, distributed key management, anonymous credentials, zero-knowledge proofs and verifiable computation
- Non-anonymous extended abstracts or talk proposals of 1 to 3 pages via EasyChair, presented as lightning talks, posters or discussion prompts
- 'Non-archival: no proceedings, so previously published or concurrent work is welcome if disclosed'
- Program has three invited talks, lightning talks and a moderated discussion
- Presenters are expected to attend in person
