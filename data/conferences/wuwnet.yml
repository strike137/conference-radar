links:
  website: https://wuwnet.acm.org/
notes:
- ACM conference on underwater communication, networking, sensing and robotics, started in the USA in 2006
- Full papers up to 8 pages, short papers up to 5 pages and 2-page extended abstracts in ACM format; submission via EDAS
- Accepted papers and extended abstracts go into the conference proceedings in the ACM ICPS series (ACM DL, open access with APC since 2024; registration required)
- Recent editions mostly in Shenzhen, China (2021, 2023, 2025) plus Boston 2022 and Sibenik, Croatia 2024; Hong Kong in 2026
- Paper deadlines are usually extended by several weeks
- Not ranked in CORE (ICORE2026)
