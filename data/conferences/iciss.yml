id: iciss
name: ICISS
full_name: International Conference on Information Systems Security
type: conference
tier: minor
areas: [security]
region: south-asia
language: english
frequency: annual
organizer: 'Rotating Indian host institute (2025: IIT Indore; 2026: Chennai Mathematical Institute)'
proceedings: Springer LNCS
indexing: [Scopus, DBLP]
rank:
  core: 'National: India'
acceptance_rate: About 31% (2025, 29/93 including 14 short papers; 15 full papers)
fee: USD 300 (2026, international academic early-bird, draft rates); INR 12,000 for Indian academics
typical:
  deadline_months: [7, 8]
  conference_months: [12]
links:
  website: https://iciss.in/
  dblp: https://dblp.org/db/conf/iciss/index.html
notes:
- Held in India every year on December 16 to 20, hosted by a different institute (IITs, ISI, IDRBT, CMI)
- Proceedings in Springer LNCS; double-blind review with at least 3 reviews; SoK papers welcome; up to 20 pages
  LNCS
- Separate Industry/Demo track and a PhD Forum track; PhD Forum student authors get free registration
- Partial travel grants for student authors of accepted papers; regular-paper deadlines are usually extended in
  July and August
- CORE ranks it as a national (India) conference
