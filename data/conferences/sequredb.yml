notes:
- One-day workshop held with ACM SIGMOD/PODS 2026 in Bengaluru, India
- 'Scope: privacy-preserving data processing, bridging the database and security/cryptography communities (encrypted databases, TEEs, MPC, differential privacy, private RAG)'
- Regular papers up to 8 pages and short, demo or vision papers up to 4 pages, excluding references and appendix, ACM two-column format
- Single-anonymous review via Microsoft CMT
- Accepted papers are published in the ACM Digital Library
- Organized by researchers from the University of Waterloo, Northwestern University and UC Santa Cruz
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
