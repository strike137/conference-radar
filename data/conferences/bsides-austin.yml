notes:
- Security BSides conference in Austin, Texas, USA, running since 2010 (the fourth BSides ever held)
- Two-day event with around 750 participants at the Commons Learning Center, J.J. Pickle Research Campus, University of Texas at Austin
- Call for papers via a Google Form for 25 or 55 minute talks; technical talks preferred, no vendor or product pitches
- The 2023 edition was held in May, the 2024 edition in December
- The website now says BSides Austin is on hold, with no date for a next edition
- Talks only, no proceedings
- Not listed in the CORE ICORE2026 portal
