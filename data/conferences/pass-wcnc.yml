notes:
- Workshop co-located with IEEE WCNC; held as WS-07 at WCNC 2026 in Kuala Lumpur (half day, morning, shared sessions with WS-17)
- Topics include pinching beamforming, channel estimation and modelling, multiple access, ISAC, wireless power transfer and hardware for pinching antenna systems
- Accepted and presented papers go into the WCNC proceedings in IEEE Xplore; no-show papers are removed
- Only one edition found (WCNC 2026)
