notes:
- Run by the School of Information Systems, BINUS University, Indonesia; held every year since 2016 (11th edition
  in 2026)
- Proceedings of every edition since 2016 are in IEEE Xplore and indexed by Scopus; papers not presented are
  excluded from IEEE Xplore
- Information systems focus (IT governance, information security, AI and machine learning, big data, IoT, ERP,
  fintech, HCI); submission through Microsoft CMT
- Hybrid since 2022 and held at BINUS campuses or partner venues around Indonesia (Semarang 2022, Malang 2023,
  Bali 2024, Bandung 2025, Jakarta 2026)
- Not listed in ICORE2026 and not in the CCF list; a small regional venue
