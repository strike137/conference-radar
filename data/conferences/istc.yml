links:
  website: https://istc-conf.org/
notes:
- Founded in 1997 by ENST de Bretagne (now IMT Atlantique) as the International Symposium on Turbo Codes; renamed International Symposium on Topics in Coding in 2021
- Every three years until 2006, then every two years (except 2018 -> 2021); 2023 Brest, 2025 UCLA Los Angeles, 2027 EPFL Lausanne
- Covers all of coding theory and its applications (LDPC, polar, turbo, coded modulation, quantum error correction, ML for coding)
- Regular papers up to 5 pages in IEEE format, submitted via EDAS; accepted and presented papers go to IEEE Xplore
- Also runs a 2-page poster symposium (posters do not need a full registration) and an implementation competition
- Not listed in CORE ICORE2026
