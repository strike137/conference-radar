notes:
- Annual conference of the CIPS (Chinese Information Processing Society of China) committee on medical health and
  bioinformatics processing
- Papers must be original work in English; proceedings in Springer CCIS, with selected papers recommended to journals
- Runs shared evaluation tasks on medical NLP; evaluation track papers appear in a separate CCIS volume in some years
- Website mostly in Chinese; held in a different Chinese city each year (Hangzhou 2023, Fuzhou 2024, Dongguan 2025,
  Dalian 2026)
- Not listed in CORE ICORE2026 or the CCF 2026 list
