notes:
- European forum on languages, tools and techniques for hardware/software design (cyber-physical, embedded, real-time and reactive systems)
- 29th edition in 2026; held in Europe every year (Antibes, Linz, Turin, Stockholm, St. Goar, Rome for 2021 to 2026)
- Proceedings in IEEE Xplore; accepted research papers are invited to a special session in the ACM TECS journal
- Research and tool papers are 6 pages plus 1 page of references (IEEE double column); also Wild and Crazy Ideas papers and a PhD forum
- Co-located summer school
- ICORE2026 rank C; not in the CCF list
