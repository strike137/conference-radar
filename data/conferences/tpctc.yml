notes:
- One-day event on performance evaluation and benchmarking, run by the TPC industry consortium
- Held with VLDB every year since 2009, so it moves with VLDB (2025 London, 2026 Boston)
- Papers up to 16 pages in Springer LNCS format, submitted via EasyChair
- Proceedings published by Springer in Lecture Notes in Computer Science
- Selected papers may feed into future TPC benchmark development
- 18th edition in 2026
- Not listed in CORE ICORE2026 or in the CCF 2026 list
