links:
  website: https://www.ieice.org/cs/icetc/
notes:
- Flagship international conference of the IEICE Communications Society, started in 2020
- Mostly held in Japan (2022 Tokyo, 2023 Sapporo, 2024 Kitakyushu, 2025 Osaka); 2026 in Taipei in collaboration
  with IEEE Taipei Section
- Welcomes preliminary results; choose oral (4-page final paper, IEEE Xplore) or poster (1-page, IEICE proceedings
  only) at submission
- When held outside Japan (as in 2026), Oral Best Student Award winners get a 75,000 JPY travel prize
- Not to be confused with ICETC, the International Conference on Education Technology and Computers
