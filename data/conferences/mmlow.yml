notes:
- Workshop on multimodal (text, speech, image, video) learning for low-resource, indigenous and endangered languages, including content moderation and misinformation
- 'Editions: ICON 2022 (IIIT Delhi), SPELLL 2023 (Kongu Engineering College), SPELLL 2024 (VIT Chennai), SPELLL 2025 (India), AACL-IJCNLP 2026 (virtual only)'
- 2022 and 2026 proceedings in the ACL Anthology; the 2023 and 2024 SPELLL editions appeared in Springer volumes
- 2026 used OpenReview with double-blind review; regular papers 8 pages and short (mainly shared task) papers 4 pages
- 2026 edition is held entirely online, with shared tasks alongside the paper track
- Not listed in ICORE2026 and not on the CCF list
