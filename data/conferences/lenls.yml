id: lenls
name: LENLS
full_name: Logic and Engineering of Natural Language Semantics
type: conference
tier: minor
areas: [nlp, ai]
region: japan
language: english
frequency: annual
organizer: LENLS organizing committee (Daisuke Bekki, Koji Mineshima and others; under the FoLLI umbrella)
organizer_country: [japan]
proceedings: Springer LNCS (FoLLI subline, post-proceedings of full papers submitted after the event); online
  proceedings of extended abstracts for attendees
archival: true
typical:
  deadline_months: [8, 9]
  conference_months: [11]
links:
  website: https://lenls.github.io/lenls22/
notes:
- International conference on formal syntax, semantics and pragmatics, computational semantics and philosophy of
  language, held in Japan every November
- Held under the umbrella of FoLLI (Association for Logic, Language and Information)
- Submission is an abstract; accepted talks submit an extended abstract before the event and a full paper about two
  weeks after it
- Full papers are published afterwards in Springer LNCS (post-proceedings volumes listed on the site back to 2005)
- Hybrid format; 2026 registration 5,000 JPY in person (cash on site), online attendance free
- No edition in 2024 (LENLS20 in Osaka 2023, LENLS21 in Nagoya 2025)
- Not listed in the CORE portal (ICORE2026) and not on the CCF list
