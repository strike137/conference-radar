notes:
- Flagship conference of the IEEE Solid-State Circuits Society, in its 74th year in 2027; over 2500 participants expected
- Held every February in San Francisco (2027 at the San Francisco Marriott Marquis)
- Covers integrated circuit and SoC design (analog, data converters, digital, memory, wireless, wireline, imagers, power and more); papers need measured silicon results
- Submission is an abstract plus a draft manuscript for the Digest of Technical Papers (5 single-column pages of text plus up to 2 pages of figures); double-blind review; deadline 3:00 PM EDT
- Papers are accepted as regular or short presentations; strong papers are invited to a JSSC special issue
- Late Breaking News track for production-grade industry papers (intent by October, manuscript by December, at most four papers)
- Not ranked by CORE or CCF, whose lists cover computing venues; regarded as the most prestigious chip design conference
