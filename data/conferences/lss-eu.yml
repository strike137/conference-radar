links:
  website: https://events.linuxfoundation.org/linux-security-summit-europe/
notes:
  - Technical forum on Linux security run by The Linux Foundation, with a program committee selecting refereed talks
  - Refereed presentations and panels (45 minutes) and short topics; no papers, recordings go to the Linux Foundation YouTube channel
  - Topics include access control, crypto and key management, integrity, hardware and IoT security, containers, OS hardening and supply chain
  - Held in a European city that changes between editions (Dublin 2022, Bilbao 2023, Vienna 2024, Amsterdam 2025, Prague 2026)
  - Speakers must present in person; CFP via Sessionize
  - Sister event of Linux Security Summit North America (lss-na)
