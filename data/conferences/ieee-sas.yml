notes:
- Financially sponsored by the IEEE Instrumentation and Measurement Society (IMS); running since 2006
- Recent hosts 2022 Sundsvall, 2023 Ottawa, 2024 Naples, 2026 Vitoria, 2027 Ho Chi Minh City; no 2025 edition
- Full papers of 4 to 6 pages, reviewed with a revision round before the final decision
- Accepted and presented papers go to IEEE Xplore; extended versions can go to an IMS journal special section
- Covers sensor technologies and applications, including IoT sensing, sensor networks, edge AI and wireless/RF sensing
- Not listed in ICORE2026 (the CORE "SAS" is the Static Analysis Symposium) or the CCF 2026 list
