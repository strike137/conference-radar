notes:
- Annual general computer science conference run by Misr International University (MIU), Cairo, Egypt; 6th edition
  in 2026 (IEEE conference record 70118, IEEE Egypt Section)
- Runs in a hybrid physical and virtual format; the conference secretariat is at MIU in Cairo
- Accepted papers are published by IEEE in IEEE Xplore (stated as indexed in Scopus and Web of Science)
- Papers up to 6 pages plus at most 2 extra pages, double-blind review, submitted via Microsoft CMT
- Broad tracks covering AI, computer vision, networks and security, computing and software
- Registration fee is paid together with the camera-ready submission
- Not listed in CORE ICORE2026
