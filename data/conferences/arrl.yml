notes:
- Workshop on adaptable, reliable and responsible machine learning (continual learning, domain adaptation, robustness, fairness, explainability, privacy)
- Held with IEEE ICDM since 2023 (Shanghai 2023, Abu Dhabi 2024, Washington DC 2025, Shenyang 2026); location rotates with ICDM
- Contact chair Chen Zhao (Baylor University); several workshop chairs and a large program committee
- Accepted papers included in the ICDM workshop proceedings (ICDMW) by the IEEE Computer Society Press (IEEE Xplore)
- Up to 8 pages in IEEE ICDM format; at least one full (non-student) registration per paper
- Not ranked by CORE (not in ICORE2026) or CCF
