notes:
- Main conference series dedicated to post-quantum cryptography; proceedings in Springer LNCS
- Location rotates worldwide; Asia hosted it in 2011 and 2025 (Taipei), 2016 (Fukuoka), 2019 (Chongqing) and 2021
  (Daejeon)
- Submissions are not anonymous (title, author names and affiliations on the paper); title and abstract must be
  registered one week before the full paper deadline
- 'Acceptance around 40% (2026: 27/66), higher than the IACR general conferences'
