notes:
- Spanish national meeting of the computer architecture community run by SARTECO; joins the Jornadas de Paralelismo (since 1990, 36th edition in 2026) and the Jornadas de Computación Empotrada y Reconfigurable (JCER)
- Topics include processor and memory architecture, interconnection networks, HPC, clusters, GPU and FPGA accelerators, quantum computing and teaching of computer architecture
- Host city changes every year (Ciudad Real 2023, A Coruña 2024 inside CEDI, Sevilla 2025, Madrid 2026)
- Papers in IEEE format, about six pages recommended and at most 10; website and call are in Spanish
- Papers go into a book of proceedings accessible to SARTECO members; authors may also deposit their papers on Zenodo with a DOI
- Also hosts the "Tu Tesis en Tres Minutos" and "Tu Trabajo Fin de Máster en Tres Minutos" student competitions
- Registration 400 EUR early, 450 EUR regular (2026)
- Not listed in CORE ICORE2026
