notes:
- Workshop on learning, analysing and evaluating text representations (embeddings, LLM representations, cross-lingual and multimodal representations)
- Run by ACL SIGREP; held every year from 2016 to 2025, co-located with ACL or NAACL
- 10th edition at NAACL 2025 in Albuquerque, USA, on May 4, 2025; 2024 edition at ACL 2024 in Bangkok
- Regular papers (long up to 8 pages, short up to 4 pages) appear in the ACL Anthology; extended abstracts and cross-submissions are non-archival
- Double-blind review via OpenReview, with an ARR commitment option
- No 2026 edition found on the ACL 2026 or EMNLP 2026 workshop lists
- Not ranked in ICORE2026 and not on the CCF list
