id: ucami
name: UCAmI
full_name: International Conference on Ubiquitous Computing and Ambient Intelligence
type: conference
tier: minor
areas: [ai, networking]
region: worldwide
language: english
frequency: annual
organizer: MAmI Research Lab, University of Castilla-La Mancha (with a steering committee from Spain, UK and Latin America)
organizer_country: [europe]
proceedings: Springer LNNS
archival: true
fee: 500 EUR regular before 2026-09-15 (2026)
typical:
  deadline_months: [6, 7]
  conference_months: [10, 11]
links:
  website: https://ucami.org/
notes:
- Run by the MAmI Research Lab of the University of Castilla-La Mancha (Ciudad Real, Spain)
- Proceedings in Springer Lecture Notes in Networks and Systems (LNNS)
- Tracks on ambient assisted living and health, Internet of Everything and sensors, and AI for ambient intelligence
- Long papers up to 12 pages and short papers up to 6 pages; papers can be submitted without a prior abstract
- Location rotates between Europe and the Americas; recent editions were Cordoba (2022), Riviera Maya (2023), Belfast (2024), Prato (2025) and Montreal (2026)
- One regular registration covers one paper; one additional paper costs 200 EUR
- Not ranked in CORE ICORE2026 and not on the CCF list
