notes:
- Swiss data science and AI conference organized by the data innovation alliance; 2027 is the 14th annual edition
- Combines a business track for practitioners with an IEEE scientific track
- Held in Zurich, Switzerland in 2026 and 2027 (The Circle Convention Center in 2027)
- Full papers up to 8 pages and short papers up to 4 pages in IEEE two-column format, double-blind review on OpenReview
- Abstract registration a week before the full paper deadline; author response period before decisions
- Proceedings in IEEE Xplore
- "Acceptance rate: 36% (2026)"
- Workshop day after the main conference with half-day workshops
- Not ranked on CORE ICORE2026 and not on the CCF list
