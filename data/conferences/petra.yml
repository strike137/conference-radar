id: petra
name: PETRA
full_name: International Conference on PErvasive Technologies Related to Assistive Environments
type: conference
tier: minor
areas: [general, ai]
region: europe
language: english
frequency: annual
organizer: University of Texas at Arlington (conference chair Fillia Makedon)
organizer_country: [usa]
proceedings: Springer CCIS (from 2026; ACM ICPS in ACM DL through 2025)
archival: true
typical:
  deadline_months: [1, 2]
  conference_months: [6, 7]
links:
  website: https://www.petrae.org/
notes:
- Interdisciplinary venue on pervasive computing, HCI, human-robot interaction, sensing and machine learning for assistive and healthcare applications
- Run by Fillia Makedon (University of Texas at Arlington) as conference chair, with mostly UTA program chairs
- Always held in Greece (Corfu, Crete, Rhodes); 2026 edition hybrid on Crete
- Proceedings were published in the ACM Digital Library (ACM ICPS) up to PETRA 2025; from 2026 they are published by Springer in CCIS
- Full papers 10 to 12 pages, short and workshop papers 6 to 10 pages, posters 5 to 7 pages (all including references)
- Many co-located workshops each year (11 in 2026)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
