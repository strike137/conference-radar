notes:
- ICSE co-located workshop on large language models and agents for software engineering, held since 2024
- 2027 is the fourth edition, held on May 1, 2027 in Dublin with ICSE 2027
- Research papers 4 to 8 pages, position papers 1 to 4 pages, extended abstracts 1 to 5 pages (all including references)
- Double-anonymous review; submissions via HotCRP
- Accepted papers go into the ICSE workshop proceedings by default; a non-archival option posts the paper only on the workshop site
- 2027 uses the IEEE template; 2026 used the ACM template with ACM Open Access charges for non-abstract papers
- Not ranked by CORE or CCF
