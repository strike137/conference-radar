notes:
- Technology conference of LY Corporation (LINE and Yahoo! JAPAN) with speakers from Japan, Korea and Vietnam group companies
- Site and sessions in Japanese, English and Korean
- 2025 ran two days (Jun 30 to Jul 1) with AI and security as main themes across 12 domains; on-site by employee invitation only, streamed online for everyone
- 2026 was a one-day online event (Jun 29) with AI and Core Technology tracks, including talks on AI guardrails, AI agent authorization and confidential VMs for privacy
- No papers or proceedings; practitioner talks only
- Not listed in the CORE ICORE2026 portal
