notes:
- SIGCOMM-affiliated short-paper venue (up to 6 pages excluding references) for early-stage networking ideas; proceedings
  in the ACM Digital Library, ACM Open Access from 2026
- Double-blind review; single deadline in March, workshop in August (2024 Sydney with SIGCOMM, 2025 Shanghai, 2026
  Singapore as a standalone event; SIGCOMM 2026 was in Denver)
- Ranked CCF C; most accepted papers come from Chinese universities and industry labs
- An extended version may be submitted to another venue at the same time; student travel grants available
