id: ieee-icta
name: IEEE ICTA
full_name: IEEE International Conference on Integrated Circuits, Technologies and Applications
type: conference
tier: minor
areas: [general]
region: asia-pacific
language: english
frequency: annual
organizer: IEEE ICTA steering committee (chaired from Zhejiang University); 2026 edition organized by SUTD, NTU and
  other Singapore institutions
organizer_country: [china, singapore]
proceedings: IEEE Xplore
archival: true
fee: S$900 IEEE member, S$1,000 non-member, S$600 IEEE student (2026, early bird; standard S$1,000 / S$1,250 / S$750)
typical:
  deadline_months: [8]
  conference_months: [10]
links:
  website: https://www.ieee-icta.org/
notes:
- Integrated circuits conference (RF and analog circuits, digital and AI chips, EDA, devices); 2026 theme "Advancing
  IC with AI"
- Steering committee made up of Chinese universities and institutes (Zhejiang, Tsinghua, USTC, IS-CAS and others)
- 2026 is the 9th edition, held in Singapore at the Grand Copthorne Waterfront Hotel
- Accepted regular papers limited to 2 pages (invited papers 6 pages); poster and lecture sessions plus late news submissions
- Papers not registered, paid or presented are left out of the proceedings and IEEE Xplore; one full registration per paper
- Not listed in ICORE2026 or the CCF list
