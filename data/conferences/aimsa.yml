notes:
- Biennial general AI conference held in Bulgaria since 1984 (Sofia 2026, Golden Sands near Varna 2024)
- Run by IICT at the Bulgarian Academy of Sciences and the Bulgarian AI Association; small single-track event with
  about 70 to 150 participants
- Proceedings in Springer LNAI; regular papers 12 to 15 pages, posters 4 to 6 pages, LNCS format
- Single-blind review by at least three program committee members; submission via Microsoft CMT
- Hybrid format (in person plus online) since 2024
- No editions between 2018 and 2024 according to the official history page
- CORE ICORE2026 lists it as National (Bulgaria)
