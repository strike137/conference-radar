organizer: Workshop organizers co-located with ACM SIGKDD (Chen Zhao, Baylor University; Feng Chen, UT Dallas; Xintao Wu,
  University of Arkansas; Haifeng Chen, NEC Laboratories America)
organizer_country: [usa]
proceedings: Workshop website (non-archival, not in the KDD proceedings)
archival: false
typical:
  deadline_months: [5]
