notes:
- Workshop of the IEEE International Conference on Cyber Security and Resilience (IEEE CSR), held every year since
  2021 (virtual in 2021 and 2022, in Europe since 2023)
- "2026 theme: Cyber Resiliency: Strategies, Technologies, and Economics"
- Topics include cyber resiliency strategy and policy, metrics and economics of resiliency, attacker and defender
  economics, and ROI frameworks
- Chaired by researchers from PNNL and MITRE (US)
- Workshop papers go into the IEEE CSR proceedings in IEEE Xplore; 6 pages plus up to 2 extra pages with overlength
  charges
- In person only; deadline was extended by one month in 2026 (Apr 13 -> May 13)
- Not listed in CORE ICORE2026 or the CCF list
