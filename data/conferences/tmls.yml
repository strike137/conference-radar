notes:
- Practitioner ML and AI conference in Toronto run by the Toronto Machine Learning Society, a community that also
  runs MLOps World
- 10th year in 2026; 400+ attendees
- Four-day format, a virtual day, two in-person days of keynotes and technical sessions, and a workshop day
- Talks, workshops and industry case studies reviewed by a steering committee; no papers or proceedings
- Paid tickets (about 200 to 650 CAD in 2026); TMLS 2027 planned for June 2027
- TMLS also runs a separate fall event, MLOps North (Toronto Summit), on Nov 5-6, 2026 at RBC WaterPark Place
- Not listed in CORE ICORE2026
