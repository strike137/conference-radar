notes:
- EAI conference on mobility, IoT, smart cities and related smart life, business and education topics; 2026 was the 13th edition
- Proceedings in the EAI/Springer Innovations in Communication and Computing book series; selected papers invited to Mobile Networks and Applications (MONET)
- Mostly online in recent years (2021, 2022, 2025, 2026); on site in Bratislava (2023) and Danang (2024)
- 2025 edition held online from Newton University Prague on 2025-12-03; 2026 edition held online on Dubai time
- Several submission tracks (regular, common and late) with short gaps between deadline and conference
- Not listed in ICORE2026
