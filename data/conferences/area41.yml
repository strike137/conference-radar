- Technical information security conference in the Zurich area, run as a non-profit by the Swiss DEF CON group DC4131
- Established in 2010 as hashdays; now held every two years (2022, 2024, 2026)
- Capped at 600 attendees; tickets often sell out
- 2026 edition held at TheHall, Dübendorf (Zurich/Stettbach); no formal proceedings
