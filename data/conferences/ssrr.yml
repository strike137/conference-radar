notes:
- IEEE RAS symposium on field robotics for public safety, security, emergency response and disaster relief, established in 2002
- Single track; full papers of up to 8 pages including references, published by the IEEE in IEEE Xplore
- Papers must be motivated by real end-user needs; general robot safety is out of scope
- Hands-on and community oriented; usually includes field tours of training facilities or exercises
- Location rotates worldwide (Galway 2025, New York City 2024, Fukushima 2023, Sevilla 2022, Incheon 2026)
- Not listed in ICORE2026 or the CCF 2026 list
