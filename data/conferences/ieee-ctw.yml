links:
  website: https://ctw2027.ieee-ctw.org/
notes:
- Flagship yearly workshop of the IEEE ComSoc Communication Theory Technical Committee
- Single track with invited technical sessions, plenary talks and panels; open contributions only in the poster session
- "Poster call: 2-page extended abstracts (IEEE double column) sent by email; no published proceedings, accepted posters are only listed on the website"
- Students and junior researchers are especially encouraged to submit posters
- Recent editions in Venice (2025), Azores, Portugal (2026) and Jeju, Korea (2027)
- Not the same venue as AusCTW (Australian Communication Theory Workshop)
