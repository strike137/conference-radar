notes:
- Workshop on the design, implementation and application of SAT solvers and related solvers (SMT, ASP, CP, MaxSAT, PB), including the technical details rarely published at main conferences
- Held since 2010 as a satellite of the SAT conference or FLoC; PoS 2026 was the 17th edition
- Recent locations rotate (online 2021, Haifa 2022, Alghero 2023, Pune 2024, Glasgow 2025, Lisbon 2026)
- Original papers (short up to 8 pages, long 8 to 15 pages), work-in-progress papers and presentation-only papers; each submission gets at least two reviews
- Proceedings in open-access CEUR-WS when enough original papers are accepted (PoS 2025 -> Vol-4008 jointly with SMT); authors may opt out of the proceedings
- Fast track for papers rejected from FLoC conferences such as SAT, reusing their reviews
- Managed by a steering committee since October 2023, with new PC chairs each year
- Not listed in ICORE2026 or the CCF list
