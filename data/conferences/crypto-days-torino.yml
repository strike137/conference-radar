notes:
- Scientific conference series on cryptography research run by the CrypTO group of Politecnico di Torino (DISMA)
- Program of invited talks by Italian and foreign academic and industry researchers; no call for papers and no proceedings
- In person only, held in Turin, Italy; registration through Eventbrite
- Editions in May 2024 (Energy Center) and May 2026 (Castello del Valentino); the 2024 edition was endorsed by De Componendis Cifris
- Not listed in ICORE2026 and not on the CCF list
