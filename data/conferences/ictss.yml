notes:
- IFIP conference on software and systems testing (38th edition in 2026)
- Proceedings in Springer LNCS; best papers invited to a special issue of Springer Nature Computer Science
- Full papers 12 to 15 pages plus 2 pages of references, short papers up to 6 pages, double-blind review
- Held in Europe every year (Bergamo 2023, London 2024, Limassol 2025, Paris 2026)
- 2026 edition included the TESTAI workshop and a CyberSuite hackathon
