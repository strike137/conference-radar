links:
  website: https://nof.dnac.org/
notes:
- Organized by DNAC (also behind NTMS, Wireless Days, BRAINS and CSNet); technically sponsored by IEEE and IEEE ComSoc
- Held since 2010 (17th edition in 2026); mostly in Europe, also Brisbane 2010, Tunis 2012, Pohang 2013, Montreal 2015 and 2025, Rio de Janeiro 2016, Izmir 2023
- Regular papers up to 9 pages and short papers up to 6 pages, references included; single-blind review
- Accepted and presented papers are submitted to IEEE Xplore; one author must register at the author rate and present in person
- Workshop day and demo track in addition to the main conference
- Not listed in the CORE ICORE2026 rankings
