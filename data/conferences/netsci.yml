id: netsci
name: NetSci
full_name: International School and Conference on Network Science
type: conference
tier: major
areas: [data, ai]
region: worldwide
language: english
frequency: annual
organizer: Network Science Society (NSS); local host changes each year (2026 Northeastern University Network Science Institute, 2027 SynoSys at TU Dresden)
organizer_country: [international]
proceedings: None (non-archival; one-page abstracts for talks and posters)
archival: false
typical:
  deadline_months: [12, 1]
  conference_months: [5, 6]
links:
  website: https://netscisociety.net/netsci-conferences/
notes:
- Flagship annual conference of the Network Science Society, held since 2006; interdisciplinary (physics, computer science, biology, social science) on complex networks
- Submissions are one-page abstracts with one mandatory figure, reviewed by the program committee and accepted as a contributed talk or poster; no paper proceedings
- Each accepted abstract must be presented in person; each author may present only one abstract at the main conference
- Program includes a one-day school and satellite workshops before the main conference; satellites have their own call with an earlier deadline
- Host city changes every year (Shanghai 2022, Vienna 2023, Quebec City 2024, Maastricht 2025, Boston 2026, Dresden 2027); the society says NetSci 2027 and 2029 are in Europe
- The society also runs NetSciX, a separate winter edition with the same full name (NetSciX 2026 Auckland, NetSciX 2027 Hong Kong, January 24 to 27, 2027)
- Not listed in CORE ICORE2026 or in the CCF 2026 list
- Related venues already listed - Complex Networks (CNA) and CompleNet, which publish full papers
