id: netsci
name: NetSci
full_name: International School and Conference on Network Science
type: conference
tier: major
areas: [data, general]
region: worldwide
language: english
frequency: annual
organizer: Network Science Society (NSS) with a local host (2027 SynoSys, TU Dresden)
organizer_country: [international]
proceedings: None (non-archival)
archival: false
typical:
  deadline_months: [12, 1]
  conference_months: [5, 6]
links:
  website: https://netscisociety.net/netsci-conferences/
notes:
- Flagship conference of the Network Science Society, running since 2006; interdisciplinary (social, biological,
  brain, infrastructure and AI networks)
- Submissions are one-page abstracts with one figure, reviewed by the program committee and accepted as talks or
  posters; no proceedings
- Each accepted abstract must be presented in person, and each author may present only one abstract
- Satellite symposia and a school precede the main conference
- "Recent hosts: Washington DC 2021, Shanghai 2022, Vienna 2023, Quebec City 2024, Maastricht 2025, Boston 2026"
- The society also runs NetSciX, a winter school and conference (Hong Kong, January 2027)
- Not found in the CORE ICORE2026 search and not in the CCF 2026 list
