notes:
- Australian conference of the Laravel (PHP web framework) developer community, an official Laracon event held with permission of Laravel Holdings Inc.
- Editions in 2018, 2019, then annually since 2023 after a break
- 2026 edition at QUT Gardens Theatre, Brisbane, with a new Day 0 of half-day workshops before two conference days
- Practitioner talks on tools, architecture, product, career and community; no papers or proceedings
- Not listed in CORE ICORE2026
