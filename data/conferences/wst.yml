notes:
- Informal workshop on all aspects of termination and complexity analysis (rewriting, lambda calculus, program analysis, probabilistic programs, SAT/SMT for termination)
- No formal reviewing; extended abstracts up to 5 pages in LIPIcs style, short versions of published or submitted work welcome
- Proceedings collected as an arXiv report (WST 2026 -> arXiv 2607.13065), so non-archival
- Held since 1993, often as a satellite of FLoC or another logic meeting (CADE 2021, Obergurgl Summer on Rewriting 2023); not held every year (no edition in 2019, 2020 and 2024)
- Recent editions in Oxford 2018, online 2021 (CADE), Haifa 2022, Obergurgl 2023, Leipzig 2025 (joint with IWC) and Lisbon 2026 (FLoC)
- The Termination Competition runs alongside the workshop
- Not listed in ICORE2026 or the CCF 2026 list
