notes:
- Smaller commercially run conference (secretariat on a vip.163.com address with a Chinese phone number, submission via iconf.org)
- Not the same as ICCAI (International Conference on Computing and Applied Informatics, Universitas Sumatera Utara)
- Held since 2015; Chengdu 2018, Kyoto 2019, Tianjin 2020 to 2023 (online 2020 to 2022), then Bali 2024, Kyoto 2025, Okinawa 2026 and Seoul 2027; hybrid since 2023
- Proceedings in the ACM Digital Library 2018 to 2024, stated as indexed by EI Compendex and Scopus
- 2025 edition had 167 presentations and over 280 participants from 27 countries and regions
- Abstract-only presentation without publication is also offered
- Not listed in ICORE2026 or the CCF 2026 list
