notes:
- Annual symposium of the IEEE Broadcast Technology Society, with an international steering committee
- Topics are broadcasting, multimedia transmission and networking, multimedia signal processing and service quality
- Extended abstracts (3 pages) or full papers (6 pages) in the IEEE template, submitted via EasyChair
- Papers of registered authors go to IEEE Xplore; one full registration covers up to two papers (2026)
- Not listed in ICORE2026 or the CCF 2026 list
- Location rotates worldwide (Joao Pessoa, Brazil 2026; Sydney, Australia 2027)
