notes:
- Started in 2023 by the School of Telecommunications Engineering of Xidian University; steering committee chaired by
  Xidian, Pengcheng Laboratory, China Institute of Communications and HKUST members
- Held in China (2023 and 2024 Xi'an, 2025 Hangzhou, 2026 Hong Kong at PolyU); timing has moved from July to
  September to December
- Papers in IEEE conference proceedings on IEEE Xplore (2023 to 2025 volumes published); EI Compendex and Scopus
  indexing is stated as submitted, not guaranteed
- "2026 flyer lists PolyU as organizer, Xidian University as supporter and China Institute of Communications as advisor"
- Selected papers may be recommended to the Journal of Electronics and Information Technology
- Tracks on communication theory, signal and image processing, networking, optical communication, ML for wireless
  and emerging technologies, plus several 6G themed workshops
- Papers up to 6 pages in IEEE format (6th page charged extra); at least one author must register and present
  onsite; similarity score must be at most 30%
- Not listed in ICORE2026; young venue with no established ranking
