notes:
- Run by Government Model Engineering College (MEC), Thrikkakara, Kochi, Kerala, India, technically sponsored by the IEEE Kerala Section
- First edition in April 2024 at MEC (title sponsor DRDO); 2nd in April 2025; 3rd in July 2026 at The Renai Cochin hotel
- Proceedings in IEEE Xplore (2024, 2025 and 2026 volumes)
- Broad EECS scope (AI and data science, cybersecurity and networks, IoT, VLSI, signal processing and communication, power and renewable energy, robotics)
- Full papers up to 6 pages via Microsoft CMT
- Not listed in the CORE ICORE2026 portal
