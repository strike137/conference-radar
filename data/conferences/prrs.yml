links:
  website: https://iapr-tc7.github.io/prrs2026/
notes:
- Run by IAPR TC7 every two years as a one-day workshop co-located with ICPR
- Long-running series; 14th edition in 2026 (Lyon), earlier ones in Kolkata 2024, Montreal 2022, online 2020, Beijing
  2018 and Cancun 2016
- Papers appear in the ICPR workshop proceedings in Springer LNCS; older editions were published in IEEE Xplore
- 2026 papers 6 to 15 pages in the ICPR template, double-blind with at least 2 reviews, submitted via CMT
- Only full papers (more than 6 pages) go into the proceedings; one author must register for ICPR
- Not listed in ICORE2026
