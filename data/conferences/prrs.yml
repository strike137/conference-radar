organizer: IAPR Technical Committee 7 (Remote Sensing and Mapping); 2026 organizers Sylvain Lobry, Charlotte Pelletier,
  Marc Russwurm and Ksenia Bittner
organizer_country: [international]
proceedings: Springer LNCS (ICPR workshop proceedings)
archival: true
typical:
  deadline_months: [5, 8]
