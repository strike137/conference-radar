notes:
- Young theory venue (first edition 2022) on computing in dynamic networks, temporal graphs, population protocols and programmable matter
- Run by an international steering committee and advisory board
- Online in 2022, then held in Europe (Pisa 2023, Patras 2024, Liverpool 2025, Le Havre 2026, Paderborn 2027)
- Proceedings in the open-access LIPIcs series; regular papers 15 pages and brief announcements 5 pages
- Double-blind review; rejected regular papers may be offered a brief announcement slot
- Selected papers invited to a journal special issue
- At least one author must register and present, otherwise the paper is withdrawn from the proceedings
- Not listed in ICORE2026 or the CCF list
