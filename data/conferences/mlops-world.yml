notes:
- Practitioner conference on taking ML, generative AI and agent systems into production, run by the TMLS community
  (which also runs TMLS Summit)
- Program shaped by a 75+ member steering committee of practitioners; case studies rather than product pitches
- Held in Austin, TX in 2025 and 2026; 2026 is the 7th annual edition at the Etter-Harbin Alumni Center (UT Austin)
  with 16 tracks and about 75 sessions
- Free virtual day before the in-person days, and an extra day of in-person workshops after them
- Talks chosen through a call for speakers (2025 call closed on Aug 1); no papers, most sessions recorded and shared on YouTube
- Not listed in CORE ICORE2026
