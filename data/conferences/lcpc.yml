id: lcpc
name: LCPC
full_name: International Workshop on Languages and Compilers for Parallel Computing
type: conference
tier: minor
areas: [systems, software]
region: north-america
language: english
frequency: annual
organizer: LCPC workshop series (hosted by a different university or company each year; permanent site run by Hank Dietz,
  University of Kentucky)
organizer_country: [usa]
proceedings: Springer LNCS
archival: true
typical:
  deadline_months: [8, 9]
  conference_months: [10]
links:
  website: http://lcpcworkshop.org/
notes:
- Long-running workshop on languages, compilers, runtimes and programming models for parallel computing, held every year since 1988
- Standalone event (not co-located), usually hosted by a US university in September or October (Salt Lake City 2018, Atlanta 2019, Stony Brook 2020, Delaware 2021, Chicago 2022, Lexington 2023)
- Informal proceedings at the workshop; revised papers appear afterwards as Springer LNCS post-proceedings
- Regular papers 12 to 15 pages, short papers 6 to 11 pages and panel overviews (2023); single track
- Attendee registration was free and included the banquet (2023)
- Not listed in CORE ICORE2026 or the CCF 2026 list
