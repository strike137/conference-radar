notes:
- Annual conference on continual and lifelong learning, held since 2022
- Proceedings in PMLR (2024 -> volume 274 with 53 papers, 2025 -> volume 330 with 37 papers)
- Also has a non-archival workshop track reviewed separately
- Location rotates (early editions in Montreal, then Pisa 2024, Philadelphia 2025, Bucharest 2026)
- Not listed in the ICORE2026 portal or the CCF list
