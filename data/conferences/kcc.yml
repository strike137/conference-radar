notes:
- Organized by KIISE (Korean Institute of Information Scientists and Engineers); summer flagship of Korean computer
  science
- Held at ICC Jeju in early July 2025 and late June 2026
- Short papers of 2-3 pages in Korean or English (oral or poster) plus an undergraduate/junior paper competition;
  best-presentation papers are recommended to KIISE journals
- Includes a Top Conference session for papers already accepted at leading international venues, plus tutorials,
  workshops and young researcher sessions
- Deadline is typically extended twice by about one week; Conference Travel Award program waives registration for
  some members
