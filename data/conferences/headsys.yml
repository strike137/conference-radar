notes:
- Workshop on head-worn sensing and computing systems (earbuds and hearables, smart glasses, AR/VR headsets,
  brain-computer interfaces, neck accessories)
- First edition held with ACM MobiSys 2026 in Cambridge, UK; chairs from the University of Cambridge, KIT and
  Northwestern, steering committee led by Cecilia Mascolo (Cambridge)
- Full papers up to 6 pages, position papers 4 pages and abstracts 2 pages including references, MobiSys format,
  single-blind review via HotCRP
- Papers published in the ACM Digital Library (Proceedings of the 24th MobiSys Workshops, 2026)
- 7 papers presented in 2026, with best paper and best presentation awards
- Not listed in ICORE2026 and not on the CCF list
