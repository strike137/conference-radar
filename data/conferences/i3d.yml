notes:
- Sponsored by ACM SIGGRAPH; accepted papers appear in a PACMCGIT journal issue in the ACM Digital Library
- CORE B (ICORE2026, listed as I3DG); focused on real-time rendering, games and interactive graphics, with strong industry participation
- Double-blind review in two rounds, no rebuttal; conditionally accepted papers submit a revision
- Held in the USA (Bellevue 2023, Philadelphia 2024, Jersey City 2025, Lucasfilm San Francisco 2026); virtual in 2020 to 2022
- 2026 was the 30th conference in the 40th year of I3D
