notes:
- Young ACM conference on reproducibility of computational research, first held in 2023 at UC Santa Cruz
- Associated with the ACM Emerging Interest Group for Reproducibility and Replicability (EIGREP)
- All accepted papers are published in the ACM Digital Library (ACM Open from 2026)
- Double-blind review; full papers (10 pages) and short papers (4 pages), page limit without references and appendices
- Artifacts are mandatory for full papers with experimental results and are reviewed for ACM availability badges
- Topics include systems and security reproducibility (reproducing security findings, comparing published systems)
- Location rotates (Santa Cruz 2023, Rennes 2024, Vancouver 2025, Delft 2026, Salt Lake City 2027); remote participation supported
- Not listed in ICORE2026 or the CCF 2026 list
