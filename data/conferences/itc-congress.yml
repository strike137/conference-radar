notes:
- Founded in 1955 in Copenhagen; bills itself as the first international conference in networking science and
  practice; run by the ITC International Advisory Council with a local host university each time
- Focus on teletraffic models, performance evaluation, network measurements and modelling of communication systems
- Papers are open access in the ITC digital library; ITC keeps the copyright, and earlier editions were also included
  in IEEE Xplore and ACM DL
- The ITC 36 welcome message says the publication process was handled in coordination with IEEE Xplore
- Single-blind review; full papers up to 9 pages, short papers up to 5 pages, A4 2-column IEEE style
- Small program in recent years (13 regular papers in 2023); co-located PhD workshop
- Formerly annual, now irregular (2021, 2022, 2023, then 2025); held mostly in Europe (Trondheim 2025, Turin 2023,
  Shenzhen virtual 2022, Avignon 2021, Osaka 2020, Budapest 2019)
- ICORE2026 lists it as Unranked; not the CCF 'ITC' (IEEE International Test Conference)
