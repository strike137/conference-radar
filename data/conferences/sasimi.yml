id: sasimi
name: SASIMI
full_name: Workshop on Synthesis And System Integration of Mixed Information technologies
type: conference
tier: minor
areas: [systems]
region: asia-pacific
language: english
frequency: irregular
organizer: SASIMI Steering Committee, in cooperation with IEEE CEDA All Japan Joint Chapter, IEEE CASS Japan Joint
  and Kansai Chapters, IEEE CS Kansai Chapter, IEICE and IPSJ
organizer_country: [japan]
proceedings: Electronic proceedings; optional open-access official archive on sasimi.jp
archival: false
fee: 50,000 JPY full or regular, 35,000 JPY student (2025, early, banquet included)
typical:
  deadline_months: [5, 10]
  conference_months: [3, 10]
links:
  website: https://sasimi.jp/new/sasimi2027/
notes:
- International workshop on system design, EDA, synthesis, verification, test and analog/mixed-signal design, running
  since 1989; 27th edition in 2027
- Held about every 18 months, alternating between March and October; mostly in Japan, with editions in Taiwan (2019
  Tainan, 2024 Taipei)
- Short papers of 2 pages or full papers of 3 to 6 pages in English; blind review; best paper awards from full papers
- Papers go into electronic proceedings; authors can opt in to an open-access official archive on sasimi.jp, so
  treated as non-archival
- Each accepted paper needs its own full registration; registration fee includes the banquet
- Not listed in ICORE2026 or the CCF 2026 list
