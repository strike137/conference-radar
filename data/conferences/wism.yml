notes:
- Working conference of IFIP TC11 WG 11.1 (Information Security Management), co-located with IFIP SEC
- Accepted papers appear in the IFIP SEC proceedings, Springer IFIP AICT series
- Full papers up to 14 pages, short (research in progress) papers up to 8 pages, LNCS format; anonymised
  submissions with at least two reviews; panel and tutorial proposals also welcome
- Topics on the management side of security (policy, security culture, governance and compliance, risk
  assessment, standards, awareness); practitioner and academic contributions; friendly stream for students
- Numbering is inconsistent; the 2026 Perth edition was called the 19th WISM, while the 2027 Linköping call
  is titled the 18th
- 'CORE: not listed in ICORE2026'
