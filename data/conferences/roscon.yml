notes:
- Global developers' conference for ROS (Robot Operating System), run by Open Robotics since 2012
- Three days of workshops, technical talks, tutorials, lightning talks, birds of a feather sessions and demos
- Presentation and workshop proposals reviewed by a program committee; no papers
- Rotates worldwide (Kyoto 2022, New Orleans 2023, Odense 2024, Singapore 2025, Toronto 2026, Krakow 2027)
- 2022 had 801 attendees from 38 countries; registration often sells out weeks before the event
- Diversity scholarship program; regional ROSCons (Japan, France, Korea, India, ...) are listed separately
