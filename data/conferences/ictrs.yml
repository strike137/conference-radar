notes:
- Small conference run by IICREST (Bulgaria) since 2012; general co-chair Boris Shishkov
- Two tracks (Foundations and Applications) covering wireless communications, electromagnetics, photonics and remote
  sensing
- Held in Europe (Sofia, Rhodes, Milan, Delft, Barcelona, Luxembourg) or online (2020, 2021, 2024)
- Proceedings in ACM ICPS up to 2021 and in Springer CCIS since 2022 (2024 volume is CCIS 2544)
- Extended abstracts (2 to 4 pages, LNCS format) are reviewed double-blind; full papers are submitted after the event
- "Acceptance: 8 of 19 submissions (2024)"
- Up to three best papers are extended in Annals of Telecommunications
- Not listed in ICORE2026 and not on the CCF list
