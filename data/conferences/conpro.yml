notes:
- One-day workshop co-located with IEEE S&P in May (San Francisco since 2022); 2026 was the 10th edition
- Security and privacy research with an impact on consumers (fraud and scams, dark patterns, advertising, consumer
  privacy); audience includes researchers from consumer protection agencies
- Since 2025 accepts only short research proposals of at most 2 pages (IEEE format, references excluded), anonymous
  submission via HotCRP
- 'Non-archival: no official proceedings, so the work can later be submitted to other venues'
- Deadlines have been extended by about one week in 2024, 2025 and 2026
- Not listed in ICORE2026 (portal search returns no results)
