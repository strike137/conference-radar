notes:
- European database and information systems conference, held in a different European city each year (Tampere 2025,
  Orleans 2026)
- Full papers (16 pages) in Springer LNCS, short papers (up to 10 pages) in Springer CCIS; single-blind review
- Co-located workshops, a doctoral consortium school, demos, tutorials and Fresh Thinking Talks
- CORE C (ICORE2026); listed there as Symposium on Advances in DB and Information Systems
