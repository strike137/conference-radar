links:
  website: https://acm-wintech.github.io/2026/
notes:
- Long-running workshop on experimental wireless networking and testbeds (20th edition in 2026), co-located with ACM
  MobiCom (Hong Kong 2025, Austin 2026)
- Accepted papers are published in the ACM WiNTECH proceedings and archived in the ACM Digital Library
- Papers up to 8 pages all-inclusive, two-column 10-point format; single-blind review; separate posters and demos call
- Full-day workshop; deadlines are usually extended several times
- Not listed in the CORE portal (ICORE2026)
