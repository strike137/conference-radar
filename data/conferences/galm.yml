links:
  website: https://galm-workshop.github.io/
notes:
- Workshop on combining LLMs with graph learning and structured knowledge (graph-enhanced LLMs, LLMs for graphs, graph unlearning, privacy)
- 1st edition at IEEE ICDM 2025 in Washington DC, USA; 2nd edition at ACM CIKM 2026 in Rome; host conference is not fixed
- Organizers plan to publish accepted papers in CEUR Workshop Proceedings if there are enough submissions
- Full papers up to 8 pages, short papers up to 4 pages (ACM sigconf), single-blind review via OpenReview; papers already published elsewhere are also accepted
- 7 papers on the 2026 program (half-day afternoon session)
- Not listed in CORE ICORE2026 or the CCF 2026 list
