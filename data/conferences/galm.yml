id: galm
name: GaLM
full_name: "International Workshop on Graph-Augmented LLMs (GaLM): Bridging Language and Structured Knowledge"
type: workshop
tier: minor
areas: [ai, nlp, data]
region: worldwide
language: english
organizer: GaLM organizers led by IIT (BHU) Varanasi (with CUHK Shenzhen, Halmstad University, JNU, Capital One)
organizer_country: [india]
proceedings: CEUR-WS (planned, subject to enough submissions)
archival: true
typical:
