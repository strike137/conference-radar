notes:
- Main Nordic HCI conference, held every two years in a Nordic country (Aarhus 2022, Uppsala 2024, Vaasa 2026)
- Proceedings in the ACM Digital Library (International Conference Proceedings Series); ACM open access model may
  mean an APC for authors outside ACM OPEN institutions
- Research papers up to 12,000 words, dual anonymous review with a single cycle and no rebuttal
- Also has critiques, panels, arts-based approaches, industry experiences, late-breaking work, demos, workshops and
  a doctoral consortium
- Accepted papers must be presented in person
- CORE Regional Scandinavia (ICORE2026); not on the CCF 2026 list
