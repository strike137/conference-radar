notes:
- Wireless sensing and communication for space, satellites and extreme environments; NASA, ESA and CSA are partners
- Financially co-sponsored by the IEEE Council on RFID (2024, 2025)
- Full papers up to 6 pages via EDAS, poster abstracts up to 3 pages; accepted papers go to the proceedings and are
  submitted to IEEE Xplore
- Held in North America and Europe (Daytona Beach 2024, Halifax 2025, Leuven 2026)
- Not listed in the CORE ICORE2026 portal
