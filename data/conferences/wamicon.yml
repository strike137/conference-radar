notes:
- Founded in 1999 at the University of South Florida as a one-day WAMI forum; a multi-day IEEE conference sponsored by IEEE MTT-S since 2004
- Regional event, usually in March or April at a beach location on the west or east coast of Florida
- Scope covers RF, microwave, mm-wave and THz devices, circuits, antennas and systems; WAMICON 2027 theme is integrated sensing and communications (ISAC) RF hardware
- Submissions are 3 to 4 page papers in IEEE conference format; IEEE may exclude papers not presented at the conference from IEEE Xplore
- Two-day program with an exhibition, a poster session and the Rudolf Henning Distinguished Mentoring Award
- Microwave engineering venue outside the usual CS rankings, not listed in ICORE2026
