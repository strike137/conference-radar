id: iwpt
name: IWPT
full_name: International Conference on Parsing Technologies
type: conference
tier: minor
areas: [nlp]
region: worldwide
language: english
frequency: biennial
organizer: ACL SIGPARSE (Special Interest Group on Natural Language Parsing), held within SyntaxFest
organizer_country: [international]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [4]
  conference_months: [8, 9]
links:
  website: https://www.sigparse.org/
notes:
- Conference series on parsing and structural analysis of natural language, started in 1989 by ACL SIGPARSE
- Now biennial and part of SyntaxFest together with Depling, UDW, QUASY and SLiDE (joint OpenReview submission)
- Regular papers up to 8 pages and short papers up to 4 pages in ACL style; double-blind review
- Authors choose archival or non-archival; archival papers go into the ACL Anthology
- Small venue (5 papers in the 2025 proceedings); no edition in 2023
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
