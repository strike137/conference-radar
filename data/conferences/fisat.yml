notes:
- New EAI conference organized with FPT University; first edition in 2026 at the FPT University Ho Chi Minh City campus
- Covers AI and machine learning, IoT and embedded systems, automotive software and semiconductor design, and techno-economic and governance aspects of smart systems
- Papers go to the Springer EAI SICC book series; selected papers invited to the Springer MONET journal and EAI Endorsed Transactions journals
- Hybrid conference with three submission tracks (main, final and last)
- Not listed in ICORE2026
