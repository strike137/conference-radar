notes:
- Small German research conference on machine learning for cyber-physical systems and industrial automation
- Hosted by Fraunhofer IOSB, Helmut Schmidt University (HSU), Hamburg University of Technology (TUHH) and the PEM chair of RWTH Aachen
- Peer-reviewed; accepted papers are published by Helmut Schmidt University Press (openHSU) with a DOI; the 2023 edition was published by Springer
- For 2027 authors submit a two-page extended abstract first and a full paper of up to 15 pages for the proceedings after acceptance
- Held at the Fraunhofer Forum in Berlin since 2024 (Hamburg 2023)
- The 10th edition in 2027 runs jointly with the 1st Machine Learning for Defence (ML4D) conference on the following day
- Papers of a commercial nature are not considered
- Not listed in ICORE2026 or the CCF 2026 list
