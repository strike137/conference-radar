organizer: PVUW organizing committee (2026 organizers from Fudan University, Meta AI, Shanghai University of Finance and Economics, Beijing Jiaotong University, University of Oxford and others); co-located with CVPR
organizer_country: [international]
proceedings: CVPR Workshops proceedings (CVF Open Access, IEEE Xplore)
