id: pvuw
name: PVUW
full_name: Pixel-level Video Understanding in the Wild Workshop and Challenge
type: workshop
tier: minor
areas: [vision, ai]
region: north-america
language: english
frequency: annual
organizer: Workshop organizing committee led by Henghui Ding (Fudan University), with organizers from Meta AI, Shanghai
  University of Finance and Economics, Beijing Jiaotong University, University of Oxford and others; co-located with CVPR
organizer_country: [china]
proceedings: CVPR Workshops proceedings (CVF Open Access)
archival: true
typical:
  deadline_months: [3]
  conference_months: [6]
links:
  website: https://pvuw.github.io/
notes:
- Workshop plus challenge on video segmentation (MOSEv2 complex video object segmentation, MeViSv2 text- and
  audio-based referring motion expression segmentation)
- Held with CVPR; 2026 was the 5th edition (Denver), after Nashville 2025, Seattle 2024 and earlier editions in 2021 and 2023
- Regular papers are 8 pages in CVPR format, double-blind review, submitted through OpenReview
- Accepted papers appear in the official CVPR Workshops proceedings and the CVF Open Access archive
- Separate, later deadline for challenge papers
- Deadlines are 23:59 UTC
- Not listed in ICORE2026 or the CCF list
