links:
  website: https://pvuw.github.io/
notes:
- Workshop and challenge on video segmentation (video object segmentation, referring and audio-guided video segmentation, video scene parsing)
- Held with CVPR (Seattle 2024, Nashville 2025, Denver 2026); 2026 was the fifth PVUW challenge
- "2026 challenge tracks: MOSEv2, MeViSv2-Text and MeViSv2-Audio"
- Regular papers up to 8 pages in the CVPR format, double-blind review on OpenReview; separate deadline for challenge papers
- Accepted papers go into the CVPR Workshops proceedings and CVF Open Access
- Not listed in ICORE2026 or the CCF list
