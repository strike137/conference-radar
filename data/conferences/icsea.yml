notes:
- Organized by IARIA as part of the SoftNet congress, co-located with ICSNC and other IARIA events (21st edition in 2026)
- Published open access in the IARIA ThinkMind library (ISSN 2308-4235); selected papers invited to IARIA journals
- CORE C (ICORE2026); not on the CCF 2026 list
- IARIA events are generally regarded as low-selectivity
- Usually held in Spain, Portugal or Italy; onsite and online participation offered
