notes:
- IEEE conference on smart IoT and cyber-physical systems, started 2017 in Dalian; 10th edition in 2026
- Held mostly in China (Dalian, Xi'an, Tianjin, Beijing, Suzhou, Xining, Shenzhen, Shenyang); exceptions were Jeju
  2021 and Sydney 2025
- Proceedings by IEEE CS Press in IEEE Xplore, EI indexed; regular papers up to 8 pages, poster papers 2 pages;
  ten tracks including security and privacy for IoT/CPS
- Authors of about half of the papers are invited to journal special issues (IEEE IoT Journal, IEEE Network, Sensors
  and others); 2026 track co-chairs included Yuto Lim (JAIST)
- Deadlines were extended in 2024, 2025 and 2026 (by 10 days to a month); author registration costs 700 to 900 USD
  per paper
