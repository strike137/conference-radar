notes:
- Annual AI and data science conference organized by the Faculty of Computer and Mathematical Sciences, UiTM Perak Branch, Malaysia; 7th edition in 2026
- Co-organizer changes each year (BINUS University and UTAR in 2025, Universiti Malaysia Sabah in 2026)
- Technically co-sponsored by the IEEE Computer Society Malaysia Chapter (2026)
- Accepted papers are submitted to IEEE Xplore and forwarded for Scopus indexing; the official site links the IEEE Xplore proceedings of earlier editions
- Hybrid conference (virtual and in-person); registration and submission through the ConfBay system
- Not listed in ICORE2026; a small regional venue
