id: iciibms
name: ICIIBMS
full_name: International Conference on Intelligent Informatics and BioMedical Sciences
type: conference
tier: minor
areas: [ai, vision]
region: japan
language: english
frequency: annual
organizer: OIST, University of the Ryukyus and National Institute of Technology Okinawa College; technically co-sponsored by IEEE Fukuoka Section
organizer_country: [japan]
proceedings: IEEE Xplore
archival: true
indexing: [EI Compendex, Scopus]
typical:
  deadline_months: [8, 9]
  conference_months: [11, 12]
links:
  website: http://www.iciibms.org/
notes:
- Broad conference on image processing, AI, robotics, bioinformatics and medical technology, held since 2015
- Mostly held in Okinawa (2015, 2017, 2020 and 2025 in Okinawa); 2018 edition in Bangkok and 2022 edition in Nara
- Proceedings of the 2015 to 2025 editions in IEEE Xplore (EI and Scopus indexed per the site)
- Selected papers recommended for ASCSPub journals
- Separate deadlines for on-site and virtual presentation; short papers and posters also accepted
- "Fee: US$400 general, US$300 student (2026, early on-site)"
- The 12th edition (2027) is announced for Bangkok, Thailand
- Not listed in CORE ICORE2026 or the CCF 2026 list
