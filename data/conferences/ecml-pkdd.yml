notes:
- Flagship European machine learning and data mining conference, held in Europe every late August or September
- Research and Applied Data Science tracks share one March deadline (abstract a week earlier); double-blind; 16
  pages including references in Springer LNCS format
- 'Journal track with earlier deadlines (October and January for 2026): papers are reviewed by Machine Learning
  or DMKD (single-blind) and presented at the conference'
- Registration was capped at 1,500 in 2026; in-person presentation required
