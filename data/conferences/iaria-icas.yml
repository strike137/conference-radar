notes:
- Organized by IARIA as part of the InfoSys congress, co-located with ICNS, ENERGY, DBKDA, SIGNAL and other IARIA events (23rd edition in 2027)
- Covers autonomic computing, self-adaptive and self-organizing systems and autonomous robots
- Published open access in the IARIA ThinkMind library (ISSN 2308-3913); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Spain, Italy, Greece or Portugal (Valencia, Venice, Barcelona, Athens, Lisbon in recent years)
- Onsite and online participation options offered in 2026; the 2027 edition moves to May
