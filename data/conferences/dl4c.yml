notes:
- Workshop on machine learning for code, LLM coding agents, code benchmarks and human-AI interaction for programming
- Five editions so far, at ICLR 2022 (virtual), ICLR 2023 (Kigali), ICLR 2025 (Singapore), NeurIPS 2025 (San Diego) and ICML 2026 (Seoul)
- Non-archival, so dual submission is allowed; double-blind review on OpenReview
- Regular papers up to 8 pages and short papers up to 4 pages in ICML format
- Not listed in ICORE2026 and not on the CCF list
