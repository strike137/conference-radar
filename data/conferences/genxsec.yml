notes:
- Workshop of the IEEE International Conference on Cyber Security and Resilience (IEEE CSR)
- First listed in 2026; not among the IEEE CSR 2023 to 2025 workshops in the site archive
- Topics are generative AI and explainable AI for network traffic analysis, intrusion detection and resilient network security
- Workshop chairs from University of Naples Federico II (Antonio Pescape group) and Pegaso Telematic University
- Papers go into the IEEE CSR proceedings in IEEE Xplore; 6 pages plus up to 2 extra pages with overlength charges
- In person only; one session on Monday 3 Aug in 2026
- Not listed in CORE ICORE2026 or the CCF list
