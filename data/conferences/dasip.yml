notes:
- Workshop on signal, image and video processing and machine learning on custom embedded, edge and cloud
  architectures (FPGAs, SoCs, NoCs, HW/SW co-design, high-level synthesis)
- Running since 2007 (Grenoble); standalone in Europe and Canada until 2019, co-located with the HiPEAC
  conference since 2021
- Proceedings in Springer LNCS since 2022; full papers up to 12 pages in LNCS format, no short paper track
- Two submission cycles; papers accepted in the preliminary cycle are accepted for the main cycle, rejected ones
  can be resubmitted with the reviews
- Double-blind review with at least three reviews per paper; submission via HotCRP
- HiPEAC registration is required; one author per paper must pay the full registration fee
- Selected DASIP 2026 papers were invited to an extended version in Elsevier's Journal of Systems Architecture
- Not in the CORE portal (ICORE2026) and not in the CCF 2026 list
