notes:
- Workshop on signal, image and video processing and machine learning on embedded, edge and cloud architectures, held since 2007
- Co-located with the HiPEAC conference since 2021 (January, Europe)
- Proceedings in Springer LNCS since 2022 (2021 edition in the ACM ICPS)
- Two submission cycles (preliminary and main); papers rejected in the preliminary cycle can be resubmitted to the main cycle
- Full papers up to 12 pages in LNCS format, double-blind, at least three reviews; no short paper track
- Submission through OpenReview; at least one author must pay the full HiPEAC registration
- Not listed in CORE ICORE2026 or the CCF 2026 list
