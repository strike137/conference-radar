links:
  website: https://foiks2026.github.io/
notes:
- Biennial symposium on theoretical foundations of information and knowledge systems (databases, logic, knowledge representation, reasoning)
- Proceedings in Springer LNCS (FoIKS 2022, 2024 and 2026 volumes)
- Long papers 16 pages and short papers 10 pages in LNCS format, plus references; single-blind review
- Each participant is asked to prepare a first response to another paper to start discussion
- Selected papers invited to a special issue (Information and Computation for 2026)
- Held in Europe (Linz 2016, Budapest 2018, Dortmund 2020, Helsinki 2022, Sheffield 2024, Hanover 2026)
- Not listed in CORE ICORE2026 or the CCF 2026 list
