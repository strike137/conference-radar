notes:
- One-day international conference of Kantipur Engineering College, Dhapakhel, Lalitpur, Nepal
- Held since 2018; the 8th edition took place in 2026
- Streams are civil engineering plus computer and electronics engineering; about half the papers are civil
- 2026 papers published open access as a special issue of InJET, the college journal on NepJOL
- Papers reviewed by national experts; 43 papers presented in 2026
- Includes partner symposia (traffic and transportation engineering in 2025 and 2026)
- Not listed in ICORE2026 or the CCF 2026 list
