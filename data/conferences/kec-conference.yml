notes:
- One-day conference run by Kantipur Engineering College, Dhapakhel, Lalitpur, Nepal, held on campus every year since 2018
- Broad engineering scope; papers are split between civil engineering and computer, electronics and electrical engineering,
  with AI and machine learning papers common on the computing side
- Includes partner symposia (traffic and transportation with SSTN and SoTEN; environment, energy and water with CREEW)
- Proceedings with an editorial and per paper page numbers posted on the college website only; no ISSN, ISBN or
  digital library listed for recent editions (a faculty CV on the site cites an ISBN for the 1st edition, 2018)
- 2025 -> 34 papers presented; 2026 -> 43 papers plus 7 symposium papers
- Aimed largely at students and faculty of Nepali engineering colleges
- Not listed in ICORE2026 or the CCF list
