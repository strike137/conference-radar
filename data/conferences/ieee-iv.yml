- Conference papers in IEEE Xplore; workshop papers go to a separate IEEE IV Workshops Proceedings in IEEE Xplore
- Held in June and rotates worldwide (Cluj-Napoca 2025, Detroit 2026, Perth 2027, Barcelona 2028)
