notes:
- Workshop on explainability, dependability and trustworthiness of software and AI-driven systems (testing, verification, monitoring, interpretability)
- Started in 2025 with ISSTA 2025 in Trondheim, Norway; 2nd edition with SPLASH/ISSTA 2026 in Oakland, California
- Organizers and steering committee mostly from Chinese universities and industry (Ant Group, Tsinghua, CUHK) plus UNSW Sydney
- Full papers up to 8 pages, work-in-progress and industry/tool papers up to 4 pages, ACM sigconf format, double-blind, HotCRP
- Accepted full papers are published by ACM; work-in-progress and industry/tool papers may opt out of ACM publication
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
