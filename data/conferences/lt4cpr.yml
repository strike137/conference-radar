notes:
- First edition in 2026, co-located with AACL-IJCNLP 2026 in Hengqin, Zhuhai, China; hybrid
- Speech and language technology for crisis preparedness, crisis response, crisis communication and disaster risk reduction
- Archival papers up to 8 pages and non-archival papers; double-blind review on OpenReview; ARR commitment also accepted
- Separate talk proposal and field report track for NGOs, humanitarian organizations and practitioners
- Shared task on automatic situation report generation from crisis-related social media messages
- Proceedings in the ACL Anthology (15 papers in 2026); supported by the US National Science Foundation
- Not listed in ICORE2026 and not on the CCF list
