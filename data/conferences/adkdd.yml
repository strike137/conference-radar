links:
  website: https://www.adkdd.org/
notes:
- Full-day workshop on computational advertising co-located with ACM SIGKDD (KDD), held in some form since 2007
- Merged with TargetAd in 2017 and 2018; organized mostly by industry researchers
- Short papers up to 6 pages including references in ACM format; single-blind review
- Since 2025 accepted papers are published by Springer in the CCIS volume Computational Advertising; all papers are also archived on the AdKDD website
- At least one author must attend in person and present; registration is through the main KDD conference only
- Usually standing room only according to the organizers
- Not listed in ICORE2026 or the CCF list
