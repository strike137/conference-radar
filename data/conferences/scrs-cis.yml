notes:
- Run by the Soft Computing Research Society (SCRS, New Delhi), which organizes many hybrid conferences each year with Indian host institutions
- After-conference proceedings in Springer Lecture Notes in Networks and Systems (LNNS); six volumes for CIS 2025
- Hybrid (in-person and online); hosted mostly in India (CHRIST Bengaluru 2021 to 2024, IETE Delhi 2025, NIT Warangal 2026, BITS Pilani Goa 2027)
- 7th edition in 2026; submission via Microsoft CMT
- High-volume event; not listed in CORE ICORE2026 and not on the CCF list
