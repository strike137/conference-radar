links:
  website: https://aisnet.org/conferences/ecis/
notes:
- AIS premier conference for Region 2 (Europe, the Middle East and Africa), governed by the AIS Region 2 Board; first held in 1993
- Information systems (business school) venue rather than core CS
- About 1,200 paper submissions a year (AIS); proceedings in the AIS eLibrary
- Completed research papers up to 16 pages, short research papers up to 8 pages; TREO extended abstracts up to 3 pages
- Usually held in Europe (Kristiansand 2023, Paphos 2024, Amman 2025, Milan 2026, Luxembourg 2027, Dublin 2028)
- Last listed in CORE2018 (rank A); not in ICORE2026 or the CCF list
