id: isc
name: ISC
full_name: Information Security Conference
type: conference
tier: minor
areas: [security, crypto]
region: worldwide
language: english
frequency: annual
organizer: ISC Steering Committee (hosted by a local university each year)
organizer_country: [international]
proceedings: Springer LNCS
indexing: [DBLP, Scopus, EI]
rank:
