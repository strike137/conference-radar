  conference_months: [10]
links:
  website: https://isc2026.github.io/
  dblp: https://dblp.org/db/conf/isw/index.html
notes:
- Running since 1997; first held as the Information Security Workshop (ISW'97) in Tatsunokuchi, Ishikawa, Japan;
  proceedings in Springer LNCS
- Anonymous submission, up to 16 pages excluding bibliography and appendices (20 pages total); the 2025 edition
  had a rebuttal phase
- Location rotates worldwide; held in Groningen (2023), Arlington (2024), Seoul (2025) and Rennes (2026)
- CORE C and CCF C; acceptance rate around 28 to 36% (33/120 in 2024, 28/77 in 2025)
