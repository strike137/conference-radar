notes:
- Biennial NLP conference in Sofia, held since 2014, with a focus on small and less-resourced languages such as Bulgarian
- Run by the Department of Computational Linguistics of the Institute for Bulgarian Language (Bulgarian Academy of Sciences)
- Long (8 pages) and short (4 pages) papers with double-blind review by at least two reviewers; an abstract is due a month before the paper
- Proceedings are open access, included in the ACL Anthology and indexed in Scopus since 2020 and in Web of Science
- Includes a special session on wordnets, framenets and ontologies, plus tutorials and workshops
- Not listed in ICORE2026 and not on the CCF list
