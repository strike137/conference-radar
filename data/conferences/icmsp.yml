id: icmsp
name: ICMSP
full_name: International Conference on Intelligent Control, Measurement and Signal Processing
type: conference
tier: minor
areas: [communications, ai]
region: china
language: english
frequency: annual
organizer: Xi'an Shiyou University (School of Instrumentation and Intelligent Control) with oil industry partners such as China Oilfield Services Limited
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 570 USD or 3800 CNY per 4-page paper (2026); 540 USD for IEEE IES members; 60 USD per extra page; attendee without paper 225 USD
typical:
  deadline_months: [8]
  conference_months: [11]
links:
  website: http://www.icmsp.net/
notes:
- Annual since 2019 and held in China, mostly at Xi'an Shiyou University in Xi'an (Hangzhou 2022, Chengdu 2023)
- Focus on intelligent control, optoelectronic measurement and signal processing with an oil and gas (intelligent oilfield) angle
- 2026 proceedings published by IEEE and submitted to IEEE Xplore, EI Compendex and Scopus; papers are at least 4 pages
- Early editions were co-organized with the AEIC Academic Exchange Information Center conference service
- Large attendance for its size (over 400 participants in 2024 and 2025 according to the site)
- Abstract-only presenter and listener registration offered
- Not listed in CORE ICORE2026 or the CCF list
