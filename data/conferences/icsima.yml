notes:
- Flagship conference of the IEEE Instrumentation and Measurement Society Malaysia Chapter; 12th edition in 2026
- Mostly held in Malaysia (Melaka 2022, Kuala Lumpur 2023 and 2025, Kuching 2026), with Bandung, Indonesia in 2021 (virtual) and 2024
- Scope covers instrumentation, measurement, sensors, control, industrial and biomedical instrumentation, and AI for measurement
- Regular papers of 4 to 6 pages via EDAS; accepted, registered and presented papers go to IEEE Xplore (Scopus indexing stated by the IEEE Malaysia Section)
- Paper must be presented in person by an author to be sent to IEEE Xplore; similarity score must be below 30%
- Submission deadline is usually extended one or more times
- Not listed in ICORE2026 and not on the CCF list
