notes:
- Started as a symposium in 2020 (Nanjing, alongside SpaCCS 2020); held in China except 2021 (Copenhagen)
- 'Very small: 10 papers from 38 submissions in 2025, 18 from 52 in 2024'
- Proceedings in Springer CCIS; up to 20 pages in LNCS/CCIS format; at least three reviewers per paper; not double-blind
  (author list included in 2025 submissions)
- Hybrid event with remote presentation possible; best paper award and journal special issue invitations
