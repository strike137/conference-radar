notes:
- Security BSides conference in Knoxville, Tennessee, USA, run by the local nonprofit 10-Sec, Inc. with volunteer organizers
- The 2026 edition was the twelfth annual event, held on a Friday in May
- Two tracks in downtown Knoxville, at The Mill & Mine music venue and Regas Square Events
- Lockpick village by Fox Pick and a Splunk Boss of the SOC CTF; talks are posted on YouTube afterwards
- Tickets sold through Eventbrite, schedule on Sched; no proceedings
