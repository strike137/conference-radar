notes:
- One-day workshop co-located with ACM CCS since 2009; location follows CCS (2023 Copenhagen, 2024 Salt Lake City,
  2025 Taipei)
- Proceedings in the ACM Digital Library (e.g. 2025 volume doi 10.1145/3733812)
- Full papers up to 12 pages in double-column ACM format, excluding bibliography and appendices; anonymous submission
- Topics cover all security aspects of cloud and outsourced computing (virtualization, attestation, outsourced data and
  computation, side channels, applied crypto for the cloud); panel proposals also solicited
- Small program (6 papers plus 2 keynotes in 2025); not listed in ICORE2026
