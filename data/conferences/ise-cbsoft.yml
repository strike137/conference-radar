notes:
- Brazilian workshop on AI for software engineering and software engineering for AI systems, co-located with CBSoft; 5th edition in 2026
- Editions in 2021, 2022, 2023, 2025 and 2026 (no 2024 edition)
- Technical papers up to 6 pages, industry and emerging results papers 2 to 4 pages, ACM two-column format, Portuguese or English (English encouraged)
- Double-blind review with at least two PC reviewers; submission via JEMS
- Accepted papers published in SBC OpenLib (SOL) with a DOI per paper; best papers invited to JSERD
- Not listed in CORE ICORE2026
