notes:
- Official scientific conference of the IEEE Joint RA/IM/CS Lebanon Chapter and the Lebanese IFAC Chapter; 2027 is the second edition
- Technical co-sponsors for 2027 are IEEE RAS, IEEE CSS, IEEE IMS, IFAC and the IEEE Lebanon Section
- Proceedings in IEEE Xplore (2025 volume online); the site states Scopus and EI Compendex indexing
- Single-blind review by at least two TPC members; IEEE two-column papers of 4 to 6 pages, submitted via EDAS
- At least one author per accepted paper must register at the full rate and present
- Held in Lebanon so far (La Sagesse University, Beirut 2025; LAU Byblos 2027); two years between the first two editions
- Topics cover control theory, industrial automation, robotics, instrumentation, AI and machine learning in control, IoT
- Not listed in ICORE2026; not on the CCF list
