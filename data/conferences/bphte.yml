notes:
- Workshop on HPC training and education practice, held with IEEE/ACM SC every year since 2014; 2026 is the thirteenth edition
- Coordinated by the ACM SIGHPC Education Chapter
- Three-stage submission -> two-page extended abstract, then full paper (up to 8 pages, JOCSE template), then presentation
- Papers, extended lightning talks and demo abstracts are published in a special issue of the Journal of Computational Science Education, not in the SC Workshops Proceedings
- At least three reviewers per submission, with a rebuttal phase; reproducibility is a review criterion
- SC26 lists it among the workshops with non-SC proceedings
- Not listed in CORE ICORE2026
