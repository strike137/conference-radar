notes:
- Latin American edition of the IEEE PES ISGT smart grid conference series, held every two years since 2011
- Rotates around Latin America (2017 Quito, 2019 Gramado, 2021 Lima, 2023 San Juan, 2025 Panama City)
- Topics include transformation of the electrical system through smart technologies, energy storage and digitalization
- Proceedings published by IEEE (IEEE Xplore, print on demand via Curran)
- Not listed in the CORE ICORE2026 portal
