notes:
- One of six theme conferences of the IEEE World Congress on SERVICES (with CLOUD, EDGE, ICWS, QSW and SSE), sponsored
  by IEEE and the IEEE Computer Society and supported by the IEEE Technical Community on Services Computing
- 'Digital health technologies: sensors and wearables, Internet of Medical Things, remote patient monitoring, AI and generative AI for health, telemedicine'
- Proceedings published by the IEEE Computer Society Press; the CFP says they are indexed by PubMed and DBLP
- Every submission reviewed by at least three reviewers
- 'Rotates worldwide with the congress: Helsinki (2025), Sydney (2026)'
- Has its own, later submission deadline than the other SERVICES conferences (2026 deadline extended to 2026-04-11)
- Not listed in CORE ICORE2026 or the CCF 2026 list
