notes:
- One of six conferences in the IEEE World Congress on SERVICES (with CLOUD, EDGE, ICWS, QSW and SSE), sponsored by IEEE and the IEEE Computer Society
- Covers health sensing platforms, remote patient monitoring, AI and foundation models for healthcare, and health data policy and privacy
- 'Rotates worldwide with the congress: Helsinki (2025), Sydney (2026)'
- Proceedings by IEEE Computer Society Press in IEEE Xplore, also indexed by PubMed and DBLP; optional hybrid open access APC of 640 USD (members) or 800 USD (non-members) in 2026
- At least three reviewers per paper; regular papers 7 to 10 pages plus references, short papers 4 to 6 pages plus references
- Not in ICORE2026 and not on the CCF list
