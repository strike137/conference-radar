notes:
- Workshop on time series and temporal data analysis, held with ECML PKDD since 2015; 11th edition in Naples 2026
- Accepted papers are posted on the workshop website; since the 4th edition extended versions of selected papers appear in a standalone AALTD volume of Springer LNAI
- Papers 6 to 16 pages, LNCS style; double-blind review by at least two PC members
- Abstract registration one week before the paper deadline; deadlines in Pacific Time
- 2026 had about 50% more submissions than the year before
- At least one author must register for ECML PKDD
- Not listed in CORE ICORE2026
