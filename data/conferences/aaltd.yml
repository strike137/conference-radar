organizer: Workshop organizing committee (2026 organizers from University of Southampton, University College Dublin,
  Universite de Haute-Alsace, Orange Labs, Universite de Rennes 1 / IRISA and Humboldt University of Berlin); co-located
  with ECML PKDD
organizer_country: [europe]
proceedings: Springer LNAI (LNCS) post-proceedings
archival: true
typical:
  deadline_months: [6]
  conference_months: [9]
links:
  website: https://ecml-aaltd.github.io/aaltd2026/
notes:
- ECML PKDD workshop on time series and temporal data (classification, clustering, forecasting, anomaly detection,
  representation learning)
- Held every year with ECML PKDD since 2015 (no 2017 edition); 2026 was the 11th edition
- Papers of 6 to 16 pages in LNCS format, double-blind review by at least 2 PC members, submitted via CMT
- Accepted papers are posted online; revised selected papers appear in a standalone Springer LNAI volume after the event
  (AALTD 2024 -> LNCS volume 15433)
- Abstract deadline about a week before the paper deadline; deadlines in Pacific Time
- 2026 had about 50% more submissions than 2025, per the organizers
- Not listed in ICORE2026 or the CCF list
