id: balkancom
name: BalkanCom
full_name: International Balkan Conference on Communications and Networking
type: conference
tier: minor
areas: [communications, networking]
region: europe
language: english
frequency: annual
organizer: BalkanCom steering committee with a rotating Balkan host institution; technically co-sponsored by IEEE ComSoc
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [2, 3, 4]
  conference_months: [6]
links:
  website: https://www.balkancom.info/2026/
notes:
- Technically co-sponsored by IEEE ComSoc (2024 also by the IEEE Slovenia Section); accepted papers go to IEEE Xplore
- Full papers up to 6 pages in IEEE double-column format, submitted via EDAS; single-blind review with at least three
  reviewers per paper (2025 call)
- General, special session and student session tracks; the general deadline was extended in 2025 (Feb 16 to Mar 24)
  and in 2026 (to Apr 13)
- Rotates around the Balkans in June (Istanbul 2023, Ljubljana 2024, Piraeus 2025, Ulcinj 2026)
- Not listed in the CORE ICORE2026 portal; a small regional venue
