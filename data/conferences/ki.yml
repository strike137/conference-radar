notes:
- Annual AI conference of the German Informatics Society (GI); held in English; KI 2026 was the 49th edition
- Proceedings in Springer LNAI; full papers up to 12 pages and technical communications up to 6 pages, excluding
  references; single-anonymized review via EasyChair (2025, 2026)
- Also accepts short summaries of papers already accepted at other venues (not a new publication)
- Held in Germany; often attached to a larger event (with INFORMATIK 2025 in Potsdam; the week before IJCAI-ECAI
  2026 in Bremen)
- CORE National/Regional (ICORE2026)
