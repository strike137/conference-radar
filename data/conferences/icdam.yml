notes:
- Annual conference since 2020 (virtual 2020 to 2022 with Polish partners, hybrid at London Metropolitan University since 2023)
- Accepted papers (double-blind review) published in Springer Lecture Notes in Networks and Systems (LNNS); selected extended papers go to journal special issues
- Hybrid format with mostly online sessions (2026 had 2 in-person and 24 online technical sessions); 40% registration discount for online presentation
- Very large volume; the site reports more than 2,000 submissions and about 20% acceptance in 2026, proceedings in 10 volumes
- Joint convener Ashish Khanna (India); general chair from London Metropolitan University
- Not found in ICORE2026; not on the CCF list
