notes:
- Official event of IFIP TC 11 WG 11.12; co-sponsored by the Emerald journal Information & Computer Security
- Usable and human-centred security symposium held since 2007 (virtual in 2020 and 2021); 2027 is the 21st edition
- Proceedings published by Springer and indexed in Google Scholar and DBLP; selected papers considered for Information
  & Computer Security
- Full papers up to 14 pages including references in Springer format; double-blind review by at least three PC members
- Mostly held in Europe (Mytilene 2022 and 2025, Canterbury 2023, Skövde 2024, Örebro 2026); 2027 is the first edition
  in the USA (Augusta, GA)
- 'CORE: not listed in ICORE2026'
