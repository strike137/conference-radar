notes:
- Annual international symposium of the Korean society IAAI (renamed from IIBC), co-hosted with IPACT (International Promotion Agency of Culture Technology)
- Not the algorithms ISAAC (International Symposium on Algorithms and Computation), which is a separate venue
- Very broad AI/ICT convergence scope (AI, telecom, nano and quantum IT, culture technology, bio IT, energy, safety engineering)
- O2O format; papers are presented onsite (oral or poster) or online as a submitted mp4 video
- Summary (up to 2 pages) or full paper (up to 6 pages) in English; accepted papers go into the AACL conference proceedings, published as a PDF on the IAAI notice board
- Extended papers can be recommended to the society journals IJIBC and IJASC or to IPACT's IJACT free of charge
- Held together with the IAAI domestic conference, ICACT and student contests; acceptance notification comes days after the deadline (2025 one week, 2026 the same day as the extended deadline)
- Held in Korea every year (Seongnam 2022, Jeju 2023, Seoul COEX 2024, Incheon Songdo Convensia 2025, Seoul SNUST 2026)
