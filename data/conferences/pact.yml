notes:
- Long-running venue at the intersection of computer architecture and compilers, with a focus on parallelism
- Supported by ACM and IEEE; accepted papers are published in both the ACM Digital Library and IEEE Xplore
- ACM open access policy applies; authors outside ACM Open institutions may face an APC
- Research papers and Tools and Practical Experience (TPE) papers, 10 pages plus references, double-blind with a
  rebuttal
- Optional artifact evaluation; ACM Student Research Competition and workshops/tutorials co-located
- At least one author of each accepted paper must attend in person
- Held in Vienna 2023, Long Beach 2024, Irvine 2025 and Chicago 2026
- 43 technical papers in 2026
- CORE B (ICORE2026), CCF B
