id: icaip
name: ICAIP
full_name: International Conference on Advances in Image Processing
type: conference
tier: minor
areas: [vision]
region: online
language: english
frequency: annual
organizer: Host Chinese universities (East China Normal University and Southwest Jiaotong University in 2026); secretariat
  at chairmen.org
organizer_country: [china]
proceedings: SPIE Proceedings (SPIE Digital Library) since 2025; ACM ICPS (ACM DL) 2017 to 2024
archival: true
indexing: [EI, Scopus]
typical:
  deadline_months: [10]
  conference_months: [10, 11]
links:
  website: http://www.icaip.org/
notes:
- Held since 2017; 10th edition in 2026
- 2020 to 2025 editions were held virtually; 2026 edition in Shanghai, co-sponsored by East China Normal University
  and Southwest Jiaotong University
- Proceedings in ACM ICPS through 2024, SPIE Proceedings from 2025; stated as indexed by EI Compendex and Scopus
- Abstract-only submissions accepted for presentation without publication; submission via zmeeting
- Short gap between deadline and conference (about four weeks in 2026); not ranked by CORE or CCF
