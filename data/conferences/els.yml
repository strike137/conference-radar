links:
  website: https://european-lisp-symposium.org/
notes:
- Forum for Lisp and Lisp-inspired languages (Common Lisp, Scheme, Racket, Clojure, Emacs Lisp and others)
- Two-day single-track event held in a different European city each year, with online participation and streamed talks
- Submission types are papers (up to 8 pages), experience reports (up to 6 pages), tutorials and demonstrations (abstracts up to 4 pages)
- "Proceedings are self-published as a PDF with an ISBN (2025: 978-2-9557474-9-0); papers also go to the ELS Zenodo community with DOIs"
- Recent editions in Porto 2022 (co-located with ‹Programming›), Amsterdam 2023, Vienna 2024, Zurich 2025 and Krakow 2026
- Single-blind peer review with at least 3 reviews per submission and a revision round for potentially acceptable papers
- Proceedings indexed in DBLP; no open access fees
- Not listed in ICORE2026 or the CCF 2026 list
