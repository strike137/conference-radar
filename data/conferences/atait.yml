notes:
- Small IoT symposium run by the VLSI Center of Ritsumeikan University, supported by the IEEE CEDA All Japan Joint Chapter
- Topics include IoT networking and security, processor architecture, FPGAs and GPUs, embedded software, image processing and machine learning for IoT
- Held in Kusatsu, Shiga (Ritsumeikan BKC) every year since 2019; the first edition (2018) was in Ibaraki, Osaka; 2021 was virtual
- Proceedings in CEUR-WS (Vol-3198 for 2022, Vol-3459 for 2023, Vol-3748 for 2024, Vol-4082 for 2025)
- Selected papers invited to extend for MDPI journal special issues (Drones, Sensors)
- Papers 5 pages minimum in the one-column CEUR template, submitted via EasyChair
- Not listed in CORE ICORE2026
