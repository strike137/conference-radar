notes:
- Security BSides conference in Groningen, the Netherlands, held at Kinepolis Groningen; first edition in 2025
- Organized by the non-profit foundation Stichting Cyber Friendly
- 2026 edition had about 230 participants, more than 80 talk submissions and four tracks (technical, governance and compliance, AI, workshops)
- Talks in English (preferred) or Dutch; call for papers on Sessionize, scored by a review board
- Travel and accommodation costs of speakers are not covered; sales pitches are rejected
- Talks only, no proceedings
