notes:
- Co-located workshop of ICCCN, held every year since 2021 (6th edition in 2026)
- Follows ICCCN; 2025 in Tokyo, 2026 in Honolulu, ICCCN 2027 is in Rome
- Topics are big data and machine learning for network management, traffic prediction, security, IoT, 5G/6G and edge/cloud networking
- 6-page papers in IEEE format via EasyChair; accepted and presented papers appear in the ICCCN proceedings and IEEE Xplore
- One author must register at the full rate and present in person
- Not listed in ICORE2026
