notes:
- The only AIS conference dedicated to the Pacific Asia region, governed by the AIS Region 3 Board; first held in
  1993 (Kaohsiung), annual since 2000, usually early July
- Information systems (business school) venue rather than core CS; 2026 tracks include AI and machine learning,
  data analytics, and digital security, privacy, ethics and resilience
- Registration requires current AIS membership; at least one author per paper must register and present
- Last listed in CORE2018 (rank A); not in ICORE2026 or the CCF list
- 'Upcoming hosts: Auckland 2027, Kaohsiung (Taiwan) 2028, Ningbo 2029 (tentative); 2026 offered fast-track options
  to PAJAIS and AIS THCI'
