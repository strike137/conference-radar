id: cimss
name: CIMSS
full_name: International Workshop on Critical Infrastructure and Maritime Systems Security
type: workshop
tier: minor
areas: [security, systems]
region: worldwide
language: english
frequency: annual
organizer: ACNS satellite workshop; 2026 program chairs Awais Yousaf (iTrust, SUTD, Singapore) and Victor Bolbot
  (Novia University of Applied Sciences, Finland)
organizer_country: [singapore, europe]
proceedings: Springer LNCS
archival: true
fee: About 750 USD early-bird (2026, ACNS 2026 registration)
typical:
  deadline_months: [1, 3]
  conference_months: [6]
links:
  website: https://cimss2026.github.io/
notes:
- ACNS satellite workshop held every year since 2021 (6th edition in 2026)
- Renamed in 2026; editions 2021 to 2025 were titled Critical Infrastructure and Manufacturing System Security
- 'Topics: attacks, intrusion detection, forensics, risk management and cryptographic tools for critical
  infrastructure, ICS and maritime systems'
- Two submission cycles (January and March); anonymous submission, LNCS format up to 20 pages including references;
  work-in-progress papers welcome
- Papers appear in the ACNS workshops post-proceedings in Springer LNCS
- Small workshop; 3 papers plus a keynote in the 2026 program
- Eligible for the ACNS best workshop paper award (EUR 500)
