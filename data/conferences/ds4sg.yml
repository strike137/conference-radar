notes:
- Satellite workshop of SBBD, the Brazilian Symposium on Databases run by the Brazilian Computer Society (SBC)
- Data science for social challenges such as public health, public safety, sustainability, misinformation and algorithmic fairness
- Papers of 6 to 10 pages in SBC format, in Portuguese, English or Spanish (English abstract required), submitted via JEMS
- Accepted papers appear in the Anais Estendidos do SBBD (ISSN 2966-3946) in SBC OpenLib (SOL), each with a DOI
- At least one author must register for SBBD and present in person
- Held on the first day of SBBD 2026 in São Carlos
- Not listed in CORE ICORE2026
