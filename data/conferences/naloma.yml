notes:
- Called Natural Logic Meets Machine Learning until 2025; renamed Natural Language Meets Logic and Machine Learning for the 6th edition (2026)
- Workshop on hybrid symbolic and neural methods for natural language understanding and reasoning, with a focus on natural logic
- Editions in 2020, 2021, 2022, 2023, 2025 and 2026; usually co-located with ESSLLI (2023 was at IWCS in Nancy)
- 2025 at ESSLLI in Bochum, 2026 at ESSLLI in Prague; 2020 and 2021 were online
- Long (8 pages), short (4 pages) and demo (6 pages) papers are archival in the ACL Anthology; 2-page extended abstracts are non-archival
- Double-blind review via OpenReview; at least one author must register for ESSLLI
- A JoLLI special issue collected selected work from earlier editions
- Not ranked in ICORE2026 and not on the CCF list
