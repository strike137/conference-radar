notes:
- Workshop of ARES (International Conference on Availability, Reliability and Security), held in Europe every summer
- Formed for ARES 2026 by merging the earlier ARES workshops SCCS (supply chain cyber security) and IWSMA (security
  of mobile applications)
- Submission guidelines are the same as for the ARES conference; ARES and its workshop papers are published in
  Springer LNCS since 2025, workshop papers up to 18 pages including references
- Topics cover supply chain security and regulation (TISAX, NIS2), secure logistics, mobile app and OS security,
  mobile malware, and industrial and vehicular communication
- Chairs from St. Pölten University of Applied Sciences and the University of Vienna (Austria)
- Not listed in CORE ICORE2026
