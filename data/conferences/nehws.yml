notes:
- One-day regional hardware security meeting for students, researchers, practitioners and industry in New England
- Program of keynotes, a panel, long (15 min) and short (5 min) submitted talks, one-minute announcements and a poster session with best poster prizes
- Submissions are non-anonymous one-page talk abstracts, posters or single-slide announcements via EasyChair; original or already published work is accepted
- Talk abstracts appear in online and printed proceedings on the NEHWS website; selected original submissions are invited to a special issue of the Journal of Cryptographic Engineering (JCEN), with separate review
- Held every April since 2021 at a rotating host (Virtual 2021, UMass Amherst 2022, Northeastern 2023, WPI 2024, MIT 2025, Tufts 2026)
- Not listed in CORE ICORE2026 and not on the CCF list
