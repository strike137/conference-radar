notes:
- Workshop on generative AI and ML for streaming media (music, podcasts, video) recommendation, search and content understanding
- Held at WSDM 2026 in Boise, Idaho on February 26, 2026
- Organizers and program committee mostly from industry (Amazon, Spotify, Netflix, YouTube, Disney Streaming)
- Accepted papers published in the WSDM 2026 Companion (workshop) proceedings in the ACM Digital Library
- Previously published or under-review work may be presented but is not included in the proceedings
- No 2027 edition announced as of November 2026
- Not listed in CORE ICORE2026 and not on the CCF list
