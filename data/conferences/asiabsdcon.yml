notes:
- Technical conference for users and developers of FreeBSD, NetBSD, OpenBSD, DragonFlyBSD and macOS/Darwin
- Four days in March -> two days of tutorials and developer summits, then two days of paper sessions
- Papers (2 to 12 pages, IEEE template) are selected by a technical program committee; final papers go
  into the conference's own proceedings, not a formal series
- Held at Tokyo University of Science for most editions; Taipei in 2024 and 2026, back to Tokyo in 2027
- Not held 2020 to 2022 (COVID-19); the planned 2025 Tokyo edition was cancelled
- Travel and hotel support for one speaker per accepted paper has been offered (2024 CFP)
- Not listed in ICORE2026 or the CCF list
