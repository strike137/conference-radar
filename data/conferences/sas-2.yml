notes:
- Long-running venue for static analysis and abstract interpretation (33rd edition in 2026)
- Proceedings in Springer LNCS (LNCS 16977 for 2026)
- Co-located with SPLASH every year since at least 2020 (SPLASH/ISSTA in 2026)
- 'Recent hosts: Chicago (2021), Auckland (2022), Cascais (2023), Pasadena (2024), Singapore (2025), Oakland (2026)'
- Regular papers double-blind, NEAT papers single-blind; no page limit; optional artifact evaluation concurrent with
  review
- 2026 special topics on static analysis and AI and on static analysis and education; Radhia Cousot Young Researcher
  Best Paper Award
- CORE B (ICORE2026); CCF B
- Not to be confused with the Kaspersky Security Analyst Summit (id sas)
