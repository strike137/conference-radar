notes:
- Real-time, network and embedded systems (scheduling, WCET, TSN, real-time OS, mixed criticality); 34th edition in 2026
- Started as a French real-time systems conference and is still usually held in France or nearby Europe (Nantes 2021, Paris 2022, Dortmund 2023, Porto 2024, Pisa 2025, Toulouse 2026)
- Proceedings in Springer LNCS since 2025 (RTNS 2025 site and Springer volume); earlier editions were published in the ACM DL
- Three submission rounds in 2026 (February, June, August); major revision papers can be resubmitted to a later round
- Double-blind review; up to 20 pages of technical content in LNCS format
- Outstanding papers invited to a special issue of the Springer Real-Time Systems journal
- Junior workshop JRWRTC is co-located
- "CORE ICORE2026 rank: National: France (listed as International Conference on Real-Time and Network Systems); not in the CCF list mirror"
