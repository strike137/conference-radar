notes:
- Formal methods meets software engineering; aims to be a flagship formal software engineering venue in Asia
- Steering committee and advisory board mostly from Chinese institutions (ISCAS, Peking, Nanjing, NUDT), plus
  members from Europe, Korea and Microsoft Research
- Proceedings in Springer LNCS; 16 pages max excluding references, double-blind review
- Two submission rounds since 2025 (spring and August); selected papers invited to a journal special issue
- Hosted in China (mainland or Hong Kong) through 2024; 2025 in Oxford, UK, was the first edition outside Asia, and
  2026 is in Singapore
- 'ICORE2026 lists it as National: China; CCF C (theory category)'
- Encourages participation of young researchers and students
