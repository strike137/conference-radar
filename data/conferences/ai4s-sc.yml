notes:
- One-day workshop on AI and ML for scientific applications on HPC systems (scientific foundation models, surrogates, scalable training and inference), held with SC
- 2026 is the 8th edition; held with SC since 2020 except 2021, when it was held with IEEE Cluster
- Technical papers of 5 to 8 pages in IEEE two-column format, single-blind review, submitted through the SC Linklings site
- Accepted papers appear in the SC Workshops Proceedings
- Not the same venue as the IJCAI workshop AI4S (AI for Sustainability, file ai4s-ijcai)
- Not listed in CORE ICORE2026
