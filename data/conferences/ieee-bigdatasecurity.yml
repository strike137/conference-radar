notes:
- Held jointly with IEEE HPSC, IEEE IDS and IEEE SmartCloud; one registration covers all co-located events
- Mostly held in New York (Fordham University in 2026); Jinan, China in 2022
- Hybrid due to visa considerations
- Camera-ready papers go through the IEEE Author's Kit (IEEE CPS) for the conference proceedings
- Regular papers 6 pages included, up to 12 with 150 USD per extra page; short papers 3 (+2); posters 1 (+2)
- 12th edition in 2026; first held in 2015
