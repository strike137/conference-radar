notes:
- Small symposium on logic for computer science, automata theory and game theory applied to the specification and verification of complex systems
- Held every year since 2010, always in Europe (Valletta 2025, Reykjavik 2024, Udine 2023, Aalborg 2026); mostly in Italy in its early years
- Proceedings in EPTCS (Electronic Proceedings in Theoretical Computer Science, open access)
- "Acceptance rate: 52% (2026, 12/23)"
- Each paper reviewed by at least three referees
- Not listed in CORE ICORE2026 and not on the CCF 2026 list
