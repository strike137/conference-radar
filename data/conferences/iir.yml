id: iir
name: IIR
full_name: Italian Information Retrieval Workshop
type: conference
tier: minor
areas: [data, nlp, ai]
region: europe
language: english
frequency: annual
organizer: Italian information retrieval community, hosted by a different Italian university each year
organizer_country: [europe]
proceedings: CEUR-WS
archival: true
fee: Free of charge, advance registration required (2025, 2026)
typical:
  deadline_months: [6, 7, 9]
  conference_months: [6, 9, 11]
links:
  website: https://iir2026.diag.uniroma1.it/
notes:
- Annual national forum of the Italian IR community, held since 2010; 2026 is the 16th edition
- Meant for informal discussion and networking, with a focus on PhD students and early stage researchers;
  international participants welcome
- Full papers (10 pages), short papers (5 pages) and extended abstracts (up to 4 pages, may present already
  published work); English, single-blind review
- Authors choose whether their paper appears in the CEUR-WS proceedings (2025 -> Vol-4026, 2024 -> Vol-3802)
- Held in Italy (Bari 2021, Milan 2022, Pisa 2023, Udine 2024, Cagliari 2025, Rome 2026)
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
