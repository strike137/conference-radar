notes:
- Long-running workshop on building, cleaning and using web corpora, now focused on web data for LLMs and less-resourced languages
- Irregular schedule with long gaps (WaC-9 EACL 2014 Gothenburg, WaC-10 ACL 2016 Berlin, WaC-12 LREC 2020 Marseille, WaC-13 EMNLP 2026 Budapest)
- Endorsed by ACL SIGWAC, the Common Crawl Foundation and the OpenEuroLLM project
- Short (4 pages) and long (8 pages) papers; archival (ACL Anthology) or non-archival at the author's choice; direct OpenReview submission or ARR commitment
- Not ranked in ICORE2026 and not on the CCF list
