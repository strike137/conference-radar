notes:
- Biennial in even years since 1973; the odd-year domestic counterpart is NCS (National Computer Symposium)
- Sponsored by Taiwan's Ministry of Education and NSTC; host rotates (2020 NCKU Tainan, 2022 NTUB Taoyuan, 2024
  NYCU Taipei, 2026 NTUNHS Taipei with NTUB)
- 'Publisher alternates: IEEE CPS in 2020 and 2024, Springer CCIS in 2018, 2022 and 2026 (12-page LNCS format in
  2026)'
- Run as a set of topical workshops; 2024 included Cryptography and Quantum Computing, Cybersecurity Attack, Defense,
  and Resilience, and Mobile and Wireless Networks
- Deadlines are usually extended several times (three extensions in both 2022 and 2024); best paper and best student
  paper awards; participants mostly from Taiwanese universities, a realistic venue for students
