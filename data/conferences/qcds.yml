notes:
- Half-day workshop co-located with ECML PKDD on quantification (class prevalence estimation) and classification under dataset shift
- Follow-up of the Learning to Quantify (LQ) workshop series, with a broader scope that also covers classification under dataset shift
- Non-archival; informal proceedings on the workshop website, so papers can be resubmitted elsewhere
- Accepts original papers and papers already published or under submission elsewhere in 2026
- Up to 16 pages in Springer LNCS format, submitted via EasyChair; in-person presentation required
- Selected papers invited to a special issue of the Data Mining and Knowledge Discovery journal (Springer)
- 2026 program had 8 oral talks and a poster session
- Not listed in CORE ICORE2026
