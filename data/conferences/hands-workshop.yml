id: hands-workshop
name: HANDS
full_name: International Workshop on Observing and Understanding Hands in Action
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: HANDS workshop organizing committee (2026 organizers from University of Birmingham, Shanghai AI Laboratory, NTU, Yale,
  SJTU, Zhejiang University, Meta Reality Labs, University of Tokyo, NUS); co-located with ICCV or ECCV
organizer_country: [international]
proceedings: ICCV Workshops proceedings (IEEE Xplore, CVF Open Access) or ECCV Workshops proceedings (Springer LNCS)
archival: true
typical:
  deadline_months: [6, 7]
  conference_months: [9, 10]
links:
  website: https://hands-workshop.org
notes:
- Half-day workshop on hand perception, hand pose estimation, hand-object interaction and dexterous manipulation, with challenges
- Held with ICCV or ECCV; editions 2015 to 2019 and every year since 2022 (2025 at ICCV Honolulu was the ninth edition)
- Renamed DexHAND ("Observing and Acting as Dexterous Hands") for the ECCV 2026 edition in Malmo, adding robotic dexterous hands
- Full-length papers are anonymized, one-round peer reviewed on OpenReview and go into the host conference workshop proceedings
- Extended abstracts and posters are not peer reviewed and are only shown on the workshop website (non-archival track)
- Not listed in ICORE2026 or the CCF list
