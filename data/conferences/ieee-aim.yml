notes:
- Main IEEE/ASME conference on mechatronics, robotics, dynamic systems modeling and control
- Accepted contributed papers are published in the proceedings and submitted to IEEE Xplore
- Paired with IEEE/ASME Transactions on Mechatronics (TMECH); TMECH/AIM focused section papers are presented at AIM and published in TMECH
- Submissions via PaperCept; late-breaking results posters have a later deadline
- Rotates worldwide (Genova 2026, Calgary 2027)
- Not ranked by ICORE2026 and not on the CCF list
