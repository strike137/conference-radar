notes:
- Chinese-organized conference handled by the AEIC conference agency with a different host university each year; IEEE or IEEE ComSoc technical sponsorship
- Held as ICC until 2023 (3rd edition, Nanchang), renamed ICICC in 2024 (Zhengzhou); 2025 in Nanjing, 2026 in Hangzhou
- Proceedings published by IEEE and submitted to IEEE Xplore, EI Compendex and Scopus for indexing
- Two tracks, intelligent communication systems and intelligent computing; papers at least 4 pages
- Very short review cycle (about 5 days between submission deadline and notification in 2026)
- Not listed in CORE ICORE2026 or the CCF list
