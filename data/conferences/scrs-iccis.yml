notes:
- Technically sponsored by the Soft Computing Research Society (SCRS, New Delhi), which runs many hybrid conferences each year with Indian host institutions
- After-conference proceedings in Springer Lecture Notes in Networks and Systems (LNNS); four volumes for ICCIS 2024
- Hybrid (in-person and online); hosted by MNIT Jaipur (2023), MANIT Bhopal (2024), BITS Pilani Goa (2025, 2026) and NIT Warangal (2027)
- 8th edition in 2026; first held in 2019; submission via Microsoft CMT
- Not the Chinese ICCIS (Communication and Information Systems, iccis-cn)
- Not listed in CORE ICORE2026 and not on the CCF list
