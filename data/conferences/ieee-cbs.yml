notes:
- Sponsored by the IEEE RAS Technical Committee on Cyborg and Bionic Systems; financially co-sponsored by IEEE RAS
- Covers biohybrid robots, bionics, neural interfaces, BCI, exoskeletons, medical and micro/nano robots
- Regular papers 6 pages plus up to 2 extra pages at 150 USD each; at least two reviewers per paper; PaperPlaza
- Regular papers in IEEE Xplore; 2-page late-breaking extended abstracts are not in IEEE Xplore or EI
- Held in China, Japan and Germany (Shenzhen 2018, Munich 2019, Wuhan 2022, Nagoya 2024, Beijing 2025, Munich 2026)
- Not listed in the CORE portal (ICORE2026) or the CCF list
