links:
  website: https://eventi.unibo.it/heteropar2026
notes:
- Workshop on algorithms, programming models, runtimes, scheduling and performance/energy modeling for heterogeneous
  parallel platforms (GPUs, FPGAs, AI accelerators, HPC, cloud and edge)
- Running since 2001; 24th edition in 2026; co-located with Euro-Par every year since at least 2021, so always in Europe
- Revised papers appear in the Euro-Par workshops volume of Springer LNCS after the conference
- LNCS format up to 12 pages including references; papers under 10 pages are short papers, presented but not published
- Single-blind review; submission through the shared Euro-Par workshops EasyChair
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
