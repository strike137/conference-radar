notes:
- Practitioner conference on knowledge graphs, graph databases, semantic technology and graph AI (Graph RAG, agents, ontologies, data products); running since 2016, 10th anniversary edition in 2026
- Masterclass day (2-hour hands-on tutorials) followed by a conference day with keynotes and presentations in three tracks (Nodes for business, Edges for mixed, Educational for technical audiences)
- Call for submissions reviewed by a programme committee; needs a description, speaker profile and a video of up to 3 minutes; vendor presentations are not evaluated
- No papers or proceedings; sessions are live-streamed with replays
- Not listed in the CORE ICORE2026 portal
