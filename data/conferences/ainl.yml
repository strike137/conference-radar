notes:
- Russian NLP and AI conference held since 2012 (no edition in 2021), with a strong industry track and a student session
- Research papers of 10 or more pages in English, double-blind review by at least three PC members via CMT
- 2026 papers use the Zapiski PDMI (Zapiski Nauchnykh Seminarov POMI) style and are to be indexed in RSCI and later Scopus
- AINL 2023 proceedings were announced in Springer CCIS
- Hybrid format; recent editions in Yerevan (2023) and Tomsk (2026)
- At least one author must register and present, preferably in person
- Not ranked in ICORE2026 and not on the CCF 2026 list
