notes:
- Successor of the Computational Imaging (COIMG) track of IS&T Electronic Imaging (2003 to 2026); independent from 2027
- Technically co-sponsored by the IEEE Signal Processing Society
- Organized around talks like a SIAM meeting; presenting needs only a 0.5 to 1 page abstract reviewed by the program committee
- After the symposium, presenters may optionally submit a 5+1 page paper for IEEE Xplore
- Special sessions of 4 to 6 invited talks are proposed by community members
- Held annually in the San Francisco Bay Area
- "Registration fee: 690 USD through 15 Jan 2027, 950 USD after (2027, single rate)"
- Not listed in ICORE2026
