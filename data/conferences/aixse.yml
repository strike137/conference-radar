full_name: International Conference on Artificial Intelligence x Software Engineering
type: conference
tier: minor
areas: [ai, software]
region: north-america
language: english
frequency: annual
organizer: AIx conference series (general chair at UC Irvine)
organizer_country: [usa]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [9]
  conference_months: [10, 12]
links:
  website: https://www.aixse.org/
notes:
- AI for software engineering and software engineering for AI (also called AIxSoftware); first held in 2025
- One of the AIx conferences that replaced ai4i and TransAI; the 2026 edition is co-located with IEEE ISM
- Held at VOCO Laguna Hills (The Hills Hotel), Laguna Hills, California, in hybrid format
- A summer edition was held 2026-08-18 to 2026-08-19 at Shinshu University, Nagano, Japan (with AIxMHC)
- Accepted papers submitted for inclusion in IEEE Xplore; the 2025 proceedings are in IEEE Xplore
- Regular 8 pages, short 4, workshop 8, position 2 (IEEE format), at least three reviewers per paper; poster abstracts must be presented in person
- Each paper needs a full-rate registration and presentation or it is removed from the proceedings
- Not listed in ICORE2026; not on the CCF list
