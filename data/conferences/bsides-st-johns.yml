notes:
- Community security conference in St. John's, Newfoundland and Labrador, Canada; part of the worldwide Security BSides movement, with editions posted on its site since 2014
- One-day event with a single speaking track; 45-minute talks plus Q&A, and 10 to 15 minute lightning talks
- Talks submitted by email in plain text; submissions reviewed as they arrive, with a decision within four weeks
- Talks are live streamed and recorded; marketing or sales pitches are rejected and sponsorship does not buy a speaking slot
- Talks only, no proceedings
