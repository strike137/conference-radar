notes:
- Applied AI conference founded in 2017 at EPFL and run by the EPFL AI Center; renamed AMLD Intelligence Summit
- Held at the SwissTech Convention Center on the EPFL campus in Lausanne, Switzerland; in person only, in English
- Mix of keynotes, tracks, hands-on workshops, posters, an exhibition and an open stage for startups
- AMLD 2026 had participants from 30 countries, 291 speakers, 24 tracks, 18 workshops and 41 posters
- Open calls for posters, workshops and tracks; posters are selected by the organizing committee and presenters must
  buy a ticket
- No papers or proceedings; posters are only showcased on the AMLD website
- Reduced tickets for students, academia, startups and non-profits
- Not listed in the CORE ICORE2026 portal
