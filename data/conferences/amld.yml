notes:
- Large applied AI event run by the EPFL AI Center since 2017, now branded AMLD Intelligence Summit; EPFL's largest annual conference
- Held at the SwissTech Convention Center on the EPFL campus in Lausanne, Switzerland; in person only
- Keynotes, tracks, hands-on workshops, an exhibition, open stage and poster sessions; no formal proceedings
- Calls for workshop and poster proposals; reduced-price tickets may be offered to students and academia
- Separate AMLD Africa edition also exists
