notes:
- Workshop co-located with ECML PKDD (2021 virtual, then 2023 to 2026); 5th edition in Naples 2026
- Grew out of the Norwegian Research Council project "Machine Learning for Irregular Time Series" at NTNU and SINTEF
- Authors can opt in or out of the joint ECML PKDD post-workshop proceedings in Springer CCIS
- Regular papers up to 14 pages and short papers up to 6 pages, including references, LNCS style; presentation-only track for already published work
- 2026 edition had a special session on time series for space applications
- In-person presentation by a fully registered author required for inclusion in the proceedings
- Not listed in CORE ICORE2026
