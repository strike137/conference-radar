notes:
- Presents itself as the largest cybersecurity event in Paraguay; held every year since 2018 (9th edition in 2026)
- 2026 edition is hybrid; three online days (3, 5 and 11 November) and one in-person day on 13 November at the Sheraton Asuncion Hotel, Paraguay
- Free to attend thanks to sponsors; sponsor partner talks run alongside the expert talks
- Call for papers on Sessionize, reviewed by an academic committee; talks in Spanish, vendor-neutral technical content only
- 2026 topics include AI security, post-quantum cryptography, red and blue team, DFIR, OT/ICS and cloud security
- No proceedings; optional papers or whitepapers may be attached to a talk proposal
- Not listed in CORE ICORE2026 and not on the CCF list
