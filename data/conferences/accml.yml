organizer: University of Glasgow, University of Murcia, University of Sheffield and Google DeepMind organizers; co-located with HiPEAC
organizer_country: [europe]
proceedings: None (no formal proceedings)
archival: false
typical:
  deadline_months: [11, 12]
  conference_months: [1]
links:
  website: https://accml.dcs.gla.ac.uk/
notes:
- Workshop on computing systems for machine learning (accelerators, compilers, runtimes) and ML for systems
- Co-located with the HiPEAC conference every year except the 2nd edition at ISCA 2020
- Organizers include Jose Cano (Glasgow), Jose L. Abellan (Murcia), Valentin Radu (Sheffield) and Google DeepMind researchers
- Papers of 4 to 8 pages in double-column IEEE format, not anonymized, submitted via EasyChair
- Research papers, case studies, position papers, tentative ideas and works in progress are welcome
- Non-archival; the ISCA 2020 edition stated that the workshop has no formal proceedings
- Not listed in CORE ICORE2026 or the CCF list
