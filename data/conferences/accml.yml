links:
  website: https://accml.dcs.gla.ac.uk/
notes:
- One-day workshop co-located with the HiPEAC conference since 2020 (one extra edition at ISCA 2020)
- Topics on hardware and software for accelerating ML (accelerators, compilers, runtimes, LLM serving) and ML for systems
- Accepted papers are posted as PDFs on the workshop website only; no formal proceedings
- 'Papers: 4 to 8 pages in double-column IEEE format, not anonymized, via EasyChair; work in progress and position papers welcome'
- Deadlines are usually extended by about two weeks
- Not listed in CORE ICORE2026
