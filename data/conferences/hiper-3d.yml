notes:
- Workshop held with IEEE ICDCS on 3D chiplet architectures, power and thermal management, EDA for AI and AI for EDA
- First edition in 2025 with ICDCS 2025 in Glasgow (July 20, 2025); six papers in the program
- Papers up to 6 pages in IEEE two-column format, single-blind review, submitted via EasyChair
- Accepted and presented papers go into the IEEE ICDCSW companion proceedings and the IEEE digital library; in-person presentation required
- Not listed in the ICORE2026 portal or the CCF 2026 list
