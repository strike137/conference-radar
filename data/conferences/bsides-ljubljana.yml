notes:
- Community-run Security BSides event in Ljubljana, Slovenia; editions are named by year in hex (0x7EA = 2026)
- Held since 2015 at Poligon, and at the Computer History Museum Slovenia (Racunalniski muzej) since 2023; no 2020 to 2022 or 2025 editions listed
- 2026 was the 8th edition with 18 talks, 3 workshops and an all-day CTF run by Team Viris
- Formats are 40-minute and 20-minute talks in two tracks, workshops of 2 hours or more and 5-minute lightning talks registered on site
- Around 60 CFP submissions in 2026; marketing and non-technical commercial talks are not accepted, English only
- Free to attend thanks to sponsors; all three ticket batches sold out within minutes in 2026
- No proceedings
