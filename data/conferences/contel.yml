notes:
- Conference on Telecommunications series established in 1993; held every two years in Zagreb, Croatia and Graz, Austria from 1997 to 2023
- Since 2025 run as the ConTEL Symposium within SoftCOM in Split, Croatia, with its own call for papers, deadlines and committee
- Organized by Graz University of Technology and the University of Zagreb; technically co-sponsored by IEEE
- Papers up to 6 pages in IEEE double-column format, submitted through the SoftCOM EDAS by choosing the ConTEL track
- Proceedings of every edition since 2003 are in IEEE Xplore (2025 within SoftCOM 2025)
- Special events in 2026 were a CEEPUS session on modelling and simulation and the CoBCom colloquium on broadband communications
- Topics include optical, mobile RF and satellite communications, antennas, IoT, multimedia, QoE/QoS and telecom education
- Not listed in ICORE2026 (the host SoftCOM is CORE National Croatia)
