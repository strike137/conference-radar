id: iccns
name: ICCNS
full_name: International Conference on Communication and Network Security
type: conference
tier: minor
areas: [security, networking, communications]
region: china
language: english
frequency: annual
organizer: Host university that changes by edition (Heilongjiang University in 2026; Northeast Electric Power
  University in 2025) with a conference secretariat
organizer_country: [china]
proceedings: ACM DL
archival: true
indexing: [EI, Scopus]
fee: 575 USD / 3900 CNY author, 525 USD / 3600 CNY student author (2026)
typical:
  deadline_months: [10]
  conference_months: [12]
links:
  website: https://www.iccns.org/
notes:
- Smaller commercially organized conference, hosted each year by a different Chinese university
- 2016 to 2025 proceedings in the ACM Digital Library, listed as indexed in EI Compendex and Scopus; the 2026 page
  does not name the publisher
- Held in China in December (Weihai 2021, Beijing 2022, Fuzhou 2023, Xiamen 2024, Jilin 2025, Harbin 2026)
- Five tracks covering communications, network security, data security, privacy and AI for trusted systems
- One regular registration covers 5 double-column pages; abstract-only presentation is also offered
- Not listed in the CORE portal (ICORE2026)
