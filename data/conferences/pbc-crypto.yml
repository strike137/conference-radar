notes:
- One-day workshop on permutation-based cryptography (cryptanalysis, modes, protocols, implementations, side-channel and fault attacks)
- Invited talks plus contributed talks selected by the organizers from abstracts of at most two pages sent by email
- Unpublished results, works in progress and recently published work are all welcome; no proceedings, slides are posted on the program page
- Editions in Milan 2018, Lyon 2023 (with Eurocrypt) and Madrid 2025 (with Eurocrypt); held the Sunday before Eurocrypt
- Organizers 2025 are Stelvio Cimato, Joan Daemen, Silvia Mella and Gilles Van Assche
- Not listed in CORE ICORE2026 and not on the CCF list
