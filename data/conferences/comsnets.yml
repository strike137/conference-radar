id: comsnets
name: COMSNETS
full_name: International Conference on COMmunication Systems & NETworkS
type: conference
tier: minor
areas: [networking, communications, security, ai, systems]
region: south-asia
language: english
frequency: annual
organizer: COMSNETS Association
proceedings: IEEE Xplore
indexing: [IEEE Xplore, DBLP, Scopus]
rank:
  core: 'National: India'
fee: 800 USD plus 18% GST (2027 and 2026, main conference, international non-member); every accepted paper needs
  a full non-student registration, which covers at most two papers
typical:
  deadline_months: [8, 9]
  conference_months: [1]
links:
  website: https://www.comsnets.org/
  dblp: https://dblp.org/db/conf/comsnets/
  wikicfp: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=167204&copyownerid=176464
notes:
- Organized by the COMSNETS Association; held every early January in Bengaluru, India
- 'CORE rank National: India; regarded as the leading networking conference in India with strong industry presence'
- Double-blind review; 8-page main papers (references extra); many workshops including a Cyber Security and Privacy
  (CSP) workshop and a Systems for AI/ML (SysAI) workshop
- Partial travel grants (reimbursement, cap 500 USD for international awardees in 2027), mainly for students
- Workshops, posters, demos and graduate forum have later deadlines (Oct to Nov)
