id: icecai
name: ICECAI
full_name: International Conference on Electronic Communication and Artificial Intelligence
type: conference
tier: minor
areas: [communications, ai]
region: china
language: english
frequency: annual
organizer: ICECAI conference secretariat (site and registration on the AIS / AiScholar platform) with a university partner each year (UESTC hosted 2025; Central South University of Forestry and Technology is the listed sponsor in 2026)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 550 USD or 3800 CNY per 4-page paper (2026); 60 USD per extra page; 230 USD for attendees without a paper
typical:
  deadline_months: [10]
  conference_months: [5, 6, 10]
links:
  website: http://www.icecai.org/
notes:
- Annual since 2020, called IWECAI until 2022; held in China every year (Qingdao 2020, Nanjing 2021, Zhuhai 2022, Guangzhou 2023, Shenzhen 2024, Chengdu 2025, Changsha 2026)
- Scope covers communication systems, wireless and vehicular communications, and AI methods and applications
- Accepted papers (at least 4 pages) go to an IEEE conference proceedings volume submitted to IEEE Xplore, EI Compendex and Scopus
- Run by a commercial conference secretariat; abstract-only presenter option without publication
- Short turnaround in 2026 (submission to notification in five days)
- Not listed in CORE ICORE2026 or the CCF list
