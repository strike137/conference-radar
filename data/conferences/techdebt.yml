notes:
- Flagship venue on identifying, measuring and managing technical debt in software projects
- Co-located with ICSE every year and moves with it (Melbourne 2023, Lisbon 2024, Ottawa 2025, Rio de Janeiro 2026, Dublin 2027)
- 2025 proceedings published by IEEE; 2024 proceedings were in the ACM DL
- Technical track has research and experience papers (10 pages plus 2 of references) and short papers; IEEE template
- Doubly anonymous review with at least three reviewers per paper
- Also has industry (talks), tool and journal-first tracks
- Best papers invited to a special section of Information and Software Technology
- 2026 was the 9th edition; 2027 is the 10th
- CORE B (ICORE2026); not in the CCF 2026 list
