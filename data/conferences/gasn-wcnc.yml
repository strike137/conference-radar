notes:
- Workshop co-located with IEEE WCNC; the 2026 edition (WS-08, full day) was the second
- Organizers from BUPT, Zhejiang University, Linkoping University, SUTD, King's College London, ANU and San Jose State University
- Topics include non-terrestrial and terrestrial network integration, LEO satellite networks, UAV platforms, beam hopping and resource management
- Most 2026 papers were on LEO satellite and UAV communications, many from Chinese universities
- Accepted and presented papers go into the WCNC proceedings in IEEE Xplore; no-show papers are removed
- Workshop papers up to 6 pages (2 extra pages at 100 USD each); submissions via EDAS
- Not listed in ICORE2026
