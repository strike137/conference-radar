notes:
- Workshop on open-world and open-vocabulary 3D scene understanding, spatial intelligence and world models
- Full title in 2026 is Workshop on Open-World 3D Scene Understanding and Representations
- Held with ICCV 2023, CVPR 2024, ECCV 2024, CVPR 2025, ICCV 2025, CVPR 2026 (6th, Denver) and ECCV 2026 (7th, Malmo); twice a year since 2024
- Proceedings track (14-page ECCV format) goes into the host conference workshop proceedings; non-archival track for extended abstracts and published work
- Submissions via OpenReview; also runs a 3D functionality and interaction challenge (SceneFun3D, Articulate3D)
- Not listed in ICORE2026 or the CCF list
