notes:
- One of the Obuda University IEEE symposium series (with SAMI, SACI, CINTI, INES)
- Held every September, alternating between Subotica, Serbia (2021, 2022, 2025; 2020 was virtual) and Pula, Croatia (2023, 2024, 2026)
- Papers go to IEEE Xplore; the series is indexed by Scopus
- Broad scope covering computational intelligence, intelligent robotics, mechatronics, cybermedical systems and engineering education
- In-person only; at least one author must register and present, one paper per registration fee; submission via EasyChair
- "Fee: EUR 380 regular, EUR 340 IEEE members, EUR 300 students (2026 early rate)"
- Ranked National (Serbia) in ICORE2026
