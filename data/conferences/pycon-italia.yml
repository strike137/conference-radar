notes:
- Italian national Python conference run by the association Python Italia; more than 1000 attendees
- Official language is English, with at least one talk in Italian in every slot
- 30 minute talks and 2 hour hands-on trainings chosen from a call for proposals; at most 3 proposals per speaker
- A free Open Learning Day of workshops precedes three conference days
- 'Past venues: Florence 2023 and 2024, Bologna 2025 and 2026; Bologna again in 2027'
- No papers or proceedings; talk recordings are published online
