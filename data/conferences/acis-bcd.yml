unverified:
- BCD 2027-II (Hohhot) paper submission deadline (the page shows 'May 14, 2025', apparently a typo)
- No BCD edition in 2026 found on the ACIS site
- Proceedings publisher for the Hohhot, Beijing and Kyoto 2027 editions (IEEE and ACM co-sponsorship 'in the process
  of approval'); the Danang 2025 CFP names no proceedings publisher besides Springer SCI for selected papers
- Edition numbering is inconsistent across ACIS pages (Las Vegas 2027 is called the 10th, as was Danang 2025)
