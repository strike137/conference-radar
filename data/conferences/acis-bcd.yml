id: acis-bcd
name: BCD
full_name: ACIS International Conference on Big Data, Cloud Computing, and Data Science
type: conference
tier: minor
areas: [data, systems, ai]
region: asia-pacific
language: english
frequency: multiple-per-year
organizer: ACIS (International Association for Computer and Information Science, USA)
organizer_country: [usa]
proceedings: IEEE Conference Publishing Services (IEEE/ACIS editions); selected papers in Springer Studies in Computational
  Intelligence, IJNDC (Springer), IJSI or IJBDIA (IGI Global)
archival: true
typical:
  deadline_months: [2, 5, 6, 7]
  conference_months: [5, 7, 8, 9]
links:
  website: https://acisinternational.org/conferences/
notes:
- Run by ACIS, co-located with ACIS ICIS, SNPD and SERA; earlier titled "Big Data, Cloud Computing, and Data Science
  Engineering"
- 'Recent editions mostly in Asia (Zhuhai 2021, Danang 2022, Ho Chi Minh City 2023, Kitakyushu 2024, Danang 2025);
  2027 editions in Las Vegas, Hohhot, Beijing and Kyoto'
- The Las Vegas 2027 CFP names IEEE Conference Publishing Services, submitted for EI, INSPEC and DBLP; the ACIS-only
  Danang 2025 edition sent its 15 best papers to Springer SCI
- Regular papers up to 8 pages, short papers 4 pages (IEEE template), submitted via EasyChair
- 51 papers presented at BCD 2025-Winter (Danang); not ranked by CORE or CCF; generally regarded as a low-tier venue
