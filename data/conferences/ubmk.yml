notes:
- Turkish general computer science and engineering conference held since 2016 alongside the meetings of the
  Turkish computer engineering department chairs (BMBB)
- Organized by the BMBB Board and the Academic Informatics Foundation (ABV) with ITU, Gazi University and Atilim
  University; the host university changes every year
- Held in a different Turkish city each year (Sarajevo in 2018, Istanbul in 2025 and 2026)
- Papers reviewed by at least two referees and published in IEEE Xplore; selected extended papers go to Turkish
  journals
- Papers in Turkish and English; discounted fees for students and members
- Not listed in the CORE ICORE2026 portal
