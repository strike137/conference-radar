id: icowc
name: ICOWC
full_name: International Conference on Optical Wireless Communications
type: conference
tier: minor
areas: [communications]
region: china
language: english
frequency: annual
organizer: Tsinghua University and the ISA LiFi Committee for 2027 (earlier editions Chongqing University and Southeast University), technically co-sponsored by IEEE and IEEE Photonics Society
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI Compendex, Scopus]
fee: Regular author 3950 RMB (575 USD), student or IEEE or TPC member 3600 RMB (525 USD), abstract only 2700 RMB (2027)
typical:
  deadline_months: [1]
  conference_months: [5, 6]
links:
  website: https://www.icwoc.org/
notes:
- Formerly ICWOC (International Conference on Intelligent Computing and Wireless Optical Communications), renamed ICOWC for 2027
- Annual since 2013; 2027 is the 15th edition
- "Recent hosts: Chongqing 2021 to 2024, Chengdu 2025, Nanjing 2026, Shenzhen 2027"
- Proceedings in IEEE Xplore, stated as indexed by EI Compendex and Scopus
- Smaller conference with a China based secretariat (163.com contact, submission via zmeeting.org); 2021 edition ran as a workshop of ICCSN
- Full papers at least 4 pages; abstract only presentations are not published
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
