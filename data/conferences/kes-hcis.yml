notes:
- Organized by KES International; 19th edition in 2026, 20th in 2027
- Covers human centred AI, intelligent digital architectures and human and system co-adaptation
- Held as part of the KES Smart Digital Futures multi-conference together with AMSTA, IDT and InMed
- Held in Europe every June with the other Smart Digital Futures conferences (Madeira 2024, Barcelona 2026, Iasi 2027)
- Full papers published by Springer in the Smart Innovation Systems and Technologies series; short papers and
  abstracts are published online only, not in the Springer volume
- Many papers come through invited sessions, whose chairs set their own deadlines
- Not listed in ICORE2026; not on the CCF list
