id: icncc
name: ICNCC
full_name: International Conference on Networks, Communication and Computing
type: conference
tier: minor
areas: [networking, communications, general]
region: asia-pacific
language: english
frequency: annual
organizer: Conference secretariat with sponsor universities that change by edition (National Taiwan University of
  Science and Technology and Universiti Teknologi Malaysia in 2026; NTUST and Okayama University in 2025)
organizer_country: [other]
proceedings: IEEE Xplore
archival: true
indexing: [Scopus, EI]
fee: 580 USD regular, 500 USD student (2026, full paper, early bird before Oct 20; late 630 / 550 USD)
typical:
  deadline_months: [10]
  conference_months: [12]
links:
  website: https://www.icncc.org/
notes:
- Smaller commercially organized conference run by a conference secretariat; sponsor universities change each year
- Proceedings via IEEE Conference Publishing Services into IEEE Xplore since 2025 (2025 ISBN 979-8-3315-5822-2);
  2016 to 2024 proceedings were in the ACM DL
- Past proceedings listed as indexed in Scopus and Ei Compendex; 2026 proceedings are "submitted for" indexing
- Held in December and rotates around Asia (online 2020 to 2022, Osaka 2023, Bangkok 2024, Fukuoka 2025, Kuala
  Lumpur 2026)
- Abstract-only presentation without publication is also offered; extra pages beyond 6 cost 70 USD each
- Not listed in the CORE portal (ICORE2026)
