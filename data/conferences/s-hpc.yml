notes:
- Half-day workshop on security of HPC systems (attacks, threat models, defenses across the HPC hardware and software stack), held with SC
- 2026 is the fifth annual edition (SC26, Chicago)
- Full papers of 8 pages in the IEEE conference template, submitted through the SC Linklings site, at least three reviews each
- Accepted papers appear in the SC workshop proceedings in IEEE Xplore
- General chairs from PNNL, NIST, UC Riverside and University of Bristol
- Not listed in CORE ICORE2026
