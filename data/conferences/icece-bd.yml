notes:
- Run by the Department of Electrical and Electronic Engineering at BUET since 2001; held every two years in December
  on the BUET campus in Dhaka, Bangladesh
- Technically co-sponsored by the IEEE Bangladesh Section; accepted and presented papers go to IEEE Xplore (2020, 2022
  and 2024 proceedings are on IEEE Xplore)
- Broad electrical and computer engineering scope, from power and devices to AI, networks and security, communications
  and signal processing
- Double-blind review; max 6 pages in IEEE format including references; presentation by a registered author is mandatory
- Submission deadlines are often extended (2024 once, from 2024-09-04 to 2024-10-05; 2026 twice, from 2026-08-01 to
  2026-08-30 and then 2026-09-15)
- Not ranked in ICORE2026; not to be confused with other venues using the ICECE acronym
