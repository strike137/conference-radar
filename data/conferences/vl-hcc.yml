notes:
- Established in 1984 (as VL); forum on languages and tools that make programming, modeling and computing easier
  for people, including end-user programming, low-code, computing education and human-AI interaction
- Proceedings published by the IEEE Computer Society in IEEE Xplore
- Full papers up to 10 pages and short papers up to 5 pages plus references, IEEE two-column format
- Double-anonymous review with a rebuttal phase; abstract deadline one week before the paper deadline
- Rotates between North America and Europe (Rome 2022, Washington DC 2023, Liverpool 2024, Raleigh 2025,
  Paderborn 2026, Vancouver 2027)
- At least one author must register and present; IEEE may exclude unpresented papers from Xplore
- CORE B (ICORE2026); not in the CCF 2026 list
