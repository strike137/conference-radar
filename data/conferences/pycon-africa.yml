notes:
- Pan-African conference of the Python community, non-profit and volunteer run, hosted each year by a national Python
  community
- 'Editions: Accra 2019, online 2020, Accra 2024, Johannesburg 2025 (joint with PyConZA), Kampala 2026; no edition
  2021 to 2023'
- Five days with a free Beginners Day, main conference days with talks and workshops, and sprints
- Talks, tutorials and workshops chosen from an open call for proposals, with a separate later poster call
- Talks only, no papers or proceedings; recordings on YouTube
