notes:
- Organized by INSTICC; proceedings in the SCITEPRESS Digital Library, revised and extended selected papers in a
  Springer CCIS book
- Formerly the International Conference on Software and Data Technologies (listed under that name in CORE)
- 'Double-blind review; two submission stages: regular papers in stage 1, regular or position papers in stage 2
  (earlier stage gives earlier notification)'
- Held in Europe every year in June or July (Rome 2023, Dijon 2024, Bilbao 2025, Porto 2026, Rome 2027),
  co-located with DATA, DeLTA, SECRYPT, QUANTICS and SIMULTECH; one registration covers them as a non-speaker
- Regarded as a lower-tier venue (CORE C); remote presentation allowed when speakers cannot travel
- Has a non-archival abstracts track and co-located workshops
