notes:
- Co-located with ACM CCS every year since 2023 (Copenhagen 2023, Salt Lake City 2024, Taipei 2025, The Hague 2026)
- 'Name history: Secure and Trustworthy Superapps (2023, 2024); Security and Privacy of AI-Empowered Mobile Super
  Apps (2025); Security and Safety of AI-Empowered Mobile Super Apps (2026, listed on the CCS 2026 site as Security
  of Agentic and Miniapp Empowered Mobile Apps)'
- Double-blind; regular papers up to 7 pages, short or WIP papers up to 4, demos up to 2 (ACM sigconf, plus references
  and up to 2 appendix pages)
- Focus on mini-app ecosystems (WeChat, Alipay, TikTok, Grab) and agentic AI on mobile; about a third of the 2026
  PC is from mainland China or Macao
- Best paper award; the deadline was extended in 2025 (June 20 -> July 16) and in 2026 (July 15 -> July 22)
