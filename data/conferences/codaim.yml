notes:
- Half-day workshop on cross-stack co-design (PL, OS, compilers, networks, architecture) for agentic and multimodal AI inference
- 1st edition at ASPLOS 2026 in Pittsburgh
- Short papers up to 2 pages plus unlimited references in the ASPLOS template; single-blind
- Each submission must include an AI use statement
- Accepted papers get 20-minute talks and are included in the workshop proceedings, made openly available
- A post-workshop summary paper is planned for arXiv or the ACM Digital Library
- Not listed in CORE ICORE2026
