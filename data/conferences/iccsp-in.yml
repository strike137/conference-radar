id: iccsp-in
name: ICCSP
full_name: International Conference on Communication and Signal Processing
type: conference
tier: minor
areas: [communications, ai]
region: south-asia
language: english
frequency: annual
organizer: Adhiparasakthi Engineering College (APEC), Melmaruvathur
organizer_country: [india]
proceedings: IEEE Xplore
fee: INR 10,500 to 11,500 for Indian delegates, 175 to 225 USD for international delegates (2027)
typical:
  deadline_months: [12]
  conference_months: [4]
links:
  website: https://iccsp.apec.edu.in/
notes:
- Organized by Adhiparasakthi Engineering College, Melmaruvathur, Tamil Nadu, India
- Held since 2012 (no editions 2021 to 2023); the 2027 edition is the 13th
- Proceedings in IEEE Xplore (ISSN 2836-1873); extended versions of selected papers go to journals
- Double-blind review via EDAS; papers up to 6 pages, up to 8 with over-length charges
- Virtual presentation allowed only for foreign participants
- Broad scope beyond communications and signal processing (green energy, AI, sensors, biomedical, education, remote sensing)
