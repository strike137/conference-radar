links:
  website: https://www.sampta.org/
notes:
- Biennial meeting of mathematicians and engineers on sampling theory, signal and image processing, harmonic analysis
  and the mathematics of data analysis and deep learning
- Papers up to 4 pages in IEEE conference format (references extra), single-blind review
- Accepted papers must be presented (talk or poster) to appear in IEEE Xplore
- Run by an international steering committee; 2023 at Yale (USA), 2025 at the University of Vienna (Austria),
  2027 at Utrecht University (Netherlands)
- No edition in 2021 because of COVID-19; 2025 edition had 211 participants
- SaSiDa journal best paper awards for selected contributions
