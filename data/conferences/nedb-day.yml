notes:
- One-day regional data management meeting for academia and industry in the northeastern US, with keynotes, talks and an
  afternoon poster session
- Topics cover data-intensive systems, databases, NoSQL, graph processing, ML for systems, systems for ML and data science
- Submissions are 2-page talk abstracts or 1-page poster abstracts via Microsoft CMT; published work may be presented
- All reasonable posters are accepted; talks are limited by the number of speaking slots
- Held in January in 2025 and 2026 (May 2024, March 2023); hosts 2023 Northeastern, 2024 Boston University, 2025
  Brandeis, 2026 UMass Boston
- Nominal registration fee of 100 USD for non-students and 25 USD for students (2026)
- Industry sponsors include Google, Microsoft, Intel and Oracle (2026)
- Not listed in CORE ICORE2026 and not on the CCF list
