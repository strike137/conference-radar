notes:
- Held under the auspices of the ISCA Speech Synthesis SIG (SynSIG); every two years since 2019, in odd years
- Satellite event of Interspeech; 2025 edition followed Interspeech Rotterdam and was followed by the
  Blizzard Challenge workshop
- Single track; papers up to 6 pages of content plus 2 pages for references; double-blind review
- Full papers receive a DOI in the ISCA Archive
- Not listed in CORE ICORE2026
- Mostly held in Europe (Barcelona 2013, Vienna 2019, Budapest 2021, Grenoble 2023, Leeuwarden 2025; Sunnyvale 2016)
