notes:
- Workshop held with IEEE/ACM UCC every year since 2021; follows UCC around the world (Sharjah 2024, Nantes 2025, Florianópolis 2026)
- Topics are distributed and federated learning, edge intelligence and resource management in the cloud to edge continuum
- Papers up to 6 pages in IEEE double-column format (2 extra pages can be bought); double-blind review
- Papers appear in the UCC proceedings via IEEE Xplore (2025 also in the ACM DL); one author must register at the non-student rate and present in person
- Chaired from UNICAMP (Luiz F. Bittencourt) with honorary chairs Ian Foster and Filip De Turck
- Not listed in CORE ICORE2026
