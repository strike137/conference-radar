notes:
- Workshop on constrained Horn clauses for program analysis, verification and synthesis, bridging constraint/logic programming, program verification and automated deduction
- Held since 2014; HCVS 2026 was the 13th edition
- Satellite of ETAPS (2016, 2019 to 2024), CAV (2015, 2025, 2026 at FLoC), CADE (2017), FLoC 2018 or VSL 2014; mostly held in Europe
- Regular papers up to 12 pages and tool papers up to 4 pages in EPTCS format, extended abstracts and presentation-only papers; all refereed
- Proceedings in EPTCS (HCVS 2021 -> EPTCS 344, HCVS 2022 -> EPTCS 373 jointly with VPT, HCVS 2025 -> EPTCS 434), published only if enough regular papers are accepted; EPTCS states it is not publishing proceedings for HCVS 2023 and HCVS 2024
- Includes the presentation of the CHC-COMP solver competition results
- Not listed in ICORE2026 or the CCF list
