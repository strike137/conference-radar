notes:
- Smaller commercially organized security and cryptography conference, sometimes called ICCSP after its website
- Proceedings via IEEE Conference Publishing Services in IEEE Xplore since 2021 (ACM ICPS 2017 to 2020)
- Held mostly in China until 2023 (Wuhan, Guiyang, Nanjing, Zhuhai, Tianjin; Kuala Lumpur in 2019), in Japan since 2024 (Osaka, Okinawa, Sapporo, Nagoya in 2027)
- Papers up to 5 pages, extra pages charged; online presentation sessions are offered
- Deadlines were extended several times in past years (to late February for 2023 and 2024)
- Not to be confused with the Indian ICCSP (Communication and Signal Processing)
- Not listed in the CORE portal (ICORE2026)
