notes:
- Workshop on AI for misinformation, disinformation, online manipulation and user behavior modeling, with a focus on sustainable (green) methods
- 1st edition in 2025 co-located with WI-IAT 2025 (London, 17 Nov 2025), papers in the IEEE WI companion volume (IEEE Xplore)
- 2nd edition in 2026 co-located with ECML PKDD 2026 in Naples; accepted new contributions go into the companion volume of the main conference
- ECML PKDD 2026 workshop papers go into joint post-workshop proceedings in Springer CCIS; authors can opt in or out
- Accepts full research papers, discussion papers already presented elsewhere and demo papers; Springer LNCS format suggested
- Organized mainly by ICAR-CNR (Italy); submission via Microsoft CMT
- Not listed in CORE ICORE2026
