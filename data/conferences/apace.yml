notes:
- Run by the IEEE Malaysia AP/MTT/EMC Joint Chapter and held in Malaysia (Langkawi 2024, Melaka 2026)
- Held about every two years, alternating with the chapter's IEEE RFM (RF and Microwave) conference; 2024 was the 10th edition
- Covers antennas, propagation, EM wave theory, EMC, RF/microwave circuits, plus AI and computing for wireless
- 2 to 4 page IEEE two-column papers via EDAS; presented papers go to IEEE Xplore (Scopus indexing stated in the 2024 CFP)
- Submission deadline is extended several times (2026 moved from July 31 to October 11)
- Not ranked by CORE or CCF; applied electromagnetics venue outside the usual CS rankings
