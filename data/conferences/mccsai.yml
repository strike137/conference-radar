notes:
- Organized by the LMCS and LCSI research labs of ESI Algiers, Algeria
- Successor of the Algerian Doctoral Conference in Computer Science (ADCCS 2024); renamed MCCSAI in 2025
- Aimed at PhD students and young researchers around the Mediterranean
- Proceedings in Springer Lecture Notes in Networks and Systems (LNNS), for both 2025 and 2026
- Double-blind review; initial submissions up to 8 pages; all accepted papers are presented orally
- 2025 held at ESI Algiers in May; 2026 at University Mohammed Tahri of Bechar in December
- Deadlines are usually extended several times
- "Fees (2026): 150 EUR foreign academic, 100 EUR foreign student; lower fees in DZD for Algerian participants"
- Special sessions in 2026 on cybersecurity, big data and cloud computing, and quantum computing for AI
- Not listed in CORE ICORE2026
