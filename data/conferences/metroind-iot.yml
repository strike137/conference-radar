id: metroind-iot
name: IEEE MetroInd4.0&IoT
full_name: IEEE International Workshop on Metrology for Industry 4.0 and IoT
type: conference
tier: minor
areas: [communications, networking]
region: europe
language: english
frequency: annual
organizer: IEEE Instrumentation and Measurement Society with Italian measurement universities (GMEE); run by Athena
  Consulting
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
fee: 580 EUR IEEE member, 690 EUR non-member, 340 to 380 EUR student non-author (2026, advance)
typical:
  deadline_months: [3, 4]
  conference_months: [6, 7]
links:
  website: https://www.metroind40iot.org/
notes:
- Standalone IEEE workshop on measurement, sensors and instrumentation for Industry 4.0 and IoT, held since 2018
- Held in Italy almost every year (2022 Trento, 2023 Brescia, 2024 Florence, 2026 Rome); 2025 in Castelldefels, Spain;
  2020 and 2021 virtual
- Submission is a 4 to 5 page extended abstract; accepted and presented papers go to IEEE Xplore
- Extended versions of presented papers are eligible for journal special issues (MDPI Sensors in 2025, Measurement
  Sensors in 2026)
- Registration fee covers one paper; extra paper 50 EUR
- Not listed in ICORE2026 or the CCF 2026 list
