notes:
- Annual symposium on geometric and physical modeling (solid modeling, CAD, computational fabrication, simulation), held
  with the support of the Solid Modeling Association
- Accepted full papers are published in the journal Computer-Aided Design (Elsevier) after a two-stage double-blind review
- Poster track with a separate, later deadline
- The Pierre Bezier Prize of the Solid Modeling Association is presented at the symposium
- Held jointly with SMI in Istanbul in 2026; 2027 edition is part of the International Geometry Summit in Singapore
- ICORE2026 C (listed as ACM Symposium on Solid and Physical Modelling); CCF B (computer graphics and multimedia)
