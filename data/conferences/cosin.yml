notes:
- Yearly Swiss hacker event of the Chaos Computer Club Schweiz (CCC-CH) in the CCC tradition
- Three-day weekend event in June at the Villa Ritter in Biel/Bienne, Switzerland
- Talks, workshops and discussions on technology, net politics, art and culture; talks in German and English (mostly German)
- Held since 2006; no edition in 2012 and 2020 to 2022
- Non-profit, entrance fee CHF 30 for all days including meals; sleeping on site possible
- Talks submitted through a pretalx call for participation; no proceedings
