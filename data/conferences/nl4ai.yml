notes:
- Workshop at the yearly conference of the Italian Association for Artificial Intelligence (AIxIA), supported by the Italian Association of Computational Linguistics (AILC)
- Always held in Italy (Bari 2018, Rende 2019, online 2020 and 2021, Udine 2022, Rome 2023, Bolzano 2024, Perugia 2026)
- Proceedings in CEUR-WS every edition since 2017 (2024 -> Vol-3877, 2026 -> Vol-4315)
- No edition in 2025; the 9th edition was held in 2026
- Regular papers up to 12 pages and short/demo papers up to 6 pages (plus 2 pages of references), CEUR-ART single-column style
- Single-blind peer review; extensions of work published elsewhere are welcome
- Not listed in ICORE2026 and not on the CCF list
