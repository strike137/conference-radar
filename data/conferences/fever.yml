notes:
- Workshop on automated fact checking, claim verification, evidence retrieval, misinformation and related tasks
  (textual entailment, question answering, argument mining)
- Annual since 2018; follows its host conference (EMNLP 2021, ACL 2022 Dublin, EACL 2023 Dubrovnik, EMNLP 2024 Miami,
  ACL 2025 Vienna, EACL 2026 Rabat)
- Proceedings in the ACL Anthology (11 papers in 2026, 22 in 2025, 28 in 2024)
- Runs a shared task most years (FEVER, FEVEROUS, AVeriTeC; AVerImaTeC image-text claim verification in 2026)
- Accepts direct submissions and commitment of ARR-reviewed papers
- Not ranked in ICORE2026 and not on the CCF list
