notes:
- Robotics, automation and control conference held every February, co-sponsored by IEEE and the IEEE Robotics and Automation Society
- Proceedings archived in IEEE Xplore and indexed by EI Compendex and Scopus every year since at least 2021
- Six tracks; intelligent control, robot systems, perception and sensing, human-robot interaction, industrial automation, modeling and simulation
- Abstract-only (presentation only) submissions are accepted alongside full papers
- Moves around the world; Prague/virtual 2021, virtual 2022, Abu Dhabi 2023, Athens 2024, Zagreb 2025, Istanbul 2026, Paris 2027
- Submission through EasyChair
- Not listed in the CORE ICORE2026 portal and not on the CCF list
