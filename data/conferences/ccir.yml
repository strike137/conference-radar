notes:
- Main national IR meeting in China, run under CIPS; held in a different Chinese city each year (2022 Chongqing,
  2024 Wuhan, 2025 Shihezi)
- English-language papers go to a small Springer LNCS volume of revised selected papers (9 of 13 submissions accepted
  in 2025, 11 of 26 in 2024)
- Not in the CCF list and not CORE-ranked; mainly a domestic community event
- No LNCS volume appears for 2023 in the Springer series listing
