notes:
- Annual since 2009, rotating around the Asia-Pacific (2024 Hanoi, 2025 Taipei, 2026 Melbourne)
- 'Two tracks: conference track (PMLR, 16 pages, double-blind on OpenReview) and journal track (Machine Learning
  journal, single-blind, deadline about a month earlier)'
- Each submission must nominate an author as reviewer; accepted papers must be presented in person
- Ranked only C by CORE and CCF, but regarded as the main machine learning conference based in Asia; acceptance
  around 26-33% (2021-2025)
- 2026 adds a non-archival Encore track for papers already published at major venues (rolling until 2026-10-18 AoE)
