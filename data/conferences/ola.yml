id: ola
name: OLA
full_name: International Conference on Optimization and Learning
type: conference
tier: minor
areas: [ai]
region: europe
language: english
frequency: annual
organizer: OLA steering committee (chair El-Ghazali Talbi, University of Lille) with local host universities and
  ANTs Lab (Italy)
organizer_country: [europe]
proceedings: Springer CCIS (selected long papers); all accepted short and long papers in online conference
  proceedings
archival: true
indexing: [Scopus, DBLP, EI]
fee: 490 EUR (2026, regular early, without banquet); 390 EUR student
typical:
  deadline_months: [1, 3]
  conference_months: [4, 5]
links:
  website: https://ola2026.sciencesconf.org/
notes:
- Conference on optimization and machine learning (learning for optimization, optimization for learning,
  metaheuristics, applications)
- Selected long papers published in Springer Communications in Computer and Information Science (CCIS); short papers
  only in the online conference proceedings
- Hosted mostly in Southern Europe (Catania 2021, Syracuse 2022, Malaga 2023, Dubrovnik 2024, Chania 2026), Dubai
  in 2025, Krakow planned for 2027
- At least one author must register per accepted paper, and one registration covers only one paper
- Not listed in the CORE portal (ICORE2026) and not on the CCF list
