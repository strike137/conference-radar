unverified:
- COCOA 2026 conference dates conflict on the official site (Important Dates and Program pages say 2026-12-04 to 12-06, the
  Chinese home and About pages say December 15 to 17); the Important Dates value, which the EasyChair CFP also gives, is used
- COCOA 2024 deadlines (2024 dates taken from the SpringerLink conference page)
- COCOA 2025 (18th, Tianjin, November 28 to 30, 2025 per the LNCS 16416 title) not added; no official 2025 site was reachable
- The 2026 site calls it the 18th COCOA in Chinese, the EasyChair CFP says 19th; 19th matches the count of past editions
- Not in the CCF 2026 list (checked via the ccfddl mirror, ccf.org.cn behind a captcha)
