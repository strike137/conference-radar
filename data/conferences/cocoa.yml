id: cocoa
name: COCOA
full_name: Annual International Conference on Combinatorial Optimization and Applications
type: conference
tier: minor
areas: [general]
region: worldwide
language: english
frequency: annual
organizer: COCOA Committee (general chair Ding-Zhu Du), with a local host university (Beijing University of Chemical Technology in 2026)
organizer_country: [international]
proceedings: Springer LNCS
archival: true
rank:
  core: C
typical:
  deadline_months: [8, 9]
  conference_months: [11, 12]
links:
  website: https://www.cocoa2026.com/index.html
notes:
- Algorithms and combinatorial optimization venue started in 2007, usually held in December
- Alternates mostly between China and the USA (Xiamen 2019, Dallas 2020, Tianjin 2021, Hawaii 2023, Beijing 2024, Tianjin 2025, Beijing 2026)
- Proceedings in Springer LNCS (2025 edition in LNCS 16416); no edition was held in 2022
- Double-blind review, papers up to 12 pages in LNCS style including references, optional appendix
- Topics include approximation algorithms, scheduling, submodular optimization, algorithmic game theory, network optimization
  and computational biology
- Ranked C in ICORE2026
