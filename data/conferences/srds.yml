notes:
- Long-running symposium on dependable and secure distributed systems, first held in 1981; 45th edition in 2026
- Run by an international steering committee; location rotates between Europe, North America and other regions
- Proceedings produced by IEEE CPS and submitted to IEEE Xplore; the 2026 site states it is not sponsored by the IEEE
- Double-blind review; research papers, practical experience reports and tool papers, 10 pages IEEE two-column plus references
- Abstract registration one week before the full paper deadline (early May); conference in late September
- CORE B (ICORE2026), CCF B
- Each paper needs a non-student full registration and an in-person presentation (no-show policy)
