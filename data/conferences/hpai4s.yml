notes:
- Workshop on training, fine-tuning and serving foundation models and LLMs for science at HPC scale
- Co-located with IEEE IPDPS since 2025 (Milan 2025, New Orleans 2026, Seattle 2027); 2027 is the third edition
- Accepted papers are published in the IPDPS workshop proceedings (IEEE Xplore)
- Full papers 8 pages and short or work-in-progress papers 5 pages, including references, IEEE style; single-blind review
- Run by researchers from Argonne (steering chair Franck Cappello), Oak Ridge and Lawrence Livermore
- Not listed in CORE ICORE2026; not on the CCF 2026 list
