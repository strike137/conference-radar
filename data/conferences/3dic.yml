notes:
- Peer-reviewed conference on 3D and 2.5D system integration (TSVs, bonding, interposers, chiplets, 3D design methodology and CAD, applications)
- Papers of 4 or 5 pages in IEEE double-column format; only presented papers go to IEEE Xplore
- At least one author must register at the full (not student) rate to present a paper
- Small event; 2026 had 110 registrants from 12 countries and 23 presented papers
- "Fee: 90 USD student, 200 USD IEEE member, 325 USD non-member (2026, plus tax)"
- Location rotates between the USA, Japan and Ireland (Atlanta 2026, Sendai 2024, Cork 2023, Raleigh 2021, Sendai 2019, Cork 2018)
- Not held every year (editions in 2018, 2019, 2021, 2023, 2024 and 2026)
- Not listed in CORE ICORE2026
