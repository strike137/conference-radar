id: icira
name: ICIRA
full_name: International Conference on Intelligent Robotics and Applications
type: conference
tier: minor
areas: [ai, systems]
region: worldwide
language: english
frequency: annual
organizer: ICIRA committee of Chinese robotics groups (HUST, SJTU, HIT, CAS); local host changes yearly
organizer_country: [china]
proceedings: Springer LNAI
archival: true
typical:
  deadline_months: [6]
  conference_months: [7, 8]
links:
  website: https://www.icira2026.org/
notes:
- Robotics and automation conference founded and led by Chinese universities (honorary chair from HUST)
- Proceedings in Springer Lecture Notes in Artificial Intelligence (LNAI), several volumes per year (10 volumes in
  2024, 3 in 2025)
- Usually held in China (Harbin 2022, Hangzhou 2023, Xi'an 2024), with recent editions abroad (Okayama 2025, Budapest
  2026)
- Full papers of at least 12 single-column pages in Springer format; submission through Microsoft CMT
- Not listed in CORE ICORE2026 or the CCF 2026 list
- The website moves every year (icira20XX.org); the Springer conference page lists past volumes
