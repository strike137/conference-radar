notes:
- Shared task and workshop on sample-efficient language model pretraining under human-scale data budgets (100M and 10M words), with a cognitive modeling angle
- Run as a shared task at CoNLL 2023 (Singapore) and CoNLL 2024 (Miami); became a full workshop at EMNLP 2025 (Suzhou) and EMNLP 2026 (Budapest)
- Papers appear in the ACL Anthology (First BabyLM Workshop proceedings 2025, 42 papers)
- Two direct paper tracks (workshop papers and Challenge reports) on OpenReview, plus ARR commitment
- 2026 adds a MultiLingual track (English, Dutch, Chinese); Multimodal and Interaction are folded into Strict and Strict-Small
- Not ranked in ICORE2026 and not on the CCF list
