notes:
- Workshop on edge-cloud collaboration and edge networking for AI workloads (split inference, model compression, LLM-based network agents)
- First edition held as a half-day workshop with ACM CoNEXT 2025 at HKUST, Hong Kong
- Program co-chairs from the National University of Singapore and Beijing Institute of Technology
- Papers up to 6 pages excluding references in two-column ACM format, double-blind review, submitted via HotCRP
- Per the CoNEXT 2025 call for workshops, workshop papers appear in the ACM Digital Library with the CoNEXT short papers
- Workshop-only registration sold through CoNEXT (2025 -> 300 USD ACM member early, no student workshop-only rate)
- Not run with CoNEXT 2026 (Utrecht), whose workshop list does not include it
- Not listed in ICORE2026
