notes:
- Yearly Brazilian computing conference run by UNIVALI since 2010, about 300 participants; 18th edition in 2027
- Broad scope (AI, software engineering, data science, networks, security, health informatics, computing education)
  with yearly themes taken from UN Sustainable Development Goals
- Full papers up to 6 pages (oral), extended abstracts up to 3 pages (poster; the 2027 main track call says 2);
  Portuguese, Spanish or English with English title and abstract; double-blind review through SBC JEMS
- Proceedings (Anais do Computer on the Beach) published open access on the Univali journal portal; 91 full papers
  in 2026
- Held in Santa Catarina (Univali campus in Itajaí 2025, Hotel Praia Brava in Florianópolis 2026 and 2027);
  co-located workshops and a technical paper contest (CTT)
- Not ranked in CORE ICORE2026
