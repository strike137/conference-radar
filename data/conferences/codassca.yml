notes:
- Held at the American University of Armenia in Yerevan; IEEE co-sponsored
- Grew out of four CODASSCA workshops held between 2018 and 2024; 2026 is the first edition as a full conference
- Topics are smart city IoT, data science, security and privacy modeling, deep learning and human-centered computing
- Full papers (6 pages) and posters or short papers (3 pages) in the IEEE template, submitted via EasyChair
- Accepted and presented papers are submitted to IEEE Xplore; no-shows are removed from the proceedings
- Selected papers invited to special issues of the Journal of Universal Computer Science
- Not listed in ICORE2026 or the CCF 2026 list
