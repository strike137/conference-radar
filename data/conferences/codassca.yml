notes:
- Hosted by the American University of Armenia in Yerevan; general chairs from Germany and Armenia
- Grew out of four CODASSCA workshops (2018, 2020, 2022, 2024), all held at AUA in Yerevan; 2026 is the first edition run as a full conference
- 2026 edition co-sponsored by IEEE; accepted and presented papers are submitted for inclusion in IEEE Xplore
- Topics cover IoT and smart environments, digital twins, data science, deep learning, security and privacy modeling, and human-centered computing
- Submission via EasyChair; includes a PhD/MS/BS forum, tutorials and workshop proposals
- Not listed in ICORE2026 or the CCF 2026 list
