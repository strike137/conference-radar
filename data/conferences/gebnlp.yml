id: gebnlp
name: GeBNLP
full_name: Workshop on Gender Bias in Natural Language Processing
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizing committee (2026 organizers from Instituto de Telecomunicacoes, Alexandria University, FAIR at Meta, University of Stuttgart, IT University of Copenhagen, University of Amsterdam, Bocconi University and ETH AI Center); co-located with ACL-family conferences
organizer_country: [europe]
proceedings: ACL Anthology
archival: true
links:
  website: https://gebnlp-workshop.github.io/
notes:
- Workshop on measuring and mitigating gender bias (and intersecting biases) in NLP and LLMs
- Held since 2019 (ACL 2019, COLING 2020, ACL-IJCNLP 2021, NAACL 2022, ACL 2024, ACL 2025, AACL 2026); no edition in 2023
- 7th edition at AACL 2026 (Hengqin, China) on November 9, 2026, held fully remotely
- Proceedings in the ACL Anthology (36 papers in 2025, 27 in 2024)
- Long papers up to 8 pages and short papers up to 4 pages; blind review; direct submission or ARR commitment; non-archival option available
- Not ranked in ICORE2026 and not on the CCF list
