language: english
frequency: irregular
organizer: Workshop organizing committee (2025 organizers from TU Dortmund, Colby College, Ruhr University Bochum, Heidelberg
  University, University of Mannheim and University of Technology Nuremberg); co-located with ACL-family conferences
organizer_country: [europe, usa]
proceedings: ACL Anthology
