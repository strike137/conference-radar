typical:
  deadline_months: [9]
  conference_months: [11, 12]
links:
  website: https://eval4nlp.github.io/
notes:
- Workshop on evaluation metrics, evaluation data, human evaluation and sound reporting of results for NLP systems and LLMs
- Held at EMNLP 2020 (online), EMNLP 2021 (Punta Cana), AACL 2022 (online), AACL 2023 (Bali) and IJCNLP-AACL 2025 (Mumbai); no edition in 2024
- Long papers up to 8 pages and short papers up to 4 pages; double-blind review through OpenReview
- Also accepts pre-reviewed papers committed with ARR or recent ACL-family reviews
- Proceedings in the ACL Anthology (15 papers in 2025, 20 in 2023)
- Not listed in ICORE2026 and not on the CCF list
