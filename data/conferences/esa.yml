notes:
- Main European conference on design and analysis of algorithms; CORE A, CCF B
- Held every year as the core of ALGO together with ALGOCLOUD, ALGOWIN, ATMOS, IPEC, WABI and WAOA
- Always in Europe (Amsterdam 2023, Egham 2024, Warsaw 2025, L'Aquila 2026)
- "Three tracks: Track A (design and analysis), Track E (engineering and applications), Track S (simplicity)"
- Proceedings in the open-access LIPIcs series (Schloss Dagstuhl); 500-line limit with socg-lipics class
- Single-blind review; at least one author must attend on-site
- Best Paper and Best Student Paper awards sponsored by EATCS
