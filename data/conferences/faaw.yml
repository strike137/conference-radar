notes:
- Workshop on agent registries, discovery, identity, Web protocols (A2A, MCP), orchestration, economics and governance for the Agentic Web
- First edition (FAAW'26) at The Web Conference 2026, planned for April 2026 in Dubai and held virtually on June 30, 2026 after the conference was postponed
- Papers appear in The Web Conference 2026 Companion Proceedings (ACM DL)
- Research, position and industry/demo papers up to 4 pages including references; non-anonymous, single-blind review
- Several organizers run the related AGORA workshop on the Agentic Web at The Web Conference 2027
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
