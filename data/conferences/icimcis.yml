notes:
- Run by the Faculty of Computer Science, UPN Veteran Jakarta, Indonesia; held every year since 2019
- Accepted papers are submitted to IEEE Xplore and Scopus; the 2019 to 2025 proceedings are in IEEE Xplore
- Four tracks (informatics, cyber security, multimedia, information system); EDAS submission, IEEE template, 6
  pages included and up to 10 pages with an extra page charge of 15 USD per page
- Held in the Jakarta area (Hotel Episode Gading Serpong, Tangerang 2024 and 2026; Ibis Styles Jakarta
  Simatupang 2025); held together with the national conferences SEINASI-KESI and SENABDIKOM
- Long rolling submission window (opens in April to June, closes between late August and late October)
- Not listed in ICORE2026 and not in the CCF list; a small regional venue
