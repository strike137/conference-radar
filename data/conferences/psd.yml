notes:
- Biennial conference on statistical disclosure control and database privacy, held in even years since 2004
- Organized by the CRISES group at Universitat Rovira i Virgili (Tarragona, Spain)
- 'Held in Europe: Dubrovnik 2016, Valencia 2018, Tarragona 2020, Paris 2022, Antibes 2024, Cadiz 2026'
- Selected papers go to Springer LNCS (PSD 2026 is LNCS 16925); the rest appear in a USB volume for attendees only
  and authors keep the right to publish them elsewhere
- A separate later USB-only submission track exists
- Papers at most 12 pages excluding bibliography and appendices, 16 pages total, LNCS format
- CORE C; not on the CCF list
