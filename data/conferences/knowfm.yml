notes:
- Workshop on knowledge in large language and foundation models (knowledge probing, RAG, knowledge editing, hallucination,
  knowledge conflicts, multimodal and agentic knowledge)
- Started as KnowLLM (Towards Knowledgeable Language Models) at ACL 2024 in Bangkok; renamed KnowFM for AAAI 2025
  (Philadelphia), ACL 2025 (Vienna) and ACL 2026 (San Diego, 4th edition)
- Proceedings of the ACL editions in the ACL Anthology (17 papers in 2024, 13 in 2025, 15 in 2026)
- Regular papers (up to 8 pages, ACL template) go into the proceedings; non-archival submissions also accepted
- Double-blind review via OpenReview; submission deadline set after the ACL main conference notification
- Best Paper and Outstanding Paper awards
- Not listed in ICORE2026 and not on the CCF list
