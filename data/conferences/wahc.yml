notes:
- One-day workshop co-located with ACM CCS; location follows CCS (2025 Taipei, 2026 The Hague); 2026 is the 14th edition
- Run by the HomomorphicEncryption.org standardization consortium (open industry, government and academic group);
  organizing committee from Duality Technologies and Optalysys
- Proceedings published by ACM in the ACM Digital Library
- Focus on practical fully homomorphic encryption, encrypted computing, FHE compilers and applications; strong
  industry participation
- Anonymous submissions up to 12 pages in ACM double-column format including references and appendices; demo papers
  up to 6 pages
- At least one author per accepted paper is expected to attend in person; registration is through CCS
- Small program (7 accepted papers in 2025 and 7 in 2026)
- Not listed in the CORE portal (ICORE2026)
