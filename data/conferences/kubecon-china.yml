notes:
- CNCF flagship practitioner conference on Kubernetes and cloud native computing, China edition run by The Linux Foundation
- Umbrella event whose name changes with its partners -> with Open Source Summit (2023), Open Source Summit + AI_dev (2024), KubeCon + CloudNativeCon China only (2025), OpenInfra Summit + PyTorch Conference (2026)
- Recent venues -> Hong Kong (2024, 2025) and Shanghai (2026)
- Bilingual English and Chinese event site; 2026 website hosted at lfopensource.cn
- Talk proposals reviewed by a program committee; no papers, only session recordings posted afterwards on YouTube
- 2026 had co-located OSPOlogy + OSPO Summit and AGNTCon + MCPCon China
