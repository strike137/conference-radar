notes:
- Main yearly meeting of the LLVM compiler community (LLVM, Clang, MLIR, Flang, LLDB and related projects), organized by the LLVM Foundation
- Held every October in the San Francisco Bay Area (San Jose until 2022, Santa Clara Marriott since 2023)
- Separate EuroLLVM (spring, Europe) and AsiaLLVM meetings are run by the same community
- Technical talks, tutorials, student technical talks, quick and lightning talks, panels and posters; proposals reviewed by a program committee via HotCRP; speaker details are not shown to the committee
- Co-located workshops on the first day (2026 workshops on October 26, main program October 27 to 28)
- No papers; slides and videos of talks are posted on llvm.org; LLVM Foundation student travel grants available
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
