notes:
- Largest Python community conference in Colombia, held since 2017; 2026 was the tenth edition
- Held at Universidad EAFIT in Medellin in 2024, 2025 and 2026
- Three days of keynotes, talks and workshops in English and Spanish, with about 600 attendees expected in 2026
- Topics range from core Python and web to data science, AI, MLOps and cybersecurity
- Speakers are chosen from a call for proposals; no papers or proceedings
