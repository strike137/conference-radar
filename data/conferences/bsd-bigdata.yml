notes:
- Workshop on management, mining and AI for large-scale spatial and spatio-temporal data (raster, vector, road networks, geosensing); 2026 is the 9th edition
- Held with the IEEE International Conference on Big Data (BSD 2024 in Washington DC, BSD 2026 in Phoenix)
- All accepted workshop papers go into the IEEE BigData workshop proceedings (IEEE Computer Society Press, IEEE Xplore)
- Full papers up to 10 pages; short, demo and vision papers up to 4 pages
- Hybrid workshop with a keynote and a panel
- Deadline extended twice in 2026 (Oct 15 -> Oct 28 -> Nov 1)
- Not ranked by CORE (not in ICORE2026) or CCF
