links:
  website: https://sitcon.org/
notes:
- Student-run tech conference in Taiwan, started in 2012 with yearly conferences since 2013; organized by students for students
- Talks only, no papers or proceedings; general talk, open session and (from 2026) demo exhibition calls
- Free of charge for attendees; held on one Saturday in March at the Academia Sinica Humanities and Social Sciences Building, Taipei
- General computing and open source rather than security, AI or networking specifically; official site mainly in Chinese
- The community also runs SITCON Camp, SITCON Hackathon and Hour of Code events
