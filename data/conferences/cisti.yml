notes:
- Broad information systems and technologies conference held every June, alternating between Portugal and Spain
  (Aveiro 2023, Salamanca 2024, Lisbon 2025, Santiago de Compostela 2026, Porto 2027)
- General chair is Alvaro Rocha (Lusofona University); hybrid, with online participation possible
- Papers in English, Spanish or Portuguese; English papers go to Springer LNNS (four volumes), Spanish and Portuguese
  papers to a separate ITMA book
- The 2024 call announced IEEE Xplore; the official proceedings page now lists Springer LNNS volumes for 2024 to 2026
- Blind review by at least two reviewers; full, short, poster and company papers; doctoral symposium and workshops
- Not ranked in CORE ICORE2026
