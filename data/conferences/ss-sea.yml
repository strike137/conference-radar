notes:
- Annual software engineering symposium of the Software Engineers Association (SEA), held every June in a different
  Japanese city; 2026 was the 46th meeting
- Mixes practitioners and researchers; categories are research papers and experience papers (5 to 10 pages), Future
  Presentation (about 2 pages) and case reports (abstract plus slides), plus working group discussions
- Submissions are peer reviewed by the program committee; best paper, paper encouragement and best presentation
  awards
- Accepted papers are published in the symposium proceedings on J-STAGE (marked peer reviewed) and on the symposium
  site after the meeting
- Papers in Japanese in principle; English papers are accepted but talks must be in Japanese
- Hybrid since 2022 (on site plus online); submission is by email to the program committee
