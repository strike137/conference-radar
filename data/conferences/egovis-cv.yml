notes:
- CVPR workshop on egocentric (first-person) vision that joins the EPIC, Ego4D, HBHA and Aria events; first EgoVis edition at CVPR 2024
- Successor of the EPIC workshop series (since ECCV 2016) and the joint Ego4D and EPIC workshops (2022, 2023)
- Hosts challenges on HoloAssist, Ego4D, Ego-Exo4D, EPIC-KITCHENS and HD-EPIC; challenge entrants submit 2 to 6 page technical reports
- 2026 added a full paper track (max 8 pages, CVPR format, double-blind, at least two reviewers, via CMT) published with the CVPR proceedings
- 2024 and 2025 editions accepted only non-archival extended abstracts
- 2 full papers appeared in CVF Open Access in 2026; extended abstracts (2 to 4 pages) stay non-archival
- Not listed in ICORE2026 or the CCF list
