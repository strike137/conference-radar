notes:
- Workshop on implicit, underspecified, vague and ambiguous language, annotator disagreement, pragmatics and multimodal
  disambiguation
- Held in 2021 (ACL-IJCNLP), 2022 (NAACL) and 2024 (EACL, Malta)
- Archival long (8 pages) and short (4 pages) papers plus non-archival extended abstracts (2 pages) and copies of published
  work; submission through OpenReview
- Also takes ARR pre-reviewed papers and Findings papers looking for a presentation slot
- Proceedings in the ACL Anthology (9 papers in 2024, 5 in 2022, 9 in 2021)
- Not ranked in ICORE2026 and not on the CCF list
