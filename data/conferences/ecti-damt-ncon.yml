notes:
- Joint event of the International Conference on Digital Arts, Media and Technology (DAMT, 12th edition in 2027)
  and the ECTI Northern Section Conference (NCON, 10th edition in 2027)
- Formed by ECTI Thailand with universities in Northern Thailand; held in Thailand every year so far (2024 Chiang Mai,
  2025 Nan, 2026 Chiang Mai), usually late January to March
- 2027 edition moves to Hokkaido, Japan in May, co-hosted by Chitose Institute of Science and Technology and the
  University of Phayao
- IEEE Xplore proceedings (ISSN 2768-4644); papers not presented at the conference are excluded from IEEE Xplore
- Two submission rounds via EDAS; tracks span digital arts and media, AI and ML, cybersecurity, IoT and edge computing,
  software engineering, power and electronics
- Not listed in ICORE2026; small regional venue
