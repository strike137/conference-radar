notes:
- Annual Australian agile practitioner conference held since 2009 (AgileAus26 was the 18th), alternating between Sydney and Melbourne
- Audience of delivery leads, engineers, product managers, coaches and transformation leaders; recent programs also cover business agility and AI in teams
- Talks from a public call for expressions of interest (up to two per person) reviewed by 40+ volunteer reviewers; under 25 of 250+ selected (about 1 in 10), plus invited and sponsored sessions
- Formats are 30-minute presentations, one-hour Play & Do workshops, deep dives and 5-minute lightning talks
- "Fee: 770 AUD early bird, 990 AUD standard (2026, incl. GST); 40% off for self-funded attendees, discounts for students and NFPs"
- No papers or proceedings; talks only, not recorded in 2026
- Not listed in CORE ICORE2026
