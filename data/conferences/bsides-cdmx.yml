notes:
- Free Security BSides conference in Mexico City, run by volunteers and funded by sponsors
- Editions in 2018, 2019, 2023, 2024 and 2025; 2020 to 2022 were cancelled because of COVID-19, and no 2026 edition is listed
- One day in July with talks, hands-on workshops, a CTF and villages (Red Team, Blue Team, Car Hacking, OT/ICS, AI)
- Call for Content on Sessionize for 50 minute talks, 2 to 4 hour workshops, villages and CTF challenges
- Program is mostly in Spanish; proposals in Spanish and English are accepted
- 887 attendees in 2025 at Ex Fabrica MX
- Talks are recorded on YouTube, no proceedings
