notes:
- Flagship venue for automated software engineering and AI for SE; CORE A*, CCF A
- ASE 2025 was held in Seoul, Korea; ASE 2026 is in Munich (October 2026)
- Double-anonymous review with a major revision round; 10 pages plus 2 pages of references
- Early rejection stage introduced in 2026 for papers with all-negative reviews
- Because of the large number of submissions, ASE 2025 used a poster-first format (short teaser talk plus a poster
  session for every paper)
