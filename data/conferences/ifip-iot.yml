links:
  website: https://ifip-iotconference.org/
notes:
- Described on its site as IFIP's flagship event on research, innovation and application of the Internet of Things
- Broad IoT scope -> network protocols, embedded systems, security and privacy, AI for IoT, data analytics, social and legal aspects
- Proceedings in the Springer IFIP AICT series ("Internet of Things" volumes); extended versions of top papers invited to journal special issues
- Held in a different country almost every year (Poznan 2018, Tampa 2019, virtual 2020 and 2021, Amsterdam 2022, Denton TX 2023, Nice 2024, Hyderabad 2025, Al Ain 2026)
- Full papers up to 18 pages in Springer format, non-blind review via EasyChair
- 2026 used phased submission cycles with rolling notifications and a final deadline in August; hybrid format, online presentation on request
- Not listed in the ICORE2026 portal
- Not on the CCF 2026 recommended list
