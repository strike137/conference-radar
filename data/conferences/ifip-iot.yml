id: ifip-iot
name: IFIP IoT
full_name: IFIP International Internet of Things Conference
type: conference
tier: minor
areas: [networking, security, ai]
region: worldwide
language: english
frequency: annual
organizer: IFIP (steering committee) with a host university each year (2026 UAE University; 2025 Osmania University, JNTU Hyderabad and NIT Warangal)
organizer_country: [international]
proceedings: Springer IFIP AICT
archival: true
indexing: [Scopus]
typical:
  deadline_months: [8, 9]
