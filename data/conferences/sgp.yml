notes:
- Main specialist venue for geometry processing (meshing, parameterization, shape analysis, geometric deep learning), run under the Eurographics Association
- Proceedings appear as a regular issue of Computer Graphics Forum, with a two-stage review (conditional acceptance, then final acceptance)
- Two submission rounds per year (2026 used February and April deadlines); dataset papers are also accepted
- A two-day Graduate School for students new to the field runs just before the conference
- Mostly held in Europe (Genova 2023, Bilbao 2025, Bern 2026), but recent editions were also remote (2021 hosted from Toronto, 2022) and in Cambridge MA (2024)
- 2027 edition is part of the International Geometry Summit in Singapore together with SMI, SPM, GMP and SIAM GD
- ICORE2026 B, CCF B (computer graphics and multimedia)
