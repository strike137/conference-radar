notes:
- Hacker conference in Hong Kong run by the VXRL community; the site lists editions since 2017 and calls 2026 the 10th anniversary
- 2026 format is a main conference day at the Marco Polo Hongkong Hotel (Tsim Sha Tsui) plus a workshop and village day at PCCW Tower, Quarry Bay
- Workshops on car hacking, hardware, RFID and signaling security announced for the village day
- Talks are submitted through a Google Forms call for papers; tickets sold on Eventbrite
- No proceedings; industry talks only
