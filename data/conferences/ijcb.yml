links:
  website: https://ijcb2027.ieee-biometrics.org/
notes:
- Premier biometrics conference, joint venue of IEEE BTAS and IAPR ICB; 2026 was the 10th edition
- Double-blind review, 8 pages plus references, rebuttal phase; proceedings in IEEE Xplore
- CORE B and CCF C; 2025 edition was held in Osaka, Japan
- In-person only; each accepted paper needs one full (non-student) registration
- Also has special sessions, competitions and a doctoral consortium with their own deadlines (special session papers
  and doctoral consortium later than main papers)
