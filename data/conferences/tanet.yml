region: taiwan
language: mixed
frequency: annual
organizer: Rotating host university under the Ministry of Education and NSTC, Taiwan (NTUNHS in 2026)
organizer_country: [taiwan]
proceedings: TANET proceedings (full text for oral papers, abstract only for posters)
rank:
  core: Unranked
fee: NT$2,500 student presenter, NT$3,000 faculty/general presenter, banquet included (2026)
typical:
  deadline_months: [9, 10]
  conference_months: [10, 11, 12]
links:
  website: https://tanet2026.ntunhs.edu.tw/
notes:
- Annual conference of Taiwan's academic network (TANet) community, guided by the Ministry of Education and NSTC;
  host university rotates
- Co-held with ICS (International Computer Symposium) in 2022 and 2026 and with NCS (National Computer Symposium)
  in 2023 and 2025
- Oral papers 2-6 pages in Chinese or English; poster papers publish a 1-page abstract
- 2026 edition has two submission rounds (Sep 20 and Oct 9) with rolling notifications; TANET 2025 offered a best
  paper award
- Accepted papers need at least one registered presenter; extra papers by the same author cost NT$1,500 each (2026)
