id: mcsoc
name: IEEE MCSoC
full_name: IEEE International Symposium on Embedded Multicore/Many-core Systems-on-Chip
type: conference
tier: minor
areas: [systems]
region: southeast-asia
language: english
frequency: annual
organizer: MCSoC Forum steering board, sponsored by the IEEE Computer Society TCMM (Technical Committee on Microprocessors
  and Microcomputers), with a host university each year
organizer_country: [international]
proceedings: IEEE Xplore (IEEE CPS conference proceedings, also in the IEEE Computer Society Digital Library)
indexing: [Scopus, EI, DBLP]
fee: 620 USD IEEE member, 635 USD non-member (2026, author registration)
typical:
  deadline_months: [6, 9]
  conference_months: [12]
links:
  website: https://mcsoc-forum.org/
  dblp: https://dblp.org/db/conf/mcsoc/
notes:
- Started in 2004 at UEC, Tokyo as the International Workshop on Systems-on-Chips (SoC) and renamed MCSoC in 2007; covers
  embedded multicore and many-core SoC architecture, NoC, chiplets, neuromorphic computing and AI accelerators
- Proceedings in IEEE Xplore and the IEEE Computer Society Digital Library; selected papers invited to journal special
  issues
- Held in Singapore or Malaysia from 2021 to 2025 (2025 in December); 2026 is in Shanghai, China in December and the
  20th edition (2027) moves to May at UEC, Tokyo
- 2025 and 2026 had two independent submission rounds (roughly June and September), often extended; 2027 has a single
  deadline (November 2026)
- Hybrid format with onsite or online presentation; also accepts short papers and presentation-only contributions
  (presentation-only work is not included in the proceedings)
- Not ranked by CORE (not listed in ICORE2026) or CCF; regarded as a smaller venue
- Has a test, security and trust track for embedded multicore systems
