notes:
- Annual national convention of IEEJ, the counterpart of the IEICE General Conference; held every March at a university
  that rotates around Japan (Tokushima 2024, Meiji University Tokyo 2025, Tohoku Gakuin University Sendai 2026, Kanazawa
  University 2027)
- Content is heavy on electric power, energy and power electronics, with sessions on electronics, information and
  systems, so it is borderline for general EECS
- No peer review described; 1 or 2 page A4 paper in Japanese or English, 8 min talk plus 3 min Q&A; each person may
  present only one paper as presenting author
- Application and PDF manuscript share one strict deadline in early January (19:00); proceedings are released on March 1
- Around 40 Excellent Paper Presentation Awards for presenters aged 35 or under
