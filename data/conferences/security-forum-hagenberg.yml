notes:
- Two-day IT security conference held every spring at FH Oberoesterreich Campus Hagenberg, Austria; running since 2003
- Organized by students of the Secure Information Systems programme through their association, the Hagenberger Kreis
- Call for participation for 50-minute talks (about 250-word abstract by email); a committee selects talks
- Technical/scientific track and management/legal track
- Talks in German and English; 2026 had 21 talks and more than 300 expected attendees
- No proceedings; speaker details and abstracts are printed in participant materials
