notes:
- Held jointly with NSS (International Conference on Network and System Security) each year
- Started in 2015 (Hangzhou); about half the editions in China, others in Fiji, Melbourne, Santa Clara, Copenhagen,
  Canterbury and Abu Dhabi
- Proceedings in Springer LNCS; small volume (12 papers from 25 submissions in 2025)
- Anonymous submissions up to 20 pages single column; the 2025 deadline was extended twice
- Selected papers invited to journal special issues (e.g., IJIS and Computers and Electrical Engineering in 2025)
