notes:
- ACM SIGCHI venue on interactive surfaces and spaces (large displays, touch and gesture, tangibles, AR/VR spaces, shape-changing interfaces)
- Formerly ACM Interactive Tabletops and Surfaces (ITS, 2009 to 2015) and TABLETOP (2006 to 2008)
- Full papers are journal articles in Proceedings of the ACM on Human-Computer Interaction (PACM HCI, ISS issue); posters, demos, workshops, tutorials and doctoral symposium go to companion proceedings in the ACM DL
- Two paper rounds per year (winter round in February, summer round in July) with a revise step before the final decision
- ACM Open access from 2026, so an article processing charge can apply
- No conference in 2025 for lack of hosting bids; the 2025 PACM HCI issue still ran and its authors were invited to present at ISS 2026
- Rotates worldwide (Lodz 2021, Wellington 2022, Pittsburgh 2023, Vancouver 2024, Turin 2026)
- CORE lists it as Journal Published (ICORE2026); CCF B (2026 list, ACM International Conference on Interactive Surfaces and Spaces)
