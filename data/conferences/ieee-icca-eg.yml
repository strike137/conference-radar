links:
  website: https://icca-conf.info/
notes:
- Broad computer science and applications conference; editions in 2017, 2018 and every year since 2022
- Proceedings published in IEEE Xplore (IEEE conference record 70833 in 2026); the site says ICCA 2025 proceedings were indexed by Scopus in May 2026
- Not listed in the CORE ICORE2026 portal; the site itself says it holds no CORE rank and only describes itself as comparable to CORE C
- Very short cycle in 2026 (submission Nov 30, notification Dec 11, camera-ready Dec 17, conference Dec 21-24)
- Large volume; the site claims about 600 papers from 50 countries per edition
- Single-blind review via EDAS; papers up to six IEEE pages, fee covers one paper only
- Held in the Middle East (Arab Open University Bahrain 2025 hybrid, British University in Egypt Cairo 2026)
- Not the same venue as ICCA (International Conference on Computing Advancements, Bangladesh)
