notes:
- Long-running Cambridge Security Protocols Workshop, first held in 1993; post-proceedings in Springer LNCS since 1996
- Attendance by invitation only; to be invited you submit a short position paper (up to 5 pages LNCS)
- Discussion workshop for new, unfinished ideas; LNCS post-proceedings include revised papers and edited transcripts of the discussions
- Held in Cambridge, UK (Brno, Czech Republic in 2016); recent editions 2023 and 2025 after a break from 2020 to 2022
- 2025 (29th) edition was dedicated to the memory of Ross Anderson
