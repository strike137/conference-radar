id: ieee-cdc
name: IEEE CDC
full_name: IEEE Conference on Decision and Control
type: conference
tier: top
areas: [general, systems]
region: worldwide
language: english
frequency: annual
organizer: IEEE Control Systems Society (CSS), in cooperation with EUCA and SICE
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
fee: 975 USD non-member, 800 USD IEEE member, 250 to 500 USD students (2026, early registration)
typical:
  deadline_months: [3]
  conference_months: [12]
links:
  website: https://cdc2026.ieeecss.org/
notes:
- Flagship conference of the IEEE Control Systems Society, held annually since 1962; the 65th edition is in 2026
- Rotates worldwide (Cancun 2022, Singapore 2023, Milan 2024, Rio de Janeiro 2025, Honolulu 2026, Lisbon 2027)
- Regular and invited papers up to 8 pages for CDC only (pages beyond 6 cost extra), 6 pages when submitted jointly
  with IEEE Control Systems Letters (L-CSS)
- The L-CSS option publishes the paper in the journal and presents it at CDC, with an earlier deadline
- Submission via PaperPlaza; final papers must be IEEE Xplore-compatible and carry an IEEE copyright form
- Workshops on the day before the main conference
- Not listed in CORE ICORE2026 or the CCF 2026 list
