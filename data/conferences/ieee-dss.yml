notes:
- Data science and data systems conference; 11th edition in 2025 (Exeter)
- Always co-located with IEEE HPCC; until 2023 papers appeared in joint HPCC/DSS/SmartCity/DependSys proceedings,
  since 2024 in its own IEEE volume
- Recent editions in Haikou (2021), Hainan (2022), Melbourne (2023), Wuhan (2024), Exeter (2025) and Luoyang (2026)
- Single-blind review via EDAS; 8 pages IEEE CS format (10 with over-length charge)
- Four tracks (data science, data processing technology, data systems, data applications)
- Not ranked by CORE (ICORE2026) or CCF; deadlines are usually extended by about three weeks
