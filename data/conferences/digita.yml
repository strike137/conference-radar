id: digita
name: DIGITA
full_name: International Workshop on Digital Twins Ecosystems and Applications
type: workshop
tier: minor
areas: [systems, networking, software]
region: worldwide
language: english
frequency: annual
organizer: DIGITA organizing committee (University of Urbino, University of Bologna, University of Modena and Reggio Emilia, Aarhus University), held with IEEE PerCom
organizer_country: [europe]
proceedings: IEEE Xplore (PerCom satellite events proceedings)
archival: true
typical:
  deadline_months: [11, 12]
  conference_months: [3]
links:
  website: https://digita-percom.github.io/
notes:
- Workshop on digital twin ecosystems in pervasive computing (modelling, simulation, AI and IoT integration, interoperability, security and privacy, applications)
- Held with IEEE PerCom; 2025 Washington D.C., 2026 Pisa, 2027 Goa (third edition)
- Grew out of the MADTECC workshop at PerCom 2024
- Accepted papers go into the PerCom satellite events proceedings published by IEEE
- Papers up to 6 pages including references (1 extra page can be bought), IEEE 2-column template, single-blind review, submitted via HotCRP
- Each accepted paper needs a full PerCom registration and in-person presentation; no workshop-only registration
- Not listed in the CORE ICORE2026 portal
