notes:
- Sponsored by ACM SIGSAC; running since 1995 (ACM Workshop on Role-Based Access Control until 2000)
- Two review cycles (October and February/March) with double-blind review; Cycle 1 major revisions can be resubmitted
  to Cycle 2, Cycle 1 rejects cannot
- Tracks for main research (10 pages), BlueSky, dataset/tool, SoK and work-in-progress papers
- Mostly held in North America with some European editions (Trento 2023, Durham 2027)
