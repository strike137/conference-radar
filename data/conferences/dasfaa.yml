notes:
- Asia's main international database conference; always held in Asia-Pacific (Gifu 2024, Singapore 2025, Jeju 2026,
  Shenyang 2027)
- Proceedings in Springer LNCS; up to 16 pages in LNCS format; double-blind review
- Scope goes beyond databases to data science, AI, LLM and RAG, knowledge graphs, and security and privacy
- Deadline in October or November for an April or May conference; deadlines announced as firm; every accepted paper
  needs its own author registration
