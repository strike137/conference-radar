notes:
- Workshop on stereotypes and bias in language technologies from a cross-cultural angle (definitions, measurement,
  mitigation, data practices, red-teaming)
- First edition on July 3, 2026, co-located with ACL 2026 in San Diego, USA; hybrid
- Proceedings in the ACL Anthology (2026.stereacult-1, 12 papers)
- Long papers up to 8 pages and short papers up to 4 pages in ACL format; submission via OpenReview, ARR-reviewed
  papers also accepted
- Not listed in the CORE ICORE2026 portal or on the CCF list
