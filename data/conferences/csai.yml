links:
  website: https://www.csai.org/
notes:
- Smaller commercially organized conference on AI, machine learning, data, vision, security and HCI
- Held in Beijing every December since 2021 (online in 2021 and 2022)
- Proceedings 2017 to 2025 in the ACM Digital Library, listed as indexed in Ei Compendex and Scopus
- Papers at least 6 pages, extra charge above 8 pages; abstract-only presentation possible without publication
- Rolling review with results about 20 to 40 days after submission
- Not listed in the CORE portal (ICORE2026)
