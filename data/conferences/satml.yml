notes:
- Young IEEE venue (first edition 2023) dedicated to ML security, privacy and trustworthiness; sponsored by the
  IEEE CS Technical Committee on Security and Privacy
- Double-blind review with early rejection, interactive discussion and a revision outcome; mandatory abstract registration
  from 2027
- Accepts research, SoK and position papers (up to 12 pages); from 2027 submitted papers cannot be withdrawn mid-review;
  in-person presentation required
- Not yet ranked by CORE or CCF but well regarded in the adversarial ML community
- Held in North America (Raleigh 2023, Toronto 2024) and Europe (Copenhagen 2025, Munich 2026, Reykjavik 2027)
