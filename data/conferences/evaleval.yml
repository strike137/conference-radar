links:
  website: https://evalevalai.com/events/2026-acl-workshop/
notes:
- Workshop on how generative AI evaluations are designed, validated and used, including social impact evaluation
- Held at NeurIPS 2024 (Vancouver) and ACL 2026 (San Diego); in person
- Full (6 to 8 pages), short (up to 4 pages) and tiny (up to 2 pages) papers; two-way anonymized review on OpenReview
- Non-archival by default; accepted authors may opt in to archival publication (22 papers in the ACL Anthology in 2026)
- Previously published papers, including ACL 2026 main and Findings papers, may be submitted
- Authors are expected to serve as reviewers
- Not listed in ICORE2026 and not on the CCF list
