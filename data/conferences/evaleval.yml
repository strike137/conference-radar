id: evaleval
name: EvalEval
full_name: 'Workshop on Evaluating Evaluations: Examining Best Practices for Utilizing and Developing Generative Model Evaluations'
type: workshop
tier: minor
areas: [ai, nlp]
region: worldwide
language: english
frequency: irregular
organizer: EvalEval Coalition (program chairs from ETH Zurich, Weizenbaum Institute and TU Munich, MIT and IBM Research,
  Hugging Face, Iowa State University, EleutherAI and University of Edinburgh)
organizer_country: [usa, europe]
proceedings: ACL Anthology (2026, opt-in archival)
archival: true
typical:
