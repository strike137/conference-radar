notes:
- Formerly DCOSS (International Conference on Distributed Computing in Sensor Systems, since 2005); renamed DCOSS-IoT
  in 2023 when the scope widened from sensor networks to smart systems and IoT
- ICORE2026 lists it as B under the old name (IEEE International Conference on Distributed Computing in Sensor
  Systems); not in the CCF 2026 list
- Proceedings in IEEE Xplore; technical co-sponsorship by the IEEE Computer Society and TCPP
- Double-blind review; 8 pages max plus up to 2 appendix pages at 100 USD per page
- Held in June; rotates between Europe, North America and elsewhere (2023 Pafos, 2024 Abu Dhabi, 2025 Lucca, 2026
  Reykjavik, 2027 Montreal)
- Around a dozen co-located workshops plus a poster and demo track; workshop papers also go into the IEEE proceedings
- Main deadline has been extended by about two weeks in recent years
- Selected papers invited to journal special issues (IEEE TNSE in 2026, Computer Networks in 2025)
