notes:
- Workshop held with IFIP Networking on extended reality over B5G/6G networks (XR coding, transmission, QoE, edge computing, haptics, security and societal impact)
- First edition with IFIP Networking 2024 (Thessaloniki), second with IFIP Networking 2025 (Limassol)
- Papers up to 6 pages in IEEE double-column format, submitted via EDAS; oral and poster sessions, posters may add a demo
- Papers appear in the IFIP Networking proceedings and are submitted to IEEE Xplore
- In-person only (2025)
- Not in the IFIP Networking 2026 workshop list
- Not listed in the ICORE2026 portal or the CCF 2026 list
