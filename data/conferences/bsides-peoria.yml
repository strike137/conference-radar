notes:
- Security BSides conference in Peoria, Illinois, USA, run by the Illinois Cyber Foundation
- One-day event on a Saturday in October at Bradley University
- 45-minute talk slots with up to two speakers; first-time speakers are encouraged and vendor pitches are rejected
- Talk proposals through Sessionize with rolling review; free for speakers but travel is not covered
- Villages and competitions alongside the talks; no proceedings
