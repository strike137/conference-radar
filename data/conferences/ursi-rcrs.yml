id: ursi-rcrs
name: URSI-RCRS
full_name: URSI Regional Conference on Radio Science
type: conference
tier: minor
areas: [communications]
region: south-asia
language: english
frequency: biennial
organizer: Indian Radio Science Society (InRaSS) with a host institute (2026 Indian Institute of Geomagnetism)
organizer_country: [india]
proceedings: IEEE Xplore (summary papers)
archival: true
fee: About Rs.6000 to 10000 regular, Rs.4000 to 5000 student (2026, early)
typical:
  deadline_months: [7]
  conference_months: [10, 11]
links:
  website: https://iigm.res.in/ursi.rcrs2026/index.html
notes:
- Biennial flagship conference of the Indian Radio Science Society, covering all ten URSI scientific commissions
  (metrology, fields and waves, radio communication, electronics and photonics, EMC, remote sensing, ionosphere,
  plasma waves, radio astronomy, bioelectromagnetics)
- Held in India at a different host each time (Pune 2014, New Delhi 2015, Tirupati 2017, Varanasi 2020, Indore 2022,
  Bhimtal 2024, New Panvel 2026)
- Extended abstracts (one page) or summary papers (2 to 4 pages), peer reviewed; summary papers are submitted to IEEE
  Xplore unless authors opt out
- URSI Young Scientist Awards and a Student Paper Competition; pre-conference workshops
- Not listed in CORE ICORE2026 or the CCF list
