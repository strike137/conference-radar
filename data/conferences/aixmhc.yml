notes:
- One of the AIx conferences (with AIxSET, AIxHEART and AIxB) that replaced ai4i and TransAI in 2024; same organizer group as IEEE AIxVR and IEEE ISM
- Covers AI for medicine, health, mental health, well-being and senior care
- Proceedings published by IEEE Computer Society Press (2025); 2026 papers submitted for inclusion in IEEE Xplore
- Regular (6 pages), short (4 pages) and position (2 pages) papers in IEEE double-column format, at least three reviewers per paper
- Also has poster abstracts, co-located workshops and a journal-first presentation track
- Held in Laguna Hills, California (2024, 2026, 2027) and Taichung, Taiwan (2025, at Asia University); hybrid format
- A summer edition (AIxSummer) shared with AIxB, AIxHEART and AIxSET is announced for June 7-8 2027 in Nagano, Japan
- Not listed in ICORE2026; not on the CCF list
