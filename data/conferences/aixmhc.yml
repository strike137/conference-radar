organizer: AIx conference series led by Phillip Sheu (UC Irvine); 2025 edition hosted by Asia University, Taiwan
organizer_country: [usa]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [5, 6]
  conference_months: [8, 9, 10]
links:
  website: https://www.aixmhc.org/
notes:
- One of the AIx conferences that replaced ai4i (AI for Industries) and TransAI in 2024; usually co-located with sibling AIx venues
- Held in Laguna Hills, California (2024, 2027), Taichung, Taiwan (2025) and a Summer Edition in Nagano, Japan (2026)
- Proceedings submitted to IEEE Xplore (published by the IEEE Computer Society Press in 2025)
- Regular papers 6 pages, short 4, position 2, in IEEE double-column format; at least three reviewers per paper
- Hybrid format with remote presentation allowed
- Not listed in ICORE2026 or the CCF 2026 list
