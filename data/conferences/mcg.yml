notes:
- Workshop on generating counterspeech (counter narratives) against online hate speech in English and lower-resourced languages, with LLMs
- 1st edition held at COLING 2025 on 19 January 2025, entirely online via Zoom, together with a joint shared task
- Organizers from HiTZ Center (UPV/EHU, Spain), Fondazione Bruno Kessler (Italy) and University of Jaen (Spain)
- Regular papers up to 8 pages, double-blind review via START; accepted papers appear in the ACL Anthology (10 papers in 2025.mcg-1)
- Non-archival track for cross-submissions and 2-page extended abstracts
- Only one edition so far; no later edition in the ACL Anthology as of 2026-11
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
