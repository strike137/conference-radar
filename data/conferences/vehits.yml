notes:
- Organized by INSTICC; proceedings in the SCITEPRESS Digital Library, a short list of revised and extended papers
  may go to a Springer CCIS book and best papers to a Springer Nature Computer Science special issue
- Proceedings are submitted for evaluation for Web of Science CPCI indexing
- CORE C (ICORE2026); regarded as a minor venue
- 'Topics: connected vehicles, intelligent transport systems and infrastructure, intelligent vehicle technologies,
  smart mobility and data analytics'
- Two submission stages (1st stage gives an earlier notification), plus late-breaking papers and an abstracts track
- Held in European cities (Prague 2023, Angers 2024, Porto 2025, Benidorm 2026, Rome 2027), co-located with other
  INSTICC conferences (CSEDU, SMARTGREENS, CLOSER, IMPROVE and IoTBDS in 2027); remote presentation allowed
