notes:
- Half-day co-located workshop of IEEE ISCC, held with ISCC 2025 (Bologna) and ISCC 2026 (Vilamoura)
- Accepted papers go into the ISCC proceedings and are submitted to IEEE Xplore
- IEEE double-column papers up to 6 pages including references at no extra charge; pages beyond 6 incur fees; submission via EDAS
- Chairs from the University of L'Aquila and CNIT, Italy; sponsored by the SNS SEASON project
- Topics include edge computing for multimedia services over 5G and beyond
- Deadlines are extended (2026 from March 15 to April 20)
- The ISCC site lists it as "NGSME"
- Not listed in CORE ICORE2026 or the CCF list
