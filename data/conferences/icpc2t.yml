notes:
- Electrical engineering conference run by the Department of Electrical Engineering, NIT Raipur, Chhattisgarh, India
- Scope covers power systems, power electronics and drives, smart grid, renewable energy, control, and computing topics such as IoT, data analytics and AI/ML for electrical systems
- Editions in 2020, 2022, 2024, 2025 and 2026 (fifth edition); proceedings of all earlier editions are in IEEE Xplore
- Registered and presented papers are submitted to IEEE Xplore; papers up to 6 pages in IEEE format, submitted via Microsoft CMT
- 2026 edition was hybrid
- Not listed in ICORE2026 or the CCF list
