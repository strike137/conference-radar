notes:
- Workshop co-located with ACM MobiHoc; first edition 2025 (Houston), second edition 2026 (Tokyo)
- Topics are federated learning, digital twins, privacy-preserving and distributed AI for mobile, autonomous and IoT systems
- Papers up to 6 pages in the ACM double-column template; single-blind review; submission via HotCRP
- Accepted papers appear in the ACM Digital Library as part of the MobiHoc workshop proceedings
- ACM Open Access from 2026; APC of 250 USD (ACM/SIG members) or 350 USD (non-members) unless the institution is in ACM Open
- 2025 program had five papers in a half-day morning session
- Not listed in CORE ICORE2026 or the CCF list
