notes:
- Workshop on hybrid intelligent systems run by the Mexican Society of Artificial Intelligence (SMIA) as part of MICAI; 19th edition in 2026
- Held every year in Mexico since at least 2016 (Mérida 2023, Puebla 2024, Guanajuato 2025, Chihuahua 2026)
- Best papers go to Springer LNAI (MICAI workshop volumes since 2023, e.g. LNAI 14502); earlier editions in the journals Research in Computing Science and Polibits
- Papers of 8 to 12 pages in LNCS-LNAI format (MS Word only), submitted via Microsoft CMT; separate computer vision track and poster track
- Extended versions of best papers can go to the International Journal of Combinatorial Optimization Problems and Informatics
- Not the same venue as the CORE C International Conference on Hybrid Intelligent Systems (HIS); this workshop is not listed in CORE ICORE2026
