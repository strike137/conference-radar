notes:
- Organized by IARIA as part of the DigitalWorld congress, co-located with ICDS, ACHI, GEOProcessing, eTELEMED, eLmL and other IARIA spring events
- Covers knowledge acquisition and management, ontologies, annotation and extraction, and machine learning for knowledge processing
- Published open access in the IARIA ThinkMind library (ISSN 2308-4375); prints via Curran Associates; selected papers invited to IARIA journals
- Held in Europe every year (Porto, Venice, Barcelona, Nice, Lisbon in recent years); onsite or online presentation allowed
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- 19th edition in 2027
