notes:
- Half-day workshop held in conjunction with MICCAI since 2018, so it moves with MICCAI
- Focus on interpretability and explainability of machine learning in medical imaging; 2026 was the 9th edition
- Proceedings in Springer LNCS following the MICCAI workshop publication model (2025 -> LNCS 16464, 15 papers from 22 submissions)
- Papers of 8 to 10 pages including references in LNCS format, anonymized, three reviewers per paper
- Organizers in 2026 from Bern, Porto, Colorado, Cambridge, Khalifa University, JAIST, IBM Research Europe, Coimbra, HKUST and Utrecht
- Not listed in CORE ICORE2026 or the CCF 2026 list
