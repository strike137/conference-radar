id: oscar-arch
name: OSCAR
full_name: Workshop on Open-Source Computer Architecture Research
type: workshop
tier: minor
areas: [systems]
region: worldwide
language: english
frequency: annual
organizer: Luca Carloni (Columbia University, chair), Pradip Bose (IBM), Margaret Martonosi (Princeton), Sophia Shao (UC Berkeley), Caroline Trippel (Stanford); co-located with ISCA
organizer_country: [usa]
proceedings: None (no formal proceedings)
archival: false
typical:
  deadline_months: [5]
  conference_months: [6]
links:
  website: https://oscar-workshop.github.io/
notes:
- Workshop on open-source hardware (processors, accelerators, SoC components, CAD tools, FPGA and chip prototyping)
- Co-located with ISCA every year since 2022 (New York 2022, Orlando 2023, Buenos Aires 2024, Tokyo 2025, Raleigh 2026)
- Mix of invited talks and talks selected from 2-page abstracts submitted via EasyChair
- No formal proceedings; organizers may arrange a journal special issue for selected contributions
- Not the same as the invitation-only OSCAR (Open Systems Challenges, Agenda and Roadmap) workshop held with EuroSys 2026
- Not listed in CORE ICORE2026
