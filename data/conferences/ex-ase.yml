notes:
- Workshop on explainability in automated software engineering (explanations for testing, analysis and program repair, human-in-the-loop explainability, SE4AI and AI4SE, ethics and accountability)
- First edition in 2025, co-located with IEEE/ACM ASE 2025 in Seoul
- Full papers up to 8 pages, short and demo papers up to 4 pages, IEEE format; single-blind review by at least two PC members
- Accepted papers included in the ASE 2025 workshop proceedings (IEEE Xplore)
- Not among the ASE 2026 workshops; no second edition announced as of 2026-10-17
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
