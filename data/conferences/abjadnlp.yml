notes:
- Workshop on NLP for Arabic, Persian, Urdu, Kurdish and other languages written in Arabic script
- Held with COLING 2025 (Abu Dhabi), EACL 2026 (Rabat) and COLING 2027 (Macau); in person
- Long (8 pages) and short (4 pages) papers, double-blind review; accepts ARR-reviewed papers
- Proceedings in the ACL Anthology; 71 papers published in 2026 from over 90 submissions
- Runs several shared tasks each year (AI-generated text detection, authorship tasks, medical text classification in
  2027)
- Not listed in ICORE2026 and not on the CCF list
