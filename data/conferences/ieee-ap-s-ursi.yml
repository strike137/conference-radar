notes:
- Annual flagship symposium of IEEE AP-S held jointly with the URSI radio science meeting; covers antennas,
  propagation, electromagnetics and radio science
- Mostly held in North America (Portland 2023, Ottawa 2025, Detroit 2026, San Diego 2028) with some editions abroad
  (Florence 2024, Kyoto 2027)
- The 2027 Kyoto edition is held with the Japan National Committee of URSI (JNC-USNC-URSI Radio Science Meeting)
- "Two formats: a 3 to 4 page two-column paper that goes to IEEE Xplore unless authors opt out, or a one-page
  abstract (at least 250 words) that is not included in IEEE Xplore (2027 CFP)"
- Papers not presented at the conference are removed before the proceedings go to IEEE Xplore
- One registration can cover at most 2 papers
- Has a Student Paper Competition, Student Design Contest and several travel grants
- Antennas and propagation venue outside the usual CS rankings, not listed in ICORE2026
