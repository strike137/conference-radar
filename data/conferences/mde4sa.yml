links:
  website: https://mde4sa.github.io/
notes:
- Workshop on the interplay of model-driven engineering and software architecture, co-located with IEEE ICSA since 2023
- 1st and 2nd editions (2020, 2021) were co-located with ECSA; 2020 papers used the Springer CCIS format, 2021 papers went to CEUR with selected extended papers in a Springer LNCS post-proceedings volume
- Since 2023 accepted papers are published in the ICSA Companion Proceedings in IEEE Xplore
- Full papers up to 8 pages and short papers up to 4 pages, including references, IEEE CS proceedings format, submitted via the ICSA EasyChair
- At least one author must register, attend and present the paper
- No editions in 2022 and 2024; editions so far in L'Aquila 2020, virtual 2021, L'Aquila 2023, Odense 2025, Amsterdam 2026 and Sydney 2027
- Steering committee from Mälardalen University (Sweden) and Gran Sasso Science Institute (Italy)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
