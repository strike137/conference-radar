notes:
- Regional computing education conference of the CCSC (CCSC:MidSouth), held in cooperation with SIGCSE
- Refereed papers of at most 10 pages, anonymized for blind review, published in the Journal of Computing Sciences in Colleges and the ACM Digital Library
- Also panels, tutorials, workshops and posters with one-page abstracts in the proceedings
- Cancelled from 2020 to 2024; resumed in 2025 (Clarksville), 2026 at Lipscomb University, Nashville, Tennessee
- 2027 edition at Southeast Missouri State University, Cape Girardeau, Missouri
- Not listed in ICORE2026; not on the CCF list
