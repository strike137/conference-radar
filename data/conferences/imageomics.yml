notes:
- Workshop on machine learning and computer vision for extracting biological traits and knowledge from images and video
- Three editions so far, at AAAI 2024 (Vancouver), AAAI 2025 (Philadelphia) and NeurIPS 2025 (San Diego); host conference changes between editions
- Non-archival, accepted papers are not included in the host conference proceedings
- Short papers up to 5 pages and already published full papers up to 9 pages in NeurIPS style; anonymous review on OpenReview
- The 2025 edition had a second, later submission round
- Not listed in ICORE2026 and not on the CCF list
