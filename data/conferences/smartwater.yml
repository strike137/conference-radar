notes:
- Workshop held with IFIP Networking on sensor networks, IoT, edge computing and machine learning for water distribution and monitoring (leak detection, digital twins)
- Editions in Thessaloniki 2024, Limassol 2025 and Lugano 2026, always with IFIP Networking
- Papers up to 6 pages in IEEE double-column format, single-blind review via EDAS
- Papers appear in the IFIP Networking proceedings and are submitted to IEEE Xplore
- In-person only
- Deadlines were extended twice in 2026 (March 22 -> April 7 -> April 14)
- Not listed in the ICORE2026 portal or the CCF 2026 list
