notes:
- Annual programming languages workshop of the JSSST SIGPPL, held annually in Japan since 1999 (2020 cancelled,
  2021 and 2022 online)
- Four categories -> refereed unpublished papers (category 1, 10 to 15 pages in Japanese or English), talks on
  internationally published papers, posters and demos, and surveys or tutorials
- Proceedings go to participants only so category 1 papers can later go to international conferences or journals;
  simultaneous submission elsewhere may be allowed
- Hybrid with in-person presenters; 2026 in Takamatsu had 252 on-site and 274 total participants
- Paper award, presentation awards and poster awards voted by participants, plus sponsor awards for student posters
- PPL 2027 at Kyoto University Katsura Campus, just before TFP/TFPiE 2027 in Kyoto
