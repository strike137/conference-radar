notes:
- One-day workshop held with IEEE ICDE every year since 2015, so it moves with ICDE (2024 Utrecht, 2025 Hong Kong, 2026 Montreal)
- "Scope: data management on new hardware (GPUs, FPGAs, DPUs, SSDs, NVM, RDMA, CXL), main memory data management, hardware and software co-design, disaggregated storage and memory"
- Research and position papers up to 6 pages excluding bibliography, IEEE format, submitted on Microsoft CMT; early-stage work welcome
- ICDE workshop papers are published together with the ICDE conference proceedings
- Small workshop; 3 research papers and 2 keynotes in 2026
- Not listed in CORE ICORE2026 or in the CCF 2026 list
