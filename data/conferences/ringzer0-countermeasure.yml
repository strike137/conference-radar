notes:
- Practitioner security event run by the training company Ringzer0; virtual and in-person hands-on training followed by a two-day conference
- Fall edition held in Ottawa, Canada; a separate virtual training-only edition runs each spring
- Limited-capacity single-track conference with keynotes and talks on vulnerability research, exploitation, malware analysis and threat intelligence
- Strong government and critical infrastructure focus; speakers include the Canadian Communications Security Establishment (CSE)
- "Fee for 2026 (conference only): CAD 750 early bird to CAD 950 late; training plus conference from CAD 4700"
- No published proceedings
