notes:
- Annual European conference on thermal, mechanical and multiphysics simulation and experiments for micro/nanoelectronics, packaging and microsystems (MEMS); 28th edition in 2027
- Technical sponsorship by IEEE and the IEEE Electronics Packaging Society; strong industry presence (Infineon, Bosch, NXP, ams OSRAM, STMicroelectronics)
- Abstract-based selection, then a full paper for the proceedings; accepted papers are submitted to IEEE Xplore
- Best papers are selected for Microelectronics Reliability (Elsevier) and Micromachines (MDPI)
- One day of professional training courses followed by three days of oral and poster sessions with an exhibition
- Small specialised venue; not listed in ICORE2026 or CCF
