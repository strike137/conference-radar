notes:
- Running since 1996; held in Australia almost every year (2025 Wollongong, 2026 Perth, 2027 Melbourne hosted by
  Monash University)
- Proceedings in Springer LNCS (three volumes in 2024, 2025 and 2026)
- Two submission rounds (late November and late February/early March); round 1 can return major revision for resubmission
  to round 2, but round 1 rejects cannot be resubmitted
- Anonymous (double-blind) submissions; SoK papers welcome; deadlines 23:59 AoE
- ICORE2026 rank is Australasian B (national category); CCF C; regarded as a solid mid-tier crypto and security
  venue
