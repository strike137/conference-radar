notes:
- Practitioner security conference started in 2017 in Deadwood, South Dakota by John Strand and Erica Spurrier;
  the first event drew about 550 attendees
- Part of the Black Hills Information Security (BHIS) family of companies
- Deadwood edition in October at Deadwood Mountain Grand, plus a Mile High edition in Denver in February
- Pre-conference trainings before each edition; in-person and virtual attendance; also calls for workshops and
  villages
