notes:
- Started at the American University of Sharjah (UAE) in 2013; earlier editions were technically sponsored by the
  IEEE UAE Section
- Accepted and presented papers are submitted to IEEE Xplore (indexed by Scopus); selected papers may be invited
  to a journal special issue
- Papers up to 6 pages, double column, peer reviewed
- Editions in 2013, 2015, 2019, 2021, 2022, 2024 and 2026; every two years since 2022. Held in Sharjah (2015,
  2019, virtual 2021), Cairo (2022), Istanbul (2024) and Alcala de Henares, Spain (2026)
- 2026 tracks cover AI for wireless, wireless theory and PHY, sensing and positioning, emerging technologies and a
  general track
- Not listed in CORE ICORE2026
