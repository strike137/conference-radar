notes:
- Offensive security conference in Rome, Italy, run by the Italian non-profit association Cyber Saiyan
- Three parts - a one-day conference with international speakers, a multi-day training and a hacker camp
- Conference 2025 was the 8th edition, with 906 attendees from 36 countries; it ran a live bug bounty event and a kids track
- In 2026 the event took the form of RomHack Camp (2nd edition, 550 attendees) at Flaminio Village plus the training at
  the Polo Didattico in Rome
- No formal proceedings; talk videos and slides are published on the website
