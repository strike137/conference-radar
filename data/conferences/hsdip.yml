notes:
- Long-running co-located workshop of ICAPS on heuristics and search algorithms for classical, temporal, numeric and probabilistic planning
- Informal venue; papers may be submitted in parallel to venues that allow informal prior publication without ISSN or ISBN
- Previously published papers from conferences other than ICAPS get only a light relevance review
- Long papers up to 9 pages and short papers up to 5 pages including references, AAAI style, double-blind via EasyChair
- At least one author must attend the workshop in person to present
