notes:
- Organized by IARIA as part of the NexTech congress, co-located with UBICOMM, SEMAPRO, DATA ANALYTICS and other IARIA events (21st edition in 2027)
- Covers high performance and scientific computing, computational methods and their engineering applications
- Published open access in the IARIA ThinkMind library (ISSN 2308-4499); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in southern Europe (Barcelona, Valencia, Porto, Venice, Lisbon in recent years); onsite and online participation offered
