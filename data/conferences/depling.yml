frequency: biennial
organizer: Conference chairs per edition (2025 -> Eva Hajicova and Sylvain Kahane), held within SyntaxFest (2027 hosted by
  UFAL, Charles University)
organizer_country: [international]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [4]
  conference_months: [8, 9]
links:
  website: https://depling.org/
notes:
- Biennial conference on dependency-based approaches in linguistics and NLP; grew out of the Meaning-Text Theory
  conferences (2003 to 2013)
- Part of SyntaxFest since 2019 with IWPT, UDW, QUASY and other events (joint OpenReview submission); 2023 edition
  was part of GURT in Washington DC
- Usually held in Europe (Uppsala, Pisa, Paris, Sofia online, Washington DC, Ljubljana)
- Proceedings in the ACL Anthology (14 papers in 2025); more linguistics oriented than most NLP venues
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
