notes:
- Small annual IEEE conference on computational imaging with synthetic apertures (SAR, sonar, radiometry, Fourier ptychography, tomography, radio astronomy)
- 2027 is the 4th edition, hosted at the University of Maryland, College Park; 2026 was in Albany, New York
- Submissions and reviews run through OpenReview
- Accepted papers must be presented live by an author (lecture or poster); no-shows are not published in IEEE Xplore
- Low registration fees (2027 advance rate 200 USD for IEEE members, 100 USD for IEEE student members)
- Imaging and remote sensing venue outside the usual CS rankings, not listed in ICORE2026
