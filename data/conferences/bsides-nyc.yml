notes:
- 100% volunteer-organized Security BSides conference in New York City
- One-day event at John Jay College of Criminal Justice (Digital Forensics and Cybersecurity Program), the venue of every edition listed in the archive
- Tracks for Red, Blue and Other technical talks, two-hour workshops and an Entrepreneur track, plus villages and several CTFs
- 1000+ attendees and 58+ speakers per the official site
- Irregular early history (0x01 in 2016, 0x02 in 2018, 0x03 in April 2023); annual in October since 2024
- No proceedings; many talks are recorded and linked from the archive page
