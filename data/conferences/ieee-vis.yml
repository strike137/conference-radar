notes:
- Flagship visualization conference, sponsored by the IEEE Computer Society and VGTC
- ICORE2026 A (listed as IEEE Visualization), CCF A
- Full papers appear in a special issue of IEEE TVCG; short papers go into the conference proceedings in IEEE Xplore
- Full papers have a mandatory abstract deadline and two review cycles (first notification, revision, final decision)
- Rotates worldwide (Vienna 2025, Boston 2026); 2026 also has satellite events in Paris and Tianjin
