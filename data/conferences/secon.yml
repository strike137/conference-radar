id: secon
name: IEEE SECON
full_name: IEEE International Conference on Sensing, Communication, and Networking
type: conference
tier: major
areas: [networking, communications]
region: worldwide
language: english
frequency: annual
organizer: IEEE Communications Society (ComSoc)
organizer_country: [international]
proceedings: IEEE Xplore
rank:
  core: B
  ccf: B
fee: 750 EUR ComSoc member, 800 EUR IEEE member, 950 EUR non-member (2026, early author registration, incl. 22% VAT)
typical:
  deadline_months: [11, 12]
  conference_months: [5, 6]
links:
  website: https://ieee-secon.org/
  dblp: https://dblp.org/db/conf/secon/index.html
notes:
- IEEE ComSoc conference on sensor, ad hoc, mesh and wireless networks, IoT, mobile systems and integrated sensing and
  communication
- Full papers up to 9 pages including references and appendices, double-blind review, submitted via EDAS
- Accepted and presented papers go to IEEE Xplore; one full author registration covers up to 3 papers
- Poster track with 2-page papers that also appear in the proceedings (2026)
- Held in Europe or the USA recently (2023 Madrid, 2024 Phoenix, 2026 Pisa, 2027 Lisbon); 2020 to 2022 were virtual
- No 2025 edition; timing moved from September/December to May/June
- CORE B (ICORE2026) and CCF B (computer networks)
