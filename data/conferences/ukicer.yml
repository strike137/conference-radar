notes:
- Computing education research conference of the two ACM SIGCSE chapters for the UK and Ireland, running since 2019
- Proceedings in the ACM Digital Library; ACM Open applies, otherwise an APC is charged
- Research papers up to 6 pages plus references in ACM double-column format, double-blind review
- Also has posters, a doctoral consortium, critical research review, workshops and RIPPA (research in practice) sessions
- Two-day meeting in early September hosted by a different UK or Irish university each year (Dublin 2022, Swansea 2023, Manchester 2024, Edinburgh 2025, Cambridge 2026)
- "Registration fee: 225 GBP early bird and 325 GBP regular for chapter members, 335 and 435 GBP for non-members (2026)"
- Not listed in ICORE2026 or the CCF 2026 list
