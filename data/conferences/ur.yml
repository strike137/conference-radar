id: ur
name: UR
full_name: International Conference on Ubiquitous Robots
type: conference
tier: minor
areas: [ai]
region: worldwide
language: english
frequency: annual
organizer: Korea Robotics Society (KROS), technically co-sponsored by IEEE RAS
organizer_country: [korea]
proceedings: IEEE Xplore
archival: true
fee: 550 USD member, 600 USD non-member, 250 USD member student, 300 USD non-member student (2026, early; KROS,
  IEEE, RSJ and RST members pay the member price)
typical:
  deadline_months: [2]
  conference_months: [7]
links:
  website: https://2026.ubiquitousrobots.org/
notes:
- Robotics conference run by the Korea Robotics Society with IEEE RAS technical co-sponsorship; 23rd edition in 2026
- Regular papers (4 to 8 pages) go to IEEE Xplore; work-in-progress papers (2 to 4 pages, posters) and late breaking
  results (1 to 2 pages) appear only in the participant proceedings
- Submission through the IEEE RAS PaperPlaza system
- Covers robot design, perception, manipulation, mobility, interfaces and intelligence, plus application domains
- Rotates between Korea, the USA and Japan (Gangneung 2021, Jeju 2022, Honolulu 2023, New York 2024, Osaka 2026)
- At least one author must register by the final paper deadline; extra papers cost 200 USD each
