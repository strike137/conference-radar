notes:
- Run from Peng Cheng Laboratory (Shenzhen); general chairs from NUDT / Peng Cheng Laboratory, honorary chairs Binxing Fang and Shize Guo (2026)
- Called NSE (International Conference on Network Simulation and Evaluation) in 2022 and 2023, renamed CSE from 2024
- Held in Shenzhen every year (2023, 2024, 2025, 2026)
- Proceedings in Springer CCIS; long papers of 12 to 15 pages in CCIS format, single-blind review on EasyChair
- Topics include cyber ranges, attack and defense simulation, security test and evaluation, and LLM security
- Co-located workshops such as DCAIoTS, TEC, SPSA, SIoTBlock and MAS (2026)
- Selected papers invited to journals such as World Wide Web (Springer) and Security and Safety
- Deadlines are often extended (2025 submission moved from October 8 to November 30)
- Separate from DSC (dsc.pcl.ac.cn), also run from Peng Cheng Laboratory
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
