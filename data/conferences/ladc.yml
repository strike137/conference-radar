notes:
- Run under the fault-tolerance special committee of the Brazilian Computer Society (SBC); held since 2003, yearly
  since 2021; 15th edition in 2026
- Full research papers and practical experience reports of 12 to 15 pages plus references (LNCS format);
  single-blind review by at least three PC members
- LADC 2025 proceedings published as Springer CCIS "Dependable and Secure Computing"; earlier editions in ACM DL
  (2022 to 2024), IEEE Xplore or SBC OpenLib
- LADC 2025 was followed by a special issue of the Journal of Internet Services and Applications (JISA); the 2026 call does not mention one
- Mostly held in Brazil, sometimes elsewhere in Latin America (La Paz 2023, Valparaíso 2025 with CLEI); co-located
  with SBESC in Salvador in 2026
- Also has fast abstracts, an industrial track, a student forum and satellite workshops (LABlock, RECS)
- Not ranked in CORE ICORE2026
