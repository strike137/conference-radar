notes:
- Yearly research meeting of ISCIE, the Japanese society for systems, control and information engineering
- Held every May, recently in the Kansai and Chubu areas (Kobe 2025, Nagoya 2026, Himeji 2027)
- Talk application (title and 100 to 200 character abstract) in late January, paper of 1 to 8 pages in Japanese or
  English in early April; no paper review is described
- Paper submission needs the registration and paper fee paid first
- Theme sessions, general sessions and organized sessions; 15 minute talks (10 minute talk, 5 minute Q&A)
- About 450 participants and 223 regular talks in 2025
- ISCIE Transactions runs a special issue for SCI papers; student presentation awards and a young researcher award
- Not listed in ICORE2026 or the CCF 2026 list
