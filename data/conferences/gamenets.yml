notes:
- EAI conference on game theory applied to communication, social, traffic and economic networks; earliest edition listed on the site is Pisa 2006
- Recent editions in Guangzhou (2023), Cambridge UK (2025) and Evanston, IL, USA (2026); 2021 and 2022 were virtual
- No edition in 2020 or 2024
- Proceedings in Springer LNICST; selected papers invited to the Springer Wireless Networks journal
- Accepted authors may submit an extended version to a fast track of an EAI Endorsed Transactions journal
- Two-day conference with a separate poster track (2025 and 2026)
- Not listed in the CORE ICORE2026 portal
