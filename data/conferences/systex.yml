full_name: Workshop on System Software for Trusted Execution
type: workshop
tier: minor
areas: [security, systems]
region: europe
language: english
frequency: annual
organizer: SysTEX workshop organizers (co-located with EuroSys or IEEE EuroS&P)
proceedings: ACM DL
typical:
  deadline_months: [2, 3]
  conference_months: [4, 7]
links:
  website: https://systex-workshop.github.io/
notes:
- One-day workshop on Trusted Execution Environments (TEEs) and system software for trustworthy systems; 9th
  edition in 2026
- Co-location host changes; EuroSys 2026 (Edinburgh), IEEE EuroS&P 2025 (Venice) and 2024 (Vienna), EuroSys 2023
  (Rome), ASPLOS 2022 (Lausanne), SOSP 2019
- Proceedings follow the host; ACM Digital Library in 2026, IEEE Xplore in 2024 and 2025
- Double-blind review with at least three reviews per paper; regular papers (6 pages), short research statements
  (1-2 pages) and tool papers (4 pages); short statements and tool papers may opt out of the proceedings
- Optional artifact evaluation with badges
- Not listed in ICORE2026 (portal search returns no result)
