notes:
- Workshop series on performance engineering of AI and ML workloads on HPC systems, held with several HPC conferences (ISC High Performance 2026 in Hamburg, SC26 in Chicago, SCA27 in Singapore)
- SC26 edition is a half-day workshop (Monday afternoon); full papers of 4 to 10 pages in IEEE two-column style, double-blind review, papers planned for the SC Workshops Proceedings
- ISC 2026 edition took LNCS-format papers of 6 to 12 pages, published in Springer LNCS
- 1-page lightning talk abstracts are not included in the proceedings; papers must be presented in person to appear in the proceedings
- SC26 submissions must include an artifact description appendix; artifact evaluation is encouraged
- Not listed in CORE ICORE2026
