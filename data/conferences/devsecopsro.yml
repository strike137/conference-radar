notes:
- Half-day workshop co-located with IEEE EuroS&P (Vienna 2024, Venice 2025)
- Steering committee from the University of Padua (Alessandro Brighente, Mauro Conti)
- 'Topics: secure software development, software supply chain security, SBOM, security testing and fuzzing, AI support for secure development'
- Regular papers up to 8 pages, short papers up to 5 pages and position papers up to 2 pages, IEEE A4 template, EasyChair submission
- Only full papers go into the EuroS&P workshop proceedings; short and position papers are not published
- Selected papers are invited to journal special issues
- Not in the EuroS&P 2026 (Lisbon) workshop list, so no 2026 edition took place
