  website: https://2026.chcon.nz/
notes:
- Hacker and security practitioner conference in Christchurch, New Zealand, held at the Majestic on Durham
- One training day followed by two conference days
- Talks and trainings selected through a Call for Papers on pretalx; talk slots of 25, 45 or 60 minutes with a
  preference for 25 minutes
- No papers or proceedings; highlights of past editions are posted on the CHCon YouTube channel
- 2026 edition marks its 10th birthday according to the Call for Papers
