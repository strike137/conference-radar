notes:
- Series started in 2012 in Ho Chi Minh City by AMI (National Institute of Applied Mechanics and Informatics, Vietnam)
- Proceedings in IEEE Xplore, indexed by Scopus and EI Compendex; standard IEEE double-column template, submission via EDAS
- Often held in Vietnam, otherwise in China, Korea or Thailand (2021 Xi'an, 2022 and 2023 Hanoi, 2024 Ho Chi Minh City, 2025 Jeju hosted by Korea Aerospace University)
- Topics span control, automation, signal processing, target tracking and information sciences
- Not in the ICORE2026 ranking; not the Saudi ICCAIS (Computer Applications and Information Security), a different venue
- Paper deadline is usually extended (2024 page lists a final extension); deadlines are stated in GMT-4 (New York EDT)
