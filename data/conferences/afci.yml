notes:
- Algorithmic fairness workshop series renamed each year (AFCI 2020, AFCR 2021, AFCP 2022, AFT 2023, AFME 2024, AFAA 2026)
- Held with NeurIPS from 2020 to 2024 and with ICLR in 2026; no 2025 edition
- Accepted papers can opt in to PMLR workshop proceedings (2026 -> vol. 344, 2024 -> vol. 279)
- Two tracks, main papers (6 to 9 pages) and tiny/short papers (up to 3 pages), ICLR template, anonymous submission on OpenReview
- Accepts work under submission elsewhere (FAccT, ICML, SaTML, ...)
- Not listed in ICORE2026 or the CCF list
