links:
  website: https://asyncsymposium.org/
notes:
- Main forum for asynchronous circuit and system design (clockless pipelines, arbitration, GALS, NoCs, neuromorphic hardware, CAD)
- Held in 2023 (Beijing), 2025 (Portland, USA) and 2026 (Lyngby, Denmark); 2022 and 2024 had only a summer school, so not strictly annual
- Moves around the world (Hirosaki 2019, Snowbird 2020, virtual 2021, Beijing 2023, Portland 2025, Lyngby 2026)
- Regular papers 6 to 8 pages in IEEE format with double-blind review; separate track for 1 to 4 page industrial and short academic papers
- 2025 CFP states accepted papers go to the symposium proceedings and IEEE Xplore; 2023, 2025 and 2026 papers carry IEEE DOIs
- ASYNC Summer School on asynchronous chip design is co-located just before the symposium
- Not found on the CORE portal (ICORE2026); not in the CCF list mirror
