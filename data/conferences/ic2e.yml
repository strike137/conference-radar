notes:
- IEEE Computer Society conference on the whole cloud stack (systems, storage, networking, platforms, applications); started in 2013
- Papers published by the IEEE Computer Society Conference Publishing Services (EI indexed)
- Research and Vision track plus Industry and Experience track; single-blind review with a shepherding phase
- Full papers 9 pages plus references at review (12 pages final), short papers 5 pages plus references (8 final)
- Held in the USA and Europe (Boston 2023, Paphos 2024, Rennes 2025, Santa Clara 2026, Hannover 2027)
- 2026 edition was co-located with ACM/IEEE SEC 2026 at Santa Clara University
- CORE B (ICORE2026); not on the CCF list
- Workshops, tutorials, demos and posters and a doctoral symposium run alongside
