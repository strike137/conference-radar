notes:
- Practitioner conference on AI security, started in 2026 by volunteers behind Prompt||GTFO, fwd:cloudsec, ACoD and ISOI
- Two editions in 2026, both in San Francisco (March and October); the second was held at The Hibernia
- Program committee co-chaired by Gadi Evron and Jeff Moss in 2026
- 20 minute talks plus 10 minutes of questions, optional 10 minute lightning talks; demos encouraged
- No proceedings; slides, transcripts and videos are posted on the site
