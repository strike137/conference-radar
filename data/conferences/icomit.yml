id: icomit
name: ICOMIT
full_name: International Conference on Multidisciplinary Application of Information Technology
type: conference
tier: minor
areas: [general, ai, data]
region: southeast-asia
language: english
frequency: annual
organizer: Faculty of Computer Science (FILKOM), Universitas Brawijaya
organizer_country: [indonesia]
proceedings: Atlantis Press
archival: true
fee: USD 250 early bird, USD 300 regular (2026, overseas onsite non-student); students USD 200 to 250
typical:
  deadline_months: [6]
  conference_months: [8, 9]
links:
  website: https://icomit.ub.ac.id/
notes:
- Organized by the Faculty of Computer Science (FILKOM), Universitas Brawijaya, Malang
- 2026 is the 5th edition; first edition was held online in 2022
- 2026 proceedings published by Atlantis Press, expected to be indexed by Scopus; 2025 papers went to a Springer Nature book series
- Information systems focus covering AI, data mining, e-health, e-government, e-business and e-learning
- Double-blind review by two to three reviewers; submission via EDAS; no-show papers are not published
- Held in East Java, Indonesia (Surabaya in 2025, Malang in 2026); onsite and online registration options
- Runs alongside the same faculty's SIET conference and the domestic SENTRIN seminar
- Not listed in the ICORE2026 portal or the CCF 2026 list
