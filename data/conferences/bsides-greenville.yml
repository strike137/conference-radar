notes:
- Community-driven Security BSides conference in Greenville, South Carolina, USA, run by the Upstate SC Chapter of ISSA, a 501(c)(6) nonprofit
- First held in March 2018; virtual in 2020 and 2021, back in person since 2023 (October 2023, September 2024 and 2025, August 2026)
- One day of talks, hands-on sessions and villages; held at the Fluor campus in Greenville, which sponsors the venue
- "Low-cost tickets: full cost is 70 USD per ticket (2026), with Backer and Pay What You Want options"
- Talks only, no proceedings
