notes:
- MICCAI satellite workshop on diffusion MRI acquisition, reconstruction, microstructure modelling, tractography and connectomics, with growing AI content
- Long-running series; 2025 was the 16th edition
- 2025 proceedings in Springer LNCS 16205; earlier editions appeared in the Springer Mathematics and Visualization series
- Double-blind review via OpenReview; 8 pages recommended, 12 pages maximum including references, LNCS style
- Top-rated papers get oral slots; organizers in 2026 from UCL, Tianjin University, NYU Langone, Harvard Medical School and University of Sydney
- Location follows MICCAI (Daejeon 2025, Strasbourg 2026)
- Not listed in CORE ICORE2026 or the CCF 2026 list
