id: x33fcon
name: x33fcon
full_name: x33fcon (Red meets Blue) Security Conference
type: industry
tier: minor
areas: [security]
region: europe
language: english
frequency: annual
organizer: GoUp4 (Andrzej Banach), Gdansk, Poland
organizer_country: [europe]
proceedings: None (talks only)
archival: false
fee: 400 PLN online, 1000 PLN personal, 1400 PLN business (2026, early bird, excl. 23% VAT)
typical:
  conference_months: [5, 6, 7]
links:
  website: https://www.x33fcon.com/
notes:
- Industry conference on collaboration between red and blue teams (purple teaming), run by a group of security
  practitioners; the legal organizer is GoUp4 in Gdansk, Poland
- Held at the Pomeranian Science and Technology Park (PPNT) in Gdynia, Poland, in hybrid mode with live streaming
- Two days of single-track talks plus lightning talks, with paid trainings around the conference and a CTF
- No proceedings; slides and recordings are published on the site and YouTube
- Cheap personal and online tickets; personal tickets sell out early
