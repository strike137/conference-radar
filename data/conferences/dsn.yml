notes:
- Flagship venue for dependability and resilience; CORE A, CCF B
- Double-blind review with early reject, rebuttal and a one-round paper revision phase
- Abstract registration one week before the early December paper deadline; conference in late June
- Location rotates worldwide; held in Brisbane, Australia in 2024 and Taipei (virtual) in 2021
- Acceptance rate steady around 20%; student travel grants and mentoring program offered
