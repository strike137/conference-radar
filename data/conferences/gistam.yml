links:
  website: https://gistam.scitevents.org/
notes:
- Organized by INSTICC; the 2026 proceedings are a Springer CCIS book, earlier editions were in the SCITEPRESS Digital Library
- The 2027 call only states that revised and extended versions of a short list of papers are planned for a Springer CCIS book
- Not listed in ICORE2026; regarded as a minor venue
- Covers geo-spatial data sensing, representation, processing, analysis and GIS applications
- Two submission stages (1st stage gives an earlier notification), plus position papers and an abstracts track; all dates AoE
- Held in European cities (Prague 2023, Angers 2024, Porto 2025, Benidorm 2026, Rome 2027) and co-located with ICEIS, ENASE, IoTBDS, ICT4AWE and FEMIB with free cross access as a non-speaker
