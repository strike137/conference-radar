notes:
- Community hacker and cybersecurity conference in Alicante, Spain, run by the Asociación BitUp Ciberseguridad; first edition in 2017
- Talks mainly in Spanish; no papers or proceedings
- 2026 edition grew to two days with more than 20 talks, a CTF with 3000 EUR in prizes, a bug bounty and an electronic badge
- 2025 was a one-day event at the Auditorio Puerta Ferrisa with more than 13 talks and about 150 attendees; online editions in 2020 and 2021
- Low-cost tickets with a verified student discount
- Not listed in ICORE2026; not on the CCF list
