notes:
- IAPR endorsed national pattern recognition conference of Mexico, run under the direction of INAOE with the Mexican Association for Pattern Recognition
- Proceedings in Springer LNCS (2026 in LNCS 16623); papers in English in LNCS format via EasyChair
- Award winners are invited to a special section on MCPR in Pattern Recognition Letters
- 'Held in Mexico with a different host each year: virtual 2021, Ciudad Juarez 2022, Tepic 2023, Xalapa 2024, Ciudad Juarez (UACJ) 2026, CIC-IPN in Mexico City 2027'
- Co-located Postgraduate Students Meeting with posters published in Research in Computing Science
- Not listed in the CORE portal (ICORE2026)
