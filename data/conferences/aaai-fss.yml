notes:
- Annual set of AAAI symposia run in parallel at one site, each on a different AI topic chosen by proposal
- Topics change every year (nine symposia in 2026, six in 2025); each symposium has 40 to 75 participants
- 2.5 day workshop-style format with more time for discussion than a typical one-day workshop
- Each symposium runs its own call, EasyChair track and deadlines; full papers usually 6 to 8 pages, short papers 2 to 4 pages in AAAI format
- Accepted papers appear in the Proceedings of the AAAI Symposium Series (AAAI Press, ISSN 2994-4317); some symposia also allow non-archival abstracts
- In person only; at least one author per accepted paper must register and present
- Held at the Westin Arlington Gateway, Arlington, Virginia, USA in 2023 to 2026
- Registration covers one symposium only
- Not listed in CORE ICORE2026 or on the CCF list
