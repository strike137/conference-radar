id: icitce
name: IEEE ICITCE
full_name: IEEE International Conference on Industrial Technology & Computer Engineering
type: conference
tier: minor
areas: [ai, security, software, general]
region: southeast-asia
language: english
organizer: IEEE Malaysia Industrial Applications / Industrial Electronics Joint Chapter
organizer_country: [malaysia]
proceedings: IEEE Xplore
archival: true
fee: 500 to 550 USD professional, 430 to 480 USD student, 1,400 to 1,500 MYR local professional (2026, one paper, physical)
typical:
  deadline_months: [5, 8]
  conference_months: [9]
links:
  website: https://www.ihsanyassin.com/cms/conference.php?conf_short_name=icitce2026
notes:
- Run by the IEEE Malaysia Industrial Applications / Industrial Electronics Joint Chapter on the same conference
  management system as ISIEA, ISCAIE, ISWTA and ISCI
- 2026 edition held at Tamu Hotel & Suites, Kuala Lumpur, Malaysia
- Accepted papers are submitted for inclusion into IEEE Xplore; the site links an earlier ICITCE proceedings
  volume on IEEE Xplore
- Double-blind review by at least 3 reviewers; papers with similarity above 30% are not considered
- Hybrid format with virtual presentation by pre-recorded video; 50% discount on a second paper (professional
  registration)
- Broad scope (industrial electronics, AI, cloud computing, cybersecurity, IoT, software engineering, signal and
  image processing)
- The 2026 submission deadline was extended from May 31 to Aug 10
- Not listed in ICORE2026 and not in the CCF list; a small regional venue
