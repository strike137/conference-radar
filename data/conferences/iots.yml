notes:
- Organized by IPSJ SIG IOT; successor of the DSMS symposium (12 editions, 1997 to 2007), IOTS since 2008 (IOTS2026
  is the 19th)
- Held in Japan every December in a different city (Miyazaki 2025, Matsue 2026); presenters are in principle required
  on site, audience can join online
- Peer-reviewed full papers up to 8 pages (IPSJ tech report format) via EasyChair; small program (8 accepted papers
  and 17 posters in 2025)
- Separate poster call with reviewed and non-reviewed options; student-first-author papers eligible for student
  awards
- Strong operations flavor (campus networks, monitoring, incident handling) with a large industry exhibition (21
  companies in 2025)
