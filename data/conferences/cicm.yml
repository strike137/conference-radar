notes:
- Brings together computer mathematics communities, from formal mathematics, interactive and automated theorem proving
  and computer algebra to mathematical knowledge management and digital mathematical libraries
- Absorbed the track topics of MKM (Mathematical Knowledge Management), Calculemus and DML; first held as CICM in 2008
- Formal papers (regular, project and survey up to 15 pages, system and dataset descriptions 4 to 5 pages) appear in
  Springer LNAI; 2-page work-in-progress papers are presentation only
- Review includes a rebuttal phase
- Mostly held in Europe with occasional editions in the Americas (Montreal 2024, Brasilia 2025); Ljubljana 2026,
  Erlangen 2027
- CORE C (ICORE2026); not on the CCF list
