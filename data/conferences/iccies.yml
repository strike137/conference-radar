links:
  website: https://iccies.tdtu.edu.vn/2027/
notes:
- Started in 2025; run by Ton Duc Thang University (TDTU), Ho Chi Minh City, with Wroclaw University of Science and Technology (Poland) as co-host
- In cooperation with the IEEE SMC Technical Committee on Computational Collective Intelligence and ERCIS
- Accepted papers appear in the Springer CCIS series; paper must be presented to be included
- Broad scope covering AI and intelligent computing for IT, electrical and electronics engineering, mechatronics and IoT, with many special sessions (NLP, vision, LLMs, cybersecurity and blockchain, quantum communication)
- Two-stage review (program committee, then meta-review board); submissions through Microsoft CMT
- Held at TDTU campuses in Vietnam (2025 July and 2027 Ho Chi Minh City, 2026 Nha Trang); full paper deadline is usually extended
- Not in the CORE ICORE2026 list
