notes:
- Leading European requirements engineering conference, running since 1994 as a not-for-profit working conference
- CORE B (ICORE2026, listed as a workshop); CCF C
- Proceedings published by Springer in LNCS
- Double-blind review by at least three PC members; technical design and scientific evaluation papers up to 15 pages,
  experience reports up to 12 pages, vision papers and research previews up to 8 pages (including references)
- Optional abstract submission one week before the paper deadline
- Also has industry, education and training, journal first, open science, posters and tools, workshop and doctoral
  symposium tracks
- Held in Europe in March or April (Poznan 2026, Basel 2027); in-person event
