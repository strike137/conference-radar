notes:
- Part of the NSCLab family around Yang Xiang (Swinburne), alongside NSS, SocialSec and CSS
- Held mostly in China (Xi'an, Guangzhou, Hangzhou), sometimes in Fiji (2023, 2026) or Australia (Melbourne 2018)
- Proceedings in Springer LNCS (post-proceedings in 2026)
- 'Small venue: 18 full papers from 97 submissions in 2025'
- Deadlines are routinely extended; the gap between final deadline and conference can be only a few weeks
