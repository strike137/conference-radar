notes:
- Held in Chengdu every April since 2017 (first edition in July 2016); co-hosted by Southwest Jiaotong University and UESTC
- Proceedings of every edition from 2016 to 2025 in IEEE Xplore, indexed in EI Compendex and Scopus per the site
- Co-located with the International Symposium on AI (ISAI)
- About 200 participants per edition (2025 and 2026, per the site); hybrid with online presentations
- Submission through EasyChair using the IEEE conference template
- Not listed in CORE ICORE2026 or the CCF 2026 list
