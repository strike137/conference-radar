notes:
- One-day workshop affiliated with Eurocrypt 2025 in Madrid, on quantum cryptography, post-quantum cryptography and PQC migration
- Submissions are extended abstracts of up to 2 pages in LNCS format via EasyChair, reviewed by the organizers for contributed talks
- No formal proceedings, so work submitted or published elsewhere may be presented; an abstract PDF is posted on the program page
- Selected unpublished talks are invited to a special issue of Springer Cryptography and Communications, with separate review
- Organized by the CryptULL team of Universidad de La Laguna (Spain); 2025 is the only edition found, no 2026 edition announced
- Not listed in CORE ICORE2026 and not on the CCF list
