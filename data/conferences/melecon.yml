id: melecon
name: IEEE MELECON
full_name: IEEE Mediterranean Electrotechnical Conference
type: conference
tier: minor
areas: [general, communications, networking, ai]
region: worldwide
language: english
frequency: biennial
organizer: IEEE Region 8 with the host IEEE section (Egypt Section 2026)
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [2, 10]
  conference_months: [2, 6]
links:
  website: https://2026.ieee-melecon.org/
notes:
- One of the flagship conferences of IEEE Region 8 (Europe, Middle East and Africa); 2026 was the 23rd edition
- Broad electrical engineering scope; tracks on power and energy, smart industry, smart healthcare and digital transformation (AI, 6G, networks, IoT, cybersecurity)
- Papers of typically 4 to 6 pages in IEEE two-column format submitted via EDAS; proceedings submitted to IEEE Xplore
- Held in a different Mediterranean country each edition (Porto, Portugal 2024; Cairo, Egypt 2026)
- Not listed in CORE ICORE2026
