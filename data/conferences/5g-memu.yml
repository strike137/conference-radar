links:
  website: https://5g-memu-2024.github.io/index.html
notes:
- Workshop on measurement, modeling and use cases of operational 5G and beyond networks (performance, energy,
  Open RAN, testbeds, ML for 5G traffic, security)
- Held with ACM SIGCOMM in 2021 (virtual), 2022 (Amsterdam) and 2023 (New York), then with ACM CoNEXT 2024 in Los Angeles
- Papers of up to 6 pages excluding references in two-column ACM format, single-blind review on HotCRP
- Papers appear in the ACM Digital Library (Proceedings of the 4th ACM Workshop on 5G-MeMU, CoNEXT 2024)
- Half-day program in 2024 with two keynotes and three papers
- No edition with CoNEXT 2025 or CoNEXT 2026 so far
