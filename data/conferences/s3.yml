notes:
- Student-run workshop co-located with ACM MobiCom (with MobiHoc in 2009); sponsored by ACM SIGMOBILE and ACM
- The first author must be a student; papers, posters and demos are reviewed double-blind by a student TPC
- Very short papers (3 pages including references, ACM format); posters and demos 1 page
- Moves with MobiCom (Madrid 2023, Washington DC 2024, Hong Kong 2025, Austin 2026)
- 2023 papers appear in the ACM DL as the Proceedings of the 14th ACM S3 Workshop
- A friendly first venue for students in wireless and mobile networking
