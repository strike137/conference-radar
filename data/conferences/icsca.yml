notes:
- Smaller conference covering software engineering, AI, IoT, data science and security tracks
- Proceedings in the ACM International Conference Proceedings Series (ACM DL) since 2017; EI Compendex and Scopus
  indexed per the site
- Held in Malaysia most years (Kuala Lumpur, Langkawi, Kuantan, Penang, Putrajaya), Bali in 2024
- Full papers 4 to 12 pages (two-column LaTeX) or 8 to 20 pages (one-column Word); abstract-only presentation also
  possible
- Submission through the zmeeting system
