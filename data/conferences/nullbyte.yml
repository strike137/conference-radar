notes:
- Hacker conference in Salvador, Bahia, Brazil, started by a group of friends to grow the local hacking scene
- 2026 is the 11th edition (10 years marked in 2024), a one-day Saturday event at Saladearte Cinema do Museu
- Talks limited to offensive security (exploit development, fuzzing, reverse engineering, web and mobile exploitation, telecom)
- Two parallel rooms; site in Portuguese and English
- "Ticket: 250 BRL (2026, hacker ticket)"
- No proceedings
