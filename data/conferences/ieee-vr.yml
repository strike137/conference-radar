notes:
- Flagship VR/AR and 3D user interface conference, sponsored by the IEEE Computer Society and IEEE VGTC
- One deadline and one double-blind review in two cycles (conditional accept, then revision); top papers go to an IEEE
  TVCG special issue, others to the conference proceedings in IEEE Xplore
- Abstract required one week before the paper deadline; no extensions; senior authors must review
- Rejected papers do not become posters automatically; separate poster, demo, workshop and 3DUI contest tracks
- Rotates worldwide (Orlando 2024, Saint-Malo 2025, Daegu 2026, Melbourne 2027)
- CORE A* (ICORE2026) and CCF A
