notes:
- Conference on space systems security organised and hosted by the European Space Agency at ESTEC, Noordwijk, Netherlands
- Brings together academia, industry and agencies, with an industrial exhibition alongside the talks
- First edition in May 2024 (2 days); second edition in November 2025 (2.5 days)
- 2025 had two review cycles (spring and summer); papers rejected in the first cycle could be resubmitted to the second
- Double-blind review; full papers up to 8 pages in IEEE style (12 pages in total), short papers up to 5 pages
- 2024 and 2025 proceedings published by IEEE (IEEE Xplore); presentations and papers also on ESA Indico
- 2025 hosted Ctrl+Space CTF, an in-orbit Capture-the-Flag on a D-Orbit satellite carrier
- No 2026 conference announced as of 2026-11-07; the site instead ran a call for ideas for in-orbit cybersecurity experiments (deadline 30 June 2026)
- Not listed in CORE ICORE2026 or on the CCF list
