id: ccdm
name: CCDM
full_name: CCF China Conference on Data Mining
name_local: CCF中国数据挖掘会议
type: conference
tier: domestic
areas: [data, ai]
region: china
language: chinese
frequency: biennial
organizer: CCF (China Computer Federation) and CAAI; CCF Technical Committee on AI and Pattern Recognition and CAAI Technical Committee on Machine Learning
organizer_country: [china]
proceedings: Chinese journals (accepted papers recommended to partner journals)
archival: false
typical:
  deadline_months: [3, 4]
  conference_months: [7, 8]
links:
  website: https://conf.ccf.org.cn/CCDM2026
notes:
- Main national data mining conference in China, sponsored by CCF and the Chinese Association for Artificial Intelligence (CAAI); 2026 was the 11th edition
- Held every two years in even years
- No conference proceedings; accepted papers are recommended to partner Chinese journals (2026 had a Journal of Computer Research and Development special issue forum)
- Calls for Chinese papers; peer reviewed by the program committee
- Hosted by a different Chinese university each time (Tai'an 2024, Taiyuan 2026)
- Not ranked in CORE ICORE2026; not on the CCF 2026 recommended list
