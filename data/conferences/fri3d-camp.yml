notes:
- Family-friendly Belgian summer camp for hackers, makers and DIYers, inspired by CCC Camp, EMF and WHY
- Held every two years in the woods of De Kluis, Sint-Joris-Weert near Leuven; 2026 was the sixth edition
- All talks, workshops and activities come from participants through a Call for Proposals on pretalx
- Programme mostly in Dutch; activities in other languages are welcome
- About 640 participants, roughly a third of them children; known for its electronic camp badge
- No proceedings
