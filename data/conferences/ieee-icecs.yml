links:
  website: https://icecs2026.gr/
notes:
- IEEE Circuits and Systems Society flagship conference held every year in IEEE Region 8 (Europe, Africa and the Middle
  East); 33rd edition in 2026
- Broad circuits and systems scope (analog/RF, digital, EDA, biomedical circuits, AI hardware, sensors, signal
  processing)
- Papers up to 4 pages including references in IEEE double-column format; accepted papers submitted to IEEE Xplore
- The 2026 paper deadline was extended twice by three weeks in total; a later call takes 2-page young professional
  papers as posters
- First day is devoted to tutorials
- Not listed in ICORE2026 or the CCF list
