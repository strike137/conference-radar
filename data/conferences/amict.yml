notes:
- Organized by the Faculty of Computing and Informatics, Universiti Malaysia Sabah, co-organized by the Malaysia ICT Deans' Council (MaDICT)
- Technically co-sponsored by the IEEE Sabah Subsection; JAIST and Universitas Diponegoro are strategic collaborators
- 2023 held online (published by EDP Sciences); 2025 hybrid in Kota Kinabalu (IEEE Xplore); 2026 hybrid in Labuan
- Three full-paper submission rounds; 4 to 6 pages in IEEE format, double-blind review by at least two reviewers via EasyChair
- "Fee: USD 400 (IEEE member) or USD 500 international physical, USD 300 or USD 400 online, non-student (2026)"
- Not listed in the CORE ICORE2026 portal
