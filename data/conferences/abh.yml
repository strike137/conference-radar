notes:
- INSTICC conference on AI and blockchain applied to healthcare (blockchain engineering, agentic AI, NLP and knowledge graphs, governance and ethics by design); first held in 2026
- Proceedings in the SCITEPRESS Digital Library; selected papers invited to extend for Springer and journal special issues
- Two submission stages (regular papers in stage 1, regular or position papers in stage 2); earlier stage gives earlier notification
- 2026 co-located with SIMULTECH and ICSBT in Porto; 2027 with SECRYPT, QUANTICS, SIMULTECH and ICSBT in Rome; one registration covers them as a non-speaker
- Remote presentation allowed when travel is not possible
- Not listed in ICORE2026
