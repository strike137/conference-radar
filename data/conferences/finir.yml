notes:
- Workshop on information retrieval for generative models in finance (financial IR techniques, benchmarks, financial agents, trustworthiness and privacy)
- The 2nd edition was a half-day workshop co-located with ACM SIGIR 2025 in Padua, Italy, on July 17, 2025
- Non-archival; the CFP states accepted papers are not included in proceedings and can be submitted elsewhere
- Papers of 4 to 8 pages in ACM double-column format, double-blind review via EasyChair
- 8 accepted papers presented in 2025
- Region reflects the 2025 edition only; earlier edition not checked
- Not listed in ICORE2026 and not on the CCF list
