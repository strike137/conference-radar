notes:
- Workshop series at KDD since 2016 on data science and AI for climate and the UN Sustainable Development Goals; the theme changes each year (2025 AI for climate risk mitigation, 2024 generative and foundation models for sustainable development)
- Location follows KDD (Barcelona 2024, Toronto 2025)
- Full papers up to 8 pages, position papers up to 4 pages and policy notes up to 2 pages in ACM format, submitted through OpenReview
- Non-archival; accepted papers and videos are posted on the Fragile Earth website, not in the KDD proceedings, and authors keep the right to submit elsewhere
- Small workshop (4 regular papers in the 2025 program)
- Not listed in CORE ICORE2026 and not on the CCF list
