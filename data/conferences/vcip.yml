notes:
- Held since 1986 (SPIE conference before 2011); one of the flagship conferences of the IEEE CAS Visual Signal
  Processing and Communications Technical Committee
- Recent editions alternate between Asia and Europe (2020 Macau, 2021 Munich, 2022 Suzhou, 2023 Jeju, 2024 Tokyo, 2025 Klagenfurt,
  2026 Singapore)
- Double-blind; 4 pages plus an optional 5th page of references only, two-column IEEE format; submission via Microsoft
  CMT
- Selected papers are recommended to IEEE Transactions on Circuits and Systems for Video Technology (TCSVT) for
  extension
- Each accepted paper needs a regular (non-student) registration and must be presented in person (a qualified
  surrogate may present if no author can attend)
- ICORE2026 rank C; not in the CCF 2026 list (only the journal JVCIR is)
