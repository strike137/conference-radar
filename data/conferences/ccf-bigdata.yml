notes:
- National big data conference of CCF, run by its Task Force on Big Data (founded 2012); 2026 is the 14th edition
- English papers not picked for partner journals are published in Springer CCIS (EI indexed); Chinese papers go to Chinese partner journals with no separate proceedings
- Accepts Chinese and English papers; double-blind review, English papers in Springer CCIS format
- Held in a different Chinese city each year (Qingdao 2024, Tianjin 2025, Harbin 2026)
- Not ranked in CORE ICORE2026; not on the CCF 2026 recommended list
