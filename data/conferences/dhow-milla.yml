notes:
- Workshop on harmful content on the Web (misinformation, hate speech, deepfakes, LLM-generated and multimodal harmful content)
- Continues the DHOW workshop, held at ACM WebSci 2024 (Stuttgart) and ACM Multimedia 2025 (Dublin); the 2026 edition merged it with a workshop on misinformation in the age of LLMs and agents at The Web Conference 2026
- The host conference changes from year to year, so dates and proceedings follow the host
- 2026 papers appear in The Web Conference 2026 Companion Proceedings (ACM DL); DHOW 2025 papers appeared in the ACM MM 2025 workshop proceedings and DHOW 2024 in the WebSci 2024 Companion
- 2026 long papers 8 pages plus references and appendix (12 pages max), short papers 4 pages; double-blind review on OpenReview
- Selected papers may be invited to submit extended versions to a special issue
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
