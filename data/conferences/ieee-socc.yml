notes:
- Annual SoC and SiP design conference; started in 1987 as a local ASIC seminar of the IEEE Rochester section,
  renamed IEEE SOC Conference (SOCC) as SoCs emerged
- Organizational sponsors are IEEE and IEEE CAS Society
- 'Topics: SoC architectures, edge AI accelerators, hardware security, NoC and many-core, RF and analog circuits,
  low power design, design methodology and test'
- Regular papers are 4 to 6 pages in IEEE double-column format with double-blind review; industrial talks are 1
  to 2 pages
- Accepted papers presented at the conference are submitted to IEEE Xplore; indexed in Scopus
- Held in the USA until 2006, now rotates between the USA, Europe, the Middle East and Asia (Las Vegas 2021,
  Belfast 2022, Santa Clara 2023, Dresden 2024, Dubai 2025, Heidelberg 2026)
- Not listed in ICORE2026 or the CCF list (the CCF "SoCC" is the ACM Symposium on Cloud Computing)
- SOCC 2027 announced for Las Vegas, NV, USA in September 2027
