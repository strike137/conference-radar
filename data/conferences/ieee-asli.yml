notes:
- New IEEE SPS conference formed by merging the core activities of IEEE ASRU and IEEE SLT; first edition in 2027
- Covers speech, audio, spoken language and multimodal intelligence (SLTC and AASP TC scope)
- Held as part of the IEEE Signal Processing Summit together with IEEE ICIP and IEEE CAI (Singapore 2027 and 2028, Silicon Valley 2029 planned)
- Papers up to 6 pages of main text in IEEE two-column format, with no page limit on references or appendices
- Has an author rebuttal period and a reviewer discussion period
- New Findings track; top papers go to the main Proceedings of ASLI, other accepted papers to the Findings of ASLI, both in IEEE Xplore
- At least one author of each accepted paper (main or Findings) must register and present
- Not listed in ICORE2026 (new venue)
