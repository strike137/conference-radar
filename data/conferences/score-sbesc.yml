notes:
- Satellite workshop of SBESC, the Brazilian Symposium on Computing Systems Engineering; first edition in 2025
- Focus on reuse of electronic devices, especially IPTV set-top boxes confiscated by the Brazilian Federal Revenue Service, as computers for education or IoT platforms
- Topics include operating systems, IoT, robotics, embedded systems, energy efficiency and experience reports
- Papers up to 4 pages in the IEEE two-column template, in English or Portuguese, submitted via JEMS
- Accepted papers published in SBC OpenLib (SOL) as the Proceedings of SCoRe
- Held with SBESC in a different Brazilian city each year (Campinas 2025, Salvador 2026)
- Not listed in CORE ICORE2026
