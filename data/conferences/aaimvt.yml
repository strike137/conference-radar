notes:
- Workshop on applied AI with multimodal visualization (explainability, trust, decision support, multimodal LLMs) across healthcare, education, cybersecurity and industry
- First edition at The Web Conference 2026, a half-day workshop
- Papers appear in the Companion Proceedings of the ACM Web Conference 2026 (ACM DL)
- Up to 8 content pages plus up to 2 supplementary pages, 12 pages in total with references
- Originally planned for April 13-14, 2026; held on June 29, 2026 after WWW 2026 moved to June 29 to July 3
- Five papers on the 2026 program
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
