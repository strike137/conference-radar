notes:
- Latin American conference of the IEEE Computational Intelligence Society; IEEE CIS offers travel grants
- Covers soft computing and the wider computational intelligence field; aims to bring in young researchers
- Accepted papers must be presented to appear in the proceedings in IEEE Xplore (with ISBN)
- Held in Latin America; the 2024 edition site was hosted by IEEE Colombia, 2025 was held in Mexico City
- Not ranked in CORE ICORE2026
