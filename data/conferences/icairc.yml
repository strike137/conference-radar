id: icairc
name: ICAIRC
full_name: International Conference on Artificial Intelligence, Robotics, and Communication
type: conference
tier: minor
areas: [ai, vision, communications]
region: china
language: english
frequency: annual
organizer: ICAIRC conference secretariat supported by AiScholar, hosted by Xiamen University (2025, 2026) with Jiangxi University of Science and Technology
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus, Inspec]
fee: 570 USD or 3800 CNY per 4-page paper (2026, regular); 510 USD early bird, 540 USD student; 60 USD per extra page
typical:
  deadline_months: [8]
  conference_months: [11, 12]
links:
  website: http://www.icairc.net/
notes:
- Annual since 2021; 2022 was online, 2023 to 2026 held in Xiamen, China
- Scope covers AI, computer vision, robotics and communication
- Accepted full papers go to an IEEE proceedings volume submitted to IEEE Xplore, EI Compendex, Scopus and Inspec; 2022 and 2023 proceedings were published by Springer, 2021, 2024 and 2025 by IEEE
- Two or three reviewers per paper; abstract-only presenter option without publication
- Run by a commercial conference secretariat (AiScholar) with university hosts
- Not listed in CORE ICORE2026 or the CCF list
