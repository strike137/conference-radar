notes:
- Covers usable security, human factors, security psychology, trust and disaster communication
- 'Four meetings a year: May (with IPSJ CN and IEICE LOIS), July Security Summer Summit in Sapporo, December (with
  CSEC and EIP), March (with IEICE ICSS, in Naha in 2025 and 2026)'
- Student research encouragement award for about 20% of student talks at the four regular meetings
- Co-organizes CSS, where the Usable Security Workshop (UWS) is co-located; talks go into non-refereed IPSJ SIG
  Technical Reports
