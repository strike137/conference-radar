  conference_months: [8]
links:
  website: https://www.servicessociety.org/edge
notes:
- Not to be confused with IEEE EDGE (IEEE International Conference on Edge Computing and Communications); this one is run by the Services Society
- One of ten co-located conferences of SCF run by the Services Society, a US-registered nonprofit (siblings include ICWS, SCC, BigData, ICIOT and CLOUD)
- Proceedings in Springer LNCS; research and application/industry tracks up to 15 pages, short papers up to 8 pages
- Each submission reviewed by at least three program committee members; submission via EDAS
- Several submission rounds (early bird, regular, special track) in one cycle
- Covers edge architectures, runtimes, resource management, networking, security and applications across the device, edge and cloud continuum
- 'Recent hosts: Seattle (2018), San Diego (2019), virtual (2020, 2021), Hawaii (2022), Shenzhen (2023), Bangkok (2024), Hong Kong (2025), Kuala Lumpur (2026)'
- 2026 theme was Agentic AI as a Service for Edge Computing
- Not listed in ICORE2026; not on the CCF 2026 list
