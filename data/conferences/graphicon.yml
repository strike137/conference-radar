notes:
- Largest Russian and CIS conference on computer graphics, image processing, machine vision, visualization and virtual environments; held every year since 1991
- 2026 was the 36th edition, at ITMO University in St. Petersburg; host city changes every year (2025 at Volga State University of Technology)
- Working languages Russian and English; templates for both are provided
- Peer-reviewed papers accepted into the program are published in the conference proceedings, indexed in RSCI (RINC)
- Best papers are recommended to Russian journals such as Programming (Scopus, WoS) and Scientific Visualization (Scopus)
- Registration fee paid after acceptance; papers after the deadline are accepted only by agreement with section chairs
- Not listed in ICORE2026 or the CCF list
