notes:
- National applied research conference of the ECTI Association of Thailand, held since 2009; 18th edition in 2026
- Host university and province change every year (Silpakorn University in Hua Hin 2023, Surindra Rajabhat University
  in Surin 2024, Nakhon Ratchasima Rajabhat University in Nakhon Ratchasima 2026)
- Full papers of 4 to 6 pages in Thai or English, IEEE two-column format, reviewed by experts (2024 call)
- Papers go into the ECTI-CARD Proceedings, posted as PDFs on the ECTI Association website
- High-scoring papers are invited to submit full versions to TCI-indexed Thai journals such as ECTI-ARD
- Topics include communications and smart electronics, embedded systems and IoT, AI, measurement and control,
  robotics, energy management and agricultural technology
- Not listed in ICORE2026 and not on the CCF list
