notes:
- Non-profit hacker conference in Paris, described as the oldest and largest hacker event in France
- Initiated in 2003 by HackerzVoice (now HZV), which still runs it
- Held at the Cite des sciences et de l'industrie in Paris; runs overnight into Sunday morning with a wargame and workshops
- Tracks include talks, OSINT village, workshops and the leLAB hardware village; talks in French and English
- No published proceedings
