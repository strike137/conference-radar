notes:
- Organized by UIN Syarif Hidayatullah Jakarta with support from the IEEE Indonesia Section; 2026 was the 14th edition
- Accepted and presented papers are submitted to IEEE Xplore; no-show papers are excluded
- 2026 edition hosted at Universitas Negeri Surabaya (UNESA), Surabaya, Indonesia
- 4 to 6 page IEEE-format papers via EasyChair, each reviewed by three PC members
- Scope covers IT service management and governance, cyber resilience, cloud and enterprise systems, and AI for
  digital services
- 'Deadlines get extended (2026: Jul 10 -> Jul 20)'
- Not listed in the ICORE2026 portal or the CCF 2026 list
