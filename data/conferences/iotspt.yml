id: iotspt
name: IoTSPT
full_name: International Workshop on Security, Privacy, Trust for Internet of Things
type: workshop
tier: minor
areas: [security, networking]
region: worldwide
language: english
frequency: annual
organizer: Co-located with ICCCN; program chair Geethapriya Thamilarasu (University of Washington Bothell)
organizer_country: [usa]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [4]
  conference_months: [7, 8]
links:
  website: https://sites.google.com/uw.edu/iotspt2026
notes:
- Workshop held with ICCCN (International Conference on Computer Communications and Networks); 15th edition in 2026
- Workshop papers are limited to 6 pages and go into the ICCCN proceedings and IEEE Xplore; papers not presented onsite are left out of IEEE Xplore
- Authors of outstanding papers are invited to submit extended versions to a journal special issue
- In-person presentation by a registered author paying the full rate is required
- Location follows ICCCN (Tokyo 2025, Honolulu 2026, Rome announced for 2027)
