notes:
- Workshop co-located with IEEE WCNC 2026 (WS-18), sharing sessions with the Open6GNet workshop
- Organizers from INRS and Universite du Quebec en Outaouais (Canada), University of Sharjah and ENSICAEN (France)
- Topics include Open RAN, AI/ML in the RAN, SDN and NFV, and security of open and programmable RANs
- 2026 papers included intrusion detection and federated threat intelligence for Open RAN
- Accepted and presented papers go into the WCNC proceedings in IEEE Xplore; no-show papers are removed
- Workshop papers up to 6 pages (2 extra pages at 100 USD each); submissions via EDAS
- Not listed in ICORE2026
