notes:
- ICFP workshop on the architecture of large, long-lived software built in functional languages, often in industry
- Started in 2022 as a track with no publications; peer-reviewed papers in the ACM DL since the first workshop in 2023
- Categories are research papers and architectural pearls (5 to 12 pages), experience reports (3 to 6 pages) and an open category (1 to 6 pages), ACM SIGPLAN acmart format
- Lightning talks are not peer reviewed and are not part of the proceedings
- Small one-day workshop with a handful of accepted papers
- Moves with ICFP (Ljubljana 2022, Seattle 2023, Milan 2024, Singapore 2025, Indianapolis 2026)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
