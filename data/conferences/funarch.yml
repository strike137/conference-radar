notes:
- Workshop on architecture of large, long-lived software built with functional languages, often from industry
- Co-located with ICFP every year since 2022 (Ljubljana 2022, Seattle 2023, Milan 2024, Singapore 2025, Indianapolis 2026)
- Proceedings in the ACM Digital Library; research papers and architectural pearls 5-12 pages, experience reports 3-6 pages
- Open category submissions not intended for publication are also accepted, plus lightning talks outside the proceedings
- ACM SIGPLAN acmart format; remote presentation only in special cases
- Not listed in the CORE portal (ICORE2026)
