notes:
- Workshop on media forensics, deepfake detection, watermarking and fingerprinting, provenance standards (C2PA),
  model attribution and fact-checking
- Held with ICCV 2025 and CVPR 2026 (Denver, half day)
- Papers up to 8 pages in CVPR style, double-blind with at least two reviewers, via OpenReview
- Accepted papers are published in the CVPR workshop proceedings
- 13 papers on CVF Open Access for CVPR 2026 and 13 for ICCV 2025
- 2026 edition hosted the VASDL video and audio splice detection challenge and a best paper award
- Not listed in ICORE2026 or the CCF list
