notes:
- Long-running serverless computing workshop, held with ACM/IFIP Middleware since 2019 (WoSC 1 and 2 in 2017, WoSC 3 and 4 in 2018)
- Renamed Workshop on AI and Serverless (WoAIS) in 2026; WoAIS 1 ran with ACM DEBS 2026 in Lisbon and WoAIS 2 runs with Middleware 2026 in Tarragona
- Papers up to 6 pages in ACM SIGPLAN format, double-blind, at least 3 reviews; demos and other non-paper talks are not published
- Each edition has its own proceedings volume in the ACM Digital Library (WoSC 11 in 2025, DOI 10.1145/3774899); the 2026 call says workshop papers go into Middleware companion proceedings in the ACM DL
- Hybrid workshop (in person and online); a separate online WoSCx series takes talks only, with no proceedings
- Not listed in CORE ICORE2026 or the CCF list
