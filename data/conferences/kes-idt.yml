notes:
- Organized by KES International; 18th edition in 2026, 19th in 2027
- Covers AI for decision making, decision support systems and intelligent systems engineering
- Held as part of the KES Smart Digital Futures multi-conference together with AMSTA and other KES events
- Full papers published by Springer in the Smart Innovation Systems and Technologies series; short papers and
  abstracts are published online only, not in the Springer volume
- Many papers come through invited sessions, whose chairs set their own deadlines
- Held in Europe every June (Madeira 2024, Solin 2025, Barcelona 2026, Iasi 2027)
- ICORE2026 rank C (listed as KES International Symposium on Intelligent Decision Technologies); not on the CCF list
