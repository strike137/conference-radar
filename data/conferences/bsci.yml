notes:
- Symposium co-located with ACM AsiaCCS since 2019 (Auckland); 8th edition in Bangalore in 2026
- 'Topics: blockchain design and its use to secure critical infrastructure; full (12 pages), short (6 pages) and
  poster (3 pages) papers'
- Double-blind review; best paper and best student awards
- Selected papers are recommended to ACM Distributed Ledger Technologies (DLT) and MDPI Blockchains
- 'Small event: the 2026 program had 4 papers and 1 poster in a single morning'
