  website: http://vrcai.cn
notes:
- ACM SIGGRAPH sponsored conference on VR, AR, MR and XR with a focus on industrial applications; started in Hangzhou in 1993
- Full papers 8 pages and short papers 4 pages (including references), double-blind review; posters and demos 2 pages
- Accepted papers and abstracts appear in the ACM Digital Library (EI indexed); selected papers invited to journals such as Computational Visual Media and Computer Animation and Virtual Worlds
- Usually several submission rounds and frequent deadline extensions (2026 deadline moved from Aug 15 to Aug 31, then a second round to Sep 20)
- 2025 edition (20th) at Macau University of Science and Technology; 2026 edition (21st) planned at Beihang University's Hangzhou institute, then moved fully online
- Not listed in ICORE2026; not on the CCF 2026 list
