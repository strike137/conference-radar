id: crsit
name: CRSIT
full_name: International Conference on Communication, Remote Sensing and Information Technology
type: conference
tier: minor
areas: [communications, networking]
region: china
language: english
frequency: annual
organizer: Commercial conference secretariat (AEIC / AiScholar ais.cn system) with a host university each year (Nanjing University of Information Science and Technology in 2026, Kunming University of Science and Technology with NUIST in 2025)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI Compendex, Scopus]
fee: 570 USD per paper (4 pages), extra pages 60 USD each, attendees without a paper 225 USD (2027)
typical:
  deadline_months: [1]
  conference_months: [6]
links:
  website: https://www.crsit.net/
notes:
- Smaller commercially organized Chinese conference run through the AiScholar (ais.cn) conference service, contact via a WeChat phone number
- Started in 2025 (Kunming 2025, Nanjing 2026, Lanzhou 2027)
- Proceedings covers for 2025 and 2026 on the official site are IEEE volumes with AEIC logo (ISBN 979-8-331-59471-8 and 979-8-3195-3016-5)
- The 2027 site only says accepted papers go into the conference proceedings submitted to EI Compendex and Scopus
- Papers reviewed by two or three experts; abstract-only presentation without publication is also offered
- Not listed in ICORE2026 or the CCF 2026 list
