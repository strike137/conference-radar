notes:
- Organized by INSTICC; since 2026 the proceedings are a Springer CCIS book (earlier editions were in the SCITEPRESS
  Digital Library)
- CORE C (ICORE2026); regarded as a minor venue
- Covers IoT fundamentals and applications, big data, and security, privacy and trust for IoT
- Two submission stages (1st stage gives an earlier notification), plus position papers and an abstracts track
- Held in European cities (Prague 2023, Angers 2024, Porto 2025, Benidorm 2026, Rome 2027) and co-located with CLOSER,
  ICEIS, ENASE and other INSTICC conferences with free cross access; remote presentation allowed in exceptional cases
