links:
  website: https://cyberc.org/
notes:
- Annual since 2009; founded by researchers from InfoBeyond Technology, the University of Louisville and AT&T
- Tracks on AI computing, cyber communications, big data and cybersecurity
- Held in China every year (Taicang 2023, HKUST Guangzhou 2024, Taiyuan 2025); 2021 edition cancelled
- "2025 CFP: published by IEEE (IEEE Xplore), conference record 66434; the site says papers will be submitted to
  EI Compendex and Scopus"
- Submission via EDAS; deadlines usually extended; virtual presentation allowed when travel is difficult
- Not listed in the CORE ICORE2026 portal; regarded as a small venue
