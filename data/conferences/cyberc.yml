id: cyberc
name: CyberC
full_name: International Conference on Cyber-Enabled Distributed Computing and Knowledge Discovery
type: conference
tier: minor
areas: [ai, data, communications, security, systems]
region: china
language: english
frequency: annual
organizer: CyberC Steering Committee (technical co-sponsor IEEE ComSoc Big Data Technical Committee) with a Chinese
  host university
organizer_country: [usa, china]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [5, 6]
  conference_months: [10, 11]
links:
  website: https://cyberc.org/
notes:
- Annual since 2009 (2025 was the 17th); founded by researchers from InfoBeyond Technology, the University of Louisville and AT&T
- Tracks on AI computing, cyber communications, big data and cybersecurity
- Recent editions all held in China (Guilin 2019, Chongqing 2020, XJTLU 2022, Taicang 2023, HKUST Guangzhou 2024,
  Taiyuan 2025); 2021 edition cancelled
- "2025 CFP: published by IEEE (IEEE Xplore), conference record 66434; the site says papers will be submitted to
  EI Compendex and Scopus"
- Submission via EDAS; deadlines usually extended; virtual presentation allowed when travel is difficult
- Not listed in the CORE ICORE2026 portal; regarded as a small venue
