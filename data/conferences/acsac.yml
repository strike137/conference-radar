notes:
- Applied security conference held since 1985 (ACSAC 42 in 2026), now branded IEEE ACSAC
- Single paper deadline in late May; double-blind two-round review with early rejection and minor revision
- 'Held in the USA every December: Honolulu (2024, 2025), Los Angeles (2026)'
- Has a reproduction and replication (R+R) track and artifact evaluation; student conferenceships offered
- Regarded as a solid second-tier venue (CORE A, CCF B)
