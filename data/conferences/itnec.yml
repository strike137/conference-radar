id: itnec
name: IEEE ITNEC
full_name: IEEE Information Technology, Networking, Electronic and Automation Control Conference
type: conference
tier: minor
areas: [networking, communications, general]
region: china
language: english
frequency: irregular
organizer: Chongqing Global Union Academy of Science and Technology (GUAST), with IEEE sponsorship
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI]
fee: 600 USD author, 550 USD student or IEEE member, 200 USD listener (2026)
typical:
  deadline_months: [11, 2]
  conference_months: [3, 9]
links:
  website: http://www.itnec.org/
notes:
- Run by the Chongqing Global Union Academy of Science and Technology, a company that also runs IAEAC, IMCEC, ITOEC and ITAIC
- Held in China every edition (Chongqing, Chengdu or Xi'an); 2026 was the 8th edition (IEEE conference record 67763)
- Proceedings in IEEE Xplore under ISSN 2693-3128; the site says past papers were indexed in EI about two months after publication
- Broad scope covering IT, networking, communications, electronics and automation control
- Two submission rounds with short review cycles; papers of at least 4 pages
- Not held every year (no edition in 2022 or 2025)
- Not listed in CORE ICORE2026 or the CCF list
