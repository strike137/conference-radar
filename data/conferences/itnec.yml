notes:
- Run by the Chongqing Global Union Academy of Science and Technology (GUAST), which also runs ITOEC and IAEAC with the same committee and website template
- "ITNEC 2026 was the 8th edition; IEEE conference record 67763, proceedings series ISSN 2693-3128"
- The site says all accepted papers are published by IEEE and submitted to EI Compendex, with review by at least two PC members
- Two submission rounds per edition; minimum paper length 4 pages
- Broad scope (IT, big data, AI, networking, electronics, automation); regarded as a small, high-acceptance venue
- Not listed in CORE ICORE2026 or the CCF list
