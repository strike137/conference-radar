notes:
- Non-profit, one-day developer conference run by developers for developers, part of the Developer! Developer! Developer! (DDD) series in Australia
- Running since 2011; held at QUT Gardens Point in the Brisbane CBD
- Anyone can submit a session; delegates vote on the sessions they want to see, and the agenda follows the vote
- Four parallel rooms of talks plus keynotes; ticket is 50 AUD (2026) and includes catering
- No papers or proceedings
- Not listed in CORE ICORE2026
