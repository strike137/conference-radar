id: icnwc
name: ICNWC
full_name: International Conference on Networking and Communications
type: conference
tier: minor
areas: [networking, communications]
region: south-asia
language: english
frequency: irregular
organizer: Department of Networking and Communications, School of Computing, SRM Institute of Science and Technology (SRMIST), with technical sponsorship from IEEE Madras Section
organizer_country: [india]
proceedings: IEEE Xplore
archival: true
indexing: [IEEE Xplore, Scopus]
fee: Indian students 6,000 INR non-IEEE, 5,000 INR IEEE; foreign authors 230 USD non-IEEE, 180 USD IEEE (2026)
typical:
  deadline_months: [2, 3]
  conference_months: [4]
links:
  website: https://www.srmist.edu.in/events/icnwc-2026/
notes:
- Run by the Department of Networking and Communications at SRMIST, Kattankulathur (Chennai), India
- Editions in 2023 (first), 2024 (second) and 2026 (third); no 2025 edition
- Technical sponsorship from IEEE Madras Section; accepted and presented papers are submitted to IEEE Xplore (2026 IEEE conference record 68145)
- 2026 edition had a technical partnership with the Energy Sustainability Focus Group of UMPSA, Malaysia, and a pre-launch session in Pekan, Malaysia
- Physical attendance for Indian authors, hybrid for foreign authors (2026); submission via Microsoft CMT
- A Research Slam contest is held as a pre-event
- Not listed in ICORE2026 or the CCF list; a small university-run venue with short review cycles
