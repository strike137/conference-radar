id: iciev
name: ICIEV
full_name: International Conference on Informatics, Electronics & Vision
type: conference
tier: minor
areas: [vision, ai, communications, general]
region: worldwide
language: english
frequency: irregular
organizer: CenNSER (Center for Natural Science & Engineering Research, UK), hosted by Kyushu Institute of Technology
organizer_country: [europe]
proceedings: IJCVSP / IJABC journals
archival: true
typical:
  deadline_months: [3, 10]
  conference_months: [5, 12]
links:
  website: https://cennser.org/ICIEV/
  dblp: https://dblp.org/db/conf/iciev/index.html
notes:
- Organized by CenNSER (UK); the 2025 and 2026 editions are hosted by Kyushu Institute of Technology in Kitakyushu
- Accepted regular papers are published in the International Journal on Computer Vision and Signal Processing (IJCVSP,
  6 to 10 pages) or the International Journal of Activity and Behavior Computing (IJABC, 10 to 20 pages); both free to publish
- Short, position and work-in-progress papers (2 to 6 pages) can be presented without publication; 4+ page ones can go to IJCVSP
- Double-blind review via Microsoft CMT with a rebuttal and resubmission round
- 'Past locations: Bangladesh, Japan, USA, UK, virtual (2021); now held every year or two (2023, 2025, 2026)'
