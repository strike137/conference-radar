notes:
- Flagship fuzzy systems conference of IEEE CIS; covers fuzzy sets and logic plus hybrids with other CI and AI methods
- In even years it runs inside IEEE WCCI together with IJCNN and IEEE CEC (WCCI 2026 in Maastricht); in odd years it
  is held on its own
- Proceedings in IEEE Xplore; a paper appears only if an author registers and presents it, in person or online (WCCI 2026)
- WCCI 2026 allowed in-person or online presentation at the same fee; one regular registration covers up to two papers
- FUZZ-IEEE 2027 is in Sydney, Australia (10 to 13 July 2027), organized by the University of Technology Sydney
