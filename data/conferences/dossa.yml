notes:
- Half-day computer architecture workshop on hardware and software for domain specific systems and accelerators
- Co-located with a major architecture conference that changes by year (ISCA 2023 and 2024, MICRO 2025 and 2026)
- Submissions are 2-page presentation abstracts via Microsoft CMT; final papers and slides are posted on the workshop website only (non-archival)
- Program built around invited talks from academia and industry plus a few papers
- Held in Orlando 2023, Buenos Aires 2024, Seoul 2025, Athens 2026
