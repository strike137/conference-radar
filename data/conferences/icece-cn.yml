notes:
- Annual since 2018, always based in Xi'an, China (virtual in 2020 to 2022); 2026 is the 9th edition
- Proceedings in IEEE Xplore, submitted for EI Compendex and Scopus
- Not to be confused with the Bangladesh ICECE (International Conference on Electrical and Computer Engineering)
- Minimum paper length 4 pages; abstract submission also accepted
- Smaller commercially run conference with a secretariat contact on vip.163.com
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
