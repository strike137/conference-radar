notes:
- Held since 2018 (Hammamet 2018, Sharm El Sheikh 2019, virtual 2021); technically co-sponsored by IEEE and IEEE ComSoc
- Tarek Bejaoui and Rim Moussa (University of Carthage, Tunisia) recur as general or TPC chairs; 2018 was co-sponsored by the IEEE Tunisia Section
- All accepted papers published in IEEE Xplore and indexed in dblp, Web of Science and Scopus
- "Acceptance rate: 45% (2025), 47% (2026)"
- Twelve tracks on smart cities, IoT, AI, next generation networks, security and smart grid communications
- Each additional paper by the same registrant costs 50% of the full registration fee
- 2027 (9th edition) hosted by UESTC and BUPT in Beijing
- Not listed in CORE ICORE2026
