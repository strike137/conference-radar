notes:
- Workshop on malware analysis and detection, ML-based malware detection, adversarial ML, concept drift, attribution and
  LLMs for malware; aims to bridge academia and industry
- Co-located with IEEE EuroS&P since 2023 (Delft 2023, Vienna 2024, Venice 2025, Lisbon 2026); 1st edition was at
  AsiaCCS 2022 in Nagasaki, Japan
- Accepted papers are published in IEEE Xplore; one author must attend and present for the paper to be included
- '2026 formats: original research papers with an 8-page main body (12 pages max) and Position papers with a 6-page main
  body (10 pages max), IEEE EuroS&P template, double-blind review'
- One-day workshop with two keynotes; small program (4 papers in 2026)
- Deadlines were extended by about one week in both 2025 and 2026
- Not listed in ICORE2026 or the CCF list
