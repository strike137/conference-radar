id: icbinb
name: ICBINB
full_name: I Can't Believe It's Not Better Workshop
type: workshop
tier: minor
areas: [ai]
region: worldwide
language: english
frequency: annual
organizer: ICBINB initiative (volunteer team with advisors David Blei, Max Welling, Robert Williamson and Tamara
  Broderick); co-located with NeurIPS or ICLR
organizer_country: [international]
proceedings: PMLR (NeurIPS 2020 v137, NeurIPS 2021 v163, NeurIPS 2023 v239, ICLR 2025 v296)
archival: true
typical:
  deadline_months: [1, 2]
  conference_months: [4]
links:
  website: https://icbinb.cc/
notes:
- Workshop on negative results, failure modes and surprising shortcomings of machine learning methods; yearly theme
- Held with NeurIPS 2020 to 2023, then ICLR 2025 (Singapore) and ICLR 2026 (Rio de Janeiro)
- ICLR 2025 edition published 14 papers in PMLR volume 296; earlier PMLR volumes 137 (2020), 163 (2021) and 239 (2023)
- A non-archival option is always offered
- Full papers up to 4 pages and tiny papers up to 2 pages (2026); double-blind review on OpenReview
- Not listed in ICORE2026 and not on the CCF list
