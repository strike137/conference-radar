id: cikm
name: CIKM
full_name: ACM International Conference on Information and Knowledge Management
type: conference
tier: major
areas: [data, ai]
region: worldwide
language: english
frequency: annual
organizer: ACM (sponsored by SIGIR and SIGWEB)
proceedings: ACM DL
archival: true
indexing: [DBLP, Scopus]
rank:
  core: A
  ccf: B
acceptance_rate: 27% (2025, full research papers, 443/1627); 30% over all main tracks
fee: 990 EUR ACM member early, 1,120 EUR non-member early, 630 EUR student ACM member early (2026, 3-day main conference,
  22% VAT included)
typical:
  deadline_months: [5, 6]
  conference_months: [10, 11]
links:
  website: https://www.cikmconference.org/
  dblp: https://dblp.org/db/conf/cikm/
notes:
- ACM conference covering information retrieval, data mining, knowledge graphs and knowledge management
- Several paper types (full, applied research, short, resource, demo) with deadlines in late May and early June;
  double-blind review
- 2025 edition in Seoul was the largest CIKM so far (2,890 submissions); full-paper acceptance 27%
- Rotates worldwide; Asian editions include Seoul 2025, Beijing 2019, Singapore 2017; 2027 goes to Sydney
- 'In-person only: at least one author must register and present on site (no pre-recorded videos); each submission
  must nominate an author as reviewer'
