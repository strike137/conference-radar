notes:
- One of the two conference series of the International Computer Games Association (ICGA); originated in Japan
- Held in even-numbered years, alternating with Advances in Computer Games (ACG) in odd-numbered years
- AI for board, card, puzzle and video games (search, MCTS, game solving, machine learning for games)
- Proceedings in Springer LNCS; full papers up to 12 pages in LNCS style (2026); single-blind review
- Held online in 2020, 2022 and 2024; back on site in Maastricht, the Netherlands, in 2026 (first time since 2018)
- 16 accepted papers in 2026; 2026 camera-ready due after the conference so authors can use feedback
- About 280 EUR regular and 160 EUR student early registration (2026); the online 2024 edition charged 50 EUR per accepted paper
- Not listed in CORE ICORE2026 and not on the CCF 2026 list
