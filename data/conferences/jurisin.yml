id: jurisin
name: JURISIN
full_name: International Workshop on Juris-informatics
type: workshop
tier: minor
areas: [ai, nlp]
region: japan
language: english
frequency: annual
organizer: JURISIN steering committee (workshop chairs Ken Satoh, Center for Juris-informatics, and Yoshinobu Kano, Shizuoka
  University), at JSAI-isAI (Japanese Society for Artificial Intelligence)
organizer_country: [japan]
proceedings: Springer LNAI (JSAI-isAI proceedings); other presented papers in JURISIN local proceedings (ISBN 978-4-915905-98-8
  for 2026)
archival: true
typical:
  deadline_months: [1, 2]
  conference_months: [5, 6]
links:
  website: https://jurisinformaticscenter.github.io/jurisin2026/
notes:
- AI and law workshop (legal reasoning, argumentation, legal NLP, legal knowledge bases, generative AI and law), running
  since 2007; the 2026 edition was the 20th
- Held each May or June as a workshop of the JSAI International Symposia on AI (JSAI-isAI), alongside the JSAI annual
  conference in Japan; hybrid format
- Papers with LNAI quality go into the JSAI-isAI Springer LNAI volume; other presented papers go into an online local
  proceedings with an ISBN
- Springer LNCS format, max 14 pages, submission via EasyChair; at least one author must register through JSAI-isAI
- Closely linked to the COLIEE legal information retrieval and entailment competition
- Not listed in CORE ICORE2026 or the CCF 2026 list
