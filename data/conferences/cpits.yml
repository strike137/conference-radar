notes:
- Ukrainian cybersecurity workshop run by Borys Grinchenko Kyiv Metropolitan University, with editors from Royal Holloway, Kharkiv National University of Radio Electronics and Lviv Polytechnic
- Held twice a year since 2023, CPITS around February 28 and CPITS-II around October 26, both online from Kyiv
- Proceedings in CEUR-WS (Vol-4271 for 2026, Vol-3991 and Vol-4145 for 2025); indexed in Scopus and DBLP
- "Acceptance: 24 of 71 submissions (CPITS 2026), 26 of 63 (CPITS-II 2025)"
- No registration fee; papers in the CEURART one-column template, short papers 5 to 9 pages, regular papers 10 pages or more
- Short cycle of about three weeks from submission deadline to the workshop
- Held in memory of Professor Volodymyr Buriachok
