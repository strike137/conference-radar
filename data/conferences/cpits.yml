notes:
- Ukrainian cybersecurity workshop run by Borys Grinchenko Kyiv Metropolitan University, held online from Kyiv
- Held twice a year since 2021, CPITS on February 28 and CPITS-II on October 26, each with its own CEUR-WS volume
- Proceedings in CEUR-WS, indexed in Scopus and DBLP
- Very short cycle in 2026, one week from submission deadline to notification
- Free registration; short papers 5 to 9 pages and regular papers at least 10 pages in the CEUR one-column template
- "CPITS 2026: 24 of 71 submitted papers accepted (CEUR-WS Vol-4271)"
- "CPITS-II 2025: 26 of 63 submitted papers accepted (CEUR-WS Vol-4145)"
- Not listed in ICORE2026 and not on the CCF list
