notes:
- Annual since 2021; started as a workshop and now calls itself a conference, but is held as a one or two day event
  co-located with a host conference
- Hosts so far ICON 2021 (online), AACL 2022 (online), standalone with IWCLUL in Tokyo 2023, EMNLP 2024 Miami,
  NAACL 2025 Albuquerque, ACL 2026 San Diego
- Long (8 pages) and short (4 pages) papers, double-blind review via OpenReview; also accepts ARR commitments
- Papers in the ACL Anthology; lightning talk abstracts published separately on Zenodo
- Authors of accepted papers are invited to extend them for a special issue of the Journal of Data Mining and
  Digital Humanities
- Not ranked in CORE ICORE2026
