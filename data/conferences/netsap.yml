notes:
- Workshop of IEEE COMPSAC (IEEE Computer Society); 16th edition in 2026, 15th at COMPSAC 2025 in Toronto
- Focus on practical systems against cyber attacks, real traffic measurement and analysis, and privacy in network monitoring
- Organized by Japanese researchers (Kagawa University, NTT Security Japan, Deloitte Tohmatsu Cyber); program committee mostly from Japan
- Not listed in the CORE portal; COMPSAC itself is CORE B
- Workshop papers are 6 pages (up to 2 extra pages at USD 125 each) and appear in the COMPSAC proceedings on IEEE Xplore
- Workshop deadlines are shared across all COMPSAC workshops; the 2027 workshop list (COMPSAC 2027 in Tokyo, July 13 to 16) was not yet published
