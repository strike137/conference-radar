id: rapido
name: RAPIDO
full_name: 'Workshop on Rapid Simulation and Performance Evaluation for Design Optimization: Methods and Tools'
type: workshop
tier: minor
areas: [systems]
region: europe
language: english
frequency: annual
organizer: RAPIDO organizing committee (Politecnico di Milano, University of Rennes IRISA, CEA List and others), with HiPEAC
organizer_country: [europe]
proceedings: ACM DL
archival: true
typical:
  deadline_months: [11]
  conference_months: [1]
links:
  website: https://rapidoworkshop.github.io/
notes:
- One-day workshop on fast simulation, performance evaluation and design space exploration for embedded and
  high-performance systems, co-located with the HiPEAC conference
- Running since 2009
- Accepted papers published in the ACM Digital Library; extra fees apply if the author's institution is not in ACM Open
- Full papers up to 6 pages in the ACM double-column format (2 extra pages on request); submission via EasyChair
- Held in Budapest 2022, Toulouse 2023, Munich 2024, Barcelona 2025 and Krakow 2026 with HiPEAC
- Not in the CORE portal (ICORE2026) and not in the CCF 2026 list
