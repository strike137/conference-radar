id: rapido
name: RAPIDO
full_name: 'Workshop on Rapid Simulation and Performance Evaluation for Design Optimization: Methods and Tools'
type: workshop
tier: minor
areas: [systems]
region: europe
language: english
frequency: annual
organizer: Organizing committee from CEA, Universite de Rennes, Thales Research & Technology, Fraunhofer and the
  University of Auckland; web chair at Politecnico di Milano
organizer_country: [europe]
proceedings: ACM DL
archival: true
typical:
  deadline_months: [11]
  conference_months: [1]
links:
  website: https://rapidoworkshop.github.io/
notes:
- Co-located with the HiPEAC conference every January; held since 2009
- Topics are rapid simulation, performance and power estimation, and design space exploration for embedded and
  high-performance systems on chip, including AI accelerators
- Accepted papers are published in the ACM Digital Library; extra fees apply if the author institution is not in
  ACM Open
- Papers up to 6 pages in the double-column ACM format, up to 2 extra pages on request
- Separate abstract deadline one week before the paper deadline
- Follows HiPEAC around Europe (2023 Toulouse, 2024 Munich, 2025 Barcelona, 2026 Krakow, 2027 Glasgow)
- Not listed in ICORE2026
