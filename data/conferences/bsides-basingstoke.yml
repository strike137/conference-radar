notes:
- Volunteer-run Security BSides conference in Basingstoke, UK, first held in 2022 (the 2022, 2024, 2025 and 2026 editions were all in July)
- One day at The Red Lion Hotel and its attached cafe bar (The Dice Tower up to 2025, The Tavern in 2026), with two talk tracks plus a workshop track
- Paid ticket includes lunch and drinks; free quarterly mini-meets with one or two talks run between conferences
- Speakers must present in person (free ticket); talks are recorded and posted on YouTube, no live stream
- Charity auction at the end of each conference
- Talks only, no proceedings
