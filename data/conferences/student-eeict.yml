notes:
- Annual student competition conference of FEKT, Brno University of Technology, Czech Republic; 32nd edition in 2026
- Open to bachelor, master and PhD students and secondary school students; foreign students can present in online sections
- Papers in English (3-4 pages, 5 for PhD) on an IEEE-style template; reviewed, then defended at the one-day finals in Brno
- Bachelor and master talks in Czech or English; doctoral talks in English only
- No registration fee for accepted participants; prize money for the top three papers of each section
- Two proceedings volumes, Proceedings I (General Papers) and Proceedings II (Selected Papers, ISSN 2788-1334); the best papers are forwarded to Scopus for evaluation
- Topics span signal processing, communications, network security and cryptography, machine learning, power electronics, automation and electronics
