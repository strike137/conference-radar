id: icpeca
name: ICPECA
full_name: IEEE International Conference on Power, Electronics and Computer Applications
type: conference
tier: minor
areas: [communications, general]
region: china
language: english
frequency: annual
organizer: Commercial conference service in collaboration with IEEE Harbin Section
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 550 USD or 3900 CNY regular non-IEEE author (2027); 500 USD early bird before 2026-11-10; papers up to 6 pages, at most 10 with extra page fees
typical:
  deadline_months: [10]
  conference_months: [1]
links:
  website: http://www.icpeca.org/
notes:
- Annual since 2021, held every January; the 2027 edition is the 7th and is held in Shenyang
- Run by a commercial conference service in collaboration with IEEE Harbin Section
- Proceedings published in IEEE Xplore and indexed in EI Compendex (262 papers in 2022, 344 papers in 2023)
- Three broad tracks -> energy and power engineering, electronic engineering, computer applications
- Virtual presentation channel offered for international authors
- Not listed in CORE ICORE2026 or the CCF list
