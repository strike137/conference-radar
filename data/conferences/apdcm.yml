id: apdcm
name: APDCM
full_name: Workshop on Advances in Parallel and Distributed Computational Models
type: workshop
tier: minor
areas: [systems]
region: worldwide
language: english
frequency: annual
organizer: IEEE IPDPS workshop; workshop co-chairs Koji Nakano (Hiroshima University) and Jacir L. Bordim (University
  of Brasilia)
organizer_country: [japan]
proceedings: IEEE Xplore (IPDPS Workshops, IEEE Computer Society)
archival: true
typical:
  deadline_months: [1, 2]
  conference_months: [5, 6]
links:
  website: https://apdcm.iss-j.org/
notes:
- One-day workshop co-located with IEEE IPDPS every year since 1999 (28th edition in 2026)
- Papers appear in the IPDPS workshop proceedings in IEEE Xplore and the IEEE CSDL
- 'Topics: models of parallel and distributed computing (GPU, FPGA, quantum, cloud, BSP/LogP), parallel algorithms,
  and practical aspects such as MPI, multi-core and performance analysis'
- Regular papers up to 10 pages, short papers up to 4 pages; abstract registration on EasyChair is mandatory
- Extended versions of selected papers invited to the International Journal of Networking and Computing (IJNC)
- Best and outstanding paper awards each year; strong participation from Japanese universities
- Location follows IPDPS (mostly USA, sometimes Europe; Milan 2025, New Orleans 2026)
