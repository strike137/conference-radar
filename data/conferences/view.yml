notes:
- Annual industrial computer vision workshop of the Japan Society for Precision Engineering (JSPE) technical
  committee IAIP; started in 1989 as a visual inspection workshop, renamed ViEW in 2003
- Held every December at PACIFICO Yokohama, alongside the International Technical Exhibition on Image Technology
  and Equipment
- Oral, hybrid oral (5-minute talk plus poster) and interactive (poster) presentations, all on site; attendance
  also possible online (free for students)
- Submissions are reviewed; the proceedings are shown on a participants-only page (non-archival)
- Outstanding talks are recommended to the annual ViEW+DIA special issue of the Journal of JSPE (with review)
- Strong industry presence; about 100 talks and over 770 participants in 2025
