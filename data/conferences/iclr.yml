notes:
- Deep learning focused flagship venue; fully open review on OpenReview (reviews and discussion are public)
- 'Rotates globally: Kigali 2023, Vienna 2024, Singapore 2025, Rio de Janeiro 2026, California 2027'
- Newly listed as CCF A in the 2026 CCF list (not listed in 2022); CORE A*
- Abstract deadline in mid September, full paper about a week later; final decisions in December or January
- Acceptance dropped from about 32% (2025) to 27.4% (2026)
