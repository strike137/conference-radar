notes:
- Hacker and security conference in Mexico City; the official site calls it the event that gathers the largest hacking community in Mexico City
- Two days in November; the 2025 theme was "Safety is just a myth"
- 2025 edition held at Fronton Bucareli, Mexico City
- Site and program are in Spanish
- Paid tickets sold through Boletia; attendees can download a participation certificate from the site
- Talks only, no proceedings
