  deadline_months: [7, 8]
  conference_months: [11, 12]
links:
  website: https://ausdm.org/
  dblp: https://dblp.org/db/conf/ausdm/
notes:
- Running since 2002 (started as a workshop); renamed from Australasian Data Mining Conference to Data Science and
  Machine Learning Conference
- Proceedings in Springer CCIS; double-blind review
- Usually held in Australia in late November or early December (2023 edition in Auckland, NZ)
- Ranked Australasian C in ICORE2026; steering committee manages a student financial award
- Tracks for research, application, late-breaking work and a doctoral consortium; best papers invited to a Journal
  of Big Data special issue
