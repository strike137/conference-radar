region: oceania
language: english
frequency: annual
organizer: AusDM Steering Committee (host university varies; UTS in 2026)
organizer_country: [australia]
proceedings: Springer CCIS
indexing: [Scopus, DBLP]
rank:
  core: Australasian C
fee: 900 AUD non-student, 500 AUD student (2026, early, plus 10% GST)
