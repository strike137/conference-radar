notes:
- Half-day workshop at ACM RecSys on recommender systems for tourism (transport, lodging, attractions, context and mobility)
- Held with RecSys every year since 2016 except 2020; 2026 in Minneapolis was the tenth edition
- Proceedings in CEUR-WS (for example Vol-3886 for 2024 and Vol-4052 for 2025)
- Full papers up to 16 pages, short 8, position and demo papers 4 to 8, excluding references, CEUR template
- Single-blind review via the joint RecSys workshop EasyChair
- Lead organizer is at the Christian Doppler Laboratory for Recommender Systems, TU Wien
- Not listed in the CORE ICORE2026 portal
