notes:
- Threat intelligence summit run by the Taiwanese security company TeamT5, focused on APT operations, information
  warfare, cybercrime and incident response in the Asia-Pacific region
- First held in 2023 (one day in Beitou, Taipei); two days at ILLUME TAIPEI since 2024
- Speakers chosen through a call for papers since 2024; 2024 drew more than 150 analysts from across Asia and the
  Middle East
- Agenda and talk titles in English; speakers include TeamT5, ITOCHU, Mizuho and other Asian CTI teams
