notes:
- Small annual symposium on time in computer science, covering temporal logic and verification, temporal reasoning
  in AI, and temporal databases and data mining
- Series began in 1994 as a FLAIRS workshop and became an independent symposium in 2000
- Proceedings in LIPIcs up to 2025; TIME 2026 proceedings appeared in OASIcs (volume 146)
- Original and survey papers (12 pages in 2025) plus 4-page extended abstracts, single-blind review on OpenReview
- Top papers are invited to a journal special issue
- Held in Europe (Klagenfurt 2021, online 2022, Athens 2023, Montpellier 2024, London 2025, Cork 2026)
- TIME 2026 accepted 16 of 26 submissions
- CORE C (ICORE2026); not on the CCF list
