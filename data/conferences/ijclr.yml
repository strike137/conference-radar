notes:
- Started in 2021 as a joint event of ILP, AAIP, NeSy, StarAI and CogAI; a single integrated conference since 2024 with ILP, AAIP and CogAI folded in
- Successor of the ILP conference series (ILP is CORE B and CCF C, but IJCLR itself has no CORE ICORE2026 or CCF entry)
- Main track papers (long up to 15 pages, short 6 to 9 pages) in Springer LNAI; invited extended versions in a Machine Learning journal special issue
- Also a Recently Published Papers track and a late-breaking papers, posters and demo track (website only)
- Held in Cumberland Lodge UK (2022), Bari (2023), Nanjing (2024), Guildford (2025), Valencia (2026)
