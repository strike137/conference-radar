notes:
- Main IEEE CAS conference on circuits and systems for medicine and healthcare (biosensor interfaces, implantable
  and wearable devices, neural interfaces, bio-signal processing, AI for healthcare)
- Three-day single-track program with lecture and poster sessions, special sessions, live demos and a grand challenge
- Papers up to 4 pages of technical content plus an optional 5th page for references only, IEEE double-column format
- Accepted papers must meet IEEE Xplore requirements to be included in the proceedings
- Rotates worldwide (2021 Berlin, 2022 Taipei, 2023 Toronto, 2024 Xi'an, 2025 Abu Dhabi, 2026 Incheon, 2027 Oslo)
- 2026 edition (22nd) was run locally with the Institute of Semiconductor Engineers in Korea; IEEE CASS workshops
  were held on the days before and after the main conference
- Paper deadline usually in June and often extended (2025 -> 2025-06-06, 2026 2026-06-12 -> 2026-06-26)
- Not listed in ICORE2026 or the CCF list
