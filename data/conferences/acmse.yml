  deadline_months: [11, 12]
  conference_months: [4]
links:
  website: https://acmse.net/
notes:
- Describes itself as the oldest continuously running annual ACM conference; covers all areas of computer science,
  information systems and IT
- Held every April at a university in the southeastern or central US (Cape Girardeau, MO 2025; Troy, AL 2026;
  Decatur, AL 2027 hosted by Athens State University)
- Full papers 7 to 10 pages and short papers 5 to 6 pages in ACM sigconf format; double-anonymous review with a
  rebuttal phase; posters also accepted
- "Targeted acceptance rates (2027 CFP): about 35% for full papers and 45% for short papers"
- Papers appear in the ACM Digital Library as open access; authors without ACM Open affiliation pay an APC (500 USD
  for ACM/SIG members, 750 USD otherwise for 2027)
- At most three submissions per author; at least one author must present in person
- Friendly to students, with student competitions and a programming contest
- Not listed in CORE ICORE2026
