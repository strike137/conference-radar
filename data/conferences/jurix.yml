notes:
- Annual AI and law conference run by the Dutch-based JURIX Foundation since 1988; held every December in Europe
- Proceedings in the IOS Press Frontiers in Artificial Intelligence and Applications (FAIA) series, gold open access
- Long papers up to 10 pages, short papers up to 5 pages, poster papers up to 2 pages; single-blind review; in-person presentation required
- Recent hosts are Saarbruecken 2022, Maastricht 2023, Brno 2024, Turin 2025 and Toulouse 2026
- Workshops and a doctoral consortium on the first day
- CORE C (ICORE2026)
