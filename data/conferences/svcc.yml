notes:
- Run since 2020 by SVCSI, a US nonprofit; technically co-sponsored by the IEEE Computer Society
- Research track with double-blind review, 8 to 12 pages in IEEE format; separate workshop, poster and industry tracks
- At least one author must present in person
- 2021 and 2022 editions virtual (2020 and 2021 listed as San Jose in the Springer proceedings)
- Mostly held in the San Jose area (San Francisco Airport 2023, Sejong Convention Center in Korea 2024, Silicon Valley
  2025, San Jose State University 2026, Northeastern University Silicon Valley campus 2027)
- Co-located hackathon, CTF and tutorials; mixes academic papers with industry talks
- Small venue; not listed in ICORE2026 or the CCF 2026 list
