notes:
- Interdisciplinary conference on machine learning, statistics and data science for climate science, held since 2011
- First held in New York in 2011, at NCAR Boulder from 2012 to 2018, then Paris 2019, Oxford 2020 (virtual), Asheville 2022, Cambridge 2023, London 2024, Rio de Janeiro 2025 and Lausanne 2026
- Held in September or October until 2020 and in spring (April) since 2022
- Two tracks, full papers and extended abstracts; double-blind review by at least two reviewers
- Accepted full papers are published in a special issue of the Environmental Data Science (EDS) journal
- Hybrid format with a hackathon; CI 2026 received more than 100 submissions
