notes:
- Residential (gasshuku-style) workshop on embedded systems for university researchers, students and industry engineers,
  held every summer since 1999; SWEST28 (2026) was the 28th edition
- Run by the SWEST Executive Committee; co-organized by the IPSJ SIG on Embedded Systems (SIGEMB) and the NPO TOPPERS
  Project, with IEICE, JASA and other groups as supporters
- Held at the Suimeikan hotel in Gero Onsen, Gifu since 2022 (online in 2021, hybrid 2022 to 2024, on site only since
  2025)
- Program is keynote, discussion sessions, hands-on tutorials and an interactive (poster/demo) session with research
  talks, project talks and free-form builds; best poster/product/project awards with small cash prizes
- No paper proceedings; session slides, a report and survey results are posted on the website afterwards
- About 70 to 130 participants per year since 2021 (129 in 2026, 40 of them students)
