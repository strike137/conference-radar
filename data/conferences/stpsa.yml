notes:
- Workshop of IEEE COMPSAC (IEEE Computer Society); 20th edition in 2026, 19th at COMPSAC 2025 in Toronto
- Covers security, trust and privacy in software engineering, with recent emphasis on agentic AI, LLMs and blockchain
- Organized by Hossain Shahriar (University of West Florida) and Mohammad Ashiqur Rahman (Florida International University)
- Not listed in the CORE portal; COMPSAC itself is CORE B
- Workshop papers are 6 pages (up to 2 extra pages at USD 125 each) and appear in the COMPSAC proceedings on IEEE Xplore
- Workshop deadlines are shared across all COMPSAC workshops; the 2027 workshop list (COMPSAC 2027 in Tokyo, July 13 to 16) was not yet published
