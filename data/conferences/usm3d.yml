notes:
- CVPR workshop on structured and semantic 3D reconstruction of urban and built environments (photogrammetry, vision, graphics)
- Held with CVPR since 2024 (Seattle 2024, Nashville 2025, Denver 2026); 3rd edition in 2026
- Earlier editions were titled Urban Scene Modeling, Where Vision Meets Photogrammetry and Graphics
- Paper track takes extended abstracts (up to 4 pages) and full papers (up to 8 pages) in CVPR format, submitted via Microsoft CMT
- Accepted papers go into the CVPR Workshops proceedings; the site also lists some non-archival papers
- Runs the S23DR (HoHo house wireframes) and Building3D challenges
- Not listed in ICORE2026 or the CCF list
