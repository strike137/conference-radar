notes:
- Czech Linux and open source community conference, started in 2012; the largest event of its kind in the Czech Republic
- Held every year on the first weekend of October at the Faculty of Information Technology, Czech Technical University (FIT CTU), Prague Dejvice
- Program and website are in Czech; dozens of talks and workshops plus booths of projects such as Fedora, openSUSE and vpsFree.cz
- Talk proposals through a Call for Presentations (deadline end of August), followed by a public vote on the talks
- Free entry; no papers or proceedings, talks are recorded and published as videos
- 2020 and 2021 were held online; the 2022 edition was cancelled
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
