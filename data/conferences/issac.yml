notes:
- Premier conference on symbolic computation and computer algebra; series started in 1966, annual since 1981
- Proceedings in the ACM Digital Library; papers up to 8 pages in ACM two-column style plus 2 extra pages
- Review process with a rebuttal phase between first and final notification
- Also has short communications (posters) and software presentations with later deadlines
- 'Recent hosts: Lille (2022), Tromso (2023), Raleigh (2024), Guanajuato (2025), Oldenburg (2026)'
- ISSAC 2027 in Tsukuba, Japan (July 2027); ISSAC 2028 in Madrid, Spain (July 2028)
- CORE B; not on the CCF list
