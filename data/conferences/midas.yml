notes:
- Workshop on data mining, network science and NLP for finance (trading, risk, fraud, anti-money laundering, LLMs in finance), co-located with ECML PKDD
- 11th edition in 2026; held with ECML PKDD every year since at least 2019 (Virtual 2021, Turin 2023, Vilnius 2024, Porto 2025, Naples 2026)
- Organized by researchers from UniCredit, ENEA, University of L'Aquila and University of Calabria
- Full regular papers up to 15 pages, short papers up to 8 pages, extended abstracts up to 4 pages, excluding references, Springer LNCS style, via Microsoft CMT
- Regular papers are peer reviewed and go into the joint ECML PKDD workshop post-proceedings (expected to be a Springer CCIS volume); extended abstracts are not peer reviewed and may opt out
- At least one author must attend in person
- Not listed in CORE ICORE2026
- Official site is served over plain http
