notes:
- Flagship conference of the IEEE Robotics and Automation Society; proceedings in IEEE Xplore
- Very large venue covering all of robotics and automation, not only robot learning
- Location rotates worldwide (Xi'an 2021, Philadelphia 2022, London 2023, Yokohama 2024, Atlanta 2025, Vienna 2026, Seoul 2027, Rio de Janeiro 2028)
- 8-page limit including references; double-anonymous review via PaperPlaza with an optional accompanying video
- Accepted IEEE RA-L papers can be transferred for presentation at ICRA
- CORE A* and CCF B
