notes:
- Annual conference of the German Informatics Society (GI) software engineering division, held since 2005 (earlier
  as GI Softwaretechnik conference); the main meeting of the German-speaking software engineering community
- Run with the Swiss Informatics Society (SI) and the Austrian Computer Society (OCG)
- "Main scientific track is a presentation track: authors present full peer-reviewed papers already accepted or published at a top international venue"
- Submissions are a 2-page summary in LNI format (German or English) plus the original paper; only the summaries appear
  in the proceedings, so the main track is not a new formal publication
- Proceedings and companion proceedings (workshop papers) are published in the GI Digital Library; SE 2025 appeared as
  LNI volume P-360
- Week also includes workshops, an industry day, a student research competition, the GI Softwaretechnik award and the
  SE dissertation award
- Held in Germany, Austria or Switzerland (Linz 2024, Karlsruhe 2025, Bern 2026, Dortmund 2027)
- Not ranked in ICORE2026; not on the CCF 2026 list
