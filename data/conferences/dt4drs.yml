notes:
- Workshop of the IEEE/IFIP International Conference on Dependable Systems and Networks (DSN); held with DSN in
  Naples 2025 and Charlotte 2026
- Accepted papers published in the DSN-W supplement to the DSN proceedings in IEEE Xplore
- Regular papers up to 8 pages and short papers up to 4 pages, IEEE two-column format, double-blind review with at
  least three reviewers, submission via the DSN EasyChair
- Followed by a journal special issue open to extended workshop papers and new submissions
- In 2026 it ran as a joint half-day session with the DSAS workshop
- Not listed in CORE ICORE2026 or the CCF list
