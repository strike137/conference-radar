notes:
- Canadian computing and software conference (36th edition in 2026); now co-sponsored by IEEE Computer Society and
  CS-CAN/INFO-CAN with proceedings in IEEE Xplore
- Held at York University (Keele campus), Toronto, Canada in 2025 and 2026
- Broad topics including generative AI, cloud and edge, HPC, quantum computing and software engineering
- Regular papers up to 10 pages, short and industrial papers up to 6 pages (IEEE format, references included);
  double-anonymous review
- Program includes tutorials, workshops, posters and the co-located CSER meeting on the first day
- Not listed in CORE ICORE2026
