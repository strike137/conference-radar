notes:
- Annual since 2020 on AI in medicine and healthcare (diagnosis, medical imaging, biomedical informatics, medical devices, health data)
- AEIC Academic Exchange Center co-organized the 2023 edition; Zhisheng Huang of Vrije Universiteit Amsterdam is a long-running chair
- Mostly in China (Zhengzhou 2021, Chengdu 2023, Wuhan 2025, Shanghai 2026); online 2020 and 2022, Amsterdam 2024
- All editions published in ACM ICPS (ACM DL), indexed by EI Compendex and Scopus
- Presenter (abstract only) and listener registration are also offered
- Not listed in CORE ICORE2026
