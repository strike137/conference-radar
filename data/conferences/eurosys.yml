notes:
- Annual flagship conference of EuroSys, the European chapter of ACM SIGOPS; 2026 was the 21st edition
- Broad computer systems scope (operating systems, distributed, cloud, storage, networked, ML systems, systems security)
- Two submission cycles per year (Spring in May, Fall in September); accepted papers from both appear at the same conference
- One-shot revise-and-resubmit option to the next cycle; a rejected paper must skip the immediately following cycle
- 'Double-blind review, 12 pages of technical content excluding references, author response, optional artifact evaluation'
- Proceedings in the ACM Digital Library (ACM Open Access, APC may apply); co-located workshops and tutorials on the first day
- Usually held in Europe in spring (Athens 2024, Rotterdam 2025, Edinburgh 2026); 2027 goes to Rabat, Morocco
- Regarded as a leading systems venue just below OSDI and SOSP (ICORE2026 A, CCF A)
