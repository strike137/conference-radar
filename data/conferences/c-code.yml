organizer: Faculty of Engineering Sciences, Bahria University Islamabad
organizer_country: [other]
proceedings: IEEE Xplore
fee: 150 USD non-IEEE / 100 USD IEEE member author (2025, international); local authors 12,000 / 10,000 PKR
typical:
  deadline_months: [7]
  conference_months: [10]
links:
  website: https://ccode.bahria.edu.pk/
notes:
- Run by the Faculty of Engineering Sciences, Bahria University Islamabad, Pakistan; the 2025 edition was held on the
  Bahria University Islamabad campus
- Editions so far in March 2017, March 2019, May 2023 and October 2025 (4th edition), all in Islamabad; irregular
  schedule and month
- Technically co-sponsored by IEEE Islamabad (2025); all four editions have proceedings in IEEE Xplore
- Broad scope in four tracks (communication and networking, computing, digital systems and signal processing,
  intelligent and creative systems)
- Peer reviewed, 6 pages max in IEEE two-column format, submission via Microsoft CMT; also has a PhD symposium
- At least one author per accepted paper must register to have the paper published
- Not listed in ICORE2026
