notes:
- IEEE RAS sponsored conference on the social impact of robotics (HRI, safety standards, ethics and law, robots in work, healthcare, service and education)
- 2026 is the 22nd edition, hosted by TU Wien in Vienna
- Regular papers 4 to 6 pages, published in IEEE Xplore and indexed by EI; position papers 2 to 4 pages go into the proceedings but not IEEE Xplore
- Double-blind review; submission via PaperPlaza; camera-ready up to 8 pages with extra page charges
- Not listed in CORE ICORE2026 and not on the CCF 2026 list
