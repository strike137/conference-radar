notes:
- National computer science congress of RedUNCI, the network of Argentine national universities with informatics programs, held every year since 1995
- Organized as a set of thematic workshops; papers are reviewed by researchers from Argentina and abroad
- Full papers up to 10 pages in Spanish, English or Portuguese; short papers (3 to 5 pages, in Spanish) for ongoing research and student work
- All accepted papers appear in the congress proceedings with ISBN and in the SEDICI repository of the Universidad Nacional de La Plata
- Revised selected papers are published afterwards in Springer CCIS as "Computer Science - CACIC <year>"
- Hosted by a different Argentine university each year (Luján 2023, La Plata 2024, Río Negro 2025, Concepción del Uruguay 2026)
- Runs together with a school of short courses (Escuela CACIC)
- Not listed in CORE ICORE2026
