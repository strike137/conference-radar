notes:
- Taiwanese edition of IEEE ICCE, supported by IEEE Consumer Technology Society; held every summer in Taiwan since
  2014
- Only 2-page papers, single-blind review; IEEE Xplore proceedings
- City changes each year (2025 Kaohsiung, 2026 Taoyuan)
- Low barrier venue with frequent deadline extensions; one author registration covers up to 2 papers
- Final papers must have a similarity score below 33% or they are withdrawn
