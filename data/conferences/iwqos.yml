notes:
- Long-running QoS venue (since 1993, originally the International Workshop on Quality of Service); CORE B and CCF
  B
- Double-blind review, 10-page limit including references; abstract deadline one week before the full paper deadline,
  usually in February
- Location rotates globally with frequent Asia-Pacific editions (2024 Guangzhou, 2025 Gold Coast); 2026 was moved
  from Dubai to Istanbul
- Has workshops and a poster track in addition to the main symposium
