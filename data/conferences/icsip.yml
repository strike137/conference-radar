links:
  website: https://www.icsip.org/
notes:
- Smaller commercially organized conference, hosted by universities in Jiangsu, China
- Not the same as IEEE ICSIPA (Malaysia)
- Past proceedings (2016 to 2026) in IEEE Xplore, listed as indexed in Ei Compendex and Scopus; the 2027 page does
  not name the publisher yet
- Held in China in July (Nanjing 2021, Suzhou 2022, Wuxi 2023, Nanjing 2024, Wuxi 2025, Changzhou 2026, Nantong 2027)
- Papers up to 5 pages, extra pages 70 USD each
- Not listed in the CORE portal (ICORE2026)
