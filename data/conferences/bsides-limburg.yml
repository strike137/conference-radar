notes:
- Community-driven Security BSides conference in Hasselt, Belgium, held every year since 2025
- One day at Corda Campus, Hasselt, with two talk tracks and a CTF competition
- Talks are in English
- Non-profit event with paid tickets (to reduce no-shows); surplus goes to future editions or charity
- Talk submissions handled on pretalx
- No proceedings
