notes:
- Mobile developer conference in Nairobi, described as the largest Droidcon chapter in Sub-Saharan Africa
- Part of the global Droidcon family (next.app devCon); held together with Fluttercon Kenya under one ticket
- Started in 2018 from the Android254 and Kotlin Kenya communities; 2026 was the 7th edition
- 2025 had 198 professional attendees and 26 Android sessions selected from 89 submissions
- Sessions and workshops chosen from a call for sessions; talks only, no papers or proceedings
