notes:
- One-day affiliated workshop of ASIACRYPT 2025 that bridges lattice coding in communications and lattice-based cryptography
- Invited talks, tutorials and contributed presentations on lattice codes, ciphertext compression and error correction in cryptographic schemes
- Contributed talks of about 30 minutes, proposed with an abstract of up to 3 pages sent by email
- Presentations may be based on published work, work in progress or non-publishable ideas, so it is non-archival
- Held at Monash College in Melbourne in 2025; not among the ASIACRYPT 2026 affiliated events
- Not listed in ICORE2026
