id: p13n
name: P13N
full_name: Personalization in Generative AI Workshop
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: Organizing team led by Virginia Tech (Pinar Yanardag) with Tel Aviv University, Snap, UIUC, ETH Zurich and CMU
organizer_country: [international]
proceedings: CVF Open Access (CVPR / ICCV Workshops proceedings)
archival: true
typical:
  deadline_months: [3, 7]
  conference_months: [6, 10]
links:
  website: https://p13n-workshop.github.io/
notes:
- Workshop on personalization of generative models (subject-driven image and video generation, multi-concept
  composition, evaluation, privacy)
- Held with ICCV 2025 (Honolulu, full day) and CVPR 2026 (Denver, half day)
- 8-page long papers are archival and go into the workshop proceedings; 4-page short papers are non-archival and
  have a later deadline
- Double-blind review
- Runs a personalization challenge alongside the paper track
- 7 papers on CVF Open Access for CVPR 2026, 9 for ICCV 2025
- Not listed in ICORE2026 or the CCF list
