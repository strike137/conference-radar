notes:
- Security BSides conference in Birmingham, Alabama, USA
- The 2026 edition is held at the UAB Hill Student Center (University of Alabama at Birmingham)
- The 2024 edition was a one-day event on 2024-10-12 with one talk track and a CTF
- Talk proposals go through pretalx; non-technical talks are welcome and pure vendor pitches are rejected
- Speaker travel is not covered; talks only, no proceedings
- Updates are posted mainly on its Linktree and social media; the website is not updated often
