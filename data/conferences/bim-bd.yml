id: bim-bd
name: BIM
full_name: International Conference on Big Data, IoT and Machine Learning
type: conference
tier: minor
areas: [ai, data, networking]
region: south-asia
language: english
frequency: biennial
organizer: Dhaka International University (Departments of CSE and EEE), Center for Intelligent Computing and Bangladesh Computer
  Society
organizer_country: [other]
proceedings: Springer LNNS or Taylor & Francis Books (2025)
archival: true
fee: "General authors: 400 USD foreign / 10,500 BDT local (non IEEE CS member), 350 USD / 9,500 BDT IEEE CS members (2025)"
typical:
  deadline_months: [7]
  conference_months: [9]
links:
  website: https://confbim.com/
notes:
- Held every two years (2021, 2023, 2025); the 2025 edition was organized by the CSE and EEE departments of Dhaka International
  University with the Center for Intelligent Computing and the Bangladesh Computer Society
- BIM 2025 was held at Dhaka International University, Dhaka, Bangladesh
- The site says accepted and presented papers are considered for Springer Lecture Notes in Networks and Systems or Taylor &
  Francis books, indexed in Scopus and DBLP
- Double-blind review via Microsoft CMT; papers up to 15 pages in Springer format; similarity index must stay under 15%
- Five tracks in 2025 covering data science, machine learning, IoT and smart infrastructure, green computing, and computational
  engineering
- Discounted fee for one additional paper by the same author; deadlines are usually extended (2025 final extension to 2025-07-25)
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
