notes:
- Workshop on language, speech and multimodal data from people with conditions such as aphasia, dementia, autism, Parkinson's disease or schizophrenia
- Held with LREC every two years since 2016 (Portoroz 2016, Miyazaki 2018, Marseille 2020 and 2022, Turin 2024, Palma 2026)
- 2026 edition run as RaPID-6@MENTAL.ai together with the MENTAL.ai project; half-day, hybrid
- Papers of 4 to 8 pages in LREC format, double-blind review by at least three PC members
- Proceedings in the LREC workshop proceedings and the ACL Anthology
- Not listed in ICORE2026 and not on the CCF list
