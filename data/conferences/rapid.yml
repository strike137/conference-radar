notes:
- Workshop on language and multimodal data from people with mental, cognitive, neuropsychiatric or neurodegenerative impairments (aphasia, dementia, autism, Parkinson's disease and others)
- Co-located with LREC every two years; RaPID-1 2016 Portoroz, RaPID-2 2018 Miyazaki, RaPID-3 2020 Marseille, RaPID-4 2022 Marseille, RaPID-5 2024 Turin, RaPID-6 2026 Palma
- 2026 edition held jointly with MENTAL.ai as a half-day hybrid workshop
- 4-8 pages of content in the LREC style; double-blind review by at least three PC members; submission via Softconf
- No extensions beyond the stated full paper deadline
- Not listed in CORE ICORE2026 and not on the CCF list
