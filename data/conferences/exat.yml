notes:
- Biennial symposium of the IEICE-CS EXAT technical committee, cosponsored by NICT; focus on space-division
  multiplexing (multi-core, multi-mode, hollow-core fibers), wideband transmission and optical nodes
- Oral program is entirely keynote and invited talks; contributed work is presented as posters from an abstract
  submission, with a Best Poster Award
- Proceedings (accepted abstracts) are a password-protected PDF for participants only, so non-archival
- Always held in Japan (Kyoto 2015, Nara 2017, Ise 2019, online 2021, Matsue 2023, Himeji 2025, Hakodate 2027)
- EXAT 2025 had over 100 participants
- The committee's domestic study meetings (kenkyukai) listed on the IEICE EXAT page are separate and not covered
