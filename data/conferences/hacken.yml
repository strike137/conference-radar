notes:
- National-scope cybersecurity congress in Jaen, Andalusia, Spain, run by a volunteer non-profit association
- Two days of technical talks and hands-on workshops plus a CTF; website and programme in Spanish
- First edition 2023 in Linares, later editions at IFEJA (Palacio de Ferias y Congresos) in Jaen
- About 300 attendees and 20 to 30 speakers; tickets from 30 EUR (2027)
- No proceedings
- Not listed in CORE ICORE2026 and not on the CCF list
