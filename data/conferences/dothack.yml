notes:
- Hacker and security practitioner conference in Seoul, run by the non-profit Project Plasma; editions in 2024, 2025
  and 2026
- Held at COEX Conference Room South (4F), Seoul
- Open call for speakers on Sessionize with two tracks, Tech and Lessons Learned (40 min talk plus 10 min Q&A); the
  2026 program also had Junior, Web3 and CISO tracks
- Talks in Korean or English, Korean recommended because there is no simultaneous interpretation; speakers get a
  small honorarium
- Hosts the Dreamhack Invitational CTF final (online qualifier in January, top 20 plus top 10 of the Dreamhack CTF
  season ranking go to the on-site final; top prize 5,000,000 KRW sponsored by Dunamu)
- Sessions are not streamed online; industry event with no papers or proceedings
- Not listed in the CORE portal (ICORE2026)
