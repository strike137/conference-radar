notes:
- Workshop on computational argumentation, run since 2017 and mostly co-located with AIxIA (with ICLP in 2025)
- Always held in Italy (Milan 2021, Udine 2022, Rome 2023, Bozen 2024, Rende 2025, Perugia 2026)
- Proceedings in CEUR-WS every year since 2017 (2025 -> Vol-4025)
- Full papers (15 pages, may include work submitted elsewhere), short papers (5 pages) and project overviews (3 pages), CEUR-ART format
- Attendees and at least one author per paper must register for AIxIA
- Not listed in ICORE2026 and not on the CCF list
