notes:
- Co-located workshop of ICCCN (International Conference on Computer Communications and Networks), held in 2025 and 2026
- Has no official acronym; the 2025 site calls it QML@ICCCN2025
- Topics are quantum machine learning for network optimization, security, IoT and edge computing, distributed and federated QML
- 6-page papers in IEEE double-column format; accepted and presented papers appear in the ICCCN proceedings and IEEE Xplore
- One author must register at the full rate and present in person
- Distinct from QML-NGN, the quantum machine learning workshop at IEEE GLOBECOM
- Not listed in ICORE2026
