notes:
- Annual since 2001; proceedings in Springer LNCS (Procedia Computer Science from 2010 to 2017)
- Held mostly in Europe (Krakow 2021, London 2022, Prague 2023, Malaga 2024, Hamburg 2026, Krakow 2027); Singapore in
  2025
- Main track plus about 20 thematic Workshops on Computational Science, all submitted via EasyChair; main track and
  workshops get separate LNCS volumes (six volumes in 2026)
- Full papers 12 to 15 pages and short papers 6 to 8 pages (both in LNCS); an abstract only option is presented but not
  published
- Best papers are invited to a special issue of the Journal of Computational Science
- Broad scope covering scientific computing, HPC, simulation, complex systems, AI for science and quantum computing
- Listed as a Multiconference in CORE ICORE2026
- Beware of a fake ICCS run by WASET; the real one is at iccs-meeting.org
