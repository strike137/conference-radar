notes:
- Main specialist venue for rendering research (global illumination, Monte Carlo methods, real-time and neural rendering, appearance), run by Eurographics since the Eurographics Workshop on Rendering began in 1990
- Accepted research papers are archived in the Eurographics Digital Library; reviewers decide per paper whether it becomes a journal paper in Computer Graphics Forum or a conference paper
- At least four reviews per research paper, with a rebuttal phase; separate curated Industry/Positions papers track
- Held in Europe (Delft 2023, London 2024, Copenhagen 2025, Bordeaux 2026, Lugano 2027)
- Often co-located with High-Performance Graphics (Delft 2023, Copenhagen 2025, Lugano 2027)
- Not listed in ICORE2026; CCF B (computer graphics and multimedia)
- The domain egsr.eu is not the conference site; each edition has its own site linked from eg.org
