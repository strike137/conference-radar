notes:
- Large HCI conference founded in 1984 by Gavriel Salvendy; annual since 2013, 29th edition in 2027
- Runs about 20 thematic areas and affiliated conferences (HCI-CPT for security and privacy, AI-HCI, VAMR, DUXU, ...) under one registration
- Two-stage process; an 800-word proposal is reviewed (single-blind, at least two referees), then the full paper (10 to 20 pages) is due after acceptance
- Papers in Springer LNCS and LNAI; poster extended abstracts in Springer CCIS
- On-site with an option for online participation; one registration per accepted paper
- Held in Copenhagen 2023, Washington DC 2024, Gothenburg 2025, Montreal 2026, Berlin 2027
- Not listed in CORE ICORE2026 or on the CCF list
