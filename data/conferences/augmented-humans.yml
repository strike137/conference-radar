notes:
- HCI conference on physical, cognitive and perceptual augmentation of humans (wearables, haptics, XR, brain machine
  interfaces, exoskeletons, human AI symbiosis); called Augmented Human (AH) until 2019
- Proceedings in the ACM International Conference Proceedings Series (ICPS) in the ACM DL
- Full papers up to 16 pages and short papers up to 8 pages (single column, excluding references); double-blind review
- Posters and demos (up to 4 pages) also appear in the ACM DL
- Usually held in March (April in 2024); rotates worldwide (Glasgow 2023, Melbourne 2024, Abu Dhabi 2025, Okinawa 2026, Colombo 2027)
- In-person presentation by at least one author is required
- Not listed in CORE ICORE2026 or the CCF 2026 list
