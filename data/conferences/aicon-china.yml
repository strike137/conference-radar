id: aicon-china
name: AICon
full_name: AICon Global AI Development and Application Conference
name_local: AICon 全球人工智能开发与应用大会
type: industry
tier: domestic
areas: [ai, nlp, software, systems]
region: china
language: chinese
frequency: multiple-per-year
organizer: InfoQ China (Geekbang Technology)
organizer_country: [china]
proceedings: None (talks only; slides posted for download)
archival: false
fee: 5,800 CNY full price, 4,640 CNY early bird until 2026-11-13 (2026 Beijing); full-time students half price
typical:
  conference_months: [6, 8, 12]
links:
  website: https://aicon.infoq.cn/
notes:
- AI and large model practitioner conference run by InfoQ China, part of Geekbang Technology, the organizer of QCon
  China and ArchSummit
- Several city editions per year (2025 Shanghai, Beijing, Shenzhen; 2026 Shanghai, Shenzhen, Beijing)
- Tracks on LLM training and inference, AI agents, agent security and evaluation, AI infrastructure and AI in
  software engineering
- Invited and proposed talks by industry engineers; talk proposals through the site; no paper submission and no
  proceedings
- Not in the CORE ICORE2026 portal or the CCF 2026 list
