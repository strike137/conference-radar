notes:
- Formal methods and software engineering conference series running since 1997, with an international steering committee
- Proceedings in Springer LNCS (ICFEM 2025 -> LNCS 16229); full papers up to 16 pages in LNCS format, excluding references and appendix
- Single-blind review by at least three reviewers; selected papers invited to a Formal Aspects of Computing special issue
- 'Recent hosts: Madrid (2022), Brisbane (2023), Hiroshima (2024), Hangzhou (2025), Southampton (2026)'
- Deadlines were extended by about two weeks in both 2025 and 2026
- Co-located workshops (FMAS in 2026); CORE C, CCF C
