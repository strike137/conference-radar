notes:
- Long-running European conference on content-based multimedia indexing, retrieval and analytics (22 editions before 2026)
- CORE C (ICORE2026)
- Full papers 6 pages and short papers 4 pages, plus up to 2 pages of references; double-blind review
- Proceedings published by IEEE; selected papers invited to a journal special issue
- On-site only; every paper needs one full registration
- Always held in Europe (Dublin 2025, Reykjavik 2024, Orleans 2023, Toulouse 2026)
