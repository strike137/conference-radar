notes:
- International Swift and Apple platform developer conference in Tokyo with speakers and attendees from around the
  world
- Held 2016 to 2019 and since 2024 (2020 edition cancelled); Shibuya Stream Hall 2024, Tachikawa Stage Garden 2025 to
  2027
- One workshop day plus two single-track conference days
- Talks (20 minutes, lightning talks of 5 minutes) and workshops chosen from an open call for proposals; proposals in
  English or Japanese
- Japanese and English are the main languages; AI-powered multilingual simultaneous interpretation for all talks
- Speakers get a free ticket, speaker dinner and talk video recording
- No papers or proceedings; talks only
