notes:
- Ukrainian cybersecurity workshop run by Lviv Polytechnic National University, with editors from Poland, Germany and the UK
- Held in Lviv since 2024 (June 30, 2024; July 31, 2025; May 7, 2026)
- Proceedings in CEUR-WS (Vol-3800 for 2024, Vol-4042 for 2025, Vol-4223 for 2026); indexed in Scopus and DBLP
- "Acceptance: 24 of 62 submissions (2026), 25 of 54 (2025)"
- Double-blind review; papers submitted by email in the CEURART one-column template
- No registration fee
