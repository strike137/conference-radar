notes:
- Co-located workshop that moves between IEEE host conferences (NetSoft 2022, ICC 2023 to 2025, NetSoft 2026)
- 1st edition in 2022 was titled Workshop on Network Energy Efficiency in the Softwarization Era
- 2026 papers went into the IEEE NetSoft 2026 Proceedings and were submitted to IEEE Xplore
- Papers up to 7 pages in IEEE 2-column format, submitted through EDAS
- Best workshop paper award sponsored by the SUSTAINET Advance project (CELTIC-NEXT)
- Not listed in CORE ICORE2026 or the CCF list
