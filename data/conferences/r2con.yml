notes:
- Community conference around radare2, the open-source reverse engineering framework; first held in 2016
- In-person editions at Barcelona (2016 to 2019, and 2024 at UPC Edifici Vertex); 2020, 2021 and 2025 held online
- No editions in 2022 and 2023
- Talks and trainings on reverse engineering, malware analysis, binary analysis and the radare2 tool ecosystem
- No proceedings; slides and video recordings published on the website and YouTube
- Low cost; the 2020 online edition was free and 2019 regular conference tickets were 60 EUR
- Not listed in CORE ICORE2026
