notes:
- Held 2018 to 2023 (Charleston USA 2018, Taichung 2019, online 2020 and 2021, Shanghai online 2022 and 2023), then no edition in 2024 or 2025; 7th edition in Guiyang in September 2026
- Proceedings in ACM ICPS for 2018 to 2021 and IEEE Xplore for 2022 and 2023, all indexed in EI Compendex and Scopus per the site
- 2026 edition sponsored by Guizhou Normal University and listed in the IEEE conference list; accepted papers go to IEEE conference proceedings
- Bilingual Chinese and English site; submission through EasyChair; full papers 5 to 10 pages, abstract-only presentation option without publication
- Not listed in CORE ICORE2026 or the CCF 2026 list
