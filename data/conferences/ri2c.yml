id: ri2c
name: RI2C
full_name: Research, Invention, and Innovation Congress
type: conference
tier: minor
areas: [general, communications]
region: southeast-asia
language: english
frequency: annual
organizer: King Mongkut's University of Technology North Bangkok (KMUTNB), with IEEE Thailand Section (AP/MTT Joint
  Chapter) and ECTI Association
organizer_country: [thailand]
proceedings: IEEE Xplore (Innovative Electricals and Electronics track); E3S Web of Conferences and Materials Science
  Forum for the other tracks
archival: true
typical:
  deadline_months: [4, 5]
  conference_months: [7, 8]
links:
  website: https://www.ri2c-kmutnb.com/
notes:
- Run by KMUTNB with the IEEE Thailand Section and the ECTI Association; 7th edition in 2026
- Held in or near Bangkok (Bangkok 2024 and 2025, Nonthaburi 2026); 2021 to 2023 were virtual; no 2020 edition
- Multidisciplinary congress with three tracks; only the Innovative Electricals and Electronics (iEE) track (computing,
  communication systems, circuits, control, power) is in EECS scope
- iEE full papers go to IEEE Xplore (2023, 2024 and 2025 volumes listed on the site); sustainable science papers go
  to E3S Web of Conferences, materials papers to Materials Science Forum and similar series
- Abstract-only submissions appear only in the e-abstract book; full papers must be presented in person
- About 120 submissions per year from 13 to 17 countries (2024, 2025); mostly Thai authors
