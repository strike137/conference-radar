notes:
- Long-running information systems conference (since 1968); held every January in Hawaii, venue rotating among islands
- Double-blind review; papers up to 10 pages including references; each author limited to 5 submissions; conditional
  accept with a revision round
- Organized in tracks and minitracks; security papers go to minitracks such as AI-Powered Cyber Attacks and Countermeasures
  in the Software Technology track
- Open-access proceedings via ScholarSpace since HICSS-50, also in the AIS eLibrary; many minitracks offer journal
  fast-track
- Ranked A in CORE2018 but not listed in later CORE editions; not in the CCF list
