notes:
- Young annual conference (since 2024) on parsimonious, low-dimensional structures in machine learning and signal
  processing
- Proceedings Track papers (up to 9 pages) are published in PMLR (2026 -> vol. 328, 54 papers); double-blind
  review on OpenReview
- Recent Spotlight Track is single-blind and non-archival
- At least one author must present in person
- Moves around the world (Hong Kong 2024, Stanford 2025, Tubingen 2026, Tokyo 2027); not listed in CORE ICORE2026
