notes:
- Workshop co-located with IEEE GLOBECOM; first edition at GLOBECOM 2021, third edition in Taipei (2025)
- Co-chairs from Auburn University, IIT Kharagpur, IIT Indore and IIT Patna
- Topics include softwarization, slicing and NFV for IoT services, edge and fog orchestration, ICN and SCN, smart
  grid and vehicular IoT, and semantic communication
- Accepted and presented papers go into the IEEE GLOBECOM workshop proceedings in IEEE Xplore; no-show papers
  can be removed
- Workshop papers up to 6 pages; submissions via EDAS through the GLOBECOM workshop call
- Not in the IEEE GLOBECOM 2026 workshop list (checked 2026-10-17)
- Not listed in ICORE2026
