notes:
- National conference of CSIG on affective computing and emotional intelligence, run by its Affective Computing and Understanding committee
- Long papers (English only, 12 to 15 pages) published in Springer CCIS 'Emotional Intelligence', EI indexed; research abstracts in Chinese or English are not published
- CEI 2025 (3rd edition) held in Shenzhen, organised by Harbin Institute of Technology (Shenzhen)
- Programme of keynotes, tutorials, special sessions, posters and industry talks
- Submissions via Microsoft CMT
- Not listed in ICORE2026
