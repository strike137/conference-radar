notes:
- Half-day workshop at ACM RecSys on data quality in multimodal recommender systems
- First edition at RecSys 2025 in Prague, second at RecSys 2026 in Minneapolis
- Accepted long, short and position papers are published in CEUR Workshop Proceedings (2026 call)
- Long papers up to 12 pages, short up to 6, position papers up to 4 (excluding references), CEUR single-column format
- Double-blind review via EasyChair; at least one author of each accepted paper must register and attend
- Not listed in the CORE ICORE2026 portal
