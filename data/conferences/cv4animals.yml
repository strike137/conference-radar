links:
  website: https://www.cv4animals.com/
notes:
- Workshop co-located with CVPR every year since 2021
- Non-archival; accepted papers are presented as posters or orals but not published in proceedings
- "Two tracks: 4-page unpublished work (double-blind, OpenReview) and already published work from the last 2 years (Google Form)"
- Outstanding track 1 papers are invited to extend their work for an IJCV special issue on computer vision for animal tracking and modeling
- Some free CVPR registrations for outstanding papers, funded by sponsors
- Not listed in ICORE2026 or the CCF list
