organizer: Rotating international organizing team with an advising team (Sara Beery, Angjoo Kanazawa, Hyun Soo Park, Silvia Zuffi and others)
organizer_country: [international]
proceedings: None
archival: false
typical:
  deadline_months: [3, 4]
