links:
  website: https://www.ares-conference.eu/strai
notes:
- Workshop of ARES (International Conference on Availability, Reliability and Security), held in Europe every summer;
  1st edition at ARES 2025 (Ghent), 2nd at ARES 2026 (Linköping)
- Submission guidelines are the same as for the ARES conference; ARES and its workshop papers are published in
  Springer LNCS since 2025
- Topics span AI security and privacy, adversarial examples and data poisoning, explainability, fairness, governance
  and human-AI trust
- Chairs from NTNU (Norway) and Chemnitz University of Technology (Germany); linked to the EU ENFIELD project
- 'Small workshop: one 90-minute session with 4 papers in 2025'
- Not listed in CORE ICORE2026
