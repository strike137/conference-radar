notes:
- Annual IPSJ symposium on interaction and HCI, co-hosted by five IPSJ SIGs (HCI, CN, UBI, EC, DCC); 2027 is the
  31st edition
- Oral papers (6 to 10 pages) are peer reviewed, with acceptance by shepherding possible; demos and posters (2 to 6
  pages) are scored and limited by venue space
- Oral and interactive papers go into the electronic proceedings, with web proceedings archived on the site back to
  1997; copyright goes to IPSJ
- Outstanding papers are recommended to the IPSJ journal
- Large domestic event (891 participants in 2024, 831 in 2025)
