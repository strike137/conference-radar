notes:
- National application security conference of the OWASP German Chapter; held since 2017, resumed in 2023 after a pause
- Held in a different German city each year (Frankfurt 2023, Leipzig 2024, Dusseldorf 2025, Karlsruhe 2026)
- One conference day with two talk tracks, preceded by a day of trainings and an evening event
- Aimed at a German-speaking audience; English talks are possible
- Open call for presentations and call for community trainings; no proceedings, talk recordings published on media.ccc.de
- Not listed in CORE ICORE2026
