notes:
- Organized by IEEE EPS (formerly CPMT) since 2006 in cooperation with IMAPS Europe; the European counterpart of ECTC (USA) and EPTC (Singapore)
- Biennial, held in even years in Europe; IMAPS Europe runs EMPC in the odd years
- Covers advanced packaging, 3D and heterogeneous integration, interconnect materials, photonics packaging, power electronics packaging, modelling and reliability
- Two-step submission; an abstract is selected first, then a full paper follows; one author per paper registers at the author rate
- Accepted papers are published in the conference proceedings and archived in IEEE Xplore
- "2026 (11th, Finlandia Hall, Helsinki): 470 participants from 31 countries, 107 oral and 80 poster presentations, about half from industry"
- "Fee 2026: 970 EUR early bird for presenting authors and IEEE/IMAPS members, 500 EUR for Bachelor and Master students"
- Not listed in ICORE2026 or the CCF list, whose lists cover computing venues
