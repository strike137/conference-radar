notes:
- Two co-located Euromicro conferences with one registration site and venue; Euromicro is based in Hengelo, Netherlands
- 'DSD: digital and mixed HW/SW system design, embedded and cyber-physical systems, FPGAs, RISC-V, hardware security; 8 pages IEEE format, double-blind; proceedings by IEEE CPS'
- 'SEAA: software engineering for software-intensive systems in themed tracks (CPS, data and AI driven engineering, model-driven engineering, ...); up to 16 pages in Springer LNCS, single-blind'
- Ranks differ by conference; CORE B for SEAA and CORE C for DSD (ICORE2026); the B shown here is SEAA's
- Selected DSD papers are invited to the Elsevier journal MICPRO, selected SEAA papers to the Journal of Systems and Software
- Strict no-show policy; extra DSD pages cost 80 EUR each
- Held in Europe every late August or early September (Durres 2023, Paris 2024, Salerno 2025, Krakow 2026)
