id: ssr
name: SSR
full_name: Security Standardisation Research Conference
type: conference
tier: minor
areas: [security, crypto]
region: worldwide
language: english
frequency: annual
organizer: SSR steering committee (Liqun Chen, Shin'ichiro Matsuo, Thyla van der Merwe, Chris Mitchell, Bart Preneel)
  with a different host institution each year (2025 University of Passau, 2026 UMBC, 2027 FBK Trento)
organizer_country: [international]
proceedings: Springer LNCS
indexing: [DBLP, Scopus]
fee: 700 USD early, 800 USD regular, 900 USD late; 50% off for students and remote participants (2026)
typical:
  deadline_months: [9, 10]
  conference_months: [12]
links:
  website: https://ssresearch26.umbc.edu/
notes:
- Series launched in 2014 by the SSR steering committee; series home page at ssresearch.eu
- Focus on research around security standards (ISO/IEC, NIST, IETF, ITU-T, payments and telecom industry standards)
- Proceedings in Springer LNCS (2023 volume 13895, 2024 volume 15559, 2025 volume 16466); 2019 in ACM DL and 2022
  in an IEEE EuroS&P companion volume
- Regular, SoK and Vision papers; double-blind review in 2026, up to 23 pages in LNCS format
- Small venue (10 accepted papers in 2025); no edition in 2017 and 2021
- Host rotates; often co-located with a larger event (ACM CCS 2019, EuroS&P 2022, Eurocrypt 2023, Inscrypt 2024)
- 2026 edition at UMBC, Baltimore with co-located Protocol Analysis and Post-Quantum Cryptography for Blockchains
  workshops; 2027 edition announced for Trento, Italy
