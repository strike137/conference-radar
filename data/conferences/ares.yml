notes:
- Organized by SBA Research (Austria); held every year in a European city, usually in August
- Proceedings in Springer LNCS since 2025 (ACM ICPS from 2017 to 2024, IEEE CPS before that)
- Regarded as a solid mid-tier security venue (CORE B); full-paper acceptance rate around 20% for years
- Double-blind review; full and SoK papers up to 22 pages, short papers up to 11 pages (LNCS, including references)
- Many co-located workshops plus an EU Projects Symposium; abstract registration one week before the paper deadline,
  and the 2026 deadline was announced as no extension
