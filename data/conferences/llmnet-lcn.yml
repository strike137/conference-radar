notes:
- Special track of the IEEE Conference on Local Computer Networks (LCN) on large language models for and in networking
- First held at LCN 2025 (Sydney), second at LCN 2026 (Coimbra)
- Accepted papers appear in the IEEE LCN Companion Proceedings in IEEE Xplore
- Papers up to 6 pages excluding references in two-column IEEE format, double-blind review, submission via EDAS
- One author of each accepted paper must register and present; the LCN no-show policy applies
- 2026 program had six papers, an invited talk and a community discussion
- Location follows LCN
- Not listed in CORE ICORE2026 and not on the CCF 2026 list
