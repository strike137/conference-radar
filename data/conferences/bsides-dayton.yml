notes:
- Community-driven Security BSides conference for the Dayton, Ohio area, run independently by local volunteers
- First held in 2019; editions in 2019, 2020 (virtual), 2022 (all in November) and 2026 (moved to May)
- One-day Saturday event at Fairborn City Church, Fairborn, Ohio, USA (2026 and 2027)
- Single main track of 45 minute talks plus 15 minutes Q&A, hands-on villages, a story-driven CTF and an after party
- Call for papers with rolling acceptance; speakers get a free ticket, T-shirt and gift
- About 100 attendees in 2026
- No proceedings
