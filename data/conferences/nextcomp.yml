notes:
- Run by the University of Mauritius and always held in Mauritius (2017, 2019, 2022, 2024, 2026); roughly every two years
- IEEE sponsorship approved for 2026; proceedings of the 2022 and 2024 editions are in IEEE Xplore
- "Four tracks in 2026: Intelligent Systems and Applications, ICT4D, Security and Communication Technologies, Fintech"
- Papers 6 pages, up to 8 pages with extra charge (75 USD per page); 2024 papers blind reviewed by 2-3 reviewers
- 2022 drew over 50 full-paper submissions
- 2026 deadline extended several times (CFP PDF first listed 2026-03-15)
- Not listed in CORE ICORE2026
