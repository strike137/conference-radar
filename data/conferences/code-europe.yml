notes:
- Practitioner conference for software engineers in Poland and Central and Eastern Europe, organized by Absolvent.pl (Warsaw) since 2016
- Editions held in Warsaw, Krakow and Tricity; 2026 was the 9th edition
- 2026 format was one online day followed by one on-site day at Stadion Legii, Warsaw, with about 1,372 participants
- The 2027 edition is branded Code Europe AI, moves to April and has six AI focused tracks
- Open call for speakers; headline speakers are invited directly
- No papers or proceedings; ticket holders get access to session recordings
