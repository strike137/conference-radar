id: dbtest
name: DBTest
full_name: International Workshop on Testing Database Systems
type: workshop
tier: minor
areas: [data, systems, software]
region: worldwide
language: english
frequency: biennial
organizer: DBTest steering committee; co-located with ACM SIGMOD/PODS
organizer_country: [international]
proceedings: ACM DL
archival: true
typical:
  deadline_months: [3]
  conference_months: [6]
links:
  website: https://dbtest-workshop.github.io/
notes:
- One-day workshop held with ACM SIGMOD/PODS, so it moves with SIGMOD (2024 Santiago, 2026 Bengaluru)
- Held every two years recently (2018, 2020, 2022, 2024, 2026)
- 'Scope: testing, benchmarking and reproducibility of database and data-intensive systems, including learned and cloud systems'
- Research or experience papers of 4 to 6 pages excluding references, ACM format, via HotCRP; 1-page talk proposals are also accepted
- Accepted research papers are published in the ACM Digital Library; talk proposals are listed on the website only
- Steering committee from TU Darmstadt, SAP and HPI
- 11th edition in 2026
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
