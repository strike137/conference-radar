notes:
- Workshop of SBBD (Brazilian Symposium on Databases) for papers that present and describe new datasets
- Papers of 6 to 10 pages plus up to 2 pages of acknowledgments and references, SBC format, submitted via JEMS
- Papers in Portuguese, English or Spanish; an English abstract is mandatory
- Proceedings published open access in SBC OpenLib with a DOI per paper (2026 volume ISBN 978-85-7669-399-4)
- Publication requires SBBD registration and an oral presentation
- Held on one day of the SBBD week (São Carlos 2026)
- Not listed in CORE ICORE2026
