notes:
- Community practitioner conference on the Go programming language, the Korean edition of the GopherCon family
- Run by the Golang Korea community; the site calls it the largest annual conference for Go users in South Korea
- 2025 was a one day event at COEX Magok, Le West Hall B, Seoul, with 400+ attendees expected and replays online
- Talks only, no papers or proceedings
