notes:
- IACR area conference on symmetric cryptology (block ciphers, hash functions, AEAD, cryptanalysis)
- 'Journal-conference hybrid: four ToSC deadlines a year with rebuttal and major-revision decisions; accepted papers
  must be presented at the corresponding FSE'
- Usually held in Europe, sometimes in Asia (Beijing 2023, Singapore 2026)
- FSE 2026 and 2027 PCs co-chaired by Yosuke Todo (NTT)
