notes:
- One-day international IT security conference at the Kursaal Bern, Switzerland; editions archived on the site since 2013
- Run by a non-profit that also runs the Swiss part of the European Cyber Security Challenge
- Curated programme of invited international speakers around a yearly theme (Shadow IT in 2026); no public call for papers found
- Audience from students to engineers, security officers and CISOs; includes an AI Village
- Paid tickets; no proceedings
