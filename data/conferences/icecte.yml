notes:
- Run by the Faculty of ECE at RUET (Rajshahi University of Engineering and Technology) and held on the RUET campus in
  Rajshahi, Bangladesh; technically co-sponsored by the IEEE Bangladesh Section
- Officially held once every two years, but recent gaps were longer (proceedings from 2016, 2019, 2022 and 2026); the
  2026 edition was the fifth
- Presented papers go to IEEE Xplore (2016, 2019, 2022 and 2026 proceedings are on IEEE Xplore); no-show papers are excluded
- Broad electrical, computer and telecommunication scope, from power and devices to AI, networking, security and
  wireless communications
- Anonymous submission via Microsoft CMT; 4 to 6 pages in IEEE double-column format
- 2026 edition was hybrid; foreign authors could present virtually, and international student authors could get a grant
  of up to 50 USD
- Not ranked in ICORE2026
