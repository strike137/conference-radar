links:
  website: https://ncvpripg25.github.io/ncvpripg25/
notes:
- Indian national computer vision, pattern recognition, image processing and graphics conference run with IUPRAI,
  hosted by a different Indian institute each time
- Editions in 2017 (Mandi), 2019 (Hubballi), 2023 (Jodhpur), 2024 (Thiruvananthapuram) and 2025 (Jammu); 10th edition
  in 2025
- Proceedings in Springer CCIS in 2025 (CCIS 2684 and 2685, revised selected papers); Springer LNEE in 2023
- The 2024 edition had no paper proceedings in a formal series; it ran a student research symposium (abstracts only),
  workshops, tutorials and challenges
- Papers 10 to 15 pages in Springer format, submitted via Microsoft CMT; extra pages charged
- Not listed in ICORE2026 or in the CCF list
