notes:
- One-day POPL workshop bringing programming-language and machine-learning researchers together on probabilistic and differentiable programming languages and inference
- Held with POPL every January; 2022 was the 7th edition, then Boston 2023, London 2024, Denver 2025, Rennes 2026 and Mexico City 2027
- Extended abstracts of 2 pages plus references and optional appendices, anonymized peer review, no required format (ACM template suggested)
- Informal and non-archival; presenting does not preclude later formal publication under the SIGPLAN republication policy
- Workshop aims to allow participation without travel
- 2027 organizers from the UK (Diffractive Labs / University of Oxford) and France (Inria, ENS)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
