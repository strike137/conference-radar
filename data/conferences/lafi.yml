notes:
- One-day workshop co-located with ACM POPL, moving with it each year
- Brings programming-language and machine-learning researchers together on probabilistic and differentiable programming languages and inference
- Submissions are anonymized extended abstracts of 2 pages plus references and optional appendices
- Informal workshop; proceedings are not a formal or archival publication, so later publication elsewhere is allowed
- Does not demand travel for presenters or participants
- Not listed in the CORE ICORE2026 portal or the CCF list
