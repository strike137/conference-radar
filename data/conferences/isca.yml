notes:
- Flagship computer architecture venue, first held in 1973; technical sponsors ACM SIGARCH and IEEE CS TCCA
- Regarded as a top venue (ICORE2026 A*, CCF A)
- Held every June, mostly in the USA with some editions abroad (Orlando 2023, Buenos Aires 2024, Tokyo 2025, Raleigh 2026, Atlanta 2027)
- ISCA 2027 is co-located with FCRC (Federated Computing Research Conference) in Atlanta
- Abstract registration one week before the full paper; three initial reviews, then a fourth review and a rebuttal/revision period for papers that advance
- Separate industry track; artifact evaluation offered; at most 8 main track submissions per author
- ACM open access publishing; authors from institutions outside ACM Open pay an APC (subsidized 500 USD members, 750 USD non-members in 2027)
