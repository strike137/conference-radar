links:
  website: http://www.icdip.org/
notes:
- Smaller commercially organized conference series running since 2009, with a different host university each year
- Proceedings 2024 to 2026 in the SPIE Digital Library (2023 in ACM DL), listed as indexed in Ei Compendex and Scopus;
  the 2027 pages do not name the publisher yet
- Held in China in April or May in recent years (Nanjing 2023, Haikou 2024 and 2025, Xiamen 2026, Beijing 2027);
  online from 2020 to 2022
- Double-blind review; full papers at least 8 pages, abstract-only submissions are presented but not published
- Not listed in the CORE portal (ICORE2026) or the CCF list
