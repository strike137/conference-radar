notes:
- Workshop on norms, organizations, institutions, coordination and ethics in multi-agent systems; started as COIN
  in 2006 and renamed COINE in 2020 when ethics was added
- Held at AAMAS every year since 2020, so it follows AAMAS around the world (London 2023, Auckland 2024, Detroit 2025, Paphos 2026)
- Revised and extended papers appear afterwards in a Springer LNAI post-proceedings volume (volume XVIII is LNAI 16253)
- Full papers (16 pages), short work in progress papers (10 pages) and blue sky ideas in LNCS format via OpenReview;
  single-blind review by at least two PC members
- Papers must be presented at the workshop to be considered for the post-proceedings
- ICORE2026 rank C; not on the CCF list
