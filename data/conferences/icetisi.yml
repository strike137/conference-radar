notes:
- Organized by FTKI at Universitas Nasional (UNAS), Jakarta; listed with the IEEE Indonesia Section as sponsor
- Held at Universitas Nasional in Jakarta; the 2027 edition is hybrid
- Accepted and presented papers are submitted to IEEE Xplore (Scopus indexed); the site says acceptance does not guarantee Xplore or Scopus inclusion
- No-show papers are removed from the IEEE Xplore submission
- Young conference; 1st edition December 2025, 2nd edition February 2027
- Broad scope (big data, intelligent systems, fintech and e-commerce, communication networks and signal processing, networks and security)
- "Fee: USD 125 to 205 online for international authors, IDR 2.5 to 4.1 million for Indonesian authors (2027, early bird)"
- Not listed in the ICORE2026 portal or the CCF 2026 list
