notes:
- Workshop of the ACL special interest group on Chinese language processing, running since 2002
- Irregular; recent editions 2010 and 2012 Tianjin (joint CIPS-SIGHAN conference), 2013 Nagoya, 2015 Beijing, 2017 Taipei,
  then SIGHAN-10 with ACL 2024 in Bangkok after a seven-year gap
- Long (8 pages) and short (4 pages) papers, double-blind review via OpenReview; papers go to the ACL Anthology
- "Acceptance rate: 60% (2024, 12 research papers plus 8 shared-task reports out of 29 submissions)"
- Hosts a shared task (2024 dimABSA, Chinese dimensional aspect-based sentiment analysis); non-archival cross-submissions welcome
- The old domain sighan.org now hosts unrelated content; use the per-edition site
- Not ranked in ICORE2026 and not on the CCF list
