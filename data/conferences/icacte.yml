id: icacte
name: ICACTE
full_name: International Conference on Advanced Computer Theory and Engineering
type: conference
tier: minor
areas: [general]
region: china
language: english
frequency: annual
organizer: Host Chinese university each year (Hangzhou Dianzi University 2026, Southeast University 2027); IEEE co-sponsored the 2024 to 2026 editions
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [3]
  conference_months: [8, 9]
links:
  website: https://www.icacte.org/
notes:
- Held since 2008; 2027 is the 20th edition
- Proceedings in IEEE Xplore (2021 to 2025 linked from the history pages; 2026 stated as to be available)
- The 2027 home page only says papers go into the conference proceedings, without naming the publisher
- Held in China in recent years (virtual 2021 and 2022, Hefei 2023 and 2024, Nanjing 2025, Hangzhou 2026, Nanjing 2027); earlier editions also in Germany, Singapore and South Korea
- Broad CS topics (networks, data mining, software engineering, AI, graphics)
- Site in English and Chinese; submission via EasyChair
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
