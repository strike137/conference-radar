notes:
- Run jointly by Obuda University (Hungary) and Politehnica University of Timisoara (Romania) as one of the Obuda University IEEE symposium series (with SISY, SAMI, CINTI, INES)
- Split across two venues in one week, first in Hungary and then in Timisoara, Romania (Budapest and Timisoara 2025, Visegrad and Timisoara 2027)
- Papers go to IEEE Xplore and are indexed by Scopus; 4 to 6 page IEEE double-column papers
- In-person only; at least one author must register and present, one paper per registration fee
- "Fee: EUR 350 regular, EUR 320 IEEE members, EUR 300 students (2025 rate before April 15)"
- Selected extended papers of the 2027 edition are considered for an MDPI MAKE journal special issue
- No 2026 edition appears on the Obuda University conference list; the 2027 edition is the 20th jubilee symposium
- Ranked National (Romania) in ICORE2026
