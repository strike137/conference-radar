notes:
- Flagship conference of ACM SIGCOMM; 110 papers accepted in 2026, presented in two parallel tracks
- One deadline per year (abstract late January, paper early February, AoE); anonymous submissions with early reject,
  rebuttal and one-shot revision
- Location rotates worldwide (Sydney 2024, Coimbra 2025, Denver 2026); SIGCOMM 2027 will be in Bangkok, Thailand
- Co-located workshops, tutorials, posters and a student research competition; student travel grants available
