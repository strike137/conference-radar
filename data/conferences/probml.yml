notes:
- Formerly the Symposium on Advances in Approximate Bayesian Inference (AABI); renamed ProbML for 2026
- Grew out of NIPS workshops (2015 to 2017); standalone symposium since 2018, now one day co-located with ICML or ICLR
- Recent editions in Honolulu (ICML 2023), Vienna (ICML 2024), Singapore (ICLR 2025) and Seoul (ICML 2026); 2021 and 2022 were virtual
- Three tracks; archival proceedings track (full papers, published in PMLR), non-archival workshop track (extended abstracts) and a fast track for papers recently accepted at major ML venues
- Proceedings track has reviews with an author rebuttal phase
- Attendance is free but limited, registration required (2026)
- Not listed in CORE ICORE2026
