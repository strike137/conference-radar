notes:
- Full-day workshop of PPAM (International Conference on Parallel Processing and Applied Mathematics), held every two years with PPAM
- 11th edition in 2026 (Poznan, Poland); 10th at PPAM 2024 in Ostrava, Czech Republic
- Covers high-level parallel programming models such as OpenMP, PGAS languages, CUDA, OpenCL, SYCL, Kokkos and OpenACC
- Papers go through the PPAM submission system in PPAM format; presented papers appear in the PPAM post-proceedings in Springer LNCS
- Best papers invited to a special issue of the International Journal of Parallel Programming (Springer)
- Final versions are due after the workshop; not listed in the CORE portal (PPAM itself is National Poland)
