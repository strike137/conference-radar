notes:
- Run by the eSystems Engineering Society, founded by UK academics (Liverpool John Moores University); held annually since 2008 (first edition in Liverpool)
- Proceedings published in IEEE Xplore every year since 2008 (IEEE technical co-sponsorship, Scopus indexed)
- CORE C (ICORE2026)
- Broad AI, robotics, sensors, health informatics and Industry 4.0 topics
- 'Moves around: Sharjah (2021), Baghdad (2022, held January 2023), Istanbul (2023), Sharjah (2024), Bucharest (2025), Shah Alam (2026)'
- Full papers up to 6 pages in IEEE format, submitted via EDAS; notification within about two weeks of submission
- Late deadline, extended for 2026 from 2026-09-15 to 2026-10-20
- "Registration fee (2026): 450 USD academic, 300 USD student first author; presenter rates by IEEE membership range from 220 to 450 USD"
