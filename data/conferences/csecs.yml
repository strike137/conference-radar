notes:
- Run by EAI (European Alliance for Innovation); 2026 is the 5th edition
- Co-organized by Boston University Metropolitan College (USA) and New Bulgarian University (Bulgaria)
- "Proceedings: Springer LNICST (EAI series), indexing as stated by EAI for the series"
- Scope covers general computer science research plus computer science education
- Alternates between Europe and the USA (Sofia 2022, Boston 2023, Sofia 2024, Bratislava 2025, Boston 2026)
- 2026 edition is hybrid, hosted at Boston University Metropolitan College
- Has a main track and a late track with separate deadlines
- Not listed in CORE ICORE2026 or the CCF list
