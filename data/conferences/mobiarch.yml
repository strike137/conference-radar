notes:
- Workshop on architecture for the next-generation mobile Internet (6G, edge, AI-driven mobile networks), held in
  conjunction with ACM MobiCom (Hong Kong 2025, Austin 2026)
- Papers up to 6 pages, two columns, ACM template; single-blind review; work-in-progress and position papers welcome
- Proceedings in the ACM Digital Library (Proceedings of the 20th Workshop on Mobility in the Evolving Internet
  Architecture, 2025; 21st volume for 2026)
- Half-day workshop in 2026; submission deadlines are usually extended
- Not listed in the CORE portal (ICORE2026)
