notes:
- Theory venue on formal languages and automata, running since 1993 under the auspices of EATCS
- Proceedings in Springer LNCS (DLT 2026 is LNCS 16578); selected papers invited to a special issue of IJFCS
- CORE C; not on the CCF 2026 list
- Mostly held in Europe, sometimes elsewhere (Tampa 2022, Umea 2023, Goettingen 2024, Seoul 2025, Rouen 2026, Saskatoon 2027)
- Papers up to 12 pages in LNCS style excluding bibliography; appendix allowed
- DLT 2026 was held jointly with the NCMA 2026 workshop; the Salomaa Prize is awarded at the conference
