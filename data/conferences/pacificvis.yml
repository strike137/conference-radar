id: pacificvis
name: PacificVis
full_name: IEEE Pacific Visualization Conference
type: conference
tier: major
areas: [data, vision]
region: asia-pacific
language: english
frequency: annual
organizer: IEEE Computer Society VGTC (Visualization and Graphics Technical Committee) sponsored, with a PacificVis
  steering committee and a rotating local host
organizer_country: [international]
proceedings: IEEE Xplore (conference proceedings); journal track papers in IEEE TVCG
archival: true
indexing: [DBLP]
rank:
  core: B
  ccf: C
fee: 700 USD IEEE member, 830 USD non member, 505 USD IEEE student member (2027, early)
typical:
  deadline_months: [9, 11]
  conference_months: [4]
links:
  website: https://pacificvis.org/
  dblp: https://dblp.org/db/conf/apvis/
notes:
- IEEE sponsored visualization and visual analytics conference (VGTC), started in Kyoto in 2008; formerly called
  IEEE Pacific Visualization Symposium (APVIS before that)
- Rotates within Asia-Pacific, usually in April (2023 Seoul, 2024 Tokyo, 2025 Taipei, 2026 Sydney, 2027 Busan)
- Several tracks with consecutive deadlines -> TVCG journal track (September), conference paper track (November),
  VisNotes short papers (January), posters (February)
- Papers rejected from the TVCG journal track can be revised and resubmitted to the conference track, optionally
  keeping the same reviewers
- Two stage review with a revision round for journal and conference tracks; single blind or double blind allowed
- Conference papers and VisNotes are published in the IEEE Digital Library; journal track papers in a special issue
  of IEEE TVCG
- CORE B (ICORE2026), CCF C (computer graphics and multimedia)
- Each paper needs one full registration; author fee includes publication cost
