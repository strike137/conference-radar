notes:
- Workshop on AI/ML for and of edge and fog networks for IoT (federated learning, offloading, resource management,
  edge security) co-located with IEEE GLOBECOM
- 2nd edition at GLOBECOM 2023 (Kuala Lumpur), 3rd edition at GLOBECOM 2025 (Taipei); not in the GLOBECOM 2024 or
  GLOBECOM 2026 workshop lists
- 2025 co-chairs Arijit Roy, Ayan Mondal, Sudip Misra, Dacheng Tao and Dusit Niyato
- Accepted and presented papers go into the GLOBECOM conference proceedings and IEEE Xplore; no-show papers are
  removed
- Submissions via EDAS through the GLOBECOM workshop call
- Not listed in ICORE2026
