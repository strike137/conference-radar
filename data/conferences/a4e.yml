notes:
- Workshop co-located with IEEE GLOBECOM; third edition was WS-17 at GLOBECOM 2025 in Taipei
- Topics are AI/ML and federated learning for IoT edge and fog networks (offloading, resource management, security, quantum AI for edge)
- Co-chairs are Arijit Roy, Ayan Mondal, Sudip Misra, Dacheng Tao and Dusit Niyato
- Accepted and presented papers go into the IEEE GLOBECOM workshop proceedings in IEEE Xplore; in-person presentation required (no-show papers removed)
- Submissions via EDAS through the GLOBECOM workshop call
- Not in the GLOBECOM 2026 workshop list
- Not listed in ICORE2026
