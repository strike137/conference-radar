id: ieee-mapcon
name: IEEE MAPCON
full_name: IEEE Microwaves, Antennas and Propagation Conference
type: conference
tier: minor
areas: [communications]
region: south-asia
language: english
frequency: annual
organizer: IEEE MTT-S and IEEE AP-S in India (local IEEE section hosts each year, e.g. IEEE Kerala Section for 2025)
organizer_country: [india]
proceedings: IEEE Xplore
fee: 220 to 440 USD foreign delegates, 135 to 255 USD foreign students; 18,000 to 34,000 INR Indian delegates (2026, by membership and registration period)
typical:
  deadline_months: [8]
  conference_months: [12]
links:
  website: https://ieeemapcon.org/
notes:
- Joint flagship conference of the IEEE MTT and AP societies in India; started in 2022
- Held in India every December (Bangalore 2022, Ahmedabad 2023, Hyderabad 2024, Kochi 2025, Nagpur 2026)
- Covers RF and microwave circuits, antennas and propagation, EM theory, metamaterials, THz and photonics, 5G/6G RF,
  measurements, bioelectromagnetics and EMC
- Three to four page IEEE two-column papers via EDAS, single-blind review; presented papers go to IEEE Xplore
- The 2024 and 2025 proceedings are indexed in IEEE Xplore (checked via Crossref DOI metadata)
- Large event with 1400+ participants in 2025, plus workshops, tutorials, student design contests and industry exhibits
- Not ranked by CORE or CCF; RF and antennas venue outside the usual CS rankings
