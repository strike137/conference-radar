notes:
- Run by Obuda University (Hungary) and the Technical University of Kosice (Slovakia) as one of the Obuda University IEEE symposium series (with SISY, SACI, CINTI, INES)
- Held every January in the High Tatras, Slovakia (Herlany 2020, 2021 and 2023, Poprad 2022, Stara Lesna 2024 to 2026)
- Papers go to IEEE Xplore; the series is indexed by Scopus
- In-person only; at least one author must register and present, one paper per registration fee
- "Fee: EUR 360 regular, EUR 330 IEEE members, EUR 300 students (2026 early rate)"
- Small regional venue with broad applied AI and informatics topics plus special sessions
- Ranked National (Slovakia) in ICORE2026
