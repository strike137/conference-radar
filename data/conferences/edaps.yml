links:
  website: https://www.edaps.org/
notes:
- Sponsored by the IEEE Electronics Packaging Society; describes itself as the flagship packaging symposium in the
  Asia-Pacific region
- Covers signal, power and thermal integrity, EMC, 3D-ICs and SiP, high-speed interconnects, antennas in package and
  machine learning for packaging
- Short papers of 3 pages (two-column, IEEE format); accepted papers reproduced as-is in the conference proceedings;
  one full registration needed per published paper
- 2026 is the 25th anniversary edition, held at Hyatt Centric, Chandigarh, India (general chairs from IIT Ropar and
  Simyog Technology)
- Oral and poster sessions, tutorials, industry exhibits and a student software competition; over 100 participants
- Not listed in ICORE2026 or the CCF list
