notes:
- 1st edition in 2026, held with ACM SIGMOD/PODS 2026 in Bengaluru, India
- Not the formal methods FORMATS (Formal Modeling and Analysis of Timed Systems); id dataformats avoids the clash
- 'Scope: table and file formats, data layouts and encodings, storage and I/O efficiency for analytics, transactions, vector and ML workloads'
- Submissions up to 3 pages excluding references (4 pages for accepted papers), ACM 2-column format, via Microsoft CMT
- Single-anonymous review; 9 peer-reviewed papers in 2026
- Proceedings published independently in the ACM Digital Library; ACM open access APCs may apply
- Region set as worldwide because it follows SIGMOD; only the 2026 edition is known
- Not listed in CORE ICORE2026 or in the CCF 2026 list
