notes:
- Cloud computing with a focus on JointCloud (multi-cloud and cross-cloud) computing, plus LLM and generative model infrastructure; 16th edition in 2025, 17th in 2026
- One of several co-located conferences of the IEEE CISOSE congress (with SOSE, BigDataService, IMC, DAPPS, AITest), which rotates between the Americas, Europe and Asia
- 'Recent hosts: Fremont (2022), Athens (2023), Shanghai (2024), Tucson (2025), Fukuoka (2026), Oxford (2027)'
- Proceedings published by IEEE Computer Society Press in IEEE Xplore, EI indexed; one author must register and present
- 'Paper types (2025): research up to 8 pages, survey up to 10, experience/industry up to 6, including references; not double-anonymous'
- CCF C (2026 list); not ranked in ICORE2026
