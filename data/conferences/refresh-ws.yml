  website: https://refresh2026.netmode.ece.ntua.gr/
notes:
- Workshop co-located with IEEE DCOSS-IoT; the 2026 edition was the 6th
- Organized by Maria Diamanti (NTUA) and Anastasios Zafeiropoulos (ICCS); steering committee Eirini Eleni Tsiropoulou (ASU) and Symeon Papavassiliou (NTUA)
- Topics are 6G physical layer, MAC and networking, edge computing, and ML and optimization for 5G/6G resource management
- Full papers up to 8 pages, work-in-progress papers up to 4 pages, IEEE format, not double-blind, via EasyChair
- Accepted and presented papers appear in the DCOSS-IoT proceedings in IEEE Xplore
- Follows the DCOSS-IoT host city (Reykjavik 2026)
