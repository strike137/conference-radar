id: 3pgcic
name: 3PGCIC
full_name: International Conference on P2P, Parallel, Grid, Cloud and Internet Computing
type: conference
tier: minor
areas: [systems, networking, security]
region: worldwide
language: english
frequency: annual
organizer: Fukuoka Institute of Technology (steering committee chair Leonard Barolli) with a host university each
  year
proceedings: Springer LNDECT (Lecture Notes on Data Engineering and Communications Technologies)
indexing: [Scopus, EI, DBLP]
rank:
  core: Unranked
fee: USD 500 per paper for author registration (2026); student participants USD 400 early
typical:
  deadline_months: [7, 8]
  conference_months: [10, 11]
links:
  website: https://voyager.ce.fit.ac.jp/conf/3pgcic/2026/
  dblp: https://dblp.org/db/conf/3pgcic/
  wikicfp: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=189206
notes:
- Part of the Barolli (Fukuoka Institute of Technology) conference family; always co-located with BWCCA (joint program
  and keynotes)
- Covers P2P, parallel, grid, cloud and edge computing; has tracks on security and trust in distributed systems
- 2025 edition (planned for University of Kalba, Sharjah, UAE) was switched to online only because of the situation
  in the Middle East; 2026 is at UTS, Sydney
- Not ranked by CORE or CCF; regarded as a lower-tier venue; notification came about one week after the hard deadline
  in 2025 and 2026 (about one month in 2024)
