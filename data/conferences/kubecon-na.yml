notes:
- CNCF flagship practitioner conference on Kubernetes and cloud native computing, North America edition run by The Linux Foundation
- Held in a different US city each November (Chicago 2023, Salt Lake City 2024, Atlanta 2025, Salt Lake City 2026, New Orleans 2027)
- Four days with 9,000+ attendees and 400+ sessions; Monday hosts CNCF co-located events such as ArgoCon, CiliumCon and Open Source SecurityCon
- Talk proposals reviewed by a program committee; poster sessions are also offered; no papers, slides and recordings are posted afterwards
- Speakers may appear on at most three submissions
- Co-located events have their own separate call for proposals
