notes:
- First edition, Workshop 12 at IEEE VTC2027-Spring (Hamburg); not in the VTC2026-Spring or VTC2026-Fall workshop lists
- Half-day workshop on exchanging tokenized representations of language, vision, audio and multimodal AI models over wireless and edge networks
- Topics include token compression and transmission, coding and modulation, radio access, edge support, distributed inference, privacy and security
- Organizers from The University of Hong Kong, University of Surrey, Beijing Institute of Technology, SUTD, Brunel University of London, Hunan Normal University and Hong Kong Metropolitan University
- Program of invited talks, peer-reviewed papers and a panel
- VTC2027-Spring papers are 5 pages (up to 2 extra pages at 100 USD each); workshop papers are submitted through the VTC2027-Spring workshops and Recent Results TrackChair site
- VTC papers go to IEEE Xplore and may be removed if not presented at the conference
- Not listed in ICORE2026
