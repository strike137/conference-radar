notes:
- Workshop series on building, evaluating and using language resources for under-resourced languages and domains, with a strong Nordic and Baltic language focus
- Editions co-located with SLTC 2020 (Gothenburg), NoDaLiDa 2023 (Tórshavn), NoDaLiDa/Baltic-HLT 2025 (Tallinn) and LREC 2026 (Palma, Mallorca)
- The 2026 edition was titled "the role of resources in the age of large language models" and took place on May 11, 2026 at LREC 2026
- Proceedings in the ACL Anthology; the 2023 and 2025 volumes also appeared in the NEALT Proceedings Series
- Archival track for long papers (8 pages) and short papers (4 pages) with double-blind review, plus a non-archival track for papers and 2-page extended abstracts
- Not ranked in ICORE2026 and not on the CCF list
