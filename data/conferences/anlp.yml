notes:
- Largest NLP meeting in Japan, organized by ANLP every March (tutorials, 4-day main meeting, workshops on the last
  day)
- No acceptance review; optional review for awards; since 2026 on-site posters are the default format and top reviewed
  papers are invited to a single-track oral session
- General-session presenters must be ANLP members (theme sessions are open to non-members); 4-page body, up to 5
  pages with references, plus a 1-page appendix; Japanese or English
- Proceedings are published openly on the ANLP site under CC BY 4.0, marked as not peer reviewed
- Application with full paper is due in early January at 15:00
- All papers are free PDFs on the ANLP website (about 800 in 2026); they are not on J-STAGE, which hosts only the
  society's journal
