id: qsns
name: QSNS
full_name: Workshop on Quantum-Secure Networks and Systems
type: workshop
tier: minor
areas: [security, crypto, networking]
region: europe
language: english
frequency: annual
organizer: QUBIP project with other EU Horizon Europe PQC transition projects (PQ-React, PQ-NEXT, POSEIDON, QARC, Q-FENCE)
organizer_country: [europe]
proceedings: IEEE Xplore (IEEE ISCC workshop proceedings)
typical:
  deadline_months: [2, 3]
  conference_months: [6, 7]
links:
  website: https://qubip.eu/qsns2026/
notes:
- Co-located with IEEE ISCC (Paris 2024, Bologna 2025, Vilamoura 2026)
- Joint initiative of EU Horizon Europe projects on the transition of protocols, networks and systems to post-quantum cryptography
- Topics include PQC protocol migration, crypto agility, hybrid PQC and QKD designs, hardware and software support for PQC
- Papers up to 6 pages including references in IEEE format, submitted via EDAS, at least three reviews each
- Accepted papers appear in the IEEE ISCC workshop proceedings in IEEE Xplore; one author must register for ISCC
