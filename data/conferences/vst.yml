id: vst
name: VST
full_name: International Workshop on Validation, Analysis and Evolution of Software Tests
type: workshop
tier: minor
areas: [software]
region: worldwide
language: english
frequency: annual
organizer: VST chairs (Software Competence Center Hagenberg, University of Klagenfurt), co-located with SANER
organizer_country: [europe]
proceedings: SANER companion proceedings (IEEE)
archival: true
typical:
  deadline_months: [11, 12]
  conference_months: [3]
links:
  website: https://vstworkshop.github.io/
notes:
  - Workshop on test code analysis, test maintenance and repair, test generation, prioritization and LLMs in testing
  - Co-located with IEEE SANER, so it moves with SANER (Montreal 2025, Limassol 2026, Richmond 2027)
  - Accepted papers go into a separate section of the SANER conference proceedings (companion proceedings)
  - Full papers up to 8 pages, position and tool demo papers 2 to 4 pages, IEEE format, double-blind review
  - At least three PC members review each paper; submissions go through the SANER EasyChair
  - Chaired by Rudolf Ramler (SCCH, Austria), Christian Macho and Martin Pinzger (University of Klagenfurt)
  - Editions since 2016; the 10th edition is in 2027
  - Not listed in the CORE portal (ICORE2026)
