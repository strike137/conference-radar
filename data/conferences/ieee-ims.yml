notes:
- Flagship symposium of IEEE MTT-S with the world's largest RF and microwave industry exhibition
- "Week of co-located symposia: RFIC (RF Integrated Circuits), RFSA (RF Systems and Applications), RFTT (RF Technology
  and Techniques) and the ARFTG measurement conference"
- RFSA and RFTT replaced the single IMS technical track in 2026; RFIC has a later deadline (January) than RFSA and RFTT
  (December)
- Papers of up to 4 pages with double-blind review; accepted papers go into the symposium digests in IEEE Xplore
- Selected RFSA and RFTT papers are invited to an IEEE Microwave and Wireless Technology Letters special issue
- Held in the USA every year since 2013 (Boston 2026, San Antonio 2027, Phoenix 2028)
- IMS2027 marks the 75th anniversary of MTT-S
- Microwave engineering venue outside the usual CS rankings, not listed in ICORE2026
