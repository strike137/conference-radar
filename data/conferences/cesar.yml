notes:
- French cybersecurity conference run by the French Ministry of Defense (DGA) since 1997, mixing academia, industry and
  government
- Held every fall (November) in Rennes, France, as part of the European Cyber Week
- Papers in English or French; research, SoK, replication, practice and work in progress papers accepted
- Two-step selection; selective proposal review in spring (low acceptance), then a final version in August
- Official proceedings in CEUR-WS since 2021 (curated selection only; none for 2024); other accepted papers are posted
  on the conference site
- 2025 received 20 submissions and accepted 6 papers (CEUR-WS Vol-4143 preface)
- Each edition used to have a theme; 2024 and 2025 were "Cybersecurity at Large"
- Not ranked on CORE ICORE2026 or CCF
