notes:
- IEEE series since 2002; in recent years usually held in China (Wuhan 2022, Sanya 2024, Guiyang 2025) with occasional
  editions abroad (Exeter 2023)
- 'Held as part of a cluster of co-located IEEE conferences (2025: IEEE AI+ Congress with BigDataSE, CSE, EUC, iSCI)'
- Proceedings in IEEE Xplore; single-blind review; 8 pages IEEE CS format (up to 12 with overlength charge), submission
  via EDAS
- 'Six tracks: trust, security, privacy, forensics and analytics, emerging tech, AI trust'
- CORE B, CCF C; regarded as a high-volume venue
