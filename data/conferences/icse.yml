rank:
  core: A*
  ccf: A
acceptance_rate: 22% (2026, 321/1469, both cycles combined)
fee: About 800 USD (2026, early, ACM/IEEE member; 1000 USD non-member; 500 USD student member)
typical:
  deadline_months: [3, 6, 7, 8]
  conference_months: [4, 5]
links:
  website: https://conf.researchr.org/series/icse
