notes:
- Flagship software engineering conference; CORE A*, CCF A
- ICSE 2027 goes back to a single submission cycle (end of June); ICSE 2024 to 2026 used two cycles
- Double-anonymous review with a major revision round; 10 pages plus 2 pages of references
- Hosts many co-located conferences (MSR, ICPC, CAIN, FORGE, SEAMS) and workshops whose deadlines fall in Oct/Nov
- 'Student entry points: ACM Student Research Competition, Doctoral Symposium, student volunteers, Student Mentoring
  Workshop'
