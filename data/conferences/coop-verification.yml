notes:
- One-day ETAPS satellite workshop on combining verifiers, testing and other analyses (portfolios, exchange formats, cooperative verification)
- Talk-based workshop with no proceedings; submit a short abstract (half a page to 2 pages) via EasyChair, reviewed for fit to the topic
- Mature or already published work is welcome, so it is a place to present rather than to publish
- Held with ETAPS (Luxembourg 2024, Turin 2026, Copenhagen 2027)
- The 2026 edition is called the 7th on the workshop site but the 6th on the ETAPS satellite events page
- Not listed in ICORE2026 or on the CCF 2026 list
