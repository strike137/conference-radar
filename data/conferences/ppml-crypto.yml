notes:
- One-day workshop affiliated with Crypto at UCSB, Santa Barbara, held every year since 2019 (editions 2019 to 2026 listed on the site)
- Aims to connect the machine learning and cryptography communities; topics include MPC, homomorphic encryption,
  differential privacy, federated learning and model stealing
- Invited talks plus contributed talks; non-anonymous submissions through EasyChair, full papers encouraged
- No formal proceedings; papers under submission or published elsewhere are accepted
- Registration goes through the Crypto registration form
- Not listed in ICORE2026 or the CCF 2026 list
