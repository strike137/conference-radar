notes:
- One-day workshop on testing, debugging, monitoring and log analytics of data-intensive and AI-enabled software systems
- First edition co-located with ACM FSE 2026 in Montreal (Concordia SGW campus) on 5 July 2026
- Position statements (2 pages), short papers (4+1 pages), full papers (10+2 pages) and non-archival arXiv presentations; FSE industry track format, double-blind review via HotCRP
- Full and short papers appear in the FSE 2026 workshop proceedings; position statements and arXiv presentations are non-archival
- Breakout sessions aim at a joint community article (for example in IEEE Software)
- Not listed in CORE ICORE2026 or the CCF 2026 list
