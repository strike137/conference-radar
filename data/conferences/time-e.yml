notes:
- Organized by the IEEE Indonesia Instrumentation and Measurement and Information Theory Joint Societies Chapter and
  the IEEE Indonesia Vehicular Technology and Intelligent Transportation Systems Joint Societies Chapter
- Very broad scope (technology, informatics, management, engineering, environment); a minor regional venue
- Held in Bali in 2024 (Aston Kuta Hotel), 2025 and 2026; 2026 is the 7th edition
- Earlier editions with IEEE proceedings in 2013, 2014, 2015 and 2019; annual since 2024
- Presented papers are submitted to IEEE Xplore (inclusion and Scopus indexing not guaranteed); IEEE no-show policy
  applies; submission via EDAS
- Not listed in the ICORE2026 CORE portal
