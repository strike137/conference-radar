notes:
- JavaScript community conference in Tokyo, billed as a JavaScript festival in Japan run by the Japan Node.js
  Association
- Aims to bridge Japanese and international web developers; talks in Japanese and English
- 2026 is the seventh edition; one day each year in November
- 'Recent venues: Gran Tokyo South Tower (2025), Bellesalle Kanda (2026)'
- 2026 keynotes include Brendan Eich, the creator of JavaScript
- No papers or proceedings; talks only
