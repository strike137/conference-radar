organizer_country: [other]
proceedings: IEEE Xplore (IEEE tracks); IIUC Journal of Science and Engineering (non-IEEE tracks)
archival: true
acceptance_rate: 36% (2024, 180/498)
fee: Foreign authors 200 USD non-IEEE, 160 USD IEEE member; local 10,000 BDT non-IEEE (2026)
typical:
