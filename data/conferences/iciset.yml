links:
  website: https://iciset.iiuc.ac.bd
notes:
- Multidisciplinary conference of International Islamic University Chittagong (IIUC), Bangladesh, held on its Kumira campus in Chattogram
- Held in 2016, 2018, 2022, 2024 and 2026 (fifth edition); roughly every two years
- IEEE tracks cover power and energy, electronics, VLSI, AI, data science, IoT and signal processing, and communication and computer networks; papers go to IEEE Xplore
- Non-IEEE tracks (civil and environmental engineering, pharmacy and biological science) publish in the IIUC Journal of Science and Engineering
- Double-blind review via Microsoft CMT with at least three reviews per paper; papers 4 to 6 pages
- "2024: 498 submissions, 180 accepted, 132 presented and published in IEEE Xplore"
- Hybrid mode in 2026 (in person and online)
- Not listed in ICORE2026 or the CCF 2026 list
