notes:
- Workshop on multimodal sentiment and emotion recognition from audio, video, text and physiological signals, with a challenge in earlier editions
- Held with ACM Multimedia every year since 2020, so it moves with the host (Seattle 2020, Chengdu 2021, Lisbon 2022, Ottawa 2023, Melbourne 2024, Dublin 2025)
- Accepted papers get 6 to 8 pages plus references in the ACM MM proceedings
- Double-blind review with at least three reviews per paper; submission through EasyChair
- Organized by Shahin Amiriparian and Bjoern Schuller (TUM, Imperial College London) with Erik Cambria (NTU)
- Not listed in ICORE2026 or the CCF list
