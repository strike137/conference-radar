notes:
- FSE workshop on quantum software engineering (hybrid quantum-classical software, quantum programming, design, testing and process)
- Editions with FSE 2024 (Porto de Galinhas), FSE 2025 (Trondheim) and FSE 2026 (Montreal)
- Papers appear in the FSE companion proceedings in the ACM Digital Library; 2024 had its own ACM volume (QSE-NE '24)
- Research track up to 10 pages, ideas and visions and industry tracks up to 6 pages, plus 2 pages of references (2026)
- Double-anonymous review via HotCRP (2026)
- Different venue from the ICSE Q-SE workshop
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
