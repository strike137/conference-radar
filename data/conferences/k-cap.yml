notes:
- Small biennial conference (odd years, recently in December); 59 to 70 attendees per edition from 2015 to 2021
- 'Not double-blind: author names on submissions; full papers up to 8 pages, short papers 4 pages, visionary papers
  2 pages'
- Proceedings in the ACM Digital Library (ACM SIGAI sponsored)
- Held in North America (earlier in Banff and Whistler, Canada; Pensacola 2023, Dayton 2025); in-person only
- Student travel support has been offered through ACM SIGAI
