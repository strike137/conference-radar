notes:
- New venue; the 1st edition is in December 2026 at Institut Teknologi Bandung (ITB)
- Technically sponsored by the IEEE Computer Society (Indonesia Section); partners include BRIN, ITB, SCCIC and AISX
- 'Four tracks: AI for cyber defense, trusted society and digital infrastructure, critical infrastructure and Industry
  4.0, cyber governance and economic resilience'
- 4 to 6 page papers (up to 10 with extra fee) via Microsoft CMT; accepted and presented papers are submitted to IEEE
  Xplore (inclusion not guaranteed)
- Selected papers may be invited to Scopus or SINTA indexed journals
- Not listed in the ICORE2026 CORE portal
