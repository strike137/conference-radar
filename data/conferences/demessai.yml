id: demessai
name: DeMeSSAI
full_name: International Workshop on Designing and Measuring Security in Systems with AI
type: workshop
tier: minor
areas: [security, ai, software]
region: europe
language: english
frequency: annual
organizer: Co-located with IEEE EuroS&P; chairs Katja Tuma (VU Amsterdam), Jamal El Hachem (University of South
  Brittany) and Maura Pintor (University of Cagliari)
organizer_country: [europe]
proceedings: None (no formal workshop proceedings)
archival: false
typical:
  deadline_months: [2, 3]
  conference_months: [7]
links:
  website: https://demessai.github.io/
notes:
- Non-archival; the site states there are no formal workshop proceedings and the focus is on research talks (in
  2025 accepted papers or slides were made available to registered attendees on the website)
- Held with IEEE EuroS&P (Venice 2025, Lisbon 2026); formerly DeMeSSA (Designing and Measuring Security in
  Software Architectures), held with ECSA (2nd edition in Prague 2022, also 2023)
- Welcomes papers already published elsewhere and EuroS&P rejected papers (2025); extended abstracts and SoK papers
  accepted; double-blind review, EasyChair
- Generative AI use by authors and reviewers was not allowed in 2025
- Not listed in ICORE2026
