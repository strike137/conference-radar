id: pdsec
name: PDSEC
full_name: IEEE International Workshop on Parallel and Distributed Scientific and Engineering Computing
type: workshop
tier: minor
areas: [systems]
region: worldwide
language: english
frequency: annual
organizer: IEEE IPDPS workshop; steering committee chaired by Laurence T. Yang (St. Francis Xavier University), site
  hosted by IEEE TCSC
organizer_country: [canada, europe]
proceedings: IEEE Xplore (IPDPS Workshops, IEEE Computer Society)
archival: true
typical:
  deadline_months: [2]
  conference_months: [5, 6]
links:
  website: https://www.ieee-tcsc.org/2026/pdsec/
notes:
- One-day workshop co-located with IEEE IPDPS every year since 2001; first edition in 2000 in Iwate, Japan (27th edition in 2026 per its own site)
- Papers appear in the IPDPS workshop proceedings published by the IEEE Computer Society (IEEE Xplore)
- 'Topics: HPC for scientific and engineering applications, performance modeling, code modernization, MPI+X,
  scalable algorithms, performance portability, big scientific data'
- Full papers up to 8 pages, short papers up to 4 pages, IEEE two-column format including references
- Selected papers invited to journal special issues
- Location follows IPDPS (St. Petersburg 2023, San Francisco 2024, Milan 2025, New Orleans 2026)
