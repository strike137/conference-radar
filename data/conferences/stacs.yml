notes:
- Held every year since 1984, alternating between Germany and France (Hamburg 2023, Clermont-Ferrand 2024, Jena 2025, Grenoble 2026, Goettingen 2027)
- "Two tracks since 2023: Track A (algorithms, data structures, complexity) and Track B (automata, logic, semantics, theory of programming)"
- Proceedings in the open-access LIPIcs series (Schloss Dagstuhl) since 2008; Springer LNCS from 1984 to 2007
- Double-blind review since 2020, with a rebuttal phase since 2016
- CORE A (ICORE2026), CCF C
