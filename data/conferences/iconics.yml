notes:
- Biennial conference of the CS and IT department of NED University, Karachi, Pakistan; editions in 2016, 2018, 2022 and 2024, the last two in Karachi
- 2022 and 2024 proceedings are in IEEE Xplore; for 2026 accepted papers go to IEEE conference proceedings subject to IEEE approval
- Tracks on AI and machine learning, generative AI, quantum computing, cybersecurity, networks and IoT, software engineering and data science
- 2026 edition co-organized with IEEE Karachi Section under an MoU signed in March 2026
- 2026 dates moved (October 21 to 22 announced in March 2026, now December 23 to 24, 2026); submission via PaperDesk in IEEE format
- The 2022 edition was titled International Conference on Innovations in Computer Science and Software Engineering
- Not listed in ICORE2026 or the CCF 2026 list; a small regional venue
