notes:
- Organized by KICS; one of three KICS general conferences each year (winter in February, summer in June, fall in
  November)
- Short 1 to 2 page papers; oral and poster sessions with best paper awards, plus an English paper session for foreign
  students and an undergraduate paper track
- 'Topics: 5G/6G networks and communications, satellite and quantum communication, software, IoT, blockchain, AI
  (LLM, generative AI) and ICT convergence'
- Held at resort venues in Korea (Gyeongju 2022 to 2025, Vivaldi Park in Hongcheon 2026); one author registration
  required per paper
