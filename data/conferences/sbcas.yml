notes:
- Brazilian symposium on computing applied to health, organized by the SBC special committee CE-CAS; 26th edition
  in 2026
- Topics include AI in health, medical image processing, health information systems, telemedicine, LLMs for
  health, wireless body area networks and decision support systems
- Papers in Portuguese or English; anonymous submission; full papers 8 to 12 pages, work in progress up to 6 pages
- Proceedings (Anais do SBCAS) published open access in SBC OpenLib (SOL) under CC BY 4.0
- Selected papers invited to submit extended versions to the Journal of the Brazilian Computer Society (JBCS)
- Held in Brazil (Ouro Preto, Minas Gerais in 2026); renamed from Workshop de Informática Médica in 2018
- Not listed in CORE ICORE2026
