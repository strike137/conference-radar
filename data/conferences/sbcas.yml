notes:
- Main national event of the SBC Special Commission on Computing Applied to Health (CE-CAS); 26th edition in 2026
- Successor of the Workshop de Informatica Medica (WIM, 2001 to 2017), renamed SBCAS in 2018
- Full papers (8 to 12 pages) and work in progress papers (up to 6 pages) in Portuguese or English, SBC template, double-blind review, submission through JEMS
- Proceedings (Anais) published open access in SBC OpenLib (SOL) with DOIs; at least one author must register
- Selected papers invited to extended versions in the Journal of the Brazilian Computer Society (JBCS)
- Held in a different Brazilian city each year (Ouro Preto, MG in 2026); the per-year site changes, the SOL page is the stable link
- Not listed in the CORE portal (ICORE2026)
