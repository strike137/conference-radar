notes:
- National Serbian ICT conference in Serbian, held since the 1990s; 32nd edition in 2026
- Held at the Grand hotel congress centre on Kopaonik (first three editions on Brezovica)
- Runs alongside the international English-language ICIST conference (icist-rs) since 2011
- Mix of research papers, company presentations and panels; topics include AI, security, software, networks and telecom, e-government
- Extended abstract of at least 300 words submitted via CMT; accepted papers sent in full after the conference for the proceedings
- Proceedings (zbornik) published by Informaciono drustvo Srbije with an ISBN, released in August after the March meeting
- "Registration fee: 17,500 RSD (2026)"
- Not listed in CORE ICORE2026
