links:
  website: https://sites.google.com/view/nwdcn2027/home
notes:
- Workshop co-located with ICDCN since 2018 to connect women researchers in distributed computing, networking and
  mobile computing
- At least one author of every paper must be a woman working in the field; attendance is open to everyone
- Papers up to 6 pages in the ACM template; double-blind review; submission via the ICDCN EasyChair
- Papers appear in the ICDCN satellite proceedings in ACM ICPS; ACM open access APC applies to authors outside ACM Open
  institutions
- No edition at ICDCN 2026 (Nara); the 9th edition is at ICDCN 2027 in Surathkal
- Not listed in ICORE2026 and not on the CCF list
