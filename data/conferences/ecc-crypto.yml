id: ecc-crypto
name: ECC
full_name: Workshop on Elliptic Curve Cryptography
type: workshop
tier: minor
areas: [crypto]
region: worldwide
language: english
frequency: irregular
organizer: ECC steering committee (chair Tanja Lange) with a local organizer each year
organizer_country: [international]
proceedings: None (invited talks only; slides and videos posted on the website)
archival: false
typical:
  conference_months: [10, 11]
links:
  website: https://eccworkshop.org/
notes:
- Workshop series started in 1997 in Waterloo; originally on elliptic curve cryptography, now covering many areas of modern cryptography
- Invited presentations only, so there is no call for papers
- Often preceded by a summer or autumn school (ECC 2024 had an isogenies school on Oct 28 to 29)
- Rotates worldwide (2017 Nijmegen, 2018 Osaka, 2019 Bochum, 2020 online, 2024 Taipei); no in-person edition 2021 to 2023
- ECC 2025 was a half-day online event on 11 August 2025 celebrating 40 years of ECC, streamed on YouTube
- The local organizer runs the workshop and carries its finances; ECC 2024 was hosted by Academia Sinica
- Not listed in ICORE2026 and not in the CCF list, so no rank is given
