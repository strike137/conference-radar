id: iiswc
name: IISWC
full_name: IEEE International Symposium on Workload Characterization
type: conference
tier: minor
areas: [systems]
region: worldwide
language: english
frequency: annual
organizer: IEEE Computer Society TCCA
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
fee: 750 USD IEEE member, 900 USD non-member, 550 USD IEEE student member (2026, early)
typical:
  deadline_months: [5, 6]
  conference_months: [9, 10]
links:
  website: https://iiswc.org/
notes:
- Sponsored by the IEEE Computer Society and its Technical Committee on Computer Architecture (TCCA)
- Focus on characterizing and analyzing workloads (AI, cloud, mobile, HPC, quantum) and open-source benchmarks and tools
- Double-blind review with a rebuttal period; regular papers up to 10 pages excluding references, short 6-page tool/benchmark papers also welcome
- Optional artifact evaluation that does not affect acceptance
- Camera-ready papers go through IEEE PDF eXpress for IEEE Xplore; at least one author must register and present
- Mostly held in North America (Austin 2022, Vancouver 2024, Irvine 2025, Boulder 2026), with Ghent 2023 and a virtual 2021 edition
- Not ranked in ICORE2026 and not in the CCF list
