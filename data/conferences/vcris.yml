id: vcris
name: VCRIS
full_name: International Conference on Cryptography and Information Security (VCRIS)
type: conference
tier: minor
areas: [crypto, security, ai]
region: southeast-asia
language: english
frequency: annual
organizer: Academy of Cryptography Techniques (Vietnam Government Information Security Commission), with VIASM,
  FISU Vietnam and the Information Security Journal
organizer_country: [vietnam]
proceedings: IEEE Xplore
archival: true
indexing: [IEEE Xplore]
rank:
  core: Unranked
fee: 300 USD non-IEEE member, 250 USD IEEE member (2026, one paper, before Sep 25)
typical:
  deadline_months: [7, 8]
  conference_months: [10, 12]
links:
  website: https://vcris.org/
  wikicfp: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=194368
notes:
- Held every year at the Academy of Cryptography Techniques in Hanoi, Vietnam, since the 1st edition in Dec 2024;
  technical sponsor IEEE Vietnam Section
- Endorsed by JAIST, University of Lorraine and KU Leuven COSIC
- Max 6 pages in IEEE format, double-blind review by at least three PC members; the 2024 and 2025 proceedings are
  in IEEE Xplore (about 35 and 44 papers)
- 'Five tracks in 2026: theoretical and post-quantum crypto, applied crypto and privacy, systems and network security,
  AI-driven security, emerging technologies'
- In-person presentation required (no virtual talks); listed on the IACR calendar; deadlines usually extended by
  two to four weeks
