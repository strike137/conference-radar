notes:
- Long-running hacker conference from Malaysia, historically held in Kuala Lumpur and Amsterdam, later Singapore,
  Phuket, Bangkok, Dubai, Beijing and Abu Dhabi
- The final Amsterdam edition was HITBSecConf2023 (April 2023); the last HITBSecConf listed on the official site
  is Bangkok, 26-30 August 2024
- 'Since 2025 the same team runs the smaller ''Out Of The Box'' (OOTB) offensive-security conferences (about 150
  attendees): Jakarta Feb 2025, Bangkok Aug 2025, Jakarta Apr 2026'
- 'Format: multi-day trainings plus multi-track talks, CTFs and villages; slides and videos posted online'
