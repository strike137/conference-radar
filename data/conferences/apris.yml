id: apris
name: APRIS
full_name: Asia Pacific Conference on Robot IoT System Development and Platform
type: conference
tier: minor
areas: [systems, software]
region: asia-pacific
language: english
frequency: annual
organizer: IPSJ SIGEMB (Information Processing Society of Japan, Special Interest Group on Embedded Systems)
organizer_country: [japan]
proceedings: IPSJ Digital Library (APRIS post-proceedings, at the authors' option)
fee: 44,000 JPY non-member presenter onsite, 19,800 JPY student audience onsite (2026)
typical:
  deadline_months: [8, 9]
  conference_months: [10, 11]
links:
  website: https://www.sigemb.jp/APRIS/2026/
notes:
- Run by IPSJ SIGEMB (embedded systems); steering co-chairs from Japanese and Thai universities and Toyota; held since 2018
- Held in Japan (Tokyo 2022 to 2024) or Thailand (Phuket 2018, Pattaya 2019, Pathumthani 2025, Bangkok 2026);
  online in 2020 and 2021, hybrid since 2022
- Topics are embedded systems, robot and IoT systems, edge/cloud platforms, development methods and engineering
  education
- Peer-reviewed regular papers (3 to 8 pages) plus 1 to 2 page work-in-progress and poster papers, all in English
- Post-proceedings model; camera-ready papers are due after the conference and go into the IPSJ Digital Library
  if the authors sign the IPSJ copyright form
- Authors of selected 2025 papers could submit extended versions (at least 50% new content) to a special issue of
  ECTI Transactions on Computer and Information Technology (ECTI-CIT)
- Followed by the APRIS Robot Challenge, a student team project event, right after the main conference
- Small venue that aims to encourage young researchers; not listed in ICORE2026 or the CCF list
