notes:
- Co-located workshop of SBRC, the Brazilian Symposium on Computer Networks and Distributed Systems run by the
  Brazilian Computer Society (SBC); 3rd edition (III WQuNets) in 2026
- Covers quantum networks and quantum internet, quantum key distribution, quantum repeaters and routers, and
  post-quantum cryptography
- Papers in Portuguese or English, up to 6 pages including references in the SBC template; submission through JEMS3
- Accepted papers published in the SBC digital library on the SOL platform; organizers planned to negotiate a JBCS
  special issue for the best papers (not confirmed)
- One-day workshop held with SBRC in a different Brazilian city each year (Praia do Forte, Bahia in 2026)
- Not listed in CORE ICORE2026
