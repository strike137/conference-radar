notes:
- Main AI conference of Australia and New Zealand, running since 1987 (2025 Canberra, 2026 Auckland)
- Listed in ICORE2026 as 'Australasian B' (national rank), not an international B
- Proceedings in Springer LNAI; 12 pages, double-blind on OpenReview, single-stage review with no rebuttal
- 2026 also has a non-archival Encore track for papers already published elsewhere (due 2026-10-27) and a PhD forum
