notes:
- IEEE conference formed in 2015 by merging CSMR and WCRE; held every March
- Research track deadline in late Sep/Oct; ERA, short paper, tool demo, industrial and RENE tracks follow about
  a month later
- Agentic AI4SE track added for SANER 2027
- Double-anonymous review; 10 pages plus 2 pages of references; CORE A, CCF B
- Held in Macao in 2023
