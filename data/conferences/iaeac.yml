id: iaeac
name: IEEE IAEAC
full_name: IEEE Advanced Information Technology, Electronic and Automation Control Conference
type: conference
tier: minor
areas: [general, ai, communications]
region: china
language: english
frequency: irregular
organizer: Chongqing Global Union Academy of Science and Technology (GUAST), sponsored by IEEE
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI]
fee: 600 USD or 3900 CNY per paper up to 5 pages (2027, author); 550 USD student or IEEE member; listener 300 USD
typical:
  deadline_months: [11]
  conference_months: [3]
links:
  website: http://www.iaeac.org/
notes:
- Run by the Chongqing Global Union Academy of Science and Technology (GUAST), which also runs ITNEC and ITOEC with the same committee and website template
- Editions in 2015, 2017, 2018, 2019, 2021, 2022, 2024, 2025 and 2027 (9th); site headers list Chongqing for every edition (the 2019 About text says Chengdu, the 2025 one Guiyang)
- "IAEAC 2027 IEEE conference record 70667; proceedings series ISSN 2689-6621"
- The site says all accepted papers are published by IEEE and submitted to EI Compendex; selected papers go to SCI journals
- Usually two submission rounds; minimum paper length 4 pages
- Regarded as a small, high-acceptance venue
- Not listed in CORE ICORE2026 or the CCF list
