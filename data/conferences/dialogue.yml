notes:
- Russian computational linguistics conference with a 40-year history; focus on computational analysis of Russian
- Organized in 2026 by Lomonosov Moscow State University, supported by MSU, MIPT, RSUH, HSE, St. Petersburg State University and EUSP
- About 70 selected papers per year go to the Scopus-indexed yearbook; other accepted papers appear in RSCI-indexed proceedings
- Hosts the Dialogue Evaluation shared tasks (none in 2026)
- Online 2020 to 2023; in-person or hybrid in Moscow in 2025 and 2026; no 2024 edition listed on the site
- Peer review via Microsoft CMT; a registration fee is required to publish
- Not found in the ICORE2026 or CCF 2026 lists
