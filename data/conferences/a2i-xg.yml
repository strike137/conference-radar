notes:
- First edition, Workshop 6 at IEEE VTC2027-Spring (Hamburg); not in the VTC2026-Spring or VTC2026-Fall workshop lists
- Covers 6G and beyond radio access networks from algorithm design to implementation and experimental validation
- Organized mainly from Japan (Hokkaido University, Keio University, Ritsumeikan University, NTT DOCOMO)
- Includes invited talks by speakers from academia and industry
- VTC2027-Spring papers are 5 pages (up to 2 extra pages at 100 USD each); workshop papers are submitted through the VTC2027-Spring workshops and Recent Results TrackChair site
- VTC papers go to IEEE Xplore and may be removed if not presented at the conference
- Not listed in ICORE2026
