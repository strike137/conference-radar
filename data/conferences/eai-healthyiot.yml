notes:
- EAI conference on IoT and AI technologies for health care, running since 2014
- Proceedings in Springer LNICST; extended papers can go to EAI Endorsed Transactions on Pervasive Health and Technology for an extra fee
- 2026 edition is branded HealthyAIoT (EAI International Conference on AIoT Healthcare Systems) with a focus on AI, design and health engineering
- Recent editions in Danang, Vietnam (2024, as part of the EAI AI Summit) and Guangzhou, China (2026)
- Not listed in ICORE2026
