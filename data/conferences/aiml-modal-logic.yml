notes:
- Biennial conference and book series on pure and applied modal logic (semantics, proof theory, description, epistemic, temporal and provability logics)
- Proceedings in EPTCS (open access) from 2026 (vol. 447); earlier volumes published as books by College Publications
- Full papers up to 12 pages plus up to 5 pages of appendix, not anonymised; plain-text abstract registration required before the paper deadline
- Short presentations (3-page extended abstracts, light review) are not in the formal proceedings
- Mostly held in Europe (Bern 2018, online 2020, Rennes 2022, Prague 2024, Amsterdam 2026)
- Ranked B in ICORE2026; not on the CCF 2026 list
- Part of the community is philosophical logic; the rest is logic in computer science
