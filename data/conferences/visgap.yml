archival: true
typical:
  deadline_months: [3]
  conference_months: [5, 6]
links:
  website: https://visgap.gitlab.io/
notes:
- Half-day workshop on the gap between visualization research prototypes and usable software, including reproducibility and research software sustainability
- Co-located with EuroVis every year since 2020 (Odense 2024, Luxembourg City 2025, Nottingham 2026)
- Papers of 4 to 8 pages plus one page of references, and extended abstracts of up to 2 pages given as lightning talks
- Single-blind, single-stage review; submission through PCS
- Accepted papers published by the Eurographics Association in the Eurographics Digital Library
- Not listed in ICORE2026 or the CCF list
