notes:
- Long-running workshop on data warehousing, OLAP and analytics, held with EDBT/ICDT
- Renamed for 2027 from "Design, Optimization, Languages and Analytical Processing of Big Data" (the CORE portal lists it as Data Warehousing and OLAP)
- Open proceedings in CEUR-WS since 2017 (2026 Vol-4186, 2025 Vol-3931)
- Full papers up to 12 pages, short papers up to 6, single-blind review by 3 PC members via CMT
- Best papers invited to a special issue of Information Systems
- CORE C (ICORE2026); not on the CCF 2026 list
