notes:
- Organized by SoICT, Hanoi University of Science and Technology; held in Vietnam every December (2023 Ho Chi Minh
  City, 2024 Da Nang, 2025 Nha Trang, 2026 Ho Chi Minh City)
- Proceedings in Springer CCIS since 2024 (ACM ICPS up to 2023)
- Tracks include Recent Advances in Cyber Security, Networking and Communication Technologies, AI Foundations and
  Big Data, and Generative AI
- Selected papers invited to a Multimedia Tools and Applications special issue; late-deadline Lifelogging track
