notes:
- Workshop on network observability (telemetry, eBPF, AI-driven anomaly detection and troubleshooting), co-located with
  ACM SIGCOMM; 1st edition at SIGCOMM 2025 in Coimbra
- Papers appear in the ACM Digital Library as Proceedings of the 1st Workshop on Next-Generation Network Observability
- Short papers up to 6 pages including references; 2-page lightning papers plus 1 page of references; double-blind
- Half-day workshop; nine papers in the 2025 program
- No NGNO workshop is listed among the SIGCOMM 2026 workshops
- Not listed in the CORE portal (ICORE2026)
