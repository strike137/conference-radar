notes:
- Flagship conference of ISCA SIG-CSLP; nominally biennial since 1998 (2018 Taipei, 2021 Hong Kong, 2022 Singapore,
  2024 Beijing, 2026 Penang)
- Double-blind review; 4-page regular or 8-page long papers plus up to 2 pages of references; arXiv preprints allowed
- Focus on Chinese speech, but other languages and general NLP topics are welcome; working language English
- Technical sponsors IEEE, IEEE CIS and ISCA; one regular registration covers up to two papers, student registration
  cannot cover a paper
- '2026: three days of main conference (Nov 14 to 16) plus a tutorial day (Nov 17)'
