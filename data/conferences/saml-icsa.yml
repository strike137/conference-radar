language: english
frequency: annual
organizer: SAML organizing committee, co-located with IEEE ICSA
organizer_country: [europe, australia]
proceedings: IEEE Xplore (ICSA Companion Proceedings)
archival: true
typical:
  deadline_months: [12, 2]
  conference_months: [3, 6]
links:
  website: https://saml-workshop.github.io/saml2027/
notes:
- Workshop on software architecture for machine learning (SA4ML) and machine learning for software architecture (ML4SA), co-located with IEEE ICSA
- Accepted papers are published in the ICSA Companion Proceedings in IEEE Xplore
- Does not take full research papers; short papers (5 pages plus 1 page of references) and registered reports (6 plus 2 pages) with a path to a full paper in ACM TOSEM
- Single-anonymous review with at least three reviews; abstract submission is mandatory
- At least one author must register and present in person; papers not presented are excluded from the proceedings
- "2027 theme: Software Architecture Meets Agentic AI; 2026 theme: LLM Agents and Software Architecture"
- 2027 co-chairs from Vrije Universiteit Amsterdam, ABB Corporate Research (Germany), CSIRO and Adelaide University (Australia)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
