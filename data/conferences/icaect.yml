notes:
- Annual electrical, electronics and computer engineering conference run by Shri Shankaracharya Technical Campus (SSTC), Bhilai, Chhattisgarh, India
- The 2027 edition is the seventh; proceedings of all six previous editions (2021 to 2026) are in IEEE Xplore
