links:
  website: https://determit2026.dei.unipd.it/
notes:
- Workshop on text difficulty, terminology-aware simplification and evaluation of readability across languages, including GenAI systems
- Held so far with LREC (LREC-COLING 2024 in Turin, LREC 2026 in Palma de Mallorca)
- Accepted papers appear in the official LREC workshop proceedings and the ACL Anthology
- Long papers up to 8 pages, short papers up to 4 pages, position papers up to 8 pages; submission via Softconf START
- Hybrid half-day event in 2026
- Related to the CLEF SimpleText track
- Not ranked in ICORE2026 and not on the CCF list
