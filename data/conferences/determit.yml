links:
  website: https://determit2026.dei.unipd.it/
notes:
- Workshop on text difficulty, automatic text simplification and terminology, with a focus on LLM-based generation
- Held with LREC every two years so far (LREC-COLING 2024 Turin, LREC 2026 Palma de Mallorca)
- Linked to the CLEF SimpleText track
- Long and position papers up to 8 pages, short papers up to 4 pages, LREC style; submission via START
- Proceedings published by ELRA and hosted in the ACL Anthology
- Best student paper award gives a free workshop registration
- Not ranked in CORE ICORE2026
