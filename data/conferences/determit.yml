organizer: University of Padua (Giorgio Maria Di Nunzio, Federica Vezzani) with Universite de Bretagne Occidentale, Elsevier and University of Amsterdam
organizer_country: [europe]
proceedings: ACL Anthology (LREC workshop proceedings, ELRA)
