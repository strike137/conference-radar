notes:
- Annual since 2021 in Vietnam; held in Hanoi in 2024 and 2025, the seventh edition (2027) at the University of Hai Duong
- Proceedings in Springer Lecture Notes in Networks and Systems (LNNS); the history page links Springer volumes for 2021 to 2025
- Broad scope covering AI, computer science, electronics, control, signal processing, networks and microwave engineering
- Submission via Microsoft CMT; the fee covers 6 pages, extra pages up to 10 cost 15 USD each
- "Registration 200 to 300 USD early, 250 to 350 USD late (2027)"
- Papers not presented at the conference are left out of the proceedings
- Not listed in the CORE ICORE2026 portal; regarded as a small regional venue
