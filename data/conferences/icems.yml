notes:
- Annual conference on electrical machines, power electronics, motor drives and energy systems, started in Beijing in 1987; 29th edition in 2026
- Rotates in Asia, hosted in turn by the Chinese, Korean and Japanese societies (2021 Gyeongju, 2022 Chiang Mai, 2023 Zhuhai, 2024 Fukuoka, 2025 Busan, 2026 Singapore)
- Usually in October or November
- Submission is a 1-page digest; accepted authors then send a 4 to 6 page final paper
- Papers go to IEEE Xplore and are EI indexed; selected papers are recommended to IEEE Transactions on Industry Applications
- 2026 edition financially sponsored by IEEE IAS and co-organized with the IEEE Singapore Section
- Co-located with the SCEMS conference in 2026
- Not listed in ICORE2026 (CORE portal) and not on the CCF list
