notes:
- Co-located with NDSS Symposium in San Diego, held on the Friday after the main conference (Feb 27, 2026)
- 'Topics: LLM-assisted fuzzing, code analysis and verification, vulnerability detection, hardware and software
  security; organizers are mostly hardware security researchers'
- Double-blind, up to 10 pages excluding references and appendices, IEEE double-column; papers posted on the NDSS
  site; best paper award
- Also runs a 4-hour LLM for Security student competition (hardware Trojan and software bug tracks) with community-submitted
  challenges
- First edition in 2026 (not in the NDSS 2025 co-located list); 10 of 22 submissions accepted. NDSS 2027 moves to
  Seoul, Korea (March 22 to 26, 2027); a LAST-X 2027 edition there is not announced yet
