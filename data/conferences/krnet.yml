notes:
- Korea's long-running Internet technology conference, held every year since 1993; 34th edition in 2026
- Two days in late June at El Tower (Yangjae), Seoul
- Program of invited keynotes, tutorials and track talks (6G, AI networking, security, policy); no open call for
  papers
- Talks mostly in Korean by industry, ETRI and government agency speakers; 545 registrants in 2026
- Useful for meeting Korean industry and public research institutes rather than for publishing
