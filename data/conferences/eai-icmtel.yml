notes:
- EAI conference on multimedia processing with AI and large language models (vision, NLP, multimodal fusion, AIGC)
- Proceedings published by Springer (LNICST author kit); selected papers invited to MONET or WINET journals
- Regular papers 12 to 20 pages, short papers 6 to 11 pages; submission via Confy+
- Main track and late track with separate deadlines
- 7th edition in 2025 (Changsha); earlier editions in Leicester (2020, 2024) and online (2021 to 2023)
- Not listed in ICORE2026
