notes:
- One-day workshop on AI-powered IDEs, LLM-based coding assistants and agents, and human-AI collaboration in software development
- First edition held with FSE 2025 in Trondheim, Norway, on June 27, 2025
- Accepted papers appear in the ACM Digital Library and the FSE companion proceedings; authors may opt for non-archival presentation only
- Research papers up to 8 pages, industry papers 4 or 8 pages, new idea and position papers up to 4 pages, all including references
- Not the same venue as the ICSE IDE workshop (ide-icse)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
