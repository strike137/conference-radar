notes:
- Workshop on data mining in finance, including trustworthy financial data mining, financial LLMs and agentic workflows for trading
- Held with the IEEE International Conference on Data Mining (ICDM), so the location rotates with ICDM (Shanghai 2023, Abu Dhabi 2024, Washington DC 2025)
- Organized mainly by the FinTech team of E Fund, a Chinese asset manager
- Accepted papers published in the ICDMW proceedings by the IEEE Computer Society Press
- Regular papers up to 8 pages plus 2 pages of references, short papers up to 4 pages plus 1; triple-blind review
- 2025 was the 3rd edition; no 2026 edition appears on the ICDM 2026 workshop list
- Not ranked by CORE (not in ICORE2026) or CCF
