full_name: International Conference on Artificial Intelligence Future Implementations
type: conference
tier: minor
areas: [ai]
region: southeast-asia
language: english
frequency: annual
organizer: Faculty of Science and Engineering, Universitas Perwira Purbalingga (UNPERBA)
organizer_country: [indonesia]
proceedings: IEEE Xplore
archival: true
fee: 275 to 350 USD for overseas authors, 2,750,000 to 3,500,000 IDR for local authors (2026)
typical:
  deadline_months: [7]
  conference_months: [10]
links:
  website: https://icaifi.unperba.ac.id/
notes:
- Run by the Faculty of Science and Engineering, Universitas Perwira Purbalingga, Central Java, Indonesia; first
  edition in 2025
- Steering committee includes a member from the IEEE Indonesia Section
- 2025 proceedings are in IEEE Xplore; accepted and presented 2026 papers will be submitted to IEEE Xplore (no-show
  policy)
- Broad AI scope plus applications in transportation, power and energy, and computational methods
- One-day hybrid event; papers in IEEE format via EDAS, extra fee for papers longer than 6 pages
- Not listed in ICORE2026 and not on the CCF list
