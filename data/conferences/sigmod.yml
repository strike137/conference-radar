notes:
- Flagship database conference of ACM SIGMOD, held jointly with PODS
- Four submission rounds a year (January, April, July, October); accepted papers appear in PACMMOD journal issues,
  with a revision option
- Double-anonymous review; for 2027 an author may submit at most 10 research papers, and rejected papers face a
  one-year embargo
- 2026 edition was held in Bengaluru, India; student travel grants are offered each year
