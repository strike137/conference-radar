notes:
- Annual domestic conference of the System Integration (SI) Division of SICE (Society of Instrument and Control
  Engineers), covering robotics and system integration
- Open to anyone; presenters do not need SICE membership
- Papers are 1 to 6 pages (A4, two columns); videos can be attached
- Preprints are released as a password-protected PDF download for registered participants; no peer review is mentioned
- Held every December in a different Japanese city (Morioka 2024, Hiroshima 2025, Osaka 2026)
- The same division steers the international IEEE/SICE SII symposium
- Deadlines are usually extended by about a week
