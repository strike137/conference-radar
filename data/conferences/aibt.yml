id: aibt
name: AIBT
full_name: International Conference on Artificial Intelligence and Blockchain Technology
type: conference
tier: minor
areas: [ai, security]
region: china
language: english
frequency: annual
organizer: Commercial conference secretariat (contact aibt@young.ac.cn) with Chinese host universities (East China Normal University and Southwest Jiaotong University in 2026)
organizer_country: [china]
proceedings: ACM ICPS (ACM DL, open access)
archival: true
indexing: [EI Compendex, Scopus]
typical:
  deadline_months: [10]
  conference_months: [11]
links:
  website: https://www.aibt.net/
notes:
- Annual; 5th edition in 2026 in Shanghai
- Topics cover AI foundations, blockchain systems and security, AI for blockchain, blockchain for AI and applications
- Double-blind review; accepted papers in ACM ICPS with open access, submitted to EI Compendex and Scopus
- One registration covers eight pages; extra pages charged
- Selected papers can go to a special issue of the MDPI journal Electronics
- Short cycle (submission about four weeks before the conference); submission via zmeeting
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
