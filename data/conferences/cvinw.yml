notes:
- Workshop on large multimodal models, vision-language-action systems and open-world visual recognition
- Editions at ECCV 2022, CVPR 2023, CVPR 2024, CVPR 2025 and CVPR 2026 (5th edition)
- Papers up to 8 pages excluding references, double-blind review on OpenReview
- Accepted papers are not archived in the CVPR proceedings
- Also runs challenges (MindCube and SITE-Bench spatial reasoning benchmarks in 2026)
- Not listed in ICORE2026 or the CCF list
