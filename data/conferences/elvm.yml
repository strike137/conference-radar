notes:
- CVPR workshop on computational efficiency of training, adaptation and inference for large vision and generative models
- 1st edition at CVPR 2024 in Seattle, 2nd at CVPR 2025 in Nashville; not in the CVPR 2026 workshop list
- Long papers up to 8 pages go into the CVPR Workshops proceedings; short papers up to 4 pages for early ideas
- Submission via Microsoft CMT in CVPR format
- 18 papers on CVF Open Access for 2025, 15 for 2024
- Not listed in ICORE2026 or the CCF list
