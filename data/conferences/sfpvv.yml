notes:
- Symposium on formal, testing-based and AI approaches to software fault prevention, verification and validation
- Steering committee chaired by Shaoying Liu (East China Normal University); supported by ECNU and Hiroshima University
- Regular papers (up to 18 pages, LNCS format) go to Springer LNCS; presentation papers (2-page extended abstracts) are not published
- First edition 2024 (proceedings in Springer LNCS 2025); second edition 2025 in Shanghai at ECNU
- Not listed in ICORE2026
