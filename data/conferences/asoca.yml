notes:
- Workshop on adaptation and reconfiguration of service-oriented and cloud applications (monitoring, diagnosis, repair, autonomic computing)
- Held every year with ICSOC since 2016; 2026 is the 11th edition, so the location follows ICSOC (Shenzhen 2025, Lodz 2026)
- Run by the ReDCAD lab (Tunisia) with LAAS-CNRS (France)
- Full papers up to 12 pages in LNCS format including references, at least three reviewers per paper
- Accepted papers go into the ICSOC workshop proceedings in Springer LNCS
- Submission through the ICSOC EasyChair; at least one author must register under the ICSOC terms
- Best papers of the 2025 edition were invited to a special issue of Information and Software Technology
- Not listed in ICORE2026 or the CCF list
