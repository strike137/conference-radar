links:
  website: http://www.icetis.org/
notes:
- Annual since 2016 and held in China (online 2021, Sanya 2022, Dalian with a Leeds UK venue 2023, Hangzhou 2024 and 2025, Guiyang 2026)
- Run by a commercial conference service (AEIC/AiScholar) with a different host university each year
- 2026 papers to be published by IEEE (ISBN 979-8-3195-1733-3) and submitted to IEEE Xplore, EI Compendex, Scopus and Inspec
- Earlier editions went to IOP Journal of Physics Conference Series (2020 and 2021)
- Broad scope covering electronics, computer engineering and information science
- Presenter (abstract only) and listener registration are also offered
- Not listed in CORE ICORE2026 or the CCF list
