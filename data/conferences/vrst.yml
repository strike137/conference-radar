notes:
- Sponsored by ACM SIGCHI and ACM SIGGRAPH; accepted papers are published in the ACM Digital Library (VRST collection)
- CORE B (ICORE2026); a long-running VR/AR/XR venue, 32nd edition in 2026
- Double-blind review; abstract due one week before the paper; full papers 4 to 9 pages plus references; one revision round before final decisions
- Accepted papers must be presented in person; posters and demos have a later deadline
- "Recent hosts: Osaka 2021 and Tsukuba 2022 (hybrid), Christchurch 2023, Trier 2024, Montreal 2025, Sendai 2026 (RIEC, Tohoku University)"
