notes:
- IEEE Sensors Council conference on applications of sensors and sensing, held in India every year since 2023
- Editions in Bengaluru 2023, Goa 2024, Hyderabad 2025, New Delhi 2026 and Hyderabad 2027 (BITS Pilani Hyderabad campus)
- "Option A: 4-page paper (references included) reviewed by the TPC and published in the conference proceedings (IEEE Xplore)"
- "Option B: paper submitted to IEEE Sensors Letters and, if accepted, published in the journal and presented at the conference"
- Has a live demo track, student research forum, startup summit, industry day and student competitions
- Sensors venue outside the usual CS rankings, not listed in ICORE2026
