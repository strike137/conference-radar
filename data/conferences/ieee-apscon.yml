full_name: IEEE Applied Sensing Conference
type: conference
tier: minor
areas: [communications]
region: south-asia
language: english
frequency: annual
organizer: IEEE Sensors Council, with Indian host institutions (BITS Pilani Hyderabad in 2027)
organizer_country: [international, india]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [10]
  conference_months: [1, 2, 3]
links:
  website: https://2027.ieee-apscon.org/
notes:
- IEEE Sensors Council conference on applications of sensors and sensing, always held in India so far (Bengaluru 2023, Goa 2024, Hyderabad 2025, New Delhi 2026, Hyderabad 2027)
- 2027 is the 5th edition, at BITS Pilani Hyderabad Campus
- 4-page papers in the IEEE conference template; papers over 4 pages are rejected without review
- "Option A: conference paper reviewed by the TPC and published in the proceedings (IEEE Xplore)"
- "Option B: paper submitted earlier to IEEE Sensors Letters, published in the journal if accepted and presented at the conference"
- Industry day, sensors startup summit, students research forum, live demos and the MYOSA student competition
- Author registration about 300 to 475 USD early (2027), with lower rates for low income countries
- Sensors venue outside the usual CS rankings, not listed in ICORE2026
