notes:
- Workshop on software architecture for LLM-based agents, multi-agent systems and human-agent collaboration, co-located with IEEE ICSA
- First edition in 2027 at ICSA 2027 in Sydney
- Accepted papers are published in the ICSA 2027 Companion Proceedings in IEEE Xplore
- Research papers up to 8 pages and short papers up to 4 pages in IEEE Computer Society format
- At least three reviews per paper; best paper award
- Full-day interactive format with keynote, paper sessions, breakout groups and a panel
- Organizers from RMIT University (Australia), Gran Sasso Science Institute (Italy), Anglia Ruskin University (UK), Dalian University of Technology (China) and Missouri S&T (USA)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
