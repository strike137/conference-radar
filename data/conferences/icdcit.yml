notes:
- Started in 2004 (formerly Distributed Computing and Internet Technology); hosted by KIIT in Bhubaneswar, India,
  and held in January since 2016 (earlier editions in December or February, 2007 in Bangalore, 2008 in New Delhi)
- Proceedings in Springer LNCS; double-blind review; papers up to 16 pages in LNCS format
- 'Three tracks: Distributed Computing, Intelligent Technology, AI for Science; selected papers invited to a Theoretical
  Computer Science special issue'
- 'Ranked National: India in ICORE2026; co-located PhD, student research and industry symposia plus a project contest
  and hackathon'
