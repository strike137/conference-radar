notes:
- Biennial flagship conference of the Asian Control Association (ACA, secretariat in Seoul); first held in Tokyo in 1994
- Rotates within Asia and Oceania (2017 Gold Coast, 2019 Kitakyushu, 2022 Jeju, 2024 Dalian, 2026 Bali)
- Control and automation in a broad sense, including AI, robotics, cyber-physical systems and security, and communication
- Regular and invited session papers are 6 pages (up to 2 extra pages for a fee) in IEEE format via PaperCept and are
  submitted to IEEE Xplore
- 2-page position papers go into the conference proceedings only, not IEEE Xplore
- Submission deadline was extended by about a month in 2026; not listed in CORE ICORE2026
