id: ieee-iemcon
name: IEEE IEMCON
full_name: IEEE Annual Information Technology, Electronics and Mobile Communication Conference
type: conference
tier: minor
areas: [communications, networking, general, ai]
region: north-america
language: english
frequency: annual
organizer: Smart Society (financial sponsors IEEE Region 1 and Region 2; same team as IEEE UEMCON, CCWC and AIIoT)
proceedings: IEEE Xplore
archival: true
fee: 725 USD IEEE member, 825 USD non-member (2026, early author registration; regular 825 / 925 USD)
typical:
  deadline_months: [8, 9]
  conference_months: [9, 10]
links:
  website: https://ieee-iemcon.org/
notes:
- IEEE-branded conference run by the Smart Society team that also runs IEEE UEMCON, CCWC and AIIoT
- Technical co-sponsors listed as IEEE USA, IEM Kolkata and UEM Kolkata
- Accepted and presented papers are submitted to IEEE Xplore (2026 conference record 70252)
- Held at the University of British Columbia, Vancouver from 2015 to 2019, virtual from 2020 to 2022, and at UC
  Berkeley since 2024; no 2023 edition is listed on the site
- 2026 was the 17th edition
- Double-blind review; regular papers up to 7 pages, short work-in-progress papers up to 6 pages (extra pages cost
  extra)
- Short cycle of about six weeks from submission deadline to conference; physical presentation required
- Not listed in CORE ICORE2026; generally regarded as a low-selectivity venue
