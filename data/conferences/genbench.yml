notes:
- Workshop on generalisation in NLP and how to evaluate it, especially for LLMs; grew out of the GenBench taxonomy project
- Held with EMNLP 2023 (Singapore) and EMNLP 2024 (Miami)
- Runs a Collaborative Benchmarking Task alongside regular papers (2024 task on distribution shift for MMLU, HumanEval and
  SiQA)
- Archival papers up to 8 pages; non-archival extended abstracts up to 2 pages; double-blind review on OpenReview
- Proceedings in the ACL Anthology (14 papers in 2024, 19 in 2023)
- Amazon sponsored a best paper award and five student travel scholarships of up to 750 USD (2024)
- Not ranked in ICORE2026 and not on the CCF list
