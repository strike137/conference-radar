notes:
- Cybersecurity conference run by a committee centred on Sohar University (Oman) and the British University in Dubai, with a rotating host university
- Editions in 2022 (October), 2024 (February), 2025 (July, Dubai) and 2026 (December, Irbid National University, Jordan)
- Proceedings of 2022, 2024 and 2025 are in IEEE Xplore; the 2025 volume (IEEE CFP25CK4-POD) runs to 2,685 pages in 4 volumes
- 2026 is hybrid, first day in person in Irbid and second day online; the site shows an IEEE Jordan Section logo
- Very short review cycle in 2026 (notification five days after the submission deadline)
- Extended papers can go to MDPI special issues (Cryptography, Computers, Computation) with an APC discount
- Not listed in the CORE ICORE2026 portal
