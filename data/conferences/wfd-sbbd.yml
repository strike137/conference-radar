notes:
- Satellite workshop of SBBD, the Brazilian Symposium on Databases run by the Brazilian Computer Society (SBC)
- Topics are data fusion, multimodal data integration and intelligent systems
- Papers up to 6 pages in English or Portuguese (English abstract required), SBC template, submitted via JEMS
- Accepted papers appear in the Anais Estendidos do SBBD (ISSN 2966-3946) in SBC OpenLib (SOL), each with a DOI
- Selected papers must be presented by a student registered for SBBD
- One-day workshop on the first day of SBBD 2026 in São Carlos; 2026 had 9 accepted papers, a keynote and a panel
- No earlier editions are listed on the SBBD site
- Not listed in CORE ICORE2026
