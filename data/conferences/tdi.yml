notes:
- Small workshop on digital identity (wallets, verifiable credentials, eIDAS, authentication, SSI) run by the FBK Security & Trust unit in Trento
- Always co-located with another event in Italy so far (2023 SACMAT, 2024 OAuth Security Workshop, 2025 ITASEC & SERICS, 2026 a NIS2 event in Verona)
- Accepted papers go to open-access CEUR-WS post-proceedings, indexed by Scopus and DBLP (2026 -> CEUR Vol-4257)
- Regular papers 10 to 12 pages, short papers 5 to 9 pages, CEURART one-column template, double-blind review via EasyChair
- From 2026 also has an open call for talks besides scientific papers; at least one author must present in person
- Date in the year moves with the host event (Feb to June)
