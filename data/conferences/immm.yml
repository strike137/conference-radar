notes:
- Organized by IARIA as part of the DataSys congress, co-located with other IARIA events (17th edition in 2027)
- Published open access in the IARIA ThinkMind library by IARIA Press; prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in southern Europe (Valencia, Porto, Nice, Venice, Lisbon in recent years)
- Covers information mining, data mining and information management; the 2027 edition moves from April to March
