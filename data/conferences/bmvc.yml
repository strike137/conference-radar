notes:
- Annual conference of the British Machine Vision Association (BMVA), a UK charity; held at a different UK university
  city each year (2025 Sheffield, 2026 Lancaster)
- Single-track meeting with oral and poster presentations; workshop sessions on the last day
- Double-blind review on OpenReview; 14 pages excluding references; community reviewing (authors must review)
- Proceedings published by BMVA on the conference website (open access); top papers invited to an IJCV special issue
- ICORE2026 rank A; CCF C (artificial intelligence)
- One full registration covers up to two papers; registration accessibility grants offered for fee waivers
