notes:
- Biennial international symposium organized by Warsaw University of Technology, aimed mainly at students, PhD candidates and early-career researchers
- Topics span signal processing, radar, radioelectronics, telecommunications and computer science
- Held in Poland since 2003 (Warsaw 2025, Karpacz 2023, Lodz 2021, Krakow 2019); Vilnius in 2010 was the only edition abroad
- Papers up to 6 pages in IEEE A4 conference format; selected papers are submitted to IEEE Xplore, only if presented at the event
- Technically sponsored by IEEE, IEEE SPS and IEEE AESS (2025)
- 2025 edition had 48 extended abstracts, 36 accepted for peer review and 30 oral presentations
- Runs a Young Scientist Contest for authors under 35 and a student research group project competition
- Not listed in ICORE2026
