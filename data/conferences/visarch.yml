notes:
- Workshop on systems and hardware for neural rendering (NeRF, Gaussian splatting), AR/VR/XR and embodied visual AI
- First edition with ASPLOS 2026 (Pittsburgh, March 2026) as Workshop on Systems and Architectures for Neural Rendering, AR/VR, and Visual Computing
- Second edition with ISCA 2026 (Raleigh, June 2026), renamed to cover embodied intelligence
- Papers up to 4 pages plus references in ACM sigplan format, anonymous; previously published work and work in progress welcome
- The CFP states that proceedings will not be published; accepted paper PDFs are linked from the site
- Not listed in CORE ICORE2026 and not on the CCF list
