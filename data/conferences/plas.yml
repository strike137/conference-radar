notes:
- One-day workshop co-located with ACM CCS; location follows CCS (2023 Copenhagen, 2024 Salt Lake City, 2025 Taipei,
  2026 The Hague)
- Long-running series (21st edition in 2026); labeled an ACM SIGPLAN workshop up to 2018 and ACM SIGSAC since 2019
- 'Non-archival: no published proceedings, papers are made available to participants only and can
  be published elsewhere'
- Long papers with no page limit and short papers of at most 2 pages plus references; single-blind review via HotCRP
- Topics include side channels, software isolation, compiler hardening, program and binary analysis, fuzzing,
  protocol verification and information flow
- Not listed in ICORE2026
