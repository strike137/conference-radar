id: wikinlp
name: WikiNLP
full_name: Workshop on Advancing Natural Language Processing for Wikipedia
type: workshop
tier: minor
areas: [nlp, data]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizing committee (2025 program chairs from Aarhus University, Wikimedia Foundation, Hugging Face, Carnegie Mellon University, Stanford University and University of Mannheim); co-located with EMNLP or ACL
organizer_country: [international]
proceedings: ACL Anthology
archival: true
indexing: [ACL Anthology]
typical:
  deadline_months: [4, 9]
  conference_months: [8, 11]
links:
  website: https://meta.wikimedia.org/wiki/NLP_for_Wikipedia_(ACL_2025)
notes:
- Workshop on NLP research using Wikimedia data and on NLP tools that help the Wikimedia community, including low-resource language editions
- Held with EMNLP 2024 (Miami) and ACL 2025 (Vienna); the website is hosted on Meta-Wiki
- "2025 tracks: Wikimedian provocations (non-archival), datasets (archival, up to 8 pages, double-blind with three reviewers) and ongoing or published work (non-archival)"
- Only the archival track goes to the ACL Anthology (13 papers in 2024, 4 in 2025)
- Not ranked in ICORE2026 and not on the CCF list
