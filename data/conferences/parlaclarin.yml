notes:
- Workshop on building, annotating, analysing and linking parliamentary corpora for NLP, digital humanities and social science research
- Supported by CLARIN ERIC; held with LREC every two years (2018 Miyazaki, 2020, 2022 Marseille, 2024 LREC-COLING Turin, 2026 Palma de Mallorca)
- Theme changes per edition; 2024 was Creating, Analysing, and Increasing Accessibility of Parliamentary Corpora
- Long (8 pages), short (4 pages) and demo (4 pages) papers via the LREC START system; proceedings in the ACL Anthology
- Half-day workshop in 2026
- Not ranked in ICORE2026 and not on the CCF list
