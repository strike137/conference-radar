id: fdse
name: FDSE
full_name: International Conference on Future Data and Security Engineering
type: conference
tier: minor
areas: [data, security, ai]
region: southeast-asia
language: english
frequency: annual
organizer: Vietnamese universities (HCMUT/VNU-HCM historically; 2026 organizations include HCMC University of Science,
  Van Lang University and HCMC Open University) with JKU Linz, Austria
organizer_country: [vietnam, europe]
proceedings: Springer CCIS
archival: true
indexing: [Scopus, EI, DBLP, CPCI]
rank:
  core: Unranked
acceptance_rate: 31% (2025, 66/215 including 10 short papers)
fee: 400 USD full paper, 300 USD short paper (2026, regular registration)
typical:
  deadline_months: [6, 7, 8]
  conference_months: [11]
links:
  website: https://thefdse.org/
  dblp: https://dblp.org/db/conf/fdse/index.html
notes:
- Held every November in Vietnam since 2014, mostly in Ho Chi Minh City (also Can Tho, Nha Trang, Da Nang and Binh
  Duong; virtual in 2020 and 2021)
- Two submission rounds each year, each extended by 1 to 3 weeks; submission through Springer Meteor
- 'Proceedings in Springer LNCS 2014 to 2021 (plus a CCIS volume in 2020 and 2021), CCIS only since 2022 (2026:
  CCIS 3238 and 3239); selected papers invited to SN Computer Science'
- Acceptance rate about 31% (2025); scope is broad data engineering and ML, with security as one part
