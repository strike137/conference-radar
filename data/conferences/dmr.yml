notes:
- Workshop on the design, annotation, parsing and use of meaning representations (AMR, UMR, DRT, UCCA and others)
- Held since 2019 (ACL 2019); no edition in 2022, annual since 2023
- Recent hosts IWCS 2023 Nancy, LREC-COLING 2024 Torino, SyntaxFest 2025 Prague and LREC 2026 Palma de Mallorca; 2020 edition (COLING) was online and 2021 was joint with LAW at EMNLP in Punta Cana
- All proceedings in the ACL Anthology
- DMR 2026 hosted the first shared task on parsing to Uniform Meaning Representation
- DMR 2027 (8th edition) has been proposed for the 2027 ACL conference cycle; host conference and dates not yet announced
- Not ranked in ICORE2026 and not on the CCF list
