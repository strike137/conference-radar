notes:
- Organized by the Internet Society; one of the 'Big 4' security conferences, focused on practical network and system
  security
- Two review cycles (summer around April/May, fall in August); double-blind; two-round review with early reject;
  minor and major revision options; at most 6 submissions per author per cycle
- Usually held in San Diego, USA; NDSS 2027 moves to Seoul, Korea (22 to 26 March 2027), a rare chance to attend
  in Asia
- Open access proceedings; many co-located workshops (e.g., SpaceSec, MADWeb)
