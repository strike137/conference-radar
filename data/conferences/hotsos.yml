notes:
- Hosted by the US National Security Agency as part of its Science of Security program; general chair from NSA
- Held virtually every year since 2020 (in person in the USA from 2014 to 2019)
- Three days of keynotes, invited talks, work-in-progress (WiP) sessions, panels and posters/demos
- "Paper types (2026): already published papers (presentation only), unpublished WiP papers up to 10 pages ACM
  double-column, and 2-page poster/demo abstracts"
- Submission through OpenReview; government and industry talk proposals go directly to the program chairs
- Proceedings were published by ACM up to 2021; WiP papers are now only distributed confidentially to discussants and
  attendees (no proceedings), posters/demos listed on the website
- Not ranked in CORE (ICORE2026)
