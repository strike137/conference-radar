notes:
- Small practitioner security congress in Donostia/San Sebastian, Spain, run by the non-profit Basque security association EuskalHack
- Held since 2016 (editions 2016 to 2019 and every year since 2022); 9th edition in 2026
- One day of talks plus a day of workshops, open space and CTF style activities; talks mostly in Spanish, some in English
- No proceedings; speaker slides published as PDFs on the congress page
- Not listed in CORE ICORE2026
