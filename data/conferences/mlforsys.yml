  website: https://mlforsystems.org/
notes:
- Workshop on applying machine learning to computer systems problems (compilers, architecture, databases, networking, scheduling, LLM serving)
- Held with NeurIPS every year since 2018, plus one edition at ISCA 2019; moves with NeurIPS (2026 in Sydney, Australia)
- 2026 is the 10th edition
- Non-archival, the CFP states there are no formal proceedings, so papers can be published elsewhere
- Up to 4-page extended abstracts in the NeurIPS format, submitted through OpenReview; submissions do not have to be anonymized
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
