notes:
- One of the largest Linux and open source community events in the German-speaking world, held since 1999
- Held every year on a weekend in March in the central lecture hall building of TU Chemnitz, Germany
- Program is mostly in German; around 90 talks plus workshops, exhibitor booths and the CLT-Junior program for kids
- Around 3500 visitors in 2025; 2021 and 2022 were held online
- Talks, workshops, CLT-Junior and booth contributions are submitted through a web form after the call for lectures (usually November)
- No papers or proceedings; most talks are recorded and live streamed
