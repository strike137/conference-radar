notes:
- Held as a workshop of ARES (International Conference on Availability, Reliability and Security) in Europe every August;
  2026 edition co-located with the 21st ARES
- ARES papers including workshop papers are published in Springer LNCS since 2025; workshop papers up to 18 pages
  including references, double-blind review
- Trusted and confidential computing (TPM, DICE, TEEs, confidential containers), post-quantum crypto-agility, PUFs,
  attested updates and trust-based cyber resilience for IoT, OT, cloud and CPS
- 2026 chairs from Fraunhofer SIT / ATHENE (Germany) and University of Sussex (UK)
- Not listed in CORE ICORE2026
