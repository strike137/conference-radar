notes:
- Run by BRIN, Indonesia's national research agency (Research Organization for Electronics and Informatics; secretariat
  at the Research Center for Telecommunication)
- Covers radar and remote sensing, antennas and propagation, RF and microwave, electronic devices, wireless and wired
  communications, signal processing and mechatronics
- Proceedings in IEEE Xplore every year from 2015 to 2025; Scopus indexed per the site
- Held in Bandung (2024 virtual, 2025 hybrid, 2027 on site with live broadcast)
- Moved from November (2025) to June (2027); no 2026 edition listed on the BRIN conference site
- Deadlines are usually extended by weeks or months
- Not listed in ICORE2026 or the CCF list
