notes:
- Organized by CESAT (Centres of Excellence in Science and Applied Technologies), Pakistan; held since 2002 (23rd edition in 2026)
- Held in Bhurban, Murree Hills near Islamabad; the 2026 Medical Sciences track was held in Islamabad
- Multidisciplinary applied science venue with tracks on advanced materials, aerostructures, AI and software technologies,
  control and signal processing, medical sciences, underwater technologies, and wireless communication and radar
- Blind review by track committees; accepted and presented papers that pass an IEEE quality review go to IEEE Xplore
  (proceedings from 2007 to 2024 linked on the official site)
- Out-of-scope papers may go to a separate special issue; submission via EasyChair in IEEE format
- The registration page says participation is limited and by invitation only
- Not listed in ICORE2026 or the CCF 2026 list
