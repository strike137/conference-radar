notes:
- Engineering conference of Multimedia University, Malaysia; 7th edition in 2026
- One of six co-located conferences of DIFCON, MMU's yearly academic congress (with CITIC, ICTIM, ICCM, CLESS and ICLD)
- Held at MMU Cyberjaya in hybrid mode (on-site or virtual)
- 2026 tracks focus on communications and networking (6G, antennas and RF, cognitive radio, IoT, vehicular networks, AI for communications)
- Proceedings in IEEE Xplore for 2024 and 2025; 2023 in AIP Conference Proceedings, 2022 in Atlantis Press
- Selected papers can be invited to Scopus or MyCite indexed journals
- Abstract and full paper deadlines were extended in 2026; late authors may submit a full paper directly
- Not ranked by CORE (ICORE2026); not in the CCF list
