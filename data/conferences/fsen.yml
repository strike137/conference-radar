notes:
- Formal methods for software engineering conference; series started by IPM in Tehran (older editions at fsen.ir)
- Biennial; held in Tehran until 2023 (2021 virtual), then in Europe (2025 Vasteras, Sweden; 2027 Enschede, Netherlands)
- Papers in Springer LNCS (2015 to 2023 as revised selected papers); selected papers invited to a Science of Computer Programming special issue
- Full papers up to 16 pages and short papers up to 6 pages excluding references (2027); single-blind review; posters are not in the proceedings
- Small two-day event; not ranked in ICORE2026 and not on the CCF 2026 list
