notes:
- Hacker and information security conference in Omaha, Nebraska, first held in 2019
- Started by local security professionals from the Omaha DEF CON Group, NebraskaCERT and OWASP Omaha
- Two days of talks, villages and competitions at the Hilton Omaha, with two days of paid pre-conference training
- "2027 theme: Algo(Rhythm); 2026 was Off Grid (April 9-10, 2026)"
- No published proceedings; talks are not streamed, some recordings are posted later
