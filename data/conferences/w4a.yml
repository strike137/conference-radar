notes:
- Web accessibility research conference, always co-located with the ACM Web Conference (TheWebConf), so it moves around the world with it
- Proceedings published with ACM and available in the ACM Digital Library
- Technical papers up to 10 pages and communication papers (work in progress, experience reports) up to 4 pages, excluding references
- Submissions are not blinded; at least two and by default three reviewers per paper
- Also runs a Web Accessibility Challenge and a doctoral consortium; registration goes through the Web Conference
- 2026 edition was moved from April to 29 to 30 June 2026 and held remotely because TheWebConf 2026 in Dubai went online
- Recent hosts Lyon (2022), Austin (2023), Singapore (2024), Sydney (2025), Dubai (2026, online), Dublin (2027)
- Not listed in ICORE2026 or the CCF 2026 list
