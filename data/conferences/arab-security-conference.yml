notes:
- Cybersecurity practitioner conference in Cairo, Egypt, founded in 2017 by Dr. Bahaa Hasan and run by Arab Security Consultants
- 2026 is the 10th round, held at The Nile Ritz-Carlton, Cairo
- Two days of keynotes, managerial briefings and technical workshops, plus the Arab Security Cyber Wargames Championship and Arab Cybersecurity Awards
- Call for speakers reviewed by a committee of academics and industry members; vendor and product pitches are rejected
- No formal proceedings; sessions are recorded for ticket holders
- "Tickets for 2026: 20 to 30 USD for students, 45 to 65 USD for Egyptian professionals, 75 to 120 USD for corporate and non-Egyptian attendees"
