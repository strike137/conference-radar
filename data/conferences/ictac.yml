notes:
- Formal methods and theoretical computer science colloquium with an aim of cooperation between developing and industrial countries
- Proceedings in Springer LNCS; regular papers up to 16 pages, short and tool papers up to 8 pages, plus 2 pages of references
- Rotates worldwide (Lima 2023, Bangkok 2024, Marrakesh 2025, Bariloche 2026)
- Usually paired with a postgraduate school and satellite workshops
- CORE C, CCF C
