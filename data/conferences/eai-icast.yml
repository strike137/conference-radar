notes:
- Broad science and engineering conference with seven tracks; only Track 1 (AI and machine learning) and Track 2 (industrial automation, networking and communication systems) are EECS
- Track 1 and 2 papers go to the Springer EAI SICC book series; Tracks 3 to 7 (manufacturing, materials, energy, infrastructure) go to Springer Green Energy and Technology
- Hosted by Bahir Dar Institute of Technology and held every year in Bahir Dar, Ethiopia; 2026 edition was hybrid and the 14th
- Full papers 12 to 20 pages in Springer format; submission via Confy+
- Not listed in ICORE2026
