notes:
- Interdisciplinary workshop on analogical reasoning, metaphor and abstraction across computational linguistics, AI and cognitive psychology
- First edition with IJCAI 2024 in Jeju, Korea (informal proceedings); second edition (Analogy-Angle II) with ACL 2025 in Vienna
- 2025 proceedings in the ACL Anthology (9 archival papers); dissemination papers already published elsewhere are presented but not included
- Full papers up to 8 pages and short papers up to 4 pages, double-blind via OpenReview; ARR-reviewed papers also accepted
- Not ranked in ICORE2026 and not on the CCF list
