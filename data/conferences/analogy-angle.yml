notes:
- Interdisciplinary workshop on analogical reasoning across computational linguistics, AI and cognitive psychology
- 1st edition co-located with IJCAI 2024 in Jeju, 2nd edition (Analogy-Angle II) co-located with ACL 2025 in Vienna
- 2025 proceedings in the ACL Anthology (10 papers); dissemination papers already published elsewhere are presented
  but not included in the proceedings
- Accepts direct submissions and ARR-reviewed papers (2025)
- Small workshop; the 2024 edition received 11 submissions and accepted 7
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
