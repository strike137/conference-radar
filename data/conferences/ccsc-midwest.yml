notes:
- Regional computing education conference of the CCSC, aimed at teaching faculty and students at US colleges
- Papers are double-blind peer reviewed, up to twelve double-spaced pages
- Accepted papers appear in the Journal of Computing Sciences in Colleges; only works presented at the conference go to the ACM Digital Library
- Also panels, tutorials, workshops, nifty tools and assignments, works in progress and a student showcase
- 2026 edition is hybrid (in person or virtual) at Kenyon College, Gambier, Ohio
- Not listed in ICORE2026; not on the CCF list
