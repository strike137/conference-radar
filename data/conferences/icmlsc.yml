full_name: International Conference on Machine Learning and Soft Computing
type: conference
tier: minor
areas: [ai]
region: asia-pacific
language: english
frequency: annual
organizer: Commercial conference secretariat (contact icmlsc@163.com, zmeeting submission system) with host universities per edition
organizer_country: [china]
proceedings: Springer CCIS (revised selected papers, from 2025; ACM ICPS 2017 to 2024)
archival: true
indexing: [EI Compendex, Scopus]
fee: 580 USD regular, 520 USD student per full paper (2027); abstract only 450 USD; 12 pages included, 40 USD per extra page
typical:
  deadline_months: [10]
  conference_months: [1, 2]
links:
  website: https://www.icmlsc.org/
notes:
- Annual since 2017; Vietnam 2017 to 2020, virtual 2021 to 2023, Singapore 2024, Tokyo 2025 (Chuo University), Osaka 2026, Tokyo 2027
- Proceedings in Springer CCIS since 2025 (ICMLSC 2026 in CCIS 2948), ACM ICPS before that; stated as EI Compendex and Scopus indexed
- Run by a commercial conference secretariat (163.com contact address)
- Peer review by at least three reviewers per the site; abstract only presentation also offered
- Edition numbering on the site is inconsistent (Springer counts 2025 as the 9th and 2026 as the 10th; the site calls 2027 the 11th)
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
