notes:
- Annual optical communications and photonics conference held since 2001; the organizers call it the largest
  academic conference in Asia-Pacific on optical communications, optical sensing and photonics
- Held in a different Chinese city each year (2021 Shanghai, 2022 Shenzhen, 2023 Wuhan, 2024 Beijing, 2025
  Suzhou, 2026 Hangzhou); earlier editions also in Hong Kong and Busan
- Technically sponsored by IEEE Photonics Society, Optica, SPIE and Chinese societies; papers in IEEE Xplore
  (2024 edition held jointly with IPOC)
- Papers of 2 to 6 pages in IEEE two-column format; double-blind review from 2026; at least one author must
  register and present in person
- Late-breaking post-deadline papers (PDP, 3 pages) with a submission deadline about two weeks before the
  conference
- Not listed in ICORE2026; optics venue outside the usual CS rankings
