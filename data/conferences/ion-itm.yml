notes:
- Annual positioning, navigation and timing (PNT) meeting of the Institute of Navigation, held every January in
  California and co-located with PTTI (Precise Time and Time Interval Systems and Applications Meeting)
- Recent editions in Long Beach (2022 to 2025), Orange County 2026, Anaheim 2027 and Monterey 2028 and 2029
- Selection is based on abstracts; all ITM manuscripts are then peer reviewed once and designated primary or
  alternate papers
- Only manuscripts meeting ION peer review and editorial standards go into the conference proceedings on ion.org
- Topics include GNSS integrity and security (jamming, spoofing), LEO PNT, sensor fusion, AI/ML for navigation and
  receiver signal processing
- Presenting authors must register; in-person, in-person plus video, or on-demand only presentation options
- Authors may also submit their papers to NAVIGATION, the ION journal
- Navigation venue outside the usual CS rankings, not listed in ICORE2026 or the CCF 2026 list
