notes:
- Flagship venue of the IEEE TC on Security and Privacy, held since 1980; one of the 'Big 4' security conferences
  (nicknamed 'Oakland')
- Two submission cycles per year (June and November) with mandatory abstract registration one week earlier; double-blind;
  early-reject round and interactive rebuttal; no conditional accepts, accepted papers carry a public meta-review
- Held in San Francisco for many years; the 48th edition (2027) moves to Montreal, Canada, with workshops on the
  last day
- Very competitive (about 13% in 2026); at most 6 papers per author per cycle; rejected papers must wait one year
  before resubmission
- Proceedings are open access in the IEEE CS Digital Library; student travel grants are offered
