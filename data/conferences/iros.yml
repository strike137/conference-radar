notes:
- One of the two flagship robotics conferences together with ICRA; sponsored by IEEE RAS and the Robotics Society of Japan
- Accepted papers are published in IEEE Xplore as peer-reviewed archival publications
- 8 pages including references and appendices (no extra pages can be bought); double-anonymous review via PaperCept with an optional short video
- No RA-L+IROS submission option anymore; published RAM, RA-L, T-ASE and T-RO papers can be presented at IROS within an eligibility window
- Location rotates worldwide (Pittsburgh 2026, Florence 2027)
- CORE A (ICORE2026) and CCF C, so tier is major by the rank rule although it is widely seen as a flagship venue
