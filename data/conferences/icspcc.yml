organizer: IEEE Xi'an Section and IEEE Hong Kong Section (secretariat at Northwestern Polytechnical University)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI]
fee: 700 USD regular non-IEEE member, 660 USD IEEE member, 542 to 580 USD student (2026)
typical:
  deadline_months: [5]
  conference_months: [7]
links:
  website: http://www.icspcc.org/
notes:
- Initiated and run by IEEE Xi'an Section and IEEE Hong Kong Section since 2011; 2026 also sponsored by IEEE Wuhan Section
- Held in China every year except 2024 (Bali, Indonesia); Hong Kong 2025, Wuhan 2026
- Proceedings in IEEE Xplore; papers of no-show authors are excluded from Xplore
- Six pages max in IEEE format; tracks for signal processing, communications and computing plus special sessions
- Has a Best Student Paper Contest
- Not listed in ICORE2026 or the CCF list
