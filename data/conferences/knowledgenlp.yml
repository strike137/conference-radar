id: knowledgenlp
name: KnowledgeNLP
full_name: International Workshop on Knowledge-Augmented Methods for Natural Language Processing
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: irregular
organizer: Workshop organizing committee (2025 co-chairs from University of Washington, Tencent AI Seattle Lab, University
  of Notre Dame and UT Austin); co-located with AAAI 2023, KDD 2023, ACL 2024 and NAACL 2025
organizer_country: [usa]
proceedings: ACL Anthology
archival: true
acceptance_rate: 58% (2025, 28/48)
typical:
  deadline_months: [2, 5]
  conference_months: [5, 8]
links:
  website: https://knowledge-nlp.github.io/naacl2025/
notes:
- Workshop on knowledge-augmented NLP (retrieval, knowledge graphs, tool use, knowledge injection and editing, LLMs as
  knowledge bases)
- Moves between host conferences; AAAI 2023 (1st), KDD 2023 (2nd), ACL 2024 in Bangkok (3rd), NAACL 2025 in New
  Mexico (4th)
- Archival track papers go into the ACL Anthology (ACL 2024 and NAACL 2025 editions); a non-archival track is also
  offered
- Regular papers up to 8 pages in the ACL template; double-blind review via OpenReview
- 48 submissions and 28 accepted papers in 2025; best paper and best student paper awards in 2024
- Not listed in ICORE2026 and not on the CCF list
