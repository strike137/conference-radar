notes:
- One-day workshop co-located with IEEE INFOCOM; first held with INFOCOM 2026 in Tokyo
- Topics are the fusion of data, operational, information and communication technology (DOICT) for smart manufacturing, industrial IoT, digital twins, blockchain trust and Society 5.0 applications
- Accepted and presented papers appear in the IEEE INFOCOM 2026 proceedings and IEEE Xplore
- Papers up to 6 pages in IEEE two-column format including references, peer reviewed, submitted via EDAS
- Led by The University of Tokyo and the National Institute of Informatics with co-chairs from Chinese universities; supported by JST ASPIRE
- Deadlines were extended twice in 2026
- Not listed in ICORE2026
