notes:
- Standalone workshop sponsored by ACM SIGCOMM; held every November in the USA (2022
  Austin, 2023 Cambridge MA, 2024 Irvine, 2025 College Park, 2026 Salt Lake City); 2020 and 2021 were virtual
- Short position and early-stage idea papers (6 pages excluding references, ACM two-column format), blind review;
  accepted papers appear in the ACM Digital Library
- Highly regarded in the networking community despite the ranks (ICORE2026 National USA, CCF C); acceptance rate
  around 23 to 28%
- Attendance is limited and mostly by invitation; open registration slots are allocated by lottery and one author
  per accepted paper must attend in person
- From 2026 there are two paper categories (technical and perspective) and the first review round is based mainly on
  the abstract and introduction
- ACM Open Access from 2026; authors from institutions outside ACM Open pay an APC (subsidized to 250 USD for ACM/SIG
  members, 350 USD for non-members in 2026)
