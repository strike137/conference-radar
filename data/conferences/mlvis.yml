id: mlvis
name: MLVis
full_name: Machine Learning Methods in Visualisation for Big Data
type: workshop
tier: minor
areas: [vision, ai]
region: europe
language: english
frequency: annual
organizer: Daniel Archambault (Newcastle University), Ian Nabney (University of Bristol), Jaakko Peltonen (Tampere University), Eurographics
organizer_country: [europe]
proceedings: Eurographics Digital Library (MLVis workshop proceedings)
archival: true
typical:
  deadline_months: [4]
  conference_months: [5, 6]
links:
  website: https://events.tuni.fi/mlvis/
notes:
- Part-tutorial, part-workshop event on combining machine learning and visualisation (explainable ML, dimensionality reduction, visual analytics)
- Co-located with EuroVis every year since 2016 (Odense 2024, Luxembourg City 2025, Nottingham 2026); 2026 was the eleventh edition
- Short papers of at most 4 pages plus one page of references; submissions need not be blind
- Submission through PCS as a EuroVis track; deadlines 23:59 AoE
- Proceedings published by the Eurographics Association in the Eurographics Digital Library
- Small program (five contributed papers in 2026)
- Not listed in ICORE2026 or the CCF list
