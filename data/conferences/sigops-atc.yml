notes:
- Continues USENIX ATC; became an ACM SIGOPS conference in 2026 with the same community and scope
- Proceedings in the ACM DL under ACM Open Access from 2026; USENIX published the papers until 2025
- Broad practical systems scope (OS, distributed systems, storage, networking, ML systems, security)
- Double-blind review; a two-page extended abstract is reviewed first and papers below the bar are rejected early
- 2026 moved from July in the USA (co-located with OSDI until 2025) to November in Hong Kong; 135 papers accepted in 2026
- ICORE2026 rank A (listed as Usenix Annual Technical Conference) and CCF A (listed as ACM SIGOPS ATC, formerly USENIX ATC)
