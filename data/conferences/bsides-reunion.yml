notes:
- Community Security BSides conference on La Réunion (French overseas department in the Indian Ocean)
- Site in French; keynotes, talks and a CTF
- 2026 edition held at IUT de Saint-Pierre with over 80 participants and over 10 CTF teams
- 2027 edition at ESIROI, Terre-Sainte campus, Saint-Pierre
- Also runs the CTF of the CyberTour event organised by CLUSIR Réunion Océan Indien and Université de La Réunion
- Talks only, no proceedings
