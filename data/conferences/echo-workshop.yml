notes:
- Half-day workshop on systems, data movement, networking and AI across the edge, cloud and HPC continuum, held with SC
- First edition in 2026 (SC26, Chicago)
- Regular papers up to 8 pages and short papers up to 6 pages (excluding references), two-column IEEE proceedings template (changed from ACM)
- Single-blind review by at least 3 reviewers; submission through the SC submissions portal
- Accepted papers are published in the SC '26 proceedings
- The 2026 submission deadline was moved earlier, from August 20 to August 15, 2026
- Not listed in CORE ICORE2026
