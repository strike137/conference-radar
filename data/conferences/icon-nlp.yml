fee: 100 USD early for academic participants from outside the Indian subcontinent, 50 USD students (2024); NLPAI
  membership required
typical:
  deadline_months: [8, 9]
  conference_months: [12]
links:
  website: https://www.icon2026.org/
notes:
- Flagship conference of NLPAI (NLP Association of India); held in India in December, hosted by a different institute
  each time
- Proceedings in the ACL Anthology (2014 onward); emphasis on South Asian and low-resource languages
- Main conference plus tutorials, workshops, shared tasks and a doctoral consortium
- 'No 2025 edition: 21st was December 2024 in Chennai, 22nd is December 2026 in Guwahati'
- Not to be confused with IEEE ICON (International Conference on Networks); low registration fees
