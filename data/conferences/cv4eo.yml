  website: https://geoai.ornl.gov/cv4eo-wacv/
notes:
- Workshop linking the computer vision community with geoscience and remote sensing experts on Earth observation applications (disaster response, national security, environmental monitoring)
- Held with WACV every year since 2024, full-day program
- Full papers up to 8 pages in WACV format, double-blind review by at least 3 reviewers, published in the WACV Workshops proceedings
- Short papers up to 4 pages are presented as lightning talks and posters but are not in the proceedings
- Workshop takeaways and short papers invited to an extended article in IEEE JSTARS
- 16 papers in the WACV 2026 Workshops proceedings on CVF Open Access
- Not listed in ICORE2026 or the CCF list
