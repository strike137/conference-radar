notes:
- Non-profit, community-driven Security BSides event in Vienna, Austria, held since 2014; editions are numbered by year in hex (0x7EA = 2026)
- Free to attend, funded by sponsors; one-day event with talks and 15-minute lightning talks in English
- Held in November from 2022 to 2025 and in June from 2026
- Talks submitted through the pretalx CFP system at cfp.bsidesvienna.at
- No proceedings
