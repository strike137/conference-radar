notes:
- Virtual workshop run by the NIST Privacy-Enhancing Cryptography (PEC) program; free to attend with registration
- Call for talk proposals, not papers; proposals are sent by email on a PDF form and reviewed by NIST
- Non-archival; slides and videos of the talks are published online after the workshop
- 'Topics: private set intersection (PSI Day), encrypted search, FHE, MPC, ZKP, post-quantum PEC'
- First edition in 2024 (3 days), second edition in 2026 (4 days)
- Use of generative AI for writing talk proposals is not allowed beyond minor grammar fixes
