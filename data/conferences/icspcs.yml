notes:
- Successor of the DSPCS and WITSP workshops (since 2002), named ICSPCS since 2007; usually held in December
- Held in Australia for many years (Surfers Paradise 2017 and 2019, Cairns 2018); the 2023 and 2024 editions had
  their websites hosted by Bydgoszcz University of Science and Technology (PBS), Poland
- Technically co-sponsored by IEEE ComSoc; accepted and presented papers are submitted to IEEE Xplore (2017 to
  2020 calls)
- No 2021 or 2022 edition is listed on the series page; nothing announced after 2024 as of October 2026
- Not listed in CORE ICORE2026 (0 results for ICSPCS)
