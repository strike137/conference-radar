notes:
- Co-located with ESORICS; 1st edition 2025 in Toulouse, 2nd edition 2026 in Rome
- Organized by Inria and Télécom SudParis within the French SUPERVIZ project (France 2030, PEPR Cybersecurity)
- Focus on evaluation methods, datasets, benchmarks and testbeds for intrusion detection and response systems
- 2025 proceedings published by Springer; papers use the LNCS template
- Research papers up to 16 pages and position or work-in-progress papers up to 8 pages, excluding bibliography and
  appendices; double-blind review with two to three reviewers
- 'Small workshop: 9 papers in the 2025 programme (full day), 10 in 2026 (afternoon)'
- Deadline extended in both 2025 and 2026 (by two to four weeks)
- Not listed in ICORE2026 (portal search returns no results) or the CCF list
