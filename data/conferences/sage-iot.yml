notes:
- Workshop on agentic AI, small language and foundation models, federated learning and edge data engineering for IoT; 2026 is the 7th edition
- Same series as IoTDA (Internet of Things Data Analytics, 2018 to 2022) and AIDE4IoT (Artificial Intelligence and Data Engineering for IoT, 2025); not held in 2023 and 2024
- Co-located with the IEEE International Conference on Big Data (IEEE BigData) and follows it around the world
- Accepted papers go into the IEEE BigData conference proceedings (IEEE Computer Society Press, IEEE Xplore)
- Long papers 8 to 10 pages, short or work-in-progress papers 4 to 6 pages, IEEE format
- Half-day online workshop in 2025; full IEEE BigData registration required for one author
- Late deadline (late October or early November), useful for a quick end-of-year submission
- Not ranked by CORE (not in ICORE2026) or CCF
