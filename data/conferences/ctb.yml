notes:
- One-day workshop affiliated with Eurocrypt (2024 Zurich, 2025 Madrid, 2026 Rome)
- Topics include zero-knowledge proofs, threshold cryptography, MPC, FHE and consensus in blockchain and DLT systems
- No formal proceedings; papers already published or submitted elsewhere are welcome
- No page limit since the 2025 call; submission through EasyChair
- Not listed in ICORE2026 or the CCF 2026 list
