notes:
- Organized by the CIPS Language and Knowledge Computing committee; formed in 2016 by merging CKGS and CSWS; 20th
  edition (2026) hosted by Xi'an Jiaotong University
- Accepts English papers (12 pages, Springer LNCS format) and Chinese papers (8 pages); English papers appear in
  a Springer CCIS volume, Chinese papers are recommended to Chinese journals
- Double-blind review for research and application papers, single-blind for open-resource papers; submission via
  OpenReview
- Program includes tutorials, shared evaluation tasks, industry and young scholar forums; the main domestic knowledge
  graph venue in China
