notes:
- One of the longest-running data mining conferences, rotating around the Pacific-Asia region (2024 Taipei, 2025
  Sydney, 2026 Hong Kong, 2027 Wellington)
- 'Competitive: acceptance around 18-25% (2021-2026); double-blind review, Springer LNCS template'
- Deadline usually in November, conference in May to early July
- 2027 has Research, Applied Data Science, Survey and a Special Track on LLMs and Agentic AI with one shared deadline;
  security, privacy and fraud detection are listed topics
- 2027 is in-person only
