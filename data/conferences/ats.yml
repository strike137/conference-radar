notes:
- IEEE symposium on testing of electronic systems, modules and devices (DFT, ATPG, BIST, fault diagnosis, memory
  and analog test, test for AI and AI for test, hardware security and trust)
- Sponsored by IEEE and IEEE CEDA; papers go to IEEE Xplore
- Rotates around Asia with strong Japan and Taiwan roots (Tokyo 2025, Kaohsiung 2026)
- The 2025 edition was held jointly with ITC-Asia (34th ATS and 9th ITC-Asia) alongside SEMICON Japan at Tokyo Big
  Sight
- Regular papers up to 6 pages in IEEE two-column format; at least one full registration per accepted paper
- Submission deadline is usually extended by several weeks; separate late-breaking results track
- Listed as CCF C (computer architecture); not listed in ICORE2026
