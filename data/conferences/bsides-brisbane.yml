notes:
- Community-run, volunteer-crewed Security BSides conference in Brisbane, Queensland, running since 2019
- One Saturday each July at QUT Gardens Point Campus, Z Block (2021 was postponed and merged into a 2022 event)
- Two talk tracks plus workshops, a CTF with jeopardy challenges and an Active Directory lab, and an IoT and hardware hacking village
- About 749 attendees and eighteen talks in 2025, the largest edition so far
- Students and first-time speakers welcome; organizers aim to keep tickets cheap
- No proceedings; a printed booklet is handed out on the day
