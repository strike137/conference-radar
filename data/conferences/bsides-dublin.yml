notes:
- Volunteer-run Security BSides conference for Ireland, first held in 2019; 2020 was cancelled and 2021 was virtual
- One day on a Saturday in May at Trinity College Dublin (2024 to 2026)
- Talks and 2 hour workshops in English, selected by an independent CFP review panel; travel and accommodation not covered
- Call for presentations on Sessionize, opening in November or December and closing in January (2024 to 2026 editions)
- Hacking villages and a CTF; talk videos and slides posted on the site, no proceedings
