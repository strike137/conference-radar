notes:
- Formerly WIESP (Workshop on Information Extraction from Scientific Publications), held at AACL-IJCNLP 2022 and IJCNLP-AACL 2023; renamed WASP for the third edition
- Co-located with IJCNLP-AACL; WASP 2025 was held in hybrid mode in Mumbai, India, and WASP 2026 is a virtual workshop at AACL-IJCNLP 2026 (Hengqin, China)
- Runs a shared task (TRACS, telescope reference and astronomy categorization, in 2025)
- Accepts direct submissions and ARR commitments
- "Proceedings in the ACL Anthology; 2025 had 29 submissions and 16 accepted"
- Not listed in CORE ICORE2026 and not on the CCF list
