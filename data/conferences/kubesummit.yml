notes:
- Cloud-native and Kubernetes practitioner conference organized by iThome (Taiwanese IT media), the organizer of CYBERSEC
  Taiwan; called Kubernetes Summit until 2024
- Held at the Taipei Cultural and Creative Building (Xinyi District) over two days; Oct 23-24 2024, Oct 22-23 2025
  and Sep 10-11 2026 (Oct 25-26 2023 also used the Songshan Cultural and Creative Park multi-purpose hall)
- Call for Speakers with 30 min and 40 min talks and 90 min hands-on workshops; sales pitches are not accepted
- "Speaker travel allowance (2026): 3,000 / 5,000 / 9,000 TWD by session type; overseas speakers get 1,000 USD"
- Paid ticketed event; 744 paying attendees from 194 companies in 2025
- No papers or proceedings; slides and recordings are released only with the speaker's consent
- Not listed in the CORE portal (ICORE2026)
