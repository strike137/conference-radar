notes:
- Annual conference of the IEEE Council on RFID on RFID technology and its applications; 17th edition in 2027
- Sister venue of IEEE RFID (held in the USA); RFID-TA moves between countries (Valence, France 2025; Leuven,
  Belgium 2026; Kuala Lumpur, Malaysia 2027), mostly in Europe
- "Two paper options: a short conference paper (3 to 4 pages in 2027) published in IEEE Xplore, or a journal
  paper reviewed by the IEEE Journal of RFID (JRFID) for a special issue"
- Submission via EDAS; includes a student design competition and best paper awards
- 2027 edition co-located with IEEE WiSEE 2027
- Not listed in the CORE ICORE2026 portal
