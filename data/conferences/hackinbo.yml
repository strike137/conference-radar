notes:
- Italian IT security conference in Bologna, running since 2013 and run by the company HackInBo Group Srl
- Two editions a year (Spring in May/June, Winter in October/November); the site describes it as one of the largest
  security conferences in Italy
- Site and programme are in Italian; one-day talk programme plus the HackInBo Forensic Games competition
- A separate paid Business Edition is held the day before the Classic Edition (Winter 2026)
- Talks only, no formal proceedings; talks are posted on the HackInBo YouTube channel
