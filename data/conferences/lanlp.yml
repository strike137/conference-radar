- First held at LREC 2026 in Palma de Mallorca
- Papers in English, Spanish or Portuguese; long (8 pages) and short (4 pages) papers; non-anonymous submission
- Research, position, project and demo papers accepted
- Proceedings in the ACL Anthology (8 papers in 2026)
- Not listed in ICORE2026 and not on the CCF list
