notes:
- One-day ICSE workshop on blockchain oriented software engineering, smart contracts, their testing, security and architecture
- Held with ICSE since 2018 (WETSEB 2018 through 2026); successor of the WETSoM software metrics workshop
- Organized mainly by the blockchain software engineering group at the University of Cagliari, Italy
- 2026 accepted full papers up to 8 pages and extended abstracts up to 5 pages, ACM format, double-anonymous review, with an Early Research Achievements call for PhD students
- Proceedings follow ICSE workshop publication; 2025 in IEEE Xplore, 2026 with ACM (ACM template and ACM Open fees)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
