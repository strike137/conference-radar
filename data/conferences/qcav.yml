notes:
- Biennial machine vision conference focused on image processing and computer vision for industrial quality control
- Alternates between Japan and Europe, mostly France (Tokushima 2021, Albi 2023, Yamanashi 2025, Kotor, Montenegro 2027)
- Run jointly by a Japanese (JSPE TC-IAIP) and French steering committee; started in 1993 in Le Creusot
- Two-stage submission up to 2025 (2-page abstract in October, then 4 to 8 page full paper in spring); 2027 has a single full paper deadline in February with double-blind review
- "Registration fee: 650 EUR regular, 450 EUR student (2027 early bird until March 31)"
- Accepted full papers are published in the SPIE Digital Library after the conference
