notes:
- Biennial machine vision conference focused on image processing and computer vision for industrial quality control
- Alternates between Japan and Europe, mostly France (Tokushima 2021, Albi 2023, Yamanashi 2025, Montenegro 2027)
- Run jointly by a Japanese (JSPE TC-IAIP) and French steering committee; started in 1993 in Le Creusot
- Two-stage submission - 2-page abstract in October, then 4 to 8 page full paper reviewed in spring
- Accepted full papers are published in the SPIE Digital Library after the conference
