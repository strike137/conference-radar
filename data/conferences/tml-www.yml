notes:
- Half-day workshop at The Web Conference 2026 on large multimodal models for social media content, short video analysis, and their safety evaluation (hallucination, jailbreaks, harmful content)
- Chaired by Guosheng Lin (NTU Singapore) and Fengmao Lv (Southwest Jiaotong University)
- Papers 4 to 8 pages excluding references in the ACM template, single-blind review via EasyChair
- The Web Conference 2026 workshop call says papers accepted by its workshops can be included in the Companion Proceedings (ACM DL)
- First edition in 2026
- Not listed in the CORE ICORE2026 portal
