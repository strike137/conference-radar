notes:
- Broad information systems and technologies conference with 14 themes (knowledge management, software, networks,
  decision support, big data, HCI, security, health and education IT, and more)
- Full (12 pages) and short (8 pages) papers go to Springer LNNS in four to six volumes per year; poster and
  company papers are presented only
- Double-blind review by at least two PC members; hybrid, with online participation possible
- One registration covers one published paper; an extra fee allows one more paper
- Usually held in Europe (Madeira, Portugal in 2026); the 2027 edition is in Cape Town, South Africa
- Many co-located workshops each year; authors of the best papers are invited to submit extended versions to journals
- "CORE rank: C (ICORE2026)"
