notes:
- Workshop co-located with ACM SIGSPATIAL since 2023 (Hamburg 2023, Atlanta 2024, Minneapolis 2025, Riverside 2026); website hosted by Oak Ridge National Laboratory
- Topics are AI for cities, urban mobility, infrastructure, resilience, urban sensing and urban analytics
- Proceedings of each edition in the ACM Digital Library (UrbanAI 2025 -> DOI 10.1145/3764926)
- Full papers 8-10 pages, short or demo papers 4-6 pages, vision papers 2 pages; ACM SIG format
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
