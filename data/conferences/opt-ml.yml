notes:
- Long-running NeurIPS workshop on optimization for ML, held every year since 2008 (no 2018 edition listed)
- Moves with NeurIPS (2026 in Sydney, Australia)
- Non-archival, the site states the workshop does not publish archival proceedings
- Double-blind review on OpenReview; soft limit of 5 pages, camera-ready hard limit of 6 pages excluding references
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
