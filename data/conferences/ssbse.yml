notes:
- Main venue for search-based software engineering (optimization, evolutionary and other heuristic search applied to SE problems)
- One-day symposium co-located with a major SE conference; FSE in 2022, 2023, 2024 and 2026, ASE in 2025
- Proceedings in Springer LNCS (SSBSE 2025 is LNCS volume 16228)
- Research papers up to 15 pages in LNCS format including references; double-anonymous review
- Also has RENE/NIER, Challenge and Hot-off-the-Press tracks
- Best papers invited to a special issue of the Automated Software Engineering journal
- Recent editions in Singapore 2022, San Francisco 2023, Porto de Galinhas 2024, Seoul 2025, Montreal 2026
- CORE B (ICORE2026); not in the CCF 2026 list
