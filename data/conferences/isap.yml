id: isap
name: ISAP
full_name: International Symposium on Antennas and Propagation
type: conference
tier: minor
areas: [communications]
region: asia-pacific
language: english
frequency: annual
organizer: IEICE Communications Society (ISAP 2025); technically co-sponsored by AMTA, IEEE AP-S, ECTI, EurAAP, URSI, KIEES and others
organizer_country: [japan]
proceedings: IEEE Xplore
archival: true
fee: 100,000 JPY regular IEICE/IEEE member, 45,000 JPY student member (2025, early bird)
typical:
  deadline_months: [4, 5]
  conference_months: [10]
links:
  website: https://www.isap2025.org/
notes:
- First held in Sendai, Japan in 1971; annual since 2004 and rotates around Asia and Oceania (Osaka 2020, Taipei
  2021, Sydney 2022, Kuala Lumpur 2023, Incheon 2024, Fukuoka 2025)
- Covers antennas, propagation, electromagnetic wave theory and related wireless topics such as RIS, MIMO and
  wireless power transfer
- Short 2-page two-column papers in English, submitted via EDAS as camera-ready PDFs; copyright goes to IEICE
- Presented papers are planned for the ISAP Archives and IEEE Xplore (2025 CFP)
- IEICE runs a special section in IEICE Transactions on Communications and a special cluster in IEICE ComEX on
  ISAP 2025 topics
- One regular registration covers up to two papers, a student registration covers one
- Has a Student Design Contest, Best Paper, Student Presentation and Young Engineer awards
- Not ranked by CORE or CCF; antennas and propagation venue outside the usual CS rankings
- Next hosts announced on the ISAP 2025 site are Chengdu, China (2026) and Pattaya, Thailand (2027)
