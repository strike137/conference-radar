notes:
- Co-located with ESORICS every September since 2023; 2026 edition in Rome
- Papers go into the ESORICS workshops volume of Springer LNCS
- Long papers up to 16 pages and short papers up to 8 pages (LNCS format); single-blind review with at least two
  reviewers
- 'Acceptance: 15/42 (2024), 19/48 (2025), 21/65 (2026); submission deadline extended by 4 to 7 days in 2025 and
  2026'
- Chairs include Japanese researchers (Tohoku University, Panasonic)
