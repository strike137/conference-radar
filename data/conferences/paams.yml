notes:
- Applied agents and multi-agent systems venue; 2026 special topic is agentic AI
- Main track and demos in Springer LNAI ("The PAAMS Collection"); workshop papers in a separate Springer volume
- Papers up to 12 pages (demos 6), each reviewed by at least three experts; in-person presentation required
- 2026 deadlines were extended twice (17 Apr -> 8 May -> final 22 May)
- Selected papers invited to journal special issues (ADCAIJ, IJIMAI and others)
- Held in Europe (Lille 2025, Naples 2026); co-located with DCAI, PACBB, ISAMI, MIS4TEL, DECON and BLOCKCHAIN
