links:
  website: https://ldl2026.linguistic-lod.org/
notes:
- Long-running workshop on Linked Data, Semantic Web and knowledge graph technologies for linguistics, lexicography and digital humanities
- Held with LREC every two years (2016 Portoroz, 2018 Miyazaki, 2022 Marseille, 2024 Turin, 2026 Palma); 2020 proceedings also in the ACL Anthology
- Proceedings in the ACL Anthology, published by ELRA
- Long papers 8 pages and short papers 4 pages plus references; single-blind review
- 2026 edition (10th) had 11 papers, with a focus on building new linked data datasets and integrating heterogeneous data
- Not ranked in ICORE2026 and not on the CCF list
