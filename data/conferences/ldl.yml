region: europe
language: english
frequency: biennial
organizer: Open Linguistics community (2026 organizers from University of Galway, Athena RC, CNR-ILC, UPM, University of Aveiro and University of Oxford); co-located with LREC
organizer_country: [europe]
proceedings: ACL Anthology (ELRA)
archival: true
typical:
