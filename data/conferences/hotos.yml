notes:
- Flagship SIGOPS workshop for new ideas in systems research; held every two years (odd years)
- Standalone workshop, not co-located with a conference
- Position papers of at most 5 pages plus references (ACM acmart sigconf); double-blind review
- Small invitation-based event; each accepted paper gets two invitations and extra capacity is allocated later
  (lottery in 2025); at least one author must present in person
- Papers are in the ACM DL (DOI 10.1145) and on the workshop site
- CORE A (ICORE2026, listed under its former USENIX name), CCF B
- Recent hosts Providence, USA 2023, Banff, Canada 2025 and Burghausen, Germany 2027 (organized by TU Munich)
