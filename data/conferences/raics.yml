notes:
- Flagship conference of the IEEE Kerala Section, India, on intelligent computation and its applications across IEEE fields
- Proceedings in IEEE Xplore as IEEE Recent Advances in Intelligent Computational Systems (RAICS)
- Held in Kerala every time (Thiruvananthapuram 2020, Kothamangalam 2024, Kochi 2025)
- Irregular schedule; editions in 2011, 2013, 2015, 2018, 2020, 2024 and 2025
- Not listed in the CORE ICORE2026 portal
