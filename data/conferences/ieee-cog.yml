notes:
- IEEE conference on AI and computational intelligence for games (formerly IEEE CIG); sponsored by the IEEE CIS
- Full papers up to 8 pages including references and appendices; double-anonymous review; proceedings on IEEE Xplore
- Separate tracks for auxiliary papers, doctoral consortium, competitions, tutorials and workshops
- CORE C (ICORE2026, listed as "Conference on Games (was Computational Intelligence and Games CIG)")
- Rotates globally (London 2019, Osaka 2020, Copenhagen 2021, Beijing 2022, Boston 2023, Milan 2024, Lisbon 2025, Madrid 2026)
