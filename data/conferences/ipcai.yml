id: ipcai
name: IPCAI
full_name: International Conference on Information Processing in Computer-Assisted Interventions
type: conference
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: IPCAI steering committee, held jointly with the CARS congress
organizer_country: [international]
proceedings: IJCARS (Springer journal, IPCAI special issue)
archival: true
typical:
  deadline_months: [10]
  conference_months: [6, 7]
links:
  website: https://www.sites.google.com/view/ipcai2027
  dblp: https://dblp.org/db/conf/ipcai/index.html
notes:
- Computer-assisted surgery and interventions (surgical data science, medical robotics, interventional imaging, navigation, AR/VR)
- Accepted regular papers go through a final review round at IJCARS and appear as full journal papers in the IPCAI special issue
- Regular papers up to 12 pages in IJCARS format, single-blind review via CMT, with an intention-to-submit step and a revision round
- Also has a long abstract track (late-breaking research and presentation of recently published journal articles)
- Held with the CARS congress, mostly in Europe with some editions in Japan (Tokyo 2022, Nagoya 2026); 2027 is in Berlin
- Deadlines are end of day Pacific Time, with no extensions
- Not ranked in ICORE2026 and not on the CCF 2026 list
