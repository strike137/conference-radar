notes:
- Half-day workshop at IEEE ICDE on AI for data management tasks beyond text-to-SQL (ETL/ELT, SQL remediation, querying graphs and JSON, data products, governance)
- Held with ICDE 2026 in Montreal on May 4, 2026
- Workshop site says the proceedings of all workshops are published jointly with the ICDE conference proceedings
- Full papers up to 8 pages, short papers up to 4 pages, extended abstracts up to 2 pages (plus references), IEEE format
- Submission via OpenReview, single-anonymous review
- Small program in 2026 (two keynotes, four papers)
- Organized by Oktie Hassanzadeh, Kavitha Srinivas and Sola Shirai (IBM Research), Liane Vogel (TU Darmstadt) and Liana Patel (Stanford)
- Not listed in CORE ICORE2026 and not on the CCF list
