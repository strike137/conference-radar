  conference_months: [7, 10]
links:
  website: https://acm-bcb.org/
  dblp: https://dblp.org/db/conf/bcb/index.html
notes:
- Flagship conference of ACM SIGBio; proceedings in the ACM Digital Library
- Not listed in ICORE2026 or the CCF 2026 list, so shown as minor despite being the ACM SIGBio flagship
- Regular papers 8 to 10 pages (ACM double-column, references included); double-blind review in two rounds with a
  revision step
- Selected papers invited to special issues of IEEE/ACM TCBB and IEEE JBHI
- Mostly held in the USA (Chicago 2022, Houston 2023, Philadelphia 2025); Shenzhen, China in 2024 and Calabria, Italy
  in 2026 (first edition in Europe)
- Timing moves a lot between years (deadline July and conference October in 2025; deadline March and conference
  June/July in 2026)
