notes:
- Run by the ITI Research Group of Universidad Distrital Francisco Jose de Caldas (Bogota, Colombia) with a host university each year
- "Proceedings: Springer CCIS for the main conference; workshop papers in CEUR Workshop Proceedings"
- Best papers of 2023 to 2025 went to Springer SN Computer Science; for 2026 selected papers are invited to an MDPI Mathematics special issue
- Full papers 12 to 16 pages in Springer format, anonymous review by at least 2 reviewers, Turnitin similarity screening
- Mostly held in Latin America (Arequipa 2022, Guayaquil 2023, Vina del Mar 2024), but also Ben Guerir 2025 and Orlando 2026
- Paper deadline usually extended by about two weeks
- Broad informatics scope (AI, data analysis, software engineering, security, health care systems, ...)
- Not listed in CORE ICORE2026 or the CCF list
