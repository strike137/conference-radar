id: yrrsds
name: YRRSDS
full_name: Young Researchers' Roundtable on Spoken Dialogue Systems
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: Volunteer organizing committee of early-career researchers with an advisory committee of senior dialogue
  researchers; co-located with SIGDIAL
organizer_country: [international]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [6]
  conference_months: [8, 9]
links:
  website: https://emorynlp.github.io/YRRSDS-2026/
notes:
- Annual roundtable for PhD students, postdocs and new researchers in spoken dialogue systems, held since 2005 right
  before or after SIGDIAL
- Participants submit a 2-page position paper (past, present and future work, short bio, discussion topics), checked by
  an organizing committee member and an advisory committee member
- Position papers published in the ACL Anthology (25 papers in 2023, 33 in 2024, 10 in 2025)
- 'Recent locations follow SIGDIAL: Prague 2023, Kyoto 2024, Avignon 2025, Atlanta 2026'
- Attendees register through SIGDIAL registration (2025 and 2026)
- 2026 edition was a half-day discussion workshop with no call for position papers
- Not listed in ICORE2026 and not on the CCF list
