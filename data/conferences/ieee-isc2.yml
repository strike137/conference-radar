id: ieee-isc2
name: IEEE ISC2
full_name: IEEE International Smart Cities Conference
type: conference
tier: minor
areas: [networking, general]
region: europe
language: english
frequency: annual
organizer: IEEE Smart Cities Technical Community
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
fee: 750 EUR IEEE member, 475 EUR IEEE student (2026, early)
typical:
  deadline_months: [5, 6]
  conference_months: [9, 10]
links:
  website: https://dei.fe.up.pt/ieee-isc2-2026/
notes:
- Flagship annual conference of the IEEE Smart Cities Technical Community
- Multidisciplinary tracks on smart city infrastructure, IoT and sensor networks, mobility, energy, digital twins,
  AI, cybersecurity and privacy
- Accepted track and workshop papers are published in IEEE Xplore
- Full papers up to 6 pages in IEEE two-column format; workshop papers 4 to 5 pages
- Recent hosts are mostly in Europe (Bucharest 2023, Patras 2025, Porto 2026), with Pattaya, Thailand in 2024
- In-person only; one full registration covers up to two papers
- Selected papers invited to journal special issues
