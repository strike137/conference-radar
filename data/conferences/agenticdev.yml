notes:
- Workshop on multi-agent, LLM-based AI agents across the software lifecycle (requirements, code generation, testing, maintenance, human-AI collaboration)
- First edition held on October 12, 2026 with ASE 2026 in Munich
- Inspired by Horizon Europe projects AI4SWEng, ASTIR, HIVEMIND and MOSAICO
- Regular papers up to 10 pages and short or demo papers up to 5 pages, plus up to two pages of references (ACM sigconf, anonymous review)
- 2026 received 84 submissions and accepted 11 long papers, 8 short papers and 7 extended abstracts, published in the ACM proceedings
- Selected papers invited to a journal special issue
- Separate from the AgenticSE workshop held at ASE 2025 (id agenticse)
- Not listed in the ICORE2026 portal or the CCF 2026 list
