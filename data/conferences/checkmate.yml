notes:
- One-day workshop on software protection, obfuscation, anti-tampering, reverse engineering and MATE attacks,
  co-located with ACM CCS; location follows CCS (2024 Salt Lake City, 2025 Taipei)
- Successor of SSP, PPREW, SSPREW, SPRO and SAD (2020); held as CheckMATE in 2021, 2022, 2024 and 2025 (no 2023
  edition)
- Proceedings in the ACM Digital Library (2025 volume doi 10.1145/3733817); authors may opt out
- Research papers up to 8 pages in double-column ACM format, anonymized; also accepts 2-page replay abstracts of
  already published work (not anonymous)
- Small program (5 regular plus 3 replay papers in 2025); selected papers invited to a journal special issue
- Not listed in ICORE2026 or the CCF list
