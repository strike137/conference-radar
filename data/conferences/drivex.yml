id: drivex
name: DriveX
full_name: Workshop on Foundation Models for V2X-Based Cooperative Autonomous Driving
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: multiple-per-year
organizer: DriveX workshop series led by Walter Zimmer, Rui Song and Ross Greer (UCLA, TUM, UC Merced and others)
organizer_country: [usa, europe]
proceedings: IEEE Xplore and CVF Open Access (CVPR and ICCV Workshops proceedings, archival track); ECCV 2026 workshop proceedings
archival: true
typical:
  deadline_months: [3, 7]
  conference_months: [6, 9]
links:
  website: https://drivex-workshop.github.io/
notes:
- Workshop series on foundation models, V2X cooperative perception, large driving models and safe autonomous driving
- Runs several editions per year at different hosts (CVPR 2025, ICCV 2025, ITSC 2025, CVPR 2026, IV 2026, ECCV 2026, ITSC 2026, ICRA 2027, CVPR 2027)
- At CVPR, ICCV and ECCV there is an archival track (full papers in the workshop proceedings) and a non-archival track (extended abstracts or recently published work)
- The ITSC 2026 and ICRA 2027 editions take non-archival papers only
- 11 papers in the CVPR 2026 and 10 in the ICCV 2025 workshop proceedings on CVF Open Access
- "ECCV 2026 edition: 54 submissions, acceptance rate 12.8% oral and 62.9% poster"
- Also runs the DriveX Grand Challenge with several dataset tracks
- Not listed in ICORE2026 or the CCF list
