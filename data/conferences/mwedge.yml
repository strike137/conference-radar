notes:
- Workshop on decentralized edge and fog computing middleware (resource management, scheduling, latency-sensitive systems), co-located with ACM Middleware
- Editions in 2022 (Quebec City) and 2023 (Bologna); no 2024 edition; a 2025 edition was announced but does not appear to have taken place
- 2022 and 2023 proceedings published as their own volumes in the ACM Digital Library
- Full papers up to 6 pages, short papers (demos and posters) up to 4 pages, ACM SIGPLAN format
- Supported by EU Horizon projects; organizers from France and Portugal
- Not listed in CORE ICORE2026 or the CCF list
