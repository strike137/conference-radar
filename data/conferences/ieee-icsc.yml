region: north-america
language: english
frequency: annual
organizer: IEEE
organizer_country: [usa]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [10, 11]
  conference_months: [1, 2]
links:
  website: https://www.semanticcomputing.org/
notes:
- Annual since 2007; 2027 is the 21st edition, co-located with AIxDKE and RoboticCC
- Proceedings in IEEE Xplore; accepted papers must be registered and presented or they are removed
- Held at The Hills Hotel, Laguna Hills, California every year since 2023 (hybrid); 2021 and 2022 were virtual
- Regular papers up to 8 pages, short, industry and concise papers up to 4, position papers up to 2 (IEEE
  double-column format), at least three reviewers per paper
- Organizers state a full paper acceptance rate of around 20%
- Co-located workshops (SMC, SCSN-AI, GASC) and a doctoral symposium with free poster presentation for PhD students
- Not listed in ICORE2026; not on the CCF list
acceptance_rate: Around 20% for full papers (as stated by the organizers)
