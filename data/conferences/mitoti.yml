notes:
- Workshop on middleware bridging IT and operational technology (IIoT, edge-cloud continuum, PLCs and robotics, IT/OT networking and security), co-located with ACM Middleware
- 2025 edition held on 2025-12-16 at Vanderbilt University, Nashville, with keynotes from West Virginia University and Siemens
- Regular papers up to 6 pages, short and position papers up to 4 pages, ACM SIGCONF format; each paper reviewed by at least three PC members
- Proceedings in the ACM Digital Library
- Strong industry involvement (Siemens, Bosch, Intel, Nvidia on the PC)
- A MITOTI 2026 entry is listed on the Middleware 2026 workshop page
- Not listed in the ICORE2026 portal or the CCF 2026 list
