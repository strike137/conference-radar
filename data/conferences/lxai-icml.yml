notes:
- Official affinity workshop of LatinX in AI, co-located with ICML and held where ICML is held
- One-day event with invited talks, oral presentations, posters, a panel and mentoring
- Extended abstracts (up to 4 pages) or full papers (up to 8 pages) in ICML format, double-blind review on OpenReview
- At least one author must identify as LatinX; everyone may attend
- Accepted authors choose archival publication in JLXAIR (with DOI) or non-archival presentation
- Papers accepted to an ICML main track with a LatinX author can be presented through direct acceptance
- All deadlines 23:59 AoE
- Not listed in ICORE2026 or the CCF list
