notes:
- Annual conference of the IEEE Vehicular Technology Society on electrified vehicle power and propulsion (green e-mobility)
- Accepted papers are submitted to IEEE Xplore; final papers go through IEEE ExpressConferencePublishing
- Regular papers 6 pages in IEEE two-column format, up to 2 extra pages at 100 USD each (2026)
- Separate tracks for regular papers, special session papers and a later Recent Results track
- A joint submission option with the IEEE Open Journal of Vehicular Technology (OJVT) was offered in 2026
- 2026 is the 23rd edition (Lyon); 2025 was in Hangzhou and 2024 in Washington DC alongside VTC2024-Fall
- Not listed in ICORE2026
