notes:
- Formerly IEEE SecDev (sponsored by the IEEE Computer Society Technical Committee on Security and Privacy, proceedings
  in IEEE Xplore); since 2026 an ACM conference sponsored by ACM SIGSOFT with proceedings in the ACM Digital Library
- 2026 edition co-located with FSE 2026 in Montreal, which moved the conference from October to July and the paper
  deadline from May to late January
- Focus on how to build security into systems (tools, languages, processes, secure development), not on finding
  vulnerabilities; aims to bridge academia, industry and government
- Long (10 pages) and short (6 pages) research and experience papers, SoK papers and tutorials; accepted papers appear
  in the formal conference proceedings
- Light-weight double-blind review; separate calls for practitioner papers and posters (posters are not published in
  the proceedings)
- In-person attendance is mandatory for authors of accepted papers and tutorials
- ACM papers are open access from 2026; authors not covered by ACM OPEN may have to pay an article processing charge
- Held in North America every year (Atlanta 2022 and 2023, Pittsburgh 2024, Indianapolis 2025, Montreal 2026); 2020 and
  2021 were virtual
- Not listed in ICORE2026 or the CCF list
