notes:
- Half-day interdisciplinary workshop on empirical analysis of cryptoassets, DeFi, MEV, address clustering, datasets and
  legal or economic aspects
- Co-located with The ACM Web Conference 2022 to 2024, then with Financial Cryptography and Data Security (FC) since 2025
- Since moving to FC, papers appear in the FC workshops volume of Springer LNCS (2025 -> LNCS 15753, shared with WTSC);
  the WebConf editions used ACM companion proceedings
- Full papers up to 15 pages including references, short papers up to 8 pages, posters up to 3 pages, LNCS format,
  double-blind review via EasyChair
- At least one author per accepted paper must register
- 2027 edition is held in the morning and shares keynotes with the DeFi workshop in the afternoon
