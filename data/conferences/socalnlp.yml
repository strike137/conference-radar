notes:
- One-day regional NLP and ML symposium for researchers in Southern California, with keynotes and poster sessions
- Editions in 2018, 2019, 2021 (as SoCal ML & NLP Symposium), 2022, 2023 (UCLA), 2024 (UCSD) and 2026 (USC)
- Non-archival; already published or concurrently submitted work is welcome
- Submissions via OpenReview; new work as an extended summary of up to 2 pages in ACL format; single-blind review
- Large poster program (155 accepted in 2023, 166 in 2024); registration limited by venue capacity
- Not listed in CORE ICORE2026
