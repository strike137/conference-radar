notes:
- Workshop on design, verification and certification of AI-enabled embedded and cyber-physical systems (fault tolerance, radiation testing, safety and security co-engineering, OOD monitoring)
- First edition in 2026, co-located with SAFECOMP 2026 in Valencia on the workshop day
- Accepted research papers included in the companion SAFECOMP 2026 workshops proceedings book (Springer LNCS)
- Short papers up to 6 pages and research papers up to 12 pages including references; at least 3 reviewers; EasyChair
- Organized by Joaquin Gracia-Moran (UPV) and Sergio Cuenca-Asensi (Universitat d'Alacant) under the NeuroAI4Space project
- Not listed in CORE ICORE2026 or on the CCF list
