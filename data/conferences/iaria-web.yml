notes:
- Organized by IARIA (15th edition in 2027)
- Covers web based environments, web services, semantic web, web search and web applications
- Published open access in the IARIA ThinkMind library (ISSN 2308-4421); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Southern Europe (Valencia, Venice, Barcelona, Athens, Lisbon in recent years)
- The 2027 edition moves from March to May, held in Venice
