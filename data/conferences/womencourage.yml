notes:
- ACM-W Europe celebration of women in computing, held yearly since 2014 in a different European city, open to all genders
- Aimed at students and early career researchers; keynotes, panels, workshops and tutorials, a hackathon and a career fair
- Poster track with a 2 page extended abstract in ACM format plus an A1 poster, reviewed by a poster committee
- No proceedings; posters are only published on the conference website, so already published work may be presented
- Scholarships available, including for authors of accepted posters
- Recent hosts were Trondheim 2023, Madrid 2024, Brasov 2025 and Sophia Antipolis 2026
- Not listed in CORE ICORE2026
