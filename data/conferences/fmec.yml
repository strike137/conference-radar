notes:
- Run by the Emerging Technologies Network, the same group behind SNAMS; co-located with the Intelligent Cybersecurity Conference (ICSC) in 2025; each edition is technically co-sponsored by the IEEE section of the host country
- Proceedings in IEEE Xplore; full papers up to 8 pages in the IEEE conference template
- Short, poster, position, PhD symposium and SoK tracks plus co-located security and blockchain workshops (FCST, BCAT, AISC, RTCAC)
- Hybrid format; at least one author must register and present or the paper is dropped from the proceedings
- Very fast review cycle (2026 main track notification 10 days after the submission deadline)
- Mostly held in Europe (2021 Gandia, 2022 Paris, 2023 Tartu, 2024 Malmo), then 2025 Tampa and 2026 Abu Dhabi
- Not listed in ICORE2026; not on the CCF list
