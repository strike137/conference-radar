notes:
- Half-day workshop co-located with IEEE GLOBECOM on quantum machine learning, AI/ML and security for next-generation
  networks
- First held at GLOBECOM 2025 (Taipei) as "Quantum Machine Learning for Reliable Communications in Ubiquitous
  Intelligence of Things"; GLOBECOM 2026 (Macau) is the second edition
- Workshop papers go into the GLOBECOM proceedings and IEEE Xplore; no-show papers are removed
- Led by Van-Linh Nguyen (National Chung Cheng University, Taiwan), who was leading TPC chair in 2025 and is first
  co-chair in 2026
- Not listed in ICORE2026 or in the CCF 2026 list
