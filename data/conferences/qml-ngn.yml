notes:
- Half-day workshop on quantum machine learning, AI/ML and security for sustainable next-generation networks
  (SAGIN, edge computing, blockchain, testbeds and datasets)
- 2026 edition is billed as the second; the GLOBECOM 2025 workshop "Quantum Machine Learning for Reliable
  Communications in Ubiquitous Intelligence of Things" (Taipei) had the same lead chair and appears to be the first
- 2026 co-chairs Van-Linh Nguyen, Xin Wang, Viet Quoc Pham, Hoang Thai Dinh, Quang-Trung Luu and Elif Ak
- Workshop papers go through the GLOBECOM workshop call (EDAS) and are planned for IEEE Xplore; no-show papers are
  removed
- Not listed in ICORE2026
