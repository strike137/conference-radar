notes:
- Workshop co-located with IEEE DCOSS-IoT; the 2026 edition in Reykjavik was the 7th, and the 8th is listed for DCOSS-IoT 2027 in Montreal
- 2026 edition was titled SecRIoT-SCC (Security, Reliability of IoT Systems and Supply Chain Cybersecurity)
- Run by Greek and UK researchers (Athanasios Kakarountas, Leandros Maglaras, Naghmeh Moradpoor, Vasileios Vlachos)
- Topics are IoT security and privacy, intrusion detection, IoT malware, secure embedded systems and supply chain security
- Papers up to 8 pages IEEE two-column plus up to 2 appendix pages at 100 USD per page; submitted via EasyChair
- Papers follow the DCOSS-IoT camera-ready process and appear in the DCOSS-IoT proceedings in IEEE Xplore
- Past editions Santorini 2019, Corfu 2020, Preveza 2021, Pafos 2023, Abu Dhabi 2024, Lucca 2025, Reykjavik 2026 (none in 2022)
