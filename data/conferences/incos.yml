id: incos
name: INCoS
full_name: International Conference on Intelligent Networking and Collaborative Systems
type: conference
tier: minor
areas: [networking, ai, security, data]
region: worldwide
language: english
frequency: annual
organizer: Fukuoka Institute of Technology (steering committee chair Leonard Barolli) with a host university each
  year
proceedings: Springer LNDECT (Lecture Notes on Data Engineering and Communications Technologies)
indexing: [Scopus, EI, DBLP]
rank:
  core: Unranked
fee: USD 500 per paper for author registration (2026); student participants USD 400 early
typical:
  deadline_months: [5, 6]
  conference_months: [9]
links:
  website: https://voyager.ce.fit.ac.jp/conf/incos/2027/
  dblp: https://dblp.org/db/conf/incos/
notes:
- Part of the Barolli (Fukuoka Institute of Technology) conference family; always co-located with NBiS (shared venue,
  dates and keynotes)
- Intelligent and adaptive networking, social networks and collaborative systems; has security and privacy tracks
  (Security, privacy and anonymity in collaborative systems; Networking Security and Privacy)
- Held at Asia University (Taichung) in 2025, Kwansei Gakuin University (Nishinomiya, Japan) in 2026, and West University
  of Timisoara, Romania in 2027
- Not ranked by CORE or CCF; regarded as a lower-tier venue with a short review cycle (notification 5 days after
  the hard deadline in 2025 and 2026)
