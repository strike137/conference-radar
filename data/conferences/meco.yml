notes:
- Run since 2012 by the Montenegrin Association for New Technologies (MANT) with the University of Montenegro;
  the IEEE Serbia and Montenegro Section is listed as a sponsor and Euromicro as a supporter
- Held every June in Budva, Montenegro, in hybrid form (in venue and online)
- Co-located with the International Conference on Cyber-Physical Systems and Internet-of-Things (CPSIoT) and a
  summer school on CPS and IoT; one shared submission system
- Covers embedded systems, SoCs, real-time and distributed embedded computing, sensor networks, IoT and
  general computing and electrical engineering
- Proceedings in IEEE Xplore, usually online about a month after the conference
- Extended versions of selected papers are invited to the Elsevier journal Microprocessors and Microsystems
- Works in Progress papers go to the WiPiEC Journal instead of IEEE Xplore
- At least two reviewers per paper; 4 pages suggested, up to 8 pages with extra page fees
- The 2026 deadline was extended by about two months; 100 to 131 papers per year for MECO and CPSIoT combined (2023 to 2026)
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
