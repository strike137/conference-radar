- Workshop on efficient on-device foundation models, multimodal sensing, interactivity and UX for mobile systems
- 2026 edition (the 2nd) held with ACM MobiSys 2026 in Cambridge, UK, as a half-day morning workshop
- Full papers up to 6 pages and position papers up to 4 pages including references, ACM format, single-blind review
