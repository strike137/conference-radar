notes:
- Organized by AIAT (Artificial Intelligence Association of Thailand); 21st edition in 2026
- Held in Thailand every November in a different city (Chiang Mai 2022, Bangkok 2023, Chonburi 2024, Phuket 2025,
  Bangkok 2026); 2025 was hybrid, 2026 is in person only
- 'Broad AI scope despite the name: NLP, robotics and IoT, signal/image/speech, IoT security, AI governance'
- IEEE format, max 6 pages, double-anonymous review; no-show papers are excluded from IEEE Xplore
- JSAI members get the member registration rate; 2025 had two submission rounds
