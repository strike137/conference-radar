notes:
- Smaller annual big data and data mining conference; topics also cover AI, privacy and blockchain
- Proceedings of the 2016 to 2025 editions were published by IEEE (Ei Compendex and Scopus indexed per the site); the
  submission page says accepted papers are published through IEEE
- Rotates around Asia (online 2021 and 2022, Harbin 2023, Tokyo 2024 and 2026, Singapore 2025, Bangkok 2027)
- About 150 to 180 participants per edition in 2024 to 2026 according to the site (80 to 120 in 2022 and 2023)
- Full papers up to 10 pages in two-column format, reviewed by two experts; submission through EasyChair
- Not related to the Malaysian ICBDA chapter conference that was merged into IEEE ICOCO
