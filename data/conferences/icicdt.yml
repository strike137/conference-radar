notes:
- Small IEEE conference on integrated circuit design, devices and process technology, with a design-technology co-optimization focus
- "Rotates worldwide (2021 online, 2022 Hanoi, 2023 Tokyo, 2024 Singapore, 2025 Lecce, 2026 Dresden)"
- 2026 edition hosted by Fraunhofer IPMS in Dresden; theme on chiplets and design, device and system innovation
- Papers published by IEEE in IEEE Xplore (camera-ready via IEEE PDF eXpress, submission and copyright through EasyChair)
- "Fees 2026: 550 to 700 EUR regular, 450 to 550 EUR students; includes conference dinner"
- First day is a tutorial day, followed by two days of keynotes, invited talks, short oral papers and posters
- Not listed in ICORE2026 (CORE portal) and not on the CCF list
