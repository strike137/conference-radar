id: fcn
name: FCN
full_name: International Conference on Future Communications and Networks
type: conference
tier: minor
areas: [communications, networking]
region: worldwide
language: english
frequency: annual
organizer: FuTURE Mobile Communication Forum (China), co-organized with a host university that changes each edition
  (University of Bologna in 2026; University of Novi Sad and the AI Institute of Serbia in 2025)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI]
fee: 780 EUR author full registration, 450 EUR student (2026, early; one full registration covers up to two papers)
typical:
  deadline_months: [5, 8, 9]
  conference_months: [8, 10, 11, 12]
links:
  website: http://www.future-forum.org.cn/en/fcn2026/index.html
notes:
- Run by the FuTURE Mobile Communication Forum, a Beijing based industry and academic forum on mobile communications
- Technically co-sponsored by IEEE ComSoc per the 2026 home page (the 2026 registration page and the 2025 site still say pending)
- Accepted and presented papers go into the electronic proceedings and are submitted to IEEE Xplore, then indexed in EI Compendex
- Started in 2023; held outside China so far (Queenstown 2023, St Julian's 2024, Belgrade 2025, Bologna 2026)
- Submissions via EDAS, 6 pages in IEEE format plus 1 extra page for 50 EUR
- Deadline is usually extended several times before a firm date
- In-person presentation required; no online presentations
- Not listed in the CORE portal (ICORE2026)
