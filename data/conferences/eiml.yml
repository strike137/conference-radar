links:
  website: https://sites.google.com/view/eimlicml2026
notes:
- Workshop on epistemic uncertainty in machine learning, covering uncertainty foundations, uncertainty-aware generative AI, AI safety, alignment and continual learning
- First edition at EurIPS 2025 (Copenhagen, December 6, 2025), second at ICML 2026 (Seoul, July 10, 2026)
- Non-archival, the CFP says submissions should not violate dual submission policies of archival venues
- Papers of 4 to 6 pages excluding references, double-blind review on OpenReview; at least one author per submission is asked to review
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
