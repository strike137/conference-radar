notes:
- UK medical image analysis conference underwritten by the British Machine Vision Association (BMVA), running since 1997
- Host city chosen each year by the MIUA Steering Committee through a bidding process; almost always held in the UK (Aberdeen 2023, Manchester 2024, Leeds 2025), Dublin in 2026
- Proceedings in Springer LNCS (2025 in three volumes); selected best papers invited to the Annals of the BMVA
- Short papers (up to 3 pages, since 2026) are published as abstracts in a Frontiers in Medical Technology ebook, not in LNCS
- Run on a low-cost financial model to keep fees down for PhD students; often offers bursaries
- Not listed in ICORE2026 and not on the CCF list
