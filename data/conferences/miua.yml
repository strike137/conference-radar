notes:
- Long-running UK-based conference on medical image processing and analysis; the 30th edition was in 2026
- Usually held at a UK university in July (Leeds 2025, Dublin 2026 as the first edition in Ireland, Warwick 2027)
- Full papers (8 to 15 pages, LNCS format) are double-blind reviewed and published in Springer LNCS
- Short papers (up to 3 pages) appear as an ebook in Frontiers in Medical Technology
- Welcomes clinical, mathematics, engineering and computer science researchers; good venue for students
- Not listed in ICORE2026 or the CCF list
