notes:
- Main venue for conceptual modeling, held annually since 1979; ER 2026 was the 45th edition
- Main conference papers in Springer LNCS; workshop papers in a separate Springer volume; demos, posters, tutorials
  and panels in CEUR-WS
- Full papers up to 16 pages and short papers up to 10 pages including references (LNCS style); double-blind review
  with at least three reviews plus a meta-review
- Mandatory abstract one week before the full paper deadline
- CORE A (ICORE2026), CCF C; location rotates between Europe, North America and Asia
