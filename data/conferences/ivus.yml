notes:
- Lithuanian conference series started in 1995, international since 2017; the acronym comes from the Lithuanian name
- Hosted in turn by Vytautas Magnus University, Kaunas University of Technology and Vilnius University Kaunas Faculty, always in Kaunas
- Aimed at Master's and PhD students and early career researchers; broad informatics topics including AI, information systems, networks and security
- Silesian University of Technology (Poland) is a partner since 2017
- One-day blended event (in person and remote); attendance is free
- Full papers of 5 to 10 pages in English, peer reviewed by the program committee
- Pre-proceedings printed with ISSN 2029-249X; revised selected papers published afterwards in CEUR-WS (IVUS 2025 -> CEUR-WS Vol-4213)
- Not listed in CORE ICORE2026 and not on the CCF list
