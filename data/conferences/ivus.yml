notes:
- One-day conference in Kaunas, Lithuania, aimed at Master's and PhD students and young researchers; started in 1995
- Hosted in turn by Vytautas Magnus University, Kaunas University of Technology and Vilnius University Kaunas Faculty; the KTU site covers the KTU years (2020, 2023, 2026)
- Part of the co-located Information Technologies event; blended format with in-person and remote presentations
- Broad topics including AI, information systems and databases, computer networks, signal and image processing and security
- Full papers of 5 to 10 pages via EasyChair; printed pre-proceedings, revised and extended selected papers published in CEUR-WS (IVUS 2026 -> Vol-4317)
- Attendance is free
