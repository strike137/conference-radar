notes:
- Long-running seminar held as part of CSBC, the annual congress of the Brazilian Computer Society (SBC); 53rd edition in 2026
- Broad scope across computer science and engineering, with a yearly theme (2026 on digital transformation and
  the climate emergency)
- Papers in Portuguese or English (Portuguese papers need an English abstract); up to 12 pages in the SBC
  template; double-blind review via JEMS
- Proceedings (Anais, ISSN 2595-6205) published open access in SBC OpenLib (SOL) with a DOI per paper
- Best papers invited to submit extended versions to the Journal of the Brazilian Computer Society (JBCS)
- Held with CSBC in a different Brazilian city each year (Gramado 2026)
- Not ranked in CORE ICORE2026
