id: mobihoc
name: MobiHoc
full_name: ACM International Symposium on Theory, Algorithmic Foundations, and Protocol Design for Mobile Networks
  and Mobile Computing
type: conference
tier: major
areas: [networking, communications]
region: worldwide
language: english
frequency: annual
organizer: ACM SIGMOBILE
proceedings: ACM DL
archival: true
indexing: [DBLP, Scopus]
rank:
  core: B
  ccf: B
fee: 1,250 USD non-member, 1,050 USD ACM/SIG member, 600 USD student (2026, early until Oct 15, conference only)
typical:
  deadline_months: [3, 4]
  conference_months: [10, 11]
links:
  website: https://www.sigmobile.org/mobihoc/2026/
  dblp: https://dblp.org/db/conf/mobihoc/index.html
notes:
- ACM SIGMOBILE symposium; the 2026 edition (27th) is in Tokyo (Hotel Metropolitan, Ikebukuro), and 2022 was in
  Seoul
- Single-track and selective, with a rebuttal phase; optional-blind review (authors may choose to anonymize); 10
  pages in ACM format including references
- Scope widened to next-generation wireless, O-RAN, ML/LLMs for networking, edge computing and network security
- CORE B in ICORE2026 (A in CORE2023); CCF B
- Workshops (e.g. AI-RAN, AIoT, CyberNet) with a late-August deadline offer an easier entry for students
