notes:
- Regional flagship conference of URSI covering all ten URSI commissions (electromagnetics, wave propagation,
  radio communication, remote sensing, radio astronomy, and more)
- Held about every three years between the URSI General Assemblies (Toyama 2010, Taipei 2013, Seoul 2016, New Delhi
  2019, joint AT-AP-RASC in Gran Canaria 2022, Sydney 2025, Toyama 2028)
- Papers reviewed by the technical programme committee; summary papers go to IEEE Xplore unless the author opts out,
  extended abstracts appear only in the symposium proceedings
- Student paper competition and Young Scientist Awards; Radio Science and Radio Science Letters ran a special issue
  for 2025
- Not listed in CORE ICORE2026
