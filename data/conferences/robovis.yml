id: robovis
name: ROBOVIS
full_name: International Conference on Robotics, Computer Vision and Intelligent Systems
type: conference
tier: minor
areas: [vision, ai]
region: europe
language: english
frequency: annual
organizer: INSTICC (Institute for Systems and Technologies of Information, Control and Communication)
organizer_country: [europe]
proceedings: Springer CCIS
archival: true
indexing: [Scopus, DBLP, EI]
fee: 445 EUR INSTICC member, 495 EUR non-member (2027, basic registration with lunches; later and on-site rates are higher)
typical:
  deadline_months: [9, 10, 11]
  conference_months: [2, 3]
links:
  website: https://robovis.scitevents.org/
  dblp: https://dblp.org/db/conf/robovis/index.html
notes:
- Organized by INSTICC; unlike most INSTICC events the proceedings are published by Springer in a CCIS book
- Small venue bringing together robotics, computer vision and intelligent systems; 2027 is the 7th edition
- Not listed in CORE ICORE2026; not on the CCF list
- Two submission stages (1st stage gives an earlier notification) plus a separate abstracts track; all deadlines AoE
- Held in European cities (Rome 2024, Porto 2025, Marbella 2026, Valletta 2027); the official site lists past
  editions for 2020, 2021 and 2024 onward
- Co-located with other INSTICC conferences (ICISSP, ICPRAM and BIOSTEC in 2026; VISAPP, PHOTOPTICS and GRIVAPP in
  2027); registration gives free access to them as a non-speaker
- Remote presentation allowed only exceptionally when speakers cannot travel
