notes:
- Annual meeting presenting highlights of recent algorithms research, started by IGAFIT in 2016 (Paris)
- Program of invited survey and paper talks (chosen from community nominations) plus contributed short talks with posters
- No conference proceedings; work already published or under submission elsewhere is welcome
- Contributed submissions are an abstract via EasyChair, reviewed by the PC with priority to recently published papers
- Modeled on Highlights of Logic, Games and Automata
- Held in Europe (Prague 2023, Warsaw 2024, Zurich 2025, Stockholm 2026)
- Not listed in CORE ICORE2026 or the CCF list
