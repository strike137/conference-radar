id: icccnt
name: ICCCNT
full_name: International Conference on Computing, Communication and Networking Technologies
type: conference
tier: minor
areas: [general, networking, communications, ai, security]
region: south-asia
language: english
frequency: annual
organizer: ICCCNT Foundation (website run by HIBS), hosted by an Indian Institute of Technology
organizer_country: [india]
proceedings: IEEE Xplore (up to 2025); EPiC Series in Computing (2026)
archival: true
fee: 9,500 INR early / 10,000 INR late for Indian academics; 600 USD early / 650 USD late for authors from Japan, Korea, USA and similar countries (2025)
typical:
  deadline_months: [6]
  conference_months: [7]
links:
  website: https://17icccnt.com/
notes:
- Large broad Indian conference covering computing, communication and networking in 75 tracks (AI, image processing, wireless, networks, cyber security, VLSI and more)
- Hosted each July at an IIT or IISc campus (IISc 2018, IIT Kanpur 2019, IIT Kharagpur virtual 2020 and 2021, IIT Delhi 2023, IIT Mandi 2024, IIT Indore 2025)
- 2025 edition was a six day hybrid event (online or onsite) with hands-on workshops and an industry exhibition
- Proceedings of past editions (12th to 15th) are in IEEE Xplore, linked from the official site
- Submission through EasyChair; registration fees are set per country
- 17th edition (2026) moves to the University of North Texas, Denton, USA, and its papers use the EPiC Series (EasyChair) paper kit, with eligible papers going to the EPiC Computing digital library instead of IEEE Xplore
- Not ranked by CORE (ICORE2026) and not on the CCF list
