organizer: Workshop organizing committee (University of Bari Aldo Moro, ICAR-CNR, University of Naples Federico II, University of Udine); co-located workshop of ECML PKDD
organizer_country: [europe]
proceedings: Springer (joint ECML PKDD post-workshop proceedings, named LNCS on the site)
archival: true
typical:
