links:
  website: https://nfmcpworkshop.github.io/
notes:
- Workshop co-located with ECML PKDD, held in Europe every September; 14th edition in 2026 (first in 2012, no 2021 edition listed)
- Italian organizing committee; the 2012 to 2015 edition sites were hosted by the University of Bari
- Accepted papers go into the joint ECML PKDD post-workshop proceedings published by Springer; authors may opt in or out
- The site names Lecture Notes in Computer Science but links the Springer CCIS series page (series 7899)
- Regular papers up to 12 pages or extended abstracts up to 8 pages, references included, LNCS format, submitted via Microsoft CMT
- Covers mining of complex data such as graphs, sequences, time series, spatio-temporal, multi-relational and semi-structured data
- Not listed in CORE ICORE2026
