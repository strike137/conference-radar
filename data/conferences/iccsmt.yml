notes:
- Annual since 2020 and held in China (Shanghai 2021, online 2022, Xi'an 2023, Xiamen 2024 and 2025, Beijing 2026)
- Run through a commercial conference service (AEIC/AiScholar submission and registration system)
- Proceedings in the ACM International Conference Proceedings Series since 2023 (IEEE for 2020 to 2022), submitted to EI Compendex and Scopus
- Mixes computer science with management, e-business and marketing topics
- Short review cycle (notification one week after the paper deadline in 2026)
- Presenter (abstract only) and listener registration are also offered
- Not listed in CORE ICORE2026 or the CCF list
