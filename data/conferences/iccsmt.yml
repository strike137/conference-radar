notes:
- Annual since 2020; held in China (Shanghai 2021, online 2022, Xi'an 2023, Xiamen 2024 and 2025)
- Run by the AEIC/AiScholar conference service (submission via ais.cn); contact via a 126.com address
- Mixes computer science with business and management topics (information systems, e-business, marketing, human resources)
- Proceedings in ACM ICPS (ACM DL) since 2023; IEEE Xplore for 2020 to 2022; indexed by EI Compendex and Scopus
- Each paper reviewed by two or three committee members, per the site
- Short cycle of about two weeks from submission to notification
- Presenter (abstract only) and listener registration are also offered
- Not listed in CORE ICORE2026
