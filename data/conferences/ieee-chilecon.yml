notes:
- Organized by the Chilean sections and chapters of IEEE; held in Chile every two years
- Covers electrical, electronic, computer and industrial engineering
- Accepted papers are published in IEEE Xplore and submitted to Scopus for indexing
- Earlier editions received more than 200 submissions from Chile, Latin America and abroad
- 2025 edition at PUCV in Valparaíso, held jointly with CLEI 2025 and JCC 2025 (shared EasyChair instance)
- Not ranked in CORE ICORE2026
