notes:
- Satellite event of CSBC, the annual congress of the Brazilian Computer Society (SBC); 14th edition in 2026
- Successor of WCGE (Workshop de Computação Aplicada em Governo Eletrônico), renamed by the SBC GIGD to reflect
  the move to digital government and to attract researchers across Latin America; LASDiGov name used since 2025
- Topics include digital government architectures and interoperability, data and AI in the public sector,
  security, privacy and digital identity, open government and open data
- Full papers 10 to 12 pages, practical reports 6 to 8 pages, extended abstracts 2 to 3 pages, SBC template
- Papers in Portuguese, Spanish or English; double-blind review by the program committee; submitted via JEMS
- Proceedings (Anais do LASDiGov, earlier Anais do WCGE) published open access in SBC OpenLib (SOL)
- Authors encouraged to send extended versions to the Journal on Interactive Systems (JIS) or iSys
- Held with CSBC in a different Brazilian city each year (Gramado 2026)
- Not listed in CORE ICORE2026
