notes:
- Regional IEEE ComSoc conference in China, co-organized with the China Institute of Communications; held since
  2012 and follows the IEEE ICC format
- Held every August in a Chinese city (Dalian 2023, Hangzhou 2024, Shanghai 2025, Wuhan 2026)
- Max 6 pages via EDAS; 12 technical tracks including communication and information security
- Large workshop program with a later deadline (July)
