notes:
- Interdisciplinary forum on haptics (neuroscience, perception, engineering and design of touch interfaces), held
  since 1992
- Independent IEEE conference since 2012, sponsored by the IEEE RAS Technical Committee on Haptics
- Held in even years; the IEEE World Haptics Conference takes the odd years
- Not listed in CORE (ICORE2026) and not on the CCF list (CCF lists the World Haptics Conference only)
- All accepted long and regular papers are published in IEEE Xplore
- Long papers 8 to 12 pages plus up to 3 pages of references, regular papers 4 to 6 pages plus up to 2; double-blind
  review; firm deadline with no extensions
- Work-in-progress papers, hands-on demos and IEEE Transactions on Haptics presentations have a later deadline in
  January
- Held in the USA (Philadelphia 2016, San Francisco 2018, Long Beach 2024, Reno 2026); 2020 and 2022 were virtual
