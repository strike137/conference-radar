notes:
- Biennial (odd years) since 1969; one of the oldest medical image analysis venues, widely regarded as highly
  selective
- Proceedings in Springer LNCS (2025 in two volumes); a subset of papers also goes to a MELBA journal special issue
- Known for a retreat-like atmosphere at remote venues with in-depth discussion of every paper
- Papers up to 12 pages excluding references in Springer LNCS format, double-blind; deadlines are not extended
- Not listed in CORE ICORE2026 or the CCF 2026 list, so tier is minor under the rank rules despite its reputation
- Rotates between North America, Europe and elsewhere (Bariloche 2023, Kos 2025, Lake Stukely, Canada 2027)
