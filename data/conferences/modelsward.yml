notes:
- INSTICC conference on model-based software and systems engineering; formerly International Conference on Model-Driven Engineering and Software Development (the name CORE still lists)
- Proceedings in the SCITEPRESS Digital Library; revised and extended versions of a short list of papers planned for a Springer CCIS book
- Two submission stages plus an abstracts track; all deadlines AoE
- 2027 edition co-located with ICORES, ICPRAM and BIOSTEC; registration gives free access to them
- Held in southern Europe (Lisbon 2023, Rome 2024, Porto 2025, Marbella 2026, Valletta 2027); remote presentation allowed in exceptional cases
- CORE C (ICORE2026); regarded as a smaller, fairly accessible venue
