notes:
- ACM SIGIR flagship information retrieval conference (search, recommendation, RAG); proceedings in ACM DL
- SIGIR 2026 was held in Melbourne; SIGIR 2027 is the 50th anniversary edition in San Jose, USA
- Full paper abstract deadline mid January, paper one week later; full papers moved to OpenReview in 2026 while
  other tracks stayed on EasyChair
- Full paper acceptance around 20%; short paper and other tracks have separate later deadlines
- Asia-Pacific sister conference SIGIR-AP is a more accessible regional option
