notes:
- IEEE symposium run under the TTTC (tttc-vts.org); 45th edition in 2027
- Covers test, reliability, calibration, validation, yield and security of microelectronic circuits and systems
- Regular papers up to 6 pages in IEEE two-column format (references excluded); title and abstract one week before the full paper
- Also has late-breaking results (up to 3 pages), special sessions, innovative practices, a PhD thesis contest and a student forum
- Accepted papers, including late-breaking results, appear in the formal proceedings in IEEE Xplore; at least one author must register and present in person
- Held every April in the USA (San Diego 2023, Tempe 2024 and 2025, Napa 2026 and 2027)
- ICORE2026 rank National/Regional; CCF C
