notes:
- Annual conference of the Association Computability in Europe, running since 2005
- Covers computability theory, logic, complexity, theory of algorithms and history and philosophy of computing
- Proceedings in Springer LNCS (2026 -> LNCS 16674); informal presentations without proceedings also accepted
- Held in Europe every year (Batumi 2023, Amsterdam 2024, Lisbon 2025, Trier 2026); usually in July
- 2026 edition co-located with MCU 2026 and CCA 2026; Women in Computability grants offered
- Ranked C in ICORE2026; not in the CCF list
