notes:
- Free and open source security conference held every year since 2018 at Université Catholique de Lille, France
- Totally free to attend and English-spoken, run by a small volunteer team
- Talks are recorded and slides and videos are published online; no formal proceedings
- CFP usually opens in mid January and closes at the end of March; speakers notified in late April
