notes:
- Half-day workshop co-located with SOUPS on gender, sexuality and online safety, privacy and security
- First edition 2024 (hybrid, with SOUPS 2024), second edition 2025 in Seattle (offsite at University of Washington)
- Submissions are one-page position papers (lightning talks) or two-page work-in-progress extended abstracts (WIP talks)
- Position papers are not considered published work; no proceedings
- 2025 program chairs from King's College London and University of Washington
- Not listed in CORE ICORE2026
