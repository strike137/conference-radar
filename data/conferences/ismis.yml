notes:
- Long-running symposium on intelligent systems (first proceedings 1993 in Springer); the 2026 edition is the 28th
- Proceedings titled Foundations of Intelligent Systems in Springer LNCS/LNAI (2026 is LNCS 16685)
- 'ISMIS 2026: 19 full papers and 5 industrial papers selected from 44 submissions'
- Held in Europe in recent editions (Warsaw 2017, Limassol 2018, Graz 2020, Cosenza 2022, Poitiers 2024, Lyon 2026);
  now every two years
- Listed in CORE ICORE2026 as C under the name International Symposium on Foundations of Intelligent Systems
- Regular papers up to 10 pages in Springer LNCS/LNAI style via EasyChair; best papers invited to a special track of
  the Springer Journal of Intelligent Information Systems (JIIS)
- 2026 also had an industry session on generative AI whose papers go to a separate Springer Studies in Computational
  Intelligence book
- Registration 2026 about 530 EUR regular early, 470 EUR student early
