notes:
- Workshop of the ACL Special Interest Group on Turkic Languages, co-located with a major *ACL conference
- Editions with ACL 2024 (Bangkok), EACL 2026 (Rabat) and ACL 2027 (Kyoto)
- Research papers up to 8 pages plus shared task system descriptions; direct submission via OpenReview or via ACL Rolling Review
- Each edition hosts a shared task (2026 terminology-aware English to Turkish machine translation)
- Proceedings in the ACL Anthology
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
