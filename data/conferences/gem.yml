id: gem
name: GEM
full_name: Workshop on Natural Language Generation, Evaluation, and Metrics
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: Rotating academic and industry organizing committee; co-located with ACL or EMNLP
organizer_country: [usa, europe, other]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [3]
  conference_months: [7]
links:
  website: https://gem-workshop.com/
notes:
- Workshop on evaluation of language generation and LLMs (metrics, benchmarks, LLM as judge, human evaluation)
- Editions at ACL 2021 (online), EMNLP 2022 (Abu Dhabi), EMNLP 2023 (Singapore), ACL 2025 (Vienna) and ACL 2026
  (San Diego); no edition in 2024
- Archival papers (4 to 8 pages) go into the ACL Anthology; non-archival extended abstracts (1 to 2 pages) are also
  accepted
- Accepts direct submissions on OpenReview and pre-reviewed ARR commitments; hosts the ReproNLP shared task
- "Acceptance rate: about 73% (2026, 90 of 124 submissions accepted incl. 14 non-archival abstracts)"
- Direct submission authors may be asked to review up to 2 papers
