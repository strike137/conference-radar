notes:
- EAI conference on big data analytics, cognitive computing and trustworthy AI; 2026 is the 9th edition
- Proceedings published as a book in the EAI/Springer Innovations in Communication and Computing series (not LNICST)
- Held every year in Coimbatore, India (online in 2020); 2026 edition is hybrid/online
- General chair from Sri Eshwar College of Engineering, Coimbatore
- Full papers 12 to 20 pages in Springer format; submission via Confy+
- Not listed in ICORE2026
