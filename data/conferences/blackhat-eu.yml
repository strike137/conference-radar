notes:
- European edition of Black Hat, held in December at ExCeL London
- Talks are selected through a Call for Briefings (formerly Call for Papers); speaking teams are limited to two people
- Each speaker may submit up to five proposals; LLM-generated text is not permitted in submissions
- CFP deadlines are in GMT (UTC+0)
- Industry talks with slides and white papers on the website, no archival proceedings
