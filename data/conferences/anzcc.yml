notes:
- Regional control systems conference started in 2017; run by the ANZCC Steering Committee Incorporated (Australian not-for-profit, chair at UWA)
- Technical co-sponsors IEEE CSS, IFAC and the Asian Control Association (obtained for 2024; listed as being sought for 2025)
- Accepted papers are submitted for inclusion in IEEE Xplore; contributing papers 4 to 6 pages, practitioner papers 2 to 6 pages
- Presentation-only submissions (1 to 2 pages) are not included in the proceedings
- Almost always held on the Gold Coast, Australia (Melbourne 2018, Auckland 2019); short two-day event
- No edition in 2023; not listed in CORE ICORE2026
