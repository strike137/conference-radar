notes:
- Workshop co-located with IEEE CCNC in Las Vegas; 6th edition in 2026, 7th edition in 2027
- Chairs from University of Bologna, Istanbul Technical University, University of Paris-Saclay and University of Minnesota
- Topics include communication and networking for ground, aerial and underwater robot swarms, UAV networks,
  swarm intelligence and networked control
- Papers up to 6 pages (up to 3 extra pages at 100 USD each) go into the CCNC proceedings in IEEE Xplore; submissions via EDAS
- Not listed in ICORE2026
