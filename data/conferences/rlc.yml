notes:
- Annual conference dedicated to reinforcement learning, started in 2024 (Amherst 2024, Edmonton 2025, Montreal 2026)
- Accepted papers are published as articles in the Reinforcement Learning Journal (RLJ), an independent peer-reviewed
  journal
- Review process prioritizes rigorous methodology over perceived importance
- Advisory committee of well-known RL researchers (Peter Stone, Satinder Singh, Emma Brunskill, Michael Littman,
  Michael Bowling, Sergey Levine and others)
- Too new to appear in the CORE ICORE2026 list
- RLC 2027 is planned at two locations (Brown University in early August and Odense, Denmark, jointly with EWRL, in late
  August); authors choose where to present
