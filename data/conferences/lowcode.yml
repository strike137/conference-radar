id: lowcode
name: LowCode
full_name: International Workshop on Modeling in Low-Code Development Platforms
type: workshop
tier: minor
areas: [software]
region: worldwide
language: english
frequency: annual
organizer: LowCode organizers and steering committee (JKU Linz, University of L'Aquila, University of York, UAM Madrid, IMT Atlantique, Nantes University), co-located with MODELS
organizer_country: [europe]
proceedings: ACM DL or IEEE Xplore (MODELS joint workshop proceedings; ACM in 2024, IEEE announced for 2025)
archival: true
typical:
  deadline_months: [7]
  conference_months: [9, 10]
links:
  website: https://lowcode-workshop.github.io/
notes:
- Workshop bringing low-code platform vendors and users together with model-driven engineering researchers
- Held with MODELS since 2020; 2024 was the 5th edition (Linz) and 2025 the 6th (MODELS 2025, Grand Rapids)
- Research papers and industrial experience reports, regular (10 pages) or short (5 pages) including references
- Single-blind review; papers go into the MODELS joint workshop proceedings
- Not listed in the CORE portal (ICORE2026)
