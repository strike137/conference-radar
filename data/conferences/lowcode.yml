notes:
- MODELS workshop on low-code development platforms and their relation to model-driven engineering
- Held every year at MODELS since 2020; 2025 was the 6th edition (Michigan, USA)
- Follows the MODELS venue, which rotates between Europe and North America
- Organizers and steering committee from JKU Linz, University of L'Aquila, University of York, Nantes University, UAM Madrid and IMT Atlantique
- Research papers and industrial experience reports, as regular (10 pages) or short (5 pages) papers including references, IEEE format, single-blind review
- Accepted papers appear in the MODELS joint workshop proceedings published by IEEE
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
