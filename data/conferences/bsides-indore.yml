notes:
- Community-run Security BSides cybersecurity conference in Indore, Madhya Pradesh, India
- First edition (X1) in 2023; second edition (X2) in September 2026; third edition (X3) planned for 2027
- 2026 edition had a paid hands-on training day followed by a one-day conference with a keynote, nine CFP-selected talks, a CXO panel, hacker villages, a CTF and a resume clinic
- Talks are chosen by a CFP review board of security practitioners; no proceedings
- Student, individual and corporate passes; the paid training day is capped at 30 seats
