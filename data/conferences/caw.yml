notes:
- One-day workshop affiliated with Eurocrypt, described as the constructive twin of WAC and inspired by Real World Crypto
- Editions so far are Zurich 2024, Madrid 2025 and Rome 2026
- Covers formalizing the security of deployed cryptography, building primitives and systems for practice, and industry deployment
- Mix of invited and contributed talks; contributed talk proposals answer a call for talks (2025 deadline 7 February AoE)
- No proceedings; talk recordings are posted on YouTube
- Some speaker funding and student stipends from ZISC in 2026
- Not listed in ICORE2026 or the CCF 2026 list
