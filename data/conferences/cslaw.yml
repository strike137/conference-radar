notes:
- Interdisciplinary ACM venue for research that combines rigorous computer science with rigorous legal analysis
- Topics include privacy, encryption and surveillance, cybersecurity regulation, AI regulation, ML fairness, digital forensics and platform governance
- Three submission types; full archival papers in the ACM DL proceedings, full non-archival papers (one-page summary only) and posters
- Single-blind review with an author response phase; 15-page archival versions may be submitted to law reviews in parallel
- Held in the USA except 2025 (New York 2019, Washington DC 2022, Boston 2024, Munich 2025, Berkeley 2026, Chicago 2027)
- Annual since 2024; a workshop for junior scholars runs alongside
- Not listed in ICORE2026 or the CCF list
