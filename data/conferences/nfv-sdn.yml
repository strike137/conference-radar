organizer: IEEE Communications Society
proceedings: IEEE Xplore
indexing: [DBLP]
rank:
  core: Unranked
fee: 550 USD ComSoc member, 600 USD IEEE member, 750 USD non-member (2026, author registration covering up to 2
  papers)
typical:
  deadline_months: [6, 7]
  conference_months: [11]
links:
  website: https://nfvsdn2026.ieee-nfvsdn.org/
notes:
- '2026 edition is in Tokyo (Nov 2 to 4, 2026): easy to attend from JAIST even without a paper'
- Small ComSoc conference on NFV, SDN and network virtualization; 6-page papers, up to 2 extra pages at 100 USD
  each
- Rotates globally (Dresden 2023, Natal 2024, Athens 2025, Tokyo 2026); in 2025 and 2026 the deadline was extended
  into late July, notification in September
- ComSoc student, conference and young professional travel grants offered (2026 application deadline Sep 10)
