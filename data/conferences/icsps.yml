links:
  website: https://www.icsps.org/
notes:
- Held every year since 2009; 2026 is the 18th edition
- Host university changes every year (UESTC in Chengdu 2025, Kunming University of Science and Technology 2024,
  Xi'an University of Posts and Telecommunications 2023); 2020 to 2022 were virtual
- Proceedings alternate between publishers -> IEEE Xplore (2022, 2025, 2026) and SPIE Digital Library (2018 to 2021,
  2023, 2024); ACM DL before that. All are stated as EI Compendex and Scopus indexed
- Double-blind review per the site; papers are published only after registration and presentation
- Selected papers invited to journal special issues (IET Signal Processing for 2024, Displays for 2026)
- Contact goes through a secretariat mailbox (icsps@bmail.org); 2023 to 2025 ran online sessions alongside onsite ones
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
