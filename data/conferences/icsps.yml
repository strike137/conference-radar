organizer: Host Chinese university with IEEE co-sponsorship (2026 co-sponsored by Xiamen University and IEEE)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
typical:
  deadline_months: [9]
