notes:
- Started in 2024 (Kunming), then Chengdu 2025 and Lanzhou 2026; co-sponsored by IEEE and a host Chinese university
- Proceedings in IEEE Xplore (2024 and 2025 volumes online); 2024 volume indexed by EI Compendex and Scopus
- Double-blind review; fee covers 5 pages, 70 USD per extra page
- "Registration fee: 550 USD regular presenter with publication (2026, through Sep 10)"
- Conference secretariat uses a 163.com email address; not ranked by CORE or CCF
