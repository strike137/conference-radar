notes:
- Workshop on quantum AI and AI for quantum computing, held with AAAI since 2025 (Philadelphia 2025, Singapore 2026, Montreal 2027)
- Proceedings in Springer CCIS (2026 edition in CCIS volume 2872)
- Full papers (9 to 16 pages), work in progress (up to 8 pages) and abstract-only lightning talks in CCIS format, not anonymized, via EasyChair
- 2027 edition is a half-day workshop
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
