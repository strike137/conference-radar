notes:
- ACM conference on the Web and its impact on society; interdisciplinary (computer science plus social sciences)
- Main and companion proceedings in the ACM DL; authors may opt out of the proceedings (for social scientists who
  want to publish in journals)
- Full papers 6 to 10 pages and short papers up to 5 pages (ACM format, references included); double-blind review
  with at least three referees
- 18th edition in 2026 at TU Braunschweig, Germany; workshops, tutorials and PhD symposium on the first day
- Student travel funding from SIGWEB and WebIST in 2026
- Not found in the ICORE2026 or CCF 2026 lists
