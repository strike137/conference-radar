full_name: IberSPEECH (Jornadas en Tecnologias del Habla and Iberian SLTech Workshop)
type: conference
tier: minor
areas: [nlp, ai]
region: europe
language: english
frequency: biennial
organizer: RTTH (Spanish Thematic Network on Speech Technology) and ISCA SIG-IL, with a local host (Universidad Politecnica de Madrid in 2026)
organizer_country: [europe]
proceedings: ISCA Archive (open access)
archival: true
fee: 415 EUR early regular, 255 EUR early student (2026; RTTH members get a discount)
typical:
  deadline_months: [6]
  conference_months: [11]
links:
  website: https://iberspeech.tech/
notes:
- Joint event of the Jornadas en Tecnologias del Habla and the Iberian SLTech Workshop, focused on speech and language technology for Iberian languages
- Supported by ISCA; accepted papers are archived in the ISCA Archive
- Papers follow the Interspeech paper kit (4 pages plus 2 for references); double-blind review by three reviewers
- Hosts the ALBAYZIN evaluation challenges and a special session for demos, PhD theses and projects
- Held in Spain or Portugal (Lisbon 2016, Barcelona 2018, Valladolid 2021 online, Granada 2022, Aveiro 2024, Madrid 2026)
- Every two years since 2022
- Not listed in CORE ICORE2026
