id: mediaeval
name: MediaEval
full_name: MediaEval Benchmarking Initiative for Multimedia Evaluation Workshop
type: workshop
tier: minor
areas: [vision, data, ai]
region: europe
language: english
frequency: annual
organizer: MediaEval Coordination Committee (Politehnica Bucharest, SimulaMet and Radboud University in 2026); in cooperation
  with ACM SIGMM
organizer_country: [europe]
proceedings: CEUR-WS (Working Notes Proceedings of the MediaEval Workshop)
archival: true
typical:
  deadline_months: [6, 10]
  conference_months: [6, 9, 10]
links:
  website: https://multimediaeval.github.io/
notes:
- Benchmarking initiative with shared tasks on multimedia analysis, retrieval and access (medical VQA, video memorability,
  news images, multimodal summarization and others)
- Participating teams submit runs and a 4-page working notes paper, then present at the annual workshop; "Quest for
  Insight" papers analyze data and tasks without a system
- Working notes proceedings published in CEUR-WS (Vol-3658 for the 2023 edition)
- Hybrid workshop in Europe with free online participation (Bergen Jan 2023, Amsterdam Feb 2024, Dublin Oct 2025, Amsterdam
  Jun 2026 with ACM ICMR, Bucharest Sep 2027 with CLEF); 2020 and 2021 online
- No edition labeled 2024; the 2023 edition workshop took place in February 2024
- Discount on in-person registration for ACM SIGMM members and students
- Not listed in ICORE2026 and not on the CCF list
