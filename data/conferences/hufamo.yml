notes:
- Workshop on human factors in model-based engineering (usability and developer experience of modeling languages and tools) and on modeling human factors of end users
- Established in 2015; every edition co-located with MODELS (2015, 2016, 2018, 2019, 2021, 2022, 2023, 2026)
- Not held every year; 2026 was the 8th edition after a break in 2024 and 2025
- Accepted papers published in the MODELS conference companion proceedings by ACM
- Double-blind review; full papers up to 10 pages and position papers up to 5 pages, ACM format
- Welcomes study designs without results, so early-stage empirical work can be discussed before running the study
- Steering committee from Spain, Portugal, Australia (Monash HumaniSE Lab), Sweden and France
- Not listed in the CORE portal (ICORE2026)
