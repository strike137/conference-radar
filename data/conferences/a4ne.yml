notes:
- Full-day hybrid workshop co-located with ACM SIGCOMM 2026 in Denver; follows the 2020 SIGCOMM Education Workshop
- Topics are teaching computer networking, AI in networking courses, labs and testbeds such as FABRIC, curricula and assessment
- Short papers 1 to 4 pages and long papers 5 to 10 pages in the ACM sigconf template, anonymous submission via HotCRP
- Constructive review with the goal of accepting most submissions; in-person attendance not required
- Submissions are non-archival; accepted papers are posted as PDFs on the workshop site and discussed in themed panels
- Virtual registration is free; in-person registration goes through SIGCOMM
