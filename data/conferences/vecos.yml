notes:
- Small formal verification and performance evaluation conference created by a Euro-Mediterranean network of researchers
- Covers model checking, probabilistic verification, dependability, QoS and performance evaluation of concurrent and
  distributed systems
- Proceedings in Springer LNCS; selected papers invited to a journal special issue (ISSE, IJCCBS or ARIMA)
- Papers up to 15 pages in LNCS format, submitted via EasyChair; at least one author must attend and present
- Location rotates around Europe, North Africa and China (Paris 2025, Djerba 2024, Marrakech 2023, Beijing 2021, Xi'an
  2020); no edition in 2022
- CORE C (ICORE2026)
