notes:
- Flagship biennial conference of the IEEE Malaysia ComSoc/VTS Joint Chapter, held in odd years since 1993 (2025
  was the 17th)
- City changes each edition (2021 virtual, 2023 Kuala Lumpur, 2025 Melaka)
- Proceedings in IEEE Xplore and Scopus; submission via EDAS; blind peer review; page limit 5 pages in 2023, 6 pages
  in 2025
- Student grants for IEEE ComSoc/VTS student members; best paper and best presenter awards
- Ranked Regional in ICORE2026
