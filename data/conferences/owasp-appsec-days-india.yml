notes:
- Regional OWASP application security conference for India, branded Global AppSec Days India on the official site
- 2024 was virtual (Nov 14-15), 2025 in person at the J N Tata Auditorium, IISc Bengaluru (Oct 18), 2026 virtual again (Nov 21-22)
- The 2026 virtual edition is free to attend
- Call for presentations via Sessionize with OWASP tracks (builder, breaker, defender, manager/culture); 45 and 20 minute sessions
- No proceedings; practitioner talks only
