notes:
- ACM conference on embodied conversational agents and virtual characters (agents, HCI, social signals)
- Accepted full papers appear in the conference proceedings in the ACM Digital Library
- Full papers 4 to 8 pages excluding references (ACM sigconf); double-blind review by at least two reviewers
- Separate poster, demo, workshop and doctoral consortium tracks; SIGAI student travel grants offered
- Mostly held in Europe (Wurzburg 2023, Glasgow 2024, Berlin 2025); 2026 in Puebla, Mexico, co-located with ACII 2026
- CORE B (ICORE2026)
