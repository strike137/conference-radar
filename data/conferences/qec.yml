notes:
- Main conference on quantum error correction and fault tolerance, covering both theory and experiment
- Held every year or every other year at the discretion of the steering committee (2007, 2011, 2014, 2017, 2019, 2023, 2025, 2026, 2027)
- "No published proceedings by charter: invited and contributed talks are recorded and posted online"
- 2026 had three submission tracks (Published Work with an arXiv manuscript, Rapid Communication, Poster Only) with a 1 page abstract via EasyChair
- Strong industry sponsorship (Google Quantum AI, IonQ, PsiQuantum, Alice & Bob and others); over 500 participants in 2026
- Not listed in CORE ICORE2026
