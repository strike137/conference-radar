notes:
- Run by the CLEF Association, an independent nonprofit set up in 2013; European counterpart to TREC, NTCIR and FIRE
- Combines a peer-reviewed conference (Springer LNCS) with evaluation labs whose working notes go to CEUR Workshop
  Proceedings
- Lab overview abstracts are presented at ECIR in spring before the September conference
- Held in Europe every year (Madrid 2025, Jena 2026, Bucharest 2027)
- Not found in the CORE ICORE2026 search and not in the CCF 2026 list
