notes:
- Practitioner conference on machine learning and AI applications in business and academia, held every year since 2016
  (no 2020 edition; 2021 ran online)
- Three days -> one day of hands-on workshops followed by two conference days; hybrid with a livestream, workshops in
  person only
- Held at O2 Universum, Prague since 2023; about 800 to 1,000 attendees and about 45 speakers
- Three open calls -> workshops (3 hours, higher acceptance rate), talks (25 minutes, no product pitches) and posters
  (lunchtime poster session); each takes an abstract of up to 500 words
- Selected speakers get a free full-conference ticket; poster authors get a 30% ticket discount
- "Tickets (2027 early bird): 290 EUR + VAT conference only, 490 EUR + VAT conference and workshops"
- No papers or proceedings
- Not listed in the CORE ICORE2026 portal
