notes:
- Moroccan conference with ENSIAS / Mohammed V University among the patrons; technically co-sponsored by IEEE ComSoc
- Proceedings in IEEE Xplore (CommNet'25 ISBN 979-8-3315-5781-2), later indexed in dblp and Scopus
- Held in Rabat, Morocco (2023 to 2026); the 2021 and 2022 editions were virtual; hybrid format
- Papers up to 7 pages in IEEE format, 8th page for an extra 25 EUR; submission via EDAS
- Not listed in CORE ICORE2026
