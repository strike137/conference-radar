notes:
- Co-located with IEEE/IFIP NOMS; third edition at NOMS 2026 in Rome (half-day, six papers plus a round table)
- Generative AI and LLMs for network management along the FCAPS model; the 2026 scope adds agentic AI
- Papers up to 6 pages in IEEE two-column format; submission via JEMS3; peer reviewed, in-person presentation expected
- Accepted and presented papers go into the NOMS proceedings and are submitted to IEEE Xplore
- Not listed in CORE ICORE2026 or the CCF list
