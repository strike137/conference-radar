id: ctt
name: CTT
full_name: Workshop on Creative-text Translation and Technology
type: workshop
tier: minor
areas: [nlp, ai]
region: europe
language: english
frequency: annual
organizer: Organizing committee from KU Leuven, UCLouvain, Ghent University, University of Groningen and ULB (contact Bram
  Vanroy); co-located with EAMT or MT Summit
organizer_country: [europe]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [3, 4]
  conference_months: [6]
links:
  website: https://ctt2025.ccl.kuleuven.be/
notes:
- One-day workshop on machine translation, CAT tools and LLMs for creative texts (literature, marketing, subtitling,
  games)
- 1st edition with EAMT 2024 (Sheffield), 2nd edition with MT Summit 2025 (Geneva)
- Proceedings in the ACL Anthology; papers are published only if presented in person
- Long papers up to 10 pages, double-blind review; 2025 submissions via EasyChair
- Not listed in ICORE2026 and not on the CCF list
