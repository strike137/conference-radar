notes:
- Workshop on machine translation, CAT tools and LLMs for creative texts (literature, poetry, marketing, subtitling, video games, social media)
- First edition with EAMT 2024 in Sheffield (2024-06-27); second edition with MT Summit 2025 in Geneva
- Long papers up to 10 pages plus references; double-blind review via EasyChair; MT Summit template
- Papers appear in the proceedings only if presented in person
- Proceedings published by EAMT in the ACL Anthology (2025.ctt-1, ISBN 978-2-9701897-6-3)
- Not ranked in ICORE2026 and not on the CCF list
