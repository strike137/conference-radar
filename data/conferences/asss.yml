notes:
- Started as the International Symposium on Advanced Security on Software and Systems, a workshop co-located with
  AsiaCCS 2021 (Hong Kong), IEEE EuroS&P 2022 (Genoa) and AsiaCCS 2023 (Melbourne)
- Standalone conference held in China since 2025 (Guilin 2025, Linyi 2026); 2026 is the fifth edition
- 2025 proceedings in Springer CCIS; the 2026 site says Springer LNCS/CCIS format without naming the series
- Hybrid; online presentation allowed
- Papers up to 18 pages excluding references and appendix, anonymized, at least three reviewers
- Deadlines are usually extended; selected papers invited to journal special issues
- Small venue run by the same group as ADIoT and EISA
