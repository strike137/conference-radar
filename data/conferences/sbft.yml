notes:
- One-day workshop co-located with ICSE; renamed from SBST (Search-Based Software Testing) to SBFT in 2023, 2026 was the 19th edition
- Covers search-based testing and fuzzing (test generation, fuzzers, test oracles, test suite minimization)
- Hosts popular testing tool competitions (2026 had RESTful API testing and CPS testing of self-driving cars and UAVs)
- Full papers up to 8 pages, short and demo papers up to 4 pages, position papers and tool entries up to 2 pages, extended abstracts up to 5 pages; double-blind via HotCRP
- Proceedings published by IEEE CS as "IEEE/ACM International Workshop on Search-Based and Fuzz Testing (SBFT)" (2023 Melbourne, 2024 Lisbon, 2025 Ottawa)
- Follows ICSE across the world (Melbourne 2023, Lisbon 2024, Ottawa 2025, Rio de Janeiro 2026)
- Attendance requires ICSE workshop registration; the workshop is also live-streamed on Twitch
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
