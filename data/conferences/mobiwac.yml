organizer: MobiWac organizing committee (symposium co-located with MSWiM); ACM until 2023, technically sponsored by IEEE since 2025
organizer_country: [international]
proceedings: Symposium proceedings in IEEE format (since 2025); ACM DL for 2002 to 2023
archival: true
