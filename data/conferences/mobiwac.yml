links:
  website: http://mobiwac-symposium.org/2026/
notes:
- Symposium co-located with MSWiM, held in the same city and week (23rd edition in 2026, first held 2002 in Fort Worth)
- Mobility management, medium access, 5G/6G and beyond, mobile networking, tracking, QoS, security and applications
- Known as ACM MobiWac through 2023 with proceedings in the ACM DL; no 2024 edition; IEEE format and IEEE technical sponsorship since 2025
- Single-blind review via EDAS; 8 pages IEEE double-column, up to 10 with paid extra pages
- Recent editions in Alicante (2020, 2021), Montreal (2022, 2023), Barcelona (2025) and Paris (2026)
- Not listed in ICORE2026 or the CCF 2026 list
