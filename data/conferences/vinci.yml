notes:
- Symposium on visual information communication, information visualization, visual analytics, HCI and visual arts
- Proceedings in the ACM International Conference Proceeding Series (ICPS); ACM open access APC may apply
- Tracks for technical papers (full 8 pages, short 4+1, posters 2), art papers, art and media galleries, and a cultural
  computing special track; double-blind review via CMT
- Selected papers invited to special issues of Journal of Visualization and Visual Informatics
- Rotates worldwide (Potsdam 2021, Chur 2022, Guangzhou 2023, Hsinchu 2024, Linz 2025, Hangzhou 2026)
- ICORE2026 C; not on the CCF list
