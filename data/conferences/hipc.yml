notes:
- India's main high performance computing conference since 1994, held every December in an Indian city (2020 Pune,
  2021 Bengaluru, 2025 Hyderabad, 2026 Bengaluru)
- CCF C (computer architecture and parallel computing), CORE National India
- From 2026 organized around five themes (HPC systems, AI systems, hardware and accelerators, edge computing,
  quantum computing), so AI systems and edge work fit
- Double-blind review with abstract registration, a rebuttal period and shepherding; proceedings in IEEE Xplore,
  selected papers invited to a JPDC special issue
- Also a Student Research Symposium, posters and workshops; registration is expensive for international
  authors
