notes:
- Main Brazilian research symposium on computers in education; 37th edition in 2026
- Held within CBIE (Brazilian Congress on Computers in Education) together with WIE, JAIE and other satellite events
- Research track (10 to 12 pages), innovative ideas and emerging results track (6 to 8 pages) and a Journal First track for RBIE papers
- Papers in Portuguese, English or Spanish
- Proceedings in SBC OpenLib (Anais do SBIE, ISSN 2316-6533) with DOIs, open access
- At least one author must register with a publication fee
- Not listed in CORE ICORE2026
