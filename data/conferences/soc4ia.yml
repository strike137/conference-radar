notes:
- Workshop on engineering AI agents as services (interoperability, orchestration, governance, MCP and A2A, Agentic Web)
- 1st edition at ICSOC 2026; continues DCAI4IA 2025 (Data-Centric AI for Intelligent Agents, at ICSOC 2025) and builds on FAAW 2026
- Research, position/vision and industry/experience papers in LNCS format; single-blind review by at least three PC members
- Accepted papers go into the Springer ICSOC 2026 workshop post-proceedings; selected papers invited to a journal special issue
- Not listed in ICORE2026 or the CCF list
