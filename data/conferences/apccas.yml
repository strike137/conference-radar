notes:
- Regional flagship conference of the IEEE Circuits and Systems Society for Asia and Pacific (Region 10)
- Rotates within Asia-Pacific (2022 Shenzhen, 2023 Hyderabad, 2024 Taipei, 2025 Busan, 2026 Fukuoka)
- Covers analog and digital signal processing, VLSI, machine learning circuits, power, sensory, biomedical and
  nonlinear circuits and systems
- Proceedings in IEEE Xplore; regular papers up to 4 pages plus 1 page of references, double-blind review (2026)
- Selected papers invited to IEEE TCAS-I, IEEE OJCAS and IEEE TVLSI (2026)
- Paper deadline was extended twice in 2026 (2026-04-30 -> 2026-05-15 -> 2026-05-22)
- One full registration covers up to two papers (2026)
- Not listed in ICORE2026; also has special sessions, embedded workshops, live demos and tutorials
