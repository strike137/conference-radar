notes:
- Annual European workshop on computational geometry since 1983, held in a different European city each year
  (Barcelona 2023, Ioannina 2024, Liblice 2025, Hagen 2026, Norrkoping 2027, Passau 2028)
- Non-competitive forum with an informal atmosphere; all original, correct, well-presented and in-scope submissions are accepted
- Non-archival; the booklet of abstracts is a collection of preprints and results are expected to appear in other venues
- Extended abstracts of at most 175 lines in a LIPIcs-based class; previously published work may be submitted
- Selected papers invited to a special issue of Computing in Geometry and Topology (2026)
- 95 contributions accepted in 2026
- Best student presentation award
- Only CG Society members may register; fee 215 EUR regular and 165 EUR student, early (2026)
- CORE C (ICORE2026); not on the CCF list
