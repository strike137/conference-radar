notes:
- European computational geometry workshop first held in 1983, now annual and standalone (not co-located), held in March or April
- Organized as an event of the CG Society since 2025; attendees must be CG Society members (free)
- Non-competitive, non-archival; the booklet of abstracts has no ISBN and counts as preprints
- From 2027 authors may leave their extended abstract out of the booklet and give only a one-page abstract with a link
- Extended abstracts of up to 175 lines in a LIPIcs-based class; already published work may be submitted
- Selected papers invited to a special issue of Computing in Geometry and Topology (CGT)
- Best Student Presentation Award; 95 contributions accepted in 2026
- "Registration fee: 215 EUR regular, 165 EUR student (2026, early)"
- Rotates within Europe (Barcelona 2023, Ioannina 2024, Liblice 2025, Hagen 2026, Norrkoping 2027, Passau 2028)
- CORE C (ICORE2026); not on the CCF 2026 list
