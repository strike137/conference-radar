notes:
- Run by the Polish Neural Network Society with Częstochowa University of Technology and SAN University in Łódź as co-organizers
- Held in Zakopane, Poland, in June (the October 2020 and June 2021 editions were online); hybrid (on-site and online presentation) since 2022
- Proceedings in Springer LNAI (LNCS in some years); full papers of about 12 pages
- Series dates back to 1994; annual in recent years
- CORE ICORE2026 rank is National (Poland)
