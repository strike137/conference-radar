notes:
- Workshop on skin image analysis (dermoscopy, clinical photos, total-body photography, histopathology) hosted by the International Skin Imaging Collaboration
- 11th edition in 2026; held with ISBI (2016, 2017), MICCAI (2018, since 2023), CVPR (2019 to 2021) and ECCV (2022)
- Proceedings in Springer LNCS (2025 -> LNCS 16149, joint volume with the CAPI 2025 workshop)
- Double-blind review, up to 8 pages plus 2 pages of references; submission via OpenReview in 2026
- Best paper and honorable mention awards
- Not listed in CORE ICORE2026 or the CCF 2026 list
