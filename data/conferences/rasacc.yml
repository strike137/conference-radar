notes:
- Workshop at IEEE/IFIP DSN on dependability, resilience and intrusion tolerance of autonomous systems across cloud, edge, fog and IoT
- First edition 2026 at DSN in Charlotte, USA
- Workshop papers go in the DSN-W supplement to the DSN proceedings on IEEE Xplore; papers not presented are excluded
