notes:
- Flagship workshop of the IEEE SPS Speech and Language Processing Technical Committee; held in odd years, alternating
  with IEEE SLT
- Despite the workshop name it is a standalone peer-reviewed event with keynotes, special sessions, challenges and
  tutorials; all papers are presented as posters
- Papers are published in IEEE Xplore; 6 pages of content plus up to 2 pages of references only (2025)
- Has an author rebuttal period and a separate later deadline for demo, system, data and challenge papers
- Well regarded in the speech community although ICORE2026 ranks it C
- Location rotates worldwide (2025 Honolulu, USA)
