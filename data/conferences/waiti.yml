id: waiti
name: WAITI
full_name: Workshop on AI for Cyber Threat Intelligence (joint with IoT-SCTI, IoT Security and Cyber Threat Intelligence)
type: workshop
tier: minor
areas: [security, ai, nlp]
region: north-america
language: english
frequency: annual
organizer: University of Padua and University of Pavia (Italy) with Georgia Tech, Northwestern University and Cochin
  University of Science and Technology (India); co-located with IEEE ACSAC
organizer_country: [europe, usa, india]
proceedings: IEEE Xplore (ACSAC Workshops volume, IEEE CS CPS)
archival: true
rank:
  core: Unranked
fee: 480 USD regular, 340 USD student (2026, ACSAC one-day workshop rate until Nov 16) plus 125 USD author surcharge
  per paper
typical:
  deadline_months: [10]
  conference_months: [12]
links:
  website: https://waiti-workshop.github.io/
  wikicfp: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=201318
notes:
- Co-located with ACSAC every year since 2024; 3rd edition in 2026; merged with the IoT-SCTI workshop
- 'Short papers: 6 double-column IEEE pages plus up to 2 pages of references/appendices; anonymous submission; SoK
  papers welcome'
- Proceedings in IEEE Xplore via the ACSAC Workshops volume; a small extra publication fee applies
- Strong focus on LLMs and NLP for cyber threat intelligence, plus IoT and network threat intelligence
- Late deadline (early October, 23:59 AoE) about two months before the workshop
