notes:
- Workshop for HPC systems administrators, architects and analysts on best practices for running supercomputing systems, held with SC every year since 2016
- Accepts papers (2 to 8 pages excluding references, SC proceedings template), slide decks, 5-minute lightning talks and reproducible artifacts
- Two review rounds, with a resubmission window after the first reviews
- Accepted papers and artifacts are published on the workshop GitHub repository and archived on Zenodo with a DOI
- SC26 lists it among the workshops with non-SC proceedings
- The same chapter also runs an HPCSYSPROS Symposium at PEARC
- Not listed in CORE ICORE2026
