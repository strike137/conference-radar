id: icmlc
name: ICMLC
full_name: International Conference on Machine Learning and Cybernetics
type: conference
tier: minor
areas: [ai, vision, security]
region: asia-pacific
language: english
frequency: annual
organizer: ICMLC & ICWAPR organizing committee; IEEE SMC Society technical co-sponsorship; supported by the University
  of Adelaide, University of Hyogo, University of Cagliari (DIEE), University of Alberta and others
organizer_country: [china]
proceedings: IEEE Xplore
indexing: [IEEE Xplore, EI Compendex]
rank:
  core: 'National: China'
fee: HKD 5200 non-IEEE member, HKD 4800 IEEE member, HKD 4400 student (registration page on the 2026 site)
typical:
  deadline_months: [4, 5]
  conference_months: [7, 9]
links:
  website: https://www.icmlc.com/
notes:
- Held jointly with ICWAPR (Wavelet Analysis and Pattern Recognition); one registration covers both
- Established 2002; recent venues Miyazaki (2024), Bali (2025), Cagliari (2026); 4 to 6 page IEEE-format papers,
  at least three reviewers
- 2026 edition had a Workshop on Machine Learning Security and an "AI for Security and Security of AI" track
- Beware of an unrelated conference using the same name in the same city and dates (2025 Bali, 2026 Cagliari); the
  genuine one is icmlc.com
- 'ICORE2026 lists it as National: China; not in the CCF list'
