notes:
- Launched in 2011 in Tampere, Finland; the Steering Committee Chair Prof. Jari Nurmi (Tampere University) has been
  the permanent General (Co-)Chair since 2018
- Circulates among European locations (Castellon 2023, Antwerp 2024, Rome 2025 and 2026)
- Held in June every year through 2025; the 2026 edition moved to October and was co-located with IPIN in Rome
- Regular papers are 4 to 6 pages in IEEE two-column format and go to IEEE Xplore; IEEE has technically co-sponsored
  the conference since the start, lately through the AES Society
- Co-located WIPHAL workshop (Work-in-Progress in Hardware and Software for Location Computation) takes industry and
  work-in-progress papers in CEUR-WS, with a similar full-paper peer review
- Extended top papers are invited to a special issue of the IEEE Journal of Indoor and Seamless Positioning and
  Navigation
- Organizers state that the 2027 and 2028 editions are already arranged; details not yet announced
- Not listed in ICORE2026 or the CCF 2026 list
