id: itc-cscc
name: ITC-CSCC
full_name: International Technical Conference on Circuits/Systems, Computers and Communications
type: conference
tier: minor
areas: [communications, systems, general]
region: asia-pacific
language: english
frequency: annual
organizer: IEIE (Korea), IEICE (Japan) and ECTI (Thailand)
organizer_country: [korea, japan, thailand]
proceedings: IEEE Xplore; top papers invited to submit extended versions to the AEU journal (2026)
archival: true
indexing: [IEEE Xplore]
rank:
  core: Unranked
fee: Full registration 550 USD non-member, 500 USD IEIE/IEEE/IEICE/ECTI member; additional-paper or student registration
  400/350 USD (2026, Bangkok, early overseas rate)
typical:
  deadline_months: [3, 4]
  conference_months: [7]
links:
  website: https://itc-cscc2027.org/2027/
notes:
- Jointly run by IEIE (Korea), IEICE (Japan) and ECTI (Thailand); rotates among the three countries (2025 Seoul,
  2026 Bangkok, 2027 Busan); started in 1986 as a Korea-Japan joint conference
- Accepted and presented papers submitted to IEEE Xplore; short papers via EDAS (1 to 6 pages in 2025, 1 to 4 pages
  in 2026); 2026 also offered a direct journal track (ECTI Transactions on EEC)
- EECS broadly with an EE focus (circuits and systems, communications, computers)
- Each accepted paper needs one full registration even for student authors; further papers by the same author can
  use the student rate (2025 and 2026 policy)
- 'Lab view: international conference mostly in name, acceptance rate believed to be 70% or higher (no official
  figure)'
