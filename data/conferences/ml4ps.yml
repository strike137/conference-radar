notes:
- Annual workshop on ML for physics, astronomy, chemistry, materials and Earth science, and physics-inspired ML, running since 2017
- Was an official NeurIPS workshop through 2025 (2024 Vancouver, 2025 San Diego)
- 2026 edition is independent of NeurIPS, held at Georgia Tech in Atlanta near the NeurIPS venue and hosted by the Georgia Tech AI4Science Center; NeurIPS registration not required
- Non-archival with no published proceedings; extended abstracts of published work are accepted
- Short papers up to 4 pages in the NeurIPS template, double-blind review on OpenReview; tracks for research, evaluations and datasets, and perspectives
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
