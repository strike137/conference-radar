notes:
- First edition ran with IEEE WCNC 2025; second edition (WS01, half day) with IEEE ICC 2026 in Glasgow
- Host conference may change from year to year
- Topics include RIC architecture, xApp/rApp conflicts and interoperability, AI for the RAN, testbeds, security and spectrum policy for Open RAN
- TPC co-chairs from University College Dublin, University of Surrey and University of York
- Accepted and presented papers go into the IEEE ICC 2026 proceedings and IEEE Xplore
- Papers up to 6 pages; submissions via EDAS
- Distinct from the ACM Open-AI RAN workshop (MobiCom) and INTRAN (WCNC)
- Not listed in ICORE2026
