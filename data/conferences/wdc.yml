organizer: General chair Simon S. Woo (Sungkyunkwan University, Korea); general co-chair and program co-chairs Shahroz
  Tariq, Kristen Moore and Sharif Abuadbba (CSIRO Data61, Australia); co-located with ACM AsiaCCS
organizer_country: [korea, australia]
