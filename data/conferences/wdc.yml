  website: https://sites.google.com/view/wdc-2026/
notes:
- Co-located with ACM AsiaCCS since 2022 (Nagasaki 2022, Melbourne 2023, Singapore 2024, Hanoi 2025, Bangalore 2026),
  so the location follows AsiaCCS
- Own proceedings volume in the ACM Digital Library each year, sponsored by ACM SIGSAC
- Double-blind; full papers up to 8 pages plus 2 appendix pages, short papers 6 pages, 2-4 page discussion and demo
  papers, 1-2 page vision and poster papers; ACM sigconf format, submitted via EasyChair
- Two submission rounds per year, and deadlines are usually extended
- One regular (non-student) AsiaCCS registration is required per paper
- Small program; 6 papers in 2 sessions plus 2 keynotes in 2026
- Same organizing team as the 3D-Sec workshop at ACM CCS
- Not listed in ICORE2026 or the CCF list
