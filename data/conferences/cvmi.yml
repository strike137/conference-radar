links:
  website: https://cvmi2026.coeptech.ac.in/
notes:
- Indian conference on computer vision, image processing and machine intelligence, held since 2022
- Host institute rotates; IIIT Allahabad (2022, 2024), ABV-IIITM Gwalior (2023), NIT Rourkela (2025) and COEP Technological University Pune (2026)
- Proceedings in IEEE Xplore (stated for 2024, 2025 and 2026; the 2022 proceedings went to Springer); the 2025 edition was sponsored by the IEEE Rourkela Sub-Section and endorsed by IAPR
- Double-blind review; papers up to 6 pages plus two paid extra pages
- A paper must be presented to appear in the proceedings; 2025 was in-person only, 2026 allows online presentation on request
- 2026 used two submission rounds (April 15 and April 30)
- Program includes a PhD symposium and IAPR best paper award
