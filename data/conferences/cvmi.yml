organizer: Indian institutes with local IEEE sections (COEP Pune with IIIT Allahabad in 2026, NIT Rourkela in 2025, IIIT Allahabad in 2022 and 2024, ABV-IIITM Gwalior in 2023)
organizer_country: [india]
proceedings: IEEE Xplore
archival: true
