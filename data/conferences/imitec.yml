notes:
- Multidisciplinary IT and engineering conference run by a network of Southern African universities (Vaal University of Technology, Sol Plaatje University, Namibia University of Science and Technology and others)
- Past hosts include Vaal University of Technology (2024), Namibia University of Science and Technology and Sol Plaatje University
- The site says five previous editions had proceedings published in IEEE Xplore; 2026 papers are submitted for inclusion in IEEE Xplore subject to IEEE quality checks
- Double-blind peer review; seven tracks covering AI and robotics, data science, cyber security, power systems, smart grid, IoT and ICT4D
- 2026 is the 6th edition, hosted by North-West University in collaboration with IEEE, with a postgraduate symposium for Master's and PhD students
- Not listed in CORE ICORE2026
