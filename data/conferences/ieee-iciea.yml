id: ieee-iciea
name: IEEE ICIEA
full_name: IEEE Conference on Industrial Electronics and Applications
type: conference
tier: minor
areas: [general, ai]
region: worldwide
language: english
frequency: annual
organizer: IEEE Industrial Electronics Chapter of Singapore and IEEE Singapore Section, with a local host university
organizer_country: [singapore]
proceedings: IEEE Xplore
archival: true
indexing: [EI]
typical:
  deadline_months: [4, 11]
  conference_months: [6, 8]
links:
  website: https://www.ieeeiciea.org/
notes:
- Broad industrial electronics conference with tracks on AI, control, energy, industrial informatics, power
  electronics, robotics and signal processing
- Run since 2006 by the IEEE Industrial Electronics Chapter of Singapore; IEEE IES is financial and technical sponsor
- Mostly held in China, with some editions in Europe (Kristiansand 2020 and 2024, Catania 2026)
- Proceedings of all past editions are in IEEE Xplore and indexed by EI Compendex
- Full papers up to 6 pages; best paper and best track awards require on-site presentation
- Listed as a Class A conference by the Chinese Association of Automation (CAA); not listed in the CORE ICORE2026 portal
