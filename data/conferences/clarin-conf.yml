notes:
- Annual conference of CLARIN ERIC, the European research infrastructure for language resources and technology
- Submissions are 3 to 4 page extended abstracts via EasyChair; submissions must state their CLARIN relevance
- Accepted abstracts go into the online Book of Extended Abstracts; invited authors may submit 10 to 12 page full papers after the conference, peer reviewed and published in Linköping Electronic Conference Proceedings
- Held in a different European city each year (Prague 2022, Leuven 2023, Barcelona 2024, Vienna 2025, Brighton 2026); hybrid in 2026
- Includes a PhD student session, the CLARIN Bazaar and the Steven Krauwer Awards
- Separate from the ParlaCLARIN workshop held with LREC
- Not ranked in ICORE2026 and not on the CCF list
