notes:
- One-day conference on NLP for low-resource African languages with a focus on East Africa
- Run by Sunbird AI and the Makerere University AI Lab in Kampala, Uganda
- Proceedings in PMLR (2025 -> vol. 314); accepted papers revised to at least 5 pages
- Research track and industry track, at least 5 pages each, submitted via OpenReview
- Each paper reviewed by at least 3 program committee members; papers presented as lightning talks in paper panels
- Not listed in ICORE2026 or the CCF list
