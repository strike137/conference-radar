notes:
- Premier venue for usable security and privacy (human factors, user studies); CORE A
- Anonymous review with early rejection and an author response period; mandatory paper registration one week before
  the February deadline
- Papers published open access by USENIX; usually co-located with USENIX Security in August
- 2026 edition held separately in Hannover, Germany (in collaboration with CISPA); 2027 edition in Denver, co-located
  with USENIX Security '27
- Acceptance rate around 20%; also has posters, lightning talks and workshops
