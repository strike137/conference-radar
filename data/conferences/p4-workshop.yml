notes:
- Annual one-day workshop of the P4 community on programmable data planes (P4 language, targets, toolchain, use
  cases, SmartNICs, eBPF); 2026 was the 10th edition
- Talks chosen through a call for proposals by a program committee from industry and academia; no papers or
  proceedings, recordings and slides are posted on p4.org and YouTube
- Held in Silicon Valley, often hosted by Google (Sunnyvale 2024 and 2026); 2025 was a hybrid half day with the OCP
  Global Summit in San Jose
- 2026 theme was Building AI-Native Networks with P4; registration closes before the event, no on-site registration
- Separate from EuroP4, the consortium's academic workshop in Europe with ACM DL papers
- Not listed in CORE ICORE2026
