notes:
- Python community conference run by Python Cameroon; website in English and French
- 2026 was the first PyCon held in Cameroon
- 2026 edition was three days of talks and workshops (3 hour hands-on workshops, regular talks, panels) at the Girafe Hotel, Yaounde
- 2026 added a dedicated Ubuntu and open source track co-organized with UbuCon Cameroon, plus a Django track
- Proposals via Sessionize; in-person talks only, at most two proposals per person, proposals largely written by AI are rejected
- Talks only, no papers or proceedings
