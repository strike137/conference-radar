full_name: Polish Conference on Artificial Intelligence
type: conference
tier: minor
areas: [ai]
region: europe
language: english
frequency: annual
organizer: Polish Neural Network Society and Polish SigML (joint meeting), hosted by a Polish university each year
organizer_country: [europe]
proceedings: Springer LNNS (Lecture Notes in Networks and Systems, selected regular papers); host university press volume
archival: true
typical:
  deadline_months: [2, 3]
  conference_months: [4]
links:
  website: https://pp-rai.pl/
notes:
- Annual joint meeting of Polish AI scientific organizations (Polish Neural Network Society, Polish SigML); 7th edition in 2026
- Held in Poland at a different university each year (Lodz 2023, Warsaw 2024, Katowice 2025, Krakow 2026)
- Regular papers (10 to 12 pages); the PC decides whether an accepted paper goes to the Springer proceedings or to a shortened 4 to 6 page version in the host university press volume
- Extended abstracts (2 to 4 pages) presented as posters; one page business project summaries are not published
- Not ranked on CORE ICORE2026 or CCF
