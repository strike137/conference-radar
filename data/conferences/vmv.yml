notes:
- Annual symposium of the German computer graphics and visualization community (GI Fachbereich Graphische Datenverarbeitung), covering graphics, vision, visualization and visual analytics
- Proceedings published in cooperation with Eurographics and archived in the EG Digital Library; selected papers invited to extend for Computer Graphics Forum
- Papers up to 8 pages in EG style, double-blind review via SRM; non-archival Nectar Track for recently published work
- Held in Germany almost every year (Braunschweig 2023, Munich 2024, Erlangen 2025, Siegen 2026); joint with GCPR in some years (2022, 2024, 2026)
- Not listed in ICORE2026 and not on the CCF list
