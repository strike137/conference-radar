notes:
- Organized by IARIA as part of the TechWorld congress, co-located with WIRELESS ANALYTICS
- Not the same event as IARIA VEHICULAR (Advances in Vehicular Systems, Technologies and Applications)
- Young venue, first held in 2024; 4th edition in 2027
- Published open access in the IARIA ThinkMind library; prints via Curran Associates
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Spain and Portugal so far (Valencia 2024, Barcelona 2025 and 2026, Porto 2027)
