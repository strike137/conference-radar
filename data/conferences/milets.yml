organizer: Workshop organizing committee co-located with ACM SIGKDD; steering committee Eamonn Keogh (UC Riverside), Yan Liu
  (USC) and Abdullah Mueen (University of New Mexico)
organizer_country: [usa]
proceedings: Workshop website (PDFs of accepted papers, non-archival)
archival: false
typical:
