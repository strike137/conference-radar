links:
  website: https://kdd-milets.github.io/milets2026/
notes:
- Long-running KDD workshop on time series mining and learning; 2026 was the 12th edition
- Co-located with ACM SIGKDD every year, so it follows KDD around the world (Toronto 2025, Jeju 2026)
- Papers up to 9 pages including references (4 to 8 suggested) in the KDD template, double-blind single-round review via EasyChair
- Accepted papers are posted as PDFs on the workshop site; the 2025 call says non-archival, without proceedings
- Concurrent submission to other journals and conferences is allowed
- Also accepts a small number of open problem papers
- 23 accepted papers listed for 2026
- Not listed in ICORE2026 and not on the CCF list
