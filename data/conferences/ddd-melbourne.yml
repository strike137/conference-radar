notes:
- Inclusive non-profit one day conference for the Melbourne software community, held on a Saturday
- Part of the Developer! Developer! Developer! family of community events; run by the non-profit Oz Dev Inc.
- Open call for presentations on any software industry topic, followed by public voting that decides the agenda
- Free onsite childcare, financial assistance tickets available; no papers
- Held at Melbourne Town Hall; also runs the regular DDD By Night meetup
