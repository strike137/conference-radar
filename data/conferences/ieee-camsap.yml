notes:
- Biennial IEEE Signal Processing Society workshop (10th edition in 2025) on sensor array, adaptive and multi-sensor
  signal processing
- Held in December at a Caribbean or Central American beach resort (Curacao 2017, Guadeloupe 2019, Costa Rica 2023,
  Punta Cana 2025)
- Papers up to 5 pages in the IEEE double-column template, page 5 for references only; proceedings in IEEE Xplore
- Authors of IEEE SPS journal papers can present them without re-review (not included in the proceedings)
- Not listed in ICORE2026
