links:
  website: https://sites.google.com/view/ai4mat
notes:
- Workshop on AI for materials discovery (AI-guided design, automated synthesis, automated characterization)
- First held at NeurIPS 2022; since 2025 usually twice a year, once with ICLR and once with NeurIPS
- Editions so far at NeurIPS 2022 to 2025, Vienna 2024 (BOKU), ICLR 2025 Singapore, ICLR 2026 Rio de Janeiro, NeurIPS 2026 Sydney
- Non-archival with no official proceedings; papers under review elsewhere are welcome
- Double-blind review on OpenReview in the host conference format; tracks for papers, findings/tools/open challenges and a themed track
- ICLR 2026 and NeurIPS 2026 editions offered a journal track with a special collection in the Wiley journals Advanced Intelligent Systems and Advanced Intelligent Discovery
- Travel grants offered to attendees
- Not listed in ICORE2026 or the CCF list
