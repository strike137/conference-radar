notes:
- Organized by IARIA as part of the DataSys congress, co-located with AICT, ICIW, ICIMP and other IARIA events (16th edition in 2026)
- Covers mobile services, 5G and small cell networks, mobile computing, context-aware services and mobile users
- Published open access in the IARIA ThinkMind library (ISSN 2308-3468); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Spain, Portugal, Italy or France (Porto, Nice, Venice, Valencia, Lisbon in recent years); onsite or online presentation allowed
- Moved from late June (2022, 2023) to April (2024 to 2026); the 2027 edition moves to March
