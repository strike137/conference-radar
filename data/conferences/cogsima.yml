notes:
- Small interdisciplinary venue on situation awareness for humans, machines and human-AI teams (AI, cognitive science, human factors, robotics, information fusion)
- Sponsored by IEEE SMCS; proceedings in IEEE Xplore, only for papers presented on site
- Regular papers 6 to 8 pages, emerging research and poster papers 3 to 5 pages; at least three reviewers; submission via EDAS (2027)
- Location rotates between North America and Europe (2023 Philadelphia, 2024 Montreal, 2025 Duisburg, 2026 Tempe, 2027 Veszprem)
- Discounted registration for IEEE SMCS members, IEEE members and students
- "CORE rank: National: USA (ICORE2026); not on the CCF list"
