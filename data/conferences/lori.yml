links:
  website: http://www.golori.org/
notes:
- Logic of rational agency and interaction (epistemic logic, belief revision, social choice, games, multi-agent systems, argumentation)
- Biennial in odd years since 2007, aimed at building an East-Asian interdisciplinary logic community; mostly held in China (Chongqing 2019, Xi'an 2021, Jinan 2023, Xi'an 2025, Chengdu 2027), with Taipei 2015 and Sapporo 2017
- Regular papers in Springer proceedings (FoLLI series); selected papers invited to a Synthese special issue or topical collection
- Regular papers at most 12 pages plus up to 5 pages of appendix in LNCS format, submitted via EasyChair; a separate short paper call in 2025
- Best student paper award
- Not listed in ICORE2026; not checked on the CCF list
