notes:
- Organized by INABIMS (BIM and Geospatial Systems) with committee members from Telkom University, UTM and Universitas Bali Internasional
- Held in Bali, Indonesia; first edition in 2025, hybrid (onsite or live virtual presentation)
- 2025 proceedings published in IEEE Xplore and indexed in Scopus
- Tracks on data science and AI, geoinformatics and GeoAI, and IoT and security in geoinformatics
- 4 to 6 page IEEE papers via EDAS, double-blind review by 2 to 3 reviewers
- Deadlines are extended repeatedly (2025 submission moved from September 5 to November 7)
- Not listed in ICORE2026 and not in the CCF list; a small regional venue
