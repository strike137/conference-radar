notes:
- Security BSides conference in Bloomington, Indiana, USA, run by volunteers
- Two days (Friday and Saturday) at the Monroe Convention Center in downtown Bloomington, with talks, trainings, workshops and villages
- Each edition has a theme; 2026 was "Insert Coin to Opt Out" on privacy and user autonomy
- Students attend free with a student ID
- Talk proposals through Sessionize; talks only, no proceedings
- Archives on the site cover 2023, 2024 and 2025
