notes:
- Half-day workshop on recommender systems that serve human values (trust, fairness, privacy, transparency, well-being), held with The Web Conference (WWW)
- 1st edition at WWW 2025 in Sydney, 2nd at WWW 2026 (moved from Dubai in April to an online event in June), 3rd accepted at WWW 2027 in Dublin
- Core organizers from ICT CAS, UCAS and Kuaishou (Fei Sun, Qi Cao, Shuchang Liu); 2026 team also had UC San Diego, CSIRO Data61 and University of Birmingham, 2027 team adds Fudan, Leiden University and HKBU
- 13 papers accepted in 2026 (6 oral, 7 poster)
- 2027 edition planned as an in-person half-day afternoon session
- Unpublished accepted papers can go into The Web Conference Companion Proceedings in the ACM Digital Library; previously published work can be presented but is not included
- Papers 4 to 8 pages in ACM format plus references, single-blind review, submission via OpenReview
- Not listed in the CORE ICORE2026 portal
