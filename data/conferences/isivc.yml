notes:
- Biennial IEEE symposium on signal, image and video processing and communications, founded by Driss Aboutajdine;
  13th edition in 2026 (IEEE conference record 69944)
- The website calls it the International Symposium on Image, Video, and Communications; the IEEE title adds Signal
- Mostly held in Morocco (El Jadida 2022, Marrakech 2024, Beni Mellal 2026), sometimes in Tunisia or France
  (Tunis 2016, Saint-Etienne 2021)
- Steering committee chaired from IMT Atlantique (France); local organization by a Moroccan university
- "Four tracks: signal and audio processing, computer vision and image processing, digital communications and
  networking, data science and applications"
- Double-blind review, papers up to 6 pages in IEEE format, submitted via Microsoft CMT
- Proceedings in IEEE Xplore; extended 2024 papers went to special issues of Annals of Telecommunications and
  Multimedia Tools and Applications (Springer)
- Not listed in CORE ICORE2026 or the CCF list
