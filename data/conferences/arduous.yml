notes:
- Workshop on data annotation for AI systems; formerly "Annotation of useR Data for UbiquitOUs Systems"
- Co-located with PerCom 2017 to 2023, Informatik Festival 2024, ECAI 2025 (Bologna) and KI 2026 (Bremen)
- 2025 (9th edition) proceedings in Springer CCIS; the 2026 CFP also names the CCIS series
- Double-blind review; full papers 12 pages, short papers 8 pages, poster and demo papers 3 to 5 pages
- The 2026 workshop focuses on annotation in the era of LLMs and foundation models
- Not listed in ICORE2026 or the CCF list
