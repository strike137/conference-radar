notes:
- Interdisciplinary venue on digital methods for energy systems (AI, data analytics, IoT, digital twins, smart grids, buildings, district heating)
- In scope only at the edge; much of the program is energy engineering, economics and policy
- Run by the Energy Informatics.Academy community led from the University of Southern Denmark, with a local co-host (UCAS and Sino-Danish College in 2026, UNITEN in 2025)
- Papers in Springer LNCS since 2024 (two volumes per year, published before the conference); 2021 to 2023 papers went to the SpringerOpen journal Energy Informatics
- Long papers 12 to 15 pages and short papers 6 to 12 pages go into LNCS; 250-word abstracts are published only on the website
- Single-track format, co-located with a two-day Summer School in Energy Informatics
- Location moves around the world (Beijing 2021, Vejle 2022, Campinas 2023, Bali 2024, Kuala Lumpur 2025, Beijing 2026)
- Best paper awards come with a fee waiver for an extended version in the journal Energy Informatics
- Not listed in ICORE2026 or the CCF list
