notes:
- Annual national conference of CCISA (Taiwan's academic security society), held since 1991; 34th edition in 2024
- Papers in Chinese or English; abstract-only or full-paper (up to 6 pages) submissions; anonymous review via EasyChair
- Several hundred participants per edition (per organizers); best paper, best student paper and best presentation
  awards (paper awards need CCISA membership)
- Traditionally held in late May or June; 2020, 2021 and 2024 editions were in August or September; host university
  changes each year (NTUT in Taipei 2024, Feng Chia University in Taichung 2025, NCKU in Tainan 2026)
- '2026 submission types: main paper (up to 6 pages, oral or poster, best paper eligible), thesis abstract (1 page,
  lightning talk) and project results abstract'
- Selected full papers recommended to Journal of Information Science and Engineering or Journal of Internet Technology
  (2024)
