notes:
- Annual conference since 2006 run by the National Aerospace University KhAI in Kharkiv, Ukraine, on dependability, safety and security of computer systems, IoT, AI and unmanned vehicles
- Held in Greece since 2022 (Athens 2022 to 2025, Corfu 2026) in hybrid mode, co-organized with IEEE Greece Section and Greek universities
- Accepted papers appear in IEEE Xplore and are indexed by Scopus; papers are 5 to 8 pages in IEEE format, reviewed by at least three reviewers via CMT
- Several co-located workshops each year (for example EI4Safe and HMcCS in 2026)
- Registration 300 EUR for non-IEEE members, 260 EUR for IEEE members, 240 EUR for students (2026); reduced online fees for Ukrainian participants
- Deadlines move around a lot from year to year (August in 2024 and 2026, November in 2022 and 2025)
- Not listed in CORE ICORE2026
