notes:
- ACNS satellite workshop held every year since 2019 (8th edition in 2026); post-proceedings in Springer LNCS
- Two submission rounds (January and March); both 2026 rounds were extended by one week
- LNCS format, 18 pages main body including references (30 pages total), anonymous submission
- 'Scope: AI and industrial IoT/CPS security, critical infrastructure, adversarial ML, applied crypto for IIoT;
  5 papers in a single late-morning session in 2026'
- Program chairs change every year; ACNS rotates worldwide (Kyoto 2023, Abu Dhabi 2024, Munich 2025, Stony Brook
  2026)
