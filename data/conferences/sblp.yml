notes:
- Programming languages symposium of the Brazilian Computer Society (SBC); 30th edition in 2026
- Held each year within CBSoft (Congresso Brasileiro de Software) in a different Brazilian city (Recife 2025, São Paulo 2026)
- Proceedings (Anais do SBLP) published open access in SBC OpenLib (SOL)
- Papers in Portuguese or English (English encouraged); full papers up to 8 pages, short papers up to 4 pages,
  excluding references; lightweight double-blind review
- Main track and undergraduate track; top papers of past editions were invited to a special issue of the
  Journal of Computer Languages (COLA, Elsevier), and for 2026 the organizers only planned to approach COLA again
- Small venue (24 papers in the 2026 program)
- Not ranked in CORE ICORE2026
