id: icnlsp
name: ICNLSP
full_name: International Conference on Natural Language and Speech Processing
type: conference
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: ICNLSP committee (conference chair Mourad Abbas) with a host university (University of Trento in 2026)
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [6]
  conference_months: [8, 9, 10]
links:
  website: https://www.icnlsp.org/
  dblp: https://dblp.org/db/conf/icnlsp/
notes:
- Small NLP and speech conference running since 2015; 9th edition in 2026
- Proceedings in the ACL Anthology (36 to 48 papers per year in 2021 to 2025); selected extended papers in Springer Signals and Communication Technology
- Hybrid format; online in 2021 to 2023, then Trento 2024, Odense 2025 and Trento 2026
- Not listed in the CORE ICORE2026 or CCF 2026 rankings
