notes:
- Organized by SCMS School of Engineering and Technology, Karukutty, Ernakulam, Kerala, India; every edition held there
- Proceedings in IEEE Xplore in 2022 and 2026 (technically co-sponsored by IEEE Kerala Section); 2023 and 2024 proceedings in Springer Algorithms for Intelligent Systems
- No edition in 2025; editions in 2022, 2023, 2024, 2026 and 2027
- Double-blind review, six-page IEEE double-column format, similarity limit 15%, submission via Microsoft CMT
- Deadlines are usually extended (2026 submission deadline moved from Feb 20 to Feb 25)
- "Registration fee 2027: INR 4,000 to 8,000 for Indian authors, USD 120 to 240 for foreign delegates"
- Not listed in ICORE2026 or CCF
