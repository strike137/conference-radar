notes:
- Run by GR Scholastic and the Global Knowledge Research Foundation (Ahmedabad, India), with IFIP InterYIT as organizing partner
- Held in London every year since 2017 (America Square Conference Centre); started in Udaipur, India in 2015
- Proceedings in Springer Lecture Notes in Networks and Systems, about ten volumes per edition
- Very large and broad congress covering communications, intelligent systems, software, security, e-governance and health informatics
- Hybrid format; in 2027 only the first day is physical in London and the remaining three days are online
- Two registration cycles (early bird and regular) with their own paper deadlines; notification and camera-ready dates are given per paper
- Not listed in the CORE ICORE2026 portal
