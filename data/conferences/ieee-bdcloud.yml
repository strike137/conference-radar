notes:
- Big data and cloud computing conference; 16th edition in 2026
- Runs as a sibling conference of IEEE ISPA in the IEEE AI for Science Congress, with its own chairs and steering committee
- Papers published by IEEE Computer Society Press and submitted to IEEE Xplore and EI; selected papers invited to a journal
  special issue
- Submission via EDAS in the two-column IEEE Computer Society proceedings format
- Deadlines are usually extended by several weeks (2025 -> Aug 16 to Aug 25; 2026 -> Sep 30 to Oct 15)
- Held in Shenyang, China in 2025 and Kuala Lumpur, Malaysia in 2026
- Not listed in ICORE2026; not on the CCF 2026 list
