id: case-workshop
name: EEUCA (formerly CASE)
full_name: 'Workshop on Event Extraction and Understanding: Challenges and Applications (formerly Workshop on Challenges
  and Applications of Automated Extraction of Socio-political Events from Text)'
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizing committee led by the ERC Emerging Welfare project at Koc University (Turkey), with Wageningen
  University & Research, the European Commission Joint Research Centre, Virginia Tech and the University of Cagliari (2025)
organizer_country: [other, europe]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [1, 8]
  conference_months: [3, 7, 9]
links:
  website: https://research.ku.edu.tr/research-infrastructure/research-centers-and-units/emw/workshops/#eeuca-2026
notes:
- Workshop on event extraction from text for social and political science (protests, conflict, hate speech, event
  datasets and ontologies); follows CLEF ProtestNews 2019 and AESPEN at LREC 2020
- Co-located with ACL-IJCNLP 2021 (online), EMNLP 2022 (Abu Dhabi), RANLP 2023 (Varna), EACL 2024 (St. Julians) and
  RANLP 2025 (Varna)
- Renamed EEUCA (Workshop on Event Extraction and Understanding) for its 9th edition, held at ACL 2026 in San Diego
  on 3 July 2026 with two shared tasks (vaccine critical memes, toxic intent in gaming chat)
- Proceedings in the ACL Anthology; the RANLP editions are published by INCOMA and indexed there too
- Short and long papers following ARR page limits; double-blind review by at least three PC members; submission via
  START or ARR
- Runs shared tasks each year (multimodal hate speech, stance and humor detection in LGBTQ+ discourse in 2025)
- Not listed in ICORE2026 and not on the CCF list
