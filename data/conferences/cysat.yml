notes:
- Space cybersecurity conference run since 2021 by CYSEC, a European satellite cybersecurity company based in Luxembourg, Toulouse and Lausanne
- Flagship edition held every year at Station F, Paris; regional editions in Toulouse (2025), Washington DC (2024),
  Singapore (2026, with SGInnovate) and Madrid (2026)
- Audience of space agencies (ESA, CNES), satellite operators, defense primes, researchers and startups; 600+
  attendees and 75+ speakers at the Paris edition
- Talk proposals are sent through the contact form; no formal CFP deadline and no proceedings
- Talks are published on the CYSAT YouTube channel; Paris ticket about 500 EUR for two days
- Vendor-run event with an exhibition floor alongside a master stage and a technical stage
