notes:
- Workshop on big data, security and privacy in IoT and cyber-physical systems, including generative AI and LLMs for
  CPS; 2026 is the 9th edition
- Held with the IEEE International Conference on Big Data
- Accepted papers appear in the IEEE digital library (IEEE BigData workshop proceedings)
- Full papers up to 10 pages, short papers up to 4 pages, vision or position papers up to 6 pages, IEEE CS format
- Hybrid in 2025, remote-only in 2026
- Not ranked by CORE (not in ICORE2026) or CCF
