links:
  website: https://2026.ropec.org/
notes:
- Run by the IEEE Centro Occidente Section in Mexico; 2026 is the 28th edition, co-organized with Universidad
  Michoacana de San Nicolás de Hidalgo, Instituto Tecnológico de Morelia and CFE
- Three areas, power, electronics and computing
- Papers up to 6 pages in IEEE format, submitted via EasyChair; title and abstract in English, body in English or
  Spanish
- Presented papers that meet IEEE rules are submitted to IEEE Xplore (ISSN 2573-0770)
- Held in Mexico (Ixtapa 2025, Morelia 2026); the paper deadline is usually extended by about three weeks
- Not ranked in CORE ICORE2026
