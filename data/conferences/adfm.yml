notes:
- Half-day workshop on anomaly detection with foundation models (vision, multimodal and sector-specific anomaly detection)
- Co-located with a different host conference each year (IJCAI 2024 in Jeju, ICCV 2025 in Honolulu, CVPR 2026 in Denver)
- Full papers up to 8 pages in the host conference template, double-blind review on CMT, no dual submissions
- From 2025 the papers appear in the official CVPR/ICCV workshop proceedings (CVF Open Access); 2024 papers did not appear in the IJCAI proceedings and went to a separate Springer CCIS volume linked from the site
- Small workshop with a few accepted papers plus invited talks
- Not listed in ICORE2026
