notes:
- Joint event of the ASMS conference and the SPSC workshop on satellite communications and space signal processing
- Organized by DLR and CTTC with the University of Bologna; scientific support from ESA; technically co-sponsored
  by IEEE ComSoc
- Track A full papers (up to 8 pages) go to IEEE Xplore; Track B is for extended abstracts
- Submission via EDAS; 2024 deadline was extended from October 31 to November 18
- Held every two years in Europe (Italy, Spain, Germany, Austria) since 2006; 2020 edition was online and the 12th
  ASMS / 18th SPSC came in February 2025 after the 2022 Graz edition
- Strong industry presence (sponsors include Eutelsat, SES, Viasat); over 170 participants in 2025
- Not ranked by CORE or CCF
