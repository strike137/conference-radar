id: 6g-saga
name: 6G-SAGA
full_name: International Workshop on Intelligent Aerial and Spaceborne Systems for 6G (6G-SAGA)
type: workshop
tier: minor
areas: [communications, networking, ai]
region: worldwide
language: english
frequency: multiple-per-year
organizer: Waseda University (Shimamoto group) with international co-chairs, co-located with IEEE ComSoc and VTS conferences
organizer_country: [japan]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [1, 6, 8, 10, 12]
  conference_months: [1, 4, 6, 9, 12]
links:
  website: https://6g-saga.w.waseda.jp/5th-ws/
notes:
- Workshop series on space, air and ground integrated networks (satellites, UAVs, HAPS) for 6G, run from a Waseda University series site
- Moves between host conferences, several editions a year -> CCNC 2026 (1st), VTC2026-Spring (2nd), PIMRC 2026 (3rd), GLOBECOM 2026 (4th), CCNC 2027 (5th), WCNC 2027 (6th), VTC2027-Spring (7th)
- Title and theme change with each host (the CCNC 2027 edition is the 2nd Workshop on Edge AI and AI-Native SAGIN for Consumer-Centric Communications)
- Papers follow the host conference format and appear in the host proceedings in IEEE Xplore; papers must be presented
- 2nd edition technically supported by JST ASPIRE and the IEICE Information Network technical committee
- Not listed in ICORE2026
