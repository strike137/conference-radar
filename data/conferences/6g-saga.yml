id: 6g-saga
name: 6G SAGA
full_name: International Workshop on Intelligent Aerial and Spaceborne Systems for 6G
type: workshop
tier: minor
areas: [communications, networking]
region: worldwide
language: english
frequency: multiple-per-year
organizer: 6G-SAGA organizers (Waseda University, Keio University and others) with IEEE host conferences
organizer_country: [japan]
proceedings: IEEE Xplore
archival: true
links:
  website: https://6g-saga.w.waseda.jp/
notes:
- Workshop series on non-terrestrial networks (satellites, HAPS, UAVs) for 6G, with a different theme at each edition
- Runs at several IEEE conferences per year; CCNC 2026 (1st), VTC 2026-Spring (2nd), PIMRC 2026 (3rd), GLOBECOM 2026 (4th), WCNC 2027 (6th)
- Site hosted at Waseda University; technically supported by JST ASPIRE and the IEICE Information Network technical committee
- Chairs include Tomoaki Ohtsuki (Keio), Shigeru Shimamoto (Waseda), Octavia Dobre (Memorial University) and Symeon Chatzinotas (University of Luxembourg)
- GLOBECOM and WCNC workshop papers go into the host conference workshop proceedings and IEEE Xplore
- Not listed in ICORE2026
