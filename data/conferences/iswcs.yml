notes:
- Wireless communications symposium run by an international steering committee (members from Norway, France, Germany, UAE, Brazil/UK); IEEE ComSoc logo shown in 2026
- Accepted papers are submitted for inclusion in IEEE Xplore; six-page IEEE two-column papers via EDAS, single-blind review
- 20th edition in 2026 at Gold Coast, Australia; 18th edition in 2022 was in Hangzhou, China (hybrid)
- Not listed in the CORE ICORE2026 portal
- Paper deadline is usually extended several times (2026 -> May 15, May 31, firm June 15)
