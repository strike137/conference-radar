notes:
- Full current title is Ka and Broadband Space Communications and Navigation Conference; 31st edition in 2026
- Held every year since 1995 (first in Rome, as a Ka-band satellite communications conference for the ITALSAT and ACTS satellites)
- Supported by space agencies, satellite operators and manufacturers; ESA is a regular participant
- Mostly held in Italy, with editions in the USA, UK and Japan (Milan 2026, Turin 2025, Seattle 2024, Bradford 2023)
- Review is on a detailed abstract (at least 500 words); full paper due about a month before the conference
- Accepted and presented papers appear in the free online proceedings (proceedings.kaconf.com); the paper submission page states Scopus and Compendex indexing
- Co-hosts the BroadSky Workshop and the Alphasat propagation experimenters assembly (ASAPE)
- Expensive registration (USD 1,250 early in 2026); one paper per registration, USD 400 per extra paper
- Not listed in ICORE2026
