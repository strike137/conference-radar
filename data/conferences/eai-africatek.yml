notes:
- EAI conference on emerging technologies for Africa and other developing countries; the 2026 edition focused on AI, data science and digital transformation
- Proceedings in Springer LNICST; accepted authors may submit extended versions to EAI Endorsed Transactions journals for a fee
- Several submission tracks per edition (main, late and final tracks in 2026)
- Held in Africa (Arusha 2023, Ilorin 2024, Tunis 2025, Ouagadougou 2026); 2021 ran online and 2026 was hybrid
- Not listed in ICORE2026
