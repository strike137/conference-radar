notes:
- Main venue for model-driven engineering and software modeling; organized with support from ACM SIGSOFT and IEEE TCSE
- Started as the UML conference in 1998 and was renamed MODELS in 2005
- CORE A (ICORE2026), CCF B
- Foundations track (double-anonymous review with an author response period) and Practice track (single-anonymous)
- 10 pages of main text plus 2 pages of references; hard deadlines with no extensions
- Proceedings published by ACM from 2026 (open access, APC for authors outside ACM Open); 2025 papers are in IEEE Xplore
- Selected papers are invited to an extended version in the SoSyM journal (Springer)
- Rotates between Europe and North America (Grand Rapids 2025, Malaga 2026, Budapest 2027); co-located with EDTconf
  since 2024
