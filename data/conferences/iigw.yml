notes:
- Co-located workshop of COMSNETS, held each January in Bengaluru, India
- Technical workshop linked to the India Internet Governance Forum (IIGF), the national initiative of the UN IGF
- Broad topics (rural connectivity, multilingual Internet, Internet policy, cybersecurity, DNS security, O-RAN, 6G,
  AI for healthcare and smart cities)
- Double-blind review; papers up to 6 pages in IEEE format, submitted through EDAS
- Workshop papers appear in the COMSNETS proceedings and are submitted to IEEE Xplore
- Held with COMSNETS in 2024, 2025 and 2026 (named India Internet Governance Workshop in 2024)
- Workshop deadline is usually extended by two to four weeks
