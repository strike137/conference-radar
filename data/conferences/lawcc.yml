notes:
- Congress on women in computing (participation of women in STEM and ICT, gender and HCI, education, public policy), held as an associated event of the CLEI conference
- 18th edition in 2026; rotates with CLEI around Latin America (Loja 2020, San José 2021, Antioquia 2022, La Paz 2023, Bahía Blanca 2024, Valparaíso 2025, Mexico City 2026)
- Proceedings in CEUR-WS every year since 2020 (Vol-3872 for 2024, Vol-4185 for 2025)
- Papers in English, Spanish or Portuguese in the one-column CEUR-ART format; full papers 10 to 12 pages, short papers 5 to 9 pages; single-blind review
- CEUR-WS requires at least half of the published papers to be in English
- At least one author must register for CLEI; the three best papers receive awards
- Not listed in CORE ICORE2026
