notes:
- Largest annual event of JAWS-UG, the Japanese AWS user group with more than 60 local chapters
- Run by volunteer JAWS-UG members, with Amazon Web Services Japan as supporter
- One Saturday in early March at Sunshine City Exhibition Hall A, Ikebukuro, Tokyo (2024 to 2027)
- Talk proposals through a CfX (call for proposals) on fortee; no papers or proceedings
- Covers AWS and cloud engineering, generative AI, security operations, business and community topics
- JAWS DAYS 2026 expected about 1,300 participants; about 1,400 expected for 2027
