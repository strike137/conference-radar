notes:
- Largest hacker conference in Latin America, held in Buenos Aires since 2001 (first editions at a LAN house, at
  Hotel Bauen from 2007)
- Three days at the CEC Buenos Aires convention centre in October, with talks chosen by a selection committee,
  villages, workshops, trainings, CTF and wardriving
- Talks mostly in Spanish; recordings published on YouTube; no proceedings
- Also runs Ekoparty Miami and the Hackademy training programme
