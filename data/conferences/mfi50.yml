notes:
- Co-located with IEEE/IFIP NOMS or IM (NOMS 2020, IM 2021, NOMS 2022 to 2026); 7th edition in 2026
- Called Workshop on Management for Industry 4.0 (MFI4.0) until 2022
- Topics are management of industrial networks and cyber-physical systems, digital twins, system of systems and human in the loop
- Full papers 6 pages, position and work in progress papers 4 pages, IEEE two-column format; submission via JEMS
- Workshop papers go into the NOMS proceedings and IEEE Xplore (per the NOMS 2026 author instructions)
- Not listed in CORE ICORE2026 or the CCF list
