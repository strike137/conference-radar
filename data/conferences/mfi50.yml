notes:
- Workshop co-located with IEEE/IFIP NOMS; 2026 was the 7th edition (Miami 2023, Seoul 2024, Honolulu 2025, Rome 2026)
- Earlier editions are listed on the workshop site as MiF4.0 (Industry 4.0); pages for 2020 to 2025 are archived there
- Topics are management of Industry 4.0/5.0 systems, industrial connectivity and security, system of systems, digital twins and human in the loop
- Full papers 6 pages, position and work-in-progress papers 4 pages, IEEE 2-column format, submitted via JEMS3
- Accepted and presented papers appear in the NOMS proceedings and are submitted to IEEE Xplore
- Deadline usually extended to early February
- Not listed in the CORE ICORE2026 portal or the CCF list
