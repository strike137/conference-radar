notes:
- Organized under the IEEE Malaysia Education Society with UiTM; Japanese editions co-organized with Kanazawa Institute
  of Technology (KIT) and technically co-sponsored by the IEEE Nagoya Section
- Alternates between Malaysia and Kanazawa, Japan (Kuala Lumpur 2013, 2014, 2018, 2023; Kanazawa 2017, 2024, 2026;
  Sarawak 2025)
- Broad EECS scope including AI, communication networks, signal processing, circuits, RF, power and biomedical engineering
- Past proceedings (2013 to 2025) are in IEEE Xplore and Scopus
- Hybrid; international authors may present virtually by video
- Annual since 2023 after a gap from 2019 to 2022
- Not ranked by CORE (ICORE2026); not in the CCF list
