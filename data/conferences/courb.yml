notes:
- Co-located workshop of SBRC, the Brazilian Symposium on Computer Networks and Distributed Systems run by the
  Brazilian Computer Society (SBC); 10th edition in 2026
- Papers in Portuguese or English (Portuguese papers need an English abstract), up to 14 pages including
  references; at least one author must register for SBRC and present orally
- Accepted papers published open access in SBC OpenLib (SOL), Anais do CoUrb; three best paper awards
- Held with SBRC in a different Brazilian city each year (Praia do Forte, Bahia in 2026)
- Not listed in CORE ICORE2026
