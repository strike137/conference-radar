notes:
- Workshop on foundation models, vision-language models and large vision models for remote sensing and geospatial image analysis
- Held with CVPR; 1st edition at CVPR 2025, 2nd at CVPR 2026 in Denver
- Regular papers up to 8 pages in CVPR format go in the CVPR Workshops proceedings; extended abstracts (2 pages) are presented as posters only
- Submissions through Microsoft CMT
- 10 papers in the CVPR 2025 and 9 in the CVPR 2026 workshop proceedings on CVF Open Access
- Not listed in ICORE2026 or the CCF list
