links:
  website: https://2027.coling-iccl.org/
notes:
- Traditionally biennial; recent editions 2022 (Gyeongju), 2024 (joint LREC-COLING, Turin), 2025 (Abu Dhabi), 2027
  (Macau)
- COLING 2027 in Macau is ARR only, sharing the October 2026 ARR cycle with NAACL 2027; hybrid with virtual days
  May 6-7, 2027
- COLING 2025 still took direct submissions with double-blind review; overall acceptance about 30%
- Generally seen as a solid second-tier NLP venue with higher acceptance than ACL/EMNLP
