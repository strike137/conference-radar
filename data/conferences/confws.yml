notes:
- Two-day workshop on knowledge-based configuration (constraint solving, knowledge representation, product configuration, reconfiguration, feature models)
- Started at the AAAI 1996 Fall Symposium; since 1999 held with IJCAI, AAAI, ECAI, CP or SPLC, and stand-alone since 2013 in some years
- Recent editions in Europe (Vienna 2021, Graz 2022 with SPLC, Malaga 2023, Girona 2024 with CP, Bologna 2025 with ECAI, Bremen 2026 with IJCAI-ECAI)
- ConfWS 2027 (29th edition) will be a stand-alone onsite event at the University of Seville, early September 2027 (exact dates TBD)
- Full papers 10 to 30 pages, short papers 5 to 9 pages, or one-page abstracts of already published articles (not in the proceedings); at least two reviewers per paper
- Proceedings in CEUR Workshop Proceedings (CEUR-ART one-column style); best paper and best PhD student paper awards
- Mixed academic and industry audience (Siemens, Mercedes-Benz and others on the PC)
- Not listed in CORE ICORE2026
