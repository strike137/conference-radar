notes:
- One of the flagship computer architecture venues, run under the IEEE Computer Society
- Regarded as a top venue (ICORE2026 A*, CCF A)
- Co-located with CGO, PPoPP and CC (Sydney 2026, Salt Lake City 2027)
- Rotates worldwide (Montreal 2023, Edinburgh 2024, Las Vegas 2025, Sydney 2026, Salt Lake City 2027)
- Double-blind review with a revision/rebuttal period; no target acceptance rate; separate industry track
- Each paper names a senior author who may serve as a light PC member reviewing up to six papers
