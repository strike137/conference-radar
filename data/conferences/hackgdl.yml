notes:
- Community hacking and cybersecurity conference in Guadalajara, Mexico; the official archive lists the 2024, 2025 and 2026 editions
- Mainly offensive security talks; commercial talks are not accepted
- Talks of 30 to 40 minutes plus Q&A, and Pueblitos Magicos (villages) running all day
- Call for speakers runs on Sessionize and is bilingual (Spanish and English)
- 2027 edition is one day at Jardin Americana, Guadalajara; no workshops in 2027
- Talks only, no proceedings; travel costs are not covered
