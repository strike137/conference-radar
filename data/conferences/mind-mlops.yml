notes:
- Workshop on middleware for MLOps across cloud, fog and edge (orchestration, deployment and monitoring of ML pipelines, federated learning, fault tolerance), co-located with ACM Middleware
- First held on 2025-12-15 at Middleware 2025 in Nashville (hybrid); 2nd edition at Middleware 2026 in Tarragona
- Organized by the UK National Edge AI Hub at Newcastle University
- Full papers 6 pages, short papers 4 pages, posters 2 pages, ACM SIGCONF format
- At least one author must present in person; papers appear in the ACM Digital Library
- Not listed in the ICORE2026 portal or the CCF 2026 list
