region: worldwide
language: english
frequency: annual
organizer: City University of Hong Kong with local host universities (2027 sponsors National University of Laos, Guilin University of Electronic Technology and City University of Hong Kong); IEEE SMC technical co-sponsor
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [10]
  conference_months: [2, 3]
links:
  website: https://conference.cs.cityu.edu.hk/icicip/
notes:
- Series started in 2010; website hosted by City University of Hong Kong, which also provides a general chair; sister conference of ICACI, ICIST and ISNN
- IEEE Systems, Man and Cybernetics Society is technical co-sponsor; accepted papers are submitted to IEEE Xplore and selected papers go to journal special issues
- Scope covers computer science, control and automation, and signal processing and telecommunications
- Held in mainland China and abroad in turn (Marrakesh 2019, Muscat 2025, Chiang Mai 2026, Vientiane and Luang Prabang 2027); no edition between 2021 and 2024
- Full papers with a nominal length of 10 pages in IEEE double-column format, two extra pages with overlength charge; special sessions of six or more papers invited
- Not listed in ICORE2026 or the CCF 2026 list
