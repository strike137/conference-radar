notes:
- Application security conference run by the OWASP Uruguay chapter (active since 2010) in Montevideo
- 2025 edition had two trainings on Nov 19 at WTC Free Zone and a talk day on Nov 20 at the Auditorio Mario Benedetti, Torre de las Telecomunicaciones de ANTEL
- Open call for speakers on Sessionize; talks mostly in Spanish, some in English
- Annual chapter conference under changing names (AppSec Rio de la Plata 2024, AppSec Days 2025, Meetup+ 2026)
- No proceedings; the 2026 Meetup+ edition is free with registration
- Not listed in ICORE2026
