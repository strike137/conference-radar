notes:
- Jointly sponsored by IEEE and ACM; one of the main electronic design automation (EDA) conferences alongside DAC and DATE
- 45th edition in 2026; held in late October or early November, mostly in the USA (San Jose, San Francisco, New Jersey), Munich in 2025
- Topics span logic synthesis, verification, physical design, 3D ICs and chiplets, hardware security, AI for CAD and quantum or neuromorphic computing
- Double-blind review; papers up to 8 pages; abstract registration one week before the paper deadline (23:59 AoE); rebuttal phase in June
- From 2026 papers follow the ACM Open Access model; an APC of 250 USD (ACM/SIG members) or 350 USD (non-members) applies unless the corresponding author's institution is in ACM Open
- Also hosts workshops, the CAD Contest, CADathlon and an ACM Student Research Competition
- ICORE2026 rank A; CCF B
