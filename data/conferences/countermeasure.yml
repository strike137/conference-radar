notes:
- Practitioner security conference run by Ringzer0, a company that sells advanced hands-on security training
- Each fall in Ottawa, Canada; virtual training, then in-person training, then a short single-track conference
- Speakers are curated and invited; there is no public call for papers and nothing is published
- Strong government and critical infrastructure focus; talks on vulnerability research, exploitation, malware analysis and threat intelligence, some marked TLP:RED
- Each spring Ringzer0 runs a virtual training only edition under the COUNTERMEASURE name
- Earlier Ringzer0 events ran under other names (BOOTSTRAP25 in Austin, DOUBLEDOWN24 virtual)
