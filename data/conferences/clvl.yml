notes:
- Workshop on joint vision and language understanding, held with ICCV every two years since 2015; 2025 was the 6th edition
- Archival papers (more than 4 and up to 8 pages) appear in the ICCV workshop proceedings; non-archival papers up to 4 pages
- Double-blind review through CMT; several vision and language challenges run with the workshop
- 5 papers in the ICCV 2025 workshop proceedings on CVF Open Access
- Not listed in ICORE2026 or the CCF list
