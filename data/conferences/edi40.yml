notes:
- Part of the Acadia University conference series run by Elhadi Shakshuki, held together with ANT (Ambient Systems,
  Networks and Technologies)
- Named "Emerging Data and Industry 4.0" up to the 2022 edition
- Topics include big data analytics, cyber-physical systems, fog and edge computing and the internet of everything
- Accepted papers appear in the open-access Elsevier Procedia Computer Science series, indexed in Scopus, EI
  Compendex and DBLP
- Papers up to 8 pages in the Procedia format including references; submission via EasyChair
- Submission deadline is usually extended twice; the official page lists the final one
- Held in Europe (Porto 2022, Leuven 2023, Hasselt 2024, Patras 2025, Istanbul 2026, Delft 2027)
- Not listed in CORE ICORE2026 (portal search returns no results) or in the CCF 2026 list
