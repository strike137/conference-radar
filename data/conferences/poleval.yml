organizer: Institute of Computer Science, Polish Academy of Sciences (ICS PAS)
organizer_country: [europe]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [12, 1]
  conference_months: [11, 1]
links:
  website: https://poleval.pl/
notes:
- SemEval-inspired shared task campaign for Polish NLP run by ICS PAS since 2017; participants submit systems, then
  system description papers
- Results presented in Warsaw (Data Science Summit 2025; PolEval 2026 workshop in January 2027, hybrid and free of
  charge) plus a PolEval session at Slavic NLP 2027 in Athens
- Proceedings in the ACL Anthology since 2025 (14 papers, published by ICS PAS and ACL); earlier volumes were
  published by ICS PAS with an ISBN
- 2026 papers are 4 to 8 pages in ACL style with double-blind review on OpenReview; authors must also review
- Deadlines are 23:59 CET (Polish time)
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
