id: finnlp
name: FinNLP
full_name: Workshop on Financial Technology and Natural Language Processing
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: ACL SIG-FinTech (Special Interest Group on Economic and Financial NLP); 2026 general chairs from NII and AIST
  (Japan), National Taiwan University, UNIST, University of Manchester and The FinAI
organizer_country: [international]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [8]
  conference_months: [10, 11]
links:
  website: https://sigfintech.github.io/finnlp2026/index.html
notes:
- Annual workshop of ACL SIG-FinTech on NLP, machine learning and LLMs for finance, economics and law; held since 2019
- Co-located with a different host conference each year (IJCAI 2019 to 2024, EMNLP 2022, AACL 2023, LREC-COLING 2024,
  COLING 2025, EMNLP 2025, EMNLP 2026); some years had two editions
- All proceedings in the ACL Anthology
- Long papers up to 8 pages, short and demo papers up to 4 pages; direct submissions via OpenReview with double-blind
  review and no rebuttal, plus commitment of ARR-reviewed papers
- "Acceptance rate: 55% for the main track (2025, 17/31)"
- FinEval shared tasks run alongside the workshop
- Not listed in ICORE2026 and not on the CCF list
