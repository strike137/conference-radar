notes:
- Senegalese computer science conference co-organized by ASCII and the Ecole Polytechnique de Thies (EPT); sponsored by the IEEE Senegal Subsection
- 2026 was the 16th edition, held at EPT in Thies, Senegal
- Accepted English papers go to IEEE Xplore; English is recommended for submissions
- Broad scope covering databases, data science and AI, knowledge discovery, software engineering, networks and security, ICT applications
- Full papers up to 6 pages in IEEE double-column format, anonymous submission via EasyChair; also demo, tutorial and early-stage researcher (Jeunes chercheurs) tracks
- Paper deadline was extended twice in 2026 (May 2 -> May 17 -> June 5 firm)
- Not listed in CORE ICORE2026
