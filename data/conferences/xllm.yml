notes:
- Workshop on language structure modeling (syntactic, semantic and discourse parsing, information extraction) in the LLM era
- 1st edition held with ACL 2025 in Vienna as a full-day event
- Regular papers up to 8 pages, double-blind review via OpenReview; also accepts ARR pre-reviewed papers
- Archival papers go to the ACL Anthology (32 papers in 2025); non-archival 2-page extended abstracts allowed
- Runs several shared tasks with their own paper track
- Not ranked in ICORE2026 and not on the CCF list
