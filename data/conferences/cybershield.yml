notes:
- Workshop of the IEEE International Conference on Cyber Security and Resilience (IEEE CSR); first held in 2025 in Chania, Crete as the Workshop on Cybersecurity Innovation and Resilience
- Showcases results of EU-funded cybersecurity projects; topics include Security-as-a-Service for SMEs, AI-driven threat detection, threat intelligence sharing, pentesting and incident response
- Accepts research papers, project results and industrial papers
- Workshop papers go into the IEEE CSR proceedings in IEEE Xplore; 6 pages plus up to 2 extra pages with overlength charges
- In person only; five papers presented in one session in 2026
- Deadlines were extended in both years (3 weeks in 2025, 1 month in 2026)
- Not listed in CORE ICORE2026 or the CCF list
