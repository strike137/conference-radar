links:
  website: https://icss.ieice.org/
notes:
- Focus on security of networks and information and communication systems, including Internet security
- 'Four meetings a year: June joint with IA, July Security Summer Summit in Sapporo, November standalone, March
  joint with IPSJ SPT in Okinawa'
- Manuscripts of 6 pages or more recommended, 8 pages maximum; no presentation fee because ICSS belongs to the ISS
  society
- Gives an annual ICSS research award; runs a special section on information and communication system security in
  IEICE Transactions (English)
