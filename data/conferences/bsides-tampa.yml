notes:
- Security BSides conference in Tampa, Florida, running since 2013 and operated by the ISC2 Tampa Bay Chapter, a 501(c)(3) nonprofit
- Training Day on Friday plus Conference Day on Saturday in May at the USF Marshall Student Center, Tampa
- Large for a BSides with 2,000+ participants, 50+ sessions across 7 tracks and 7 villages in 2026
- Call for Presenters on Sessionize for 45 minute talks, keynotes, villages and trainings; no sponsored keynotes
- Low admission price (45 USD, 30 USD for students and military)
- Run entirely by 140+ volunteers with no paid staff
- Talks only, no proceedings
