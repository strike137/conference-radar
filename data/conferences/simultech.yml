id: simultech
name: SIMULTECH
full_name: International Conference on Simulation and Modeling Methodologies, Technologies and Applications
type: conference
tier: minor
areas: [general, systems]
region: europe
language: english
frequency: annual
organizer: INSTICC (Institute for Systems and Technologies of Information, Control and Communication)
organizer_country: [europe]
proceedings: SCITEPRESS; selected papers revised and extended in Springer LNNS
archival: true
rank:
  core: C
fee: 620 EUR (2027, early registration, non-member speaker; 565 EUR for INSTICC members; same price for students
  and non-students)
typical:
  deadline_months: [2, 3, 4]
  conference_months: [6, 7]
links:
  website: https://simultech.scitevents.org/
notes:
- Organized by INSTICC; proceedings in the SCITEPRESS Digital Library, selected extended papers in a Springer LNNS
  book
- 'Covers modeling and simulation broadly: agent-based and discrete-event simulation, digital twins, system modeling
  tools and application domains'
- Two submission stages (regular papers in stage 1, regular or position papers in stage 2); earlier stage gives
  earlier notification
- 'Held in Europe every year in June or July, co-located with other INSTICC conferences (2027: ICSOFT, DATA, SECRYPT,
  QUANTICS, ICSBT, ABH); one registration covers them as a non-speaker'
- Lower-tier venue (CORE C); hybrid presentation allowed when speakers cannot travel
- Has a non-archival abstracts track (abstracts are presented but not published)
