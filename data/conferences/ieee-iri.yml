notes:
- US-based IEEE conference on information reuse, data integration, knowledge graphs and reusable AI systems; 27th
  edition in 2026
- Held in the US in recent years (San Jose 2025, University of Washington Bothell near Seattle 2026)
- Full research and application/industry papers up to 6 pages, short papers 4 pages, posters 2 pages; double-blind
  review via Microsoft CMT
- Proceedings produced with IEEE CPS; selected papers invited to special issues of JISE and IJMDEM
- States an acceptance rate constantly under 30% in recent years
- In-person presentation required; no-show papers are withdrawn from the proceedings
- Ranked National USA in ICORE2026; not on the CCF list
