notes:
- Undergraduate research workshop of SBSeg, the Brazilian Symposium on Cybersecurity run by the Brazilian Computer Society (SBC)
- Open to undergraduate students and recent graduates (scientific initiation, final-year projects or independent projects)
- Full papers up to 10 pages and work-in-progress papers up to 5 pages, Portuguese or English, SBC template; double-blind review through JEMS3
- Accepted papers published in the SBSeg extended proceedings (Anais Estendidos) in SBC OpenLib (SOL)
- First authors who are students get the SBSeg registration fee covered by the CESeg Student Grant program
- Authors of the five best papers are invited to submit extended versions to the REIC journal (Revista Eletrônica de Iniciação Científica em Computação)
- Held with SBSeg in a different Brazilian city each year (Foz do Iguaçu 2025, Armação dos Búzios 2026)
- Not listed in CORE ICORE2026
