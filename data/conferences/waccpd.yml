notes:
- Half-day workshop held with SC (the International Conference for High Performance Computing, Networking, Storage and Analysis)
- Thirteenth edition in 2026; held every year since 2014
- 'Topics: portable programming of GPUs and other accelerators (OpenMP offloading, OpenACC, SYCL, Kokkos, RAJA, standard language parallelism) and quantum computing'
- Full papers of 8 to 10 two-column pages, double-blind review, submitted through the SC submissions site (Linklings)
- Full papers are published in the SC Workshop Proceedings; earlier volumes linked from the site are in the ACM DL and Springer LNCS
- Distinguished paper recognition requires an Artifact Description appendix (SC reproducibility initiative)
- Location follows SC (Atlanta 2024, St. Louis 2025, Chicago 2026)
