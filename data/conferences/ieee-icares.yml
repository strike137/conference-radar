notes:
- Sponsored by the IEEE Indonesia Joint AES/GRS Chapter; 2026 organized by the BRIN Research Center for Satellite
  Technology and the Vocational College of Universitas Gadjah Mada
- Held since 2014 (editions 2014, 2015, 2018, 2019 and every year since 2021); past proceedings in IEEE Xplore and
  indexed by Scopus
- Two tracks, aerospace and electronic systems (radar, SAR, satellites, navigation, space communications) and
  geoscience and remote sensing
- 2026 edition is hybrid; submission via EDAS; full paper deadline extended twice
- Not listed in the ICORE2026 CORE portal
