notes:
- Full-day workshop on proactive conversational information seeking with LLMs, bridging IR, NLP, HCI and cognitive science
- 1st edition co-located with ACM CIKM 2025 at COEX, Seoul, listed among the CIKM 2025 accepted workshops
- Accepted papers published in CEUR Workshop Proceedings, in a joint volume with the RS4SD, RDGENAI and DeSeRe workshops
- Long papers 10 to 12 pages, short papers 5 to 7 pages, perspective and resource papers 5 to 12 pages, demos 5 to 7 pages plus video; CEUR-WS single-column template, submission via EasyChair
- 2025 submission deadline was extended from 31 August to 15 September 2025
- Not in the CIKM 2026 accepted workshop list
- Not listed in CORE ICORE2026 or the CCF 2026 list
