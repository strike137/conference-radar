notes:
- Community-organized one-day hacker conference in the Boston area, Massachusetts, USA
- Held at The Center for Arts at the Armory, Somerville MA (2026); editions since 2023 (2026 was the fourth)
- Free for all participants thanks to sponsors
- Short program of 10 to 50 minute talks on privacy, surveillance, AI security and community topics, plus social time
- Call for proposals announced on the website and its email list
- No proceedings
