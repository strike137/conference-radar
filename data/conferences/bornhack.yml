notes:
- 7-day outdoor tent camp for hackers and makers, run by the Danish company BornHack ApS
- Held every July at Hylkedam, a former scout site near Gelsted on the Danish island of Funen
- Talks, lightning talks and workshops on security, networking, privacy, hardware and IT politics; first-time speakers welcome
- Talks are recorded by default; no proceedings
- 2027 is the twelfth BornHack (21 to 28 July 2027)
