notes:
- Long-running cryptology and network security conference (25th edition in 2026)
- Rotates globally; recent editions in Cambridge UK (2024), Osaka (2025) and Wollongong (2026)
- Proceedings in Springer LNCS; 2026 submissions are double-blind, up to 20 pages plus references and appendices
- Single submission deadline between April and June (AoE), extended in both 2025 and 2026; 2025 had 33 papers presented
  and a student travel grant program
- CORE B; not in the CCF list
