notes:
- One-day student workshop held with ACM CoNEXT every year (Los Angeles 2024, Hong Kong 2025, Utrecht 2026)
- For graduate students in networking; the student must be the first author, advisers may follow
- Two-page extended abstracts in ACM sigconf format, including references
- Double-blind review; submissions must not be under review elsewhere but may overlap technically with published or submitted work
- Accepted papers go into the ACM Digital Library and on the workshop website
- Deadline in September, about two months before CoNEXT in December
- "Workshop-only registration for 2026: 300 to 400 EUR; no student rate for workshops only"
- Not listed separately in CORE ICORE2026 (only the main CoNEXT conference, rank A) or the CCF list
