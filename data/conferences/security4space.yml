notes:
- Security for Space Systems (3S), organized and hosted by ESA at ESTEC in Noordwijk, the Netherlands
- First edition in May 2024 (two days, IEEE and non-IEEE paper tracks); second edition in November 2025 (two and a half days)
- 2025 papers published by IEEE in IEEE Xplore; presentations and papers also on ESA Indico
- 2025 had two review cycles (April and July) with double-blind review; full papers up to 8 pages plus appendices (12 total), short papers up to 5 pages
- Topics include space crypto, avionics and ground segment security, jamming, satcom and CCSDS protocol security
- Industrial exhibition alongside the conference; 2025 hosted the Ctrl+Space CTF on an in-orbit satellite
- "Registration 2025: EUR 185 early, EUR 300 late (excl. VAT); free for one student author per paper"
- Not found in ICORE2026 or the CCF list
