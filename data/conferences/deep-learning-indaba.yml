notes:
- Annual meeting of the African machine learning and AI community, run by the Deep Learning Indaba charity; a week of
  tutorials, talks, workshops, poster sessions and the Research in Africa Showcase
- Held in a different African country each year since 2019 (Kenya 2019, Tunisia 2022, Ghana 2023, Senegal 2024, Rwanda 2025,
  Nigeria 2026)
- "Research track since 2025: full papers with double-blind review; at least one author must be an African
  researcher based in Africa (2026 rule)"
- 2025 papers used the PMLR template on OpenReview; for 2026 accepted papers are to appear in a special volume of
  IJCAI (IJCAI template, at least three reviews per paper)
- One author per accepted paper gets a free attendance pass (with shared accommodation in 2026); separate
  applications for attending, plus poster, dataset and startup calls
- Very relevant for students in Africa; not listed in CORE ICORE2026
