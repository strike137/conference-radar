notes:
- ACM SIGPLAN conference on compilers, program analysis, optimization and runtime systems
- CORE B (ICORE2026)
- Co-located every year with HPCA, CGO and PPoPP
- Research, tool and practical experience papers up to 10 pages plus references in the SIGPLAN acmart format
- Double-blind review with a short rebuttal period; artifacts required for tool papers
- Proceedings in the ACM DL (ACM fully open access from 2026, an APC may apply for authors outside ACM Open)
- Held in Montreal 2023, Edinburgh 2024, Las Vegas 2025, Sydney 2026, Salt Lake City 2027
