notes:
- Annual hacker congress of the Chaos Computer Club, held over four days between Christmas and New Year in Hamburg, Germany
- 39C3 "Power Cycles" was held at CCH Hamburg on 27 to 30 December 2025
- 40C3 "Model Citizens" moves from the CCH to the Messe Hamburg exhibition halls (27 to 30 December 2026)
- Talks in English and German; no formal proceedings, recordings are published on media.ccc.de
- Separate calls for talks, art, music and punk; the 40C3 main stage call closed on 9 October 2026
