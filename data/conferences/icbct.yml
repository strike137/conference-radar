id: icbct
name: ICBCT
full_name: International Conference on Blockchain Technology
type: conference
tier: minor
areas: [security, systems]
region: worldwide
language: english
frequency: irregular
organizer: Commercial conference secretariat in China with host universities that change each edition (Hokkaido
  University and Ritsumeikan University in 2027; Inner Mongolia University of Technology in 2025; Guilin University of
  Electronic Technology in 2023; Shanghai Jiao Tong University in 2022)
organizer_country: [china]
proceedings: ACM DL (ACM ICPS)
archival: true
indexing: [EI, Scopus]
typical:
  deadline_months: [11]
  conference_months: [3]
links:
  website: https://www.icbct.org/
notes:
- Smaller commercially organized blockchain conference; secretariat contact is a 163.com mail address with a Chinese
  phone number
- Papers in the ACM International Conference Proceedings Series (open access), submitted for EI Compendex and Scopus
  indexing
- Held in Hawaii, USA (2019, 2020), Shanghai (2021, 2022), Guilin (2023, virtual), Hohhot (2025) and Sapporo,
  Japan (2027)
- No 2024 or 2026 edition; month varies (March 2019 to 2022 and 2027, November 2023, August 2025)
- Delegate registration without a paper is offered
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
