links:
  website: https://ashesworkshop.org/
notes:
- Hardware security workshop co-located with ACM CCS, held every year from 2017 to 2024
- Not the same venue as AsHES (accelerators and hybrid systems, with IEEE IPDPS)
- Location follows CCS (2022 Los Angeles, 2023 Copenhagen, 2024 Salt Lake City; virtual in 2020 and 2021)
- Proceedings in the ACM Digital Library as a separate volume each year (2024 volume doi 10.1145/3689939)
- Not held with CCS 2025 or CCS 2026; not listed on the CORE portal (ICORE2026) or the CCF list
