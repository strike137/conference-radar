region: asia-pacific
language: english
frequency: annual
organizer: Commercial conference secretariat (icmssp@126.com, China) with a host university each year (Hiroshima City University 2026)
organizer_country: [china]
proceedings: Springer LNNS
archival: true
indexing: [EI, Scopus]
fee: 620 USD per paper up to 8 pages (2026, regular author after early deadline), 570 USD early; 400 to 450 USD presentation only; 50 USD per extra page
typical:
  deadline_months: [4]
  conference_months: [5, 6]
links:
  website: https://www.icmssp.org/
notes:
- Annual since 2016; online 2020 to 2022, Shenzhen 2023 (hybrid), Bangkok 2024, Fukui 2025, Hiroshima 2026
- Proceedings in Springer Lecture Notes in Networks and Systems since 2025 (LNNS vol. 1637); ACM DL for 2017 to 2024, IEEE Xplore for 2016
- Single-blind review; papers of 8 to 15 pages, one registration covers 8 pages
- Abstract-only presentation is offered
- Not listed in CORE ICORE2026 or the CCF list
