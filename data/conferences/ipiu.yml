links:
  website: https://www.ipiu.or.kr/
notes:
- Korean domestic image processing and computer vision workshop held every year since 1989; 38th edition in 2026
- Host society is either the Korean Computer Vision Society (2022, 2024, 2027) or the Korean Institute
  of Broadcast and Media Engineers (2023, 2025, 2026)
- Held at Maison Glad Jeju in late January or early February (2023 to 2026); 2022 was online
- Papers of 2 to 6 pages in Korean or English; mostly poster presentations (2026 had 16 oral and 352 poster papers)
- Proceedings are posted on a paper board for registered site members only, so treat as non-archival
- Submission deadline is often extended (for 2026 it moved from 2025-12-12 to 2025-12-22 and then 2026-01-02)
- Includes invited talks, a new researchers session and, since 2026, a doctoral consortium
