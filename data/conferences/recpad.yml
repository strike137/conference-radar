notes:
- Annual one-day national conference of APRP, the Portuguese member society of IAPR, held since 1989
- Hosted by a different Portuguese university or polytechnic each year (Coimbra 2023, Covilha 2024, Aveiro 2025, Viseu 2026)
- Submissions are two-page extended abstracts in English; novelty not required; at least two reviewers per paper
- Mostly poster sessions plus a few oral talks; best paper and best poster awards
- Proceedings are a PDF of the abstracts on the APRP website, so non-archival
- Topics cover pattern recognition, image analysis, computer vision, machine learning and related areas; a friendly venue for students in Portugal
- Not listed in CORE ICORE2026
