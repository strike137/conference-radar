notes:
- Organized by the IEEE ComSoc Indonesia Chapter with Telkom University; recent editions (2023, 2024, 2025, 2026)
  held in Bali according to EDAS and Crossref
- Held yearly since 2014 except 2018 and 2020 (2026 is the 11th); proceedings in IEEE Xplore (ISSN 2640-0189)
- Submission via EDAS; 4 to 8 page papers in IEEE format; one registration covers one paper only
- 'Deadlines are extended several times each year (2025: Jun 7 -> Aug 30 -> Sep 10)'
- Has a track on emerging services and security (cyber security, network forensics, blockchain) besides wireless
  PHY and mobile networking
