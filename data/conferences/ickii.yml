notes:
- Organized by Lunghwa University of Science and Technology (Taiwan), the IEEE Tainan Section Sensors Council and the
  International Institute of Knowledge Innovation and Invention (IIKII)
- Broad engineering scope (materials, communications, computer science, EE, IoT, AI, smart technology, design and
  more); 2026 edition held together with the 2nd AI and Smart Technology Applications Symposium (AISTA 2026)
- Full papers in IEEE fields are EI indexed; papers in other engineering fields go to MDPI Engineering Proceedings
  (Scopus); selected papers can be recommended to partner journals for an extra charge
- Abstract first, then full paper; the conference is held before full paper acceptance and revised papers are due
  about six weeks after it
- Hybrid with online presentation; 2026 edition at Tohoku University, Sendai, Japan; 2024 edition in Nagoya, Japan
- Not listed in CORE (ICORE2026); a broad, low-barrier venue that students can attend
