notes:
- Workshop on human-centered sensing (health, behavior, activity), human-in-the-loop AI models and deployed
  interactive systems
- Host conference changes by year (SenSys 2017 in Delft, SenSys/BuildSys 2024 in Hangzhou, CPS-IoT Week 2025 in
  Irvine, MobiCom 2026 in Austin), so deadline months move with it
- Named Human-centered Sensing, Networking, and Multi-Device Systems in 2024
- All accepted papers are included in the ACM Digital Library
- Full papers up to 6 pages, experience papers up to 4 pages, extended abstracts up to 2 pages (ACM sigconf);
  single-blind review
- Best Paper Award sponsored by Nokia
- Not listed in the CORE portal (ICORE2026)
