id: aiccc
name: AICCC
full_name: Artificial Intelligence and Cloud Computing Conference
type: conference
tier: minor
areas: [ai, systems]
region: japan
language: english
frequency: annual
organizer: Commercially run; chairs from Japanese and US universities, hosted by a Tokyo university (The University of Electro-Communications in 2026)
proceedings: ACM DL (ACM ICPS)
archival: true
indexing: [EI Compendex, Scopus]
typical:
  deadline_months: [10]
  conference_months: [12]
links:
  website: https://www.aiccc.net/
notes:
- Smaller commercially run conference (secretariat on a gmail address, submission via zmeeting, site registered in Shanghai)
- Held in Japan every year since 2018 (Tokyo 2018, Kobe 2019, Osaka 2022, Kyoto 2023, Tokyo 2024 to 2026); online in 2020 and 2021
- Proceedings in the ACM Digital Library every year, stated as indexed by EI Compendex and Scopus
- Double-blind review by 2 to 3 reviewers; selected papers recommended to journal special issues
- Not listed in ICORE2026 or the CCF 2026 list
