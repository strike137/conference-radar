notes:
- One-day in-person workshop co-located with PETS, started in 2025 (Washington DC 2025, Calgary 2026)
- Brings together privacy researchers, law and policy experts, regulators and industry staff to support tech accountability and enforcement
- Call for talks with a short proposal (title and abstract of at most 500 words); early ideas and already published work are both welcome
- 'Non-archival: proposals are reviewed but there are no formal proceedings, only titles and abstracts go on the website'
- Format is 5 to 10 minute talks with roundtable feedback, keynotes, invited panels and breakout sessions
- Registration goes through the PETS registration page
