notes:
- Workshop on evaluation methods, metrics and benchmarks for multimodal generation and retrieval
- 1st edition (EvalMG25) with COLING 2025 in Abu Dhabi; proceedings in the ACL Anthology
- 2nd edition (EvalMG26) with SIGIR 2026 in Melbourne, special theme on evaluation of multimodal generation and retrieval systems
- Long (9 pages) and short (4 pages) papers, double-blind via OpenReview; ARR commitment and SIGIR fast track also accepted
- Has a non-archival track for papers accepted elsewhere
- Host conference changes per edition
- Not ranked in ICORE2026 and not on the CCF list
