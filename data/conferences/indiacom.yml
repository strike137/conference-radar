links:
  website: https://indiacom.org/
notes:
- Organized by Bharati Vidyapeeth (BVICAM) and held every year at its campus in New Delhi, India
- Technically sponsored by IEEE Delhi Section; supported by CSI, IETE, ISTE, IITP and IMP
- Running since 2007; the 2027 edition is the 21st INDIACom and the 14th as an international conference
- Papers presented are published in IEEE Xplore (proceedings for 2014 to 2016 and 2019 to 2026 are linked from the official site)
- Very large broad computing conference; 2026 received over 2,800 papers and accepted 550
- Papers up to 6 pages, with up to 2 extra pages at 2,000 INR or 100 USD per page; no separate publication fee
- Submission through the conference's own member portal; papers are screened with Turnitin
