notes:
- Half-day workshop on LLM-based recommender systems, with a focus on evaluation, reproducibility and deployment
- Held with ACM RecSys 2024 (Bari) and RecSys 2025 (Prague); the third edition moved to CIKM 2026 in Rome
- Non-archival; papers are not indexed and there are no formal proceedings
- Long and short papers in the ACM double-column format, double-blind review by at least three reviewers
- 2026 submissions via OpenReview; in person only
- Not listed in the CORE ICORE2026 portal
