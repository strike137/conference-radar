notes:
- "Local name: Informacione tehnologije (Međunarodna naučno-stručna konferencija), held every February in Žabljak, Montenegro"
- 30th edition in 2026; organized by the University of Montenegro, University Donja Gorica, University of Belgrade and IT Society Montenegro, with IEEE Serbia and Montenegro Section technical co-sponsorship
- Broad ICT topics (information systems, software engineering, IoT, cloud computing, future internet) plus round tables on ICT in Montenegro
- Papers in English that meet IEEE requirements go to IEEE Xplore; papers in the local language appear in a separate proceedings book with ISBN
- Full papers reviewed by at least two reviewers; submission via Microsoft CMT using the IEEE template
- Some sessions held online via Zoom
- Not listed in the CORE ICORE2026 portal
