notes:
- Long-running quantum information science conference established in 1990; physics-leaning
- Scope covers quantum communication and cryptography, sensing and metrology, computing and simulation, quantum networks, information theory, control and foundations
- Contributions are abstracts for talks and posters; QCMC 2024 published only an abstract booklet
- Roughly biennial; rotates worldwide (Vienna 2012, Hefei 2014, Singapore 2016, Baton Rouge 2018, Lisbon 2022, Chennai 2024, Ottawa 2027)
- Also awards the biennial International Quantum Award
- Not listed in CORE ICORE2026 or the CCF list
