notes:
- Annual non-product, non-vendor-biased security conference in Vienna, Austria, run by DeepSec GmbH since 2007
- Two days of trainings followed by two days of talks at the Renaissance Wien Hotel
- Talk slots of 45 minutes plus 5 minutes Q&A; also lightning talks and a scientific track with workshops
- Speakers get travel reimbursement up to 800 EUR and 2 hotel nights; U21 programme gives free attendance to
  young researchers
- Sister event DeepINTEL covers security intelligence
