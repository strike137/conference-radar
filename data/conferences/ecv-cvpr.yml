notes:
- CVPR workshop on efficient computer vision for mobile, wearable, edge and robotics devices; 9th edition in 2026
- Short papers (up to 4 pages) and long papers (up to 8 pages) excluding references, CVPR format, double-blind review via Microsoft CMT
- Accepted papers are published in the CVPR Workshops proceedings
- Hosts the IEEE Low-Power Computer Vision Challenge (LPCVC), sponsored by Qualcomm and the IEEE Computer Society
- Different from the MAI (Mobile AI) workshop at CVPR
- Not listed in ICORE2026 or the CCF list
