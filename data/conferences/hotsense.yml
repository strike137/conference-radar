notes:
- Workshop on thermal sensing systems, thermal perception, hardware and applications
- 1st edition held with ACM MobiCom 2025 in Hong Kong; 2nd edition announced with UbiComp/ISWC 2026 in Shanghai
- 2025 papers published in the ACM Digital Library as part of the MobiCom 2025 workshop proceedings; 2026 papers go
  to the UbiComp/ISWC Adjunct Proceedings in the ACM DL
- Papers up to 5 pages excluding references; 2025 review was double-blind, 2026 uses a lightweight single-round review
- Not listed in ICORE2026 or the CCF 2026 list
