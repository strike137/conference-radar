organizer: Workshop organizing committee (University of Pisa, IIT-CNR, Ghent University); co-located workshop of ECML PKDD
organizer_country: [europe]
proceedings: Springer LNCS (ECML PKDD post-workshop proceedings)
archival: true
typical:
  deadline_months: [6]
  conference_months: [9]
links:
  website: https://aidem2026.isti.cnr.it/
notes:
- Workshop co-located with ECML PKDD; first edition in Porto 2025 (as tutorial and workshop), 2nd edition in Naples 2026
- Organized by researchers from the University of Pisa, IIT-CNR and Ghent University
- Accepted regular and short papers go into the Springer LNCS post-workshop proceedings of ECML PKDD; at least one author must present in person
- Regular papers 12 to 16 pages, short papers 6 to 11 pages, references included, LNCS format; double-blind review by at least three PC members
- Non-archival track for work accepted or under review elsewhere
- Topics include disinformation, content moderation, bias in generative AI, regulation and AI for democratic processes
- Not listed in CORE ICORE2026
