notes:
- Workshop on assurance and certification of safety, security and other critical systems (assurance cases, evidence,
  compliance with standards)
- Co-located with SAFECOMP every edition since 2012 (13th edition in 2026; no editions in 2020 and 2021)
- Papers published in the SAFECOMP workshops proceedings (Springer LNCS)
- Full papers up to 12 pages and short papers of 6 pages in LNCS format; at least 3 reviewers per paper
- Organized by Jose Luis de la Vara (University of Castilla-La Mancha) and Barbara Gallina (Malardalen University)
- Not listed in CORE ICORE2026 or on the CCF list
