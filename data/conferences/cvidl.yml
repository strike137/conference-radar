notes:
- Annual since 2020; held in China (virtual 2021 and 2022, Zhuhai 2023 and 2024, Ningbo 2025, Changsha 2026, Hangzhou 2027)
- 2026 edition organized by Central South University and the Hunan Provincial Electronics Society with IEEE CIS technical support
- Proceedings published by IEEE (ISBN on the 2026 cover) and listed in IEEE Xplore; submitted to EI Compendex and Scopus
- Double-blind review by two or three reviewers per paper (editorial policy page)
- Run by a commercial conference service (AEIC/AiScholar); abstract-only presenter option without publication
- Not listed in CORE ICORE2026 or the CCF list
