notes:
- Biennial symposium since 1998 on communication systems, networks, photonics and optical communications, wireless and DSP
- Strong optical wireless and visible light communication community; general chair Zabih Ghassemlooy (Northumbria University)
- Technically sponsored by IEEE, co-sponsored by IET and Optica; papers in IEEE Xplore
- Held in Europe every July (2018 Budapest, 2020 and 2022 Porto, 2024 Rome, 2026 Edinburgh)
- Selected papers go to special issues of sponsoring journals; travel grants offered each edition
- Every accepted paper needs a full registration to appear in the proceedings
- Not listed in ICORE2026 or the CCF list
