notes:
- ACM conference on AI-powered software and AI for software engineering, started in 2024
- Co-located with a major SE conference (FSE 2024 in Porto de Galinhas, ASE 2025 in Seoul, FSE 2026 in Montreal), so the deadline month moves with the host
- Accepted papers published in the ACM Digital Library
- Review on OpenReview; reviews become public once the author-reviewer discussion starts
- Full papers 8 pages, short papers 2 to 4 pages, surveys 14 to 20 pages, ACM sigconf format
- Tracks include main, arXiv, benchmark and dataset, and industry demo
- Selected papers invited to an Empirical Software Engineering (Springer) special issue
- Not ranked in CORE ICORE2026
