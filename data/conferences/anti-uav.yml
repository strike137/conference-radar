notes:
- Workshop and challenge on detecting and tracking drones in thermal infrared video
- Editions with CVPR 2020, ICCV 2021, CVPR 2023 and CVPR 2025; 2025 was the 4th edition
- Challenge tracks on a benchmark of 410 videos, with cash prizes for the top three of each track and the best paper
- Up to 8 pages excluding references in CVPR format, double-blind review; 2025 submissions through EasyChair
- 10 papers in the CVPR 2025 workshop proceedings on CVF Open Access
- Not listed in ICORE2026 or the CCF list
