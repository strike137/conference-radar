notes:
- Workshop on ubiquitous computing for physical, mental and social well-being, co-located with ACM UbiComp/ISWC
- Held every year since 2018; 2026 was the 9th edition
- Accepted papers appear in the ACM Digital Library as part of the UbiComp/ISWC Adjunct Proceedings
- Long papers of 6 pages and short papers of 4 pages excluding references, ACM double-column format, anonymized
- Each submission reviewed by at least two reviewers; at least one author must register for the conference and the
  workshop
- Not listed in ICORE2026 or the CCF 2026 list
