- Community-run, non-profit Security BSides conference in Białystok, Poland
- Single-track day of talks with hands-on workshops and a hardware and CTF village, preceded by training days
- 2027 edition at Białostocki Park Naukowo-Technologiczny (ul. Żurawia 71)
- Electronic conference badge; site published bilingually in English and Polish
- Talks chosen through a CFP; no proceedings
- Not listed in the CORE ICORE2026 portal or on the CCF list
