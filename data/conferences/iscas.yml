notes:
- Flagship conference of the IEEE Circuits and Systems Society; covers analog, digital, power, sensory, biomedical
  and neuromorphic circuits, signal processing, multimedia and circuits for AI and quantum computing
- Rotates worldwide (2021 Daegu virtual, 2022 Austin, 2023 Monterey, 2024 Singapore, 2025 London, 2026 Shanghai,
  2027 Bordeaux); held every May or June
- Regular papers up to 5 pages; also special sessions, tutorials, live demonstrations and cross-society special
  sessions
- Proceedings in IEEE Xplore; selected papers invited to IEEE CAS journals (TCAS-I, TCAS-II, TBioCAS, OJCAS,
  TVLSI and others)
- Paper deadline usually in October and extended by one or two weeks (2026 edition 2025-10-12 -> 2025-10-26)
- One full registration covers up to two papers (2026)
- Large circuits venue; ICORE2026 lists it as C and the 2026 site announces it as CCF-B
