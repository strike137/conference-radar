notes:
- Brazilian data mining and machine learning symposium; 14th edition in 2026; grew out of the WAAMD workshop (2005
  to 2009) at SBBD
- Co-located with BRACIS or SBBD (alternating since 2013), in a different Brazilian city each year (Fortaleza 2025,
  Cuiabá 2026)
- Proceedings (Anais) published in the SBC OpenLib (SOL)
- Papers in Portuguese or English (title, abstract and keywords in English), up to 8 pages; single-blind review
- Authors of selected papers are usually invited to a special issue of the Journal of Information and Data Management (JIDM)
- "Acceptance rate: 25.4% (2026, 35/138)"
- Not ranked in CORE ICORE2026
