notes:
- Community conference by and for frontend developers in Korea, run by the FEDG frontend developer group
- 2026 marked its 10th anniversary, a one-day event at Lotte Tower in Seoul with parallel sessions and lightning talks
- Earlier editions were held at Sejong University in Seoul in August (2024 sold out)
- Talks by engineers from Korean tech companies (Toss, Naver, Daangn and others), mostly in Korean; talk videos go to YouTube
- No proceedings; practitioner talks only
- Not listed in the CORE ICORE2026 portal or the CCF list
