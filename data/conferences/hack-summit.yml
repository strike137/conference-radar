notes:
- Described by the organizers as the largest cybersecurity conference in Poland, with 2000+ attendees, 150+ talks and 15+ tracks
- Run by the Academic Partners Foundation (Warsaw) together with the Polish Cyber Defence Forces Component Command
- Hybrid format; an online day with live and VoD talks, then an onsite day at PGE Narodowy in Warsaw with the CyberSec Expo
- Talks in English (preferred) or Polish, 35 minutes, selected by a program council through a Call for Papers form
- Covers technical topics (red and blue teaming, reverse engineering, cloud, OT, AI) as well as risk, compliance and law
- Talks are recorded for attendees; no proceedings
- 50% student discount for students under 24 on selected ticket packages
