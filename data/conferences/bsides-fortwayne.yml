notes:
- Community-driven Security BSides conference in Fort Wayne, Indiana, USA, started by local security professionals under the theme "Better Together"
- One day of talks with a CTF; speakers apply through a call for papers form
- 2026 edition held on a Saturday at the Walb Student Union, Fort Wayne
- Also runs smaller single-talk events, such as a fall event on 2026-11-11 at Brotherhood Mutual
- Talks only, no proceedings
