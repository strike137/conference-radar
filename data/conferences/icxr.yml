notes:
- VR, AR and MR conference organized by the China Computer Federation (CCF), started in 2024
- Part of the CCF high-quality international conference incubation program; CCF C on the 2026 list
- Co-located with ChinaVR (Xiamen 2024, Qingdao 2025, Guangzhou 2026)
- Proceedings in Springer LNCS (EI indexed); selected papers recommended to journals such as IEEE TVCG
- Double-blind review with two cycles (conditional acceptance, then a short re-review of the revision)
- Papers 12 to 15 pages in LNCS format plus up to 3 pages of references
- "Registration 2026: about 2800 CNY for a CCF member paper registration, 3600 CNY for non-members"
- Not listed in the CORE portal (ICORE2026)
