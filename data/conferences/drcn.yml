links:
  website: https://www.kios.ucy.ac.cy/drcn2026/
notes:
- Forum on reliability, resilience and availability of communication networks, from survivable equipment and
  network design to network management, monitoring and fault diagnosis; running since 1998
- Proceedings in IEEE Xplore for every edition since 2001; 2023 edition technically co-sponsored by IEEE ComSoc
- Regular papers of 5 to 8 pages in IEEE two-column format, single-blind review, submission via EDAS
- Selected papers invited to a journal special issue (IEEE TNSM in 2023)
- Recent editions in Europe, North America and Asia (Milan 2020 and 2021, Vilanova i la Geltru 2022 and 2023,
  Montreal 2024, Ningbo 2025)
- The 22nd edition (DRCN 2026, planned for Paphos, Cyprus, October 7 to 9, 2026) was cancelled
- Usually held in March to May; the cancelled 2026 edition had moved to October with a July deadline
- Not listed in CORE ICORE2026 or in the CCF 2026 list
