notes:
- CNCF flagship practitioner conference on Kubernetes and cloud native computing, India edition run by The Linux Foundation
- First held in Delhi in December 2024, then Hyderabad (August 2025) and Mumbai (June 2026)
- Two conference days of keynotes, breakouts and a solutions showcase, with co-located events
- Talk proposals through Sessionize, reviewed by a program committee; no papers, slides and recordings are posted afterwards
- Speakers may appear on at most three submissions
- Not found in ICORE2026
