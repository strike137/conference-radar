id: ai4rwc
name: AI4RWC
full_name: International Workshop on Vision Intelligence for Real-world Challenges
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizing committee (Queen Mary University of London, University College London, King's College London, Chinese Academy of Sciences, Peking University, Jilin University and others)
organizer_country: [europe, china]
proceedings: CVF Open Access and IEEE Xplore (CVPR Workshops proceedings)
archival: true
links:
  website: https://sites.google.com/view/ai4rwc2026
notes:
  - Workshop on bringing computer vision to real-world data (few-shot learning, data-centric AI, domain shift, VLMs, vision agents, deployment case studies)
  - 1st edition as the International Workshop on Artificial Intelligence for Real-world Challenges at WI-IAT 2025 (London, November 15, 2025)
  - 2nd edition, renamed to Vision Intelligence, at CVPR 2026 in Denver on June 3, 2026
  - "Two tracks: archival papers of 5 to 8 pages in the CVPR Workshops proceedings, and non-archival papers up to 4 pages"
  - Double-blind review by at least two reviewers via OpenReview; all accepted papers presented as posters
  - 38 papers in the CVPR 2026 Workshops proceedings (CVF Open Access)
  - Organizers mostly from London universities (QMUL, UCL, KCL)
  - Not listed in ICORE2026 or the CCF list
