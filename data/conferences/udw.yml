notes:
- Workshop on the Universal Dependencies (UD) treebank annotation framework, its theory, treebanks, parsing and linguistic studies using UD data
- Held since 2017; co-located with NoDaLiDa, EMNLP, COLING, SyntaxFest, GURT and LREC
- Alternates between SyntaxFest years (2025 Ljubljana, 2027 Prague) and other hosts (2026 at LREC in Palma)
- Regular papers up to 8 pages and short papers up to 4 pages (LREC style in 2026); double-blind review; non-archival presentation of already published work is allowed
- Proceedings in the ACL Anthology
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
