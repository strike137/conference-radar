id: ist-ei
name: EI
full_name: IS&T International Symposium on Electronic Imaging
type: conference
tier: minor
areas: [vision]
region: north-america
language: english
frequency: annual
organizer: Society for Imaging Science and Technology (IS&T)
organizer_country: [usa]
proceedings: IS&T Digital Library (Electronic Imaging proceedings, open access)
archival: true
typical:
  conference_months: [1, 3]
links:
  website: https://www.imaging.org/IST/Conferences/EI/
notes:
- Umbrella symposium of many sub-conferences on imaging, image processing, computational imaging, image quality and AR/VR
- Held at the Hyatt Regency San Francisco Airport, Burlingame, California
- Peer-reviewed papers in the IS&T Digital Library, free to download, indexed by CrossRef, EBSCO and Google Scholar
- Two manuscript tracks, FastTrack (due before the symposium) and non-FastTrack (due after it)
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
