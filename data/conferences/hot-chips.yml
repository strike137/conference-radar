notes:
- Leading industry symposium where companies present new processors and chips; held every August in Silicon Valley since 1989
- 30-minute talks; no written papers required, slides are published in the Hot Chips proceedings and online archives
- A select group of presenters is invited to submit a paper to a special issue of IEEE Micro
- Held at Stanford University, with on-campus dorm housing and TCMM student housing grants; virtual attendance also offered
- In-person registration sold out in 2026
- CORE C (ICORE2026), CCF B
