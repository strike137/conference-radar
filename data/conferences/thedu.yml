notes:
- Workshop on proof assistants, automated theorem provers, computer algebra and dynamic geometry systems for education
- Annual since 2011, co-located with CADE or an umbrella event containing it (IJCAR, FLoC)
- Steering committee from Brazil, Serbia, France, Austria, Portugal and Denmark; series website and mailing list hosted by the University of Coimbra
- Extended abstracts (2 to 10 pages, EPTCS style) and demos are reviewed for the workshop; revised papers go through a second review round for EPTCS post-proceedings
- Post-proceedings in EPTCS (ThEdu'24 -> EPTCS 419, ThEdu'23 -> EPTCS 400, ThEdu'22 -> EPTCS 375); 2013, 2014 and 2016 editions in CEUR-WS
- Accepts repeat papers (already published work) that do not enter the formal record
- Not listed in ICORE2026
