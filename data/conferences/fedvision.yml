notes:
- CVPR workshop on federated and privacy-preserving distributed learning for vision tasks, held with CVPR every year since 2022
- 2026 was the 5th edition, a half-day workshop at CVPR 2026 in Denver
- Accepted papers are published in the CVPR workshop proceedings (9 papers on CVF Open Access in 2026, 8 in 2025)
- Papers follow the CVPR paper format and length limits, submitted through Microsoft CMT
- Best paper award sponsored by Axon in 2026
- Not listed in ICORE2026 or the CCF list
