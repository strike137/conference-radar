notes:
- Conference on AI for defence applications; 2026 held in Rennes as part of European Cyber Week
- Organized by the French defence AI agency AMIAD; 2026 is the 8th edition
- 2-page submissions (English or French) by email, graded on innovation, technical hurdles, user benefit and defence relevance
- Accepted works get an oral or poster slot; presentations in English only (2026 call)
- Proceedings (actes) for 2020 to 2025 are posted as PDFs on the conference site, not in a formal series
- Registration through the European Cyber Week website
