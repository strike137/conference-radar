notes:
- Broad EECS conference in Morocco covering computer science, AI, signal processing, embedded systems, wireless communications and smart grids
- Technically co-sponsored by IEEE and the IEEE Communications Society; proceedings in IEEE Xplore and indexed in Scopus
- Extended versions of selected papers go to Scopus-indexed journals
- Always run from Morocco (2020 planned in Meknes but held online because of Covid-19, Meknes 2022, Mohammedia 2023, Fez since 2024); hybrid (in person or online)
- No 2021 edition; annual since 2022
- Submission deadline is usually extended in steps (2026 moved from 25 December 2025 to 10 February 2026)
- Not listed in ICORE2026 and not on the CCF list
