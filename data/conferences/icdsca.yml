id: icdsca
name: ICDSCA
full_name: IEEE International Conference on Data Science and Computer Application
type: conference
tier: minor
areas: [data, ai, general]
region: china
language: english
frequency: annual
organizer: ICDSCA organizing secretariat (contact icdsca@163.com) with IEEE listing; general chair from Shanghai Ocean University (2025)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 550 USD or 3900 CNY regular, 500 USD student (2025, non-IEEE member, standard rate); 50 USD per extra page
typical:
  deadline_months: [7]
  conference_months: [10]
links:
  website: http://www.icdsca.net/
notes:
- Annual since 2021; 2025 was the 5th edition, held in Dalian, China
- Broad scope covering data science, AI, computer applications, networking and electrical automation
- Papers of 4 to 6 pages in IEEE format with double-blind review; proceedings go to IEEE Xplore (2021 proceedings confirmed there), stated as EI Compendex and Scopus indexed
- Presentations can be oral (online via Tencent Meeting or VooV), pre-recorded video or poster
- Smaller commercially organized conference; the site still contains leftover template text, so check details with the secretariat
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
