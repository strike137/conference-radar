notes:
- Run by the Spanish Association for Artificial Intelligence (AEPIA); described on its site as a biennial forum open to researchers worldwide
- Two paper tracks; LNAI papers (English, double-blind, up to 12 pages) go to Springer LNAI, other papers to the electronic CAEPIA proceedings
- Selected papers invited to a special issue of the Springer journal Progress in Artificial Intelligence
- Federated with Spanish AI conferences (ESTYLF, MAEB, TAMIDA, SISREC in 2026) plus workshops and a doctoral consortium
- CAEPIA 2026 (21st edition) is hosted by the Universidad de Jaén
- Not listed in CORE ICORE2026
