notes:
- Single-track, selective conference on swarm intelligence held since 1998 (ant colony optimization, swarm robotics, collective behavior, PSO)
- Every two years; held in Brussels from 2002 to 2016; recent editions in Barcelona 2020, Malaga 2022, Konstanz 2024 and Darmstadt 2026
- Proceedings in Springer LNCS (Swarm Intelligence volumes)
- Full papers 7 to 11 pages and short papers up to 7 pages in LNCS format; extended versions of selected papers go to a special issue of the Swarm Intelligence journal
- Separate call for Late Breaking Results and Fresh Perspectives (poster session, open to any discipline)
- ANTS 2028 was announced at ANTS 2026; dates not yet on an official page
- Not to be confused with ICSI (International Conference on Swarm Intelligence, China) or IEEE ANTS (networking)
