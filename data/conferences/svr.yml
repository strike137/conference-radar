notes:
- Described by SBC as the first virtual and augmented reality conference in Brazil; held annually by the Brazilian
  Computer Society (SBC); 28th edition in 2026
- Proceedings (Anais) published open access in the SBC OpenLib (SOL); in 2025 the main track accepted 59 of 116
  submissions (50.8%, double-blind), plus a JBCS journal track and tutorials
- Itinerant across Brazilian cities; held jointly with SBGames and SIBGRAPI (Manaus 2024, Salvador 2025, Goiânia 2026)
- Not ranked in CORE ICORE2026
