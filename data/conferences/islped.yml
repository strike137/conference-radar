notes:
- Technically sponsored by ACM and IEEE; accepted papers go to IEEE Xplore and the ACM Digital Library
- Covers low power technologies, circuits, architecture, CAD tools, systems and software, hardware security, AI
  hardware and quantum computing, plus an industrial design track
- Double-blind review; up to 6 pages plus 1 page of references in the ACM template; deadlines 11:59 PM AoE
- Selected papers are invited to an extended version in IEEE Transactions on VLSI Systems; three best paper awards
- Also runs a Low Power Design Contest and a Women in Technology Showcase
- Held in early August; recent editions in Boston (2022), Vienna (2023), Newport Beach (2024), Reykjavik (2025) and
  Evanston (2026); 2021 ran online
- ICORE2026 rank A; CCF C
