notes:
- Half-day CVPR workshop on Transformers and other backbones for image, video, 3D and multimodal vision
- Called Workshop on Transformers for Vision until 2025; renamed to Transformers for Vision and Multimodal AI for the 5th edition
- 3rd edition at CVPR 2024 (Seattle), 4th at CVPR 2025 (Nashville), 5th at CVPR 2026 (Denver)
- 2025 took abstract submissions of up to 4 pages in CVPR format via CMT, presented as posters; papers not in the CVPR Workshops proceedings
- 2026 edition was invited talks only, with no call for papers
- Not listed in ICORE2026 or the CCF list
