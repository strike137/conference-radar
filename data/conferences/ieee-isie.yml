organizer: IEEE Industrial Electronics Society (IES)
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [12]
  conference_months: [6, 7]
links:
  website: https://isie2027.ieee-ies.org/
notes:
- Flagship annual symposium of the IEEE Industrial Electronics Society; 35th edition in 2026, 36th in 2027
- Broad industrial electronics scope; power electronics, machines and drives, renewable energy and smart grids,
  control, robotics, industrial automation and communication, AI
- Regular papers 6 pages in IEEE two-column format, up to 2 extra pages for a fee; separate work-in-progress track
- Accepted and presented papers go to IEEE Xplore; at least one author must register and present
- Rotates worldwide (Kyoto 2021 online, Helsinki 2023, Ulsan 2024, Toronto 2025, Nagoya 2026, Paris 2027)
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
