notes:
- Workshop on delay-Doppler domain modulation and signal processing (OTFS and related schemes) for communications,
  sensing and ISAC in high-mobility scenarios
- The GLOBECOM 2025 edition in Taipei was the 4th; not in the GLOBECOM 2026 workshop list
- Honorary chair Pingzhi Fan (Southwest Jiaotong University); 2025 workshop chairs from SUSTech, Universidad Carlos
  III de Madrid, UNSW Sydney and Xi'an Jiaotong University
- 2025 edition was a full-day workshop with a keynote and paper sessions
- Accepted and presented papers go into the IEEE GLOBECOM workshop proceedings in IEEE Xplore; no-show papers are
  removed
- Not listed in ICORE2026
