notes:
- 'Half-day workshop co-located with ACM AsiaCCS: 2023 Melbourne (first edition), 2024 Singapore, 2025 Hanoi'
- Proceedings published in the ACM Digital Library as a separate workshop volume each year (2023, 2024, 2025)
- Double-blind review; up to 12 pages in double-column ACM format including references and appendices; position and
  work-in-progress papers welcome
- 'Two submission cycles in 2025 (December and April), with the second deadline extended'
- 'Small program: 5 papers plus 2 keynotes and a poster session in 2025'
- Not among the AsiaCCS 2026 co-located workshops (Bangalore), so the series may have paused
