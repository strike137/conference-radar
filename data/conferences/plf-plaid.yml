notes:
- Merger of PLF (Programming Local-first Software, since 2022) and PLAID (Principles, Theory, and Practice for Decentralized Applications); joint since 2025
- Topics are languages, verification, consensus, security and tooling for decentralised and local-first (offline-capable, collaborative) software
- Talk-based workshop; submissions are talk proposals of at most 2 pages in any one-column format, and talks may cover new, existing or in-progress work
- Usually with ECOOP in Europe (Berlin 2022, Vienna 2024, Bergen 2025, Brussels 2026, Turin 2027); PLF 2023 was with SPLASH in Cascais
- The 2026 edition had an invited program and no open call for talks
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
