id: itnac
name: ITNAC
full_name: IEEE International Telecommunication Networks and Applications Conference
type: conference
tier: minor
areas: [networking, communications, security]
region: oceania
language: english
frequency: annual
organizer: 'AAICT Inc. (ITNAC committee), IEEE; hosted by a different university each year (2026: RMIT University)'
organizer_country: [australia, new-zealand]
proceedings: IEEE Xplore
archival: true
indexing: [IEEE Xplore, EI, Scopus]
rank:
  core: Australasian C
fee: AUD 800 IEEE member / AUD 950 non-member, early bird (2026); AUD 560 IEEE student member
typical:
  deadline_months: [8, 9]
  conference_months: [11]
links:
  website: https://itnac.org.au
  wikicfp: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=199471
notes:
- Formerly ATNAC (Australasian Telecommunication Networks and Applications Conference); renamed ITNAC in 2015
- Held every year in late November, mostly in Australia with roughly one edition in three in New Zealand; hybrid
  participation offered
- CORE ICORE2026 lists it as Australasian C, a regional rank rather than the international C
- Proceedings in IEEE Xplore; 6-page full papers or 3-page short papers; double-blind review in 2026
- Has Workshop and Work-in-Progress tracks with a later deadline; student grants offered (13 in 2026 per the website)
