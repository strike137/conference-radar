notes:
- North American flagship conference of the IEEE Circuits and Systems (CAS) Society; 69th edition in 2026
- Covers analog, mixed signal and RF, digital, power, sensory and biomedical circuits, signal processing, wireless
  systems, neuromorphic and AI/edge computing circuits
- Accepted papers go into the official proceedings and IEEE Xplore; submission via PaperCept
- Held in the USA in August, not only in the Midwest (Springfield, Massachusetts 2024, Lansing 2025, Cincinnati
  2026); 2026 edition co-located with IEEE NAECON under one registration
- Strong student program (student paper contest, student design papers, student demo competition)
- Not listed in the CORE portal (ICORE2026)
