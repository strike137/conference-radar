notes:
- Practitioner security conference in Vancouver, Canada, run by dragostech.com inc., which also runs PacSec
- The organizers originated the Pwn2Own hacking competition, which started at CanSecWest
- Two conference days preceded by four days of DOJO training courses (Sep 26 to 29, 2026)
- 2025 and 2026 editions held at the Pinnacle Harbourside Hotel, Vancouver
- Talks only (recent programmes heavily feature AI security); slides and recordings, no archival proceedings
- The old cansecwest.com domain redirects to secwest.net
