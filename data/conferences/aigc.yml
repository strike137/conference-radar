notes:
- Commercially organized Chinese conference run by the Shanghai event company SPCO
- Held in China every year (Shanghai 2023, Beijing 2024, Hangzhou 2025, Guangzhou 2026)
- Accepted papers published by SPIE and submitted to EI Compendex and Scopus, per the site
- Single-blind review via Microsoft CMT; papers up to 6 pages in SPIE format
- Short review cycle (about 11 days from deadline to notification)
- Presentation-only (abstract) and listener registration are also offered
- Not listed in ICORE2026 or the CCF list
