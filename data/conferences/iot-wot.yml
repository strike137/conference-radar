notes:
- Half-day workshop at IEEE CCNC on IoT interoperability, the W3C Web of Things, semantic technologies and real-world IoT deployments
- 5th edition (IIWOT'26) held with IEEE CCNC 2026 in Las Vegas with six papers
- Organizers based in Italy, France and Switzerland (University of Bologna, UNIMORE, Lyon 1, Siemens)
- Workshop papers go into the IEEE CCNC proceedings and IEEE Xplore; up to 6 pages plus 3 extra pages at USD 100 each, via EDAS
- Shares the common CCNC workshop paper deadline (mid October)
- 6th edition (IIWOT'27) listed in the IEEE CCNC 2027 call for workshop papers
- Not listed in ICORE2026
