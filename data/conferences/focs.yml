notes:
- Sponsored by the IEEE Computer Society Technical Committee on Mathematical Foundations of Computing (TCMF); with STOC, the top venue for theoretical computer science
- Proceedings in IEEE Xplore and the IEEE CSDL
- Double-blind review; no page limit, but the first ten pages must make the case for the paper
- Usually held in the USA (Denver 2021 and 2022, Santa Cruz 2023, Chicago 2024, New York 2026); Sydney in 2025
- FOCS 2026 is at NYU and co-located with TCC 2026
- CORE A* (ICORE2026), CCF A
