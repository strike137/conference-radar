links:
  website: https://sites.google.com/view/politicalnlp2026
notes:
- Workshop on NLP for political discourse, debates, manifestos and other political science data
- Held with LREC every two years (LREC 2022 Marseille, LREC-COLING 2024 Turin, LREC 2026 Palma)
- Half-day workshop; long and short papers of 4 to 8 pages in LREC format, double-blind review with three reviews per paper
- Papers appear in the LREC workshop proceedings and the ACL Anthology
- 2026 theme was trust, transparency and generative AI in political discourse analysis
- Not listed in ICORE2026 and not on the CCF list
