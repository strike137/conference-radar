notes:
- Premier international conference on haptics (science, technology, algorithms and applications of touch)
- Joint gathering of the IEEE Haptics Symposium and the EuroHaptics Conference, held in odd years; the IEEE Haptics Symposium takes the even years
- Sponsored by IEEE RAS; 2025 edition organized by the Korea Haptics Society with technical support from the Technical Committee on Haptics and the EuroHaptics Society
- Long papers (8 to 12 pages plus up to 3 of references) and regular papers (4 to 6 pages plus up to 2), double-blind review, published in IEEE Xplore
- Later tracks for work-in-progress papers, hands-on demos, workshops and IEEE Transactions on Haptics presentations
- CCF C (human-computer interaction); not listed in CORE ICORE2026
- Location rotates worldwide (Suwon 2025, Boston 2027)
