notes:
- ACM SIGCHI conference on interactive media (XR, 360 video, live streaming, TV, online media, production tools and audience research), co-supported by SIGMM
- Proceedings in the ACM Digital Library
- One paper deadline in January; double-blind review with a rebuttal phase; deadlines 23:59 AoE
- Also has workshops, demos, work in progress, doctoral consortium and industry talks with later deadlines (March to April)
- Mostly in Europe but rotates (New York virtual 2021, Aveiro 2022, Nantes 2023, Stockholm 2024, Rio de Janeiro 2025, Athlone 2026, Madrid 2027)
- CORE C (ICORE2026); not on the CCF list
