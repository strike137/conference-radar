notes:
- Organized by IARIA as part of the NetWare congress, co-located with SENSORCOMM, SECURWARE, GREEN and other IARIA events (19th edition in 2026)
- Covers circuits, electronics, micro-electronics, low-energy devices and power systems
- Published open access in the IARIA ThinkMind library (ISSN 2308-426X); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in southern Europe or France (Athens, Lisbon, Porto, Nice, Barcelona in recent years); onsite and online participation offered
