notes:
- Conference on large language models for chip and hardware design (EDA), also written LAD
- Started as the IEEE International Workshop on LLM-Aided Design (LAD'24 at IBM Research Almaden) and became a conference
- 2026 edition at Paul Brest Hall, Stanford University; general chairs from Stanford and Cadence
- IEEE CEDA logo shown on the LAD'24 page; listed as an in-cooperation conference on the ACM SIGDA conferences page (July)
- Submission and review on OpenReview with a rebuttal period; includes a Datasets and Benchmarks track
- Accepted papers are submitted for inclusion in IEEE Xplore
- Also runs a hackathon, held in person at DAC 2026 in Long Beach
- Not listed in ICORE2026 or the CCF list
