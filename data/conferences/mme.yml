notes:
- Workshop on evaluation methodology and benchmarks for multilingual and culture-aware LLMs
- First edition held with EACL 2026 in Rabat, Morocco, as a half-day workshop
- Long (8 pages) and short (4 pages) archival papers with double-blind review; ARR-reviewed papers can be committed
- Archival papers appear in the ACL Anthology (16 entries in 2026); non-archival presentations also accepted
- Not listed in ICORE2026 and not on the CCF list
