notes:
- Workshop on data, metrics and methods for multilingual and culture-aware evaluation of language models
- 1st edition was a half-day workshop (W8) at EACL 2026 in Rabat, Morocco
- Long papers up to 8 pages and short papers up to 4 pages; double-blind review, ARR-reviewed papers can be committed
- Archival papers in the ACL Anthology (2026.mme-main, 15 papers); a non-archival track has no format or anonymity rules
- Best paper award
- Not listed in the CORE portal (ICORE2026)
