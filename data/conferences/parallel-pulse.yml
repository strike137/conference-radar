notes:
- Defensive security conference in Kuala Lumpur run by NanoSec Asia, a Malaysian cybersecurity community; first held in 2025
- Covers prevent, detect, respond and recover topics such as threat hunting, incident response and forensics, SOC and AI, cloud defense, open source defender tools, cyber law and cyber insurance
- One conference day (two in 2025) preceded by hands-on technical trainings; held at the AICB Centre of Excellence
- Open call for talks with a review board; 45 minute talks in English, no published proceedings
- Overseas speakers get an economy return ticket up to RM2,500 and three hotel nights (2025 CFP)
- Moved from November (2025) to September (2026)
