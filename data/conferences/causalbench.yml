notes:
- Workshop on benchmarks, datasets, metrics and reproducible evaluation for causal discovery and causal inference
- Held at WSDM 2026 in Boise, Idaho on February 26, 2026 (as CausalBench'26)
- Linked to the CausalBench benchmarking platform from Arizona State University
- Accepted papers included in the WSDM 2026 Companion Proceedings in the ACM Digital Library
- Extended abstracts 2 to 3 pages and research papers 4 to 6 pages, ACM double-column, single-blind, via EasyChair
- Concurrent submission to other venues not allowed
- No 2027 edition announced as of November 2026
- Not listed in CORE ICORE2026 and not on the CCF list
