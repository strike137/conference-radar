notes:
- Ecuador's national ICT conference, organized by CEDIA since 2013 (14th edition in 2026)
- Scientific track papers in Springer CCIS (indexed in Scopus, EI Compendex, DBLP); technical track papers in a special issue of the RTE ESPOL journal
- Scientific track requires full papers in English, 12 to 15 pages, double-blind review via EasyChair, at most 6 authors
- Held in Ecuador, rotating between cities (Manta 2022, Cuenca 2023, Loja 2024, Quito 2025, Ambato 2026)
- Also has a doctoral consortium, workshops and demos
- Not listed in CORE ICORE2026
