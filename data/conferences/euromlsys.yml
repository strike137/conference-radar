id: euromlsys
name: EuroMLSys
full_name: Workshop on Machine Learning and Systems (EuroMLSys)
type: workshop
tier: minor
areas: [systems, ai]
region: europe
language: english
frequency: annual
organizer: EuroMLSys organizers (co-located with ACM EuroSys); chairs from the University of Cambridge and the University of Edinburgh
organizer_country: [europe]
proceedings: ACM DL
archival: true
typical:
  deadline_months: [2]
  conference_months: [3, 4, 5]
links:
  website: https://euromlsys.eu/
notes:
- One-day workshop co-located with EuroSys every year since 2021 (online 2021, Rennes 2022, Rome 2023, Athens 2024,
  Rotterdam 2025, Edinburgh 2026)
- Topics at the intersection of ML and systems, such as LLM serving, ML compilers, accelerators and distributed training
- Accepted papers are published in the ACM Digital Library; authors can opt out
- 'Short papers: up to 6 pages plus references in SIGPLAN format, single-blind review via HotCRP'
- Deadlines are usually extended by about a week
- Not listed in CORE ICORE2026 or the CCF list
