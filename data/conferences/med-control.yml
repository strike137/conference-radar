notes:
- Annual conference of the Mediterranean Control Association (MCA), a non-profit organization registered in Cyprus; 34th edition in 2026
- Technical co-sponsorship from IEEE (CSS, RAS and others listed on the 2026 site)
- Proceedings in IEEE Xplore since 2006; papers up to 6 pages for review, up to 2 extra pages after acceptance for a fee; submission via PaperCept
- Held around the Mediterranean, mostly in southern Europe (2022 Athens, 2023 Limassol, 2024 Chania, 2025 Tangier, 2026 Ancona, 2027 Pula)
- One day of tutorials and workshops followed by three days of technical sessions
- Not listed in ICORE2026; not on the CCF list
