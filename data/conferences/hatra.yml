notes:
- Workshop on human factors of programming languages, type systems, proof assistants and verification tools (PL meets HCI)
- Co-located with SPLASH every year since 2020; 2026 was the 7th edition
- Papers are not published in the ACM Digital Library, so work can be published elsewhere later
- Accepts one-page extended abstracts, papers up to eight pages plus references, and (new in 2026) tutorial proposals
- Day split into paper talks and an unconference-style discussion; hybrid, remote presentation possible
- Held in Chicago 2021, Auckland 2022, Cascais 2023, Pasadena 2024, Singapore 2025, Oakland 2026
- Not listed in the CORE portal (ICORE2026)
