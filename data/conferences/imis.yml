notes:
- Part of the Barolli (Fukuoka Institute of Technology) conference family; always co-located with CISIS
- Mobile, ubiquitous and IoT services; has a Security and Blockchain Technologies track plus the WAIS (Advances
  in Information Security) and PISPIS workshops
- 'Often held in Japan or Taiwan: Taichung 2024, Fukuoka 2025, Luxembourg 2026, Kitakyushu 2027'
- Not ranked by CORE or CCF; regarded as a lower-tier venue; notification 3 to 5 days after the hard deadline in
  2025 and 2026
