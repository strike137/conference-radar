id: bts-i2c
name: BTS-I2C
full_name: Beyond Technology Summit on Informatics International Conference
type: conference
tier: minor
areas: [general, ai, networking, communications, data]
region: southeast-asia
language: english
frequency: annual
organizer: Universitas Muhammadiyah Jember
organizer_country: [indonesia]
proceedings: IEEE Xplore
fee: 330 USD professional non-IEEE member, 310 USD IEEE member (2026, batch 1 overseas); 370 / 350 USD in batch 2; students from 270 USD
typical:
  deadline_months: [8, 10]
  conference_months: [12]
links:
  website: https://bts.unmuhjember.ac.id/
notes:
- Run by Universitas Muhammadiyah Jember (East Java, Indonesia) with IEEE Indonesia Section on the steering committee
- First held in 2024; 2025 edition was online, 2026 edition hybrid at Universitas Muhammadiyah Jember
- Proceedings of the 2024 and 2025 editions are in IEEE Xplore; 4 to 6 page IEEE papers via EDAS, 3 reviewers per paper
- Two submission batches each year with lower fees in batch 1
- One-day conference in December with a broad EECS scope (power and energy, computing, robotics, communications, signal processing, IT)
- Not listed in ICORE2026 or the CCF list
