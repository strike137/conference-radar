id: osact
name: OSACT
full_name: Workshop on Open-Source Arabic Corpora and Processing Tools
type: workshop
tier: minor
areas: [nlp, ai]
region: europe
language: english
frequency: biennial
organizer: Organizing committee co-located with LREC (2026 chairs Hend Al-Khalifa of King Saud University, Mo El-Haj of
  VinUniversity and Lancaster University, Saad Ezzini of KFUPM)
organizer_country: [other, europe]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [2, 3]
  conference_months: [5]
links:
  website: https://osact-lrec.github.io/
notes:
- Workshop on Arabic language resources, corpora and NLP tools, held every two years with LREC
- 2022 edition in Marseille, 2024 in Torino (LREC-COLING), 2026 in Palma, Mallorca; 2024 and 2026 were hybrid
- 2020 proceedings list Marseille, but LREC 2020 was not held in person
- Proceedings in the ACL Anthology (43 papers in 2026)
- Long papers up to 8 pages and short or shared task papers up to 4 pages, plus references; submission via Softconf
- 2026 edition (7th) hosted five shared tasks (Islamic studies QA, politeness detection, sentiment, humour generation, speech dictation with diacritisation)
- Not listed in ICORE2026 and not on the CCF list
