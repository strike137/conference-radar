notes:
- First edition, Workshop 9 at IEEE VTC2027-Spring (Hamburg); not in the VTC2026-Spring or VTC2026-Fall workshop lists
- Covers security, resilience and sustainability of vehicular communication systems (V2X, connected and automated vehicles, software-defined vehicles, ITS, vehicular edge computing, terrestrial and non-terrestrial networks)
- Organizers include University of Wuerzburg, Universidad de Alcala and DFKI
- Contributions from academia, industry and public authorities are invited
- VTC2027-Spring papers are 5 pages (up to 2 extra pages at 100 USD each); workshop papers are submitted through the VTC2027-Spring workshops and Recent Results TrackChair site
- VTC papers go to IEEE Xplore and may be removed if not presented at the conference
- Not listed in ICORE2026
