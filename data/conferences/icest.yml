notes:
- Jointly run by the Faculty of Telecommunications (Technical University of Sofia, Bulgaria), the Faculty of
  Electronic Engineering (University of Nis, Serbia) and the Faculty of Technical Sciences (St. Kliment Ohridski
  University, Bitola, North Macedonia)
- Host rotates between Bulgaria, Serbia and North Macedonia (Ohrid 2022, Nis 2026)
- Long history; traces back to the Day of the Radio conference at TU Sofia (1963), named ICEST since 2002
- Technically co-sponsored by the IEEE Bulgaria, Serbia and Montenegro, and North Macedonia Sections (2021);
  accepted papers go to IEEE Xplore (2026 is IEEE conference record 71230)
- Broad EE scope; radio, microwaves and antennas, telecom systems, signal and image processing, computer
  systems, electronics, energy systems, control and measurement
- Regular papers up to 6 pages, invited papers up to 10; selected papers invited to extended versions in Facta
  Universitatis and Microwave Review
- "Registration fee: 300 EUR early, 350 EUR late (2026, full rate, foreign participants)"
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
