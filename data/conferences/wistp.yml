notes:
- Started in 2007 as the Workshop in Information Security Theory and Practice; a conference since 2015
- Supported by IFIP WG 11.2; focus on embedded, smart card, IoT and cyber-physical security, with 2027 emphasis
  on LLM and agentic AI security
- Annual from 2007 to 2019, then irregular (2024, 2027); small, about 12 to 15 papers per edition
- 2027 edition is hybrid and single track; remote live presentation allowed; double-blind review via EDAS
- Proceedings in Springer LNCS; CORE C
