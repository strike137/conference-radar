organizer: Conference committee (2026 general chairs from Harbin Institute of Technology, Shenzhen); secretariat at chairmen.org
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 580 USD or 4200 CNY per paper (2026, non-member author); 30 USD per page beyond 6 pages
typical:
  deadline_months: [10]
  conference_months: [11]
links:
  website: https://www.icimt.org/
notes:
- Held since 2013; 16th edition in Shenzhen in 2026
- Abroad in early years (Sydney 2013, Dubai 2014, Barcelona 2015, Kuala Lumpur 2016, Jakarta 2017); in China since 2018 (Shenzhen 2018, Beijing 2019, online 2020 and 2021, Beijing 2023, Shenzhen 2026)
- 2026 papers published in IEEE conference proceedings in IEEE Xplore, submitted to EI Compendex and Scopus
- Double-blind review by at least two reviewers; 4 to 6 page papers; abstract-only presentation option
- Short gap between deadline and conference (about four weeks in 2026)
- History page lists no editions for 2022, 2024 and 2025
- Not listed in CORE ICORE2026 or the CCF list; not the same venue as ICIMTech
