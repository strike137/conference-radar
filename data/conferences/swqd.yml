notes:
- Software quality conference and tools fair run by Software Quality Lab (Austria); mixes an industry program with a scientific track
- Renamed Software Quality Experience Days from the 2027 edition, with a new masterclass track; 2027 theme is Quality & Engineering Strategies in the Age of AI
- Scientific track in English; full papers 15-20 pages and short papers 8-12 pages, reviewed by at least three PC members
- Accepted scientific papers are planned for Springer LNBIP; a paper must be presented in person to be included
- The presenting author of a scientific paper attends free of charge
- 2027 edition is held in June in Zell am See, Austria (Ferry Porsche Congress Center)
- Not listed in ICORE2026 and not on the CCF list
