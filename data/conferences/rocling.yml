id: rocling
name: ROCLING
full_name: Conference on Computational Linguistics and Speech Processing
type: conference
tier: minor
areas: [nlp]
region: taiwan
language: mixed
frequency: annual
organizer: ACLCLP (Association for Computational Linguistics and Chinese Language Processing, Taiwan)
organizer_country: [taiwan]
proceedings: ACL Anthology
indexing: [DBLP]
rank:
  core: Unranked
fee: NT$6,000 regular / NT$2,500 student, early, ACLCLP non-member (2025); each paper needs one regular registration
typical:
  deadline_months: [8, 9]
  conference_months: [10, 11]
links:
  website: https://www.aclclp.org.tw/
  wikicfp: http://www.wikicfp.com/cfp/program?id=2494
notes:
- Taiwan's national NLP and speech processing conference (annual conference of ACLCLP), held every year in Taiwan
  (Taipei 2025, Hsinchu 2026)
- Papers may be written and presented in Chinese or English (2023 to 2025 CFPs); double-blind review via EasyChair
- Archival track goes to the ACL Anthology; a non-archival track (introduced in 2025) accepts work under review
  elsewhere
- Selected papers invited to a special issue of IJCLCLP; runs shared tasks and special sessions
- Deadlines usually extended by several weeks
