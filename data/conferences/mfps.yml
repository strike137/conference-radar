notes:
- Conference on the semantics of programming languages and its logical and mathematical foundations (domain theory, category theory, type theory, process calculi, quantum computation)
- Programme mixes plenary talks, special sessions on chosen topics and contributed papers
- Final proceedings in Electronic Notes in Theoretical Informatics and Computer Science (ENTICS), an open-access overlay series on Episciences; a preliminary version is handed out at the meeting
- Papers of at most 15 pages using the MFPS macros, submitted via EasyChair
- Often co-located with CALCO (odd years) or other meetings such as QPL, ACT or SSTT
- Held in Europe and North America (Ithaca 2022, Bloomington 2023, Oxford 2024, Glasgow 2025, Ljubljana 2026, Erlangen 2027)
- Ranked B in ICORE2026
