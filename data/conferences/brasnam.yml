notes:
- Satellite workshop of CSBC, the annual congress of the Brazilian Computer Society (SBC); 15th edition in 2026
- Papers in Portuguese or English, published in SBC OpenLib (Anais do BraSNAM, ISSN 2595-6094) with DOIs
- Double-blind review by at least three program committee members
- Full papers up to 12 pages plus 2 of references; short, in-progress, dataset and journal-first papers 6 plus 1
- Topics include social data mining, misinformation, recommendation, sentiment analysis and fairness in online
  social media
- Held in Brazil every year with CSBC (Gramado in 2026)
