notes:
  - Workshop on computer vision for child development, pediatric healthcare, education, child psychology and ethics
  - First held as CV4CHL at CVPR 2026 in Denver; preceded by the AI4CHL workshop at ICLR 2025
  - "Two tracks: proceeding track (6 to 8 pages, CVPR Workshops proceedings) and non-proceeding track (4-page extended abstracts, ongoing or published work)"
  - Double-blind review by at least three reviewers on OpenReview
  - Includes a Children Gait Competition on Kaggle with challenge reports
  - Not listed in ICORE2026 or the CCF list
