notes:
- Research conference for undergraduates run by MIT students with IEEE; held each October at the MIT Stata Center, Cambridge, MA
- Paper authors must be undergraduates, or high school students in a university-affiliated research program; faculty
  mentors may be co-authors but cannot present
- Papers are limited to 5 pages, peer reviewed by faculty, graduate students and industry reviewers, and published in
  IEEE Xplore after the conference
- Posters and lightning talks are not published in IEEE Xplore, so already published work can be presented there
- Tracks cover engineering, computation, automation, networks, sustainability and other technology themes
- Acceptance rates are not published
- Not listed in CORE ICORE2026
