rank:
  core: Unranked
fee: 370,000 KRW member, 470,000 KRW non-member; students 230,000 KRW member, 280,000 KRW non-member (2026 summer,
  pre-registration)
typical:
  deadline_months: [7, 11]
  conference_months: [8, 11]
links:
  website: https://aiassociation.kr/
notes:
- Founded in 2016 (10th anniversary summer conference in 2026); holds a summer conference in August and a fall conference
  in November, plus winter and spring short courses
- Papers are submitted in English via EasyChair (Korean abstract); single-blind review; full paper track (2 to 8
  pages) or poster track
- Copyright transfer is optional, so work can later go to international venues; a Recap poster track in 2026 showed
  papers already published at international conferences
- Best paper prizes total 10 million KRW; selected full papers may be published in the society journal JARA
- Fall 2025 was held with the Physical AI International Forum at COEX, Seoul, and included a NeurIPS preview session
