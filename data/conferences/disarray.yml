notes:
- Infosec conference on a ferry, organized by the Finnish non-profit TurkuSec ry; held since 2024
- A pre-cruise evening of talks on land in Turku, then a full day of talks, a small CTF and lightning talks on the Turku to Stockholm ferry
- Open CfP for 30 to 45 minute talks on offense, defense and product security; speakers get shared cabin tickets
- Chatham House rule and TLP Green or White talks; no official streaming or recording
- No proceedings
- Not listed in CORE ICORE2026
