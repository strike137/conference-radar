notes:
- EAI conference on wireless networking, 5G and 6G, IoT and Industrial IoT, AI-driven network management and
  secure wireless architectures
- Location rotates worldwide (2020 Melbourne online, 2021 Orillia online, 2022 Dallas online, 2023 Piraeus,
  2026 Bratislava hybrid)
- 2026 is the 19th edition; the official site lists no 2024 or 2025 edition pages and the latest published
  proceedings volume is from WiCON 2023
- Proceedings in Springer LNICST; selected papers invited to the Wireless Networks (WINET) journal and EAI
  Endorsed Transactions fast tracks
- Hybrid format; 50% discount on a second paper
- Not listed in the CORE ICORE2026 portal; minor venue
