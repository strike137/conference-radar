id: ifsp
name: IFSP
full_name: International Forum on Signal Processing
type: conference
tier: minor
areas: [communications]
region: china
language: english
frequency: annual
organizer: Commercial conference secretariat (iconf.org submission system, yeah.net contact) with a host university each year (2027 University of Electronic Science and Technology of China)
organizer_country: [china]
proceedings: IEEE Xplore (2027, planned); IOP Journal of Physics Conference Series (2025)
archival: true
indexing: [EI, Scopus]
typical:
  deadline_months: [1, 3]
  conference_months: [5, 7]
links:
  website: https://www.ifsp.net/
notes:
- Annual since 2021; online 2021 to 2023, Beijing 2024 (hybrid), Xi'an 2025, Harbin 2026, Chengdu 2027
- Held in January up to 2024, then May 2025 and July 2026 and 2027
- IFSP 2025 proceedings appeared in IOP Journal of Physics Conference Series (vol. 3106), stated as EI Compendex and Scopus indexed
- IFSP 2027 papers are to be submitted to IEEE Xplore with possible EI Compendex and Scopus indexing
- Submission deadlines are usually extended several times
- Run by a commercial conference secretariat with a host university each year; abstract only presentation without publication is also offered
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
