notes:
- Organized by IARIA as part of the NexComm congress, co-located with CTRQ, SPACOMM, ICN and other IARIA events (21st edition in 2026)
- Published open access in the IARIA ThinkMind library (ISSN 2308-3964); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Spain, Italy, France or Portugal (Barcelona, Venice, Nice, Lisbon in recent years)
- Not to be confused with the International Conference on Database Theory (also ICDT); covers telecom, multimedia coding and streaming
