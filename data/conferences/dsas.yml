notes:
- Full-day workshop at IEEE/IFIP DSN on dependability and security of space systems and drones/UAVs, with a focus on AI/ML-enabled autonomy
- First edition 2026 at DSN in Charlotte; in 2026 it ran as a joint session with DT4DRS
- Workshop papers go in the DSN-W supplement to the DSN proceedings on IEEE Xplore
- Full papers up to 6 pages and short or work-in-progress papers up to 4 pages, IEEE two-column, excluding references
- Submission via the DSN EasyChair, 2 to 3 reviews per paper, open and unclassified research only
- Not listed in CORE ICORE2026 or the CCF list
