notes:
- Workshop co-located with ECML PKDD; 6th edition in 2026 (editions 2020, 2021, 2023, 2024, 2025)
- Not the same as the BIAS workshop on algorithmic bias in search and recommendation (bias-sigir)
- Full papers up to 16 pages including references, LNCS format, double-blind; only full papers enter the proceedings
- 2024 and 2025 calls name Springer CCIS post-workshop proceedings, opt-in for authors; the 2026 call only says workshop proceedings
- Also accepts non-archival abstracts (of published work in 2024 and 2025; of unpublished work in 2026, max. 2 pages) and, in 2026, previously published papers; these are single-blind and not in the proceedings
- Not listed in CORE ICORE2026
