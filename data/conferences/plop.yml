notes:
- Flagship of the *PLoP family of pattern conferences, run by The Hillside Group since 1994 (33rd edition in 2026)
- Papers on patterns and pattern languages in software design and, increasingly, organizations, teams, learning and other practices
- Papers are shepherded by an experienced pattern author before the conference and then discussed in Writers' Workshops instead of being presented
- Proceedings published in the ACM Digital Library; the program committee reviews the final post-conference versions and recommends them for the ACM DL
- Final proceedings version is due in January after the conference
- Held at Allerton Park, Illinois for many years (2023), online in 2020 to 2022, at Skamania Lodge, Washington in 2024 and 2025 and near Ottawa, Canada in 2026
- Registration includes meals; Hillside offers no travel or registration funding
- "CORE rank: C (ICORE2026); not in the CCF list"
