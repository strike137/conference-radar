notes:
- Founded by The Hillside Group about thirty years ago; the original *PLoP conference (EuroPLoP and AsianPLoP are sister venues)
- Papers on patterns and pattern languages in software, organizations, education and other designed systems
- Papers are shepherded before the conference and discussed in Writers' Workshops; proceedings version due in January after the conference
- Proceedings published by the Hillside Group and listed in the ACM Digital Library every year since 2006
- Held at retreat venues in North America (Allerton Park, Illinois in 2023; Skamania Lodge, Washington in 2024 and 2025; near Ottawa, Canada in 2026)
- Registration packages include meals and optionally lodging at the venue
- "CORE rank: C (ICORE2026)"
