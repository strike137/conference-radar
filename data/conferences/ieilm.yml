notes:
- One-day workshop co-located with IEEE INFOCOM; 2nd edition held with INFOCOM 2025 in London
- Accepted and presented papers appear in the IEEE INFOCOM workshop proceedings and IEEE Xplore
- Papers up to 6 pages in IEEE two-column format including references, submitted via EDAS
- Topics are edge intelligence, large AI models, semantic communication and cloud-edge networking
- Chaired by Victor C. M. Leung (UBC); TPC co-chairs from Carleton, NTU Singapore, Tianjin University and Ruhr University Bochum
- Not on the IEEE INFOCOM 2026 workshop list
- Not listed in ICORE2026
