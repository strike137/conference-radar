notes:
- Workshop on NLP, speech and multimodal processing for Bangla and other low-resource languages
- First edition co-located with EMNLP 2023 in Singapore; second edition with IJCNLP-AACL 2025 in Mumbai, India
- Proceedings published in the ACL Anthology (68 papers in 2025); double-blind review in ARR format, long papers 8 pages,
  short and shared task papers 4 pages
- Runs shared tasks (2025 hate speech detection and Bangla code generation) and a pre-submission mentoring program
- Not ranked in ICORE2026 and not on the CCF list
- So far held in 2023 and 2025; venue follows the host conference
