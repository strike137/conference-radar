notes:
- Long-running workshop on virtualization, containers, unikernels and resource isolation for HPC, cloud and AI infrastructures
- 21st edition in 2026; retitled "Workshop on Virtualization, Containers, and Resource Isolation for Supercomputer AI" on its 2026 site
- Co-located with Euro-Par (Madrid 2024, Dresden 2025, Pisa 2026), so held in Europe
- Accepted papers go to the Euro-Par workshops volume of Springer LNCS; LNCS format up to 12 pages, short or work-in-progress papers up to 6 pages
- Single-blind review by at least two PC members; the 2026 site expected about 20 submissions and 6 accepted papers
- Submission through EDAS; non-paper lightning talks (5 minutes) are also offered
- 2026 sessions were shared with GraphSys on August 24
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
