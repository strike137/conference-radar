notes:
- Workshop and shared tasks on NLP and machine learning for health-related social media posts, electronic health records and biomedical literature
- Renamed SMM4H-HeaRD (adding Health Real-World Data) in 2025; the 2026 edition was the 11th
- 2026 edition held online, co-located with ACL 2026 (San Diego), on July 3, 2026
- 2026 hosted eight shared tasks; registered teams must submit a 2 to 4 page system description paper
- Workshop papers are long (8 pages) or short (4 pages), double-blind, submitted via OpenReview
- Proceedings in the ACL Anthology (2020 to 2022, 2024 and 2026); the 2025 edition at ICWSM 2025 (Copenhagen) appeared in the ICWSM workshop proceedings
- Host conference changes each year (ACL 2024 Bangkok, ICWSM 2025, ACL 2026 online)
- Not ranked in ICORE2026 and not on the CCF list
