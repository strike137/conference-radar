notes:
- The Philippines' longest-running hacker conference; ROOTCON 20 in 2026
- Held every September; at Royce Hotel and Casino, Clark, Pampanga since 2025 (2022 to 2024 at Taal Vista Hotel,
  Tagaytay)
- Training day first (Human+ badge), then two days of main tracks, village tracks and CTF
- CFP closes around June; no airfare for speakers (domestic or international), only airport transfer from Manila
  and two nights of accommodation for the primary speaker
