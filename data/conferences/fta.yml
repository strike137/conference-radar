notes:
- New workshop in 2026 on testing, security analysis, verification and maintenance of firmware, with a focus on UEFI and the TianoCore EDK II ecosystem
- Organized as part of the NSF-funded TianoShield project (2025 to 2027), co-chaired by Armin Moin and Aravind Machiry (Purdue)
- Co-located with SPLASH/ISSTA 2026 in Oakland, USA
- Accepted papers are published Open Access by ACM; article processing charges may apply
- Five categories, from technical papers (18 pages plus references) to tool papers and extended abstracts; double-blind review via HotCRP
- In-person event; talks by the organizers are presented but not published, following ACM SIGSOFT policy
- Not ranked in CORE ICORE2026 and not on the CCF 2026 list
