notes:
- Romanian HCI conference run by RoCHI, the Romanian ACM SIGCHI chapter chartered in 2001
- Renamed ICUSI in 2024 as a broader-scope follow-up of the RoCHI conferences (RoCHI, International Conference on Human-Computer Interaction, ran from 2004 to 2023)
- Host city rotates within Romania (Cluj-Napoca 2023, Constanta 2024, Iasi 2025, Suceava 2026)
- Papers in English, double-blind review, extended papers 6 or 8 pages, short papers 4 pages, demos 2 pages, ACM CHI format on A4
- Proceedings published by MATRIX ROM under ISSN 3061-3205 (old ISSN 2501-9422) and indexed in DBLP
- Not listed in the CORE ICORE2026 portal; not on the CCF 2026 list
- Related International Journal of User-System Interaction (ISSN 2668-3245) run by the same community
