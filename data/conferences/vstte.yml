notes:
- Conference of the Verified Software Initiative on program verification theories, tools and case studies
- Usually co-located with a larger formal methods conference; the 18th edition (2026) was co-located with FMCAD in Graz
- Post-conference proceedings as a Springer LNCS volume; optional pre-conference version of papers
- Long papers up to 16 pages and short papers (incl. verification pearls) up to 10 pages, excluding references; work-in-progress talks are presentation-only and not in the proceedings
- Not listed in ICORE2026 and not in the CCF 2026 list
- Co-located with FMCAD since 2021 (Lugano 2021, Trento 2022, Ames 2023, Prague 2024, Menlo Park 2025, Graz 2026); with CAV before that
