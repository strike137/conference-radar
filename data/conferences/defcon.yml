frequency: annual
organizer: DEF CON Communications
proceedings: None (non-archival)
archival: false
rank:
  core: Unranked
fee: 560 to 600 USD online (early to late, incl. 20 USD processing), 520 USD cash at the door (2026, human badge)
typical:
  deadline_months: [5]
  conference_months: [8]
links:
  website: https://defcon.org/
notes:
- Widely regarded as the world's largest hacker conference; held every August in Las Vegas (Las Vegas Convention
  Center West Hall in 2026 and 2027), starting on the last day of Black Hat USA
- Main-stage CFP via OpenConf closes around May 1 (Midnight UTC); talks of 20 or 45 minutes, rarely 75; Villages,
  Workshops and Demo Labs have separate calls
- Speakers get a speaker badge, 3 hotel nights for the primary speaker and an honorarium of 3 Human Badges, but
  pay their own travel
- DEF CON Singapore started in 2026 (April 28-30, Marina Bay Sands); the second edition is set for 4-6 March 2027
