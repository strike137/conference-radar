id: acsw-eurosp
name: ACSW (EuroS&P)
full_name: Workshop on Automotive Cyber Security
type: workshop
tier: minor
areas: [security, systems]
region: europe
language: english
frequency: annual
organizer: Co-located with IEEE EuroS&P; run from the University of Modena and Reggio Emilia (2026 chairs Dario
  Stabili, Tatsuya Mori, Pal-Stefan Murvay)
organizer_country: [europe]
proceedings: IEEE Xplore (IEEE EuroS&P Workshops proceedings)
archival: true
typical:
  deadline_months: [2, 3]
  conference_months: [6, 7]
links:
  website: https://acsw.unimore.it/
notes:
- Not the same as ACSW (Australasian Computer Science Week); listed by IEEE EuroS&P as the Automotive Cyber-Security
  Workshop
- Held with IEEE EuroS&P every year since 2022 (Genoa 2022, Delft 2023, Vienna 2024, Venice 2025, Lisbon 2026)
- Accepted papers go into IEEE Xplore in the volume accompanying the EuroS&P proceedings; an Outside Proceedings
  track is peer reviewed but not published
- 'Tracks: regular full (10 pages), regular short (6 pages), Replication + Reproduction (10 pages, "R+R:" prefix);
  double-blind, IEEE A4 template, EasyChair'
- Deadlines tend to be extended by one to two weeks
- Not listed in ICORE2026
