notes:
- Main venue for tableaux-based reasoning and related proof methods (sequent and nested calculi, modal and non-classical logics, decision procedures, provers)
- Held every year since 1992; stand-alone in odd years, part of IJCAR together with CADE and FroCoS in even years (IJCAR 2026 Lisbon at FLoC)
- Proceedings in Springer LNCS/LNAI since 1995 (LNCS 15980 for 2025, gold open access; LNCS 14278 for 2023)
- Usually held in Europe (Birmingham 2021, Prague 2023, Reykjavik 2025, Marseille 2027)
- Often co-located with FroCoS (2023 Prague, 2025 with FroCoS and ITP in Reykjavik, 2027 Marseille)
- Regular papers up to 15 pages and short papers (system descriptions, case studies) up to 9 pages in LNCS style, excluding references
- One author must present in person and pay a regular registration fee
- CORE B in ICORE2026 (listed as International Conference on Theorem Proving with Analytic Tableaux and Related Methods); not on the CCF list
