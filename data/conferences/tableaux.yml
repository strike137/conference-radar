notes:
- Tableau methods, sequent and related calculi, theorem proving for classical and non-classical logics, and applications
  such as verification
- Standalone conference in odd years; in even years it is part of IJCAR with CADE and FroCoS (IJCAR 2026 at FLoC, Lisbon)
- Proceedings in Springer LNCS/LNAI since 1995 (LNCS 15980 in 2025, Gold Open Access)
- Regular papers up to 15 pages and short papers (system descriptions, case studies) up to 9 pages, LNCS style
- Recent standalone editions co-located with FroCoS (Reykjavik 2025 with ITP, Marseille 2027)
- 47 full submissions in 2025; one author must attend in person
- Mostly held in Europe (London 2019, Birmingham 2021, Prague 2023, Reykjavik 2025, Marseille 2027)
- CORE B (ICORE2026, listed as Theorem Proving with Analytic Tableaux and Related Methods); not on the CCF 2026 list
