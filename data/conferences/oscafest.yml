notes:
- Open source developer festival run by Open Source Community Africa, with talks, workshops and co-located events
- Past editions from the official site -> Lagos 2020 (Feb), Lagos 2022 (Mar, hybrid), Landmark Event Centre Lagos 2023 (Jun), 2025 (Aug)
- 2025 tracks included cloud and containers (hosted by KCD Nigeria), AI/ML, OSS security, web, mobile, IoT and community
- Paid tickets with free and discounted diversity tickets; accepted speakers attend free
- Talks only, no papers or proceedings
