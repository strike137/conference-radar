organizer_country: [usa]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [3]
  conference_months: [6]
links:
  website: https://www.deviceresearchconference.org/
notes:
- Longest-running device research meeting; 84th edition in 2026
- Held every June on a US university campus (2021 Santa Barbara, 2022 Columbus, 2023 Santa Barbara, 2024 College Park, 2025 Durham, 2026 Ann Arbor)
- Submission is a 2-page abstract (one page of text, one page of figures) that is published as submitted; the abstract is the sole basis for acceptance
- Authors choose whether their abstract goes into IEEE Xplore; papers are published only if an author registers and presents in person
- Late News submissions accepted with a later deadline
- "Registration 2026: USD 600 IEEE member, 700 non-member, 350 student (before May 15)"
- Not ranked by CORE or CCF, whose lists cover computing venues
