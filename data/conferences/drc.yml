organizer_country: [usa]
proceedings: IEEE Xplore
archival: true
typical:
  conference_months: [6]
links:
  website: https://deviceresearchconference.org/
notes:
- Longest-running device research meeting; 84th edition in 2026
- Covers device science, technology and modeling (2D materials, power, RF and THz, memory, neuromorphic, quantum, spintronic, optoelectronic devices)
- Submission is a two-page abstract (one page of text and one page of figures) used as the sole basis for acceptance
- Accepted abstracts are reproduced as submitted; authors can opt in to IEEE Xplore publication, which needs registration and in-person presentation
- Program includes plenary and invited talks, a short course, rump sessions and a Young Professionals workshop
- Held on a US university campus each June (Ann Arbor 2026, Minneapolis 2027)
- Not ranked by CORE or CCF, whose lists cover computing venues
