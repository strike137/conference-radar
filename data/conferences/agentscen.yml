notes:
- Workshop on agent AI for scenario planning in healthcare, finance and business, co-located with IJCAI
- 1st edition in 2024 shared a proceedings volume with FinNLP (FinNLP-AgentScen); 2nd edition at IJCAI-25 in Montreal
- Papers published in the ACL Anthology; ACL template, long papers up to 8 pages, short and demo papers up to 4
- Long and short papers double-blind, demo papers single-blind
- 2025 edition ran the PBIG shared task
- Not listed in ICORE2026 or the CCF 2026 list
