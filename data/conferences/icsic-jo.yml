notes:
- General computer science and IT conference run by the Faculty of Computer Sciences and Informatics of Amman Arab University, Jordan
- Held at Amman Arab University in Amman; editions in 2016, 2017, 2019, 2022, 2024 and 2026 (6th)
- The site calls it annual, but recent editions have been every two years
- 2022 and 2024 papers were published in AIP Conference Proceedings (vol. 2979 and 3406); earlier editions in WARSE journal special issues
- The 2026 call says accepted papers go to IEEE Conference Proceedings indexed in Web of Science, Scopus and Inspec
- Submission through EasyChair
- Not listed in CORE ICORE2026
