id: icmoce
name: ICMOCE
full_name: International Conference on Microwave, Optical and Communication Engineering
type: conference
tier: minor
areas: [communications]
region: south-asia
language: english
frequency: biennial
organizer: School of Electrical and Computer Sciences, IIT Bhubaneswar
organizer_country: [india]
proceedings: IEEE Xplore or Springer LNEE (author's choice)
archival: true
fee: Academic 12,000 to 14,000 INR (Indian) or 150 to 200 USD (foreign); student 8,000 to 9,000 INR or 100 to 150 USD (2025, regular, incl. GST)
typical:
  deadline_months: [2, 3]
  conference_months: [5]
links:
  website: https://conference.iitbbs.ac.in/icmoce/
notes:
- Run by the School of Electrical and Computer Sciences, IIT Bhubaneswar, Odisha, India
- Editions in 2015, 2023 and 2025; the 4th edition is set for May 2027
- Technically co-sponsored by the IEEE Kolkata and Bhubaneswar Sections (2025); IEEE Bhubaneswar Section (2027)
- Authors pick option A (IEEE template, up to 5 pages, IEEE Xplore) or option B (Springer LNEE, 10 to 15 pages)
- Only presented papers are forwarded for publication
- Covers microwave and antennas, optics and photonics, and communication engineering, plus special sessions
- Not listed in ICORE2026 or the CCF 2026 list
