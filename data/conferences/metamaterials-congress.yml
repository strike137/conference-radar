notes:
- Annual congress of the METAMORPHOSE VI association (Virtual Institute for Artificial Electromagnetic Materials and Metamaterials), held since 2007
- Successor of the Bianisotropics conferences and the Rome workshops on metamaterials
- Covers metamaterials in electromagnetism, optics and photonics, acoustics and mechanics, and multi-physics
- Papers 2 to 3 pages; accepted and presented papers can opt in to IEEE Xplore
- Four-day conference followed by a two-day doctoral school
- Mostly held in Europe (2022 Siena, 2023 and 2024 Crete, 2025 Amsterdam), with New York editions in 2020, 2021 and 2026
- Not listed in the CORE ICORE2026 portal
