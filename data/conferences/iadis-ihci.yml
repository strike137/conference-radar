links:
  website: https://www.ihci-conf.org/
notes:
- Run by IADIS since 2007 as part of the MCCSIS multi-conference; blind peer review
- Proceedings in the IADIS Digital Library with a DOI per paper; best papers invited to the IADIS International Journal on WWW/Internet
- Covers interface culture and design, affective aspects of design and human and technology interaction
- Several calls for papers per edition; the last call closes about eleven weeks before the conference
- Held in Europe in July (Lisbon 2022, Porto 2023, Budapest 2024, Lisbon 2025, Valencia 2026); online in 2021
- Not listed in the ICORE2026 CORE ranking
