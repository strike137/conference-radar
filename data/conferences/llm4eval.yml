notes:
- Workshop on using LLMs for IR evaluation (relevance judgments, RAG evaluation, simulated users, synthetic corpora)
- Held at SIGIR 2024 (Washington D.C.), WSDM 2025 and SIGIR 2025 (Padua)
- Accepted papers are non-archival; authors are encouraged to post them on arXiv and the workshop site links them
- Research papers up to 9 pages plus position, opinion and demo papers in SIGIR format; double-blind review; previously published work accepted
- First two editions also ran an automated relevance judgment challenge
- 2025 edition built around breakout discussion sessions that feed a workshop report
- No 2026 edition announced on the official site as of November 2026
- Not ranked in ICORE2026 and not on the CCF list
