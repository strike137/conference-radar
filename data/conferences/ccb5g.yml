id: ccb5g
name: CCB5G
full_name: IEEE GLOBECOM Workshop on Channel Coding beyond 5G
type: workshop
tier: minor
areas: [communications]
region: worldwide
language: english
frequency: annual
organizer: Huawei-led channel coding workshop organizers at IEEE GLOBECOM (IEEE ComSoc)
organizer_country: [china, canada]
proceedings: IEEE Xplore
archival: true
typical:
