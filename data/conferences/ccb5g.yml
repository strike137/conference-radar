  conference_months: [12]
links:
  website: https://globecom2026.ieee-globecom.org/events/ws-29-channel-coding-beyond-5g-0
notes:
- Workshop on channel coding for 6G (polar, LDPC and turbo codes, decoder hardware, coded modulation, HARQ, AI-based
  coding, joint source and channel coding)
- Held at every GLOBECOM from 2023 (Kuala Lumpur) to 2026 (Macau)
- Co-chaired by Wen Tong (Huawei), Erdal Arikan (Bilkent University, inventor of polar codes) and Emanuele Viterbo
  (Monash University); TPC co-chairs from McGill, University of Stuttgart and Huawei
- Up to 6 pages, plus 1 extra page for 100 USD (2025)
- Workshop papers go into the GLOBECOM proceedings and IEEE Xplore; no-show papers are removed
- Not listed in ICORE2026
