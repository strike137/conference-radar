links:
  website: https://www.toorcamp.org/
notes:
- Outdoor hacker camp in the style of the European camps (CCC Camp, HAR), run by the ToorCon team
- First held in 2009 at the Titan-1 missile silo in Washington State; since 2016 at Doe Bay Resort on Orcas Island, WA
- Held every two years (2016, 2018, 2022, 2024, 2026)
- Talks and workshops chosen through a CFP on the ToorCon pretalx site; no proceedings
- Orcas Island is reached only by Washington State Ferry, so ferry reservations are needed
