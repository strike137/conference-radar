notes:
- Biennial conference on participatory design and co-design theory, practice and methods
- Full papers (up to 8,500 words) go through two rounds of blind review by three reviewers; the same reviewers judge
  the revision
- Exploratory papers (up to 4,000 words) get one round of review by two reviewers; deadline in October
- Also has workshops, situated actions, PDC Places and a doctoral colloquium; all appear in the proceedings
- Proceedings published open access in the ACM Digital Library (three volumes in 2026)
- 2026 was onsite only, with no online or pre-recorded presentations
- Not listed in the ICORE2026 portal or the CCF 2026 list
