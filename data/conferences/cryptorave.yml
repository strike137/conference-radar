notes:
- Free, open 24-hour community event in Sao Paulo, Brazil on security, cryptography, hacking, anonymity, privacy and
  online freedom
- Inspired by the CryptoParty movement; started in 2014 and funded mainly through crowdfunding
- Held at the Biblioteca Mario de Andrade in central Sao Paulo (2025 and 2026)
- Mostly Portuguese-language talks and workshops; schedule run on pretalx, no proceedings
- 2026 was the 10th edition
