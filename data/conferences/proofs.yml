links:
  website: https://www.proofs-workshop.org/
notes:
- One-day workshop co-located with CHES, on formal and provable security of embedded systems and hardware (side channels, fault attacks)
- Organized from Télécom Paris; sponsored by Institut Mines-Telecom and Télécom Paris
- Proceedings in the open-access Kalpa Publications in Computing series; revised versions of accepted papers go to a special issue of the Journal of Cryptographic Engineering (JCEN)
- Follows CHES around the world (Prague 2023 as a virtual event, Halifax 2024, Kuala Lumpur 2025, Antalya 2026)
- Not listed in CORE ICORE2026
