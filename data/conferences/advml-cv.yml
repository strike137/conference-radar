organizer: Organizing team led by Beihang University and Zhongguancun Laboratory with University of Oxford, Johns Hopkins University,
  UC Berkeley and Nanyang Technological University; co-located with CVPR
organizer_country: [china]
proceedings: IEEE Xplore and CVF Open Access (CVPR Workshops), optional for authors
archival: true
typical:
  deadline_months: [3]
  conference_months: [6]
links:
  website: https://cvpr26-advml.github.io/
notes:
- Co-located with CVPR every year; 6th edition at CVPR 2026 in Denver, 5th at CVPR 2025 in Nashville
- Each edition has a theme; 2026 was "Safety of Vision-Language Agents", 2025 was "Foundation Models + X"
- Topics are adversarial attacks and defenses, jailbreaks and prompt injection on vision-language models and agents, robustness benchmarks
- Long papers up to 8 pages excluding references, or extended abstracts up to 4 pages, in the CVPR template, submitted via OpenReview
- Accepted papers can opt into the CVPR Workshops proceedings (IEEE Xplore and CVF Open Access); 7 papers on CVF Open Access for 2026
- Runs an adversarial attack challenge with cash prizes alongside the workshop (2026 challenge on driving vision-language agents)
- Not listed in ICORE2026 or the CCF list
