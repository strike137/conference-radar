notes:
- CVPR workshop on adversarial attacks, defenses and robustness of vision and vision-language models
- The 2026 edition was the 6th AdvML@CV, themed on the safety of vision-language agents
- Long papers up to 8 pages and extended abstracts up to 4 pages in the CVPR format, anonymized, submitted through OpenReview
- Accepted papers have the option to be included in the CVF and IEEE Xplore proceedings
- 7 papers in the CVPR 2026 workshop proceedings on CVF Open Access, 9 in 2025
- Runs an adversarial attack challenge alongside the workshop (2026 challenge on vision-language agents for autonomous driving)
- Not listed in ICORE2026 or the CCF list
