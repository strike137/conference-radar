id: pe-wasun
name: PE-WASUN
full_name: International Symposium on Performance Evaluation of Wireless Ad Hoc, Sensor, and Ubiquitous Networks
type: workshop
tier: minor
areas: [networking, communications]
region: worldwide
language: english
frequency: annual
organizer: PE-WASUN organizing committee (symposium co-located with MSWiM, general chair at UPC Barcelona); ACM until 2023, technically sponsored by IEEE since 2025
organizer_country: [international]
proceedings: IEEE Xplore (since 2025, in the MSWiM proceedings); ACM DL for 2004 to 2023
archival: true
typical:
  deadline_months: [7]
  conference_months: [10]
links:
  website: http://pewasun.upc.edu/PEWASUN2026/
notes:
- Symposium co-located with MSWiM, held in the same city and week (22nd edition in 2026, first held 2004 in Venice)
- Performance modeling, simulation and measurement of wireless ad hoc, sensor, mesh, vehicular and ubiquitous networks
- Proceedings in the ACM DL through 2023; no 2024 edition; the 2025 proceedings are in IEEE Xplore and 2026 is technically sponsored by IEEE, IEEE France Section and IEEE ComSoc France
- Papers up to 8 pages IEEE double-column, submitted through EasyChair
- Recent editions in Alicante (2020, 2021), Montreal (2022, 2023), Barcelona (2025) and Paris (2026)
- Not listed in ICORE2026 or the CCF 2026 list
