notes:
- Workshop on generative human motion synthesis (character animation, AR/VR, robotics learning, co-speech gestures, interaction motion)
- Held with CVPR since 2024 (Seattle 2024, Nashville 2025, Denver 2026); 2026 was the third edition
- Full papers up to 8 pages in the CVPR format, double-blind, single-stage review on OpenReview without rebuttal
- Accepted full papers go into the CVPR Workshops proceedings (listed in CVF Open Access)
- Separate call for 1-page abstracts of already published work, presented as posters
- Not listed in ICORE2026 or the CCF list
