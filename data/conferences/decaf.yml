notes:
- MICCAI satellite workshop on federated, distributed and collaborative learning for medical imaging, including privacy-preserving training and attacks on federated learning
- Started as the DCL workshop in 2020; 2026 was the 7th edition
- Papers in the MICCAI Satellite Events joint Springer LNCS proceedings (2025 -> LNCS 16135, shared with BRIDGE)
- Full papers up to 8 pages excluding references in the MICCAI template, double-blind review with 3 reviewers, OpenReview submission (2026)
- Organizers in 2026 from Ant Group, University of British Columbia, University Hospital Bonn, Indiana University, NVIDIA, MLCommons, Monash University and University of Oxford; NVIDIA sponsors best paper awards
- Location follows MICCAI (Daejeon 2025, Strasbourg 2026)
- Not listed in CORE ICORE2026 or the CCF 2026 list
