notes:
- Regional computing education conference of the CCSC; recent editions were held at colleges in Missouri, Iowa and Kansas
- Pedagogy and research papers, workshops, tutorials, lightning talks, nifty assignments, student papers and posters, hackathon and programming contest
- Papers are anonymized for blind review, up to 10 single-spaced pages
- Accepted papers appear in the Journal of Computing Sciences in Colleges; only works presented at the conference go to the ACM Digital Library
- 2027 is the 33rd edition, at Northwest Missouri State University, Maryville, Missouri
- Not listed in ICORE2026; not on the CCF list
