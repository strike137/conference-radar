id: icngc
name: ICNGC
full_name: International Conference on Next Generation Computing
type: conference
tier: minor
areas: [general, ai, networking]
region: asia-pacific
language: english
frequency: annual
organizer: KINGPC (Korean Institute of Next Generation Computing)
organizer_country: [korea]
proceedings: ICNGC Conference Proceedings (KINGPC, with ISSN, online via ManuscriptLink); selected best papers invited
  to the Journal of Korean Institute of Next Generation Computing
archival: true
typical:
  deadline_months: [9, 10]
  conference_months: [11, 12]
links:
  website: https://www.icngc.org/
notes:
- Run by the Korean Institute of Next Generation Computing (KINGPC) since 2016; 12th edition in 2026
- Broad scope (IoT, cloud, big data, AI, VR and metaverse, multimedia, communication systems, information security)
- Full papers 5 to 6 pages, short papers 2 to 4 pages, submitted via EDAS and reviewed by the TPC
- Proceedings carry an ISSN; best papers invited to the KINGPC journal after extension
- 2026 edition co-organized with the University of Transport and Communications in Hanoi, Vietnam, as a hybrid event
- Submission deadline was extended twice in 2026
