notes:
- Annual antenna workshop series held since 2005, technically sponsored by the IEEE Antennas and Propagation Society
- Focus on small antennas and advanced and artificial materials (metamaterials, metasurfaces) in antenna design
- All oral talks are invited; contributed papers are presented as posters
- Rotates worldwide (Aalborg 2023, Sendai 2024, Florida 2025, Liverpool 2026, Thessaloniki 2027)
- 2 to 4 page IEEE two-column camera-ready papers submitted via EDAS; proceedings in IEEE Xplore
- Antenna engineering venue outside the usual CS rankings; not listed in ICORE2026 or the CCF 2026 list
