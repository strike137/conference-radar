notes:
- Workshop co-located with IEEE ICC; 3rd edition at ICC 2025 (Montreal, WS13), 4th edition at ICC 2026 (Glasgow, WS-28)
- Covers near-field (Fresnel region) communications, localization and sensing with extremely large antenna arrays, RIS, mmWave and THz
- Co-chairs include Haiyang Zhang, Anna Guerra, Francesco Guidi, Nir Shlezinger, Yuanwei Liu and George C. Alexandropoulos
- Steering committee includes Linglong Dai, Marco Di Renzo, Yonina C. Eldar and Davide Dardari
- Accepted and presented papers go into the IEEE ICC workshop proceedings in IEEE Xplore; in-person presentation required (no-show papers removed)
- Submissions via EDAS through the ICC workshop call
- Not listed in ICORE2026
