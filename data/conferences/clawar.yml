notes:
- Annual robotics conference of the CLAWAR Association, a UK charity for mobile and service robotics
- Covers climbing, walking and other mobile robots, their modelling, design and applications, and support technologies
- Each edition is co-organized with a host university (Cranfield University, UK, in 2026; Shenzhen Technology University in 2025)
- Proceedings in Springer Lecture Notes in Networks and Systems (LNNS), indexed in Scopus and EI; 2021 proceedings were in Springer AISC
- Location rotates worldwide (2021 Japan virtual, Azores 2022, Florianopolis 2023, Kaiserslautern 2024, Shenzhen 2025, Cranfield 2026)
- Not ranked by CORE (not found in ICORE2026) and not on the CCF list
