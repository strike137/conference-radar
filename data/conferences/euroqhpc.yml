id: euroqhpc
name: EuroQHPC
full_name: International European Workshop on Quantum Computing for High-Performance Computing
type: workshop
tier: minor
areas: [systems]
region: europe
language: english
frequency: annual
organizer: Workshop chairs from CESGA, Universidade da Coruna and Universidade de Santiago de Compostela (Spain)
organizer_country: [europe]
proceedings: Springer LNCS (Euro-Par workshops volume)
archival: true
typical:
  deadline_months: [5]
  conference_months: [8]
links:
  website: https://www.euroqhpc.eu/home
notes:
- Workshop on integrating quantum computers into HPC, hybrid quantum-classical software, parallel and distributed quantum computing, QEC and quantum networks
- 2nd edition in 2026, co-located with Euro-Par 2026 in Pisa
- Full papers of 10 to 12 pages (LNCS) go to the Euro-Par workshops volume of Springer LNCS; shorter papers can be accepted as short papers but are not published
- At least 3 blind reviews per paper; at least one author must register and present in person
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
