id: icgsp
name: ICGSP
full_name: International Conference on Graphics and Signal Processing
type: conference
tier: minor
areas: [vision, communications]
region: japan
language: english
frequency: annual
organizer: Conference secretariat (zmeeting submission) with Japanese host universities (Okayama University in
  2026, Tokushima University in 2025); runs alongside ICCCI
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 550 USD regular author, 520 USD IEEE member, 500 USD student (2026)
typical:
  deadline_months: [5]
  conference_months: [6]
links:
  website: https://www.icgsp.org/
notes:
- Smaller commercially organized conference on graphics, image and video processing, computational imaging and
  signal processing
- Shares dates, venue and committee with ICCCI (Computer Communication and the Internet); held as an ICCCI
  workshop in 2022 to 2024
- Held in Japan in June or early July since 2022 (Chiba 2022, Shonan 2023, Tokyo 2024, Tokushima 2025, Okayama
  2026); online in 2020 and 2021, Hong Kong in 2019
- Proceedings in the ACM Digital Library for 2017 to 2024 and IEEE Xplore from 2025, listed as indexed in Ei Compendex and Scopus
- Regular papers 6 to 10 pages, extra pages 70 USD each; abstract-only presentation possible
- Not listed in the CORE portal (ICORE2026)
