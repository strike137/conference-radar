notes:
- One-day ICSE workshop on software engineering for IoT systems (architecture, security, quality, testing, edge and cloud services)
- Held with ICSE every year since at least 2023; 2026 was the 8th edition, 2027 is the 9th
- Organizers from Canada (Concordia University, Polytechnique Montreal), Spain, the USA and Brazil
- Long papers up to 8 pages, short papers up to 4 pages, extended abstracts up to 5 pages (APC free) and 1-page posters, ACM format, submitted via HotCRP
- Papers published in the ACM Digital Library; long and short papers need an ACM Open agreement or an APC (250 USD members, 350 USD non-members)
- 2027 runs in a hybrid format with keynotes, short presentations, working groups and a fishbowl panel
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
