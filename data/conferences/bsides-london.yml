notes:
- Community-run Security BSides event in London, first held in 2011; one-day conference in December
- Held at the Novotel London West conference centre in Hammersmith since 2023
- Free to attend; 2071 people attended in 2025, the largest edition so far, and tickets go within minutes
- Three talk tracks (45 minute talks), workshops of 2 or 4 hours, and a Rookie track of 15 minute talks for first-time speakers with mentors
- In person only, no remote presentations; calls open on 1 August and close on 30 September
- No proceedings
