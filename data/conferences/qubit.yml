notes:
- Cybersecurity conference for CISOs, security leaders and senior practitioners, run by Qubit Security s.r.o. (Zvolen, Slovakia)
- Two editions a year; Qubit Prague in spring (14th edition in 2027) and Qubit Slovakia in November in the Low Tatras (6th edition in 2026)
- Earlier editions were also held in Sofia and Belgrade (until 2020)
- Vendor-free curated program of keynotes, panels and pre-conference trainings; proposals reviewed by an independent committee
- Industry event with paid passes (e.g. EUR 450 public pass for government, academic and non-profit delegates at Prague); no proceedings
