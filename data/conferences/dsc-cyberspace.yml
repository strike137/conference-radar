notes:
- Annual since 2016 (Changsha); held in China every year (Shenzhen 2021, Guilin 2022, Hefei 2023, Jinan 2024, Baoding 2025, Qingdao 2026)
- Known as IEEE DSC through 2025 with proceedings in IEEE Xplore; DSC 2026 moved to Springer LNCS
- Not the same venue as IEEE DSC (Dependable and Secure Computing)
- Co-located workshops such as MDATA, BDBA, PSTF-AI, GRLA and VAAL
- Single-blind review on CMT; LNCS papers up to 16 pages (2026)
- Deadlines are often extended; 2026 paper deadline moved from August 15 to September 5 and the conference from September to November
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
