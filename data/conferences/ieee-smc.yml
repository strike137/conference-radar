notes:
- Flagship annual conference of the IEEE SMC Society; rotates worldwide (2024 Kuching, 2025 Vienna, 2026 Bellevue,
  2027 Ho Chi Minh City)
- Single-blind review by at least two referees; regular papers up to 6 pages plus up to 2 paid extra pages; submission
  via PaperCept
- Also takes 4-page work-in-progress/industry papers, special session and workshop papers, and journal presentation-only
  papers
- Paper deadline is usually extended by several weeks; travel grants offered
- CORE B (ICORE2026), CCF C
