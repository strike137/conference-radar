notes:
- Annual conference of the Centro Latinoamericano de Estudios en Informática (CLEI), held since 1974 and rotating among Latin American countries
- Proceedings in IEEE Xplore since 2012
- Five tracks (software systems, intelligent systems, systems in practice, computing technologies, computing education) plus associated events such as LAWCC, CLTM/CLTD thesis contests and ELI
- Papers in Spanish, Portuguese or English using the IEEE template, with title, abstract and keywords in English; full papers up to 10 pages, work in progress up to 4 pages
- "Journal-first track: papers recently published in an indexed journal can be presented"
- 2025 edition in Valparaíso was held jointly with JCC 2025 and IEEE CHILECON 2025; 2026 edition at ITAM, Mexico City
- CORE C (ICORE2026, listed as Latin American Conference on Informatics)
