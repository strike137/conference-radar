notes:
- Independent, community-driven, non-profit Security BSides conference in Oslo, Norway, run entirely by volunteers
- First held in 2019; 2021 was a digital edition; 2026 was the seventh event (sixth in person)
- One-day, single-track event at Vulkan Arena with breakfast, lunch and dinner; tickets usually sell out
- All talks are recorded and published on YouTube
- No proceedings
