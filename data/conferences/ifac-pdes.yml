links:
  website: https://www.pdes-conference.eu/
notes:
- IFAC conference on programmable logic, FPGAs, microcontrollers, PLCs, real-time and embedded control systems
- Main sponsor is IFAC TC 3.1 Computers for Control; co-sponsored by TC 4.1 Human Machine Systems
- Accepted and presented papers are published in the open access IFAC-PapersOnLine series on ScienceDirect
- Held in Brno in 2024 and in Ostrava in 2027; organized by Czech universities
- 4 to 6 page IFAC format papers, submitted through IFAC PaperCept
- Not listed in ICORE2026 or the CCF 2026 list
