notes:
- Community security conference in Regina, Saskatchewan, Canada; part of the worldwide Security BSides movement
- One-day main conference with a single speaking track, plus a workshop day and a Skillbit (formerly MetaCTF) capture the flag
- 25-minute talks plus Q&A, and 10 to 15 minute lightning talks; submissions reviewed as they arrive, decision within four weeks of the close
- Very cheap to attend, 50 CAD for professionals and 25 CAD for students with lunch included (same price since 2023)
- No certificates of participation; talks only, no proceedings
