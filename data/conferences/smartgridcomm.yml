id: smartgridcomm
name: IEEE SmartGridComm
full_name: IEEE International Conference on Communications, Control, and Computing Technologies for Smart Grids
type: conference
tier: minor
areas: [communications, networking, security]
region: worldwide
language: english
frequency: annual
organizer: IEEE Communications Society
organizer_country: [international]
proceedings: IEEE Xplore
fee: 900 USD IEEE ComSoc member, 1100 USD non-member author full registration (2026, early); 410 USD student
typical:
  deadline_months: [4, 5]
  conference_months: [9, 10]
links:
  website: https://sgc2026.ieee-smartgridcomm.org/
notes:
- IEEE ComSoc conference on communications, control and computing for smart grids, held every autumn since 2010
- Five symposia (data analytics and computation, cyber-physical security and privacy, control and operation,
  communications and networking, power line communications); the PLC symposium came from the merged ISPLC
- Accepted and presented papers go to IEEE Xplore; 6 pages including references, 7th page for 100 USD, EDAS submission
- One full author registration covers up to 3 papers; papers above 35% similarity are rejected (2026)
- Official sites list the paper deadline as a final deadline; workshop papers have a later deadline in July
- Location rotates worldwide (2021 Aachen, 2022 Singapore, 2023 Glasgow, 2024 Oslo, 2025 Toronto, 2026 College
  Station, Texas)
- Not listed in ICORE2026 and not in the CCF 2026 list
