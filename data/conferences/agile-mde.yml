notes:
- Workshop on agility in model-driven engineering, low-code development and AI-assisted modeling
- Held at STAF every year since 2023 (Leicester 2023, Enschede 2024, Koblenz 2025, Rennes 2026); the 2026 edition was the 4th
- Papers appear in the joint STAF workshops proceedings in CEUR-WS (Vol-3620 for 2023, Vol-3727 for 2024, Vol-4122 for 2025)
- Each submission is reviewed by three programme committee members; CEURART single-column template
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
