notes:
- Run by AAAI; main venue for computational social science and social computing, mixing CS and social science
- Three submission rounds per year (15 May, 15 September, 15 January, 23:59 AoE) with a revise and resubmit option
  for full papers
- Posters, demos, datasets and workshop/tutorial proposals only in the January round
- Full papers up to 11 pages at submission, double-blind; mandatory paper checklist
- Proceedings published by AAAI (ojs.aaai.org); workshop papers go to separate workshop proceedings
- Social science and sociophysics track publishes only abstracts, so full papers can appear elsewhere
- Held in late May or June in North America or Europe (Limassol 2023, Buffalo 2024, Copenhagen 2025, Los Angeles
  2026, Edinburgh 2027)
- In-person presentation required; Zoom attendance only for residents of developing countries
