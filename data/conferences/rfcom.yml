notes:
- Workshop on RF computing for IoT, backscatter, reconfigurable intelligent surfaces, RF sensing and energy harvesting
- 1st edition held with ACM SenSys 2024 (Hangzhou), 2nd with ACM MobiCom 2025 (Hong Kong)
- Technical papers up to 6 pages, position papers up to 4 pages and demo or poster papers up to 2 pages, ACM format,
  double-blind review
- Proceedings in the ACM Digital Library (Proceedings of the First and Second International Workshop on Radio
  Frequency (RF) Computing)
- Not in the MobiCom 2026 workshop list
- Not listed in ICORE2026
