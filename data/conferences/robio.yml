id: robio
name: IEEE ROBIO
full_name: IEEE International Conference on Robotics and Biomimetics
type: conference
tier: minor
areas: [ai]
region: asia-pacific
language: english
frequency: annual
organizer: IEEE RAS (financial co-sponsor), chaired mostly by Chinese and Hong Kong universities
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI]
typical:
  deadline_months: [8]
  conference_months: [12]
links:
  website: https://www.robio2026.org/
notes:
- Robotics and biomimetics conference; 2026 is the 22nd edition, theme Biomimetic Robots Empowered by AI
- Accepted papers appear in IEEE Xplore and are submitted to EI; 6 pages in IEEE format, up to 8 with extra page charge
- Held in December, mostly in China with some editions in Thailand (Sanya 2021, Jinghong 2022, Koh Samui 2023, Bangkok 2024, Chengdu 2025, Tengchong 2026)
- Has best conference paper and T.J. Tarn best paper in robotics awards
- Not listed in CORE or CCF
