notes:
- Half-day workshop on malleability and dynamic resource management in HPC (malleable programming models, runtimes, scheduling, I/O and storage, energy)
- 3rd edition held with SCA/HPCAsia 2026 in Osaka on 2026-01-26
- Papers published together with the SCA/HPCAsia proceedings; up to 12 pages, ACM single-column manuscript format
- Double-blind, one-pass review with no rebuttal, submitted via EasyChair
- Different from DynResHPC, the dynamic resources workshop held with Euro-Par
- Not listed in the CORE ICORE2026 portal
