notes:
- Two-day practitioner cybersecurity conference in Houston, Texas, USA, at the George R. Brown Convention Center
- Run by the team that founded and operated HOU.SEC.CON. from 2010 to 2025; first edition under the new name in 2026
- About 3,000 attendees, 10+ tracks and 100+ speakers, plus a large exhibit hall (200+ exhibitors), villages, free hands-on workshops and a startup pitch competition
- 2026 tracks included OT.SEC.CON., CYBR.HAK.CON (hacker track), EXEC.SEC.CON. and AI.SEC.CON.
- Commercial event run by an LLC; no proceedings
- Not listed in CORE ICORE2026
