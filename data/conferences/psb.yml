notes:
- Computational biology and biomedical informatics conference held since 1996; 2027 is the 32nd edition
- Held every January at the Fairmont Orchid on the Big Island of Hawaii (2021 was virtual)
- Sessions are defined each year from session proposals (AI in clinical medicine, NLP for clinical LLMs, precision
  medicine, systems biology in 2027)
- Peer-reviewed full papers published as open access (CC BY 4.0) chapters by World Scientific and indexed in PubMed
- Separate abstract/poster track with a late deadline; workshops before the main sessions
- CORE National USA (ICORE2026); not on the CCF 2026 list
