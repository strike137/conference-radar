notes:
- International computational biology conference held every January since 1996; 32nd edition in 2027
- Held at the Fairmont Orchid on the Big Island of Hawaii every year (virtual in 2021)
- Program built from dynamically chosen sessions proposed each year (2027 sessions include clinical AI, NLP for
  clinical LLMs, precision medicine, systems biology)
- Peer-reviewed full papers published by World Scientific in an archival open access proceedings volume and indexed
  in PubMed; NIH-funded papers go to PubMed Central
- Poster abstracts (1 page) can be presented without official publication
- CORE ICORE2026 rank National USA; not on the CCF 2026 list
