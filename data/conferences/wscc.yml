notes:
- Workshop on the edge-fog-cloud compute continuum (orchestration, scheduling, serverless, unikernels and WebAssembly, AI-based management)
- Co-located with Euro-Par every year since 2023 (Limassol 2023, Madrid 2024, Dresden 2025, Pisa 2026)
- Papers appear in the Euro-Par workshops volume of Springer LNCS (LNCS 14351 for 2023, LNCS 15385/15386 for 2024)
- LNCS format, 10 to 12 pages; submission through the shared Euro-Par workshops EasyChair
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
