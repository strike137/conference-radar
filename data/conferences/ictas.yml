notes:
- Run by Durban University of Technology with the IEEE South Africa Computer Chapter; 10th edition in 2026
- 2026 edition held at the Radisson Blu Hotel, Umhlanga, Durban, South Africa
- The site says every paper presented since the first edition in 2017 has been published in IEEE Xplore
