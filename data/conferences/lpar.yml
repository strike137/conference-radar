notes:
- Conference on automated reasoning, computational logic, programming languages and their applications
- Deliberately held in unusual places (Stellenbosch, Suva, Maun, Awassa, Manizales, Balaclava in Mauritius, Spetses)
- Proceedings in the open access EasyChair EPiC Series in Computing; LPAR-shorts papers go to Kalpa Publications
- IWIL workshop co-located; five-day format with an excursion day in the middle
- Not held every year (2018, 2020 online, 2023, 2024, 2026)
- CORE B (ICORE2026, listed as Logic Programming and Automated Reasoning); not on the CCF 2026 list
