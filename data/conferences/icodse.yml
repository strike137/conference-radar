id: icodse
name: ICoDSE
full_name: IEEE International Conference on Data and Software Engineering
type: conference
tier: minor
areas: [software, data, ai, security]
region: southeast-asia
language: english
frequency: annual
organizer: Knowledge and Software Engineering Research Group, School of Electrical Engineering and Informatics, Institut
  Teknologi Bandung (STEI ITB), with partner Indonesian universities; technical co-sponsor IEEE Indonesia Section
organizer_country: [indonesia]
proceedings: IEEE Xplore
indexing: [IEEE Xplore]
fee: 400 USD international non-IEEE-member presenter, 300 USD IEEE member or student, 250 USD IEEE student member (2026)
typical:
  deadline_months: [8, 9]
  conference_months: [9, 10]
links:
  website: https://icodse.org/
notes:
- Run annually since 2014 by the Knowledge and Software Engineering Research Group at STEI ITB (Bandung), often
  together with other Indonesian universities; 2026 is the 12th edition
- Held in Indonesia, moving between cities (Toba 2023, Gorontalo 2024, Batam 2025, Bandung 2026); hybrid with
  online presentation option
- Proceedings in IEEE Xplore (technical co-sponsor IEEE Indonesia Section)
- Two main tracks (software engineering and data engineering), plus a trustworthy and secure systems track in 2026
- 4 to 6 pages in IEEE format, double-blind review (2026)
- Deadlines are usually extended by about two weeks
- Not listed in ICORE2026 (no CORE rank) or the CCF list; a small regional venue
