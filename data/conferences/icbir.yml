links:
  website: https://icbir.org/
notes:
- Affiliated conference of the Elsevier journal Biomimetic Intelligence and Robotics; started in 2022 as ISBIR (with an
  orthopaedic robotics forum)
- Papers go to Elsevier Procedia Computer Science (EI and Scopus); award papers are invited to the journal
- Robotics, AI and biomimetics; 6 pages plus 1 page of references in the Elsevier template, submission via Microsoft CMT
- Held each summer in a different Chinese tourist city (Dali 2022, Zunyi 2023, Linzhi 2024, Zhangye 2025, Zhongwei 2026)
- Registration is expensive for a minor venue (700 USD early bird in 2026)
