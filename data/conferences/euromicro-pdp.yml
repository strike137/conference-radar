notes:
- Annual Euromicro conference on parallel and distributed computing; 2026 was the 34th edition
- Hosted by a European university that changes most years (Valladolid 2021 and 2022, Naples 2023, Dublin 2024, Turin 2025, Cluj-Napoca 2026, Barcelona 2027)
- Proceedings published by IEEE Conference Publishing Services and available in IEEE Xplore
- "2026 rules: up to 8 pages for long papers and 4 pages for short papers in IEEE format; double-blind review via EasyChair"
- Co-located special sessions (for example quantum computing, HPC at the edge, digital twins) with their own calls
- In 2026 the main track submission and notification dates were extended by two weeks
- For 2027 the abstract and paper deadlines were extended to 2026-11-09 (AoE) and notification moved to 2026-12-20
- "Fees 2026: 600 EUR regular early, 350 EUR student early"
- "CORE C (ICORE2026); not in the CCF 2026 list"
