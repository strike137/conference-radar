organizer: Workshop organizers (Qingsong Wen, Squirrel Ai Learning; Yongfeng Zhang, Rutgers University; Zhiwei Liu, Salesforce
  AI Research; et al.)
organizer_country: [international]
proceedings: Springer Nature (announced for the KDD 2026 edition, series not named); earlier editions none (non-archival)
archival: false
typical:
  deadline_months: [5, 6]
