links:
  website: https://sites.google.com/view/ai4ir
notes:
- Workshop on LLM agents for retrieval, recommendation, RAG and search
- Moves between host conferences (CIKM 2024, AAAI 2025, WWW 2025, KDD 2025, KDD 2026)
- Full papers up to 8 pages plus references, short papers up to 4 pages, ACM double-column format, single-blind review via
  EasyChair
- All submissions are non-archival and can be resubmitted to other conferences
- The KDD 2026 page also announces that Springer Nature will publish the proceedings, without naming the series
- Demo, applied/industry and dataset/benchmark tracks besides research papers
- Not listed in the CORE ICORE2026 portal or the CCF list
