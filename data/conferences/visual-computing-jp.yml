notes:
- Japan's main domestic symposium on computer graphics and related fields, held since 1993 (34th edition in 2026)
- Co-organized by CG-ARTS, the ITE AIT group, the IIEEJ Visual Computing group and the IPSJ CGVI group
- Peer-reviewed papers of 1 to 4 A4 pages in Japanese or English; double-blind review by at least 3 PC members;
  accepted as long or short talks
- Papers appear only in an electronic proceedings given to participants; authors keep copyright, and short papers
  or posters already published elsewhere are accepted
- Separate poster track with a deadline in August; VC paper awards and a student research award
- Topics include rendering, modeling, simulation, animation, VR/AR, digital fabrication, games, image processing and
  machine learning for CG
- Venue changes each year (Kyoto International Conference Center 2022 with Pacific Graphics, Shibaura Institute of
  Technology 2023, Toyo University 2024, Waseda University 2025, Hokkaido University 2026)
