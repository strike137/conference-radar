notes:
- Volunteer-run Security BSides conference in Charlotte, North Carolina, USA, started in 2013
- Partnered with Southeast Linux Fest from 2013 to 2015, ran on its own from 2016, virtual in 2020 and 2021
- Moved from September to the spring in 2025 (April 5, 2025); now a spring conference
- One conference day with three talk tracks (2026), villages and a CTF, followed by a separate training and workshop day
- 2026 edition held at Discovery Place Science, Charlotte, with a Tron theme
- Talks selected on technical merit from an open call for papers; no proceedings
- Not listed in the CORE ICORE2026 portal
