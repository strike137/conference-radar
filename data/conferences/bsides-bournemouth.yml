notes:
- Security BSides community conference in Bournemouth, Dorset, UK
- Run by BSides Bournemouth CIC; the 2025 edition was organised by Bournemouth 2600, a local 2600 hacker group
- 2026 edition had 230+ attendees, 37 speakers and 3 tracks, plus workshops, villages and a CTF
- Call for papers on pretalx; 30 or 45 minute talks, workshops and village sessions; first-time speakers welcome
- No vendor pitches; talks only, no proceedings
- Not listed in the CORE ICORE2026 portal
