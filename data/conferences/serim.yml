id: serim
name: SeRIM
full_name: International Workshop on Security and Risk in Identity Management
type: workshop
tier: minor
areas: [security]
region: europe
language: english
frequency: annual
organizer: Chairs from Fondazione Bruno Kessler (FBK) and Ca' Foscari University of Venice, co-located with IEEE EuroS&P
organizer_country: [europe]
proceedings: IEEE Xplore (IEEE EuroS&P Workshops proceedings)
archival: true
typical:
  deadline_months: [2, 3]
  conference_months: [7]
links:
  website: https://st.fbk.eu/events/SeRIM2026/
notes:
- One-day post-conference workshop of IEEE EuroS&P; 1st edition 2025 (Venice), 2nd edition 2026 (Lisbon)
- Papers published in IEEE Xplore in the EuroS&P Workshops (EuroS&PW) volume
- 'Topics: identity management protocols, formal verification, risk assessment, security metrics, threat modeling and tools'
- Regular papers up to 10 pages, short papers up to 6 pages, tool papers up to 4 pages (live demo), excluding references
  and appendices; IEEE format, anonymous review
- Deadlines were extended by about a month in 2025 and by about ten days in 2026
- 'Small program: 3 regular and 3 short papers plus one keynote in 2026'
