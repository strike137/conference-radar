notes:
- Started in 2005 in Singapore; mostly held in China, occasionally Australia, Korea (Seoul 2010), Japan (Tokyo 2018),
  Malaysia, Taiwan and Denmark (Copenhagen 2023); no 2020 edition
- Proceedings in Springer LNCS
- Two submission rounds (about late June/July and August); in 2026 both deadlines were extended by about a week
- Applied and practical security focus; topics include AI security, mobile and cloud security, applied cryptography
- CORE C (was B up to CORE2021); not in the CCF list
