notes:
- Annual conference of the Digital Government Society; 28th edition in 2027
- Interdisciplinary research on digital government, AI in the public sector, civic engagement, interoperability and cybersecurity
- Proceedings published open access (CC BY 4.0) by TU Delft OPEN Publishing since 2025; earlier volumes in the ACM International
  Conference Proceeding Series
- Research papers (about 8,000 words) and management or policy papers (about 5,000 words) get double-blind review by at least
  two PC members
- Panels, posters, demos and workshops are submitted as proposals with a later deadline; Doctoral Colloquium material is not published
- Location rotates worldwide (Gdansk 2023, Taipei 2024, Porto Alegre 2025, Omaha 2026, Seoul 2027)
- Sister conference of IFIP EGOV-CeDEM-ePart
- Not listed in ICORE2026; not on the CCF 2026 list
