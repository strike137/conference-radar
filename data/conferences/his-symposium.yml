notes:
- Largest annual event of the Human Interface Society, held in September at a university campus that changes each
  year (Kyoto 2024, Kanazawa 2025, Okayama 2026)
- Three presentation types (demo, poster, and discussion talks of 15 min plus 15 min discussion); all need a paper
- Papers are 2 to 8 pages (discussion talks 4 to 8) and go into an online proceedings open to participants only
- Selected discussion papers can be recommended to the society journal (opt-in since 2023)
- Also has tutorials, workshops, a student luncheon and the SICHI student innovation contest
- Presenters must pay and register before submitting the paper; one fee per presentation
