notes:
- Workshop bringing generative ML and wet-lab experimentalists together on protein, molecule and nucleic acid design
- Held at ICLR 2024 (Vienna), ICLR 2025 (Singapore) and ICLR 2026 (Rio de Janeiro); moved to NeurIPS 2026 (Atlanta), so 2026 had two editions
- Two tracks, a dry-lab (in silico) track and a wet-lab track for any work with experimental results
- Short papers up to 5 pages, or 2-page extended abstracts for the wet-lab track; one round of double-blind review on OpenReview
- Non-archival with no proceedings; at the ICLR editions selected papers could be fast-tracked to Cell Systems (2024) or Nature Biotechnology (2025, 2026)
- Runs a binder design competition and USD 1,000 seed grants for new dry/wet lab collaborations; travel grants available
- Not the GEM workshop on natural language generation (gem)
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
