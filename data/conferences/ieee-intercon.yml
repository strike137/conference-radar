links:
  website: https://www.intercon.org.pe/
notes:
- Organized by the IEEE Peru Section with a different host university and its IEEE student branch each year
- Proceedings in IEEE Xplore and indexed in Scopus; papers 6 to 8 pages in English, submitted via EasyChair
- Held in Peru (Lima 2021 to 2024, Arequipa 2025, Trujillo 2026); August in recent years, November in 2023 and 2024
- Deadline moved through several calls in 2026 (May 5 to June 29); accepted papers must be presented in person
- Not ranked in CORE ICORE2026
