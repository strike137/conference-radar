notes:
- Workshop connecting parameterized complexity with computational reasoning (logic, probabilistic reasoning), AI, computational social choice and machine learning
- Irregular series, held in 2010 (MFCS and CSL, Brno), 2014 (VSL, Vienna), 2022 (FLoC, Haifa) and 2026 (FLoC, Lisbon)
- PCCR 2026 was the 4th edition, affiliated with KR 2026 at FLoC 2026
- Talk-based workshop with invited speakers; contributed talks (about 30 minutes) are selected from short abstracts and may cover published or unpublished results
- No proceedings are mentioned; the site publishes the talk slides
- Not listed in ICORE2026 or the CCF list
