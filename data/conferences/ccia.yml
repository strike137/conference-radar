notes:
- Annual general AI conference of ACIA, the Catalan AI society (a EurAI member); 28th edition in 2026
- Held in the Catalan-speaking territories of Spain (Sitges 2022, Sant Fruitos de Bages 2023, Barcelona 2024, Valls
  2025, Castello de la Plana 2026)
- Full papers (8 to 10 pages) and short papers (2 to 4 pages) go into an open access IOS Press FAIA volume (2026 ->
  vol. 431); 1 to 2 page abstracts appear only on the conference website
- Papers in English; review is not blind
- Selected papers are invited to a journal special issue (International Journal of Computational Intelligence Systems)
- "Fee 2026: 550 EUR senior non-member, 290 EUR student non-member (early); lower rates for ACIA members"
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
