notes:
- One-day Kotlin technical conference in Tokyo with the theme "loving Kotlin", run by the Japan Kotlin User Group
- First held in 2018; 2026 is the 6th edition (2018, 2019, 2022 online, 2024 at Bellesalle Shibuya First, 2025 and
  2026 at Tokyo Conference Center Shinagawa)
- Sessions (40 or 20 minutes) chosen from an open call for proposals on fortee; at most one accepted session per
  speaker, several proposals allowed
- Talks must be given in Japanese with no simultaneous interpretation (slides may be in English)
- Accepted speakers attend free; rejected applicants are guaranteed an early bird ticket
- Scholarship program for attendees (2026)
- No papers or proceedings; talks only (videos on YouTube)
- Uses the Kotlin name with permission of the Kotlin Foundation but is not endorsed by it
