notes:
- Flagship conference of the Australian Pattern Recognition Society (APRS), established in 1991; annual since 2007
  (roughly biennial before), held in Australia (1997 edition in Auckland)
- Proceedings in IEEE Xplore; double-blind review, 8 pages including references, no extra page charges
- Ranked Australasian C in ICORE2026 (was Australasian B in CORE2021)
- CORE-funded student travel grants (five grants of AUD 300 in 2026); award papers invited to a Pattern Recognition
  Letters special section
- Includes workshops, tutorials, industry sessions and a journal-to-conference track
