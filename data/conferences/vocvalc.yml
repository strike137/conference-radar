notes:
- Half-day CVPR workshop on visual odometry, localization, SLAM, AR and location-based vision applications, with a focus on mobile
  platforms
- Held with CVPR every year since at least 2021; the 2026 edition was the 9th
- Papers up to 8 pages excluding references in CVPR format, submitted through OpenReview
- Accepted papers appear in IEEE Xplore and the CVPR Workshops proceedings on CVF Open Access (4 papers in 2026)
- Hybrid format; livestreamed through CVPR Zoom and YouTube
- Not listed in ICORE2026 or the CCF list
