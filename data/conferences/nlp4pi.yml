id: nlp4pi
name: NLP4PI
full_name: Workshop on NLP for Positive Impact
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizing committee (2026 organizers from Northeastern University, University of Michigan, TU Munich,
  University of California, Dataminr, CMU, Penn State and USC; steering committee Rada Mihalcea, Joel Tetreault and
  Zhijing Jin); co-located with ACL-family conferences
organizer_country: [usa]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [3, 7]
  conference_months: [7, 10, 11]
links:
  website: https://sites.google.com/view/nlp4positiveimpact
notes:
- Workshop on NLP for social good (health, education, poverty, climate, inequality), in line with the NLP for Social Good
  initiative
- Held at ACL 2021 (online), EMNLP 2022 (Abu Dhabi), EMNLP 2024 (Miami), ACL 2025 (Vienna) and EMNLP 2026 (Budapest); no
  edition in 2023
- Archival papers in the ACL Anthology; authors can choose non-archival, and work accepted elsewhere is non-archival only
- Short papers up to 4 pages and long papers up to 8 pages; direct submission on OpenReview or commitment of ARR-reviewed
  papers; each paper must discuss ethical and societal implications
- All accepted papers presented as posters, with a few invited oral talks and 2 best paper awards
- Not listed in ICORE2026 and not on the CCF list
