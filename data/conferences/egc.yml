notes:
- Annual French-speaking conference on data science, knowledge engineering, data mining, semantic web and AI, run by the Association EGC
- Papers may be submitted in French or English, but a French version is required on acceptance unless the authors are non-French-speaking
- Double-blind review; in 2027 long papers are 11 pages and short papers 7 pages (excluding references and English abstract), plus 2-page posters and 4 to 8 page demo papers
- Proceedings published as an issue of the RNTI series (EGC 2026 -> RNTI E-42); best papers invited to a Data & Knowledge Engineering (DKE) special issue
- Held in a different French city each year (Strasbourg 2025, Anglet 2026, Poitiers 2027), with the e-EGC winter school and workshops before the main conference
- EGC 2027 runs the e-EGC winter school on Feb 1-2, workshops on Feb 2 and the main conference on Feb 3-5
- Not listed in the CORE portal (ICORE2026)
