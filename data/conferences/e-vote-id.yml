notes:
- Joint successor of the EVOTE and Vote-ID conferences; 2026 was the 11th joint edition
- Interdisciplinary e-voting venue with tracks on security/usability/technical issues, governance, election
  practice, posters/demos and a PhD colloquium; single track, no parallel sessions
- Selected full papers of Tracks 1 and 2 go to an open access Springer LNCS volume (acceptance below 30%); a second
  open access volume appears in GI Lecture Notes in Informatics (LNI)
- Double-blind review via EasyChair; full papers up to 16 pages in LNCS format including references
- First seven joint editions held in Bregenz, Austria; since then Luxembourg (2023), Tarragona (2024), Nancy (2025),
  Tallinn (2026)
- Usually held in the first week of October
- Different event from the FC Voting workshop (voting-fc)
- Not listed in ICORE2026
