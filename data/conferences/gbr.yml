notes:
- Biennial workshop of IAPR Technical Committee 15 on graphs in pattern recognition, image analysis and graph machine learning
- Proceedings in Springer LNCS (LNCS 15727 for 2025, LNCS 14121 for 2023); also written GbRPR
- Held mostly in Europe (Vienna 2013, Beijing 2015, Capri 2017, Tours 2019, Salerno 2023, Caen 2025); no edition in 2021
- Single-blind review by at least three program committee members; papers up to 10 pages (2025)
- Low registration fee that includes lunches and the conference dinner (2025)
- 2027 edition in Pisa; a journal special issue on GbR topics is under discussion
