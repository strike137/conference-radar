links:
  website: https://chira.scitevents.org/
notes:
- Organized by INSTICC; since 2023 accepted complete papers are published by Springer in a CCIS volume (up to
  2022 papers went to the SCITEPRESS Digital Library with a CCIS book of revised and extended papers)
- CORE C (ICORE2026); regarded as a minor HCI venue; not on the CCF 2026 list
- Covers human factors for interactive systems, interactive devices, interaction design and adaptive and
  intelligent systems
- Two submission stages (1st stage gives an earlier notification), plus late-breaking papers and an abstracts track
  whose abstracts are presented but not published; double-blind review; all deadlines AoE
- Two-day event co-located with other INSTICC conferences (2026 with ICINCO, CoopIS, icSPORTS and WEBIST) with free
  cross access; remote presentation allowed exceptionally
- Held in European cities (Budapest 2020, Valletta 2022, Rome 2023, Porto 2024, Marbella 2025, Angers 2026)
