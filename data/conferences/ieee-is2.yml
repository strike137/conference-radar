language: english
frequency: annual
organizer: IEEE ComSoc
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [6, 7]
  conference_months: [9, 10]
links:
  website: https://internetofsounds2026.ieee-internetofsounds.org/
notes:
- IEEE Communications Society symposium at the intersection of sound and music computing and the Internet of Things
- Accepted and presented papers of at least 4 pages are submitted to IEEE Xplore; an author must register at the full rate
- Full papers 5 to 10 pages, posters/short papers 4+1 pages, demos up to 2 pages; also music performance and sound
  installation tracks (not published)
- Submission via EasyChair; best paper, best student paper and best demo awards
- Held in Europe (Erlangen 2024, L'Aquila 2025, Cannes 2026); 2026 is the 7th edition
- Not listed in CORE ICORE2026
