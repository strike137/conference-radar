notes:
- Organized by the University of Dubai, UAE, with the IEEE UAE Section as technical sponsor; Higher Colleges of Technology is strategic partner in 2026
- 2026 is the 9th edition, held at a hotel in Dubai
- Six tracks covering AI and data-driven signal processing, signal processing for communications, remote sensing and medical applications, cybersecurity, and security of critical systems
- Full papers of 4 to 6 pages in two-column IEEE format, submitted via EDAS and peer reviewed
- Accepted papers go into the conference proceedings and are submitted to IEEE Xplore; the CFP says all previous proceedings are indexed by Scopus
- Rolling review; notifications are sent on a rolling basis
- "Fee: 500 USD IEEE member and 600 USD non-member regular author, 300 USD and 360 USD student author (2026)"
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
- Not to be confused with the Iranian ICSPIS (International Conference on Signal Processing and Intelligent Systems)
