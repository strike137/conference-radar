notes:
- Grew out of the TAG workshop series at ICML, ICCV, CVPR and the Joint Math Meetings (2021-2023); stand-alone conference since 2025
- 1st edition at UC San Diego in December 2025 aligned with NeurIPS; 2nd edition at Northeastern University, Boston, in August 2026
- Focus on topology, algebra, geometry and symmetry methods for machine learning and data science
- "Three tracks: full archival papers (8 pages, PMLR), non-archival extended abstracts (4 pages) and open-problem/conjecture papers (3 pages)"
- Submissions through OpenReview; also hosts a Topological Deep Learning challenge
- Proceedings in PMLR volume 321 (2025) and volume 334 (2026)
