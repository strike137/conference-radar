notes:
- Inaugural edition in 2026, a one-day workshop co-located with ACSAC in Los Angeles
- Agentic AI for penetration testing, vulnerability discovery and autonomous defense, model-on-model adversarial
  interaction, cyber ranges and benchmarks
- Regular papers up to 12 pages and short position or WIP papers up to 6 pages (excluding references and appendices),
  IEEE compsoc double-column format, double-blind review via the ACSAC HotCRP
- Accepted papers are published by IEEE; lightning talks and tutorials are posted on the website only
- Steering committee includes Christopher Kruegel, Giovanni Vigna, Wenke Lee and Engin Kirda; industry submissions
  are explicitly welcome
- Not listed in CORE ICORE2026
