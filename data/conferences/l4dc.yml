links:
  website: https://www.l4dc.org/
notes:
- Interdisciplinary venue at the interface of machine learning, control theory and optimization
- Proceedings in PMLR (2026 -> vol. 331, 2025 -> vol. 283)
- Hosted by a different university each year, mostly in the USA (MIT 2019, Penn 2023, Michigan 2025, USC 2026), Oxford in 2024
- Submissions up to 10 pages via OpenReview; deadline in November, decisions by end of January
- Not ranked in CORE ICORE2026 but well regarded in the learning and control community
