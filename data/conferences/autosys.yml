notes:
- Workshop on systems foundations for mobile and on-device AI agents (agent architecture, tool orchestration, security and privacy of agent actions)
- First edition held with ACM MobiSys 2026 in Cambridge, UK, in an Agentic Systems track together with AutoEdge
- Two tracks, extended abstracts of 1 to 2 pages and short or position papers up to 6 pages, ACM double-column format
- Single-blind review with at least two reviews per submission, via HotCRP
- MobiSys 2026 workshop papers are included in the MobiSys proceedings in the ACM Digital Library
- Not listed in ICORE2026 and not on the CCF 2026 list
