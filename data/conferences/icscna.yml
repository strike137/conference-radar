notes:
- Organized by Bharath Niketan Engineering College, Theni, Tamil Nadu, India
- Held in Theni every year (2023, 2024, 2025 and 2026 editions)
- 2023, 2024 and 2025 proceedings are in IEEE Xplore (linked from the official site); 2026 has an IEEE Xplore compliant ISBN and IEEE conference ID 72314
- Covers green and energy efficient networking, wireless communication, sustainable cloud and smart city applications
- Full papers 6 to 8 pages in IEEE format, sent by email or an online form; at most 6 authors per paper
- 2025 proceedings were titled ICSCN rather than ICSCNA in IEEE Xplore
- Not listed in ICORE2026 or the CCF 2026 list
