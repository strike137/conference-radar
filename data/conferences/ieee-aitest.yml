notes:
- Testing of AI systems and AI for software testing (LLM quality, agentic AI assurance, data quality, autonomous systems); first held in 2019, 8th edition in 2026
- One of the co-located conferences of the IEEE CISOSE congress (with SOSE, JCC, BigDataService, IMC, DAPPS, FTS, FITYR), which rotates between the Americas, Europe and Asia
- 'Recent hosts: online (2020, 2021), San Francisco Bay Area (2022), Athens (2023), Shanghai (2024), Tucson (2025), Fukuoka (2026), Oxford (2027)'
- Papers published by IEEE Computer Society Press in IEEE Xplore (EI indexed per the CFP)
- 'Paper types (2026): regular 8 pages, short 4, AI Testing in Practice 8, tool demo 6 (IEEE double column); double-blind review; two extra pages at a charge'
- Each accepted paper must be covered by at least one full author registration and be presented in person
- Not listed in ICORE2026; not on the CCF list
