  deadline_months: [8, 9]
  conference_months: [12]
links:
  website: https://eecon2026.eesoc.lk/
notes:
- Run by the Department of Electrical Engineering, University of Moratuwa, Sri Lanka, with its student Electrical Engineering Society
- Not the Thai iEECON (International Electrical Engineering Congress)
- Held in Colombo (2024, 2026); editions in 2016, 2018, 2021, 2024 and 2026 (5th), so not every year
- Mostly power and energy topics (power systems, power electronics, machines, renewables, electric transport), plus control,
  robotics, intelligent systems and AI applications
- Double-blind review; full papers up to 6 pages in IEEE format; proceedings of all past editions in IEEE Xplore
- Technical co-sponsors are the IEEE Sri Lanka Section and its PES, IES, PELS and RAS chapters
- "Fee (2026, early bird): 200 USD for international IEEE members, 300 USD for non-members, 100 or 150 USD for students"
- Not listed in ICORE2026 or the CCF list
