notes:
- Inaugural edition in 2026, a half-day afternoon workshop held with VLDB 2026 in Boston
- Brings biomedical informatics and data management researchers together on biomedical data challenges
- Lightning talk proposals (2-page abstract) and project talk proposals (4-page short paper), PVLDB format
- General chairs from Harvard, MIT CSAIL, Northeastern University and Humboldt-Universitaet zu Berlin
- Single-blind review with at least two reviewers per submission, via OpenReview
- Camera-ready papers go into the workshop proceedings (9 papers in the VLDB 2026 workshop proceedings); authors also write a blog post for the site
- Region set as worldwide because it follows VLDB; only the 2026 edition is known
- Not listed in CORE ICORE2026 or in the CCF 2026 list
