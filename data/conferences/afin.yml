notes:
- Organized by IARIA as part of the NetWare congress, co-located with SENSORCOMM, SENSORDEVICES and other IARIA events (18th edition in 2026)
- Published open access in the IARIA ThinkMind library (ISSN 2308-4340); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Portugal, Spain, France or Greece (Porto, Nice, Barcelona, Lisbon in recent years)
