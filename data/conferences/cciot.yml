region: asia-pacific
language: english
frequency: annual
organizer: Sponsored by the University of the Ryukyus, co-sponsored by PTIT (Vietnam) and the International Association for Artificial Intelligence (2026)
proceedings: ACM DL (ACM ICPS)
archival: true
indexing: [EI Compendex, Scopus]
fee: Authors 680 USD (non member), 630 USD (student), 610 USD (committee member); presentation only 450 USD; delegates 350 USD (2026)
typical:
  deadline_months: [9]
  conference_months: [9, 10, 11]
links:
  website: https://cciot.org/
notes:
- Smaller commercially run conference (secretariat on a gmail address, submission via zmeeting); 2026 is the 11th edition
- Online 2020 to 2022 and 2024; Okinawa, Japan in 2023 (hybrid) and 2026; Ho Chi Minh City, Vietnam in 2025
- Proceedings in the ACM Digital Library, stated as indexed by EI Compendex and Scopus (2025 proceedings online February 2026)
- Papers blind reviewed by 2 to 3 reviewers; presentation-only and listener registration are also offered
- Registration covers one paper up to 14 pages; extra pages 30 USD each
- Not listed in ICORE2026 or the CCF 2026 list
