notes:
- 'Meeting of the Regional Internet Registry community for the Asia Pacific: policy meeting (OPM), SIGs, technical
  talks and hands-on training workshops'
- 'Twice a year: in February/March as part of APRICOT, and as a standalone meeting in early September'
- Call for presentations reviewed by a program committee from draft slides; non-archival, and talks already given
  elsewhere are accepted
- Fellowships (professional, youth and returning categories, plus a policy stream since 2025) cover travel for selected
  applicants from the region; remote participation is free
- 'Recent standalone venues: Kyoto 2023, Wellington 2024, Da Nang 2025, Mumbai 2026; Ulaanbaatar planned for Sep
  2027'
