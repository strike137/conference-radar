notes:
- Full-day CVPR workshop on using generative image models for visual recognition
- Held with CVPR each year since 2023; 3rd at CVPR 2025 (Nashville), 4th at CVPR 2026 (Denver)
- The site uses no acronym; the OpenReview venue is named GCV
- Short papers (4 page abstracts) and long papers (8 pages), double-blind review on OpenReview
- Non-archival, not in the CVPR proceedings; dual submission allowed; accepted papers presented as posters
- Not listed in ICORE2026 or the CCF list
