notes:
- Co-located with NDSS Symposium in San Diego, held on the Friday after the main conference (Feb 27, 2026; Feb 28,
  2025)
- 'Topics: binary analysis building blocks (slicing, taint tracking, binary rewriting), reverse engineering, automated
  binary hardening, automated exploitation, embedded devices, bytecode analysis, AI and ML for binary analysis'
- Half paper sessions, half roundtable discussion among researchers, tool developers and practitioners
- Full papers up to 10 pages and short (work-in-progress) papers up to 6 pages, excluding references and appendices;
  double-blind, NDSS template
- Official proceedings with papers posted on the NDSS site; authors may opt out of the proceedings at submission
- Late deadline (mid January) for a February workshop; camera ready is due after the workshop
- NDSS 2027 moves to Seoul, Korea (March 22 to 26, 2027); a BAR 2027 edition there is not announced yet
