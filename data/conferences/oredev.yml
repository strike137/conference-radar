notes:
- Developer conference covering the whole software development process, from programming to project management
- Founded in 2005 by Jayway (today Devoteam Creative Tech)
- Held every early November in Malmö, Sweden; 2026 edition at MalmöMässan, Hyllie
- 1200+ visitors over 3 days, over 100 sessions on 8 stages, keynotes around a yearly theme
- Talks chosen from a call for papers on Sessionize, open in March
- No papers or proceedings; practitioner talks only
