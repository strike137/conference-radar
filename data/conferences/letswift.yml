notes:
- Korean community conference for Swift and Apple platform developers, held since 2016 (no 2021 edition)
- Held in Seoul; 2025 at Sejong University Convention Center, usually in November
- Evening meetup 10 Years of Let'Swift held at Apple Korea, Seoul on 2026-04-01
- 2026 edition was a small evening workshop ("Changes in the Development Environment") at the CodeSquad office in Gangnam
- Official iOS app and website are open source on GitHub (letswiftconf)
- Talks only; no papers or proceedings
