notes:
- Student-run cybersecurity games and conference hosted by NYU Tandon, founded in 2003; 2026 is the 23rd edition
- Finals run in parallel at five regional hubs (NYU Tandon for US-Canada, Grenoble INP-Esisar, IIT Kanpur, NYU Abu Dhabi, Universidad Iberoamericana)
- Competitions include Capture The Flag, Embedded Security Challenge, LLM CTF Attack, Cyber Policy and the Applied Research Competition
- Applied Research Competition is a best paper award for papers already published at venues such as IEEE S&P, USENIX Security, CCS and NDSS; a student author must present in person
- No proceedings; papers in the research competition are already published elsewhere
