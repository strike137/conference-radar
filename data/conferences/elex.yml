notes:
- Biennial conference on electronic and computational lexicography, dictionaries and language technology
- Two-stage submission, an abstract first and a full paper after abstract acceptance
- Proceedings published by Lexical Computing CZ in the series Electronic lexicography in the 21st century (ISSN 2533-5626), open access
- Held in Europe (Herstmonceux Castle 2015, Leiden 2017, Sintra 2019, online 2021, Brno 2023, Bled 2025, Bolzano 2027)
- Not ranked in ICORE2026 and not on the CCF list
