notes:
- Organized by Infosec In the City (formerly Infosec In the City Singapore, IICSG), tied to the Div0 community
- 2026 conference runs during Singapore International Cyber Week (SICW) at voco Orchard Singapore; the 2025 edition
  was in May at the same venue
- Three talk and workshop tracks (Deep-Tech, Insights, Fix-It) plus Kampungs (villages) and CTFs; 45 min talks or
  1 to 3 hour workshops, English only; specialised trainings around the conference
- Accepted speakers get free registration; speakers not residing in Singapore also get airfare to Singapore and
  3 nights of accommodation
