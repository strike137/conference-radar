notes:
- Technically sponsored by the Soft Computing Research Society (SCRS, New Delhi), which runs many hybrid conferences each year
- After-conference proceedings in Springer Lecture Notes in Networks and Systems (LNNS) since 2024 (five volumes for 2025); 2021 to 2023 appeared in Springer Algorithms for Intelligent Systems
- Hybrid (in-person and online); hosted by Rajasthan Institute of Engineering and Technology, Jaipur (2021 to 2024) and National Forensic Sciences University Goa Campus (2025 to 2027)
- 8th edition in 2026; submission via Microsoft CMT
- Different venue from ICICCT (Inventive Communication and Computational Technologies)
- Not listed in CORE ICORE2026 and not on the CCF list
