notes:
- Industry conference on languages, tools and methodologies for design and verification of electronic systems and ICs (SystemVerilog, UVM, PSS, SystemC, formal, emulation, AI for verification)
- Sponsored by Accellera Systems Initiative; the oldest DVCon (38th year in 2026), with sister events in Europe, India, Japan, China and Taiwan
- Two-stage review, double-blind extended abstract (600 to 1200 words) first, then a 6 to 8 page full paper after preliminary acceptance
- Papers, posters, slides and videos go to Accellera's open DVCon proceedings archive, not to IEEE Xplore or the ACM DL
- No deadline extensions; all speakers must present in person; Stuart Sutherland best paper and best poster awards voted by attendees
- Includes a large exhibition; first held at the Hyatt Regency Santa Clara in 2026 and returns there in 2027
- Not listed in the CORE portal (ICORE2026) or on the CCF list
