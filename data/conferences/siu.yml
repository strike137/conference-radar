id: siu
name: SIU
full_name: IEEE Signal Processing and Communications Applications Conference
name_local: Sinyal İşleme ve İletişim Uygulamaları Kurultayı
type: conference
tier: domestic
areas: [communications, networking, ai, vision, nlp]
region: middle-east
language: mixed
frequency: annual
organizer: Host Turkish university (rotates yearly), with IEEE as technical sponsor
organizer_country: [other]
proceedings: IEEE Xplore
archival: true
fee: 10,000 TRY full registration (2026, regular; 8,500 TRY early, 4,500 TRY student author early)
typical:
  deadline_months: [3]
  conference_months: [6, 7]
links:
  website: https://siu2026.pirireis.edu.tr/
notes:
- Turkey's main national conference on signal processing and communications, held every year since 1993; hosted by a
  different Turkish university each year
- Papers are written in Turkish (with Turkish and English title and abstract); English papers are accepted only when
  an author is not a native Turkish speaker or the first author is affiliated outside Turkey
- Anonymous review; papers up to 4 pages in IEEE A4 format; registered papers are published in IEEE Xplore
- Seven tracks covering communications and networks, image processing and computer vision, signal processing,
  machine learning and AI, biomedical signal processing, NLP and more; also undergraduate project and thesis
  competitions
- "Recent hosts: ITU Istanbul (2023), Tarsus University, Mersin (2024), Işık University, Şile (2025), Piri Reis
  University, Tuzla (2026)"
- Not listed in CORE ICORE2026
