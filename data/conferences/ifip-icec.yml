notes:
- Main conference of IFIP Technical Committee 14 (Entertainment Computing); 24th edition in 2025, 25th in 2026
- Proceedings in Springer LNCS, with a separate LNCS volume for the IFIP TC 14 workshops (2025)
- "Acceptance: 28 full and 17 short papers from 109 submissions (2025)"
- Topics are games, interactive art, XR entertainment, serious games, accessibility and AI for entertainment
- Double-blind review, full papers up to 12 pages in LNCS format (2025)
- ICEC 2025 in Tokyo was co-organized with IPSJ and ran a joint session with the domestic EC symposium; ICEC 2026 was announced for Paris, France
- CORE C in ICORE2026; not on the CCF 2026 list
