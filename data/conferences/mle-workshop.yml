notes:
- Meeting point for software language engineering researchers within the modeling community (DSML design, composition, semantics, model execution)
- Born in 2019 from the merger of the GEMOC (2013-2018) and EXE (2015-2018) workshops; held with MODELS every year 2019-2025
- 2025 edition was a fully online half-day joint workshop with SusMod (Sustainability and Modeling) at MODELS 2025
- Papers of 6 pages plus 2 pages of references, IEEE format; ramp-up papers are discussed but not published
- Accepted papers (except ramp-up papers) appear in the MODELS joint workshop proceedings (IEEE in 2025, MODELS companion proceedings in earlier years)
- Not listed in the CORE portal (ICORE2026)
