notes:
- Annual conference hosted by Universitas Komputer Indonesia (UNIKOM) since 2018, held on the UNIKOM campus in Bandung
- "Proceedings vary by year: IOP Conference Series MSE (2018 to 2020), IEEE Xplore (2023, 2024), Atlantis Press (2025)"
- Accepted, presented and selected 2026 papers are submitted to IEEE Xplore; no-show papers are not published
- Extended versions can go to partner Scopus-indexed journals and UNIKOM's own SINTA journals
- Very broad scope across informatics, EE, applied science and engineering management
- 'Fee about 350 USD for international authors (2026, non-IEEE student)'
- Deadlines are usually extended by a few weeks
- Not listed in the ICORE2026 portal or the CCF 2026 list
