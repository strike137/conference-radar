notes:
- Annual Japanese symposium on intelligent transport systems run by ITS Japan since 2002, spanning engineering
  (civil, mechanical, electrical, information) and social sciences
- Co-sponsored by IPSJ, IEICE, IEEJ, SICE, JSAI, JSAE, JSCE and others, including the IPSJ and IEICE ITS SIGs
- Two tracks; peer-reviewed full papers submitted to a journal (preprints shown at the symposium) and non-reviewed
  abstracts followed by full papers of up to 6 pages
- Papers are posted on a participants-only website; full texts later go to an ITS Japan members-only page
- Presentations are 30-second shotgun talks plus posters; Japanese or English
- "Fee: 8,000 JPY student presenter, 15,000 JPY general presenter (2026)"
- Not listed in ICORE2026 or the CCF 2026 list
