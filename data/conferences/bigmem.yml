notes:
- Workshop on big memory systems (CXL, persistent and disaggregated memory, memory-centric networking, OS support for heterogeneous memory)
- Co-located with ACM SOSP; registration handled by SOSP
- Two-page extended abstracts (references excluded), ACM template recommended, double-blind review via HotCRP
- Non-archival; the workshop states it does not produce formal proceedings
- Program includes keynotes and invited talks besides contributed talks
- Held with SOSP (Seoul 2025, Prague 2026)
- Not listed in CORE ICORE2026 or the CCF list
