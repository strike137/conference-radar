notes:
- Held as a workshop of ARES (International Conference on Availability, Reliability and Security) in Europe every summer;
  part of the ARES EU Projects Symposium, held at ARES 2023, 2024, 2025 and 2026
- ARES papers including workshop papers are published in Springer LNCS since 2025 (2025 workshops in LNCS 15994 to
  15999); ACM ICPS before that; submission guidelines are the same as for the ARES conference
- Cybersecurity curricula, professional training, cyber ranges, skills frameworks (EU Skills Framework), CTF and
  red/blue teaming, awareness campaigns
- 2026 chairs from Brno University of Technology and Masaryk University (Czech Republic), CNIT and IMT Lucca (Italy)
- 2025 edition was a half-day session on the EU Projects Symposium day (11 Aug 2025) with a keynote and 7 papers
- Not listed in CORE ICORE2026
