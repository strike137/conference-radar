notes:
- Founded in 1996 by SPIIRAS (St. Petersburg Institute for Informatics and Automation, Russian Academy of Sciences); 28th edition in 2026
- Proceedings in Springer LNAI (two volumes in 2023 to 2026)
- Full papers of 10 to 15 pages in LNCS style; single-blind review by at least three reviewers
- Held in a different country each year (online 2020 and 2021, India 2022 and 2023, Belgrade 2024, Szeged 2025, Ohrid 2026)
- Not listed in CORE ICORE2026
