notes:
- Joint AAAI and ACM conference on the ethical and societal impact of AI; interdisciplinary (CS, law, policy, social
  sciences, philosophy)
- Proceedings in the AAAI Digital Library since 2024; 2018 to 2023 proceedings are in the ACM Digital Library
- Authors may choose a non-archival option (one-page abstract plus link to the full paper) to allow later journal
  publication
- Up to 10 pages in AAAI two-column format, double-blind review via EasyChair; abstract registration one week
  before the paper deadline
- Separate student track with the same paper deadline
- Location rotates between North America and Europe (Oxford 2022, Montreal 2023, San Jose 2024, Madrid 2025, Malmo
  2026)
- ICORE2026 rank C and not in the CCF list, but well known as a main venue for AI ethics and responsible AI work
