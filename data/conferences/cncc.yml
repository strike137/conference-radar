id: cncc
name: CNCC
full_name: China National Computer Congress
name_local: 中国计算机大会
type: conference
tier: domestic
areas: [general, ai, systems, networking, security, data]
region: china
language: chinese
frequency: annual
organizer: CCF (China Computer Federation)
proceedings: None (no open paper track; forum summaries collected in a congress volume)
archival: false
rank:
  core: Unranked
fee: 1,980 CNY CCF member, 980 CNY student member (2026, early bird)
typical:
  deadline_months: [6, 7]
  conference_months: [10]
links:
  website: https://cncc.ccf.org.cn/
notes:
- Flagship annual congress of CCF (China Computer Federation), founded in 2003 and held in a different Chinese city
  each year
- 'No open call for papers: keynotes, plenary forums and 100+ themed forums and tutorials proposed by CCF members
  (167 forums including 24 tutorials in 2026)'
- Over 10,000 registered attendees; talks mostly in Chinese
- CCF funds about 300 teachers and students from under-resourced institutions to attend (applications close in September)
- Forum and tutorial proposals are collected in June and July; early-bird registration ends in late September
