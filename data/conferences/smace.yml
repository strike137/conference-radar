id: smace
name: SmaCE
full_name: IEEE International Workshop on Smart Circular Economy
type: workshop
tier: minor
areas: [networking, systems]
region: worldwide
language: english
frequency: annual
organizer: Bournemouth University led organising committee (general chair Marios Angelopoulos), at DCOSS-IoT
organizer_country: [europe]
proceedings: IEEE Xplore (DCOSS-IoT proceedings)
archival: true
indexing: [IEEE Xplore, DBLP, Scopus]
typical:
  deadline_months: [4, 5]
  conference_months: [6]
links:
  website: https://www.smace-workshop.org/
notes:
- Workshop co-located with IEEE DCOSS-IoT; the 2026 edition was the 8th
- Topics are ICT for the digital circular economy, IoT and crowdsensing, distributed ledgers, smart infrastructure and asset tracking
- Papers up to 8 pages IEEE two-column (plus 2 appendix pages), single-blind review via EasyChair
- Accepted and presented papers appear in IEEE Xplore; no-show papers are excluded and proxy presentations are not allowed
- Sponsored by the EU project 3D Circular in 2026
