frequency: annual
organizer: AI*IA working group on Knowledge Representation and Automated Reasoning (RCRA)
organizer_country: [europe]
proceedings: CEUR Workshop Proceedings (accepted original papers, upon author confirmation)
archival: true
typical:
  deadline_months: [5, 6]
