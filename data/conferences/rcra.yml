links:
  website: https://rcra2026.github.io
notes:
- Annual workshop of the Italian AI*IA RCRA group since 1994 (33rd edition in 2026)
- Experimental evaluation of AI algorithms for SAT, constraints, planning, scheduling, answer set programming, model checking and combinatorial optimization
- Co-located with a host event each year (AI*IA 2023 Rome, AI*IA 2024 Bolzano, ICLP 2025 Rende, FLoC 2026 Lisbon)
- Accepts original and non-original papers; only original papers go to CEUR-WS, sometimes with a journal special issue
- Full papers up to 15 pages, short papers up to 8 pages, CEUR single-column format
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
