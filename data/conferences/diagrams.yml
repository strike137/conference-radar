notes:
- Interdisciplinary series on the study of diagrams (reasoning with diagrams, notations, visualization, HCI,
  cognitive science, logic and philosophy); started in 2000
- Mostly biennial; held in 2020, 2021 and 2022 after COVID disruption, then 2024 and 2026
- Long papers (16 pages), short papers (8 pages) and posters (4 pages) appear in Springer LNAI; abstracts are
  non-archival and shown only on the conference website
- Three tracks (main, philosophy of diagrams, psychology and education) plus graduate symposium, workshops and tutorials
- Recent venues Edinburgh 2018, Tallinn 2020 (virtual), online 2021, Rome 2022, Munster 2024, Tallinn 2026
- 2024 accepted 17 long papers, 19 short papers, 11 posters and 6 abstracts
- ICORE2026 rank C; not on the CCF list
