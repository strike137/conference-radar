notes:
- Regional Security BSides conference in Honolulu, Hawaii, USA, part of the global Security BSides movement
- Presented by HI Tech Hui, a Honolulu managed IT and cybersecurity provider, with supporting organizations
- One-day event with talks for students, professionals and researchers; the 2025 edition had the theme Espionage
- Tickets sold on Luma with early bird, student and military discounts; students can attend by volunteering
- No public call for papers on the official site; speakers are curated by the organizers
- No proceedings
