notes:
- Volunteer-run, non-profit Security BSides conference in Nashville, Tennessee, USA
- One-day event; 2026 had two tracks (Red for offensive, Blue for defensive) at Marathon Music Works and The
  Foundry
- Call for papers on Sessionize with blind review; talks of up to 40 minutes, no vendor pitches, in person only
- Talks are not recorded and there are no proceedings; speakers pay their own travel
- Jeopardy-style CTF and villages; 25 free scholarship tickets for students and people with financial need
- Previous venues include Lipscomb University (2024) and The Factory in Franklin (2025)
