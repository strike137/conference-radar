notes:
- One-day workshop on benchmarking and characterizing ML workloads on emerging hardware, with invited talks, paper talks and a panel
- Held with MLSys 2020 to 2023 (Austin, virtual, Santa Clara, Miami), no 2024 edition, then with ASPLOS since 2025 (Rotterdam 2025, Pittsburgh 2026)
- Full papers (8-10 pages) and short or position papers (4-6 pages) in ACM format; double-blind since 2025; at least three reviews per paper
- Accepted papers and slides are posted on the workshop website only; no formal proceedings
- Not listed in CORE ICORE2026 or the CCF list
