notes:
- First edition held as a half-day workshop at ECML PKDD 2026 in Naples on 11 September 2026
- Topics are representation learning for biomedical data (EHR, imaging, omics, signals, clinical text), multimodal fusion and trustworthy clinical AI
- Long papers up to 12 pages and short papers up to 6 pages plus references, Springer LNCS format, submitted via the ECML PKDD workshop CMT
- Double-blind review with at least two reviews per paper
- Accepted papers can opt in to the joint ECML PKDD post-workshop proceedings in Springer CCIS; non-archival submissions are presentation only
- At least one author of each accepted paper must register and present
- Not listed in CORE ICORE2026
