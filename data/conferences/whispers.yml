notes:
- Standalone workshop on hyperspectral data processing (unmixing, classification, detection, sensors, deep learning) despite the name
- Three submission types; 4 to 5 page full papers (double column) are submitted to IEEE Xplore, one page abstracts and already accepted journal papers are presented but not published in Xplore
- Past proceedings volumes are linked from the official past editions page on IEEE Xplore
- Held in Europe (Athens 2023, Helsinki 2024, Bellaterra/Barcelona 2025, Glasgow 2026)
- 2026 is the 16th edition, onsite only with no hybrid or remote presentation
- Late submissions accepted until 2026-09-23 with notification on 2026-10-15
- Submission through EasyChair; one registration covers two papers per author
- Not listed in ICORE2026 or the CCF list
