id: icce-vn
name: IEEE ICCE (Vietnam)
full_name: IEEE International Conference on Communications and Electronics
type: conference
tier: minor
areas: [communications, networking, ai]
region: southeast-asia
language: english
frequency: biennial
organizer: Hanoi University of Science and Technology (HUST, host), with Danang University of Science and Technology
  and Ho Chi Minh City University of Technology; technically co-sponsored by IEEE, REV (Radio Electronics Association
  of Vietnam) and KICS
organizer_country: [vietnam]
proceedings: IEEE Xplore
indexing: [IEEE Xplore, Scopus, CPCI]
rank:
  core: Unranked
fee: 600 USD (2026, IEEE member, by Jun 12); 640 USD non-member, 460 USD student
typical:
  deadline_months: [2, 3]
  conference_months: [7, 8]
links:
  website: https://ieee-icce.org/
  wikicfp: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=190740&copyownerid=3400
notes:
- Biennial in even years since 2006 (2026 was the 20th anniversary, 11th edition), hosted by HUST
- Different conference from the IEEE Consumer Electronics ICCE
- Usually held in a Vietnamese coastal city in late July (2022 and 2026 Nha Trang, 2024 Da Nang)
- Up to 6 pages via EDAS; 2026 CFP says only accepted papers with oral presentation are sent to IEEE Xplore
- One registration covers up to 2 papers; research-aid fund for first authors from Vietnamese institutions
