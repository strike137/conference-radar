notes:
- Run by IADIS since 2004; blind peer review; CORE C (listed as IADIS AC)
- Proceedings book and digital copy with ISBN in the IADIS Digital Library, a DOI per paper
- Best papers invited to the IADIS Journal on Computer Science and Information Systems
- Several calls for papers per edition; the last call closes about seven weeks before the conference
- Co-located with IADIS WWW/Internet; held in Europe (Zagreb 2024, Porto 2025, Lisbon 2026)
