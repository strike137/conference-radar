notes:
- One-day workshop on AI safety, security and trustworthiness, bridging the dependability and AI communities
- First edition on 7 April 2026 at the University of Kent, Canterbury, UK, co-located with EDCC 2026
- Papers published in the EDCC 2026 Companion Proceedings (IEEE Conference Publishing Services); Crossref lists them with IEEE DOIs
- Technical sponsors include the CRANE AI-Cyber SIG; supported by several IEEE UK and Ireland chapters
- Program had a keynote, paper sessions, a panel and a best paper award
- Not on the EDCC 2027 workshop list, so a second edition at EDCC 2027 is unlikely
- Not listed in CORE ICORE2026 or on the CCF list
