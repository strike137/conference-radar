notes:
- Chinese-origin series, distinct from the Japanese CSS (IPSJ Computer Security Symposium)
- Started in 2008 (Sydney); gaps in 2010 to 2011 and 2023 to 2024, back to yearly since 2025
- Two submission rounds in 2026; papers must be presented in person
- 2026 edition co-located with FCS 2026 at the Galaxy International Convention Center, Macau
- Proceedings in Springer LNCS; best papers recommended to journal special issues (e.g., Information Sciences)
