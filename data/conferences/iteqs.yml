notes:
- Workshop on testing extra-functional properties such as performance, safety, security and robustness; papers on purely functional testing are not accepted
- Co-located with IEEE ICST; 10th edition in 2026 (Daejeon), earlier ones in Naples 2025, Toronto 2024, Dublin 2023, virtual 2021 and 2022, Porto 2020, Xi'an 2019, Vasteras 2018 and Tokyo 2017
- Full papers 6 to 10 pages and work-in-progress or position papers 4 pages, IEEE double-column format
- Accepted papers published in the IEEE digital library with the ICST workshop proceedings
- Organizers from RISE and TRATON (Sweden), LIST (Luxembourg) and Abo Akademi (Finland)
- Not among the ICST 2027 workshops yet (workshop proposals due 2026-11-04); not listed in ICORE2026 or the CCF 2026 list
