notes:
- One-day workshop on testing extra-functional (non-functional) properties such as performance, safety, security, robustness and energy efficiency; co-located with IEEE ICST
- Papers that focus purely on functional testing are not accepted
- Full papers 6 to 10 pages and work-in-progress or position papers 4 pages (IEEE double column); accepted papers published in the IEEE Digital Library
- Held with ICST since 2017 (Tokyo 2017, Vasteras 2018, Xi'an 2019, Porto 2020, virtual 2021 and 2022, Dublin 2023, Toronto 2024, Naples 2025, Daejeon 2026)
- Organizers based in Sweden, Luxembourg, Portugal and Finland (RISE, LIST, University of Lisbon, Abo Akademi)
- 11th edition in 2027 with ICST 2027 in San Sebastian, Spain
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
