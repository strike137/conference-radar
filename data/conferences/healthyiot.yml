notes:
- EAI conference on IoT and AIoT technologies for health care; the 2026 edition is branded HealthyAIoT (EAI
  International Conference on AIoT Healthcare Systems) with a design and engineering focus
- Proceedings in Springer LNICST
- Held in Europe until 2023 (Rome, Vasteras, Angers, Guimaraes, Braga, Bratislava), virtual in 2020 to 2022, then Asia
  (Danang, Vietnam announced for 2024; Guangzhou, China 2026)
- 2026 edition held fully online, hosted from Guangzhou, China
- Not listed in the CORE ICORE2026 portal
