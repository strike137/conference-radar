notes:
- Co-located workshop of SBRC, the Brazilian Symposium on Computer Networks and Distributed Systems run by the
  Brazilian Computer Society (SBC); 31st edition in 2026
- Covers network and service management and operation
- Papers in Portuguese or English (Portuguese papers need an English abstract), up to 14 pages including
  references in the SBC template; submission through JEMS3
- Each paper reviewed by at least three program committee members; best paper award and two honorable mentions
- Accepted papers published open access in SBC OpenLib (SOL), Anais do WGRS; at least one author must register for
  SBRC and present orally
- Held with SBRC in a different Brazilian city each year (Praia do Forte, Bahia in 2026)
- Not listed in CORE ICORE2026
