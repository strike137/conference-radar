notes:
- ACM SIGGRAPH sponsored conference on character animation, motion synthesis, physics-based animation, interaction
  and games; 19th edition in 2026
- Long papers up to 10 pages and short papers 4 to 6 pages (excluding references), ACM sigconf format, double-blind
  review with no rebuttal
- All accepted long and short papers appear in the conference proceedings in the ACM Digital Library; selected best
  papers are invited to a Computers & Graphics special issue
- Separate poster track with a later deadline (October); at least one author must present in person
- Rotates worldwide (virtual 2021, Guanajuato 2022, Rennes 2023, Arlington 2024, Zurich 2025, Charleston 2026)
- CORE C (ICORE2026); not on the CCF 2026 list
