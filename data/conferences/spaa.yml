notes:
- Sponsored by ACM SIGACT and ACM SIGARCH, in cooperation with EATCS; theory and practice of parallel algorithms and architectures
- Proceedings in the ACM Digital Library; ACM open access model with an APC for authors outside ACM Open (500 / 750 USD for 2027)
- Two submission cycles from 2027 (September and January); lightweight double-blind review with a rebuttal period
- Regular papers up to 10 pages in ACM sigconf format; brief announcements up to 3 pages
- Often co-located with PODC or with ACM FCRC (Orlando 2023, Atlanta 2027); held in the USA and Europe
- CORE B (ICORE2026), CCF B
