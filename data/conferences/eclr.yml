notes:
- Workshop on data-efficient, label-efficient and model-efficient visual computing (compression, few-shot learning, quantization, pruning, efficient architectures)
- 1st edition as EMCLR (Efficient Multimedia Computing under Limited Resources) at ACM MM 2024; 2nd edition as ECLR at ICCV 2025 in Honolulu
- Same Beihang organizing team as the GLOW workshop at IJCAI
- Long papers up to 7 pages and short papers up to 5 pages excluding references, ICCV format, double-blind review on OpenReview with at least two reviews
- 20 papers in the ICCV 2025 workshop proceedings on CVF Open Access
- Not listed in ICORE2026 or the CCF list
