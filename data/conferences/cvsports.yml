notes:
- Workshop on computer vision for sports analytics, tracking, broadcasting and training, started at CVPR 2013
- Held with CVPR every year since 2017 (ICCV in 2015); 2026 was the 12th edition
- Papers are submitted and reviewed on OpenReview and published in the CVPR Workshops proceedings
- 24 papers in the CVPR 2026 workshop proceedings on CVF Open Access
- No deadline extensions because of the CVPR proceedings timeline
- A non-archival Nectar track lets authors of sports papers accepted at the CVPR main conference present a poster
- Not listed in ICORE2026 or the CCF list
