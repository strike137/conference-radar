id: mar-workshop
name: MAR
full_name: Multimodal Algorithmic Reasoning Workshop
type: workshop
tier: minor
areas: [ai, vision]
region: north-america
language: english
frequency: multiple-per-year
organizer: MAR workshop organizers led by Mitsubishi Electric Research Laboratories (MERL) with MIT and Salesforce AI Research; co-located with CVPR or NeurIPS
organizer_country: [usa]
proceedings: CVF Open Access and IEEE Xplore (CVPR Workshops editions, 8-page papers); NeurIPS editions are non-archival
archival: true
typical:
  deadline_months: [3, 8]
  conference_months: [6, 12]
links:
  website: https://marworkshop.github.io/
notes:
- Workshop on multimodal algorithmic reasoning, vision-and-language problem solving and cognitive models of intelligence; runs the SMART-101 puzzle challenge
- Started as VLAR at ICCV 2023, then MAR at CVPR 2024, NeurIPS 2024, CVPR 2025, NeurIPS 2025 and CVPR 2026
- CVPR editions publish original 8-page papers in the CVPR workshop proceedings; 4-page and previously published papers appear only on the workshop website
- NeurIPS editions have no archival proceedings
- Double-blind review; at least one author must present in person
- Not listed in ICORE2026 and not on the CCF list
