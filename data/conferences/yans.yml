notes:
- Annual symposium run by ANLP as young-researcher support; poster-only (A0), demos allowed, no paper or proceedings
- Early-stage or unfinished research is explicitly welcome; priority to students and people within 8 years of their
  degree; one first-author poster per person
- 'Large and industry-heavy: 571 participants, 248 posters and 37 sponsors in 2026 (411 participants in 2024, 570
  in 2025)'
- Travel grants for some student presenters; hackathon on day 1; encouragement, demo and sponsor awards
- Presenters must register earlier than listeners and slots can close early
