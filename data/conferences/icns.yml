notes:
- Aviation communications, navigation and surveillance (CNS/ATM, NextGen, SESAR) conference with strong industry and
  government participation
- Hosted by NASA Glenn Research Center 2001 to 2006; sponsored by IEEE and AIAA since 2007; not-for-profit, surplus
  supports AIAA scholarships
- Selection is based on 250 to 750 word abstracts; full papers due about six weeks before the conference; proceedings
  in IEEE Xplore
- Usually held at the Westin Washington Dulles Airport in Herndon, Virginia, USA; 2025 edition at EUROCONTROL in
  Brussels
- Not listed in the CORE ICORE2026 portal
