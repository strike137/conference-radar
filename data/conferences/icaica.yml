notes:
- Small AI and computer applications conference held in China; the 7th edition was in Sanya in March 2026
- The site says papers of all six earlier editions were published in IEEE Xplore and indexed by EI Compendex
- For 2026 the site only says proceedings will be submitted to EI Compendex and Scopus
- Double-blind review by 2 to 3 committee members after a preliminary check; results within about 20 to 25 days
- At least one author must register and present; remote or pre-recorded presentation offered when necessary
- No organizing society or host institution named on the site
- Not listed in CORE ICORE2026 or the CCF list
