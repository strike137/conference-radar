notes:
- Workshop co-located with ACM/SPEC ICPE, technically sponsored by the SPEC Research Group and ACM and organized each year by the SPEC RG Cloud Group; held since 2018 (10th edition in 2027)
- Topics are cloud and computing-continuum performance (edge, IoT, serverless, microservices), benchmarking, modeling, simulation, resource management and energy efficiency
- Full papers 5 pages and short papers 3 pages (plus 1 page of references), single-anonymous review, ACM format via HotCRP; talk-only submissions are not in the proceedings
- Papers appear in the ICPE Companion proceedings in the ACM Digital Library, open access with no APC for papers within the page limits
- Follows ICPE around the world (Florence 2026, Gothenburg 2027); organizing chairs from VU Amsterdam, ETH Zurich and University of Klagenfurt
- Not listed in ICORE2026 or the CCF 2026 list
