notes:
- JPNIC's annual event for Internet infrastructure engineers and operators, held every November in Tokyo
- Tutorials, trend seminars, hands-on sessions and BoFs by invited speakers, mostly in Japanese; no paper submissions
- Split into an online week and an on-site conference week at KFC Hall and Rooms, Tokyo
- Free registration for students aged 30 or under (student ID required); slides and videos published online afterwards
- Co-located with the JPNIC Open Policy Meeting (JPOPM 49 in 2025, JPOPM 51 in 2026)
