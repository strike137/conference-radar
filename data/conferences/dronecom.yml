notes:
- Workshop on drone-based wireless communications and backhaul, alternating between IEEE INFOCOM and ACM MobiCom
  since 2020
- 2026 edition held with ACM MobiCom 2026 in Austin, USA; earlier editions with INFOCOM 2024 (Vancouver), MobiCom
  2022 (Sydney) and MobiCom 2021 (New Orleans)
- 2026 papers published Open Access by ACM using the ACM sigconf template; 2024 edition was an IEEE INFOCOM workshop
- Technical papers up to 6 pages including references, submitted via HotCRP (2026) or EDAS (2024)
- No edition in 2023 or 2025
- Edition numbering differs between pages (the INFOCOM 2024 page calls it the 7th, the 2026 site lists it as the 6th
  and calls 2026 the 7th)
- Not listed in ICORE2026 or the CCF 2026 list
