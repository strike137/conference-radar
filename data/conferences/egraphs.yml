notes:
- One-day workshop co-located with ACM PLDI; 2026 was the fifth edition
- Topics are e-graphs, equality saturation and their uses in compilers, synthesis, verification and other fields
- Talk-based program of invited speakers and work-in-progress talks; submissions are not anonymous
- Accepted submissions are not placed in the ACM DL, so in-progress or already published work is welcome
- Remote presentation possible
- Not listed in the CORE ICORE2026 portal or the CCF list
