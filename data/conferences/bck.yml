id: bck
name: BCK
full_name: Blockchain Kaigi (International Conference on Blockchain)
type: conference
tier: minor
areas: [security, crypto, systems]
region: worldwide
language: english
frequency: annual
organizer: Kyoto University Blockchain Research Center with an international steering committee; hosted by a different
  institution each year (2025 IIT Bombay, 2026 Chiba Institute of Technology)
organizer_country: [japan]
proceedings: JPS Conference Proceedings (BCK21 to BCK24; BCK25 extended papers invited); Springer planned for BCK26
archival: true
rank:
  core: Unranked
fee: 'INR 5,000 academic, INR 2,500 student participant, free for student authors (2025); BCK23 had no registration
  fee'
typical:
  deadline_months: [8, 9, 10]
  conference_months: [9, 10, 12]
links:
  website: https://www.blockchainkyoto.org/en/bck26
notes:
- Series started as the international workshop Blockchain in Kyoto 2021 (BCK21) at Kyoto University; Kaigi means
  meeting or conference in Japanese
- 'Hosts so far: Kyoto University 2021, Tohoku University 2022, RIKEN Kobe 2023, University of Zurich 2024, IIT Bombay
  2025, Chiba Institute of Technology (Tokyo Skytree Town campus) 2026'
- Submission is a short abstract with light review (2 pages in 2025, 4 pages in 2026); full papers are written after
  the conference as post-proceedings
- BCK21 to BCK24 post-proceedings appeared in JPS Conference Proceedings (BCK23 as Vol. 43, July 2024); BCK25 extended
  papers were invited to JPS Conference Proceedings and a Ledger journal special issue
- From BCK26 the full paper track goes to Springer proceedings (up to 15 pages, double-anonymous review, subject to
  publisher agreement); the extended abstract track is non-archival
- Interdisciplinary blockchain venue mixing CS, physics, economics, finance and policy; in-person (BCK26 allows remote talks
  only in exceptional cases)
- Not ranked in ICORE2026 (portal search returns no results)
