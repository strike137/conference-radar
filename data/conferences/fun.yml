notes:
- Algorithms conference for results that are fun (elegant, surprising, witty) but original and scientifically solid
- Held every two years (even years), traditionally on an Italian island (Elba, Lipari, La Maddalena, Favignana); FUN 2026 was on Porquerolles, France
- Proceedings in the open-access LIPIcs series (Schloss Dagstuhl); FUN 2026 is LIPIcs volume 366
- Paper registration with abstract six days before the paper deadline
- No length limit for submissions; final versions are limited to 20 pages in LIPIcs style
- Selected papers invited to a special issue of Theoretical Computer Science
- At least one author of each accepted paper must attend in person
- "Ranked National: Italy in ICORE2026"
- FUN 2028 announced for Elba, Italy (dates not yet published)
