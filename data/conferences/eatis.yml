notes:
- Run by EATIS.org, a not-for-profit network of about 80 researchers in 31 countries promoting Europe and Americas collaboration
- Biennial since 2010; alternates between Europe, the Americas and recently Africa (Brazil 2018, Portugal 2020 online and 2022 hybrid, Cabo Verde 2024, Marrakech 2026)
- Smart city focused information systems and ICT topics (big data, cloud, IoT, ITS, HCI, e-learning, web systems, digital finance)
- Proceedings in the ACM Digital Library (2022 and 2024 ACM proceedings); some earlier editions in IEEE Xplore
- Short papers up to 4 pages (poster/panel) and full papers up to 8 pages (oral); papers may be in English, Spanish or Portuguese but are presented in English
- Remote presentation is allowed
- "Registration 2026: 220 EUR author, 150 EUR remote author (before Jun 5)"
- CORE C (ICORE2026); Qualis B3 per the CFP; not on the CCF list
