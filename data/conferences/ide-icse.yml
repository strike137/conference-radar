notes:
- One-day ICSE workshop on IDEs and developer productivity that brings together researchers and IDE builders from industry
- Held with ICSE since 2024; Lisbon 2024, Ottawa 2025, Rio de Janeiro 2026 (3rd edition), Dublin 2027 (4th edition)
- Short papers up to 6 pages and extended abstracts up to 4 pages, both including references; single-blind review
- "2026: 11 submissions, 11 accepted after one major revision (8 short papers, 3 extended abstracts)"
- 2026 proceedings in the ACM Digital Library as "Proceedings of the 3rd ACM/IEEE International Workshop on Integrated Development Environments"
- 2027 submissions use the IEEE template
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
