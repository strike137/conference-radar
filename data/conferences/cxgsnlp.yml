notes:
- Workshop connecting Construction Grammar (CxG) research with NLP and language models
- First edition 2023 at GURT/SyntaxFest (Georgetown University, Washington DC); second edition 2025 with IWCS 2025 in Düsseldorf
- Proceedings in the ACL Anthology (SIGSEM); 35 submissions in 2025
- 2025 edition had invited talks plus a second community-building day on September 25
- Not listed in ICORE2026 and not on the CCF list
