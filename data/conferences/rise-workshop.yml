notes:
- Workshop on robotic systems that use edge and cloud computing (data processing, distributed robotics, low-latency networking, digital twins, security)
- 2026 was the 2nd edition, a Euro-Par 2026 workshop in Pisa; the 1st edition (2025) was a workshop of IEEE CCGrid 2025
- 2026 papers 10 to 12 pages in LNCS format, published in the separate Euro-Par workshop LNCS volume after the conference
- 2025 papers up to 10 pages, IEEE format, double-blind, published through IEEE
- Co-organized by the EU Horizon project EMPYREAN (2025); organizers from Greece, Sweden and Cyprus
- Host conference changes between editions; small workshop (four papers presented in 2026)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
