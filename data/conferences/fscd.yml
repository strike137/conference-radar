notes:
- Started in 2016 as the merger of RTA (Rewriting Techniques and Applications) and TLCA (Typed Lambda Calculi and Applications)
- Covers rewriting, lambda calculus, type theory, proof theory, semantics and related formal systems
- Proceedings in the open-access LIPIcs series (Schloss Dagstuhl); 2026 was LIPIcs volume 378
- Selected papers invited to a special issue of Logical Methods in Computer Science
- Regular papers and system descriptions, up to 15 pages in LIPIcs style excluding references; author response period
- Mostly held in Europe (Rome 2023, Tallinn 2024, Birmingham 2025, Lisbon 2026 as part of FLoC, Nijmegen 2027); Haifa 2022 as part of FLoC
- 2027 edition co-located with CADE in Nijmegen
- Ranked B in ICORE2026 and C in the CCF list
