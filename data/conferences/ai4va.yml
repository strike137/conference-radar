notes:
- Workshop on computer vision for paintings, comics, sculpture and other stylized imagery (segmentation, depth, saliency,
  provenance, generative models)
- 2nd edition at ICCV 2025, 3rd edition at CVPR 2026 (Denver, half day)
- Two tracks in 2026, archival full papers of 5 to 8 pages in CVPR format (double-blind) and 2-page non-archival extended
  abstracts
- 4 full papers and 6 extended abstracts accepted in 2026
- Runs challenges (PortraitCraft image composition challenge in 2026) with cash prizes
- Not listed in ICORE2026 or the CCF list
