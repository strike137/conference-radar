notes:
- Long-running Chinese practitioner security conference started in 2002 by the XFocus team
- One-day event in Beijing (Civil Aviation International Conference Center in 2025 and 2026) in late August, with a
  main venue and a sub venue
- Call for talks asks for original, unpublished technical research; proposals are sent as a Word or PPT description
  plus speaker bio, no paper
- Talks are 50 minutes in the main venue and 40 minutes in the sub venue; live exploit or tool demos encouraged
- Talks only, no proceedings; mostly Chinese-language talks from industry security labs, CTF teams and researchers
- Paid XTraining courses are held around the conference (September 8 to 9 in 2025, Beijing)
