notes:
- Organized and sponsored by KSI Research Inc. (Pittsburgh, USA); small and student-friendly
- Hybrid format with a short in-person part followed by about a week of virtual sessions at the KSIR Virtual Conference Center
- Proceedings published by KSI Research (ISSN 2325-9000 print, 2325-9086 online), PDFs in the SEKE proceedings archive; indexed by DBLP, Scopus, Inspec and Compendex
- Full papers up to 6 pages double-column; extra pages cost 100 USD (one) or 250 USD (two)
- Acceptance rate around 35 to 40% in recent years (36% in 2025, 40% in 2026)
- 'Recent in-person hosts: South San Francisco (2023, 2024), Pompeii, Italy (2025), Toronto (2026); fully virtual 2020 to 2022'
- CORE C (ICORE2026), CCF C
