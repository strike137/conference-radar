notes:
- Annual spring joint conference led by KICS with four other Korean ICT societies (IEIE, KIISE, KIISC, KIPS); 36th
  edition in 2026
- Short papers of 1 to 2 pages; oral or poster presentation after review; mostly Korean with some English papers
- Held at hotels and resorts in regional cities (Yeosu 2026, Sokcho 2025, Busan 2024), Wednesday to Friday in mid
  or late April
- Best papers are recommended to a JCCI special issue of the Journal of KICS
- Many special sessions from ITRC and BK21 research centers and industry forums, plus keynotes and tutorials
