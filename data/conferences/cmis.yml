notes:
- Ukrainian workshop run by the Department of Software Tools of National University "Zaporizhzhia Polytechnic" in Zaporizhzhia; ninth edition in 2026
- Topics are AI (pattern recognition, machine learning, computational intelligence), data-driven modeling and ICT for data analysis
- Proceedings in CEUR Workshop Proceedings, indexed by Scopus and DBLP per the site; some papers may instead be recommended to the journal Radio Electronics, Computer Science, Control
- Participation and publication are free of charge
- Regular papers only, 10 to 15 pages in English in the one-column CEUR template; at most 4 authors and one paper per person
- At least one author must hold a PhD or Dr. Sc. in Computer Science and have more than 4 papers in DBLP
- Each paper is reviewed by at least two reviewers plus one PC member; final decision by the PC chair
- "CMIS 2026: 24 of 79 submitted papers accepted (CEUR-WS Vol-4220)"
- "CMIS 2025: 28 of 96 submitted papers accepted (CEUR-WS Vol-3988)"
- Not listed in CORE ICORE2026 and not on the CCF list
