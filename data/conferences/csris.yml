notes:
- First edition in 2026, held on the SAFECOMP workshop day in Valencia
- Cybersecurity of multi-tier industrial supply chains and its effect on safety and resilience
- Papers of 6 to 12 pages in Springer LNCS format, reviewed by at least three reviewers, submitted via EasyChair
- Papers published in the SAFECOMP workshops proceedings in Springer LNCS
- Selected papers invited to submit extended versions to IEEE Transactions on Consumer Electronics
- Funded by the Welsh Government through a Knowledge Transfer Partnership between Edinburgh Napier University and Airbus
- Registration support for the three best workshop papers in 2026
- Not listed in CORE ICORE2026 or on the CCF list
