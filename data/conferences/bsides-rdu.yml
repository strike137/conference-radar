notes:
- Grassroots Security BSides conference for the Raleigh, Durham and Chapel Hill area of North Carolina, USA; 2026 is the 13th edition
- One day on a Friday at the McKimmon Conference and Training Center, NC State University, Raleigh
- Held in September in 2024 and 2025; the 2026 edition moved to December
- Call for presentations on Sessionize, open to first-time speakers; CTF, wireless challenge and lockpick village
- Past keynotes include Dan Kaminsky, Dave Kennedy, Paul Vixie and Cliff Stoll
- Talks are live streamed; no proceedings
