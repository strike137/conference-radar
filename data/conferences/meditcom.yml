links:
  website: https://meditcom2027.ieee-meditcom.org/
notes:
- IEEE ComSoc conference serving the Mediterranean area; first held in 2021
- Held around the Mediterranean (Athens 2021 and 2022, Dubrovnik 2023, Madrid 2024, Nice 2025, Cagliari 2026); 2027 moves to Tunis, Tunisia
- Papers in IEEE Xplore; 6 page limit for review, one extra page allowed for 100 EUR; submission via EDAS
- Blind peer review by at least three reviewers (2026 CFP); one full author registration covers up to 3 papers
- Not listed in ICORE2026 (no results on the CORE portal) or the CCF 2026 list (checked via the ccfddl mirror)
