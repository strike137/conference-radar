notes:
- Organized by Galgotias University, Greater Noida (NCR New Delhi), India; financially and technically sponsored by the IEEE Uttar Pradesh Section and IEEE IAS
- Held at Greater Noida or Noida in every edition except 2021, which IEEE Xplore lists as Arad, Romania
- Editions in 2015, 2016, 2017, 2018, 2020, 2021 and 2025; the 8th edition is in April 2027 (IEEE conference ID 72457)
- Presented papers of all past editions are in IEEE Xplore; 2027 papers meeting IEEE scope and quality go to IEEE Xplore
- Papers up to 6 pages in IEEE two-column format (2 extra pages with a fee), submitted through Microsoft CMT
- Hybrid mode, about 20% online (2027)
- Not listed in ICORE2026 or the CCF 2026 list
