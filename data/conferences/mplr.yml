notes:
- Forum on managed languages and runtime systems (VMs, JIT compilers, garbage collection, WebAssembly); formerly
  ManLang, originally PPPJ (24th edition in 2027)
- Proceedings in the ACM Digital Library; ACM open access model may incur an article processing charge
- Double-blind review, at least three reviews per paper; research papers up to 12 pages, work-in-progress and
  industry or tool papers up to 6 pages (ACM SIGPLAN format)
- Co-located with a larger PL conference (SPLASH 2023 Cascais, ISSTA/ECOOP 2024 Vienna, ICFP/SPLASH 2025 Singapore,
  ECOOP 2026 Brussels, SPLASH 2027 Prague)
- One-day program in 2026
- CORE C (ICORE2026); not on the CCF list
