notes:
- Workshop held with ICCCN (International Conference on Computer Communications and Networks); 3rd edition in 2026
- Called Workshop on the Orchestration of the Serverless Edge-Cloud Continuum until 2025; scope broadened to microservices in 2026
- Earlier editions in Kona (2024) and Tokyo (2025); location follows ICCCN (Rome announced for 2027)
- Workshop papers are limited to 6 pages and go into the ICCCN proceedings and IEEE Xplore; papers not presented onsite are left out of IEEE Xplore
- 2025 selected papers were invited to a special issue of the Journal of Grid Computing
