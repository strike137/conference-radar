links:
  website: https://www.osfc.io/
notes:
- Practitioner conference on open-source firmware, boot and platform security (coreboot, LinuxBoot, u-root, OpenBMC, TianoCore, Trusted Firmware and others)
- Organized by 9elements, a firmware and security company in Bochum, Germany, with Google listed as co-organizer
- Held every year since 2018; 2021 ran on 30 November and 1 December
- Three days of talks and hands-on workshops; 2026 edition at Pakhuis de Zwijger, Amsterdam
- Talks recorded and published in the archive on osfc.io; no proceedings
- Not listed in CORE ICORE2026 and not on the CCF list
