notes:
- Practitioner conference on open-source firmware, low-level engineering and platform security (coreboot, LinuxBoot, OpenBMC, UEFI/EDK II, U-Boot, Trusted Firmware, open hardware)
- Run since 2018 by 9elements (Bochum, Germany), with support from the Open-Source Firmware Foundation and industry sponsors
- Talk proposals are submitted through a pretalx CFP (abstract and description of at least 150 words); talks of 30 minutes plus Q&A, workshops and open mic sessions
- No papers or proceedings; talk recordings and slides are posted in the OSFC archive
- Venue moves between Europe and the US (Sunnyvale at Google in 2023, Amsterdam in 2026)
- Not listed in the CORE portal (ICORE2026) or on the CCF list
