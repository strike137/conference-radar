notes:
- Russian cryptography symposium (Sovremennye tendentsii v kriptografii); 16th edition in 2027
- Run by the Academy of Cryptography of the Russian Federation, the standardization committee TC 26, NTC DC and the Steklov Mathematical Institute
- Topics include symmetric and asymmetric cryptography, cryptanalysis, Russian GOST algorithms and protocols, post-quantum and quantum cryptography
- Official languages Russian and English; papers up to 15 pages in LaTeX, anonymous submission
- Accepted papers go into electronic proceedings only; selected papers are recommended to the journal Mathematical Aspects of Cryptography, which publishes Russian authors mostly in Russian
- Held in a different Russian city each year (Moscow region 2021, Novosibirsk 2022, Volgograd 2023, Petrozavodsk 2024, Veliky Novgorod 2025); Minsk, Belarus in 2026
- Not listed in the CORE ICORE2026 portal
