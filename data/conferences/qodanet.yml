id: qodanet
name: QoDaNeT
full_name: Workshop on Quality of Datasets in Network Telemetry
type: workshop
tier: minor
areas: [networking, ai, data]
region: worldwide
language: english
organizer: Dominik Soukup (FIT CTU Prague) and Karel Hynek (CESNET) in 2025; the 2024 edition was run from the University of Granada
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [8]
  conference_months: [10]
links:
  website: https://www.qodanet-2025.hynek.org/
notes:
- Co-located with the IEEE/IFIP network management conferences (NOMS 2024 Seoul, CNSM 2025 Bologna)
- Data papers on network telemetry datasets; the data must be made public, anonymized, and the paper must assess data quality
- "Replication papers on existing public datasets are also accepted (title prefix 'Replication:')"
- Up to 6 pages in IEEE two-column format including references (2025), single-blind review via EDAS
- Accepted 2025 papers go into the CNSM proceedings and IEEE Xplore once presented
- 2024 edition ran the IEEE NOMS Data Award and invited selected papers to a Data in Brief special issue
- Not among the CNSM 2026 workshops
