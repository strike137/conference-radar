notes:
- Spanish national conference on cryptology and information security, first held in 1991 and biennial since 1992
- Host university changes each edition (Santander 2022, León 2024, La Laguna, Tenerife 2026)
- Organized by a university cybersecurity chair (Cátedra de Ciberseguridad) in collaboration with INCIBE
- Papers in Spanish or English; original papers up to 6 pages or extended abstracts of results published in the previous two years up to 4 pages
- Peer-reviewed; accepted papers appear in the actas published by the host university, not in a formal publisher series
- 2026 edition was moved earlier to March and added a rump session and research prizes for student theses
- Not listed in CORE ICORE2026
