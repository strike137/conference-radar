id: see-ait
name: SEE-AIT
full_name: International Workshop on Software Engineering for the GenAI Transformation
type: workshop
tier: minor
areas: [software, ai]
region: north-america
language: english
organizer: SEE-AIT workshop organizers (Mid Sweden University, Chalmers, Blekinge Institute of Technology, Volvo Group, Ericsson, Getinge); co-located with ACM FSE
organizer_country: [europe]
proceedings: ACM DL (FSE Companion Proceedings)
archival: true
typical:
  deadline_months: [2]
  conference_months: [7]
links:
  website: https://seeait.github.io/
notes:
  - Half-day workshop on organizational GenAI adoption in software engineering (LLM workflows, agents, change management, human-AI collaboration)
  - First edition co-located with ACM FSE 2026 in Montreal on 5 July 2026
  - Extended abstracts (up to 5 pages, APC free) and full papers (5 to 8 pages); double-blind review via HotCRP
  - Accepted papers appear in the FSE 2026 companion proceedings in the ACM DL
  - Selected papers invited to a post-workshop collaboration with the Empirical Software Engineering (EMSE) journal
  - Not listed in CORE ICORE2026 or the CCF 2026 list
