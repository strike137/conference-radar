notes:
- Annual conference of the Beijing Society of Image and Graphics (BSIG), hosted by a different Beijing university each year; not the CSIG conferences ICIG or CCIG
- Accepts English papers (up to 15 pages) and Chinese papers (up to 8 pages)
- Accepted and registered English papers appear in Springer CCIS (IGTA 2025 volume online), EI indexed; Chinese papers go to an outstanding paper program with journal editors instead
- First come, first reviewed; two submission rounds in 2026
- Held in Beijing every year (online in 2020 and 2022)
- Each accepted paper needs its own full registration and page fee
- Not listed in ICORE2026; not on the CCF 2026 list
