notes:
- National computing conference of Colombia, run by the Sociedad Colombiana de Computacion (SCo2)
- "Proceedings: Springer CCIS for long papers; NALEF lab papers go to CEUR Workshop Proceedings"
- Long papers must be in English (10 to 16 pages, Springer format), double-blind review by three PC members
- Demos, the Women in Computing workshop (II MCC) and the NALEF workshop accept English, Spanish or Portuguese (6 to 10 pages)
- 2026 long-paper deadline was extended from 2026-04-20 (CFP PDF) to 2026-05-18 (website)
- Held in a different Colombian city each year (Manizales 2024, Cajica 2025, Cartagena 2026)
- Submission via Microsoft CMT
- Not listed in CORE ICORE2026 or the CCF list
