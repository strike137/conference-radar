- 'Not to be confused with CISIS (Computational Intelligence in Security for Information Systems), a Spanish security
  conference ranked National: Spain by CORE'
- Taichung 2024, Fukuoka 2025, Luxembourg 2026, Kitakyushu 2027; proceedings in 2 Springer volumes in 2025
