notes:
- Workshop on Constraint Grammar (CG) and finite state transducer (FST) methods, rule-based and hybrid NLP tools for user communities
- Focus on under-resourced and minority languages (spelling and grammar checking, CALL, machine translation, lexicography)
- Held with NoDaLiDa (Vilnius 2015, Gothenburg 2017, Turku 2019, Torshavn 2023, Tallinn 2025), so it follows the NoDaLiDa schedule
- 2025 was the 9th workshop; proceedings in the ACL Anthology under the venue CGMTA (9 papers in 2025)
- Regular (8 pages), short and demo papers (4 pages), anonymous review on OpenReview in 2025; demo papers are not published
- Full-day, on-site only event in 2025
- Not listed in ICORE2026 and not on the CCF list
