notes:
- Long-running interdisciplinary conference (34th edition in 2026) on information management, business informatics, ICT security, AI and digital transformation
- Run by universities in Slovakia, Austria and the Czech Republic; held in Hradec Kralove, Czech Republic in 2023 to 2026
- 6 to 8 page papers via EasyChair, blind review by at least two independent reviewers; single stream of keynote-led sessions with plenary discussion
- Proceedings printed as a volume of the Schriftenreihe Informatik (Trauner Verlag, Linz) with DOIs; the site states indexing in Web of Science and Scopus
- 43 papers selected in 2025
- "Fee: 440 EUR regular, 410 EUR doctoral (2026, early)"
- Not listed in CORE ICORE2026 and not on the CCF list
