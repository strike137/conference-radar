notes:
- One-day workshop co-located with IEEE INFOCOM; 4th edition held with INFOCOM 2025 in London
- Accepted and presented papers appear in the IEEE INFOCOM workshop proceedings and IEEE Xplore
- Papers up to 6 pages in IEEE two-column format including references, submitted via EDAS
- Topics are AI across end, edge and cloud in 6G, network slicing, distributed and federated learning, digital twins and space-air-ground networks
- Steering committee Nirwan Ansari (NJIT) and Yang Xiao (University of Alabama)
- Not on the IEEE INFOCOM 2026 workshop list
- Not listed in ICORE2026
