notes:
- Volunteer-run, vendor-neutral computer security conference in Bergamo, Italy, organized by the non-profit association Berghem-in-the-Middle (BITM); held since 2019
- One-day event conducted entirely in English with talks, workshops and research and technical tracks; sponsors cannot buy talk slots
- No proceedings; recordings and slides published after the event
- More than 900 registered attendees in 2024
- Not listed in CORE ICORE2026
