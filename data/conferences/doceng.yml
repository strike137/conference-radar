notes:
- ACM symposium sponsored by ACM SIGWEB; covers document engineering (document models, processing, analysis, layout, retrieval)
- Proceedings in the ACM Digital Library
- CORE B (ICORE2026)
- Separate deadlines for full papers (up to 10 pages) and for short papers (up to 4 pages) and demonstrations (2 page abstract)
- Abstract registration is due two weeks before the full paper manuscript
- Mostly held in Europe and the USA (Fribourg 2026, Nottingham 2025, San Jose 2024, Limerick 2023); Calgary, Canada in 2027
