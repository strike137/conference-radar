notes:
- Small annual forum on knowledge management, knowledge engineering, decision support and creativity support systems,
  now with LLM, generative AI and human-AI co-creation topics; 21st edition in 2026
- Held in Asia (2016 Yogyakarta, 2018 Pattaya, 2025 Nagaoka, 2026 Bangkok); honorary chairs from JAIST and SIIT
- 2025 proceedings published in cooperation with the IEICE Proceedings Series and posted as one arXiv volume
  (arXiv 2512.20628); some older editions (2016 Yogyakarta, 2018 Pattaya) are in IEEE Xplore
- 2025 used double-blind review, with an optional concurrent submission to IEICE Transactions on Information and
  Systems (papers accepted there are left out of the proceedings)
- Deadlines are often extended (2025 moved from August 1 to August 31 and then into November)
- Not ranked by CORE or CCF
