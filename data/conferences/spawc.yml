notes:
- Flagship workshop of the IEEE SPS SPCOM Technical Committee; not listed in ICORE2026 or the CCF list but well regarded
  in signal processing for wireless communications
- Renamed from Signal Processing Advances in Wireless Communications to Signal Processing and Artificial Intelligence
  for Wireless Communications from the 2025 edition
- Proceedings in IEEE Xplore (EI indexed); 5-page papers including references, submitted via Microsoft CMT
- Mostly held in Europe (Lucca 2021 and 2024, Oulu 2022, Surrey 2025, Athens 2026); Shanghai hosted 2023 and Sapporo
  2017
- Paper deadline usually extended by about two weeks; in-person presentation required; one author registration covers
  up to four papers
