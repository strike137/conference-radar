notes:
- Workshop co-located with IEEE NetSoft (Paris 2019, Ghent 2020, Tokyo 2021, Milan 2022, Madrid 2023, St. Louis 2024, Budapest 2025, Berlin 2026)
- Started in 2019; 8th edition in 2026
- Run as a joint initiative of EU cybersecurity projects (MIRANDA, CASTOR, INTACT, CyberNEMO, ResilMesh, EMPYREAN, 6G-CLOUD, CRI 4.0, EDIT4MCC in 2026)
- Topics are security of SDN/NFV, cloud and IoT infrastructures, attack detection, security orchestration, threat intelligence and programmable data plane security
- Papers up to 7 pages in IEEE two-column format including references; submission via EDAS
- Accepted and presented papers go into the NetSoft proceedings and are submitted to IEEE Xplore
- One day workshop with a keynote, technical sessions and a project poster session in 2026
- Not listed in CORE ICORE2026 or the CCF list
