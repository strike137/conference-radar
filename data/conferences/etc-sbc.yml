notes:
- Satellite event of CSBC, the annual congress of the Brazilian Computer Society (SBC); 11th edition in 2026,
  held since 2016
- Topics include algorithms, complexity, computability, combinatorial optimization, graph theory, information
  theory, number theory and cryptography, game theory and computational geometry
- Extended abstracts only, up to 4 pages plus references, SBC template (LaTeX preferred), submitted via JEMS
- Papers in Portuguese or English; single-blind review by at least two reviewers
- Accepted papers presented orally or as posters; proceedings (Anais do ETC) in SBC OpenLib (SOL) with DOIs
- Held with CSBC in a different Brazilian city each year (Gramado 2026)
- Not listed in CORE ICORE2026
