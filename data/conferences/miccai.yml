notes:
- Annual flagship conference of the MICCAI Society on medical image computing, medical imaging AI and computer
  assisted intervention
- Main conference proceedings in Springer LNCS (19 volumes in 2026); satellite workshop papers also published with
  Springer
- 'Held worldwide: Singapore 2022, Vancouver 2023, Marrakesh 2024, Daejeon 2025, Strasbourg 2026, Auckland 2027'
- Abstract registration and submission in February (23:59 Pacific Time); early accept round, rebuttal in May,
  final decisions in June
- Acceptance about 27% (2026, 1167 of 4402 reviewed submissions)
- Workshops, tutorials and challenges run as satellite events in the conference week, with separate fees
