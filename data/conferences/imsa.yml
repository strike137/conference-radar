links:
  website: https://imsa.msa.edu.eg/
notes:
- Annual AI and general computer science conference run by the Faculty of Computer Science at MSA University,
  6th of October City (Giza, Greater Cairo), Egypt; first edition in 2023, 5th edition in 2027
- Held on the MSA University campus (2025 and 2026 confirmed); 2026 also had online Zoom sessions
- Accepted papers of full registered authors go to the conference proceedings and are submitted for inclusion in
  IEEE Xplore; the site lists the 2025 and 2026 proceedings as IEEE Xplore
- Twelve tracks (AI, ML, vision, NLP, data science, cybersecurity, robotics, cloud, HCI, HPC, bioinformatics,
  networks and IoT)
- IEEE double column format, up to 6 pages (max 8 with extra page fee), double-blind review via Microsoft CMT
- 119 papers in 20 parallel sessions in 2026
- Not the same as MIUCC (Misr International University) or AIMSA (Bulgaria)
- Not listed in CORE ICORE2026
