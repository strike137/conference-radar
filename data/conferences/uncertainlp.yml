id: uncertainlp
name: UncertaiNLP
full_name: Workshop on Uncertainty-Aware NLP
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizing committee (2026 organizers from University of Amsterdam, Tel Aviv University, UCLouvain, LMU Munich, MBZUAI, USC, University of Helsinki and Instituto de Telecomunicacoes); co-located with EACL or EMNLP
organizer_country: [europe, usa, other]
proceedings: ACL Anthology
archival: true
indexing: [ACL Anthology]
typical:
  deadline_months: [8]
  conference_months: [10, 11]
links:
  website: https://uncertainlp.github.io/
notes:
- Workshop on uncertainty in human language and NLP models (uncertainty representation, calibration, probabilistic inference, selective prediction, hallucination detection)
- First edition at EACL 2024 (Malta), then EMNLP 2025 (Suzhou) and EMNLP 2026 (Budapest)
- Archival papers appear in the ACL Anthology (14 papers in 2024, 28 in 2025); non-archival submissions also accepted
- Full papers up to 8 pages and short papers up to 4 pages; direct submissions and ARR commitments via OpenReview
- Not ranked in ICORE2026 and not on the CCF list
