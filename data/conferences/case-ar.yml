notes:
- Scientific congress of SASE, the Argentine embedded systems symposium; held every year since 2011
- Papers in Spanish or English, up to 4 pages, double-blind review with rebuttal
- Three categories (Artículo, Foro Tecnológico, Reporte); all appear in the ISBN proceedings book on the website
- Best Artículo papers invited to a special issue of IEEE Embedded Systems Letters; others to the journal Elektron
- Free submission and free attendance
- Held at a different Argentine university each year (Tucumán 2024, San Martín 2025, San Rafael 2026)
- "Acceptance: 39 papers in 2026 (15 Artículo, 20 Foro, 4 Reporte)"
