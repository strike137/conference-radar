notes:
- Pan-African conference on AI, embedded AI, smart IoT and edge computing, and AI social science, run by a volunteer
  committee of African and diaspora researchers (Canada, USA, South Africa)
- Peer-reviewed papers published in Springer LNICST
- Earlier editions in Windhoek, Namibia (2021), Dakar, Senegal (2022), Durban, South Africa (2024) and Kumasi, Ghana
  (2025, hosted by KNUST)
- 2026 edition renamed Pan-African/Caribbean AI and Smart Systems Conference and held at the University of
  Technology, Kingston, Jamaica
- Hybrid events; authors may present in person or virtually
- Not listed in the CORE ICORE2026 portal
