notes:
- Flagship IEEE conference in Africa, first held in 1983 and biennial since 2007, co-sponsored by IEEE Region 8 and the IEEE Africa
  Council
- Proceedings in IEEE Xplore (2025 volume DOI 10.1109/AFRICON66545.2025)
- Broad EECS scope; tracks on AI, communications and networking, IoT, cybersecurity, power and energy
- Rotates around Africa (Addis Ababa 2015, Cape Town 2017, Accra 2019, Arusha 2021, Nairobi 2023, Polokwane 2025,
  Accra 2027)
- 2025 used double-blind review, 6 to 8 page papers; 2027 allows 8 pages plus up to 2 paid extra pages
- Not listed in CORE ICORE2026
