notes:
- Annual conference on the theory, implementation and application of automata and related structures
- Proceedings in Springer LNCS; extended versions of selected papers invited to a journal special issue (TCS for 2026, IJFCS for 2025)
- Submissions up to 12 pages in LNCS style excluding title page and references (CIAA 2025 call)
- Sheng Yu Award for the best paper
- Mostly held in Europe with occasional editions in Asia and North America (Akita 2024, Kingston 2026)
- CIAA 2026 was the 30th edition, co-located with DCFS 2026 and with a tool track
- Ranked C in ICORE2026; not on the CCF 2026 list
