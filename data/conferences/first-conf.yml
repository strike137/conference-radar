notes:
- Annual conference of FIRST, the global association of CSIRTs and PSIRTs (800+ member teams in 100+ countries);
  the main meeting of the incident response community
- Held every June and rotates worldwide (2022 Dublin, 2023 Montreal, 2024 Fukuoka, 2025 Copenhagen, 2026 Denver,
  2027 Bangkok); 2021 was virtual; 2022 ran June 26 to July 1
- 'Six days: Sunday trainings, then a five-day main program in three parallel tracks (technical, management,
  academic), plus BoFs, a CTF and closed member meetings'
- Call for speakers opens around October 31 and closes in early to mid December via EasyChair (2025-12-03 for 2026,
  2024-12-13 for 2025); abstract and outline only, no formal paper; reviewed by an international program committee;
  notifications from mid February to early March
- Separate call for Sunday trainings closes in late October
- No proceedings; slides are posted on the public FIRST website after the event; vendor pitches are not accepted
- Accepted presenters get one free full registration per talk; FIRST does not pay travel or accommodation
