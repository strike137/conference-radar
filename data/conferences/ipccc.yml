id: ipccc
name: IEEE IPCCC
full_name: IEEE International Performance Computing and Communications Conference
type: conference
tier: minor
areas: [networking, systems, communications]
region: north-america
language: english
frequency: annual
organizer: IEEE, run by the IPCCC Board (steering committee)
organizer_country: [usa]
proceedings: IEEE Xplore
indexing: [DBLP]
rank:
  core: C
  ccf: C
fee: USD 895 IEEE member, USD 1075 non-member (2026, regular rate, plus processing); student non-author USD 630
  / 760
typical:
  deadline_months: [7, 8]
  conference_months: [11]
links:
  website: https://www.ipccc.org/
  dblp: https://dblp.org/db/conf/ipccc/
notes:
- Running for over four decades (45th edition in 2026); IEEE conference steered by the IPCCC Board, chaired from the
  US
- Held in the US every year recently (2022 Austin, 2023 Anaheim, 2024 Orlando, 2025 and 2026 Austin); 2020 and 2021
  were virtual
- Topics span performance evaluation, cloud and edge computing, wireless and 5G/6G networks, IoT, and security and privacy
- Regular (8 pages), short (6 pages), poster (2 pages) and workshop papers; single-blind review via EDAS
- CORE C and CCF C
- In-person presentation required for IEEE Xplore inclusion; remote presentation only with documented reasons and an
  extra fee (virtual session held the weekend before the in-person conference)
- In 2026 the paper deadlines were extended by one to two weeks
