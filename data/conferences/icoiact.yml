  conference_months: [11, 12]
links:
  website: https://26.icoiact.org/
notes:
- Run annually since 2018 by Universitas Amikom Yogyakarta (Indonesia); not the same venue as ICoICT run by Telkom University
- Usually held in Yogyakarta; 2024 edition held at JAIST (Ishikawa, Japan) and 2026 edition at Tokyo Metropolitan University
  (Hino campus)
- Hybrid (online and onsite); accepted papers must be presented to be submitted to IEEE Xplore
- Proceedings in IEEE Xplore every year since 2018; the site says it is Scopus-indexed (SJR Q4 since 2024)
- 4-6 page IEEE double-column papers via EDAS; double-blind review by 3 reviewers
- Broad scope in five tracks (communication and networking, computing and processing, information systems, robotics and IoT, signal processing)
- Not listed in ICORE2026 or the CCF list
