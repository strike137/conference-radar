notes:
- Regional infosec conference in Charleston, West Virginia, run every year by the nonprofit 304 Geeks
- 2026 is the 17th edition (SecureWV 17); two days of talks, hands-on workshops and villages (lockpick, RF and drone, CTF)
- Talks and workshops selected through an open call for papers; recorded talks are posted on the Past Talks page
- Sponsored by several West Virginia universities and colleges (Marshall, WVU, Concord and others)
- Talks only, no proceedings
