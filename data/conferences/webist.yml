notes:
- Organized by INSTICC; proceedings in the SCITEPRESS Digital Library, a short list of revised and extended papers
  is planned for a Springer LNBIP book and best papers are invited to a Springer Nature Computer Science special issue
- CORE C (ICORE2026); regarded as a minor venue; 22nd edition in 2026
- Covers internet technology, web intelligence and semantic web, social network analytics and web interfaces
- Two submission stages (1st stage gives an earlier notification), plus late-breaking papers and an abstracts track;
  all deadlines AoE
- 2026 edition co-located with ICINCO, CoopIS, icSPORTS, CHIRA, IJCCI, IC3K and IN4PL with free cross access
- Held in European cities (Budapest 2020, Valletta 2022, Rome 2023, Porto 2024, Marbella 2025, Angers 2026)
