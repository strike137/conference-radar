notes:
- Annual week-long workshop run by the Boolean Functions Team at the University of Bergen (led by Lilya Budaghyan)
- Topics are Boolean functions and related discrete structures with applications in cryptography, coding theory, AI and quantum computing
- Submissions are 4 to 5 page abstracts for a 15 to 20 minute talk; presentation in person or online via Zoom
- Non-archival; authors of accepted abstracts are invited to submit a full paper to a Cryptography and Communications special issue after a new review round
- Usually held at a hotel in western Norway (Rosendal 2021, Balestrand 2022, Voss 2023, Sogndal 2026); 2024 in Dubrovnik and 2025 in Larnaca
- The registration fee covers lunches, banquet, excursion and bus transport back to Bergen
