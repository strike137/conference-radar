notes:
- Interdisciplinary conference combining neuroscience, cognitive science and AI ("Brain Science meets Artificial Intelligence"); 19th edition in 2026
- Proceedings, including workshop and special session papers, in a Springer LNAI volume (Brain Informatics book series)
- Best papers invited to the open access Brain Informatics journal (Springer Nature) with the APC waived
- Rotates worldwide (Padua 2022, Hoboken 2023, Bangkok 2024, Bari 2025, Brisbane 2026); hybrid format
- 2026 edition held in conjunction with IEEE/WIC WI-IAT 2026 in Brisbane
- Regular papers 10 to 12 pages and short papers 6 to 9 pages in LNCS format; abstract presentations also accepted
- Not listed in CORE ICORE2026 or the CCF list
