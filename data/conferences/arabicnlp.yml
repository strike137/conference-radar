notes:
- Organized by the ACL Special Interest Group on Arabic NLP (SIGARAB); held since 2023 as the successor of the WANLP workshop series
- Co-located with a major ACL conference (EMNLP 2023 in Singapore, ACL 2024 in Thailand, EMNLP 2025 in Suzhou, EMNLP 2026 in Budapest); hybrid format with remote presentation possible
- Main conference acceptance rate 47% (38 of 80) in 2023 and 42.6% (31 of 68) in 2024
- Proceedings in the ACL Anthology (2023, 2024 and 2025 volumes); a separate shared tasks volume with many system papers
- Long papers up to 8 pages, short and demo papers up to 4 pages, ACL templates; direct submission or commitment of ARR reviews
- Not ranked in CORE ICORE2026
