notes:
- Flagship conference of IAOA, the international ontology society; held together with the JOWO joint workshops
- Proceedings published open access by IOS Press (FAIA series); companion proceedings and JOWO papers in CEUR-WS
- Annual since 2023 (biennial before); recent editions in Canada (2023), Netherlands (2024), Italy (2025) and Brazil (2026)
- Three tracks (foundational, applications and methods, domain ontologies); double-blind review with a rebuttal phase
- Papers up to 13 pages excluding references in IOS Press format; an online part (FOIS Online) precedes the in-person event
- FOIS 2027 announced for Bratislava, Slovakia
- CORE ICORE2026 rank C
