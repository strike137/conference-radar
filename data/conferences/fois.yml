notes:
- Flagship conference of the IAOA, running since 1998 (16th edition in 2026); biennial until 2018, annual since 2023
- Proceedings published open access by IOS Press (Sage)
- Tracks for foundational issues, applications and methods, and domain ontologies; double-blind review, papers up to 13 pages excluding references
- Mandatory abstract a week before the paper deadline, with a rebuttal period
- Co-located with JOWO (Joint Ontology Workshops); workshop deadlines fall after the main track notification
- 'Recent hosts: Sherbrooke (2023), Enschede (2024), Catania (2025), Vitoria, Brazil (2026), Bratislava (2027)'
- Since 2026 a separate online day precedes the in-person conference
- CORE C (ICORE2026); not on the CCF 2026 list
