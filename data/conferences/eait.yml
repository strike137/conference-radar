notes:
- Run by the Computer Society of India (CSI) Kolkata Chapter since 2006, in technical collaboration with the IET (UK) Kolkata Local Network
- Held every two years in Kolkata, India (2024 at Techno Main Salt Lake, 2026 at IIT Kharagpur Research Park, Rajarhat)
- Proceedings in IEEE CS from 2011 to 2018 and Springer since 2020; the 2024 and 2026 calls name the Springer Lecture Notes in Networks and Systems series
- "Acceptance ratio stated by the organizers: 19% (2024), 13% (2026)"
- Full papers up to 10 pages in one-column format, submitted via Microsoft CMT
- Not listed in ICORE2026 or the CCF 2026 list
