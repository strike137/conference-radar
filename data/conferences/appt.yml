notes:
- Flagship international conference of the CCF Technical Committee on Computer Architecture (TCArch); covers chip
  design, computer architecture, parallel and computing systems
- Started in 1995 as a China and Germany bilateral workshop (CCF TCArch and Fraunhofer GMD FIRST); biennial from 2003
  to 2023, annual since 2025
- Springer LNCS proceedings since 1999; full papers up to 12 pages in LNCS format, double-blind review with a desk
  reject filtering stage
- Recently held in Europe (Athens 2025, Brussels 2026) after mostly Chinese venues; registration runs through the CCF
  conference platform
- CCF C (architecture, parallel and storage category); not listed in the ICORE2026 portal
- Also hosts a PhD forum, posters and WIP papers, workshops, tutorials and a CUDA programming challenge
