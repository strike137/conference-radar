links:
  website: https://nanocom.acm.org/
notes:
- ACM conference on nanoscale and molecular communication, nanonetworks and bio-nano computing (14th edition in 2027)
- Endorsed by the IEEE ComSoc technical group on Molecular, Biological and Multi-Scale Communications (MBMC)
- Regular papers up to 6 pages (7 with an extra page charge) and 2-page work-in-progress papers; single-blind review
- Proceedings in the ACM DL (open access, APC applies); every accepted paper must be presented in person
- Rotates between Europe, North America and Asia (Milan 2024, Chengdu 2025, St. John's 2026, Erlangen 2027)
- Not ranked in CORE (ICORE2026) or CCF
