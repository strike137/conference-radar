links:
  website: https://ieee-dyspan.org/
notes:
- Leading IEEE ComSoc venue on radio spectrum technology and policy (spectrum sharing, sensing, coexistence, spectrum
  economics and regulation); first held in 2005
- Technology and policy tracks; papers that cross both are of particular interest; one best paper award per track
- Full papers up to 8 pages and short papers up to 4 pages (2 and 1 extra pages at 100 USD each); single-blind
  review via EDAS
- Accepted and presented papers go to IEEE Xplore; an author must register and present in person
- Irregular until 2021 (2018 Seoul, 2019 Newark, 2021 virtual), no edition in 2022 or 2023; annual in May since
  2024 (Washington DC 2024, London 2025, Washington DC 2026)
- Also has workshops, tutorials, posters and demos with later deadlines; the 2026 edition offered NSMA and WinnForum
  programs as paid add-ons
- Not listed in ICORE2026 (CORE2018 had it as B) or the CCF list
