notes:
- Technically sponsored by the Soft Computing Research Society (SCRS, New Delhi), which runs many hybrid conferences each year
- After-conference proceedings in Springer Lecture Notes in Networks and Systems (LNNS) since 2025; 2021 to 2024 appeared in Springer Algorithms for Intelligent Systems
- Hybrid (in-person and online); hosted by BBD University Lucknow (2021 to 2023), SSPU Pune (2024) and NIT Goa (2025 to 2027)
- 6th edition in 2026; submission via Microsoft CMT
- Not listed in CORE ICORE2026 and not on the CCF list
