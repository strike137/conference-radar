notes:
- Brings together industrial OCaml users with academics and hackers working on the language, type system and tools
- Talk based workshop with no formal proceedings; submissions are 2 to 3 page talk descriptions
- Co-located with ICFP every year from 2012 to 2025 (Ljubljana 2022, Seattle 2023, Milan 2024, Singapore 2025)
- 2026 edition was not affiliated with ICFP and was held in Paris as part of FPW'26, with a watch party at ICFP 2026
- Formats include standard talks, demos, informed position talks and experience reports; hybrid with free remote attendance
- Quota of at most four accepted talks by speakers with the same affiliation (2025)
- The more research oriented ML Family Workshop is held next to it
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
