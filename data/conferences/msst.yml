notes:
- Storage systems conference founded in 1974 by US national laboratories (formerly the IEEE Symposium on Mass Storage
  Systems)
- A full week at Santa Clara University, with an invited industry and practitioner track followed by a peer-reviewed
  research track
- Research track takes full papers (up to 14 pages) and short papers (4 to 6 pages), double-blind, IEEE format, via
  EasyChair
- Accepted research papers are posted as open PDFs on the conference website
- Held at Santa Clara University, CA at every edition since 2014 (2020 virtual, none in 2021 and 2022); 2025 was a reduced invited-talks edition
- CCF B (listed as Mass Storage Systems and Technologies); CORE National USA (ICORE2026)
