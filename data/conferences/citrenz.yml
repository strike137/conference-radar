notes:
- Annual conference of CITRENZ, the body of New Zealand polytechnic and ITP computing schools (formed in 2010 from NACCQ)
- Focus on applied computing and computing education; mostly New Zealand polytechnic and university staff
- Peer reviewed full papers, short papers and posters, submitted via Microsoft CMT
- Proceedings (PACIT) are free online on the CITRENZ site; the 2023 proceedings were published by Unitec ePress with a DOI
- "Held in a New Zealand city each year: Christchurch (2022), Auckland (2023), Dunedin (2024), Christchurch (2026)"
- Not listed in ICORE2026; not in the CCF list
- Companion journal JACIT (Journal of Applied Computing and Information Technology)
