notes:
- Main Asian programming languages venue, organized by AAFS (Asian Association for Foundation of Software)
- Proceedings in Springer LNCS; 17 pages plus bibliography in LNCS format
- Light double-blind review with a rebuttal phase; accepted papers must be presented at the conference
- 'Recent hosts: Taipei (2023), Kyoto (2024), Bengaluru (2025), Hong Kong (2026)'
- Co-located with ATVA in 2025 and 2026; also has an SRC and poster session and the NIER workshop
- Small, around 30 to 40 research paper submissions per year (28 in 2025, 37 in 2024)
- CORE B, CCF C
