notes:
- Largest information systems (Wirtschaftsinformatik) conference of the German-speaking countries; held every year at a different university in Germany, Austria, Switzerland or Liechtenstein
- Alternated yearly with the Multikonferenz Wirtschaftsinformatik (MKWI) until 2018; annual since 2019
- Papers in German or English; completed research and research-in-progress papers, double-blind review per track
- Proceedings mostly in the AIS eLibrary (volumes up to 2024 listed there)
- Information systems (business school) venue rather than core CS
- WI 2026 (21st edition) at Johannes Kepler University Linz, theme "Soziotechnische Systeme im Zeitalter von KI"
- Has a student track, doctoral consortium, student challenge and an industry track open to practitioners
- Not listed in ICORE2026 (the ICORE "WI" is Web Intelligence)
