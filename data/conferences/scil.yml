notes:
- Annual meeting of the Society for Computation in Linguistics on computational and mathematical approaches to any area of linguistics; held since 2018
- Submissions must have a substantial computational or mathematical modeling component and make direct contact with linguistics
- Two tracks, papers (8 pages) and abstracts (2 pages, extendable to 4 pages after acceptance); both appear in the open-access SCiL proceedings and papers are also in the ACL Anthology
- Abstracts may describe work already presented or published at venues with a different audience
- 2026 edition (ninth meeting) held as a workshop co-located with ACL 2026 in San Diego, with in-person and online presentations and an ARR commitment track
- All in-person editions so far were in the USA (Amherst 2023, Irvine 2024, Eugene 2025, San Diego 2026); 2021 and 2022 were online
- 52 papers in the 2026 ACL Anthology volume, 44 in 2025
- NSF funding offered registration discounts of at least 500 USD for one author per accepted paper in 2026
- Not listed in ICORE2026 and not on the CCF list
