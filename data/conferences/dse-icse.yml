notes:
- One-day ICSE workshop on the deliberate misuse of software engineering to deceive, manipulate or exploit users (dark patterns, deceptive chatbots, manipulative A/B tests)
- 2026 edition held at ICSE 2026 in Rio de Janeiro; organizing chairs Mohamad Kassab and Phil Laplante
- Long papers up to 8 pages, short papers up to 6 pages and extended abstracts, ACM format, single-blind review by at least three reviewers
- 2026 papers published in the ACM Digital Library in the ICSE Companion Proceedings; extended abstracts are APC free
- Selected papers invited to extended versions in IEEE Reliability Magazine or a book chapter
- Not on the ICSE 2027 workshop list, so the next edition is not announced yet
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
