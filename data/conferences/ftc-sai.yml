notes:
- Run by the Science and Information (SAI) Organization, a UK based company that also runs IntelliSys, Computing and FICC
- Annual since 2016; held in Vancouver and San Francisco until 2023 (virtual in 2020 and 2021), then London (2024), Munich (2025) and Berlin (2026)
- Proceedings in Springer Lecture Notes in Networks and Systems
- Double-blind review by at least three PC members; the organizer states an acceptance rate of 37 to 39%
- Three submission rounds (two regular rounds plus a late breaking round); papers up to 18 pages plus 7 pages of references and appendices
- Hybrid format; FHCI, FICC and FIAA are co-located and share the proceedings
- Broad scope covering AI, quantum computing, robotics, IoT, cybersecurity and 5G/6G networks
- Not listed in the CORE ICORE2026 portal
