links:
  website: https://iconsneuromorphic.cc/
notes:
- First held in 2018 in Knoxville, Tennessee, organized by Oak Ridge National Laboratory; steering committee and
  general chairs mostly from ORNL and US national labs and universities
- Technical co-sponsors are ACM, ACM SIGAI and ACM SIGDA; proceedings in the ACM Digital Library
- Covers neuromorphic architectures, circuits and devices, spiking and brain-inspired algorithms, software and
  energy-efficient edge AI
- Full papers up to 8 pages and short papers up to 4 pages (including references) in ACM format; rejected papers are
  considered for posters
- Review includes an author rebuttal phase (2026)
- Small venue held in the USA (2023 Santa Fe, 2024 Arlington, 2025 Bellevue, 2026 Naperville); 2023 and 2024 were
  hybrid
- Not listed in ICORE2026
