notes:
- Annual workshop at the intersection of programming languages and human-computer interaction (usability of languages and tools, empirical studies, psychology of programming)
- Co-located with SPLASH until 2018; now a standalone two-day workshop hosted at CMU (Pittsburgh), Northeastern (Boston) or UC Berkeley
- Short papers up to 4 pages, long papers up to 10 pages, flex length in between (references excluded); submissions are not anonymized
- Papers are screened by the organizing committee and each accepted paper gets feedback from two mentors
- Proceedings are open access in CMU KiltHub with DOIs and no publication fee; inclusion is optional and authors are encouraged to publish later at HCI and PL venues, so treated as non-archival
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
