id: bandit
name: BANDIT
full_name: Workshop on Big Data Analysis and Illicit Trends
type: workshop
tier: minor
areas: [security, data, ai]
region: worldwide
language: english
frequency: irregular
organizer: Workshop chairs from Tilburg University, TU Eindhoven and the University of Thessaly (JADE lab), co-located with IEEE BigData
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [10, 11]
