links:
  website: https://jade-lab.github.io/bandit/
notes:
- Workshop on big data analytics against cybercrime and illicit activity (cyber threat intelligence, OSINT, dark web
  marketplaces, illicit finance, misinformation); 2026 is the 3rd edition
- Held with IEEE BigData in 2023 (Sorrento), 2025 (Macau) and 2026 (Phoenix); no 2024 edition
- Accepted papers go into the IEEE BigData workshop proceedings (IEEE Computer Society Press, IEEE Xplore)
- Full papers 8 to 10 pages, short papers 4 to 6 pages, IEEE two-column format, at least three reviews per paper
- Hybrid event (in-person and remote presentation)
- 2025 had two submission cycles (September and October)
- Not ranked by CORE (not in ICORE2026) or CCF
