full_name: Workshop on Bridging Neurons and Symbols for Reasoning over LLMs and Knowledge Graphs
type: workshop
tier: minor
areas: [ai, nlp, data]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizing committee (Tiansi Dong of the Alan Turing Institute and University of Cambridge, with Salesforce, Queen Mary University of London, Dalian University of Technology and the Chinese Academy of Sciences)
organizer_country: [europe, china]
proceedings: ACL Anthology (2024, 2025); selected revised papers in Springer LNAI
archival: true
typical:
  deadline_months: [12]
  conference_months: [1, 2]
links:
  website: https://neusymbridge.github.io/
notes:
  - Workshop on neural-symbolic reasoning with LLMs and knowledge graphs
  - Held with LREC-COLING 2024 (Turin), COLING 2025 (Abu Dhabi), AAAI 2026 (Singapore) and AAAI 2027 (Montreal)
  - Earlier titled Bridging Neurons and Symbols for Natural Language Processing and Knowledge Graph Reasoning
  - Proceedings of the 2024 and 2025 editions are in the ACL Anthology
  - Selected papers from the 2024 to 2026 editions, after revision, are to be published in the Springer LNAI series
  - Double-blind review with at least three reviews per paper; submissions via OpenReview in the AAAI template
  - Two best paper awards each year
  - Not listed in ICORE2026 or the CCF list
