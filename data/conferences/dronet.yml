notes:
- Workshop on drones as mobile computing platforms (drone networking, systems, applications), held with ACM MobiSys
- 10th edition at MobiSys 2024 in Tokyo, 11th at MobiSys 2025 in Anaheim
- Full papers up to 6 pages; 2-page poster and demo papers; single-blind review in MobiSys format
- Proceedings in the ACM Digital Library (10th edition proceedings DOI prefix 10.1145/3661810)
- Not among the MobiSys 2026 workshops
- Not listed in the CORE portal (ICORE2026)
