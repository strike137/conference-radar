notes:
- Independent, community-run Security BSides conference in Jacksonville, Florida, organized each year by local volunteers; running for 10+ years
- 2027 edition at The Jessie in downtown Jacksonville with paid full-day trainings on Friday and the main event on Saturday
- Three talk tracks, four villages and a Jeopardy-style CTF; practitioner workshops of 60 to 90 minutes are also accepted
- Talks submitted through a form on the CFP page; vendor pitches are not accepted and first-time speakers get a mentor
- Students and active duty military attend free; most main-track talks are recorded for YouTube
- Talks only, no proceedings
