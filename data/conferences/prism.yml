notes:
- First held in 2026, co-located with NDSS in San Diego on the Monday before the main conference
- 'Topics: provenance graphs, attack reconstruction, provenance-based intrusion detection, log storage and integrity,
  forensics, datasets and benchmarks'
- Official proceedings published and archived by the Internet Society (DOI prefix 10.14722/prism.2026)
- Regular papers up to 10 pages and work-in-progress papers up to 6 pages, excluding references and appendices;
  double-blind, NDSS templates; demo-driven tutorials also accepted
- 13 accepted papers in 2026; best paper award sponsored by Palo Alto Networks
- NDSS 2027 moves to Seoul, Korea (March 2027); a PRISM 2027 edition is not announced yet
