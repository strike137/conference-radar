notes:
- Long-running international conference on shape modeling, geometry processing and geometric learning (since 1997)
- Accepted papers are published in a special issue of Computers & Graphics (Elsevier) after a two-round double-blind review
- Year-round journal track since late 2025 (Shape Modeling section of Computers & Graphics); accepted papers are presented
  at SMI
- Replicability Stamp (GRSI) is a prerequisite for best paper nomination
- Often co-located with SPM, GMP or SGP; 2027 edition is part of the International Geometry Summit in Singapore
- Rotates worldwide (Genova 2023, Detroit 2024, Hangzhou 2025, Istanbul 2026, Singapore 2027)
- Not listed in ICORE2026; CCF C (computer graphics and multimedia)
