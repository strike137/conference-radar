notes:
- Workshop on confluence and related properties of rewriting systems (commutation, completion, critical pairs, certification, tools)
- Annual since 2012 (Nagoya); IWC 2026 was the 15th edition
- Co-located with FSCD, IJCAR, FLoC or similar events; Buenos Aires/online 2021, Haifa 2022, Obergurgl 2023, Tallinn 2024, Leipzig 2025, Lisbon 2026
- Short papers or extended abstracts of at most 5 pages in EasyChair style; no formal reviewing, short versions of published papers welcome
- Accepted papers are released electronically as informal proceedings before the workshop
- The Confluence Competition (CoCo) runs live during the workshop
- Not listed in ICORE2026 or the CCF 2026 list
