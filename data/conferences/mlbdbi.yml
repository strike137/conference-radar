links:
  website: https://www.mlbdbi.org/
notes:
- Commercially serviced Chinese conference on the AEIC (AiScholar, ais.cn) platform, hosted by Zhejiang University of Finance and Economics
- Annual since 2019 (Taiyuan 2019, Chengdu 2020, online 2021, Hangzhou 2023 to 2026)
- 2026 proceedings published by IEEE (ISBN 979-8-3195-4729-3) and submitted to IEEE Xplore, EI Compendex and Scopus
- Double-blind review by two or three reviewers per paper (editorial policy page)
- Listener registration without a paper is offered
- Not listed in CORE ICORE2026 or the CCF list
