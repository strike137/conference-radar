notes:
- EAI conference on safe, secure, ethical and responsible technologies, with a focus on applications for sustainable development in Africa
- Proceedings in Springer LNICST; fast track to EAI Endorsed Transactions journals for extended papers
- Held since 2023 (Yaounde 2023, Dubai 2024, Cape Town online 2025, Osara Nigeria hybrid 2026)
- Main track plus a late-breaking research track and workshop tracks
- Not listed in ICORE2026
