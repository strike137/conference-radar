notes:
- Annual conference on visual media combining computer graphics, computer vision, image and video processing,
  visualization and geometric computing; run with Tsinghua University and a local host each year
- Accepted full papers go through a revision round and are published in journals (IEEE TVCG, JCST, Computational
  Visual Media); accepted poster papers appear in the Springer LNCS conference proceedings
- Papers up to 14 pages including references, anonymous submission; a separate 2 page technical brief track is not
  formally published
- Usually held in April; most editions so far were in China, recent ones rotate around Asia-Pacific (2023 Shenzhen, 2024
  Wellington, 2025 Hong Kong, 2026 Seoul, 2027 Singapore)
- Every accepted paper needs one full (non student) registration by the early bird deadline
- Not listed in the CORE ICORE2026 portal; CCF C (graphics and multimedia)
