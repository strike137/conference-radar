notes:
- Premier European venue for real-time systems; the site ranks it with RTSS and RTAS as one of the top three
  conferences in the field
- Began as a workshop in 1989 and became a conference in 1998; named Euromicro Conference on Real-Time Systems in
  proceedings up to 2025
- Open-access proceedings in LIPIcs (Schloss Dagstuhl) since 2017; conference fees cover publication costs
- Double-blind review with artifact evaluation, a shadow TPC, an industrial challenge and real-time pitches; up to 20
  pages of technical content (2026)
- Held in Europe every year in early to mid July (Brussels 2025, Lund 2026, Prague 2027)
- CORE B (ICORE2026, listed as Euromicro Conference on Real-Time Systems); not in the CCF 2026 list
