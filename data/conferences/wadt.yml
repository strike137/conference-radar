notes:
- Long-running workshop on algebraic specification and formal software development, held since 1982; 2024 was the 27th edition
- Biennial since 2010; co-located with STAF (2024 Enschede, 2026 Rennes)
- Talks selected from 2-page abstracts; full papers are submitted after the workshop and refereed for post-proceedings in Springer LNCS
- Usually held in Europe (2016 Gregynog, 2018 Egham, 2020 virtual, 2022 Aveiro, 2024 Enschede, 2026 Rennes)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
