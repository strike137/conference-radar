notes:
- Long-running workshop on algebraic specification and formal software development (27th edition in 2024)
- Held as part of STAF in 2024 (Enschede) and 2026 (Rennes); the related CALCO conference runs separately in odd years
- Talks selected from two-page abstracts in LNCS format
- After the workshop, authors are invited to submit full papers to refereed post-proceedings, typically in Springer LNCS
- Not listed in ICORE2026 or on the CCF 2026 list
