id: iccws
name: ICCWS
full_name: International Conference on Cyber Warfare and Security
type: conference
tier: minor
areas: [security]
region: worldwide
language: english
frequency: annual
organizer: Academic Conferences and Publishing International (ACPI), UK
organizer_country: [europe]
proceedings: ACPI open-access proceedings (ISSN 2049-9870); presented papers may be developed for Journal of Information
  Warfare, IJCWT or IJESDF
archival: true
indexing: [Scopus]
rank:
  core: Unranked
acceptance_rate: About 48% (2026, 85 papers published from 178 initial abstracts); about 49% in 2025 (82/168)
fee: 450 GBP (2027, in-person with paper publication, early bird); 325 GBP student; 295 GBP virtual with paper
typical:
  deadline_months: [8, 9]
  conference_months: [3]
links:
  website: https://www.academic-conferences.org/conferences/iccws/
  wikicfp: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=187838
notes:
- Run by ACPI, a commercial academic conference organizer; audience mixes academics, military and practitioners
- Abstract-first submission, then full paper (up to 5000 words) under double-blind review
- Proceedings open access, listed in Scopus and submitted to Web of Science CPCI
- Held in the USA most years (Williamsburg 2025, Wilmington 2026) and in South Africa every few years (Johannesburg
  2024, Cape Town 2027)
- 'Hybrid: virtual presentation allowed'
