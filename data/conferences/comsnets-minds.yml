notes:
- Co-located workshop of COMSNETS, held each January in Bengaluru, India
- Machine learning, AI and data analytics for networks and networked systems (network management, IoT, edge and
  cloud, LLMs for networking)
- Double-blind review; papers up to 6 pages in IEEE format, submitted through EDAS
- Workshop papers appear in the COMSNETS proceedings and are submitted to IEEE Xplore
- Held with COMSNETS every year in the 2020 to 2026 archives
- Workshop deadline is usually extended by one to two weeks
