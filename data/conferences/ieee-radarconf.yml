notes:
- Flagship radar conference of the IEEE Aerospace and Electronic Systems Society
- Covers radar systems and applications, radar signal and data processing, phenomenology, antennas and components
- Full papers of 3 to 6 pages including figures, tables and references in the IEEE two-column format (2027)
- In-person presentation required; papers not presented can be excluded from IEEE Xplore
- All accepted papers are considered for a special section of IEEE Transactions on Aerospace and Electronic Systems
- Week includes a Radar Boot Camp, tutorials, a student paper competition, IEEE Radar Challenges and an exhibition
- Mostly held in the USA (New York 2022, San Antonio 2023, Denver 2024, Phoenix 2026), but 2025 was in Krakow, Poland and 2027 is in Bangalore, India; 2021 was virtual
- Radar engineering venue outside the usual CS rankings, not listed in ICORE2026
