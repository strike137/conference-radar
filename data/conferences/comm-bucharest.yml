notes:
- Biennial communications conference (even years) held in Bucharest, Romania; 2026 was the 16th edition
- Organised by the Military Technical Academy "Ferdinand I" and POLITEHNICA Bucharest, co-organised by the Electronica 2000 Foundation
- Papers published in IEEE Xplore and ISI databases since 2010 (IEEE catalog CFP2641J-POD for 2026)
- Regular papers 4 to 6 pages, blind peer review, at most 3 papers per author
- Topics span communication theory, wireless, antennas and propagation, optical networks, IoT, AI, quantum and communication systems security
- "Registration (2026): 400 EUR regular, 250 EUR developing nations, 200 EUR PhD students"
- 2026 held at the Palace of the National Military Center (Cercul Militar National), Bucharest
- Not listed in ICORE2026
