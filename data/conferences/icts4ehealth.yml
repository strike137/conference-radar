notes:
- Co-located conference of IEEE ISCC; ran as a workshop from 2016 to 2020 and as a conference since 2021
- Papers go into the ISCC Proceedings and are submitted to IEEE Xplore
- Papers up to 7 pages in IEEE double-column format (6 pages without extra charge), submitted through EDAS
- Several special sessions with their own calls; journal special issues for extended versions of selected papers
- Registration handled by ISCC; author registration covers up to two papers
- Not listed in CORE ICORE2026 or the CCF list
