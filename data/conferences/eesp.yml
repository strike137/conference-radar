id: eesp
name: EESP
full_name: "International Workshop on Energy Efficiency with Sustainable Performance: Techniques, Tools, and Best Practices"
type: workshop
tier: minor
areas: [systems]
region: worldwide
language: english
frequency: multiple-per-year
organizer: NHR@FAU (Erlangen National High Performance Computing Center), held with ISC and SC
organizer_country: [europe]
proceedings: ISC workshop proceedings (Springer LNCS) for ISC editions; SC Workshops Proceedings (IEEE Xplore) for SC editions
archival: true
acceptance_rate: 33% (SC 2026, 15/45)
typical:
  deadline_months: [3, 8]
  conference_months: [6, 11]
links:
  website: https://ayeshaafzal91.github.io/eesp/
notes:
- Workshop on energy efficiency and sustainable performance in HPC and AI (energy-aware software, power management, monitoring, benchmarking, procurement)
- Started with ISC 2025 in Hamburg; held with ISC in June (Springer LNCS) and since 2026 also with IEEE/ACM SC in November (IEEE Xplore)
- SC edition uses double-blind review with at least three reviews; short (4 pages) and regular (8 pages) papers
- Best papers invited to a special issue of the International Journal of High Performance Computing Applications (IJHPCA)
- General chair Ayesha Afzal (NHR@FAU, Germany)
- Not listed in CORE ICORE2026
