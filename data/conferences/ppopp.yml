notes:
- Premier forum for parallel and performance programming (languages, compilers, runtimes, HPC, accelerators, parallel AI workloads)
- Co-located every year with HPCA, CGO and CC
- Proceedings in the ACM Digital Library, published open access; rejected papers are considered for posters with 2-page summaries in the proceedings
- Up to 10 pages in two-column ACM sigplan format, excluding references; optional artifact evaluation
- Held in Edinburgh 2024, Las Vegas 2025, Sydney 2026 and Salt Lake City 2027
- CORE B (ICORE2026) but CCF A
