notes:
- Workshop on building, curating, querying and analysing very large text corpora, with a standing track for national corpus project reports (posters)
- Held since 2012, alternating between LREC and the Corpus Linguistics conference (UK); 2018 edition in Miyazaki, Japan; 2020 edition cancelled after review; 2023 edition cancelled
- 12th edition on the morning of May 11, 2026 at LREC 2026 in Palma, Mallorca
- Proceedings published by ELRA on the LREC site and in the ACL Anthology
- Papers of 4 to 8 pages via the LREC START system; national project posters as 500 to 750 word proposals
- Not ranked in ICORE2026 and not on the CCF list
