organizer: COMSNETS Association (2026 edition hosted by Politecnico di Milano)
organizer_country: [india]
proceedings: IEEE Xplore (from 2025; ACM ICPS 2021 to 2024)
indexing: [IEEE Xplore, ACM DL]
rank:
  core: Unranked
fee: 500 EUR full, 250 EUR student (2026, early registration until 2026-09-15); 600 EUR / 350 EUR late
typical:
  deadline_months: [6, 7]
  conference_months: [10]
links:
  website: https://www.aimlsystems.org/
notes:
- Started in 2021 as an initiative of the COMSNETS Association, the non-profit that runs COMSNETS in Bengaluru
- Focus on the intersection of systems engineering and AI/ML (efficient and distributed AI, AI hardware, AIOps,
  safe and responsible AI); research track plus industry track and workshops
- Held in Bengaluru, India in 2021 (hybrid), 2022 (hybrid), 2023 and 2025; Baton Rouge, USA (LSU) in 2024; Lecco, Italy
  (Politecnico di Milano, Lake Como) in 2026
- Proceedings in ACM ICPS (ACM DL) for 2021 to 2024, IEEE Xplore for 2025; 2026 papers use IEEE format
- Double-blind review; research papers 8 pages plus references, short papers 4 pages, industry papers 6 pages
- Each accepted paper needs a full registration, which covers up to two papers
- Not listed in ICORE2026 or the CCF list
