notes:
- Workshop and challenge on contactless physiological sensing (rPPG from face video, NIR video, radar)
- Held at CVPR 2020 and ICCV 2021, then at IJCAI every year since 2024 (Jeju 2024, Guangzhou 2025, Bremen 2026)
- Format is workshop plus challenge plus invited talks; the 2026 challenge ran on Kaggle with an RGB-NIR fusion track and a radar track
- Papers under 7 pages in CEURART style; accepted papers go into a CEUR Workshop Proceedings volume
- At least one author must present onsite
- Not listed in CORE ICORE2026
