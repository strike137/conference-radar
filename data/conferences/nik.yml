notes:
- Broad national conference on theoretical and applied informatics and computer science, held since 1988
- One of four tracks of NIKT, the Norwegian ICT Conference for Research and Education (with NOKOBIT, NISK and UDIT)
- Research papers (up to 10 pages) and work-in-progress papers (up to 4 pages) are peer reviewed and published in the open access NIKT Journal (ISSN 1892-0721, Norwegian level 1 channel)
- Extended abstracts of published work (up to 2 pages) are not part of the proceedings
- Papers and talks in Norwegian, another Scandinavian language or English; LNCS format
- Desk rejection for papers with no author close to Norwegian academia or industry
- Host rotates within Norway (Trondheim 2021, Kristiansand 2022, Stavanger 2023, Bergen 2024, Halden 2025)
