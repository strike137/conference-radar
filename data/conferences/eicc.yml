links:
  website: https://www.fvv.um.si/eicc2027/
notes:
- Interdisciplinary cybersecurity conference that welcomes work from behavioral sciences, criminology, law and
  investigations alongside computer science
- Known as the Central European Cybersecurity Conference (CECC) until 2019; 2026 was the 10th edition
- Proceedings published by Springer Nature since 2025 (CCIS volume 3012 in 2026) and by ACM for 2018 to 2024; indexed by
  DBLP and Scopus
- Full papers 12 to 16 pages, short papers 6 to 11 pages, Springer LNCS format
- Held in Europe every year (Targu Mures 2021, Barcelona 2022, Stavanger 2023, Xanthi 2024, Rennes 2025, Darmstadt
  2026, Paris 2027); face-to-face conference
- Not ranked by CORE (not in ICORE2026) or CCF
