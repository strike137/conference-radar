notes:
- Smart city computing conference (23rd edition in 2025), held jointly with IEEE HPCC and DSS since 2016 and with DependSys since 2021
- Earlier editions shared joint HPCC/SmartCity/DSS(/DependSys) proceedings in IEEE Xplore; 2024 had its own volume
- Four tracks in 2026 (smart city systems, data processing technology, data systems, data applications)
- Single-blind review via EDAS; 8 pages (10 with overlength charge) in IEEE CS format
- Selected best papers invited to journal special issues
- Mostly held in China (2021 Haikou, 2022 Hainan, 2024 Wuhan, 2026 Luoyang) with editions abroad (2023 Melbourne, 2025 Exeter)
- Deadlines are usually extended by one to three weeks
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
