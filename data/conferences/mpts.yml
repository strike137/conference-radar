notes:
- Virtual workshop run by NIST within its Multi-Party Threshold Cryptography (MPTC) program
- Earlier editions MPTS 2020 (Nov 4 to 6) and MPTS 2023 (Sep 26 to 28), both virtual
- Call for talk proposals, not papers; no formal proceedings, slides are posted on the NIST site
- 2026 edition had regular talks plus preview talks of planned submissions to the NIST Threshold Call (NIST IR 8214C)
- Free to attend via ZoomGov; 2026 drew over 600 registrations from more than 50 countries
- Not in the ICORE2026 portal and not on the CCF list
