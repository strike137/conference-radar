notes:
- Niche venue on ICT for disaster detection, response and recovery (IoT and wireless, networks, B5G/6G, AI and big data, crowdsourcing, cyber security of critical infrastructure)
- Steering committee chaired by Yassine Hadjadj-Aoul (University of Rennes / Inria) with CERIST Algeria; site hosted by Inria
- Accepted and presented full and short papers are submitted to IEEE Xplore; in 2024 selected best papers were invited to journal special issues
- Double-blind review; full papers 5 to 8 pages, short papers 3 to 4 pages, posters and demos 2 pages; submission via EDAS
- Rotates worldwide (Sendai 2018, Paris 2019, Hangzhou 2021, Cosenza 2023, Setif 2024, Dubai 2026); held roughly every one to two years
- Deadlines are usually extended by several weeks
- Not listed in CORE ICORE2026 or the CCF list
