links:
  website: http://www.icaice.org/
notes:
- New annual conference started in 2025 (online 2025, Xi'an 2026)
- Run by the commercial AEIC (AiScholar) conference service
- 2026 proceedings published by IEEE (ISBN 979-8-3195-0808-9) and submitted to IEEE Xplore, EI Compendex and Scopus
- 2025 proceedings appeared in IET Conference Proceedings (41 papers, Scopus record shown on the site)
- Presenter (abstract only) and listener registration are also offered
- Not the CORE-listed AICE (Australian Institute of Computer Ethics Conference); this venue is not in CORE ICORE2026 or the CCF list
