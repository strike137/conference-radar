frequency: annual
organizer: AEIC Academic Exchange Center (AiScholar, ais.cn) with a host university (Dalian University of Technology in 2025)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 545 USD or 3800 CNY per 4-page paper (2026, regular); 55 USD per extra page; attendee without paper 215 USD
typical:
