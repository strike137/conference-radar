notes:
- E-government and information systems conference; 15th edition in 2026
- Always co-located with DEXA and DaWaK, sharing one deadline and registration
- Proceedings in Springer LNCS (2026 -> LNCS 16862); single-blind review, full papers up to 15 pages and short papers up to 6
- Topics include AI and data in government, e-democracy, electronic identity, legal informatics, privacy and security
- In-person only in 2026; papers not presented are excluded from SpringerLink
- Held with DEXA, mostly in Europe (Naples 2024, Graz 2026) but also Asia (Penang 2023, Bangkok 2025)
- Not listed in ICORE2026; not on the CCF 2026 list
