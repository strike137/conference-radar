notes:
- Workshop on blockchain-based trust and digital identity, co-located with BCCA (International Conference on Blockchain Computing and Applications)
- First edition at BCCA 2025 in Dubrovnik, Croatia; second edition at BCCA 2026 in Barcelona, Spain
- Accepted workshop papers are submitted with the BCCA proceedings to IEEE Xplore for possible publication
- BCCA is a hybrid event; workshop deadlines follow the common BCCA workshop timeline
- Not listed in CORE ICORE2026 or on the CCF list
