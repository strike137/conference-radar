notes:
- Official affinity workshop of LatinX in AI, co-located with NeurIPS
- One-day event with invited talks, oral presentations, posters, a panel and mentoring
- Extended abstracts (up to 4 pages) or full papers (up to 8 pages) in NeurIPS format, double-blind review on OpenReview
- At least one author must identify as LatinX; everyone may attend
- Accepted authors choose archival publication in JLXAIR (with DOI) or non-archival presentation
- 2025 had a San Diego workshop (2 Dec) and a Mexico City satellite (30 Nov)
- 2026 is split between Sydney (7 Dec) and Atlanta (9 Dec), following the NeurIPS 2026 split; organizers assign the presenting site after acceptance
- All deadlines 23:59 AoE
- Not listed in ICORE2026 or the CCF list
