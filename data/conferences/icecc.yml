id: icecc
name: ICECC
full_name: International Conference on Electronics, Communications and Control Engineering
type: conference
tier: minor
areas: [communications, networking, general]
region: asia-pacific
language: english
frequency: annual
organizer: Conference secretariat (icecc.edu@outlook.com, China phone contact) with host universities that change by edition (Waseda University in 2027)
organizer_country: [china]
proceedings: Springer LNEE (since 2025; IEEE Xplore 2024; ACM ICPS in the ACM DL 2019 to 2023)
archival: true
indexing: [EI Compendex, Scopus]
fee: 550 USD regular author, 520 USD student author (2027, early bird before 2026-11-25); 12 pages included, 70 USD per extra page
typical:
  deadline_months: [12]
  conference_months: [3]
links:
  website: https://www.icecc.org/
notes:
- Annual since 2018, held in March; Maldives 2018, Phuket 2019, virtual 2020 to 2022, Fukuoka 2023, Kuala Lumpur 2024, Fukuoka 2025, Yokohama 2026, Tokyo 2027
- Run by a commercial conference secretariat that also promotes its own journals (IJEETC, JCM, IJMERR); host university changes each year
- Proceedings publisher has changed often (IOP JPCS 2018, ACM DL 2019 to 2023, IEEE Xplore 2024, Springer Lecture Notes in Electrical Engineering since 2025)
- Full papers at least 10 pages with double-blind review; abstract only presentation without publication is also offered
- Submission deadline is usually extended (2025, 2026 and 2027 editions)
- Not listed in the CORE ICORE2026 portal; no CCF rank set
