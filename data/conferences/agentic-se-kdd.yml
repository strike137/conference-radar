notes:
- Workshop on AI coding agents as software engineering teammates (agentic pull requests, human review, cost, AgentOps)
- Anchored by the AIDev dataset of over one million agentic pull requests; other datasets are welcome
- First edition is a half-day (morning) workshop at ACM SIGKDD 2026, Jeju ICC, Korea, August 9, 2026
- Long papers up to 8 pages, short and position papers up to 4 pages (excluding references) in the ACM KDD format, submitted via OpenReview
- 20 accepted papers listed for 2026, with PDFs on OpenReview
- KDD 2026 states that workshop papers are not archived in the ACM Digital Library
- The workshop site states it is non-archival with no formal proceedings
- Only one edition so far
- Not listed in ICORE2026 and not on the CCF list
