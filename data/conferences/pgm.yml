notes:
- Biennial conference on probabilistic graphical models (Bayesian networks, causal models, structure learning, inference); 2026 is the 13th edition, first held in 2002
- Proceedings in PMLR (PGM 2024 -> PMLR volume 246, 32 papers)
- Papers up to 12 pages excluding references, submitted via OpenReview; abstract registration about one week before the paper deadline
- Selected papers are invited to a special issue of the International Journal of Approximate Reasoning (IJAR)
- Always held in Europe (Prague 2018, Aalborg 2020, Almeria 2022, Nijmegen 2024, Valencia 2026)
- Pre-conference workshop the day before the main conference (PGM for Earth System Science in 2026)
- Not listed in ICORE2026 and not on the CCF list
