id: ksci
name: KSCI Conference
full_name: Korean Society of Computer and Information Summer and Winter Conferences
name_local: 한국컴퓨터정보학회 하계/동계학술대회
type: conference
tier: domestic
areas: [general, security, ai, networking]
region: korea
language: korean
frequency: multiple-per-year
organizer: Korean Society of Computer and Information (KSCI)
organizer_country: [korea]
proceedings: KSCI conference proceedings (Korean)
rank:
  core: Unranked
fee: 120,000 KRW regular member, 70,000 KRW student member, 150,000 KRW non-member (2026 summer, pre-registration)
typical:
  deadline_months: [6, 12]
  conference_months: [1, 7]
links:
  website: https://ksci.re.kr/
notes:
- 'Two conferences a year: winter in January and summer in July (74th edition in July 2026)'
- 2 or 4 page Korean papers; authors must be paid-up members and the first author must pre-register
- Broad tracks including information security, AI, telecommunications, IoT, defense ICT, mobile computing and computer
  forensics
- Outstanding papers are recommended to the society journal with the review fee waived; undergraduate capstone work
  can be presented (undergraduate students' fees waived)
- Submission deadlines are extended almost every time, usually by one to two weeks
