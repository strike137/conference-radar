notes:
- Workshop on quality in knowledge graphs, LLMs and hybrid KG/LLM systems (hallucination, grounding, KG validation, benchmarks)
- 1st edition co-located with EDBT/ICDT 2026 in Tampere, Finland (half-day, 24 March 2026)
- Papers appear in the CEUR-WS EDBT/ICDT 2026 workshops volume (Vol-4192)
- Full papers up to 8 pages and short papers up to 4 pages (excluding references), CEUR-WS template, submission via EasyChair
- 2026 submission deadline was extended from 15 January to 25 January 2026
- Not in the list of EDBT/ICDT 2027 workshops; two of its organizers chair the 2nd Workshop on Data Quality for Artificial Intelligence (DQ4AI 2027) there
- Not listed in CORE ICORE2026 or the CCF 2026 list
