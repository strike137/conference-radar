notes:
- Small European conference on service-oriented computing, cloud and edge computing, microservices and AIOps
- Proceedings in Springer LNCS as an IFIP WG 6.12 conference (LNCS 16834 in 2026)
- "Acceptance in 2026: 9 full, 4 short and 9 project papers from 40 submissions; single-blind review with at least three reviews"
- Research papers up to 15 pages including references; also PhD symposium and projects and industry tracks
- Irregular timing; no 2024 edition, 2025 edition held in February and 2026 edition in September
- 2026 edition co-located with ECSA in Bolzano
- Selected papers invited to a Cluster Computing (Springer) special issue
- Not listed in CORE ICORE2026
