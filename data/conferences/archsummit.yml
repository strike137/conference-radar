notes:
- Practitioner conference for senior engineers, technical managers and architects, run by InfoQ China, part of
  Geekbang Technology
- Several city editions per year in the past (2022 Shenzhen, Beijing, Hangzhou, Chengdu; 2023 Beijing, Shanghai,
  Shenzhen); the official site lists only Shenzhen for 2024
- 2024 Shenzhen had 18 tracks, many on large models and AI infrastructure, plus architecture, high availability,
  cost and security
- Talks are curated by track producers; topic proposals go to the organizer by email; no paper submission and
  no proceedings
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
