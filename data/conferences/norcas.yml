notes:
- Main circuits and systems conference of the Nordic countries, formed in 2015 by merging NORCHIP (since 1983) and the International Symposium on System-on-Chip
- Financially co-sponsored by the IEEE Circuits and Systems Society and endorsed by its VLSI Systems and Applications TC
- Covers analog, mixed-signal and digital circuit design, SoC, embedded systems, FPGA and hardware/software co-design
- Rotates among Nordic and Baltic countries (2023 Aalborg, 2024 Lund, 2025 Riga, 2026 Tampere); held in late October
- Full papers of 4 to 6 A4 pages plus an optional page of references; proceedings in IEEE Xplore
- Selected papers are invited to an extended version for a journal special section
- Not listed in ICORE2026 or the CCF list; circuits venue outside the usual CS rankings
