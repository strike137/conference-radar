notes:
- Organized by JSSM; runs a National Convention every summer and an Academic Lecture Meeting in autumn or winter,
  both hybrid in recent years
- 'National Convention accepts free-topic talks, including a student session: apply in May with a title and 100-character
  summary, then submit a preprint in July'
- Academic Lecture Meeting is invited talks only (no submissions), held at Chuo University Korakuen Campus, Tokyo
  since 2023
- In Japanese; focus is security management, risk, audit, law and policy rather than technical security
- Society journal on J-STAGE; also runs the Tsujii Shigeo Security Paper Award; locally supported WEIS 2025 in Tokyo
