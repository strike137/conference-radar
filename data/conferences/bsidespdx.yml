notes:
- Community information security and hacking conference for the Pacific Northwest, run by a 501(c)(3) nonprofit; held since 2011
- Two days (Friday and Saturday) in October at the Smith Memorial Student Union, Portland State University, Portland, Oregon
- Call for presentations on pretalx; talks are 20 minutes by default (40 on request), plus 2 hour hands-on workshops and a CTF
- Submissions are selected by a review board of local experts; beginner speakers and a 101 track are welcome
- Pay what you can registration with supporter tiers from about 10 USD (2026)
- Talks are recorded and posted on YouTube; no proceedings
