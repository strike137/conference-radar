id: icsrs
name: ICSRS
full_name: International Conference on System Reliability and Safety
type: conference
tier: minor
areas: [systems, software]
region: europe
language: english
frequency: annual
organizer: ICSRS organizing committee (general chair Enrico Zio, Politecnico di Milano and Mines Paris); technically co-sponsored by Politecnico di Milano and the IEEE Reliability Society Italy Chapter
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
indexing: [Scopus, EI]
fee: 650 USD author, 600 USD IEEE or TPC member, 575 USD student (2026)
typical:
  deadline_months: [10]
  conference_months: [11]
links:
  website: https://www.icsrs.org/
notes:
- Reliability and safety engineering venue (fault diagnosis, risk analysis, prognostics, maintenance, software reliability, ML for reliability)
- Proceedings of every edition since 2016 in IEEE Xplore, indexed by Scopus and EI Compendex
- Held in Italy every year (Palermo 2021, Venice 2022, Bologna 2023, Catania 2024, Turin 2025, Rome 2026); no edition in 2020
- Papers 4 to 10 pages in IEEE format; one registration covers 5 pages, 50 USD per extra page
- Abstract-only submissions are presented but not published
- Selected 2024 papers recommended to a special issue of the MDPI Journal of Nuclear Engineering
- ESRA offers four 575 USD scholarships for in-person PhD student presenters (2026)
- Not listed in CORE ICORE2026 or the CCF list
