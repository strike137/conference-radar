id: icsrs
name: ICSRS
full_name: International Conference on System Reliability and Safety
type: conference
tier: minor
areas: [systems, ai]
region: europe
language: english
frequency: annual
organizer: ICSRS organizing committee (general chair Enrico Zio), technically co-sponsored by Politecnico di Milano and the IEEE Reliability Society Italy Chapter
proceedings: IEEE Xplore
archival: true
indexing: [Scopus, EI]
typical:
  conference_months: [11]
links:
  website: https://www.icsrs.org/
notes:
- Annual conference on reliability and safety of engineered systems (fault diagnosis, fault-tolerant control, risk
  analysis, prognostics and maintenance, ML for reliability, software reliability); 10th edition in 2026
- Proceedings in IEEE Xplore for every edition since 2016 (no 2020 edition); the site says they are indexed by Scopus and EI Compendex
- Held in Italy almost every year (Venice 2022, Bologna 2023, Catania 2024, Turin 2025, Rome 2026); Paris 2016 and Barcelona 2018
- Full papers of 4 to 10 pages in IEEE format via EasyChair; abstract-only submissions are presented but not published
- "Registration fee: 650 USD for authors, 575 USD for students (2026); one registration covers one paper of up to 5 pages"
- Selected ICSRS 2024 papers were recommended to an ICSRS special issue of the Journal of Nuclear Engineering (MDPI)
- ESRA offers four 575 USD PhD student scholarships for in-person presenters (2026)
- Not listed in CORE ICORE2026 or in the CCF 2026 list
