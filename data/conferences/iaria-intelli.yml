notes:
- Organized by IARIA as part of the InfoWare congress, co-located with ICCGI, ICWMC, VEHICULAR and other IARIA events (16th edition in 2027)
- Not related to INISTA or IEEE ASYU, which have similar names
- Covers intelligent systems, distributed and context-aware intelligence, ambient intelligence and applications
- Published open access in the IARIA ThinkMind library (ISSN 2308-4065); prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Southern Europe (Nice, Venice, Barcelona, Athens, Lisbon, Valencia in recent years)
- The 2027 edition moves from March to May
