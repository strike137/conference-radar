links:
  website: https://concepts2026.org/
notes:
- Merger of ICFCA (Formal Concept Analysis), CLA (Concept Lattices and Their Applications) and ICCS (Conceptual Structures), approved in October 2023
- Annual since 2024 in Europe (Cadiz 2024, Cluj-Napoca 2025, Montpellier 2026)
- Three tracks; journal track papers go to an International Journal of Approximate Reasoning special issue, regular track papers to Springer LNAI, Nectar track one-page summaries of recently published work
- Regular papers up to 16 pages (long) or 8 pages (short) in LNCS format; all accepted papers must be presented on site
- Not listed in ICORE2026 under CONCEPTS; the predecessor ICFCA is CORE C in ICORE2026; not checked on the CCF list
