notes:
- Annual community festival of free and open source software run by the FOSS United community (FOSS United Foundation, an Indian non-profit founded in 2020)
- Held at NIMHANS Convention Centre, Bengaluru; 2026 was the 6th edition
- Main talks, panels, lightning talks, workshops and half-day devrooms (AOSP, security, compilers, RTOS, open hardware and more), plus pre-events and a maintainer summit
- About 2500 people, 60 main sessions and 30 devroom sessions in 2025
- No papers or proceedings; talks are livestreamed and recorded
