notes:
- Run by the IEEE Malaysia IE/IA Joint Chapter and technically co-sponsored by the IEEE Industry Applications Society
- Industrial electronics, control, power and applications; revived in 2016, 2026 is the 7th edition
- Accepted papers go to IEEE Xplore and are indexed by EI Compendex (Scopus also claimed on the site)
- Selected papers (20% of accepted submissions) are invited to submit extended versions to IEEE Transactions on
  Industry Applications or IEEE IAS Magazine
- Full papers 4 to 6 pages (A4, IEEE format) via EDAS; fully onsite, at least one author must attend
- Held in hotels in Malaysia (Kuala Lumpur 2024 and 2026, Kota Kinabalu 2025); 2024 was held jointly with IEEE PECon
- Not ranked by CORE (ICORE2026); not in the CCF list
