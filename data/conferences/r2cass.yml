notes:
- Workshop on computational reproducibility in computational social science using digital behavioral data from social media and the Web
- Organized mainly by GESIS (Cologne, Germany) around its Methods Hub platform, with a hands-on reproducibility session
- 1st edition in 2025 was co-located with ICWSM, with papers in the ICWSM workshop proceedings
- 2nd edition in 2026 was a half-day workshop at The Web Conference 2026 (Dubai)
- 2026 papers go into The Web Conference 2026 Companion Proceedings in the ACM Digital Library; ACM open access APC (250 to 350 USD) may apply
- Authors who do not want their paper in the proceedings may still present it at the workshop
- Not listed in the CORE ICORE2026 portal
