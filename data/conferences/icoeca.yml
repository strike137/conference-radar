notes:
- The 2027 edition is organized by RV College of Engineering, Bengaluru, India, in hybrid mode; the host college changes between editions
- Proceedings in IEEE Xplore since 2024; 2021 to 2023 proceedings in Springer LNNS (volumes 209, 444 and 673)
- Earlier hosts were GITAM School of Technology, Bangalore (2021, 2022) and RV Institute of Technology and Management, Bangalore (2023)
- Scope covers AI, big data, cloud computing, sustainability and knowledge-based expert systems
- 7th edition in 2027
- Not found in ICORE2026; not on the CCF list
