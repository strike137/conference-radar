notes:
- Tokyo edition of the worldwide community-run DevOpsDays series; editions in 2012, 2013 and every year since 2017 except 2020
- Topics are software delivery and IT operations, including automation, testing, security and organizational culture
- Held in April at Osaki Bright Core Hall, Shinagawa, Tokyo, hybrid with online streaming
- Japanese and English talks, with simultaneous interpretation for English sessions; overseas keynote speakers
- 30 min talk and Ignite (5 min) proposals; no papers or proceedings
- "2025 edition: 249 participants, 36 sessions, 43 speakers; 2026 edition: 220 participants, 38 sessions, 48 speakers (official figures)"
