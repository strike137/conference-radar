notes:
- Congress for junior (predoctoral and postdoctoral) ICT researchers, organized by CITIC at Universidade da Coruña; held annually since 2018
- Held at CITIC in A Coruña, Spain
- Topics are AI, data science and engineering, HPC, smart services and networks, and cybersecurity
- 800-character abstract first, reviewed by two members of the scientific committee; accepted works give a 4-8 page paper in English
- Talks and posters may be in Galician, Portuguese, Spanish or English
- Work already presented elsewhere is accepted, so the book of proceedings is treated as non-archival here
- 2025 proceedings published by the UDC publishing service (DOI 10.17979/spu.23)
- Free registration
- Not listed in ICORE2026 and not on the CCF list
