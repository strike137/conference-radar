notes:
- Annual conference on network science, social and data networks, graph learning and their applications
- Renamed from Computational Data and Social Networks to Computational Science and Network Intelligence with the 15th edition (2026); acronym unchanged
- Recent editions in Hanoi (2023), Bangkok (2024), Danang (2025) and Ho Chi Minh City (2026); 2021 in Montreal and 2022 virtual (Tampa)
- Proceedings in Springer LNCS; the site states indexing in ISI CPCI-S, EI Compendex, ACM DL and DBLP
- Regular papers up to 14 pages in LNCS format (2026), submitted via Springer Meteor
- 2026 adds a journal track whose papers go directly to Journal of Combinatorial Optimization, Applied Network Science or IEEE TNSE
- Deadlines are usually extended by several weeks
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
