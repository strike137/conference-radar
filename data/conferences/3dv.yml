notes:
- Main venue for 3D computer vision and graphics (reconstruction, SLAM, geometry, rendering); successor of 3DIM and 3DIMPVT, named 3DV since 2013
- Run by a steering committee, location rotates worldwide (2022 Prague, 2024 Davos, 2025 Singapore, 2026 Vancouver, 2027 Thessaloniki)
- No 2023 edition; the conference moved from autumn to spring, so 3DV 2023 became 3DV 2024
- Proceedings in IEEE Xplore; papers limited to 8 pages plus references, double-blind review on OpenReview
- In person only; every accepted paper needs an on-site presenter or it is removed from the proceedings (2026)
- Not listed in ICORE2026; CCF C (computer graphics and multimedia)
- Nectar track presents 3D papers already accepted at top venues (CVPR, ICCV, ECCV, NeurIPS, SIGGRAPH, ...)
