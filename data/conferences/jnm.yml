organizer: French-speaking microwave community with a rotating host lab (IEMN Lille and UCLouvain in 2026)
organizer_country: [europe]
proceedings: None (participants only)
archival: false
fee: "630 EUR regular, 520 EUR unsponsored PhD student, free for a PhD student sponsored by a supervisor (2026, early, incl. VAT)"
typical:
  deadline_months: [12]
  conference_months: [5, 6]
links:
  website: https://jnm2026.sciencesconf.org/
notes:
- French national microwave conference held every two years, about 500 to 600 researchers, PhD students and engineers from academia and industry
- "Five tracks: antennas and propagation, passive devices, active devices, systems and characterization, emerging technologies"
- Short papers of at most 3 pages; oral and poster sessions in French
- Proceedings are downloadable by registered participants only, so marked non-archival here
- Preceded by a thematic day (embedded AI in 2026) and an industrial exhibition runs alongside
- Held in a different French city each edition (Limoges 2022, Antibes 2024, Lille 2026); next edition announced for Brest in 2028
- Not listed in CORE ICORE2026 or in the CCF 2026 list
