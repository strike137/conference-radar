id: cicba
name: CICBA
full_name: International Conference on Computational Intelligence in Communications and Business Analytics
type: conference
tier: minor
areas: [ai, data, communications, networking]
region: south-asia
language: english
frequency: annual
organizer: Hosting Indian university (2026 -> Department of Computer Science, University of Gour Banga), technically
  sponsored by the IEEE Computational Intelligence Society Kolkata Chapter
organizer_country: [india]
proceedings: Springer CCIS
archival: true
indexing: [Scopus, DBLP]
fee: 'INR 8,000 (Indian academic presenting author) or 300 USD (foreign presenting author) (2026)'
typical:
  deadline_months: [5, 6]
  conference_months: [7, 9]
links:
  website: https://cicba.in
notes:
- Held in eastern India, mostly West Bengal (Kolkata, Kalyani, Santiniketan, Malda); 2022 in Silchar and 2024 at NIT Patna
- All editions published in Springer Communications in Computer and Information Science (CCIS)
- Editions in 2017, 2018 and yearly since 2021; 8th edition in 2026
- Camera-ready papers up to 15 pages in Springer format, 2 extra pages allowed for a fee
- At least one author must register and present for the paper to be included in the proceedings
