notes:
- ML venue workshop bridging the AI/ML and wireless communities (6G, WiFi 9, O-RAN, AI-native protocols)
- 1st edition at NeurIPS 2025 (San Diego, 61 accepted papers), 2nd at ICML 2026 (Seoul)
- Non-archival with no formal proceedings; papers under submission elsewhere are allowed
- Technical papers up to 6 pages, position papers up to 4, demo papers up to 2; double-blind review on OpenReview
- Best Paper and Runner-up awards sponsored by Qualcomm
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
