notes:
- Flagship community conference of the PyTorch Foundation on open source AI (PyTorch, vLLM, DeepSpeed, Ray and other
  Foundation projects), run on the Linux Foundation events platform
- Held in San Francisco in 2023, 2024 and 2025; renamed PyTorch Conference North America and moved to San Jose in 2026
- Talks chosen through an open call for sessions on Sessionize; posters have a separate call with different deadlines
- 2026 edition reported 3,500+ attendees and 200+ talks and posters; academic (full-time student or faculty) tickets were 249 USD
- No papers or proceedings; session recordings go to the PyTorch YouTube channel and slides are linked from the schedule
- Not listed in CORE ICORE2026
