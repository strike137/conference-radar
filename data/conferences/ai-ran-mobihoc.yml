notes:
- Workshop on AI-native RAN design (foundation models, GenAI, LLMs, agentic AI, RIC-based control, digital twins,
  testbeds), first held with ACM MobiHoc 2026 in Tokyo
- Not the same as the IEEE INFOCOM 6G AI-RAN workshop (6g-ai-ran) or the MobiCom Open-AI RAN workshop
- Papers up to 6 pages in ACM double-column format; submission via HotCRP
- Accepted papers go into the ACM MobiHoc 2026 proceedings; one full registration per paper; ACM open access APC
  (250 USD members, 350 USD non-members in 2026) applies outside ACM Open institutions
- Not listed in the CORE portal (ICORE2026) or the CCF list
