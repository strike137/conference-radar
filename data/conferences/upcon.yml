id: upcon
name: IEEE UPCON
full_name: IEEE Uttar Pradesh Section International Conference on Electrical, Electronics and Computer Engineering
type: conference
tier: minor
areas: [general, communications]
region: south-asia
language: english
frequency: annual
organizer: IEEE Uttar Pradesh Section, hosted by a different institute in Uttar Pradesh each year
organizer_country: [india]
proceedings: IEEE Xplore
fee: About 10,800 to 15,520 INR for Indian authors, 375 to 495 USD for foreign authors (2025)
typical:
  deadline_months: [8, 9]
  conference_months: [12]
links:
  website: https://upcon2026.in/
notes:
- Flagship conference of the IEEE Uttar Pradesh Section, technically and financially sponsored by the section;
  annual since 2014
- Rotates among host institutes in Uttar Pradesh (GCET 2014, IIIT Allahabad 2015, IIT BHU 2016, GLA 2017, MMMUT
  2018, AMU 2019, MNNIT 2020, BTKIT Dwarahat 2021, IIIT Allahabad 2022, Amity 2023, SRMCEM 2024, IIT BHU 2025,
  IIT Kanpur 2026)
- Proceedings in IEEE Xplore
- Broad EE scope with a strong power and energy focus (power systems and smart grid, power electronics and drives,
  control, communication and signal processing, VLSI, applied machine learning)
- Papers up to 6 pages including references, single-blind review via Microsoft CMT
- Also runs a PhD colloquium and student travel awards
