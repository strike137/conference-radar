organizer: Workshop organizing committee (Fraunhofer IGD, University of Ljubljana, Johns Hopkins University, University of North Texas, Unicamp, Drexel University and others); co-located with WACV
organizer_country: [europe, usa]
proceedings: IEEE Xplore and CVF Open Access (WACV Workshops proceedings)
