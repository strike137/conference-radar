  website: https://sites.google.com/view/synrdinbaswacv2027
notes:
  - Workshop on the generation, use, evaluation and forensic analysis of synthetic data in biometrics, including deepfakes and face morphs
  - Held with WACV 2025 and WACV 2026 (Tucson), and with WACV 2027 (Orlando)
  - The WACV 2026 edition ran together with a synthetic data detection challenge
  - Papers up to 8 pages in WACV format; accepted papers appear in the WACV Workshops proceedings and IEEE Xplore
  - Submissions on OpenReview in 2027 (CMT in 2026)
  - 10 papers in the WACV 2025 and 8 in the WACV 2026 workshop proceedings on CVF Open Access
  - In-person event; every accepted paper needs an author registration
  - Not listed in ICORE2026 or the CCF list
