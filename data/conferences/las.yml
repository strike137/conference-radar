notes:
- ACM conference on large-scale, technology-mediated learning (MOOCs, intelligent tutoring, learning analytics, AI in
  education); 2026 was the 13th edition
- Proceedings in the ACM Digital Library
- CORE B (ICORE2026); not on the CCF list
- Research papers up to 10 pages, work in progress up to 4 and demos up to 2 (excluding references), ACM 2-column
  template, double-blind review
- Abstract one week before the paper deadline; the 2026 organizers announced no deadline extensions
- 2026 edition held at COEX, Seoul as part of the Festival of Learning with AIED and EDM; the 2027 Festival of Learning
  with AIED and EDM is planned in Adelaide, Australia
