notes:
- New CCS workshop on LLM and large-model security, first held in 2024 (Oct 14, Salt Lake City); the 2024 name said
  "Privacy and Safety Analysis" (still used on the CCS 2026 workshop list), the workshop site now says "Privacy
  and Security Analysis"
- Proceedings in the ACM Digital Library; research and SoK papers up to 8 pages of body text, short and position
  papers up to 4 pages
- 2026 edition focuses on agentic AI security and formally grounded defenses
- Organizers report over 80 attendees at each of the 2024 and 2025 editions; 2025 was held in Taipei with CCS
