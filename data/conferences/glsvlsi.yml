notes:
- Sponsored by ACM SIGDA with IEEE CEDA as technical sponsor; proceedings in the ACM Digital Library
- Broad VLSI scope (circuits, EDA, testing and reliability, emerging and post-CMOS technologies, hardware security)
- Blind review; 6-page papers, up to 8 pages with an extra page fee; references count toward the limit
- Papers are accepted as regular or poster presentations; at least one author must register by camera-ready
- Smaller venue that is easy for students to attend; also has special sessions, late-breaking results and a workshop
- Held in the USA in recent years (Irvine 2022, Knoxville 2023, Tampa Bay 2024, New Orleans 2025, Canandaigua 2026)
- 2026 edition co-located with IGSC 2026
- ACM is fully open access from 2026, so authors outside ACM Open institutions may pay an APC
- Not listed in ICORE2026; CCF C
