notes:
- Half-day or full-day workshop at SC on large-scale AI models and agentic systems for science, run by the international Trillion Parameter Consortium
- Title changes each year; 2026 title "Building Open AI Infrastructure, Models, and Agentic Systems for Science" (4th edition)
- Papers limited to 5 content pages in IEEE format, references and appendices excluded; presented as 15-minute lightning talks
- Double-blind review following the SC process; teams spanning institutions, disciplines and countries are prioritized
- Accepted papers appear in the SC Workshops Proceedings
- "Acceptance: 10 of 40 (2026), 12 of 26 (2025)"
- TPC also runs workshops at ISC and SCA and quarterly hackathons
- Not listed in CORE ICORE2026; not on the CCF 2026 list
