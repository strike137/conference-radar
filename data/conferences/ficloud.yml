id: ficloud
name: FiCloud
full_name: International Conference on Future Internet of Things and Cloud
type: conference
tier: minor
areas: [networking, systems]
region: worldwide
language: english
frequency: annual
organizer: FiCloud organizing group led by Muhammad Younas (Oxford Brookes University); technically co-sponsored by
  IEEE Computer Society
organizer_country: [europe]
proceedings: IEEE CPS (IEEE Xplore)
archival: true
typical:
  deadline_months: [3, 4]
  conference_months: [7, 8]
links:
  website: https://ficloud.org/2026/
notes:
- Held since 2013, mostly around Europe and the Mediterranean (2022 Rome, 2023 Marrakesh, 2024 Vienna, 2025 Istanbul,
  2026 Granada); 2020 and 2021 were online
- Hybrid; co-located with MobiWis and AIBB, registration handled by Easy Conferences
- Proceedings by IEEE Conference Publishing Services, submitted to IEEE Xplore; full papers 8 pages, short papers 4 to
  6 pages, IEEE two-column format, submission via EasyChair
- Technically co-sponsored by the IEEE Computer Society
- Deadlines are usually extended by a few weeks
- Not listed in ICORE2026 or the CCF 2026 list
