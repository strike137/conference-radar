notes:
- Japan's large annual robotics and mechatronics meeting, run by the Robotics and Mechatronics Division of the Japan
  Society of Mechanical Engineers (JSME)
- Almost all talks are poster and demo presentations in organized sessions; papers are 2 to 4 pages
- Presenters must be members of JSME or of a supporting society (a JSME membership pack is offered with registration)
- No peer review of papers; selected presentations can be nominated for awards and a ROBOMECH Journal special issue
- Preprints go to participants on the first day; afterwards papers are published on J-STAGE unless the authors opt out
- Very large; ROBOMECH2026 in Fukuoka had 1,610 presentations and more than 2,500 attendees
- Held around June in a different Japanese city each year (Yamagata 2025, Fukuoka 2026, Shimonoseki 2027)
