  website: https://www.acsac.org/2026/workshops/icss/
notes:
- One-day workshop held with ACSAC every December; 12th edition in 2026
- Papers up to 10 pages (15 with references and appendices) in IEEE compsoc format; anonymous submission
- Accepted papers appear in IEEE Xplore in the ACSAC Workshops volume
- Deadline usually late August, extended to September; small program (8 papers in 2025) with keynote and panel
- Japanese groups present here too (Hitachi and Yokohama National University papers in 2025)
