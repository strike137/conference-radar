notes:
- Technically sponsored by the Soft Computing Research Society (SCRS, New Delhi), which runs many hybrid conferences each year with Indian host institutions
- After-conference proceedings in Springer Lecture Notes in Networks and Systems (LNNS); two volumes for 2024 and three for 2025
- Hybrid (in-person and online); hosted by Dr. B. R. Ambedkar Institute of Technology, Andaman and Nicobar in 2024 and by NIT Agartala from 2025 to 2027
- Submission via Microsoft CMT
- High-volume event; not listed in CORE ICORE2026 and not on the CCF list
