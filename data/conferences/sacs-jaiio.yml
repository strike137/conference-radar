notes:
- Cybersecurity and cyberdefense symposium within JAIIO, the annual informatics conference of SADIO, the Argentine computing society
- Covers security management, digital identity and biometrics, forensics, incident handling, critical infrastructure, AI for cybersecurity, blockchain, cybercrime, disinformation and cyberdefense
- Aimed at both academics and practitioners; besides papers it has workshops, panels and invited talks
- Uses the JAIIO rules for paper types, single-blind review and deadlines; Spanish, Portuguese or English
- Accepted papers must be presented (in person or by an authorized representative) to appear in the proceedings
- Proceedings published as a SACS issue of the JAIIO Memorias (2025 is Vol. 11 No. 7)
- Held with JAIIO in Argentina (Buenos Aires 2025, La Plata 2026)
- Not listed in CORE ICORE2026
