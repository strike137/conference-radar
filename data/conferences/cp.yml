notes:
- Flagship conference of the Association for Constraint Programming
- Proceedings in LIPIcs (open access, Dagstuhl) since 2021; Springer LNCS before that
- CORE A (ICORE2026), CCF B
- Technical and application tracks; abstract registration a week before the paper deadline, then an author rebuttal
- Often co-located (SAT, SoCS and SMT in Glasgow 2025; part of FLoC in Haifa 2022 and Lisbon 2026)
- Rotates worldwide, mostly Europe (Montpellier 2021, Haifa 2022, Toronto 2023, Girona 2024, Glasgow 2025, Lisbon 2026)
