notes:
- Large hacker and security conference in Central and Eastern Europe, held in Bucharest, Romania
- About 2,200 attendees in 2025; the 2026 edition is the 16th
- Hacking Village with competitions including the DefCamp Capture the Flag (D-CTF)
- CFP via Sessionize with three rolling deadlines; speakers chosen first in, first out, so submit early
- No proceedings; whitepapers or slides are optional
- Workshops run on the two days before the conference (17-18 November in 2026)
