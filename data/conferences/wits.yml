notes:
- Workshop for implementors of languages with advanced type systems (binders, unification, elaboration, tactics, error messages)
- First held in 2022 (Philadelphia); 2026 was the 5th edition; co-located with POPL (London 2024, Denver 2025, Rennes 2026)
- Contributed talks and 45-minute roundtable proposals, each with an abstract of at most 1 page (SIGPLAN acmart format)
- No published proceedings, so submitting does not conflict with other venues
- 2026 edition sponsored by Jane Street
- Not listed in CORE ICORE2026; not in the CCF 2026 list
