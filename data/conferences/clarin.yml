notes:
- Annual conference of CLARIN ERIC, the European research infrastructure for language resources and technology, aimed at humanities and social sciences users
- Submissions are 3 to 4 page extended abstracts, reviewed by the programme committee via EasyChair; oral, poster and demo presentations
- Accepted abstracts appear in the online Book of Extended Abstracts (on Zenodo in 2026)
- Authors are then invited to submit 10 to 12 page full papers, published after review in Linkoping Electronic Conference Proceedings
- Hybrid event held in a different European city each year (Barcelona 2024, Vienna 2025, Brighton 2026), co-hosted with a national CLARIN consortium
- Topics must be relevant to the CLARIN infrastructure (tools, resources, metadata, interoperability, training, LLMs for SSH research)
- Not ranked in ICORE2026 and not on the CCF list
