notes:
- Run by the Faculty of Engineering, University of Rajshahi, Bangladesh; held on the Rajshahi campus
- Successor of ICMEIE 2015 and the IC4ME2 series; ICRPSET editions in 2022, 2024 and 2026 (9th episode of the series)
- Accepted and presented IEEE-track papers are submitted to IEEE Xplore; 2022 and 2024 proceedings are in IEEE Xplore and Scopus
- Non-IEEE track papers go to the Journal of Science and Engineering Papers; selected papers are invited to a special issue of the Rajshahi University Journal of Science and Engineering
- Very broad scope from power, electronics and materials to communications, networking, AI, computer vision and security
- Full papers 4 to 6 pages A4, double-blind, submitted via Microsoft CMT
- "Registration fee (2026): USD 350 international non-student, USD 250 international student, BDT 10,000 local non-student"
- The 2026 submission deadline was extended several times, from 2026-07-20 to 2026-09-15
- Not found in ICORE2026
