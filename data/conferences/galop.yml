notes:
- Workshop on game semantics and other interaction-based models of programs, logics and proofs
- First held in 2005; GaLoP 2026 was the 17th edition
- Usually a satellite of ETAPS (Uppsala 2017, Thessaloniki 2018, Prague 2019); 2020 edition postponed; POPL 2024 in London; FLoC 2026 in Lisbon
- Informal workshop; submissions are talk abstracts of up to 2 pages (work in progress, overviews, position papers and tutorials welcome)
- No formal proceedings; abstracts are posted on the workshop website; some past editions led to special issues in Annals of Pure and Applied Logic
- Not listed in ICORE2026 or the CCF 2026 list
