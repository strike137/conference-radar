notes:
- First edition in 2026, organized by BINUS Business School (Bina Nusantara University, Indonesia)
- Business-oriented IT scope (AI for business, blockchain, fintech, cybersecurity risk, analytics, e-commerce)
- One-day hybrid event at the BINUS Bekasi campus
- Accepted papers are submitted for inclusion in IEEE Xplore, subject to IEEE scope and quality review
- Technical sponsors are the IEEE Indonesia Section and its Computer Society chapter
