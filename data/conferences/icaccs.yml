notes:
- Annual conference organized by Sri Eshwar College of Engineering, Coimbatore, Tamil Nadu, India; 12th edition in 2027
- Held at Sri Eshwar College of Engineering near Coimbatore
- The HTTPS version of the official site uses a self-signed certificate, so links use plain HTTP
- Broad scope covering computer science, AI and ML, electrical, electronics and communication engineering
- Proceedings in IEEE Xplore up to the 2024 edition; from 2026 accepted and registered papers go to the SCITEPRESS Digital Library, submitted for Scopus and Ei Compendex indexing
- No 2025 edition is listed in the official edition history
- Not listed in ICORE2026; a small regional venue
