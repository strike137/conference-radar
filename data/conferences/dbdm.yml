notes:
- Workshop of IEEE COMPSAC (IEEE Computer Society); 11th edition in 2026 in Madrid, 10th at COMPSAC 2025 in Toronto
- The first four editions were co-located with IEEE/ACM CCGRID, the later ones with IEEE COMPSAC
- Covers models, algorithms, query processing, security and analytics for big data in distributed and cloud settings
- Organized by Alfredo Cuzzocrea (University of Calabria) and Antonino Rullo (ICAR-CNR), Italy
- Not listed in the CORE portal; COMPSAC itself is CORE B
- Workshop papers are 6 pages (up to 2 extra pages at USD 125 each) and appear in the COMPSAC proceedings on IEEE Xplore
- Workshop deadlines are shared across all COMPSAC workshops; the 2027 workshop list (COMPSAC 2027 in Tokyo, July 13 to 16) was not yet published
