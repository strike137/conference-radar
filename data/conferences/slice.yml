id: slice
name: SLICE
full_name: International Workshop on Smart Living with IoT, Cloud, and Edge Computing
type: workshop
tier: minor
areas: [networking, systems, data]
region: worldwide
language: english
frequency: annual
organizer: Indian Institute of Technology Roorkee (steering committee Sateesh Kumar Peddoju, Kavitha Kadarla and Sugam Sharma of Iowa State University)
organizer_country: [india]
proceedings: IEEE Xplore (IEEE MASS workshop proceedings, IEEE Computer Society)
archival: true
typical:
  deadline_months: [7, 8]
  conference_months: [9, 10]
links:
  website: https://slice.iitr.ac.in/
notes:
- Workshop co-located with IEEE MASS (Mobile Ad-Hoc and Smart Systems) since 2020; 2018 edition was at FMEC in Barcelona and 2019 in Rome
- Run from IIT Roorkee; most of the program committee is from Indian institutes
- 2026 is the 8th edition; no edition was held in 2022
- Recent editions follow MASS around the world (Toronto 2023, Seoul 2024, Chicago 2025, Hong Kong 2026)
- 6-page papers in IEEE two-column format submitted via EDAS; accepted papers appear in the MASS proceedings in IEEE Xplore
- Registration goes through the MASS registration page
- Paper deadline is usually extended by about a month
- Six accepted papers listed for 2026
- Not listed in ICORE2026 or the CCF list
