notes:
- Annual automatic control and robotics conference held since 1994, run by the Faculty of Electrical Engineering of
  West Pomeranian University of Technology (Szczecin) with the Polish Academy of Sciences
- Held under the auspices of IEEE Robotics and Automation Society and IEEE Control Systems Society
- Proceedings in IEEE Xplore; MMAR 2010 to 2025 indexed in Web of Science and Scopus
- 'Topics: identification and modelling, signal processing, control and systems theory, robotics, intelligent systems,
  AI and machine learning'
- Papers 4 to 6 pages; online presentation possible for authors who cannot travel
- Held in Miedzyzdroje on the Polish Baltic coast in late August (2026 and 2027)
- Young Author best paper award each year
