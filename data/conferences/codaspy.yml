notes:
- Sponsored by ACM SIGSAC; single deadline per year with abstract registration one week before the paper deadline
- Anonymized submissions for research (12 pages) and dataset/tool (6 pages) papers; BlueSky and SoK tracks are by
  invitation only in 2027; rebuttal phase
- Mostly held in the USA, with recent editions in Europe (Porto 2024, Frankfurt 2026)
- Not ranked in CORE; added to the CCF list as C in March 2026; student travel grants offered in 2026
