notes:
- Annual workshop on SMT solving (decision procedures, theory combination, solver implementation, benchmarks and applications in verification, synthesis and testing)
- Held since 2007 (preceded by the PDPAR workshops 2003 to 2006); SMT 2026 was the 24th edition
- 'Always a satellite of an automated reasoning or verification conference: CAV, IJCAR, CADE or SAT (2026 -> IJCAR at FLoC 2026)'
- Recent locations rotate between Europe, North America and Israel (2021 online, 2022 Haifa, 2023 Rome, 2024 Montreal, 2025 Glasgow, 2026 Lisbon)
- Three categories, all peer-reviewed; original papers up to 12 pages, extended abstracts up to 10 pages, and presentation-only papers that are not published
- Proceedings in open-access CEUR-WS (SMT 2023 -> Vol-3429, SMT 2024 -> Vol-3725, SMT 2025 -> Vol-4008 jointly with PoS)
- Morgan Deters Travel Award for students
- Not listed in ICORE2026 or the CCF list
