links:
  website: https://blackboxnlp.github.io/
notes:
- Workshop on interpretability and analysis of neural NLP models and LLMs (probing, mechanistic interpretability, steering, explanation methods)
- Held every year since 2018, at EMNLP every year except ACL 2019
- Ninth edition at EMNLP 2026 in Budapest, Hungary, on October 29, 2026; 2025 edition at EMNLP 2025 in Suzhou, China
- Full papers (up to 8 pages) and reproducibility track papers (up to 6 pages) appear in the ACL Anthology; 2-page extended abstracts are non-archival
- Direct submissions and ARR commitments through OpenReview; double-blind review for archival papers
- Large for a workshop (86 posters across two sessions in 2026)
- Not ranked in ICORE2026 and not on the CCF list
