organizer: Workshop organizing committee (2026 organizers from Technion, Boston University, Rice University, University of Amsterdam, Northeastern University, University of Zagreb and University of Groningen); co-located with EMNLP
organizer_country: [usa, europe, other]
proceedings: ACL Anthology
