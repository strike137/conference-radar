notes:
- Formerly the International Conference on Communication and Network Technology; renamed for 2026 and the site now writes icICCNT
- Annual since 2017 and held in Europe (Zurich 2017, Stockholm 2018, Amsterdam 2019, virtual 2020 and 2021, Paris 2022, Madrid 2023, Florence 2024, Amsterdam 2025, Paris 2026)
- Run by a China based conference secretariat with European universities as nominal organizers; submission via zmeeting.org
- 2023 and 2024 papers appeared as post-proceedings in Springer LNDECT; 2021 papers went to the Journal of Communications
- Selected extended papers are recommended to the Journal of Communications (JCM)
- Hybrid format with onsite and online sessions; abstract only presenter and listener registration are also offered
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
