notes:
- Interactive workshop on user simulation for evaluating search, recommendation and conversational systems
- Held at SIGIR 2024 (Washington D.C.) and SIGIR 2025 (Padua)
- 2024 took two-page extended abstracts for lightning talks, editorially reviewed; presenters were invited as co-authors of a SIGIR Forum report
- 2025 ran a micro shared task (search session and conversational simulation) with short lab notes instead of a paper call
- Aims to prepare a TREC or CLEF campaign on user simulation
- No 2026 edition announced on the official site as of November 2026
- Not ranked in ICORE2026 and not on the CCF list
