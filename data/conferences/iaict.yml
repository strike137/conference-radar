notes:
- Organized and sponsored by the IEEE ComSoc Indonesia Chapter; committee mostly from Telkom University
- Held every July in Bali, Indonesia (2021 to 2023 virtual); hybrid with an online presentation option
- Proceedings in IEEE Xplore every year since 2019 (also 2014), indexed by Scopus
- Broad scope covering Industry 4.0 and IoT, AI and machine learning, and communications and networking
- Submission via EDAS; up to 7 pages in IEEE format; one registration covers one paper only
- Not listed in ICORE2026 or the CCF list; regional venue with a large international TPC
- 2026 program schedule was shared with ICSigSys
