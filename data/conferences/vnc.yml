notes:
- Run by IEEE ComSoc with IEEE ITSS; describes itself as the primary venue for vehicular networking, V2X
  communications and connected and automated driving
- Held since 2009 (2026 was the 17th edition); no edition in 2022; moved from November or December to a spring or
  June slot from 2023
- Rotates between Europe, North America and Asia (2024 Kobe, 2025 Porto, 2026 Montreal, 2027 Fukuoka)
- Proceedings in IEEE Xplore; full papers up to 8 pages, short papers up to 4 pages, posters and demos 2 pages
- Not double-blind; submission via EDAS; at least one author must present in person
- Paper deadlines are extended in steps every year (2025 and 2026 both ended with a firm deadline in mid February)
- Not listed in ICORE2026 or the CCF 2026 list
