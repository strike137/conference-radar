notes:
- Workshop co-located with IEEE CCNC in Las Vegas since 2023 (also 2021); earlier editions at IEEE SECON 2019 and 2020
  and IEEE SmartWorld 2021; no edition in 2022 or 2025
- Chairs Houbing Herbert Song (University of Maryland), Gautam Srivastava (Brandon University) and Uttam Ghosh (Meharry Medical College)
- Topics include security, trust and privacy for software-defined CPS, blockchain and SDN for critical infrastructure,
  and testbeds
- Regular papers up to 6 pages plus posters and work-in-progress; papers go into the CCNC proceedings in IEEE Xplore
- Selected papers invited to special issues of Evolutionary Intelligence and Sensors
- Not listed in ICORE2026
