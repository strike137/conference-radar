notes:
- Workshop on environmental, social and economic sustainability of 6G and on 6G as an enabler of sustainability
- Supported by the EU SUSTAIN-6G project; organizers from CEA-Leti, UC3M, KU Leuven, Ericsson, Eurescom, Nokia, DFKI
  and Orange
- First edition at IEEE ICC 2026 (Glasgow, WS-27), second at IEEE GLOBECOM 2026 (Macau, WS-39)
- Workshop papers go into the ICC or GLOBECOM proceedings and IEEE Xplore; no-show papers are removed
- The SUSTAIN-6G call page gave an earlier 2026-07-15 deadline; the GLOBECOM pages list 2026-08-19
- Not listed in ICORE2026 or in the CCF 2026 list
