notes:
- Long-running Thai international computer science and software engineering conference (23rd edition in 2026); host
  rotates (2023 Phitsanulok, 2024 Phuket, 2025 Chiang Mai, 2026 KMUTT Bangkok)
- Three submission rounds with separate notifications and camera-ready windows; IEEE Xplore proceedings
- Topics include Computer Security and Cryptography, Computer Networks and Communications, Blockchain and Smart
  Contract, NLP and machine learning
- Usually held in June; the 2025 edition was in November
