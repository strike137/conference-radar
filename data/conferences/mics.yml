notes:
- Regional US conference on computing and computing education, founded in 1967 for smaller colleges and universities
- Participants mostly from Iowa, Minnesota, North Dakota, South Dakota and Wisconsin; host university changes each year
- Faculty papers, student research papers, posters, nifty assignments and panels; submissions start as a 300 to 500 word abstract that is reviewed
- Student-friendly; awards for up to three student papers, plus programming and robotics contests and a cyber security workshop
- Proceedings published as a PDF on the MICS website; registration is required for publication
- Not listed in the CORE portal (ICORE2026)
- Recent hosts are Augsburg University, Minneapolis (2024, 2025) and University of Wisconsin-Eau Claire (2026)
