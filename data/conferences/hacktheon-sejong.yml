notes:
- Hosted by Sejong City; Korea's National Intelligence Service was a sponsor in 2025 and co-host in 2026. Held
  annually since 2022; 2025 and 2026 at the Government Sejong Convention Center (SCC)
- Main draw is an international collegiate CTF for undergraduates (graduate students not eligible); teams of up to 4,
  online preliminary in late April, on-site final in July
- 'Divisions: Advanced (open), Beginner A (Korean nationals), Beginner B (non-Korean nationals); KRW 38 million in
  prizes across 14 teams (2026)'
- Also an AI and cybersecurity conference track with invited keynotes and policy sessions, plus a corporate exhibition
  and co-located workshops; no open call for speakers or papers, no proceedings
- Very relevant for undergraduate students; borderline as a conference since the competition is the main event
