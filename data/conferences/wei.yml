notes:
- Computing education workshop of CSBC, the annual congress of the Brazilian Computer Society (SBC); 34th edition in 2026
- Distinct from EduComp, the separate SBC symposium on computing education
- Papers of 6 to 10 pages (references and the AI-use declaration not counted), in Portuguese or English, submitted via JEMS
- Proceedings published open access in SBC OpenLib (ISSN 2595-6175) with a DOI per paper
- At least one author must register by the camera-ready deadline
- Held with CSBC in a different Brazilian city each year (Gramado 2026)
- Not listed in CORE ICORE2026
