notes:
- National meeting of the Acoustical Society of Japan, held twice a year (spring in March, autumn in September) at a
  university that changes each time; the 157th meeting is spring 2027
- Covers all of acoustics, including speech recognition and synthesis, audio and music signal processing, hearing,
  ultrasonics, noise, architectural and underwater acoustics
- 'Two-step submission: talk application with title, then a 2 or 4 page paper about two months later; no peer review is
  mentioned in the call'
- Proceedings are electronic only since the 2026 autumn meeting; participants download them with their registration
  ID (non-archival)
- English call for papers available; student presentation awards and the Awaya Prize for young researchers
