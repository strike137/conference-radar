notes:
- Biennial evolutionary computation conference run by the French community (Evolution Artificielle); 17th edition in 2026
- Non-profit conference on optimisation techniques that simulate natural evolution; 2026 focus on metaheuristics combined with reinforcement learning
- All accepted papers in the conference proceedings available before the event; selected best oral papers later in a Springer LNCS volume
- In-person presentation expected; remote talks only in exceptional cases
- Almost always held in France (Lyon 2015, Paris 2017, Mulhouse 2019, Exeter UK 2022, Bordeaux 2024, Nice 2026)
- Not listed in CORE ICORE2026 or the CCF 2026 list
