notes:
- Annual IEEE conference held at NTU Kharkiv Polytechnic Institute in Kharkiv, Ukraine, in hybrid format (7th edition in 2026)
- Broad electrical engineering scope with tracks on power and industrial electronics, power systems, biomedical engineering, electron devices and nanotechnology, computer science (networks, cybersecurity), computational intelligence and engineering management
- Accepted papers that are presented are submitted to IEEE Xplore (Scopus and Web of Science); no-show papers are excluded
- Submission via Microsoft CMT; papers are screened with iThenticate and rejected above 30% similarity
- "Fees (2026): 250 EUR IEEE members, 300 EUR non-members, 150 EUR IEEE students, 200 EUR other students; discounted UAH rates for Ukrainian participants"
- Not listed in CORE ICORE2026
