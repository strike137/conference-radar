notes:
- Long-running volunteer-led hacker conference run by the nonprofit Nashville2600; 2026 is the 27th edition
- Held in late fall (first or second weekend of November) at the Clarion Inn in Murfreesboro, Tennessee, about 30 minutes from Nashville
- Small event, attendance typically under 200 (178 in 2025)
- Two days with 18+ hours of talks, a CTF and hardware hacking; talks are submitted through a Google form
- Talk recordings are linked from a YouTube playlist on the site; no proceedings
- Very low student price, so a realistic option for students in the US Southeast
