notes:
  - Workshop on event cameras combined with generative AI, subtitled Transforming Perception and Visual Innovation
  - 1st edition at WACV 2025 and 2nd at WACV 2026, both in Tucson
  - Full papers go in the WACV workshop proceedings and IEEE Xplore; short papers and extended abstracts get a light review and are posted on arXiv only
  - Submissions on OpenReview in 2026 (CMT in 2025)
  - 5 papers in 2025 and 4 in 2026 in the WACV workshop proceedings on CVF Open Access
  - Not listed in ICORE2026 or the CCF list
