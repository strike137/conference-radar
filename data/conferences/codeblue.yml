notes:
- Japan's main international hacker and security conference in Tokyo; first held in February 2014, in October or
  November since 2015 and in November since 2023 (Bellesalle Takadanobaba in 2025 and 2026)
- Talks in English and Japanese with Japanese-English simultaneous interpretation (except some talks); CFP via Sessionize
  closes on July 31 (23:59 JST)
- Has a Youth Track (U25) with R&D grants up to 500,000 JPY, plus a student staff volunteer program
- Speakers get an honorarium (50,000 JPY for main tracks) and travel support; overseas speakers get round-trip economy
  airfare and 3 hotel nights (not for Bluebox)
- Tracks include Technical, General, Counter Cyber Crime, Law and Policy, Bluebox (open-source tools and projects)
  and Youth
