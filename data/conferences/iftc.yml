notes:
- Run by the Shanghai Image and Graphics Association (SIGA); the forum site calls it the International Forum of Digital Multimedia Communication
- Revised selected papers in Springer CCIS "Digital Multimedia Communications", two volumes per year recently (IFTC 2025 -> CCIS 2901 and 2902)
- Papers of 12 to 15 pages in Springer CCIS format, submitted through Microsoft CMT
- Extended versions of excellent papers recommended to the journal Displays
- Recent editions in Beijing (2023), Hainan (2024), Taiyuan (2025) and Qingdao (2026)
- Deadlines are usually extended by about a month
- Not listed in CORE ICORE2026
