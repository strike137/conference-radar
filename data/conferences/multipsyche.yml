notes:
- Workshop on language and multimodal models for mental health assessment and psychotherapy across modalities, languages and cultures
- First edition held with AACL-IJCNLP 2026 in Hengqin, China on November 9 2026
- Archival papers (long up to 8 pages, short up to 4) appear in the ACL Anthology (2026.multipsyche-1); a non-archival track takes 2 to 4 page extended abstracts
- Direct submissions with two-way anonymized review, or commitment of papers already reviewed in ACL Rolling Review
- Runs a mentorship program and the PsychEthicsEval shared task
- Not listed in ICORE2026 and not on the CCF list
