notes:
- Run yearly by FILKOM, Universitas Brawijaya; 11th edition in 2026
- Held in Malang, Bali and Kuala Lumpur in recent years (2023 Bali, 2024 Kuala Lumpur, 2025 Bali, 2026 Malang)
- Proceedings in IEEE Xplore for 2017 to 2019 and in ACM ICPS (ACM DL) from 2020 to 2023
- For 2026 the site says the proceedings are still under consideration at a publisher and asks for the Springer
  proceedings template; selected papers go to the JTI and JITeCS journals
- Submission via EDAS, double-blind review, no-show papers are dropped from the proceedings
- Broad scope (AI, data science, vision, NLP, robotics, security and networking, health informatics, GIS)
- Run back to back with the FILKOM national seminar SENTRIN and the ICOMIT conference
- Not listed in ICORE2026 or in the CCF 2026 list (no rank)
- "All deadlines are in GMT+7 (2025 and 2026)"
