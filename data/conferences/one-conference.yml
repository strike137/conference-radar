notes:
- International cybersecurity conference run by the Dutch National Cyber Security Centre with the Ministry of Economic Affairs and Climate Policy and The Hague Municipality; ECP supports logistics
- Hosted in the Netherlands since 2013 as the successor of the Govcert symposium (since 2002); now held at the World Forum in The Hague during the Cybersecurity Week
- Two days with a plenary main stage plus breakout tracks (law enforcement, research, governance, technical), an Expo and a Talent Hub
- Call for participation for talks, workshops and other session formats opens in March; selection results at the end of May
- Non-commercial (no sponsorship packages) and attendance is by invitation; others can request an invitation through the registration page
- No proceedings; transcripts, highlights and some recordings are posted in the RecapHub
