links:
  website: https://identity-aware-ai.github.io/
notes:
- Interdisciplinary workshop on how the identities of people behind and in texts should be handled in AI and NLP (perspectivism, fairness, bias, sociodemographics in LLMs)
- 1st edition with ECAI 2025 in Bologna (proceedings CEUR-WS Vol-4136, 13 of 16 submissions accepted); 2nd edition with LREC 2026 in Palma de Mallorca
- 2026 proceedings published by ELRA in the ACL Anthology (2026.iaai-1)
- Papers 4 to 8 pages excluding references, LREC format, double-blind review
- Not listed in ICORE2026 and not on the CCF list
