notes:
- Half-day workshop on accurate scientific computing on low-precision hardware (mixed precision, FP64 emulation and Ozaki schemes, posits, numerical stability), held with SC26 in Chicago
- Technical papers of 4 to 8 pages (excluding references) in IEEE two-column format, double-blind review, at least 3 reviews per paper
- Accepted papers are published in the SC Workshops Proceedings
- SC26 appears to be the first edition; the site gives no edition number
- Not listed in CORE ICORE2026
