notes:
- ICSE workshop connecting software engineering research with research software and research software engineers (RSEs)
- 1st edition at ICSE 2026 in Rio de Janeiro (2026-04-14); 2nd edition at ICSE 2027 in Dublin
- Organizers include Jeffrey Carver, Daniel S. Katz, Stephan Druskat and Nasir Eisty
- Extended abstracts only (2 pages in 2026, up to 4 pages in 2027), single-blind review
- 2026 abstracts in the ICSE proceedings under ACM open access (APC free); 2027 abstracts published by IEEE in the ICSE 2027 Companion Proceedings
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
