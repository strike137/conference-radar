links:
  website: https://conf.researchr.org/home/icse-2027/sers-2027
notes:
- ICSE workshop bringing software engineering researchers and research software engineers together
- Grew out of Dagstuhl Seminar 24161 on Research Software Engineering (April 2024); 1st edition at ICSE 2026 in Rio de Janeiro
- Extended abstracts only, single-blind review by at least two PC members (2 pages in 2026, 4 pages in 2027)
- 2026 abstracts appeared in the ACM ICSE workshop proceedings (APC free); 2027 abstracts go to the IEEE ICSE 2027 Companion Proceedings
- 2027 edition is held with ICSE 2027 in Dublin, Ireland (25 April to 1 May 2027); the exact workshop day is not yet listed
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
