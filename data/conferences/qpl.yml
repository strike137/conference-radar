notes:
- Conference on logical, algebraic, compositional and categorical methods for quantum theory, quantum computing and quantum foundations
- Started in 2003 as the Workshop on Quantum Programming Languages; a full conference since 2016
- Three submission types; proceedings papers (5 to 12 pages, EPTCS style), talk proposals (3 page summary of a separate paper) and posters
- Proceedings papers published in Electronic Proceedings in Theoretical Computer Science (EPTCS) after the conference
- Best Student Paper award; weekend tutorials before the conference and a career fair with industry sponsors
- Mostly held in Europe (Gdansk 2021, Oxford 2022, Paris 2023, Buenos Aires 2024, Varna 2025, Amsterdam 2026)
- Not listed in CORE ICORE2026
