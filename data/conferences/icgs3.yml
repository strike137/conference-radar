notes:
- Interdisciplinary security, safety and governance conference chaired by Prof. Hamid Jahankhani; 2026 is the 17th edition
- 2026 theme is "Harnessing Space for the Benefit of Humanity" (space, satellites, AI, cyber security, digital forensics, governance)
- Two-step submission, a 250-word abstract first and then an 8 to 10 page full paper in the Springer LNCS template
- Double-blind review by the programme committee, at least two reviewers per paper
- 2026 edition is fully virtual over two days, hosted by MLA College UK in London
- 2026 papers are published by Springer in the Space Law and Policy series
- "Registration fee: 240 GBP for authors, 200 GBP for PhD students (2026)"
- Not listed in CORE ICORE2026
