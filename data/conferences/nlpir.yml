organizer: Asia Society of Researchers (ASR) conference secretariat (nlpir@asr.org, China phone contact) with General Chair Herwig Unger (FernUniversität in Hagen)
organizer_country: [china]
proceedings: Springer LNNS (post-proceedings, since 2025; ACM ICPS in the ACM DL up to 2024)
archival: true
indexing: [EI Compendex, Scopus]
fee: 520 USD early bird before 2026-09-30, 550 USD after (2026, lowest author category); 15 pages included, 50 USD per extra page
typical:
  deadline_months: [10]
  conference_months: [12]
links:
  website: https://www.nlpir.net/
notes:
- Annual since 2017; Bangkok 2018 (September), Tokushima 2019 (June), held in December since 2020; virtual 2020 and 2021, Bangkok 2022, Seoul 2023, Okayama 2024, Fukuoka 2025, Nara 2026
- Commercially run conference secretariat (Asia Society of Researchers, co-organizer of NLPIR 2018 with KMUTNB); steering chairs from FernUniversität in Hagen, KMUTNB and Clemson University
- Papers appear as post-proceedings in Springer Lecture Notes in Networks and Systems (2025 volume ISBN 978-3-032-20896-5); 2018 to 2024 proceedings were in the ACM DL
- Full papers at least 10 pages single column; abstract only presentation without publication is also offered
- Not listed in the CORE ICORE2026 portal; no CCF rank set
