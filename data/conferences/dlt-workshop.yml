links:
  website: https://events.dimes.unical.it/dlt2025/
notes:
- Annual Italian workshop on blockchain and distributed ledgers, one of the two yearly meetings of the Italian DLT group; held in Perugia (2018), Pisa (2019), Ancona (2020), Rome (2022), Bologna (2023), Turin (2024), Pizzo (2025) and Pula, Sardinia (2026)
- Co-located with the Scientific School on Blockchain & Distributed Ledger Technologies
- Accepts regular papers, short papers, PhD student position papers and oral communications; papers reviewed by three reviewers
- Accepted regular and short papers go into CEUR-WS post-proceedings; selected papers invited to a journal special issue
- At least one author must present in person; no remote talks
- "DLT 2025: 22 papers in the CEUR-WS volume out of 53 submissions of all kinds (Vol-4105)"
- Not to be confused with Developments in Language Theory (also DLT, CORE C); this workshop is not listed in ICORE2026 or on the CCF list
