notes:
- ML workshop on time series in healthcare (wearables, sensors, medical waveforms, EHR), covering methods, foundation models, multimodal learning and clinical deployment
- "Editions: NeurIPS 2022, ICLR 2024, NeurIPS 2025 (San Diego)"
- Short papers up to 4 pages in the host conference template, double-blind review on OpenReview; in-person presentation required
- Non-archival with no formal proceedings; papers can be submitted elsewhere later
- ML4H-to-TS4H cross-submission track for full 9-page papers accepted at ML4H
- 96 papers accepted in 2025; 500 USD best paper prize sponsored by Google and Apple
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
