notes:
- First edition in 2026, co-located with AACL-IJCNLP 2026 in Hengqin, China
- AI research agents, AI for science, AI for AI, automated training, self-improving agents, and their evaluation and safety
- Long papers up to 8 pages and short, position or resource papers up to 4 pages in ACL format; three double-blind reviews on OpenReview
- All accepted papers get posters and 4 to 6 get talks; includes an evaluation and reproducibility clinic instead of a shared task
- Organizers state they plan to submit camera-ready papers to the ACL Anthology
- Not listed in ICORE2026 and not on the CCF list
