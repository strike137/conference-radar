notes:
- Organized by IARIA as part of the DataSys congress, co-located with ICIW and other IARIA events (22nd edition in 2026)
- Published open access in the IARIA ThinkMind library (ISSN 2308-4030); selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Usually held in Spain, Portugal, Italy or France; onsite and online participation offered
- The 2027 edition moves earlier to March, with the submission deadline in November 2026
