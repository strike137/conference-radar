notes:
- Flagship conference of the CCF Technical Committee on Information Systems; 2026 was the 23rd edition
- The CCF C ranked "WISA" (Web Information Systems and Applications); not the Korean WISA on information security applications
- Accepts Chinese and English papers; English papers (Springer LNCS format, at least 12 pages) go into the Springer LNCS proceedings, EI indexed
- Selected Chinese papers are recommended to Chinese journals such as Journal of Computer Research and Development (with a second review)
- Double-blind review in 2026; at least one author of each accepted paper must register and present
- Also has a system demo track and a poster session; topics include information system architecture, data management, large models and knowledge graphs
- Hosted by a different Chinese university each year (Xi'an 2025, Kunming 2026)
- Not ranked in CORE ICORE2026
