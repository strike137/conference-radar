notes:
- European privacy and data protection conference running since 2012; brings together researchers, policymakers, lawyers, data protection authorities and industry
- Proceedings published as Springer LNCS "Privacy Technologies and Policy" (open access in 2026, LNCS 16847)
- Held in a different European city each year (2023 Lyon, 2024 Karlstad, 2025 Frankfurt, 2026 Salzburg, 2027 Tilburg)
- Interdisciplinary call covering law, policy, engineering and ethics; full papers up to 8,000 words, student and short papers up to 4,000 words, Springer LNCS style
- Abstract registration about one week before the full paper deadline; deadlines were extended by about two weeks in 2026
- Co-located with an IPEN (EDPS Internet Privacy Engineering Network) event in 2026
- Not listed in ICORE2026 (portal search returns no results)
