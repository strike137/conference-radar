notes:
- Long-running workshop on modelling and processing multiword expressions (idioms, compounds, light-verb constructions, collocations) in NLP, held since 2003
- Organised by the SIGLEX-MWE section of ACL SIGLEX and co-located with a major *CL conference each year
- Recent editions were MWE 2023 at EACL in Dubrovnik, MWE-UD 2024 at LREC-COLING in Torino, MWE 2025 at NAACL in Albuquerque and MWE 2026 at EACL in Rabat
- 23rd edition (MWE 2027) is co-located with EACL 2027 in Athens, Greece
- Long (8 pages) and short (4 pages) archival papers go into the ACL Anthology; non-archival abstracts of work published elsewhere are also accepted
- Direct submissions plus a later deadline for papers with ARR reviews
- Hosts shared tasks such as PARSEME (MWE identification and paraphrasing) and AdMIRe (multimodal idiomaticity) in 2026
- Not ranked in ICORE2026 and not on the CCF list
