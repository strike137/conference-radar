notes:
- Research workshop on isogeny-based cryptography run by COSIC at KU Leuven, held every September at ESAT in Leuven
- Format is research talks in the morning and brainstorming sessions in break-out rooms in the afternoon, plus lightning talks
- No call for papers and no proceedings; talks are streamed on Zoom and some recordings go to the COSIC YouTube channel
- "Registration fee 2026: 100 EUR for master and PhD students, 200 EUR for senior participants (workshop dinner included)"
- A limited number of stipends for students, requested by email before early August
- Funded by the ERC ISOCRYPT project, which runs until 31 December 2026
- Not listed in ICORE2026 and not on the CCF list
