notes:
- Flagship conference of ACM SIGCSE on computing education (teaching and learning of computer science)
- CORE A (ICORE2026); listed in the CORE portal as "ACM Special Interest Group on Computer Science Education Conference"
- Papers published in the ACM DL under ACM Open
- Two submission rounds; round one (July) for papers, panels, special sessions and tutorials with an abstract one
  week before, round two (late September or October) for posters, demos, lightning talks, BoFs, SRC and doctoral
  consortium
- Held in a US city every year in February or March (Portland 2024, Pittsburgh 2025, St. Louis 2026, Sacramento 2027)
- Large symposium with an exhibit floor; posters and lightning talks make it easy for students to attend
