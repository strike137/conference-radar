notes:
- Yearly one-day computational linguistics conference of the Dutch and Flemish community; each edition is hosted by
  a different institution in the Netherlands or Flanders
- Submission is a 500-word abstract in English; accepted abstracts are presented as talks or posters
- No proceedings for the abstracts; authors of presented work may afterwards submit a full paper to the open-access
  CLIN Journal, reviewed by its editorial board
- Dutch language topics are especially encouraged, but other languages are welcome
- CLIN35 was held in Leuven (2025), CLIN36 in Brussels (2026)
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
