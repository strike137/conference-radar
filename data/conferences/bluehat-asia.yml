notes:
- Asian edition of Microsoft's BlueHat security conference, hosted by MSRC for the security research community
- Held in Bengaluru, India in November 2025 and in Singapore in September 2026
- CFP asks only for a title and abstract; a formal academic white paper is not required
- Speakers can co-present with a Microsoft technical expert
- Non-archival talk conference with no published proceedings
