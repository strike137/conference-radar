notes:
- Cyber defense and cyber security policy conference in Tokyo, started in 2018 with NATO Science for Peace and Security
  funding
- Run by the Organization for Cyber Defense Innovation, a Tokyo association of industry, government and academic members
- Speakers include ministers, cyber ambassadors, military cyber commanders, ethical hackers and researchers; about 50
  speakers and about 1,000 attendees per edition
- Japanese and English with simultaneous interpretation subtitles; onsite plus on-demand archive streaming
- Programme of keynotes, regional panels, tabletop exercises and academic poster sessions; no call for papers and no
  proceedings
- Supported by Japanese ministries (MOFA, MOD, METI, MIC) and many European and US embassies; ISC2 CPE eligible
- Two-step registration with ID check at the door; organizers may refuse registration for security reasons
- Not listed in CORE ICORE2026 or the CCF list
