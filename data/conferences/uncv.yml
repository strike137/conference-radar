organizer: Workshop organizing committee (NVIDIA, AMIAD, valeo.ai, Inria, Aalto University, KTH, NUS, Koc University)
organizer_country: [international]
proceedings: Host conference workshop proceedings (ECCV Workshops in Springer LNCS for 2026; CVPR Workshops for 2025)
archival: true
typical:
  deadline_months: [3, 6]
  conference_months: [6, 9, 10]
links:
  website: https://uncertainty-cv.github.io/2026/
notes:
- Workshop on predictive uncertainty, calibration, failure prediction and out-of-distribution detection in computer vision
- Held with a major vision conference every year since 2022 (ECCV 2022, ICCV 2023, ECCV 2024, CVPR 2025, ECCV 2026); 2026 is the 5th edition
- Regular papers follow the host conference format and go into the workshop proceedings; extended abstracts (up to 4 pages) are not published
- Submissions via OpenReview, all peer reviewed
- Different from the MICCAI UNSURE workshop
- Not listed in ICORE2026 or the CCF list
