notes:
- Run by the IEICE IBISML technical committee; describes itself as Japan's largest interdisciplinary machine learning
  forum
- Poster-only with no paper submission; applications are first come first served up to a cap (up to 608 posters
  planned in 2026) and the call can close early
- Program is invited talks, tutorials and organized sessions plus a large poster session; outstanding poster awards
- 2026 adds an English poster track and an International Day (Oct 28) with invited talks and organized sessions
  in English
- Student onsite fee is 4,000 JPY (2026); venue changes every year (2025 Naha, 2026 Saitama)
