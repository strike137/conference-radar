id: ihci-iadis
name: IHCI
full_name: IADIS International Conference on Interfaces and Human Computer Interaction
type: conference
tier: minor
areas: [general]
region: europe
language: english
frequency: annual
organizer: IADIS (International Association for Development of the Information Society)
organizer_country: [europe]
proceedings: IADIS Press (IADIS Digital Library)
archival: true
acceptance_rate: About 16% full papers (2025, 19 full papers from 122 submissions, published jointly with CGVCVIP and GET)
fee: 510 EUR early, 585 EUR late (2026, non member)
typical:
  deadline_months: [5]
  conference_months: [7]
links:
  website: https://ihci-conf.org/
notes:
- Part of the IADIS Multi Conference on Computer Science and Information Systems (MCCSIS), held every July; 2026 is the 20th edition
- Run by IADIS, a Portuguese association; held in Lisbon or Porto most years, Budapest in 2024, Valencia in 2026, virtual in 2020 and 2021
- Blind peer review; full papers up to 8 pages, short and reflection papers up to 4 pages, posters 2 pages
- Proceedings published by IADIS Press with ISBN and Crossref DOIs, and available in the IADIS Digital Library
- Several CFP rounds; the site lists the last-round submission and notification dates
- Best papers invited to the IADIS International Journal on WWW/Internet
- Regarded as a small, low-profile venue
- Not listed in the CORE ICORE2026 portal or the CCF list
