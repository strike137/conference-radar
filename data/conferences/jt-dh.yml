notes:
- Biennial Slovenian conference with more than 20 years of tradition (as JT since 1998); digital humanities added in 2016
- 2026 was the 15th edition, held at the Faculty of Computer and Information Science, University of Ljubljana
- Official languages are Slovene and English; presentations are in the language of the paper
- Extended abstracts (1,500 to 3,000 words) and full papers (4,000 to 6,500 words), anonymised review via EasyChair
- Separate student section with a best student paper award
- Pre-conference workshops and events the day before the main conference
