notes:
- Annual hacker, cybersecurity, AI and privacy conference in the Twin Cities (Minneapolis and Saint Paul), Minnesota
- About 1000 attendees, two or three tracks of talks plus hands-on hubs (formerly villages), CTFs and puzzles
- Held at the InterContinental Saint Paul Riverfront in 2026 and 2027
- Call for speakers runs on Sessionize; speakers get free entry, travel and hotel are not covered
- 2027 is the 5th edition (SecretCon 5); talks only, no proceedings
