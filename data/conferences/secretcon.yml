notes:
- Community run hacker and cybersecurity conference in the Twin Cities, Minnesota; describes itself as a mom and pop conference
- Three speaker tracks and over 700 attendees, plus villages, CTFs, puzzles and hands-on hardware activities
- Held at the InterContinental Saint Paul Riverfront in St. Paul for 2026 and 2027
- Talks selected through a Call for Speakers; no proceedings
- 2026 edition (SecretCon 4) was the fourth year; 2027 is SecretCon 5
