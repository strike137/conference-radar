notes:
- Half-day workshop co-located with ESORICS; first held in 2026 in Rome (not in the ESORICS 2025 workshop list)
- "Scope: phishing, scams, misinformation, online manipulation and other human-targeted threats, plus defenses
  and usable security"
- Accepted papers are published by Springer in LNCS (ESORICS workshop proceedings)
- Double-blind review; long papers up to 16 pages and short papers up to 8 pages in LNCS format, excluding references
  and appendices
- 2026 program had 9 papers and a keynote shared with the RAISE workshop
- Submission deadline was extended from June 25 to July 10 in 2026
