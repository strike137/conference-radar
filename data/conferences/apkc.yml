id: apkc
name: APKC
full_name: ACM ASIA Public-Key Cryptography Workshop
type: workshop
tier: minor
areas: [crypto, security]
region: asia-pacific
language: english
frequency: annual
organizer: Co-located with ACM AsiaCCS (ACM SIGSAC); 2026 PC co-chairs Keita Emura (Kanazawa University) and Hiraku
  Morita (University of Southern Denmark)
organizer_country: [japan]
proceedings: ACM DL
archival: true
indexing: [DBLP]
rank:
  core: Unranked
acceptance_rate: 19% (2026, 5/26)
fee: 'Via AsiaCCS workshop-only registration: USD 550 ACM member / USD 600 non-member early, plus 18% GST (2026);
  each paper needs one regular (non-student) registration'
typical:
  deadline_months: [1, 2]
  conference_months: [6, 7, 8]
links:
  website: https://iseclab.ec.t.kanazawa-u.ac.jp/en/APKC2026.html
  dblp: https://dblp.org/db/conf/asiapkc/
notes:
- One-day workshop co-located with ACM AsiaCCS since 2013 (no edition in 2015), so it moves with AsiaCCS (Singapore
  2024, Hanoi 2025, Bangalore 2026)
- Web site hosted by Kanazawa University; many authors and PC members are Japanese, and 4 of the 7 best paper awards
  listed for 2021 to 2026 went to Japanese groups
- Double-blind; short papers (8 pages plus references, 10 pages total); two-round review in which some papers get
  a resubmit-with-response-letter decision
- 'Very small: 5 of 26 accepted in 2026, 7 of 18 in 2025, 6 of 10 in 2024'
- Proceedings in ACM DL; attending requires AsiaCCS registration (workshop-only rate available)
