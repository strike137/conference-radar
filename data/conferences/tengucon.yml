notes:
  - Yearly gathering of TenguSec, a grassroots international hacker community in Tokyo (founded 2022)
  - Two days of security research talks, hands-on villages and a scavenger hunt / CTF; talks only, no papers
  - 2026 edition (TenguCon 3.0) had 13 research talks in English on AI security, hardware, RF and space, OT and defense
  - Held at Akihabara UDX Conference, Tokyo (2026); registration through Meetup
  - Optional ESP32 LoRa hardware badge sold separately
