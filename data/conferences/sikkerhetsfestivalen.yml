notes:
- Norway's largest meeting place for cyber, ICT and information security practitioners, first held in 2019
- Three-day festival in Lillehammer with talks, deep dives, lightning talks, exhibitors and evening events
- Talks in Norwegian or English, chosen through a call for presentations by track committees
- No proceedings; slides of some talks are posted on the site
