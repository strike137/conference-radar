notes:
- Full-day workshop at The Web Conference 2026 on privacy, AI, ad fraud and immersive technologies in web advertising
- Organized by the Web Standards Group at Samsung Research and Development Institute UK
- Research session with paper talks plus a brainstorming session on immersive and post-cookie advertising
- Papers 4 to 8 pages plus references in ACM double-column format, double-blind review on EasyChair
- Fast-track call for recycled WWW main conference papers, submitted with the original reviews
- Accepted papers appear in The Web Conference 2026 Companion Proceedings in the ACM Digital Library
- The 2026 workshop was listed as remote on its site, run on Dubai time
- Not listed in the CORE ICORE2026 portal
