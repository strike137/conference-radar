notes:
- Formal methods conference for state-based methods (Abstract State Machines, Alloy, B and Event-B, TLA, VDM, Z); formerly the International Conference on ASM, Alloy, B, TLA, VDM, and Z
- Proceedings in Springer LNCS
- Usually held in Europe (2023 Nancy, 2024 Bergamo, 2025 Duesseldorf, 2027 Braga); 2026 edition co-located with FM 2026 in Tokyo
- Includes a shared case study track where every method models the same real-life system
- Full papers up to 16 pages, short papers, industry papers and journal-first papers
- ICORE2026 rank C; not in the CCF list
