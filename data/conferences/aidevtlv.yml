notes:
- Commercial one-day AI engineering conference for developers, run by EventHandler (also ReactNext and NodeTLV)
- Held at the David InterContinental hotel, Tel Aviv; over 1000 attendees expected in 2026
- Two tracks, hands-on GenAI development and scaling, MLOps and infrastructure
- Talks, panels and live AI coding chosen by a content committee from a call for speakers on Sessionize
- Tickets 700 to 1110 ILS (2026); no papers or proceedings
