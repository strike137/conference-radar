notes:
- One-day workshop bringing together distributed algorithms, formal methods and programming languages researchers
- Held almost every year since 2014, usually with DISC; also with FLoC 2018 and 2022, CAV 2024 and POPL 2027
- Program of invited and contributed talks (about 30 minutes); proposals are a short abstract plus a PDF of at most 2 pages
- Non-archival with no proceedings; already submitted or published work may be presented
- 2027 is the 13th edition, in Mexico City with POPL 2027
- Not listed in the CORE portal (ICORE2026)
