notes:
- Eurographics symposium on parallel and large-scale graphics and visualization (GPU and cluster rendering, in situ visualization, out-of-core processing)
- One-day event co-located with EuroVis (Leipzig 2023, Odense 2024, Luxembourg 2025, Nottingham 2026)
- Papers are published in the Eurographics Proceedings Series and the Eurographics Digital Library
- Full papers of 8 to 10 pages and short papers up to 4 pages in Eurographics format, plus one page of references
- Submission through PCS as a EuroVis track; all deadlines AoE
- Small program (three papers in 2026); CORE C (ICORE2026); not on the CCF list
