notes:
- Run by Hillside Europe e.V. (non-profit registered in Munich); part of the *PLoP family of pattern conferences
- Papers on patterns and pattern languages in software engineering, HCI, education, organization and business; up to 20% non-computing topics
- Shepherding process from March to June, then papers are discussed in Writers' Workshops at the conference
- Proceedings in Springer LNCS (2025, 2026 and 2027 editions); final proceedings version due in September after the conference
- Always held at Kloster Irsee, Bavaria, Germany; the fee covers accommodation and all meals
- At least one unique author per paper must attend the whole conference
- "CORE rank: National: Germany (ICORE2026)"
