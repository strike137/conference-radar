links:
  website: https://archive.modref.org/
notes:
- One-day workshop on constraint modelling, model reformulation, modelling languages and automated modelling for CP, MIP, SAT and SMT solvers
- Held every year alongside the CP conference since 2002; 2026 was the 25th edition
- Follows CP around the world (Montpellier 2021 virtual, Haifa 2022, Toronto 2023, Girona 2024, Glasgow 2025, Lisbon 2026)
- Extended abstracts (2 pages), short papers (8 pages) and long papers (15 pages) in LIPIcs style; submissions need not be anonymised
- Accepted papers appear in workshop proceedings on the workshop website only, so it is non-archival
- Not listed in ICORE2026 or the CCF list
