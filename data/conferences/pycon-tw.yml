notes:
- Annual community conference for the Python programming language in Taiwan, held since 2012 and run by volunteers
- Talks of 15, 30 or 45 minutes and 1.5 hour tutorials chosen from a call for proposals with two review stages and a revision step
- Also has keynotes, a poster session, lightning talks, Young Inspires, open spaces, job listings and sprints
- Talks are recorded and uploaded to YouTube; no proceedings
- Usually held in Taipei; Tainan in 2020 and Kaohsiung in 2024
- 'Past venues: Academia Sinica 2023, Kaohsiung 2024, Taipei New Horizon 2025, Taipei Medical University 2026'
