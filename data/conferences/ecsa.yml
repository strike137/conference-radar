notes:
- Main European venue for software architecture research and practice; the European counterpart of IEEE ICSA
- CORE B (ICORE2026); not on the CCF list
- Main track and workshop proceedings published by Springer in LNCS (2025 main volume is LNCS 15929)
- Research papers up to 16 pages and short papers up to 8 pages in LNCS style; double-blind review
- Industrial track, tools and demos, doctoral symposium, journal first, open science and (since 2026) registered
  reports tracks, plus co-located workshops
- Held in Europe every September; recent hosts Prague 2022, Istanbul 2023, Luxembourg 2024, Limassol 2025, Bolzano
  2026 and Porto 2027
- In-person attendance is mandatory (2026)
