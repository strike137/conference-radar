notes:
- Small community Security BSides event in Aberystwyth, Wales, UK; a 2025 edition was held (its schedule is on the site)
- One Saturday of short talks (15 to 20 minutes), deep dives, 101 talks, foyer workshops and posters, plus a BSides lock picking workshop and a Friday social
- Talk proposals are emailed as a short abstract (max 300 words); posters are aimed at first-time presenters
- Held at Arad Goch theatre, Bath Street, Aberystwyth
- Funded mainly by ticket sales on Eventbrite, with community sponsors (2026 sponsor Tsiolkovsky Solutions); lunch is not provided and the accounts are published on the site
- No proceedings
- Not listed in CORE ICORE2026
