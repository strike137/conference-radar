notes:
- Intelligent mobile, edge and cloud computing, including edge AI, LLMs and AI agents on the mobile-edge-cloud continuum, 5G and 6G
- Formerly IEEE MobileCloud; 14th edition in 2026
- Not the ACM Internet Measurement Conference (also IMC)
- One of the co-located conferences of the IEEE CISOSE congress (with SOSE, JCC, BigDataService, DAPPS, AITest), which rotates between the Americas, Europe and Asia
- Proceedings published by IEEE Computer Society Press in IEEE Xplore, EI indexed; one author must register and present in person
- Regular papers 8 pages, short papers 6 pages, posters 2 pages (IEEE double-column); single-blind review
- Not ranked in ICORE2026 and not on the CCF 2026 list
