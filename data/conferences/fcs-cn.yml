- Mostly in Chinese cities (Chengdu 2023, Chongqing 2024, Guiyang 2025, Macau 2026); 2022 edition held in Kumasi,
  Ghana
- 2026 edition co-located with CSS 2026 in Macau (shared secretariat and venue)
- Two submission rounds in 2026; anonymous submissions in LNCS format; EasyChair
