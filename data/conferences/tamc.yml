type: conference
tier: minor
areas: [general]
region: china
language: english
frequency: irregular
organizer: TAMC Steering Committee, with a local host university each edition (Shandong University in 2026)
organizer_country: [international]
proceedings: Springer LNCS
archival: true
rank:
  core: C
typical:
  deadline_months: [6, 7, 8]
  conference_months: [9, 11]
links:
  website: https://www.cs.sdu.edu.cn/tamc2026.htm
notes:
- Theory venue started in 2006 in Beijing; steering committee includes Manindra Agrawal, Jin-Yi Cai and John Hopcroft
- Scope covers computability, complexity, algorithms, automata, quantum computing, learning theory and foundations of AI
- Proceedings in Springer LNCS for every edition since 2006
- Held mostly in China (Changsha 2020, Tianjin 2022, Hong Kong 2024, Jinan 2025, Qingdao 2026); earlier editions also in
  Japan, Switzerland, Singapore and India
- Not held every year (no edition in 2021 or 2023)
- Double-blind review, papers up to 12 pages in LNCS style including references, optional appendix
- Selected papers invited to special issues of TCS, Journal of Combinatorial Optimization and JCSS
- "Registration fee: 500 USD regular, 250 USD student or PC member (2026, early)"
- Ranked C in ICORE2026
