notes:
- Polish national Python conference, one of the PyCon family, run by members of the Polish Python community since 2008
- Held at the Silesian University of Technology Education and Congress Centre in Gliwice every year since 2022 (2020 was online)
- Talks and workshops in both Polish and English, plus PyLadies workshops and lightning talks
- 2025 edition had 43 talks (4 keynotes), 8 workshops and 2 lightning talk sessions
- Talk and workshop proposals are submitted through the registration system during a spring call for proposals
- No papers or proceedings
- 2026 was the 18th edition
