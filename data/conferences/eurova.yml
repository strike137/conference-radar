notes:
- International EuroVis Workshop on Visual Analytics; 2026 was the 17th edition, so the series began in 2010
- One-day workshop held on the Monday of EuroVis (Odense 2024, Luxembourg 2025, Nottingham 2026)
- Proceedings published by the Eurographics Association in the EG Digital Library; indexed in dblp and Scopus
- Research, application and position papers up to 5 pages plus references, submitted via PCS
- Best paper award each year; ICORE2026 C, not on the CCF 2026 list
- Steering committee from University of Konstanz, Fraunhofer IGD, University of Zurich and Link Campus University
