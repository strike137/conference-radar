notes:
- Two sister symposia held jointly every late autumn; PCSJ started in 1986, IMPS split off from it in 1996
- Run by the IEICE Technical Committee on Image Engineering with ITE Media Engineering and IEICE Signal Processing
- PCSJ covers image and video coding and standards; IMPS covers image processing, recognition, 3D, CG and AR
- All general talks are on-site poster presentations with 2-page A4 papers; residential format over three days
- Held at the Gotemba Kogen Hotel in Shizuoka in every edition from 2021 to 2026 (hybrid in 2021 and 2022, in person since 2023)
- Student paper award, best poster award and excellent paper award
- Proceedings are released to participants on the first day and sold by the secretariat afterwards; copyright stays with
  the authors
- Extended work can go to the annual IEICE Transactions special section on picture coding and image media processing
- Talk application deadline in early to mid September, extended by two to three weeks in every edition since 2021; paper
  deadline in mid to late October
