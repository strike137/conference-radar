full_name: International Conference on Foundation and Large Language Models
type: conference
tier: minor
areas: [ai, nlp]
region: worldwide
language: english
frequency: annual
organizer: Independent steering committee, technically co-sponsored by a local IEEE section
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [8, 9]
  conference_months: [11]
links:
  website: https://fllm-conference.org/2026/
notes:
- Started in 2023; technically co-sponsored by the IEEE section of the host country (IEEE Austrian Section in 2025, IEEE Spain Section in 2026)
- Accepted, registered and presented papers are submitted to IEEE Xplore; full papers up to 8 pages in the IEEE conference template
- Single-blind or double-blind submission is left to the authors
- Short, poster, position, PhD symposium and SoK tracks plus co-located workshops (GenAISE, LLMCS, PromptEng, AICS, GenAI symposium and others)
- Hybrid format; at least one author must register and present or the paper is dropped from the proceedings
- Held in Abu Dhabi (2023), Dubai (2024), Vienna (2025) and Barcelona (2026)
- Not listed in ICORE2026; not on the CCF 2026 list
