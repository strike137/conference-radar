notes:
- Workshop on vibe coding and vibe researching, that is AI-assisted and agent-led software development and research, from empirical, theoretical and visionary angles
- First edition in 2026, co-located with EASE 2026 in Glasgow
- Accepted papers published in the joint workshop proceedings in the ACM Digital Library
- Full research papers up to 10 pages; ongoing research, vision, position papers and experience reports up to 5 pages, including references, ACM format
- Single-blind review
- Organized mainly by LUT University, Finland
- The 2026 closing session looked forward to a VibeX 2027
- Not listed in the CORE portal (ICORE2026)
