notes:
- Sponsored by ACM SIGCHI; the flagship venue for human-computer interaction and the largest HCI conference
- Papers appear in the Proceedings of the ACM Conference on Human Factors in Computing Systems (ACM DL), under ACM Open
- Single deadline in September with a revise-and-resubmit phase for papers above a threshold; anonymized review
- Length counted in words (5,000 to 8,000 encouraged; under 5,000 treated as short papers; over 12,000 desk-rejected
  unless justified)
- Many other tracks (posters, interactive demos, panels, workshops, meet-ups, student research competition)
- Rotates worldwide (Barcelona 2026, Pittsburgh 2027)
