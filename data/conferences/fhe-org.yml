notes:
- One-day annual conference run by the FHE.org community of FHE researchers and developers, held in cooperation with IACR
- Co-located with Real World Crypto since 2023 (affiliated with Eurocrypt in 2022); location follows RWC (2023 Tokyo,
  2024 Toronto, 2025 Sofia, 2026 Taipei, 2027 Seattle)
- No published proceedings; talks and posters may also appear at other venues, and accepted abstracts can link a preprint
- Submissions are 2 to 4 page extended abstracts proposing a talk or poster, single-blind review via EasyChair
- 2026 received 55 submissions and accepted 10 talks and 23 posters; 2025 received 56 submissions
- Students could apply for free registration in 2025 by emailing from an academic address
- Not listed in the CORE portal (ICORE2026)
