notes:
- Workshop on rewriting and rewriting logic (Maude, CafeOBJ, ELAN) as a semantic and logical framework, verification techniques and applications
- Held since 1996, every two years; satellite event of ETAPS
- Recent editions all in Europe (Eindhoven 2016, Thessaloniki 2018, Dublin 2020, Munich 2022, Luxembourg 2024, Turin 2026)
- Regular papers up to 16 pages, tool and education papers up to 10 pages, work-in-progress up to 8 pages, Springer LNCS format
- Informal pre-proceedings at the workshop; regular, tool and invited papers published afterwards as a Springer LNCS volume (2024 -> LNCS 14953, 2022 -> LNCS 13252); ENTCS until 2008
- Selected papers often invited to a JLAMP special issue
- Not listed in ICORE2026
