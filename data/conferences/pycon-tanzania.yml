notes:
- Community-run conference of the Python community in Tanzania, backed by the Python and Django Software Foundations
- PyCon, DjangoGirls and PyData sessions under one roof; workshops, talks and sprints
- Editions in 2019 and 2020 (Dar es Salaam), 2021 (Arusha), 2022 (Zanzibar), 2024 (Dar es Salaam) and 2026 (6th); the community hosted DjangoCon Africa instead in 2023 (Zanzibar) and 2025 (Arusha)
- 2024 edition at the UDSM Main Library in Dar es Salaam, two conference days framed by workshop days
- Talks, long talks, lightning talks and 120 minute workshops chosen by a programme committee from an open call for proposals; accepted speakers get a free ticket
- 2026 tracks are web, data/AI/ML, Python core and tooling, community and education, and industry and fintech
- No papers or proceedings
