notes:
- Algorithms, theory of computation, complexity and combinatorics related to computing
- Mostly held in China and the Asia-Pacific (Tainan 2021, Shenzhen 2022, Hawaii 2023, Shanghai 2024, Chengdu 2025,
  Singapore 2026)
- Proceedings in Springer LNCS every year; papers must be presented in person to appear
- Lightweight double-blind review; 12 pages in LNCS format including references, optional appendix
- Best Paper and Best Student Paper awards
- 34 papers in the 2026 proceedings
- CCF B; ranked National China in ICORE2026
