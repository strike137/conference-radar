notes:
- Workshop co-located with ECML PKDD every year since 2023 (Turin 2023, Vilnius 2024, Porto 2025, Naples 2026)
- Run from the Structured Machine Learning group at DISI, University of Trento, with co-chairs from Pisa and other European institutions
- Topics include learning to defer and to complement, selective classification, human-in-the-loop ML, and cognitive and legal aspects of hybrid decision making
- Short papers (6 pages) and regular papers (14 pages) plus references, ECML PKDD format, double-blind review
- Accepted short and regular papers go into the Springer workshop proceedings of ECML PKDD; non-archival submissions of work published elsewhere are also accepted
- All accepted papers are presented as posters; the best ones get 15 minute talks
- Not listed in CORE ICORE2026
