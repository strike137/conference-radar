notes:
- Annual since 2017 (Singapore, Hong Kong, Shanghai, Xi'an 2020, Guangzhou 2021, Shanghai 2022, Kyoto 2023, Kuala Lumpur 2024, Shanghai 2025 and 2026)
- The 2020 to 2022 editions were held online
- Proceedings in ACM DL (ACM ICPS) from 2017 to 2023; SPIE Proceedings (SPIE Digital Library) from 2024; stated as EI Compendex and Scopus indexed
- Run by a commercial conference secretariat (iconf.org submission system, outlook.com contact) with a host university each year
- Deadlines are in GMT+8; abstract only presentation without publication is also offered
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
