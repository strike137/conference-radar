notes:
- Small symposium on accelerators, FPGAs, CGRAs, GPUs, high-level synthesis and energy-efficient heterogeneous computing, held since 2010
- Papers published in the ACM International Conference Proceedings Series (ACM Digital Library, open access)
- Steering committee with members from Japan, Europe, North America and Hong Kong; alternates between Japan and other countries (2022 Tsukuba, 2023 Kusatsu, 2024 Porto, 2025 Kumamoto, 2026 Heidelberg)
- Double-blind review; regular papers up to 12 pages, plus 4-page work in progress and Ph.D. forum papers
- Not listed in ICORE2026 or the CCF list
