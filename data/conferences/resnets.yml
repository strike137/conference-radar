notes:
- Workshop on resilience of 6G networks (fault tolerance, security, survivability, resilient PHY, RAN and network
  design) co-located with IEEE GLOBECOM
- 1st edition at GLOBECOM 2025 (Taipei), 2nd edition at GLOBECOM 2026 (Macau)
- 2026 co-chairs Aydin Sezgin, Falko Dressler, Walid Saad and Diep N. Nguyen; 2025 steering committee includes Robert
  Schober and Ness Shroff
- Accepted and presented papers go into the GLOBECOM conference proceedings and IEEE Xplore; no-show papers are
  removed
- Submissions via EDAS through the GLOBECOM workshop call
- Not listed in ICORE2026
