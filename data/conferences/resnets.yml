notes:
- Workshop on resilience of 6G wireless networks (fault tolerance, security, survivability, resilient RAN and NTN) co-located with IEEE GLOBECOM
- 1st edition at GLOBECOM 2025 (Taipei), 2nd at GLOBECOM 2026 (Macau)
- Workshop papers go into the GLOBECOM proceedings and IEEE Xplore; no-show papers are removed
- Different series from NGResNet (network management resilience workshop at NOMS/INFOCOM)
- Not listed in ICORE2026 or in the CCF 2026 list
