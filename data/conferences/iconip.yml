notes:
- Annual conference of APNNS; the 2025 Okinawa edition was held jointly with the Japanese Neural Network Society
  (JNNS) annual meeting
- Rotates around the Asia-Pacific (2023 Changsha, 2024 Auckland, 2025 Okinawa, 2026 Melbourne)
- Proceedings split between Springer LNCS and CCIS depending on review score; 12-15 pages in LNCS format (2026)
- Single-blind review via EasyChair (2026); at least one presenter must attend in person
- 'Large and inclusive: about 61% acceptance in 2024; deadline usually May with extensions, notification often delayed'
