notes:
- Established in 1969; annual conference spanning computer graphics, information visualization and HCI
- Sponsored by the non-profit Canadian Human-Computer Communications Society (CHCCS/SCDHM)
- Held in Canada (Victoria 2023, Halifax 2024, Kelowna 2025, Waterloo 2026, Winnipeg 2027)
- Papers archived in the ACM Digital Library with no publication fees
- Single-blind review; no page limit, 6 to 8 two-column ACM pages is common
- Two submission rounds in 2026; GI 2027 returns to a single review cycle with a revision phase
- In-person presentation required, no hybrid attendance
- CORE B (ICORE2026), CCF C (human-computer interaction)
