notes:
- Interdisciplinary conference on collective intelligence in human, animal, machine and hybrid systems; series since 2012 with a steering committee chaired from Northeastern University
- Full papers (up to 6,000 words) are archival in the ACM Digital Library with a meta-review and 3 external reviews; talks (formerly extended abstracts, up to 1,500 words) are non-archival
- CI track full papers can opt into fast-track consideration for the ACM Collective Intelligence journal
- 2026 was co-located and integrated with ACM HCOMP near Washington DC; 2025 in La Jolla (UC San Diego), 2024 Boston, 2023 Delft, 2022 virtual
- In-person presentation required
- Not listed in CORE (ICORE2026) or CCF
