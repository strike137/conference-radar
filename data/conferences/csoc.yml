notes:
- Fully online conference on computer science, informatics and software engineering, 16th edition in 2027
- Run by Radek Silhavy and Petr Silhavy (Tomas Bata University in Zlin, Czech Republic) on the OpenPublish platform
- Proceedings in Springer Lecture Notes in Networks and Systems (LNNS), several volumes per year (7 volumes for 2026)
- Papers up to 12 pages, blind review by at least three reviewers
- No travel cost; sister event of CoMeSySo (Computational Methods in Systems and Software) by the same organizers
- Large high-volume event; not listed in CORE ICORE2026 and not on the CCF list
