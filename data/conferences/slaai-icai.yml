id: slaai-icai
name: SLAAI-ICAI
full_name: SLAAI International Conference on Artificial Intelligence
type: conference
tier: minor
areas: [ai, nlp, vision, data]
region: south-asia
language: english
frequency: annual
organizer: SLAAI (Sri Lanka Association for Artificial Intelligence), with a rotating Sri Lankan host university
  (2026 University of Sri Jayewardenepura)
organizer_country: [other]
proceedings: IEEE Xplore
fee: 21,000 LKR (IEEE member) or 28,000 LKR (non-member) for a local non-student presenter, 18,000 or 24,000 LKR
  for a student presenter (2025); separate USD rates for foreign authors
typical:
  deadline_months: [8, 9]
  conference_months: [11, 12]
links:
  website: https://slaai.lk/icai/2026/
notes:
- Annual flagship conference of the Sri Lanka Association for Artificial Intelligence (SLAAI), founded in 2000; 10th
  edition in 2026
- Hosted by a Sri Lankan university (Kelaniya 2021 and 2022, Wayamba 2023, Kotelawala Defence University 2024, Open
  University of Sri Lanka 2025, Sri Jayewardenepura 2026); hybrid or virtual participation offered
- Proceedings in IEEE Xplore every year since 2021 (2021 to 2025 volumes confirmed via DOI)
- Full papers of up to 6 pages in IEEE format, double-blind review via Microsoft CMT
- Small regional venue; AI workshops are held the day before or after the main conference day
