notes:
- Workshop co-located with IEEE WCNC; third edition in Kuala Lumpur (2026, half day)
- Organizers from Royal Military College of Canada and Queen Mary University of London
- Topics include distributed and federated training of generative AI, edge model architectures, model compression,
  generative AI for network scheduling and resource allocation, and privacy and security of edge generative AI
- Accepted and presented papers go into the WCNC proceedings in IEEE Xplore; no-show papers can be excluded
- Workshop papers up to 6 pages (extra pages at 100 USD each); submissions via EDAS
- Not in the IEEE WCNC 2027 call for workshop papers (checked 2026-10-17)
- Not listed in ICORE2026
