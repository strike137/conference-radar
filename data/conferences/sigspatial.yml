notes:
- Premier annual conference of ACM SIGSPATIAL on spatial computing and geographic information systems; began as a
  series of symposia and workshops in 1993
- Proceedings in the ACM Digital Library; ACM is fully open access from 2026
- Several tracks (research, vision, applications, industrial, short and poster, demo) plus many co-located workshops,
  the GIS Cup and a PhD workshop and SRC
- Single-blind review; research papers up to 10 pages excluding references
- Mostly held in the US (Seattle 2022, Atlanta 2024, Minneapolis 2025, Riverside 2026), with Beijing 2021 and Hamburg
  2023 abroad
- One author per paper must register separately and present in person
- CCF 2026 lists it as C under the name "ACM Special Interest Group on Spatial Information"
