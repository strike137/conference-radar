notes:
- Workshop on dynamic resource management and malleability in HPC systems, runtimes, I/O and applications, linked to several EuroHPC projects
- Grew out of the EuroHPC malleability workshop and hackathons (Garching, Grenoble, Barcelona); 3rd edition in Madrid with Euro-Par 2024, 4th in Dresden with Euro-Par 2025
- Long papers of 10 to 12 pages in LNCS format, at least 3 reviews; published in the Euro-Par workshops volume of Springer LNCS after the conference
- Submission through the shared Euro-Par EasyChair
- Not among the Euro-Par 2026 workshops
- Not listed in the CORE ICORE2026 portal
