links:
  website: https://mipi-challenge.org/
notes:
- Workshop on mobile image sensing and intelligent imaging systems, run together with the MIPI challenges
- Held with ECCV 2022, CVPR 2023, CVPR 2024 and ICCV 2025
- Peer-reviewed papers in ICCV format; accepted papers that are registered and presented appear in IEEE Xplore and CVF Open Access
- Separate deadline for challenge papers describing methods from the MIPI challenges
- Deadlines are 11:59 PM HST (2025)
- Different from the MAI (Mobile AI) and ECV workshops at CVPR
- Not listed in ICORE2026 or the CCF list
