frequency: annual
organizer: Workshop organizing committee led by Nanyang Technological University; co-located with ECCV, CVPR or ICCV
organizer_country: [singapore]
proceedings: CVF Open Access and IEEE Xplore (ICCV Workshops proceedings)
archival: true
typical:
  deadline_months: [7]
