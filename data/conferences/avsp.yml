notes:
- Interdisciplinary meeting on auditory and visual speech in human perception, machine recognition and human-machine interaction (psychology, engineering, neuroscience, linguistics)
- Organized by AVISA; run as a satellite workshop of Interspeech
- Proceedings in the ISCA Archive (since 1997)
- 16th edition in Sydney on 2 October 2026 after a break since 2019 (Volterra 2011, Annecy 2013, Vienna 2015, Stockholm 2017, Melbourne 2019)
- Accepts a one-page abstract or a four-page paper in Interspeech format, submitted by email; remote authors may send a video presentation
- Not ranked in ICORE2026 and not on the CCF list
