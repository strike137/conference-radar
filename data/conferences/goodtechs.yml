notes:
- EAI conference on AI, IoT, big data, blockchain, cybersecurity and smart technologies applied to social good
  (health, education, energy, agriculture, public safety, accessibility); 13th edition in 2027
- Proceedings in Springer LNICST; accepted authors can submit extended versions to EAI Endorsed Transactions journals
  for an extra fee
- Location changes every year (Heraklion 2027, Dubrovnik 2026, Rach Gia 2025, Can Tho 2024, Leiria 2023); virtual
  from 2020 to 2022
- Moved from December (2025) to April (2026 and 2027)
- Not found in the ICORE2026 CORE portal search and not on the CCF 2026 list
