id: tokshop
name: TokShop
full_name: Tokenization Workshop (Let's Talk about Tokenization)
type: workshop
tier: minor
areas: [ai, nlp]
region: worldwide
language: english
frequency: annual
organizer: TokShop organizing committee (researchers from University of Washington, LMU Munich, Ohio State, Charles
  University, University of Oslo, Google DeepMind, UTN and Ben-Gurion University); co-located with ICML (2025) and
  COLM (2026)
organizer_country: [international]
proceedings: None (non-archival) in 2026; the 2025 ICML edition offered an archival option
archival: false
typical:
  deadline_months: [5, 6]
  conference_months: [7, 10]
links:
  website: https://tokenization-workshop.github.io/
notes:
- Workshop on tokenization in its broadest sense, covering subword methods, multimodal and multilingual tokenization,
  tokenizer modification and byte or pixel level inputs
- 1st edition at ICML 2025 in Vancouver; 2nd edition at COLM 2026 in San Francisco; the host conference changes
- 2026 accepts only non-archival submissions, research papers up to 9 pages or extended abstracts up to 2 pages
- Double-blind review on OpenReview in the host conference style; arXiv posting allowed
- Not listed in ICORE2026 and not on the CCF list
