notes:
- Annual European conference series on parallel and distributed computing since 1995 (merged PARLE, CONPAR and VAPP)
- Run by a steering committee of European researchers that picks a host university each year; always held in Europe
- Proceedings in Springer LNCS (2026 in LNCS 16781 and 16782); workshop papers in a separate LNCS volume
- "2026 rules: up to 14 pages in LNCS format including references; single-blind review (double-blind optional)"
- "CORE B (ICORE2026, listed as EuroPar); CCF B"
- Abstract deadline about one week before the paper deadline; deadlines are usually extended by a week
