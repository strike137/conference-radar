notes:
- Half-day CVPR workshop on safety of AI based computer vision (specification, training, testing, monitoring, assurance); 8th edition in 2026
- Called Safe Artificial Intelligence for Automated Driving from 2019 to 2022; broadened to all domains (robotics, aerospace, rail, medical) in 2023
- Held with CVPR except 2022 (hybrid, Tel Aviv); 2020 and 2021 were virtual
- Organized mainly by German academics and automotive/rail industry researchers
- Submission through OpenReview in CVPR format; SAIAD Best Paper Award
- 12 papers in 2026 and 10 in 2025 on CVF Open Access
- Not listed in ICORE2026 or the CCF list
