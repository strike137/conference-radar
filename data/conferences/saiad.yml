notes:
- Workshop on safe AI for computer vision in automotive, rail, aviation, aerospace, medical and robotics applications
- Formerly Safe Artificial Intelligence for Automated Driving (2019 to 2022, automotive only); renamed and broadened in 2023
- Held every year since 2019, almost always with CVPR (2022 edition was hybrid in Tel Aviv); the 2026 edition was the 8th
- Organizers come mainly from German universities and industry (automotive and rail)
- Accepted papers appear in the CVPR workshop proceedings and IEEE Xplore; best paper award
- 12 papers in the CVPR 2026 workshop proceedings on CVF Open Access, 10 in 2025
- Submissions in the CVPR format through OpenReview
- Not listed in ICORE2026 or the CCF list
