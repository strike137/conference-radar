  website: https://ieeenepcon.github.io/
notes:
- International signature conference of the IEEE Nepal Section, which organizes and technically co-sponsors it
  (IEEE conference record 71018)
- Accepted, registered and presented papers are intended for IEEE Xplore, subject to IEEE approval
- Broad computing scope (core computing, networking and security, AI and data, cloud and HPC, IoT and
  blockchain, HCI, robotics, AI ethics)
- Up to 10 pages in IEEE two-column format; the fee covers 6 pages, 5 USD per extra page
- Held in Kathmandu; online presentation allowed where permitted
- Submission through the ConfConnects portal
