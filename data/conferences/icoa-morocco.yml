notes:
- Annual optimization conference chaired from Ibn Tofail University in Kenitra, Morocco; started in 2015 as the WOA workshop
- Held in Morocco in most years, with editions abroad in Wolfenbuettel, Germany (2021), Genoa, Italy (2022), Abu Dhabi,
  UAE (2023) and Almeria, Spain (2024)
- Accepted and presented papers are published in IEEE Xplore (IEEE conference record 71047 for 2026, 66896 for 2025)
- Broad scope covering optimization methods, metaheuristics, machine learning and applications across engineering fields
- Papers 6 to 8 pages in IEEE format; submission via Microsoft CMT; hybrid (in person and online)
- "Registration fee 2026: 350 EUR academics in person, 250 EUR students in person"
- Not listed in the CORE ICORE2026 portal
