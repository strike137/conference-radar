  website: https://beliv-workshop.github.io/
notes:
- Biennial workshop on research methods in visualization, from evaluation methods to the validity of visualization knowledge
- Held with IEEE VIS; 2026 is the 11th edition since 2006
- Proceedings in the ACM DL up to 2016 and in IEEE Xplore since 2018, with DOIs for individual papers
- Papers of up to 8 pages plus references in VGTC conference style; authors choose single-blind or double-blind
- Each edition has a focus topic (generative AI in 2024; validity and research ethics in 2026)
- All registered IEEE VIS attendees can attend the workshop
- Not listed in ICORE2026 or the CCF list
