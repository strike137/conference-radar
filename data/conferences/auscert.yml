id: auscert
name: AUSCERT Conference
full_name: AUSCERT Cyber Security Conference
type: industry
tier: minor
areas: [security]
region: oceania
language: english
frequency: annual
organizer: AUSCERT (not-for-profit CERT at The University of Queensland)
proceedings: None (non-archival)
archival: false
rank:
  core: Unranked
fee: 1,699 AUD non-member early bird, up to 2,099 AUD late; members from 1,299 AUD (2026)
typical:
  deadline_months: [1, 11]
  conference_months: [5]
links:
  website: https://conference.auscert.org.au/
notes:
- Run by AUSCERT at The University of Queensland; Australia's longest-running cyber security conference (25th edition
  in 2026, 900+ attendees in 2025)
- Held every May on the Gold Coast (The Star Gold Coast, Broadbeach); two tutorial days followed by a two-day main
  conference
- 'Two-stage call: tutorials close mid November, presentations close late January; no deadline extensions'
- Selected speakers get travel from an Australian capital city, accommodation and free registration; hosted the
  International Cybersecurity Challenge (ICC) in 2026
- Student rate only on request and only for edu.au email addresses
