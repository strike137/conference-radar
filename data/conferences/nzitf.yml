notes:
- Annual practitioner security conference run by the New Zealand Internet Task Force, a non-profit trust community
  of security professionals from government, law enforcement, academia and industry
- 2026 edition held at Te Papa (Museum of New Zealand) in Wellington
- Day 1 is the Community Day, open to non-members and students (TLP:CLEAR and TLP:GREEN talks); day 2 is for NZITF
  members and corporate member staff only, under NDA (TLP:AMBER and TLP:RED talks)
- Talk proposals via a short online form, reviewed by the NZITF Conference Programme Committee; no vendor pitches
- Chatham House rule and no press; no papers or proceedings, slides may be shared with members afterwards
- Half-day workshops on the day after the conference; online live stream tickets also offered
