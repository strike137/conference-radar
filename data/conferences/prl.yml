notes:
- Workshop series on the intersection of AI planning and (reinforcement) learning, started at ICAPS 2020
- Held with ICAPS every year since 2020, plus a second edition with IJCAI (2022, 2023, 2026) or AAAI (2025)
- PRL @ ICAPS 2026 in Dublin was the tenth edition
- ICAPS editions have no formal proceedings; accepted papers are posted publicly on the PRL website
- 2026 IJCAI edition was a joint workshop with CAIPI (Planning for Complex Real-World Applications) with optional archival CEUR-WS proceedings
- Long papers up to 8 pages (ICAPS edition), short papers and 2-page extended abstracts; submission via OpenReview, anonymity optional
- Coordinates with the ICAPS workshops RIPL and LM4Plan
- Recordings of remote editions on the PRL YouTube channel
- Not listed in ICORE2026 or the CCF list
