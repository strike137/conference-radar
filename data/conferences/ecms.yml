notes:
- Annual conference of the European Council for Modelling and Simulation; 41st edition in 2027
- Broad modelling and simulation scope organized in tracks (simulation and optimization, AI and agent based simulation,
  digital twins, cybersecurity modelling, performance evaluation of computer systems, finance and social sciences, ...)
- Full papers of 7 to 10 pages; each paper is reviewed by several IPC members; at least one author must register and present
- Proceedings in the yearly series Communications of the ECMS (ISSN 2522-2422), open access with DOIs, indexed by Scopus,
  Web of Science, dblp and Inspec
- Held in a different European city each year (Florence 2023, Cracow 2024, Catania 2025, Grimstad 2026, Budapest 2027)
- Co-located with the European Performance Engineering Workshop (EPEW) since 2025
- "Registration fee (2027): 450 EUR returning author, 375 EUR student, 500 EUR new author; 40 EUR per page over 7"
- Camera-ready and payment deadline is firm; submission via ConfMaster
- CORE ICORE2026 rank C; not in the CCF 2026 list
