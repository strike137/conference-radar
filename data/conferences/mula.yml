notes:
- CVPR workshop on multimodal learning (vision with audio, depth, LiDAR, text, thermal and other sensors), cross-modal learning
  and vision and language
- First edition at ECCV 2018, held with CVPR every year since 2019; the 2026 edition was the 9th
- Papers up to 8 pages in CVPR format, double-blind review by at least two reviewers, submitted through Microsoft CMT
- Accepted papers go into the CVPR workshop proceedings (15 papers in 2026, 17 in 2025 on CVF Open Access)
- Deadlines are AoE
- Not listed in ICORE2026 or the CCF list
