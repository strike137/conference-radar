notes:
- Workshop on teaching NLP and computational linguistics (course design, teaching materials, NLP education in the LLM era)
- Seventh edition held at EACL 2026 in Rabat, Morocco, on March 29, 2026; sixth edition at ACL 2024 in Bangkok, fifth at NAACL 2021 (online)
- Irregular schedule (2002, 2005, 2008, 2013, 2021, 2024, 2026)
- Full papers up to 8 pages and 1 to 2 page short papers on teaching materials; short papers are presented as posters or demos
- Single-blind review through OpenReview
- Proceedings in the ACL Anthology (18 papers in 2026, 19 in 2024)
- Not listed in ICORE2026 and not on the CCF list
