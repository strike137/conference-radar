notes:
- Organized by IARIA as part of the InfoWare congress, co-located with ICCGI, ICWMC and other IARIA events (19th edition in 2027)
- Published open access in the IARIA ThinkMind library (ISSN 2308-443X); prints via Curran Associates; selected papers invited to IARIA journals
- Onsite and online participation options
- Held in southern Europe (Nice 2021, Venice 2022 and 2027, Barcelona 2023, Athens 2024, Lisbon 2025, Valencia 2026)
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
