notes:
- European Rust community conference presented by Mainmatter, a Rust consulting company; part of the RustFest family of events
- Held every October in a different European city, in person and online
- 'Past venues: Berlin 2022, Brussels 2023, Vienna 2024, Paris 2025, Barcelona 2026, Prague 2027'
- Two conference days of talks plus workshops and side events (hackathons, sightseeing)
- No papers or proceedings; talk recordings are published on the EuroRust YouTube channel
- Not listed in CORE ICORE2026
