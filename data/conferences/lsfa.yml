notes:
- Symposium on logical and semantic frameworks, lambda calculi, type theory, proof theory, rewriting and their applications; launched in 2006
- Rooted in the Brazilian logic community; mostly held in Brazil, sometimes as a satellite of FSCD or FLoC abroad (Rome 2023, Lisbon 2026)
- Recent editions in Buenos Aires 2021 (online), Belo Horizonte 2022, Rome 2023, Goiania 2024, Brasilia 2025 (with CICM), Lisbon 2026 (FSCD at FLoC); LSFA 2027 in Santo Andre, Brazil
- Proceedings in EPTCS since 2021 (LSFA 2026 -> EPTCS 449, LSFA 2025 -> EPTCS 430); ENTCS before that
- Full papers up to 16 pages and short papers up to 6 pages, EPTCS style
- Selected papers of two editions go to a joint journal special issue (recently Mathematical Structures in Computer Science)
- Not listed in ICORE2026 or the CCF 2026 list
