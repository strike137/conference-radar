notes:
- Free Security BSides community conference on information security and hacker culture in São Paulo, Brazil
- First held in May 2011; the official site calls it the pioneer BSides in Latin America
- The 2026 edition (V21) ran over two days with talks, workshops, mini trainings, lightning talks, a CTF and many villages (Red Team, AppSec, ICS/OT, IA, Carreira, ...)
- Talks are 40 minutes; separate calls for main talks and for village talks
- Talks mainly in Portuguese; no proceedings
