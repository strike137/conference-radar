notes:
- Workshop on security, safety, robustness and explainability of LLM-based AI agents in big data infrastructures; 2026 is the 2nd edition
- Co-located with the IEEE International Conference on Big Data (IEEE BigData); first held at BigData 2025 in Macau
- Accepted papers go into the IEEE BigData conference proceedings (IEEE Computer Society Press, IEEE Xplore)
- Full papers up to 10 pages and short papers up to 6 pages including references, IEEE BigData format, single-blind review
- Hybrid in 2025; listed as virtual for 2026
- Separate abstract deadline two weeks before the paper deadline
- Not ranked by CORE (not in ICORE2026) or CCF
