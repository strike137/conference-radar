notes:
- Long running Polish conference on dependability of computer systems; 2026 was the 21st edition
- Run by Wroclaw University of Science and Technology; held every summer at Brunow Palace in Lower Silesia, with a coach from Wroclaw
- Proceedings published by Springer in Lecture Notes in Networks and Systems (LNNS vol. 1026 for 2024, vol. 1427 for 2025)
- Topics range from dependability theory and quantum computing to AI, cybersecurity and medical applications
- Papers of 8 to 10 pages in Springer format, submitted through Microsoft CMT
- Fee covers Monday to Thursday accommodation with full board; each extra paper 400 EUR, each extra page 80 EUR
- The site states that late submission is still possible after the deadline
- Not in the CCF 2026 list
- "CORE rank: National: Poland (ICORE2026)"
