notes:
- Organized by CAIAC; held every year in a Canadian city (Montreal 2023, Guelph 2024, Calgary 2025, Vancouver 2026)
- Proceedings in PMLR from 2026 (volume 318); 2021 to 2025 proceedings were open access on CAIAC PubPub
- Long papers up to 12 pages and short papers up to 6 pages; double-blind review; two submission rounds with revise and resubmit
- Co-located with Computer and Robot Vision (CRV) as AI/CRV; includes a graduate student symposium
- Not listed in the CORE ICORE2026 portal; mid-size and student-friendly
- At least one author must attend in person
