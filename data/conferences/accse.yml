notes:
- Organized by IARIA as part of the DataSys congress, co-located with AICT, ICIW, ICIMP, SMART, IMMM, INFOCOMP, MOBILITY and SPWID (12th edition in 2027)
- Broad scope covering computing, networking, wireless communications, IoT, data, software and security
- Published open access in the IARIA ThinkMind library (ISSN 2519-8459); prints via Curran Associates; selected papers invited to IARIA journals
- Onsite and online participation offered
- Not listed in ICORE2026 or the CCF 2026 list; IARIA events are generally regarded as low-selectivity
- Held in Southern Europe (Valencia 2021, Porto 2022, Nice 2023, Venice 2024, Valencia 2025, Lisbon 2026, Barcelona 2027)
- Moved from late May or June (2021 to 2023) to April (2024 to 2026) and to March in 2027
