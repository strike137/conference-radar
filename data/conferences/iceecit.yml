id: iceecit
name: ICEECIT
full_name: International Conference on Electrical Engineering, Computer and Information Technology
type: conference
tier: minor
areas: [communications, general, ai]
region: southeast-asia
language: english
frequency: biennial
organizer: Department of Electrical Engineering, Universitas Jember (UNEJ)
organizer_country: [indonesia]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [9]
  conference_months: [11]
links:
  website: https://iceecit.teknik.unej.ac.id/
notes:
- Run by the Department of Electrical Engineering, Universitas Jember, Indonesia
- Editions so far in 2022, 2024 and 2026 (2026 is the 3rd), although the site calls it annual
- Accepted and presented papers are submitted to IEEE Xplore; no-show papers can be excluded
- 2022 and 2024 proceedings are in IEEE Xplore (linked from the official site)
- 4 to 6 page IEEE two-column papers via EDAS; similarity must be below 30%
- 2026 edition is hybrid at eL Hotel Banyuwangi, East Java
- Broad EE scope (control, electronics, power and energy, telecommunications, IT and AI)
- 'Submission deadline extended several times in 2026 (Jul 31 -> Aug 23 -> Sep 15 -> Sep 30)'
- Not listed in the ICORE2026 portal or the CCF 2026 list
