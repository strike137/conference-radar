notes:
  - One-day workshop on cybersecurity, privacy and resilience in digital healthcare, co-located with the Norwegian ICT Conference for Research and Education (NIKT)
  - Proceedings in Springer CCIS (6 to 7 papers per volume)
  - "Held in Norway every year: Stavanger (2023), Bergen (2024), Halden (2025), Levanger (2026)"
  - Full papers 12 to 15 pages, short papers 6 to 11 pages, CCIS style
  - Deadlines are usually extended
  - Not listed in CORE ICORE2026; not on the CCF list
