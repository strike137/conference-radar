notes:
- Flagship annual conference of the IEEE Industrial Electronics Society, running since 1975 (52nd edition in 2026)
- Broad industrial electronics scope; power electronics, smart grids, electric machines, control, robotics, embedded
  systems, industrial communication, industrial informatics and AI for industry
- Large conference with many special sessions; papers 6 pages in IEEE two-column format, up to 2 extra pages at 150 USD each
- Accepted, registered and presented papers go to IEEE Xplore; outstanding papers get a fast track to IES journals
- 2026 edition is hybrid, with online presentation allowed
- Rotates worldwide (Toronto 2021 online, Singapore 2023, Chicago 2024, Madrid 2025, Doha 2026, Shanghai 2027, Los Angeles 2028)
- CORE C in ICORE2026; not in the CCF list
