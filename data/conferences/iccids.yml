id: iccids
name: ICCIDS
full_name: International Conference on Computational Intelligence in Data Science
type: conference
tier: minor
areas: [ai, data]
region: south-asia
language: english
frequency: annual
organizer: Department of CSE, Sri Sivasubramaniya Nadar (SSN) College of Engineering, Chennai
organizer_country: [india]
proceedings: IEEE Xplore
archival: true
fee: 200 USD or 9500 INR plus GST for non-member faculty (2026); students 150 USD or 8000 INR; IEEE members less
typical:
  deadline_months: [10, 11, 12]
  conference_months: [1]
links:
  website: https://iccids.in/
notes:
- Run by SSN College of Engineering, Kalavakkam near Chennai, and held on its campus (2023 edition virtual)
- 2026 edition technically sponsored by IEEE Madras Section (conference record 69108) with proceedings in IEEE Xplore
- Earlier editions (up to 2025) were IFIP events with proceedings in Springer IFIP AICT
- IEEE sponsorship for 2027 was still under review per the site
- Up to 6 pages in IEEE format, blind review via Microsoft CMT
- "Acceptance rate: about 17.8% (2026), per the site"
- Pre-conference academia and industry workshops on the first day
- Not listed in CORE ICORE2026 or the CCF list
