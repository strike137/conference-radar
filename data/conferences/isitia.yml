notes:
- Annual conference of the Department of Electrical Engineering, ITS Surabaya; formerly SITIA, held since 1999
- 2026 edition jointly organized with Universiti Malaya (Malaysia) and Universitas Udayana (Indonesia)
- Proceedings in IEEE Xplore (ISSN 2769-5492) and indexed by Scopus; no-show papers are removed from the proceedings
- 'Very broad EE scope: control and robotics, electronics, power and energy, telecommunications and signal processing,
  IT and AI, biomedical engineering'
- Held in Indonesia, hybrid (onsite or online at the same fee); recent venues Surabaya, Mataram (Lombok) and Bali
- Submission deadline is usually extended; four best paper awards get a full registration fee refund
- Not listed in ICORE2026 or the CCF list
