notes:
- One-day workshop on gamification of software development, testing and SE education
- Moves between host conferences; ESEC/FSE 2022 Singapore, ESEC/FSE 2023 online, ISSTA 2024 Vienna, ICSE 2025 Ottawa, EASE 2026 Glasgow
- 2026 papers published in the EASE workshop proceedings in the ACM Digital Library
- Full papers up to 10 pages, position or short papers up to 5 pages, single-blind review by at least three PC members
- Organizers from Italy (Politecnico di Torino, University of Genova) and Germany (University of Passau, CQSE)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
