notes:
- Flagship conference of ACM SIGecom on algorithmic game theory, mechanism design, market design and economics of
  computation; CORE A* (ICORE2026); not in the CCF 2026 list
- Proceedings in the ACM Digital Library (open access from 2026, APC for authors outside ACM Open unless waived)
- Accepted authors may publish only a one-page abstract with a link to the full paper, so the work can go to an
  economics journal
- Papers up to 18 pages single-column plus unlimited appendix; double-blind review in two rounds with author
  response
- Mostly held in the USA (Boulder 2022, New Haven 2024, Palo Alto 2025); London 2023 and Rome 2026
