notes:
- Annual workshop on ML for structural biology (structure prediction, protein design, cryo-EM, dynamics), held next to NeurIPS since 2020
- 2020 and 2021 were virtual, 2022 and 2023 in New Orleans, 2024 in Vancouver
- 2025 ran in two venues on the same day, San Diego next to NeurIPS (not affiliated with NeurIPS) and Copenhagen as an official EurIPS workshop, with one shared submission portal
- Non-archival; concurrent submissions and work in progress or position papers are welcome
- Short papers up to 5 pages in the NeurIPS style, light double-blind review on CMT
- Open-sourced code, models or data get priority for spotlight talks; a few travel awards
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
