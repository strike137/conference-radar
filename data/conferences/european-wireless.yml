notes:
- Long-running European wireless communications and networking conference; 31st edition in 2026
- Partnered with VDE ITG (German Information Technology Society); steering committee chaired by Frank Fitzek (TU Dresden)
- Proceedings in IEEE Xplore, indexed in Scopus; final papers up to 6 pages; single-blind review via EDAS
- Main track plus special tracks (5G/6G, NTN, quantum, semantic communications, Open RAN and AI, JCAS) and a workshop
- Held in a different European city each year (Brno 2024, Sophia-Antipolis 2025, Rimini 2026); dates move between June
  and October
- Not listed in CORE ICORE2026
