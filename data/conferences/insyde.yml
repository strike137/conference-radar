notes:
- Workshop on machine learning for computer systems design (ML-assisted compilers, hardware design space exploration, resource allocation)
- 2026 edition held with ACM EuroSys 2026 in Edinburgh; full-day program with invited talks, paper sessions and a panel
- Full papers (8 to 10 pages) and short or position papers (4 to 6 pages) excluding references, ACM template, double-blind, at least three reviews
- Accepted papers are posted on the workshop website only (no ACM DL proceedings stated)
- Submission via EasyChair
- Not listed in CORE ICORE2026
