notes:
- One-day workshop co-located with ACM EuroSys, which is held in Europe every spring
- Topics are machine learning for computer systems design, such as ML-assisted compiler optimization, hardware design
  space exploration and intelligent resource allocation
- Full papers of 8 to 10 pages and short or position papers of 4 to 6 pages, double-blind, at least three reviewers each
- Accepted papers are published on the workshop website only, not in the ACM Digital Library
- Program mixes invited talks, paper talks and a panel
- Not listed in CORE ICORE2026
