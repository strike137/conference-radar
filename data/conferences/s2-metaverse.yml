notes:
- Not to be confused with IEEE MetaCom (IEEE International Conference on Metaverse Computing, Networking and Applications); this one is run by the Services Society
- One of ten co-located conferences of SCF run by the Services Society, a US-registered nonprofit (siblings include ICWS, SCC, CLOUD, BigData, EDGE, ICIOT and ICCC)
- Scope is immersive and spatial computing (VR/AR/MR, embodied agents, digital humans, 3D content and world generation, digital twins, metaverse security and governance)
- Entered its current form in 2022, growing out of the Services Society's World Congress on Services
- Proceedings in Springer LNCS; research and application tracks up to 15 pages, short papers up to 8 pages
- Each submission reviewed by at least three program committee members; submission via EDAS
- Several submission rounds (early bird, regular, special track) in one cycle
- 'Recent hosts: Hawaii (2022, 2023), Bangkok (2024), Hong Kong (2025), Kuala Lumpur (2026)'
- Not listed in ICORE2026; not on the CCF 2026 list
