notes:
- Workshop on vision-based industrial inspection, co-located with the major computer vision conferences
- Editions at CVPR 2023 (Vancouver), ECCV 2024 (Milan), ICCV 2025 (Honolulu) and CVPR 2026 (Denver)
- 2026 edition merged with the DEXTER and INSIDE-X X-ray workshops and offered three tracks (General, DEXTER, INSIDE-X)
- Regular papers go into the workshop proceedings; extended abstracts are not published
- 2026 papers appear in CVF Open Access under CVPR 2026 Workshops
- Submission and review through Microsoft CMT; program includes industry keynotes, a panel and challenges
- Not listed in ICORE2026
