links:
  website: https://www.ieee-edssc.org
notes:
- Long-running IEEE conference on electron devices and solid-state circuits (17th edition in 2026), initiated by
  the IEEE ED/SSC Hong Kong chapter
- Covers devices (nanoelectronics, memory, power, RF, MEMS, emerging devices) and circuits (analog, data converters,
  digital, RF, power management)
- Short 3-page double-column papers; accepted papers go to IEEE Xplore (EI indexed)
- Usually held in mainland China or Hong Kong in June (Yinchuan 2025, Guangzhou 2026)
- Registration and payment handled by the AiScholar (ais.cn) conference service
- Student paper awards (6 awards from 12 finalists in 2026)
- Not listed in ICORE2026 or the CCF list
