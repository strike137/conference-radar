notes:
- First edition is WS-28 at IEEE GLOBECOM 2026 in Macau, a half-day in-person workshop on 7 December 2026
- Topics include trust modeling, trust-aware routing and access control, goal-oriented network operation, explainable
  AI and agentic or embodied AI for intelligence-native 6G systems
- Co-chairs Xianbin Wang (Western University, Canada) and Lei Zhang (University of Glasgow, UK)
- Accepted and presented papers go into the GLOBECOM workshop proceedings in IEEE Xplore; no-show papers are removed
- Submissions via EDAS through the GLOBECOM workshop call
- Not listed in ICORE2026
