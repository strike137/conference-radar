notes:
- Run by ARFTG, a US charitable organization for RF and microwave measurement founded in 1972
- "Two conferences a year: a winter symposium co-located with IEEE Radio and Wireless Week (January) and a one-day
  spring conference on the last day of IEEE IMS (June)"
- Each edition has a focus theme (ARFTG-108 -> measurement challenges for space and satellite systems)
- Submission is an abstract plus a summary of at least 1000 words; notification about two weeks after the deadline
- Presented papers go into IEEE Xplore; papers not presented are excluded from IEEE Xplore
- Small community event, around 120 to 160 attendees; held in the USA (2024 San Antonio and Washington DC, 2025 San
  Juan and San Francisco, 2026 Hollywood and Boston)
- Microwave measurement venue outside the usual CS rankings, not listed in ICORE2026
