notes:
- Community conference in Tokyo for PHP developers, held every March since 2018
- Held at Nakano Central Park Conference, Tokyo, with live streaming on Niconico (hybrid)
- Talks chosen from a call for proposals on fortee; separate calls for pamphlet articles and book reviews
- Talk videos published later on Niconico and YouTube
- No papers or proceedings; talks only
