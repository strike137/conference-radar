id: noms
name: NOMS
full_name: IEEE/IFIP Network Operations and Management Symposium
type: conference
tier: major
areas: [networking, ai]
region: worldwide
language: english
frequency: annual
organizer: IEEE Communications Society (CNOM) and IFIP
proceedings: IEEE Xplore
indexing: [DBLP]
rank:
  core: B
fee: 900 EUR ComSoc member, 950 EUR IEEE or sister society member, 1,200 EUR non-member (2026, full author registration,
  incl. 22% VAT)
typical:
  deadline_months: [9, 10, 11]
  conference_months: [5]
links:
  website: https://noms2027.ieee-noms.org/
notes:
- ComSoc's primary forum for network and service management (per the CFP); NOMS has merged with its sister conference
  IM, so it is now held every year (before 2022 NOMS was in even years and IM in odd years)
- 'Full papers: 8 pages main text, up to 12 pages with references and appendix; short papers 4 (+2); optional artifact
  evaluation with badges'
- Many side tracks (workshops, demos, experience session, doctoral symposium, dissertation digest) with later deadlines
  than the main track
- 'Rotates globally: Seoul 2024, Honolulu 2025, Rome 2026, Montreal 2027; 2026 theme was AI for Management and Management
  for AI'
- 'Submission deadlines have been extended twice in recent years (2026: Oct 13 -> Oct 27 -> Nov 10)'
