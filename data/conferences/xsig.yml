notes:
- Cross-SIG domestic workshop on computing systems, infrastructure and programming, run by several IPSJ SIGs (ARC,
  HPC, OS, PRO, DBS) since 2017; successor of JSPP, SACSIS and ACSI
- Held as a one-day event inside SWoPP (the summer joint meeting of Japanese computing systems SIGs) since 2020
  (online only in 2020 and 2021), in a different Japanese city each year (Hakodate 2023, Tokushima 2024, Takamatsu
  2025, Takayama 2026)
- Peer reviewed by a program committee (single-blind) with constructive feedback; papers in Japanese or English,
  about 4,000 to 8,000 words, no page limit
- No proceedings are published; accepted papers are shared with attendees only during the event, so work can later
  go to international venues; IPSJ Transactions on ACS runs an xSIG special issue for extended versions
- Young Program Committee lets students and young researchers review papers and join the PC meeting; many student
  awards
- Also has a poster session (title and abstract only, no paper); 13 regular and 5 short papers accepted in 2026
