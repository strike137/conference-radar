notes:
- Workshop on blockchain and software architecture, co-located with IEEE ICSA every year since 2020
- Accepted papers are published in the ICSA Companion Proceedings in IEEE Xplore
- Position papers (2 to 4 pages), full papers and industry or experience papers (6 to 8 pages) in IEEE proceedings format
- Single-blind review by three PC members; submission via the ICSA EasyChair
- Website hosted by the Insight research team at the Federal University of Goias, Brazil
- 2026 organizers from Boston University (USA) and NYU Abu Dhabi, Federal University of Goias (Brazil) and Brunel University London (UK)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
