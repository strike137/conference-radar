notes:
- Premier ACM SIGSOFT conference; called ESEC/FSE until 2023 and FSE since 2024; CORE A*, CCF A
- Accepted papers form an issue of PACMSE (Proceedings of the ACM on Software Engineering); 18 pages plus 4 pages
  of references
- Double-anonymous review with a major revision round
- FSE 2027 will be held in Shenzhen, China (July 2027); research deadline 2 Oct 2026
- 'ACM is fully open access: authors outside ACM Open institutions pay an APC (USD 500 member / 750 non-member,
  2027 subsidized rate) unless a waiver applies'
