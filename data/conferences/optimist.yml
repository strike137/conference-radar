id: optimist
name: OPTIMIST
full_name: 'OPTIMIST Workshop: Open Tools, Interfaces and Metrics for Implementation Security Testing'
type: workshop
tier: minor
areas: [security, crypto, systems]
region: worldwide
language: english
frequency: annual
organizer: OPTIMIST organizers (North Carolina State University, Worcester Polytechnic Institute); co-located with IACR CHES
organizer_country: [usa]
proceedings: OPTIMIST website (bundle of accepted contributions)
archival: false
typical:
  deadline_months: [6, 7]
  conference_months: [9, 10]
links:
  website: https://optimist-ose.org/
notes:
- One-day workshop on open and reproducible implementation security testing (side channels, fault injection, open tools and datasets)
- Held yearly as a co-located event of CHES; location follows CHES (2024 Halifax, 2025 Kuala Lumpur, 2026 Antalya)
- Short submissions up to 5 pages in LNCS format, double-blind review; talks/demos or moderated discussion slots
- Accepts archival and non-archival contributions, but accepted papers are only bundled on the OPTIMIST website, not in a formal proceedings series
- Supported in part by an NSF POSE award; also runs online OPTIMIST HOUR meetings and a PhD forum
