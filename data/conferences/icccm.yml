notes:
- Smaller conference on computer networks, communications management, IoT and related computing topics, established in 2011
- Held in Europe and Asia-Pacific in early years; in Japan every year since 2022 (Okayama, Nagoya, Kagoshima, Okinawa, Tokyo); 2021 online
- Proceedings 2019 to 2025 in the ACM Digital Library, indexed by EI Compendex and Scopus per the site
- Double-blind review per the site; hybrid format with online sessions
- Abstract-only presentation is possible without publication
- About 40 attendees in 2025 per the history page
- Run by a conference secretariat (hotmail contact) with Japanese host universities
- Not listed in ICORE2026 or the CCF 2026 list
