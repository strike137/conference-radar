links:
  website: https://iarml-workshop.github.io/
notes:
- Workshop on analogical reasoning and analogical proportions combined with machine learning, NLP and LLMs
- Held with IJCAI-ECAI 2022 (Vienna), IJCAI 2023 (Macao), IJCAI 2024 (Jeju) and IJCAI 2025 (Montreal)
- 2022 and 2023 proceedings in CEUR-WS (Vol-3174, Vol-3492); 2025 proceedings only posted as a PDF on the workshop site, not in CEUR-WS, so treated as non-archival
- Papers in the CEUR template; surveys or position papers on previously published work are also accepted
- 2025 edition accepted five original contributions
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
