notes:
- Main annual Norwegian research conference on ICT security and privacy
- One of four tracks of NIKT, the Norwegian ICT Conference for Research and Education (with NIK, NOKOBIT and UDIT)
- Full papers (up to 16 pages) and short papers (up to 5 pages), double-blind review, LNCS format, English or Norwegian
- Accepted papers appear in the open access NIKT Journal (ISSN 1892-0721, Norwegian level 1 channel); extended abstracts are not part of the proceedings
- NISK 2025 proceedings had seven full articles and one short paper
- Host rotates within Norway (Trondheim 2021, Kristiansand 2022, Stavanger 2023, Bergen 2024, Halden 2025)
