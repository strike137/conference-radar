notes:
- Workshop on AI for mathematics (formal and informal theorem proving, mathematical reasoning, math agents), held with ICML every year since 2024
- Editions at ICML 2024 (Vienna), ICML 2025 (Vancouver) and ICML 2026 (Seoul); a separate series from MATH-AI at NeurIPS
- Non-archival; papers submitted to or accepted at other venues are welcome
- Papers 2 to 8 pages in ICML format; double-blind review on OpenReview
- 346 submissions in 2026, about double the 2025 volume; also runs a challenge track
- Not listed in ICORE2026 and not on the CCF list
