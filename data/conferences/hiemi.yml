notes:
- Workshop co-located with IEEE DCOSS-IoT; the 2026 edition was the 2nd
- Formerly the International Workshop on Hybrid Internet of Everything Models for Industry 5.0
- Topics are hybrid human and AI intelligence for the Internet of Everything, green IoE, digital twins, LLMs for IoE, edge and fog computing, cybersecurity
- Workshop papers up to 6 pages and work-in-progress papers up to 4 pages, IEEE two-column, single-blind review with at least 2 reviews, via EasyChair
- Accepted and presented papers are submitted to IEEE Xplore
- Follows the DCOSS-IoT host city (Reykjavik 2026)
