id: icgip
name: ICGIP
full_name: International Conference on Graphics and Image Processing
type: conference
tier: minor
areas: [vision]
region: china
language: english
frequency: annual
organizer: Chinese host universities that change each year (Nanjing University of Science and Technology and
  Jiangnan University in 2026) with a conference secretariat
organizer_country: [china]
proceedings: SPIE Digital Library
archival: true
indexing: [EI, Scopus]
fee: 525 USD / 3800 CNY regular author (2026, early bird by October 15; 625 USD late)
typical:
  deadline_months: [9]
  conference_months: [11]
links:
  website: https://www.icgip.org/
notes:
- Smaller commercially organized conference series running since 2009
- Proceedings published by SPIE (Proceedings of SPIE) since 2011, listed as indexed in Ei Compendex and Scopus
- Selected papers recommended to the Journal of Image and Graphics (JOIG)
- Held in China, mostly in October or November (Kunming in August 2021, Nanjing 2022, Suzhou 2023, Nanjing 2024 and 2025, Wuxi 2026)
- Single-blind review; papers 4 to 12 pages, abstract-only submissions are presented but not published
- Not listed in the CORE portal (ICORE2026) or the CCF list
