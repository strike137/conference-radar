notes:
- Half-day workshop at ACM RecSys on music recommendation, bridging the RecSys and Music Information Retrieval communities
- Held with RecSys 2023 (Singapore), 2024 (Bari), 2025 (Prague) and 2026 (Minneapolis, fourth edition)
- Proceedings in CEUR-WS for 2024 (Vol-3787) and 2025 (Vol-4045)
- Regular papers up to 8 pages and short/position papers up to 4 pages, excluding references, in the CEURART single-column template
- Single-anonymized review by three PC members via the joint RecSys workshop EasyChair
- Previously published work (including preprints) is also accepted if the earlier venue is stated
- In person only; at least one author must attend
- Not listed in the CORE ICORE2026 portal
