notes:
- National AI and computational intelligence meeting of the Brazilian Computer Society (SBC), supported by its AI and
  computational intelligence special interest groups; 23rd edition in 2026
- Held each year as part of BRACIS, in the same Brazilian city (Cuiaba 2026)
- Papers in Portuguese or English (English title and abstract required), up to 12 pages in the SBC template;
  double-anonymous review by at least two experts; submission through JEMS3
- Main track plus an undergraduate track (main author an undergraduate student)
- Proceedings published electronically in SBC OpenLib (SOL); oral and poster papers are not distinguished
- "Deadlines at 23:59 AoE; usually extended several times"
- Not ranked in CORE ICORE2026
