notes:
- Workshop held with SC (the International Conference for High Performance Computing, Networking, Storage and Analysis); 16th edition in 2026
- Run by PNNL researchers (general co-chairs Antonino Tumeo and Mahantesh Halappanavar)
- 'Topics: architectures, programming models, runtimes, compilers and algorithms for irregular workloads such as graphs and sparse linear algebra'
- Special topic on dynamic networks and streaming graphs
- Regular papers up to 8 pages and position papers up to 4 pages (excluding references), IEEE format, submitted through the SC submissions site
- Optional Artifact Description appendix; artifact evaluation makes a paper eligible for the best paper award
- 2026 proceedings published in IEEE Xplore according to the CFP
- Location follows SC (St. Louis 2025, Chicago 2026)
