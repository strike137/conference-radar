notes:
- Hacking and cybersecurity conference run by the Hackplayers community (blog started in 2008), first held in 2018
- Held in Madrid, Spain every edition so far (UPM ETSISI, La Nave Madrid, then Exe Madrid Norte and Centro Cultural Sanchinarro in 2026)
- Editions in 2018, 2019, 2020, 2022, 2023 and 2026; no event in 2021, 2024 or 2025
- Spanish-language event; talks, workshops and CTF
- Open call for technical talk proposals through a web form; no proceedings
