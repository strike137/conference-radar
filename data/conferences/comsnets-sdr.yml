notes:
- Co-located workshop of COMSNETS, held each January in Bengaluru, India
- Telecom standards research oriented to 6G (3GPP, ITU, IEEE, IETF), pre-standardisation, policy and Bharat 6G use cases
- Accepts position papers and early-stage contributions linked to standards, not only full research papers
- Papers of 4 to 6 pages, single-blind review in 2026, submitted through EDAS
- Workshop papers appear in the COMSNETS proceedings and are submitted to IEEE Xplore
- Workshop deadline is often extended (by about four weeks for 2026)
- Co-chaired by Pamela Kumar (TSDSI in 2026, FSID-IISc in 2027); held every year since at least 2023
