notes:
- Biennial Australian symposium on microwave, millimetre-wave and terahertz components, circuits, antennas,
  propagation and systems; 7th edition in 2027
- Financially sponsored by the IEEE MTT-S Australian Chapters, technically sponsored by IEEE AP-S and MTT-S
- "Two submission types: a peer-reviewed 3-page short paper submitted to IEEE Xplore, or a 1-page abstract that is
  not published"
- Held in Australia, moving between cities (Perth in 2027 at Curtin University)
- Not listed in the CORE ICORE2026 portal
