id: evalita
name: EVALITA
full_name: Evaluation Campaign of Natural Language Processing and Speech Tools for Italian
type: workshop
tier: minor
areas: [nlp]
region: europe
frequency: irregular
organizer: AILC (Italian Association of Computational Linguistics), endorsed by AI*IA and AISV
organizer_country: [europe]
proceedings: CEUR-WS
archival: true
typical:
  conference_months: [2, 9, 12]
links:
  website: https://www.evalita.it/
notes:
- Periodic shared evaluation campaign for NLP and speech tools for Italian, run since 2007 as an AILC initiative
- Each campaign is a set of shared tasks; participants submit system description papers, task organizers write
  overview papers, and everything is presented at a final workshop in Italy
- Held every two to three years (Turin 2018, online 2020, Parma 2023, Bari 2026)
- Proceedings in CEUR-WS (2023 -> Vol-3473, 2026 -> Vol-4195)
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
