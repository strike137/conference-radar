notes:
- CVPR workshop on data-centric methods (data mixtures, curation, scaling laws, synthetic data, dataset bias)
- 1st edition at CVPR 2025 in Nashville (full day), 2nd at CVPR 2026 in Denver (half day)
- Full papers up to 8 pages in CVPR format, double-blind review by at least two reviewers via OpenReview
- Accepted papers can optionally be published in the CVPR Workshops proceedings
- Not listed in ICORE2026 or the CCF list
