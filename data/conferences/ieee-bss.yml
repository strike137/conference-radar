language: english
frequency: annual
organizer: Birmingham City University (workshop chairs), co-located with the IEEE International Conference on Blockchain
organizer_country: [europe]
proceedings: IEEE CPS (IEEE Blockchain proceedings, IEEE Xplore)
archival: true
indexing: [EI]
typical:
  deadline_months: [9]
  conference_months: [11, 12]
links:
  website: http://www.inbss.com
notes:
- Workshop of the IEEE Blockchain conference (part of the IEEE Cybermatics Congress); first held in 2022, fifth edition in 2026
- Moves with IEEE Blockchain (2025 Zhengzhou, China; 2026 Montbeliard, France)
- Short papers, up to 6 pages in IEEE Computer Society format (2 extra pages with a charge), double-blind review via EDAS
- 2025 call states accepted papers go to IEEE CPS proceedings (EI indexed) and IEEE Xplore; papers not presented may be excluded
- Short review cycle (2026 notification about 3.5 weeks after submission)
