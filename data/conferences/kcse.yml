notes:
- Korean national software engineering conference, hosted by KIISE and KIPS and run by the KIISE Software
  Engineering Society with the KIPS Software Engineering Research Group
- Held every winter, almost always in Pyeongchang (UNIST, Ulsan in 2026; Phoenix Park, Pyeongchang in 2027)
- Regular (8 to 10 pages), short (2 to 4 pages), industry and undergraduate papers; submission via EasyChair
- Proceedings PDF and program booklet posted on the conference site; best paper awards per track, and selected
  regular papers are recommended to KIISE and KIPS journals
- Paper deadline is usually extended in steps by a few weeks
