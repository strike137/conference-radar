notes:
- Non-commercial, community-organized hacking conference of Provence, run by the association Hack in Provence
- Held at the Eden Theatre in La Ciotat (near Marseille, France), described as the oldest cinema in the world
- Talks in the afternoon and hands-on workshops in the morning; no formal proceedings
- Talk proposals through a pretalx call for participation with no fixed deadline; the 2026 call closed on 15 Oct 2026
- The 2025 call stated talks are given in English; the 2026 call page is in French
