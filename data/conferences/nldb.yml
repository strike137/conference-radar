- Proceedings in Springer LNCS; full 15 pages, short 11 pages, demo 6 pages (2025)
- Mostly held in Europe (Turin 2024, Trondheim 2026); ranked CORE C
- Best papers invited to Data & Knowledge Engineering and Journal of Web Engineering (2025)
