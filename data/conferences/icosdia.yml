notes:
- Indonesian data science conference run by Universitas Sebelas Maret (UNS), Surakarta; IEEE Indonesia Section members on the program committee
- Accepted and presented papers are submitted to IEEE Xplore; no-show papers are removed from the proceedings
- Three submission batches with deadlines from mid May to late June (2026)
- Tracks on statistical learning and data analytics, computer vision and pattern recognition, and NLP including LLMs
- Hybrid format, onsite in Surakarta or online (2026)
