notes:
- Technically sponsored by the Soft Computing Research Society (SCRS, New Delhi), which runs many hybrid conferences each year with Indian host institutions
- After-conference proceedings in Springer Lecture Notes in Networks and Systems (LNNS); three volumes for ICIVC 2025
- Hybrid (in-person and online); hosted by NIT Agartala (2023, 2024) and ICFAI University Dehradun (2025 to 2027)
- 6th edition in 2026; first held in 2021; submission via Microsoft CMT
- Not the Chinese ICIVC (Image, Vision and Computing, icivc)
- Not listed in CORE ICORE2026 and not on the CCF list
