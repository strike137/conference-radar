notes:
- Annual Southern African AI conference, hosted in rotation by an AI research group at a southern African university;
  the Centre for AI Research (CAIR) plays a supporting role
- Started as FAIR 2019 in Cape Town; SACAIR since 2020 (2020 and 2021 virtual, 2022 hybrid in Stellenbosch, 2023
  Muldersdrift, 2025 Cape Town, 2026 KwaZulu-Natal)
- Four tracks covering symbolic and data-driven AI, socio-technical AI, responsible and ethical AI (philosophy and
  law), and interdisciplinary AI
- Two-stage double-blind review (abstract, then full paper of 12 to 15 pages); extended abstracts accepted only in the
  ethics and law track
- Top full papers go to Springer CCIS (2025 in CCIS volume 2784); other favourably reviewed papers go into online
  proceedings with an ISBN
- Week-long event with an unconference and tutorials before the main conference
- Not listed in the CORE portal (ICORE2026)
