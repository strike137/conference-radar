notes:
- Half-day workshop co-located with SOUPS, held in 2024 (Philadelphia) and 2025 (Seattle)
- Topics are user-centered privacy in AI, AI-driven surveillance, privacy at-risk populations and privacy regulation for AI
- Short papers of 2 to 4 pages excluding references, either position papers or research papers; encore submissions of published work allowed
- Double-blind review
- 'Non-archival: accepted papers are only posted on the workshop repository and website'
- Program of lightning talks, a fireside chat and group discussion
