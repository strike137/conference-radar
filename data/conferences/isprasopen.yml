notes:
- Annual open conference of the Ivannikov Institute for System Programming RAS (ISP RAS), held in Moscow in December
- Peer-reviewed sections on program analysis and transformation (reverse engineering, vulnerability search, compilers), data management, CAD for microelectronics, open source CFD and linguistic analysis
- Also a trusted AI workshop, a Secure Software Development block, round tables and a technology exhibition
- Papers in Russian (8-20 pages) or English (7-15 pages), double-blind review via EasyChair; in-person presentation required
- Accepted papers presented at the conference go into the journal Proceedings of ISP RAS (RSCI on Web of Science, VAK list); up to 2024 an IEEE Xplore proceedings volume was also an option
- Free for attendees and speakers
- Not listed in the CORE ICORE2026 portal or the CCF list
