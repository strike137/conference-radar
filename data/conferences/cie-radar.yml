notes:
- China's edition of the international radar conference series that rotates among the USA, China, the UK, Australia and France
- China hosts it about every five years (2016, 2021, 2026)
- Sponsored by CIE and organized by the CIE Radar Society; co-sponsored by IEEE AESS, IET, SEE (France) and Engineers Australia
- Full papers of 4 to 6 pages in IEEE format; all accepted papers published in IEEE Xplore
- Large event, over 800 poster slots plus oral sessions in the 2026 program
- Chinese authors must upload a confidentiality review sheet stamped by their organization
- Radar engineering venue outside the usual CS rankings, not listed in ICORE2026
