notes:
- European conference of the dependability community, sibling of DSN, PRDC and LADC
- 2027 is the 22nd edition (Trondheim, hosted by NTNU)
- 2027 proceedings published by Springer in LNCS, with short papers in a companion CCIS volume
- 'Tracks: regular papers (14 pages), practical experience reports and industry papers (10 pages), short papers (6 pages);
  single-blind review; also workshops, student forum, fast abstracts and posters'
- Moved from September (2019 to 2022) to April (2024 onwards); no edition in 2023
- Rotates around European university cities (Naples, Munich, Zaragoza, Leuven, Lisbon, Canterbury, Trondheim)
- 'CORE: Unranked (ICORE2026)'
