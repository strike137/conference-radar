notes:
- Held since 2003, alternating between Spain and Portugal (Alicante 2023, Coimbra 2025, Barcelona 2027)
- Co-organized by the Spanish AERFAI and Portuguese APRP chapters of the IAPR
- Proceedings in Springer LNCS; selected papers invited to a Pattern Analysis and Applications special issue
- Usually biennial (2019 was followed by 2022, then back to odd years)
