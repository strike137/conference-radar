notes:
- Run by the International Educational Data Mining Society, which also publishes the Journal of Educational Data Mining (JEDM)
- Open access proceedings with Zenodo DOIs and an ISBN; a JEDM journal track publishes accepted papers in the journal
- CORE B (ICORE2026)
- Double-blind review; full papers 10 pages, short and industry papers 6 pages, posters and demos 2 to 4 pages
- Firm deadlines (no extensions), all 23:59 AoE
- Recent locations rotate worldwide (Bangalore 2023, Atlanta 2024, Palermo 2025, Seoul 2026, Adelaide 2027); co-located with AIED and Learning at Scale as the Festival of Learning in 2026 and 2027
