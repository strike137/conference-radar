id: decode
name: DECODE
full_name: Workshop on Distributed Ecosystem for Circularity through Open Digital Enablers and the Digital Product Passport
type: workshop
tier: minor
areas: [data, networking]
region: europe
language: english
frequency: annual
organizer: Martin Benedikt (Virtual Vehicle Research), Pal Varga (BME Budapest) and Markus Tauber (Research Studios Austria)
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [8]
  conference_months: [10]
links:
  website: https://decode.icb.at/
notes:
- Co-located with IEEE/IFIP CNSM (Bologna 2025, Alcala de Henares 2026)
- Topics are data services, architectures and standards for the EU Digital Product Passport and the circular economy (data spaces, federated data governance, self-sovereign identity, edge and IoT)
- Regular papers up to 6 pages and position papers up to 4 pages in IEEE two-column format including references; submission via EDAS
- The 2026 site states that papers are made available via IEEE Xplore and IFIP
- Small Austrian-led community; seven papers and two keynotes in the 2026 full-day program, four papers in 2025
