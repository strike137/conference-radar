id: ipsj-taikai
name: IPSJ National Convention
full_name: National Convention of the Information Processing Society of Japan
name_local: 情報処理学会全国大会
type: conference
tier: domestic
areas: [general, ai, security, networking, software, systems, data]
region: japan
language: japanese
frequency: annual
organizer: IPSJ (Information Processing Society of Japan)
proceedings: IPSJ
archival: false
rank:
  core: Unranked
fee: 12,100 JPY regular member, 6,600 JPY student member, 28,600 JPY non-member, 16,500 JPY student non-member,
  free for junior members (2027 edition, per presentation, includes attendance and PDF proceedings)
typical:
  deadline_months: [1, 12]
  conference_months: [3]
links:
  website: https://www.ipsj.or.jp/event/taikai/89/
notes:
- Organized by IPSJ; its largest yearly event, held every early or mid March at a different university (2025 Ibaraki,
  Osaka; 2026 Matsuyama; 2027 Nagoya)
- No peer review; 2-page paper, 15 min talk + 5 min Q&A in general sessions, 12 + 3 min in student sessions
- Student sessions (up to master level) with a Student Encouragement Award in every session; awards only for IPSJ
  members
- Japanese or English; hybrid, but presenters must present on site
- Application deadline in early December (extended by a few days in 2024 and 2025), manuscript upload in early January
