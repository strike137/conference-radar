notes:
- ACM conference on AI and machine learning for finance, mixing academia and industry (banks, trading firms)
- "Main track: 8 pages in ACM sigconf format including references, no appendices; double-blind review with no rebuttal"
- Papers appear in the ACM conference proceedings; workshops, tutorials and competitions run alongside
- Held in New York 2022 to 2024, Singapore 2025 (after the Singapore FinTech Festival), Milan 2026
- Not ranked in CORE ICORE2026
