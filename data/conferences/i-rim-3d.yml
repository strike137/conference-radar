notes:
- Annual national conference of the Italian robotics community, run by the Pisa-based Italian Institute of Robotics and Intelligent Machines (I-RIM)
- Held in Rome every October alongside Maker Faire Rome (Fiera di Roma 2023, Gazometro Ostiense 2024 to 2026); 2026 was the 8th edition
- From 2026 a peer-reviewed full paper track (10 to 15 pages) is published in Springer Proceedings in Advanced Robotics (SPAR)
- 2 page extended abstracts (up to 4 pages for an extra fee) are peer reviewed, presented as posters and published open access with a DOI in the I-RIM 3D Proceedings Series
- Also has workshops, demos, an exhibition, RoboPitch and a PhD (PhDRIM) poster session
- Not listed in CORE ICORE2026
