notes:
- Korea's first international hacking conference, established in 2006, held every November in a Seoul hotel (2025
  Four Seasons, 2026 Westin Seoul Parnas)
- Highly technical offensive talks (kernel, browser, mobile, AI-driven vulnerability discovery); already-presented
  work is not accepted
- CFP by email to the organizers, closing at the end of September (23:59 KST) or earlier if slots fill
- Speakers get round-trip airfare, hotel, honorarium and meals
- The student rate is only for Korean undergraduates; graduate students pay the standard rate
