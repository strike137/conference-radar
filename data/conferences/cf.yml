notes:
- Sponsored by ACM SIGMICRO; proceedings in the ACM Digital Library
- Broad scope across computer architecture, systems, HPC and emerging computing paradigms, with co-located workshops
  and special sessions
- Full papers up to 8 pages excluding references (2 extra pages can be bought), short papers up to 4 pages; double-blind
  review; optional artifact evaluation
- Held in Italy every year recently (Turin 2022, Bologna 2023, Ischia 2024, Cagliari 2025, Catania 2026); in-person
  only in 2026
- CCF C; not listed in CORE ICORE2026
- Deadlines in January are usually extended by one or two weeks
