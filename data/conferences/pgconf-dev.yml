notes:
- Annual PostgreSQL developer conference run by volunteers for PostgreSQL contributors, committers, extension authors and ecosystem maintainers
- Successor of PGCon, which ran in Ottawa from 2007 to 2023; first PGConf.dev in Vancouver in 2024
- Alternates between Vancouver and Montreal (Vancouver 2024, Montreal 2025, Vancouver 2026, Montreal 2027)
- Four days of talks, workshops, panels, posters, community discussions and an unconference day; about 300 attendees
- Program committee selects 25 or 50 minute talks from a call for proposals; second round for community discussions; no proceedings
- "Registration (2027): 350 USD individual, 550 USD corporate, 75 USD student, plus Quebec tax"
- Not listed in the CORE ICORE2026 portal
