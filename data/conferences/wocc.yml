notes:
- 35th edition in 2026; rotates among Newark, USA (NJIT) and Taiwan or mainland China (2023 Newark, 2024 Hsinchu,
  2025 Macau, 2026 Newark)
- Technically co-sponsored by IEEE; proceedings in IEEE Xplore, indexed by EI Compendex and Scopus
- Symposia on wireless communications and networking, optical communications and photonics, emerging networks, and
  AI in communications
- Charles K. Kao best paper award for optical papers; low registration fees (250 to 350 USD for authors in 2026)
- Submission via EDAS; one regular or IEEE member registration covers up to two papers; presentation in person or
  online allowed (2026)
