notes:
- Software quality conference running since 1994; 2026 was the 19th edition
- Proceedings in Springer LNCS (IEEE Xplore up to 2018); best papers invited to a Software Quality Journal special issue
- CORE National/Regional (ICORE2026); not on the CCF list
- Double-blind review by at least three PC members; full papers 12 to 16 pages, short papers 6 to 8 pages in LNCS format
- Thematic tracks such as requirements engineering, security and privacy, verification and testing, and quality in
  the age of AI, plus a PhD symposium (SEDES)
- Held in southern Europe in September (Aveiro 2023, Pisa 2024, Lisbon 2025, Genoa 2026); in-person presentation
  required for inclusion in the proceedings
