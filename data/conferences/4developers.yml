notes:
- Polish one-day developer conference billed as the largest interdisciplinary IT festival for programmers in Poland
- Organized by PROIDEA Sp. z o.o., a Krakow producer of IT events and hackathons
- Main edition in Warsaw each spring plus local editions in other cities (Katowice in autumn; Wroclaw, Lodz,
  Poznan and Gdansk in 2022 to 2024)
- 2027 Warsaw tracks are App and System Architectures, AI in Practice, Software Engineering, Engineering Playground,
  Career and Growth
- Talks of 20 or 45 minutes chosen by a program council from a call for papers; no papers or proceedings
- Official site and call for papers are in Polish
- "Fee: 549 PLN + VAT early bird, 299 PLN + VAT student (Warsaw 2026)"
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
