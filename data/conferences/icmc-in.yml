notes:
- Indian mathematics and computing series held every January at a different institute since 2013; 12th edition at
  LNMIIT Jaipur (2026)
- Has dedicated Security and Privacy, Blockchain, and AI-for-security tracks alongside pure and applied mathematics
- Double-blind review with desk rejection and iThenticate screening; up to 16 pages in Springer format (extra page
  charges beyond 10 pages)
- Proceedings in Springer LNNS since 2023 (2026 accepted as two volumes); earlier volumes in other Springer series
  (AISC for 2021, PROMS for 2022)
- Deadlines are extended repeatedly (Jul 30 -> Aug 25 -> Sep 10 in 2025)
