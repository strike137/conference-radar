notes:
- Annual Hungarian national conference on computational linguistics and language technology, held in Szeged
- 2026 was the 22nd edition, at the Bolyai Building of the University of Szeged
- Papers in Hungarian or English; talks 8 to 12 pages, posters and laptop demos 6 to 12 pages plus references
- Double-blind review by two reviewers via EasyChair; novelty is the main criterion
- English papers can be offered publication in the journal Acta Cybernetica
- Registration required to attend
