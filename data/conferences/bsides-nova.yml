notes:
- Security BSides conference in Northern Virginia, USA, first held in February 2017; 2026 is the 10th edition
- Held at George Mason University Mason Square, Arlington, Virginia
- Workshops (4 or 8 hour trainings) on Friday and talks on Saturday
- Tracks for red team, blue team, threat intel and threat hunting, careers, plus a n00b track; 50 minute and 20 minute talks
- More than 1,200 attendees expected in 2026
- Call for papers runs on Sessionize from late June or early July; no proceedings
