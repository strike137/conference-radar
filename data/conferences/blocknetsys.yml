notes:
- Workshop on network-layer challenges of blockchains and decentralized systems (network-aware consensus, P2P
  overlays, sharding, blockchain-based networking and trusted infrastructure)
- 1st edition 2025, co-located with ACM CoNEXT 2025 at HKUST, Hong Kong; full-day workshop with 10 papers and 3 keynotes
- Organized by Huawei Huang's lab at Sun Yat-sen University; the CFP is hosted on the lab blog
- Papers of up to 6 pages in two-column ACM format, double-blind review on HotCRP
- Papers appear in the ACM Digital Library (Proceedings of the 2025 ACM CoNEXT Workshop on Blockchain-Network Synergy)
- Not among the CoNEXT 2026 workshops (Utrecht), so the next edition is unknown
