links:
  website: https://icitisee.org/
notes:
- Annual since 2016, run by Universitas Amikom Yogyakarta (IEEE conference record 73069X, a representative of the IEEE Indonesia Section sits on the steering committee); all editions so far held in
  Central Java or Yogyakarta, Indonesia (Yogyakarta, Purwokerto, Banyumas)
- Accepted and presented papers go to IEEE Xplore; the site says about 120 papers per year are published and Scopus
  indexed
- 'Three broad tracks: information technology, information systems, electrical engineering'
- Two submission batches with different fees; submission via EDAS is free and the fee is paid only after acceptance
- 2026 edition is a one-day hybrid event from Yogyakarta; the site warns that withdrawing after review may lead to a
  blacklist from IEEE conferences organized in Indonesia
- Conference month varies (Aug 2024, Dec 2025, Nov 2026)
