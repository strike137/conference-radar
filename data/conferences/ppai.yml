id: ppai
name: PPAI
full_name: AAAI Workshop on Privacy-Preserving Artificial Intelligence
type: workshop
tier: minor
areas: [ai, security, data]
region: north-america
language: english
frequency: annual
organizer: AAAI workshop program; chaired by Ferdinando Fioretto (University of Virginia) with co-organizers
organizer_country: [usa]
proceedings: None (accepted papers are listed by title only, with no proceedings; some authors self-post on arXiv)
archival: false
rank:
  core: Unranked
typical:
  deadline_months: [11]
  conference_months: [2, 3]
links:
  website: https://ppai-workshop.github.io/
notes:
- One-day workshop co-located with AAAI; six editions from PPAI-20 (2020) to PPAI-25 (2025)
- Accepts technical papers (up to 9 pages), 1-page extended abstracts, and a fast track for rejected NeurIPS/AAAI
  papers submitted with their prior reviews
- Anonymous submissions, each reviewed by at least two PC members; at least one author must attend in person
- Runs a student scholarship program with partial travel support
- Not in the AAAI-26 workshop program (Singapore, Jan 2026); no later edition announced as of Sep 2026
