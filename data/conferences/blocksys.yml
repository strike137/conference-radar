notes:
- CCF C conference (network and information security, CCF 2026 list); not ranked by CORE
- 'Held in China every year: 2023 Haikou, 2024 Hangzhou, 2025 Zhuhai, 2026 Chengdu (Dujiangyan), 2027 Guangzhou'
- Proceedings in Springer CCIS (three volumes, 110 papers in 2025); acceptance rate around 43%
- Called the International Conference on Blockchain and Trustworthy Systems up to 2024 (2024 proceedings titled
  Blockchain, Metaverse and Trustworthy Systems); AI added to the name from 2025
- 2025 used two submission rounds (Dec and Mar); 2026 had a single April deadline
