notes:
- Moroccan general digital technologies conference covering AI, soft computing, intelligent systems, IoT and networks
- Proceedings in Springer Lecture Notes in Networks and Systems (LNNS), several volumes per edition
- Held in Morocco 2021 to 2025 (Fez, Benguerir, Ifrane); 2026 (6th edition) moved to Vaughn College, New York, hybrid
- Site lists Scopus, Web of Science, DBLP and EI Compendex indexing for the LNNS series
- Separate deadline rule for participants not affiliated with Moroccan institutions
- Not listed in the CORE ICORE2026 portal or the CCF list
