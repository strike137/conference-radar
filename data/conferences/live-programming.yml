links:
  website: https://liveprog.org/
notes:
- Workshop on new user interfaces that improve the immediacy, usability and learnability of programming; most submissions are demos of novel programming systems
- Held since 2013; co-located with SPLASH from 2017 to 2024 (online in 2020, hybrid 2021 to 2023, in person in Los Angeles in 2024) and run online as an independent event since 2025
- Accepts short papers (up to 6 pages), web essays or demo videos (up to 20 minutes) plus a 250 word abstract
- Non-archival, the site states submissions are shown only to the program committee and not published
- Free to attend online, no registration required; funded by donations
- Welcomes submissions from outside academia
- Not listed in ICORE2026 or the CCF 2026 list
