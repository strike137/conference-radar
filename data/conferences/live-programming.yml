organizer: LIVE organizing committee (independent community workshop); 2026 organized by Devamardeep Hayatpur (UC San Diego) and Michael Homer (Victoria University of Wellington)
organizer_country: [usa, new-zealand]
proceedings: None (non-archival; submissions are not published, presentation videos are posted online)
archival: false
