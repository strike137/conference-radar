notes:
- The annual PyData conference in Israel, part of the global PyData network
- One day at the InterContinental David hotel, Tel Aviv (2024, 2025); about 600 attendees expected in 2025
- Keynotes, 30 minute talks and lightning talks for data scientists, data engineers and AI developers
- Talks chosen from a call for proposals with double-blind review; speakers get a free ticket
- General admission 550 ILS (2025); no papers or proceedings
