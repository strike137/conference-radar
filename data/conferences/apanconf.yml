notes:
- One-day academic conference co-located with the APAN meeting of the Asia Pacific Advanced Network (research and
  education networks); APAN62 in 2026
- 2026 was the 4th edition, held on Aug 13 in Auckland, New Zealand
- Accepted and presented papers are submitted for inclusion into IEEE Xplore; listed in the IEEE conference
  calendar
- Full papers of up to 6 pages in IEEE format via EDAS; double-blind review; review papers are not accepted
- 2026 theme AI, HPC and Resilient Systems, with tracks on R&E networks, AI and vision, HPC and cloud, digital
  applications and digital infrastructure policy
- Organizing committee largely from University of Peradeniya (Sri Lanka) and University of Auckland
- Not listed in ICORE2026 and not in the CCF list; a small regional venue
