id: gcce
name: IEEE GCCE
full_name: IEEE Global Conference on Consumer Electronics
type: conference
tier: minor
areas: [general, communications, systems, ai]
region: japan
language: english
frequency: annual
organizer: IEEE Consumer Technology Society (Japan-based organizing committee)
proceedings: IEEE Xplore
indexing: [IEEE Xplore, DBLP, Scopus]
rank:
  core: Unranked
fee: 80,000 JPY (2026, regular non-member, early); student non-member 45,000 JPY (student registration can cover
  a paper)
typical:
  deadline_months: [5, 6]
  conference_months: [9, 10]
links:
  website: https://www.ieee-gcce.org/
  dblp: https://dblp.org/db/conf/gcce/
notes:
- Sponsored by IEEE Consumer Technology Society; sister conference of IEEE ICCE, run by a Japanese committee
- Held in Japan every autumn (2025 Osaka, 2026 Kobe)
- Review is on a 2-page paper; final version up to 5 pages or a 2-page digest; many organized sessions alongside
  regular tracks
- Large, inclusive program regarded as an entry-level international venue for students; IEEE Xplore proceedings
- From 2026, selected papers can be recommended to a special issue of IEEE Transactions on Consumer Electronics
