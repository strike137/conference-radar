notes:
- Brazilian national forum on quantum software engineering; first edition in 2026
- Co-located with CBSoft 2026 at IME-USP, São Paulo
- Different from the international Q-SE workshop at ICSE
- Full research papers up to 6 pages plus 1 page of references, Portuguese or English (English encouraged), CBSoft ACM-like template
- Double-blind review with at least two PC members; submission via JEMS
- Accepted and presented papers published in SBC OpenLib (SOL)
- Not listed in CORE ICORE2026
