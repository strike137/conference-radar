notes:
- Mostly held in France; recent editions in Tunisia (2022), Morocco (2023, 2026), France (2024) and Canada (2025)
- Springer LNCS post-proceedings; full papers up to 16 pages, short papers up to 6 pages
- No anonymization required (not double-blind); papers must be presented to appear in the proceedings
- Regarded as a lower-tier venue (CORE C) with a focus on network, IoT and AI-based security; has an industrial
  forum
