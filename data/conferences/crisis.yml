id: crisis
name: CRiSIS
full_name: International Conference on Risks and Security of Internet and Systems
type: conference
tier: minor
areas: [security, networking]
region: worldwide
language: english
frequency: annual
organizer: 'Rotating host (2025: Université du Québec en Outaouais, Canada; 2026: International University of Rabat,
  Morocco)'
proceedings: Springer LNCS
indexing: [Scopus, DBLP]
rank:
  core: C
acceptance_rate: About 54% (2025, 28/52 including 3 short papers)
fee: 1000 CAD (2025, early author regular; 250 CAD student non-author)
typical:
  deadline_months: [6, 7]
  conference_months: [10, 11, 12]
links:
