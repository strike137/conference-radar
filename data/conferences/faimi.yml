notes:
- MICCAI workshop on fairness, bias identification and bias mitigation in medical imaging AI, held with MICCAI since 2023
- 2026 edition run jointly with the BRIDGE (regulatory evaluation) and EPIMI (ethics and philosophy) workshops
- Proceedings in the MICCAI workshop volumes of Springer LNCS (2025 -> LNCS 15976, 21 papers from 29 submissions)
- Double-blind review following MICCAI standards; up to 8 pages plus 2 pages of references in LNCS format, submission via OpenReview
- The FAIMI group also runs online workshops and symposia that are not paper venues
- Not listed in CORE ICORE2026 or the CCF 2026 list
