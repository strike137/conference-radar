id: iwbose
name: IWBOSE
full_name: International Workshop on Blockchain Oriented Software Engineering
type: workshop
tier: minor
areas: [software, security]
region: worldwide
language: english
frequency: annual
organizer: University of Cagliari blockchain software engineering group (with University of Stirling and Loyola University Maryland), held with IEEE SANER
organizer_country: [europe]
proceedings: IEEE Xplore (SANER companion proceedings)
archival: true
typical:
  deadline_months: [11, 12]
  conference_months: [3]
links:
  website: https://www.agile-group.org/iwbose2027/
notes:
- Workshop on software engineering for blockchain systems and smart contracts (testing, analysis, re-engineering, security, architecture)
- Held with IEEE SANER; 9th edition in Limassol in 2026, 10th in Richmond, Virginia in 2027
- Workshop papers are published in the SANER proceedings companion; IEEE conference format
- Full papers up to 12 pages (last 2 for references) and short papers of 4 pages, double-blind review, submitted via the SANER EasyChair (IWBOSE track)
- Includes a session for early research achievements by young researchers and PhD students
- Separate from WETSEB, the blockchain software engineering workshop held with ICSE by the same Cagliari group
- Not listed in the CORE ICORE2026 portal
