notes:
- Part of the Acadia University (Canada) conference series run by Elhadi Shakshuki, alongside ANT, FNC and MobiSPC
- Held together with ICTH (ICT in Healthcare); the PSCare workshop is attached to ICTH
- Accepted papers appear in Elsevier Procedia Computer Science (open access), indexed in Scopus, EI and DBLP
- Full papers up to 8 pages, short papers 6 pages, work in progress 4 pages, Procedia format
- Recent hosts are Leuven (Belgium), Almaty (Kazakhstan) and Istanbul (Türkiye)
- Submission deadline is usually extended once or twice before a firm deadline
- Unranked in ICORE2026; not on the CCF list
