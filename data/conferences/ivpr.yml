notes:
- Organized by CenNSER (UK), the same organizer as ICIEV; held jointly with ICIEV with a shared program
- 2025 (7th) edition held with ICIEV 2025 at Kyushu Institute of Technology and Kitakyushu International Conference Center
- Accepted regular papers are published in the International Journal on Computer Vision and Signal Processing (IJCVSP,
  6 to 10 pages) or the International Journal of Activity and Behavior Computing (IJABC, 10 to 20 pages); both free to publish
- Short, position and work-in-progress papers (2 to 6 pages) can be presented without publication; 4+ page ones can go to IJCVSP
- Double-blind review via Microsoft CMT with a rebuttal and resubmission round
- 'Past locations: Bangladesh (2017), Japan (2018, 2020, 2021 online, 2025), USA (2019), UK (2023); 2017 to 2020 editions were IEEE sponsored or technically co-sponsored'
- The 2025 proceedings book says the 8th IVPR will be held in Kitakyushu, Japan in 2026
