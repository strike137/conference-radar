id: hotdisec
name: HotDiSec
full_name: International Workshop on Hot Topics at the Intersection of Distributed Machine Learning and Security
type: workshop
tier: minor
areas: [security, ai, systems]
region: europe
language: english
frequency: annual
organizer: TU Delft and Sapienza University of Rome organizers; co-located with ESORICS (2026)
organizer_country: [europe]
typical:
  deadline_months: [6, 7]
  conference_months: [9]
links:
  website: https://hotdisec.github.io/website_2026/
notes:
- Workshop on security of federated, split and decentralized learning and on distributed ML for security applications
- Previous edition held as HotDiML (Workshop on Hot Topics in Distributed Machine Learning) with ICDCS 2025 in Glasgow;
  renamed HotDiSec and moved to ESORICS for 2026 (Rome)
- Welcomes position papers, negative results and lessons learned as well as full (16 pages) and short (6 pages) research
  papers, in LNCS format with double-blind review
- All accepted papers submit a web-site camera-ready version shared with workshop participants
- Half-day program in 2026 with a keynote and 5 accepted papers
- Not listed in CORE ICORE2026 and not on the CCF list
