notes:
- Student workshop held as part of the ACL annual meeting; topics are the same as the main ACL conference
- First author must be a current student (high school to senior PhD); thesis proposals are a separate category
- Long (8 pages), short (4 pages) and thesis proposal papers; double-blind review with at least three reviews
- Two routes, direct submission on OpenReview or commitment of papers already reviewed in ACL Rolling Review
- Authors choose archival or non-archival; archival papers appear as a volume of the ACL proceedings in the ACL Anthology
- Optional pre-submission mentorship about six weeks before the direct submission deadline; travel grants for students
- ACL 2026 SRW volume has 109 papers (2026.acl-srw in the ACL Anthology)
- ACL 2027 is in Kyoto, Japan (Aug 17-22, 2027); its SRW call is marked coming soon
