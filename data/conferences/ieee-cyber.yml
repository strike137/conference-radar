id: ieee-cyber
name: IEEE-CYBER
full_name: IEEE International Conference on CYBER Technology in Automation, Control, and Intelligent Systems
type: conference
tier: minor
areas: [systems, ai, networking]
region: worldwide
language: english
frequency: annual
organizer: IEEE RAS (sponsor); IEEE-CYBER Conference Governing Board
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI]
typical:
  deadline_months: [3, 4, 5]
  conference_months: [7]
links:
  website: https://ieee-cyber.org/
notes:
- Sponsored by IEEE RAS; cyber-physical systems, automation, control, robotics, IoT and embodied AI
- Accepted papers are submitted to IEEE Xplore and EI; extended abstracts are also accepted
- Mostly held in China since 2011 (Jiaxing 2021, Changbai Mountain 2022, Qinhuangdao 2023, Shanghai 2025), with
  recent editions in Europe (Copenhagen 2024, Florence 2026)
- Submission deadlines are usually extended by several weeks
- Not listed in CORE ICORE2026 or the CCF 2026 list
