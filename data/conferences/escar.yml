id: escar
name: escar
full_name: 'escar: Embedded Security in Cars Conference (escar Europe and escar USA)'
type: industry
tier: major
areas: [security, systems]
region: europe
language: english
frequency: multiple-per-year
organizer: isits AG (International School of IT Security), with ETAS as event partner and US organizer
proceedings: escar proceedings (papers get Zenodo DOIs)
archival: true
rank:
  core: Unranked
typical:
  deadline_months: [1, 5, 6]
  conference_months: [5, 6, 11]
links:
  website: https://www.escar.info/
notes:
- Started in Germany in 2003 as the first conference on embedded security in cars; widely seen as the main automotive
  cybersecurity industry event
- 'Two annual editions: escar Europe (November, hybrid, mostly in German cities such as Frankfurt, Dortmund, Hamburg
  and Bonn) and escar USA (May or June, Detroit area: Plymouth, Michigan until 2025, Novi, Michigan from 2026)'
- Mostly industry talks from OEMs and suppliers; escar Europe has a scientific track with anonymous peer-reviewed
  full papers up to 15 pages plus a presentation and industry track (2 to 3 page descriptions)
- Scientific-track papers get a citable Zenodo DOI (opt-out possible, copyright stays with the authors); escar USA
  has an industry track plus a dedicated academic session
- Deadlines usually extended by one to three weeks
