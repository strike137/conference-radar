links:
  website: https://praw-workshop.github.io/
notes:
- Half-day workshop on computer vision and AI for physical retail (shopper activity recognition, product detection and recognition, store analytics, foundation models for retail)
- Held with WACV every year since 2024 (Waikoloa 2024, Tucson 2025 and 2026, Orlando area 2027)
- Runs a challenge track alongside the paper track (GroceryVision in earlier editions, RetailAction challenge in 2027)
- Papers follow the WACV format, double-blind review by at least three reviewers on OpenReview
- 3 papers in the WACV 2026 Workshops proceedings on CVF Open Access
- Not listed in ICORE2026 or the CCF list
