notes:
- Co-located workshop of the IFIP WG 12.5 AIAI conference (see ifip-aiai); formerly named 5G-PINE
- 2026 was the 11th edition, held with AIAI 2026 at MAICh, Chania, Crete
- Program chairs led by Ioannis Chochliouros (OTE, Greece), with Latif Ladid (5G World Alliance, IPv6 Forum) and Christos Verikoukis (ISI / Athena RC, University of Patras)
- Papers in Springer LNCS format; 12 pages or more count as full papers, 8 to 11 pages as short papers, under 8 pages rejected
- Pages beyond the 14 page limit cost 100 EUR each
