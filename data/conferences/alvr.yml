notes:
- Workshop on vision-language models, multimodal agents, text-to-image and video generation, embodied agents and grounded language
- Held with ACL 2020 (online), NAACL 2021 (online), ACL 2024 (Bangkok) and ACL 2026 (San Diego)
- Long papers up to 8 pages and short papers up to 4 pages in ACL format, submitted through OpenReview
- Archival papers go to the ACL Anthology (24 papers in 2026, 19 in 2024); a non-archival track allows dual submission
- Not ranked in ICORE2026 and not on the CCF list
