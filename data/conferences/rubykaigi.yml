notes:
- International conference on the Ruby programming language, described by the organizers as the world's largest
  gathering of Ruby developers and the place where Ruby core developers meet every year
- Held since 2006 (no 2012 edition; online Takeout editions in 2020 and 2021), always in Japan; recent editions move
  to a different city each year
- Talks (30 minutes) chosen from a call for proposals on cfp.rubykaigi.org; separate CFP for lightning talks
- Talks in English (recommended) or Japanese; Japanese talks are simultaneously interpreted into English
- Speakers must attend in person; accepted speakers get free admission
- 136 proposals in 2026, 113 in 2025
- No papers or proceedings; talks only
- 'Recent venues: Matsumoto 2023, Naha 2024, Matsuyama 2025, Hakodate 2026, Miyazaki 2027'
