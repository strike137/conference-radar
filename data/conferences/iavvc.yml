links:
  website: https://iavvc.org/2027
notes:
- Financially sponsored by the IEEE Instrumentation and Measurement Society (IMS)
- Editions 2023 Austin, 2024 Pittsburgh, 2025 Baden-Baden, 2027 London; the history page lists ICCVE 2022 before it
- Two-stage submission, a 200 to 500 word abstract first and then a full paper of up to 6 pages (+2 paid)
- Accepted and presented papers go to IEEE Xplore; extended versions can go to an IEEE TIM / OJIM special section
- Mixes academic papers with industry workshops, panels and demonstrations on automated and connected vehicle testing
- Not listed in ICORE2026 or the CCF 2026 list
