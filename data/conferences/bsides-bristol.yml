notes:
- Volunteer-run, not-for-profit Security BSides conference in Bristol, UK
- First held in 2019, relaunched in 2023 and a two-day event since 2024
- Held at the UWE Frenchay Campus (Bristol Business School)
- 40 minute talks, 20 minute talks, workshops and villages; a Rookie Track pairs first-time speakers with mentors
- Talks reviewed on merit by a volunteer panel; notification about one month before the event
- Talks are recorded and posted online, no proceedings
