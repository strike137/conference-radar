notes:
- Not to be confused with the IEEE SERVICES conference formerly called IEEE SCC (now IEEE SSE); this one is run by the Services Society
- Focus on service engineering, composition, lifecycle management, quality and governance of computing-enabled services
- One of ten co-located conferences of SCF run by the Services Society, a US-registered nonprofit (siblings include ICWS, CLOUD, BigData, EDGE, ICIOT and ICBC)
- Proceedings in Springer LNCS; research and application/industry tracks up to 15 pages, short papers up to 8 pages
- Submission via EDAS; several submission rounds (early bird, regular, special track) in one cycle
- At least one author per accepted paper must register and present
- 'Recent hosts: Hawaii (2022), Shenzhen (2023), Bangkok (2024), Hong Kong (2025), Kuala Lumpur (2026); 2020 and 2021 were virtual'
- 2026 theme was Agentic AI as a Service
- Not listed in ICORE2026 (the CORE entry for the former IEEE SCC is now IEEE SSE); not on the CCF 2026 list
