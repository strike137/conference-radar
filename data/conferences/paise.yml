notes:
- One-day workshop co-located with IEEE IPDPS every year since 2019; 9th edition in 2027
- Accepted full and short papers appear in the IPDPS workshop proceedings (IEEE Xplore)
- Full papers up to 8 pages and short papers up to 4 pages, including references; IEEE format
- Submission through the IPDPS Linklings portal; single-blind, double-blind also accepted; three reviewers per paper
- At least one co-author must present in person
- 'Topics: edge AI learning and inference, edge applications, systems and programming models for the edge, edge security and data lifecycle'
- Mixes paper talks with keynote, invited talks and a panel on the future of AI at the edge
- Location follows IPDPS (Milan 2025, New Orleans 2026, Seattle area 2027)
- Not listed in CORE ICORE2026
