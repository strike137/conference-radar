notes:
- New workshop in 2026, co-located with ACM MobiSys 2026 in Cambridge, UK (half-day, six papers and one keynote)
- Two tracks, AI for Networks (AI-native 6G, spectrum, network security) and Systems for AI (on-device GenAI,
  compression, neuromorphic, energy-aware scheduling)
- Full papers up to 6 pages and position papers up to 4 pages including references; double-blind review; MobiSys format
- 2026 papers appear in the ACM Digital Library in the MobiSys 2026 workshops proceedings
- Not listed in the CORE portal (ICORE2026)
