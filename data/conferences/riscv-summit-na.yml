notes:
- Main North American community event of RISC-V International, with Member Day, keynotes, technical sessions and an expo
- Earlier North American editions (listed as RISC-V Summit) were held in San Francisco (2021), San Jose (2022) and Santa Clara (2023 to 2025), in October to December; the 2027 edition moves to February
- Talk proposals only (20-minute sessions, 40-minute deep dives, panels, posters) in a Technical or an Industry track; no papers are published
- "The CFP calls it a community conference: no product or vendor sales pitches"
- Accepted speakers get a complimentary pass; all-male panels are not accepted
- European sibling event is RISC-V Summit Europe
- Not listed in CORE ICORE2026
