id: icaisg
name: ICAISG
full_name: International Conference on Artificial Intelligence Security and Governance
type: conference
tier: minor
areas: [security, ai]
region: china
language: english
frequency: annual
organizer: Rotating Chinese host university with IEEE as co-sponsor (Hangzhou Dianzi University 2025, Hangzhou Normal
  University 2026); assisted by the Sino-France Joint Laboratory for Digital Media Forensics of Zhejiang Province
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 470 to 500 USD regular, 440 to 470 USD IEEE member or student (2026, presentation and publication)
typical:
  deadline_months: [10, 11]
  conference_months: [11, 12]
links:
  website: https://www.icaisg.org/
notes:
- New series started in 2025; both editions so far held in Hangzhou, China
- Co-sponsored by IEEE and a Hangzhou university; listed in the IEEE conference list (record 72841 for 2026)
- ICAISG 2025 proceedings are in IEEE Xplore and indexed by Ei Compendex and Scopus
- Tracks on deepfake detection, provenance of synthetic content, LLM security, privacy, AI for cybersecurity,
  adversarial robustness, explainable AI and AI ethics and regulation
- Full papers of at least 5 pages; pages beyond 6 cost 60 USD each; abstract-only presentation option without publication
- Submission via EasyChair or by email to the conference secretary; deadline was extended several times in 2025
- Not listed in CORE ICORE2026 or the CCF list
