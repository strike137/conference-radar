notes:
- First international conference of KIPS (Korea Information Processing Society); started 2024 in Jeju (Dec 16 to
  18), then 2025 Fukuoka and 2026 Osaka, run with Japanese co-chairs (Kyushu Univ., NICT, AIST)
- Named 'Artificial Intelligence Computing and Systems' in 2024 and 2025; 2026 site uses 'Artificial Intelligence
  and Computing Systems'
- 2025 proceedings in Springer CCIS; for 2026 the organizers are still applying to Springer; 2024 had online proceedings
  plus a JIPS special issue
- Strong security flavor (AI privacy/safety, system and network security tracks); tech supporters include JSAI SIG-SEC
  and IEICE ICSS; 2025 was held right after IWSEC 2025
- 'Hybrid: online submission and online presentation allowed; anonymous review; accepts full papers (12+ pages,
  CCIS), short papers (up to 6 pages) and 1 to 2 page experience papers'
