notes:
- Flagship conference of ACM SIGMM, 34th edition in 2026; listed as ACMMM in CORE
- Rated A* in ICORE2026 and A in the CCF list
- Papers published by ACM (ACM DL); ACM moved to full open access in 2026, so article processing charges apply unless the institution is in ACM Open
- Main track papers up to 8 pages plus 2 pages of references, ACM double-column template
- Submission and review on OpenReview with an optional rebuttal; reviews are made public after the process
- Abstract registration one week before the paper deadline; all authors must have a complete OpenReview profile and authors are expected to review
- Prefers inherently multimedia or multimodal work; unimodal papers may be desk-rejected as out of scope
- Rotates worldwide (Lisbon 2022, Ottawa 2023, Melbourne 2024, Dublin 2025, Rio de Janeiro 2026)
- Many co-located workshops and grand challenges with their own later deadlines
