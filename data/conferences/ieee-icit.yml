id: ieee-icit
name: IEEE ICIT
full_name: IEEE International Conference on Industrial Technology
type: conference
tier: minor
areas: [systems, ai, communications]
region: worldwide
language: english
frequency: annual
organizer: IEEE Industrial Electronics Society (IES)
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [10, 11]
  conference_months: [3]
links:
  website: https://icit2027.ieee-ies.org/
notes:
- One of the major conferences of the IEEE Industrial Electronics Society; 27th edition in 2026, 28th in 2027
- Broad industrial electronics scope; control and robotics, machines and drives, power electronics and smart grids,
  embedded systems, signal and image processing, industrial automation and communication, IoT, CPS, cybersecurity, AI
- Regular and special session papers up to 6 pages in IEEE two-column format; work-in-progress papers up to 4 pages
- Accepted and presented papers go to IEEE Xplore; all papers must be presented in person
- Rotates worldwide (Valencia 2021 online, Orlando 2023, Bristol 2024, Wuhan 2025, Monterrey 2026, Florianopolis 2027)
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
