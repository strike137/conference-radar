- Proceedings in the ACL Anthology (2026.mellm-1, 31 papers); a non-archival track allows dual submission
- Direct submissions up to 8 pages on OpenReview, plus ARR commitment; best paper awards
- Not listed in the CORE ICORE2026 portal or on the CCF list
