id: mellm
name: MeLLM
full_name: Workshop on Multilinguality in the Era of Large Language Models
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
organizer: Workshop organizing committee from Universite de Montreal, Beijing Jiaotong University, University of Edinburgh,
  University of Notre Dame and others; co-located with ACL 2026
organizer_country: [canada, china, europe, usa]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [4, 5]
  conference_months: [7]
links:
  website: https://www.mellm.org/
notes:
- Workshop on multilingual LLMs (reasoning, safety, training and adaptation, multilingual retrieval and RAG, applications,
  benchmarks)
- First edition held with ACL 2026 in San Diego on 2026-07-04
- Papers up to 8 pages in ACL format via OpenReview; direct submissions and ARR commitments accepted
- Optional non-archival track for papers under submission elsewhere
- Proceedings in the ACL Anthology (31 papers in 2026); best paper award
- Not listed in ICORE2026 and not on the CCF list
