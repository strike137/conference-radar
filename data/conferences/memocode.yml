notes:
- Formal methods and models for hardware/software system design and verification; formerly Formal Methods and Models for Co-Design
- Held as part of ESWEEK but is a separate venue from CASES, CODES and EMSOFT; ESWEEK registration can be bundled
- Accepted papers go to IEEE Xplore; presentation by a registered author required
- Regular papers up to 10 pages, tool papers up to 8 pages, work-in-progress papers up to 4 pages; double-blind review
- Best papers invited to a special issue of ACM TECS
- Rotates worldwide with ESWEEK (Beijing 2021, Shanghai 2022, Hamburg 2023, Raleigh 2024, Taipei 2025, Barcelona 2026)
- CORE C (ICORE2026) and CCF C (CCF 2026, listed under the former name Formal Methods and Models for Co-Design)
