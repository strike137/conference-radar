notes:
- Open source, tech and web conference focusing on the tools, processes and people making open source possible
- Billed as the largest open source event on the US east coast; over 6,500 registrations from 75 countries in 2025
- Held every October at the Raleigh Convention Center, Raleigh, North Carolina
- Talks chosen from a call for papers (talk proposals, no papers or proceedings)
- 2026 format has extended workshops, deep dive sessions and free co-located events (Community Leadership Summit,
  Inclusion and Diversity in Open Source, Open Source Accessibility Summit, OSI State of the Source)
- Run by the All Things Open team, which also runs open source meetups in North and South Carolina
