links:
  website: http://conf.uni-obuda.hu/iccc2026
notes:
- One of the Obuda University IEEE conference series (with SAMI, SACI, SISY, CINTI, INES)
- Held in a different country each spring (Reykjavik 2022, Hanoi 2024, Seychelles 2025, Brisbane 2026); the 2023 Cancun edition was cancelled
- Scope is computational cybernetics, computational intelligence and cyber-medical systems
- Proceedings go to IEEE Xplore; in person only, papers not presented are excluded
- One paper per registration fee; submission via EasyChair
- 2026 had a satellite workshop on cyber-medical systems near Uluru
- Not to be confused with the other ICCC venues (computational creativity, IEEE/CIC ICCC, IEEE ICCC Chengdu)
- Not listed in CORE ICORE2026
