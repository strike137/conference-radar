notes:
- Volunteer-run hacker conference from North Carolina, USA; first held in 2005 and run out of Raleigh until 2018
- Online since 2021 (CarolinaCon Online 1 to 5 in 2021 to 2025) after the 2020 edition was postponed due to COVID
- Talks cover hardware mods, software hacks, DIY gadgets, retro tech, security, AI experiments, LEDs and 3D printing
- Call for papers through a pretalx form; no formal proceedings
- 2026 edition celebrates 20 years of CarolinaCon
- Online editions have free admission; talks are streamed on YouTube and attendees join on Jitsi
