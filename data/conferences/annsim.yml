notes:
- Main annual conference of the Society for Modeling and Simulation International (SCS); successor of the SpringSim and SummerSim multi-conferences, which ran until 2020
- Tracks include the Annual Simulation Symposium (ANSS), communications and networking simulation, cyber-physical systems and digital twins, ML and AI in simulation, and SimAUD
- Mostly held in North America (Virtual 2021, San Diego 2022, Hamilton 2023, Washington DC 2024, Madrid 2025, Orlando 2026, Wroclaw 2027)
- Technical papers go to digital libraries for archiving; Work-in-Progress papers appear only in the SCS Digital Library, not in IEEE/ACM
- Ph.D. colloquium 2-page abstracts are posted on the website but not archived in the proceedings
- Not listed in ICORE2026 or the CCF list
