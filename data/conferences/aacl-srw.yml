notes:
- Student workshop held as part of AACL-IJCNLP; topics are the same as the main conference
- First author of research papers must be a current student; thesis proposals for PhD students are a separate category
- Long (8 pages), short (4 pages) and thesis proposal papers; ACL templates and the ARR anonymity policy
- Two routes, direct submission (at least three reviews) or commitment of papers already reviewed in ACL Rolling Review
- Authors choose archival or non-archival; archival papers appear in the SRW proceedings in the ACL Anthology
- Optional pre-submission mentorship (not anonymous) about seven weeks before the direct submission deadline
- Accepted papers are presented as oral talks or posters
- The 2025 SRW volume (Mumbai) has 27 papers (2025.ijcnlp-srw in the ACL Anthology)
- AACL-IJCNLP is not held every year (none in 2024); the 2026 edition is in Hengqin (Zhuhai), China
- Not listed separately in ICORE2026 or the CCF 2026 list
