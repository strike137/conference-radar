notes:
- Spanish-run conference on hybrid AI (combining symbolic and sub-symbolic methods), 21st edition in 2026
- Held as a joint event with SOCO, CISIS (the Spanish security one) and ICEUTE, plus Startup OLE
- Proceedings in Springer LNAI (two volumes in 2024 and 2025)
- Papers up to 12 pages in LNCS format, extra pages charged at 150 EUR each; at least two reviews per paper
- Selected papers invited to journal special issues
- 'CORE rank National: Spain (ICORE2026); not on the CCF list'
- Always in Spain (Bilbao 2021, Salamanca 2022 to 2025, Marbella 2026)
- Deadlines are usually extended
