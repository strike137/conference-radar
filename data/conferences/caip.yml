notes:
- Biennial European conference on computer vision, image analysis and pattern recognition, held in odd years since 1985
- Proceedings in Springer LNCS (two volumes in 2025, LNCS 15621 and 15622)
- Single-track program; double-blind review by at least two reviewers (2025)
- Two submission rounds in 2025 (April and June)
- Selected papers invited to the Pattern Analysis and Applications journal (Springer)
- Held in Europe (Valletta 2015, Ystad 2017, Salerno 2019, online 2021, Limassol 2023, Las Palmas de Gran Canaria 2025)
- Contests and tutorials on the day before the main conference (22 September 2025)
- CORE C (ICORE2026); the 2025 site still quotes an older CORE B
