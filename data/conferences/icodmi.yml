notes:
- Run by the School of Data Science, Mathematics, and Informatics (SSMI) of IPB University, Bogor, Indonesia; supported by IEEE Indonesia Section
- First held in 2025; 2026 is the second edition
- Held at the IPB International Convention Center, Bogor, in hybrid format
- From 2026 accepted and presented papers are submitted to IEEE Xplore (4 to 6 page IEEE papers via EDAS); no-shows are excluded
- 2025 papers went to partner journals (BAREKENG, IJSA, JIKA, MILANG), AIP Conference Proceedings (under confirmation at the time) or non-indexed ICoDMI proceedings
- Theme centers on data science and AI for agriculture and maritime sectors; 2025 tracks also covered mathematics, statistics and actuarial science, 2026 tracks follow IEEE technical areas
- Not listed in ICORE2026 or the CCF list
