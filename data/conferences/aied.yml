notes:
- Flagship conference of the International AIED Society, which also runs the International Journal of AI in Education (IJAIED)
- Main proceedings in Springer LNAI (six volumes in 2026); late breaking results, WideAIED, industry, Blue Sky and doctoral consortium papers in Springer CCIS
- CORE A (ICORE2026)
- Three main tracks (technical, human and societal aspects of AIED) with an abstract deadline one week before the paper deadline
- 2026 edition held in Seoul at COEX as part of the Festival of Learning with EDM and ACM Learning at Scale; workshops on 27-28 June
- Location rotates worldwide
