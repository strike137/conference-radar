notes:
- Organized by KNOM, a KICS research committee founded in 1996; KNOM also sponsors the international APNOMS symposium
  and publishes KNOM Review twice a year
- Papers up to 5 pages; all accepted papers are published in KNOM Review (KCI-listed) after additional review
- '2026 topics: 6G network operations, AIOps and autonomous networks (intent-based networking, agentic AI, network
  digital twins), AI network security, network open APIs'
- Rotating host (KISTI Daejeon 2025, Chonnam National University Gwangju 2026); no conference listed for 2024 (only
  a KNOM Tutorial)
