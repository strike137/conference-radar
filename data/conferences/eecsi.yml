links:
  website: https://eecsi.org/
notes:
- Annual since 2014 (1st edition in Yogyakarta); hosting rotates among Indonesian universities (UAD hosted 2024 and
  2026, Universitas Islam Sultan Agung hosted 2025), with Malaysian and Indian co-organizers listed in 2026
- Proceedings in IEEE Xplore (2024 and 2025 proceedings announced as available); the site states EECSI 2014 to 2024
  papers are indexed in Scopus, with no guarantee for new editions
- Submission via EDAS in IEEE conference format; hybrid (on-site and online) in 2025 and 2026, fully virtual in 2024
- Held in Indonesia (Yogyakarta 2024 and 2026, Semarang 2025)
- Deadlines are usually extended by several weeks
- Not listed in ICORE2026 or the CCF list
