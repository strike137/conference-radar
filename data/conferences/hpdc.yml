notes:
- Long-running ACM symposium on parallel and distributed systems, HPC, cloud and data-intensive computing (35th edition in
  2026, first held in 1992)
- Sponsored by ACM with SIGARCH and SIGHPC; proceedings in the ACM DL (IEEE proceedings up to 2006)
- One paper deadline in late January or early February (firm), abstract registration a week earlier; double-blind review
- Mostly held in the USA (Minneapolis 2022, Orlando 2023, Notre Dame 2025, Cleveland 2026); Pisa, Italy in 2024
- Co-located workshops and tutorials on the first day
- CORE A (ICORE2026) and CCF A (2026 list)
