notes:
- Long-running theory and practice venue for distributed computing, held every December since 1997
- Run by an international steering committee; mostly held in Europe (Strasbourg 2021, Brussels 2022, Tokyo 2023, Lucca 2024, Iasi 2025, Madrid 2026)
- Proceedings in LIPIcs (Leibniz International Proceedings in Informatics), gold open access, published after the conference
- Double-blind review; papers up to 15 pages in LIPIcs format (excluding cover page, references and appendices)
- Best paper and best student paper awards
- 'CORE rank B (ICORE2026); not in the CCF list'
