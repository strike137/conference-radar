notes:
- AIS premier conference for Region 1 (the Americas); tracks and minitracks largely shaped by the AIS Special Interest Groups
- Information systems (business school) venue rather than core CS
- About 700 paper submissions a year (AIS); proceedings in the AIS eLibrary
- Rotates within the Americas (Panama City 2023, Salt Lake City 2024, Montreal 2025, Reno 2026, Sao Paulo 2027, Boston 2028)
- "AMCIS 2026 rules: at most three papers per author and five authors per paper; in-person only"
- Last listed in CORE2018 (rank A); not in ICORE2026 or the CCF list
