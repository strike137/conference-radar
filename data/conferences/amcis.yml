notes:
- Annual conference of the Association for Information Systems for the Americas, running since 1995 (32nd edition in 2026)
- Information systems (business school) venue rather than core CS, organized in SIG-driven tracks and minitracks
- Full papers (up to 10 pages) and Emergent Research Forum papers (up to 5 pages), double-blind review, submitted via PCS
- Proceedings in the AIS eLibrary (ISSN 3066-876X); over 800 submissions a year according to AISeL
- Fully in-person; at least one author must register and present or the paper is dropped from the proceedings
- Each author may be on at most three papers and each paper may have at most five authors
- Mostly held in the USA or Canada (2024 Salt Lake City, 2025 Montreal, 2026 Reno); 2027 in Sao Paulo, Brazil
- Last listed in CORE2018 (rank A); not in ICORE2026 or the CCF list
