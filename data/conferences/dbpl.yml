notes:
- Long-running venue (over 35 years) at the intersection of data management and programming languages
- 19th edition in 2025, a one-day symposium co-located with ACM SIGMOD 2025 in Berlin
- Proceedings in the ACM Digital Library
- Regular papers up to 10 pages; short papers (4 pages) and extended abstracts (2 pages) may opt out of the formal proceedings; single-anonymous review
- Not among the SIGMOD 2026 workshops; next edition not announced
- Not listed in CORE ICORE2026 or in the CCF 2026 list
