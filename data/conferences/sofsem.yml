notes:
- Annual winter theory conference running since 1974, interrupted only in 2022 because of COVID-19
- Traditionally held in the Czech Republic and Slovakia; recent editions moved around Europe (Novy Smokovec 2023, Cochem 2024, Bratislava 2025, Krakow 2026, Ioannina 2027)
- Proceedings in Springer LNCS, ARCoSS subseries
- Scope covers algorithms, complexity, automata, logic, graph drawing, computational geometry, quantum computing and theory of AI and machine learning
- Papers up to 12 pages in LNCS format excluding references, optional appendix read at the discretion of the PC
- Single-blind review; accepted papers must also be posted on arXiv at camera-ready time
- Poster track and a pre-conference PhD school the day before the main event
- Selected papers invited to a special issue of Discrete Mathematics and Theoretical Computer Science (2027)
- Ranked B in ICORE2026
