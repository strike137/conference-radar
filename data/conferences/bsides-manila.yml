notes:
- Inaugural edition in 2026, described by the organizers as the first authorized Philippine chapter of Security BSides
- Volunteer-run, not-for-profit, single-track afternoon event with talks, an open lightning-talk slot and a small CTF
- Venue provided by De La Salle-College of Saint Benilde in Malate, Manila
- The 2026 edition was postponed from 30 August to 17 October; attendance capped at 120 and registration closed
- No proceedings; very low ticket price makes it easy for students to attend
