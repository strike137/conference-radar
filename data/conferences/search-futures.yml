notes:
- Full-day discussion workshop on the future of information retrieval, held with ECIR since 2024
- Call for speakers, not for papers; submit a one-page abstract (up to 600 words) for a lightning talk
- Abstracts get single-blind review via EasyChair
- No proceedings; the outcome is a report written by the organizers (the 2nd edition report is in the ACM DL)
- Editions at ECIR 2024 (Glasgow), ECIR 2025 (Lucca) and ECIR 2026 (Delft)
- Not listed in ICORE2026 or the CCF list
