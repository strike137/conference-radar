notes:
- Interdisciplinary one-day workshop on healthcare cybersecurity; first held in 2024 with ACM CCS, co-located with ACSAC since 2025
- Papers in IEEE Xplore workshop proceedings since 2025 (ACM DL in 2024); selected revised papers also go to a separate Springer Nature book
- Not double-blind; regular, short, lightning/poster, case study and position papers; in-person presentation required
- Held in the USA (Salt Lake City 2024, Honolulu 2025, Los Angeles 2026)
- Not listed in CORE ICORE2026
