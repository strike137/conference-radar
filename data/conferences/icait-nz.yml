notes:
- Smaller IEEE Photonics Society sponsored conference on communications, optical networks, signal processing and IT
- Proceedings in IEEE Xplore every year since 2017; EI Compendex and Scopus indexed per the site
- Held in China most years (Hefei 2023, Enshi 2024, Liaocheng 2025); the 2026 edition is in Auckland, New Zealand,
  hosted by Auckland University of Technology
- 2026 edition has several co-located workshops (6G sensing, edge intelligence, LLM agents, and others)
- Submission via EasyChair
- Not listed in ICORE2026
