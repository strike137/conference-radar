notes:
- Developer conference on foundational user-space Linux technologies (init and service management, image-based
  Linux, secure and measured boot, TPM attestation, containers, packaging, IPC)
- Held in Berlin; editions 2017 to 2019 and every year since 2023
- Deeply technical talks by and for developers; kernel topics only with clear relevance to user space
- Formats are 35 minute and 20 minute talks plus 5 minute lightning talks, submitted via pretalx
- 2026 edition funded fully by ticket sales with no sponsors; more than 150 attendees in 2025
- No papers or proceedings; recordings on media.ccc.de
