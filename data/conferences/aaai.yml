notes:
- Organized by the Association for the Advancement of Artificial Intelligence; broad AI scope; CCF A, CORE A*
- Usually held in North America in February; AAAI-26 was held in Singapore (Singapore EXPO) in January, AAAI-27
  returns to North America (Montreal)
- 'Two-phase review: Phase 1 summary rejections before author feedback, then final decisions'
- Abstract deadline in late July, full paper one week later; submissions on OpenReview
