notes:
- Organized by DNAC; IEEE and IEEE ComSoc are listed as technical sponsors
- Accepted papers go to IEEE Xplore; the camera-ready page warns that papers not presented can be removed from IEEE Xplore
- Every edition so far (2022 to 2025) and the announced 2026 edition are in Paris, France
- Single-blind review via EDAS; full papers up to 9 pages, short papers up to 5 pages
- 2025 chairs include researchers from Orange and Thales alongside academia
- "Registration fee: 650 EUR author regular, 600 EUR IEEE member, 350 EUR student (2025)"
- Deadline timing varies (June in 2023 and 2024, October in 2025); the 2026 edition moved to February 2027
- Not found in ICORE2026; not on the CCF list
