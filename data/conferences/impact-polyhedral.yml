notes:
- Running since 2011; first co-located with CGO, now a one-day workshop at the HiPEAC conference
- The only workshop dedicated to polyhedral compilation (loop optimization, tiling, code generation, Presburger arithmetic)
- Proceedings are posted online on the workshop website only; publication at IMPACT does not prevent later publication
  in conferences or journals
- 'Papers: up to 10 pages in ACM SIGPLAN format, short papers and presentation-only submissions welcome, via EasyChair'
- IMPACT 2027 adds a Test-of-Time session in memory of Paul Feautrier
- Not listed in CORE ICORE2026
