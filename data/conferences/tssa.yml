notes:
- Annual conference run by the Telecommunication Engineering Research Group at ITB (Institut Teknologi Bandung);
  20th edition in 2026
- Proceedings from 2021 to 2025 published in IEEE Xplore and indexed by Scopus; no-show papers are not submitted to
  IEEE Xplore
- Held in Indonesia every year (Bandung 2021, Bali 2022 and 2024, Lombok 2023, Yogyakarta 2025 and 2026); Universitas
  Sangga Buana (Faculty of Engineering) listed as patron in 2025 and 2026
- Broad telecom scope (networking, wireless, antennas, signal processing, security, AI); 5 pages for review, 4 to 6
  pages camera-ready in IEEE format
- Submission deadline usually extended by about three weeks
- Not listed in ICORE2026; a regional Indonesian telecom venue
