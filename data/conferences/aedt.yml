id: aedt
name: AEDT
full_name: International Workshop on Architecting and Engineering Digital Twins
type: workshop
tier: minor
areas: [software, systems]
region: worldwide
language: english
frequency: annual
organizer: AEDT workshop chairs (University of Innsbruck, Fraunhofer IESE, TCS Research, Wageningen University), co-located with IEEE ICSA
organizer_country: [europe, india]
proceedings: IEEE Xplore (ICSA Companion)
archival: true
typical:
  deadline_months: [12, 1, 2]
  conference_months: [3, 4, 6]
links:
  website: https://dt-engineering.uibk.ac.at/
notes:
  - Workshop on software architecture for and with digital twins, including modeling, AI and continuous engineering
  - Started in 2022 and 2023 as the International Workshop on Digital Twin Engineering, co-located with PoEM (London, Vienna)
  - Co-located with IEEE ICSA since 2024 (Hyderabad 2024, Odense 2025, Amsterdam 2026, Sydney 2027)
  - Website run by the Department of Computer Science, University of Innsbruck
  - ICSA workshop papers are published in the ICSA Companion proceedings in IEEE Xplore
  - Full papers 8 pages, short position papers 4 pages, industry case-study papers 6 pages, all including references, IEEE conference format
  - Industry talks are also accepted but are not included in the proceedings
  - Not listed in the CORE portal (ICORE2026)
