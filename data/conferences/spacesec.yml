notes:
- Co-located with the NDSS Symposium; proceedings are published post-conference with NDSS by the Internet Society
- 'Held since 2023; the 5th edition (2027) runs alongside NDSS 2027 in Seoul, Korea (NDSS: 22-26 Mar 2027), close
  to Japan'
- Double-blind review; short (4 pages) and long (8 pages) papers, including research, position, experience, preliminary
  and extended work
- Paper deadlines were extended by about one week in 2024, 2025 and 2026
- Scope covers satellite links, ground and space segments, GNSS spoofing/jamming and PQC for space; 2026 program
  included papers from Korea University
