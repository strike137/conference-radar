notes:
- Flagship NLP venue; all papers go through ACL Rolling Review (ARR), then are committed to ACL
- ACL 2027 will be held in Kyoto, Japan (Aug 17-22, 2027); final ARR deadline Jan 4, 2027; theme track on homogenization
  and knowledge collapse in LLMs
- Acceptance rate around 19-21% for the main track; a separate Findings volume takes more papers (17.8% in 2026)
- ACL 2026 accepted papers from both the ARR October 2025 and January 2026 cycles
- All attendees must hold ACL membership; virtual registration is available
