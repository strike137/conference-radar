id: unet
name: UNet
full_name: International Conference on Ubiquitous Networking
type: conference
tier: minor
areas: [networking, communications, security]
region: worldwide
language: english
frequency: annual
organizer: UNet steering committee (General Chair Essaid Sabir); 2027 hosted by TELUQ and UQAM, Montreal
organizer_country: [canada]
proceedings: IEEE Xplore
links:
  website: https://unet-conf.org/
notes:
- Also called the International Symposium on Ubiquitous Networking; 2027 is the 11th edition
- Proceedings were in Springer LNCS up to 2023; the 2027 site says papers will be published by IEEE in IEEE Xplore
- Past venues include Casablanca, Hammamet, Limoges, Montreal and Clermont-Ferrand; 2027 is in Montreal
- Regular papers of 5 to 8 IEEE pages, submitted through EDAS
- Eight tracks covering next-generation networking, 3D connectivity, green communications, IoT, AI-driven
  communications, edge/cloud computing, security and privacy, and verticals
- Not listed in ICORE2026 or the CCF list
