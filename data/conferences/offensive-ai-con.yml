notes:
- Invite-only, not-for-profit research conference on offensive uses of AI, organized by RemoteThreat
- Held in Oceanside, California every year since 2025 (2025, 2026; third edition 2027)
- "Topics: AI-based vulnerability research and exploit development, models and datasets, autonomous security testing agents, offensive operations, ethics and policy"
- Deliberately small, with no product pitches; attendance and the social programme are by invitation (request an invite on the website)
- Talks only, no proceedings; talks are collected in the research archive on the website
- CFP for 2027 opens 2027-06-01; speakers announced by the end of August
