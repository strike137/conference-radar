notes:
- Community-driven Security BSides conference in Delaware, USA, running since 2010 and hosted by Delaware universities
- Virtual or hybrid during COVID-19 (2020, 2021); returned in person in 2024
- Two days in mid-November at the University of Delaware Fintech Innovation Hub, Newark (2025 and 2026)
- Small event, roughly 130 attendees in 2025; talks, workshops, villages, CTFs (including Pros vs Joes) and SpawnCamp for kids
- Call for presentations is rolling with no hard deadline; public social media voting guides selection
- First-time speakers are encouraged and academic posters are accepted
- Talks only, no proceedings
