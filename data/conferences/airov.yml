links:
  website: https://airov.at/
notes:
- Joint symposium since 2024 of at least two of the Austrian Society for AI (ASAI), the robotics society GMAR and the Austrian Association for Pattern Recognition (OAGM, the IAPR member society) (2025 was ASAI and OAGM only); continues the annual OAGM workshop (49th OAGM conference in 2026)
- Held in Austria (Innsbruck 2024, Klagenfurt 2025, Leoben 2026, Vienna 2027)
- Built from parallel workshops plus keynotes and a poster session; every paper is submitted to one workshop, no general track
- Full papers (8 pages) or extended abstracts (2 to 4 pages), reviewed by the program committee
- Open-access proceedings by TU Wien Library with a DOI per paper (2026); the 2024 proceedings were published by innsbruck university press
- Small regional event, friendly to students and early-career researchers
- Not listed in ICORE2026
