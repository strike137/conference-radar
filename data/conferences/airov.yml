id: airov
name: AIRoV
full_name: Austrian Symposium on AI, Robotics, and Vision
type: conference
tier: minor
areas: [ai, vision]
region: europe
language: english
frequency: annual
organizer: ASAI, GMAR and OAGM (Austrian societies for AI, robotics and pattern recognition)
organizer_country: [europe]
proceedings: TU Wien Library (open access, DOI per paper)
archival: true
typical:
  deadline_months: [3]
  conference_months: [3, 4, 7]
links:
  website: https://airov.at/
notes:
- Joint symposium of the Austrian Society for Artificial Intelligence (ASAI), the Austrian Society of Measurement,
  Automation and Robot Technologies (GMAR) and the Austrian Association for Pattern Recognition (OAGM)
- Successor of the separate OAGM and Austrian Robotics Workshop (ARW) meetings; first joint edition in 2024
- Built around parallel workshops; every paper is submitted to one workshop (full paper 8 pages or extended abstract
  2 to 4 pages) through CMT
- Proceedings published open access by the TU Wien Library with a DOI per paper (2024 by innsbruck university
  press)
- Held in Austria (Innsbruck 2024, Klagenfurt 2025, Leoben 2026, Vienna 2027)
- Not ranked in CORE ICORE2026; not on the CCF 2026 list
