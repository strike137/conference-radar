notes:
- IEEE conference on smart computing (IoT, cyber-physical systems, edge and fog computing, mobile and pervasive computing, AI for smart systems)
- Location rotates worldwide (virtual from Irvine 2021, Espoo 2022, Nashville 2023, Osaka 2024, Cork 2025, Messina 2026)
- Main research track takes up to 8 pages in IEEE two-column format including references, single-blind review
- Papers are published in IEEE Xplore; in-person presentation is mandatory
- Also has an industry track, workshops, posters/demos and a PhD forum
- Extended versions of selected papers are invited to Elsevier Pervasive and Mobile Computing
- "Fees 2026: 820 EUR IEEE member early, 550 EUR student IEEE member early (student registration does not cover regular papers)"
- "CORE B (ICORE2026); not in the CCF 2026 list"
