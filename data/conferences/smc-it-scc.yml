notes:
- Two joint conferences run together since 2023 (SMC-IT 12th and SCC 17th edition in 2026)
- Sponsored by the IEEE Computer Society TC on Software Engineering and TC on Computer Architecture; chairs mostly
  from NASA JPL and NASA Ames
- Held in California every year (2023 Pasadena, 2024 Mountain View, 2025 Los Angeles, 2026 Pasadena)
- Topics are IT, computing hardware and software for space missions (flight and ground systems, radiation-tolerant
  computing, autonomy, space cybersecurity)
- Single-pass full-paper review; papers up to 10 pages excluding references, published in IEEE Xplore
- SCC also accepts presentation-only abstracts, which are not published in the proceedings
- Optional abstract feedback round in December or January before the full-paper deadline
- Many co-located workshops (space robotics, space cyber, HPSC, dependable systems, V&V)
- Not listed in ICORE2026 or the CCF list
