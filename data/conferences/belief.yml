notes:
- Biennial conference on belief functions (Dempster-Shafer theory, evidence theory) and their applications to machine learning, statistical inference and information fusion; first held in 2010
- Sponsored by the Belief Functions and Applications Society, which also runs a biennial school (BFTA) in the other years
- Proceedings in Springer LNAI, titled Belief Functions - Theory and Applications (BELIEF 2026 -> LNAI 17186); papers up to 8 pages including references
- Selected papers are invited to a special issue of the International Journal of Approximate Reasoning
- Mostly held in Europe with some editions in China (Compiegne 2018, Shanghai 2021, Paris 2022, Belfast 2024, Nanjing 2026)
- BELIEF 2024 was co-located with UKCI 2024; BELIEF 2026 allows on-site or online participation
- Not found on the CORE portal (ICORE2026) and not on the CCF list
