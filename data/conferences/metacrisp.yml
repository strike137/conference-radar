notes:
- New in 2026 (1st edition), co-located with the 47th IEEE Symposium on Security and Privacy in San Francisco
- Meta-research on security and privacy research itself (peer review, artifact evaluation, reproducibility,
  methodology, ethics)
- Full papers (up to 8 pages) go into the 2026 IEEE S&P Workshops (SPW) proceedings, published after the
  conference; short papers (2 to 5 pages) can opt in; preliminary work papers are not published
- Double-blind review, IEEE compsoc template, US letter; in-person presentation expected
- Steering committee Adam Doupe (ASU), Thorsten Holz (MPI-SP) and Patrick Traynor (University of Florida); the
  workshop also produced a MetaCRiSP Challenges 2026 report
- Not listed in ICORE2026
