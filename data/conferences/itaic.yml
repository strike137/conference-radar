id: itaic
name: IEEE ITAIC
full_name: IEEE Joint International Information Technology and Artificial Intelligence Conference
type: conference
tier: minor
areas: [ai, general]
region: china
language: english
frequency: irregular
organizer: Chongqing Global Union Academy of Science and Technology (GUAST), with IEEE sponsorship
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI]
fee: 600 USD author, 550 USD student or IEEE member, 200 USD listener (2026)
typical:
  deadline_months: [9, 10]
  conference_months: [5, 12]
links:
  website: http://www.itaic.org/
notes:
- Run by the Chongqing Global Union Academy of Science and Technology, a company that also runs IAEAC, IMCEC, ITNEC, ITOEC and ICIBA
- Held in Chongqing every edition; 2026 is the 13th edition (IEEE conference record 70556)
- Proceedings in IEEE Xplore under ISSN 2693-2865; the site says all past papers are indexed in EI
- Two submission rounds with short review cycles; papers of at least 4 pages, each registration covers one paper of up to 5 pages
- Not held every year (no edition in 2021 or 2024)
- Not listed in CORE ICORE2026 or the CCF list
