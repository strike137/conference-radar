id: itaic
name: IEEE ITAIC
full_name: IEEE Joint International Information Technology and Artificial Intelligence Conference
type: conference
tier: minor
areas: [ai, general]
region: china
language: english
organizer: Chongqing Global Union Academy of Science and Technology (GUAST), sponsored by IEEE
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI]
fee: 600 USD or 3900 CNY per paper (regular author); 550 USD for students and IEEE members; listeners 300 USD
typical:
  deadline_months: [9, 10]
  conference_months: [5, 12]
links:
  website: http://www.itaic.org/
notes:
- One of several IEEE-sponsored conferences run by GUAST in Chongqing (sister events include IMCEC)
- Broad IT and AI scope (information systems, big data, machine learning, networking, electronics)
- All accepted papers are published by IEEE (now as a serial, ISSN 2693-2865) and submitted to EI and CNKI; the site says all past papers were EI indexed
- Each paper is reviewed by at least two committee members, per the site; minimum length 4 pages
- Two submission rounds for the 2026 edition
- 12th edition held 23 to 25 May 2025; the 2022 edition was held online
- Not listed in CORE ICORE2026 or the CCF 2026 list
