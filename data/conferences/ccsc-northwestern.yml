notes:
- Regional computing education conference of the CCSC for colleges in the US Pacific Northwest
- Papers are peer reviewed, up to 10 single-spaced pages including references, and appear in the Journal of Computing Sciences in Colleges
- Also panels, tutorials, workshops and undergraduate student posters
- 2026 edition at Whitman College came with a free student hackathon (WhitmHack)
- Not listed in ICORE2026; not on the CCF list
