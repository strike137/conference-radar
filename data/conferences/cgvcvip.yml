full_name: IADIS International Conference on Computer Graphics, Visualization, Computer Vision and Image Processing
type: conference
tier: minor
areas: [vision]
region: europe
language: english
frequency: annual
organizer: IADIS (International Association for Development of the Information Society)
organizer_country: [europe]
proceedings: IADIS Digital Library (proceedings with a DOI per paper via Crossref)
archival: true
typical:
  deadline_months: [5]
  conference_months: [7]
links:
  website: https://www.cgv-conf.org/
notes:
- Run by IADIS since 2007; blind peer review; also written CGV
- Part of the IADIS Multi Conference on Computer Science and Information Systems (MCCSIS) with about ten other IADIS conferences
- Proceedings in the IADIS Digital Library, a DOI per paper via Crossref
- Best papers invited to the IADIS Journal on Computer Science and Information Systems
- Several calls for papers per edition; the last call closes about eleven weeks before the conference
- Held in Europe (Porto 2023, Budapest 2024, Lisbon 2025, Valencia 2026)
- Not listed in ICORE2026 or on the CCF 2026 list
