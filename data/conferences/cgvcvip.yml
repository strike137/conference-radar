notes:
- Organized by IADIS, a Portuguese association, as part of the IADIS Multi Conference on Computer Science and
  Information Systems (MCCSIS); running since 2007 (20th edition in 2026); program chair Yingcai Xiao (University of Akron)
- Proceedings published by IADIS Press (with ISBN and Crossref DOIs) and kept in the IADIS Digital Library; extended
  versions of the best papers go to the IADIS International Journal on Computer Science and Information Systems
- Blind peer review; covers computer graphics, visualization, computer vision and image processing
- Two calls for papers (1st and last CFP); full, short and reflection papers
- "Acceptance rate: about 16% for full papers (2025, 19 full papers from 122 submissions shared with IHCI and GET)"
- Held in Europe, mostly Portugal (online 2020 and 2021, Lisbon 2022, Porto 2023, Budapest 2024, Lisbon 2025,
  Valencia 2026)
- IADIS conferences are generally regarded as minor venues; not listed in CORE ICORE2026 or on the CCF 2026 list
