notes:
- Co-located with ESORICS; held in Toulouse in 2025 and Rome in 2026
- Covers mobile, IoT and cellular security (Android, IoT malware, LTE-M and NB-IoT fuzzing, attestation)
- Accepted papers published in Springer LNCS
- Papers up to 16 pages excluding bibliography and appendices, 20 pages total, LNCS template
- 'Small workshop: 8 papers in 2025 and 9 in 2026'
- Not listed in ICORE2026 (portal search returns no results) or the CCF list
- Not to be confused with older workshops also called MIST (Managing Insider Security Threats)
