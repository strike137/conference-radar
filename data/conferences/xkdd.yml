id: xkdd
name: XKDD
full_name: International Workshop on eXplainable Knowledge Discovery in Data Mining
type: workshop
tier: minor
areas: [ai, data]
region: europe
language: english
frequency: annual
organizer: KDD Lab (University of Pisa and ISTI-CNR) led organizing committee, co-located workshop of ECML PKDD
organizer_country: [europe]
proceedings: Springer CCIS (joint ECML PKDD workshop post-proceedings)
archival: true
typical:
  deadline_months: [6]
  conference_months: [9]
links:
  website: https://xkdd2026.isti.cnr.it/
notes:
- Workshop on explainable AI in data mining, co-located with ECML PKDD; 8th edition in 2026
- 2026 edition themed on the validation of explanations; full-day workshop
- Research and position papers up to 16 pages including references in Springer LNCS format, submitted via Microsoft CMT
- 2 to 4 page abstracts accepted for presentation only; authors may opt out of the post-proceedings
- Accepted full papers appear in the joint ECML PKDD workshop post-proceedings; the XKDD site says LNCS, but the ECML PKDD 2026 workshop call names Springer CCIS and the 2025 papers appeared in CCIS (Part IV)
- Pre-proceedings online before the workshop; at least one co-author must present
- Not listed in CORE ICORE2026
