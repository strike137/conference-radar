notes:
- Slovak national Python conference, one of the PyCon family, run by volunteers
- Held at FIIT STU (Faculty of Informatics and Information Technologies, Slovak University of Technology) in Bratislava
- Editions in 2016, 2017, 2018, 2019, 2022 and 2024 (the 6th); 2027 is the next one
- 30 minute talks, 5 minute lightning talks and 2 hour workshops chosen from a call for proposals
- Sessions for schools run in Slovak
- No papers or proceedings
