links:
  website: https://www.noconname.org/
notes:
- Oldest active hacking and IT security conference in Spain, founded in 1999 in Mallorca by a non-profit association
- Recent editions held every two years in November (2022 and 2024 in Barcelona, 2026 back in Mallorca at Parc Bit,
  Palma)
- Open CFP for technical talks (20 to 45 min) and workshops; commercial proposals and talks already given in Spain
  are rejected
- Talks in English (about 75% of the program) or Spanish, plus Catalan; no proceedings
- "Fee: 75 EUR early full pass, 100 EUR late, 120 EUR last minute (2026)"
