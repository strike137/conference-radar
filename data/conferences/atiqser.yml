- Proceedings in the ACM Digital Library; ACM sigconf template
- Tool papers and experience reports (6 pages plus up to 2 pages of references) and extended abstracts (2 pages)
- Double-blind review by at least two PC members, submission via HotCRP
- Not listed in the CORE ICORE2026 portal
