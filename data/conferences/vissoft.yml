notes:
- Main venue for software visualization research; continues the ACM SOFTVIS symposium and the IEEE VISSOFT workshop
- Two-day working conference co-located with ICSME every year, so it follows ICSME around the world (Bogota 2023,
  Flagstaff 2024, Auckland 2025, Benevento 2026)
- Research track up to 10 pages plus 2 pages of references; NIER track 5 pages; tools track 4 or 10 pages with a
  mandatory video; also poster, visions and reflections, journal-first and visualization challenge tracks
- All accepted papers (except journal-first) appear in the proceedings in IEEE Xplore
- CORE B (ICORE2026); not on the CCF 2026 list
