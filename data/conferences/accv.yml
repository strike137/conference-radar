notes:
- Biennial flagship conference of the Asian Federation of Computer Vision, held in even years (2024 Hanoi, 2026
  Osaka)
- Proceedings in Springer LNCS; double-blind review on OpenReview with a rebuttal phase; 14 pages plus unlimited
  reference pages (2026)
- Best papers invited to an IJCV special issue; acceptance about 32% (2024, 270/839)
- One author registration covers up to two papers; 1,000 USD student travel grants offered in 2026
