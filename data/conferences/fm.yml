notes:
- Flagship symposium of Formal Methods Europe (FME); research track plus a Tests and Proofs (TAP) track, industry day, doctoral symposium and workshops
- Proceedings in Springer LNCS (FM subline), gold open access
- Regular, long tool and case study papers up to 15 pages, short papers up to 6 pages; single-blind review
- Held roughly every 18 months until 2026; from 2027 it becomes annual, each autumn
- Usually in Europe but also abroad (Beijing 2021, Tokyo 2026); next Athens 2027 and Twente 2028
- CORE B (ICORE2026), CCF A
