notes:
- First and so far only edition held on 2025-05-15 in San Francisco as an IEEE S&P 2025 workshop
- Human and machine collaboration in security analytics, explainable AI, LLM-assisted analysis, malware and
  vulnerability detection
- 'Two tracks: full papers (up to 13 pages plus 5 pages of references and appendices) and short papers (4 pages);
  all accepted papers go into the IEEE workshop proceedings'
- Anonymous submission following the IEEE S&P rules
- 2025 program had 11 papers, 8 of them short papers
- Not on the list of IEEE S&P 2026 workshops, so there was no 2026 edition
- Not listed in ICORE2026 (portal search returns no results)
