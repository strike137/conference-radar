id: menacomm
name: MENACOMM
full_name: Middle East and North Africa COMMunications Conference
type: conference
tier: minor
areas: [communications, networking]
region: worldwide
language: english
frequency: irregular
organizer: IEEE ComSoc chapters of the MENA region (host section and chapter rotate)
organizer_country: [other]
proceedings: IEEE Xplore
archival: true
indexing: [Scopus, DBLP]
typical:
  deadline_months: [12, 2]
  conference_months: [2, 5]
links:
  website: https://menacomm.org/
notes:
- IEEE technically sponsored conference run by a consortium of MENA IEEE ComSoc chapters; the host chapter rotates
- Editions in Lebanon 2018 and 2025, Bahrain 2019, Morocco 2021, Jordan 2022 and Tunisia 2026; no edition in 2023
  or 2024
- Accepted and presented papers are submitted to IEEE Xplore; the site says they are also submitted for Scopus and
  DBLP indexing
- Rotates within the Middle East and North Africa; only four of the last six editions were in the Middle East, so the
  region is set to worldwide
- Hybrid format with in-person and virtual presentation; submission via EDAS
- Not listed in the CORE ICORE2026 portal
