notes:
- Hosted by the Korean Ministry of Science and ICT; organized by the non-profit CODEGATE Security Forum with Maekyung
  Media
- Held at COEX, Seoul, usually in July or August (November in 2022; no edition in 2021); 2026 was the 18th edition
  (Jul 23-24)
- 'Built around an international CTF: online preliminary in March, 24-hour on-site final at COEX; separate General
  and Junior (under 19) divisions, first prize 50,000,000 KRW'
- Also has a conference track, hands-on paid trainings (English only) and a hacking experience zone; industry event
  with no proceedings
