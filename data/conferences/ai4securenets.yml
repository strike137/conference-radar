notes:
- Workshop on AI for security and resilience of B5G/6G mobile networks (physical layer security, zero trust, federated learning, IoT)
- Run from the WICON group at RPTU Kaiserslautern-Landau, Germany
- Started in 2026 with two editions in the same year, co-located with IEEE CNS 2026 (Newark, Delaware) and WiMob 2026 (Avignon)
- Papers appear in the host conference proceedings in IEEE Xplore (CNS states all workshop papers go into the CNS proceedings and IEEE Xplore)
- Papers up to 6 pages in IEEE two-column format, submission via EDAS
- Not ranked by CORE (not in ICORE2026) or CCF
