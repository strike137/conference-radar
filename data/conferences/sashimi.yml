notes:
- MICCAI satellite workshop on image simulation and synthesis (image translation, generative models, mechanistic
  models) for medical imaging, run every year since 2016; 2026 was the 11th edition
- Accepted papers published in a Springer LNCS volume (2025 -> 978-3-032-05573-6)
- Papers up to 8 pages plus 2 pages of references in the MICCAI template, double-blind review; fully in-person
- Hosted the SynthRAD challenge (synthetic CT for radiotherapy) in 2023 and 2025
- Organizers in 2026 from King's College London, Vanderbilt, Johns Hopkins, Girona and TU Munich
- Location follows MICCAI (Daejeon 2025, Strasbourg 2026, Auckland 2027)
- "CORE rank: C (ICORE2026); not in the CCF 2026 list"
