notes:
- Half-day workshop co-located with ACM Computing Frontiers; 11th edition in 2026
- Papers published in the ACM Digital Library with the CF proceedings
- Regular papers 4 to 8 pages, extended abstracts 2 to 4 pages, double-column ACM format, anonymous submission
- Mandatory abstract registration before the submission deadline; 2026 deadline was extended by two weeks
- One author must register for the whole Computing Frontiers conference and present in person
- Follows CF, which has been held in Italy every year recently (Cagliari 2025, Catania 2026)
- Small program (3 papers plus a panel in 2026)
