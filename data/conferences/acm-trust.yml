notes:
- New ACM conference run by the ACM Emerging Interest Group on Trustworthy and Responsible Systems; first edition in 2027
- Hybrid; held in Washington, DC in 2027 with full virtual participation
- Six flagship symposia and thirty Emerging Area tracks, plus an Education Symposium, workshops and tutorials
- Full papers up to 9 pages in ACM sigconf format; double-blind review via Microsoft CMT
- Accepted papers published open access in the ACM Digital Library; authors without ACM Open coverage pay an APC (500 USD members, 750 USD non-members in 2027)
- Not listed in CORE ICORE2026 or the CCF list
