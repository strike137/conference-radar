id: tps-isa
name: IEEE TPS-ISA
full_name: IEEE International Conference on Trust, Privacy and Security in Intelligent Systems, and Applications
type: conference
tier: minor
areas: [security, ai]
region: north-america
language: english
frequency: annual
organizer: IEEE, IEEE Computer Society
proceedings: IEEE Xplore
rank:
  core: Unranked
fee: 950 USD (2026, IEEE member author, early by Oct 15); 1140 USD non-member author; student member rate (665 USD)
  cannot be used for author registration
typical:
  deadline_months: [6, 8]
  conference_months: [10, 11]
links:
  website: https://tps.ieee-cs.org/2026/
  dblp: https://dblp.org/db/conf/tpsisa/index.html
  wikicfp: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=194567
notes:
- Also called IEEE TPS; co-located with IEEE CIC and IEEE CogMI (plus IEEE RISC from 2026)
- Two submission rounds (June and August), AoE; rejected Round 1 papers can be revised and resubmitted to Round
  2; deadlines usually extended by one to two weeks
- Anonymous (double-blind) review; research papers up to 10 pages in IEEE two-column format
- Held in the USA every year (Washington DC 2024, Pittsburgh 2025, San Jose 2026)
- Selected 2026 papers invited to an IEEE TDSC special issue
