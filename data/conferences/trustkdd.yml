notes:
- Half-day workshop on trustworthy knowledge discovery and data mining in the generative AI era (robustness, fairness, privacy, explainability, alignment)
- 1st edition co-located with ACM CIKM 2025 at COEX, Seoul, listed among the CIKM 2025 accepted workshops
- Non-archival; accepted papers do not appear in formal proceedings, and already published work is welcome
- Full papers up to 9 pages, short papers up to 4 pages (plus references), ACM sigconf template, double-blind review via OpenReview
- Best paper award given at the 2025 workshop
- Not in the CIKM 2026 accepted workshop list
- Not listed in CORE ICORE2026 or the CCF 2026 list
