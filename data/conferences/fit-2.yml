notes:
- Organized every December by COMSATS University Islamabad, Pakistan; began as an international workshop and became a conference
- Technically co-sponsored by IEEE Islamabad Section; accepted papers are submitted to IEEE Xplore (proceedings in
  IEEE Xplore or the IEEE CS Digital Library since 2011, ACM DL in 2009 and 2010)
- Tracks cover NLP and generative AI, machine learning, computer vision, software engineering, cyber security,
  cloud/HPC and next-generation communications, plus a PhD symposium and tutorials
- Papers up to 6 pages in IEEE two-column format, submitted via EasyChair
- "CORE rank: National: Pakistan (ICORE2026)"
