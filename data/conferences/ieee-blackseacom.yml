notes:
- IEEE Communications Society conference held in the countries around the Black Sea since 2013 (13th edition in 2025)
- Recent hosts include Bucharest 2021, Sofia 2022, Istanbul 2023, Tbilisi 2024, Chisinau 2025 and Bucharest 2026
- Accepted and presented papers are submitted to IEEE Xplore; no-show papers can be excluded
- Regular papers up to 6 pages in IEEE double-column format (up to 2 extra pages at 100 USD each); single-blind review
  via EDAS
- Also takes posters, demos, tutorials and special sessions; IEEE ComSoc travel grants are offered for students and financially limited attendees
- Not listed in the CORE ICORE2026 portal
