notes:
- Workshop on LLMs, generative AI and AI agents across the conceptual modeling life cycle and model-driven engineering
- Organized by Hans-Georg Fill (University of Fribourg), Peter Fettke (DFKI and Saarland University), Julius Koepke (University of Klagenfurt) and Simon Curty (University of Fribourg)
- First held in March 2024 at HPI Potsdam, then co-located with ER 2024 (Pittsburgh), ER 2025 (Poitiers) and ER 2026 (St. John's, 4th edition)
- Papers up to 16 pages in LNCS style plus one page of references, double-blind review, submitted through the ER EasyChair
- Accepted papers appear in the ER workshop proceedings in Springer LNCS
- Selected papers may get a fast-track review for a special issue of the EMISA journal
- Registration goes through the ER conference
- Not listed in ICORE2026 or the CCF list
