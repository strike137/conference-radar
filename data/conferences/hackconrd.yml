notes:
- Hacker conference of the Dominican Republic, organized by the RedTeamRD community; held every year since 2023
- Two days in Santo Domingo; the 2027 edition is at Hotel Dominican Fiesta
- CFP on ConfForge with three formats; talks on the main stage, hands-on workshops and hacking rooms
- Site and most talks in Spanish (site also in English)
- No proceedings
