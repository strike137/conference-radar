notes:
- Workshop on deriving functionality from mathematical structure in functional programming (monads, effects, recursion schemes, type theory)
- Held every two years since 2006, usually affiliated with ETAPS, FLoC or ICALP (ICFP in 2010); 2022 Munich at ETAPS, 2024 Tallinn, 2026 Lisbon at FLoC
- Full papers (up to 15 pages, EPTCS format) appear in EPTCS proceedings; extended abstracts (up to 2 pages) are posted on the website only
- MSFP 2024 proceedings will be published in a combined EPTCS volume with MSFP 2026
- 2026 programme co-chairs are Robert Atkey (University of Strathclyde) and Marie Kerjean (CNRS, Universite Sorbonne Paris Nord)
- Not listed in ICORE2026 or the CCF 2026 list
