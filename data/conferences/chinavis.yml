links:
  website: https://chinavis.org/2026/
notes:
- Main Chinese visualization conference, held every July since 2014 (preceded by visualization workshops from 2008);
  hosted by CSIG and run by its visualization technical committee
- No conference proceedings; accepted English papers are recommended to SCI journals (Journal of Visualization,
  Visual Informatics) and good Chinese papers to Chinese journals, after a second review round in the journal system
- Accepts Chinese and English papers, up to 8 pages excluding references (IEEE VGTC template for English)
- Two-round anonymous review, first round on PCS; posters (2-page summary) and a separate art program (ChinaVISAP)
- Held in a different Chinese city each year (Chongqing 2023, Hong Kong 2024, Hangzhou 2025, Guiyang 2026)
