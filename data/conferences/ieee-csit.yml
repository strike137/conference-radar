notes:
- Long-running Ukrainian computer science conference held at Lviv Polytechnic National University (20th edition in 2026)
- Organized by the IEEE Ukraine Section and its joint chapters; papers go to IEEE Xplore (no-show papers excluded)
- Tracks on computational intelligence, computer science (networks, security, data) and computer science education
- Held in Lviv every autumn (Zbarazh in 2020); hybrid mode in 2026; no edition in 2025
- Papers 4 to 6 pages, at least two reviewers, no review or survey papers, at most two papers per author
- "CORE rank: National (ICORE2026, listed as Computer Sciences and Information Technologies)"
