notes:
- Workshop on human-in-the-loop and self-adaptive, behavior-aware software architectures, co-located with IEEE ICSA
- Merges the former HILA (Human-in-the-Loop Architectures) and SARECS (Adaptive and Embedded Systems) workshops of ICSA 2025
- Accepted papers appear in the ICSA Companion proceedings in IEEE Xplore
- Full papers up to 8 pages and short position papers in IEEE CS format, three reviews per paper, submitted via EasyChair
- At least one author must register and present; best paper award
- 2026 edition was a joint full day with the KDA-AI workshop in Amsterdam; 2027 edition (3rd) at ICSA 2027 in Sydney
- Organizers from the University of Southern Denmark
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
