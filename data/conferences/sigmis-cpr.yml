notes:
- Annual conference of ACM SIGMIS on IT and people (IT workforce, careers, education, future of work), held for over 60 years (64th edition in 2027)
- Started as the Computer Personnel Research conference (SIGCPR); renamed Computers and People Research in 2012
- Proceedings in the ACM Digital Library
- Includes a doctoral consortium the day before the main conference; SEED track with a later deadline
- Usually held in the USA (Atlanta 2022, Pomona 2023, Murfreesboro 2024, Waco 2025, Flagstaff 2026, St. Louis 2027); virtual in 2021
- Deadlines stated in CDT (UTC-5)
