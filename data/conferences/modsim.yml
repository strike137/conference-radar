notes:
- Biennial congress of MSSANZ, held since 1974; the society's main activity
- Broad modelling and simulation scope with a strong share of environmental, water and natural resource modelling; borderline for computer science
- Accepts full papers and extended abstracts; full papers refereed by at least two reviewers
- Proceedings published online by MSSANZ under CC BY with a DOI per paper; papers of no-show presenters are dropped
- Usually held in early December in an Australian city (Hobart 2017, Canberra 2019, Sydney 2021, Darwin July 2023, Adelaide 2025, Perth 2027)
- Often held jointly with the national conference of the Australian Society for Operations Research
- Ranked Australasian C in ICORE2026
