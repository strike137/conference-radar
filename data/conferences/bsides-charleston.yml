notes:
- Community-driven Security BSides conference in Charleston, South Carolina, USA, run by a 501(c)(3) organization started in 2012
- One day of talks in two tracks plus a lockpick village and a CTF; free hands-on workshops the evening before need separate sign-up
- Held at the Beatty Center, College of Charleston
- Open call for talks and workshops; draft slides or outlines are accepted with the submission
- Talk videos from 2013 to 2025 are on the official YouTube channel
- Talks only, no proceedings
