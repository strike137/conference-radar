id: icdcn
name: ICDCN
full_name: International Conference on Distributed Computing and Networking
type: conference
tier: minor
areas: [networking, systems]
region: south-asia
language: english
frequency: annual
organizer: International Society for Distributed Computing and Networking (ISDCN), in cooperation with ACM, ACM SIGMOBILE
  and ACM SIGOPS
organizer_country: [india]
proceedings: ACM DL (ACM ICPS); selected papers extended in a Pervasive and Mobile Computing special issue
archival: true
indexing: [ACM DL, DBLP, Scopus]
rank:
  core: 'National: India'
typical:
  deadline_months: [7, 8]
  conference_months: [1]
links:
  website: https://cs3-lab.github.io/icdcn/index.html
  dblp: https://dblp.org/db/conf/icdcn/
  wikicfp: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=173277&copyownerid=166171
notes:
- Held every early January, usually in India; the 2026 edition was in Nara, Japan (hosted by NAIST and The University
  of Osaka with IPSJ SIGs); 2027 returns to India (NIT Karnataka, Surathkal)
- Covers both distributed computing theory and networking; double-blind; regular 10 pages, short 5 pages (ACM format)
- Proceedings in ACM ICPS; selected papers fast-tracked to Theoretical Computer Science and Pervasive and Mobile
  Computing
- 'CORE rank National: India; well-established and selective'
- Authors must register at the regular rate even if they are students; one registration covers two papers
