notes:
- Held every early January, usually in India; the 2026 edition was in Nara, Japan (hosted by NAIST and The University
  of Osaka with IPSJ SIGs)
- Covers both distributed computing theory and networking; double-blind; regular 10 pages, short 5 pages (ACM format)
- Proceedings in ACM ICPS; selected papers fast-tracked to Theoretical Computer Science and Pervasive and Mobile
  Computing
- 'CORE rank National: India; well-established and selective'
- Authors must register at the regular rate even if they are students; one registration covers two papers
