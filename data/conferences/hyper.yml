notes:
- One-day workshop on hyperproperties (information-flow policies, noninterference, robustness, fairness) for the formal methods, security and machine learning communities
- Co-located with CAV (2023, Montreal 2024, Zagreb 2025, Lisbon 2026 at FLoC, Amsterdam 2027)
- Call for presentations, extended abstracts of up to 3 pages (LNCS format), single-blind review; overlap with published work is allowed
- No formal proceedings are mentioned on the site; 2024 invited selected submissions to an Acta Informatica topical collection
- Editions so far 2021, 2023, 2024, 2025, 2026; 2027 is the 6th edition
