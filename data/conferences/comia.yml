notes:
- National AI congress of the Mexican Society for Artificial Intelligence (SMIA); 2027 is the 19th edition
- Best English papers published in Springer CCIS "Artificial Intelligence - COMIA" (three volumes for 2026)
- Papers in Spanish are published in a special issue of the journal Research in Computing Science
- Double-blind review, papers up to 12 pages in Springer format, submitted through Microsoft CMT
- Held at a different Mexican university each year (Mexico City 2025, Cuernavaca 2026, Guadalajara 2027)
- Includes tutorials, workshops and an industry applications workshop
- Not listed in CORE ICORE2026
