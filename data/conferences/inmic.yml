id: inmic
name: INMIC
full_name: IEEE International Multi-Topic Conference
type: conference
tier: minor
areas: [ai, software, security, networking, systems, general]
region: south-asia
language: english
frequency: annual
organizer: Rotating Pakistani host university with IEEE sponsorship (Riphah International University in 2025)
organizer_country: [other]
proceedings: IEEE Xplore
indexing: [IEEE Xplore]
fee: Author 150 USD international non-IEEE member, 100 USD IEEE member; 15,000 PKR national non-member (2025)
typical:
  deadline_months: [8]
  conference_months: [10, 11, 12]
notes:
- Long-running Pakistani multi-topic IEEE conference (27th edition in 2025); the host university and city rotate
  within Pakistan (Islamabad, Lahore, Karachi, Bahawalpur)
- Proceedings in IEEE Xplore; only papers that are accepted and presented are submitted to IEEE Xplore
- Broad scope; 2025 tracks were AI and data science, software and systems engineering, cyber and network security,
  parallel and cloud computing, and biomedical and electrical engineering
- 6-page IEEE two-column papers submitted through Microsoft CMT
- Not listed in ICORE2026 or the CCF 2026 list; a small regional venue
- The 2025 official site (inmic2025.riphah.edu.pk) was compromised with injected gambling spam and a redirect script
  when checked on 2026-10-04, so it is deliberately not linked here
