notes:
- Half-day workshop on new safety paradigms for autonomous, AI-based and cognitive systems (dynamic and adaptive safety, safety of generative and agentic AI, risk assessment)
- Co-located with SAFECOMP on the workshop day; first edition 2025 in Stockholm, second edition 2026 in Valencia
- Papers published in the SAFECOMP workshops proceedings (Springer LNCS)
- Short papers of 6 pages and full papers up to 12 pages including references, LNCS format, submitted via EasyChair; at least 3 reviewers per paper
- Chaired by Mario Trapp (TUM) with co-chairs from University of Waterloo, SICK AG and TUV Sud China (2026); linked to EWICS
- Not listed in CORE ICORE2026 or on the CCF list
