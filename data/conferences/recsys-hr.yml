full_name: Workshop on Recommender Systems for Human Resources
type: workshop
tier: minor
areas: [ai, data]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizers (IT University of Copenhagen, Jobindex, TechWolf, Indeed, Ghent University); co-located with ACM RecSys
organizer_country: [europe]
proceedings: CEUR-WS
archival: true
typical:
  deadline_months: [7, 8]
  conference_months: [9]
links:
  website: https://recsyshr.aau.dk/
notes:
- Half-day workshop at ACM RecSys on recommender systems and related techniques for HR (job recommendation, recruitment, skills, career management)
- Held with RecSys since 2021 (Amsterdam, Seattle, Singapore, Bari, Prague, Minneapolis); 2026 was the sixth edition
- Proceedings in CEUR-WS for every edition (Vol-2967, 3218, 3490, 3788, 4046)
- Research and position papers of 4 to 10 pages excluding references, two-column CEUR template
- Double-blind review by at least two PC members via EasyChair
- 2026 added a shared task, the RecSys in HR WorkRB Challenge
- In person; video presentation allowed only for documented visa or travel problems
- Not listed in the CORE ICORE2026 portal
