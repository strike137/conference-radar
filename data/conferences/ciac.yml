notes:
- Biennial conference on algorithms and complexity theory, held in odd years; formerly the Italian Conference on Algorithms and Complexity
- Usually held in Rome, with editions in Barcelona 2013, Paris 2015, Athens 2017 and Larnaca 2023
- Proceedings in Springer LNCS; 2025 in two volumes (LNCS 15679 and 15680), 44 full papers from 110 submissions
- CORE C (ICORE2026); not on the CCF list
