notes:
- Workshop on software test architecture, test design concepts and notations (UML/UTP, ISO/IEC/IEEE 29119), co-located with IEEE ICST
- 13th edition in 2026 (Daejeon); earlier ones in Naples 2025, Canada 2024, Dublin 2023, virtual 2021 and 2022, Porto 2020
- Research papers up to 10 pages plus 2 pages of references, industrial experience reports up to 6 pages, emerging idea proposals up to 4 pages, IEEE double-column format
- Single-blind review by two PC members
- Papers published in the IEEE Digital Library as post-proceedings
- Small workshop with a strong Japanese testing community presence; 2026 had about six papers in one afternoon
- Not among the ICST 2027 workshops yet (returning workshop proposals due 2026-11-04); not listed in ICORE2026 or the CCF 2026 list
