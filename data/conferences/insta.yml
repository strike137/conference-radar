notes:
- Half-day workshop on software test architecture (test design concepts, notations, test requirement analysis), co-located with IEEE ICST
- 13th edition in 2026; first held in 2015
- Research papers up to 10 pages, industrial experience reports up to 6 pages and emerging idea proposals up to 4 pages (IEEE two-column)
- Single-blind review by two PC members; papers published in the IEEE Digital Library as post-proceedings
- Organized by Jon Hagar (Grand Software Testing, USA) and Satoshi Masuda (Tokyo City University); many Japanese authors and PC members
- Not among the ICST 2027 workshops announced as of 2026-11-07
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
