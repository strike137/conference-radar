links:
  website: https://dramsec.ethz.ch/
notes:
- Full-day workshop co-located with ISCA every year since 2021 (6th edition in 2026)
- Topics are attacks and defenses on DRAM such as RowHammer, RowPress and ColumnDisturb, plus tools for testing DRAM security
- Short papers of at most 5 pages excluding references; double-blind review via HotCRP
- No published proceedings; accepted papers are posted on the workshop site so authors can extend them later
- Strong industry participation (NVIDIA, Microsoft, Rambus, Micron, Intel) on the committees
- Hybrid; livestreamed to registered remote ISCA attendees
