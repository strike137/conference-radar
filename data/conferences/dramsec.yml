organizer: Steering committee from ETH Zurich (SAFARI group, Onur Mutlu and Kaveh Razavi), NVIDIA, Microsoft and
  Georgia Tech; 2026 chairs Yuval Yarom (Ruhr University Bochum) and Steven Woo (Rambus)
organizer_country: [europe, usa]
proceedings: Workshop website (PDFs of accepted papers, non-archival)
archival: false
typical:
