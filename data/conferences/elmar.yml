notes:
- Long-running Croatian symposium (68th edition in 2026), held every September in Zadar on the Adriatic coast
- IEEE Region 8, the IEEE Croatia Section and several of its chapters are listed as technical co-sponsors on the site
- Topics include wireless communications, 5G, antennas and propagation, image and video processing, computer vision,
  radar, navigation, robotics and space technologies
- Papers are accepted by two independent reviewers and the proceedings are submitted to IEEE Xplore
- The paper deadline is usually extended by about two weeks (May 6 -> May 20 in 2026, May 14 -> May 28 in 2025)
- Not listed in the CORE ICORE2026 portal or the CCF list
