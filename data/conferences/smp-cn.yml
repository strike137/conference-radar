id: smp-cn
name: SMP
full_name: China National Conference on Social Media Processing
name_local: 全国社会媒体处理大会
type: conference
tier: domestic
areas: [nlp, data, ai]
region: china
language: chinese
frequency: annual
organizer: CIPS Social Media Processing Committee (Chinese Information Processing Society of China)
organizer_country: [china]
proceedings: None (poster call only, no paper proceedings)
archival: false
fee: Main meeting 1400 CNY (CIPS student member) to 2200 CNY (non-member professional), 2026 normal registration
typical:
  deadline_months: [10]
  conference_months: [11]
links:
  website: http://www.cips-smp.org/
notes:
- National conference of the CIPS Social Media Processing committee, started in 2012; annual except 2021
- 'Format: two days of tutorials followed by a two-day main meeting with keynotes, about 12 topical forums,
  a PhD forum and technical evaluation tasks'
- Topics now center on large language models, agents, computational social science and communication
- Poster call accepts work already published in the last three years, arXiv preprints and work under review; no
  proceedings
- Held in a different Chinese city each year (Wuhan 2025, Beijing 2026)
- Not listed in the CORE ICORE2026 portal or the CCF list
