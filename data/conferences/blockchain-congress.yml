notes:
- Blockchain and distributed ledger technology congress, held yearly since 2019; co-located with PAAMS, DCAI and the other events of the same group
- Main track and workshop papers in separate Springer LNNS (Lecture Notes in Networks and Systems) volumes
- Papers up to 10 pages (6 for the doctoral consortium) in the LNNS template; at least three reviewers per paper; one author must register and present
- 2026 deadlines were extended twice (17 Apr -> 8 May -> final 22 May)
- Selected papers invited to journal special issues (IJIMAI, CMC, MDPI journals, ADCAIJ)
- Held in Europe (Salamanca 2024, Lille 2025, Naples 2026)
- Not listed in CORE ICORE2026 or the CCF 2026 list
