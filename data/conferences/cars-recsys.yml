notes:
- Long-running half-day workshop on context-aware recommender systems, co-located with ACM RecSys
- Series started in 2009; editions 2009 to 2012 and again yearly since 2019 at RecSys
- Early editions (CARS 2011 and 2012) were published in CEUR-WS; recent accepted papers are linked from the workshop website only
- Papers of ideally 4 to 8 pages (excluding references) in ACM single-column format, single-blind review via the RecSys workshops EasyChair
- arXiv preprints are allowed; at least one author must attend; accepted papers get an oral or poster slot
- Location follows RecSys (Bari 2024, Prague 2025, Minneapolis 2026)
- Not listed in CORE ICORE2026 or the CCF 2026 list
