notes:
- CVPR workshop on generating and using synthetic data for computer vision; held at CVPR since 2024, 3rd edition in 2026
- Short papers (4 pages) and long papers (8 pages) excluding references, CVPR template, double-blind review on OpenReview
- Non-archival; accepted papers are not included in the CVPR proceedings, so dual submission is not a concern
- 54 accepted papers presented as posters in 2026, with best long and short paper awards
- Half-day workshop with invited talks
- Not listed in ICORE2026 or the CCF list
