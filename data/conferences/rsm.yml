notes:
- Micro and nanoelectronics symposium of the IEEE EDS Malaysia Chapter, the odd-year sibling of IEEE ICSE (Malaysia)
- Technically co-sponsored by the IEEE Electron Devices Society
- Biennial (odd years); 15th edition in 2025
- Held in Malaysia (Langkawi 2023, Malacca 2025)
- 4 to 5 page papers via EDAS; presented papers are submitted to IEEE Xplore
- Not listed in ICORE2026 or the CCF list
