notes:
- WS-12 at IEEE GLOBECOM 2026 in Macau; grew out of a GLOBECOM 2025 tutorial on sub-THz wavefront engineering
- Topics include near-field propagation, holographic MIMO, reconfigurable intelligent surfaces, non-diffracting and
  caustic beams and OAM for mmWave and sub-THz 6G systems
- Accepted and presented papers go into the GLOBECOM workshop proceedings in IEEE Xplore; no-show papers are removed
- Submissions via EDAS through the GLOBECOM workshop call
- Not listed in ICORE2026
