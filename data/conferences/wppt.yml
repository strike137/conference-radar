notes:
- First edition in 2026 as a one-day affiliated workshop of ASIACRYPT 2026, organized by the Ethereum Foundation
- Covers privacy-preserving technologies from theory to deployment, including ZK proofs, MPC, anonymous credentials, blockchain privacy and privacy in practice
- Keynote talks plus contributed presentations selected from abstracts of up to 3 pages; single-blind review
- 'Non-archival: no proceedings, and presenting does not restrict publication elsewhere'
- At least one author of an accepted presentation must register and present in person
