notes:
- Multidisciplinary smart city conference run by Medi-ASD with Karabuk University (Turkiye) and Abdelmalek Essaadi University (Morocco) chairs; started in 2016, 11th edition in 2026
- Not to be confused with SCA, the ACM SIGGRAPH/Eurographics Symposium on Computer Animation
- Papers go to the Springer LNNS book series "Innovations in Smart Cities Applications" (volume 9 for 2025, volume 10 for 2026) or to the ISPRS Archives, at the author's choice
- Topics range from AI, IoT and mobility to e-governance, healthcare, education and geo-information systems
- Hybrid format with online sessions and onsite sessions
- Host rotates (online 2020 and 2021, Castelo Branco 2022, Paris 2023, Tangier 2024 and 2025, Karabuk 2026)
- Selected extended papers are invited to a journal (Journal of Smart Cities and Society in 2026)
- Not listed in CORE ICORE2026
