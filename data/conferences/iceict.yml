id: iceict
name: IEEE ICEICT
full_name: IEEE International Conference on Electronic Information and Communication Technology
type: conference
tier: minor
areas: [communications, general]
region: china
language: english
frequency: annual
organizer: IEEE Harbin Section with a Chinese host university (Foshan University in 2026)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI]
fee: 3500 CNY early regular author covering 2 papers; 1800 CNY early student (2026)
typical:
  deadline_months: [6, 10]
  conference_months: [7, 8, 11]
links:
  website: http://www.iceict.org/
notes:
- Sponsored by IEEE Harbin Section and a host university, supported by the IEEE Harbin AP/MTT/EMC Joint Chapter
- Held in China every year since 2019 at a different host university (2023 Qingdao, 2024 Xi'an, 2025 Weihai, 2026 Foshan)
- Broad EE scope with a strong focus on antennas and microwave; also communications, signal processing, circuits and AI
- Accepted papers are published in IEEE Xplore and indexed in EI Compendex
- Regular papers 2 to 6 pages in IEEE format; extra pages cost extra; many special sessions
- Short gap between submission and notification (7 to 10 days); not listed in CORE ICORE2026 or the CCF list
