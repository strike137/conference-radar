notes:
- Workshop on the architectural side of DevOps, MLOps and other xOps practices, co-located with IEEE ICSA
- 1st edition on 22 June 2026 at ICSA 2026, Vrije Universiteit Amsterdam
- Technical papers and industry case studies up to 8 pages, position, vision and work-in-progress papers up to 4 pages
- ICSA 2026 workshop papers are published in the ICSA Companion Proceedings in IEEE Xplore; the workshop page itself does not state the proceedings
- Organizers from Tampere University, University of Oulu (Finland) and Budapest University of Technology and Economics (Hungary)
- Not on the ICSA 2027 accepted workshop list, so no next edition is announced
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
