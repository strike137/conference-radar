notes:
- Half-day workshop at IEEE/ACM SC on sustainability of supercomputing, from data centres and hardware to system software and applications
- Topics include energy efficient HPC and AI hardware, embodied carbon and lifecycle, data centre operation, power monitoring and energy optimisation
- Short work in progress papers (up to 5 pages) and full papers (6 to 10 pages), IEEE template, submitted via the SC Linklings system
- Accepted papers appear in the SC Workshop Proceedings; at least one author must present in person
- SC26 lists it among the workshops with SC Workshop Proceedings
- Not listed in CORE ICORE2026
