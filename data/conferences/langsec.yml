id: langsec
name: LangSec
full_name: Workshop on Language-Theoretic Security
type: workshop
tier: minor
areas: [security, software]
region: north-america
language: english
frequency: annual
organizer: IEEE CS Security and Privacy Workshops (co-located with IEEE S&P); chairs Sergey Bratus (Dartmouth) and
  Erik Poll (Radboud University)
organizer_country: [usa]
proceedings: IEEE Xplore (IEEE S&P Workshops proceedings)
archival: true
typical:
  deadline_months: [2]
  conference_months: [5]
links:
  website: https://langsec.org/spw26/
notes:
- One-day workshop co-located with the IEEE Symposium on Security and Privacy in San Francisco; held since 2014
  (12th edition in 2026)
- Focus on treating inputs as formal languages and parsers as recognizers (parser security, protocol and file
  format design, input-handling bugs)
- Research papers (final version up to 10 pages, IEEE 2-column) go into the IEEE-managed workshop proceedings;
  work-in-progress reports and panels are posted on the LangSec website only
- Submissions need not be anonymized; shepherding is offered to authors with less academic writing experience
- Deadlines are usually extended (preliminary CFP said 2026-01-20, final deadline 2026-02-13)
- Also runs the LangSec Bug of the Year Awards
- Not listed in ICORE2026
