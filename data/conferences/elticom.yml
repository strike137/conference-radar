id: elticom
name: ELTICOM
full_name: International Conference on Electrical, Telecommunication and Computer Engineering
type: conference
tier: minor
areas: [communications, general]
region: southeast-asia
language: english
frequency: annual
organizer: Department of Electrical Engineering, Faculty of Engineering, Universitas Sumatera Utara (USU)
organizer_country: [indonesia]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [8, 9]
  conference_months: [10, 11]
links:
  website: https://ocs.usu.ac.id/ELTICOM/elticom2026
notes:
- Organized by the Department of Electrical Engineering at Universitas Sumatera Utara; IEEE Indonesia Section
  members on the technical program committee
- Held every year in Medan, Indonesia (10th edition in 2026)
- Accepted and presented papers are submitted to IEEE Xplore; previous proceedings are in IEEE Xplore
- Double-blind review; at least one author must register and present
- 2026 has two submission batches, both extended
- Not listed in the ICORE2026 portal or the CCF 2026 list
