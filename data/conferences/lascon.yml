notes:
- OWASP-associated application security conference held every year in Austin, Texas, since 2010 (2012 was hosted as OWASP AppSec USA; 2020 cancelled)
- Gathers 400+ web app developers, security engineers, mobile developers and security professionals
- Two conference days (Thursday and Friday) after two days of paid pre-conference training; held at Norris Conference Centers Austin in 2026
- Separate Call for Presentations and Call for Training; both closed by mid June for the October 2026 edition
- No proceedings; talks are posted as YouTube playlists
