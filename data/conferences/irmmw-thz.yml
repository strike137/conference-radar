notes:
- Oldest and largest continuous conference on infrared, millimeter-wave and terahertz science and technology, begun in
  1974
- Run by the IRMMW-THz Society, a US non-profit with an international organizing committee; linked to the Journal of
  Infrared, Millimeter, and Terahertz Waves and IEEE Transactions on Terahertz Science and Technology
- Scope runs from mm-wave devices and systems to far-infrared detectors, nano-scale structures, accelerators and
  tokamaks
- Submissions are abstracts reviewed by the TPC; accepted authors submit a final extended abstract of up to 2 pages,
  published in the conference digest in IEEE Xplore
- Early submission option (February) with early notification; late news abstracts accepted until the final deadline
- Rotates between the USA, Asia and Europe on a three year cycle (Montreal 2023, Perth 2024, Helsinki 2025, Salt Lake
  City 2026, Fukuoka 2027, Warwick 2028)
- Around 1000 attendees at peak (Paris 2019)
- Physics and EE venue outside the usual CS rankings, not listed in ICORE2026
