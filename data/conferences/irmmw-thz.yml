notes:
- Oldest and largest continuous conference on infrared, millimeter-wave and terahertz science and technology, held
  since 1974 (merged with the International Conference on THz Electronics in 2004)
- Run by the IRMMW-THz Society, a US non-profit with an elected International Organizing Committee
- Annual, rotating worldwide (Delft 2022, Montreal 2023, Perth 2024, Helsinki 2025, Salt Lake City 2026, Fukuoka 2027,
  Warwick 2028)
- Papers are 2-page extended abstracts reviewed by the TPC; the conference digest is published in IEEE Xplore
- Early submission option (February) with early notification, and a late news abstract window
- Not listed in CORE ICORE2026
