notes:
- Sponsored by ACM SIGPLAN and co-located with ICFP (with ICFP/SPLASH in Singapore 2025, Indianapolis 2026)
- Accepted papers are published in the ACM Digital Library; demo proposals and lightning talks are not
- Regular papers, functional pearls, tutorials, experience reports, talk proposals and demos
- From 2026 uses the single-column acmsmall format with a 25-page limit for regular papers (12 pages in two-column format in 2025)
- Listed in CORE ICORE2026 as "Haskell Workshop", rank C
