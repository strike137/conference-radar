notes:
- Workshop on quantum computing for query processing, retrieval, knowledge graphs and hybrid classical-quantum data systems
- 1st edition with IJCKG 2025 (Heraklion, Greece), 2nd edition with VLDB 2026 (Boston); host conference changes
- Regular papers up to 12 pages, short papers up to 6 pages, extended abstracts up to 2 pages, excluding references; VLDB workshop style
- Single-blind review by at least three PC members on CMT
- 2026 papers published jointly with the other VLDB workshops
- Half-day program with keynotes and paper talks
- Not listed in CORE ICORE2026 or in the CCF 2026 list
