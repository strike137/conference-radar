notes:
- SIAM's data mining conference, held in the US; traditionally late April or early May with an autumn deadline
- SDM26 moved to November 2026 (Salt Lake City) with an April deadline, held jointly with SIAM MDS26 and IS26
- Triple-blind review; 8 pages with unlimited references and appendices; SDM26 used OpenReview
- Smaller than KDD or ICDM but well regarded in the data mining community; has a doctoral forum for PhD students
