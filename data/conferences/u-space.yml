notes:
- Workshop on safe, dependable and secure UAV operations in low-altitude urban airspace (U-Space, UTM, CNS, GNSS vulnerabilities, assurance)
- Co-located with the European Dependable Computing Conference (EDCC); 2026 was the second edition
- Accepted papers go to the EDCC companion proceedings (EDCC-C) managed by IEEE Conference Publishing Services and considered for inclusion in IEEE Xplore
- Papers up to 8 pages in IEEE two-column format, submitted via EasyChair; an author must register for the full EDCC conference
