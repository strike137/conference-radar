notes:
- Flagship conference of IEEE ComSoc, held every December; very large, many parallel symposia
- One deadline around April or May, usually extended; submissions via EDAS
- Has a Communication and Information System Security symposium
- 'Often held in Asia: Kuala Lumpur 2023, Taipei 2025, Macau 2026'
- Acceptance rate historically around 35-38%
