notes:
- Forum on declarative logic programming, answer set programming, non-monotonic reasoning and knowledge representation
- Proceedings in Springer LNAI; long papers up to 15 pages and short papers up to 8 pages, single-blind review via EasyChair
- Held roughly every two years since 1991; recent editions Espoo 2017, Philadelphia 2019, Genova 2022, Dallas 2024,
  Klagenfurt 2026
- Best papers are invited to the Artificial Intelligence Journal or JAIR, and 5 to 7 logic programming papers to TPLP
- Also has a Recently Published Research track, workshops and a Doctoral Consortium
- Not in the CCF list
