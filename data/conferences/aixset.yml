id: aixset
name: AIxSET
full_name: International Conference on Artificial Intelligence x Science, Engineering, and Technology
type: conference
tier: minor
areas: [ai]
region: north-america
language: english
frequency: annual
organizer: AIx conference series (same organizers as AIxSE, AIxMHC, AIxB and AIxHEART)
organizer_country: [usa]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [6, 7]
  conference_months: [9, 10]
links:
  website: https://www.aixset.org/
notes:
- AI applications in science, engineering and technology domains; first held in 2024
- Successor of ai4i (AI for Industries, 2018 to 2023) and TransAI (Transdisciplinary AI, 2019 to 2023)
- Co-located with AIxB, AIxHEART and AIxMHC at VOCO Laguna Hills, Laguna Hills, California, in hybrid format; one registration
  covers all co-located conferences
- Accepted papers submitted for inclusion in IEEE Xplore; 2024 and 2025 proceedings are in IEEE Xplore
- Regular and workshop papers 8 pages, short 4, position 2 (IEEE format); at least three reviewers per paper
- Each paper needs a full-rate registration and presentation or it is removed from the proceedings; posters are in person only
- Deadlines were extended by about three weeks in 2026
- Not listed in ICORE2026; not on the CCF 2026 list
