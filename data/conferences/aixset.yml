notes:
- One of the AIx conferences that replaced ai4i (AI for Industries) and TransAI (Transdisciplinary AI) in 2024; co-located with AIxB, AIxHEART and AIxMHC
- Held in Laguna Hills, California every year since 2024; hybrid format
- 2024 and 2025 proceedings in IEEE Xplore as the Conference on AI, Science, Engineering, and Technology (AIxSET)
- Regular and workshop papers 8 pages, short 4, position 2, in IEEE double-column format; at least three reviewers per paper
- Accepted papers must be presented; poster abstracts are in person only
- Not listed in ICORE2026 or the CCF 2026 list
