notes:
- Main Latin American venue for database theory and foundations of data management, held since 2006
- Rotates across Latin America (past hosts include Lima, Buenos Aires, Santiago, Montevideo, Cali and Mexico City; 2026 Arequipa)
- Not strictly annual (16th edition in 2024, 17th in 2026)
- Regular papers up to 12 pages and short papers up to 6 pages, CEURART single-column style, via EasyChair
- Original papers are published in CEUR Workshop Proceedings; "[Recent Work]" papers are not published
- Preceded by a summer school (2026 school November 9 to 10, workshop November 11 to 13)
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
