notes:
- Workshop on multimodal retrieval (text, images, audio, video) and retrieval-augmented generation grounded in multimodal evidence
- Runs a shared task on video retrieval and grounded article generation from multiple videos, with system description papers
- Held with ACL 2025 (Vienna) and ACL 2026 (San Diego); one-day hybrid event
- Research papers in ACL format through OpenReview; archival and non-archival submissions allowed
- Archival papers go to the ACL Anthology (10 papers in 2025, 11 in 2026)
- Not ranked in ICORE2026 and not on the CCF list
