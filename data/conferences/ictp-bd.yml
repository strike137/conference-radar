id: ictp-bd
name: IEEE ICTP
full_name: IEEE International Conference on Telecommunications and Photonics
type: conference
tier: minor
areas: [communications, networking]
region: south-asia
language: english
frequency: biennial
organizer: IEEE Communications Society Bangladesh Chapter
organizer_country: [other]
proceedings: IEEE Xplore
archival: true
fee: 250 USD IEEE member / 300 USD non-member for foreign authors, 200 / 225 USD for students (2025); local authors 5,000
  to 10,000 BDT
typical:
  deadline_months: [8, 9]
  conference_months: [12]
links:
  website: https://ieee-ictp.buet.ac.bd/
notes:
- Organized by the IEEE ComSoc Bangladesh Chapter; technically co-sponsored by the IEEE Photonics Society Bangladesh
  Chapter and the Optica Bangladesh Section
- Held every two years in December in Dhaka (2015, 2017, 2019, 2021, 2023, 2025); the 2025 edition was at the ECE
  Building, BUET
- Specialized telecommunications and photonics conference; tutorials and workshops also invited
- Accepted and presented papers are submitted to IEEE Xplore (2025 conference record number 68765); in-person
  presentation is required
- Each paper reviewed by at least two TPC members; submission via Microsoft CMT in IEEE format
- Submission deadline extended twice in 2025 (2025-08-15 -> 2025-08-31 -> 2025-09-07)
- Not found in ICORE2026
