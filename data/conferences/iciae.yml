notes:
- Run by the Institute of Industrial Applications Engineers (IIAE, Kitakyushu); sibling of ICISIP; 15th edition in 2027
- Held each year on March 26 to 30 in Japan (Kitakyushu 2021 and 2025, Matsue 2022, 2024 and 2027, Okinawa 2023, Okayama 2026); 2014 in Changshu, China
- Broad topics aimed at industrial applications (electrical, electronic, mechanical, control, sensing, information and network technology, image processing)
- Full papers 4 to 8 pages; oral, poster, online and video presentation sessions
- Proceedings self-published by IIAE (ICIAE2026 ISBN 978-4-907220-37-2); selected papers recommended to the IIAE journals JIIAE and JMTI or EI-indexed journals
- Not listed in CORE ICORE2026
