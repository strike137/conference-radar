notes:
- Workshop on AI-generated content in retrieval ecosystems (evaluation validity, provenance and attribution, trust signals, user interaction)
- First edition co-located with ACM SIGIR 2026 in Melbourne, Australia (half-day workshop on July 24, 2026)
- Papers up to 4 pages plus references in the ACM sigconf format, anonymous submission via OpenReview
- Runs micro shared tasks and the SEED competition on provenance tracing in sequential deepfake facial edits (Codabench)
- Accepted papers are posted as PDFs on the workshop website; 8 papers in the 2026 program
- Only one edition so far
- Not listed in ICORE2026 and not on the CCF list
