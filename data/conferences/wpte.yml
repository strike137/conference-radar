notes:
- Workshop on program transformations, evaluation strategies and operational semantics using rewriting methods
- Held since 2014; WPTE 2026 was the 12th edition (no edition in 2024)
- Affiliated with FSCD most years (Rome 2023, Birmingham 2025, Lisbon 2026 at FLoC); 2020 and 2021 online, 2022 in Haifa at FLoC
- Three submission categories (regular paper, work in progress, presentation only), up to 10 pages in EPTCS style
- All accepted contributions go into informal proceedings for participants; 2020 to 2025 papers were selected for JLAMP special issues
- Not listed in ICORE2026 or the CCF list
