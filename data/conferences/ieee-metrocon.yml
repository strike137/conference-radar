notes:
- One-day regional technical conference run by the IEEE Fort Worth Section, held in the Dallas and Fort Worth area of Texas
- Program is mostly invited talks across eight tracks (aerospace and defense, power, circuits, biotech, wireless and sensors, secure and intelligent systems, careers, ventures) plus a student poster competition
- Short papers of up to 3 pages in IEEE format, peer reviewed, submitted through EDAS
- Presented papers go to IEEE Xplore; papers not presented in person are excluded
- Very small proceedings (the 2025 volume is about 24 pages)
- Held since 2015, per the past conferences page
- Not listed in CORE ICORE2026 or the CCF list
