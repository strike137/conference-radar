links:
  website: https://audiomostly.com/
notes:
- Interdisciplinary conference on the design and experience of interaction with sound (sonic interaction, auditory display, games, new musical instruments)
- Proceedings published open access by ACM in the International Conference Proceedings Series (ACM DL); APC may apply for authors outside ACM Open institutions
- Held annually in Europe since 2006 (Graz 2020 and Trento 2021 virtual, St. Poelten 2022, Edinburgh 2023, Milan 2024, Coimbra 2025)
- 2025 edition (20th) was a joint conference with ICAD 2025 in Coimbra
- No edition in 2026; the 21st edition is in 2027 at the University of the West of England, Bristol
- Long and short papers, double-blind review with three reviews per submission; at least one author must register and attend
- Not listed in the ICORE2026 CORE ranking
