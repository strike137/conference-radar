notes:
- Workshop on narrative understanding, extraction, representation and generation from text, with an information
  retrieval angle
- Held with ECIR every year (Lucca 2025, Delft 2026, Southampton 2027)
- Full papers up to 8 pages, short papers up to 5 pages plus references; double-blind review by at least two PC members
- Proceedings published as a CEUR volume (Vol-3964 in 2025, Vol-4202 in 2026), open access and indexed by DBLP
- Accepts dissemination papers about work already published elsewhere
- Not listed in ICORE2026 and not on the CCF list
