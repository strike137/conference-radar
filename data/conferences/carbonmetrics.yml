notes:
- One-day workshop held with ACM SIGMETRICS on metrics, modeling and measurement for carbon-aware computing
- First edition in 2025 (Stony Brook), second in 2026 (Ann Arbor)
- Short submissions of up to 2 pages excluding references (talk abstracts and vision statements) in the PER template,
  via HotCRP
- Revised accepted submissions are published in a special issue of ACM Performance Evaluation Review (PER), with
  one extra page allowed
- Authors keep copyright and are free to submit the work elsewhere
- Location follows SIGMETRICS
- Not listed in CORE ICORE2026 and not on the CCF 2026 list
