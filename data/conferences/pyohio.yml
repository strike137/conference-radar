notes:
- Free annual Python community conference based in Ohio, founded in 2008; 2026 was the 19th edition
- Free to attend thanks to sponsors and individual donations made through the Python Software Foundation
- Held in Cleveland, Ohio; The Westin Cleveland Downtown in 2024, Cleveland State University Student Center in 2025 and 2026, and the same student center again for 2027
- The 2023 edition took place on December 16
- Two days of mostly 30 minute talks in several tracks, plus keynotes, lightning talks and open spaces; a Black Python Devs Leadership Summit was co-hosted the day before in 2026
- Talks chosen from a six week CFP on Pretalx, up to three proposals per speaker, first time speakers welcome
- No papers or proceedings; practitioner talks only
