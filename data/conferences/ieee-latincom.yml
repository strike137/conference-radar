notes:
- Organized by the IEEE Communications Society in its Latin America Region; held annually since 2009
- Rotates among Latin American countries (Panama City 2023, Medellin 2024, Antigua Guatemala 2025, Cusco 2026)
- Papers up to 6 pages in English via EDAS (2 extra pages at 100 USD each); accepted and presented papers go to IEEE Xplore
- No-show papers can be excluded from IEEE Xplore; one full or limited registration covers up to 2 papers
- Deadlines are usually extended by several weeks
- The per-year site moves (latincomYYYY.ieee-latincom.org); the ComSoc listing links to the current one
- Not ranked in CORE ICORE2026
