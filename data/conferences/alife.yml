notes:
- Main annual conference of ISAL; since 2018 one conference per year under the ALIFE name
- Full papers 3 to 8 pages, single-blind review, published open access by MIT Press
- Summaries of already published work (2 pages) and late-breaking abstracts are presented but not in the proceedings
- Recent papers from the Artificial Life journal (MIT Press) are accepted directly as oral talks
- Location rotates worldwide (2023 Sapporo, 2024 Copenhagen, 2025 Kyoto, 2026 Waterloo, 2027 Prague); usually hybrid
- "CORE rank: C (ICORE2026, listed as International Conference on the Simulation and Synthesis of Living Systems)"
