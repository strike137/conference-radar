notes:
- Practitioner database conference run by the IT media company IT168 and its ITPUB and ChinaUnix technical communities;
  first held in 2010, 2026 was the 17th edition
- Two main sessions plus 16 or more technical tracks (database kernels, distributed and cloud-native databases, AI for
  DB, DB for AI, vector databases, real-time data warehouses, NoSQL), plus paid training courses
- Speakers apply through a speaker application form; no paper submission and no proceedings
- Held in Beijing (Beijing International Convention Center 2021 and 2023, Langlizi Xishan Garden Hotel 2024 to 2026);
  2022 was online
- Not in the CORE ICORE2026 portal or the CCF 2026 list
