links:
  website: https://www.swisstext.org/
notes:
- Started in 2016 at ZHAW Winterthur; run by SwissNLP and moves between Swiss universities since 2022
- New tagline "Swiss Conference for Text, Speech and Language AI" from 2027
- Mixed industry and academic audience; one-day event in 2026
- Scientific Track and Corpus Track papers are archival in the ACL Anthology (2023 onwards); Applied Track and Demo
  Track abstracts are non-archival
- Full papers up to 8 pages and short papers up to 4 pages in ACL style, double-blind via OpenReview
- 2020 edition held online jointly with KONVENS
- Not listed in CORE ICORE2026 or the CCF 2026 list
