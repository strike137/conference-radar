notes:
- Workshop on LLMs and vision-language models for autonomous driving (scene understanding, planning, simulation, datasets)
- Held twice a year so far, with WACV (2024, 2025, 2026) and IEEE ITSC (2024, 2025); WACV 2026 was the 5th edition
- WACV editions publish papers in the WACV workshop proceedings in IEEE Xplore (10 papers on CVF Open Access in 2026)
- Papers 6 to 8 pages in the WACV main conference format
- The ITSC 2025 edition (Gold Coast, Australia) ran the NuPlanQA visual question answering challenge
- Not listed in ICORE2026 or the CCF list
