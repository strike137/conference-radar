notes:
- Merges two workshop series, LAMAS (Logical Aspects of Multi-Agent Systems, held since 2002) and SR (Strategic Reasoning, annual since 2013)
- Topics include strategy logics, epistemic logic, game theory, synthesis and verification of multi-agent systems
- First joint edition in 2026, co-located with KR 2026 at FLoC 2026 in Lisbon
- Extended abstracts of up to 4 pages plus references in KR format, single-blind review; published and unpublished work welcome
- No formal proceedings; accepted abstracts are posted on the website and best papers are invited to a journal special issue
- Not listed in ICORE2026
