notes:
- Long-running symposium on parallel and distributed simulation, real-time systems, digital twins and virtual
  environments (30th edition in 2026, first held in 1997)
- Proceedings published by IEEE CS Press (IEEE Xplore)
- Mostly held in Europe (Valencia 2021, Ales 2022, Urbino 2024, Prague 2025, Padua 2026); Singapore in 2023
- Recent organizing teams come mainly from Italian universities (Calabria, Bologna, Padua)
- Regular papers 8 pages IEEE format, up to 2 extra pages for a fee; single-blind review via EDAS
- Paper deadline usually extended once or twice; selected papers invited to a Journal of Supercomputing special issue
  (2025)
- CORE C (ICORE2026); not on the CCF 2026 list
