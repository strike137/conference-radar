notes:
- Workshop on computer vision for fashion, art and design; 8th edition at ICCV 2025, held every year since 2018
- Co-located with the main vision conference of the year (CVPR 2024 Seattle, ICCV 2025 Honolulu)
- Full papers (6 to 8 pages, double-blind) can opt into the ICCV/CVPR workshop proceedings; extended abstracts
  (3 pages) are non-archival
- 7 papers on CVF Open Access for CVPR 2024; no CVFAD volume on CVF Open Access for ICCV 2025
- Not listed in ICORE2026 or the CCF list
