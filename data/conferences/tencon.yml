notes:
- Flagship conference of IEEE Region 10 (Asia-Pacific); host city rotates every year
- 2025 Kota Kinabalu (IEEE Malaysia Section), 2026 Bali, 2027 Busan (organized by IEEE Seoul Section)
- Very broad EE/CS scope; 3 to 5 page papers in IEEE format; CORE C
- Student authors can enter the R10 Student Innovation Poster Competition (fee waiver prizes)
- In-person only; papers not presented are removed from IEEE Xplore
