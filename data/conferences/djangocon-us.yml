notes:
- Annual North American conference of the Django web framework community, presented by DEFNA
- Five days of tutorials, talks and sprints; 400+ attendees and 25+ talks in 2026
- Talks chosen from a call for proposals; anonymized submissions are reviewed by community volunteers and organizers
- Includes a deep dive day of in-depth Django talks, lightning talks, speaker mentorship and opportunity grants
- Held in Durham NC (2023, 2024), Chicago (2025, 2026) and Riverside, California (2027)
- No papers or proceedings; practitioner talks only
