id: cenim
name: CENIM
full_name: International Conference on Computer Engineering, Network and Intelligent Multimedia
type: conference
tier: minor
areas: [general, ai, networking, vision, communications]
region: southeast-asia
language: english
frequency: annual
organizer: Department of Computer Engineering and Department of Biomedical Engineering, Institut Teknologi Sepuluh Nopember (ITS)
organizer_country: [indonesia]
proceedings: IEEE Xplore
fee: 400 USD non-IEEE member, 350 USD IEEE member, 300 to 350 USD students (2026, international authors)
typical:
  deadline_months: [8, 9]
  conference_months: [11]
links:
  website: https://elib.its.ac.id/conf/cenim/
notes:
- Organized by the Departments of Computer Engineering and Biomedical Engineering at ITS Surabaya; sponsored by
  the IEEE Indonesia Section
- Proceedings in IEEE Xplore for every edition (2018, 2019, 2020, 2022, 2024, 2025)
- Usually held in Surabaya, Indonesia; 2026 moves to Banyuwangi with Politeknik Negeri Banyuwangi as co-host
- Hybrid format, with onsite attendance encouraged
- No editions in 2021 or 2023; annual again since 2024
- Broad scope covering computer engineering, AI, networks and security, multimedia, biomedical engineering,
  electronics and power systems
- Submission deadline is usually extended twice
- Not listed in the ICORE2026 portal or the CCF 2026 list
