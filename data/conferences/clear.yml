notes:
- Annual conference dedicated to causality in machine learning and statistics, held since 2022
- Proceedings in PMLR (2025 -> volume 275, 2026 -> volume 323 with 53 papers)
- Location rotates between Europe and North America (Lausanne 2025, Cambridge MA 2026, Paris 2027)
- Submissions on OpenReview, up to 12 single-column PMLR pages plus references and appendices; reviews with an author rebuttal and discussion period
- Also runs a non-archival causal benchmark dataset track
- Not listed in the ICORE2026 portal or the CCF list
