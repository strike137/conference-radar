notes:
- Service science conference started in 2008 on the initiative of IBM, now run by the CCF Technical Committee on Service Computing; 2026 was the 19th edition
- Proceedings in Springer Communications in Computer and Information Science (CCIS); CCF C
- English only; full papers 12 to 15 pages, short papers 6 to 11 pages; review is not blind
- Besides the main research topics it has demo, dataset and education tracks
- Held in a different Chinese city each year (Harbin 2023, Hong Kong 2024, Nanjing 2025, Macau 2026)
- Not ranked in CORE ICORE2026
