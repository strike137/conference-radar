notes:
- Hacker and computer security conference in Cuenca, Spain, run by the non-profit Asociacion MorterueloCON
- Co-organized with the University of Castilla-La Mancha (UCLM); program and talk abstracts in Spanish
- Talks selected through an open C4P, plus hands-on workshops (AjoarrieroLabs) and a Hack & Beers evening
- 2026 was edition XII; no formal proceedings
