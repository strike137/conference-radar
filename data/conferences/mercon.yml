notes:
- Annual multidisciplinary engineering conference of the University of Moratuwa, held on campus in August; 12th
  edition in 2026
- Double-blind review via EDAS; max 6 pages including references; survey, review and project-report papers are desk-rejected
- Tracks cover all engineering fields, including data science and AI, NLP, image processing and computer vision,
  communication and signal processing, and software engineering
- Held physically in Moratuwa, with online presentation available for foreign participants (2026)
- Proceedings in IEEE Xplore every year since 2015
