notes:
- Community-driven, volunteer-run technical BSides conference in Houston, Texas, USA
- One day with a main talk track, a briefings and workshop room, and pods (CTF, AI security, hardware, lockpick, blue team, career)
- 2026 edition held at the Houston Food Bank conference center
- Talks selected blind on merit; lightning talks (10 min) and full talks (30 to 45 min); no vendor pitches
- Hands-on training may need separate registration; no proceedings
- Not listed in the CORE ICORE2026 portal
