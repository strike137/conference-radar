notes:
- Leading symposium on RF, millimeter-wave, sub-THz and THz integrated circuits; work must be demonstrated with IC hardware and measurements
- Opens IMS week as one of its co-located symposia (with RFSA, RFTT and ARFTG); traces its roots to the MMWMC symposium (1982 to 1996)
- Papers go into the RFIC Symposium Digest in IEEE Xplore; double-blind review and a dedicated Industry and Startups track
- RFIC deadline in January, about a month after the IMS RFSA and RFTT deadline (December)
- Held in the USA almost every year (Washington DC 2024, San Francisco 2025, Boston 2026, San Antonio 2027); Montreal in 2012
- Circuits venue outside the usual CS rankings, not listed in ICORE2026
