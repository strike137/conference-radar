links:
  website: https://www.austrochip.at/
notes:
- Annual Austrian workshop on microelectronics and integrated circuits since 1991, for Austria and neighboring countries
- Forum between academia and industry; PhD students and strong MSc theses are invited to present
- Covers analog, mixed-signal, RF and digital IC design, FPGA, embedded systems, verification and testing and emerging technologies
- Rotates among Linz, Vienna, Graz and Villach; one or two days, low registration fee
- Double-blind review, papers of 4 to 8 IEEE A4 pages in English; proceedings submitted to IEEE Xplore
- Not listed in ICORE2026 or the CCF list; circuits venue outside the usual CS rankings
