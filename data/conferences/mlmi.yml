notes:
- One-day workshop held in conjunction with MICCAI every year since 2010, so it moves with MICCAI
- Called "International Conference" on the 2025 site and "International Workshop" in 2026 and on the Springer volumes
- Proceedings in Springer LNCS (2024 -> LNCS 15241 and 15242; 2025 -> one volume with 64 papers)
- Strictly double-blind review; up to 8 pages plus up to 2 pages of references in LNCS format
- Organizers in 2026 from ShanghaiTech, Nanjing University, United Imaging Intelligence, Imperial College London,
  Korea University and the University of Pennsylvania
- Submission via OpenReview in 2026 (CMT in 2025); deadline usually extended by about a week
- Not listed in CORE ICORE2026 or the CCF 2026 list
