notes:
- One-day workshop co-located with the ACM/SPEC International Conference on Performance Engineering (ICPE); 14th edition in 2026
- Topics are load testing, benchmarking, performance and resilience testing, chaos engineering, and load testing of cloud, serverless and AI/LLM systems
- Accepted papers appear in the ICPE Companion proceedings in the ACM Digital Library
- Research or industry papers (short up to 5 pages, full up to 8 pages, ACM format) via HotCRP; also a presentation-only track with 700-word extended abstracts
- Double-blind review is not enforced
- Follows ICPE around the world (Toronto 2025, Florence 2026)
- Not listed in ICORE2026 or the CCF 2026 list
