notes:
- Small Australian symposium on blockchain and distributed ledger technology, academic and industry tracks; 10th edition in 2026
- Started at Griffith University; recent general chairs from UNSW, The University of Queensland, Deakin and Griffith
- Accepted papers published in Springer CCIS (2026); earlier editions also announced Springer proceedings
- Selected 2025 papers invited to submit an extended version to the ACM Distributed Ledger Technologies journal (not announced for 2026)
- Held in Australia every year (Gold Coast 2022, Brisbane 2023 with ICFEM, Brisbane 2024, Melbourne 2025, Brisbane 2026)
- Double-blind review; academic papers up to 15 pages single column, industry papers up to 12 pages, industry talks abstract only
- Not listed in CORE ICORE2026 or the CCF list
