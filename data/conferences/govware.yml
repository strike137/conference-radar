notes:
- Cornerstone trade event of Singapore International Cyber Week (SICW) since 2016; held every October at Sands Expo
  and Convention Centre, Singapore
- Government and industry oriented conference plus exhibition run by a commercial event organizer; organizers report
  14,000+ attendees from 90+ countries and regions and 300+ exhibitors and partners
- Call for Speakers (talk proposals, not papers) ran 27 April to 1 June in 2026; no proceedings
- Free Trade Visitor Pass covers the exhibition only and is restricted to trade and industry professionals (registrations
  are reviewed); conference passes are paid
