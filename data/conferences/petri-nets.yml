notes:
- Main venue for Petri net theory and applications and for concurrency more broadly; 47th edition in 2026, held
  since 1980
- Proceedings in Springer LNCS ("Application and Theory of Petri Nets and Concurrency")
- Regular papers up to 20 pages and tool papers up to 10 pages, references excluded, LNCS format; abstract
  registration about a week before the paper deadline; deadlines are AoE
- Week-long event in late June with workshops and tutorials on the first two days, plus the Model Checking Contest
- Held in Europe (online 2021, Bergen 2022, Lisbon 2023, Geneva 2024, Paris 2025, Hamburg 2026)
- CORE B (ICORE2026); not in the CCF 2026 list
