organizer: IPSJ SIG-SLDM (System and LSI Design Methodology), cosponsored by IEEE CEDA All Japan Joint Chapter
organizer_country: [japan]
proceedings: IPSJ Digital Library (DA Symposium proceedings), paid per paper for two years (660 JPY, 330 JPY for
