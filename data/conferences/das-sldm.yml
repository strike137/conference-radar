links:
  website: https://www.sig-sldm.org/das/
notes:
- Annual three-day residential symposium of IPSJ SIG-SLDM on system and LSI design technology (design automation,
  high-level synthesis, layout, test and verification, embedded systems, FPGA, AI hardware)
- Held in late August or early September at a hot spring or seaside hotel in Japan, recently Kaga, Ishikawa (2023, 2025, 2026) or Toba, Mie (2021, 2022, 2024)
- Presentation application with title and abstract only, accept or reject notice about one week later, then a 6 to
  8 page camera-ready paper (2 to 6 pages for posters); not a full-paper peer review
- Three formats are oral, poster (work in progress welcome) and oral plus poster; also hosts the Algorithm Design
  Contest (ADC) and awards for excellent talks
- Registration fee includes lodging in shared rooms of 2 to 4 people; most talks are in Japanese
- Papers go into the IPSJ Digital Library as the DA Symposium proceedings
- Not listed in CORE ICORE2026 or the CCF 2026 list
