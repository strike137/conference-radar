notes:
- 'Organized by KIICE (Korea Institute of Information and Communication Engineering), based in Busan; the fall conference
  is held every October and a spring conference every May (59th: May 21 to 23, 2026, Jeju)'
- Short papers of 2 to 3 pages in Korean (HWP or Word); pages beyond 3 cost 10,000 KRW each; title and abstract
  are submitted first, then the paper
- Selected presented papers are invited to the society's Korean journal (JKIICE) after review
- Includes an undergraduate special session and a middle/high-school session; the 2025 edition also ran online oral
  (Zoom) and poster (Padlet) sessions
