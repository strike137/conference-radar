notes:
- Workshop on genetic improvement of software (search-based and LLM-based program repair and optimisation); describes itself as the premier workshop in the field
- Mostly co-located with ICSE (2021, 2023 Melbourne, 2024 Lisbon, 2025 Ottawa, 2026 Rio de Janeiro); held with GECCO in 2022
- Research papers up to 8 pages, position papers up to 2, extended abstracts up to 5 (APC free), all including references, ACM format
- 2026 proceedings published in the ACM Digital Library as "Proceedings of the 14th International Workshop on Genetic Improvement" (the workshop site counts it as the 15th)
- Small workshop with keynote, mini tutorial and a handful of papers; best paper and best presentation awards
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
