notes:
- Long-running biennial symposium on spatial, temporal and spatio-temporal data management, held in odd years since 1989
- Renamed from International Symposium on Spatial and Temporal Databases to Spatial and Temporal Data in 2023;
  ICORE2026 and CCF 2026 still list the old name
- Proceedings published by ACM (ACM DL) since 2019; earlier editions appeared in Springer LNCS
- Rotates worldwide (Vienna 2019, virtual 2021, Calgary 2023, Osaka 2025)
- Research (long and short), demo, industry, thesis and dissertation workshop and tutorial tracks
- Outstanding 2025 research papers were invited to a special track of GeoInformatica (Springer)
- Registration fee covers reception, lunches and banquet
