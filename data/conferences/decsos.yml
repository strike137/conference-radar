notes:
- Workshop on safety, security and reliability of embedded cyber-physical systems and systems-of-systems
- Co-located with SAFECOMP and held on its workshop day; 21st edition in 2026
- Co-hosted by EWICS TC7, ERCIM and several European research projects (Chips JU and Horizon Europe in 2026)
- Chaired by Erwin Schoitsch (AIT Austrian Institute of Technology) and Amund Skavhaug (NTNU)
- Papers published in the SAFECOMP workshops proceedings in Springer LNCS; workshop papers of 6 to 12 pages reviewed by at
  least three reviewers
- Full-day program with a strong European project and industry flavor (10 papers in 2026)
- No standalone website found; the 2026 call for papers and program are PDFs on the SAFECOMP 2026 site
- Not listed in CORE ICORE2026 or on the CCF list
