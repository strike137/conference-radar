notes:
- Workshop co-located with IEEE VTC-Spring; held at VTC2026-Spring (Nice, W19) and VTC2027-Spring (Hamburg, W14)
- Organizers from Universite Gustave Eiffel (France), German Aerospace Center DLR and Beijing Jiaotong University
- Topics include FRMCS, railway channel measurement and modelling, antennas for trains, handover, NTN for railways, localization and cybersecurity
- Papers 5 pages (up to 2 extra pages at 100 USD each); accepted VTC papers go to IEEE Xplore and may be removed if not presented
- Not listed in ICORE2026
