notes:
- Biennial conference on evolutionary and nature-inspired multi-objective and many-objective optimization, guided by
  a steering committee; 2027 is the 14th edition
- Proceedings in Springer LNCS; accepted abstracts appear only in the back matter and are not indexed
- Main EMO track plus MCDM and Industry special tracks; full papers up to 15 pages including references in LNCS
  format, double-anonymous review
- Rotates worldwide (Muenster 2017, East Lansing 2019, Shenzhen 2021, Leiden 2023, Canberra 2025, Exeter 2027)
- At least one author must register by the author registration deadline or the paper is dropped from the proceedings
- CORE C (ICORE2026); not on the CCF list
