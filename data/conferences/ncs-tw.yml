id: ncs-tw
name: NCS
full_name: National Computer Symposium
name_local: 全國計算機會議
type: conference
tier: domestic
areas: [general, ai, security, networking]
region: taiwan
language: mixed
frequency: biennial
organizer: Sponsored by Taiwan's Ministry of Education and NSTC; host university rotates; held jointly with TANET
  (Taiwan Academic Network Conference); co-organizers include the Computer Society of the Republic of China
organizer_country: [taiwan]
proceedings: NCS conference proceedings (local refereed volume with ISBN, deposited at Taiwan's National Central
  Library, not in any digital library or formal series; e.g. NCS 2023 proceedings ISBN 978-626-7147-36-8, downloadable
  from the conference site only until 2023-12-25; full papers of 2 to 6 pages for oral, 1-page abstracts for posters);
  selected papers recommended to journal special issues (JISE for 2023, Journal of Computers for 2025)
archival: false
rank:
  core: Unranked
fee: 3,000 TWD per presenting faculty or general author, 2,500 TWD per student author, dinner included; 1,000 TWD
  extra per additional paper by the same author (2025)
typical:
  deadline_months: [8, 9]
  conference_months: [10, 11, 12]
links:
  website: https://tanet2025.niu.edu.tw/
notes:
- Odd-year domestic counterpart of ICS; held jointly with the annual TANET conference (TANET & NCS) in 2021, 2023
  and 2025
- Papers of 2 to 6 pages in Chinese or English; poster papers publish only a 1-page abstract
- 'Host rotates: NQU Kinmen 2019, Tunghai University Taichung 2021, NCCU Taipei 2023, National Ilan University Yilan
  2025'
- Selected papers go to journal special issues (JIT for 2019, JISE for 2023, Journal of Computers for 2025)
- Deadlines are usually extended one to three times; best paper awards given
