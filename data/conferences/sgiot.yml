id: sgiot
name: EAI SGIoT
full_name: EAI International Conference on Smart Grid and Internet of Things
type: conference
tier: minor
areas: [communications, networking]
region: taiwan
language: english
frequency: annual
organizer: EAI (European Alliance for Innovation), with Taiwanese host universities (steering chair at National
  Changhua University of Education)
organizer_country: [europe, taiwan]
proceedings: Springer LNICST
archival: true
fee: 539 USD author registration for 1 paper, onsite or online (2026); 369 USD audience, 270 USD student onsite
indexing: [Web of Science, Compendex, Scopus, DBLP, EU Digital Library, Inspec, SCImago, Zentralblatt MATH]
typical:
  deadline_months: [5, 7]
  conference_months: [11, 12]
links:
  website: https://sgiot.eai-conferences.org/2026/
notes:
- EAI conference on IoT for smart grids, AIoT, edge intelligence, smart grid communications and security
- Held in Taichung, Taiwan every year from 2019 to 2026 (2017 and 2018 editions in Canada); steering chair and organizing
  committee are Taiwanese
- Proceedings in Springer LNICST; selected papers invited to the Mobile Networks and Applications (MONET) journal
  and EAI Endorsed Transactions fast tracks
- Hybrid format with the same fee for onsite and online participation; main track plus a later late track
- Not listed in the CORE ICORE2026 portal; minor venue
