notes:
- Sponsored by ACM SIGCHI; the main venue for research on technology for groups, organizations, communities and
  social computing
- Papers are published as journal articles in PACM HCI (CSCW issue) under ACM Open Access
- CORE A (ICORE2026); CCF A
- CSCW 2026 had a single new-paper deadline in May 2025 followed by revise-and-resubmit rounds up to January 2026
- "From CSCW 2027 papers follow a rolling model with no conference deadlines: a paper must first be accepted in PACM HCI/CSCW (or ToCHI if in scope) and then gets a presentation slot"
- Held in October in recent years (Bergen 2025, Salt Lake City 2026); posters, demos, workshops and panels are
  separate non-paper tracks
