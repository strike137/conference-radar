notes:
- Community conference on the Rust programming language in China, hosted by RustCC (rustcc.cn), the Rust Chinese community
- 2025 edition held together with RustGlobal China in Hangzhou, marking 10 years of Rust; Shanghai in 2024
- Talk proposals (abstract of 200 to 300 words) through a Google Form; talks are 25 minutes plus 5 minutes of discussion, in Chinese or English, on site only
- 2025 tracks covered production use in industry, language ecosystem, and Rust for AI and OS infrastructure
- No papers or proceedings; talks only
- Not listed in the CORE ICORE2026 portal or the CCF 2026 list
