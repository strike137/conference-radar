notes:
- Organized by INSTICC; proceedings published by Springer in a CCIS series book (not SCITEPRESS)
- Not listed in CORE ICORE2026 or the CCF list; a small, young venue (8th edition in 2027)
- Topics are deep learning models and algorithms, big data analytics, computer vision and natural language understanding
- Two submission stages (1st stage gives an earlier notification), plus late-breaking papers and an abstracts track;
  all deadlines AoE
- Co-located with ICSOFT, DATA and SECRYPT with free cross access; hybrid presentation allowed when speakers cannot
  travel
- Held in European cities (Lisbon 2022, Rome 2023, Dijon 2024, Bilbao 2025, Porto 2026, Rome 2027)
