notes:
- Satellite workshop of MICCAI since 2022 on translational, clinical and applied medical AI, imaging or non-imaging data
- Moves with MICCAI (Singapore 2022, Vancouver 2023, Marrakesh 2024, Daejeon 2025, Strasbourg 2026)
- Full papers in Springer LNCS, own volume (LNCS 16206 for AMAI 2025, 37 papers from 61 submissions); 1-page abstracts are posted on the website only
- Two tracks, full papers (8 pages plus 2 of references, double-blind) and abstracts; submission via OpenReview in 2026 (CMT in 2025)
- Each full paper must include a short "Prospects of Application" paragraph, a key review criterion
- In 2025 some accepted papers could be recommended to a partnering journal instead of LNCS
- Half day workshop; best student paper, best workshop paper and best abstract awards
- Not listed in CORE ICORE2026 or the CCF 2026 list
