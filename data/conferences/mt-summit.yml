id: mt-summit
name: MT Summit
full_name: Machine Translation Summit
type: conference
tier: minor
areas: [nlp]
region: worldwide
language: english
frequency: biennial
organizer: IAMT (International Association for Machine Translation), hosted in turn by its regional associations
  EAMT, AMTA and AAMT; 2025 run by EAMT with the University of Geneva
organizer_country: [international]
proceedings: ACL Anthology
indexing: [DBLP]
rank:
  core: C
fee: CHF 535 participant / CHF 295 student, early bird member rate (2025, in person)
typical:
  deadline_months: [2]
  conference_months: [6, 9]
links:
  website: https://mtsummit2025.unige.ch/
  dblp: https://dblp.org/db/conf/mtsummit/
notes:
- Biennial flagship of IAMT, first held in 1987 in Hakone, Japan; rotates between Europe, the Americas and Asia
- 20th edition in Geneva, Switzerland (June 2025), organized by EAMT; 2023 edition was in Macau, China
- Proceedings in the ACL Anthology (two volumes in 2025); co-located workshops also publish there
- 'Four tracks: research technical, research translators and users (up to 10 pages each), implementations and case
  studies, and products and projects; submission via EasyChair with a rebuttal period'
- Research track papers are anonymized; implementations and case studies papers need not be
- Mix of academic researchers, MT developers and translation industry professionals
- In person only in 2025; discounted rate for EAMT, AMTA and AAMT members
- ICORE2026 rank C
