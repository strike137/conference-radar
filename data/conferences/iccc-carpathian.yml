notes:
- Annual control engineering conference held since 2000, founded by five faculties in Kosice, Krakow, Ostrava, Miskolc and Craiova
- Host rotates among Poland, Czech Republic, Slovakia, Hungary and Romania (Szilvasvarad 2023, Krynica-Zdroj 2024, Stary Smokovec 2025, Szilvasvarad 2026, Cracow 2027)
- Organised as an IEEE conference since 2011; accepted papers go to IEEE Xplore subject to IEEE scope and quality checks
- Topics span control theory, measurement, signal processing and communication systems, AI and machine learning, IoT and cyber-physical systems, robotics and embedded systems
- Two-stage submission, abstract registration on EasyChair first and a 4 to 6 page full paper in IEEE format about two months later
- "Fee: 820 EUR non-IEEE members, 780 EUR IEEE members (2026, incl. two nights of accommodation)"
- Not listed in CORE ICORE2026
- Distinct from IEEE ICCC Obuda (cybernetics) and the International Conference on Computational Creativity
