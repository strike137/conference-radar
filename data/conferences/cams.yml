notes:
- Workshop on simulators, performance and power modeling, simulator validation and simulation for AI accelerators
- Held with MICRO (Austin 2024, Seoul 2025); 3rd edition in 2025
- Full papers up to 6 pages (ACM format, references excluded); authors choose whether to reveal identity
- Papers are posted on the workshop site only, not in the ACM or IEEE digital libraries, so they can be submitted elsewhere
- Also has a tool release talk track (1-page abstracts, no peer review)
- Not listed in CORE ICORE2026
