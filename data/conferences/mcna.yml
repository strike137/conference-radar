notes:
- Called the International Conference on Multimedia Computing, Networking and Applications up to 2024; renamed to Modern Computing from 2025
- Accepted, registered and presented papers from MCNA and its co-located workshops are submitted to IEEE Xplore; full papers 6 to 8 pages, student papers up to 4 pages
- At least one author must register and present or the paper is dropped from the proceedings
- Broad scope covering 5G/6G, SDN, IoT, edge and cloud computing, AI, cybersecurity, multimedia and computer vision
- Hybrid format
- Earlier editions in Aqaba (2018), Granada and Abu Dhabi (2019) and Valencia, Spain (2020, 2021, 2023, 2024); moved to the USA from 2025 (2025 Tampa, 2026 San Antonio, 2027 Austin)
- Co-sponsored by the IEEE Spain Section in 2024; the 2026 site shows IEEE as a sponsor logo
- Not listed in ICORE2026; not on the CCF 2026 list
