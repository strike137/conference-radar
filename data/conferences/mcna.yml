notes:
- Same organizing group as SNAMS, FMEC and SDS; steering committee includes Yaser Jararweh and Jaime Lloret
- Called the International Conference on Multimedia Computing, Networking and Applications until 2024; renamed Modern Computing in 2025
- Accepted, registered and presented papers are submitted to IEEE Xplore; 6 to 8 page IEEE format papers
- Broad scope covering networking, AI, cloud and edge computing, security, multimedia and computer vision
- Hybrid conference; held in Valencia, Spain (2020, 2021, 2023, 2024), Tampa (2025) and San Antonio (2026)
- Short review cycle (about one month from submission to notification)
- Not listed in ICORE2026; not on the CCF list
