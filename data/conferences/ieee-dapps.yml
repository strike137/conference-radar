id: ieee-dapps
name: IEEE DAPPS
full_name: IEEE International Conference on Decentralized Applications and Infrastructures
type: conference
tier: minor
areas: [security, systems]
region: worldwide
language: english
frequency: annual
organizer: IEEE, as part of the IEEE CISOSE congress (DAPPS Steering Committee)
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
indexing: [EI]
typical:
  deadline_months: [2, 4]
  conference_months: [6, 7]
links:
  website: https://ieee-cisose-congress.org/2027/dapps/
notes:
- Blockchain, distributed ledgers and decentralized applications (dApps), including smart contracts, DeFi, DAOs, decentralized identity and security; 2027 theme is decentralized applications in the age of agentic AI
- Formerly IEEE DAPPCON; 8th edition in 2026, 9th in 2027
- One of the co-located conferences of the IEEE CISOSE congress (with SOSE, JCC, BigDataService, IMC, AITest), which rotates between the Americas, Europe and Asia
- Proceedings published by IEEE Computer Society Press in IEEE Xplore, EI indexed; one author must register and present in person
- Regular papers 10 pages, short papers 6 pages, posters 2 pages (IEEE double-column)
- Double-blind review (2026)
- Selected 2027 full papers invited to a special issue of the Journal of Cloud Computing (Springer Nature)
- Not ranked in ICORE2026 and not on the CCF 2026 list
