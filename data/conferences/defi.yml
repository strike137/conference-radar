id: defi
name: DeFi
full_name: ACM CCS Workshop on Decentralized Finance and Security
type: workshop
tier: minor
areas: [security]
region: worldwide
language: english
frequency: annual
organizer: Steering committee Dawn Song (UC Berkeley), Roger Wattenhofer (ETH Zurich), Arthur Gervais and Philipp
  Jovanovic (UCL)
organizer_country: [usa, europe]
typical:
  deadline_months: [7, 8]
  conference_months: [10, 11]
proceedings: ACM DL
archival: true
links:
  website: https://defiwork.shop/
notes:
- Co-located with ACM CCS every year since 2021 (Salt Lake City 2024, Taipei 2025, The Hague 2026)
- Covers blockchain and decentralized finance security, including zero-knowledge proofs and their DeFi applications
- Full papers up to 8 pages excluding references in the ACM CCS sigconf format, plus SoK papers; anonymized
  submission via HotCRP
- Proceedings in the ACM Digital Library every year since 2021 (DeFi '25 volume published 2025-10-13)
- Also runs a Best DeFi Papers Award for DeFi papers published elsewhere in the previous year (self-nominated)
