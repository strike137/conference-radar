notes:
- Conference on discrete algorithms and machine learning methods for molecular biology, bioinformatics and systems biology; CORE C
- Named Workshop on Algorithms in Bioinformatics until 2024; International Conference on Algorithms for Bioinformatics since 2025, acronym kept
- Proceedings in the open-access LIPIcs series (Schloss Dagstuhl); selected papers invited to a thematic series in Algorithms for Molecular Biology (AMB)
- Papers up to 15 pages in LIPIcs style plus a short appendix; abstract registration a few days before the full paper deadline
- Simultaneous journal submission allowed if the chairs are told; such papers appear only as a short abstract in the proceedings
- Alternates between the European ALGO meeting and North America (Potsdam 2022, Houston 2023, Egham 2024, College Park 2025, L'Aquila 2026)
- Also has a poster track with 500-word abstracts
