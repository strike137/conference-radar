notes:
- Workshop on multilingual and multicultural evaluation of language models (benchmarks, metrics, under-represented languages)
- First edition with AACL-IJCNLP 2022 (online) as the Workshop on Scaling Up Multilingual Evaluation; second edition with COLING 2025 (Abu Dhabi)
- Archival papers up to 8 pages, ARR guidelines, double-blind review via Softconf; non-archival track for papers published elsewhere
- 2025 edition was in person only and had best paper awards sponsored by Microsoft
- Not ranked in CORE ICORE2026
