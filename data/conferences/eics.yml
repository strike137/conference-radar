notes:
- ACM SIGCHI venue on engineering interactive systems, between HCI and software engineering (models, tools,
  formal methods, architectures and verification of user interfaces)
- Full papers and technical notes are journal articles in Proceedings of the ACM on Human-Computer Interaction
  (PACM HCI, EICS issue); posters, demos, late breaking results and workshops go to a companion volume in the ACM DL
- Three submission rounds per year (about July, November and February) with a rebuttal; papers can be sent to
  revise and resubmit in the next round
- No length limit for full papers and technical notes; ACM TAPS single column format, submission via PCS
- ACM Open access from 2026, so an article processing charge can apply
- Held in Europe in recent years (Swansea 2023, Cagliari 2024, Trier 2025, Patras 2026, Toulouse 2027)
- CORE lists it as Journal Published (ICORE2026); not on the CCF 2026 list
