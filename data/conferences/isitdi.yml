links:
  website: http://isitdi.conference.unand.ac.id/
notes:
- Run by the Faculty of Information Technology, Universitas Andalas, Padang, Indonesia; 2026 jointly with Universiti
  Malaysia Pahang Al-Sultan Abdullah (UMPSA) and Management and Science University, Malaysia
- Held every two years so far (2022 online, 2024 hybrid, 2026 hybrid in Padang); 2022 was co-organized with Dharma
  Andalas University
- 2022 and 2024 proceedings are in IEEE Xplore; accepted 2026 papers will be submitted to IEEE Xplore
- Tracks cover service and cloud computing, smart services, digital security and forensics, IT governance, IoT,
  computing and engineering, and digital transformation
- Papers use the IEEE A4 conference template and are submitted via EDAS
- Not listed in ICORE2026 and not on the CCF list
