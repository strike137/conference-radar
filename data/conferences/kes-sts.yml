notes:
- Organized by KES International; 9th edition in 2026
- Covers intelligent transportation systems, connected and self-driving vehicles and transport infrastructure modelling
- The site calls it a KES International Symposium
- Held as part of the KES Smart Digital Futures multi-conference (with AMSTA, HCIS, IDT, InMed and SEEL in 2026)
- Held in Europe every June with the other Smart Digital Futures conferences (Madeira 2024, Barcelona 2026)
- Full papers published by Springer in the Smart Innovation Systems and Technologies series; short papers and
  abstracts are published online only, not in the Springer volume
- Many papers come through invited sessions, whose chairs set their own deadlines
- Not listed in ICORE2026; not on the CCF list
