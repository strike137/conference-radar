notes:
- Sponsored by IEEE and the IEEE Computer Society; 44th edition in 2026
- Six tracks covering computing systems, compilers and tool chains, hardware architectures, test, verification and
  security, EDA, and logic and circuit design
- Double-blind review; 8-page submissions, some papers accepted as 4-page short papers
- Each accepted paper needs a full registration and an in-person presentation to appear in the proceedings
- Proceedings in IEEE Xplore
- Mostly held in the USA (Lake Tahoe 2022, Washington DC 2023, Dallas 2025), with Milan 2024 and Hong Kong 2026
- CORE C (ICORE2026) but CCF B; abstract registration one week before the full paper deadline, both strictly final
- Also has a student research forum (PhD forum) with 2-page extended abstracts
