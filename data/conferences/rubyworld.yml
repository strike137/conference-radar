frequency: annual
organizer: Executive Committee for RubyWorld Conference (Ruby Association, Shimane Prefecture, Matsue City and others)
organizer_country: [japan]
proceedings: None
archival: false
typical:
  deadline_months: [8]
  conference_months: [11, 12]
links:
  website: https://2026.rubyworld-conf.org/
notes:
- Described by its organizers as the largest business conference in Japan for the Ruby programming language
- Held at Kunibiki Messe in Matsue, Shimane (2025 and 2026); 2026 is the 18th edition
- Executive committee chaired by Yukihiro Matsumoto; members include the Ruby Association, Shimane Prefecture, Matsue City and Shimane University
- Talks are selected from a public call for proposals on Ruby use cases, technology trends and education
- Proposals and talks in English or Japanese; simultaneous interpretation offered (2025)
- Also hosts the Ruby Prize award ceremony and a sponsor exhibition
- No papers or proceedings; talks only
- Separate from RubyKaigi and Kaigi on Rails
- Not listed in CORE ICORE2026
