notes:
- Focused on SDN, NFV, programmable and intent-based networking; mostly single-track
- Full papers 9 pages, short papers 6 pages including references; author names on submissions (not double-blind)
- '2026: 23 long and 20 short papers presented, 6 co-located workshops (including SecSoft)'
- Mostly in Europe (Milan 2022, Madrid 2023, Budapest 2025, Berlin 2026) but also St. Louis 2024 and Tokyo 2021
  (virtual); NetSoft 2027 general co-chairs are from SKKU (Korea) and Tokyo City University
