notes:
- Workshop on empirical studies of prompt engineering for language models (LLMs and SLMs) in software engineering tasks
- First edition in 2026, co-located with EASE 2026 in Glasgow
- Accepted papers published open access in the EASE 2026 Workshop Proceedings in the ACM ICPS; an ACM article processing charge applies
- Full research papers up to 10 pages and short papers up to 5 pages including references, ACM format
- Double-anonymous review; authors must follow the SIGSOFT Open Science Policy
- Selected papers invited to a special issue of the Empirical Software Engineering journal (Springer Nature)
- Not listed in the CORE portal (ICORE2026)
