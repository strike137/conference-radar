id: artman
name: ARTMAN
full_name: Workshop on Recent Advances in Resilient and Trustworthy MAchine learning-driveN systems
type: workshop
tier: minor
areas: [security, ai]
region: worldwide
language: english
frequency: annual
organizer: Program chairs from Telecom SudParis, NICT (Japan) and IMT Nord Europe; co-located with ACM CCS or IEEE
  ACSAC
organizer_country: [europe, japan]
proceedings: IEEE Xplore; ACM DL in CCS years (2023, 2025)
archival: true
rank:
  core: Unranked
fee: 480 USD regular, 340 USD student (2026, ACSAC one-day workshop rate until Nov 16) plus 125 USD author surcharge
  per paper
typical:
  deadline_months: [6, 7, 9]
  conference_months: [10, 11, 12]
links:
  website: https://artman-workshop.gitlab.io/
notes:
- 'Alternates host conference: ACM CCS 2023 (Copenhagen), ACSAC 2024 (Honolulu), ACM CCS 2025 (Taipei), ACSAC 2026
  (Los Angeles); the 2023 edition was titled Workshop on Recent Advances in Resilient and Trustworthy ML Systems
  in Autonomous Networks'
- Program co-chaired by Takeshi Takahashi (NICT, Japan); the TPC has included Japanese members (NTT in 2026; Fujitsu
  and Kobe University in 2025)
- Regular papers 10 pages plus up to 5 pages of references/appendices, short papers 4 pages; anonymous submission
- Proceedings in ACM DL when at CCS; IEEE CS CPS ACSAC Workshops volume (IEEE Xplore) when at ACSAC
- Deadlines usually extended by about two weeks
