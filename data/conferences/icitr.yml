id: icitr
name: ICITR
full_name: International Conference on Information Technology Research
type: conference
tier: minor
areas: [general, ai, vision, data, security]
region: south-asia
language: english
frequency: annual
organizer: Information Technology Research Unit (ITRU), Faculty of Information Technology, University of Moratuwa,
  Sri Lanka
organizer_country: [other]
proceedings: IEEE Xplore
indexing: [Scopus]
acceptance_rate: 37% (2025, 69/187)
fee: 300 USD IEEE member, 400 USD non-member (2026, foreign non-student author, online); 225 to 300 USD foreign
  student author; local authors 22,000 to 30,000 LKR
typical:
  deadline_months: [10]
  conference_months: [12]
links:
  website: https://icitr.uom.lk/
notes:
- Annual IT research conference of the Faculty of Information Technology, University of Moratuwa, held every
  December; 11th edition in 2026
- Held on campus in Moratuwa, except 2021 and 2022 which were online
- Technically co-sponsored by the IEEE Sri Lanka Section from 2018 to 2025; past proceedings are in IEEE Xplore
- Double-blind review on Microsoft CMT; max 6 pages in IEEE format, up to 2 extra pages at 250 USD each; surveys
  and review papers are not accepted
- Six tracks in 2026 (visual computing, AI, IoT and robotics, data analytics, cybersecurity, digital transformation)
- Held physically in Moratuwa, with online presentation for foreign participants (2026)
- Not listed in ICORE2026 or the CCF list
