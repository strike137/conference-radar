notes:
- Conference on interaction between humans and agents (robots, virtual agents, conversational systems)
- Proceedings in the ACM International Conference Proceedings Series (ACM DL); held in cooperation with ACM
- Full papers up to 8 pages excluding references; double-blind review with three reviewers and a meta-review
- Separate posters and demos and workshops and tutorials tracks
- Rotates worldwide (Christchurch 2022, Gothenburg 2023, Swansea 2024) with frequent editions in Japan (Yokohama 2025, Osaka 2026)
- CORE B (ICORE2026)
