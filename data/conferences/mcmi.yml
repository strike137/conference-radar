id: mcmi
name: MCMI
full_name: International Workshop on Multi- and Cross-Modal Information for Enhanced Pattern Recognition
type: workshop
tier: minor
areas: [ai, vision, nlp]
region: worldwide
language: english
frequency: biennial
organizer: Workshop organizers (Kore University of Enna); IAPR-endorsed, co-located with ICPR
organizer_country: [europe]
proceedings: Springer LNCS (ICPR Workshops proceedings)
archival: true
typical:
  deadline_months: [5, 8]
  conference_months: [8, 12]
links:
  website: https://mcmi-workshop.github.io/
notes:
- IAPR-endorsed ICPR workshop on multimodal fusion and cross-modal representation across vision, audio and language, including healthcare applications
- Run from Kore University of Enna, Italy (contact mcmi@unikore.it)
- 1st edition at ICPR 2024 (Kolkata), 2nd at ICPR 2026 (Lyon)
- Double-blind review by at least three program committee members through Microsoft CMT
- Only full papers longer than 6 pages appear in the Springer LNCS proceedings; shorter papers may be presented only
- Deadlines are 23:59 AoE
- Not listed in ICORE2026 or the CCF list
