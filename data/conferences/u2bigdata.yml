notes:
- Workshop on data-driven user understanding (user segmentation, experiments and causal inference, recommendation, survey and logging methods, privacy in user research); held every year since 2020
- Program chairs from industry (Intuit, Meta) and Purdue University
- Held with the IEEE International Conference on Big Data; 2025 edition (WS08) was a hybrid half-day workshop in Macau
- Accepted papers included in the IEEE BigData workshop proceedings (IEEE Computer Society)
- Full papers up to 10 pages in IEEE 2-column format
- Not listed among the IEEE BigData 2026 workshops
- Not ranked by CORE (not in ICORE2026) or CCF
