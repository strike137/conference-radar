notes:
- Long-running IEEE symposium on interconnection networks from on-chip and chiplet links to data center
  and HPC fabrics; 33rd edition in 2026
- Strong industry presence (keynotes from NVIDIA, Meta, Google, Microsoft) with tutorials and panels
- Regular papers up to 10 pages and hot topic papers up to 4 pages, IEEE double-column format, single-blind review
- Accepted papers go to IEEE Xplore; best papers are invited to an IEEE Micro special issue
- Held virtually every year since 2020; talks are posted on YouTube
- CORE National USA (ICORE2026), CCF C
