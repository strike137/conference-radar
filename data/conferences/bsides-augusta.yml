notes:
- Security BSides conference in Augusta, Georgia, USA, first held in 2013 with about 175 attendees; grew to four talk tracks and 750 attendees by 2016 and 2017
- One day on a Saturday in October at the Georgia Cyber Innovation and Training Center, Augusta (venue since 2025)
- Talks of 20 to 25 or 45 to 55 minutes plus 2 to 4 hour workshops, submitted through pretalx; CTF on the day
- Part of Augusta Cyber Week with paid trainings earlier in the week and the Security Onion Conference the day before
- Low-cost registration that includes lunch and a t-shirt; no proceedings
