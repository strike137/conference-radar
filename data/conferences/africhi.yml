notes:
- Pan-African HCI conference held every two years, in cooperation with ACM SIGCHI; 2025 was the 5th edition
- Host rotates around Africa (East London, South Africa in 2023; AAST Smart Village campus, Cairo, Egypt in 2025)
- 2025 proceedings approved for the ACM International Conference Proceedings Series (ICPS)
- Full papers (12,000 words max) and notes (6,000 words max) get double-blind review with a revise and resubmit round
- Topics must relate to African contexts or perspectives; mentorship program for authors new to academic writing
- Many side tracks (case studies, panels, workshops, demos, doctoral and masters consortium, co-design school)
- Not listed in ICORE2026 and not on the CCF list
