links:
  website: https://africhi2025.org/
notes:
- Pan-African HCI conference, held every two years in a different African country (Nairobi 2016, East London
  2023, Cairo 2025); 2025 was the 5th edition
- Proceedings in the ACM International Conference Proceedings Series (ACM DL); AfriCHI 2025 was approved for ACM
  in-cooperation
- Full papers (up to 12000 words) go through a double-blind revise and resubmit review in two rounds; notes (up to
  6000 words) have a single review round with a later deadline
- Also has case studies, panels, workshops, demos, a doctoral and masters consortium and a co-design school
- Runs a mentorship program for early career researchers and students new to academic writing
- Topics must be grounded in African contexts or perspectives; not listed in CORE ICORE2026 or on the CCF 2026 list
