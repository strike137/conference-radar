id: icvr
name: ICVR
full_name: International Conference on Virtual Reality
type: conference
tier: minor
areas: [vision, general]
region: worldwide
language: english
frequency: annual
organizer: Commercial conference secretariat (icvr_conf@163.com) with host universities that change by edition
  (Cardiff University in 2026) and IEEE as co-sponsor; Nanjing University of Information Science and Technology
  co-sponsored 2021 to 2024
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI Compendex, Scopus]
fee: 600 USD regular author, 550 USD student or IEEE member author (2026); 6 pages included, 60 USD per extra page
typical:
  deadline_months: [5, 6]
  conference_months: [7]
links:
  website: http://www.icvr.org/
notes:
- Smaller commercially organized conference on VR, AR, MR and XR technologies, multisensory experiences and interaction
- Not the same venue as the CORE-listed ICVR (International Conference on Virtual Rehabilitation)
- Proceedings in IEEE Xplore since 2021, listed as indexed in Ei Compendex and Scopus; 2020 edition was a workshop of ICIGP with papers in ACM DL
- Held in China 2021 to 2023 (Foshan, Nanjing, Xianyang), then in the UK and Netherlands (Bournemouth 2024, Wageningen 2025, Cardiff 2026)
- Submission via EasyChair; abstract-only presentation without publication is also offered
- Submission deadline is usually extended by a few weeks ("Final Call")
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
