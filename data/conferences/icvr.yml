id: icvr
name: ICVR
full_name: International Conference on Virtual Reality
type: conference
tier: minor
areas: [vision, general]
region: worldwide
language: english
frequency: annual
organizer: Host university and Nanjing University of Information Science and Technology (NUIST) as co-sponsors, with IEEE and IEEE SMC as technical sponsors
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 600 USD (2026, regular author), 550 USD student author
typical:
  deadline_months: [5, 6]
  conference_months: [7]
links:
  website: https://icvr.org/
notes:
- Annual conference on VR, AR, MR and 3D user interfaces; 12th edition in 2026
- Held in China 2021 to 2023 (Foshan, Nanjing, Xianyang), then in the UK and the Netherlands (Bournemouth 2024, Wageningen 2025, Cardiff 2026)
- Proceedings in IEEE Xplore (2021 to 2025); 2025 proceedings listed as indexed in EI Compendex and Scopus
- Papers 4 to 10 pages; one registration covers 6 pages, extra pages and extra papers cost more
- Deadline usually extended with a final call; short review cycle
- Not listed in ICORE2026 (the CORE entry "ICVR" is the unrelated International Conference on Virtual Rehabilitation)
