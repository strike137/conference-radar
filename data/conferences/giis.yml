id: giis
name: GIIS
full_name: Global Information Infrastructure and Networking Symposium
type: conference
tier: minor
areas: [networking, communications]
region: worldwide
language: english
frequency: annual
organizer: GIIS steering committee (chair at UVSQ, Paris-Saclay University), technically co-sponsored by IEEE and IEEE ComSoc
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
indexing: [EI Compendex]
typical:
  deadline_months: [12, 1, 2]
  conference_months: [2, 3, 4]
links:
  website: https://2027.giis-conference.org/
notes:
- Running since 2007 (1st edition in Marrakech); covers technical, policy and social issues of information
  infrastructures and networks
- Technical co-sponsorship by IEEE and IEEE ComSoc; accepted and presented papers published in IEEE Xplore, indexed by
  EI Compendex
- Rotates worldwide with a local host university (Paris 2019, Tunis 2020, Argostoli 2022, Dubai 2024 and 2025,
  Nanjing 2026 with Southeast University, Shenzhen 2027)
- Paper deadlines are extended several times (2026 final deadline came almost two months after the first one)
- Not listed in CORE ICORE2026
