notes:
- Romanian electronics and telecommunications symposium held in even years at Politehnica University Timișoara
  (17th edition in 2026)
- In cooperation with the IEEE Romania Section and its Com and SP/IT/COM chapters, and the Romanian Academy of
  Technical Sciences
- Broad tracks covering electronics, power electronics, signal processing, telecommunications and networking, AI and
  computer vision, instrumentation and open education, plus industry workshops
- Papers in English, recommended 4 pages and at most 6, IEEE format, submitted via EDAS; accepted papers go to IEEE
  Xplore (the 2024 proceedings carry DOI prefix 10.1109/ISETC63109.2024)
- The 2024 edition had over 90 papers in 7 tracks, with 27% of authors from outside Romania
- Not listed in ICORE2026 and not on the CCF list
