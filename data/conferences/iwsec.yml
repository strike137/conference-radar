notes:
- Co-organized by IEICE ISEC and IPSJ CSEC; held in Japan every year since 2006, city rotates (Kyoto Sep 2024, Fukuoka
  Nov 2025, Tokyo Nov 2026)
- Proceedings in Springer LNCS (every edition); selected papers invited to IEICE Trans. Fundamentals or Journal
  of Information Processing
- 'Acceptance rate about 28% (2025, 27/95); CORE rank National: Japan'
- 2025 had two submission rounds (April, July), 2026 a single round in June; anonymous submission, in-person presentation
  required
- Poster track without proceedings (2026 deadline Oct 2) is a good entry point for students; Best Student Paper
  and Best Poster awards
