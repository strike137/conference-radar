notes:
- Workshop on the interaction of AI and formal methods (verification of ML and LLM-based systems, neuro-symbolic AI, automata, synthesis, planning)
- Run by the Italian OVERLAY research group; first held in 2019
- Co-located with a different event each year (AIxIA 2019, BOSK 2020, GandALF 2021, AIxIA 2022, AIxIA 2023, Bolzano 2024, ECAI 2025 in Bologna, FLoC 2026 in Lisbon)
- Regular papers up to 9 pages and short papers up to 4 pages (short papers may present already published work), CEUR-WS template
- Proceedings in CEUR Workshop Proceedings (OVERLAY 2025 -> Vol. 4142, 2024 -> Vol. 3904, 2023 -> Vol. 3629)
- Deadline month varies with the host event (September 2024, July 2025, May 2026)
- Not listed in ICORE2026 or the CCF 2026 list
