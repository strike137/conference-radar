notes:
- Long-running main venue for discrete-event simulation and modeling, held annually since 1967, almost always in December
- Sponsored by ACM SIGSIM, IISE, INFORMS Simulation Society and SCS; full papers appear in the ACM and IEEE digital libraries
- Usually held in the USA (2023 San Antonio, 2024 Orlando, 2025 Seattle); occasionally abroad (2022 Singapore, 2026 Glasgow)
- Full papers up to 12 pages, all peer reviewed; separate deadlines for contributed and invited (track organizer) papers
- Poster extended abstracts and PhD Colloquium abstracts have later deadlines and are not in the ACM/IEEE proceedings
- Each accepted paper needs its own paid registration; an online participation option is offered through the Simulation Around the World track
- Listed as National/Regional in CORE ICORE2026 and not in the CCF list, so tier is minor under the site rules despite its long history
