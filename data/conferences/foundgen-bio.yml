id: foundgen-bio
name: FoundGen-Bio
full_name: Workshop on Foundation and Generative Models in Biometrics
type: workshop
tier: minor
areas: [vision, security, ai]
region: worldwide
language: english
organizer: Workshop organizing committee led by Hatef Otroshi and Sebastien Marcel (Idiap Research Institute), with Vitomir Struc, Luisa Verdoliva, Zhen Lei and Arun Ross; co-located with ICCV, CVPR or ECCV
organizer_country: [europe]
proceedings: CVF Open Access and IEEE Xplore (CVPR/ICCV Workshops proceedings); ECCV Workshops proceedings for the ECCV edition
archival: true
typical:
  deadline_months: [3, 7]
  conference_months: [6, 9, 10]
links:
  website: https://foundgen-bio.github.io/
notes:
  - Workshop series on foundation models and generative AI for biometrics (recognition, deepfakes, attack detection, synthetic data, privacy)
  - Held with a major vision conference, sometimes twice a year (ICCV 2025 Honolulu, CVPR 2026 Denver, ECCV 2026 Malmo)
  - Double-blind review on OpenReview; 8 pages in CVPR/ICCV style or 14 pages in ECCV (LNCS) style
  - Accepted papers appear in the official workshop proceedings (CVF Open Access for ICCV 2025 and CVPR 2026)
  - Best-reviewed ICCV 2025 papers were invited to an IEEE T-BIOM special issue
  - Distinct from the long-running CVPR Biometrics Workshop (cvpr-biometrics)
  - Not listed in ICORE2026 or the CCF list
