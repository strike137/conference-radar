notes:
- Romanian speech technology conference held every two years; 13th edition in 2025
- Covers speech recognition, synthesis, speaker recognition, audio deepfakes and forensics, spoken dialogue and NLP
- Technically co-sponsored by IEEE and EURASIP; SpeD 2025 papers are in IEEE Xplore (DOI 10.1109/SpeD67700.2025)
- Papers of 5 to 6 pages in IEEE format, submitted via OpenReview in 2025
- Always held in Romania (Cluj-Napoca 2013, Bucharest 2015 and 2017, Timisoara 2019, virtual 2021, Bucharest 2023, Cluj-Napoca 2025)
- "Fees 2025: 425 EUR regular and 250 EUR student (early)"
- Not listed in ICORE2026 and not on the CCF list
