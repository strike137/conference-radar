notes:
- Co-located workshop of SBRC, the Brazilian Symposium on Computer Networks and Distributed Systems; held 2021 to 2025 (5th edition in 2025)
- Topics include AI for 6G, terahertz communications, quantum communication, metasurfaces, edge and cloud computing, NFV and spectrum regulation
- Papers up to 8 pages in the SBC template, in Portuguese (with English abstract) or English
- Accepted papers published open access in SBC OpenLib (SOL); at least one author must register for SBRC and present orally
- Held on one day of the SBRC week (19 May 2025 in Natal)
- Not in the SBRC 2026 workshop list, so its continuation is unclear
- Not listed in CORE ICORE2026
