notes:
- Co-located workshop of COMSNETS, held each January in Bengaluru, India
- AI on IoT devices (on-device ML, TinyML, edge AI, federated learning, model compression, AI for IoT security)
- Double-blind review; papers up to 6 pages in IEEE format, submitted through EDAS
- Workshop papers appear in the COMSNETS proceedings and are submitted to IEEE Xplore
- First held with COMSNETS 2026; running again in 2027
- Workshop deadline is usually extended by one to four weeks
