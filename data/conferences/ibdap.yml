id: ibdap
name: IBDAP
full_name: International Conference on Big Data Analytics and Practices
type: conference
tier: minor
areas: [data, ai]
region: southeast-asia
language: english
frequency: annual
organizer: Big Data Institute (BDI, Public Organization), with the IEEE Signal Processing Society Thailand Chapter
organizer_country: [thailand]
proceedings: IEEE Xplore
archival: true
fee: 400 to 430 USD author, 370 to 400 USD student (2027)
typical:
  deadline_months: [4]
  conference_months: [8]
links:
  website: https://www.ibdap.org/
notes:
- Initiated and run by Thailand's Big Data Institute (BDI, Public Organization); the IEEE SPS Thailand Chapter and
  the Association of Council of IT Deans are part of the organizing community
- Proceedings in IEEE Xplore; papers not presented at the conference may be excluded
- Held in Thailand every year since 2020 (Bangkok 2020 and 2022, Chiang Mai 2025, Surat Thani 2026, Pattaya 2027)
- Scope covers big data analytics, data mining, machine learning and big data platforms and applications
- Not ranked in ICORE2026 and not in the CCF list
