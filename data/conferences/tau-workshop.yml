links:
  website: https://www.tauworkshop.com/
notes:
- Long-running standalone workshop on timing and power analysis of digital circuits (static timing, variability, characterization, clocking, EDA)
- Informal forum mixing industry (EDA vendors, chip companies) and academia, with invited talks and panels
- Copies of papers go to attendees only; proceedings are not published by ACM or IEEE, so papers can be submitted elsewhere
- Blind review (no author names in submissions); double-column proceedings format; submission through EasyChair
- "Fee: 540 USD regular, 265 USD student (2025, early)"
- 2025 edition held in Seaside, CA (near Monterey)
- Not listed in CORE ICORE2026
