id: wafl
name: WAFL
full_name: Workshop on Advancements in Federated Learning
type: workshop
tier: minor
areas: [ai, security]
region: europe
language: english
frequency: annual
organizer: WAFL workshop organizers (University of Torino, University of Naples Federico II, L3S Research Center); co-located with ECML PKDD
organizer_country: [europe]
proceedings: Springer CCIS (ECML PKDD workshops post-proceedings)
archival: true
typical:
  deadline_months: [6]
  conference_months: [9]
links:
  website: https://wafl2026.di.unito.it/
notes:
- Workshop on federated learning (non-IID data, security and privacy, fairness, interpretability, decentralized FL), co-located with ECML PKDD; 4th edition in 2026, themed on trustworthy FL
- Short papers 6 pages and long papers 12 pages plus references, ECML PKDD format, double-blind, via Microsoft CMT
- Accepted short and long papers go into the Springer CCIS ECML PKDD workshop proceedings; authors can opt out
- Non-archival track for papers accepted or under review elsewhere
- Selected 2026 papers invited to a special issue of Discover Artificial Intelligence (Springer)
- Not listed in CORE ICORE2026
