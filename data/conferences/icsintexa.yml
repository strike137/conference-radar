notes:
- New conference initiated and organized by Universitas Balikpapan, Indonesia; the first edition is in April 2027
- Hybrid format, in person in Balikpapan, East Kalimantan
- Accepted and presented papers will be submitted to IEEE Xplore, subject to IEEE scope and quality checks
- IEEE Indonesia Section officers sit on the steering and program committees
- Broad scope in six tracks (computational methods, HPC and networks, applications, software engineering, IT
  evaluation, HCI)
- Submission via EDAS using the IEEE template; papers must be presented to be published
- Not listed in ICORE2026
