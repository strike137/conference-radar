notes:
- ACM conference on fairness, equity and access in algorithms, mechanisms and optimization; interdisciplinary (CS, economics, OR, social science)
- Archival track papers go to the proceedings in the ACM Digital Library (at most 14 pages, one-column ACM template); a non-archival track accepts work under submission elsewhere
- Abstract deadline one week before the full paper deadline; separate work-in-progress poster call
- Held in the USA in most years (Arlington 2022, Boston 2023, Pittsburgh 2025), San Luis Potosí, Mexico in 2024 and Munich, Germany in 2026; first edition (2021) was virtual
- Financial assistance offered to attendees
- Not ranked in CORE ICORE2026 or the CCF list
