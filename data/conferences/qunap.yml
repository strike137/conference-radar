notes:
- One-day workshop co-located with IEEE INFOCOM; first held in London in 2025, second edition in Tokyo in 2026
- Accepted and presented papers appear in the IEEE INFOCOM workshop proceedings in IEEE Xplore
- Papers up to 6 pages in IEEE conference format, submitted via EDAS
- Topics are quantum networks and the quantum Internet, QKD, distributed quantum computing, quantum network protocols and testbeds
- Not listed in ICORE2026
