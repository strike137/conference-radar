notes:
- Flagship conference of ACM SIGEnergy on computing and networking for energy systems (smart grids, energy-efficient computing, ML for energy, EV charging)
- Two submission cycles per edition (fall and winter deadlines on separate HotCRP sites), registration one week before submission
- Proceedings in the ACM Digital Library; co-located workshops such as ACM EnergySP publish in the same proceedings
- Recent editions in Rotterdam 2025 and Banff 2026; location rotates worldwide
- Not listed in ICORE2026 or the CCF list
