notes:
- Annual three-day residential workshop of the JSSST SIG on Foundation of Software Engineering, held since 1994;
  2026 is the 33rd edition
- Held in November in recent years at a hot spring resort that changes each year across Japan; over 100 participants a year
- Research papers (full up to 10 pages, short up to 6 pages, replication or negative results up to 6 pages) and
  practice papers are reviewed by the program committee; live papers (2 pages) and poster or demo abstracts also
  accepted
- Proceedings are published by Kindai Kagaku Sha Digital and made free on J-STAGE (about six months later in 2025)
- Presented full and short papers can be extended for the annual "Foundations of Software Engineering" special
  issue of the JSSST journal Computer Software, with recommended papers
- Best presentation and excellent presentation awards, plus the IEEE Computer Society Japan Chapter FOSE Young
  Researcher Award for young first authors
- Registration fee includes two nights at the venue hotel
