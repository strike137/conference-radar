areas: [ai, nlp, data]
region: latin-america
language: english
frequency: annual
organizer: SIMBig (co-founders J. A. Lossio-Ventura and H. Alatrista-Salas) with a host university in Peru
organizer_country: [other]
proceedings: Springer CCIS
archival: true
indexing: [DBLP]
typical:
  deadline_months: [7, 8]
  conference_months: [10]
links:
  website: https://simbig.org/
notes:
- Held since 2014, mostly in Peru (Cusco, Lima, Ilo, Arequipa) with one edition in Mexico City (2023) and two
  online (2020, 2021)
- Proceedings in Springer CCIS (earlier editions in CEUR-WS with selected papers in Springer)
- Covers AI, machine learning, NLP, healthcare informatics, semantic web and data-driven software engineering;
  special tracks on computer vision (RACV) and software engineering (DISE)
- Long papers 13-16 pages, short papers 7-12 pages in Springer format, English only; at least three reviewers
- Co-located with the LASAI Latin American School of AI; NAACL supports best paper and travel awards for Latin
  American authors
- Not ranked in CORE ICORE2026
