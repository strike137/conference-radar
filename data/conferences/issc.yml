notes:
- Long running Irish conference on signals, systems and related areas (2026 was the 36th edition)
- Organized by a host university each year; ISSC 2026 was hosted by the University of Limerick
- Accepted papers are submitted to IEEE Xplore, subject to IEEE scope and quality checks
- Two day event in June aimed at researchers and PhD and Master students; best paper awards
- 2026 theme was Intelligent Systems for a Sustainable Future
