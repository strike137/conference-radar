notes:
- Meeting point of computer vision, graphics and machine learning researchers with film, broadcast and games practitioners
- Held every December at BFI Southbank in London; 2026 is the 23rd edition
- Full papers up to 10 pages, double-blind review, published in the ACM Digital Library (open access with ACM APC from 2026)
- Short papers, demos and industry talks are one-page abstracts presented as posters or talks and are not in the ACM DL
- Over 100 attendees, roughly half from academia and half from the creative industries
- Deadlines are 23:59 Pacific Time and are usually extended by about four weeks
- Not ranked in ICORE2026 and not on the CCF 2026 list
