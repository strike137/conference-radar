notes:
- Annual conference of the European Association for Technology-Enhanced Learning (EATEL), now styled ECTEL
- CORE B (ICORE2026); not on the CCF 2026 list
- Full papers, posters, demonstrations and industry reports appear in Springer LNCS; doctoral consortium papers go to CEUR-WS
- Full research papers 8 to 15 pages including references, posters and demos 4 to 6 pages; double-blind review
- Mandatory abstract about three weeks before the full paper deadline (AoE)
- Held in a different European city each September (online from Bolzano 2021, Toulouse 2022, Aveiro 2023, Krems 2024, Newcastle and Durham 2025, Valencia 2026)
