notes:
- Annual conference of EATEL, the European Association of Technology Enhanced Learning (registered in Siegburg, Germany); 21st edition in 2026
- Covers learning technologies, learning analytics, AI in education, adaptive and immersive learning systems
- Full research papers (8 to 15 pages), posters, demos and industry and practitioner reports appear in Springer LNCS (two volumes in 2026)
- Doctoral consortium papers go to CEUR Workshop Proceedings; workshop proposals are not published
- Mandatory abstract about three weeks before the full paper; deadlines were extended by about one week in 2026
- Face-to-face only; one registration covers at most two papers
- Held in a different European city each September (2023 Aveiro, 2024 Krems, 2025 Newcastle and Durham, 2026 Valencia)
- "CORE rank: B (ICORE2026); not in the CCF list"
