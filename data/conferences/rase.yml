notes:
- First edition held with ASE 2026 in Munich
- Topic is reliability and trustworthiness of automated and AI-based software engineering tools
- Full papers, education tools and material, and replication or negative-result papers up to 8 pages; short and demo papers up to 4 pages; position papers up to 2 pages (references included)
- Anonymized submissions via EasyChair; accepted papers published by ACM as the Proceedings of the 1st RASE workshop
- Selected papers may be invited to a journal special issue; best paper award
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
