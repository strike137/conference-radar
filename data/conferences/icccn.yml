id: icccn
name: ICCCN
full_name: International Conference on Computer Communications and Networks
type: conference
tier: major
areas: [networking, communications]
region: worldwide
language: english
frequency: annual
organizer: Technically co-sponsored by IEEE Communications Society
organizer_country: [usa]
proceedings: IEEE Xplore
indexing: [DBLP]
rank:
  core: B
  ccf: C
typical:
  deadline_months: [2, 3]
  conference_months: [7, 8]
links:
  website: http://www.icccn.org/
notes:
- Single-blind review; 9 pages including references, borderline papers may be accepted as 6-page short papers
- Often held in Hawaii; 2025 edition was in Tokyo, 2027 moves to Rome
- Abstract registration one week before the full paper; separate later deadlines for posters and workshops
- In-person presentation required; CORE B, CCF C
