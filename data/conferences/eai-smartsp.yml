notes:
- EAI conference on security and privacy of cyber-physical systems and smart vehicles, held since 2023; 2026 is the 4th edition
- Proceedings in Springer LNICST; selected papers invited to extend for Mobile Networks and Applications (MONET)
- Held in the USA every year so far (Chicago 2023, New Orleans 2024, Salt Lake City 2025, Detroit 2026); fully onsite
- Two submission cycles plus a poster and demo track; anonymized submission via EasyChair
- Travel grants offered for students and early career researchers
- Not listed in ICORE2026 or the CCF 2026 list
