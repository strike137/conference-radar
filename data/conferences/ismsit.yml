id: ismsit
name: ISMSIT
full_name: International Symposium on Multidisciplinary Studies and Innovative Technologies
type: conference
tier: minor
areas: [ai, networking, communications, general]
region: middle-east
language: mixed
frequency: annual
organizer: SET Teknoloji with Turkish university chairs (Tokat Gaziosmanpasa University); IEEE technical sponsorship
organizer_country: [other]
proceedings: IEEE Xplore
archival: true
acceptance_rate: 58.6% (2022, 197/336)
fee: 375 EUR IEEE member, 500 EUR non-member (2026, early physical registration; virtual 300 / 425 EUR)
typical:
  deadline_months: [8, 9]
  conference_months: [10, 11]
links:
  website: https://www.ismsitconf.org/
notes:
- Turkish multidisciplinary engineering symposium held every year since 2017; 2026 is the 10th edition
- Run by the Turkish company SET Teknoloji (named as copyright holder of the official site)
- Accepted full papers go to IEEE Xplore (every year from 2019 to 2025); abstracts and posters go to a companion
  proceedings with ISBN, and papers can instead go to the journal IJMSIT
- Double-blind review; the submission page says the acceptance rate is kept below 60%
- Papers in Turkish or English; hybrid format with in-person and virtual sessions
- Held in Turkey (Ankara 2019 and 2022, Antalya 2026); 2024 and 2025 programs list virtual and in-person rooms
  without naming the venue
- Broad topics from AI and networking to power electronics and robotics
- Not listed in CORE ICORE2026
