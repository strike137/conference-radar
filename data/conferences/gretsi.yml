notes:
- Biennial French-speaking signal and image processing conference run since 1967 by the GRETSI association
- French-speaking colloquium; the paper header must include an abstract in French and in English; literal French
  translations of papers submitted or accepted elsewhere are no longer accepted
- Direct submission of 4-page two-column papers via the myGretsi tool, reviewed by experts before acceptance
- Proceedings of every edition since 1967 are freely available as PDF with BibTeX in the GRETSI archives
- Held in a different French city each edition (Lille 2019, Nancy 2022, Grenoble 2023, Strasbourg 2025, Rennes 2027)
- About 300 papers and 500 participants expected for GRETSI 2027 (official site)
- Not listed in CORE ICORE2026 or in the CCF 2026 list
