notes:
- Semiconductor electronics conference of the IEEE EDS Malaysia Chapter; not the software engineering ICSE
- Earlier editions were titled IEEE International Conference on Semiconductor Electronics
- Technically co-sponsored by the IEEE Electron Devices Society
- Biennial (even years), alternating with the sibling RSM symposium in odd years
- Topics include devices, modeling and simulation, photonics and sensors, MEMS, fabrication, packaging, reliability and nanoelectronics
- Held in Malaysia, mostly Kuala Lumpur; 2026 edition is hybrid
- 4 to 5 page papers via EDAS; presented papers are submitted to IEEE Xplore
- Not listed in ICORE2026 or the CCF list
