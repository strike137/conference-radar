notes:
- Two-day working conference on modeling methods for systems analysis and development (32nd edition in 2027)
- Always co-located with CAiSE (Leuven 2022, Zaragoza 2023, Limassol 2024, Verona 2026, Seville 2027)
- Proceedings in Springer LNBIP (listed for every year since 2017)
- Five tracks; accepts completed research, research-in-progress, idea papers, experience reports and tool demos
- Best paper candidates invited to a special issue of the Software and Systems Modeling (SoSyM) journal
- CORE C (ICORE2026, listed as Exploring Modelling Methods in Systems Analysis and Design)
