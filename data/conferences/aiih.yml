notes:
- Young conference on AI for healthcare, first held in 2024 at Swansea, then Cambridge (2025), Imperial College London (2026) and Oxford (2027)
- Full papers (12 pages plus references) go through double-blind review and appear in Springer LNCS
- Abstracts (up to 5 pages) and late-breaking abstracts are archived with DOIs on Zenodo, not in LNCS
- "Acceptance rate: 58.7% for full papers (2026, 101/172); 60/83 in 2025"
- 2026 added a State-of-the-Art Surveys (STARS) track of up to 24 pages and a challenge session on perivascular space segmentation
- Single track with oral and poster presentations; also takes special session proposals
- Not listed in ICORE2026 and not on the CCF list
