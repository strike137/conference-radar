  conference_months: [3]
links:
  website: https://csnt.in/
notes:
- Run by MIR Labs Gwalior together with the IEEE Madhya Pradesh Section and IETE Gwalior; sister conference of CICN from
  the same organizers
- Held since 2011; the 2027 edition is the 16th
- Proceedings through IEEE Conference Publishing Services; the site states all past proceedings are in IEEE Xplore
- Full papers 4 to 8 pages in IEEE two-column format (6 pages included in the fee, extra pages charged), submission via
  EDAS, at least three reviews per paper
- The site claims an acceptance rate below 25%
- Notification is sent about 20 days after each submission (rolling review)
