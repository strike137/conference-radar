organizer: Machine Intelligence Research Labs (MIR Labs) Gwalior with the IEEE Madhya Pradesh Section and IETE Gwalior
organizer_country: [india]
proceedings: IEEE Xplore
fee: INR 5,000 IEEE member / 6,000 non-member for Indian authors, 150 / 200 USD for international authors (2027)
typical:
