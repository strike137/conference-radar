notes:
- Korean-language spring conference of KINGPC, the society that also runs the international ICNGC
- Papers of 2 to 4 pages in HWP or Word format, reviewed by the society before acceptance
- Accepted papers presented as oral or poster; at least one author must register or the paper is not published
- Best presentation awards; awarded papers are published in the Journal of KINGPC
- Held in early May at a different Korean university each year (Hoseo University Asan in 2025, Chosun University Gwangju in 2026)
- Deadline was extended twice in 2026 (to Apr 10 and then Apr 17)
- Not listed in ICORE2026 or the CCF list
