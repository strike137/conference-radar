notes:
- Workshop on green, energy-efficient and carbon-aware software architecture, co-located with IEEE ICSA
- 1st edition at ICSA 2026 (Amsterdam), 2nd at ICSA 2027 (Sydney)
- Accepted papers are published in the ICSA Companion Proceedings (IEEE Computer Society) in IEEE Xplore
- Papers up to 8 pages in IEEE CS proceedings format, including 2-page position papers, submitted via the ICSA EasyChair
- Organizers from Prince Mugrin University (Saudi Arabia), Linnaeus University (Sweden) and University of Haripur (Pakistan)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
