notes:
- Premier multidisciplinary venue spanning computer architecture, programming languages and operating systems
- ACM conference with SIGARCH, SIGPLAN and SIGOPS as technical sponsors; proceedings in the ACM Digital Library
- Two submission cycles per year; papers from each cycle are published in separate proceedings volumes before the conference
- 2027 adds a rapid review round that reads only the first two pages; a majority of submissions may not pass it
- Double-blind review, 11 pages excluding references, author response, major revision option, optional artifact evaluation
- Rotates mainly between North America and Europe (Vancouver 2023, San Diego 2024, Rotterdam 2025, Pittsburgh 2026, Heraklion 2027)
- Regarded as a top systems and architecture venue (ICORE2026 A*, CCF A)
