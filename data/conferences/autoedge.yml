notes:
- Workshop on agentic AI and autonomic (self-managing) computing on resource-constrained IoT and edge devices
- Organized by the UK National Edge AI Hub; general chairs from Newcastle University and the University of Messina
- First edition held with ACM MobiSys 2026 in Cambridge, UK, as part of an Agentic Systems track with AutoSys
- Full papers up to 6 pages and 2-page extended abstracts with a poster, MobiSys format, submitted via HotCRP
- Papers published in the ACM Digital Library (Proceedings of the 24th MobiSys Workshops, 2026)
- In-person presentation required for at least one author
- Not listed in ICORE2026
