notes:
- Forum on performance, reliability and verification of systems through stochastic models, measurements and
  probabilistic model checking; roots in TOOLS, PNPM and PAPM-ProbMIV
- Since 2024 held as a joint conference with FORMATS (QEST+FORMATS) with one program committee, one call for
  papers and joint proceedings, co-located with CONCUR and others under CONFEST
- Proceedings in Springer LNCS since 2013 (IEEE Computer Society 2004 to 2012)
- Research, case study and tool papers; regular papers up to 16 pages and short papers up to 7 pages excluding
  references; single-blind review with at least three reviewers
- Artifact evaluation is mandatory for tool papers and optional for other papers
- Mostly held in Europe (2021 Paris virtual, 2022 Warsaw, 2023 Antwerp, 2024 Calgary, 2025 Aarhus, 2026 Liverpool)
