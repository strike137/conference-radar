notes:
- Long-running symposium on modeling, performance evaluation and optimization of wireless, mobile and edge networks;
  2026 was the 24th edition
- Technical co-sponsorship of the IEEE Control Systems Society and IEEE Information Theory Society, with support from
  IFIP
- Papers go to the IFIP Digital Library (open access, free for authors and readers) and are considered for IEEE Xplore
- Full papers up to 8 pages in IEEE two-column format, submitted via EDAS; the submission deadline is firm
- At least one author must register at the full rate and present in person for the paper to be published
- Best Paper and Best Student Paper winners get a fast-track invitation to IEEE Transactions on Networking (2026)
- Co-located workshops (for example MOSC, ISAC, RAWNET) with their own deadlines; held on June 6 after the main conference
  in 2026
- Location changes every year (2025 Linkoping, Sweden; 2026 Columbus, USA)
- CORE B (ICORE2026); not on the CCF list
