notes:
- Run by the CSCWD International Working Group with a local host university each year; co-sponsored by IEEE SMC
  Society; 2027 hosted by the University of Southern Queensland with Fuyao University of Science and Technology
- Topics span CSCW, collaborative design, distributed and multi-agent systems, AI and IoT applications
- Proceedings in IEEE conference proceedings (submitted to IEEE Xplore), submitted for EI and DBLP indexing
- CORE C and CCF C; regarded as a minor venue
- Mostly held in China (Tianjin 2024, Fuzhou 2026) but also abroad (Rio de Janeiro 2023, Brisbane 2027, hybrid)
