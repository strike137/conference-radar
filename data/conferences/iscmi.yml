notes:
- Annual flagship event of the India International Congress on Computational Intelligence (IICCI); started in New Delhi in 2014
- Technically co-sponsored by the local IEEE section (IEEE Austria Section in 2026, IEEE Brazil Council and Rio de Janeiro Section in 2025)
- Proceedings 2014 to 2025 in IEEE Xplore, indexed in EI Compendex and Scopus per the site
- Moves to a different country each year (virtual 2020 to 2023, Melbourne 2024, Rio de Janeiro 2025, Vienna 2026, Nadi in Fiji 2027)
- Papers at least 4 pages, regular registration covers 5 pages; abstract-only presentation option is not published
- Selected papers extended by at least 30% are recommended to a special issue of Enterprise Information Systems
- Short review cycle (about three weeks between submission deadline and notification); submission via EasyChair
- Not ranked in CORE ICORE2026
