notes:
- Workshop co-located with IEEE VTC-Spring; 1st at VTC2025-Spring (Oslo), 2nd at VTC2026-Spring (Nice), 3rd at VTC2027-Spring (Hamburg)
- Organizers from Northeastern University, University of Lisbon and Sapienza University of Rome, with Tokyo University of Science co-organizers in 2026
- Topics include AI for V2X, Open RAN, LoRaWAN, mobility management and digital twins
- 2026 edition ran from 11:00 to 18:15 on 9 June with keynotes from NVIDIA and the University of Tokyo
- Papers 5 pages (up to 2 extra pages at 100 USD each); accepted VTC papers go to IEEE Xplore and may be removed if not presented
- Not listed in ICORE2026
