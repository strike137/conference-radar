links:
  website: https://sustainability-and-modeling.github.io/
notes:
- Workshop on model-driven engineering for sustainable systems and on the sustainability of MDE techniques and tools
- Held with MODELS every year since 2024 (Linz 2024, online 2025, Malaga 2026); 2026 was the 3rd edition
- The 2025 edition was a joint fully online workshop with MLE (Modeling Language Engineering) at MODELS 2025
- Papers go into the MODELS joint workshop proceedings (ACM in 2024 and 2026, IEEE in 2025)
- Full papers up to 10 pages and short papers (work in progress, vision, case papers) up to 5 pages, references included, ACM format
- Each paper reviewed by at least three PC members; afternoon of the 2026 edition was a World Cafe style roadmap discussion
- Not listed in the CORE portal (ICORE2026)
