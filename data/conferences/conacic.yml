id: conacic
name: CONACIC
full_name: Congreso Internacional y Congreso Nacional de Ciencias de la Computación (International and National Congress of Computer Science)
type: conference
tier: domestic
areas: [general, ai, data]
region: latin-america
language: mixed
frequency: annual
organizer: Facultad de Ciencias de la Computación, Benemérita Universidad Autónoma de Puebla (BUAP)
organizer_country: [other]
proceedings: Book chapters with ISBN (CONACIC books) or articles in the journal Abstraction and Application (UADY)
archival: false
fee: Free attendance; a fee applies only for publication as a book chapter with ISBN (2026)
typical:
  deadline_months: [6, 7]
  conference_months: [10]
links:
  website: https://conacic.siycise.org/
notes:
- Mexican computer science congress run by the BUAP Faculty of Computer Science in Puebla; 16th national and 8th international edition in 2026
- Broad topics (AI, data science, robotics, cybersecurity, software engineering, IoT, education) plus a special health topic in 2026
- Papers up to 10 pages in Spanish or English, double-blind review via EasyChair
- Accepted papers appear as book chapters with ISBN or in the journal Abstraction and Application; extended versions can go to IJCOPI or Computación y Sistemas
- 2026 edition was virtual, with on-demand paper talks; national program on four days and international program on one day
- Not listed in CORE ICORE2026
