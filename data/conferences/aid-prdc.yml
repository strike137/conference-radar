notes:
- Workshop on the dependability, security and safety of AI and LLM-based systems, held with IEEE PRDC since 2025
- 'Editions: 2025 Seoul (one day, Nov 4, 9 papers presented in a dedicated session), 2026 Hong Kong'
- Accepted papers are published by IEEE Computer Society Press as part of the PRDC proceedings (EI indexed per the
  2026 CFP)
- 'Up to 6 pages in the IEEE double-column template including references; double-blind in 2026 (single-blind in 2025)'
- 2026 has a Regular Paper track and an R&D Paper track for interim results of funded research projects
- Program committee is mostly from Korean universities and the National Security Research Institute
- Not listed in ICORE2026
