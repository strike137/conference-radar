notes:
- Organized by GiRI (Global IT Research Institute); held almost every winter at Phoenix Park, Pyeongchang, Korea
  (2018 was in Chuncheon); 2027 moves to late January
- Proceedings in IEEE Xplore since 2004; outstanding papers invited to GiRI's ICACT-TACT journal
- Single-blind review, first-come first-served decisions within about 10 working days
- Hybrid format through its own web presentation platform (not Zoom)
- 'Regarded as a lower-tier venue; reported acceptance around 30% (2024: 78/274, 2025: 83/254, 2026: 88/284)'
