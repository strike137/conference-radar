id: iccse
name: ICCSE
full_name: International Conference on Computer Science and Education
type: conference
tier: minor
areas: [general]
region: worldwide
language: english
frequency: annual
organizer: National Research Council of Computer Education in Colleges & Universities (China), with technical support from the IEEE Education Society
organizer_country: [china]
proceedings: IEEE Xplore (2026); Springer CCIS (2022, 2023, 2025)
archival: true
typical:
  deadline_months: [5, 6]
  conference_months: [7, 8]
links:
  website: https://www.ieee-iccse.org/
notes:
- Computer science education and AI in education conference run since 2006 by a Chinese national council for computer education
- Publisher changes between years; 2020 and 2021 in IEEE Xplore, 2022, 2023 and 2025 in Springer CCIS, 2026 submitted to IEEE Xplore
- Held in China until 2010, then mostly abroad (Malaysia 2023, Osaka and Fukui 2025, Budapest 2026)
- No 2024 edition; the 2023 edition was in December, others mostly July or August
- Not listed in CORE or CCF
