notes:
- Regional computing education conference run by the Western Canadian Computing Education Society since 1996
- Two-day meeting in late April or early May, hosted by a different Western Canadian institution each year (Calgary 2025, Vancouver 2026, Kamloops 2027)
- Proceedings in the ACM Digital Library for 2023, 2024 and 2026; the 2025 papers went to the Mount Royal University Open Access Repository instead
- Long papers up to 6 pages plus 1 page of references in ACM format, also short papers, panels, posters, nifty assignments, blizzard talks and a student research showcase
- Anonymized review for most submission types; fully in person
- Not listed in ICORE2026 or the CCF 2026 list
