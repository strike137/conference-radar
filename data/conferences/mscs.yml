notes:
  - Annual March meeting of the Control Division of SICE (Society of Instrument and Control Engineers), held since 2014
  - Merges the Control Theory Symposium, Plant Modeling Symposium, Adaptive and Learning Control Symposium, Guidance and Control Symposium and the System Construction and Control Technology Symposium
  - Papers are 1 to 8 pages (paper or slide format); the preprint PDF is released to participants on the first day
  - Includes the English SICE International Symposium on Control Systems (ISCS) with peer-reviewed regular papers submitted to IEEE Xplore and a separate October deadline
  - Selected talks can go to a special issue of the Transactions of SICE
  - Student poster session aimed at contact with industry
  - Held in a different Japanese city each year (Toyama 2026, Tokyo 2027)
