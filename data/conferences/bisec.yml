notes:
- Serbian information security conference bringing together the business sector, public sector and academia; 17th edition in 2026
- Organized by Belgrade Metropolitan University and the eSecurity Association; held at the university campus in Nis since at least 2023 (hybrid in 2026)
- Two tracks in 2026, cybersecurity and business security
- 2023 and 2024 proceedings in CEUR-WS (Vol-3676, Vol-3971); 2025 proceedings published by Belgrade Metropolitan University
- 2026 papers that pass review appear in the conference proceedings with Crossref DOIs; registration 100 EUR per paper for foreign authors (2026)
- From 2026 selected high-quality papers are invited to CEUR-WS after extension and an additional round of peer review
- "Acceptance: 22 of 32 submissions (2024), double-blind review"
- Very short cycle, the 2026 submission deadline was two weeks before the conference
- Not listed in CORE ICORE2026 or the CCF list
