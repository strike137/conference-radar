notes:
- Workshop at the intersection of programming languages and operating systems, co-located with ACM SOSP
- Roots in the ECOOP workshop series on Object-Orientation and Operating Systems (since 1997); renamed PLOS in 2004
- Biennial with SOSP from 2009 to 2025; also held in 2026, the year after the 2025 edition
- Research, experience and position papers of at most 6 pages plus references (ACM sigplan format), double-blind
- Accepted papers are published in the ACM DL; ACM open access APC applies to authors outside ACM Open institutions
- Small event, about 35 to 40 attendees in 2025 (125 registrations in 2023)
- Follows SOSP around the world (Koblenz 2023, Seoul 2025, Prague 2026)
- CORE C (ICORE2026); not on the CCF list
