notes:
- Community-run, non-profit Security BSides event in João Pessoa, Paraíba, Brazil, held every year since 2022 (September in 2023 to 2026)
- One-day event at the UNIESP campus (Auditório Master), Cabedelo/PB, in the João Pessoa metropolitan area
- About 300 participants in 2026, with a main talk track plus an incident response village and an offensive security village
- Talks mostly in Portuguese, some titles in English
- Low-cost tickets on Sympla, with half price for students and a social ticket for 1 kg of food donation
- Talks only, no proceedings
- Not listed in the CORE portal (ICORE2026)
