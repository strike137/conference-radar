notes:
- One-day ICSE workshop on AI for software engineering problems in banks and FinTech (legacy modernization, testing, compliance, normative requirements)
- Held with ICSE since 2024; Lisbon 2024, Ottawa 2025, Rio de Janeiro 2026 (3rd edition)
- Organizers mix academia and industry; 2025 organizers included J.P. Morgan AI Research, 2026 organizers came from University of Luxembourg and ING
- Research papers up to 8 pages, extended abstracts up to 4 pages (APC free), flash talk proposals up to 2 pages (not in the proceedings); ACM format
- Single-blind review in 2026 (double-blind in 2025); in-person presentation expected
- 2025 proceedings in IEEE Xplore; 2026 in the ICSE workshop proceedings (ACM template)
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
