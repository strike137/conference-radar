notes:
- Annual software engineering conference organized by CIMAT (Mexico) since 2012; 15th edition in 2026
- Topics include software process improvement, standards and methodologies, knowledge management, AI, quantum software engineering and ICT in education
- Full papers (10 to 14 pages), industry papers (6 to 8 pages) and posters (4 pages), in English or Spanish
- Double-blind review by at least two program committee members
- Accepted English full papers go to a Springer book series (2025 -> Studies in Computational Intelligence) and IEEE format papers are submitted to IEEE Xplore
- Selected papers can be extended for IEEE Latin America Transactions and Mexican journals for an extra fee
- Hybrid format; held mostly in Mexico, Lima (Peru) in 2025 and San José (Costa Rica) in 2026
- Not listed in CORE ICORE2026
