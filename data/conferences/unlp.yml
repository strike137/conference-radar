notes:
- NLP for the Ukrainian language (and Crimean Tatar); submissions must relate to Ukrainian or Crimean Tatar
- Started in 2021 as a workshop co-located with ICTERI, then held at EACL 2023, LREC-COLING 2024 and ACL 2025
- Became a standalone conference in 2026, held in hybrid format at the Ukrainian Catholic University in Lviv
- Proceedings in the ACL Anthology (23 papers in 2026, 21 in 2025)
- Long papers up to 8 pages and short papers up to 4 pages in ACL format; double-blind review with at least three reviewers
- Runs a shared task every year (multi-domain document understanding in 2026)
- "Acceptance rate: 20 of 41 submissions (2025)"
- Not ranked in ICORE2026 and not on the CCF list
