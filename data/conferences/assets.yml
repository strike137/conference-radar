notes:
- Organized by ACM SIGACCESS; the main research conference on computing and accessibility
- Technical papers, posters and demos, experience reports and student research competition entries are archived in the
  ACM Digital Library (ACM Open; reduced APC of 250 USD for members, 350 USD for non-members in 2026)
- Single technical paper deadline in April with a rebuttal phase in June; an optional mentoring program for first-time
  authors
- At least one author per accepted submission must register as the in-person presenter by the early registration
  deadline; hybrid attendance for others
- CORE A (ICORE2026), CCF C
- Held worldwide in late October (Denver 2025, Porto 2026)
