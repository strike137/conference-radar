notes:
- Joint application security event of the OWASP Belgium and Netherlands chapters, first held in 2009
- One conference day followed by one training day; alternates between Belgium and the Netherlands (Kortrijk 2021, Tilburg 2022, Hasselt 2023, Utrecht 2024, Mechelen 2025, Utrecht 2026)
- Conference day is free with registration; trainings cost 50 EUR per day (2026)
- Program includes a CTF and a social event
- No public call for papers seen on the 2026 site; no proceedings
