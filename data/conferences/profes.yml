notes:
- Software engineering venue on software process improvement, product and process quality and empirical studies
  with industry
- CORE B (ICORE2026); not on the CCF list
- Proceedings published by Springer in LNCS; in 2025 a second volume held industry, doctoral symposium, tutorial and
  workshop papers
- Full research papers up to 16 pages including references in LNCS format; single-anonymous review by at least
  three reviewers; short papers and posters also go into the proceedings
- Industrial talk proposals (2-page abstracts) are presented but not included in the proceedings
- Held in Europe around early December; recent hosts Dornbirn 2023, Tartu 2024, Salerno 2025 and Karlskrona 2026
- In-person presentation by at least one author is required
