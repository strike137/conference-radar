notes:
- Annual conference of CSE Connect, a UK national network for cyber security and technology education, supported by the National Cyber Security Centre (NCSC)
- Focus on cyber security education (curriculum design, CyBOK mapping, game-based learning, AI in teaching, workforce pathways)
- Held in the UK; 2025 (5th edition) at the University of Warwick, 2026 at Abertay University, Dundee
- The 2025 papers were published as Springer Lecture Notes in Networks and Systems vol. 1791
- Attendance was free in 2026 (registration required, places limited)
- Also written ATLCSE (the 2026 programme on Sched is listed as ATLCSE 2026)
- Not listed in CORE ICORE2026
