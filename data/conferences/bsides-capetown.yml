notes:
- Annual volunteer-run hacker and information security conference in Cape Town, South Africa
- Held on the first weekend of December since 2011; run by BSides Cape Town NPC
- Main conference day at the Lagoon Beach Hotel, Cape Town (2026), with optional workshops the day before
- Held at Dimension Data (2012 to 2019), Old Biscuit Mill (2022) and the UCT GSB Conference Centre, V&A Waterfront (2023 to 2024); no event in 2021
- Talks chosen through a Pretalx call for papers; standard 45-minute, short 30-minute and lightning talks plus 4-hour workshops
- Topics include pentesting, security research, cryptography and computer science; code-heavy talks welcome
- Corporate, standard and lower-priced student tickets sold via Quicket; pay-it-forward Rite of Passage tickets support aspiring cybersecurity students
- Sister conference of BSides Joburg
- No proceedings; talks are recorded and posted on YouTube
