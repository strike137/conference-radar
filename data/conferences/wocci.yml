notes:
- Workshop on child speech, child machine interaction, multimodal and robotic interfaces for children
- 7th edition in 2025; earlier editions 2008, 2009, 2012 (Portland), 2014 (Singapore), 2016 (San Francisco), 2017
  (Glasgow)
- 2025 edition was an Interspeech 2025 satellite workshop held jointly with SLaTE 2025 in Nijmegen
- Papers of 5 pages in the Interspeech format, double-blind review via CMT
- Proceedings in the ISCA Archive with DOIs (10.21437/WOCCI.2025)
- Not listed in ICORE2026 or the CCF list
