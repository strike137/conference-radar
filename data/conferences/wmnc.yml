id: wmnc
name: WMNC
full_name: IFIP Wireless and Mobile Networking Conference
type: conference
tier: minor
areas: [networking, communications]
region: worldwide
language: english
frequency: annual
organizer: IFIP TC6 (hosted by a different university each year, KU Leuven in 2025, University of Twente in 2026)
organizer_country: [international]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [7, 8]
  conference_months: [9, 10, 11]
links:
  website: https://www.utwente.nl/en/wmnc2026/
notes:
- Technically sponsored by IFIP; combines the former PWC, MWCN and WSAN events
- Proceedings in IEEE Xplore and the open access IFIP Open Digital Library
- Mostly held in Europe (Prague 2018, Paris 2019, Venice 2024, Leuven 2025), also Montreal and Sousse; no 2023 edition
- Full papers up to 8 pages and short papers up to 5 pages in IEEE format
- Small two-day conference; deadlines are usually extended
- Not ranked in CORE ICORE2026
