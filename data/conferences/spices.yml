notes:
- Flagship conference of the IEEE Kerala Section, run jointly with a different Kerala host institution each edition
- "Editions: 2015 NIT Calicut, 2017 Kollam, 2022 MBCET Trivandrum, 2024 IIIT Kottayam, 2026 GCE Kannur"
- Described by the organizers as a biennial series; the gap between 2017 and 2022 was longer
- Accepted and presented papers are submitted to IEEE Xplore; all four earlier editions have proceedings there
- Broad EE and CS scope with tracks on signal processing, communication networks, computing, robotics, AI, smart energy, instrumentation and power electronics
- Submission via Microsoft CMT; special sessions are also invited
- Not listed in ICORE2026 or the CCF 2026 list
