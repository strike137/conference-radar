notes:
- Run by the IEEE Technical Committee on Real-Time Systems (TCRTS); flagship venue for real-time and embedded systems
- Proceedings published by IEEE (DOI 10.1109/RTSS...), in IEEE Xplore
- CORE A (ICORE2026); CCF A in the CCF 2026 list (interdisciplinary category)
- Double-anonymous review following TCRTS rules; up to 11 pages of technical content at submission, 12 in the final
  version; IEEE conference template
- Conditional acceptance with shepherding, optional artifact evaluation, plus a Hot Topics Day and brief
  presentation and RTSS@Work tracks
- Held in early December; Boston 2025, Yokohama 2026
