notes:
- Was the IEEE/ACM ASONAM until 2023; from 2024 the steering committee dropped the IEEE and ACM sponsorship
  to lower the registration fee
- Proceedings now in Springer LNCS (2025 in three volumes); the 2026 camera-ready page also has a Springer Lecture
  Notes in Social Networks licence form
- CORE B (ICORE2026); full papers up to 15 pages, short papers 8 pages, Springer format
- Tracks include research, SNAM journal track (Springer Social Network Analysis and Mining), industrial,
  multidisciplinary, PhD forum and posters; co-located with the HI-BI-BI, FOSINT-SI and FAB workshops
- Location rotates worldwide (Turkey 2023, Italy 2024, Canada 2025, Morocco 2026, Greece 2027)
