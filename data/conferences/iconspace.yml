language: english
frequency: biennial
organizer: Space Science Centre (ANGKASA), Institute of Climate Change, Universiti Kebangsaan Malaysia (UKM)
organizer_country: [malaysia]
proceedings: Springer
archival: true
typical:
  deadline_months: [2]
