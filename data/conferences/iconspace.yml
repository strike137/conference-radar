links:
  website: https://www.ukm.my/iconspace/
notes:
- Biennial conference run by the UKM Space Science Centre (ANGKASA) and always held in Malaysia (Melaka 2025, Penang 2023)
- Long-running series since 2009; 2027 is the 10th edition
- Covers space science, satellite and space communication, space weather and remote sensing
- 2023 and 2025 papers went to Springer, with Jurnal Kejuruteraan as a journal option; 2009 to 2021 editions (except 2017) were in IEEE Xplore
- Abstract-only presentation option without publication is also offered
- Not listed in ICORE2026 or the CCF list
