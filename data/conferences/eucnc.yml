notes:
- Merger of EuCNC (European Commission supported series dating back to 1992) and the 6G Summit from the 6G Flagship
  programme in Finland; joint event since 2021
- Organized by the EU SNS CO-OP support action; technically sponsored by IEEE ComSoc, EURASIP and EurAAP
- Regular session papers go to IEEE Xplore; anonymous review by the TPC with at least three reviews per paper
- Large event with close to 1000 delegates and a big exhibition of EU research projects; also has posters (extended
  abstracts), workshops, special sessions and tutorials
- Held every June in Europe (Porto virtual 2021, Grenoble 2022, Gothenburg 2023, Antwerp 2024, Poznan 2025, Malaga 2026)
- Best papers invited to a special issue of the EURASIP Journal on Wireless Communications and Networking
- Not-for-profit with relatively low fees; submission is open to all researchers, not only EU project members
- Paper deadline is usually extended twice (2026 -> Jan 23 moved to Feb 6, then Feb 13)
- Not listed in ICORE2026 or the CCF list
