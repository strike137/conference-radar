notes:
- Long-running annual multimedia conference (33rd edition in 2027) run by an international steering committee
- Proceedings in Springer LNCS (several volumes per year); double-blind review, 12 pages plus 2 pages of references
- Rotates between Asia and Europe, usually held in January (2025 Nara, 2026 Prague, 2027 Siem Reap)
- Hosts the Video Browser Showdown (VBS) interactive video retrieval competition, plus special sessions and demos
- Each accepted paper needs one full (non-student) registration; online presentation was allowed in 2026
- ICORE2026 rank B; CCF C
