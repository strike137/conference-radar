notes:
- Longest-running community Python conference in Europe, held every year since 2002; 2026 was the 25th edition
- Run by volunteers under the EuroPython Society, a non-profit registered in Sweden; any surplus funds grants and financial aid
- A week-long event of tutorials and summits, three main conference days with 100+ talks in five parallel tracks, then a sprints weekend
- Talks, tutorials and posters chosen from a call for proposals; a speaker mentorship programme helps first-time speakers
- Tracks include machine learning, NLP and CV, data engineering, scientific Python, and testing and security
- 'Past venues: Dublin 2022 (hybrid), Prague 2023 to 2025, Krakow 2026'
- Over 1,587 participants and 165 speakers in 2025
- No papers or proceedings; practitioner talks only
