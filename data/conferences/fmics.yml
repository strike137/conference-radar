notes:
- Annual conference of the ERCIM FMICS Working Group, running since 1996 (31st edition in 2026)
- Focus on formal methods and verification applied to industrial and safety critical systems
- Proceedings in Springer LNCS; regular papers up to 15 pages in LNCS style, at least three reviews per paper
- Often co-located with a larger event (CONFEST 2026 in Liverpool with CONCUR and QEST+FORMATS)
- Held in Europe every year (Antwerp 2023, Milan 2024, Aarhus 2025, Liverpool 2026, Athens 2027 with FM)
- Best paper receives the EASST ERCIM award; selected papers invited to an STTT special issue in some years
