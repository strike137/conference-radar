notes:
- Main international venue for face, gesture and body motion analysis; co-sponsored by the IEEE Biometrics Council
  and the IEEE Computer Society
- Proceedings in IEEE Xplore; long papers (8 pages plus references) and short papers (4 pages plus 1 page of
  references) go through the same double-blind review
- FG 2026 used two review rounds (accept, revise and resubmit, or reject in Round 1); FG 2027 switches to a single
  review round
- CORE B (ICORE2026) and CCF C
- In-person only; no virtual or pre-recorded presentations (2027)
- In 2026 each main paper needed one full (non-student) registration
- 2026 edition (20th) was held in Kyoto, Japan; 2027 (21st) is the first edition in Africa (Marrakesh, Morocco)
- Workshops, competitions, special sessions, demos and a doctoral consortium have their own later deadlines
