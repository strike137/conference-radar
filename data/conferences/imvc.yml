notes:
- One-day computer vision and AI conference in Tel Aviv for Israeli and international researchers and practitioners; usually yearly, but the site lists no 2022 or 2023 edition
- Organized by SagivTech and Dr. Jacob Cohen; Ortra Ltd. is the contact address
- Lectures are selected from 1 to 3 page descriptions reviewed by industry and academic researchers; four parallel tracks; separate calls for posters and demonstrations
- Held at Pavilion 10, EXPO Tel Aviv in 2025 (14th edition, April 1) and 2026 (15th edition, June 29)
