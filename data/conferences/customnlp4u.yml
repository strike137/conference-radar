notes:
- Workshop on tailoring language models to domains, applications, groups and individuals (personalization, data, modeling, evaluation, privacy and broader impacts)
- First edition at EMNLP 2024 (Miami), second at ACL 2026 (San Diego)
- Long papers up to 8 pages and short papers up to 4 pages in ACL format; double-blind review through OpenReview
- Archival papers go to the ACL Anthology; a non-archival option is also offered (18 papers in the 2026 proceedings, 25 in 2024)
- Not ranked in ICORE2026 and not on the CCF list
