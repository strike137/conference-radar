notes:
- Long-running symposium on cluster, cloud, edge and distributed systems, held annually since 2001, almost always in May
- Sponsored by IEEE Computer Society, IEEE TCSC and ACM; proceedings in the IEEE CS Digital Library and IEEE Xplore
- "Formerly the Symposium on Cluster, Cloud and Grid Computing; 'Grid' was replaced by 'Internet' in the title, acronym kept"
- CORE B, CCF C
- "Acceptance rate: 25% (2025, 55/219); 26.3% (2024, 51/194)"
- 2027 call has seven tracks including systems for AI/ML and systems for LLM applications and agentic AI
- Double-blind review, 10 pages including references in IEEE format; abstract due one week before the paper
- Location rotates worldwide (Bangalore 2023, Philadelphia 2024, Tromso 2025, Sydney 2026, Dallas-Fort Worth 2027)
