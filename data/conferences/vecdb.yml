notes:
- Workshop on vector databases, approximate nearest neighbor search, RAG and embedding models; also invites industry white papers on vector DB systems
- 1st edition with ICML 2025 (Vancouver), 2nd edition with VLDB 2026 (Boston); host conference changes
- Non-archival, so work can be published later elsewhere; papers up to 8 pages in VLDB style, not anonymized, lightweight review on OpenReview
- Poster and oral sessions plus keynotes and a dataset announcement track
- Not listed in CORE ICORE2026 or in the CCF 2026 list
