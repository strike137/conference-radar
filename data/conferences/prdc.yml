notes:
- Dependability and fault-tolerance symposium that grew out of the Pacific Rim International Symposium on Fault-Tolerant
  Systems (1991 edition in Kawasaki); 2025 was the 30th edition
- 'Pacific Rim sibling of DSN, EDCC and LADC in the dependability community; rotates around the Pacific Rim: 2022
  Beijing (hybrid), 2023 Singapore, 2024 Osaka, 2025 Seoul'
- CORE rank dropped from B (CORE2021) to C (CORE2023 and ICORE2026); not in the CCF list
- Regular papers plus industry track, fast abstracts and co-located workshops; proceedings in IEEE Xplore
- Paper deadline in July; in 2025 it was extended several times, finally to Aug 30; conference in October or November
