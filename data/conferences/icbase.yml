id: icbase
name: ICBASE
full_name: International Conference on Big Data & Artificial Intelligence & Software Engineering
type: conference
tier: minor
areas: [data, ai, software]
region: asia-pacific
language: english
frequency: annual
organizer: AEIC (AiScholar, ais.cn) conference service with a host university each year (Northeastern University in 2026)
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 570 USD or 3800 CNY per 4-page paper (2027, regular); 510 USD early bird before 2027-04-20; 540 USD student; 60 USD per extra page; attendee without paper 225 USD
typical:
  deadline_months: [3]
  conference_months: [6, 7]
links:
  website: http://www.icbase.org/
notes:
- Annual since 2020; mostly in China (Chengdu 2020, Zhuhai 2021, online 2022, Nanjing 2023, Wenzhou 2024, Shenyang 2026, Dalian 2027) with 2025 in Malaysia (hosted by Universiti Teknologi Malaysia)
- Run by a commercial conference service (AEIC/AiScholar) with a different host university each year
- Three tracks; big data, artificial intelligence and software engineering
- Proceedings published by IEEE (2025 and 2026 covers on the site; 2020 by IEEE CPS) and indexed in EI Compendex and Scopus
- Presenter (abstract only) and listener registration are also offered
- Not listed in CORE ICORE2026 or the CCF list
