notes:
- Workshop on combining LLMs with knowledge graphs and property graphs for reliable, explainable Web data management (graph RAG, hallucination detection, provenance)
- First edition at The Web Conference 2026, held remotely on June 29, 2026 after the conference was postponed
- Different venue from the IJCAI workshop GLOW (Generalizing from Limited Resources in the Open World)
- Papers appear in The Web Conference 2026 Companion Proceedings (ACM DL); APC may apply under ACM open access
- Papers 4 to 8 pages plus up to 2 pages of references and appendix, non-anonymous submissions
- Selected papers may be invited to a special issue of the World Wide Web journal (Springer)
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
