notes:
- Annual since 2022 and held in Zakopane, Poland
- Sponsored by The Academy of Engineering and Education (AEE), a commercial conference organizer
- 2025 proceedings published in IET Conference Proceedings; 2022 to 2024 proceedings in IEEE Xplore (both linked from the official site)
