notes:
- Workshop co-located with IEEE/IFIP NOMS; first held at NOMS 2026 in Rome
- Topics are agentic AI for network control and management, multi-agent coordination, agentic Internet architecture and protocols, trust and safety
- Full papers up to 6 pages in IEEE format including references; submission via the NOMS JEMS3 system
- Accepted papers must be presented and go into the workshop proceedings and IEEE Xplore
- Half-day workshop with a keynote and four papers in 2026
- Steering committee from Ontario Tech University, KFUPM, Huawei Canada and the University of Bologna
