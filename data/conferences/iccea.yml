  conference_months: [4, 5]
links:
  website: http://www.ic-cea.org/
notes:
- Annual since 2020 and held in China (Kunming 2021, online 2022, Hangzhou 2023 to 2025, Chongqing 2026, Zhengzhou 2027)
- Run by the commercial AEIC (AiScholar) conference service with a different host university each year
- Proceedings published by IEEE in 2024 and 2025 (covers on the site), IEEE CPS in 2021; submitted to EI Compendex and Scopus
- Broad computer engineering scope (software, intelligent systems, image processing, control, networks and security)
- Presenter (abstract only) and listener registration are also offered
- Not to be confused with the civil engineering ICCEA at iccea.org
- Not listed in CORE ICORE2026 or the CCF list
