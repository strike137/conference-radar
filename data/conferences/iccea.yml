organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 570 USD or 3800 CNY per 4 to 6 page paper (2027, regular); 60 USD per extra page; attendee without paper 225 USD
typical:
