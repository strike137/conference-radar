notes:
- Annual symposium of the IPSJ SIG on Entertainment Computing, held since 2003; EC2026 was the 24th edition
- Three tracks; peer-reviewed oral (6 to 10 pages, single-blind), regular oral without review (4 to 10 pages) and
  demo/poster only (2 to 6 pages); every presentation includes a demo or poster
- Papers are published in the IPSJ Digital Library (情報学広場); reviewed papers count as SIG technical reports, so
  extended versions can go to IPSJ journals (non-archival)
- A special EC issue of the Journal of IPSJ is planned for extended papers
- Papers in Japanese; held at a university in late August or early September
- EC2025 was held back to back with ICEC 2025 at the same venue, with an EC international session during ICEC
