notes:
- Flagship conference of ACM SIGMETRICS, the ACM special interest group for computer systems performance evaluation
- Accepted papers appear in the journal POMACS (Proceedings of the ACM on Measurement and Analysis of Computing
  Systems, ACM DL, open access) and are presented at the conference
- Three submission deadlines per year (Summer, Fall, Winter), all 23:59 AoE, each with its own HotCRP site
- Five soft tracks including learning, measurement and applied modeling, systems and theory; topics span networking,
  cloud, ML for systems, queueing theory and performance modeling
- Held jointly with IFIP Performance in some years (Mumbai 2022, Venice 2024)
- Recent hosts are Orlando 2023, Venice 2024, Stony Brook 2025 and Ann Arbor 2026; SIGMETRICS 2027 is part of ACM FCRC
  in Atlanta
- CORE A*, CCF B (architecture, parallel and distributed computing, storage category)
