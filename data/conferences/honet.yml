id: honet
name: IEEE HONET
full_name: "IEEE International Conference on Smart Communities: Improving Quality of Life Using AI, Robotics and IoT"
type: conference
tier: minor
areas: [networking, communications, ai, general]
region: worldwide
language: english
frequency: annual
organizer: HONET steering committee (UNC Charlotte) with host institutions and IEEE sections
organizer_country: [usa]
proceedings: IEEE Xplore
archival: true
fee: "350 USD professionals (300 USD IEEE/Optica/SPIE members), 250 USD students (2026)"
typical:
  deadline_months: [8, 10]
  conference_months: [12]
links:
  website: https://honet-ict.org/
notes:
- Originally High Capacity Optical Networks and Emerging/Enabling Technologies; now themed on ICT for smart communities and cities
- Broad scope covering AI and IoT, robotics, computer and communication networks, network security, energy, photonics and signal processing
- Steering committee led by M. Yasin Akhtar Raja (UNC Charlotte) with members from GIK Institute (Pakistan) and Qatar
- Rotates between the USA, Pakistan, the Middle East and Northern Cyprus (Charlotte 2020, Karachi 2021, Marietta 2022, Boca Raton 2023, Doha 2024, Topi 2025)
- Accepted and presented papers go to IEEE Xplore; full papers 4 to 6 pages, short papers 3 pages; submission via EDAS
- Expanded versions of selected papers are published in the Signal, Image and Video Processing journal
- Accepts post-deadline submissions with delayed decisions
- Not listed in ICORE2026 or the CCF 2026 list; a small venue
