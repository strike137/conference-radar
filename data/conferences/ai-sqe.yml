notes:
- One-day ICSE workshop on using LLMs and agents to judge and measure software quality (LLM as judge, metrics, benchmarks)
- 2026 was the 1st edition, held at ICSE 2026 in Rio de Janeiro
- 2026 organizers from Bar Ilan University and IBM Research (Israel)
- Research papers up to 8 pages plus references and extended abstracts up to 5 pages, ACM format, single-blind review by at least three PC members
- 2026 papers published in the ACM Digital Library; extended abstracts are APC free
- Not on the ICSE 2027 workshop list, so the next edition is not announced yet
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
