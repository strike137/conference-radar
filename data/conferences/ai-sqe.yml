notes:
- One-day ICSE workshop on LLMs and agents as evaluators of software quality (LLM-as-a-Judge, metrics, benchmarks)
- 1st edition at ICSE 2026 in Rio de Janeiro
- Organized by Onn Shehory (Bar-Ilan University), Eitan Farchi and Shmulik Froimovich (IBM Research, Israel)
- Research papers up to 8 pages plus references and extended abstracts up to 5 pages, ACM format, at least three reviewers per paper
- Accepted papers published in the ACM Digital Library; extended abstracts are APC free
- Not on the ICSE 2027 workshop list, so the next edition is not announced yet
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
