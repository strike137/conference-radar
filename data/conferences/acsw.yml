notes:
- Annual umbrella event of the Australian and New Zealand computing community since 1978, held in late January or
  February
- 'Hosts several co-located conferences with separate CFPs: ACE (education), AISC (information security), AusPDC
  (parallel/distributed), ALIS (AI), ITCSREC'
- ACSW itself is not ranked; in ICORE2026 ACE is Australasian B and AISC and AusPDC are Australasian C
- Papers published in the ACM Digital Library (ICPS); under ACM's open access model, authors from institutions outside
  ACM Open may have to pay an APC
- AISC 2027 has two submission rounds (Sep and Nov 2026); the 2027 edition at ANU Canberra marks the 50th ACSW
