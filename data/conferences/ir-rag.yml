notes:
- Workshop on the retrieval component of retrieval-augmented generation (RAG) systems
- Held at SIGIR 2024 (Washington D.C., July 18, 2024) and SIGIR 2025 (Padua, July 17, 2025)
- Proceedings in CEUR-WS (Vol-3784 for 2024, Vol-4199 for 2025); authors may opt out of publication
- Short papers up to 4 pages and full papers up to 9 pages in ACM SIG format; double-blind review; arXiv preprints allowed
- At least one author per accepted paper must register and present
- Not on the SIGIR 2026 accepted-workshops page; no 2026 edition announced
- Not ranked in ICORE2026 and not on the CCF list
