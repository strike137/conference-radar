notes:
- Run by @WAS (Web Applications Society) and co-located with iiWAS every December
- Proceedings in Springer LNCS (full papers 15 pages, short papers 6 pages, including references); older editions are in the ACM DL
- Selected papers are invited to journal special issues after extension
- In-person only, no hybrid option; every accepted paper must be presented by an author
- Recent locations Bali (2023), Bratislava (2024), Matsue (2025), Bangkok (2026)
- Regarded as a minor venue (CORE C); not in the CCF list
- Formerly titled Advances in Mobile Computing and Multimedia (renamed Multimedia Intelligence from 2021)
