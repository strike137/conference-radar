notes:
- Held annually in China since 2018 (Hangzhou, Jinan, Qingdao, Zibo, Qingdao, Qingdao, Hangzhou, Nanchang); no edition in 2025
- Proceedings in the ACM Digital Library for 2018 to 2024 per the official publication page; 2026 proceedings also published by ACM
- Moved from September (2019 to 2024) to May (2026, 2027)
- Papers 4 to 12 pages; abstract-only presentation without publication also offered
- Seven tracks covering big data infrastructure, acquisition, storage, analytics, AI fusion, security and privacy, and applications
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
