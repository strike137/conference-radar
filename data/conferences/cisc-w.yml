archival: false
rank:
  core: Unranked
fee: 400,000 KRW regular member, 300,000 KRW full-time graduate student member (2026, pre-registration)
typical:
  deadline_months: [9, 10, 11]
  conference_months: [10, 11]
links:
  website: https://www.cisc.or.kr/
notes:
- Organized by KIISC (Korea Institute of Information Security and Cryptology); domestic conference, author names
  and affiliations must be entered in Korean
- Short papers of 3-4 pages submitted via EasyChair; at least 2 reviewers per paper; review decides oral or poster;
  high school papers not accepted
- Best papers receive awards and are recommended to the Journal of the KIISC (KCI-listed)
- Held in late November at Konjiam Resort (2024, 2025); the 2026 edition moved earlier to late October in Yeosu
- Deadlines are routinely extended (Nov 5 final in 2024, Oct 24 -> Oct 29 in 2025, Sep 11 -> Sep 23 in 2026); one
  author per paper must pre-register
