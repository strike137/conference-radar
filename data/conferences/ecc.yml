notes:
- Flagship conference of the European Control Association (EUCA); technically co-sponsored by IFAC and IEEE Control
  Systems Society
- First held in Grenoble in 1991, biennial until 2011 and annual since 2013; ECC 2027 is the 25th edition
- Held in a different European city each year (2023 Bucharest, 2024 Stockholm, 2025 Thessaloniki, 2026 Reykjavik,
  2027 Brussels)
- Papers up to 8 pages for review, 6 pages final with up to 2 extra pages for a fee; submission via PaperCept
- Accepted papers are published in IEEE Xplore; preprints on arXiv were explicitly allowed in 2026
- Industry abstracts and late breaking results are presented but not included in the proceedings
- Not listed in ICORE2026 (control venue outside the CORE computing list)
