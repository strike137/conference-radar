notes:
- Annual national meeting of the Virtual Reality Society of Japan (VR, haptics, AR, HCI, VR art), held every September
  since 1996; 2026 was the 31st meeting
- Presentation application in June, then a 2 to 4 page manuscript (A4, two columns, Japanese or English) in July
- Oral presentations are a 2.5 minute talk plus a 60 minute poster session; technical and art exhibitions are a
  separate track with an exhibition fee
- 'Speakers must be VRSJ members and register; each additional presentation costs 8,000 JPY (2026)'
- Papers go into an electronic proceedings published on the site a few days before the meeting; abstracts are public
  without a password, and copyright goes to VRSJ
- No acceptance review is described on the call; Academic Encouragement Awards go to presenters aged 35 or under
- Held at a different Japanese university or convention center each year (Tokyo 2023, Nagoya 2024, Osaka 2025, Toyama
  2026)
