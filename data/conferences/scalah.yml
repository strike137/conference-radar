notes:
- Long-running workshop on scalable numerical algorithms for large-scale and heterogeneous HPC systems, held with SC (17th edition in 2026)
- Accepted papers appear in the SC workshop proceedings (ACM DL for SC25, SC26-W for 2026)
- Papers 4 to 8 pages including references in two-column IEEE format, single-blind review by at least three PC members, submitted via the SC submission system
- Firm deadlines with no extensions
- Chairs include Vassil Alexandrov (STFC Hartree Centre) and Jack Dongarra (University of Tennessee); program chair Christian Engelmann (ORNL)
- Held with SC in the USA every year (St. Louis 2025, Chicago 2026)
- Not listed in the CORE ICORE2026 portal or on the CCF list
