links:
  website: https://spelll.org/
notes:
- Speech and language technology for low-resource and minority languages; tracks on language resources, language technologies, speech technologies, vision and NLP, and NLP applications
- Proceedings in Springer CCIS; submissions in the Springer template, double-blind review on OpenReview
- Held in India every year at a different host (SSN College of Engineering 2022, Kongu Engineering College 2023, VIT Chennai 2024, IIIT Kottayam 2025, Amrita Vishwa Vidyapeetham Coimbatore 2026)
- SPELLL 2025 was hybrid
- Not listed in ICORE2026 or the CCF 2026 list
