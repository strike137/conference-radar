id: rlan
name: RLAN
full_name: International Workshop on Reinforcement Learning Applied to Networking
type: workshop
tier: minor
areas: [ai, networking]
region: europe
language: english
frequency: annual
organizer: José Santos (Ghent University - imec) and Guillaume Fraysse (Orange Research), general co-chairs in 2026
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [8, 9]
  conference_months: [10]
links:
  website: https://sites.google.com/view/rlan2026/
notes:
- Half-day workshop co-located with CNSM (Bologna 2025, Alcala de Henares (Madrid) 2026)
- Started in 2025; 2nd edition in 2026
- Topics are reinforcement learning for network service management and orchestration, resource allocation, traffic engineering and network security
- Workshop papers up to 6 pages including references; submission via EDAS
- Presented workshop papers appear in the CNSM proceedings on IEEE Xplore
- 2026 program had a keynote and four papers
- Not listed in CORE ICORE2026 or the CCF list
