notes:
- Community-led one-day hacker conference in Brisbane for South-East Queensland and beyond; the 2025 edition
  (CrikeyCon X) was the 10th
- Talks and demonstrations by professionals and enthusiasts in an informal style, plus a beginner-friendly CTF and
  villages (physical access control, Meshtastic CTF in 2025)
- Held on a Saturday at the Royal International Convention Centre, Bowen Hills; tickets via Humanitix
- Excess profits go to local charities (over 200,000 AUD donated so far); 18+ event
