notes:
- One-day Western Australian security day conference of AISA, run and hosted by WA members for the local cyber
  security community
- 2026 edition at The Westin Perth with the theme "Year of the Fire Horse, Cyber and Quantum Readiness"
- Call for speakers reviewed by the Western Australian Program Committee; submissions must be vendor neutral and
  product or vendor pitches are disqualified
- All sessions are 40 minutes, either a session with up to two presenters, a moderated panel or an interactive
  session; talks only, no papers or proceedings
- AISA does not fund speaker travel or accommodation
