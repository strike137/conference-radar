id: dataengbytes
name: DataEngBytes
full_name: DataEngBytes Data Engineering Conference
type: industry
tier: minor
areas: [data]
region: oceania
language: english
frequency: multiple-per-year
organizer: DataEngBytes (independent data engineering community)
organizer_country: [australia]
proceedings: None (talks only, no papers)
archival: false
fee: From 140 to 350 AUD (2027, one-day tickets depending on city and tier; Auckland 170 to 220 NZD)
typical:
  conference_months: [3, 5, 7, 10]
links:
  website: https://www.dataengbytes.com/
notes:
- Practitioner conference run by DataEngBytes, which calls itself the largest independent data engineering community in Oceania
- Held as a yearly tour of one-day or two-day events in several Australian cities plus Auckland
- 2026 tour covered Brisbane, Auckland, Melbourne and Sydney; 2027 tour adds Perth and Adelaide (six one-day events)
- Talk submissions through an online form; city calls open at different times of the year
- No papers or proceedings
- Not listed in CORE ICORE2026
