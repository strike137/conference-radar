notes:
- Satellite workshop of CSBC, the annual congress of the Brazilian Computer Society (SBC); 17th edition in 2026,
  held since 2009
- Topics include digital agriculture, biodiversity, environmental monitoring, remote sensing, natural disasters,
  deforestation and fires, and sustainability
- Full papers 8 to 10 pages; expanded abstracts and dataset papers 4 pages; SBC template, submitted via JEMS
- Papers in Portuguese or English; double-blind review
- Proceedings (Anais do WCAMA, ISSN 2595-6124) published open access in SBC OpenLib (SOL) with a DOI per paper
- Held with CSBC in a different Brazilian city each year (Gramado 2026)
- Not listed in CORE ICORE2026
