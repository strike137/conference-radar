notes:
- NLP and LLMs for Indo-Aryan and Dravidian languages (corpora, machine translation, speech, dialect identification,
  misinformation and hate speech detection)
- First edition co-located with COLING 2025 in Abu Dhabi on 2025-01-20; also ran a shared task
- Proceedings in the ACL Anthology (2025.indonlp-1)
- Long papers 8 pages, short papers 4 pages in ACL format, double-blind with two reviewers per paper; submission via SoftConf
- Organized mainly from Sri Lanka and the UK
- Not ranked in ICORE2026 and not on the CCF list
