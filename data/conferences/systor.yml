notes:
- Israeli systems and storage conference, started at IBM Research Haifa in 2007; ACM proceedings, open access
- Full papers up to 12 pages and short papers up to 5 pages (excluding references), double-blind review; posters
  with a one-page extended abstract in the proceedings
- Main conference virtual since 2024 (free registration) with an in-person Israeli Systems and AI (ISAI)
  workshop in Israel; held in person at the Technion in Haifa in 2023
- "CCF C; CORE ICORE2026 rank: National: Israel"
