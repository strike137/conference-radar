notes:
- Part of the Acadia University (Canada) conference series run by Elhadi Shakshuki, alongside ANT, EUSPN and MobiSPC
- Held together with MobiSPC (Mobile Systems and Pervasive Computing) and SEIT (Sustainable Energy Information Technology)
- Accepted papers appear in Elsevier Procedia Computer Science (open access), indexed in Scopus, EI and DBLP
- Papers up to 8 pages including references, Procedia format, submission via EasyChair
- Location alternates between Europe and North America (Leuven, Niagara Falls, Halifax, Huntington WV, Athens, Istanbul in 2027)
- Submission deadline is usually extended once or twice before a firm deadline
- Unranked in ICORE2026; not on the CCF list
