notes:
- Social computing and networking conference; 19th edition in 2026
- Runs inside the IEEE AI for Science Congress with ISPA, BDCloud, SustainCom and SpaCCS; until 2023 the papers
  appeared in joint ISPA/BDCloud/SocialCom/SustainCom proceedings, since 2024 in its own IEEE volume
- Recent editions in New York (2021), Melbourne (2022), Wuhan (2023), Kaifeng (2024), Shenyang (2025) and Kuala
  Lumpur (2026)
- Four tracks (systems, data and analysis, applications, technology and security) including privacy and trust in
  social contexts
- Not ranked by CORE (ICORE2026) or CCF; deadlines are usually extended by two to three weeks
