notes:
- Wollongong edition of the worldwide community DevOpsDays series, run by a local volunteer team as a not-for-profit event
- First held in November 2025 at Novotel Wollongong Northbeach, NSW; earlier Australian DevOpsDays ran in 2010, 2011, 2013 to 2016 and 2019
- Two days with featured talks in the mornings and Open Space sessions in the afternoons
- Topics include generative AI, security, culture, infrastructure as code and observability
- Talk proposals (keynotes, 30 min talks, Ignite talks) through PaperCall; no papers or proceedings
