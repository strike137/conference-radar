notes:
- Run by the Coordinated Science Laboratory of the University of Illinois Urbana-Champaign; strong in information
  theory, communications and control
- Held every September in Illinois (Allerton Park, Monticello, until 2023; NCSA on the UIUC campus in Urbana from 2024)
- Regular papers up to 8 pages in two-column IEEE format; invited speakers submit an abstract, full paper optional
- Proceedings moved from IEEE Xplore (up to the 60th edition in 2024) to the University of Illinois IDEALS repository
  from 2025, as in the first 40 years of the conference
- Not listed in ICORE2026; well regarded in information theory despite having no CORE rank
