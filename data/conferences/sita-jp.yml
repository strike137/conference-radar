links:
  website: https://www.ieice.org/ess/sita/SITA2026/
notes:
- Organized by the IEICE ESS SITA Subsociety (formed in 2011 as successor of the SITA society founded in 1978),
  which also runs the international ISITA
- Annual residential symposium at a hot-spring venue in Japan, late November or December (2025 Bandai-Atami Onsen,
  2026 Dogo Onsen)
- Talks mostly in Japanese; manuscripts up to 6 pages in Japanese or English, screened for scope rather than fully
  peer reviewed
- Proceedings are an IEICE publication distributed online to participants about one week before; not submitted to
  IEEE Xplore
- Covers Shannon theory, coding, communications, information security, quantum information and machine learning
  theory; 2025 had 116 talks and 18 posters; IEEJ, IPSJ, ITE, IEIJ and IEIE (Korea) members pay the member rate
