notes:
- Workshop on combining knowledge graphs and LLMs (KG engineering with LLMs, KGs for LLMs, KG-RAG, applications)
- 1st edition KaLLM 2024 with ACL 2024 in Bangkok; 2026 edition (titled KG & LLM) with LREC 2026 in Palma de Mallorca
- The ACL Anthology lists both under the KaLLM venue; the 2026 edition had a different organizing team
- Papers up to 8 pages plus references, LREC style, double-blind review via START
- "Acceptance rate: 61% (2026, 21 of 36 submissions after 2 desk rejects)"
- Not listed in CORE ICORE2026
