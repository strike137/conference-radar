notes:
- Sponsored by the Sichuan Province Computer Federation with Chengdu universities (Sichuan University, UESTC,
  Southwest Jiaotong University and others) as patrons
- Held in Chengdu, China every year since 2018, always in late May
- Proceedings of every edition (2018 to 2026) are in IEEE Xplore; the site says they are indexed by EI Compendex and
  Scopus 3 to 4 months after the conference
- Submission via EasyChair; tracks include AI-empowered cybersecurity and privacy-preserving computing
