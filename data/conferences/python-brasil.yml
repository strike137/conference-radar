notes:
- Largest Python community conference in Brazil and Latin America, run by volunteers with support from APyB (Brazilian Python Association)
- Hosted by a different local community each year; Sao Paulo in 2025, Florianopolis in 2026
- Main language is Portuguese; the site is also in English and Spanish
- Tutorials (3.5 or 7 hours), 45 minute talks and sprints chosen from one call for proposals run on pretalx
- Talks and tutorials are rated by the community of submitters, then selected by the organizers; at most one accepted activity of each type per person
- Early acceptance round for about 25% of the program before the call closes
- Program is streamed online; no papers or proceedings
