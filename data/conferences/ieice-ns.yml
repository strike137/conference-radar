id: ieice-ns
name: IEICE NS
full_name: IEICE Technical Committee on Network Systems (NS)
name_local: 電子情報通信学会 ネットワークシステム研究会
type: meeting
tier: domestic
areas: [networking, communications]
region: japan
language: japanese
frequency: multiple-per-year
organizer: IEICE Communications Society, Technical Committee on Network Systems
proceedings: IEICE Technical Report (non-refereed)
archival: false
rank:
  core: Unranked
fee: Presentation fee 3,300 JPY per talk for IEICE members (2026); audience fee from 3,300 JPY for members (1-day
  meeting, advance; 5,500 JPY for 2-day meetings); student members attend free via annual registration (up to 3
  committees)
typical:
  deadline_months: [1, 2, 3, 4, 5, 7, 8, 9, 10, 11]
  conference_months: [1, 3, 4, 5, 6, 7, 9, 10, 11, 12]
links:
  website: https://www.ieice.org/cs/ns/jpn/
notes:
- 'Very active network committee: about ten meetings a year, each with a fixed theme (protocols, photonic networks,
  architecture, network quality and management, wireless and ad hoc networks, network software)'
- 'Many meetings are joint: September with IN, CS and NV; November with ICM; December with RCS; March with IN (Okinawa
  in 2026 and 2027, with the IN/NS research workshop)'
- Hybrid format (on site primary, online secondary) is standard; the application deadline is roughly 7 to 9 weeks
  before each meeting
- October meeting has a first-timer session for presenters aged 30 or under (one-page abstract); talks are published
  as non-refereed IEICE Technical Reports
