notes:
- Sponsored by the IEEE Computer Society, supported by the Technical Committees on Computer Architecture (TCCA) and Microarchitecture (TCuARCH); held annually since 2000
- Focus on performance analysis, measurement, simulation and modelling of computer systems and software
- Research papers plus tool and benchmark papers; double-blind; 9 pages plus unlimited references
- Optional artifact evaluation with IEEE reproducibility badges; poster track with extended abstracts
- Rotates worldwide (Singapore 2022, Raleigh 2023, Indianapolis 2024, Ghent 2025, Seoul 2026, New York 2027)
- CORE B (ICORE2026), CCF C
