notes:
- Not to be confused with IEEE ICBC (IEEE International Conference on Blockchain and Cryptocurrency); this one is run by the Services Society
- One of ten co-located conferences of SCF run by the Services Society, a US-registered nonprofit (siblings include ICWS, SCC, BigData, ICIOT and CLOUD)
- Proceedings in Springer LNCS; research and application/industry tracks up to 15 pages, short papers up to 8 pages
- Each submission reviewed by at least three program committee members; submission via EDAS
- Several submission rounds (early bird, regular, special track) in one cycle
- Established in 2018; covers distributed ledgers, consensus, smart contracts, cryptographic trust, decentralized identity, interoperability and governance
- 'Recent hosts: Seattle (2018), San Diego (2019), virtual (2020, 2021), Hawaii (2022, 2023), Bangkok (2024), Hong Kong (2025), Kuala Lumpur (2026)'
- 2026 theme was Agentic AI as a Service for Blockchain
- Not listed in ICORE2026 (the CORE ICBC entry, rank C, is the IEEE conference); not on the CCF 2026 list
