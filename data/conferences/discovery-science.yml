notes:
- Long-running machine learning and data mining venue focused on AI for scientific discovery; 28th edition in 2025
- Held in Europe in recent editions (2022 Montpellier, 2023 Porto, 2024 Pisa, 2025 Ljubljana)
- Springer LNCS proceedings; 15 pages in LNCS format, single-blind review via Microsoft CMT
- Selected and extended papers can go to a special issue of the Springer Machine Learning journal
- 2025 edition was part of the AI for Science umbrella event with co-located one-day workshops
- ICORE2026 rank B
