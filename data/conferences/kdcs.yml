notes:
- Run by the Korea Digital Contents Society, which also publishes the Journal of Digital Contents Society (JDCS)
- Two general conferences per year (summer and fall), each combined with an undergraduate paper contest
- Short papers of 1 to 2 pages in a two-column format, submitted through the society site; oral and poster sessions
- Acceptance notices go out on a rolling basis while the submission window is still open
- Topics cover digital content, immersive media, generative AI and agents, AI+X and ICT applications
- Summer 2026 was held in Jeju with a Zoom link for remote sessions; fall 2026 is at Suwon Convention Center
- Proceedings are a participant download only; not listed in the CORE ICORE2026 portal
