notes:
- Small long-running conference (since 2004) on decision making, aggregation functions, information fusion, machine
  learning, data privacy and information security
- Program co-chaired by Vicenc Torra (Umea University) and Yasuo Narukawa (Tamagawa University) with the local host
- Mostly held in Spain or Sweden, occasionally in Japan (Tokyo 2024)
- Main proceedings in Springer LNAI; papers not accepted for LNAI may go into a separate USB/ISBN proceedings, which
  also accepts direct submissions with a later deadline
- Submission is by e-mail as a PDF, LNCS format, at most 12 pages; at least two reviewers per paper
- 2026 had two LNAI submission rounds (March and May)
- One registration covers at most two papers
