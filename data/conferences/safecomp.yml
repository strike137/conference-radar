language: english
frequency: annual
organizer: EWICS TC7 (European Workshop on Industrial Computer Systems, Technical Committee 7 on Reliability, Safety
  and Security)
organizer_country: [europe]
proceedings: Springer LNCS (main track volume and a separate workshop volume)
archival: true
rank:
