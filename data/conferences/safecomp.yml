notes:
- Long-running European conference on safety, reliability and security of computer-based and safety-critical systems,
  established by EWICS TC7 in 1979 (45th edition in 2026)
- Main track and workshop papers published by Springer in LNCS (two volumes)
- Research papers and practical experience reports or tool descriptions, up to 14 pages in LNCS format; single-blind
  review by at least three PC members
- Single track; workshop day before the three-day main conference; also a position paper track
- Held in Europe every September (Toulouse 2023, Florence 2024, Stockholm 2025, Valencia 2026)
- CORE B (ICORE2026); not on the CCF list
