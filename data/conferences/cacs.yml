notes:
- Annual international conference of the Chinese Automatic Control Society (CACS) in Taiwan, hosted by a different Taiwanese university each year
- Held in Taiwan every year (2022 Kaohsiung, 2023 Penghu, 2024 Taoyuan, 2025 Hsinchu, 2026 Taichung)
- Automatic control, robotics, automation, AI and smart vehicles; many organized special sessions (35 in 2026)
- Regular papers of 6 pages (up to 8 with extra page fees) go to IEEE Xplore and EI if the authors opt in; one-page presentation-only papers appear in the conference proceedings only
- Submission deadline is usually extended several times; held together with the NSTC control program results meeting
- Each accepted paper needs a regular registration; not listed in CORE ICORE2026 or the CCF list
