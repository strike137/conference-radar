notes:
- ACM conference on technology, data and interdisciplinary approaches for social good and the UN Sustainable
  Development Goals; 6th edition in 2026
- Accepted papers are included in the ACM Digital Library; at least one author must present in person, no remote
  presentation
- Single-blind review with three reviews per paper; full papers plus work-in-progress papers and special tracks
- Held in Europe every September (Rome 2021, Limassol 2022, Lisbon 2023, Bremen 2024, Antwerp 2025, Pisa 2026)
- Paper deadline was extended twice in 2026 (17 May -> 7 Jun -> 14 Jun)
- Selected papers invited to special issues of Elsevier FGCS and ACM TOIT (2026)
- Not found in the ICORE2026 CORE portal search and not on the CCF 2026 list
fee: About 700 EUR (2026, early, non-member author); 400 EUR students
