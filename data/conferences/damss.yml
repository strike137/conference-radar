notes:
- Annual meeting of the Lithuanian computer science community, held every year at the same venue in Druskininkai, Lithuania, in late November or early December
- Called an international workshop up to 2019, a conference since 2021; DAMSS 2025 was the 16th edition with 90 presentations from nine countries
- Participants submit an abstract with online registration; abstracts appear in the Vilnius University Proceedings volume (ISBN, DOI)
- Speakers are invited to submit full papers to a special issue of the Baltic Journal of Modern Computing after the event
- Registration is capped at about 120 participants and may close early
