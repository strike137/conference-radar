notes:
- Started in Paris in 2012 as the Advanced Electromagnetics Symposium; renamed International Conference on Antennas and Electromagnetic Systems from 2022
- Held around the Mediterranean (Marrakesh 2022, Torremolinos 2023, Rome 2024, Tangier 2025, Catania 2026, Athens 2027); no editions in 2015, 2020 or 2021
- Scope covers antennas and propagation, computational electromagnetics, metamaterials and metasurfaces, photonics and plasmonics, and RF, microwave and THz systems
- Contributed papers are 2 to 4 pages (extended abstract or full contribution), reviewed by the TPC; the reviewed paper is the published one, with no separate camera-ready
- Proceedings are one open-access PDF volume per edition published by the organizers, indexed in Scopus
- At least one author must register and present; one registration covers at most two papers
- Physics and EE venue outside the usual CS rankings, not listed in ICORE2026
