notes:
- Long-running series on model-based diagnosis; the 37th edition was held in 2026
- Formerly the International Workshop on Principles of Diagnosis; now a conference, with its scope widened to resilience in 2024
- CORE C under its former name International Workshop on Principles of Diagnosis
- Open access proceedings in the Dagstuhl OASIcs series (DX 2026 -> OASIcs volume 148)
- Runs a diagnosis competition (DXC) alongside the conference
- DX 2027 (38th) announced for Linkoping, Sweden
