notes:
- Formerly the International Workshop on Principles of Diagnosis (DX); became a
  conference in 2024 and widened its scope to resilient systems
- 37th edition in 2026; model-based and data-driven diagnosis, anomaly detection, prognosis, fault-tolerant
  control and resilient design
- Open access proceedings in the Dagstuhl OASIcs series (DX 2026 is OASIcs volume 148)
- Rated C in ICORE2026 (listed under its old name International Workshop on Principles of Diagnosis); not on
  the CCF list
- Full papers up to 20 pages, short papers up to 14 pages, doctoral consortium up to 16 pages, encore abstracts
  up to 6 pages, industry papers up to 12 pages, all including references; single-blind review via EasyChair
- In-person attendance required for at least one author per paper; one registration covers one paper
- Hosts the DX Competition (DXC) on diagnosis benchmarks; 2026 was co-located with the TIME symposium
- Rotates between Europe and North America (Loma Mar 2023, Vienna 2024, Nashville 2025, Cork 2026,
  Linkoping 2027)
