notes:
- Korean community-run reverse engineering and security conference, held since 2007 by the CodeEngn group of
  practitioners on a small, non-commercial budget
- Half-day Saturday event (14:00 to 18:00) in Seoul, usually in July; 2025 and 2026 held at the Korea Federation
  of Banks conference hall in Myeong-dong
- Talks in Korean on reverse engineering, vulnerability research, malware analysis, system and network security
  and AI security; about five sessions per edition
- Talk proposals through a call for papers on the official site; no papers, slides are posted on GitHub and
  videos on YouTube
- Very low registration fee, accessible to students
