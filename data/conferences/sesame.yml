notes:
- Serverless computing workshop co-located with EuroSys since 2023 (Rome 2023, Athens 2024, Rotterdam 2025 with ASPLOS, Edinburgh 2026)
- Scope widened to serverless GenAI and LLM inference serving from 2025
- Short papers of up to 6 pages go into the ACM Digital Library (authors may opt out); 2-page work-in-progress abstracts are not published
- Double-blind review; in-person only, at least one author must attend
- Not listed in CORE ICORE2026 or the CCF list
