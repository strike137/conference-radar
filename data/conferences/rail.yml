notes:
- Workshop on language resources, NLP and speech tools for African indigenous languages, run by SADiLaR (South Africa)
- Co-located with a different host each year (EACL 2023 Dubrovnik, LREC-COLING 2024 Turin, DHASA 2025 Pretoria, LREC 2026 Palma)
- Proceedings in the ACL Anthology for editions held with EACL or LREC (2026 volume published by ELRA)
- Editions held with DHASA in South Africa (2021, 2025) and the 2022 Potchefstroom edition publish accepted papers in JDHASA, the Journal of the Digital Humanities Association of Southern Africa
- 2026 used double-blind review with at least three reviews; 4 to 8 page papers, oral presentations only
- The 2025 DHASA edition used fully open peer review
- 2026 edition was a half-day workshop with 13 of 20 submissions accepted
- Not ranked in ICORE2026 and not on the CCF list
