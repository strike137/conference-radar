notes:
- 'Umbrella event of several international workshops held together with the JSAI annual conference (2026: JURISIN,
  SCIDOCA, AI-Biz; 2025 also had an AI Security and Privacy workshop)'
- Proceedings in Springer LNAI (New Frontiers in Artificial Intelligence); published as proceedings since 2024,
  as post-proceedings until 2023
- Paper deadlines are set by each workshop; the suggested common deadline is late January
- JSAI annual conference registrants can present at isAI without an extra fee; the 2027 chair is Shogo Okada (JAIST)
