notes:
- Workshop on agentic AI (LLM agents, embodied AI, reinforcement learning) for wireless networks, co-located with IEEE GLOBECOM
- 1st edition at GLOBECOM 2025 (Taipei), 2nd at GLOBECOM 2026 (Macau)
- 2026 co-chairs are Yinqiu Liu, Rui Meng, Rahim Tafazolli, Sinem Coleri, Dong In Kim and Dusit Niyato
- Workshop papers go into the GLOBECOM proceedings and IEEE Xplore; no-show papers are removed
- Not listed in ICORE2026 or in the CCF 2026 list
