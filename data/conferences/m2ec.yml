notes:
- Workshop of AINA since 2019; follows the AINA host city (Wellington 2026, Tirana 2027)
- Run by Thomas Dreibholz (SimulaMet) and Feroz Zahid from the Norwegian NorNet testbed group
- Full papers up to 12(+2) pages in Springer lecture notes format via EDAS, at least three reviewers each; poster session for work in progress
- Workshop page says proceedings are in the Springer series Advances in Intelligent Systems and Computing, submitted to EI, DBLP and Scopus
- Small workshop with four papers in 2026
