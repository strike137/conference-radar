frequency: multiple-per-year
organizer: Organizing team led by HKUST (Anyi Rao) with Adobe, Google and others
organizer_country: [international]
proceedings: CVF Open Access and IEEE Xplore (CVPR Workshops); ACM (SIGGRAPH Asia proceedings) for SIGGRAPH Asia editions
archival: true
typical:
