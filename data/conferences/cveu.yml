  conference_months: [6, 12]
links:
  website: https://cveu.github.io/
notes:
- Workshop on generative AI for visual content creation, editing and understanding (film, video, storytelling)
- Held with ICCV 2021, ECCV 2022, ICCV 2023, CVPR 2024, CVPR 2025 and CVPR 2026, plus courses at SIGGRAPH
- In-proceedings track (8 pages, double-blind, CVPR template) goes into the CVPR workshop proceedings; extended
  abstract track (4 pages) is non-archival
- 17 papers on CVF Open Access for CVPR 2026, 15 for CVPR 2025
- SIGGRAPH Asia 2026 edition runs as AI Film Frontiers (AIFF), a film challenge with 3-page technical reports
  published in the SIGGRAPH Asia 2026 proceedings
- Not listed in ICORE2026 or the CCF list
