notes:
- Annual US meeting on high-assurance, formally verified software and systems for safety- and security-critical use, run since 2001
- Sponsored by the National Security Agency and organized by Vanderbilt University; site hosted on the Science of Security virtual organization (SoS-VO)
- Program of invited speakers, panels and a technical track; the call asks for a one-page talk abstract (or a nomination), not a paper
- No formal proceedings; abstracts of accepted talks and slides go on the HCSS website
- Held in Annapolis, Maryland in 2026 and planned there again for 2027
- Not listed in ICORE2026 or the CCF 2026 list
