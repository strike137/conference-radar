notes:
- Workshop on AI and mathematical reasoning (theorem proving, math benchmarks, LLM reasoning, math education)
- First held at ICLR 2021, then with NeurIPS every year from 2022 to 2026; each edition has its own site (mathai20XX.github.io, mathai-2026.github.io for 2026)
- Non-archival, accepted papers are shown on the workshop homepage; papers under review elsewhere are allowed
- Papers up to 4 pages plus references and appendices; double-blind review on OpenReview
- 2026 uses reciprocal reviewing (one author per submission must review) and focuses on agentic AI for mathematical research
- Not listed in ICORE2026 and not on the CCF list
