notes:
- Workshop on hybrid (neuro-symbolic, cognition-informed) AI for user modeling, personalization and recommender systems
- 1st edition (HyPer, Hybrid AI for Human-Centric Personalization) at ACM UMAP 2025 in New York, papers in the ACM DL (UMAP Adjunct Proceedings)
- 2nd edition at ACM CIKM 2026 in Rome; scope widened to recommendation; papers in the joint CEUR-WS workshop volume
- Full papers up to 12 pages, short and position papers up to 6 pages (excluding references), CEUR-WS template, single-blind review via EasyChair
- 2026 submission deadline was extended from 24 August to 7 September 2026
- Not listed in CORE ICORE2026 or the CCF 2026 list
