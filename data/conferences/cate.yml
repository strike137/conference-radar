notes:
- Full-day workshop affiliated with Asiacrypt 2026 (IACR), first edition in 2026
- Covers cryptographic methods for the whole AI pipeline (private training and inference, provenance, watermarking, verifiable unlearning, agent and API accountability)
- Call for presentations and posters, not papers; submit slides, a published paper, a work in progress summary or a talk abstract of up to 3 pages
- Published work and work in progress are both welcome
- 'Non-archival: no formal proceedings'
- Program of invited talks, four to six contributed short talks, a possible poster session and a panel
- At least one author of each accepted talk or poster must register
