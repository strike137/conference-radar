id: venits
name: VENITS
full_name: International Workshop on Vehicular Networking and Intelligent Transportation Systems
type: workshop
tier: minor
areas: [networking, communications]
region: worldwide
language: english
frequency: irregular
organizer: Carlos T. Calafate (Universitat Politecnica de Valencia) and Francisco J. Martinez (University of Zaragoza)
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [3, 4]
  conference_months: [7, 8]
links:
  website: https://grc.webs.upv.es/events/VENITS/2025/
notes:
- Workshop co-located with a different IEEE conference each edition; 7th edition in 2025
- Hosts so far include PIMRC 2016, ICCCN 2017, GLOBECOM 2018, ICCCN 2020, ICDCS 2023 and ICCCN 2025
- Run by the same two Spanish organizers (UPV and University of Zaragoza) since the start
- Topics are V2X and vehicular networking, ITS, autonomous and aerial vehicles, AI for traffic management and vehicular security
- "2025: 6-page IEEE papers via EDAS, published in the ICCCN proceedings and IEEE Xplore; one author must register at the full rate"
- Not held every year; not on the ICCCN 2026 workshop list
- Not listed in ICORE2026
