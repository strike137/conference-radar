notes:
- Annual conference of ACM SIGCITE on cybersecurity and IT education; known as SIGITE until 2024
- 2025 was the first edition under the SIGCITE name (26th overall); 2026 is the 27th
- Held at US universities and colleges (Marietta GA 2023, El Paso 2024, Sacramento 2025, Wilmington NC 2026); October until 2024, November since 2025
- Tracks for innovative practice and education research papers (6 pages plus 1 page of references), student papers, lightning talks, panels, tutorials and posters
- Double-anonymous review; accepted work appears in the proceedings (ACM DL) only if presented in person
- "CORE ICORE2026 lists it under its former name SIGITE (ACM Information Technology Education) as National: USA"
- Not on the CCF list
