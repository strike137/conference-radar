notes:
- One-day ICSE workshop on IDEs and developer productivity that brings together researchers and IDE builders from industry (IntelliJ, VS Code, Eclipse and others)
- Held with ICSE since 2024; Lisbon 2024, Ottawa 2025, Rio de Janeiro 2026, Dublin 2027 (4th edition)
- Short papers up to 6 pages and extended abstracts up to 4 pages, both including references; single-blind review via HotCRP
- 2026 accepted 11 of 11 submissions after one major revision round (8 short papers, 3 extended abstracts)
- 2026 papers published by ACM (short papers pay the ACM Open APC, extended abstracts are free); 2027 uses the IEEE template and ICSE 2027 workshop papers are published by IEEE
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
