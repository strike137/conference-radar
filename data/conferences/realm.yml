id: realm
name: REALM
full_name: Workshop for Research on Agent Language Models
type: workshop
tier: minor
areas: [nlp, ai]
region: europe
language: english
frequency: annual
organizer: Workshop organizing committee (2026 organizers from ServiceNow AI Research, Cohere, Imperial College London, Mila and Aarhus University); co-located with ACL or EMNLP
organizer_country: [canada, europe]
proceedings: ACL Anthology
archival: true
indexing: [ACL Anthology]
typical:
  deadline_months: [4, 8]
  conference_months: [7, 10]
links:
  website: https://realm-workshop.github.io/
notes:
- Workshop on LLM-based agents (tool use, web and GUI agents, planning, memory, self-improvement, agent safety and evaluation)
- First edition at ACL 2025 (Vienna), second at EMNLP 2026 (Budapest); held with a different ACL conference each time, so deadlines move
- Archival long (8 pages) and short (4 pages) papers appear in the ACL Anthology (35 papers in 2025); non-archival papers also accepted
- Double-blind review on OpenReview; direct submissions and ARR commitments
- Hybrid format in 2026
- Not ranked in ICORE2026 and not on the CCF list
