notes:
- Nigerian national IndabaX, a locally organised off-shoot of the Deep Learning Indaba; editions since 2021
- Held at a different Nigerian university each year (TAU Oko 2023, Miva Open University Abuja 2024, Summit University Offa 2025, University of Ibadan 2026)
- 2026 full papers (8 to 12 pages) and short papers (4 to 6 pages), double-blind review via Microsoft CMT, published in PMLR Volume 319 (Diamond Open Access, no APC)
- Separate poster track with 250 to 300 word abstracts, not published in the proceedings
- Hybrid event; organisers report 500+ attendees
- A separate IndabaX Nigeria Poster Fair took place on 22-24 October 2026 at Olabisi Onabanjo University, Ago-Iwoye; it is not the main conference
- Not listed in CORE ICORE2026
