notes:
- Biennial symposium on combinatorial optimization, held every even year since 2010 (Hammamet 2010)
- "Two submission types: regular papers (up to 12 pages) published in Springer LNCS before the conference, and
  extended abstracts (up to 4 pages) posted on the website only"
- Post-conference special issue of Discrete Applied Mathematics open to extended versions of ISCO papers
- Each submission reviewed by three anonymous reviewers; an accepted regular paper needs a paid registration and a
  presentation at the conference by one of the authors to appear in LNCS
- Mostly held around the Mediterranean (Vietri 2016, Marrakesh 2018, Tenerife 2024, Kusadasi 2026); 2020 and 2022
  were online
- 2026 edition preceded by a two-day spring school for PhD students
- Algorithms and optimization theory, close to operations research; ranked C in ICORE2026; not in the CCF list (the CCF entry is IPCO, not ISCO)
- 2026 proceedings are LNCS volume 16613
