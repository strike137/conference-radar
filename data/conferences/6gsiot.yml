notes:
- Workshop on energy-efficient and sustainable IoT for 6G (green IoT, energy harvesting, RIS, edge intelligence)
- Moves between IEEE ComSoc flagships; 6th edition at GLOBECOM 2024 (Cape Town), then WCNC 2025 (Milan) and the 9th
  edition at WCNC 2026 (Kuala Lumpur)
- Organizers from University of Glasgow, Royal Military College of Canada, Manchester Metropolitan University and
  Czech Technical University in Prague (2026)
- Accepted and presented papers go into the IEEE WCNC workshop proceedings and IEEE Xplore; no-show papers can be
  excluded
- Half-day workshop with about 7 papers in 2026
- Not in the IEEE WCNC 2027 workshop list
- Not listed in ICORE2026
