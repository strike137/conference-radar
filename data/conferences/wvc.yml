notes:
- Brazilian national computer vision workshop, a standalone event; 20th edition (XX WVC) in 2025
- Hosted by a different Brazilian university each year (UFV Rio Paranaíba 2024, UFSCar São Carlos 2025)
- Proceedings (Anais do Workshop de Visão Computacional) published in SBC OpenLib (SOL) for 2019 to 2024
- Papers in English or Portuguese (title and abstract in English), up to 8 pages, double-blind review via CMT
- Slides in English but talks given in Portuguese; also a thesis and dissertation contest (CTDVC) and a hackathon
- Not listed in ICORE2026 or the CCF list
