notes:
- Held since 1987 under the auspices of IAAIL in cooperation with AAAI; the main venue of the AI and law community
- All proceedings published by ACM in the conference proceedings series; ACM open access is mandatory from 2026 and
  authors pay the fee
- Biennial until 2023; IAAIL made it annual from the 2025 edition onwards
- 2026 was the first edition in Asia (Singapore Management University); 2025 was at Northwestern in Chicago (hybrid)
- Long papers up to 10 pages and short papers up to 5 pages including references; double-blind review with a rebuttal
  period; in-person presentation required
- CORE C in ICORE2026
- JURIX is a separate, European AI and law conference
