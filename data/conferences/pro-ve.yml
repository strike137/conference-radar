notes:
- Long running IFIP working conference on collaborative networks and virtual enterprises; 2026 is the 27th edition
- Multidisciplinary (engineering, management, socio-human sciences); recent themes centre on hybrid human-AI collaborative networks
- Proceedings in Springer IFIP AICT (two volumes in 2025 and 2026); papers in LNCS format, submitted as Word files via EasyChair
- Held in Europe (Valencia 2023, Albi 2024, Porto 2025, Padova 2026)
- Selected papers invited to journal special issues (Production Planning and Control, IJPME)
- 2026 deadlines were extended by about three weeks
- "CORE rank: C (ICORE2026); not in the CCF list"
