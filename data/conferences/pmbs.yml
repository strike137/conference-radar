notes:
- One-day workshop on performance modeling, benchmarking and simulation of HPC systems, held with SC since 2010; 2026 is the 17th edition (PMBS26)
- Full papers of 8 pages and a Late-Breaking Research track with 4-page short papers, IEEE template, double-anonymous review
- Accepted papers appear in the SC workshop proceedings (ACM DL for SC25; earlier volumes in IEEE Xplore, ACM DL and Springer LNCS)
- Selected papers have been invited to journal special issues (Concurrency and Computation, FGCS, The Computer Journal)
- Distinguished Student Paper award with a free SC workshop registration
- Held at SC every year in the USA (Denver 2023, Atlanta 2024, St. Louis 2025, Chicago 2026)
- Not listed in CORE ICORE2026
