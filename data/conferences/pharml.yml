notes:
- Half-day workshop at ECML PKDD on machine learning for drug discovery, clinical development and healthcare
- Sixth edition in 2026; earlier editions 2020, 2021, 2022, 2023 and 2025 (no 2024 edition)
- Research abstracts up to 6 pages and long papers up to 16 pages, Springer LNCS style, strictly double-blind review via CMT
- Workshop proceedings published with Springer; only unpublished work is eligible, and in-person presentation with full registration is required
- Authors of accepted short papers may be invited to a journal supplement
- Not listed in CORE ICORE2026
