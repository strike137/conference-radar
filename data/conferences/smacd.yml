notes:
- European forum on modeling, simulation and synthesis (EDA/CAD) for analog, mixed-signal, RF and multi-domain integrated circuits, plus AI/ML for EDA and hardware security
- Accepted papers are submitted to IEEE Xplore; IEEE CEDA appears as a sponsor
- Co-located with PRIME (PhD research in microelectronics and electronics) since 2016
- Hosted by a different European city each year (Volos 2024, Istanbul 2025, Dresden 2026, Seville 2027)
- Runs an EDA competition and an IC or open-source design challenge alongside the paper track
- Not listed in ICORE2026 or the CCF list
