notes:
- Intelligent systems conference organized since 2005 together with Yildiz Technical University (Turkey); hosted by a
  different university each year (University of Minho, Guimaraes, Portugal in 2026)
- Papers up to 6 pages (2 extra pages for a fee), published in IEEE Xplore
- Fully hybrid in 2026; remote presenters send a pre-recorded video and attend their session live
- Special tracks and tutorials alongside the main track
- 'Deadlines are extended in steps (2026: 2026-05-30 -> 2026-06-15 -> 2026-06-25)'
- Recent hosts are Kocaeli, Turkey (2021), Biarritz, France (2022), Hammamet, Tunisia (2023), Craiova, Romania (2024),
  Ras Al Khaimah, UAE (2025) and Guimaraes, Portugal (2026)
- Not the same as IEEE ASYU, the Turkish national conference with a similar English name
- CORE C (ICORE2026), listed as International Symposium on Innovations in Intelligent Systems and Applications
