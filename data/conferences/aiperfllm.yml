notes:
- ICPE workshop on AI-driven performance engineering, performance optimization of LLM training and inference, and energy-efficient AI computing
- Co-located with ACM/SPEC ICPE; 3rd edition in 2025 (as AI Performance and Optimization in the LLM World), 4th in Florence 2026
- Half-day format with invited talks, papers and a panel (WOSP-C contributes the panel)
- Regular research papers up to 8 pages; empirical, experience, work-in-progress and vision papers up to 6 pages; HotCRP
- Papers published in the ICPE Companion proceedings in the ACM Digital Library
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
