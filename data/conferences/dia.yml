notes:
- Annual machine vision and computer vision workshop on practical image processing, run for about 20 years by the
  same JSPE technical committee as ViEW
- Held every March at a different city in Japan (Utsunomiya 2023, Beppu 2024, Tsuruga 2025, Kochi 2026, Okayama 2027)
- Oral and interactive (poster) sessions plus equipment demo exhibition by companies; an about 2-page summary is sent with the application
- Proceedings are a download for registered participants only (sold afterwards for 10,000 JPY), so non-archival
- Outstanding talks are recommended to the Journal of JSPE special issue on practical use of image technology (submitted and reviewed as regular journal papers)
- Young researcher award for presenters up to 35 years old
