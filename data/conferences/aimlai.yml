notes:
- International workshop on interpretable and explainable AI and ML, mostly co-located with ECML PKDD (EGC and ECML 2019, CIKM 2020 and 2022, ECML 2021 and 2023 to 2026)
- 7th edition in 2024; 2026 edition at ECML PKDD in Naples, a full-day joint event with a tutorial on mechanistic interpretability
- Regular papers up to 14 pages and short papers up to 7 pages excluding references, Springer LNCS format, single-blind review
- Accepted papers go into the joint ECML PKDD post-workshop proceedings published by Springer; authors can opt out; in-person presentation required for inclusion
- Not listed in CORE ICORE2026
