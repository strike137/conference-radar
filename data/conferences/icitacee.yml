id: icitacee
name: ICITACEE
full_name: International Conference on Information Technology, Computer, and Electrical Engineering
type: conference
tier: minor
areas: [general, communications, ai, networking]
region: southeast-asia
language: english
frequency: annual
organizer: Electrical Engineering Department, Faculty of Engineering, Universitas Diponegoro (UNDIP), technically
  co-sponsored by IEEE Indonesia Section
organizer_country: [indonesia]
proceedings: IEEE Xplore
indexing: [Scopus]
fee: 350 USD IEEE member, 400 USD non-member, 250 USD student (2026, international early bird); regular 400/450/300
  USD
typical:
  deadline_months: [5, 6, 7]
  conference_months: [9]
links:
  website: https://icitacee.undip.ac.id/
notes:
- Annual since 2014, held by the Electrical Engineering and Computer Engineering departments of Universitas Diponegoro
  (Semarang, Indonesia); the 2024 and 2026 editions were organized by the Electrical Engineering Department; IEEE
  Indonesia Section is technical co-sponsor
- Proceedings of the 2014 to 2025 editions are in IEEE Xplore; the site states the 1st to 10th are indexed in Scopus
- 'Very broad EE/IT scope: computing and AI, power systems, telecommunications, control and circuits, green and
  biomedical applications'
- 4 to 6 page IEEE-format papers via EDAS, blind review (stated for 2024); hybrid (in person or online presentation), IEEE no-show
  policy applies
- Held in Indonesia; 2024 at Ciputra Hotel Semarang (home city of UNDIP), 2026 in Nusa Dua, Bali
- Not listed in ICORE2026 or the CCF list
- The 2026 submission deadline was extended by about a month
