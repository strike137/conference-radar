notes:
- Half-day workshop on RISC-V for high performance computing, held with IEEE/ACM SC since 2023
- Run by the EPCC team behind the ExCALIBUR H&ES RISC-V testbed
- Research papers, short papers and invited talks
- SC26 lists it among the workshops with SC Workshop Proceedings
- Sister editions of the same workshop are held with ISC High Performance (since 2023) and HPC Asia; this entry covers the SC edition
- Not listed in CORE ICORE2026
