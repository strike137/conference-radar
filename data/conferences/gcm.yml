notes:
- One-day workshop on graph computation models, graph transformation and rule-based graph rewriting, with a focus on modeling and software engineering
- Held since 2006 (biennial at first, annual since 2014); the 2026 edition was the 17th
- Satellite of ICGT, held within STAF in recent years (Leicester 2023, Enschede 2024, Koblenz 2025, Rennes 2026)
- Proceedings in EPTCS (Electronic Proceedings in Theoretical Computer Science); GCM 2025 is EPTCS 440 and GCM 2026 is listed as a forthcoming EPTCS volume
- "2026 formats: regular papers up to 16 pages, position papers, system descriptions or work in progress of 6 to 12 pages, and 2-page abstracts of already published work (not in the proceedings)"
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
