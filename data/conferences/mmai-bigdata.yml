notes:
- Workshop on multimodal learning, multimodal LLMs, cross-modal retrieval, data fusion and multimodal applications; held as MMBD in 2021 and 2022 and as MMAI since 2023
- Chaired by Lindi Liao (George Mason University) with co-chairs from Baptist Health South Florida and South Dakota State University
- Held with the IEEE International Conference on Big Data; the 2025 edition was an online workshop
- Accepted papers published in the IEEE Big Data proceedings; double-blind review
- Full papers 8-10 pages, short papers 5-7 pages, posters 3-4 pages; conditionally accepted papers go through a second review round
- "Acceptance rate: 24.4% full papers, 30.3% short papers, 50% posters (2025)"
- Separate from the MMAI workshop at IEEE ICDM run by the same organizers
- Not ranked by CORE (not in ICORE2026) or CCF
