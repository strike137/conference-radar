notes:
- Annual modeling, simulation and gaming conference of the Federation of Asia Simulation Societies (ASIASIM)
- Member societies are CSF (China), JSST (Japan), KSS (Korea), SSAGsg (Singapore) and MSS (Malaysia); the host rotates among them
- Proceedings in Springer CCIS (indexed in EI Compendex, Scopus, DBLP)
- Full papers up to 12 pages and short papers up to 6 pages in LNCS format; at least one author must attend
- AsiaSim 2025 (24th) was held at NTU@One-North Executive Centre, Singapore
- AsiaSim 2026 (25th) was held at Jeju National University, Korea, organized by the Korea Society for Simulation; 72 international papers in 22 technical sessions plus one Korean-language domestic session
