notes:
- First BSides event in Montana, a community cybersecurity conference in Bozeman
- Held at the Strand Union Building on the Montana State University campus; venue holds up to 400 attendees
- One day of talks, hands-on trainings, a CTF and resume reviews; aimed at entry level through professionals
- Speakers apply by email to the organizers; no formal CFP page or deadline published
- Key sponsor is Ronin Cyber Academy, whose president is the contact for speakers and sponsors; talks only, no proceedings
