notes:
- New workshop at ACM CCS 2026 in The Hague, run by the Radboud University hardware security group
- 'Scope: formal and empirical verification of cryptographic implementations, side-channel and fault analysis, masking'
- Full papers up to 10 pages, short papers up to 6 pages, plus 3 to 6 page "wild and crazy" papers, all in ACM double-column format
- Anonymous submission via HotCRP; deadline extended twice in 2026 (June 30 -> July 15 -> July 24)
- CCS 2026 workshops get online proceedings in the ACM Digital Library with a separate ISBN
