notes:
- Organized by KIISC (Korea Institute of Information Security and Cryptology); Korean-language domestic conference
- 'Categories: general, undergraduate and women-scientist papers; undergraduates 2-3 pages (poster), graduate students
  and above 3-4 pages (oral or poster)'
- Submitted via EasyChair; at least 2 reviewers per paper; best papers recommended to the Journal of the KIISC (KCI-listed)
- Held in May or June in a different city each year (Gyeongju in June 2025, Busan BEXCO in May 2026)
- Deadlines are routinely extended (May 2 -> May 16 in 2025, Apr 4 -> Apr 9 in 2026); winter counterpart is CISC-W
