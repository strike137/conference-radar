notes:
- ACNS satellite workshop, held at ACNS 2025 in Munich; supported by the EU QCI-CAT and QSNP quantum communication projects
- 'Scope: hybrid authenticated key exchange combining conventional, post-quantum and quantum cryptography, EuroQCI topics,
  secure quantum computing, standardization'
- Regular papers up to 18 pages in LNCS format, post-proceedings in Springer LNCS with the ACNS 2025 workshops; SoK
  papers especially welcome
- Also takes 2-page extended abstracts for contributed talks, which are not published
- 9 accepted papers and talks plus two invited keynotes in 2025
- Not among the ACNS 2026 workshops; no later edition announced
