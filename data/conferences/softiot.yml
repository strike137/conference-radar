links:
  website: https://sites.google.com/view/softiot-2025/home
notes:
- Workshop on SDN, NFV and network slicing for IoT applications
- Moves between host conferences; 2025 (9th edition) was held with ICCCN in Tokyo
- Earlier hosts were IEEE/CIC ICCC (2020, 2021, 2024), IEEE NetSoft 2021, IEEE VTC2023-Fall, MSN 2023 and 2024 and IEEE VTC2024-Spring, so some years had more than one edition
- Full papers up to 7 pages in IEEE format via EDAS; accepted and presented papers go to IEEE Xplore with the host conference proceedings
- Small workshop; the 2025 edition had three papers in a shared ICCCN workshop session
- Not listed in ICORE2026 or the CCF 2026 list
