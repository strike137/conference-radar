id: mmve
name: MMVE
full_name: International Workshop on Immersive Mixed and Virtual Environment Systems
type: workshop
tier: minor
areas: [systems, networking, vision]
region: worldwide
language: english
frequency: annual
organizer: MMVE workshop chairs, co-located with ACM MMSys
organizer_country: [international]
proceedings: ACM DL (ACM MMSys proceedings)
archival: true
typical:
  deadline_months: [1, 2]
  conference_months: [3, 4]
links:
  website: https://mmve-workshop.org/
notes:
- One-day workshop on immersive media and XR systems (VR, AR, MR), QoE, volumetric streaming and point clouds,
  XR accessibility and user perception; running since 2008, 18th edition in 2026
- Co-located with ACM MMSys and follows its location (Bari 2024, Stellenbosch 2025, Hong Kong 2026)
- Accepted papers archived in the ACM Digital Library as part of the ACM MMSys proceedings
- Full papers up to 6 pages and short papers up to 3 pages excluding references, ACM sigconf template,
  double-blind review on HotCRP
- At least one author must present in person
- Not listed in ICORE2026 or on the CCF list
