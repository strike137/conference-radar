notes:
- Long-running workshop series on self-organizing maps, learning vector quantization and related unsupervised and interpretable machine learning
- Steering committee founded by Teuvo Kohonen; members from Europe, the USA and Chile
- 2026 is the 16th edition, co-organized with IDEAL 2026 in Manchester; submission and registration go through the IDEAL 2026 site
- Proceedings planned in Springer Lecture Notes in Networks and Systems (LNNS)
