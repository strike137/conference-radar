notes:
- Long-running series on next-generation networks, rooted in ITC-sponsored teletraffic seminars in Saint Petersburg from 1993
- Held in Saint Petersburg until 2019 (co-located with ruSMART from 2008), online in 2020 and 2021
- Since 2022 held abroad (Tashkent 2022, Dubai 2023, Morocco 2024, Abu Dhabi 2025, Colombo 2026)
- Proceedings in Springer LNCS every year (LNCS 16461 and 16462 for 2025)
- Submissions via Microsoft CMT
- 2026 edition hosted with SLIIT in Colombo, with a hackathon, 3MT competition and panels
- Not listed in ICORE2026
