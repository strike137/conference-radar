notes:
- Organized by IARIA as part of the NexComm congress, co-located with ICDT, SPACOMM and other IARIA events
- Published open access in the IARIA ThinkMind library (ISSN 2519-8394); selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Usually held in Spain, Portugal, Italy or France; onsite and online participation offered
- The 2027 edition moves earlier to April, with the submission deadline in December 2026
