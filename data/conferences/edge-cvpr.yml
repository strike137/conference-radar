notes:
  - Workshop on efficient generative AI for vision (training, inference and data efficiency, on-device and edge deployment)
  - Held with CVPR every year since 2024 (1st CVPR 2024, 2nd CVPR 2025, 3rd CVPR 2026 in Denver)
  - "Two tracks: long papers up to 8 pages (in CVPR Workshops proceedings) and extended abstracts up to 4 pages (not in proceedings)"
  - Anonymized submissions via OpenReview, CVPR author kit; papers under review at another CVPR workshop are not allowed
  - Organizers mostly from industry labs (Google DeepMind, Meta, Microsoft AI, NVIDIA)
  - Not listed in ICORE2026 or the CCF list
