organizer: Workshop organizing committee (Felix Juefei-Xu, Tingbo Hou and Yuchen Liu of Google DeepMind, with Meta, Microsoft AI, NVIDIA and others); co-located with CVPR
organizer_country: [usa]
proceedings: CVF Open Access and IEEE Xplore (CVPR Workshops proceedings)
