notes:
- ICSE workshop on requirements engineering for AI-powered software (AIware), including prompts as requirements and responsible AI
- Held with ICSE every year since 2025 (Ottawa 2025, Rio de Janeiro 2026, Dublin 2027)
- Not the same venue as the RAISE workshop on Real-world AI Security and Engineering (id raise)
- Steering committee includes Bashar Nuseibeh and Ahmed E. Hassan; 2027 co-chairs from The Open University, CSIRO Data61 and Polytechnique Montreal
- Technical papers up to 8 pages plus 2 for references, industrial experience reports up to 6 pages, plus demos, datasets and short discussion papers (extended abstracts up to 4 pages in 2026, discussion papers up to 2 pages in 2027)
- 2026 papers published in the ACM Digital Library; the 2027 call uses the IEEE conference template
- 2027 has an abstract deadline one week before the paper deadline
- Not listed in the CORE portal (ICORE2026) or on the CCF 2026 list
