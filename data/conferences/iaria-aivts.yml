notes:
- Organized by IARIA as part of the SocSys congress, co-located with PANDEMICS ANALYTICS and other IARIA events (first edition in 2025, 2nd in 2026)
- Covers AI for unmanned autonomous vehicles and IoT in critical services
- Published open access in the IARIA ThinkMind library; prints via Curran Associates; selected papers invited to IARIA journals
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Held in Barcelona (2025) and Lisbon (2026); onsite and online participation offered
