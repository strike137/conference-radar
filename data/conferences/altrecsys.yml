notes:
- Discussion-oriented workshop on critical, offbeat and unconventional ideas in recommender systems research
- Held at RecSys 2024 (Bari, Italy) and RecSys 2026 (Minneapolis, USA); no 2025 edition
- Call for opinions rather than papers; formats are extended abstracts up to 500 words, short videos, podcasts or panel proposals, submitted via a form
- Contributions are editorially reviewed and curated by the organizers, then posted on the workshop website; no formal proceedings
- At least one author must register for RecSys by the early-bird deadline
- Organized by Sole Pera, Michael Ekstrand and Alan Said in 2026
- Not ranked in ICORE2026 and not on the CCF list
