notes:
- Topics are big data, blockchain security, IoT security, cloud and fog security, AI/ML security, cybersecurity and privacy
- Accepted papers (regular and workshop) published in Springer CCIS ("Big Data and Security" volumes)
- Papers 12 to 15 pages in LNCS format; submission through Microsoft CMT
- Selected papers considered for several journals (Sensors, Electronics, Future Internet and others)
- Held in China except 2020 (Singapore); editions 2019 to 2023 and 2025, no edition in 2024
- 6th edition in Nanjing, December 2025; no 2026 edition announced on the site as of November 2026
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
