notes:
- Workshop on LLMs and generative models for recommendation, personalization and personalized generation
- Held at KDD 2024 (Barcelona), KDD 2025 (Toronto) and WSDM 2026 (Boise, Idaho)
- Papers 2 to 8 pages via OpenReview; double-blind review
- Accepts papers under review or recently accepted elsewhere; papers are not included in the WSDM proceedings and accepted PDFs are posted on the workshop site
- Organizers mostly from industry research labs (AWS, Google DeepMind, Snap, Databricks)
- No fourth edition announced on the official site as of November 2026
- Not ranked in ICORE2026 and not on the CCF list
