notes:
- One-day French conference on incident response and digital forensics run by CECyF; held every year since 2015 (2026 is the 12th)
- Held in Lille on the first day of Forum InCyber (formerly FIC); Forum InCyber registration is required plus a CoRIIN fee
- 30 minute talks selected by a programme committee; optional articles of 5 to 20 pages and posters
- Audience of law enforcement investigators, court experts, CERT and incident response staff, academics and lawyers
- Slides of many talks are posted as PDF on the CECyF edition pages; website and CFP are in French
- Not in the ICORE2026 portal and not on the CCF list
