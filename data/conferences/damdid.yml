notes:
- Multidisciplinary forum on data analysis and management in data intensive domains (astro, bio, geo, medicine, physics and other X-informatics)
- Formed in 2015 from the Russian digital libraries conference RCDL; held in Russia
- Post-proceedings (conference track) submitted to Springer CCIS; journal track papers go to the Lobachevskii Journal of Mathematics and Pattern Recognition and Image Analysis
- Each paper reviewed by three PC members; two review rounds; official language English
- Includes a PhD workshop and co-located satellite workshops
- Not listed in ICORE2026 or the CCF 2026 list
