id: alp
name: ALP
full_name: Workshop on Ancient Language Processing
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: biennial
organizer: Workshop organizing committee (Ariel University, Universita Cattolica del Sacro Cuore, Western Washington University,
  Nanjing Normal University and others); co-located with *ACL or RANLP
organizer_country: [europe, usa, china, other]
proceedings: ACL Anthology
