links:
  website: https://www.ancientnlp.com/
notes:
- Workshop on NLP for ancient languages and scripts (Sumerian, Akkadian, Ancient Egyptian, Greek, Latin, Sanskrit, Literary
  Chinese and more), up to 800 CE
- Held with RANLP 2023 (Varna), NAACL 2025 (Albuquerque) and ACL 2027 (Kyoto); every two years so far
- Long (8 pages) and short (4 pages) papers in ACL format, double-blind review; shared-task system papers for EvaHan and EvaCun
- All accepted papers go to the ACL Anthology (25 papers in 2023, 33 in 2025, excluding front matter)
- Not listed in ICORE2026 and not on the CCF list
