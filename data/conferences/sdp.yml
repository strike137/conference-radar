id: sdp
name: SDP
full_name: Workshop on Scholarly Document Processing
type: workshop
tier: minor
areas: [nlp, data]
region: worldwide
language: english
frequency: irregular
organizer: Workshop organizing committee (2025 editors from ORNL, GESIS, Allen Institute for AI, DFKI, SRI International,
  Elsevier and Fraunhofer FOKUS); co-located with ACL-family conferences
organizer_country: [usa, europe]
proceedings: ACL Anthology
archival: true
typical:
  deadline_months: [3, 5]
  conference_months: [7, 8]
links:
  website: https://sdproc.org/
notes:
- Workshop on NLP, information retrieval and data mining for scholarly and scientific documents (LLMs for science,
  summarization, citation analysis, scientometrics, peer review tools, digital libraries)
- Five editions so far (EMNLP 2020, NAACL 2021, COLING 2022, ACL 2024 Bangkok, ACL 2025 Vienna); no edition in 2023
- Grew out of the BIRNDL and WOSP workshops
- Proceedings in the ACL Anthology (35 papers in 2025, 32 in 2024)
- Research track plus several shared tasks; long papers up to 8 pages, short papers up to 4 pages; ARR-reviewed papers
  can be committed
- Not listed in ICORE2026 and not on the CCF list
