notes:
- Held every July on the island of Samos, Greece, in a relaxed summer-school style setting
- Proceedings in Springer LNCS (two volumes in 2024); papers up to 16 pages in LNCS format
- Selected authors are invited to submit extended versions to a special issue of the International Journal of Parallel
  Programming (Springer)
- Two tracks covering embedded and high-performance architectures, and modeling, design and design space exploration
- No conference in 2026 (cancelled due to unforeseen circumstances); SAMOS XXVI is planned for July 2027 with a summer
  school and a symposium honoring Stamatis Vassiliadis
- Not listed in CORE ICORE2026 or the CCF 2026 list
