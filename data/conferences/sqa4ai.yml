notes:
- Workshop on quality assurance, testing, technical debt and MLOps for AI-enabled systems, including LLMs
- Held with SANER; 1st edition 2022 (Honolulu), 2nd 2025 (Montreal), 3rd 2026 (Limassol)
- 2026 papers appear in the SANER companion proceedings (SANER-C) in IEEE Xplore; 7 accepted papers
- Full papers up to 8 pages, short papers up to 4, position papers 2 pages, double-anonymous review by at least three PC members, submitted via the SANER EasyChair
- The 2026 edition was run hybrid over Zoom because of the situation in Cyprus
- Not listed in the CORE portal (ICORE2026)
