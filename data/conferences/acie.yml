id: acie
name: ACIE
full_name: Asia Conference on Information Engineering
type: conference
tier: minor
areas: [general]
region: asia-pacific
language: english
frequency: annual
organizer: Conference secretariat (contact acie_conf@yeah.net), co-sponsored by host universities (Nihon University, Japan and Nanyang Technological University, Singapore for 2027)
proceedings: IEEE Xplore
archival: true
indexing: [EI Compendex, Scopus]
fee: Full paper 500 USD early / 550 USD normal regular, 450 / 480 USD student, abstract only from 380 USD (2027)
typical:
  deadline_months: [1, 11]
  conference_months: [1, 4]
links:
  website: http://acie.org/
notes:
- Smaller commercially run conference; contact via a yeah.net address and submission via zmeeting.org
- Annual since 2021; 2027 is the 7th edition
- "Hosts so far: online 2021 to 2023, Singapore 2024, Phuket 2025, Tokyo 2026, Koriyama 2027"
- Proceedings in IEEE Xplore every year since 2021, stated as indexed by EI Compendex and Scopus
- Very broad information engineering scope (software, big data, networks, security, AI)
- Abstract only presentation also offered
- Not listed in the CORE ICORE2026 portal and not on the CCF 2026 list
