notes:
- Practitioner conference on knowledge graphs, semantic layers, ontologies and graph AI, run by practitioners for practitioners; founded at Columbia University in 2019
- Held in New York City every May (online 2020 to 2022); 2025 and 2026 at Cornell Tech, 2027 at Jay Conference Bryant Park
- Format is two days of workshops and masterclasses followed by three days of parallel tracks, plus a startup pitch and an exhibition
- Talk proposals (25 or 45 minute talks, panels, half-day workshops) open in September and close in December; no product pitches
- "Poster track: 5 to 7 page papers in CEUR-ART style via EasyChair, not double-blind; accepted papers are submitted to CEUR-WS"
- Sessions are recorded for a paid video library
- Not listed in the CORE ICORE2026 portal
