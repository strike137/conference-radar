notes:
- Smaller commercially run conference (secretariat on an academic.net address, registration via iconf.org)
- Held since 2015 (Kuala Lumpur); mostly in Europe (Milan 2024, Lille 2025, Oldenburg 2026, Grimstad 2027); online 2021 to 2023
- Proceedings in IEEE Xplore since 2020 (ACM 2017 to 2019, Springer 2016), stated as indexed by EI Compendex and Scopus
- Double-blind review; manuscripts at least 4 pages; abstract-only presentations accepted
- Not listed in ICORE2026 or the CCF 2026 list
