links:
  website: https://probnum2026.github.io/
notes:
- Specialist conference on probabilistic numerical methods (Bayesian quadrature, probabilistic ODE solvers, uncertainty in numerical computation) at the border of ML and numerical analysis
- Started in 2025; held in Europe (Sophia Antipolis 2025, Lappeenranta 2026)
- Proceedings in PMLR (vol. 271 for 2025 with 12 papers, vol. 341 for 2026 with 14 papers)
- Double-blind review on OpenReview with an author response phase; papers up to 8 pages plus references and appendices
- Small and focused; each submission must nominate a reviewer
- Not listed in CORE ICORE2026
