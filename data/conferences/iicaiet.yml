id: iicaiet
name: IICAIET
full_name: IEEE International Conference on Artificial Intelligence in Engineering and Technology
type: conference
tier: minor
areas: [ai, general]
region: southeast-asia
language: english
frequency: annual
organizer: IEEE Sabah Subsection with Universiti Malaysia Sabah (UMS)
organizer_country: [malaysia]
proceedings: IEEE Xplore
indexing: [IEEE Xplore, Scopus, EI]
fee: 450 USD IEEE member, 550 USD non-member, 350 USD IEEE student member (2025, international)
typical:
  deadline_months: [6, 7, 8]
  conference_months: [8, 9]
links:
  website: https://iicaiet.ieeesabah.org/
notes:
- Run by the IEEE Sabah Subsection and Universiti Malaysia Sabah; first held in 2018, annual since 2020
- Always held in Kota Kinabalu, Sabah, Malaysia (2022 fully virtual); hybrid, with online presentation for overseas
  participants
- Proceedings in IEEE Xplore, indexed in Scopus and EI Compendex
- Broad AI applications in engineering (biomedical, energy, robotics, signals and communication, vision, ICT and
  cybersecurity)
- Up to 6 page IEEE format papers via EDAS, single-blind review by at least two reviewers
- Submission deadline is usually extended (2025 Jun 15 -> Jun 30; 2026 final extension Aug 9)
- Not in the ICORE2026 or CCF lists
