links:
  website: https://sites.google.com/view/yfrsw-2026
notes:
- One-day satellite workshop held right before Interspeech, for female* Bachelor's and Master's students in speech
  science and technology who have not yet started a PhD
- Applicants send a 300-word abstract and a statement of motivation by email; reviewed by the program committee
- Program has student poster sessions, PhD and senior panels, and a mentoring session; in person only
- Accepted abstracts are posted on the website as a book of abstracts; no formal proceedings
- First-time participants get a partial grant toward early-bird student Interspeech registration and travel costs
- 'Held with Interspeech since 2016 (no 2020 edition): Dublin 2023, Kos 2024, Delft 2025, Sydney 2026'
- Not listed in ICORE2026 and not on the CCF list
