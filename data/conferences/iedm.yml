notes:
- Flagship conference of the IEEE Electron Devices Society; 72nd edition in 2026
- Held every December at the Hilton San Francisco Union Square (dates fixed through 2028)
- Single submission of a final 4-page camera-ready paper (2 pages of text, 2 pages of figures) in IEEE Xplore-compliant PDF; accepted papers are published as-is in the IEDM Technical Digest
- Late News track for recent results, with a separate deadline in August
- Covers logic, memory, power, RF, sensors, displays, reliability, modeling, neuromorphic and quantum devices
- Not ranked by CORE or CCF, whose lists cover computing venues; regarded as the premier semiconductor device conference
