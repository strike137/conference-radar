id: iccsn
name: ICCSN
full_name: International Conference on Communication Software and Networks
type: conference
tier: minor
areas: [networking, communications, software]
region: china
language: english
frequency: annual
organizer: ICCSN conference secretariat with a rotating Chinese host university or laboratory
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
typical:
  deadline_months: [2]
  conference_months: [6, 7]
links:
  website: https://www.iccsn.org/
notes:
- Annual since 2009; held in a different Chinese city each year (Shenyang 2023, Ningbo 2024, Qingdao 2025, Shenzhen
  2026, Chengdu 2027)
- Proceedings in IEEE Xplore every year since 2015; IEEE and IEEE ComSoc technical co-sponsors in 2023 to 2025
- The site says proceedings are submitted to Ei Compendex and Scopus; selected papers may be recommended to journals
  such as Digital Communications and Networks (DCN)
- Full papers 4 to 10 pages, but the regular fee covers only 5 pages; at least one author must attend
- Not listed in the CORE ICORE2026 portal; regarded as a small venue
