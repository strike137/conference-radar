notes:
- Organized by IARIA as part of the InfoWare congress, co-located with ICCGI, ICWMC and other IARIA events (16th edition in 2026)
- Published open access in the IARIA ThinkMind library (ISSN 2308-4227); prints via Curran Associates
- Onsite and online participation options
- Held in southern Europe (Nice, Venice, Barcelona, Athens, Lisbon, Valencia in recent years)
- Not listed in ICORE2026; IARIA events are generally regarded as low-selectivity
- Not to be confused with EAI CollaborateCom; the 2027 edition moves to May
