notes:
- Standalone workshop founded in 2006, 21st edition in 2026
- Renamed in 2026; until 2025 it was the International Workshop on Semantic and Social Media Adaptation and Personalization
- Technically co-sponsored by IEEE Computational Intelligence Society; co-organized by University of West Attica and University of the Peloponnese (Greece)
- Proceedings in IEEE Xplore; the site states the proceedings have always been indexed by dblp and Scopus
- Selected papers invited to special issues of MDPI Computers and MDPI Machine Learning and Knowledge Extraction
- Papers up to 8 pages in IEEE format; pages beyond 6 cost 90 EUR each
- Held in Europe every year (Greece and Cyprus recently, Mystras in 2025 and 2026); 2020 to 2022 were online; hybrid with remote presentation
- "Registration 2026: 350 EUR full, 300 EUR IEEE member, 200 EUR student (early, excl. VAT)"
- Several deadline extensions are usual
- Not found in ICORE2026; not on the CCF list
- Not the same venue as the IEEE Symposium on Microwave, Antenna, and Propagation (smap)
