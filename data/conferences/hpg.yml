notes:
- Performance-oriented graphics venue where industry and academia meet (ray tracing, GPU architecture, real-time rendering, neural rendering systems)
- Successor of the Graphics Hardware workshop (since 1986) and the Interactive Ray Tracing symposium, named HPG since 2009
- Co-sponsored by ACM SIGGRAPH and Eurographics; accepted papers appear in an open-access special issue of PACMCGIT
- Double-blind review in two rounds; conditionally accepted papers submit a revision that is reviewed again
- Alternates between co-location with SIGGRAPH in North America and with EGSR in Europe (Delft 2023, Denver 2024, Copenhagen 2025, Los Angeles 2026, Lugano 2027); online 2020 to 2022
- Not listed in ICORE2026 and not in the CCF list, but well regarded in the real-time rendering community
- Includes Hot3D industry talks, posters and a student competition
