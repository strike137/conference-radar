notes:
- Run by the Faculty of Electrical and Computer Engineering at CUET near Chattogram, Bangladesh; 4th edition in February
  2025 at the CUET IT Business Incubator, 5th edition planned at CUET in early 2027
- Accepted papers are submitted for inclusion in IEEE Xplore subject to IEEE scope and quality checks
- Broad scope from power and renewable energy to computer systems, networks, cyber security, communications and AI
- Double-blind review; full papers 4 to 6 pages, A4, IEEE double column; submission via CMT
- Similarity index including references must stay below 30%
- 2027 submission deadline was extended from 2026-07-31 to 2026-10-30
- Not found in ICORE2026; not to be confused with the IEEE Energy Conversion Congress and Expo (also ECCE)
