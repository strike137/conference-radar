notes:
- Main international forum for computational number theory (algebraic and analytic number theory, geometry of
  numbers, arithmetic geometry, finite fields, cryptography, coding theory); a mathematics venue that cryptographers
  also use
- Held every two years since 1994; the site rotates between North America, Australasia and Europe and the steering
  committee picks the next host from bids at the business meeting
- Recent editions in Kaiserslautern 2016, Madison 2018, Auckland 2020 (moved online), Bristol 2022, MIT 2024 and
  Groningen 2026; ANTS XVIII is announced for Sydney, 10 to 14 July 2028
- Contributed papers (at most 20 pages, amsart format) are peer reviewed by the program committee; since ANTS XV the
  proceedings appear after the conference as a topical collection of Springer's Research in Number Theory (earlier
  in Open Book Series and Springer LNCS)
- Code and data must be in a public repository for reviewers; prizes include the Selfridge Prize for best paper and
  the MaRDI-ANTS prize for reproducible software
- Registration is open to anyone, with separate calls for lightning talks and posters
- Not listed in CORE ICORE2026 or the CCF list; not the IEEE ANTS networking conference (ieee-ants)
