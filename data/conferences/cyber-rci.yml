notes:
- National one-day cybersecurity research conference for the island of Ireland, started in 2022 and backed by the itag Cyber Forum (Galway)
- Host university rotates (ATU Galway 2022, ATU Donegal 2023, SETU Carlow 2024, University of Galway 2025, MTU Cork 2026)
- At least one author must have been based in Ireland or the research done at least partly in Ireland; no visa support letters
- Full papers up to 8 pages and work-in-progress papers 2 to 4 pages, IEEE two-column format, blind review via EasyChair
- Papers are submitted to IEEE for inclusion in IEEE Xplore; the 2025 proceedings are an IEEE volume (catalog number CFP25BY5)
- 2026 tracks include cybersecurity technologies, AI and cybersecurity, cybercrime and forensics, cyber resilience, human and legal aspects, cybersecurity education and critical systems
- Deadlines close at midnight Irish time and have been extended in recent years
