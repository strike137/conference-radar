notes:
- Japan's largest CTF and security event; the main 'Denno Kaigi' weekend in Tokyo (Asakusabashi) hosts the SECCON
  CTF finals plus talks and workshops
- Open Conference takes 20 or 50 minute talks in English or Japanese; talks presented elsewhere are welcome; review
  by a board from academia and industry
- Call for talks runs in several rounds (October, November, sometimes January) and may close early once slots are
  filled
- SECCON CTF quals are online in December; top 8 international and top 8 domestic teams go to the finals
- Related programs include SECCON Beginners, CTF for GIRLS and regional workshops; non-archival, recordings posted
  on YouTube
