id: scis-isis
name: SCIS&ISIS
full_name: Joint International Conference on Soft Computing and Intelligent Systems and International Symposium
  on Advanced Intelligent Systems
type: conference
tier: minor
areas: [ai]
region: japan
language: english
frequency: biennial
organizer: SOFT (Japan Society for Fuzzy Theory and Intelligent Informatics); technical co-sponsors KIIS (Korean
  Institute of Intelligent Systems) and IEEE SMC Society
organizer_country: [japan, korea]
proceedings: IEEE Xplore
archival: true
rank:
  core: Unranked
fee: 75,000 JPY non-member, 55,000 JPY student non-member (2026, early)
typical:
  deadline_months: [7]
  conference_months: [11, 12]
links:
  website: https://soft-cr.org/scis/2026/
notes:
- Biennial, held in Japan in even years (2018 Toyama, 2022 Ise, 2024 Himeji, 2026 Hachioji); organized by SOFT with
  KIIS (Korea) as technical co-sponsor; ISIS numbering also advances in odd years
- Full papers (4 to 6 pages, IEEE style) are archived in IEEE Xplore; abstract-only and late-breaking papers are
  distributed but not archived
- Describes itself as attracting several hundred participants; deadlines usually extended (2024 Jul 5 -> Jul 19,
  2026 Jul 3 -> Jul 17)
- Registration includes welcome reception and banquet; one registration covers one paper
