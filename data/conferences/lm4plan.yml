notes:
- Workshop on large language models and automated planning, held at ICAPS and at AI or ML conferences
- Previous editions at AAAI 2025 and ICAPS 2025; in 2026 it ran at both ICAPS 2026 (3rd ICAPS edition) and ICML 2026
- Non-archival with no official proceedings; work can be submitted concurrently elsewhere
- Double-blind review on OpenReview; long papers up to 8 pages, short up to 4 pages, AAAI style
