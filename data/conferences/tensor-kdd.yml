notes:
- Half-day workshop on tensor methods for modern machine learning and foundation models, held with ACM SIGKDD
- First edition at KDD 2026 in Jeju, Korea (August 9, 2026, afternoon)
- Papers up to 4 pages (excluding references) in the KDD 2026 ACM format, double-blind review via OpenReview
- Non-archival; previously published or concurrently submitted work is welcome
- Accepted papers are presented as posters, with a few selected for oral talks; in-person attendance required
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
