notes:
- Annual national computing conference of the Computing Society of the Philippines; 2026 was the 26th edition, hosted
  by the University of the Immaculate Conception in Davao City
- Host university and city change every year; the website moves to a new host domain each year
- Double-blind peer review via Microsoft CMT (2026); full papers and short papers, published in two volumes
- Proceedings published by CSP with ISSN 1908-1146 and freely downloadable from the conference site; not in a
  formal series or digital library such as IEEE Xplore or Springer
- First day is a workshop day (April 23 in 2026) before the paper sessions; call for workshops closes in December
- Not in ICORE2026 or the CCF list
