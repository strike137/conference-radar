notes:
- Founded in 2002 and initiated by UESTC; held in 2002, 2004 to 2010, 2013, 2018, and every year since 2022
- Mostly held in China (Chengdu, Xiamen, Wuhan); other editions in Kokura, Japan (2007), Milpitas, USA (2009), Singapore (2022, 2023) and Takasaki, Japan (2026); recent editions are hybrid
- Proceedings in IEEE Xplore and indexed by EI Compendex and Scopus, per the site; the 2023 volume was published by Springer
- 2026 edition hosted by Gunma University and Xiamen University, technically co-sponsored by the IEEE CASS Japan Joint Chapter
- 2026 program had 4 keynotes and 55 invited talks
- Selected extended papers are recommended to the Chinese Journal of Electronics and other journals
- Short review cycle (about one month from submission to notification)
- Not listed in ICORE2026 or the CCF list
