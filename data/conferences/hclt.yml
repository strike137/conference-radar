notes:
- Main Korean-language NLP conference, run by the KIISE SIG on Language Engineering (SIG-HCLT); 38th edition in
  2026
- Papers are 2 to 6 pages, mostly written in Korean; anonymous review via CMT; oral papers need at least 3 pages
- Held every October in Korea (Jeju 2023, Seongnam 2024, Daejeon 2025, Busan 2026); 2024 and 2025 were joint with
  the Korean Association for Corpus Linguistics (KACL)
- Best papers are recommended to the KIISE journal; the National Institute of Korean Language gives awards for papers
  using its AI Malpyeong benchmarks
- Submission deadline is only about four weeks before the conference and was extended by 3 to 7 days every year
  from 2023 to 2026
