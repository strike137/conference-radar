notes:
- One-day conference on cryptography for finance, payments, blockchain and digital currencies, jointly run by the Bank of Italy and the De Cifris association
- Held at the Bank of Italy conference centre (Centro Convegni Carlo Azeglio Ciampi), Via Nazionale, Rome
- Started as a joint workshop within CIFRIS24 (September 2024); first standalone edition FCiR25 on 1 October 2025
- FCiR25 had a call for papers via EasyChair (LNCS format, regular papers up to 15 pages, short papers up to 8 pages)
- FCiR25 talks appear in draft pre-proceedings, and the site says they will be published in a De Cifris Koine volume and a Journal of Mathematical Cryptology special issue; Koine is not indexed, so marked non-archival here
- FCiR26 (6 October 2026) had a program of invited talks from central banks and academia; no 2026 paper call appears on the site
- Not listed in ICORE2026 and not on the CCF list (unrelated to the CORE A conference FC)
