notes:
- 2026 edition organized by the Soft Computing Research Society (SCRS, New Delhi) with the International Auditors for Digital and Data Management Association (IADD), Bangkok; 2027 edition organized by Walailak University with IADD, SCRS as technical sponsor
- After-conference proceedings in Springer Lecture Notes in Networks and Systems (LNNS) since 2026; the 2024 and 2025 editions went to the Springer series Studies in Smart Technologies
- Held at Babu Banarasi Das University, Lucknow, India in 2024 and 2025, then in Bangkok, Thailand in 2026 and 2027
- 4th edition in January 2027; submission via Microsoft CMT
- High-volume event; not listed in CORE ICORE2026 and not on the CCF list
