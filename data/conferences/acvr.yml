id: acvr
name: ACVR
full_name: International Workshop on Assistive Computer Vision and Robotics
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizers led by University of Catania (Farinella, Furnari, Ragusa) with CNR ISASI, USC and UC San Diego
organizer_country: [europe, usa]
proceedings: ICCV Workshops proceedings (IEEE Xplore, CVF Open Access) or ECCV Workshops proceedings (Springer LNCS)
archival: true
typical:
  deadline_months: [6, 7]
  conference_months: [9, 10]
links:
  website: https://iplab.dmi.unict.it/acvr2026/
notes:
- Workshop on computer vision and robotics for assistive technologies (wearable and egocentric vision, healthcare, ageing, visually impaired users)
- Held every year since 2013, alternating between ICCV and ECCV (first edition with ICIAP 2013); 2026 is the 14th edition
- Full papers are double-blind, three reviewers each, length as the host conference (8 pages for ICCV 2025, 14 pages for ECCV 2026)
- Accepted full papers go into the host conference workshop proceedings; abstracts and doctoral consortium papers are not published
- Includes a doctoral consortium with a best student presentation award
- Not listed in ICORE2026 or the CCF list
