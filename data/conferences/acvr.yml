id: acvr
name: ACVR
full_name: International Workshop on Assistive Computer Vision and Robotics
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop organizers from the University of Catania, CNR-ISASI, USC and UC San Diego; co-located with ICCV or ECCV
organizer_country: [europe, usa]
proceedings: ICCV Workshops proceedings (CVF Open Access and IEEE Xplore) or ECCV Workshops proceedings (Springer)
archival: true
typical:
  deadline_months: [6, 7]
  conference_months: [9, 10]
links:
  website: https://iplab.dmi.unict.it/acvr2026/
notes:
- Workshop on computer vision and robotics for assistive technologies, held with ICCV or ECCV every year since 2014 (first edition with ICIAP 2013)
- Run by the IPLab group of the University of Catania with co-organizers from CNR and US universities
- Double-blind review by three reviewers; accepted full papers appear in the ICCV or ECCV workshop proceedings
- 2026 full papers up to 14 pages in ECCV format via OpenReview; 2025 papers up to 8 pages in ICCV format via CMT
- Also takes non-archival abstracts on published or ongoing work and hosts a doctoral consortium
- Not listed in ICORE2026 or the CCF list
