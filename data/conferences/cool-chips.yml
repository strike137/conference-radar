id: cool-chips
name: COOL Chips
full_name: IEEE Symposium on Low-Power and High-Speed Chips and Systems
type: conference
tier: minor
areas: [systems, general]
region: japan
language: english
frequency: annual
organizer: Technical Committees on Microprocessors and Microcomputers and on Computer Architecture of the IEEE Computer
  Society, in cooperation with the IEICE Electronics Society and IPSJ; Japan-based steering and organizing committees
organizer_country: [japan]
proceedings: IEEE Xplore
indexing: [IEEE Xplore]
fee: 48,000 JPY member early, 16,000 JPY student member early, 60,000 JPY non-member early (2026); free onsite option
  for non-author students without banquet and proceedings
typical:
  deadline_months: [2]
  conference_months: [4]
links:
  website: https://www.coolchips.org/2027/
notes:
- International symposium on low-power and high-speed microprocessors, chips and systems, started in 1998; 30th edition
  in 2027
- Sponsored by IEEE Computer Society technical committees, in cooperation with IEICE Electronics Society and IPSJ;
  steering and organizing committees are mostly Japanese academia and industry
- Held in April in Tokyo in recent years (2021 online, 2022 hybrid)
- Full paper (up to 6 pages) or extended abstract (up to 3 pages) submissions; one-page poster abstracts with a
  Lightning Talk session
- All papers published in IEEE Xplore; selected papers invited to IEEE Micro and a special section of IEICE
  Transactions on Electronics
- Keynotes include industry speakers (for example Fujitsu and SK hynix in 2026)
- Not listed in ICORE2026
