  website: https://sites.google.com/cs.stonybrook.edu/wnu2025
notes:
- Workshop on computational models of narrative (stories, characters, plot, causal and event structure, narrative
  generation and evaluation with LLMs)
- Held since 2019; follows its host conference (ACL 2023 Toronto, EMNLP 2024 Miami, NAACL 2025 Albuquerque);
  2020 edition online and joint with the Storylines and Events workshop; 2021 edition online
- Archival papers in the ACL Anthology (9 papers in 2025, 9 in 2024, 13 in 2023)
- 4 to 8 page papers, double-blind; authors choose archival or non-archival (default non-archival); non-archival papers
  may be previously published or under review elsewhere; ARR pre-reviewed papers accepted
- Not ranked in ICORE2026 and not on the CCF list
