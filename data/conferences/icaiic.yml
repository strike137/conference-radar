notes:
- Organized by KICS (Korean Institute of Communications and Information Sciences) AI Society with a Japanese host
  university; technical co-sponsorship from IEEE ComSoc and IEICE societies
- Proceedings in IEEE Xplore (also submitted to Scopus and EI); 6-page full or 3-page short papers via EDAS; virtual
  presentation allowed
- 'Mostly held in Japan: 2024 Osaka, 2025 Fukuoka, 2026 Tokyo, 2027 Osaka (earlier: 2019 Okinawa, 2020 Fukuoka,
  2021 and 2022 Jeju, 2023 Bali)'
- 'Large program: 291 papers accepted in 2026 (216 oral, 75 poster; submission count not published)'
- 'Lab view: international conference mostly in name, acceptance rate believed to be 60% or higher; note the 2027
  deadline moved earlier to mid October'
