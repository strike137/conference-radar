notes:
- Workshop on efficient machine learning, ML hardware and sustainable AI computing; 12th edition in 2027
- Host conference changes; ASPLOS 2026 (Pittsburgh), HPCA 2025 (Las Vegas), ASPLOS 2024 (San Diego), AAAI 2023 (Washington DC), AAAI 2027 (Montreal)
- Peer-reviewed papers, including work in progress; proceedings published independently through IEEE CPS and listed in IEEE Xplore
- Runs an EMC2 competition alongside the workshop (Speculative Decoding Championship in 2027)
- Follows the formatting and duplicate submission rules of the host conference
- Not listed in CORE ICORE2026
