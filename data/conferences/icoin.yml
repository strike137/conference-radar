notes:
- Organized by KIISE (Korea); runs since 1986 (started as the Joint Workshop on Computer Communication)
- Held every January, since 2023 in Southeast Asia (Bangkok 2023, Ho Chi Minh City 2024, Chiang Mai 2025, Hanoi
  2026, Nha Trang 2027)
- Full (5 to 6 pages) and short (3 to 4 pages) papers go to IEEE Xplore; 1 to 2 page abstract papers are presented
  but not in Xplore
- Deadline in September with one or more extensions
- Not ranked by CORE itself; CORE's B entry 'AINA (was ICOIN)' belongs to a separate conference series
