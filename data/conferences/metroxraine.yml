id: metroxraine
name: IEEE MetroXRAINE
full_name: IEEE International Conference on Metrology for eXtended Reality, Artificial Intelligence and Neural Engineering
type: conference
tier: minor
areas: [ai, general]
region: europe
language: english
frequency: annual
organizer: Italian measurement researchers (University of Naples Federico II and others) with IEEE Instrumentation
  and Measurement Society sponsorship; run by Athena Consulting
organizer_country: [europe]
proceedings: IEEE Xplore
archival: true
fee: 520 EUR IEEE member, 660 EUR non-member, 350 to 410 EUR student non-author (2026, advance)
typical:
  deadline_months: [4, 6]
  conference_months: [10]
links:
  website: https://metroxraine.org/
notes:
- Measurement-oriented conference on extended reality, brain-computer interfaces and AI, held since 2022
- Held in Italy (2022 Rome, 2023 Milan, 2025 Ancona), 2024 St Albans (UK), 2026 Chemnitz (Germany)
- Two-step submission; short abstract (hard deadline) first, then a full paper
- Accepted and presented papers are submitted to IEEE Xplore; extended versions invited to journal special issues
  (IOP MST, MDPI Sensors, Instruments and AI in 2026)
- Same organizing company (Athena Consulting) as the other IEEE Metro workshops
- Not listed in ICORE2026 or the CCF 2026 list
