full_name: Machine Learning in Computational Biology
type: conference
tier: minor
areas: [ai, data]
region: north-america
language: english
frequency: annual
organizer: MLCB Organizing Committee
organizer_country: [usa]
proceedings: PMLR
archival: true
typical:
  deadline_months: [6, 7]
  conference_months: [9, 11]
links:
  website: https://www.mlcb.org/
notes:
- Started as a NeurIPS workshop (2004 to 2017); independent conference since 2019
- Run by US academics (Columbia/NY Genome Center, Cold Spring Harbor Laboratory, University of Washington, UC Davis,
  Stanford)
- Two tracks; 8-page full papers can opt in to PMLR proceedings, 2-page abstracts are poster only and non-archival
- Single-blind review; author response only for PMLR opt-in papers
- Virtual 2020 to 2022, Seattle 2023 and 2024, New York Genome Center 2025 and 2026; hybrid with a YouTube stream
- Not listed in ICORE2026 or the CCF list
