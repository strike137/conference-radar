id: aiha
name: AIHA
full_name: International Workshop on Artificial Intelligence for Healthcare Applications
type: workshop
tier: minor
areas: [ai, vision]
region: worldwide
language: english
frequency: biennial
organizer: University of Cassino and Southern Lazio and Kore University of Enna; co-located with ICPR
organizer_country: [europe]
proceedings: Springer LNCS (ICPR Workshops proceedings)
archival: true
typical:
  deadline_months: [5, 8]
  conference_months: [8, 12]
links:
  website: https://aida.unicas.it/AIHA2026/
notes:
- ICPR workshop on AI and machine learning for medicine (biomedical images, diagnosis support, rehabilitation, gait and handwriting analysis)
- Chairs from the University of Cassino and Southern Lazio and Kore University of Enna, Italy
- Held with every ICPR since 2020 (Milan, held January 2021), then Montreal 2022, Kolkata 2024 and Lyon 2026 (4th edition)
- Papers up to 15 pages in LNCS format (extra pages 150 EUR each), double-blind review through Microsoft CMT
- Only papers longer than 6 pages go into the ICPR Workshops proceedings in Springer LNCS
- At least one author must register for ICPR and present in person
- Not listed in ICORE2026 or the CCF list
