notes:
- Practitioner cybersecurity event at the Von Braun Center in Huntsville, Alabama, with government, industry and
  academic attendees
- Hosted by the North Alabama Chapter of the Information Systems Security Association and Cyber Huntsville; event
  management by eventPower
- Multi-track program (5 tracks on technical, organizational and research topics), hands-on training courses and an
  exhibit hall; over 1900 participants expected
- Speakers apply through a call for presenters; no published proceedings
- An earlier research track had post-proceedings in Springer AISC/LNNS (2019 to 2021 editions); the current call for
  presenters does not mention papers or proceedings
- Not listed in the CORE ICORE2026 portal
