notes:
- First edition in 2026 as a half-day workshop co-located with ACM AsiaCCS in Bengaluru, India
- 'Human-centered and usable security and privacy in Asian contexts: shared devices, national ID and biometrics,
  multilingual users, affordability'
- Accepts position papers (1 to 2 pages) and short WiP papers (4 to 6 pages) in ACM sigconf format; 5 papers presented
  in 2026, published in the ACM DL as workshop proceedings
- Attendance requires AsiaCCS registration (workshop-only option available)
- Program committee includes NII (Japan); the 2026 deadline was extended from January 20 to February 28
