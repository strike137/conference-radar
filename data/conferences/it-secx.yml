notes:
- Annual one-day IT security conference hosted by USTP, University of Applied Sciences St. Polten, Austria
- Brings together researchers, companies, students and practitioners; talks in parallel tracks plus exhibition stands
- Talks and no formal proceedings; selected videos and slides are posted in the online archive
- Site is bilingual German and English; the 2026 keynote was given in German
- About 700 participants in 2026
- Always held on a Friday in early or mid October at the St. Polten campus (2022 to 2026)
- 20th edition planned for 2027; call for contributions announced for spring 2027
- Not listed in ICORE2026
