links:
  website: https://sicefes26.sice.jp/
notes:
- International annual conference of SICE, the Japanese society of instrument and control engineers;
  held as part of SICE Festival with Annual Conference (SICE FES) since 2024
- Regular papers 4 to 8 pages for review (6 pages normal final length) are submitted for inclusion in IEEE Xplore;
  position papers (2 to 4 pages) and late breaking posters are not
- Submission via PaperCept; in-person presentation expected
- Mostly held in Japan (Tokyo 2021, Kumamoto 2022, Tsu 2023, Kochi 2024, Yokohama 2026); 2025 edition in Chiang Mai,
  Thailand
- Not listed in the CORE portal (ICORE2026)
