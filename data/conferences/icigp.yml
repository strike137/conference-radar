id: icigp
name: ICIGP
full_name: International Conference on Image and Graphics Processing
type: conference
tier: minor
areas: [vision]
region: china
language: english
frequency: annual
organizer: Host university that changes each year (Shenzhen University with IEEE as co-sponsor in 2027) with a
  conference secretariat
organizer_country: [china]
proceedings: IEEE Xplore
archival: true
indexing: [EI, Scopus]
fee: 500 USD / 3500 CNY regular author (2027, early bird before September 20, 2026; 550 USD after)
typical:
  deadline_months: [11]
  conference_months: [1, 3]
links:
  website: http://www.icigp.org/
notes:
- Smaller commercially organized conference series started in 2018, with a different host university each year
- Not the same venue as ICIG (International Conference on Image and Graphics)
- ICIGP 2026 proceedings in IEEE Xplore; 2018 to 2024 proceedings in ACM DL; all listed as indexed in Ei
  Compendex and Scopus
- ICIGP 2027 proceedings are to be submitted to IEEE Xplore; selected papers invited to IET Image Processing
- Held in China, mostly in January (Beijing 2024, Macau 2025, Wuhan in March 2026, Shenzhen 2027); online 2021 to 2023
- Registration covers papers up to 6 pages, extra pages 60 USD each
- Not listed in the CORE portal (ICORE2026) or the CCF list
