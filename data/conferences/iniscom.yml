id: iniscom
name: INISCOM
full_name: EAI International Conference on Industrial Networks and Intelligent Systems
type: conference
tier: minor
areas: [communications, networking, ai]
region: southeast-asia
language: english
frequency: annual
organizer: EAI (European Alliance for Innovation), with Vietnamese host universities (2026 and 2027 local host Duy
  Tan University)
organizer_country: [europe, vietnam]
proceedings: Springer LNICST
indexing: [Scopus, EI Compendex, Web of Science, DBLP]
acceptance_rate: 37% (2026, 17/46)
fee: 589 USD early author registration for EAI members (membership is free), 736 USD non-member (2026)
typical:
  deadline_months: [9, 10]
  conference_months: [1, 2]
links:
  website: https://iniscom.eai-conferences.org/2027/
notes:
- EAI-sponsored conference on 6G, industrial IoT, digital twins and AI for networks
- First edition 2016 in Leicester, UK; every edition since 2017 with a listed location was held in Vietnam (Ho Chi
  Minh City, Hanoi, Da Nang)
- Hybrid format with online presentation option; registration fee is the same for onsite and online
- Proceedings in Springer LNICST (2026 edition is LNICST volume 724); selected papers invited to the Springer MONET
  journal and EAI Endorsed Transactions
- Main track plus a later late track; the 2027 main track deadline was extended
- Not found in the ICORE2026 CORE list; minor venue
