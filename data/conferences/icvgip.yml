id: icvgip
name: ICVGIP
full_name: Indian Conference on Computer Vision, Graphics and Image Processing
type: conference
tier: minor
areas: [vision, ai]
region: south-asia
language: english
frequency: annual
organizer: IUPRAI (Indian Unit for Pattern Recognition and Artificial Intelligence, the IAPR affiliate for India)
  with a host institute (ISI Kolkata and TCG CREST in 2026)
organizer_country: [india]
proceedings: ACM DL (ACM ICPS)
archival: true
indexing: [ACM DL, DBLP]
rank:
  core: Unranked
fee: About 390 USD foreign faculty, 260 USD foreign student (student rate includes accommodation); INR 9,440 Indian
  faculty (2025, early, incl. GST)
typical:
  deadline_months: [7, 8]
  conference_months: [12]
links:
  website: https://icvgip.in/
  dblp: https://dblp.org/db/conf/icvgip/
notes:
- Flagship conference of IUPRAI (India's IAPR affiliate); held in India, host institute changes each year
- Biennial from 1998 until 2021, annual since 2022
- Proceedings in ACM ICPS (open access; APC may apply unless an author's institution is in ACM Open, organizers
  aim to waive it)
- Double-blind review, 8 pages plus references, with a rebuttal phase; submissions via OpenReview in 2026
- 2025 edition also had a Vision India session for re-presenting top-venue papers by India-based authors, tiny papers,
  workshops and tutorials
