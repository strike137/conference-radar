notes:
- Annual practitioner conference for malware, forensics, incident response and threat-intelligence analysts, run
  by JPCERT/CC in Tokyo every January since 2018 (2027 is the 10th)
- Two CFP rounds (first closes late September, second mid-November); talks of 20 or 40 minutes and hands-on workshops
  of 120 or 240 minutes; 2027 adds an AI and IR topic
- Japanese or English, with simultaneous interpretation; dedicated first-timer slots, and rejected proposals may
  get a lightning talk
- Free to attend but in person only with limited seats; overseas speakers receive 1,700 USD (after tax) including
  travel support
- 'Venue: Akasaka Intercity Conference, Tokyo; slides published with speaker consent'
