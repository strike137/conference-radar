id: chiuxid
name: CHIuXiD
full_name: International HCI and UX Conference in Indonesia
type: conference
tier: minor
areas: [general]
region: southeast-asia
language: english
frequency: annual
organizer: Perkumpulan Interaksi Digital Indonesia (Indonesia ACM SIGCHI Chapter)
organizer_country: [indonesia]
proceedings: IEEE Xplore
archival: true
fee: 400 USD early bird, 500 USD regular for international paper presenters; 250 / 320 USD students (2026)
typical:
  deadline_months: [8, 9]
  conference_months: [12]
links:
  website: https://chiuxid.org/
notes:
- Run by Perkumpulan Interaksi Digital Indonesia, the Indonesia ACM SIGCHI Chapter; committee led by Bina Nusantara
  University and IPB University; 2026 is the 12th edition
- Proceedings in the ACM DL for 2015 to 2020 and in IEEE Xplore since 2021; papers not presented are excluded from
  IEEE Xplore
- HCI and UX in Southeast Asia, with paper sessions, workshops and posters; full papers of 4 to 6 pages
- Submission in batches with extensions (2026 first batch August 1, last batch September 20)
- 2026 edition is hybrid at 101 Style hotel, Malioboro, Yogyakarta; onsite international registration includes two
  hotel nights; 20% discount for IEEE and IndoCEISS members
