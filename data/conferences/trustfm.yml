notes:
- Half-day workshop at The Web Conference 2026 on trustworthiness of foundation models (fairness, robustness, interpretability) from a causal reasoning perspective
- Also called CausalTFM on its site
- Papers of at least 4 pages in ACM format, double-blind review on OpenReview
- Fast-track window for papers not accepted to the WWW 2026 main conference
- Accepted papers appear in The Web Conference 2026 Companion Proceedings in the ACM Digital Library
- Outstanding Paper and Outstanding Student Paper awards, plus a Rising Star Award for early-career researchers
- Not listed in the CORE ICORE2026 portal
