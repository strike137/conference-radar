notes:
- Technical blockchain conference established in 2016 (as the Stanford Blockchain Conference), bringing together researchers and practitioners
- Topics include consensus and distributed systems, cryptography, zero knowledge proofs, privacy, MEV, cryptoeconomics and formal methods
- Co-organized by the Stanford Center for Blockchain Research and IC3, with UC Berkeley RDI in 2023 to 2025
- Non-archival with no proceedings; work published or submitted elsewhere may be presented
- Talk submissions via HotCRP as technical papers, work in progress (WIP) or SoK
- Usually held at Stanford (Berkeley in 2025, Columbia University, New York in 2024)
- Attendance is free with registration; talks are live streamed and recorded
- Several affiliated workshops run around the main conference (DAO, MEV, BASS and others)
