notes:
- Organized by ACM SIGCOMM; single-track conference held every December
- Accepted papers appear in the journal Proceedings of the ACM on Networking (PACMNET)
- Two submission cycles (December and June, AoE) with one-shot major revision; double-anonymous review; long (16
  pages) and short papers
- CoNEXT 2025 was at HKUST, Hong Kong; 2026 Utrecht; 2027 planned for Rio de Janeiro
