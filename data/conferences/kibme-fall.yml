notes:
- Domestic fall conference of KIBME, the Korean society for broadcast and media engineering
- Held in the COEX conference rooms in Seoul in November (2024, 2025, 2026)
- Broadcast and media topics, including multimedia communication, video coding, AR/VR, holography, deep learning based image processing and media security
- Papers of 2 to 4 pages in Korean or English, submitted through the KIBME site; non-members may submit
- Selected papers are recommended for priority review in the KIBME journal (방송공학회논문지) and a best student paper award is given
- Includes an undergraduate paper and capstone design contest and special sessions (oral only)
- 2026 edition runs alongside the RAPA radio and broadcasting industry promotion week
- KIBME also holds a Summer conference (June, Jeju) and a Winter conference
- Not listed in ICORE2026 or the CCF list
