notes:
- Workshop on NLP and speech processing for code-switched (mixed-language) text and speech
- Seventh edition at NAACL 2025 in Albuquerque, USA, on May 3, 2025; sixth at EMNLP 2023 in Singapore
- Irregular schedule (first held in 2014 at EMNLP; later editions 2016, 2018, 2020, 2021, 2023, 2025); 2020 edition planned with LREC in Marseille
- Long papers up to 8 pages and short papers up to 4 pages; double-blind review
- Only regular papers go into the proceedings; 2-page non-archival papers and cross-submissions are presented but not published
- Proceedings in the ACL Anthology (7 papers in 2025, 9 in 2023)
- Runs a shared task (code-switched text generation preferences in 2025)
- Not listed in ICORE2026 and not on the CCF list
