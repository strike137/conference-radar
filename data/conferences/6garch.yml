notes:
- Workshop on 6G system architecture (AI-native and cloud-native networks, ISAC, compute-connectivity convergence,
  NTN, security, sustainability, standardization)
- Organised by the European SNS JU 6G Architecture Working Group (successor of the 5G PPP Architecture WG)
- 4th edition at IEEE GLOBECOM 2024 (Cape Town), 5th at IEEE ICC 2026 (Glasgow); not in the GLOBECOM 2025 or ICC
  2025 workshop lists
- Workshop papers go into the ICC or GLOBECOM proceedings and IEEE Xplore; no-show papers are removed
- Not listed in ICORE2026 or in the CCF 2026 list
