id: swat4hcls
name: SWAT4HCLS
full_name: International Conference on Semantic Web Applications and Tools for Health Care and Life Sciences
type: conference
tier: minor
areas: [data, ai]
region: europe
language: english
frequency: annual
organizer: SWAT4HCLS organizers (community-run)
organizer_country: [europe]
proceedings: CEUR-WS (CEUR Workshop Proceedings)
archival: true
typical:
  deadline_months: [9, 12]
  conference_months: [2, 3]
links:
  website: https://www.swat4ls.org/
notes:
- Semantic web, knowledge graphs, ontologies and FAIR data for health care and life sciences, held since 2008 (formerly SWAT4LS)
- Always held in Europe (Leiden 2024, Barcelona 2025, Amsterdam 2026, Basel 2027)
- Four days with a tutorial day, the main conference and a biohackathon
- Long papers (at least 10 pages), short papers (at least 5 pages), posters and demos (at least 2 pages), CEURART 1-column style
- Papers are reviewed by at least three PC members and published in CEUR Workshop Proceedings (CC BY 4.0); posters go to PUBLISSO FRL with a DOI
- Accepted contributions (2027) are invited to an extended-version special issue or collection in the Journal of Biomedical Semantics
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
