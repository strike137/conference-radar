notes:
- Organized by INSTICC; formerly ICE-B (International Conference on e-Business); 2027 is the 24th edition
- Proceedings published by Springer in a CCIS book; 2026 papers also in the SCITEPRESS Digital Library
- Business-oriented scope with technical tracks on AI and decision intelligence, FinTech, blockchain and digital trust
- Not listed in the ICORE2026 CORE ranking
- 'Two submission stages: regular papers in stage 1, regular or position papers in stage 2 (earlier stage gives earlier notification)'
- Held in Europe every year, co-located with SECRYPT, QUANTICS, SIMULTECH and ABH (2027); one registration covers them as a non-speaker
- Locations (Dijon 2024, Bilbao 2025, Porto 2026, Rome 2027)
