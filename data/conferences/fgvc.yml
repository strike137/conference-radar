notes:
- Long-running workshop co-located with CVPR since 2011, annual since 2017; 2026 was the 13th edition
- Three tracks; 8-page proceedings track in the CVPR Workshops proceedings, 4-page non-archival extended abstracts, and a nectar track for already published work
- Hosts a set of fine-grained recognition competitions alongside the paper tracks
- Double-blind review via CMT, but dataset papers may be submitted de-anonymized
- All deadlines are 23:59 Pacific Time
- Each proceedings paper needs a full in-person CVPR registration
- Not listed in ICORE2026 or the CCF list
