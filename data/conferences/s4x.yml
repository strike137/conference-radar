notes:
- Large ICS and OT security practitioner conference run by S4 Events Inc.; over 1,000 attendees
- Long held in Miami South Beach; S4x27 moves to the JW Marriott Tampa Water Street, Tampa, Florida
- Call for presentations open from mid June to the end of August; a short proposal of two to four paragraphs is enough
- No proceedings; session videos are released after the event
- Tiered ticket pricing; the cheapest S4x27 ticket was 1,695 USD plus tax
