notes:
- Largest national NLP conference in China, organized by CIPS; accepts both Chinese and English papers
- Double-blind review, up to 10 pages of body text; fast-track for ARR papers with meta-review of 2.5 or higher;
  parallel submission allowed if the other venue permits it
- '2026: accepted English papers go to the Data Intelligence journal (APC 8000 CNY); in 2025 they were in Springer
  LNAI and the ACL Anthology'
- Includes technical evaluations (shared tasks) and tutorials; location changes each year within China
