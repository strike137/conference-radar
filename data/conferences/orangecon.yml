notes:
- Community driven, non-profit Dutch cybersecurity conference in Amsterdam, run by the foundation Stichting OCON
- One conference day with 30-minute talks and hands-on workshops, preceded by 2 to 3 day paid trainings
- Talk and workshop proposals via pretalx; the CFP welcomes first-time speakers
- Held in June in 2026 and 2027; the site names the Meervaart theatre in Amsterdam as venue (2027 trainings at Meervaart)
- Talks only, no formal proceedings; talks recorded on YouTube
