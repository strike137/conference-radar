notes:
- Free hacker conference run by volunteers from the 780th MI Brigade for US Cyber Command and DoD cyber personnel
- Attendance open to .gov and .mil addresses; others supporting the USCYBERCOM mission must request approval with a government point of contact
- Started in 2016 as an internal training event at Fort Meade; held in Maryland until 2022 (fully online in 2020), Augusta, Georgia in 2024 and 2025, back in Maryland in 2026 as a hybrid event
- No edition in 2023
- Day one hands-on workshops, day two talks and villages; 2026 tracks were drones and ICS, AI and ML, privacy and security
- Calls for presentations, workshops and villages open on the site in November for the following summer
- Talks recorded and posted on DVIDS; no proceedings
- Not listed in CORE ICORE2026
