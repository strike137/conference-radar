notes:
- Enterprise information systems conference run by SciKA; AIS affiliated conference (18th edition in 2026)
- Co-located with the ProjMAN (project management) and HCist (healthcare information systems) conferences
- Full and short papers in Elsevier Procedia Computer Science (Scopus, Web of Science CPCI); poster and industry papers in a book of abstracts with ISBN
- Double-blind review; two calls for papers (the 2026 second-call deadline was extended to 30 September)
- Hybrid in 2026; online presentation possible at a reduced fee
- 2026 edition in Seville, Spain (Barcelo Sevilla Renacimiento)
