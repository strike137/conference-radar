region: china
language: english
frequency: annual
organizer: AEIC (AiScholar, ais.cn) conference service with a host university each year (Harbin Institute of Information Technology in 2025)
organizer_country: [china]
proceedings: IEEE Xplore (2025); SPIE Proceedings (2024)
archival: true
indexing: [EI, Scopus]
