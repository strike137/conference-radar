links:
  website: http://www.icncis.org/
notes:
- Annual since 2021 and held in China (Mianyang 2023, Hangzhou 2024, Harbin 2025)
- Run by a commercial conference service (AEIC/AiScholar) with a different host university each year
- The publisher changes between years; 2023 papers appeared in the CNML 2023 proceedings (ACM ICPS), 2024 in SPIE Proceedings vol. 13516, 2025 with IEEE (catalog CFP254AC)
- ICNCIS 2025 was technically co-sponsored by IEEE ComSoc
- Minimum paper length 4 pages; papers are submitted to EI Compendex and Scopus
- Not listed in CORE ICORE2026 or the CCF list
