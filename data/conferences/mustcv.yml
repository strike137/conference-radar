id: mustcv
name: MUSTCV
full_name: Workshop on Computer Vision for Multimedia Spatial Intelligence through Time
type: workshop
tier: minor
areas: [vision, ai]
region: worldwide
language: english
organizer: Workshop organizing committee led by Giuseppe Serra and colleagues at the University of Udine, with co-organizers from TU Munich, Max Planck ETH Center, Seoul National University, Korea University and others; co-located with ECCV, ICCV or CVPR
organizer_country: [europe]
proceedings: Springer LNCS (ECCV Workshops proceedings); CVF Open Access and IEEE Xplore for CVPR/ICCV editions
archival: true
typical:
  deadline_months: [3, 7]
  conference_months: [6, 9]
links:
  website: https://sites.google.com/view/mustcv-2026/home
notes:
  - Renamed in 2026 from CV4Metaverse (Computer Vision for Metaverse Workshop), which started at ECCV 2022
  - Editions at ECCV 2022 (Tel Aviv), ICCV 2023 (Paris), ECCV 2024 (Milan), CVPR 2025 (Nashville) and ECCV 2026 (Malmo)
  - Topics are 3D/4D scene understanding and generation for AR/VR, spatial computing and immersive multimedia
  - Archival track (up to 14 pages in ECCV LNCS style, double-blind, three reviewers) and non-archival extended abstracts (2 to 4 pages)
  - CVPR 2025 papers appear on CVF Open Access
  - Not listed in ICORE2026 or the CCF list
