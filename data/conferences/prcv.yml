typical:
  deadline_months: [4, 5, 6]
  conference_months: [8, 10]
links:
  website: https://www.prcv.cn/
notes:
- Jointly organized by CAAI, CCF, CAA and CSIG; moves to a different Chinese city each year (2024 Urumqi, 2025 Shanghai,
  2026 Harbin)
- CCF-C; papers must be in English (14 pages LNCS, double-blind) and appear in Springer LNCS, indexed by EI
- 'Very large for a C-ranked venue: 2,370 submissions and 692 accepted (about 29%) in 2025, split over 18 LNCS volumes'
- 'Special session papers go through the same review but have a later deadline than the main track; main deadlines
  are usually extended (2025: Jun 3 -> Jun 30; 2026: Apr 15 -> May 30)'
- Audience is mostly from Chinese universities and industry; registration is paid in CNY
