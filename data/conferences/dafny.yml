notes:
- Called the Dafny Workshop for 2024 to 2026; renamed WAVE for the 4th edition (2027) and now covers all auto-active program verifiers (Dafny, SPARK, F*, Why3, Viper, ...)
- One-day workshop co-located with POPL every January; location follows POPL (London 2024, Denver 2025, Rennes 2026, Mexico City 2027)
- Anonymous extended abstracts of 2 to 6 pages in ACM SIGPLAN acmart format, submitted via HotCRP
- 'Non-archival: no formal proceedings, work published elsewhere may be presented; talks may be recorded and posted'
- Submission deadline is usually extended (2027 -> 7 Oct, extended to 21 Oct, then 28 Oct 2026)
- 2027 program chairs from Harvard and ANSSI; steering committee mostly from Amazon/AWS
- Not listed in CORE ICORE2026; not in the CCF 2026 list
