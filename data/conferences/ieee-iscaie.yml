links:
  website: https://www.ihsanyassin.com/cms/conference.php?conf_short_name=iscaie2027
notes:
- Run by the IEEE Malaysia Industrial Applications / Industrial Electronics Joint Chapter; sister symposium of
  ISWTA, ISIEA and ISCI on the same conference management system
- 2027 is the 17th edition, at Parkroyal Penang, Malaysia
- Accepted papers are submitted to IEEE Xplore; the site links the IEEE Xplore and Scopus records of past
  proceedings
- Double-blind review by at least 3 reviewers; papers with similarity above 30% are not considered
- Hybrid format; virtual presenters upload a pre-recorded YouTube video, and no-show papers are excluded from IEEE
  Xplore
- Broad scope (industrial electronics, AI and machine learning, computer applications, cybersecurity, IoT, power
  electronics)
- Not listed in ICORE2026 and not in the CCF list; a small regional venue
