notes:
- Co-organized by FESB (University of Split) and the Croatian Communications and Information Society, a sister society of IEEE ComSoc; technically co-sponsored by IEEE ComSoc
- Held in September in Split, Croatia (2025 and 2026 editions); 34th edition in 2026
- Broad scope covering communications software, telecommunications, networking, IoT, 5G/6G, AI and security
- Papers 6 pages in IEEE A4 format (one extra page for 70 EUR), submitted via EDAS; published in IEEE Xplore
- Selected best papers invited to the Journal of Communications Software and Systems (JCOMSS)
- One registration covers up to 3 papers
- CORE National Croatia (ICORE2026)
