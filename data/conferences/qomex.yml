notes:
- Main venue for quality of experience (QoE) research on video, audio, immersive media and networked multimedia
- Technically co-sponsored by the IEEE Signal Processing Society; accepted papers are submitted to IEEE Xplore
- CORE B (ICORE2026)
- Full papers up to 6 pages plus 1 page of references; short and demo papers 3 pages plus 1 page of references
- Double-blind review for all papers except dataset papers; separate special sessions, grand challenges and demos
- Mostly held in Europe (Cardiff 2026, Madrid 2025, Karlshamn 2024, Ghent 2023); 2027 is planned for Shanghai and
  2028 for Rome
- Acceptance rate around 50 to 60% in recent years (per qomex.org)
