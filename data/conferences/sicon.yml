notes:
- Workshop on social influence in dialogue (negotiation, persuasion, argumentation, influence strategy detection,
  LLM and multi-agent systems, ethics guardrails)
- Held since 2023; follows its host conference (ACL 2023 Toronto, EMNLP 2024 Miami, ACL 2025 Vienna)
- Archival papers in the ACL Anthology (12 papers in 2025, 11 in 2024, 7 in 2023)
- Archival long (8 pages) and short (4 pages) papers plus non-archival 2-page extended abstracts; double-blind via
  OpenReview; ARR pre-reviewed papers accepted; parallel submission not allowed
- One-day hybrid workshop, mostly poster sessions
- Not ranked in ICORE2026 and not on the CCF list
