notes:
- Non-archival scientific conference on machine learning research and applications run by the non-profit ML in PL
  Association (formerly called PL in ML); held every year since 2017
- Held at the Copernicus Science Centre in Warsaw, Poland; tutorials at the Faculty of Physics, University of Warsaw
- About 700 attendees per year from academia and industry; all talks and materials in English
- Call for Contributions on OpenReview takes an abstract (300-3500 characters) for a talk or poster; 2026 accepted 24
  talks, 82 posters and 10 tutorials
- Includes a Student Research Workshop on the first day; all presenters get free entry
- Invited speakers have included Yoshua Bengio, Kyunghyun Cho, Razvan Pascanu and Petar Velickovic
- "Tickets (2026): 500 PLN student, 1000 PLN regular; early bird tickets need a selective application"
- No papers or post-conference proceedings; must present on-site
- Not listed in the CORE ICORE2026 portal
