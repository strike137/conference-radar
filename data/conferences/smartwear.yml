notes:
- Workshop on wearable hardware, sensing, on-device learning, privacy and user experience, held with ACM MobiCom
- Editions so far are 2022 (Sydney), 2023 (Madrid) and 2025 (Hong Kong); no edition at MobiCom 2024 or 2026
- Papers published in the ACM Digital Library as a separate workshop proceedings volume
- Papers up to 6 pages in two-column 10pt ACM format including references; single-blind review via HotCRP
- 2025 chairs from CUHK, HKUST and TU Delft
- Not listed in ICORE2026 or the CCF 2026 list
