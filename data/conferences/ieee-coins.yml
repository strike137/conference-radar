  conference_months: [9]
links:
  website: https://coinsconf.com/
notes:
- Cross-layer intelligent systems from AI hardware and EDA to edge AI, networking, IoT and applications
- Founded in 2019 (Crete); later editions in Barcelona (2020 virtual), London (2024, King's College London), Madison
  (2025, University of Wisconsin-Madison) and Bologna (2026, University of Bologna)
- Double-blind review; 6-page IEEE papers, up to 2 extra pages at 150 USD per page; short papers of 4 pages
- Papers are published in IEEE Xplore; submission via EasyChair
- Also runs special sessions, workshops, a PhD forum and a contest
- Not listed in ICORE2026 or the CCF list
