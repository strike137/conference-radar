full_name: IEEE International Conference on Omni-Layer Intelligent Systems
type: conference
tier: minor
areas: [systems, ai, networking]
region: europe
language: english
frequency: annual
organizer: IEEE COINS steering committee (co-founders Farshad Firouzi and Krishnendu Chakrabarty)
organizer_country: [international]
proceedings: IEEE Xplore
typical:
