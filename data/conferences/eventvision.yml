links:
  website: https://tub-rip.github.io/eventvision2025/
notes:
- CVPR workshop on event cameras and neuromorphic vision (algorithms, datasets, hardware, applications)
- Held with CVPR in odd years (2019, 2021, 2023, 2025); the 2025 edition was the 5th
- Accepted papers and demo abstracts are published open access by CVF in the CVPR Workshops proceedings
- 36 papers on CVF Open Access for CVPR 2025
- Also takes non-archival courtesy papers already accepted elsewhere, and hosts several challenges (eye tracking, deblurring, SLAM, segmentation)
- Not listed in ICORE2026 or the CCF list
