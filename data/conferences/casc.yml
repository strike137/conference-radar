id: casc
name: CASC
full_name: International Workshop on Computer Algebra in Scientific Computing
type: conference
tier: major
areas: [general]
region: worldwide
language: english
frequency: annual
organizer: CASC Advisory Board and general chairs (University of Lille, Plekhanov Russian University)
organizer_country: [international]
proceedings: Springer LNCS
archival: true
rank:
  core: B
fee: 360 GBP faculty, 320 GBP student (2026)
typical:
  deadline_months: [4, 5]
  conference_months: [8, 9, 11]
links:
  website: https://www.casc-conference.org/
notes:
- Stand-alone annual meeting on symbolic computation, computer algebra systems and their use in scientific computing;
  called a workshop but not co-located with another conference (27th edition in 2025)
- Full papers up to 20 pages (surveys 25) in LNCS style appear in Springer LNCS
- Extended abstract option (2 to 4 pages) is lightly reviewed and only distributed at the conference; authors can later
  submit to a CASC topical collection of the Springer journal Mathematics in Computer Science
- 'Recent hosts: Sochi 2021, Gebze 2022, Havana 2023, Rennes 2024, Dubai 2025, Bath 2026'
- Registration fee covers lunches and an excursion (2026)
- CORE B (ICORE2026); not on the CCF 2026 list
