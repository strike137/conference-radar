notes:
- Also known as the Portuguese Conference on Artificial Intelligence; run since 1985 by APPIA, one of the oldest AI conferences
- Always held in Portugal, hosted by a different university each time (Viana do Castelo 2024, Faro 2025, Funchal 2026)
- Organized around thematic tracks (medicine, law, NLP, knowledge representation, generative AI, ...); papers up to 12 pages in Springer LNAI format
- Double-blind review by at least three PC members; in-person presentation required
- "CORE rank: National: Portugal (ICORE2026)"
- APPIA gives limited travel support to student members; an Advanced School on AI (EAIA) is run alongside
