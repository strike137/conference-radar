id: rage
name: RAGE
full_name: Real-time And intelliGent Edge computing workshop
type: workshop
tier: minor
areas: [systems, networking, ai]
region: worldwide
language: english
frequency: annual
organizer: Workshop steering committee (Scuola Superiore Sant'Anna, Robert Bosch GmbH, KTH); co-located with CPS-IoT Week
organizer_country: [europe]
proceedings: IEEE Xplore or ACM DL (CPS-IoT Week workshop proceedings)
archival: true
typical:
  deadline_months: [1, 2]
  conference_months: [5]
links:
  website: https://rage-workshop.github.io/
notes:
- Workshop on predictable, real-time edge computing and edge AI, including scheduling, middleware (ROS, TensorRT), real-time networking and edge security
- Started with DAC 2022 (San Francisco); held at CPS-IoT Week since 2023 (San Antonio 2023, Hong Kong 2024, Irvine 2025, Saint Malo 2026)
- Solicits work-in-progress papers, peer reviewed by the TPC, with 15 minute talks; full-day format with invited talks and an open discussion
- Papers appear in the CPS-IoT Week workshop proceedings, ACM DL in 2023 and 2025 and IEEE Xplore in 2024 and 2026
- Technically sponsored by the Embedded Systems Special Interest Group (EMSIG), IEEE Future Networks and the EU NANCY project
- Not listed in CORE ICORE2026 and not on the CCF list
