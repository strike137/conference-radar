notes:
- Run by C-MRiC, a UK research centre founded in 2014; formerly the CyberSA (Cyber SA), Cyber Security, Social Media and Cyber Incident conferences
- Proceedings published by IEEE Xplore up to 2021 and by Springer since 2022 (Springer Proceedings in Complexity); papers must be registered and presented to appear
- Blind review; long papers up to 25 pages, short papers up to 14 pages, extended abstracts about 4 to 5 pages; posters are presentation only
- Held in the UK and Ireland, plus Copenhagen in 2023; 2026 and 2027 editions in London as hybrid events
- Not listed in CORE ICORE2026; unrelated to the IEEE Cyber Science and Technology Congress
