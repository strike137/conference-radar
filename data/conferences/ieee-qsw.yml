notes:
- One of six theme conferences of the IEEE World Congress on SERVICES (with CLOUD, EDGE, ICDH, ICWS and SSE), sponsored
  by IEEE and the IEEE Computer Society and supported by the IEEE Technical Community on Services Computing
- 'Software-level quantum computing venue: languages, compilers, verification and testing, hybrid quantum-classical systems, quantum cloud and HPC integration'
- 5th edition in 2026
- 'Rotates worldwide with the congress: Shenzhen (2024), Helsinki (2025), Sydney (2026)'
- Regular papers 7 to 10 pages, short papers 4 to 6 pages, references extra; IEEE two-column format
- Shares one submission deadline with the other SERVICES conferences except ICDH; the 2026 deadline was extended by two weeks
- Not listed in CORE ICORE2026 or the CCF 2026 list
