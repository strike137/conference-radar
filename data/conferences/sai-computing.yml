notes:
- Run by the Science and Information (SAI) Organization, a UK based company that also runs IntelliSys, FTC and FICC
- Annual since 2013 (15th edition in 2027); broad scope covering AI, HPC, quantum, cloud and edge computing
- Held at the Clayton Hotel Chiswick in London since 2023; 2021 and 2022 were virtual events
- Proceedings in Springer Lecture Notes in Networks and Systems (four volumes in 2024 and 2025)
- Double-blind review; the organizer states an acceptance rate of 37 to 39% (39.3% in 2024, 38.6% in 2025, 39.2% in 2026)
- Two submission rounds; papers up to 18 pages plus 7 pages of references and appendices; oral or poster presentation, hybrid participation
- Not listed in the CORE ICORE2026 portal
