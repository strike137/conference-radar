notes:
- Run by the Science and Information (SAI) Organization, a UK based company that also runs IntelliSys, FTC and FICC
- Annual since 2013; held at the Clayton Hotel Chiswick in London every year since 2023 (2021 and 2022 were virtual)
- Proceedings in Springer Lecture Notes in Networks and Systems
- Broad scope covering AI, HPC, quantum, cloud and edge computing, cybersecurity and education
- Double-blind review by at least three PC members; the organizer states an acceptance rate of 37 to 39%
- Two submission rounds with deadlines about seven to eight months before the conference; papers up to 18 pages plus 7 pages of references and appendices
- In person with a virtual presentation option
- Not listed in the CORE ICORE2026 portal
