links:
  website: https://rev-ecit.vn/
notes:
- Annual national scientific conference of the Radio and Electronics Association of Vietnam (REV); 2026 is the 29th
  edition
- Held in Hanoi as a one-day event in December (2019, 2022 to 2025); 2026 is held at the Authority of Radio Frequency
  Management in Hanoi
- Submission via EasyChair; peer reviewed (over 358 reviews for 159 submissions in 2024)
- Accepted papers are presented and published in the conference proceedings
- Tracks cover networks, wireless communications, signal processing, electronics and chips, information security,
  robotics, AI and quantum technology
