full_name: National Conference on Electronics, Communications and Information Technology
name_local: Hội nghị Quốc gia về Điện tử, Truyền thông và Công nghệ Thông tin
type: conference
tier: domestic
areas: [communications, networking, security, ai, general]
region: southeast-asia
frequency: annual
organizer: Radio and Electronics Association of Vietnam (REV), with a host institution each year
organizer_country: [vietnam]
proceedings: REV-ECIT conference proceedings (Kỷ yếu Hội nghị)
acceptance_rate: 80% (2024, 128/159)
typical:
