notes:
- Practitioner and hacker conference in Bengaluru, India, focused on offensive security research; managed by Equifense Technologies
- Editions in 2020, 2021, 2024, 2025 and 2026; two conference days in June plus separate paid trainings
- Call for Papers covers technical talks, Arsenal tool demos and technical workshops; talks reviewed by a review panel
- Also runs the VulnX CTF, villages, CxO panel track and a sponsor exhibition
- No proceedings; talks and slides are posted to the events page and YouTube subject to speaker approval
- 2024 and 2025 held at the National Science Seminar Complex, IISc; 2026 at the NIMHANS Convention Centre
- Not found in ICORE2026
