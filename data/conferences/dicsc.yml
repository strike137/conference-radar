notes:
- Workshop series on space-air-ground integrated networks (SAGIN) for 6G that moves between host conferences
- 3rd edition at ICCCN 2025 (Tokyo), 5th at ICCCN 2026 (Honolulu), 6th at IEEE MSN 2026 (Ningbo)
- Papers limited to 6 pages; ICCCN workshop papers go into the ICCCN proceedings in IEEE Xplore, and papers not presented onsite are left out of the digital library
- Submission through the host conference EasyChair site; deadlines follow the host workshop schedule
- Selected papers from the ICCCN 2026 edition are invited to a special issue of the International Journal of Networked and Distributed Computing
