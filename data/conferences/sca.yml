notes:
- Premier specialist forum for computer animation and simulation (physics, fluids, cloth, characters, motion learning), single track
- Joint ACM SIGGRAPH and Eurographics symposium; accepted full papers are published in the journal Computer Graphics Forum
- Two-cycle review with a rebuttal; dual-anonymous, no strict page limit (about 10 pages recommended)
- Poster abstracts (2 pages, single-blind) appear in the Eurographics Digital Library
- Rotates worldwide (Durham 2022, Los Angeles 2023, Montreal 2024, Vancouver 2025, Barcelona 2026); online 2020 and 2021
- ICORE2026 rank B; CCF B (computer graphics and multimedia)
- Not to be confused with SupercomputingAsia (also abbreviated SCA)
