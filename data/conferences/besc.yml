notes:
- Interdisciplinary conference on behavioural and social computing, computational social science, NLP and AI
- Held since 2014, mostly in East Asia but also in Europe and the Middle East (2021 Doha, 2022 Ehime, 2023 Larnaca, 2024 Harbin, 2025 Hong Kong, 2026 Bangkok)
- 2026 proceedings in Springer LNCS (three volumes, LNCS 17175 onward); 2025 papers went to IEEE
- Main track papers up to 20 pages in LNCS format, double-blind review
- Tracks for interdisciplinary, industry and demo papers, extended abstracts, special sessions and workshops
- Deadlines are usually extended (2026 main deadline extended to June 15)
- Not on the CORE portal (ICORE2026) or the CCF 2026 list
