notes:
- Software engineering for AI systems (AI engineering); co-located with ICSE every year and moves with it
- Papers appear in the ICSE Co-located Event Proceedings in the IEEE and ACM digital libraries
- "Full papers 10 pages plus 2 of references; short papers 5 pages plus references"
- Double-anonymous review with three reviews per paper; firm deadline with no extensions
- Also has industry, journal-first, doctoral symposium and poster tracks
- 2026 edition was the 5th (Rio de Janeiro, with ICSE 2026); 2027 is the 6th (Dublin, with ICSE 2027)
- At least one author must register and present in person
