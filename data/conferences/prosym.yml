notes:
- Annual winter symposium on programming held since 1960, part of IPSJ since 1984; the January 2027 edition is the 68th
- Retreat-style (gasshuku) meeting at a resort hotel over three days in early January, hybrid with Zoom and Slack;
  Hotel Laforet Nasu since 2025, Laforet Shuzenji in 2023 and 2024, Laforet Ito until 2020
- Long Q&A by design; general talks are 40 min (25 min talk plus 15 min discussion) with a paper of about 8 pages
- Casual oral talks (paper optional, 2 to 4 pages) and on-site poster and demo presentations (2 to 4 pages)
- Acceptance decided by the organizing committee from a title and a 400-character abstract; optional comment
  feedback on papers for students is explicitly not peer review
- Topics range from programming language theory and implementation, OS and HPC to programming education, games,
  and AI and programming; Yamauchi Encouragement Award for outstanding talks
- Lower "young" (under 32) and student rates
