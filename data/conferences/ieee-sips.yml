notes:
- IEEE workshop on design and implementation of signal processing systems (hardware and software implementation, ML
  for signal processing, design methods, application systems)
- Technical sponsorship by IEEE SPS and IEEE CAS (logos on the 2026 sponsors page)
- Papers up to 6 pages including references, single-blind review via EDAS; camera-ready through IEEE PDF eXpress
- Accepted papers need one full-rate author registration; papers not presented may be excluded from IEEE Xplore
- Separate calls for special sessions, demos and tutorials
- 2026 edition held at ENSEIRB-MATMECA on the Bordeaux university campus in Talence, France
- Not listed in the CORE ICORE2026 rankings
