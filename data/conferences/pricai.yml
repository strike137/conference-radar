notes:
- Held every two years until 2018 and annually since 2019, rotating around the Pacific Rim (2024 Kyoto, 2025 Wellington,
  2026 Guangzhou)
- Proceedings in Springer LNAI; long papers 12-16 pages, short papers 6-11 pages (2026)
- Double-anonymous review via EasyChair; authors may be drafted into the reviewer pool
- Deadline is usually mid June with a two-week extension; 2026 offers student scholarships as registration fee waivers
  for first-author students
- 2025 edition was co-located with IVCNZ 2025
