notes:
- International conference of the China Society of Image and Graphics on image, video and graphics processing,
  computer vision and related AI
- Biennial in odd years up to 2025 (2019 Beijing, 2021 Haikou, 2023 Nanjing, 2025 Xuzhou), then a 14th edition in
  2026 in Singapore
- CCF C; full papers of 10 to 12 pages in Springer LNCS format including references, double-blind review via
  Microsoft CMT; proceedings in Springer LNCS
- ICIG 2025 accepted 138 of 420 submissions (about 33%) in three LNCS volumes
- Selected papers recommended to journals such as Pattern Recognition Letters, Signal Processing Letters and
  Multimedia Systems; paper deadlines are usually extended by two to three weeks
