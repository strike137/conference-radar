notes:
- Flagship machine learning venue together with ICML and ICLR; CCF A, CORE A*
- Double-blind review on OpenReview; main track acceptance has stayed around 25% for years
- 'Multi-site since 2025: San Diego plus Mexico City (2025); Sydney as main venue with satellites in Atlanta and
  Paris (2026); 2027 announced for Europe, 2028 for the Western United States'
- Abstract deadline in early May, full paper a few days later; notification in late September
- Also runs a Datasets and Benchmarks track and (since 2025) a position paper track
