id: splu-robonlp
name: SpLU-RoboNLP
full_name: International Combined Workshop on Spatial Language Understanding and Grounded Communication for Robotics
type: workshop
tier: minor
areas: [nlp, ai]
region: worldwide
language: english
frequency: irregular
organizer: Workshop organizing committee (2024 organizers from Michigan State University, UC Santa Cruz, University of Michigan
  and Northeastern University); co-located with ACL-family conferences
organizer_country: [usa]
proceedings: ACL Anthology
archival: true
indexing: [ACL Anthology]
typical:
  deadline_months: [5, 9]
  conference_months: [8, 12]
links:
  website: https://splu-robonlp-2024.github.io/
notes:
- Workshop on spatial language understanding, language grounding, situated dialogue and natural language communication with
  robots and embodied agents
- Merger of the SpLU and RoboNLP workshops; earlier editions RoboNLP 2017 (ACL), SpLU 2018 (NAACL), SpLU-RoboNLP 2019 (NAACL),
  SpLU 2020 (EMNLP), SpLU-RoboNLP 2021 (ACL), 2023 (EMNLP, Singapore) and 2024 (ACL, Bangkok)
- Long papers up to 8 pages and short papers up to 4 pages in ACL format, double-blind review on OpenReview
- Archival papers go to the ACL Anthology (3 papers in 2024, 1 in 2023, 9 in 2021); a non-archival track allows dual
  submission
- Not ranked in ICORE2026 and not on the CCF list
