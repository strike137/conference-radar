notes:
- Workshop on vulnerabilities of generative systems used for IR (black-hat SEO, prompt injection, adversarial attacks, bias, misinformation, harm to users)
- First edition (VulGen'26) is a full-day workshop at ACM SIGIR 2026, Melbourne Convention and Exhibition Centre, July 24, 2026
- Extended abstracts of 2 pages plus references in the ACM SIGIR format, not anonymized (single-blind), submitted via EasyChair
- Non-archival; accepted PDFs are hosted on the workshop website and authors are encouraged to post them on arXiv
- In-person attendance required
- 8 accepted extended abstracts listed for 2026; joint panel session with the JEDI workshop
- Supported by the ARC Centre of Excellence for Automated Decision-Making and Society (ADM+S)
- Only one edition so far
- Not listed in ICORE2026 and not on the CCF list
