notes:
- EAI conference on smart environments, cybersecurity, IoT, critical infrastructure, quantum communication and teletraffic; 2026 is the 10th edition
- Proceedings in Springer LNICST; accepted authors may submit an extended version to Mobile Networks and Applications (MONET) via a fast track
- Co-located with EAI MMS in 2025 and 2026
- Held in Central and Eastern Europe (Bratislava 2023, Zagreb 2024, Stara Lesna 2025, Opatija 2026); online in 2021 and 2022
- Main track and late track with separate deadlines; full papers 12 to 20 pages, short papers 6 to 11 pages; submission via Confy+
- Not listed in ICORE2026
