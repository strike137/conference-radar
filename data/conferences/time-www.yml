notes:
- Workshop at The Web Conference for survey, evaluation and review papers on responsible and trustworthy AI, web mining, graphs, security, privacy and fairness
- Run by a team of mostly Australian universities led from the TIME Lab at Griffith University
- 1st edition at The Web Conference 2025 (Sydney), 2nd edition at The Web Conference 2026, held virtually on June 30, 2026
- Papers 4 to 8 pages in the ACM double-column template, double-blind review on OpenReview
- A fast-track submission window opened after the WWW 2026 main track decisions for papers rejected there
- 2026 papers are included in The Web Conference 2026 Companion Proceedings in the ACM Digital Library
- Not the CORE-ranked TIME (International Symposium on Temporal Representation and Reasoning); not listed in the CORE ICORE2026 portal
