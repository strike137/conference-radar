notes:
- Shared evaluation campaign for NLP in Spanish, Portuguese, Catalan, Basque and Galician, organized since 2019
- Held as a one-day workshop at the annual SEPLN conference in Spain (Zaragoza 2025, Leon 2026)
- Task proposals are due in December; each accepted task sets its own data release and system paper deadlines
- System description papers are published in a CEUR-WS volume (2025 -> vol. 4098); task overviews go into the SEPLN
  journal Procesamiento del Lenguaje Natural
- Not listed in the CORE portal (ICORE2026) or the CCF 2026 list
