notes:
- Main annual venue for machine translation research and evaluation; started as a workshop in 2006, now the
  Conference on Machine Translation (WMT25 was the 10th conference)
- Co-located with EMNLP, which handles registration and visas, so the location follows EMNLP (Suzhou 2025,
  Budapest 2026)
- Best known for its shared tasks (general MT, metrics, quality estimation and others) run in June and July;
  system description papers from shared task participants make up much of the proceedings
- Research papers can also be committed from ACL Rolling Review (ARR commitment deadline about three weeks after
  direct submission)
- Proceedings in the ACL Anthology (113 papers in 2025, 134 in 2024)
- Not listed in ICORE2026
