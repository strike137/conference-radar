id: artsec
name: ArtSec
full_name: Workshop on Artwork Security and Provenance in the Age of AI
type: workshop
tier: minor
areas: [security, ai]
region: north-america
language: english
frequency: annual
organizer: IEEE S&P (co-located workshop, SPW); 2026 organizers from University of Georgia, Dartmouth College and Duke University
organizer_country: [usa]
proceedings: IEEE Xplore (IEEE SPW workshop proceedings)
archival: true
typical:
  deadline_months: [2]
  conference_months: [5]
links:
  website: https://artsec26.ieee-security.org/
notes:
- New workshop in 2026, co-located with the 47th IEEE Symposium on Security and Privacy in San Francisco
- Topics are protection of creative works against AI training and editing, watermarking, provenance and attribution
  of human vs AI generated content, datasets and red-teaming
- Accepted papers appear in the IEEE workshop proceedings (SPW); at least one author must attend in person
- Full papers up to 10 pages and short papers up to 6 pages, excluding references and appendices
- 2026 submission deadline was extended by about two weeks
