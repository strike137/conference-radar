notes:
- Annual conference of DAGM, the German pattern recognition society; called GCPR since 2013 (47th edition in 2025)
- Held in Germany; joint event with VMV (Vision, Modeling and Visualization) in some years, including 2026
- Proceedings in Springer LNCS; double-blind review; best papers invited to an IJCV special issue
- Special tracks on life and natural sciences, photogrammetry and remote sensing, and vision systems and
  applications
- Fast Track for revised papers rejected elsewhere (for example ECCV), non-archival Nectar Track and (from 2026)
  non-archival Extended Abstract Track
- Not listed in ICORE2026
