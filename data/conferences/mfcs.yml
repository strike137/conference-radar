notes:
- One of the oldest theory conferences, first held in 1972; covers all branches of theoretical computer science
- Traditionally moved between the Czech Republic, Poland and Slovakia; since 2013 it travels around Europe
- Proceedings in the open-access LIPIcs series (Schloss Dagstuhl)
- Submissions up to 12 pages in LIPIcs style excluding title page, references and appendix; single-blind review
- About 80 papers presented in person; from 2026 up to 10 more accepted without on-site presentation (pre-recorded video, reduced fee)
- Preceded by a Young Researchers Forum for students and postdocs
- Ranked B in ICORE2026 and C in the CCF list
