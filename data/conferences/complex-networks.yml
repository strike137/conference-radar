id: complex-networks
name: Complex Networks
full_name: International Conference on Complex Networks and their Applications
type: conference
tier: minor
areas: [data, ai]
region: europe
language: english
frequency: annual
organizer: CNA organizing committee (general chairs Hocine Cherifi, Univ. of Burgundy; Luis M. Rocha; Joaquin J. Torres)
organizer_country: [europe]
proceedings: Springer SCI (Studies in Computational Intelligence)
archival: true
fee: 700 EUR per paper (2026, early, until Oct 15; late 800 EUR; banquet included)
typical:
  deadline_months: [9]
  conference_months: [11, 12]
links:
  website: https://complexnetworks.org/
notes:
- Network science venue (graph mining, social networks, epidemics, ML on networks); also known as CNA
- Full papers (up to 12 pages) published by Springer in the Studies in Computational Intelligence series; extended
  abstracts go to a non-archival book of abstracts
- Single-blind review with at least two reviewers; deadline usually extended by about 10 days
- Extended versions invited to special issues of Applied Network Science, PLOS ONE, PLOS Complex Systems, SNAM and
  others
- Mostly held in Europe (Madrid 2021, Palermo 2022, Menton 2023, Istanbul 2024, Granada 2026); Binghamton, USA in
  2025
- Not found in the ICORE2026 or CCF 2026 lists
