notes:
- One-day workshop co-located with ACM CCS on late-stage transformation of software executables for security
  (binary analysis and rewriting, debloating, delayering, formal assurance of transformed code)
- Held 2016 to 2020, then revived as the 6th edition in 2024 (Salt Lake City, with CCS 2024)
- Full papers up to 6 pages including references go to the ACM proceedings (2024 volume doi 10.1145/3689937); talk
  proposals are reviewed but not published
- Sponsored by ACM SIGSAC, the US Office of Naval Research and MITRE; PC chairs from ONR and MITRE in 2024
- Small program (14 talks in 2024); deadlines extended by one week (papers) and six weeks (talks) in 2024
- Not held with CCS 2025 or CCS 2026; not listed on the CORE portal (ICORE2026) or the CCF list
