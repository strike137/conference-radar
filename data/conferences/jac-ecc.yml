notes:
- Annual conference co-organized by E-JUST and Kyushu University, mainly bringing together researchers from Egypt and Japan; earlier editions (2012 to 2016) ran as JEC-ECC
- 2026 edition is held at the E-JUST main campus in New Borg El Arab near Alexandria, Egypt
- The site states the proceedings are indexed by IEEE and Scopus
- Tracks cover robotics, computer hardware and embedded systems, AI, big data, communications, IoT, microwave and antennas, signal processing, circuits, biomedical engineering and cyber security
- 4 page papers in IEEE format (up to 2 extra pages for a fee), strict double-blind review, submission via EasyChair
- 2026 has a satellite workshop on human activity recognition for exercise assessment (HAR-EAS 2026)
- Not listed in CORE ICORE2026
