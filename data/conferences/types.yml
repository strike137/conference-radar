id: types
name: TYPES
full_name: International Conference on Types for Proofs and Programs
type: conference
tier: minor
areas: [general, software]
region: europe
language: english
frequency: annual
organizer: TYPES Steering Committee, with a local host institution each year
organizer_country: [europe]
proceedings: LIPIcs (Schloss Dagstuhl), post-proceedings
archival: true
typical:
  deadline_months: [2, 3]
  conference_months: [5, 6]
links:
  website: https://sites.google.com/view/thetypesconferences
  dblp: https://dblp.org/db/conf/types/index.html
notes:
- Forum for type theory and its applications (proof assistants, dependently typed programming, formalised mathematics, homotopy type theory)
- Talks are selected from 2-page extended abstracts; abstracts go into an informal book of abstracts handed out at the meeting
- Formal post-proceedings in the open-access LIPIcs series, with a separate call open to everyone after the meeting (TYPES 2025 -> LIPIcs vol. 384, up to 20 pages)
- Workshop style meeting; talks may present published work, work under submission or work in progress
- Grew out of EU funded projects (1990 to 2008); independent conference series since 2009, with a steering committee
- Held in Europe (Copenhagen 2024, Glasgow 2025, Gothenburg 2026, Udine 2027, Paris 2028 tentative)
- Not listed in ICORE2026; not on the CCF 2026 list
