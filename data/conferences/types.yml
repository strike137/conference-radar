notes:
- Main European meeting on type theory, proof assistants, dependently typed programming and homotopy type theory
- Grew out of EU-funded TYPES projects (annual workshops 1990 to 2008); an independent conference series since 2009
- Talks are selected from two-page extended abstracts (LIPIcs style); accepted abstracts go into a book of abstracts on the website
- Post-proceedings in LIPIcs with a separate open call for full papers after the conference (up to 20 pages, journal-level review)
- Held in Europe every year (Valencia 2023, Copenhagen 2024, Glasgow 2025, Gothenburg 2026, Udine 2027)
- Five-day meeting; participation open to everyone, not only presenters
- Not listed in ICORE2026 and not on the CCF list
