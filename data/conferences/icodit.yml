notes:
- New venue; the first edition is ICoDiT 2026, run by the School of Computer Science, Bina Nusantara University
  (BINUS), Indonesia
- Accepted papers are submitted to Springer Communications in Computer and Information Science (CCIS), indexed by
  Scopus, subject to the publisher's requirements
- One-day hybrid conference (onsite or virtual) at the BINUS Alam Sutera campus, Tangerang (Greater Jakarta)
- 'Six tracks: intelligent systems and AI, digital transformation and smart technologies, cybersecurity and
  privacy, data analytics, digital inclusion and sustainable computing, interdisciplinary digital research'
- Double-blind review via Microsoft CMT by at least two reviewers; desk rejection above 20% plagiarism similarity
  or 50% AI-generated score (Turnitin)
- Papers of 6 to 15 pages; all accepted papers must be presented
- Not listed in ICORE2026 or the CCF list
