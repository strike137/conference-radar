notes:
- Run by the IEEE Engineering in Medicine and Biology Society (EMBS); topics are wearable and implantable sensors,
  mobile health, signal processing and machine learning for health
- Full papers are 4 pages including references and are published in IEEE Xplore; 1-page technical and clinical
  abstracts are also accepted
- Single-blind review via OpenReview; single-track conference
- In-person presentation required; virtual presentations are not accepted
- Excellent papers are invited to extend their work for the IEEE Open Journal of Engineering in Medicine and Biology
- Held jointly with IEEE BHI as BHI-BSN in 2018, 2019, 2021 and 2022 (Athens 2021, Ioannina 2022)
- Recent editions in Boston 2023, Chicago 2024, Los Angeles 2025 and Porto 2026
- CORE ICORE2026 rank C; not in the CCF 2026 list
