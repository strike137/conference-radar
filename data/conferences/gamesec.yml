notes:
- Dedicated venue for game theory applied to security, running since 2010; 17th edition in 2026; called Conference
  on Decision and Game Theory for Security until 2023
- Proceedings in Springer LNCS; papers up to 20 pages including references in LNCS format, submitted via OpenReview;
  anonymization is optional
- Alternates between the US and Europe (2022 Pittsburgh, 2023 Avignon, 2024 New York, 2025 Athens, 2026 Ann Arbor)
- Accepted submissions are presented as orals (full paper in proceedings) or posters; in-person presenter required
- Not ranked in ICORE2026 and not in the CCF list, but well regarded in its niche
