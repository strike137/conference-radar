notes:
- One-day workshop co-located with the July IETF meeting; sponsored by ACM SIGCOMM and the IRTF
- Bridges research and IETF standardization; good venue to meet IETF and IRTF participants
- Regular papers up to 6 pages plus references, short papers 2 pages; double-blind review
- Papers published open access in the ACM DL (APC may apply unless covered by ACM Open); hybrid, remote participation
  possible
- Location follows the IETF meeting (San Francisco 2023, Vancouver 2024, Madrid 2025, Vienna 2026)
- Not listed in the CORE ICORE2026 rankings
