notes:
- Workshop on agentic AI (LLM agents, embodied AI, multi-agent learning) for wireless communications and networking,
  co-located with IEEE GLOBECOM
- First edition at GLOBECOM 2025 in Taipei (WS-05, half day), second edition at GLOBECOM 2026 in Macau (WS-13)
- Follows GLOBECOM, which rotates worldwide
- 2025 general co-chairs from NTU Singapore, University of Sydney, York University and Khalifa University; Dusit
  Niyato (NTU) co-chairs both editions
- Accepted and presented workshop papers go into the GLOBECOM proceedings and IEEE Xplore; no-show papers are removed
- Workshop papers up to 6 pages (7th page for a 100 USD overlength fee in 2025); submissions via EDAS
- Not listed in ICORE2026
