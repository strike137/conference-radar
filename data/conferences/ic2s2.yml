notes:
- Annual conference of the International Society for Computational Social Science, held since 2015
- Main meeting point of social scientists and computer scientists working on large-scale social data, networks, text analysis and simulation
- Submissions are 2-page extended abstracts with double-blind review; non-archival, so already published work can be presented
- Accepted work is presented as lightning talks, parallel oral talks or posters; a tutorial day precedes the main conference
- Alternates mostly between Europe and North America (Zurich 2021, Chicago 2022, Copenhagen 2023, Philadelphia 2024, Norrköping 2025, Burlington 2026)
- Not listed in ICORE2026 and not on the CCF list
